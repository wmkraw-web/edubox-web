<body>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Pancerny Parser JSON 
        const parseAIResponse = (aiOutput) => {
            if (aiOutput && typeof aiOutput === 'object') {
                if (aiOutput.autoresponder) return aiOutput;
                if (aiOutput.text) aiOutput = aiOutput.text;
                else if (aiOutput.content) aiOutput = aiOutput.content;
                else if (aiOutput.response) aiOutput = aiOutput.response;
            }

            let text = String(aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();

            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    jsonStr = jsonStr.replace(/,\s*([\]}])/g, '$1');
                    try {
                        return JSON.parse(jsonStr);
                    } catch (e1) {
                        jsonStr = jsonStr.replace(/[\n\r\t]+/g, ' ');
                        return JSON.parse(jsonStr);
                    }
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                console.error("Błąd parsowania:", text, e);
                const preview = text.length > 100 ? text.substring(0, 100) + "..." : text;
                if (preview.length === 0) throw new Error("Serwer zwrócił pustą odpowiedź!");
                throw new Error("BŁĄD Z SERWERA: " + preview);
            }
        };

        // Fetcher OpenAI 
        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON.
Nie używaj znaczników markdown (bez \`\`\`json). Używaj wyłącznie apostrofów ('), unikaj cudzysłowów (") wewnątrz tekstów.

${systemInstruction}

ZADANIE DO WYKONANIA:
${prompt}`;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: finalPrompt,
                        system: systemInstruction,
                        format: "json" 
                    })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.message || data.content || data;
                } else {
                    const errData = await res.text();
                    throw new Error(`Błąd Vercel HTTP ${res.status}: ${errData}`);
                }
            } catch(e) { 
                console.error("Vercel API (/api/chat) zawiodło:", e);
                throw new Error("Brak połączenia z serwerem API. Szczegóły: " + e.message);
            }
        };

        // --- GŁÓWNA APLIKACJA ---
        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [resultData, setResultData] = useState(null);

            // Form States
            const [subject, setSubject] = useState('Edukacja wczesnoszkolna');
            const [years, setYears] = useState('5 lat');
            const [stress, setStress] = useState('Poziom 10/10 (Tryb Zombie)');
            const [hobbies, setHobbies] = useState('Kawa, Netflix, Spanie');

            // Market State
            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            useEffect(() => {
                // Bezpieczne wczytanie bazy z modułu (dopasowane do global-core.js)
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else {
                        setTimeout(initDb, 100);
                    }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_edudetox_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    const sharedPro = window.localStorage.getItem('eduboxProStatus') === 'active' || window.localStorage.getItem('eduAwansPremium') === 'active';
                    if (savedPremium === 'unlocked' || sharedPro) setIsPremium(true);
                } catch (e) {
                    console.warn("Brak dostępu do localStorage.");
                }
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3000);
            };

            const handlePremiumCheck = async () => {
                const __res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: premiumCode })
                });
                const __data = await __res.json();
                if (__data.valid) {
                    setIsPremium(true);
                    try { window.localStorage.setItem('edubox_premium', 'unlocked'); } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { 
                    showMessage('Nieprawidłowy kod', 'error'); 
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    showMessage('Skopiowano do schowka!', 'success');
                });
            };

            const generateContent = async () => {
                if (!isPremium && aiGenerations >= 3) {
                    showMessage('Limit darmowych generacji wyczerpany. Wpisz kod odblokowujący.', 'error');
                    return;
                }
                
                setIsGenerating(true);
                setResultData(null);

                const sysPrompt = `Jesteś wybitnym, sarkastycznym, ale pełnym ciepła ekspertem od work-life balance dla skrajnie wyczerpanych nauczycieli. Twoim celem jest przygotowanie "Recepty na Detoks" po ciężkim roku szkolnym.
Bądź BARDZO kreatywny, rozpisz się, używaj bogatego słownictwa, trafnych szkolnych nawiązań i solidnej dawki inteligentnego humoru. Odpowiedzi mają być obszerne i szczegółowe.

WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON (nie zmieniaj kluczy!):
{
  "autoresponder": {
    "subject": "Zabawny i chwytliwy temat maila (np. 'Abonent czasowo niedostępny - wyjechał ratować resztki psychiki')",
    "body": "BARDZO OBSZERNA (minimum 4-5 rozbudowanych zdań), pełna humoru i lekkiego sarkazmu treść autorespondera na maile i Librusa. Poinformuj rodziców, że ładujesz baterie i kategorycznie nie odpisujesz na wiadomości. Używaj barwnych porównań."
  },
  "recommendations": [
    { "type": "Książka", "title": "Tytuł (nie o szkole!)", "reason": "Długie, zabawne uzasadnienie (minimum 2 zdania) dlaczego ta pozycja uratuje psychikę." },
    { "type": "Film/Serial", "title": "Tytuł", "reason": "Obszerne, anegdotyczne uzasadnienie filmowe." },
    { "type": "Aktywność", "title": "Nazwa aktywności", "reason": "Rozbudowane, absurdalnie śmieszne uzasadnienie dlaczego akurat to ukoi skołatane nerwy." }
  ],
  "quote": "Błyskotliwy, satyryczny, ale dodający otuchy cytat-certyfikat za przetrwanie edukacyjnego poligonu (minimum 2-3 linijki, idealny na Facebooka)."
}`;

                const prompt = `Moje dane:\nPrzedmiot: ${subject}\nStaż pracy: ${years}\nPoziom stresu po czerwcu: ${stress}\nUlubione rzeczy (aby dopasować odtrutkę): ${hobbies}. \nBłagam, rozpisz się i ratuj moje nerwy!`;

                try {
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setResultData({ data: parsedJson, params: { subject, years, stress, hobbies } });
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_edudetox_ai', newCount.toString()); } catch(e) {}
                    }
                    showMessage('Wygenerowano plan ratunkowy!', 'success');
                } catch (error) {
                    showMessage(error.message, 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Błąd autoryzacji bazy. Zaloguj się lub odśwież stronę.', 'error'); return; }
                setIsPublishing(true);
                try {
                    // Integracja z plikiem global-core.js: (collectionName, appType, itemName, config)
                    await window.EduBoxCore.saveToGielda('edudetox_market', 'edudetox', subject, resultData);
                    showMessage('Opublikowano na Giełdzie Humorów!', 'success');
                    setAppMode('gielda');
                } catch (error) {
                    showMessage(error.message || 'Błąd publikacji na giełdzie.', 'error');
                } finally {
                    setIsPublishing(false);
                }
            };

            // Nasłuch na giełdę (integracja z plikiem global-core.js)
            useEffect(() => {
                let unsubscribe = null;
                if (appMode === 'gielda') {
                    setIsFetchingMarket(true);
                    const checkAndSub = () => {
                        if(window.EduBoxCore) {
                            unsubscribe = window.EduBoxCore.subscribeToGielda('edudetox_market', (items) => {
                                setMarketItems(items);
                                setIsFetchingMarket(false);
                            }, (err) => {
                                showMessage('Błąd ładowania giełdy.', 'error');
                                setIsFetchingMarket(false);
                            });
                        } else {
                            setTimeout(checkAndSub, 100);
                        }
                    };
                    checkAndSub();
                }
                return () => { if (unsubscribe) unsubscribe(); }
            }, [appMode]);

            // --- KOMPONENT RENDERUJĄCY WYNIKI ---
            const renderResult = () => {
                if (!resultData || !resultData.data) return (
                    <div className="h-full flex flex-col items-center justify-center text-teal-500/50 no-print">
                        <i className="ph-fill ph-plant text-6xl mb-4 animate-pulse"></i>
                        <p className="font-bold text-center">Wpisz swoje dane ratunkowe po lewej stronie<br/>i kliknij "Rozpocznij Detoks".</p>
                    </div>
                );

                const { autoresponder, recommendations, quote } = resultData.data;
                const { subject, years } = resultData.params;

                return (
                    <div className="space-y-8 animate-[reveal_0.4s_ease-out]">
                        
                        {/* Karta 1: Autoresponder */}
                        {autoresponder && (
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden print-card shadow-xl shadow-teal-900/10 relative group">
                                <div className="bg-slate-800/80 p-3 border-b border-slate-700 flex items-center gap-2">
                                    <div className="flex gap-1.5 mr-4">
                                        <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                        <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                        <div className="w-3 h-3 rounded-full bg-green-500"></div>
                                    </div>
                                    <div className="text-xs text-slate-400 font-medium">Nowa wiadomość (Autoresponder)</div>
                                </div>
                                <div className="p-6 md:p-8 relative">
                                    <button onClick={() => copyToClipboard(`Temat: ${autoresponder.subject}\n\n${autoresponder.body}`)} className="absolute top-4 right-4 bg-teal-500/20 text-teal-400 hover:bg-teal-500 hover:text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 no-print opacity-0 group-hover:opacity-100">
                                        <i className="ph-bold ph-copy"></i> Kopiuj
                                    </button>
                                    <div className="border-b border-slate-800 pb-4 mb-4">
                                        <p className="text-sm text-slate-400 mb-1">Do: <span className="text-slate-200">Wszyscy zmartwieni rodzice</span></p>
                                        <p className="text-sm text-slate-400">Temat: <span className="text-teal-400 font-bold">{autoresponder.subject}</span></p>
                                    </div>
                                    <div className="text-slate-300 print-text leading-relaxed whitespace-pre-wrap font-medium">
                                        {autoresponder.body}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* Karta 2: Recepta */}
                            {recommendations && (
                                <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-3xl p-6 print-card relative">
                                    <div className="absolute top-4 right-4 text-4xl opacity-10">💊</div>
                                    <h3 className="text-xl font-black text-white print-text mb-6 flex items-center gap-2">
                                        <i className="ph-fill ph-prescription text-teal-400"></i> Recepta na Zapomnienie
                                    </h3>
                                    <div className="space-y-4">
                                        {Array.isArray(recommendations) && recommendations.map((rec, i) => (
                                            <div key={i} className="bg-slate-950/50 print:bg-slate-100 p-4 rounded-2xl border border-slate-800 print:border-slate-300">
                                                <div className="text-[10px] font-black text-teal-500 uppercase tracking-widest mb-1">{rec.type}</div>
                                                <p className="font-bold text-white print-text text-sm mb-2">{rec.title}</p>
                                                <p className="text-xs text-slate-400 print-text leading-relaxed">{rec.reason}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Karta 3: Certyfikat Przetrwania */}
                            {quote && (
                                <div className="bg-slate-900 border-2 border-dashed border-purple-500/30 rounded-3xl p-8 print-card text-center flex flex-col justify-center relative overflow-hidden group">
                                    <div className="absolute -inset-10 bg-gradient-to-br from-purple-500/5 to-transparent blur-2xl -z-10"></div>
                                    <i className="ph-fill ph-medal text-5xl text-purple-400 mb-4 mx-auto"></i>
                                    <p className="text-xs text-purple-400 font-bold uppercase tracking-widest mb-4">Certyfikat Przetrwania</p>
                                    <p className="text-2xl font-hand text-white print-text leading-tight mb-6 px-4">"{quote}"</p>
                                    <div className="text-[10px] text-slate-500 uppercase font-black">Weteran: {subject} • Staż: {years}</div>
                                    
                                    <button onClick={() => copyToClipboard(quote)} className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-purple-500/20 text-purple-400 hover:bg-purple-500 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-colors flex items-center gap-1 no-print opacity-0 group-hover:opacity-100">
                                        <i className="ph-bold ph-copy"></i> Skopiuj
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Duży Przycisk Giełdy na dole ekranu */}
                        <div className="mt-10 bg-slate-900 border border-purple-500/30 rounded-3xl p-8 text-center relative overflow-hidden group no-print shadow-xl">
                            <div className="absolute inset-0 bg-gradient-to-r from-purple-600/10 to-teal-500/10 z-0"></div>
                            <div className="relative z-10">
                                <h3 className="text-xl font-bold text-white mb-2">Zachowaj ten detoks dla potomnych!</h3>
                                <p className="text-slate-400 text-sm mb-6 max-w-lg mx-auto">Podziel się swoją receptą na Giełdzie Śmiechu, by wesprzeć innych nauczycieli w walce z systemem i przebodźcowaniem Librusowym.</p>
                                <button 
                                    onClick={publishToMarket} 
                                    disabled={isPublishing}
                                    className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-10 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.4)] hover:shadow-[0_0_30px_rgba(147,51,234,0.6)] transition-all flex items-center justify-center gap-3 mx-auto disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-2xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-2xl"></i>} 
                                    Dodaj do Chmury (Giełda)
                                </button>
                            </div>
                        </div>

                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 overflow-hidden relative selection:bg-teal-500/30">
                    
                    {/* Auras rendering in background */}
                    <div className="aura-container no-print">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        <div className="aura-blob aura-3"></div>
                    </div>

                    {/* Global Notifications */}
                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i>
                            {message.text}
                        </div>
                    )}

                    {/* Left Sidebar */}
                    <aside className="w-80 flex-shrink-0 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-full z-10 no-print transition-all duration-300">
                        {/* Header */}
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-teal-400 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg shadow-teal-500/20">
                                <i className="ph-bold ph-plant text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight text-white leading-none uppercase">EduDetox</h1>
                                <p className="text-[10px] text-teal-400 font-bold tracking-wider uppercase mt-1">Wakacyjny Reset</p>
                            </div>
                        </div>

                        {/* Navigation */}
                        <div className="px-4 py-3 flex gap-2 border-b border-slate-800">
                            <button 
                                onClick={() => setAppMode('kreator')} 
                                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-teal-500 text-slate-900 shadow-lg shadow-teal-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}
                            >
                                <i className="ph-bold ph-first-aid-kit"></i> Klinika
                            </button>
                            <button 
                                onClick={() => setAppMode('gielda')} 
                                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}
                            >
                                <i className="ph-bold ph-smiley-wink"></i> Giełda Śmiechu
                            </button>
                        </div>

                        {/* Sidebar Content Scrollable */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            
                            {/* KREATOR MODE */}
                            {appMode === 'kreator' && (
                                <>
                                    <div className="text-center px-2 py-4 border border-dashed border-teal-500/30 rounded-2xl bg-teal-500/5">
                                        <h3 className="text-sm font-bold text-teal-400 mb-1">Czas na Detoks! 💆‍♀️</h3>
                                        <p className="text-[10px] text-slate-400">Podaj swoje dane, a AI wygeneruje Ci zabawną odpowiedź zwrotną (Librus/Email) i plan odtrucia od szkoły.</p>
                                    </div>

                                    {/* Dynamic Forms */}
                                    <div className="space-y-4 bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2 mb-2 flex items-center gap-2">
                                            <i className="ph-bold ph-clipboard-text"></i> Wywiad środowiskowy
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Czego uczyłeś/aś?</label>
                                            <input type="text" value={subject} onChange={e => setSubject(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-teal-500 transition-colors" placeholder="np. Matematyka i Fizyka" />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Staż przetrwania (lata pracy)</label>
                                            <input type="text" value={years} onChange={e => setYears(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-teal-500 transition-colors" placeholder="np. 5 lat" />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Obecny poziom stresu</label>
                                            <select value={stress} onChange={e => setStress(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-teal-500">
                                                <option>Lekkie zmęczenie</option>
                                                <option>Drganie powieki na słowo "Librus"</option>
                                                <option>Poziom 10/10 (Tryb Zombie)</option>
                                                <option>Chcę rzucić to i wyjechać w Bieszczady</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Ulubione odskocznie (hobby)</label>
                                            <input type="text" value={hobbies} onChange={e => setHobbies(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-teal-500 transition-colors" placeholder="np. Kawa, spanie do 11, Netflix" />
                                        </div>
                                    </div>

                                    {/* Akcje */}
                                    <div className="space-y-3 pt-2">
                                        <button 
                                            onClick={generateContent} disabled={isGenerating}
                                            className="w-full bg-gradient-to-r from-teal-400 to-emerald-500 hover:from-teal-300 hover:to-emerald-400 text-slate-900 font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(45,212,191,0.3)] transition-all flex items-center justify-center gap-2"
                                        >
                                            {isGenerating ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-magic-wand text-xl"></i>} 
                                            Rozpocznij Detoks
                                        </button>
                                        
                                        {resultData && (
                                            <div className="grid grid-cols-1 gap-2">
                                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2 text-xs">
                                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj do PDF
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}

                            {/* GIEŁDA MODE */}
                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    <div className="bg-purple-500/10 border border-purple-500/20 rounded-xl p-4 text-center">
                                        <i className="ph-fill ph-confetti text-3xl text-purple-400 mb-2"></i>
                                        <h3 className="text-sm font-bold text-white mb-1">Giełda Śmiechu</h3>
                                        <p className="text-[10px] text-slate-400">Poczytaj zabawne autorespondery i cytaty innych zmęczonych nauczycieli!</p>
                                    </div>

                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-500"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak wpisów. Wrzuć swój plan detoksu!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-slate-800 rounded-xl p-4 border border-slate-700 hover:border-purple-500 transition-colors group cursor-pointer" onClick={() => { setResultData(item.config); setAppMode('kreator'); showMessage('Wczytano plan!', 'success'); }}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs font-black text-white flex items-center gap-1"><i className="ph-fill ph-user-circle text-purple-400"></i> {item.config?.params?.subject || item.name}</span>
                                                        <span className="text-[9px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full">{item.config?.params?.years || 'Brak danych'}</span>
                                                    </div>
                                                    <p className="text-[10px] text-slate-300 font-bold italic line-clamp-3 mb-2">"{item.config?.data?.quote}"</p>
                                                    <div className="text-[9px] text-teal-400 flex items-center gap-1">
                                                        <i className="ph-bold ph-envelope"></i> Zobacz autoresponder
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* Premium Footer */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-teal-500 bg-teal-500/10 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)}
                                            placeholder="Kod Premium" 
                                            className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-teal-500 uppercase"
                                        />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-teal-500/10 to-emerald-500/10 border border-teal-500/30 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-teal-400"></i>
                                    <div>
                                        <p className="text-xs font-bold text-white">Wersja PRO MAX</p>
                                        <p className="text-[9px] text-teal-300">Wszystkie limity odblokowane</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </aside>

                    {/* Main Workspace */}
                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 print-container relative">
                            <div className="max-w-4xl mx-auto pb-32">
                                {renderResult()}
                            </div>
                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
