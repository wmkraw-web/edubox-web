<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDetox AI - EduBox PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="global-core.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const EduDetoxApp = () => {
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [resultData, setResultData] = useState(null);
            const [error, setError] = useState(null);
            const [marketStatus, setMarketStatus] = useState({ message: '', type: '' });

            const handleGenerate = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                setLoading(true);
                setError(null);
                setResultData(null);
                setMarketStatus({ message: '', type: '' });

                try {
                    const systemPrompt = `Jesteś asystentem wspierającym nauczycieli. Zwróć obiekt JSON z polami: 'email' (profesjonalna, spokojna odpowiedź na opisany problem/mail), 'prescription' (krótka, żartobliwa "recepta" na odstresowanie dla nauczyciela) oraz 'quote' (motywacyjny, krótki cytat na "Certyfikat Przetrwania" potwierdzający, że nauczyciel poradził sobie z trudną sytuacją).`;

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: `Trudna sytuacja nauczyciela: ${input}`,
                            system: systemPrompt,
                            format: "json"
                        })
                    });

                    if (!response.ok) throw new Error('Błąd połączenia z serwerem API Vercel.');

                    const data = await response.json();
                    
                    // Normalizacja formatu odpowiedzi: wyłuskanie JSON-a niezależnie od tego, jak został owinięty przez backend
                    let parsedContent = data;
                    if (typeof data.content === 'string') {
                        parsedContent = JSON.parse(data.content);
                    } else if (typeof data === 'string') {
                        parsedContent = JSON.parse(data);
                    }

                    // Zabezpieczenie przed obiektem zagnieżdżonym w "data"
                    const finalResult = parsedContent.data ? parsedContent.data : parsedContent;
                    
                    setResultData(finalResult);
                } catch (err) {
                    console.error("Błąd podczas generowania:", err);
                    setError('Nie udało się wygenerować rozwiązania. Sprawdź połączenie lub spróbuj ponownie.');
                } finally {
                    setLoading(false);
                }
            };

            const handlePublish = async () => {
                if (!resultData) return;
                
                // Upewniamy się, że obiekt window.EduBoxCore z global-core.js istnieje
                if (!window.EduBoxCore || typeof window.EduBoxCore.publishToMarket !== 'function') {
                    setMarketStatus({ message: 'Błąd: Moduł EduBoxCore nie został załadowany. Sprawdź plik global-core.js.', type: 'error' });
                    return;
                }

                try {
                    setMarketStatus({ message: 'Zapisywanie w chmurze...', type: 'info' });
                    await window.EduBoxCore.publishToMarket({
                        type: 'edudetox',
                        content: resultData,
                        timestamp: new Date().toISOString()
                    });
                    setMarketStatus({ message: 'Zapisano na Giełdzie pomyślnie!', type: 'success' });
                } catch (err) {
                    console.error('Błąd publikacji:', err);
                    setMarketStatus({ message: 'Wystąpił błąd podczas komunikacji z Firebase.', type: 'error' });
                }
            };

            const copyToClipboard = (text) => {
                if (text) {
                    navigator.clipboard.writeText(text);
                    alert('Cytat skopiowany do schowka!');
                }
            };

            // Bezpieczne wyciąganie cytatu (naprawa błędu 3)
            const getQuote = () => {
                if (!resultData) return '';
                return resultData.quote || resultData?.data?.quote || 'Przetrwałeś! To był trudny dzień, ale jesteś świetnym nauczycielem.';
            };

            return (
                <div className="max-w-4xl mx-auto p-6 pt-10">
                    <a href="index.html" className="inline-flex items-center text-gray-500 hover:text-blue-600 transition font-medium mb-8">
                        <i className="ph ph-arrow-left mr-2 text-xl"></i> Wróć do Panelu Głównego
                    </a>

                    <div className="bg-white rounded-3xl shadow-sm border border-gray-200 p-8 mb-10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-green-50 rounded-bl-full -z-0"></div>
                        <h1 className="text-4xl font-extrabold text-gray-900 mb-3 flex items-center relative z-10">
                            <i className="ph-fill ph-shield-check text-green-500 mr-4"></i>
                            EduDetox AI
                        </h1>
                        <p className="text-gray-600 text-lg mb-8 relative z-10">Zresetuj emocje. Opisz trudną sytuację (np. roszczeniowy mail od rodzica), a asystent przygotuje spokojną, profesjonalną odpowiedź, receptę na relaks i Twój certyfikat przetrwania.</p>

                        <form onSubmit={handleGenerate} className="space-y-5 relative z-10">
                            <textarea
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Wklej treść wiadomości, na którą musisz odpisać, lub po prostu opisz sytuację z dzisiejszego dnia..."
                                className="w-full h-40 p-5 bg-gray-50 border border-gray-300 rounded-2xl focus:ring-4 focus:ring-green-500/20 focus:border-green-500 outline-none resize-none transition-all text-gray-800"
                                disabled={loading}
                            />
                            <button
                                type="submit"
                                disabled={loading || !input.trim()}
                                className="w-full bg-green-600 text-white font-bold py-4 px-6 rounded-2xl hover:bg-green-700 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed flex justify-center items-center text-lg shadow-md hover:shadow-lg"
                            >
                                {loading ? (
                                    <><i className="ph ph-spinner animate-spin text-2xl mr-3"></i> Analiza sytuacji i generowanie...</>
                                ) : (
                                    <><i className="ph-fill ph-magic-wand text-2xl mr-3"></i> Wygeneruj Zestaw Ratunkowy</>
                                )}
                            </button>
                        </form>
                        {error && (
                            <div className="mt-6 p-4 bg-red-50 text-red-700 rounded-xl flex items-center">
                                <i className="ph-fill ph-warning-circle text-2xl mr-3"></i> {error}
                            </div>
                        )}
                    </div>

                    {resultData && (
                        <div className="space-y-8 animate-fade-in pb-20">
                            
                            {/* Sekcja: Mail */}
                            <div className="bg-white rounded-3xl shadow-sm border border-gray-200 p-8">
                                <h2 className="text-2xl font-bold mb-5 flex items-center text-gray-900">
                                    <span className="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mr-3">
                                        <i className="ph-fill ph-envelope-open text-2xl"></i>
                                    </span>
                                    Proponowana Odpowiedź
                                </h2>
                                <div className="bg-gray-50 p-6 rounded-2xl text-gray-800 whitespace-pre-wrap leading-relaxed border border-gray-100">
                                    {resultData.email}
                                </div>
                            </div>

                            {/* Sekcja: Recepta */}
                            <div className="bg-white rounded-3xl shadow-sm border border-gray-200 p-8">
                                <h2 className="text-2xl font-bold mb-5 flex items-center text-gray-900">
                                    <span className="w-10 h-10 bg-pink-100 text-pink-500 rounded-lg flex items-center justify-center mr-3">
                                        <i className="ph-fill ph-pill text-2xl"></i>
                                    </span>
                                    Recepta na Odstresowanie
                                </h2>
                                <div className="bg-pink-50 border border-pink-100 p-6 rounded-2xl text-pink-900 font-medium italic text-lg leading-relaxed shadow-inner">
                                    {resultData.prescription}
                                </div>
                            </div>

                            {/* Sekcja: Certyfikat (NAPRAWIONY BŁĄD 3) */}
                            <div className="bg-gradient-to-br from-yellow-100 via-amber-50 to-yellow-100 rounded-3xl shadow-md border border-yellow-300 p-10 text-center relative overflow-hidden group">
                                <div className="absolute -top-10 -right-10 opacity-10 transform rotate-12 group-hover:rotate-0 transition-transform duration-700">
                                    <i className="ph-fill ph-medal text-[15rem] text-yellow-600"></i>
                                </div>
                                
                                <div className="relative z-10">
                                    <div className="inline-flex items-center justify-center w-20 h-20 bg-yellow-200 rounded-full mb-4 shadow-inner">
                                        <i className="ph-fill ph-certificate text-5xl text-yellow-700"></i>
                                    </div>
                                    <h2 className="text-3xl font-black text-yellow-800 mb-3 uppercase tracking-widest">
                                        Certyfikat Przetrwania
                                    </h2>
                                    <div className="w-24 h-1 bg-yellow-400 mx-auto mb-8 rounded-full"></div>
                                    
                                    <p className="text-2xl text-yellow-900 font-serif italic mb-10 px-4 md:px-12 leading-relaxed">
                                        "{getQuote()}"
                                    </p>
                                    
                                    <button
                                        onClick={() => copyToClipboard(getQuote())}
                                        className="bg-yellow-600 text-white py-3 px-8 rounded-xl font-bold hover:bg-yellow-700 transition shadow-md inline-flex items-center"
                                    >
                                        <i className="ph-bold ph-copy mr-2 text-xl"></i> Kopiuj do schowka
                                    </button>
                                </div>
                            </div>

                            {/* Akcja: Udostępnij na Giełdzie (NAPRAWIONY BŁĄD 2) */}
                            <div className="flex flex-col items-center mt-12 bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                                <h3 className="text-xl font-bold mb-2 text-gray-800">Zachowaj dla innych</h3>
                                <p className="text-gray-500 mb-6 text-center max-w-lg">Podziel się wygenerowanym rozwiązaniem na Giełdzie, aby wesprzeć innych nauczycieli mierzących się z podobnymi wyzwaniami.</p>
                                <button
                                    onClick={handlePublish}
                                    className="bg-blue-600 text-white font-bold py-4 px-10 rounded-2xl hover:bg-blue-700 transition shadow-lg flex items-center text-lg hover:-translate-y-1 transform duration-200"
                                >
                                    <i className="ph-bold ph-cloud-arrow-up text-2xl mr-3"></i>
                                    Udostępnij na Giełdzie
                                </button>
                                
                                {marketStatus.message && (
                                    <div className={`mt-5 px-6 py-3 rounded-xl font-medium flex items-center ${
                                        marketStatus.type === 'error' ? 'bg-red-50 text-red-700' : 
                                        marketStatus.type === 'success' ? 'bg-green-50 text-green-700' : 
                                        'bg-blue-50 text-blue-700'
                                    }`}>
                                        <i className={`ph-fill mr-2 text-xl ${
                                            marketStatus.type === 'error' ? 'ph-warning-circle' : 
                                            marketStatus.type === 'success' ? 'ph-check-circle' : 
                                            'ph-info'
                                        }`}></i>
                                        {marketStatus.message}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduDetoxApp />);
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body>
</html>
