<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSOS PRO - EduBox AI</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { slate: { 950: '#020617' } }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
        }

        /* Magiczne Aury w tle - Kojące kolory V3 */
        .aura-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #ec4899, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #8b5cf6, transparent 70%); animation-delay: -5s; }
        .aura-3 { bottom: -10%; left: 20%; width: 55vw; height: 600px; background: radial-gradient(circle, #3b82f6, transparent 70%); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.05); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(236, 72, 153, 0.5); border-radius: 4px; }

        .text-gradient { background: linear-gradient(135deg, #f472b6 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Print Rules - V3 Standard */
        @media print {
            body { background: white !important; color: black !important; background-image: none !important; }
            .aura-blob { display: none !important; }
            .print-hidden { display: none !important; }
            .print-only { display: block !important; }
            .glass-panel { background: white !important; border: 1px solid #e2e8f0 !important; box-shadow: none !important; color: black !important; filter: none !important; backdrop-filter: none !important; }
            .text-gradient { background: none !important; -webkit-text-fill-color: black !important; color: black !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body class="custom-scrollbar">
    
    <!-- Kontener na globalne menu -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>
    
    <div id="root"></div>

    <!-- MOCK EduBoxCore -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        let FIREBASE_CONFIG;
        try { FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", authDomain: "mock", projectId: "mock", appId: "1:123" }; } catch(e) { FIREBASE_CONFIG = {}; }
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "eduboxpro";
        
        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: async (onUserLoad) => {
                if (!isInitialized) {
                    try {
                        app = initializeApp(FIREBASE_CONFIG);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                        isInitialized = true;
                        window.EduBoxCore.loadMenu();
                    } catch(e) { console.warn("Firebase init error", e); }
                }
                if (auth) onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                else if(onUserLoad) onUserLoad({ uid: 'mock-user-123' });
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) container.innerHTML = `<div class="bg-pink-600 text-white text-xs text-center py-1 font-bold print-hidden">EduBox V3 PRO MAX - System Core Loaded</div>`;
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na pasku bocznym!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser && !db) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, { userId: currentUser?.uid || 'anonymous', createdAt: serverTimestamp(), type: appType, name: itemName, config: config });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PROMPTS = {
            zachowanie: `Jesteś wybitnym pedagogiem specjalnym, terapeutą integracji sensorycznej (SI) oraz analitykiem zachowania (ABA) w placówce edukacyjnej.
Zadanie: Przeanalizuj opisane zachowanie dziecka i podaj natychmiastowe rozwiązanie.
Twoja odpowiedź musi być podzielona na 3 wyraźne sekcje:
1. 🧠 POTENCJALNA PRZYCZYNA: Dlaczego dziecko tak robi? (funkcja zachowania: ucieczka, stymulacja, potrzeba uwagi, namacalne wzmocnienie, czy przebodźcowanie).
2. 🚨 SZYBKA REAKCJA: 3 punkty, co zrobić tu i teraz, w momencie napadu (jak uspokoić, jak zadbać o bezpieczeństwo).
3. 🛠️ DZIAŁANIE DŁUGOTERMINOWE: Jak pracować z dzieckiem nad tym problemem w kolejne dni.
Pisz krótko, empatycznie i językiem bardzo praktycznym. Omiń suchą teorię, daj same narzędzia.`,

            rodzic: `Jesteś empatycznym psychologiem i mediatorem edukacyjnym. 
Zadanie: Nauczyciel ma problem we współpracy z rodzicem (rodzic wypiera problem, jest roszczeniowy, lub bezradny).
Podziel poradę na 3 sekcje:
1. 💡 PERSPEKTYWA RODZICA: Wyjaśnij krótko nauczycielowi, z czego może wynikać postawa rodzica (żal, stres, mechanizmy obronne).
2. 🗣️ GOTOWE ZDANIA: Podaj 3 gotowe sformułowania (konkretne zdania w cudzysłowach), których nauczyciel może użyć w rozmowie, by nie atakować rodzica, a wejść z nim w sojusz (język NVC).
3. 🚧 STRATEGIA ROZMOWY: Jak ustalić granice i zaplanować współpracę.`
        };

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [activeMode, setActiveMode] = useState('zachowanie'); // 'zachowanie' | 'rodzic'
            const [inputText, setInputText] = useState('');
            const [useWebSearch, setUseWebSearch] = useState(true);
            const [adviceData, setAdviceData] = useState(null); // { text: string, sources: array }
            const [isGenerating, setIsGenerating] = useState(false);

            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'sos_advices',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS ===
            const fetchEduBoxSOS = async (promptText, systemInstruction, enableSearch) => {
                const finalPrompt = `Sytuacja/Problem do rozwiązania:\n"""\n${promptText}\n"""`;
                const payload = {
                    contents: [{ parts: [{ text: finalPrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: { temperature: 0.5 }
                };

                if (enableSearch) {
                    payload.tools = [{ google_search: {} }];
                }

                // Domyślnie używamy Twojego endpointu do Gemini na Vercel (zgodnie z oryginałem), 
                // lub fallback do standardowego gpt-4o-mini z Canvas, jeśli to zawiedzie.
                try {
                    const res = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payload, type: 'text' })
                    });
                    
                    if (!res.ok) throw new Error(`API Error: ${res.status}`);
                    const data = await res.json();
                    
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    const attributions = data.candidates?.[0]?.groundingMetadata?.groundingAttributions || [];
                    
                    const extractedSources = [];
                    const seenUris = new Set();
                    attributions.forEach(attr => {
                        const web = attr.web;
                        if (web && web.uri && !seenUris.has(web.uri)) {
                            seenUris.add(web.uri);
                            extractedSources.push({ title: web.title || web.uri, uri: web.uri });
                        }
                    });
                    
                    return { text, sources: extractedSources };
                } catch (e) {
                    console.warn("Przełączam na zapasowy model GPT (bez linków) z powodu błędu Gemini API:", e);
                    // Fallback to GPT endpoint if Gemini fails
                    const fallbackRes = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, temperature: 0.5, model: "gpt-4o-mini" })
                    });
                    if (!fallbackRes.ok) throw new Error("Oba modele AI niedostępne.");
                    const fallbackData = await fallbackRes.json();
                    return { text: fallbackData.text || fallbackData.message, sources: [] };
                }
            };

            // === LOGIC ===
            const generateAdvice = () => {
                if (!inputText.trim()) { showToast('Opisz krótko sytuację, zanim poprosisz o poradę.', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setAdviceData(null);
                        
                        try {
                            const result = await fetchEduBoxSOS(inputText, PROMPTS[activeMode], useWebSearch);
                            setAdviceData(result);
                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd połączenia z siecią. Spróbuj ponownie.', 'error');
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!adviceData) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { 
                        mode: activeMode, 
                        problem: inputText, 
                        advice: adviceData.text,
                        sources: adviceData.sources 
                    };
                    // Tworzymy krótki, reprezentatywny tytuł z tekstu wejściowego
                    const shortTitle = inputText.substring(0, 40) + (inputText.length > 40 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('sos_advices', 'EduSOS', shortTitle, configToSave);
                    showToast("Opublikowano na Giełdzie Porad! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setActiveMode(item.config.mode || 'zachowanie');
                setInputText(item.config.problem || '');
                setAdviceData({ text: item.config.advice, sources: item.config.sources || [] });
                setAppMode('generator');
                showToast("Wczytano poradę z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-pink-500 to-violet-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i className="ph-bold ph-lifebuoy text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-pink-400">SOS</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-pink-600/20 text-pink-400 border border-pink-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-stethoscope text-lg"></i> Interwencja AI
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-purple-600/20 text-purple-400 border border-purple-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-books text-lg"></i> Giełda Przypadków
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Pomocy dziś:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-pink-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-pink-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-pink-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Przypadków</h2>
                            <p className="text-slate-400 mb-8">Czytaj rozwiązania trudnych sytuacji opublikowane przez innych nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-pink-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className={`p-3 rounded-xl group-hover:scale-110 transition-transform ${item.config.mode === 'zachowanie' ? 'bg-fuchsia-500/10 text-fuchsia-400' : 'bg-blue-500/10 text-blue-400'}`}>
                                                {item.config.mode === 'zachowanie' ? <i className="ph-fill ph-brain text-2xl"></i> : <i className="ph-fill ph-users text-2xl"></i>}
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">"{item.name}"</h3>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-pink-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Analizuj ten przypadek
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak zgłoszonych przypadków w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-4xl mx-auto print-hidden">
                            
                            {/* Nagłówek */}
                            <div className="text-center mb-10">
                                <div className="inline-flex items-center gap-2 bg-pink-900/30 border border-pink-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-pink-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                    Wsparcie dla Nauczycieli
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Zawsze wiesz, <span className="text-gradient">co zrobić.</span>
                                </h1>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto font-medium">
                                    Trudne zachowanie ucznia? Roszczeniowy rodzic? Opisz sytuację, a AI podpowie profesjonalne metody i znajdzie wsparcie w sieci.
                                </p>
                            </div>

                            {/* Tryby Pracy */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                <button onClick={() => setActiveMode('zachowanie')} className={`p-6 rounded-3xl border-2 transition-all duration-300 text-left flex flex-col gap-3 ${activeMode === 'zachowanie' ? 'bg-fuchsia-900/30 border-fuchsia-500 shadow-[0_0_30px_rgba(217,70,239,0.2)]' : 'glass-panel border-slate-700/50 hover:border-slate-500'}`}>
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${activeMode === 'zachowanie' ? 'bg-fuchsia-500 text-white shadow-lg shadow-fuchsia-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                        <i className="ph-bold ph-brain text-2xl"></i>
                                    </div>
                                    <div>
                                        <h3 className={`font-bold text-lg ${activeMode === 'zachowanie' ? 'text-white' : 'text-slate-300'}`}>Zachowanie Dziecka</h3>
                                        <p className="text-xs text-slate-400 mt-1">Przyczyny (SI/ABA) i taktyki wyciszania.</p>
                                    </div>
                                </button>

                                <button onClick={() => setActiveMode('rodzic')} className={`p-6 rounded-3xl border-2 transition-all duration-300 text-left flex flex-col gap-3 ${activeMode === 'rodzic' ? 'bg-blue-900/30 border-blue-500 shadow-[0_0_30px_rgba(59,130,246,0.2)]' : 'glass-panel border-slate-700/50 hover:border-slate-500'}`}>
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${activeMode === 'rodzic' ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                        <i className="ph-bold ph-users text-2xl"></i>
                                    </div>
                                    <div>
                                        <h3 className={`font-bold text-lg ${activeMode === 'rodzic' ? 'text-white' : 'text-slate-300'}`}>Trudna Rozmowa z Rodzicem</h3>
                                        <p className="text-xs text-slate-400 mt-1">Granice, zrozumienie i gotowe zdania NVC.</p>
                                    </div>
                                </button>
                            </div>

                            {/* Pole Textarea */}
                            <div className="glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-700/50 relative overflow-hidden">
                                <label className="block text-white font-bold mb-4">
                                    {activeMode === 'zachowanie' ? 'Opisz sytuację i zachowanie dziecka:' : 'Opisz postawę i zarzuty ze strony rodzica:'}
                                </label>
                                
                                <textarea 
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    placeholder={activeMode === 'zachowanie' 
                                        ? "Np. Krzyś (5 lat z autyzmem) zaczął rzucać klockami i krzyczeć, gdy usłyszał 'koniec zabawy, idziemy na obiad'. Zatyka uszy." 
                                        : "Np. Mama Oli przyszła rano z pretensjami, że nikt się nią nie zajmuje. Neguje, że Ola bije inne dzieci i twierdzi, że to inni ją prowokują."}
                                    className="w-full h-32 bg-slate-900/60 border border-slate-600 text-white rounded-2xl p-5 focus:outline-none focus:border-pink-500 transition-colors custom-scrollbar resize-y text-sm sm:text-base mb-6"
                                ></textarea>

                                {/* Toggle Search */}
                                <div className="flex items-center gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700 mb-6">
                                    <button onClick={() => setUseWebSearch(!useWebSearch)} className={`w-12 h-6 rounded-full transition-colors flex items-center px-1 ${useWebSearch ? 'bg-pink-500' : 'bg-slate-700'}`}>
                                        <div className={`w-4 h-4 bg-white rounded-full transition-transform ${useWebSearch ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                    </button>
                                    <div>
                                        <label className="text-sm font-bold text-white block">Wyszukiwanie w Sieci (Grounding)</label>
                                        <span className="text-[10px] text-slate-400">Pozwala sztucznej inteligencji znaleźć darmowe linki z rozwiązaniami w internecie.</span>
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button 
                                        onClick={generateAdvice}
                                        disabled={isGenerating || !inputText.trim()}
                                        className={`w-full sm:w-auto px-8 py-4 rounded-xl font-black text-white transition-all flex items-center justify-center gap-2 shadow-lg
                                            ${isGenerating ? 'bg-slate-700 opacity-70 cursor-not-allowed' : 'bg-gradient-to-r from-pink-500 to-violet-600 hover:scale-105 shadow-[0_10px_20px_rgba(236,72,153,0.3)] active:scale-95'}`}
                                    >
                                        {isGenerating ? <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Opracowuję interwencję...</> : <><i className="ph-bold ph-lifebuoy text-xl"></i> Ratuj Sytuację</>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* WYNIK INTERWENCJI (Widoczny także na wydruku) */}
                        {adviceData && (
                            <div ref={resultRef} className="max-w-4xl mx-auto mt-12 print:mt-0 print:block">
                                
                                <div className="flex justify-end gap-3 mb-6 print-hidden">
                                    <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                        <i className="ph-bold ph-globe text-lg"></i> Do Giełdy
                                    </button>
                                    <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm">
                                        <i className="ph-bold ph-printer text-lg"></i> Raport / Drukuj
                                    </button>
                                </div>

                                <div className="glass-panel p-8 sm:p-12 rounded-[2rem] border border-pink-500/30 shadow-2xl relative overflow-hidden bg-slate-900/90 print:bg-white print:border-slate-300 print:shadow-none print:p-0">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-500 to-violet-600 print-hidden"></div>
                                    
                                    <div className="hidden print-only mb-8 pb-4 border-b-2 border-slate-200 text-center">
                                        <h2 className="text-2xl font-black uppercase tracking-widest text-slate-800">Raport Interwencyjny EduSOS</h2>
                                        <p className="text-sm text-slate-500">Dotyczy: {activeMode === 'zachowanie' ? 'Praca z zachowaniem ucznia' : 'Współpraca z rodzicem'}</p>
                                    </div>

                                    <div className="mb-8 p-4 bg-slate-800/50 rounded-xl border border-slate-700 print:bg-slate-50 print:border-slate-200">
                                        <p className="text-xs font-bold text-pink-400 uppercase tracking-widest mb-2 print:text-slate-500">Zgłoszona sytuacja:</p>
                                        <p className="text-slate-300 text-sm italic print:text-slate-800">"{inputText}"</p>
                                    </div>

                                    <h3 className="text-2xl font-black text-white mb-6 uppercase tracking-wider flex items-center gap-2 print:text-slate-900">
                                        <i className="ph-fill ph-check-circle text-pink-500"></i> Rekomendowane Kroki
                                    </h3>
                                    
                                    <div className="text-slate-200 whitespace-pre-wrap text-base sm:text-[17px] leading-relaxed font-medium print:text-slate-800 print:leading-normal">
                                        {adviceData.text}
                                    </div>
                                </div>
                                
                                {/* Źródła / Linki */}
                                {adviceData.sources && adviceData.sources.length > 0 && (
                                    <div className="mt-6 glass-panel p-6 rounded-2xl border border-blue-500/30 bg-blue-900/20 print-hidden">
                                        <h4 className="text-lg font-bold text-blue-400 flex items-center gap-2 mb-4">
                                            <i className="ph-bold ph-link text-xl"></i> Materiały dodatkowe z Sieci (Darmowe)
                                        </h4>
                                        <ul className="space-y-3">
                                            {adviceData.sources.map((source, index) => (
                                                <li key={index} className="flex items-start gap-2">
                                                    <i className="ph-fill ph-globe-hemisphere-west text-blue-500 mt-0.5"></i>
                                                    <a href={source.uri} target="_blank" rel="noopener noreferrer" className="text-slate-300 hover:text-white underline text-sm leading-snug block transition-colors">
                                                        {source.title}
                                                    </a>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
