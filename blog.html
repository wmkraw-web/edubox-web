    <meta name="twitter:description" content="Aktualności prawne, poradniki i praktyczne wskazówki dla nauczycieli. Reforma podstawy programowej, awans zawodowy, AI w edukacji.">
    <meta name="twitter:image" content="https://eduboxpro.pl/okladka.jpg">

    <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-3RQ9R0N0K8"></script>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="blog-posts.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; min-height: 100vh; }
        .article-font { font-family: 'Lora', serif; line-height: 1.8; }
        .article-font h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.35rem; margin-top: 2rem; margin-bottom: 0.75rem; color: #0f172a; }
        .article-font p { margin-bottom: 1.25rem; }
        .glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

  <link rel="canonical" href="https://eduboxpro.pl/blog.html">
  <meta name="description" content="Aktualności prawne, poradniki i praktyczne wskazówki dla nauczycieli. Reforma podstawy programowej, awans zawodowy, AI w edukacji.">
  <link rel="icon" href="/icon-96.png" type="image/png">
</head>
<body>
    <script>window.EDUBOX_IMAGE_APP = false;</script>
    <div id="wspolne-menu-kontener"></div>

    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const POSTS = window.BLOG_POSTS || [];

        function getPostFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('post');
            return POSTS.find(p => p.slug === slug) || null;
        }

        function PostCard({ post, onOpen }) {
            return (
                <button onClick={() => onOpen(post)} className="text-left bg-slate-900/60 border border-slate-800 hover:border-slate-600 rounded-3xl p-7 flex flex-col transition-all hover:-translate-y-1 shadow-lg h-full">
                    <div className={`w-12 h-12 rounded-2xl bg-slate-800 flex items-center justify-center mb-5 ${post.color}`}>
                        <i className={`ph-bold ${post.icon} text-2xl`}></i>
                    </div>
                    <div className="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3">
                        <span>{post.category}</span>
                        <span>•</span>
                        <span>{post.readTime}</span>
                    </div>
                    <h2 className="text-lg font-black text-white mb-3 leading-snug">{post.title}</h2>
                    <p className="text-slate-400 text-sm leading-relaxed flex-grow">{post.excerpt}</p>
                    <div className="flex items-center gap-2 text-xs text-slate-500 mt-5 pt-5 border-t border-slate-800">
                        <i className="ph-bold ph-calendar-blank"></i>
                        {new Date(post.date).toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })}
                    </div>
                </button>
            );
        }

        function App() {
            const [activePost, setActivePost] = useState(() => getPostFromUrl());

            useEffect(() => {
                if (activePost) {
                    document.title = activePost.title + " - Blog EduBox AI";
                    window.scrollTo(0, 0);
                } else {
                    document.title = "Blog EduBox AI - Poradnik i aktualności dla nauczycieli";
                }
            }, [activePost]);

            useEffect(() => {
                const existing = document.getElementById('ld-blogposting');
                if (existing) existing.remove();

                if (activePost) {
                    const jsonLd = {
                        "@context": "https://schema.org",
                        "@type": "BlogPosting",
                        "headline": activePost.title,
                        "description": activePost.excerpt,
                        "datePublished": activePost.date,
                        "dateModified": activePost.date,
                        "author": { "@type": "Organization", "name": "EduBox AI", "url": "https://eduboxpro.pl/" },
                        "publisher": {
                            "@type": "Organization",
                            "name": "EduBox AI",
                            "logo": { "@type": "ImageObject", "url": "https://eduboxpro.pl/icon-512.png" }
                        },
                        "mainEntityOfPage": { "@type": "WebPage", "@id": "https://eduboxpro.pl/blog.html?post=" + activePost.slug }
                    };
                    const tag = document.createElement('script');
                    tag.id = 'ld-blogposting';
                    tag.type = 'application/ld+json';
                    tag.textContent = JSON.stringify(jsonLd);
                    document.head.appendChild(tag);
                }

                return () => {
                    const t = document.getElementById('ld-blogposting');
                    if (t) t.remove();
                };
            }, [activePost]);

            const openPost = (post) => {
                const url = new URL(window.location);
                url.searchParams.set('post', post.slug);
                window.history.pushState({}, '', url);
                setActivePost(post);
            };

            const closePost = () => {
                const url = new URL(window.location);
                url.searchParams.delete('post');
                window.history.pushState({}, '', url);
                setActivePost(null);
            };

            useEffect(() => {
                const onPop = () => setActivePost(getPostFromUrl());
                window.addEventListener('popstate', onPop);
                return () => window.removeEventListener('popstate', onPop);
            }, []);

            if (activePost) {
                const otherPosts = POSTS.filter(p => p.slug !== activePost.slug).slice(0, 2);
                return (
                    <main className="max-w-3xl mx-auto px-4 sm:px-6 py-14 fade-in">
                        <button onClick={closePost} className="flex items-center gap-2 text-slate-400 hover:text-white text-sm font-bold mb-8 transition-colors">
                            <i className="ph-bold ph-arrow-left"></i> Wszystkie wpisy
                        </button>

                        <div className="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-slate-500 mb-4">
                            <span className={activePost.color}>{activePost.category}</span>
                            <span>•</span>
                            <span>{new Date(activePost.date).toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                            <span>•</span>
                            <span>{activePost.readTime} czytania</span>
                        </div>

                        <h1 className="text-3xl md:text-4xl font-black text-white mb-10 leading-tight tracking-tight">{activePost.title}</h1>

                        <div className="bg-white text-slate-900 rounded-[2rem] p-8 md:p-12 shadow-2xl article-font" dangerouslySetInnerHTML={{ __html: activePost.content }}></div>

                        {otherPosts.length > 0 && (
                            <div className="mt-16">
                                <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-6">Zobacz też</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    {otherPosts.map(p => <PostCard key={p.slug} post={p} onOpen={openPost} />)}
                                </div>
                            </div>
                        )}
                    </main>
                );
            }

            return (
                <main className="max-w-6xl mx-auto px-4 sm:px-6 py-14">
                    <div className="text-center mb-14">
                        <div className="inline-flex items-center gap-2 bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-5">
                            <i className="ph-bold ph-newspaper"></i> Blog EduBox AI
                        </div>
                        <h1 className="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">Poradnik i aktualności<br className="hidden sm:block" /> dla nauczycieli</h1>
                        <p className="text-slate-400 max-w-xl mx-auto text-base md:text-lg">Zmiany w prawie oświatowym, praktyczne poradniki i wskazówki dotyczące korzystania z AI w szkole.</p>
                    </div>

                    {POSTS.length === 0 ? (
                        <div className="text-center text-slate-500 py-20">Wkrótce pojawią się tu pierwsze wpisy.</div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {POSTS.map(post => <PostCard key={post.slug} post={post} onOpen={openPost} />)}
                        </div>
                    )}
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>

</body></html>
