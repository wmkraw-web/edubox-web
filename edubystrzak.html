    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        // --- IKONY SVG ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z" />,
                Target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
                Sparkles: <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/>,
                Sun: <><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>,
                Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
                Info: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
                Edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        // --- BAZY DANYCH (MOCK AI) ---
        const AI_CATEGORIES = {
            'Zwierzęta': ['🐶 Pies', '🐱 Kot', '🐭 Mysz', '🐹 Chomik', '🐰 Królik', '🦊 Lis', '🐻 Niedźwiedź', '🐼 Panda', '🐨 Koala', '🐯 Tygrys', '🦁 Lew', '🐮 Krowa', '🐷 Świnia', '🐸 Żaba', '🐵 Małpa', '🐔 Kura', '🐧 Pingwin', '🐦 Ptak', '🦆 Kaczka', '🦅 Orzeł', '🦉 Sowa', '🦇 Nietoperz', '🐺 Wilk', '🐗 Dzik', '🐴 Koń', '🦄 Jednorożec', '🐝 Pszczoła', '🐛 Gąsienica', '🦋 Motyl', '🐌 Ślimak', '🐞 Biedronka'],
            'Jedzenie': ['🍎 Jabłko', '🍐 Gruszka', '🍊 Pomarańcza', '🍋 Cytryna', '🍌 Banan', '🍉 Arbuz', '🍇 Winogrona', '🍓 Truskawka', '🍒 Wiśnia', '🍑 Brzoskwinia', '🍍 Ananas', '🥥 Kokos', '🥝 Kiwi', '🍅 Pomidor', '🥑 Awokado', '🥕 Marchew', '🌽 Kukurydza', '🥦 Brokuł', '🍄 Grzyb', '🍞 Chleb', '🥐 Rogalik', '🥨 Precel', '🧀 Ser', '🍔 Burger', '🍟 Frytki', '🍕 Pizza', '🌭 Hot dog', '🌮 Taco', '🥗 Sałatka', '🍿 Popcorn', '🍩 Pączek'],
            'Szkoła': ['🎒 Plecak', '📚 Książki', '✏️ Ołówek', '🖊️ Długopis', '📏 Linijka', '✂️ Nożyczki', '🖍️ Kredki', '📝 Zeszyt', '🏫 Szkoła', '👩‍🏫 Nauczyciel', '🚌 Autobus', '🔔 Dzwonek', '⏰ Zegar', '⚽ Piłka', '🎨 Farby', '🖌️ Pędzel', '💻 Komputer', '🧮 Liczydło', '🔬 Mikroskop', '🔭 Teleskop', '🧪 Próbówka', '📎 Spinacz', '📌 Pinezka', '🗑️ Kosz', '🔑 Klucz', '💡 Żarówka', '🏆 Puchar', '🥇 Medal', '🎓 Absolwent', '📐 Kątomierz', '📋 Tablica'],
            'Pojazdy': ['🚗 Auto', '🚕 Taksówka', '🚙 Jeep', '🚌 Autobus', '🚎 Trolejbus', '🏎️ Wyścigówka', '🚓 Policja', '🚑 Karetka', '🚒 Straż', '🚐 Van', '🚚 Ciężarówka', '🚜 Traktor', '🛴 Hulajnoga', '🚲 Rower', '🛵 Skuter', '🏍️ Motocykl', '🚨 Kogut', '🚂 Pociąg', '🚆 Kolej', '🚇 Metro', '🚋 Tramwaj', '🚁 Helikopter', '🛩️ Samolot', '🚀 Rakieta', '🛸 UFO', '🛰️ Satelita', '⛵ Żaglówka', '🛶 Kajak', '🚤 Motorówka', '🚢 Statek', '⚓ Kotwica'],
            'Angielski - Czasowniki': ['Run 🏃', 'Jump 🦘', 'Swim 🏊', 'Fly 🦅', 'Read 📖', 'Write ✍️', 'Sing 🎤', 'Dance 💃', 'Eat 🍔', 'Drink 🥤', 'Sleep 😴', 'Play 🎮', 'Cook 🍳', 'Draw 🎨', 'Clean 🧹', 'Wash 🧼', 'Drive 🚗', 'Ride 🚲', 'Walk 🚶', 'Talk 🗣️', 'Listen 🎧', 'Look 👀', 'Think 🤔', 'Smile 😊', 'Cry 😢', 'Laugh 😂', 'Work 💼', 'Study 📚', 'Buy 🛍️', 'Sell 💰', 'Open 🚪']
        };

        // --- ALGORYTM MATEMATYCZNY ---
        const generateCardsMatrix = () => {
            const p = 5; 
            const cards = [];
            const card1 = [];
            for (let i = 0; i <= p; i++) card1.push(i);
            cards.push(card1);
            for (let j = 0; j < p; j++) {
                const card = [0];
                for (let k = 0; k < p; k++) {
                    card.push(p + 1 + j * p + k);
                }
                cards.push(card);
            }
            for (let i = 0; i < p; i++) {
                for (let j = 0; j < p; j++) {
                    const card = [i + 1];
                    for (let k = 0; k < p; k++) {
                        const val = p + 1 + k * p + ((i * k + j) % p);
                        card.push(val);
                    }
                    cards.push(card);
                }
            }
            return cards;
        };

        const CARD_MATRIX = generateCardsMatrix(); 

        // --- KOMPONENT GŁÓWNY ---
        function App() {
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka
            const [darkMode, setDarkMode] = useState(true);
            const [selectedCategory, setSelectedCategory] = useState('Zwierzęta');
            const [customMode, setCustomMode] = useState(false);
            const [customText, setCustomText] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            
            // Układ (Styl) kart
            const [cardColor, setCardColor] = useState('#ffffff');
            const [borderColor, setBorderColor] = useState('#f43f5e'); // rose-500
            const [showText, setShowText] = useState(true);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edubystrzak_sets');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };
            
            const randomStyles = useMemo(() => {
                return CARD_MATRIX.map(card => {
                    return card.map((_, i) => {
                        const isCenter = i === 0;
                        const angle = (i - 1) * (360 / 5) + (Math.random() * 20 - 10);
                        const radius = isCenter ? 0 : 22 + Math.random() * 6; 
                        const rot = Math.random() * 360;
                        const scale = 0.6 + Math.random() * 0.4; 
                        const x = 50 + radius * Math.cos((angle * Math.PI) / 180);
                        const y = 50 + radius * Math.sin((angle * Math.PI) / 180);

                        return {
                            left: `${x}%`,
                            top: `${y}%`,
                            transform: `translate(-50%, -50%) rotate(${rot}deg) scale(${scale})`
                        };
                    });
                });
            }, [selectedCategory, customMode]); 

            let currentWords = [];
            if (customMode) {
                const parts = customText.split(',').map(s => s.trim()).filter(s => s.length > 0);
                currentWords = Array.from({length: 31}, (_, i) => parts[i] || `Brak ${i+1}`);
            } else {
                currentWords = AI_CATEGORIES[selectedCategory] || Array.from({length: 31}, (_, i) => `Błąd ${i+1}`);
            }

            const handleAI = () => {
                setIsGenerating(true);
                setTimeout(() => {
                    setIsGenerating(false);
                }, 800); 
            };

            const handlePrint = () => {
                if (!updateAndCheckLimit()) return;
                window.print();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj tytuł zestawu!");
                
                let wordsToSave = customMode ? customText : AI_CATEGORIES[selectedCategory].join(', ');
                const wordsCount = wordsToSave.split(',').filter(x=>x.trim()).length;

                if(wordsCount < 31) return showToast("Zestaw musi mieć dokładnie 31 słów aby działał poprawnie!");

                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edubystrzak_sets');
                        await addDoc(libRef, {
                            title: publishTitle,
                            words: wordsToSave,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadSetFromLibrary = (wordsString) => {
                setCustomText(wordsString);
                setCustomMode(true);
                setViewMode('kreator');
                showToast("✅ Pomyślnie załadowano zestaw z Biblioteki!");
            };

            const pages = [];
            for (let i = 0; i < CARD_MATRIX.length; i += 6) {
                pages.push(CARD_MATRIX.slice(i, i + 6));
            }

            const themeClass = darkMode ? 'bg-slate-900 text-slate-200' : 'bg-gray-100 text-gray-800';
            const panelClass = darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200';
            const inputClass = darkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-gray-50 border-gray-200 text-gray-800';

            return (
                <div className={`flex flex-col flex-1 font-sans transition-colors duration-300 ${themeClass}`}>
                    
                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-rose-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(225,29,72,0.5)] animate-toast flex items-center gap-2">
                            <Icon name="CheckCircle" className="w-5 h-5" /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                            <div className="bg-slate-900 border border-rose-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-rose-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Bibliotece</h3>
                                <p className="text-slate-400 text-sm mb-6">Udostępnij ten zestaw słów/ikon dla innych nauczycieli.</p>
                                
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Nazwa Twojego Zestawu</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Słówka angielskie - Pogoda" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-rose-500" />
                                
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj Zestaw'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* LOKALNA NAWIGACJA ZAKŁADEK (Kreator vs Biblioteka) */}
                    <div className="w-full mx-auto px-4 pt-6 pb-2 print-hidden flex justify-center md:justify-start">
                        <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                            <button onClick={() => setViewMode('kreator')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="Target" className="w-4 h-4" /> Kreator Kart
                            </button>
                            <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name="Library" className="w-4 h-4" /> Baza Zestawów
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                        
                        {viewMode === 'kreator' ? (
                            <>
                                {/* Sidebar (Panel sterowania) */}
                                <aside className={`w-full md:w-96 border-r overflow-y-auto print-hidden z-10 custom-scrollbar md:h-[calc(100vh-140px)] ${panelClass} animate-fade-in`}>
                                    <div className="p-6 space-y-8">
                                        
                                        <div className="flex justify-between items-center pb-2 border-b border-slate-700/50">
                                            <h2 className="text-xl font-black text-rose-500 flex items-center gap-2">
                                                <Icon name="Target" className="w-6 h-6" /> Opcje Kart
                                            </h2>
                                            <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-full border ${darkMode ? 'border-slate-600 hover:bg-slate-700 text-yellow-400' : 'border-gray-200 hover:bg-gray-100 text-slate-600'}`}>
                                                <Icon name={darkMode ? "Sun" : "Moon"} className="w-4 h-4" />
                                            </button>
                                        </div>

                                        {limitData.showWarning && !isPro && (
                                            <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-4 text-center shadow-lg">
                                                <h3 className="text-lg font-black text-white mb-1">Limit (5/5)</h3>
                                                <p className="text-slate-300 text-xs mb-3">Wyczerpano próbne drukowanie. Wpisz kod z menu głównego.</p>
                                            </div>
                                        )}
                                        
                                        {/* Baza Słówek */}
                                        <div className="space-y-4">
                                            <label className="text-xs font-black uppercase tracking-widest flex items-center justify-between text-rose-500">
                                                <div className="flex items-center gap-2"><Icon name="Sparkles" className="w-4 h-4" /> Baza Edu-Słówek (AI)</div>
                                            </label>
                                            
                                            {!customMode ? (
                                                <div className="space-y-3">
                                                    <select 
                                                        value={selectedCategory} 
                                                        onChange={(e) => { setSelectedCategory(e.target.value); handleAI(); }} 
                                                        className={`w-full p-3 border-2 rounded-xl text-sm font-bold ${inputClass}`}
                                                    >
                                                        {Object.keys(AI_CATEGORIES).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                    </select>
                                                    <button onClick={() => setCustomMode(true)} className={`w-full py-2 text-xs font-bold rounded-lg border-2 border-dashed ${darkMode ? 'border-slate-600 hover:border-slate-400 text-slate-400' : 'border-gray-300 hover:border-gray-500 text-gray-500'}`}>
                                                        Chcę wpisać własne słowa (Tryb Ręczny)
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="space-y-3 animate-fade-in">
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase">Wklej dokładnie 31 słów po przecinku:</p>
                                                    <textarea 
                                                        value={customText}
                                                        onChange={(e) => setCustomText(e.target.value)}
                                                        placeholder="Słowo 1, Słowo 2, 🍎 Jabłko, itd..."
                                                        className={`w-full p-3 border rounded-xl text-sm h-32 custom-scrollbar resize-none ${inputClass}`}
                                                    />
                                                    <p className="text-[10px] text-right mt-1">Słów: <span className={customText.split(',').filter(x=>x.trim()).length === 31 ? 'text-green-500 font-bold' : 'text-rose-500 font-bold'}>{customText.split(',').filter(x=>x.trim()).length}/31</span></p>
                                                    <button onClick={() => setCustomMode(false)} className="w-full py-2 text-xs font-bold rounded-lg border border-rose-500 text-rose-500 hover:bg-rose-500 hover:text-white transition-colors">
                                                        Wróć do Gotowych Zestawów AI
                                                    </button>
                                                </div>
                                            )}

                                            <button onClick={() => setShowPublishModal(true)} className="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-4 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-colors btn-bounce shadow-md">
                                                <Icon name="Share" className="w-4 h-4"/> Zapisz Zestaw dla innych
                                            </button>

                                            {isGenerating && (
                                                <div className="flex items-center justify-center gap-2 p-4 bg-rose-500 text-white rounded-xl font-bold animate-pulse">
                                                    <Icon name="Target" className="w-5 h-5 animate-spin" /> Algorytm oblicza ułożenie...
                                                </div>
                                            )}
                                        </div>

                                        {/* Styl kart */}
                                        <div className={`space-y-4 p-5 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-gray-200'}`}>
                                            <label className="text-xs font-black uppercase tracking-widest flex items-center gap-2 text-slate-400">
                                                <Icon name="Edit" className="w-4 h-4" /> Wygląd Karty
                                            </label>
                                            
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-bold">Kolor Tła Karty</span>
                                                <input type="color" value={cardColor} onChange={(e) => setCardColor(e.target.value)} className="w-8 h-8 rounded cursor-pointer border-0 p-0" />
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-bold">Kolor Obramowania</span>
                                                <input type="color" value={borderColor} onChange={(e) => setBorderColor(e.target.value)} className="w-8 h-8 rounded cursor-pointer border-0 p-0" />
                                            </div>
                                            <label className="flex items-center gap-3 cursor-pointer pt-2">
                                                <input type="checkbox" checked={showText} onChange={(e) => setShowText(e.target.checked)} className="w-5 h-5 rounded text-rose-500 accent-rose-500 bg-slate-800 border-slate-600" />
                                                <span className="text-sm font-bold">Drukuj opisy słowne (Dla klas 1-3)</span>
                                            </label>
                                        </div>

                                        <button 
                                            onClick={handlePrint} 
                                            disabled={!isPro && limitData.remaining === 0}
                                            className="w-full bg-rose-600 hover:bg-rose-500 disabled:bg-slate-700 text-white px-6 py-4 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg hover:shadow-rose-500/25 transition-all text-lg tracking-wide uppercase"
                                        >
                                            <Icon name="Printer" className="w-6 h-6" /> Drukuj PDF
                                        </button>
                                        
                                        <div className={`p-4 rounded-2xl border ${darkMode ? 'bg-blue-900/20 border-blue-800' : 'bg-blue-50 border-blue-200'}`}>
                                            <h3 className="font-bold flex items-center gap-2 text-blue-500 mb-2">
                                                <Icon name="Info" className="w-5 h-5" /> Instrukcja Półsekundowa
                                            </h3>
                                            <p className="text-xs leading-relaxed opacity-90">
                                                1. Wybierz temat słownictwa z listy (lub wklej własny).<br/>
                                                2. System sam obliczy geometrię kart (każde dwie karty mają ZAWSZE tylko jeden wspólny symbol).<br/>
                                                3. Kliknij "Drukuj". Dostaniesz gotowe karty w formacie 6 kółek na kartkę A4. Wytnij i zagraj z klasą!
                                            </p>
                                        </div>

                                    </div>
                                </aside>

                                {/* Ekran roboczy (Podgląd LIVE) */}
                                <main className={`flex-1 overflow-y-auto p-4 md:p-8 print-container custom-scrollbar ${darkMode ? 'bg-[#0f172a]' : 'bg-slate-200'} animate-fade-in`}>
                                    
                                    <div className="print-hidden mb-8 max-w-5xl mx-auto flex justify-between items-center bg-rose-500/10 border border-rose-500/20 text-rose-500 px-4 py-3 rounded-xl shadow-inner">
                                        <span className="text-sm font-bold flex items-center gap-2"><Icon name="Target" className="w-5 h-5" /> Podgląd 31 kart (Każda ma 6 symboli)</span>
                                        <span className="text-xs font-medium opacity-80 uppercase tracking-widest">A4: 6 kart na stronę</span>
                                    </div>

                                    {/* WIDOK EKRANOWY */}
                                    <div className="print-hidden max-w-5xl mx-auto flex flex-wrap justify-center gap-6 pb-20">
                                        {CARD_MATRIX.map((cardIndices, cardNum) => (
                                            <div 
                                                key={`live-${cardNum}`} 
                                                className="w-48 h-48 md:w-64 md:h-64 rounded-full relative shadow-xl transition-transform hover:scale-105 overflow-hidden"
                                                style={{ backgroundColor: cardColor, border: `6px solid ${borderColor}` }}
                                            >
                                                {cardIndices.map((wordIndex, symbolNum) => {
                                                    const fullStr = currentWords[wordIndex] || "";
                                                    const emojiMatch = fullStr.match(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu);
                                                    const emoji = emojiMatch ? emojiMatch[0] : "";
                                                    const textOnly = fullStr.replace(emoji, '').trim();
                                                    
                                                    const posStyle = randomStyles[cardNum][symbolNum];

                                                    return (
                                                        <div key={symbolNum} className="symbol" style={posStyle}>
                                                            {emoji && <span className="text-3xl md:text-5xl drop-shadow-sm">{emoji}</span>}
                                                            {showText && textOnly && <span className="text-[8px] md:text-[10px] font-bold text-slate-800 uppercase mt-1 leading-tight break-words">{textOnly}</span>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ))}
                                    </div>

                                    {/* WIDOK DO DRUKU A4 */}
                                    <div className="hidden print:block w-full">
                                        {pages.map((pageCards, pageIndex) => (
                                            <div key={`page-${pageIndex}`} className="a4-page">
                                                {pageCards.map((cardIndices, cardNumOnPage) => {
                                                    const globalCardNum = pageIndex * 6 + cardNumOnPage;
                                                    return (
                                                        <div 
                                                            key={`print-card-${globalCardNum}`} 
                                                            className="dobble-card"
                                                            style={{ backgroundColor: cardColor, borderColor: borderColor }}
                                                        >
                                                            {cardIndices.map((wordIndex, symbolNum) => {
                                                                const fullStr = currentWords[wordIndex] || "";
                                                                const emojiMatch = fullStr.match(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu);
                                                                const emoji = emojiMatch ? emojiMatch[0] : "";
                                                                const textOnly = fullStr.replace(emoji, '').trim();
                                                                
                                                                const posStyle = randomStyles[globalCardNum][symbolNum];

                                                                return (
                                                                    <div key={symbolNum} className="symbol" style={posStyle}>
                                                                        {emoji && <span style={{ fontSize: '24pt', display: 'block' }}>{emoji}</span>}
                                                                        {showText && textOnly && <span style={{ fontSize: '7pt', fontWeight: 'bold', color: 'black', marginTop: '2px', textTransform: 'uppercase', display: 'block', maxWidth: '100%', whiteSpace: 'normal', lineHeight: '1.1' }}>{textOnly}</span>}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ))}
                                    </div>
                                </main>
                            </>
                        ) : (
                            /* WIDOK BIBLIOTEKI ZESTAWÓW */
                            <div className="w-full flex-1 overflow-y-auto custom-scrollbar p-6 animate-fade-in print-hidden">
                                <div className="text-center max-w-3xl mx-auto mb-10 mt-4">
                                    <h2 className="text-3xl font-black text-rose-500 mb-2">Baza Gotowych Zestawów</h2>
                                    <p className="text-slate-400">Przeglądaj zestawy ułożone przez innych nauczycieli. Kliknij jeden przycisk, by od razu wygenerować z nich karty!</p>
                                </div>
                                
                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                        <div className="text-5xl mb-4">🎴</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Bądź pierwszy! Wpisz własne słowa w kreatorze i dodaj je do Biblioteki Wzorów.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto pb-10">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[400px] border-rose-500/30 hover:border-rose-500/60">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-rose-500/20 text-rose-400">
                                                        Zestaw (31 słów)
                                                    </span>
                                                </div>
                                                <h3 className="text-lg font-bold text-white mb-2 leading-tight">{item.title}</h3>
                                                <div className="text-xs text-slate-400 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar leading-relaxed">
                                                    {item.words.split(',').map(s=>s.trim()).join(', ')}
                                                </div>
                                                <div className="flex items-center justify-end pt-4 border-t border-slate-700 mt-auto">
                                                    <button 
                                                        onClick={() => loadSetFromLibrary(item.words)} 
                                                        className="w-full bg-rose-600 hover:bg-rose-500 rounded-lg text-white font-bold text-sm py-3 transition-colors btn-bounce shadow-md flex items-center justify-center gap-2"
                                                    >
                                                        <Icon name="Target" className="w-5 h-5" /> Użyj tego zestawu
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
