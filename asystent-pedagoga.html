    <!-- Uwaga: Używamy type="text/babel" data-type="module" aby obsłużyć importy z chmury -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useRef, useEffect } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.Sparkles}</svg>;
        };

        const DOC_TYPES = [
            { id: 'gotowosc', label: 'Gotowość Szkolna (Przedszkole)' },
            { id: 'ipet', label: 'IPET (Indywidualny Program)' },
            { id: 'wopfu', label: 'WOPFU (Ocena Funkcjonowania)' },
            { id: 'opinia', label: 'Opinia do Poradni (PPP)' },
            { id: 'notatka', label: 'Arkusz Obserwacji' }
        ];

        const MODULES = [
            { id: 'dokumenty', label: 'Asystent Dokumentów', icon: '📄' },
            { id: 'historyjki', label: 'Historyjki Społeczne', icon: '🧩' },
            { id: 'rymowanki', label: 'Rymowanki Przedszkolne', icon: '🎈' },
            { id: 'tus', label: 'Kreator TUS', icon: '🫂' },
            { id: 'rodzice', label: 'Komunikacja z Rodzicem', icon: '🤝' }
        ];

        const getSystemPrompt = (module, docType, customHeaders, formatLength) => {
            if (module === 'dokumenty') {
                let lengthInstruction = formatLength === 'epic' 
                    ? "Wymagam BARDZO ROZBUDOWANEGO, wyczerpującego i profesjonalnego dokumentu. Każdy punkt musi być opisany w formie pełnych, bogatych w żargon pedagogiczny akapitów." 
                    : "Wymagam ZWIĘZŁEGO dokumentu (skrócona forma). Używaj punktatorów i krótkich, konkretnych zdań.";

                let base = `Jesteś wybitnym pedagogiem specjalnym. Wygeneruj profesjonalny dokument urzędowy o typie: ${docType}. Używaj języka formalnego, pedagogicznego. Nie używaj gwiazdek **.\n${lengthInstruction}\n`;
                
                if (docType === 'gotowosc') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi BEZWZGLĘDNIE obejmować rozwój fizyczny, emocjonalno-społeczny, poznawczy (mowa, myślenie, uwaga), samodzielność oraz wskazówki dla rodziców.";
                } else if (docType === 'ipet') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi obejmować diagnozę, cele, metody, dostosowania oraz działania wspierające.";
                }
                
                if (customHeaders && customHeaders.trim() !== '') {
                    base += `\n\nUWAGA KRYTYCZNA! Użytkownik podał własny wzór placówki. ZIGNORUJ standardowe wytyczne i użyj DOKŁADNIE tych nagłówków w dokumencie:\n"${customHeaders}"`;
                }
                return base;
            }
            if (module === 'historyjki') {
                return `Jesteś pedagogiem specjalnym. Napisz 'Historyjkę Społeczną' dla dziecka na podany temat. Pisz w pierwszej osobie ("Ja"). Podziel tekst na 3 akapity: 1. PROBLEM, 2. STRATEGIA (jak sobie radzić), 3. POZYTYWNY EFEKT. Zwróć tylko i wyłącznie sam tekst w języku polskim, bez uwag dla ilustratora.`;
            }
            if (module === 'rymowanki') {
                return `Jesteś wybitnym autorem prostych rymowanek dla dzieci. Pisz w układzie AABB lub ABAB. Zachowaj melodyjny, polski sylabotoniczny rytm. Długość: max 2-3 zwrotki. Zwróć SAM TEKST rymowanki. Absolutnie żadnych wstępów.`;
            }
            if (module === 'tus') {
                return `Jesteś certyfikowanym trenerem TUS (Trening Umiejętności Społecznych). Skonstruuj SZCZEGÓŁOWY i praktyczny scenariusz zajęć (ok. 30 minut). Struktura (użyj znaczników HTML <h2>, <p>, <ul>): 1. Powitanie i Rundka, 2. Psychoedukacja, 3. Scenki, 4. Relaksacja, 5. Pożegnanie. Zwróć tylko sformatowany scenariusz.`;
            }
            if (module === 'rodzice') {
                return `Jesteś empatycznym pedagogiem. Przetłumacz emocjonalny tekst na profesjonalną, formalną wiadomość e-dziennika do rodziców. Stosuj 'metodę kanapki' (pozytyw-problem-pozytyw). Zwróć tylko gotowy tekst.`;
            }
            return "Jesteś ekspertem edukacyjnym.";
        };

        const extractTextFromPDF = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let text = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const strings = content.items.map(item => item.str);
                            text += strings.join(" ") + "\n";
                        }
                        resolve(text);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka

            const [activeModule, setActiveModule] = useState('dokumenty');
            
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            const [docType, setDocType] = useState('gotowosc');
            const [diagnoza, setDiagnoza] = useState('');
            const [naglowki, setNaglowki] = useState('');
            const [mocneStrony, setMocneStrony] = useState('');
            const [trudnosci, setTrudnosci] = useState('');
            const [formatLength, setFormatLength] = useState('epic');
            const [genericInput, setGenericInput] = useState('');
            const [uploadedFilesText, setUploadedFilesText] = useState('');

            const [generatedText, setGeneratedText] = useState('');
            const [generatedImages, setGeneratedImages] = useState([]); 
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState(''); 
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'asystent_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                }, (err) => {
                    console.error("Firestore sync error", err);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setLoadingMsg('Analizuję przesłane pliki (PDF/TXT)...');
                setIsGenerating(true);
                setError('');
                
                let combinedText = "";
                try {
                    for (const file of files) {
                        if (file.type === "text/plain") {
                            const text = await file.text();
                            combinedText += `\n[PLIK TXT: ${file.name}]\n${text}\n`;
                        } else if (file.type === "application/pdf") {
                            const text = await extractTextFromPDF(file);
                            combinedText += `\n[PLIK PDF: ${file.name}]\n${text}\n`;
                        }
                    }
                    setUploadedFilesText(combinedText);
                    showToast("✅ Dokumenty wczytane pomyślnie.");
                } catch(err) {
                    setError(`Błąd odczytu pliku: ${err.message}`);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const handleGenerate = async () => {
                if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    setError("Testujesz aplikację lokalnie. AI zadziała na Vercelu.");
                    return;
                }

                if (activeModule !== 'dokumenty' && !genericInput.trim()) { setError("Wpisz temat lub problem w puste pole!"); return; }
                
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true); 
                setError(''); 
                setGeneratedText(''); 
                setGeneratedImages([]);
                setLoadingMsg('Analizuję zapytanie i piszę treść...');

                try {
                    let finalPrompt = "";
                    if (activeModule === 'dokumenty') {
                        finalPrompt = `Dokument: ${docType}\nDiagnoza: ${diagnoza}\nMocne strony: ${mocneStrony}\nTrudności: ${trudnosci}\n\nDODATKOWE PLIKI OD NAUCZYCIELA:\n${uploadedFilesText}`;
                    } else if (activeModule === 'rymowanki') {
                        finalPrompt = `Napisz rymowankę edukacyjną dla dzieci na temat: ${genericInput}`;
                    } else if (activeModule === 'historyjki') {
                        finalPrompt = `Napisz historyjkę społeczną o problemie: ${genericInput}`;
                    } else if (activeModule === 'tus') {
                        finalPrompt = `Opracuj scenariusz zajęć TUS, problem grupy to: ${genericInput}`;
                    } else if (activeModule === 'rodzice') {
                        finalPrompt = `Moje notatki do przetłumaczenia na oficjalną wiadomość do rodziców: ${genericInput}`;
                    } else {
                        finalPrompt = `Temat: ${genericInput}`;
                    }

                    const textPayload = {
                        system: getSystemPrompt(activeModule, docType, naglowki, formatLength),
                        prompt: finalPrompt,
                        temperature: 0.4
                    };

                    const textRes = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(textPayload)
                    });
                    
                    if (!textRes.ok) throw new Error("Błąd podczas generowania tekstu.");
                    const textData = await textRes.json();

                    let cleanText = textData.text || "";
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    
                    if (activeModule === 'rymowanki' || activeModule === 'historyjki') {
                        cleanText = cleanText.replace(/\n/g, '<br/>');
                    }
                    
                    setGeneratedText(cleanText);
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                    // OBIEG DLA OBRAZKÓW W HISTORYJKACH 
                    if (activeModule === 'historyjki') {
                        setLoadingMsg('Opracowuję precyzyjne instrukcje dla ilustratora...');
                        
                        let imagePromptsArray = [];
                        try {
                            const promptPayload = {
                                system: "You are a backend API. Return a JSON array of exactly 3 strings. Example: [\"prompt 1\", \"prompt 2\", \"prompt 3\"]",
                                prompt: `Create 3 English image prompts for a children's story about: "${genericInput}". 
1. The problem scene.
2. The coping strategy scene.
3. The positive outcome scene.
CRITICAL RULE: Define ONE specific character and start ALL 3 prompts with this exact description. No text.`,
                                format: "json",
                                temperature: 0.2
                            };

                            const promptRes = await fetch('/api/chat', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(promptPayload)
                            });

                            const promptData = await promptRes.json();
                            let pText = promptData.text || "[]";
                            pText = pText.replace(/```json/gi, '').replace(/```/g, '').trim();
                            let parsed = JSON.parse(pText);
                            
                            if (Array.isArray(parsed) && parsed.length >= 3) {
                                imagePromptsArray = [parsed[0], parsed[1], parsed[2]];
                            } else if (parsed.prompts && Array.isArray(parsed.prompts) && parsed.prompts.length >= 3) {
                                imagePromptsArray = [parsed.prompts[0], parsed.prompts[1], parsed.prompts[2]];
                            } else {
                                throw new Error("AI nie zwróciło tablicy 3 elementów.");
                            }
                        } catch(err) {
                            imagePromptsArray = [
                                `Children's book illustration. A 5-year-old boy facing a problem: ${genericInput}. Flat vector style.`,
                                `Children's book illustration. A 5-year-old boy trying to cope with: ${genericInput}. Calming mood, flat vector style.`,
                                `Children's book illustration. A happy 5-year-old boy who solved the problem: ${genericInput}. Joyful mood, flat vector style.`
                            ];
                        }

                        const newImages = [];
                        const antiTextClause = ", ABSOLUTELY NO TEXT, NO LETTERS, NO WORDS.";
                        
                        for (let i = 0; i < 3; i++) {
                            setLoadingMsg(`Maluję obrazek (${i + 1} z 3) - ${i === 0 ? 'Problem' : i === 1 ? 'Strategia' : 'Efekt'}...`);
                            try {
                                const finalImagePrompt = imagePromptsArray[i] + antiTextClause;
                                const imgRes = await fetch('/api/generate', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt: finalImagePrompt, aspect_ratio: '1:1' })
                                });

                                if (imgRes.ok) {
                                    const imgData = await imgRes.json();
                                    if (imgData.imageUrl) newImages.push(imgData.imageUrl);
                                }
                            } catch (imgError) { console.error("Krytyczny błąd", imgError); }
                        }
                        
                        if(newImages.length > 0) setGeneratedImages(newImages);
                    }

                } catch (err) {
                    setError('Błąd: ' + err.message);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz wzór, podaj jego tytuł!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'asystent_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            module: activeModule,
                            docType: activeModule === 'dokumenty' ? docType : null,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast("✅ Skopiowano do schowka!");
            };

            const resetForm = () => {
                setGeneratedText('');
                setGeneratedImages([]);
                setError('');
                setLoadingMsg('');
            };

            return (
                <div className="flex min-h-screen relative">
                    
                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-rose-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(225,29,72,0.5)] animate-toast flex items-center gap-2">
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-amber-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Udostępnij jako Wzór</h3>
                                <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs font-bold mb-4">
                                    ⚠️ PAMIĘTAJ: Zanim opublikujesz ten materiał w bazie publicznej, upewnij się, że usunąłeś z niego wszystkie prawdziwe imiona, nazwiska i dane wrażliwe dzieci!
                                </div>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Krótki tytuł wpisu</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. WOPFU - Afazja klasa 3" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-amber-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="sidebar w-72 flex-shrink-0 flex flex-col h-[calc(100vh-4rem)] sticky top-16 print-hidden z-20">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-bold text-slate-300 text-sm tracking-widest uppercase">Asystent Pedagoga</h1>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            <div className="mb-8">
                                <h2 className="font-bold text-white mb-3 flex items-center gap-2"><span>🛡️</span> Wersja PRO</h2>
                                {!isPro ? (
                                    <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-center">
                                        <div className="text-xs text-slate-400 mb-2">Brak statusu PRO. Używasz darmowych limitów. Wpisz kod w menu.</div>
                                    </div>
                                ) : (
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl flex items-center gap-4 shadow-inner">
                                        <div className="bg-emerald-500/20 p-2 rounded-lg"><span className="text-xl">✅</span></div>
                                        <div>
                                            <div className="uppercase tracking-widest text-[10px] opacity-80 font-bold">Status Premium</div>
                                            <div className="text-sm font-bold text-white">System Odblokowany</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <div className="space-y-1">
                                {MODULES.map(mod => (
                                    <div key={mod.id} onClick={() => { setActiveModule(mod.id); resetForm(); setViewMode('kreator'); }} className={`module-btn ${activeModule === mod.id && viewMode === 'kreator' ? 'active' : ''}`}>
                                        <span className="w-6 text-center text-lg">{mod.icon}</span>
                                        <span>{mod.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="main-content flex-1 bg-[#020617] p-6 lg:p-10 min-w-0 z-10 relative">
                        
                        <div className="flex justify-center mb-8 print-hidden fade-in">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Sparkles" size={16} /> Kreator AI
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Baza Wzorów 
                                </button>
                            </div>
                        </div>

                        {limitData.showWarning && !isPro && viewMode === 'kreator' && (
                            <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in">
                                <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                <p className="text-slate-300 mb-4 text-sm sm:text-base">Odblokuj pełen potencjał kodem PRO na górnym pasku.</p>
                            </div>
                        )}

                        {viewMode === 'kreator' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                {!generatedText && !isGenerating ? (
                                    <div className="max-w-4xl fade-in print-hidden">
                                        <h2 className="text-3xl font-black text-white mb-8 border-b border-slate-800 pb-4">{MODULES.find(m => m.id === activeModule)?.label}</h2>
                                        {activeModule === 'dokumenty' ? (
                                            <div className="space-y-6">
                                                <div className="card-bg p-3 rounded-2xl flex flex-wrap gap-2">
                                                    {DOC_TYPES.map(doc => (
                                                        <div key={doc.id} className="flex-1 min-w-[200px]">
                                                            <input type="radio" id={doc.id} checked={docType === doc.id} onChange={() => setDocType(doc.id)} className="doc-radio" />
                                                            <label htmlFor={doc.id} className="doc-label text-center h-full flex items-center justify-center">{doc.label}</label>
                                                        </div>
                                                    ))}
                                                </div>
                                                
                                                <div className="mt-4">
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Własne pliki do analizy (PDF, TXT)</label>
                                                    <div className="upload-box relative">
                                                        <input type="file" multiple accept=".pdf,.txt" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                        <div className="flex flex-col items-center gap-2 text-slate-400">
                                                            <span className="text-2xl">📂</span>
                                                            <span className="text-sm font-bold text-white">Kliknij lub upuść pliki opinii/orzeczeń tutaj</span>
                                                            <span className="text-xs">Sztuczna Inteligencja przeczyta je i uwzględni w Twoim dokumencie!</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Główna Diagnoza / Problem</label>
                                                        <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} placeholder="Np. Spektrum autyzmu, Afazja..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none"></textarea>
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-2">Wzór (Szablon)</label>
                                                        <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} placeholder="Wklej puste nagłówki ze szkolnego druczku..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none border-amber-900/50 focus:border-amber-500"></textarea>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-2">Mocne Strony ucznia</label>
                                                    <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} placeholder="W czym uczeń jest dobry..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-emerald-900/30 focus:border-emerald-500"></textarea>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-rose-400 uppercase tracking-wider block mb-2">Trudności do pokonania</label>
                                                    <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} placeholder="Z czym ma problemy..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-rose-900/30 focus:border-rose-500"></textarea>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Opisz temat lub problem</label>
                                                <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} placeholder="Opisz sytuację..." className="w-full h-48 input-bg rounded-2xl p-5 text-base resize-none"></textarea>
                                            </div>
                                        )}

                                        {error && <div className="mt-6 p-5 bg-red-900/20 border border-red-500/30 rounded-2xl text-red-400 text-sm font-medium">⚠️ {error}</div>}

                                        <div className="mt-8">
                                            <button onClick={handleGenerate} disabled={isGenerating || (!isPro && limitData.remaining === 0)} className="btn-red px-10 py-5 rounded-2xl font-black text-lg w-full sm:w-auto flex items-center justify-center gap-3 shadow-lg btn-bounce">
                                                {isGenerating ? <><svg className="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> {loadingMsg}</> : `✨ GENERUJ MATERIAŁ`}
                                            </button>
                                        </div>
                                    </div>
                                ) : null}

                                {generatedText && (
                                    <div ref={resultRef} className="max-w-5xl fade-in pb-10 mt-6">
                                        <div className="flex flex-col sm:flex-row items-center justify-between mb-8 print-hidden border-b border-slate-800 pb-6 gap-4">
                                            <h2 className="text-3xl font-black text-white">Gotowy Materiał</h2>
                                            <div className="flex flex-wrap gap-3 w-full sm:w-auto justify-center">
                                                <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-6 py-3 rounded-xl text-sm font-bold shadow-md flex items-center justify-center gap-2 btn-bounce"><Icon name="Share" size={16}/> Jako Wzór</button>
                                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-sm font-bold border border-slate-600 transition-colors flex items-center justify-center gap-2 btn-bounce">🖨️ Drukuj</button>
                                                <button onClick={resetForm} className="btn-red px-6 py-3 rounded-xl text-sm font-bold shadow-md btn-bounce">Wróć</button>
                                            </div>
                                        </div>

                                        <div className="card-bg p-8 sm:p-14 rounded-[2rem] print-area flex flex-col gap-8 shadow-2xl">
                                            {activeModule === 'historyjki' && generatedImages.length > 0 && (
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full print-images-grid mb-6">
                                                    {generatedImages.map((img, idx) => (
                                                        <div key={idx} className="flex flex-col items-center fade-in bg-slate-900/30 p-4 rounded-3xl border border-slate-800">
                                                            <img src={img} alt="Ilustracja" className="w-full aspect-square object-cover rounded-2xl border border-slate-700 shadow-md" />
                                                            <p className="text-center text-xs text-white mt-4 font-black uppercase tracking-widest bg-blue-600 px-5 py-2 rounded-full shadow-lg">{idx === 0 ? "1. Problem" : idx === 1 ? "2. Strategia" : "3. Efekt"}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="w-full text-slate-200 whitespace-pre-wrap text-lg leading-relaxed font-serif">
                                                <div dangerouslySetInnerHTML={{ __html: generatedText }} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out] max-w-7xl mx-auto">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Baza Wzorów</h2>
                                    <p className="text-slate-400">Udostępnione przez innych nauczycieli szablony, opinie i historyjki.</p>
                                </div>
                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">📚</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Wygeneruj dokument w Kreatorze i opublikuj go jako pierwszy!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-amber-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[500px]">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-indigo-500/20 text-indigo-400">
                                                        {item.module} {item.docType ? `(${item.docType})` : ''}
                                                    </span>
                                                </div>
                                                <h3 className="text-lg font-bold text-white mb-4">{item.title}</h3>
                                                <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar font-serif">
                                                    <div dangerouslySetInnerHTML={{ __html: item.content }} />
                                                </div>
                                                <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                    <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                        <Icon name="Copy" size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
