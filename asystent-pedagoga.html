    <div id="root" class="flex-grow flex flex-col relative z-10 pt-16"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const DAILY_LIMIT = 5;

        const DOC_TYPES = [
            { id: 'gotowosc', label: 'Informacja o gotowości do podjęcia nauki w szkole (Przedszkole)' },
            { id: 'ipet', label: 'IPET (Indywidualny Program Edukacyjno-Terapeutyczny)' },
            { id: 'wopfu', label: 'WOPFU (Wielospecjalistyczna Ocena Poziomu Funkcjonowania Ucznia)' },
            { id: 'opinia', label: 'Opinia o uczniu do Poradni (PPP)' },
            { id: 'notatka', label: 'Arkusz Obserwacji / Notatka służbowa' }
        ];

        const MODULES = [
            { id: 'dokumenty', label: 'Asystent Dokumentów (Z plikami)', icon: '📄' },
            { id: 'historyjki', label: 'Historyjki Społeczne', icon: '🧩' },
            { id: 'rymowanki', label: 'Rymowanki Przedszkolne', icon: '🎈' },
            { id: 'tus', label: 'Kreator TUS', icon: '🫂' },
            { id: 'rodzice', label: 'Komunikacja z Rodzicem', icon: '🤝' }
        ];

        const getSystemPrompt = (module, docType, customHeaders, formatLength) => {
            if (module === 'dokumenty') {
                let lengthInstruction = formatLength === 'epic' 
                    ? "Wymagam BARDZO ROZBUDOWANEGO, wyczerpującego i profesjonalnego dokumentu. Każdy punkt musi być opisany w formie pełnych, bogatych w żargon pedagogiczny akapitów." 
                    : "Wymagam ZWIĘZŁEGO dokumentu (skrócona forma). Używaj punktatorów i krótkich, konkretnych zdań.";

                let base = `Jesteś wybitnym pedagogiem specjalnym. Wygeneruj profesjonalny dokument urzędowy o typie: ${docType}. Używaj języka formalnego, pedagogicznego. Nie używaj gwiazdek **.\n${lengthInstruction}\n`;
                
                if (docType === 'gotowosc') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi BEZWZGLĘDNIE obejmować rozwój fizyczny, emocjonalno-socialny, poznawczy (mowa, myślenie, uwaga), samodzielność oraz wskazówki dla rodziców.";
                } else if (docType === 'ipet') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi obejmować diagnozę, cele, metody, dostosowania oraz działania wspierające.";
                }
                
                if (customHeaders && customHeaders.trim() !== '') {
                    base += `\n\nUWAGA KRYTYCZNA! Użytkownik podał własny wzór placówki. ZIGNORUJ standardowe wytyczne i użyj DOKŁADNIE tych nagłówków w dokumencie:\n"${customHeaders}"`;
                }
                return base;
            }
            if (module === 'historyjki') {
                // Nowy, PANCERNY PROMPT zapobiegający pominięciu obrazków
                return `Jesteś pedagogiem specjalnym. Napisz 'Historyjkę Społeczną' dla dziecka. Pisz w pierwszej osobie ("Ja"). Historyjka ma pomóc dziecku zrozumieć trudną sytuację.
        
ZASADA ABSOLUTNA - MUSISZ ZWRÓCIĆ WYNIK UŻYWAJĄC TYCH ZNACZNIKÓW:

[TEKST]
Tutaj napisz cały polski tekst historyjki (podzielony na akapity).

[OBRAZEK1]
Opis po ANGIELSKU pierwszego obrazka (Problem). Opisz wiek, płeć i wygląd dziecka. Np: A 5 year old boy with blonde hair, crying. NO TEXT.

[OBRAZEK2]
Opis po ANGIELSKU drugiego obrazka (Strategia radzenia sobie). Ten sam bohater co wcześniej. NO TEXT.

[OBRAZEK3]
Opis po ANGIELSKU trzeciego obrazka (Pozytywny Efekt). Ten sam bohater, uśmiechnięty i spokojny. NO TEXT.`;
            }
            if (module === 'rymowanki') {
                return `Jesteś wybitnym autorem bardzo prostych rymowanek dla dzieci w wieku przedszkolnym. Pisz w układzie AABB lub ABAB. Zachowaj melodyjny rytm. Długość: max 2-3 zwrotki. Zwróć SAM TEKST rymowanki. Absolutnie żadnych wstępów.`;
            }
            if (module === 'tus') {
                return `Jesteś certyfikowanym trenerem TUS (Trening Umiejętności Społecznych). Skonstruuj SZCZEGÓŁOWY i praktyczny scenariusz zajęć (ok. 30 minut). Struktura (użyj znaczników HTML <h2>, <p>, <ul>): 1. Powitanie i Rundka, 2. Psychoedukacja, 3. Scenki, 4. Relaksacja, 5. Pożegnanie. Zwróć tylko sformatowany scenariusz.`;
            }
            if (module === 'rodzice') {
                return `Jesteś empatycznym pedagogiem. Przetłumacz emocjonalny tekst na profesjonalną, formalną wiadomość e-dziennika do rodziców. Stosuj 'metodę kanapki' (pozytyw-problem-pozytyw). Zwróć tylko gotowy tekst.`;
            }
            return "Jesteś ekspertem edukacyjnym.";
        };

        const extractTextFromPDF = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let text = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const strings = content.items.map(item => item.str);
                            text += strings.join(" ") + "\n";
                        }
                        resolve(text);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        function App() {
            const [activeModule, setActiveModule] = useState('dokumenty');
            
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            const [docType, setDocType] = useState('gotowosc');
            const [diagnoza, setDiagnoza] = useState('');
            const [naglowki, setNaglowki] = useState('');
            const [mocneStrony, setMocneStrony] = useState('');
            const [trudnosci, setTrudnosci] = useState('');
            const [formatLength, setFormatLength] = useState('epic');
            const [genericInput, setGenericInput] = useState('');
            const [uploadedFilesText, setUploadedFilesText] = useState('');

            const [generatedText, setGeneratedText] = useState('');
            const [generatedImages, setGeneratedImages] = useState([]); 
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState(''); 
            const [error, setError] = useState('');

            const resultRef = useRef(null);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const secureApiCall = async (payload, type = 'text', customPrompt = '') => {
                if (window.location.protocol === 'file:') throw new Error("LocalTest");

                try {
                    const url = type === 'image' ? '/api/generate' : '/api/gemini';
                    
                    const requestBody = type === 'image' 
                        ? { prompt: payload.prompt, type: 'image' } 
                        : { 
                            payload: payload, 
                            type: type,
                            prompt: customPrompt || "Generuj materiał edukacyjny"
                          };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(`Błąd serwera Vercel (${type}): ${errData.error || response.statusText}`);
                    }
                    return await response.json();
                } catch (err) {
                    throw new Error(`${err.message}`);
                }
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setLoadingMsg('Analizuję przesłane pliki (PDF/TXT)...');
                setIsGenerating(true);
                setError('');
                
                let combinedText = "";
                try {
                    for (const file of files) {
                        if (file.type === "text/plain") {
                            const text = await file.text();
                            combinedText += `\n[PLIK TXT: ${file.name}]\n${text}\n`;
                        } else if (file.type === "application/pdf") {
                            const text = await extractTextFromPDF(file);
                            combinedText += `\n[PLIK PDF: ${file.name}]\n${text}\n`;
                        }
                    }
                    setUploadedFilesText(combinedText);
                } catch(err) {
                    setError(`Błąd odczytu pliku: ${err.message}`);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const handleGenerate = async () => {
                if (activeModule !== 'dokumenty' && !genericInput.trim()) { setError("Wpisz temat lub problem w puste pole!"); return; }
                
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true); 
                setError(''); 
                setGeneratedText(''); 
                setGeneratedImages([]);
                setLoadingMsg('Analizuję zapytanie i przygotowuję treść...');

                try {
                    let finalPrompt = "";
                    if (activeModule === 'dokumenty') {
                        finalPrompt = `Dokument: ${docType}\nDiagnoza: ${diagnoza}\nMocne strony: ${mocneStrony}\nTrudności: ${trudnosci}\n\nDODATKOWE PLIKI OD NAUCZYCIELA DO ANALIZY:\n${uploadedFilesText}`;
                    } else if (activeModule === 'rymowanki') {
                        finalPrompt = `Napisz rymowankę edukacyjną dla dzieci na temat: ${genericInput}`;
                    } else if (activeModule === 'historyjki') {
                        finalPrompt = `Napisz historyjkę społeczną o problemie: ${genericInput}`;
                    } else if (activeModule === 'tus') {
                        finalPrompt = `Opracuj scenariusz zajęć TUS, problem grupy to: ${genericInput}`;
                    } else if (activeModule === 'rodzice') {
                        finalPrompt = `Moje notatki do przetłumaczenia na oficjalną wiadomość do rodziców: ${genericInput}`;
                    } else {
                        finalPrompt = `Temat: ${genericInput}`;
                    }

                    // GENEROWANIE TEKSTU
                    const textData = await secureApiCall({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: getSystemPrompt(activeModule, docType, naglowki, formatLength) }] },
                        generationConfig: { temperature: 0.4 }
                    }, 'text', finalPrompt);

                    const story = textData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!story) throw new Error("AI nie zwróciło tekstu. Spróbuj wygenerować jeszcze raz.");
                    
                    let cleanText = story.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let finalHtmlText = cleanText;

                    // Domyślne prompty graficzne (awaryjne, jeśli AI nie użyje tagów)
                    let imgPrompts = [
                        `2D Flat vector illustration, children's book style. Scene showing the problem: ${genericInput}. Soft pastel colors. NO TEXT.`,
                        `2D Flat vector illustration, children's book style. Scene showing coping strategy for: ${genericInput}. Soft blue colors. NO TEXT.`,
                        `2D Flat vector illustration, children's book style. Scene showing success and happiness after overcoming: ${genericInput}. Bright colors. NO TEXT.`
                    ];

                    // KULOODPORNE WYCIĄGANIE DANYCH DO OBRAZKÓW
                    if (activeModule === 'historyjki') {
                        let i1Idx = cleanText.indexOf('[OBRAZEK1]');
                        let i2Idx = cleanText.indexOf('[OBRAZEK2]');
                        let i3Idx = cleanText.indexOf('[OBRAZEK3]');

                        // Jeśli AI w ogóle użyło tagów, wycinamy je
                        if (i1Idx !== -1) {
                            // Bierzemy wszystko do pierwszego tagu jako tekst główny
                            finalHtmlText = cleanText.substring(0, i1Idx).replace(/\[TEKST\]/g, '').trim().replace(/\n/g, '<br/>');
                            
                            // Resetujemy i podmieniamy na własne z AI
                            imgPrompts = [];
                            
                            let p1 = cleanText.substring(i1Idx + 10, i2Idx !== -1 ? i2Idx : cleanText.length).trim();
                            if(p1.length > 5) imgPrompts.push(`A beautiful borderless 2D illustration for children. ${p1}. Minimalist, clean, NO TEXT, NO WORDS.`);
                            
                            if (i2Idx !== -1) {
                                let p2 = cleanText.substring(i2Idx + 10, i3Idx !== -1 ? i3Idx : cleanText.length).trim();
                                if(p2.length > 5) imgPrompts.push(`A beautiful borderless 2D illustration for children. ${p2}. Minimalist, clean, NO TEXT, NO WORDS.`);
                            }
                            
                            if (i3Idx !== -1) {
                                let p3 = cleanText.substring(i3Idx + 10).trim();
                                if(p3.length > 5) imgPrompts.push(`A beautiful borderless 2D illustration for children. ${p3}. Minimalist, clean, NO TEXT, NO WORDS.`);
                            }
                        } else {
                            // Fallback gdy AI zapomniało tagów - czyścimy ewentualny tag TEKST i zostawiamy prompty domyślne
                            finalHtmlText = cleanText.replace(/\[TEKST\]/g, '').replace(/\n/g, '<br/>');
                        }
                    } else if (activeModule === 'rymowanki') {
                        finalHtmlText = finalHtmlText.replace(/\n/g, '<br/>');
                    }

                    setGeneratedText(finalHtmlText);
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                    if (activeModule === 'historyjki' && imgPrompts.length > 0) {
                        try {
                            const newImages = [];
                            for (let i = 0; i < imgPrompts.length; i++) {
                                setLoadingMsg(`Maluję precyzyjny obrazek ${i + 1} z ${imgPrompts.length}...`);
                                
                                const res = await secureApiCall({ prompt: imgPrompts[i] }, 'image');
                                
                                // Tolerancyjne sprawdzanie odpowiedzi z różnych modeli (DALL-E, Leonardo, Fal)
                                if (res.predictions && res.predictions[0] && res.predictions[0].bytesBase64Encoded) {
                                    newImages.push(`data:image/png;base64,${res.predictions[0].bytesBase64Encoded}`);
                                } else if (res.url) {
                                    newImages.push(res.url);
                                } else if (res.isVercelUrl) {
                                    newImages.push(res.isVercelUrl);
                                } else if (res.image) {
                                    newImages.push(res.image);
                                } else if (res.imageUrl) {
                                    newImages.push(res.imageUrl);
                                } else if (res.images && res.images[0] && res.images[0].url) {
                                    newImages.push(res.images[0].url);
                                } else if (res.data && res.data[0] && res.data[0].url) {
                                    newImages.push(res.data[0].url); // Format DALL-E (OpenAI)
                                } else {
                                    throw new Error("Nie znaleziono linku do obrazka w odpowiedzi serwera.");
                                }
                            }
                            
                            setGeneratedImages(newImages);
                        } catch(e) { 
                            console.error("Błąd grafiki:", e); 
                            setError(`Ostrzeżenie: Nie udało się narysować obrazków (${e.message}). Sam tekst został jednak wygenerowany poprawnie poniżej.`);
                        }
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setError('Tryb lokalny uruchomiony. (Użyto na komputerze z dysku)');
                        setGeneratedText(`[WERSJA DEMONSTRACYJNA - TEST LOKALNY]\n\nAsystent działa prawidłowo!\n\nGdy umieścisz ten plik na serwerze (eduboxpro.pl), połączy się on z Twoim AI i wygeneruje poprawną treść oraz obrazki.\n\nTwoje darmowe użycia na dziś uległy zmniejszeniu, abyś mógł sprawdzić jak to działa.`);
                    } else {
                        setError('Błąd aplikacji: ' + err.message);
                    }
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const resetForm = () => {
                setGeneratedText('');
                setGeneratedImages([]);
                setError('');
                setLoadingMsg('');
            };

            return (
                <div className="flex min-h-screen relative">
                    <div className="sidebar w-72 flex-shrink-0 flex flex-col h-[calc(100vh-4rem)] sticky top-16 print-hidden z-20">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-bold text-slate-300 text-sm tracking-widest uppercase">Asystent Pedagoga PRO</h1>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            
                            <div className="mb-8">
                                <h2 className="font-bold text-white mb-3 flex items-center gap-2"><span>🛡️</span> Wersja PRO</h2>
                                
                                {!isPro ? (
                                    <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-center">
                                        <div className="text-xs text-slate-400 mb-2">Brak statusu PRO. Zużywasz darmowe limity. Wpisz kod na górnym pasku w menu, aby odblokować.</div>
                                    </div>
                                ) : (
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl flex items-center gap-4 shadow-inner">
                                        <div className="bg-emerald-500/20 p-2 rounded-lg"><span className="text-xl">✅</span></div>
                                        <div>
                                            <div className="uppercase tracking-widest text-[10px] opacity-80 font-bold">Status Premium</div>
                                            <div className="text-sm font-bold text-white">System Odblokowany</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <div className="space-y-1">
                                {MODULES.map(mod => (
                                    <div key={mod.id} onClick={() => { setActiveModule(mod.id); resetForm(); }} className={`module-btn ${activeModule === mod.id ? 'active' : ''}`}>
                                        <span className="w-6 text-center text-lg">{mod.icon}</span>
                                        <span>{mod.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="main-content flex-1 bg-[#020617] p-6 lg:p-10 min-w-0 z-10 relative">
                        
                        {limitData.showWarning && !isPro && (
                            <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in">
                                <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                <p className="text-slate-300 mb-4 text-sm sm:text-base">
                                    Wykorzystałeś darmowe użycia. Aby korzystać dalej, wesprzyj projekt i wpisz kod PRO na górnym pasku.
                                </p>
                            </div>
                        )}

                        {!generatedText && !isGenerating ? (
                            <div className="max-w-4xl fade-in print-hidden">
                                <h2 className="text-3xl font-black text-white mb-8 border-b border-slate-800 pb-4">{MODULES.find(m => m.id === activeModule)?.label}</h2>
                                {activeModule === 'dokumenty' ? (
                                    <div className="space-y-6">
                                        <div className="card-bg p-3 rounded-2xl flex flex-wrap gap-2">
                                            {DOC_TYPES.map(doc => (
                                                <div key={doc.id} className="flex-1 min-w-[200px]">
                                                    <input type="radio" id={doc.id} checked={docType === doc.id} onChange={() => setDocType(doc.id)} className="doc-radio" />
                                                    <label htmlFor={doc.id} className="doc-label text-center h-full flex items-center justify-center">{doc.label}</label>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <div className="mt-4">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Własne pliki do analizy (PDF, TXT)</label>
                                            <div className="upload-box relative">
                                                <input type="file" multiple accept=".pdf,.txt" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                <div className="flex flex-col items-center gap-2 text-slate-400">
                                                    <span className="text-2xl">📂</span>
                                                    <span className="text-sm font-bold text-white">Kliknij lub upuść pliki opinii/orzeczeń tutaj</span>
                                                    <span className="text-xs">Sztuczna Inteligencja przeczyta je i uwzględni w Twoim dokumencie!</span>
                                                </div>
                                            </div>
                                            {uploadedFilesText && <div className="mt-3 p-3 bg-emerald-900/30 border border-emerald-500/50 rounded-xl text-xs text-emerald-400 font-bold">✅ Pliki wczytane pomyślnie! AI przeanalizuje je przy generowaniu.</div>}
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Główna Diagnoza / Problem</label>
                                                <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} placeholder="Np. Spektrum autyzmu, Afazja, Brak dojrzałości szkolnej..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none"></textarea>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-2">Wzór wymagany przez szkołę (Szablon)</label>
                                                <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} placeholder="Wklej tutaj puste nagłówki ze szkolnego druczku (np. 1. Zachowanie, 2. Umiejętności). AI dokładnie wypełni Twój szablon!" className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none border-amber-900/50 focus:border-amber-500"></textarea>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-2">Mocne Strony ucznia (Zasoby)</label>
                                            <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} placeholder="Co uczeń potrafi, w czym jest dobry..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-emerald-900/30 focus:border-emerald-500"></textarea>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-rose-400 uppercase tracking-wider block mb-2">Trudności do pokonania (Bariery)</label>
                                            <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} placeholder="Z czym ma problemy, co sprawia trudność na zajęciach..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-rose-900/30 focus:border-rose-500"></textarea>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Opisz temat lub problem</label>
                                        <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} placeholder="Opisz krótko sytuację, z którą pracujemy..." className="w-full h-48 input-bg rounded-2xl p-5 text-base resize-none"></textarea>
                                    </div>
                                )}
                            </div>
                        ) : null}

                        {error && (
                            <div className="mt-6 max-w-4xl p-5 bg-red-900/20 border border-red-500/30 rounded-2xl text-red-400 text-sm font-medium flex items-center gap-3">
                                <span className="text-xl">⚠️</span> {error}
                            </div>
                        )}

                        <div className="mt-8 max-w-4xl print-hidden">
                            {!generatedText || isGenerating ? (
                                <button onClick={handleGenerate} disabled={isGenerating || (!isPro && limitData.remaining === 0)} className="btn-red px-10 py-5 rounded-2xl font-black text-lg w-full sm:w-auto flex items-center justify-center gap-3 shadow-lg btn-bounce">
                                    {isGenerating ? (
                                        <><svg className="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> {loadingMsg || "Generuję..."}</>
                                    ) : `✨ GENERUJ MATERIAŁ`}
                                </button>
                            ) : null}
                        </div>

                        {generatedText && (
                            <div ref={resultRef} className="max-w-5xl fade-in pb-10 mt-6">
                                <div className="flex flex-col sm:flex-row items-center justify-between mb-8 print-hidden border-b border-slate-800 pb-6 gap-4">
                                    <h2 className="text-3xl font-black text-white">Gotowy Materiał</h2>
                                    <div className="flex gap-3 w-full sm:w-auto">
                                        <button onClick={() => window.print()} className="flex-1 sm:flex-none bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-sm font-bold border border-slate-600 transition-colors flex items-center justify-center gap-2">
                                            <span>🖨️</span> Drukuj
                                        </button>
                                        <button onClick={resetForm} className="flex-1 sm:flex-none btn-red px-6 py-3 rounded-xl text-sm font-bold shadow-md">
                                            Wróć
                                        </button>
                                    </div>
                                </div>

                                <div className="card-bg p-8 sm:p-14 rounded-[2rem] print-area flex flex-col gap-8 shadow-2xl">
                                    {activeModule === 'historyjki' && generatedImages.length > 0 && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full print-images-grid mb-6">
                                            {generatedImages.map((img, idx) => (
                                                <div key={idx} className="flex flex-col items-center fade-in bg-slate-900/30 p-4 rounded-3xl border border-slate-800">
                                                    <img src={img} alt="Ilustracja AI" className="w-full aspect-square object-cover rounded-2xl border border-slate-700 shadow-md" />
                                                    <p className="text-center text-xs text-white mt-4 font-black uppercase tracking-widest bg-blue-600 px-5 py-2 rounded-full shadow-lg">
                                                        {idx === 0 ? "1. Problem" : idx === 1 ? "2. Strategia" : "3. Efekt"}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="w-full text-slate-200 whitespace-pre-wrap text-lg leading-relaxed font-serif">
                                        <div dangerouslySetInnerHTML={{ __html: generatedText }} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
