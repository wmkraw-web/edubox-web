                return 'Jesteś doświadczonym trenerem TUS (trening umiejętności społecznych) w szkole. Przygotuj praktyczny scenariusz zajęć grupowych (45 minut, grupa 4–8 uczniów) na podany problem. Zwróć WYŁĄCZNIE HTML (h2, h3, p, ul, li, table, thead, tbody, tr, th, td, strong; bez Markdown). Układ: <h2>temat</h2>; krótka metryczka (cel główny, 2–3 cele operacyjne – co uczestnicy zrobią, wiek, potrzebne materiały); tabela przebiegu: Etap | Czas | Co robi prowadzący i uczestnicy (konkretne polecenia i pytania); etapy: powitanie i rundka, przypomnienie zasad grupy, psychoedukacja (krótko, z przykładem), modelowanie umiejętności krok po kroku, scenki – 2–3 sytuacje z podziałem ról i pytaniami do omówienia, informacja zwrotna (najpierw co się udało), relaksacja lub wyciszenie, zadanie na tydzień (zastosowanie umiejętności w realnej sytuacji), pożegnanie. Na końcu <h3>Wskazówki dla prowadzącego</h3>: jak dostosować zajęcia dla uczniów z autyzmem lub ADHD i jak reagować na trudne zachowania w grupie.';
            }
            if (module === 'rodzice') {
                return 'Jesteś wychowawcą, który pisze do rodziców spokojnie, życzliwie i konkretnie. Zamień notatki nauczyciela na wiadomość do e-dziennika: powitanie (\"Szanowni Państwo\"), najpierw konkretna mocna strona dziecka, potem opis sytuacji jako faktów bez ocen i etykiet (co, kiedy, jak często), zaproszenie do współpracy z propozycją konkretnego kroku (rozmowa, wspólne ustalenia, termin), ciepłe zakończenie i podpis [imię i nazwisko nauczyciela]. Komunikacja bez przemocy (NVC), metoda kanapki, maks. 150 słów, bez diagnoz i bez danych innych uczniów. Pisz w czasie teraźniejszym lub bezosobowo (np. „zauważam”, „proponuję”), żeby nie zakładać płci nauczyciela. Zwróć tylko gotowy tekst wiadomości.';
            }
            return "Jesteś ekspertem edukacyjnym.";
        };

        const extractTextFromPDF = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let text = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const strings = content.items.map(item => item.str);
                            text += strings.join(" ") + "\n";
                        }
                        resolve(text);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        };

            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setLoadingMsg('Analizuję przesłane pliki (PDF/TXT)...');
                setIsGenerating(true);
                setError('');
                
                let combinedText = "";
                try {
                    for (const file of files) {
                        if (file.type === "text/plain") {
                            const text = await file.text();
                            combinedText += `\n[PLIK TXT: ${file.name}]\n${text}\n`;

            };

            const handleGenerate = async () => {
                if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {

                    return;
                }

                if (activeModule !== 'dokumenty' && activeModule !== 'wwrd' && !genericInput.trim()) { setError("Wpisz temat lub problem w puste pole!"); return; }
                
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setError('');
                setGeneratedText('');
                setGeneratedImages([]);
                setDocMeta(null);
                setStreamStart(Date.now());
                setElapsed(0);
                setLoadingMsg('Analizuję zapytanie i piszę treść...');

                // Dokumenty SPE i WWRD: strumień – tekst pojawia się po 2–3 s i dopisuje się na bieżąco.
                if (activeModule === 'dokumenty' || activeModule === 'wwrd') {
                    const currentDoc = activeModule === 'wwrd' ? wwrdDocType : docType;
                    const prompt = AD.buildUserPrompt(activeModule === 'wwrd'
                        ? { module: 'wwrd', docType: currentDoc, ageGroup: wwrdAgeGroup, diagnoza, mocneStrony, trudnosci, cel: wwrdCel, customHeaders: naglowki, files: uploadedFilesText }
                        : { module: 'dokumenty', docType: currentDoc, etap, klasa, oddzial, orzeczenie, plec, diagnoza, mocneStrony, trudnosci, customHeaders: naglowki, files: uploadedFilesText });
                    const started = Date.now();
                    setStreamStart(started);
                    setElapsed(0);
                    setIsStreaming(true);
                    setLoadingMsg('Łączę się z AI…');
                    let firstChunk = true;
                    try {
                        const result = await DT.streamChat({
                            system: getSystemPrompt(activeModule, currentDoc, naglowki, formatLength, wwrdAgeGroup),
                            prompt,
                            temperature: 0.4,
                            model: STRONG_DOCS.includes(currentDoc) ? 'strong' : 'balanced',
                            verbosity: formatLength === 'zwiezle' ? 'low' : undefined
                        }, (text) => {
                            setGeneratedText(text);
                            if (firstChunk && text.trim()) {
                                firstChunk = false;
                                setIsGenerating(false);
                                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
                            }
                        });
                        if (!result.text.trim()) throw new Error('AI nie zwróciło treści. Spróbuj ponownie za chwilę.');
                        setGeneratedText(result.text);
                        setDocMeta({ module: activeModule, docType: currentDoc, interrupted: result.interrupted });
                        if (activeModule === 'wwrd' && wwrdSelectedChildId) {
                            const docLabel = WWRD_DOC_TYPES.find(d => d.id === currentDoc)?.label || currentDoc;
                            const entryDate = new Date().toISOString().split('T')[0];
                            setWwrdChildren(prev => prev.map(c => c.id === wwrdSelectedChildId
                                ? { ...c, history: [...(c.history || []), { date: entryDate, docType: currentDoc, label: docLabel }] }
                                : c
                            ));
                        }
                        try { if (typeof window.gtag === 'function') window.gtag('event', 'dokument_spe', { doc_type: currentDoc, seconds: Math.round((Date.now() - started) / 1000) }); } catch (e) {}
                    } catch (err) {
                        setError('Błąd: ' + err.message);
                    } finally {
                        setIsStreaming(false);
                        setIsGenerating(false);
                        setLoadingMsg('');
                    }
                    return;
                }

                try {
                    let finalPrompt = "";
                    if (activeModule === 'rymowanki') {
                        finalPrompt = `Napisz rymowankę edukacyjną dla dzieci na temat: ${genericInput}`;
                    } else if (activeModule === 'historyjki') {

                    } else if (activeModule === 'tus') {

                    const textPayload = {
                        system: getSystemPrompt(activeModule, docType, naglowki, formatLength, wwrdAgeGroup),
                        prompt: finalPrompt,
                        temperature: 0.4,
                        // Modele dobrane w testach 6.10.2026: rymy po polsku najlepiej pisze mocny model (krótki tekst = koszt

                        model: activeModule === 'rymowanki' ? 'strong' : (activeModule === 'tus' || activeModule === 'historyjki') ? 'balanced' : undefined
                    };

                    // Strumień: tekst widać od razu, a tryb "strong" (rymowanki) dostaje najmocniejszy model.
                    const streamed = await DT.streamChat(textPayload, (partial) => {

                    let cleanText = streamed.text || "";

                    setGeneratedText(cleanText);
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                    // OBIEG DLA OBRAZKÓW W HISTORYJKACH
                    if (activeModule === 'historyjki') {
                        const imgProStatus = localStorage.getItem('eduboxProStatus');
                        const imgIsPro = imgProStatus === 'PRO' || imgProStatus === 'active' || isPro;
                        if (!imgIsPro) {
                            const todayImg = new Date().toISOString().split('T')[0];
                            let imgUsage = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                            const imgCount = (imgUsage.date === todayImg) ? imgUsage.count : 0;
                            if (imgCount >= 2) {
                                setLoadingMsg('');
                                setError('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący, by generować dalej!');

                                return;
                            }
                        }
                        // Opisy scen powstają z GOTOWEJ historyjki (3 akapity: sytuacja, co mogę zrobić, jak będzie dobrze),
                        // więc obrazki pokazują dokładnie to, o czym czyta dziecko.
                        setLoadingMsg('Przygotowuję opisy 3 obrazków do historyjki...');
                        const storyPlain = DT.plainText(cleanText).slice(0, 2500);
                        let imagePromptsArray = [];
                        try {
                            const promptPayload = {
                                system: 'You write scene descriptions for the illustrator of a social story (Carol Gray) for autistic children. Return JSON: {"character": "...", "prompts": ["...", "...", "..."]}.',
                                prompt: `Social story (Polish):
"""${storyPlain}"""

Teacher's note (may say the child's gender or age): ${genericInput.slice(0, 400)}

Create:
- "character": ONE precise English description of the child telling the story (age 6–9 unless the story says otherwise; gender only if the story or the teacher's note makes it clear, otherwise a gender-neutral child; hair, skin tone, exact clothes with colours).
- "prompts": 3 English scene descriptions matching the 3 paragraphs: 1) the situation, 2) what I can do (show the coping step clearly), 3) the calm, positive outcome. Each starts with the character description word for word, then ONE clear action, the child's facial expression and the place. Simple, literal, uncluttered scenes. No text.`,
                                format: "json",
                                temperature: 0.2
                            };

                            const promptRes = await fetch('/api/chat', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(promptPayload)
                            });

                            const promptData = await promptRes.json();
                            let pText = promptData.text || "[]";
                            pText = pText.replace(/```json/gi, '').replace(/```/g, '').trim();
                            let parsed = JSON.parse(pText);

                            if (parsed.prompts && Array.isArray(parsed.prompts) && parsed.prompts.length >= 3) {
                                imagePromptsArray = parsed.prompts.slice(0, 3);
                            } else if (Array.isArray(parsed) && parsed.length >= 3) {
                                imagePromptsArray = parsed.slice(0, 3);
                            } else {
                                throw new Error("AI nie zwróciło 3 opisów obrazków.");
                            }
                        } catch(err) {
                            imagePromptsArray = [
                                `A 7-year-old child in a yellow sweater and blue trousers in this situation: ${genericInput}. Slightly worried expression.`,
                                `A 7-year-old child in a yellow sweater and blue trousers calmly using a coping strategy (deep breath, asking an adult for help) in this situation: ${genericInput}.`,
                                `A 7-year-old child in a yellow sweater and blue trousers smiling and calm after the situation: ${genericInput}.`
                            ];
                        }

                        // Prosty, spokojny styl (czytelny dla dzieci w spektrum). Obrazek 1 = wzór wyglądu dziecka dla 2. i 3.
                        const STORY_STYLE = '. Simple calm flat illustration for a social story for autistic children: clean outlines, soft muted colours, plain light background, only the elements needed, clear facial expression. ABSOLUTELY NO TEXT, NO LETTERS, NO WORDS.';
                        const drawStoryImage = async (scene, referenceUrl) => {
                            try {
                                const imgRes = await fetch('/api/generate', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt: scene + STORY_STYLE, aspect_ratio: '1:1', ...(referenceUrl && /^https:\/\//.test(referenceUrl) ? { reference_image: referenceUrl } : {}) })
                                });
                                if (!imgRes.ok) return null;
                                const imgData = await imgRes.json();
                                return imgData.imageUrl || null;
                            } catch (imgError) { console.error("Błąd obrazka historyjki", imgError); return null; }
                        };
                        setLoadingMsg('Rysuję 1. obrazek – wzór wyglądu dziecka...');
                        const firstImage = await drawStoryImage(imagePromptsArray[0]);
                        setLoadingMsg('Rysuję 2. i 3. obrazek z tym samym dzieckiem...');
                        const otherImages = await Promise.all([drawStoryImage(imagePromptsArray[1], firstImage), drawStoryImage(imagePromptsArray[2], firstImage)]);
                        // Pozycje zostają (1–3 odpowiadają akapitom), nieudany obrazek pokazuje się jako pusta ramka.
                        const newImages = [firstImage, ...otherImages].some(Boolean) ? [firstImage, ...otherImages] : [];

                        if(newImages.length > 0) {
                            setGeneratedImages(newImages);
                            if (!imgIsPro) {
                                const todayImg2 = new Date().toISOString().split('T')[0];
                                let imgUsage2 = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                                const newImgCount = (imgUsage2.date === todayImg2 ? imgUsage2.count : 0) + 1;
                                localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: todayImg2, count: newImgCount }));
                            }
                        }
                    }

                } catch (err) {
                    setError('Błąd: ' + err.message);

                    setLoadingMsg('');

            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz wzór, podaj jego tytuł!");

                try {

                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'asystent_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            module: activeModule,
                            docType: activeModule === 'dokumenty' ? docType : (activeModule === 'wwrd' ? wwrdDocType : null),

                        });

                                                    ))}
                                                </div>
                                                <div className="text-xs text-slate-400 bg-slate-800/60 border border-amber-500/30 rounded-xl p-3 flex items-start gap-2">
                                                    <i className="ph-bold ph-info text-amber-400 text-base mt-0.5"></i>
                                                    <span>Dokumenty WWRD (Diagnoza Funkcjonalna, IPWW, Arkusz Obserwacji, Ocena Efektywności) również nie mają jednego obowiązkowego wzoru urzędowego - liczy się wymagana treść, formularz ustala zespół wczesnego wspomagania. Przykładowe wzory do pobrania: <a href="edudruki.html" className="underline text-amber-300 hover:text-amber-200">Baza Druków</a>.</span>
                                                </div>

                                                <div className="card-bg p-3 rounded-2xl">
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Wiek dziecka</label>
                                                    <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                                                        {WWRD_AGE_GROUPS.map(ag => (
                                                            <button key={ag.id} onClick={() => setWwrdAgeGroup(ag.id)} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors ${wwrdAgeGroup === ag.id ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>{ag.label}</button>
                                                        ))}
                                                    </div>
                                                    <p className="text-[10px] text-slate-500 mt-2">Wiek wpływa na dobór metod, aktywności i język dokumentu.</p>
                                                </div>

                                                <div className="card-bg p-3 rounded-2xl">
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Poziom szczegółowości dokumentu</label>
                                                    <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                                                        <button onClick={() => setFormatLength('zwiezle')} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors ${formatLength === 'zwiezle' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>Zwięzły</button>
                                                        <button onClick={() => setFormatLength('epic')} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors ${formatLength === 'epic' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>Pełny</button>
                                                    </div>
                                                    <p className="text-[10px] text-slate-500 mt-2">„Pełny” – kompletny dokument dla zespołu (ok. 1–2 min pisania). „Zwięzły” – te same sekcje w krótszej formie.</p>
                                                </div>

                                                <div className="mt-4">
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Własne pliki do analizy (PDF, TXT)</label>
                                                    <div className="upload-box relative">
                                                        <input type="file" multiple accept=".pdf,.txt" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                        <div className="flex flex-col items-center gap-2 text-slate-400">
                                                            <span className="text-2xl">📂</span>
                                                            <span className="text-sm font-bold text-white">Kliknij lub upuść opinię poradni / wcześniejszy IPWW tutaj</span>
                                                            <span className="text-xs">AI uwzględni ich treść w dokumencie. Przed wgraniem usuń z pliku imię, nazwisko, PESEL i adres dziecka.</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-sky-400 uppercase tracking-wider block mb-2">Cel zajęć / temat do opracowania</label>
                                                    <textarea value={wwrdCel} onChange={(e) => setWwrdCel(e.target.value)} placeholder="Np. rozwijanie komunikacji, praca nad chwytem pęsetkowym, tolerancja bodźców dotykowych..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-sky-900/30 focus:border-sky-500"></textarea>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Rozpoznanie / orzeczenie dziecka</label>
                                                        <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} placeholder="Np. opóźniony rozwój psychoruchowy, MPD, zespół Downa..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none"></textarea>
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-2">Wzór (Szablon)</label>
                                                        <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} placeholder="Wklej puste nagłówki z druczku placówki..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none border-amber-900/50 focus:border-amber-500"></textarea>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-2">Mocne strony dziecka</label>
                                                    <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} placeholder="W czym dziecko jest dobre, co lubi..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-emerald-900/30 focus:border-emerald-500"></textarea>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-rose-400 uppercase tracking-wider block mb-2">Trudności / obszary wymagające wsparcia</label>
                                                    <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} placeholder="Z czym dziecko ma trudności..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-rose-900/30 focus:border-rose-500"></textarea>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Opisz temat lub problem</label>
                                                <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} placeholder="Opisz sytuację..." className="w-full h-48 input-bg rounded-2xl p-5 text-base resize-none"></textarea>
                                            </div>
                                        )}

                                        {error && <div className="mt-6 p-5 bg-red-900/20 border border-red-500/30 rounded-2xl text-red-400 text-sm font-medium">⚠️ {error}</div>}

                                        <div className="mt-8">
                                            <button onClick={handleGenerate} disabled={isGenerating || (!isPro && limitData.remaining === 0)} className="btn-red px-10 py-5 rounded-2xl font-black text-lg w-full sm:w-auto flex items-center justify-center gap-3 shadow-lg btn-bounce">
                                                {isGenerating ? <><svg className="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> {loadingMsg}</> : `✨ GENERUJ MATERIAŁ`}
                                            </button>
                                        </div>
                                    </div>
                                ) : null}

                                {isGenerating && !generatedText && (
                                    <div className="max-w-2xl mx-auto mt-10 card-bg rounded-3xl p-10 text-center print-hidden fade-in">
                                        <svg className="animate-spin h-10 w-10 text-rose-500 mx-auto mb-5" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        <h3 className="text-xl font-black text-white mb-2">{isDocModule ? 'Przygotowuję dokument…' : 'Generuję materiał…'}</h3>
                                        <p className="text-slate-400 text-sm">{loadingMsg}</p>
                                        {isDocModule && <p className="text-slate-500 text-xs mt-4 leading-relaxed">AI najpierw porządkuje Twoje dane, a po kilku sekundach dokument zacznie się pojawiać i dopisywać na bieżąco. Pełny IPET lub opinia to ok. 1–2 minuty pisania.</p>}
                                        <p className="text-slate-600 text-xs font-mono mt-4">{elapsed} s</p>
                                    </div>
                                )}

                                {generatedText && isDocModule && (
                                    <div ref={resultRef} className="max-w-5xl mx-auto fade-in pb-10">
                                        <div className="print-hidden sticky top-16 z-20 bg-[#020617]/95 backdrop-blur border-b border-slate-800 py-3 mb-6 flex flex-col lg:flex-row lg:items-center gap-3 justify-between">
                                            <div className="text-white font-black text-lg flex items-center gap-2">
                                                {isStreaming
                                                    ? <><svg className="animate-spin h-5 w-5 text-rose-500" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Piszę dokument… <span className="text-xs text-slate-500 font-mono font-normal">{elapsed} s</span></>
                                                    : <>📄 {docTitle} – gotowe</>}
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={handleCopyDoc} disabled={isStreaming} className="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-white px-4 py-2.5 rounded-xl text-sm font-bold border border-slate-600 transition-colors">{copied ? '✅ Skopiowano' : '📋 Kopiuj'}</button>
                                                <button onClick={handleDocx} disabled={isStreaming || docxBusy} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-colors">{docxBusy ? '⏳ Przygotowuję…' : '📝 Pobierz Word (.docx)'}</button>
                                                <button onClick={handlePrintDoc} disabled={isStreaming} className="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-white px-4 py-2.5 rounded-xl text-sm font-bold border border-slate-600 transition-colors">🖨️ Drukuj / PDF</button>
                                                <button onClick={() => setShowPublishModal(true)} disabled={isStreaming} className="bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-slate-900 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors">Udostępnij jako wzór</button>
                                                <button onClick={resetForm} disabled={isStreaming} className="btn-red px-4 py-2.5 rounded-xl text-sm font-bold">✏️ Zmień dane</button>
                                            </div>
                                        </div>

                                        {docMeta && !isStreaming && (
                                            <div className="print-hidden grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                                {docCheck && (
                                                    <div className="card-bg rounded-2xl p-4">
                                                        <div className={`font-bold text-sm mb-2 ${docCheck.okCount === docCheck.items.length ? 'text-emerald-400' : 'text-amber-300'}`}>
                                                            {docCheck.okCount === docCheck.items.length ? '✅' : '⚠️'} {docCheck.label}: {docCheck.okCount}/{docCheck.items.length}
                                                        </div>
                                                        <ul className="text-xs text-slate-400 space-y-1">
                                                            {docCheck.items.map(it => <li key={it.name}>{it.ok ? '✓' : '✗ brak sekcji –'} {it.name}</li>)}
                                                        </ul>
                                                    </div>
                                                )}
                                                <div className="card-bg rounded-2xl p-4">
                                                    <div className="font-bold text-sm mb-2 text-amber-300">🟨 Do uzupełnienia: {placeholderCount} {placeholderCount === 1 ? 'miejsce' : (placeholderCount % 10 >= 2 && placeholderCount % 10 <= 4 && (placeholderCount % 100 < 12 || placeholderCount % 100 > 14)) ? 'miejsca' : 'miejsc'}</div>
                                                    <p className="text-xs text-slate-400 leading-relaxed">Zaznaczyliśmy je na żółto – możesz je uzupełnić od razu na kartce (kliknij w tekst), a zmiany trafią do pliku Word i wydruku. Uzupełnij dane (daty, numer orzeczenia, wymiar godzin ustalony przez dyrektora), a przed podpisaniem omów treść z zespołem.</p>
                                                    {activeModule === 'dokumenty' && !localName && (
                                                        <div className="mt-3 flex gap-2">
                                                            <input type="text" value={localName} onChange={(e) => setLocalName(e.target.value)} placeholder="Imię i nazwisko – wstawimy lokalnie" autoComplete="off" className="flex-1 input-bg rounded-lg p-2 text-xs" />
                                                        </div>
                                                    )}
                                                </div>
                                                {docMeta.interrupted && (
                                                    <div className="md:col-span-2 bg-red-900/30 border border-red-500/40 rounded-2xl p-4 text-sm text-red-300">⚠️ Połączenie zostało przerwane – dokument może być niepełny. Kliknij „Zmień dane” i wygeneruj go ponownie.</div>
                                                )}
                                            </div>
                                        )}
                                        {error && <div className="print-hidden mb-6 p-5 bg-red-900/20 border border-red-500/30 rounded-2xl text-red-400 text-sm font-medium">⚠️ {error}</div>}

                                        <div ref={paperRef} contentEditable={!isStreaming} suppressContentEditableWarning={true} className={`doc-paper outline-none focus:ring-2 focus:ring-rose-400 ${isStreaming ? 'doc-caret' : ''}`} dangerouslySetInnerHTML={{ __html: window.EduBoxCore.sanitizeHtml(docHtml) }} />

                                        <p className="print-hidden text-xs text-slate-500 max-w-3xl mx-auto mt-6 text-center leading-relaxed">Dokument przygotowany z pomocą AI na podstawie Twoich notatek. Przed podpisaniem sprawdź treść z zespołem, uzupełnij pola zaznaczone na żółto i dopasuj zapisy do ustaleń placówki. Podstawy prawne sprawdzone w ISAP {AD.CHECKED} – <a href="przepisy-i-rodo.html" className="underline">lista przepisów</a>.</p>
                                    </div>
                                )}

                                {generatedText && !isDocModule && (
                                    <div ref={resultRef} className="max-w-5xl fade-in pb-10 mt-6">
                                        <div className="flex flex-col sm:flex-row items-center justify-between mb-8 print-hidden border-b border-slate-800 pb-6 gap-4">
                                            <h2 className="text-3xl font-black text-white">Gotowy Materiał</h2>
                                            <div className="flex flex-wrap gap-3 w-full sm:w-auto justify-center">
                                                <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-6 py-3 rounded-xl text-sm font-bold shadow-md flex items-center justify-center gap-2 btn-bounce"><Icon name="Share" size={16}/> Jako Wzór</button>
                                                <button onClick={() => copyToClipboard(DT.plainText(generatedText))} className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-sm font-bold border border-slate-600 transition-colors flex items-center justify-center gap-2 btn-bounce">📋 Kopiuj</button>
                                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-sm font-bold border border-slate-600 transition-colors flex items-center justify-center gap-2 btn-bounce">🖨️ Drukuj</button>
                                                <button onClick={resetForm} className="btn-red px-6 py-3 rounded-xl text-sm font-bold shadow-md btn-bounce">Wróć</button>
                                            </div>
                                        </div>

                                        <div className="card-bg p-8 sm:p-14 rounded-[2rem] print-area flex flex-col gap-8 shadow-2xl">
                                            {activeModule === 'historyjki' && generatedImages.length > 0 && (
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full print-images-grid mb-6">
                                                    {generatedImages.map((img, idx) => (
                                                        <div key={idx} className="flex flex-col items-center fade-in bg-slate-900/30 p-4 rounded-3xl border border-slate-800">
                                                            {img ? (
                                                                <img src={img} alt={`Ilustracja ${idx + 1}`} className="w-full aspect-square object-cover rounded-2xl border border-slate-700 shadow-md" />
                                                            ) : (
                                                                <div className="w-full aspect-square rounded-2xl border-2 border-dashed border-slate-600 flex items-center justify-center text-center text-slate-500 text-sm p-4">Ten obrazek się nie udał – wygeneruj historyjkę ponownie.</div>
                                                            )}
                                                            <p className="text-center text-xs text-white mt-4 font-black uppercase tracking-widest bg-blue-600 px-5 py-2 rounded-full shadow-lg">{idx === 0 ? "1. Sytuacja" : idx === 1 ? "2. Co mogę zrobić" : "3. Jak będzie dobrze"}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="w-full text-slate-200 whitespace-pre-wrap text-lg leading-relaxed font-serif">
                                                <div dangerouslySetInnerHTML={{ __html: window.EduBoxCore.sanitizeHtml(generatedText) }} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out] max-w-7xl mx-auto">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Baza Wzorów</h2>
                                    <p className="text-slate-400">Udostępnione przez innych nauczycieli szablony, opinie i historyjki.</p>
                                </div>
                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">📚</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Wygeneruj dokument w Kreatorze i opublikuj go jako pierwszy!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-amber-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[500px]">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-indigo-500/20 text-indigo-400">
                                                        {item.module} {item.docType ? `(${item.docType})` : ''}
                                                    </span>
                                                </div>
                                                <h3 className="text-lg font-bold text-white mb-4">{item.title}</h3>
                                                <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar font-serif">
                                                    <div dangerouslySetInnerHTML={{ __html: window.EduBoxCore.sanitizeHtml(item.content) }} />
                                                </div>
                                                <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                    <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                        <Icon name="Copy" size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
