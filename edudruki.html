    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 shadow-lg print-hidden bg-slate-900 border-b border-slate-800 p-4 fixed top-0">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">

                            <span class="text-xs text-amber-500 font-bold">Menu Awaryjne</span>
                        </div>
                    </nav>
                `;
            }
            try {
                fetch('/menu.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Błąd ładowania menu');
                        return response.text();
                    })
                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(error => wstawMenuAwaryjne());
            } catch (error) { wstawMenuAwaryjne(); }
        });
    </script>

        function loadWlasne() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                console.warn('Nie udało się odczytać własnych druków z localStorage.', e);
                return [];
            }
        }

        function saveWlasne(list) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            } catch (e) {
                console.warn('Nie udało się zapisać własnych druków w localStorage (być może brak miejsca).', e);
                alert('Nie udało się zapisać danych w przeglądarce - być może limit pamięci lokalnej został przekroczony.');
            }
        }

        function formatujDate(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleDateString('pl-PL', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (e) {
                return iso;
            }
        }

        const TabButton = ({ active, onClick, icon, label, count, colorClass }) => (
            <button
                onClick={onClick}
                className={`btn-bounce flex items-center gap-2 px-4 py-3 rounded-xl font-bold text-sm transition-all border ${active ? `bg-slate-800 border-slate-600 ${colorClass}` : 'bg-transparent border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'}`}

            </button>
        );

        function KartaUrzedowa({ druk }) {
            return (
                <div className="card-bg rounded-2xl p-6 flex flex-col fade-in">
                    <div className="flex items-start gap-3 mb-3">
                        <i className="ph-fill ph-seal-check text-emerald-500 text-2xl shrink-0 mt-0.5"></i>
                        <h3 className="font-bold text-slate-100 leading-snug">{druk.name}</h3>
                    </div>
                    <p className="text-sm text-slate-400 leading-relaxed flex-1">{druk.desc}</p>
                    <p className="text-xs italic text-slate-500 mt-4 border-t border-slate-800 pt-3">{druk.legalBasis}</p>
                    <a
                        href={druk.link}
                        target="_blank"
                        rel="noopener"
                        className="btn-bounce mt-4 inline-flex items-center justify-center gap-2 text-sm font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-4 py-2.5 hover:bg-emerald-500/20 transition-colors"
                    >
                        <i className="ph-bold ph-arrow-square-out"></i>
                        Otwórz źródło
                    </a>
                </div>
            );
        }

        function KartaProponowana({ druk }) {
            return (
                <div className="card-bg rounded-2xl p-6 flex flex-col fade-in">
                    <div className="flex items-start gap-3 mb-3">
                        <i className="ph-fill ph-file-text text-blue-500 text-2xl shrink-0 mt-0.5"></i>
                        <h3 className="font-bold text-slate-100 leading-snug">{druk.name}</h3>
                    </div>
                    <p className="text-xs italic text-slate-500 leading-relaxed">{druk.legalBasis}</p>
                    <div className="mt-3 flex-1 bg-blue-500/5 border border-blue-500/20 rounded-lg p-3 text-xs text-blue-200/90 leading-relaxed">
                        <i className="ph-bold ph-info mr-1 text-blue-400"></i>{druk.note}
                    </div>
                    <a
                        href={druk.file}
                        download
                        className="btn-bounce mt-4 inline-flex items-center justify-center gap-2 text-sm font-bold text-blue-400 bg-blue-500/10 border border-blue-500/30 rounded-lg px-4 py-2.5 hover:bg-blue-500/20 transition-colors"
                    >
                        <i className="ph-bold ph-download-simple"></i>
                        Pobierz wzór (.docx)
                    </a>
                </div>
            );
        }

        function KartaWlasna({ druk, onDelete }) {
            const handlePobierz = () => {
                if (druk.source === 'file' && druk.fileDataUrl) {
                    const a = document.createElement('a');
                    a.href = druk.fileDataUrl;
                    a.download = druk.fileName || druk.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };
            return (
                <div className="card-bg rounded-2xl p-6 flex flex-col fade-in">
                    <div className="flex items-start gap-3 mb-3">
                        <i className="ph-fill ph-folder-user text-amber-500 text-2xl shrink-0 mt-0.5"></i>
                        <h3 className="font-bold text-slate-100 leading-snug flex-1">{druk.name}</h3>
                    </div>
                    {druk.description ? (
                        <p className="text-sm text-slate-400 leading-relaxed flex-1">{druk.description}</p>
                    ) : (
                        <div className="flex-1"></div>
                    )}
                    <p className="text-xs text-slate-500 mt-3">Dodano: {formatujDate(druk.addedAt)}</p>
                    <div className="mt-4 flex items-center gap-2">
                        {druk.source === 'file' ? (
                            <button
                                onClick={handlePobierz}
                                className="btn-bounce flex-1 inline-flex items-center justify-center gap-2 text-sm font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-lg px-4 py-2.5 hover:bg-amber-500/20 transition-colors"
                            >
                                <i className="ph-bold ph-download-simple"></i>
                                Pobierz plik
                            </button>
                        ) : (
                            <a
                                href={druk.linkUrl}
                                target="_blank"
                                rel="noopener"
                                className="btn-bounce flex-1 inline-flex items-center justify-center gap-2 text-sm font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-lg px-4 py-2.5 hover:bg-amber-500/20 transition-colors"
                            >
                                <i className="ph-bold ph-arrow-square-out"></i>
                                Otwórz link
                            </a>
                        )}
                        <button
                            onClick={() => onDelete(druk.id)}
                            title="Usuń wpis"
                            className="btn-bounce inline-flex items-center justify-center gap-2 text-sm font-bold text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2.5 hover:bg-red-500/20 transition-colors"

            );
        }

        function FormularzWlasny({ onZapisz, onAnuluj }) {
            const [name, setName] = useState('');
            const [description, setDescription] = useState('');
            const [zrodlo, setZrodlo] = useState('file'); // 'file' | 'link'
            const [fileName, setFileName] = useState('');
            const [fileDataUrl, setFileDataUrl] = useState('');
            const [linkUrl, setLinkUrl] = useState('');
            const [bladPliku, setBladPliku] = useState('');
            const fileInputRef = useRef(null);

            const handlePlik = (e) => {
                const plik = e.target.files && e.target.files[0];
                setBladPliku('');
                setFileName('');
                setFileDataUrl('');
                if (!plik) return;
                if (plik.size > MAX_FILE_BYTES) {
                    setBladPliku("Plik zbyt duży do zapisania lokalnie (limit 4MB) - użyj opcji 'Podaj link' zamiast tego");
                    if (fileInputRef.current) fileInputRef.current.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    setFileDataUrl(reader.result);
                    setFileName(plik.name);
                };
                reader.onerror = () => {
                    setBladPliku('Nie udało się odczytać pliku. Spróbuj ponownie lub użyj opcji "Podaj link".');
                };
                reader.readAsDataURL(plik);
            };

            const mozeZapisac = name.trim().length > 0 && !bladPliku &&
                ((zrodlo === 'file' && fileDataUrl) || (zrodlo === 'link' && linkUrl.trim().length > 0));

            const handleZapisz = () => {
                if (!mozeZapisac) return;
                const wpis = {
                    id: Date.now() + Math.random(),
                    name: name.trim(),
                    description: description.trim(),
                    source: zrodlo,
                    addedAt: new Date().toISOString()
                };
                if (zrodlo === 'file') {
                    wpis.fileName = fileName;
                    wpis.fileDataUrl = fileDataUrl;
                } else {
                    wpis.linkUrl = linkUrl.trim();
                }
                onZapisz(wpis);
            };

            return (
                <div className="card-bg rounded-2xl p-6 mb-8 fade-in">
                    <h3 className="font-black text-lg text-slate-100 mb-4 flex items-center gap-2">
                        <i className="ph-bold ph-plus-circle text-amber-500"></i>
                        Dodaj własny druk
                    </h3>
                    <div className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">Nazwa druku *</label>
                            <input
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="np. Wewnętrzny wniosek o pomoc psychologiczno-pedagogiczną"
                                className="input-bg w-full rounded-lg px-3 py-2.5 text-sm"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">Opis / kiedy używać (opcjonalnie)</label>
                            <textarea
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}
                                rows={2}
                                placeholder="Krótka notatka, np. w jakiej sytuacji ten druk się stosuje"
                                className="input-bg w-full rounded-lg px-3 py-2.5 text-sm resize-none"
                            ></textarea>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Źródło druku</label>
                            <div className="flex gap-2 mb-3">
                                <button
                                    type="button"
                                    onClick={() => setZrodlo('file')}
                                    className={`btn-bounce flex-1 flex items-center justify-center gap-2 text-sm font-bold rounded-lg px-3 py-2 border transition-colors ${zrodlo === 'file' ? 'bg-amber-500/15 border-amber-500/40 text-amber-300' : 'bg-transparent border-slate-700 text-slate-400 hover:text-slate-200'}`}
                                >
                                    <i className="ph-bold ph-upload-simple"></i>
                                    Wgraj plik
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setZrodlo('link')}
                                    className={`btn-bounce flex-1 flex items-center justify-center gap-2 text-sm font-bold rounded-lg px-3 py-2 border transition-colors ${zrodlo === 'link' ? 'bg-amber-500/15 border-amber-500/40 text-amber-300' : 'bg-transparent border-slate-700 text-slate-400 hover:text-slate-200'}`}
                                >
                                    <i className="ph-bold ph-link"></i>
                                    Podaj link
                                </button>
                            </div>
                            {zrodlo === 'file' ? (
                                <div>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept=".pdf,.doc,.docx"
                                        onChange={handlePlik}
                                        className="input-bg w-full rounded-lg px-3 py-2.5 text-sm file:mr-3 file:rounded-md file:border-0 file:bg-amber-600 file:text-white file:px-3 file:py-1.5 file:text-xs file:font-bold"
                                    />
                                    {fileName && !bladPliku && (
                                        <p className="text-xs text-emerald-400 mt-2 flex items-center gap-1"><i className="ph-bold ph-check-circle"></i> Wczytano: {fileName}</p>
                                    )}
                                    {bladPliku && (
                                        <p className="text-xs text-red-400 mt-2 flex items-center gap-1"><i className="ph-bold ph-warning-circle"></i> {bladPliku}</p>
                                    )}
                                    <p className="text-xs text-slate-500 mt-2">Plik zostaje zapisany lokalnie w przeglądarce (limit 4MB). Nie jest wysyłany na żaden serwer.</p>
                                </div>
                            ) : (
                                <div>
                                    <input
                                        type="text"
                                        value={linkUrl}
                                        onChange={(e) => setLinkUrl(e.target.value)}
                                        placeholder="np. https://drive.google.com/..."
                                        className="input-bg w-full rounded-lg px-3 py-2.5 text-sm"
                                    />
                                    <p className="text-xs text-slate-500 mt-2">Podaj link do dokumentu, np. na dysku Google/placówki.</p>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="flex items-center gap-3 mt-6">
                        <button
                            onClick={handleZapisz}
                            disabled={!mozeZapisac}
                            className="btn-bounce flex-1 inline-flex items-center justify-center gap-2 text-sm font-bold text-white bg-amber-600 rounded-lg px-4 py-2.5 hover:bg-amber-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                            <i className="ph-bold ph-floppy-disk"></i>
                            Zapisz druk
                        </button>
                        <button
                            onClick={onAnuluj}
                            className="btn-bounce inline-flex items-center justify-center gap-2 text-sm font-bold text-slate-300 bg-slate-800 rounded-lg px-4 py-2.5 hover:bg-slate-700 transition-colors"
                        >
                            Anuluj
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [tab, setTab] = useState('urzedowe');
            const [search, setSearch] = useState('');
            const [wlasne, setWlasne] = useState([]);
            const [pokazForm, setPokazForm] = useState(false);

            useEffect(() => {
                setWlasne(loadWlasne());
            }, []);

            const dodajWlasny = (wpis) => {
                const nowaLista = [wpis, ...wlasne];
                setWlasne(nowaLista);
                saveWlasne(nowaLista);
                setPokazForm(false);
            };

            const usunWlasny = (id) => {
                if (!window.confirm('Na pewno usunąć ten druk z Twojej bazy? Tej operacji nie można cofnąć.')) return;
                const nowaLista = wlasne.filter((d) => d.id !== id);
                setWlasne(nowaLista);
                saveWlasne(nowaLista);
            };

            const q = search.trim().toLowerCase();
            const urzedoweF = DRUKI_URZEDOWE.filter((d) => d.name.toLowerCase().includes(q));
            const proponowaneF = DRUKI_PROPONOWANE.filter((d) => d.name.toLowerCase().includes(q));
            const wlasneF = wlasne.filter((d) => d.name.toLowerCase().includes(q));

            return (
                <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 py-10">
                    <div className="mb-8">
                        <h1 className="text-3xl sm:text-4xl font-black text-slate-50 flex items-center gap-3">
                            <span>📁 Baza Druków</span>
                        </h1>
                        <p className="text-slate-400 mt-2">Wzory dokumentów urzędowych dla pedagoga specjalnego i nauczyciela</p>
                    </div>

                    <div className="flex items-start gap-3 bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 mb-8">
                        <i className="ph-bold ph-warning text-amber-400 text-2xl shrink-0 mt-0.5"></i>
                        <p className="text-sm text-amber-100/90 leading-relaxed">
                            Ta baza nie stanowi porady prawnej. Wzory "proponowane" to przykładowe propozycje treści zgodnej z przepisami - NIE są jednym obowiązkowym drukiem urzędowym (bo w większości przypadków taki jednolity druk po prostu nie istnieje w polskim prawie oświatowym). Zawsze sprawdzaj aktualny stan prawny i wymagania własnej placówki/organu prowadzącego.
                        </p>
                    </div>

                    <div className="relative mb-6">
                        <i className="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input
                            type="text"
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            placeholder="Szukaj druku po nazwie…"
                            className="input-bg w-full rounded-xl pl-10 pr-4 py-3 text-sm"
                        />
                    </div>

                    <div className="flex flex-wrap gap-2 mb-8">
                        <TabButton active={tab === 'urzedowe'} onClick={() => setTab('urzedowe')} icon="ph-seal-check" label="Urzędowe" count={urzedoweF.length} colorClass="text-emerald-400" />
                        <TabButton active={tab === 'proponowane'} onClick={() => setTab('proponowane')} icon="ph-file-text" label="Proponowane" count={proponowaneF.length} colorClass="text-blue-400" />
                        <TabButton active={tab === 'wlasne'} onClick={() => setTab('wlasne')} icon="ph-folder-user" label="Własne / Twojej placówki" count={wlasneF.length} colorClass="text-amber-400" />
                    </div>

                    {tab === 'urzedowe' && (
                        <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                            {urzedoweF.map((d, i) => <KartaUrzedowa key={i} druk={d} />)}
                            {urzedoweF.length === 0 && (
                                <p className="text-slate-500 text-sm col-span-full">Brak wyników dla wpisanej frazy.</p>
                            )}
                        </div>
                    )}

                    {tab === 'proponowane' && (
                        <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                            {proponowaneF.map((d, i) => <KartaProponowana key={i} druk={d} />)}
                            {proponowaneF.length === 0 && (
                                <p className="text-slate-500 text-sm col-span-full">Brak wyników dla wpisanej frazy.</p>
                            )}
                        </div>
                    )}

                    {tab === 'wlasne' && (
                        <div>
                            <div className="flex items-center justify-between mb-6">
                                <p className="text-slate-400 text-sm">Twoje własne druki są zapisywane lokalnie w tej przeglądarce (nie w chmurze).</p>
                                {!pokazForm && (
                                    <button
                                        onClick={() => setPokazForm(true)}
                                        className="btn-bounce inline-flex items-center gap-2 text-sm font-bold text-white bg-amber-600 rounded-lg px-4 py-2.5 hover:bg-amber-500 transition-colors shrink-0"
                                    >
                                        <i className="ph-bold ph-plus"></i>
                                        Dodaj własny druk
                                    </button>
                                )}
                            </div>

                            {pokazForm && (
                                <FormularzWlasny onZapisz={dodajWlasny} onAnuluj={() => setPokazForm(false)} />
                            )}

                            {wlasneF.length === 0 ? (
                                <div className="card-bg rounded-2xl p-8 text-center">
                                    <i className="ph-bold ph-folder-user text-4xl text-slate-600 mb-3 block"></i>
                                    <p className="text-slate-400 text-sm">Nie masz jeszcze żadnych własnych druków. Dodaj wzór wymagany w Twojej placówce, żeby mieć go zawsze pod ręką.</p>
                                </div>
                            ) : (
                                <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                                    {wlasneF.map((d) => <KartaWlasna key={d.id} druk={d} onDelete={usunWlasny} />)}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
