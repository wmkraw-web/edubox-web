<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBox PRO - Strona Główna</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>

    <script type="module" src="global-core.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const HeroVideoAssistant = () => {
            return (
                <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-8 rounded-2xl shadow-lg mb-8 flex flex-col md:flex-row items-center justify-between">
                    <div className="text-left mb-4 md:mb-0">
                        <h2 className="text-3xl font-extrabold mb-2 flex items-center">
                            <i className="ph-fill ph-video-camera mr-3"></i>
                            Hero Video Assistant
                        </h2>
                        <p className="text-blue-100 text-lg">Twój interaktywny asystent gotowy do pracy z materiałami wideo.</p>
                    </div>
                    <button className="bg-white text-blue-600 font-bold py-2 px-6 rounded-xl hover:bg-blue-50 transition shadow-md">
                        Uruchom
                    </button>
                </div>
            );
        };

        const OmniBot = () => {
            return (
                <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-6 rounded-2xl shadow-sm hover:shadow-md transition text-center flex flex-col items-center justify-center cursor-pointer">
                    <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mb-4">
                        <i className="ph-fill ph-robot text-4xl text-blue-600 dark:text-blue-400"></i>
                    </div>
                    <h3 className="text-xl font-bold dark:text-white">OmniBot</h3>
                    <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">Twój wszechstronny asystent AI do codziennych zadań.</p>
                </div>
            );
        };

        const AppContainer = () => {
            const [theme, setTheme] = useState('light');

            useEffect(() => {
                try {
                    if (typeof window !== 'undefined' && window.localStorage) {
                        const savedTheme = window.localStorage.getItem('edubox_theme');
                        if (savedTheme === 'dark' || savedTheme === 'light') {
                            setTheme(savedTheme);
                        }
                    }
                } catch (error) {
                    console.warn("Brak dostępu do localStorage. Używam motywu domyślnego.");
                }
            }, []);

            useEffect(() => {
                const rootHtml = document.documentElement;
                if (theme === 'dark') {
                    rootHtml.classList.add('dark');
                    document.body.classList.add('bg-gray-900', 'text-gray-100');
                    document.body.classList.remove('bg-gray-50', 'text-gray-900');
                } else {
                    rootHtml.classList.remove('dark');
                    document.body.classList.add('bg-gray-50', 'text-gray-900');
                    document.body.classList.remove('bg-gray-900', 'text-gray-100');
                }
            }, [theme]);

            const toggleTheme = () => {
                const newTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
                try { 
                    if (typeof window !== 'undefined' && window.localStorage) {
                        window.localStorage.setItem('edubox_theme', newTheme); 
                    }
                } catch(e) {}
            };

            return (
                <div className="max-w-6xl mx-auto p-6 min-h-screen flex flex-col">
                    <header className="flex justify-between items-center mb-10 pb-4 border-b border-gray-200 dark:border-gray-800">
                        <div className="flex items-center space-x-3">
                            <div className="bg-blue-600 text-white p-2 rounded-lg">
                                <i className="ph-fill ph-cube text-2xl"></i>
                            </div>
                            <h1 className="text-2xl font-black tracking-tight text-gray-900 dark:text-white">
                                EduBox <span className="text-blue-600 dark:text-blue-400">PRO</span>
                            </h1>
                        </div>
                        <button
                            onClick={toggleTheme}
                            className="p-3 bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-full hover:bg-gray-300 dark:hover:bg-gray-700 transition"
                            aria-label="Przełącz motyw"
                        >
                            {theme === 'light' ? <i className="ph-fill ph-moon text-xl"></i> : <i className="ph-fill ph-sun text-xl"></i>}
                        </button>
                    </header>

                    <main className="flex-grow">
                        <HeroVideoAssistant />
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <OmniBot />
                            
                            <a href="edudetox.html" className="block bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-6 rounded-2xl shadow-sm hover:shadow-md transition text-center flex flex-col items-center justify-center group">
                                <div className="w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <i className="ph-fill ph-shield-check text-4xl text-green-500"></i>
                                </div>
                                <h3 className="text-xl font-bold dark:text-white">EduDetox AI</h3>
                                <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">Wsparcie w komunikacji z rodzicami i certyfikaty przetrwania.</p>
                            </a>
                            
                            <div className="bg-transparent border-2 border-dashed border-gray-300 dark:border-gray-700 p-6 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 hover:border-blue-500 transition cursor-pointer min-h-[200px]">
                                <i className="ph ph-plus text-4xl mb-2"></i>
                                <span className="font-semibold">Dodaj nową aplikację</span>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppContainer />);
    </script>
</body>
</html>
