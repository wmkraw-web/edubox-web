<head>

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {

            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="apps.js"></script>

    <style>
        body { 
            scroll-behavior: smooth; overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .reveal { opacity: 0; transform: translateY(30px); animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        .hero-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; z-index: -1; pointer-events: none;
        }
        .aura-blob {
            position: absolute; filter: blur(100px); border-radius: 50%; opacity: 0.4; 
            animation: float 20s ease-in-out infinite alternate;
        }
        .dark .aura-blob { opacity: 0.25; }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.8) 0%, rgba(0,0,0,0) 70%); }
        .aura-2 { top: 20%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(168,85,247,0.6) 0%, rgba(0,0,0,0) 70%); animation-delay: -5s; }
        .aura-3 { bottom: -20%; left: 20%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(0,0,0,0) 70%); animation-delay: -10s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";

        // ==========================================
        // ODCZYT BAZY DANYCH (Kuloodporny)
        // ==========================================
        const APPS = (typeof window !== 'undefined' && window.EduBoxData && window.EduBoxData.APPS) ? window.EduBoxData.APPS : [];
        const RECOMMENDATIONS = (typeof window !== 'undefined' && window.EduBoxData && window.EduBoxData.RECOMMENDATIONS) ? window.EduBoxData.RECOMMENDATIONS : [];

        // ==========================================
        // UTILS KOMPONENTY
        // ==========================================
        const Reveal = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`transition-all duration-1000 ease-out ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
        };

        const Counter = ({ target, duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const ref = useRef();
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.5 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            useEffect(() => {
                if (!isVisible) return;
                let start = 0;
                const increment = target / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= target) { setCount(target); clearInterval(timer); } else setCount(Math.ceil(start));
                }, 16);
                return () => clearInterval(timer);
            }, [isVisible, target, duration]);
            return <span ref={ref}>{count.toLocaleString('pl-PL')}</span>;
        };

        // ==========================================
        // OMNI-BOT AI
        // ==========================================
        const OmniBot = ({ appsData }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [inputText, setInputText] = useState('');
            const [messages, setMessages] = useState([
                { sender: 'ai', text: 'Cześć! Rozwiązuję nauczycielskie problemy. W czym Ci dzisiaj pomóc?' }
            ]);
            const messagesEndRef = useRef(null);

            const QUICK_PROMPTS = ["📄 Dokumenty i IPET", "🎲 Gra na zastępstwo", "🧩 Uczeń z autyzmem", "📝 Szybki sprawdzian"];

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isOpen]);

            const findApps = (query) => {
                const normalizedQuery = query.toLowerCase();
                const words = normalizedQuery.match(/[a-ząćęłńóśźż]+/g) || [];
                const searchWords = words.filter(w => w.length > 2 && !['jak', 'coś', 'dla', 'czy', 'masz', 'potrzebuje', 'szukam', 'jest'].includes(w));

                if (searchWords.length === 0) return [];

                const intentMap = {
                    'krzyczy': 'trudne zachowania', 'bije': 'trudne zachowania', 'agresja': 'sos', 'problem': 'sos', 'wyciszenie': 'terapia',
                    'oceny': 'ocena', 'ocenianie': 'ocena', 'świadectwo': 'ocena', 'świadectwa': 'ocena', 'półrocze': 'sprawozdanie',
                    'autyzm': 'aac', 'asperger': 'aac', 'niepełnosprawność': 'spe', 'dysleksja': 'dysleksja', 'adhd': 'dysleksja',
                    'świetlica': 'gry', 'zabawa': 'gry', 'nudzą': 'grywalizacja', 'zastępstwo': 'zastępstwo', 'okienko': 'zastępstwo',
                    'dokumenty': 'biurokracja', 'papierologia': 'biurokracja', 'papiery': 'biurokracja', 'opinia': 'ppp', 'poradnia': 'ppp',
                    'sprawdzian': 'test', 'kartkówka': 'test', 'egzamin': 'test', 'powtórzenie': 'fiszki',
                    'litery': 'napisy', 'dekoracja': 'gazetka', 'ozdoby': 'gazetka', 'napis': 'girlandy', 'napisy': 'girlandy',
                    'matma': 'matematyka', 'polski': 'czytanie', 'angielski': 'słówka', 'wycieczka': 'wycieczka', 'zgody': 'rodo',
                    'awans': 'awans', 'dorobek': 'awans', 'sprawozdanie': 'sprawozdanie'
                };

                const scoredApps = appsData.map(app => {
                    let score = 0;
                    const appContent = (app.title + " " + app.desc + " " + (app.tags||[]).join(" ")).toLowerCase();
                    
                    searchWords.forEach(word => {
                        if (appContent.includes(word)) score += 2;
                        const mappedTag = intentMap[word];
                        if (mappedTag && appContent.includes(mappedTag)) score += 3;
                        if (word.length > 4) {
                            const rootWord = word.substring(0, word.length - 2); 
                            if (appContent.includes(rootWord)) score += 1;
                        }
                    });
                    return { ...app, score };
                });

                return scoredApps.filter(app => app.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
            };

            const processUserMessage = (userMsg) => {
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInputText('');

                setTimeout(() => {
                    const matchedApps = findApps(userMsg);
                    
                    if (matchedApps.length > 0) {
                        setMessages(prev => [...prev, { sender: 'ai', text: 'Znalazłem idealne narzędzia, które rozwiążą ten problem! Wybierz jedno z poniższych:', apps: matchedApps }]);
                    } else if (userMsg.toLowerCase().includes('kawa') || userMsg.toLowerCase().includes('premium')) {
                         setMessages(prev => [...prev, { sender: 'ai', text: 'Kod Premium "KAWA2024" wyłącza limity! Możesz mnie wesprzeć stawiając wirtualną kawę ☕' }]);
                    } else {
                        setMessages(prev => [...prev, { sender: 'ai', text: 'Nie znalazłem dokładnie tego czego szukasz, ale polecam sprawdzić sekcję "Kategorie" na naszej stronie!' }]);
                    }
                }, 600);
            };

            const handleSend = () => {
                if (!inputText.trim()) return;
                processUserMessage(inputText.trim());
            };

            return (
                <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end print-hidden">
                    {isOpen && (
                        <div className="bg-white dark:bg-slate-900 w-[calc(100vw-48px)] sm:w-[380px] h-[550px] rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 mb-4 flex flex-col overflow-hidden animate-[reveal_0.2s_ease-out]">
                            <div className="bg-blue-600 p-4 flex items-center justify-between text-white shadow-md">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/20 p-2 rounded-full"><i className="ph-fill ph-robot text-2xl"></i></div>
                                    <div>
                                        <h3 className="font-bold leading-tight">EduBot AI</h3>
                                        <p className="text-[10px] text-blue-200 uppercase tracking-widest font-black flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Online</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsOpen(false)} className="text-blue-200 hover:text-white p-1 text-2xl transition-colors"><i className="ph-bold ph-x"></i></button>
                            </div>
                            
                            <div className="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50 dark:bg-slate-900/50">
                                {messages.map((msg, i) => (
                                    <div key={i} className="flex flex-col gap-2">
                                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm shadow-sm ${msg.sender === 'ai' ? 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 self-start rounded-tl-sm' : 'bg-blue-600 text-white self-end rounded-tr-sm'}`}>
                                            {msg.text}
                                        </div>
                                        
                                        {msg.apps && msg.apps.length > 0 && (
                                            <div className="flex flex-col gap-2 w-[85%] self-start mt-1">
                                                {msg.apps.map((app, appIdx) => (
                                                    <a key={appIdx} href={app.url} className="flex items-center gap-3 bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-900/50 p-2.5 rounded-xl hover:border-blue-500 dark:hover:border-blue-500 transition-colors shadow-sm group">
                                                        <div className={`w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-900 flex items-center justify-center ${app.color} group-hover:scale-110 transition-transform`}>
                                                            <i className={`ph-bold ${app.icon} text-xl`}></i>
                                                        </div>
                                                        <div className="flex-1 overflow-hidden">
                                                            <div className="font-bold text-xs text-slate-900 dark:text-white truncate">{app.title}</div>
                                                            <div className="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">{app.category}</div>
                                                        </div>
                                                        <i className="ph-bold ph-caret-right text-slate-300 dark:text-slate-600 group-hover:text-blue-500"></i>
                                                    </a>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                                <div ref={messagesEndRef} />
                            </div>
                            
                            <div className="bg-slate-50 dark:bg-slate-900/50 px-3 pb-2 flex gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap">
                                {QUICK_PROMPTS.map((prompt, idx) => (
                                    <button 
                                        key={idx} onClick={() => processUserMessage(prompt)}
                                        className="text-[10px] md:text-xs font-bold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 px-3 py-1.5 rounded-full hover:bg-blue-200 dark:hover:bg-blue-900/50 transition-colors shrink-0"
                                    >
                                        {prompt}
                                    </button>
                                ))}
                            </div>

                            <div className="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex gap-2">
                                <input 
                                    type="text" value={inputText} onChange={e => setInputText(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()} 
                                    placeholder="Napisz swój problem..." 
                                    className="flex-1 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none text-sm focus:border-blue-500 dark:focus:border-blue-500 transition-colors" 
                                />
                                <button onClick={handleSend} className="bg-blue-600 hover:bg-blue-500 text-white w-12 rounded-xl flex items-center justify-center transition-all shadow-md active:scale-95">
                                    <i className="ph-bold ph-paper-plane-right text-lg"></i>
                                </button>
                            </div>
                        </div>
                    )}
                    
                    <button onClick={() => setIsOpen(!isOpen)} className="bg-gradient-to-br from-blue-500 to-purple-600 w-16 h-16 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.5)] hover:shadow-[0_0_30px_rgba(59,130,246,0.8)] hover:scale-105 transition-all relative z-50 group border-2 border-white/20">
                        {isOpen ? <i className="ph-bold ph-x text-white text-2xl"></i> : <i className="ph-fill ph-robot text-white text-3xl animate-float"></i>}
                        {!isOpen && <div className="absolute top-0 right-0 w-4 h-4 bg-red-500 border-2 border-white dark:border-slate-900 rounded-full animate-ping"></div>}
                        {!isOpen && <div className="absolute top-0 right-0 w-4 h-4 bg-red-500 border-2 border-white dark:border-slate-900 rounded-full"></div>}
                    </button>
                </div>
            );
        };

        // ==========================================
        // GŁÓWNA ASYSTENTKA WIDEO
        // ==========================================
        const HeroVideoAssistant = () => {
            const [isMuted, setIsMuted] = useState(true);
            const videoRef = useRef(null);

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !isMuted;
                    setIsMuted(!isMuted);
                    if (isMuted) { videoRef.current.currentTime = 0; videoRef.current.play(); }
                }
            };

            return (
                <div className="relative group w-full max-w-[280px] mx-auto md:mx-0 rounded-[2rem] overflow-hidden shadow-2xl border-4 border-blue-500/50 hover:border-blue-500 transition-colors cursor-pointer bg-slate-900" onClick={toggleMute}>
                    <video 
                        ref={videoRef} src="powitanie.mp4" autoPlay loop={isMuted} muted={isMuted} playsInline 
                        className="w-full h-[450px] object-cover"
                        poster="okladka.jpg"
                    />
                    <div className="absolute top-4 left-4 bg-black/50 backdrop-blur px-3 py-1.5 rounded-full text-white text-xs font-bold flex items-center gap-2">
                        {isMuted ? <><i className="ph-bold ph-speaker-slash"></i> Kliknij by posłuchać</> : <><i className="ph-bold ph-speaker-high animate-pulse"></i> Odtwarzanie...</>}
                    </div>
                    <div className="absolute bottom-4 right-4 bg-blue-600 text-white p-3 rounded-2xl rounded-br-sm shadow-xl flex items-center gap-2 animate-bounce">
                        <span className="text-xs font-bold">Zapytaj Bota!</span>
                        <i className="ph-bold ph-arrow-right"></i>
                    </div>
                </div>
            );
        };

        // ==========================================
        // KARTA APLIKACJI
        // ==========================================
        const AppCard = ({ app, isFavorite, onToggleFavorite, onClick }) => (
            <div className="relative group h-full">
                <a href={app.url} onClick={() => onClick && onClick(app)} target={app.url.startsWith('http') ? "_blank" : "_self"} className="block h-full bg-white dark:bg-slate-900/50 rounded-[2.5rem] p-8 flex flex-col relative overflow-hidden border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300">
                    
                    {app.badge && <div className={`absolute top-0 right-0 ${app.badgeColor} text-white text-[10px] font-black px-4 py-2 rounded-bl-2xl uppercase tracking-widest z-10 shadow-md`}>{app.badge}</div>}
                    
                    <div className={`w-16 h-16 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 ${app.color} rounded-2xl flex items-center justify-center mb-8 group-hover:scale-110 transition-transform shadow-sm shrink-0`}>
                        <i className={`ph-bold ${app.icon} text-3xl`}></i>
                    </div>
                    
                    <h3 className="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mb-3 tracking-tight pr-6 leading-tight">{app.title}</h3>
                    <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-8 flex-grow">{app.desc}</p>
                    
                    <div className={`flex items-center ${app.color} font-bold text-xs uppercase tracking-widest pt-5 border-t border-slate-100 dark:border-slate-700/50 mt-auto`}>
                        Uruchom narzędzie
                        <i className="ph-bold ph-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </a>
                <button 
                    onClick={(e) => { e.preventDefault(); e.stopPropagation(); onToggleFavorite(app.url); }}
                    className={`absolute top-6 right-6 z-20 w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md transition-all hover:scale-110 shadow-md ${isFavorite ? 'text-yellow-500 bg-yellow-100 dark:bg-yellow-400/20 border-yellow-300 dark:border-yellow-400/50' : 'text-slate-400 bg-white/80 dark:bg-slate-900/80 border-slate-200 dark:border-slate-700 hover:text-yellow-500 dark:hover:text-yellow-400'}`}
                    title={isFavorite ? "Usuń z ulubionych" : "Dodaj do ulubionych"}
                >
                    <i className={`${isFavorite ? 'ph-fill' : 'ph-bold'} ph-star text-lg`}></i>
                </button>
            </div>
        );

        // ==========================================
        // MAIN APP
        // ==========================================
        function App() {
            const [theme, setTheme] = useState(() => {
                try { return window.localStorage.getItem('edubox_theme') || 'dark'; } catch(e) { return 'dark'; }
            });
            const [searchTerm, setSearchTerm] = useState('');
            const [activeCategory, setActiveCategory] = useState('all');
            
            const [recentApps, setRecentApps] = useState(() => {
                try { return JSON.parse(window.localStorage.getItem('edubox_recents')) || []; } catch(e) { return []; }
            });

            const [favorites, setFavorites] = useState(() => {
                try { return JSON.parse(window.localStorage.getItem('edubox_favorites')) || []; } catch(e) { return []; }
            });

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                try { window.localStorage.setItem('edubox_theme', theme); } catch(e) {}
            }, [theme]);

            useEffect(() => { 
                try { window.localStorage.setItem('edubox_favorites', JSON.stringify(favorites)); } catch(e) {} 
            }, [favorites]);
            
            useEffect(() => { 
                try { window.localStorage.setItem('edubox_recents', JSON.stringify(recentApps)); } catch(e) {} 
            }, [recentApps]);

            const toggleFavorite = (url) => setFavorites(prev => prev.includes(url) ? prev.filter(f => f !== url) : [...prev, url]);

            const handleAppClick = (app) => {
                setRecentApps(prev => {
                    const filtered = prev.filter(a => a.url !== app.url);
                    return [app, ...filtered].slice(0, 4);
                });
            };

            const handleSearch = (e) => {
                setSearchTerm(e.target.value);
                if(activeCategory === 'favorites' && e.target.value.length > 0) setActiveCategory('all');
            };

            const filteredApps = APPS.filter(app => {
                const matchesSearch = app.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      app.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (app.tags || []).some(t => t.toLowerCase().includes(searchTerm.toLowerCase()));
                const matchesCategory = activeCategory === 'all' || 
                                        (activeCategory === 'favorites' && favorites.includes(app.url)) || 
                                        app.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            const categoryButtons = [
                { id: 'all', label: 'Wszystkie Narzędzia', icon: 'ph-squares-four' },
                { id: 'favorites', label: 'Ulubione', icon: 'ph-star', color: 'text-yellow-500' },
                { id: 'biurokracja', label: 'Dokumenty i IPET', icon: 'ph-file-text' },
                { id: 'zajecia', label: 'Lekcje i Gry', icon: 'ph-game-controller' },
                { id: 'terapia', label: 'Terapia i SPE', icon: 'ph-heart' },
                { id: 'grafika', label: 'Grafika AI', icon: 'ph-image' }
            ];

            return (
                <div className="min-h-screen relative flex flex-col font-sans">
                    <div className="hero-glow">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        <div className="aura-blob aura-3"></div>
                    </div>

                    <nav className="fixed top-0 w-full z-[90] bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 transition-colors">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                                    <i className="ph-bold ph-graduation-cap text-white text-2xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">EduBox<span className="text-blue-600 dark:text-blue-500">AI</span></span>
                            </div>
                            
                            <div className="flex items-center gap-4 md:gap-8 text-xs font-black uppercase tracking-widest">
                                <div className="hidden md:flex items-center gap-6 text-slate-600 dark:text-slate-400">
                                    <a href="#narzedzia" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Narzędzia</a>
                                    <a href="#wideo" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Galeria</a>
                                    <a href="oferta.pdf" target="_blank" className="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 hover:text-emerald-500 transition-colors">📄 Katalog</a>
                                </div>
                                
                                <button 
                                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} 
                                    className="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-slate-700 flex items-center justify-center w-10 h-10"
                                    title="Zmień tryb"
                                >
                                    <i className={`ph-fill ${theme === 'dark' ? 'ph-sun' : 'ph-moon'} text-xl`}></i>
                                </button>
                                
                                <a href={BUY_COFFEE_LINK} target="_blank" className="hidden md:block bg-blue-600 text-white px-6 py-3 rounded-full hover:bg-blue-500 transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] active:scale-95">Postaw Kawę ☕</a>
                            </div>
                        </div>
                    </nav>

                    <header className="relative pt-32 pb-20 md:pt-48 md:pb-24 px-6 z-10">
                        <div className="max-w-7xl mx-auto flex flex-col-reverse md:flex-row items-center gap-12 md:gap-8">
                            
                            <div className="flex-1 text-center md:text-left reveal">
                                <div className="inline-flex items-center gap-2 bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-500/30 px-4 py-2 rounded-full text-[10px] font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest mb-6 md:mb-8">
                                    <i className="ph-bold ph-sparkle"></i> Ponad 50 Zintegrowanych Narzędzi AI
                                </div>
                                <h1 className="text-4xl md:text-6xl lg:text-7xl font-black text-slate-900 dark:text-white mb-6 leading-tight tracking-tight">
                                    Mniej papierów,<br/>
                                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400">więcej edukacji.</span>
                                </h1>
                                <p className="text-lg text-slate-600 dark:text-slate-400 max-w-xl mx-auto md:mx-0 mb-10 leading-relaxed">
                                    Zautomatyzuj biurokrację dzięki Sztucznej Inteligencji. Generuj oceny, scenariusze, dyplomy, fiszki i pisma urzędowe w mgnieniu oka.
                                </p>
                                
                                <div className="relative max-w-2xl group">
                                    <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full blur opacity-20 dark:opacity-30 group-hover:opacity-40 transition duration-500"></div>
                                    <div className="relative flex items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-full p-2 shadow-xl focus-within:border-blue-500 transition-colors">
                                        <i className="ph-bold ph-magnifying-glass pl-6 pr-4 text-2xl text-slate-400"></i>
                                        <input 
                                            type="text" value={searchTerm} onChange={handleSearch}
                                            placeholder="Napisz, czego dziś potrzebujesz..."
                                            className="w-full bg-transparent border-none text-slate-900 dark:text-white outline-none text-base md:text-lg py-4 placeholder-slate-400 dark:placeholder-slate-500"
                                        />
                                        <button onClick={() => document.getElementById('narzedzia').scrollIntoView({behavior: 'smooth'})} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 md:px-8 md:py-4 rounded-full font-bold transition-all shadow-lg active:scale-95 shrink-0 hidden sm:block">
                                            Szukaj
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 flex justify-center md:justify-end reveal w-full" style={{transitionDelay: '200ms'}}>
                                <HeroVideoAssistant />
                            </div>

                        </div>
                    </header>

                    <section id="narzedzia" className="max-w-[90rem] mx-auto px-6 py-20 z-10 relative border-t border-slate-200 dark:border-slate-800/50">
                        <Reveal>
                            <div className="text-center mb-10">
                                <h2 className="text-3xl md:text-4xl font-black text-slate-900 dark:text-white uppercase tracking-tighter">Pełny Katalog Aplikacji</h2>
                                <p className="text-slate-600 dark:text-slate-400 mt-4 font-medium mb-8">Zastępujemy biurokrację technologią. Od IPET-ów, przez prawo, po grafiki AI.</p>
                            </div>

                            {recentApps.length > 0 && activeCategory === 'all' && searchTerm === '' && (
                                <div className="mb-12 max-w-4xl mx-auto bg-blue-50 dark:bg-slate-900/80 p-6 rounded-3xl border border-blue-100 dark:border-slate-700">
                                    <div className="flex items-center gap-2 mb-4">
                                        <i className="ph-bold ph-clock-counter-clockwise text-blue-600 dark:text-blue-400"></i>
                                        <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">Szybki powrót</h3>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        {recentApps.map((app, idx) => (
                                            <a key={idx} href={app.url} onClick={() => handleAppClick(app)} className="flex items-center gap-3 bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-blue-400 transition-all shadow-sm group">
                                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${app.color} bg-slate-50 dark:bg-slate-900`}>
                                                    <i className={`ph-bold ${app.icon} text-xl`}></i>
                                                </div>
                                                <div className="overflow-hidden">
                                                    <p className="text-xs font-bold text-slate-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{app.title}</p>
                                                    <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{app.category}</p>
                                                </div>
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            <div className="flex flex-wrap justify-center gap-3 mb-16">
                                {categoryButtons.map(cat => (
                                    <button 
                                        key={cat.id} onClick={() => { setActiveCategory(cat.id); setSearchTerm(''); }} 
                                        className={`px-6 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all shadow-sm ${activeCategory === cat.id ? 'bg-blue-600 text-white shadow-blue-500/30 scale-105 border-blue-600' : 'bg-white dark:bg-slate-800/50 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white border border-slate-200 dark:border-slate-700'}`}
                                    >
                                        <i className={`ph-bold ${cat.icon} text-lg ${cat.color || ''}`}></i>
                                        {cat.label}
                                    </button>
                                ))}
                            </div>
                        </Reveal>

                        {filteredApps.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
                                {filteredApps.map((app, i) => (
                                    <Reveal key={app.title} delay={(i % 4) * 50}>
                                        <AppCard app={app} isFavorite={favorites.includes(app.url)} onToggleFavorite={(url) => toggleFavorite(url)} onClick={handleAppClick} />
                                    </Reveal>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-white dark:bg-slate-900/50 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-inner">
                                <i className="ph-fill ph-ghost text-6xl text-slate-300 dark:text-slate-700 mb-4 inline-block"></i>
                                <h3 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Brak wyników</h3>
                                <p className="text-slate-500 dark:text-slate-400">Nie znaleźliśmy narzędzia w wybranej kategorii.</p>
                                <button onClick={() => {setSearchTerm(''); setActiveCategory('all');}} className="mt-6 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white px-6 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-600 font-bold transition-colors">
                                    Pokaż wszystko
                                </button>
                            </div>
                        )}
                    </section>

                    <section className="max-w-[90rem] mx-auto px-6 py-24 border-t border-slate-200 dark:border-slate-800/50">
                        <Reveal>
                            <div className="text-center mb-16">
                                <h2 className="text-3xl font-black text-slate-900 dark:text-white mb-4 uppercase tracking-tighter">Przydatne na zewnątrz</h2>
                                <p className="text-slate-600 dark:text-slate-400 font-medium">Technologia AI, którą rekomendujemy do codziennej pracy.</p>
                            </div>
                        </Reveal>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
                            {RECOMMENDATIONS.map((link, i) => (
                                <Reveal key={i} delay={i * 100}>
                                    <a href={link.url} target="_blank" className="bg-white dark:bg-slate-900/50 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all flex flex-col items-center text-center group h-full">
                                        <div className="text-5xl mb-6 group-hover:scale-110 transition-transform drop-shadow-md">{link.icon}</div>
                                        <h4 className="text-xl font-bold text-slate-900 dark:text-white mb-2">{link.name}</h4>
                                        <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">{link.desc}</p>
                                    </a>
                                </Reveal>
                            ))}
                        </div>
                    </section>

                    <section id="wideo" className="py-24 bg-slate-100 dark:bg-slate-900 border-y border-slate-200 dark:border-slate-800/50 relative overflow-hidden">
                        <div className="max-w-[90rem] mx-auto px-6 relative z-10">
                            <Reveal>
                                <div className="text-center mb-16">
                                    <h2 className="text-3xl md:text-5xl font-black text-slate-900 dark:text-white mb-4 tracking-tight uppercase">Zobacz magię w akcji! 🎬</h2>
                                    <p className="text-slate-600 dark:text-slate-400 max-w-2xl mx-auto text-lg">Przekonaj się, jak w zaledwie kilkanaście sekund powstają gotowe materiały na Twoje zajęcia.</p>
                                </div>
                            </Reveal>

                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                <Reveal delay={100}><div className="bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-300 dark:border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo1.mp4" poster="https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={200}><div className="bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-300 dark:border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo2.mp4" poster="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={300}><div className="hidden lg:block bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-300 dark:border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo3.mp4" poster="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={400}><div className="hidden lg:block bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-300 dark:border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo4.mp4" poster="https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                            </div>

                            <Reveal delay={200}>
                                <div className="mt-20 pt-16 border-t border-slate-200 dark:border-slate-800/50 grid grid-cols-1 md:grid-cols-3 gap-10 text-center">
                                    <div>
                                        <div className="text-5xl font-black text-blue-600 dark:text-blue-500 mb-2 drop-shadow-sm"><Counter target={2450} />+</div>
                                        <div className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest text-xs">Zaoszczędzonych Godzin</div>
                                    </div>
                                    <div>
                                        <div className="text-5xl font-black text-purple-600 dark:text-purple-500 mb-2 drop-shadow-sm"><Counter target={15200} />+</div>
                                        <div className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest text-xs">Wygenerowanych Materiałów</div>
                                    </div>
                                    <div>
                                        <div className="text-5xl font-black text-emerald-600 dark:text-emerald-500 mb-2 drop-shadow-sm"><Counter target={100} />%</div>
                                        <div className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest text-xs">Polska Podstawa Programowa</div>
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    <section className="max-w-4xl mx-auto px-6 py-24 space-y-24 border-t border-slate-200 dark:border-slate-800/50">
                        <Reveal>
                            <div className="bg-white dark:bg-slate-900/50 p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-800 shadow-2xl text-center space-y-8 relative overflow-hidden">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-amber-500/10 blur-3xl rounded-full"></div>
                                <div className="flex justify-center gap-1 text-amber-400 text-2xl">
                                    <i className="ph-fill ph-star"></i><i className="ph-fill ph-star"></i><i className="ph-fill ph-star"></i><i className="ph-fill ph-star"></i><i className="ph-fill ph-star"></i>
                                </div>
                                <p className="text-xl md:text-2xl font-medium text-slate-800 dark:text-slate-200 italic leading-relaxed relative z-10">
                                    "Platforma EduBox to absolutny przełom. Zamiast otwierać 10 zakładek w przeglądarce, mam w jednym miejscu kreator dyplomów, prawo oświatowe, pisanie IPET-ów i świetne pomoce wizualne. Genialne narzędzie!"
                                </p>
                                <div className="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest relative z-10">— Karolina Z., Pedagog Specjalny</div>
                            </div>
                        </Reveal>

                        <article className="prose prose-slate dark:prose-invert max-w-none">
                            <h2 className="text-3xl font-black text-slate-900 dark:text-white mb-8 uppercase tracking-tighter border-l-4 border-blue-600 pl-4">AI w służbie nauczyciela</h2>
                            <p className="leading-relaxed mb-6 text-lg text-slate-700 dark:text-slate-300">
                                W EduBox AI wierzymy, że Sztuczna Inteligencja to nie konkurencja, ale <strong>supermoc w rękach nauczyciela</strong>. Nasza platforma nie powstała po to, by zastąpić Twoją pasję, ale po to, by usunąć z Twojej drogi to, co nudne i powtarzalne.
                            </p>
                            <p className="leading-relaxed mb-10 text-lg text-slate-700 dark:text-slate-300">
                                Pisanie oficjalnych opinii z poprawnym żargonem, tworzenie dopasowanych kart pracy czy podsumowań na świadectwa to zadania, w których komputer radzi sobie rewelacyjnie. Ty masz dzięki temu więcej czasu na to, co najważniejsze: na budowanie relacji z uczniami.
                            </p>
                        </article>
                    </section>

                    <footer className="bg-white dark:bg-slate-950 pt-20 pb-10 px-6 border-t border-slate-200 dark:border-slate-800 mt-auto transition-colors">
                        <div className="max-w-[90rem] mx-auto flex flex-col md:flex-row items-center justify-between gap-12">
                            <div className="text-center md:text-left flex-1 max-w-2xl">
                                <div className="text-2xl font-black tracking-tighter mb-4 uppercase text-slate-900 dark:text-white">EduBox <span className="text-blue-600">AI</span></div>
                                <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4">
                                    Projekt powstał z prawdziwej pasji i setek rozmów z Wami – nauczycielami i pedagogami. Cały czas rozwijamy EduBox AI, dodając nowe zintegrowane moduły, aby ułatwiać Wam codzienną pracę.
                                </p>
                                <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">
                                    Masz pomysł na nową aplikację?<br/>
                                    Napisz śmiało na: <a href="mailto:edubox.ai@gmail.com" className="text-blue-600 dark:text-blue-400 font-bold hover:underline">edubox.ai@gmail.com</a>
                                </p>
                            </div>
                            <div className="flex flex-col items-center gap-4 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 p-8 rounded-[2.5rem] max-w-sm text-center w-full md:w-auto shadow-xl">
                                <span className="text-[10px] font-black text-blue-600 dark:text-blue-400 uppercase tracking-[3px]">Wsparcie projektu</span>
                                <p className="text-slate-700 dark:text-slate-300 text-sm mb-2">Aby zapewnić Wam błyskawiczny dostęp do dziesiątek narzędzi i profesjonalnego API, opłacamy serwery chmurowe. Każda wirtualna kawa wspiera rozwój tego darmowego ekosystemu!</p>
                                <a href={BUY_COFFEE_LINK} target="_blank" className="bg-blue-600 w-full text-white px-10 py-4 rounded-xl font-black text-sm hover:bg-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all active:scale-95 uppercase tracking-wide">
                                    Postaw Kawę ☕
                                </a>
                            </div>
                        </div>
                        <div className="mt-20 pt-10 border-t border-slate-200 dark:border-slate-800 text-center text-[10px] font-bold text-slate-500 dark:text-slate-600 uppercase tracking-[10px]">
                            &copy; 2026 EduBox AI. Prawa Zastrzeżone.
                        </div>
                    </footer>

                    <OmniBot appsData={APPS} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
