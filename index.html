        const { useState, useEffect, useRef } = React;

        const Reveal = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`transition-all duration-1000 ease-out ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
        };

        const Counter = ({ target, duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const ref = useRef();
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.5 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            useEffect(() => {
                if (!isVisible) return;
                let start = 0;
                const increment = target / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= target) { setCount(target); clearInterval(timer); } else setCount(Math.ceil(start));
                }, 16);
                return () => clearInterval(timer);
            }, [isVisible, target, duration]);
            return <span ref={ref}>{count.toLocaleString('pl-PL')}</span>;
        };

        // ==========================================
        // KOMPONENT POWITANIA WIDEO
        // ==========================================
        const VideoGreeting = () => {
            const [isMuted, setIsMuted] = useState(true);
            const [isClosed, setIsClosed] = useState(false);
            const videoRef = useRef(null);

            if (isClosed) return null;

            const handleToggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !isMuted;
                    setIsMuted(!isMuted);
                    if (isMuted) {
                        videoRef.current.currentTime = 0; 
                        videoRef.current.play();
                    }
                }
            };

            return (
                <div className="fixed bottom-6 left-6 z-[100] flex flex-col items-start group print-hidden">
                    {!isMuted && (
                        <div className="glass-panel text-white text-xs font-medium py-3 px-4 rounded-2xl rounded-bl-sm shadow-[0_0_20px_rgba(59,130,246,0.3)] mb-3 max-w-[220px] leading-relaxed animate-[reveal_0.3s_ease-out] border border-blue-500/30">
                            "Cześć! Tu asystentka EduBox. Po prawej stronie czeka na Ciebie nasz chatbot. Jeśli masz pomysły lub potrzebujesz kontaktu, napisz na nasz email!"
                        </div>
                    )}
                    {isMuted && (
                        <div className="absolute left-[85px] top-2 bg-blue-600 text-white text-[10px] font-bold py-1.5 px-3 rounded-2xl rounded-tl-sm shadow-lg whitespace-nowrap animate-bounce pointer-events-none">
                            Kliknij i posłuchaj! 🔊
                        </div>
                    )}
                    <div className="relative">
                        <button onClick={() => setIsClosed(true)} className="absolute -top-2 -right-2 bg-slate-800 text-slate-400 hover:text-white w-6 h-6 rounded-full shadow-md flex items-center justify-center z-10 text-xs font-bold transition-colors border border-slate-600">✕</button>
                        <div onClick={handleToggleMute} className={`relative overflow-hidden shadow-2xl cursor-pointer transition-all duration-500 ease-in-out ${isMuted ? 'w-20 h-20 rounded-full border-4 border-slate-700 hover:scale-105 hover:border-blue-500' : 'w-36 h-48 rounded-2xl border-4 border-blue-500'}`}>
                            <video 
                                ref={videoRef}
                                src="powitanie.mp4" 
                                autoPlay 
                                loop={isMuted} 
                                muted={isMuted} 
                                playsInline
                                onEnded={() => {
                                    setIsMuted(true);
                                    if (videoRef.current) { videoRef.current.muted = true; videoRef.current.play(); }
                                }}
                                className="w-full h-full object-cover"
                                poster="https://images.unsplash.com/photo-1573164713988-8665fc963095?q=80&w=200&auto=format&fit=crop"
                            />
                            {isMuted && (
                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center transition-opacity hover:bg-black/60">
                                    <svg className="w-8 h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><line x1="3" y1="3" x2="21" y2="21" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // ASYSTENT EDU-BOT
        // ==========================================
        const BotAvatar = ({ className = "w-10 h-10" }) => (
            <svg viewBox="0 0 100 100" className={`${className} bot-float drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]`} xmlns="http://www.w3.org/2000/svg">
                <path d="M50 30 V15" stroke="#475569" strokeWidth="4" strokeLinecap="round"/>
                <circle cx="50" cy="12" r="6" fill="#60a5fa"/>
                <rect x="20" y="30" width="60" height="45" rx="15" fill="#1e3a8a"/>
                <rect x="28" y="40" width="44" height="25" rx="8" fill="#0f172a"/>
                <circle cx="38" cy="52" r="4" fill="#60a5fa"/>
                <circle cx="62" cy="52" r="4" fill="#60a5fa"/>
                <path d="M 45 60 Q 50 64 55 60" stroke="#60a5fa" strokeWidth="3" fill="none" strokeLinecap="round"/>
                <path d="M20 45 h-4 a4 4 0 0 0 -4 4 v4 a4 4 0 0 0 4 4 h4" fill="#3b82f6"/>
                <path d="M80 45 h4 a4 4 0 0 1 4 4 v4 a4 4 0 0 1 -4 4 h-4" fill="#3b82f6"/>
            </svg>
        );

        const EduBotChat = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ sender: 'ai', text: 'Cześć! Jestem EduBot 🤖 Twój osobisty asystent. W czym mogę pomóc? (np. dyplomy, prawo, fiszki, karty pracy)' }]);
            const [inputText, setInputText] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isOpen]);

            const handleSend = () => {
                if (!inputText.trim()) return;
                const userMsg = inputText.trim();
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInputText('');

                setTimeout(() => {
                    let response = "Zawsze chętnie pomogę! Spróbuj zapytać mnie o 'awans', 'dyplomy', 'prawo', 'fiszki', 'karty pracy' lub 'kod premium'.";
                    const lower = userMsg.toLowerCase();
                    if (lower.includes('ipet') || lower.includes('wopfu') || lower.includes('opini') || lower.includes('awans')) response = "Zdecydowanie polecam 'Kreator Awansu AI' lub 'Asystenta Pedagoga'. Napiszą dla Ciebie perfekcyjne dokumenty urzędowe!";
                    else if (lower.includes('dyplom') || lower.includes('girland')) response = "Do tworzenia pięknych dyplomów użyj 'EduGeneratora'. To nasz klasyk!";
                    else if (lower.includes('kart') || lower.includes('matematyk') || lower.includes('zadani')) response = "'EduZadania AI' stworzą dla Ciebie spersonalizowane karty pracy matematyczne, a 'EduKarty AI' pozwalają złożyć kartę pracy jak z klocków LEGO.";
                    else if (lower.includes('fiszk') || lower.includes('memory') || lower.includes('pojeci')) response = "Użyj nowej aplikacji 'EduFiszki i Memory AI'! Wklejasz tekst, a ona drukuje dla Ciebie gotowe, dwustronne fiszki do wycięcia.";
                    else if (lower.includes('kawa') || lower.includes('kod') || lower.includes('premium')) response = "Kod Premium otrzymasz stawiając wirtualną kawę twórcy! ☕ (Obecne hasło to KAWA2024)";
                    else if (lower.includes('scenariusz') || lower.includes('lekcj')) response = "Polecam nasz Kombajn: 'Scenariusz AI PRO'. Wygeneruje dla Ciebie pełny konspekt zajęć z exportem do Worda.";
                    else if (lower.includes('praw') || lower.includes('ustaw') || lower.includes('rozporzadz')) response = "Wszelkie problemy z przepisami rozwiąże dla Ciebie 'EduPrawo AI'. Od razu napisze dla Ciebie odpowiednie pismo do dyrekcji!";
                    setMessages(prev => [...prev, { sender: 'ai', text: response }]);
                }, 800);
            };

            return (
                <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end print-hidden">
                    {isOpen && (
                        <div className="glass-panel w-[calc(100vw-48px)] sm:w-[350px] h-[450px] rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-slate-700 mb-4 flex flex-col overflow-hidden">
                            <div className="bg-slate-900/80 border-b border-slate-700 p-4 flex items-center justify-between text-white z-10">
                                <div className="flex items-center gap-3">
                                    <div className="bg-slate-800 p-1.5 rounded-full"><BotAvatar className="w-8 h-8"/></div>
                                    <div>
                                        <h3 className="font-bold leading-tight">EduBot Concierge</h3>
                                        <p className="text-[10px] text-blue-400 uppercase tracking-widest font-black">Online</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-white p-2 text-xl font-bold transition-colors">✕</button>
                            </div>
                            <div className="flex-1 bg-slate-900/50 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4">
                                {messages.map((msg, i) => (
                                    <div key={i} className={`max-w-[85%] p-3 rounded-2xl text-sm shadow-sm ${msg.sender === 'ai' ? 'bg-slate-800 border border-slate-700 text-slate-200 self-start rounded-tl-sm' : 'bg-blue-600 text-white self-end rounded-tr-sm'}`}>{msg.text}</div>
                                ))}
                                <div ref={messagesEndRef} />
                            </div>
                            <div className="p-3 bg-slate-900 border-t border-slate-700 flex gap-2">
                                <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()} placeholder="Napisz tu..." className="flex-1 bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2 outline-none text-sm focus:border-blue-500 placeholder-slate-500 transition-colors" />
                                <button onClick={handleSend} className="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-colors"><svg className="w-4 h-4 translate-x-[-1px] translate-y-[1px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                            </div>
                        </div>
                    )}
                    
                    <button onClick={() => setIsOpen(!isOpen)} className="bg-slate-900 border-2 border-blue-500/50 w-16 h-16 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.6)] hover:scale-105 transition-all relative group z-50">
                        {!isOpen && (
                            <div className="absolute right-20 top-2 bg-blue-600 text-white text-xs font-bold py-2 px-4 rounded-2xl rounded-tr-sm shadow-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                                W czym pomóc? 👋
                            </div>
                        )}
                        <BotAvatar />
                        <div className="absolute bottom-1 right-1 w-4 h-4 bg-emerald-400 border-2 border-slate-900 rounded-full"></div>
                    </button>
                </div>
            );
        };

        // ==========================================
        // KOMPONENT GŁÓWNY (KARTY APLIKACJI)
        // ==========================================
        const AppCard = ({ app, isFavorite, onToggleFavorite }) => (
            <div className="relative group h-full">
                <a href={app.url} target={app.url.startsWith('http') ? "_blank" : "_self"} className="app-card glass-panel rounded-[2.5rem] p-8 flex flex-col h-full relative overflow-hidden block">
                    {app.badge && <div className={`absolute top-0 right-0 ${app.badgeColor || 'bg-blue-600'} text-white text-[10px] font-black px-4 py-2 rounded-bl-2xl uppercase tracking-widest z-10`}>{app.badge}</div>}
                    
                    {/* Delikatna poświata w tle karty na hover */}
                    <div className={`absolute -inset-10 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity blur-2xl -z-10`}></div>

                    <div className={`w-16 h-16 bg-slate-800 border border-slate-700 ${app.color} rounded-2xl flex items-center justify-center mb-8 group-hover:scale-110 transition-transform shadow-lg shrink-0`}>
                        <Icon name={app.icon} size={28} />
                    </div>
                    
                    <h3 className="text-2xl font-bold text-white mb-3 tracking-tight pr-8">{app.title}</h3>
                    <p className="text-slate-400 text-sm leading-relaxed mb-8 flex-grow">{app.desc}</p>
                    
                    <div className={`flex items-center ${app.color} font-bold text-xs uppercase tracking-widest pt-5 border-t border-slate-700/50 mt-auto`}>
                        Uruchom narzędzie
                        <svg className="w-4 h-4 ml-2 group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </div>
                </a>
                
                {/* Przycisk Ulubione */}
                <button 
                    onClick={(e) => { e.preventDefault(); e.stopPropagation(); onToggleFavorite(app.url); }}
                    className={`absolute top-6 right-6 z-20 w-10 h-10 flex items-center justify-center rounded-full backdrop-blur-md transition-all hover:scale-110 shadow-lg ${isFavorite ? 'text-yellow-400 bg-yellow-400/20 border border-yellow-400/50' : 'text-slate-500 bg-slate-900/80 border border-slate-700 hover:text-yellow-400 hover:border-yellow-400/50'}`}
                    title={isFavorite ? "Usuń z ulubionych" : "Dodaj do ulubionych"}
                >
                    <Icon name={isFavorite ? 'StarFill' : 'Star'} size={18} />
                </button>
            </div>
        );

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [activeCategory, setActiveCategory] = useState('all');
            
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('edubox_favorites');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            useEffect(() => {
                localStorage.setItem('edubox_favorites', JSON.stringify(favorites));
            }, [favorites]);

            const toggleFavorite = (url) => {
                setFavorites(prev => prev.includes(url) ? prev.filter(f => f !== url) : [...prev, url]);
            };

            const handleSearch = (e) => {
                setSearchTerm(e.target.value);
                if(activeCategory === 'favorites' && e.target.value.length > 0) {
                    setActiveCategory('all');
                }
                const section = document.getElementById('narzedzia');
                if(section && window.scrollY < section.offsetTop - 100) {
                    window.scrollTo({ top: section.offsetTop - 50, behavior: 'smooth' });
                }
            };

            const filteredApps = APPS.filter(app => {
                const matchesSearch = app.title.toLowerCase().includes(searchTerm.toLowerCase()) || app.desc.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = activeCategory === 'all' || 
                                        (activeCategory === 'favorites' && favorites.includes(app.url)) || 
                                        app.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            const categoryButtons = [
                { id: 'all', label: 'Wszystkie Narzędzia', icon: 'LayoutGrid' },
                { id: 'favorites', label: 'Ulubione', icon: 'StarFill', color: 'text-yellow-400' },
                { id: 'biurokracja', label: 'Dokumenty i IPET', icon: 'FileText' },
                { id: 'zajecia', label: 'Lekcje i Gry', icon: 'Gamepad2' },
                { id: 'terapia', label: 'Terapia i SPE', icon: 'Heart' },
                { id: 'grafika', label: 'Grafika AI', icon: 'Image' }
            ];

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow"></div>

                    {/* NAWIGACJA */}
                    <nav className="fixed top-0 w-full z-[100] glass-nav">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white">EduBox<span className="text-blue-500">AI</span></span>
                            </div>
                            <div className="hidden md:flex items-center gap-8 text-xs font-black text-slate-400 uppercase tracking-widest">
                                <a href="#narzedzia" className="hover:text-blue-400 transition-colors">Narzędzia</a>
                                <a href="#linki" className="hover:text-blue-400 transition-colors">Polecane</a>
                                <a href="#video" className="hover:text-blue-400 transition-colors">Wideo</a>
                                <a href="oferta.pdf" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 text-emerald-400 hover:text-emerald-300 transition-colors">📄 Katalog PDF</a>
                                <a href={BUY_COFFEE_LINK} target="_blank" className="bg-blue-600 text-white px-6 py-3 rounded-full hover:bg-blue-500 transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] btn-bounce">Postaw Kawę ☕</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO & SEARCH BAR */}
                    <header className="relative pt-48 pb-24 px-6 text-center z-10">
                        <div className="max-w-5xl mx-auto reveal">
                            <div className="inline-flex items-center gap-2 bg-blue-900/30 border border-blue-500/30 px-4 py-2 rounded-full text-[10px] font-black text-blue-400 uppercase tracking-widest mb-8 backdrop-blur-sm">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                EkoSystem Ponad 40 Narzędzi
                            </div>
                            <h1 className="text-5xl md:text-7xl lg:text-[5rem] font-black text-white mb-8 leading-tight tracking-tight">
                                Mniej papierów,<br/>
                                <span className="text-gradient">więcej edukacji.</span>
                            </h1>
                            <p className="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto mb-12 leading-relaxed">
                                Zautomatyzuj biurokrację dzięki Sztucznej Inteligencji. EduBox AI to zaawansowane moduły generujące oceny, scenariusze, dyplomy, fiszki i pisma urzędowe.
                            </p>
                            
                            {/* WYSZUKIWARKA MAGIA */}
                            <div className="relative max-w-3xl mx-auto mt-10 z-20 group">
                                <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                                <div className="relative flex items-center bg-slate-900 border border-slate-700 rounded-full p-2 shadow-2xl focus-within:border-blue-500 transition-colors">
                                    <div className="pl-6 pr-4 text-slate-400">
                                        <Icon name="Search" size={24} />
                                    </div>
                                    <input 
                                        type="text" 
                                        value={searchTerm}
                                        onChange={handleSearch}
                                        placeholder="Powiedz, czego dzisiaj szukasz? (np. sprawdzian, dyplom, wycieczka)..."
                                        className="w-full bg-transparent border-none text-white outline-none text-lg py-4 placeholder-slate-500"
                                    />
                                    <button onClick={() => document.getElementById('narzedzia').scrollIntoView({behavior: 'smooth'})} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-full font-bold transition-all shadow-lg flex items-center gap-2 shrink-0 btn-bounce">
                                        Szukaj
                                    </button>
                                </div>
                            </div>

                        </div>
                    </header>

                    {/* KATEGORIE I GRID APKI */}
                    <section id="narzedzia" className="max-w-[90rem] mx-auto px-6 py-20 z-10 relative print-hidden border-t border-slate-800">
                        <Reveal>
                            <div className="text-center mb-10">
                                <h2 className="text-3xl md:text-4xl font-black text-white uppercase tracking-tighter">Pełny Katalog Aplikacji</h2>
                                <p className="text-slate-400 mt-4 font-medium mb-8">Zastępujemy biurokrację technologią. Od wycieczek, przez prawo oświatowe, po grywalizację.</p>
                            </div>
                            
                            {/* ZAKŁADKI KATEGORII */}
                            <div className="flex flex-wrap justify-center gap-3 mb-16">
                                {categoryButtons.map(cat => (
                                    <button 
                                        key={cat.id} 
                                        onClick={() => { setActiveCategory(cat.id); setSearchTerm(''); }} 
                                        className={`px-6 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all shadow-md ${activeCategory === cat.id ? 'bg-blue-600 text-white shadow-blue-500/30 scale-105' : 'bg-slate-800/50 text-slate-400 hover:bg-slate-800 hover:text-white border border-slate-700/50'}`}
                                    >
                                        <Icon name={cat.icon} size={18} className={cat.color || ''} />
                                        {cat.label}
                                    </button>
                                ))}
                            </div>
                        </Reveal>

                        {/* WYNIKI / GRID */}
                        {filteredApps.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                {filteredApps.map((app, i) => (
                                    <Reveal key={app.title} delay={(i % 4) * 50}>
                                        <AppCard 
                                            app={app} 
                                            isFavorite={favorites.includes(app.url)} 
                                            onToggleFavorite={(url) => toggleFavorite(url)} 
                                        />
                                    </Reveal>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20 bg-slate-900/50 rounded-[2.5rem] border border-slate-800 shadow-inner">
                                <div className="text-6xl mb-4 opacity-50">🔍</div>
                                <h3 className="text-2xl font-bold text-white mb-2">Brak wyników</h3>
                                <p className="text-slate-400">Nie znaleźliśmy narzędzia pasującego do Twojego wyszukiwania.</p>
                                <button onClick={() => {setSearchTerm(''); setActiveCategory('all');}} className="mt-6 bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-700 border border-slate-600 font-bold transition-colors">
                                    Wyczyść filtry
                                </button>
                            </div>
                        )}
                    </section>

                    {/* POLECANE LINKI */}
                    <section id="linki" className="max-w-[90rem] mx-auto px-6 py-24 border-t border-slate-800 print-hidden">
                        <Reveal>
                            <div className="text-center mb-16">
                                <h2 className="text-3xl font-black text-white mb-4 uppercase tracking-tighter">Przydatne na zewnątrz</h2>
                                <p className="text-slate-400 font-medium">Technologia AI, którą rekomendujemy do codziennej pracy.</p>
                            </div>
                        </Reveal>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
                            {RECOMMENDATIONS.map((link, i) => (
                                <Reveal key={i} delay={i * 100}>
                                    <a href={link.url} target="_blank" className="glass-panel p-8 rounded-[2rem] hover:-translate-y-2 transition-transform flex flex-col items-center text-center group h-full">
                                        <div className="text-5xl mb-6 group-hover:scale-110 transition-transform drop-shadow-lg">{link.icon}</div>
                                        <h4 className="text-xl font-bold text-white mb-2">{link.name}</h4>
                                        <p className="text-slate-400 text-sm leading-relaxed">{link.desc}</p>
                                    </a>
                                </Reveal>
                            ))}
                        </div>
                    </section>

                    {/* SEKCJA WIDEO */}
                    <section id="video" className="py-24 bg-slate-900 border-y border-slate-800 relative overflow-hidden print-hidden">
                        <div className="max-w-[90rem] mx-auto px-6 relative z-10">
                            <Reveal>
                                <div className="text-center mb-16">
                                    <h2 className="text-3xl md:text-5xl font-black text-white mb-4 tracking-tight uppercase">Zobacz magię w akcji! 🎬</h2>
                                    <p className="text-slate-400 max-w-2xl mx-auto text-lg">Przekonaj się, jak w zaledwie kilkanaście sekund powstają gotowe materiały na Twoje zajęcia.</p>
                                </div>
                            </Reveal>

                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                <Reveal delay={100}><div className="bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.4)] border border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo1.mp4" poster="https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={200}><div className="bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.4)] border border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo2.mp4" poster="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={300}><div className="hidden lg:block bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.4)] border border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo3.mp4" poster="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                                <Reveal delay={400}><div className="hidden lg:block bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.4)] border border-slate-700 aspect-[9/16] hover:border-blue-500 transition-colors"><video src="wideo4.mp4" poster="https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=400&auto=format&fit=crop" preload="none" controls playsInline className="w-full h-full object-cover"></video></div></Reveal>
                            </div>

                            <Reveal delay={200}>
                                <div className="mt-20 pt-16 border-t border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-10 text-center">
                                    <div>
                                        <div className="text-5xl font-black text-blue-500 mb-2 drop-shadow-md"><Counter target={2450} />+</div>
                                        <div className="text-slate-400 font-bold uppercase tracking-widest text-xs">Zaoszczędzonych Godzin</div>
                                    </div>
                                    <div>
                                        <div className="text-5xl font-black text-purple-500 mb-2 drop-shadow-md"><Counter target={15200} />+</div>
                                        <div className="text-slate-400 font-bold uppercase tracking-widest text-xs">Wygenerowanych Materiałów</div>
                                    </div>
                                    <div>
                                        <div className="text-5xl font-black text-emerald-500 mb-2 drop-shadow-md"><Counter target={100} />%</div>
                                        <div className="text-slate-400 font-bold uppercase tracking-widest text-xs">Polska Podstawa Programowa</div>
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    {/* OPINIE I ARTYKUŁ */}
                    <section className="max-w-4xl mx-auto px-6 py-24 space-y-24 print-hidden border-t border-slate-800">
                        <Reveal>
                            <div className="glass-panel p-10 rounded-[2.5rem] text-center space-y-8 relative overflow-hidden">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-amber-500/10 blur-3xl rounded-full"></div>
                                <div className="flex justify-center gap-1 text-amber-400 text-2xl">★★★★★</div>
                                <p className="text-xl md:text-2xl font-medium text-slate-200 italic leading-relaxed relative z-10">
                                    "Platforma EduBox to absolutny przełom. Zamiast otwierać 10 zakładek w przeglądarce, mam w jednym miejscu kreator dyplomów, prawo oświatowe, pisanie IPET-ów i świetne pomoce wizualne. Genialne narzędzie!"
                                </p>
                                <div className="text-xs font-black text-slate-500 uppercase tracking-widest relative z-10">— Karolina Z., Pedagog Specjalny</div>
                            </div>
                        </Reveal>

                        <article className="prose prose-invert max-w-none text-slate-300">
                            <h2 className="text-3xl font-black text-white mb-8 uppercase tracking-tighter border-l-4 border-blue-500 pl-4">AI w służbie nauczyciela</h2>
                            <p className="leading-relaxed mb-6 text-lg">
                                W EduBox AI wierzymy, że Sztuczna Inteligencja to nie konkurencja, ale <strong>supermoc w rękach nauczyciela</strong>. Nasza platforma nie powstała po to, by zastąpić Twoją pasję, ale po to, by usunąć z Twojej drogi to, co nudne i powtarzalne.
                            </p>
                            <p className="leading-relaxed mb-10 text-lg">
                                Pisanie oficjalnych opinii z poprawnym żargonem, tworzenie dopasowanych kart pracy czy podsumowań na świadectwa to zadania, w których komputer radzi sobie rewelacyjnie. Ty masz dzięki temu więcej czasu na to, co najważniejsze: na budowanie relacji z uczniami.
                            </p>
                        </article>
                    </section>

                    {/* STOPKA */}
                    <footer className="bg-slate-950 pt-20 pb-10 px-6 print-hidden border-t border-slate-800 mt-auto">
                        <div className="max-w-[90rem] mx-auto flex flex-col md:flex-row items-center justify-between gap-12">
                            <div className="text-center md:text-left flex-1 max-w-2xl">
                                <div className="text-2xl font-black tracking-tighter mb-4 uppercase text-white">EduBox <span className="text-blue-500">AI</span></div>
                                <p className="text-slate-400 text-sm leading-relaxed mb-4">
                                    Projekt powstał z prawdziwej pasji i setek rozmów z Wami – nauczycielami i pedagogami. Cały czas rozwijamy EduBox AI, dodając nowe zintegrowane moduły, aby ułatwiać Wam codzienną pracę.
                                </p>
                                <p className="text-slate-400 text-sm leading-relaxed">
                                    Masz pomysł na nową aplikację?<br/>
                                    Napisz śmiało na: <a href="mailto:edubox.ai@gmail.com" className="text-blue-400 font-bold hover:underline">edubox.ai@gmail.com</a>
                                </p>
                            </div>
                            <div className="flex flex-col items-center gap-4 glass-panel p-8 rounded-[2.5rem] max-w-sm text-center w-full md:w-auto">
                                <span className="text-[10px] font-black text-blue-400 uppercase tracking-[3px]">Wsparcie projektu</span>
                                <p className="text-slate-300 text-sm mb-2">Aby zapewnić Wam błyskawiczny dostęp do dziesiątek narzędzi i profesjonalnego API, opłacamy serwery chmurowe. Każda wirtualna kawa wspiera rozwój tego darmowego ekosystemu!</p>
                                <a href={BUY_COFFEE_LINK} target="_blank" className="bg-blue-600 w-full text-white px-10 py-4 rounded-xl font-black text-sm hover:bg-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.3)] transition-all btn-bounce uppercase tracking-wide">
                                    Postaw Kawę ☕
                                </a>
                            </div>
                        </div>
                        <div className="mt-20 pt-10 border-t border-slate-800 text-center text-[10px] font-bold text-slate-600 uppercase tracking-[10px]">
                            &copy; 2026 EduBox AI. Prawa Zastrzeżone.
                        </div>
                    </footer>

                    <VideoGreeting />
                    <EduBotChat />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
