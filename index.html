    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";

        const NOVA_ANIMATIONS = {
            idle: { row: 0, frames: 7, fps: 5 },
            waving: { row: 3, frames: 4, fps: 7 },
            failed: { row: 5, frames: 8, fps: 7 },
            waiting: { row: 6, frames: 6, fps: 5 },
            running: { row: 7, frames: 6, fps: 9 },
            review: { row: 8, frames: 6, fps: 6 }
        };

        function NovaAvatar({ state = 'idle', size = 48, trackPointer = false, className = '' }) {
            const canvasRef = useRef(null);
            const pointerRef = useRef(null);
            const [imageFailed, setImageFailed] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const context = canvas.getContext('2d');
                const sprite = new Image();
                let animationFrame = 0;
                let active = true;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const sourceWidth = 192;
                const sourceHeight = 208;

                const rememberPointer = (event) => {
                    pointerRef.current = { x: event.clientX, y: event.clientY };
                };
                if (trackPointer) window.addEventListener('mousemove', rememberPointer, { passive: true });

                const draw = (time = 0) => {
                    if (!active || !sprite.complete || !sprite.naturalWidth) return;
                    let row;
                    let column;
                    const pointer = trackPointer ? pointerRef.current : null;

                    if (pointer) {
                        const box = canvas.getBoundingClientRect();
                        const dx = pointer.x - (box.left + box.width / 2);
                        const dy = pointer.y - (box.top + box.height / 2);
                        const distance = Math.hypot(dx, dy);
                        if (distance > Math.max(12, box.width * 0.35)) {
                            let angle = Math.atan2(dx, -dy);
                            if (angle < 0) angle += Math.PI * 2;
                            const direction = Math.round(angle / (Math.PI / 8)) % 16;
                            row = direction < 8 ? 9 : 10;
                            column = direction < 8 ? direction : direction - 8;
                        }
                    }

                    if (row === undefined) {
                        const animation = NOVA_ANIMATIONS[state] || NOVA_ANIMATIONS.idle;
                        row = animation.row;
                        column = reduceMotion ? 0 : Math.floor(time / (1000 / animation.fps)) % animation.frames;
                    }

                    context.clearRect(0, 0, canvas.width, canvas.height);
                    context.imageSmoothingEnabled = true;
                    context.imageSmoothingQuality = 'high';
                    context.drawImage(
                        sprite,
                        column * sourceWidth, row * sourceHeight, sourceWidth, sourceHeight,
                        0, 0, canvas.width, canvas.height
                    );
                    if (!reduceMotion) animationFrame = requestAnimationFrame(draw);
                };

                sprite.onload = () => {
                    setImageFailed(false);
                    draw();
                };
                sprite.onerror = () => setImageFailed(true);
                sprite.src = '/nova-spritesheet.webp';

                return () => {
                    active = false;
                    cancelAnimationFrame(animationFrame);
                    window.removeEventListener('mousemove', rememberPointer);
                };
            }, [state, trackPointer]);

            if (imageFailed) {
                return <i className={`ph-fill ph-robot text-white ${className}`} style={{ fontSize: size * 0.55 }} aria-label="NOVA" />;
            }

            return (
                <span className={`inline-flex items-center justify-center overflow-hidden ${className}`} role="img" aria-label="NOVA, asystentka AI">
                    <canvas
                        ref={canvasRef}
                        width="192"
                        height="208"
                        aria-hidden="true"
                        style={{ width: `${size}px`, height: `${Math.round(size * 208 / 192)}px` }}
                    />
                </span>
            );
        }

        // ==========================================
        // BAZA DANYCH APLIKACJI (Standard V3)
        // ==========================================
        function OnboardingQuiz({ apps, onClose }) {
          const [step, setStep] = React.useState(1);
          const [etap, setEtap] = React.useState(null);
          const [results, setResults] = React.useState([]);

          const Q1 = [
            { label: 'Przedszkole', key: 'przedszkole', icon: 'ph-heart' },
            { label: 'Klasy 1–3', key: 'wczesnoszkolna', icon: 'ph-book-open' },
            { label: 'Klasy 4–8 i starsze', key: 'starsza', icon: 'ph-graduation-cap' },
            { label: 'Pedagogika specjalna', key: 'spe', icon: 'ph-users-three' },
          ];
          const Q2 = [
            { label: 'Dokumentów i papierologii', key: 'biurokracja', icon: 'ph-file-text' },
            { label: 'Pomysłu na lekcję lub grę', key: 'zajecia', icon: 'ph-game-controller' },
            { label: 'Terapii i wsparcia ucznia', key: 'terapia', icon: 'ph-heart' },
            { label: 'Grafiki i dekoracji', key: 'grafika', icon: 'ph-palette' },
          ];

          // Celowo używamy także krótkich rdzeni wyrazów (np. "dysleks"), aby
          // dopasować różne odmiany tych samych pojęć w tytułach, opisach i tagach.
          const STAGE_PROFILES = {
            przedszkole: ['przedszkole', 'bajk', 'aac', 'piktogram', 'sensory', 'zabaw', 'wiersz', 'piosenk', 'wyliczank', 'kolorowank', 'dyplom', 'zgody', 'wycieczk'],
            wczesnoszkolna: ['wczesnoszkol', 'czytani', 'matemat', 'zadani', 'gry', 'fiszk', 'memory', 'bingo', 'dobble', 'rym', 'komiks', 'opisow', 'dziennik', 'litery', 'kolorowank', 'rysunk', 'girland'],
            starsza: ['fake news', 'debat', 'obywatelsk', 'zdrowotn', 'prezentac', 'slajd', 'sprawdzian', 'test', 'kartków', 'escape', 'szyfr', 'praw', 'protokół', 'ocenian', 'dostosowa', 'wymagania', 'diagnoz', 'trudne zachowania', 'plakat'],
            spe: ['spe', 'specjaln', 'ipet', 'wopfu', 'aac', 'autis', 'adhd', 'dysleks', 'terapi', 'tus', 'diagnoz', 'sensory', 'piktogram', 'dostosowa', 'trudne zachowania', 'symbol', 'kolorowank', 'rysunk', 'naklejk', 'ilustrac']
          };

          const handleQ1 = (key) => { setEtap(key); setStep(2); };
          const handleQ2 = (potrzeba) => {
            const profile = STAGE_PROFILES[etap] || [];
            const categoryApps = apps.filter(a => a.category === potrzeba);
            const scored = categoryApps.map((a, order) => {
              const searchable = `${a.title} ${a.desc} ${(a.tags || []).join(' ')}`.toLowerCase();
              const stageHits = profile.filter(keyword => searchable.includes(keyword)).length;
              return { ...a, score: (stageHits * 4) + (a.featured ? 1 : 0), order };
            });
            scored.sort((a, b) => (b.score - a.score) || (a.order - b.order));
            setResults(scored.slice(0, 2));
            setStep(3);
          };
          const restart = () => { setStep(1); setEtap(null); setResults([]); };

          return (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-[2.5rem] max-w-lg w-full p-8 md:p-10 shadow-2xl relative">
                <button onClick={onClose} className="absolute top-6 right-6 text-slate-500 hover:text-white transition-colors">
                  <i className="ph-bold ph-x text-xl"></i>
                </button>

                <div className="flex gap-2 mb-8">
                  {[1, 2, 3].map(n => (
                    <div key={n} className={`h-1.5 rounded-full transition-all ${n <= step ? 'w-8 bg-blue-500' : 'w-4 bg-slate-700'}`} />
                  ))}
                </div>

                {step === 1 && (
                  <div>
                    <span className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Szybka diagnoza · Krok 1/2</span>
                    <h2 className="text-2xl font-black text-white mt-2 mb-6">Kogo dziś uczysz?</h2>
                    <div className="grid grid-cols-2 gap-3">
                      {Q1.map(opt => (
                        <button key={opt.key} onClick={() => handleQ1(opt.key)}
                          className="flex flex-col items-center gap-3 bg-slate-800/60 border border-slate-700 hover:border-blue-500 rounded-2xl p-5 transition-all">
                          <i className={`ph-bold ${opt.icon} text-2xl text-slate-400`}></i>
                          <span className="text-sm font-bold text-slate-200 text-center">{opt.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div>
                    <span className="text-[10px] font-black text-purple-400 uppercase tracking-widest">Szybka diagnoza · Krok 2/2</span>
                    <h2 className="text-2xl font-black text-white mt-2 mb-6">Czego dziś potrzebujesz?</h2>
                    <div className="grid grid-cols-2 gap-3">
                      {Q2.map(opt => (
                        <button key={opt.key} onClick={() => handleQ2(opt.key)}
                          className="flex flex-col items-center gap-3 bg-slate-800/60 border border-slate-700 hover:border-purple-500 rounded-2xl p-5 transition-all">
                          <i className={`ph-bold ${opt.icon} text-2xl text-slate-400`}></i>
                          <span className="text-sm font-bold text-slate-200 text-center">{opt.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <div>
                    <span className="text-[10px] font-black text-emerald-400 uppercase tracking-widest">Twoje dopasowanie</span>
                    <h2 className="text-2xl font-black text-white mt-2 mb-6">Te narzędzia będą dla Ciebie najlepsze</h2>
                    <div className="space-y-3 mb-6">
                      {results.map((app, i) => (
                        <a key={i} href={app.url} className="flex items-center gap-4 bg-slate-800/60 border border-slate-700 hover:border-emerald-500 rounded-2xl p-4 transition-all">
                          <i className={`ph-bold ${app.icon} text-2xl ${app.color}`}></i>
                          <div className="flex-1 overflow-hidden">
                            <div className="font-bold text-sm text-white truncate">{app.title}</div>
                            <div className="text-xs text-slate-400 truncate">{app.desc}</div>
                          </div>
                          <i className="ph-bold ph-arrow-right text-slate-500"></i>
                        </a>
                      ))}
                    </div>
                    <button onClick={restart} className="flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-white mx-auto">
                      <i className="ph-bold ph-arrow-counter-clockwise"></i> Zacznij od nowa
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const APPS = window.EduBoxData.APPS;

        const RECOMMENDATIONS = window.EduBoxData.RECOMMENDATIONS;

        // --- Utils ---
        const Reveal = ({ children, delay = 0, className = '' }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`${className} transition-all duration-1000 ease-out ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
        };

        const Counter = ({ target, duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const ref = useRef();
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.5 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            useEffect(() => {
                if (!isVisible) return;
                let start = 0;
                const increment = target / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= target) { setCount(target); clearInterval(timer); } else setCount(Math.ceil(start));
                }, 16);
                return () => clearInterval(timer);
            }, [isVisible, target, duration]);
            return <span ref={ref}>{count.toLocaleString('pl-PL')}</span>;
        };

        // ==========================================
        // NOVA AI (Prawy Dolny Róg - tekst jak dotychczas + opcjonalny głos)
        // ==========================================
        const OmniBot = ({ appsData, isOpen, setIsOpen, openQuiz }) => {
            const [inputText, setInputText] = useState('');
            const [messages, setMessages] = useState([
                { sender: 'ai', text: 'Cześć! Rozwiązuję nauczycielskie problemy. Opisz swoimi słowami, w czym Ci dzisiaj pomóc.' }
            ]);
            const [isThinking, setIsThinking] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [voiceEnabled, setVoiceEnabled] = useState(() => {
                try { return localStorage.getItem('edubox-nova-voice') === 'on'; }
                catch (e) { return false; }
            });
            const [isVoiceLoading, setIsVoiceLoading] = useState(false);
            const messagesEndRef = useRef(null);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const voiceRequestRef = useRef(0);
            const canSpeak = typeof window !== 'undefined' && typeof window.Audio === 'function' && typeof window.fetch === 'function';

            const QUICK_PROMPTS = ["📄 Dokumenty i IPET", "🎲 Gra na zastępstwo", "🧩 Uczeń z autyzmem", "📝 Szybki sprawdzian"];

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isOpen, isThinking]);

            const stopVoice = () => {
                voiceRequestRef.current += 1;
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                setIsSpeaking(false);
                setIsVoiceLoading(false);
            };

            useEffect(() => {
                return () => {
                    voiceRequestRef.current += 1;
                    if (audioRef.current) audioRef.current.pause();
                    if (audioUrlRef.current) URL.revokeObjectURL(audioUrlRef.current);
                };
            }, []);

            const speakText = async (text, force = false) => {
                if (!canSpeak || (!voiceEnabled && !force) || !text) return;
                stopVoice();
                const requestId = voiceRequestRef.current;
                setIsVoiceLoading(true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: 'tts', text })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const audioBlob = await response.blob();
                    if (voiceRequestRef.current !== requestId) return;

                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audioRef.current = audio;
                    audioUrlRef.current = audioUrl;

                    const finish = () => {
                        if (audioRef.current === audio) audioRef.current = null;
                        if (audioUrlRef.current === audioUrl) {
                            URL.revokeObjectURL(audioUrl);
                            audioUrlRef.current = null;
                        }
                        setIsSpeaking(false);
                        setIsVoiceLoading(false);
                    };

                    audio.onplay = () => {
                        setIsVoiceLoading(false);
                        setIsSpeaking(true);
                    };
                    audio.onended = finish;
                    audio.onerror = finish;
                    await audio.play();
                } catch (error) {
                    if (voiceRequestRef.current === requestId) {
                        setIsSpeaking(false);
                        setIsVoiceLoading(false);
                        console.warn('NOVA: nie udało się odtworzyć głosu OpenAI.', error);
                    }
                }
            };

            const addAiMessage = (text, apps) => {
                setMessages(prev => [...prev, { sender: 'ai', text, ...(apps ? { apps } : {}) }]);
                speakText(text);
            };

            const toggleVoice = () => {
                if (!canSpeak) return;
                const nextValue = !voiceEnabled;
                setVoiceEnabled(nextValue);
                try { localStorage.setItem('edubox-nova-voice', nextValue ? 'on' : 'off'); } catch (e) {}
                if (!nextValue) {
                    stopVoice();
                    return;
                }
                const latestAiMessage = [...messages].reverse().find(message => message.sender === 'ai');
                if (latestAiMessage) speakText(latestAiMessage.text, true);
            };

            const closeChat = () => {
                stopVoice();
                setIsOpen(false);
            };

            // Stary mechanizm - dopasowywanie słów-kluczy do wbudowanego słownika synonimów.
            // Zostaje jako AWARYJNY fallback, gdyby wywołanie AI zawiodło (np. brak sieci) - żeby
            // bot nigdy nie zamilkł całkowicie, tylko wtedy "spadał" na słabszy, ale działający tryb.
            const findAppsKeyword = (query) => {
                const normalizedQuery = query.toLowerCase();
                const words = normalizedQuery.match(/[a-ząćęłńóśźż]+/g) || [];
                const searchWords = words.filter(w => w.length > 2 && !['jak', 'coś', 'dla', 'czy', 'masz', 'potrzebuje', 'szukam', 'jest'].includes(w));
                if (searchWords.length === 0) return [];

                const intentMap = {
                    'krzyczy': 'trudne zachowania', 'bije': 'trudne zachowania', 'agresja': 'sos', 'problem': 'sos', 'wyciszenie': 'terapia',
                    'oceny': 'ocena', 'ocenianie': 'ocena', 'świadectwo': 'ocena', 'świadectwa': 'ocena', 'półrocze': 'sprawozdanie',
                    'autyzm': 'aac', 'asperger': 'aac', 'niepełnosprawność': 'spe', 'dysleksja': 'dysleksja', 'adhd': 'dysleksja',
                    'świetlica': 'gry', 'zabawa': 'gry', 'nudzą': 'grywalizacja', 'zastępstwo': 'zastępstwo', 'okienko': 'zastępstwo',
                    'dokumenty': 'biurokracja', 'papierologia': 'biurokracja', 'papiery': 'biurokracja', 'opinia': 'ppp', 'poradnia': 'ppp',
                    'sprawdzian': 'test', 'kartkówka': 'test', 'egzamin': 'test', 'powtórzenie': 'fiszki',
                    'litery': 'napisy', 'dekoracja': 'gazetka', 'ozdoby': 'gazetka', 'napis': 'girlandy', 'napisy': 'girlandy',
                    'matma': 'matematyka', 'polski': 'czytanie', 'angielski': 'słówka', 'wycieczka': 'wycieczka', 'zgody': 'rodo',
                    'awans': 'awans', 'dorobek': 'awans', 'sprawozdanie': 'sprawozdanie'
                };

                const scoredApps = appsData.map(app => {
                    let score = 0;
                    const appContent = (app.title + " " + app.desc + " " + app.tags.join(" ")).toLowerCase();
                    searchWords.forEach(word => {
                        if (appContent.includes(word)) score += 2;
                        const mappedTag = intentMap[word];
                        if (mappedTag && appContent.includes(mappedTag)) score += 3;
                        if (word.length > 4) {
                            const rootWord = word.substring(0, word.length - 2);
                            if (appContent.includes(rootWord)) score += 1;
                        }
                    });
                    return { ...app, score };
                });

                return scoredApps.filter(app => app.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
            };

            // Tryb rozmowy: NOVA odpowiada na pytanie własnymi słowami i tylko wtedy, gdy ma to
            // sens, dołącza maksymalnie 3 narzędzia z istniejącego katalogu EduBox.
            const askNovaAI = async (query, conversationMessages) => {
                const catalog = appsData.map(a => ({ url: a.url, title: a.title, desc: a.desc, tags: a.tags }));
                const history = conversationMessages.slice(-6).map(message => ({
                    role: message.sender === 'ai' ? 'NOVA' : 'Nauczyciel',
                    text: message.text
                }));
                const system = `Jesteś NOVA — ciepłą, inteligentną i lekko żartobliwą asystentką AI serwisu EduBox dla nauczycieli. Odpowiedz bezpośrednio na najnowszą wiadomość użytkownika po polsku. Bądź konkretna, praktyczna i przyjazna. Odpowiedź powinna mieć zwykle 2–6 krótkich zdań i maksymalnie 900 znaków, aby dobrze brzmiała także po przeczytaniu głosem. Uwzględniaj ostatnie wiadomości rozmowy, jeśli pytanie do nich nawiązuje. Możesz odpowiadać również na zwykłe pytania niezwiązane bezpośrednio z katalogiem. Nie zmyślaj faktów ani możliwości aplikacji. Przy sprawach medycznych, prawnych lub innych wymagających specjalisty zaznacz ograniczenia i wskaż bezpieczny kolejny krok.

Dodatkowo oceń, czy któreś narzędzia z przekazanego katalogu EduBox realnie pomagają w tej konkretnej sprawie. Jeśli tak, wybierz maksymalnie 3 i użyj wyłącznie dokładnych adresów URL z katalogu. Jeśli nie są potrzebne, zwróć pustą listę. Nie wciskaj rekomendacji na siłę.

Zwróć WYŁĄCZNIE poprawny obiekt JSON w postaci: {"answer":"pełna odpowiedź NOVY","urls":["dokladny_url_z_katalogu"]}. Bez Markdownu i bez dodatkowego tekstu.`;
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: `Katalog narzędzi EduBox:\n${JSON.stringify(catalog)}\n\nOstatnia rozmowa:\n${JSON.stringify(history)}\n\nNajnowsza wiadomość nauczyciela:\n${query}`,
                        system, temperature: 0.3, format: 'json', model: 'gpt-4o-mini'
                    })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const parsed = JSON.parse(data.text);
                if (typeof parsed.answer !== 'string' || !parsed.answer.trim()) throw new Error('Brak odpowiedzi NOVY');
                const urls = Array.isArray(parsed.urls) ? parsed.urls : [];
                const matchedApps = urls.map(u => appsData.find(a => a.url === u)).filter(Boolean).slice(0, 3);
                return { answer: parsed.answer.trim(), apps: matchedApps };
            };

            const processUserMessage = async (userMsg) => {
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInputText('');

                if (userMsg.toLowerCase().includes('kawa') || userMsg.toLowerCase().includes('premium')) {
                    addAiMessage('Możesz mnie wesprzeć stawiając wirtualną kawę ☕ – w podziękowaniu dostaniesz kod, który wyłącza dzienne limity we wszystkich narzędziach!');
                    return;
                }

                setIsThinking(true);
                let novaReply;
                try {
                    novaReply = await askNovaAI(userMsg, messages);
                } catch (e) {
                    console.log('NOVA: rozmowa AI nie powiodła się, uruchamiam tryb awaryjny.', e);
                    const matchedApps = findAppsKeyword(userMsg);
                    novaReply = matchedApps.length > 0
                        ? {
                            answer: 'Mam chwilowy problem z przygotowaniem pełnej odpowiedzi, ale znalazłam narzędzia EduBox, które mogą pomóc w tej sprawie.',
                            apps: matchedApps
                        }
                        : {
                            answer: 'Mam chwilową przerwę w łączności z AI. Spróbuj proszę ponownie za moment — nie chcę zgadywać i wprowadzić Cię w błąd.',
                            apps: []
                        };
                } finally {
                    setIsThinking(false);
                }

                addAiMessage(novaReply.answer, novaReply.apps);
            };

            const handleSend = () => {
                if (!inputText.trim() || isThinking) return;
                processUserMessage(inputText.trim());
            };

            const novaState = isThinking || isVoiceLoading ? 'running' : isSpeaking ? 'review' : 'idle';

            return (
                <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end print-hidden">
                    {isOpen && (
                        <div className="bg-white dark:bg-slate-900 w-[calc(100vw-48px)] sm:w-[380px] h-[550px] rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 mb-4 flex flex-col overflow-hidden animate-[reveal_0.2s_ease-out]">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-3 flex items-center justify-between text-white shadow-md border-b border-cyan-400/20">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 rounded-2xl bg-cyan-400/10 border border-cyan-300/30 flex items-center justify-center overflow-hidden shadow-[0_0_18px_rgba(34,211,238,0.18)]">
                                        <NovaAvatar state={novaState} size={43} />
                                    </div>
                                    <div>
                                        <h3 className="font-bold leading-tight">NOVA AI</h3>
                                        <p className="text-[10px] text-cyan-200 uppercase tracking-widest font-black flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> {isSpeaking ? 'Mówię…' : isVoiceLoading ? 'Przygotowuję głos…' : isThinking ? 'Pracuję…' : 'Online'}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-1">
                                    <button
                                        onClick={toggleVoice}
                                        disabled={!canSpeak}
                                        className={`w-10 h-10 rounded-xl flex items-center justify-center transition-colors ${voiceEnabled ? 'bg-cyan-400 text-slate-950' : 'bg-white/10 text-cyan-100 hover:bg-white/20'} disabled:opacity-40`}
                                        aria-label={voiceEnabled ? 'Wyłącz automatyczne odpowiedzi głosowe NOVY' : 'Włącz automatyczne odpowiedzi głosowe NOVY'}
                                        title={!canSpeak ? 'Ta przeglądarka nie obsługuje dźwięku' : voiceEnabled ? 'Głos NOVY OpenAI: włączony' : 'Głos NOVY OpenAI: wyłączony'}
                                    >
                                        <i className={`ph-bold ${voiceEnabled ? 'ph-speaker-high' : 'ph-speaker-slash'} text-lg`}></i>
                                    </button>
                                    <button onClick={closeChat} className="text-cyan-100 hover:text-white p-2 text-2xl transition-colors" aria-label="Zamknij czat z NOVĄ"><i className="ph-bold ph-x"></i></button>
                                </div>
                            </div>

                            {voiceEnabled && (
                                <div className="px-3 py-2 bg-cyan-50 dark:bg-slate-950 border-b border-cyan-200 dark:border-cyan-900/50 text-[10px] font-bold text-slate-600 dark:text-cyan-200 flex items-center gap-1.5">
                                    <i className="ph-bold ph-waveform"></i> Głos generowany przez AI (OpenAI)
                                </div>
                            )}

                            {/* Chat Area */}
                            <div className="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50 dark:bg-slate-900/50">
                                {messages.map((msg, i) => (
                                    <div key={i} className="flex flex-col gap-2">
                                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm shadow-sm ${msg.sender === 'ai' ? 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 self-start rounded-tl-sm' : 'bg-blue-600 text-white self-end rounded-tr-sm'}`}>
                                            <div>{msg.text}</div>
                                            {msg.sender === 'ai' && canSpeak && (
                                                <button onClick={() => speakText(msg.text, true)} className="mt-2 text-[10px] font-bold text-blue-600 dark:text-cyan-300 hover:text-blue-800 dark:hover:text-cyan-100 flex items-center gap-1" aria-label="Odsłuchaj tę odpowiedź NOVY">
                                                    <i className="ph-bold ph-speaker-high"></i> Odsłuchaj
                                                </button>
                                            )}
                                        </div>

                                        {/* Wyświetlanie Mini-Kart Aplikacji */}
                                        {msg.apps && msg.apps.length > 0 && (
                                            <div className="flex flex-col gap-2 w-[85%] self-start mt-1">
                                                {msg.apps.map((app, appIdx) => (
                                                    <a key={appIdx} href={app.url} className="flex items-center gap-3 bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-900/50 p-2.5 rounded-xl hover:border-blue-500 dark:hover:border-blue-500 transition-colors shadow-sm group">
                                                        <div className={`w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-900 flex items-center justify-center ${app.color} group-hover:scale-110 transition-transform`}>
                                                            <i className={`ph-bold ${app.icon} text-xl`}></i>
                                                        </div>
                                                        <div className="flex-1 overflow-hidden">
                                                            <div className="font-bold text-xs text-slate-900 dark:text-white truncate">{app.title}</div>
                                                            <div className="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">{app.category}</div>
                                                        </div>
                                                        <i className="ph-bold ph-caret-right text-slate-300 dark:text-slate-600 group-hover:text-blue-500"></i>
                                                    </a>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {/* Wskaźnik "myślę..." podczas wywołania AI */}
                                {isThinking && (
                                    <div className="max-w-[85%] p-3 rounded-2xl text-sm shadow-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 self-start rounded-tl-sm flex items-center gap-1.5">
                                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                        <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Pigułki szybkiego wyboru + alternatywa (quiz) */}
                            <div className="bg-slate-50 dark:bg-slate-900/50 px-3 pt-2 pb-1 flex gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap">
                                {QUICK_PROMPTS.map((prompt, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => !isThinking && processUserMessage(prompt)}
                                        className="text-[10px] md:text-xs font-bold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 px-3 py-1.5 rounded-full hover:bg-blue-200 dark:hover:bg-blue-900/50 transition-colors shrink-0"
                                    >
                                        {prompt}
                                    </button>
                                ))}
                            </div>
                            <button onClick={openQuiz} className="mx-3 mb-2 text-[10px] text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 font-bold flex items-center gap-1.5 transition-colors">
                                <i className="ph-bold ph-compass"></i> Wolisz odpowiedzieć na 2 szybkie pytania zamiast pisać?
                            </button>

                            {/* Input Area - awatar bota obok pola, żeby wyraźnie zaznaczyć że to AI odpowiada */}
                            <div className="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex items-center gap-2">
                                <div className="relative shrink-0">
                                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-slate-900 to-blue-950 border border-cyan-400/40 flex items-center justify-center shadow-md overflow-hidden">
                                        <NovaAvatar state={novaState} size={36} />
                                    </div>
                                    {isThinking && <span className="absolute -inset-1 rounded-full border-2 border-cyan-400/50 animate-ping"></span>}
                                </div>
                                <input
                                    type="text" value={inputText} onChange={e => setInputText(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()}
                                    placeholder="Zadaj pytanie NOVIE..." disabled={isThinking}
                                    className="flex-1 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl px-4 py-3 outline-none text-sm focus:border-blue-500 dark:focus:border-blue-500 transition-colors disabled:opacity-60"
                                />
                                <button onClick={handleSend} disabled={isThinking} className="bg-blue-600 hover:bg-blue-500 text-white w-12 h-12 rounded-xl flex items-center justify-center transition-all shadow-md active:scale-95 disabled:opacity-60 shrink-0">
                                    <i className="ph-bold ph-paper-plane-right text-lg"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Bot Toggle Button */}
                    <button onClick={() => isOpen ? closeChat() : setIsOpen(true)} aria-label={isOpen ? 'Zamknij czat z NOVĄ' : 'Otwórz czat z NOVĄ'} className="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 w-[72px] h-[72px] rounded-full flex items-center justify-center shadow-[0_0_22px_rgba(34,211,238,0.45)] hover:shadow-[0_0_32px_rgba(34,211,238,0.7)] hover:scale-105 transition-all relative z-50 group border-2 border-cyan-300/40 overflow-visible">
                        {isOpen ? <i className="ph-bold ph-x text-white text-2xl"></i> : <NovaAvatar state="idle" size={63} trackPointer={true} />}
                        {!isOpen && <div className="absolute top-0 right-0 w-4 h-4 bg-red-500 border-2 border-white dark:border-slate-900 rounded-full animate-ping"></div>}
                        {!isOpen && <div className="absolute top-0 right-0 w-4 h-4 bg-red-500 border-2 border-white dark:border-slate-900 rounded-full"></div>}
                    </button>
                </div>
            );
        };

        // ==========================================
        // GŁÓWNA ASYSTENTKA WIDEO ("Blondynka" w Hero)
        // ==========================================
        const HeroVideoAssistant = ({ onAskBot }) => {
            const [isMuted, setIsMuted] = useState(true);
            const videoRef = useRef(null);

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !isMuted;
                    setIsMuted(!isMuted);
                    if (isMuted) { videoRef.current.currentTime = 0; videoRef.current.play(); }
                }
            };

            // Dymek ma WŁASNĄ akcję (otwiera bota) - stopPropagation, żeby klik w dymek
            // nie odpalał też toggleMute z rodzica.
            const handleAskBot = (e) => {
                e.stopPropagation();
                if (onAskBot) onAskBot();
            };

            return (
                <div className="relative group w-full max-w-[280px] mx-auto md:mx-0 rounded-[2rem] overflow-hidden shadow-2xl border-4 border-blue-500/50 hover:border-blue-500 transition-colors cursor-pointer bg-slate-900" onClick={toggleMute}>
                    <video
                        ref={videoRef} src="powitanie.mp4" autoPlay loop={isMuted} muted={isMuted} playsInline
                        className="w-full h-[450px] object-cover"
                        poster="okladka.jpg"
                    />

                    <div className="absolute top-4 left-4 bg-black/50 backdrop-blur px-3 py-1.5 rounded-full text-white text-xs font-bold flex items-center gap-2">
                        {isMuted ? <><i className="ph-bold ph-speaker-slash"></i> Kliknij by posłuchać</> : <><i className="ph-bold ph-speaker-high animate-pulse"></i> Odtwarzanie...</>}
                    </div>

                    <button onClick={handleAskBot} className="absolute bottom-4 right-4 bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-2xl rounded-br-sm shadow-xl flex items-center gap-2 animate-bounce transition-colors">
                        <span className="text-xs font-bold">Zapytaj Bota!</span>
                        <i className="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            );
        };
       // ==========================================
        // MAGIA NA ŻYWO - SYMULACJA AI (Wersja: Piszące Pióro)
        // ==========================================
        const LiveMagicPreview = () => {
            const [progress, setProgress] = useState(0);
            const [taskIdx, setTaskIdx] = useState(0);
            const tasks = [
                "Pisanie opinii ucznia...", 
                "Tworzenie scenariusza TUS...", 
                "Redagowanie planu lekcji...", 
                "Generowanie zadań..."
            ];

            useEffect(() => {
                const startTimeout = setTimeout(() => setProgress(100), 100);
                const interval = setInterval(() => {
                    setProgress(0);
                    setTimeout(() => {
                        setTaskIdx(prev => (prev + 1) % tasks.length);
                        setProgress(100);
                    }, 150);
                }, 3000);
                return () => { clearTimeout(startTimeout); clearInterval(interval); };
            }, []);

            return (
                // Przesunięte na górę (top-8), jasne tło (bg-amber-50), wymuszony ciemny tekst
                <div className="absolute -left-4 md:-left-16 top-8 md:top-12 bg-amber-50 p-5 rounded-sm shadow-[5px_5px_20px_rgba(0,0,0,0.2)] border border-amber-200 w-64 z-20 animate-float hidden md:block">
                    
                    {/* Piszące, przemieszczające się pióro */}
                    <div 
                        className="absolute text-blue-600 text-3xl drop-shadow-md z-30 ease-linear"
                        style={{ 
                            top: '55px', // Ustawione dokładnie na wysokości pierwszej linii
                            left: `${Math.max(10, progress - 10)}%`, // Pióro podąża za paskiem postępu!
                            transform: 'rotate(25deg)', // Naturalne pochylenie długopisu
                            transition: 'left 1.5s'
                        }}
                    >
                        <i className="ph-fill ph-pen-nib animate-bounce"></i>
                    </div>

                    {/* Nagłówek kartki */}
                    <div className="flex items-center gap-2 mb-4 border-b border-amber-200 pb-2">
                        <i className="ph-bold ph-robot text-blue-600 text-lg"></i>
                        <span className="text-xs font-bold text-slate-800">
                            {tasks[taskIdx]}
                        </span>
                    </div>
                    
                    {/* Linie symulujące pojawiający się atrament */}
                    <div className="space-y-3 relative z-10">
                        <div className="h-1.5 bg-transparent w-full overflow-hidden">
                            <div className="h-full bg-slate-600 ease-out rounded-full" style={{ width: `${progress}%`, transition: 'width 1.5s' }}></div>
                        </div>
                        <div className="h-1.5 bg-transparent w-5/6 overflow-hidden">
                            <div className="h-full bg-slate-600 ease-out rounded-full" style={{ width: `${progress}%`, transition: 'width 2s', transitionDelay: '0.2s' }}></div>
                        </div>
                        <div className="h-1.5 bg-transparent w-4/6 overflow-hidden">
                            <div className="h-full bg-slate-600 ease-out rounded-full" style={{ width: `${progress}%`, transition: 'width 2.5s', transitionDelay: '0.4s' }}></div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // KARTA APLIKACJI (Z zapisem historii)
        // ==========================================
        const AppCard = ({ app, isFavorite, onToggleFavorite, onClick }) => (
            <div className="relative group h-full">
                <a href={app.url} onClick={() => onClick && onClick(app)} target={app.url.startsWith('http') ? "_blank" : "_self"} className={`block h-full rounded-[2.5rem] p-8 flex flex-col relative overflow-hidden border shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 ${app.featured ? 'bg-gradient-to-br from-indigo-50 via-white to-cyan-50 dark:from-indigo-950/80 dark:via-slate-900 dark:to-cyan-950/60 border-indigo-300 dark:border-indigo-500/60 ring-2 ring-indigo-500/10 shadow-indigo-500/15' : 'bg-white dark:bg-slate-900/50 border-slate-200 dark:border-slate-800'}`}>

                    {app.featured && <div className="absolute -left-16 -bottom-20 w-56 h-56 rounded-full bg-indigo-500/10 blur-3xl pointer-events-none"></div>}
                    
                    {app.badge && <div className={`absolute top-0 right-0 ${app.badgeColor} text-white text-[10px] font-black px-4 py-2 rounded-bl-2xl uppercase tracking-widest z-10 shadow-md`}>{app.badge}</div>}

                    {app.verified2026 && (
