    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatAIResponse = (text) => {
            if (!text) return "";
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br/>');
        };

        // Zweryfikowana baza źródeł prawnych - AI może z niej TYLKO WYBIERAĆ, nigdy nie generuje własnych linków
        const LEGAL_SOURCES = {
            karta_nauczyciela: { name: "Karta Nauczyciela (ustawa) - ISAP", url: "https://isap.sejm.gov.pl/isap.nsf/ByKeyword.xsp?key=Karta+Nauczyciela" },
            prawo_oswiatowe: { name: "Ustawa Prawo oświatowe - ISAP", url: "https://isap.sejm.gov.pl/isap.nsf/ByKeyword.xsp?key=Prawo+o%C5%9Bwiatowe" },
            awans_zawodowy: { name: "Rozporządzenie ws. uzyskiwania stopni awansu zawodowego (6.09.2022)", url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20220001914" },
            orzeczenia_poradnie: { name: "Rozporządzenie ws. orzeczeń i opinii poradni PPP, w tym ocena funkcjonalna (2.03.2026)", url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20260000428" },
            podstawa_programowa: { name: "Rozporządzenie ws. nowej podstawy programowej \"Kompas Jutra\" (11.03.2026)", url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20260000378" },
            oswiata_ogolnie: { name: "Portal Ministerstwa Edukacji - aktualności i akty prawne", url: "https://www.gov.pl/web/edukacja" }
        };

        function EduPrawoApp() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            // --- LOCAL STATES ---
            const [query, setQuery] = useState('');
            const [aiResponse, setAiResponse] = useState(null); // Zmieniono na obiekt JSON
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [botMessage, setBotMessage] = useState("Dzień dobry. Jestem EduPrawo AI. Opisz mi swój problem z dziedziny prawa oświatowego, a ja przeszukam dla Ciebie Kartę Nauczyciela i Ustawę.");

            const resultRef = useRef(null);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO' || status === 'active') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_eduprawo', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                    setBotMessage("Moduł PRO aktywny. Możesz wyszukiwać paragrafy bez żadnych limitów.");
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (!aiResponse) {
                    showToast("Najpierw musisz wygenerować poradę prawną!");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Porada: ${query.substring(0, 30)}...`;
                            const config = { query, aiResponse };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_eduprawo', 'Porada Prawna', name, config);
                            showToast("✨ Udostępniono w Bazie Prawa!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.aiResponse) {
                    setQuery(c.query || '');
                    setAiResponse(c.aiResponse);
                    
                    setAppMode('editor');
                    showToast("✨ Załadowano Poradę z Bazy!");
                    setBotMessage("Wczytałem wybraną opinię prawną. Możesz ją wydrukować lub edytować zapytanie.");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                }
            };

            // GŁÓWNA FUNKCJA GENERUJĄCA
            const executeAskAI = () => {
                if (!query.trim()) {
                    showToast('Opisz swój problem prawny!'); 
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        askAI();
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const askAI = async () => {
                setIsGenerating(true);
                setAiResponse(null);
                setBotMessage("Przeszukuję zwoje ustaw, rozporządzeń oraz Kartę Nauczyciela. Proszę o cierpliwość...");

                const systemPrompt = `Jesteś ekspertem prawa oświatowego w Polsce. Masz za zadanie udzielić rzetelnej, opartej na przepisach porady prawnej dla dyrektora lub nauczyciela.

WAŻNY KONTEKST CZASOWY: Dzisiejsza data to ${new Date().toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })}, trwa rok szkolny 2026/2027. Aktualna nazwa resortu to "Ministerstwo Edukacji Narodowej" (MEN), a nowe akty prawne od 2024 r. podpisuje "Minister Edukacji" (BEZ członu "i Nauki" - ten człon to nazwa sprzed podziału resortu w 2024 r., już nieaktualna). Miej na uwadze aktualne zmiany prawne obowiązujące w tym okresie, w tym m.in.:
- reformę awansu zawodowego z 2022 r. (Karta Nauczyciela) - obecne stopnie to nauczyciel początkujący, mianowany i dyplomowany (stopnie stażysty i kontraktowego zniesiono, ale przepisy przejściowe dla części nauczycieli obowiązują do 31 sierpnia 2027 r.);
- reformę podstawy programowej "Kompas jutra" (rozporządzenie z 11 marca 2026 r.) - nowa podstawa programowa obowiązuje od 1 września 2026 r. w przedszkolach oraz klasach I i IV szkoły podstawowej;
- zmiany w zasadach wydawania orzeczeń i opinii przez poradnie psychologiczno-pedagogiczne (rozporządzenie z 2 marca 2026 r.), w tym obowiązkową "ocenę funkcjonalną" ucznia od 1 września 2026 r. oraz nowe, 10-dniowe terminy na przygotowanie przez szkołę aktualnej WOPFU na prośbę poradni.

Jeśli pytanie dotyczy obszaru, w którym niedawno zaszły zmiany, zaznacz to wyraźnie w odpowiedzi. Jeśli nie masz pewności co do najbardziej aktualnego stanu prawnego w wąskiej, szczegółowej kwestii, wyraźnie to zaznacz i zarekomenduj weryfikację w kuratorium oświaty lub u prawnika specjalizującego się w prawie oświatowym - zwłaszcza przy decyzjach wiążących lub spornych.

WYMAGANIA CO DO SZCZEGÓŁOWOŚCI: Pisz wyczerpująco. W polu "explanation" nie ograniczaj się do jednego zdania - wyjaśnij kontekst przepisu, jego praktyczne zastosowanie w szkole oraz - jeśli to pomaga zrozumieć sytuację - krótki przykład. W polu "action_steps" podaj konkretne, praktyczne kroki (zwykle 3-5 punktów), nie ogólniki.

WYBÓR ŹRÓDEŁ: W polu "related_topics" wskaż od 1 do 3 kluczy z poniższej ZAMKNIĘTEJ listy, które najlepiej pasują do tematu pytania. Wybieraj TYLKO z tej listy, nigdy nie wymyślaj własnych kluczy ani adresów URL:
- "karta_nauczyciela" (sprawy pracownicze, urlopy, wynagrodzenie, obowiązki nauczyciela)
- "prawo_oswiatowe" (ogólne funkcjonowanie szkoły, uczniowie, dyrekcja)
- "awans_zawodowy" (stopnie awansu, staż, mianowanie, dyplomowanie)
- "orzeczenia_poradnie" (orzeczenia, opinie PPP, ocena funkcjonalna, WOPFU)
- "podstawa_programowa" (treści nauczania, nowa podstawa programowa, przedmioty)
- "oswiata_ogolnie" (gdy żaden z powyższych nie pasuje precyzyjnie)

Odpowiadaj WYŁĄCZNIE poprawnym formatem JSON. Nie dodawaj znaczników Markdown wokół JSONa, tylko sam obiekt.
Struktura JSON:
{
  "legal_basis": "Dokładna podstawa prawna (np. Art. 73 ust. 2 Karty Nauczyciela)",
  "explanation": "Wyczerpujące, rzeczowe wyjaśnienie sytuacji prawnej wraz z kontekstem praktycznym (używaj znaczników <strong> dla ważnych słów, możesz używać \\n do nowych linii)",
  "action_steps": "Rekomendowane, konkretne kroki działania dla nauczyciela/dyrektora w tej sytuacji, zwykle 3-5 punktów (tekst z wypunktowaniem za pomocą •)",
  "related_topics": ["klucz1", "klucz2"]
}`;

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: query, 
                            system: systemPrompt, 
                            temperature: 0.2, 
                            model: "gpt-4o-mini",
                            format: "json" 
                        })
                    });
                    
                    if (!res.ok) throw new Error("Błąd łączenia z serwerem AI.");
                    
                    const data = await res.json();
                    let cleanText = data.text;
                    
                    // Ekstrakcja i czyszczenie JSON
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const outerObj = JSON.parse(cleanText); if(outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch(e){}
                    }
                    
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    let parsedData;
                    try {
                        if (jsonStr.indexOf('{') !== -1) {
                            let extractedJson = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                            parsedData = JSON.parse(extractedJson);
                        } else {
                            throw new Error("No JSON structure");
                        }
                    } catch(e) {
                        console.warn("Fallback - AI returned raw text instead of JSON");
                        parsedData = {
                            legal_basis: "Podstawa prawna wynikająca z przepisów ogólnych",
                            explanation: cleanText,
                            action_steps: "Skonsultuj się z radcą prawnym organu prowadzącego.",
                            related_topics: ["oswiata_ogolnie"]
                        };
                    }

                    // Zabezpieczenie: jeśli AI nie podało related_topics (lub podało pustą tablicę),
                    // dobieramy je sami na podstawie słów kluczowych - żeby link ZAWSZE się pojawił
                    if (!parsedData.related_topics || parsedData.related_topics.length === 0) {
                        const haystack = (query + ' ' + (parsedData.legal_basis || '') + ' ' + (parsedData.explanation || '')).toLowerCase();
                        const guessed = [];
                        if (/awans|staż|mianowan|dyplomowan|nauczyciel początkując|kontraktow/.test(haystack)) guessed.push('awans_zawodowy');
                        if (/orzeczen|opini[ai]|wopfu|ipet|poradni|ocena funkcjonaln|niepełnosprawn/.test(haystack)) guessed.push('orzeczenia_poradnie');
                        if (/podstawa programowa|przedmiot|kompas jutra|program nauczania/.test(haystack)) guessed.push('podstawa_programowa');
                        if (/urlop|wynagrodzeni|godzin|pensum|karta nauczyciela|obowiązk[iu] nauczyciela/.test(haystack)) guessed.push('karta_nauczyciela');
                        if (/dyrektor|statut|uczni|szkoł[ay]|prawo oświatowe/.test(haystack)) guessed.push('prawo_oswiatowe');
                        parsedData.related_topics = guessed.length > 0 ? guessed.slice(0, 3) : ['oswiata_ogolnie'];
                    }

                    setAiResponse(parsedData);
                    setBotMessage("Gotowe. Przygotowałem ustrukturyzowaną opinię prawną wraz z podstawą i rekomendowanymi krokami.");
                    
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                } catch (error) {
                    console.error("Błąd AI:", error);
                    showToast(`Wystąpił problem: ${error.message}`);
                    setBotMessage("Niestety napotkałem problem z dostępem do bazy. Spróbuj zadać pytanie jeszcze raz.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportToWord = () => {
                if(!aiResponse) return;
                const content = document.getElementById('print-container').innerHTML;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Opinia Prawna</title>
                <style>
                    body { font-family: 'Arial', sans-serif; font-size: 11pt; line-height: 1.5; color: #000; }
                    h1 { font-size: 16pt; color: #1e3a8a; text-transform: uppercase; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px;}
                    h2 { font-size: 12pt; color: #1e3a8a; margin-top: 20px; margin-bottom: 10px; text-transform: uppercase;}
                    p { margin-bottom: 10px; text-align: justify; }
                    .basis-box { background-color: #f1f5f9; padding: 15px; border-left: 4px solid #3b82f6; margin-bottom: 20px; font-weight: bold;}
                    .steps-box { background-color: #f8fafc; padding: 15px; border: 1px solid #cbd5e1; margin-top: 20px; }
                    strong { color: #000; }
                </style></head><body>`;
                const footer = `<\/body><\/html>`;
                
                const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Opinia_EduPrawo_${Date.now()}.doc`;
                link.click();
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        <div className="hero-glow print-hidden"></div>

                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-sky-500 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-sky-400">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-scales text-4xl"></i> Baza Prawa Oświatowego</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl"></i> Udostępnij swoją wygenerowaną opinię
                                </button>

                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Interpretacje od innych nauczycieli</h3>
                                <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-5 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-3 shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="flex justify-between items-start gap-3">
                                                <span className="text-sm md:text-base font-bold text-slate-200 group-hover:text-fuchsia-400 transition-colors line-clamp-2 leading-relaxed">{p.name}</span>
                                                <span className="text-[10px] font-bold px-2 py-1 rounded bg-sky-900/50 border border-sky-500/30 text-sky-300 whitespace-nowrap uppercase tracking-widest">{p.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center font-bold">
                                                <p className="text-xs text-slate-500">Autor: <span className="text-slate-300">{p.userId.substring(0,6)}</span></p>
                                                <p className="text-xs text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="text-center py-10 opacity-50">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-500 mx-auto block"></i>
                                            <p className="text-base text-slate-400 font-bold">Brak opinii w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow print-hidden"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-sky-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm animate-toast flex items-center gap-3 border border-sky-400 print-hidden">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-sky-500/30 shadow-[0_0_50px_rgba(14,165,233,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-sky-500 rounded-full animate-spin"></div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Analizuję Przepisy...</h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-sky-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <i className="ph-bold ph-scales text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">Edu<span className="text-sky-400">Prawo</span> AI</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://buycoffee.to/magiccolor" target="_blank" className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all active:scale-95 text-sm shadow-md btn-bounce">
                                    <i className="ph-fill ph-coffee text-lg text-amber-400"></i><span className="hidden sm:block">Postaw Kawę</span>
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* LEWA KOLUMNA: GENERATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                
                                {/* ODBLOKOWANIE PREMIUM / BAZA WZORÓW */}
                                <div className="flex flex-col gap-4">
                                    {!isPremium ? (
                                        <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-sky-500/30 bg-sky-950/20">
                                            <div className="flex flex-col px-2">
                                                <span className="text-[10px] font-bold text-sky-300 uppercase tracking-widest">Darmowe użycia: {Math.max(0, 5 - usageCount)}/5</span>
                                                <span className="text-[9px] text-slate-400 font-bold">Wersja Free</span>
                                            </div>
                                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                                <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-32 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-sky-500 transition-colors uppercase"/>
                                                <button onClick={handleVerifyCode} className="px-3 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold transition-all shadow-md btn-bounce">OK</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                            <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                            <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduPrawo PRO Aktywny</span>
                                        </div>
                                    )}

                                    <button onClick={() => setAppMode('gielda')} className="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-fuchsia-900/30 hover:border-fuchsia-500/50 transition-all shadow-md btn-bounce flex items-center justify-center gap-2">
                                        <i className="ph-bold ph-files text-lg text-fuchsia-400"></i> Baza Prawa Oświatowego
                                    </button>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-2xl font-black text-white flex items-center gap-3">
                                            <i className="ph-bold ph-magnifying-glass text-sky-400"></i> Wyszukiwarka
                                        </h2>
                                    </div>
                                    <p className="text-slate-400 text-sm mb-6">
                                        Opisz swój problem prawny w szkole. AI przeszuka dla Ciebie Kartę Nauczyciela i Ustawę Prawo Oświatowe.
                                    </p>

                                    <textarea 
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                        placeholder="Np. Czy dyrektor może zmusić mnie do zastępstwa w dniu wolnym? Na jakim artykule się oprzeć?"
                                        className="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-2xl p-5 min-h-[160px] focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 custom-scrollbar resize-y text-sm leading-relaxed mb-6"
                                    ></textarea>

                                    <button 
                                        onClick={executeAskAI}
                                        disabled={isGenerating || !query.trim()}
                                        className={`w-full py-4 rounded-xl font-black text-white text-sm uppercase tracking-widest transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(14,165,233,0.2)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-sky-500 hover:scale-105'}`}
                                    >
                                        <i className="ph-bold ph-magnifying-glass text-lg"></i> Szukaj Paragrafu {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                    </button>
                                </div>

                                {/* EduBot Pomocnik */}
                                <div className="p-5 rounded-3xl shadow-lg border flex items-start gap-4 animate-[reveal_0.3s_ease-out] transition-colors bg-blue-900/20 border-blue-500/30">
                                    <div className="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center border-2 border-sky-400 flex-shrink-0 shadow-lg">
                                        <i className="ph-bold ph-robot text-sky-400 text-2xl"></i>
                                    </div>
                                    <div className="flex-1 pt-1">
                                        <h4 className="font-black text-xs uppercase tracking-widest mb-1.5 text-sky-400">EduBot Prawnik</h4>
                                        <p className="text-sm font-medium leading-relaxed text-slate-300" key={botMessage}>{botMessage}</p>
                                    </div>
                                </div>

                            </div>

                            {/* PRAWA KOLUMNA: WYNIK (OPINIA PRAWNA) */}
                            <div className="lg:col-span-7 flex flex-col h-full print:block" ref={resultRef}>
                                
                                {aiResponse && (
                                    <div className="flex flex-wrap justify-end gap-3 mb-6 print-hidden bg-slate-900/50 p-2 rounded-2xl border border-slate-800 backdrop-blur-md fade-in">
                                        <button onClick={sharePattern} className="flex-1 sm:flex-none bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm shadow-lg active:scale-95 btn-bounce">
                                            <i className="ph-bold ph-cloud-arrow-up text-lg"></i> Zapisz
                                        </button>
                                        <button onClick={exportToWord} className="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm shadow-[0_0_15px_rgba(37,99,235,0.3)] active:scale-95 btn-bounce">
                                            <i className="ph-bold ph-download text-lg"></i> Word
                                        </button>
                                        <button onClick={() => window.print()} className="flex-1 sm:flex-none bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm active:scale-95 btn-bounce">
                                            <i className="ph-bold ph-printer text-lg"></i> Drukuj
                                        </button>
                                    </div>
                                )}

                                {!aiResponse ? (
                                    <div className="glass-panel rounded-[2.5rem] p-6 sm:p-12 border border-slate-700/50 flex flex-col items-center justify-center h-full min-h-[600px] print-hidden opacity-50">
                                        <i className="ph-duotone ph-scales text-7xl text-slate-500 mb-6"></i>
                                        <h2 className="text-xl font-bold text-white mb-2">Opinia Prawna</h2>
                                        <p className="text-center font-medium text-sm text-slate-400 max-w-sm">System czeka na zapytanie.<br/>Wpisz problem z lewej strony i kliknij "Szukaj".</p>
                                    </div>
                                ) : (
                                    <div className="bg-white text-slate-900 rounded-sm p-10 md:p-14 shadow-2xl min-h-[297mm] document-font fade-in print:shadow-none print:p-0" id="print-container">
                                        
                                        <div className="text-center border-b-2 border-slate-300 pb-6 mb-8 print-border-bottom">
                                            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Poufny Asystent Nauczyciela</div>
                                            <h1 className="text-2xl md:text-3xl font-black uppercase text-blue-900 tracking-tight">Interpretacja Prawna</h1>
                                        </div>

                                        <div className="ai-content text-sm md:text-base leading-relaxed space-y-6 text-justify">
                                            
                                            {/* Podstawa Prawna */}
                                            <div className="bg-blue-50 border-l-4 border-blue-600 p-5 rounded-r-xl print-bg-light">
                                                <h3 className="text-xs font-black uppercase text-blue-800 tracking-widest mb-2 flex items-center gap-2"><i className="ph-bold ph-book-bookmark"></i> Podstawa Prawna</h3>
                                                <p className="font-bold text-slate-800 m-0" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.legal_basis) }}></p>
                                            </div>

                                            {/* Wyjaśnienie */}
                                            <div>
                                                <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-3 border-b border-slate-200 pb-2">Wyjaśnienie i Analiza</h3>
                                                <div className="text-slate-800" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.explanation) }}></div>
                                            </div>

                                            {/* Rekomendowane Kroki */}
                                            <div className="bg-slate-50 border border-slate-200 p-6 rounded-xl mt-8 print-bg-light">
                                                <h3 className="text-xs font-black uppercase text-emerald-600 tracking-widest mb-4 flex items-center gap-2"><i className="ph-bold ph-check-circle"></i> Rekomendowane Działania</h3>
                                                <div className="text-slate-800" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.action_steps) }}></div>
                                            </div>

                                            {/* Źródła i dalsza lektura */}
                                            {aiResponse.related_topics && aiResponse.related_topics.length > 0 && (
                                                <div className="no-print border border-slate-200 p-6 rounded-xl">
                                                    <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 flex items-center gap-2"><i className="ph-bold ph-link"></i> Źródła i dalsza lektura</h3>
                                                    <div className="flex flex-col gap-2">
                                                        {aiResponse.related_topics
                                                            .filter(key => LEGAL_SOURCES[key])
                                                            .map(key => (
                                                                <a key={key} href={LEGAL_SOURCES[key].url} target="_blank" rel="noopener noreferrer"
                                                                   className="flex items-center gap-2 text-sm text-blue-700 hover:text-blue-900 hover:underline font-semibold">
                                                                    <i className="ph-bold ph-arrow-square-out shrink-0"></i>
                                                                    {LEGAL_SOURCES[key].name}
                                                                </a>
                                                            ))}
                                                    </div>
                                                    <p className="text-[10px] text-slate-400 mt-3">Linki prowadzą do oficjalnej bazy ISAP (Sejm RP) lub portalu Ministerstwa Edukacji.</p>
                                                </div>
                                            )}

                                        </div>

                                        <div className="mt-20 pt-4 border-t border-slate-300 text-center">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Dokument wygenerowany przez system EduPrawo AI PRO.</p>
                                            <p className="text-[9px] text-slate-400 mt-1">Pamiętaj, że porada ma charakter informacyjny. W sytuacjach spornych skonsultuj się z prawnikiem organu prowadzącego szkołę.</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduPrawoApp />);
    </script>


</body></html>
