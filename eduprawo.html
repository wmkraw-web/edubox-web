<body>
    <div id="wspolne-menu-kontener" class="print-hidden"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const FIREBASE_CONFIG = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : {};
        const APP_ID = window.__app_id || "eduboxpro";

        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: (onUserLoad) => {
                if (!isInitialized && FIREBASE_CONFIG.apiKey) {
                    app = initializeApp(FIREBASE_CONFIG);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    signInAnonymously(auth).catch(e => console.error("Auth Error:", e));
                    isInitialized = true;
                    window.EduBoxCore.loadMenu();
                }
                if (auth) {
                    onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                }
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) fetch('/menu.html').then(r => r.text()).then(html => { container.innerHTML = html; }).catch(e => console.log(e));
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć wyczerpany!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                if(onToastUpdate) onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser) throw new Error("Brak połączenia z chmurą.");
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName), {
                    userId: currentUser.uid, createdAt: serverTimestamp(), type: appType, name: itemName, config: config
                });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                return onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName), (snapshot) => {
                    const loaded = []; snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatAIResponse = (text) => {
            if (!text) return "";
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\\n/g, '<br/>')
                .replace(/\n/g, '<br/>');
        };

        function EduPrawoApp() {
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); 
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            const [query, setQuery] = useState('');
            const [aiResponse, setAiResponse] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [botMessage, setBotMessage] = useState("Dzień dobry. Jestem EduPrawo V8 Kombajn. Podaj mi jakikolwiek problem prawny ze szkoły. Podam Ci podstawę, omówię ją na przykładach i wygeneruję gotowe pismo do pobrania.");

            const resultRef = useRef(null);

            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    if(localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                }
            }, [coreReady]);

            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_eduprawo', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); setAccessCode(''); localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else showToast('Błędny kod dostępu!'); 
            };

            const sharePattern = async () => {
                if (!aiResponse) return;
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Kombajn Prawny: ${query.substring(0, 30)}...`;
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_eduprawo', 'Porada Prawna', name, { query, aiResponse });
                            showToast("✨ Udostępniono w Bazie Prawa!");
                        } catch (e) { showToast(e.message || "🚨 Błąd podczas zapisu w chmurze."); }
                    },
                    showToast, showToast
                );
            };

            const loadPattern = (pattern) => {
                if(pattern.config && pattern.config.aiResponse) {
                    setQuery(pattern.config.query || '');
                    setAiResponse(pattern.config.aiResponse);
                    setAppMode('editor');
                    showToast("✨ Załadowano Poradę!");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                }
            };

            const executeAskAI = () => {
                if (!query.trim()) { showToast('Opisz swój problem prawny!'); return; }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => { setUsageCount(newCount); askAI(); },
                    showToast, showToast
                );
            };

            const askAI = async () => {
                setIsGenerating(true);
                setAiResponse(null);
                setBotMessage("Tworzę pełen kombajn prawny: Akty, Interpretację, Studium Przypadku, Checklistę i gotowe Pismo. Ze względu na głębię analizy, potrwa to ok. 30-40 sekund...");

                // OSTATECZNY PROMPT V8 KOMBAJN
                const systemPrompt = `Jesteś "Prawnym Kombajnem" dla nauczycieli i dyrektorów – elitarnym radcą prawnym, adwokatem i psychologiem w jednym. Tworzysz niesamowicie obszerne, wyczerpujące dokumenty od zera.
ZASADY BEZWZGLĘDNE (ICH ZŁAMANIE TO BŁĄD SYSTEMU):
1. STAN PRAWNY: Opierasz się o najnowsze prawo z lat 2024-2026.
2. DŁUGOŚĆ: Twoje odpowiedzi w polach 'interpretation' i 'case_studies' muszą być BARDZO DŁUGIE i wnikliwe. Żadnych lakonicznych haseł i jednozdaniowych podsumowań. Analizuj głęboko.
3. INTERPRETACJA ZAMIAST CYTATU: Podajesz artykuł, a następnie tłumaczysz na bardzo długich, życiowych przykładach, jakie luki lub prawa ma nauczyciel. Przetłumacz "z prawniczego na polski".
4. LINKOWANIE (ISAP): WSZĘDZIE w tekście używaj aktywnych linków HTML przy aktach prawnych. Zawsze używaj POJEDYNCZYCH cudzysłowów dla atrybutów HTML, aby nie popsuć JSON-a! Przykład: <a href='https://www.google.com/search?q=ISAP+Karta+Nauczyciela' target='_blank'>Karta Nauczyciela</a>.
5. GOTOWIEC: Wygeneruj pełnoprawny wzór pisma/wniosku/wezwania dla użytkownika.

Oczekuję CZYSTEGO FORMATU JSON bez osłon (np. bez \`\`\`json).
Struktura JSON:
{
  "legal_sources": [
    { "name": "Nazwa Ustawy", "search_query": "ISAP Nazwa Ustawy" }
  ],
  "legal_basis": "Szczegółowy wykaz aktów prawnych (zawsze z tagami <a>).",
  "interpretation": "Niezwykle dogłębna, szczegółowa i analityczna interpretacja problemu. Tłumaczenie przepisów na język potoczny. Mnóstwo tekstu i detali.",
  "case_studies": [
    {
      "title": "Studium Przypadku: Problem na dyżurze",
      "description": "Długi, oparty na faktach i bardzo realistyczny opis sytuacji w szkole.",
      "solution": "Szczegółowe, prawno-praktyczne rozwiązanie tej konkretnej sytuacji."
    }
  ],
  "checklist": [
    "Pierwszy bardzo szczegółowy krok do wykonania.",
    "Drugi bardzo szczegółowy krok..."
  ],
  "draft_title": "Tytuł Pisma (np. Wniosek o polecenie na piśmie)",
  "draft_content": "MIEJSCOWOŚĆ, DATA\\n\\nDo:\\nDyrektora Szkoły...\\n\\nTREŚĆ PISMA... Z Poważaniem..."
}`;

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: query, 
                            system: systemPrompt, 
                            temperature: 0.6, // Wyższa temperatura wymusza długie, kwieciste opisy i przykłady
                            model: "gpt-4o-mini",
                            format: "json" 
                        })
                    });
                    
                    if (!res.ok) throw new Error("Błąd serwera AI.");
                    
                    const data = await res.json();
                    let cleanText = data.text;
                    
                    // Ekstrakcja JSON w przypadku dodatkowych dopisków
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const o = JSON.parse(cleanText); if(o.content) cleanText = o.content; else if (o.choices) cleanText = o.choices[0].message.content; } catch(e){}
                    }
                    
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    let parsedData;
                    try {
                        if (jsonStr.indexOf('{') !== -1) {
                            parsedData = JSON.parse(jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1));
                        } else throw new Error();
                    } catch(e) {
                        parsedData = {
                            legal_basis: "Błąd formatowania serwera. Skonsultuj z radcą.",
                            interpretation: cleanText,
                            case_studies: [], checklist: [], draft_title: "Brak", draft_content: ""
                        };
                    }

                    setAiResponse(parsedData);
                    setBotMessage("Sukces! Wygenerowałem dla Ciebie pełny pakiet: Analizę, Studia Przypadków, Check-listę działań oraz gotowy wzór pisma.");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                } catch (error) {
                    showToast(`Błąd: ${error.message}`);
                    setBotMessage("Napotkałem problem z serwerem. Upewnij się, że Vercel działa poprawnie.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportToWord = () => {
                if(!aiResponse) return;
                const content = document.getElementById('print-container').innerHTML;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Kombajn EduPrawo</title>
                <style>
                    body { font-family: 'Arial', sans-serif; font-size: 11pt; line-height: 1.5; color: #000; }
                    h1 { font-size: 16pt; color: #1e3a8a; text-transform: uppercase; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px;}
                    h3 { font-size: 13pt; color: #1e3a8a; margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px;}
                    p { margin-bottom: 15px; text-align: justify; }
                    .basis-box { background-color: #f1f5f9; padding: 15px; border-left: 4px solid #3b82f6; margin-bottom: 20px; }
                    .case-box { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; }
                    .draft-box { background-color: #fef3c7; padding: 25px; border: 1px solid #fde68a; margin-top: 30px; font-family: 'Times New Roman', serif; }
                    strong { color: #000; font-weight: bold; }
                    a { color: #000; text-decoration: none; }
                    ul { margin-top: 5px; margin-bottom: 15px; }
                    li { margin-bottom: 8px; }
                </style></head><body>`;
                const footer = `</body></html>`;
                
                const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `PrawnyKombajn_${Date.now()}.doc`;
                link.click();
            };

            if (!coreReady) return <div className="min-h-screen flex items-center justify-center text-white">Ładowanie silnika...</div>;

            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        <div className="hero-glow print-hidden"></div>
                        {toastMessage && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-sky-500 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300">{toastMessage}</div>}
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-scales text-4xl"></i> Baza Prawa Oświatowego</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl"></i> Udostępnij ten przypadek prawny
                                </button>
                                <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-5 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-3 shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="flex justify-between items-start gap-3">
                                                <span className="text-sm md:text-base font-bold text-slate-200 group-hover:text-fuchsia-400 transition-colors line-clamp-2">{p.name}</span>
                                                <span className="text-[10px] font-bold px-2 py-1 rounded bg-sky-900/50 border border-sky-500/30 text-sky-300 uppercase tracking-widest">{p.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center font-bold">
                                                <p className="text-xs text-slate-500">Autor: {p.userId.substring(0,6)}</p>
                                                <p className="text-xs text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow print-hidden"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-sky-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm animate-toast flex items-center gap-3 border border-sky-400 print-hidden">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-sky-500/30 shadow-[0_0_50px_rgba(14,165,233,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-sky-500 rounded-full animate-spin"></div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Pracuję na pełnych obrotach...</h3>
                                    <p className="text-xs text-slate-400 font-medium">Model Kombajn przygotowuje wyczerpujący raport. To zajmie ok. 30 sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-sky-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <i className="ph-bold ph-scales text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">Edu<span className="text-sky-400">Prawo</span> Kombajn</span>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* LEWA KOLUMNA: GENERATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="flex flex-col gap-4">
                                    {!isPremium ? (
                                        <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-sky-500/30 bg-sky-950/20">
                                            <div className="flex flex-col px-2">
                                                <span className="text-[10px] font-bold text-sky-300 uppercase tracking-widest">Darmowe: {Math.max(0, 5 - usageCount)}/5</span>
                                            </div>
                                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                                <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-32 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-sky-500 uppercase"/>
                                                <button onClick={handleVerifyCode} className="px-3 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold transition-all btn-bounce">OK</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                            <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                            <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduPrawo PRO Aktywny</span>
                                        </div>
                                    )}
                                    <button onClick={() => setAppMode('gielda')} className="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-fuchsia-900/30 hover:border-fuchsia-500/50 transition-all shadow-md btn-bounce flex items-center justify-center gap-2">
                                        <i className="ph-bold ph-files text-lg text-fuchsia-400"></i> Baza Prawa Oświatowego
                                    </button>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50">
                                    <h2 className="text-2xl font-black text-white flex items-center gap-3 mb-4">
                                        <i className="ph-bold ph-lightning text-sky-400"></i> Twój Problem
                                    </h2>
                                    <p className="text-slate-400 text-sm mb-6">
                                        Wpisz bardzo dokładnie z jakim problemem prawnym lub organizacyjnym zmagasz się w szkole. Zastosuję silnik "Kombajn", by dać Ci rozwiązanie, przykłady i gotowe pismo.
                                    </p>
                                    <textarea 
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                        placeholder="Np. Odmawiają mi zapłaty za godziny doraźne w przedszkolu, gdy pojechałam z dziećmi na konkurs..."
                                        className="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-2xl p-5 min-h-[160px] focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 custom-scrollbar resize-y text-sm leading-relaxed mb-6"
                                    ></textarea>
                                    <button 
                                        onClick={executeAskAI}
                                        disabled={isGenerating || !query.trim()}
                                        className={`w-full py-4 rounded-xl font-black text-white text-sm uppercase tracking-widest transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(14,165,233,0.2)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-sky-500 hover:scale-105'}`}
                                    >
                                        <i className="ph-bold ph-engine text-lg"></i> Uruchom Kombajn {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                    </button>
                                </div>

                                <div className="p-5 rounded-3xl shadow-lg border flex items-start gap-4 animate-[reveal_0.3s_ease-out] transition-colors bg-blue-900/20 border-blue-500/30">
                                    <div className="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center border-2 border-sky-400 flex-shrink-0 shadow-lg">
                                        <i className="ph-bold ph-robot text-sky-400 text-2xl"></i>
                                    </div>
                                    <div className="flex-1 pt-1">
                                        <h4 className="font-black text-xs uppercase tracking-widest mb-1.5 text-sky-400">Główny Radca AI</h4>
                                        <p className="text-sm font-medium leading-relaxed text-slate-300" key={botMessage}>{botMessage}</p>
                                    </div>
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA: WYNIK (OPINIA PRAWNA) */}
                            <div className="lg:col-span-7 flex flex-col h-full print:block" ref={resultRef}>
                                
                                {aiResponse && (
                                    <div className="flex flex-wrap justify-end gap-3 mb-6 print-hidden bg-slate-900/50 p-2 rounded-2xl border border-slate-800 backdrop-blur-md fade-in">
                                        <button onClick={sharePattern} className="flex-1 sm:flex-none bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm btn-bounce">
                                            <i className="ph-bold ph-cloud-arrow-up text-lg"></i> Zapisz do Bazy
                                        </button>
                                        <button onClick={exportToWord} className="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm btn-bounce">
                                            <i className="ph-bold ph-download text-lg"></i> Pobierz Word
                                        </button>
                                        <button onClick={() => window.print()} className="flex-1 sm:flex-none bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm btn-bounce">
                                            <i className="ph-bold ph-printer text-lg"></i> Drukuj PDF
                                        </button>
                                    </div>
                                )}

                                {!aiResponse ? (
                                    <div className="glass-panel rounded-[2.5rem] p-6 sm:p-12 border border-slate-700/50 flex flex-col items-center justify-center h-full min-h-[600px] print-hidden opacity-50">
                                        <i className="ph-duotone ph-scales text-7xl text-slate-500 mb-6"></i>
                                        <h2 className="text-xl font-bold text-white mb-2">Prawny Kombajn (V8)</h2>
                                        <p className="text-center font-medium text-sm text-slate-400 max-w-md">System dostarczy Ci dogłębnej analizy, gotowych kroków, przykładów z życia szkoły i sformułuje dla Ciebie gotowe pismo prawne.</p>
                                    </div>
                                ) : (
                                    <div className="bg-white text-slate-900 rounded-sm p-8 md:p-14 shadow-2xl min-h-[297mm] document-font fade-in print:shadow-none print:p-0" id="print-container">
                                        
                                        <div className="text-center border-b-2 border-slate-300 pb-6 mb-8 print-border-bottom">
                                            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Zastrzeżony Raport Asystenta EduPrawo</div>
                                            <h1 className="text-2xl md:text-3xl font-black uppercase text-blue-900 tracking-tight">Ekspertyza Prawna & Pakiet Działań</h1>
                                        </div>

                                        <div className="ai-content text-sm md:text-base leading-relaxed space-y-10 text-justify">
                                            
                                            {/* 1. Podstawa Prawna i Linki */}
                                            <div className="bg-blue-50 border-l-4 border-blue-600 p-6 rounded-r-xl print-bg-light basis-box">
                                                <h3 className="text-xs font-black uppercase text-blue-800 tracking-widest mb-4 flex items-center gap-2"><i className="ph-bold ph-book-bookmark"></i> Główne Akty Prawne (Z Linkami)</h3>
                                                
                                                {aiResponse.legal_sources && aiResponse.legal_sources.length > 0 && (
                                                    <div className="flex flex-wrap gap-2 mb-5">
                                                        {aiResponse.legal_sources.map((src, idx) => (
                                                            <a key={idx} href={`https://www.google.com/search?q=${encodeURIComponent(src.search_query)}`} target="_blank" rel="noopener noreferrer" className="bg-white border border-blue-200 text-blue-700 hover:bg-blue-600 hover:text-white hover:border-blue-600 px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 shadow-sm print-hidden" style={{textDecoration: 'none'}}>
                                                                <i className="ph-bold ph-link text-sm"></i> Baza ISAP: {src.name}
                                                            </a>
                                                        ))}
                                                    </div>
                                                )}
                                                <p className="m-0 text-slate-700" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.legal_basis) }}></p>
                                            </div>

                                            {/* 2. Dogłębna Interpretacja */}
                                            {aiResponse.interpretation && (
                                                <div>
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-4 border-b border-slate-200 pb-2 flex items-center gap-2">
                                                        <i className="ph-bold ph-magnifying-glass text-xl text-sky-500"></i> 1. Interpretacja Krok po Kroku (Po ludzku)
                                                    </h3>
                                                    <div className="text-slate-800 font-medium space-y-4" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.interpretation) }}></div>
                                                </div>
                                            )}

                                            {/* Zabezpieczenie dla starych wpisów z Giełdy (które miały explanation_sections albo explanation) */}
                                            {aiResponse.explanation_sections && !aiResponse.interpretation && (
                                                <div>
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-4 border-b border-slate-200 pb-2">Archiwalna Interpretacja</h3>
                                                    {aiResponse.explanation_sections.map((s,i) => <div key={i}><strong className="block mb-2">{s.title}</strong><p dangerouslySetInnerHTML={{__html: formatAIResponse(s.content)}}></p></div>)}
                                                </div>
                                            )}
                                            {aiResponse.explanation && !aiResponse.interpretation && !aiResponse.explanation_sections && (
                                                <div>
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-4 border-b border-slate-200 pb-2">Archiwalna Interpretacja</h3>
                                                    <div dangerouslySetInnerHTML={{__html: formatAIResponse(aiResponse.explanation)}}></div>
                                                </div>
                                            )}

                                            {/* 3. Przykłady z Życia (Case Studies) */}
                                            {aiResponse.case_studies && aiResponse.case_studies.length > 0 && (
                                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 print-bg-light">
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-5 flex items-center gap-2">
                                                        <i className="ph-bold ph-users-three text-xl text-sky-500"></i> 2. Studium Przypadku (Jak to wygląda w szkole?)
                                                    </h3>
                                                    <div className="space-y-6">
                                                        {aiResponse.case_studies.map((cs, idx) => (
                                                            <div key={idx} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm case-box">
                                                                <h4 className="font-bold text-sky-800 mb-3 uppercase text-xs tracking-widest border-b border-slate-100 pb-2">{cs.title || `Sytuacja ${idx+1}`}</h4>
                                                                <p className="text-slate-700 mb-4" dangerouslySetInnerHTML={{ __html: formatAIResponse(cs.description) }}></p>
                                                                <div className="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-lg">
                                                                    <strong className="text-emerald-800 block mb-1">Rozwiązanie i Wniosek:</strong>
                                                                    <p className="text-slate-800 m-0 text-sm" dangerouslySetInnerHTML={{ __html: formatAIResponse(cs.solution) }}></p>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Zabezpieczenie dla starych examples */}
                                            {aiResponse.examples && (!aiResponse.case_studies || aiResponse.case_studies.length === 0) && (
                                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 print-bg-light">
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-5 flex items-center gap-2"><i className="ph-bold ph-users-three text-xl text-sky-500"></i> 2. Z życia szkoły (Przykłady)</h3>
                                                    {aiResponse.examples.map((ex, idx) => (
                                                        <div key={idx} className="bg-white p-5 rounded-xl border border-slate-100 shadow-sm mb-4">
                                                            <p className="text-sky-800 font-bold mb-2">{ex.scenario}</p>
                                                            <p className="text-emerald-700 font-medium"><strong>Rozwiązanie:</strong> {ex.solution}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* 4. Check-lista Działań */}
                                            {aiResponse.checklist && aiResponse.checklist.length > 0 && (
                                                <div>
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-4 border-b border-slate-200 pb-2 flex items-center gap-2">
                                                        <i className="ph-bold ph-list-checks text-xl text-emerald-500"></i> 3. Twoja Check-lista (Co zrobić teraz)
                                                    </h3>
                                                    <div className="bg-emerald-50/50 border border-emerald-200 rounded-2xl p-6">
                                                        {aiResponse.checklist.map((task, idx) => (
                                                            <div key={idx} className="flex items-start gap-3 mb-4 last:mb-0">
                                                                <i className="ph-bold ph-check-square text-emerald-600 text-2xl shrink-0 mt-0.5"></i>
                                                                <span className="text-slate-800 font-medium leading-relaxed" dangerouslySetInnerHTML={{ __html: formatAIResponse(task) }}></span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Zabezpieczenie starych Action Steps */}
                                            {aiResponse.action_steps && (!aiResponse.checklist || aiResponse.checklist.length === 0) && (
                                                <div className="bg-slate-50 border border-slate-200 p-8 rounded-xl mt-10 print-bg-light">
                                                    <h3 className="text-sm font-black uppercase text-slate-800 tracking-widest mb-4 border-b border-slate-200 pb-2">Rekomendowane Działania</h3>
                                                    <div className="text-slate-800 font-medium" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.action_steps) }}></div>
                                                </div>
                                            )}

                                            {/* 5. Gotowiec Urzędowy */}
                                            {aiResponse.draft_content && (
                                                <div className="mt-12 relative group print-break-inside-avoid">
                                                    <div className="flex justify-between items-end border-b-2 border-amber-300 pb-3 mb-6">
                                                        <h3 className="text-sm font-black uppercase text-amber-700 tracking-widest flex items-center gap-2">
                                                            <i className="ph-bold ph-file-text text-2xl text-amber-500"></i> 4. Twój Gotowiec 
                                                            <span className="text-[10px] bg-amber-100 px-2 py-1 rounded text-amber-800 lowercase ml-2">({aiResponse.draft_title || 'Wzór pisma'})</span>
                                                        </h3>
                                                        <button onClick={() => { navigator.clipboard.writeText(aiResponse.draft_content.replace(/<br\/>/g, '\n').replace(/\\n/g, '\n').replace(/<[^>]*>?/gm, '')); showToast('Pismo skopiowane do schowka!'); }} className="text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg transition-colors print-hidden flex items-center gap-2 active:scale-95 shadow-md">
                                                            <i className="ph-bold ph-copy text-lg"></i> Kopiuj Gotowca
                                                        </button>
                                                    </div>
                                                    <div className="draft-box whitespace-pre-wrap leading-loose" dangerouslySetInnerHTML={{ __html: formatAIResponse(aiResponse.draft_content) }}></div>
                                                </div>
                                            )}

                                            {/* Zabezpieczenie dla starych szablonów (draft_template) */}
                                            {aiResponse.draft_template && !aiResponse.draft_content && (
                                                <div className="mt-12 relative group print-break-inside-avoid">
                                                    <div className="flex justify-between items-end border-b-2 border-amber-300 pb-3 mb-6">
                                                        <h3 className="text-sm font-black uppercase text-amber-700 tracking-widest flex items-center gap-2"><i className="ph-bold ph-file-text text-2xl text-amber-500"></i> 4. Twój Gotowiec</h3>
                                                        <button onClick={() => { navigator.clipboard.writeText(aiResponse.draft_template.replace(/\\n/g, '\n')); showToast('Gotowiec skopiowany do schowka!'); }} className="text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg transition-colors print-hidden flex items-center gap-2 active:scale-95 shadow-md">
                                                            <i className="ph-bold ph-copy text-lg"></i> Kopiuj Gotowca
                                                        </button>
                                                    </div>
                                                    <div className="draft-box whitespace-pre-wrap leading-loose">{aiResponse.draft_template}</div>
                                                </div>
                                            )}

                                        </div>

                                        <div className="mt-20 pt-6 border-t-2 border-slate-200 text-center">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Raport wygenerowany przez system EduPrawo AI PRO (V8 Kombajn).</p>
                                            <p className="text-[9px] text-slate-400 mt-2 max-w-xl mx-auto leading-relaxed">Pamiętaj, że porada ma charakter informacyjno-wspomagający. Weryfikuj podane podstawy w linkach ISAP. W sytuacjach skrajnie spornych i sądowych skonsultuj ostateczny dokument z adwokatem lub prawnikiem ZNP/Solidarności.</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduPrawoApp />);
    </script>
</body>
</html>
