name: Add Blog Post

# Wpis bloga po kliknięciu „Publikuj” w mailu (Make → repository_dispatch „add-blog-post”).
# Make wysyła TYLKO dane (tytuł, zajawka, kategoria, ikona, treść HTML). Wpis buduje i sprawdza
# scripts/publikacje.js: czyści HTML, zostawia linki tylko do naszych stron, odrzuca numery przepisów.
# Błąd = czerwony przebieg i mail z GitHuba, blog zostaje bez zmian.

on:
  repository_dispatch:
    types: [add-blog-post]

permissions:
  contents: write

concurrency:
  group: publikacje
  cancel-in-progress: false

jobs:
  add-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Dodaj wpis do blog-posts.js
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload.post) }}
        run: node scripts/publikacje.js blog

      - name: Sprawdź pliki danych i SEO
        run: |
          npm run jsliteral:check
          npm run seo:sitemap
          npm run seo:check

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-posts.js sitemap.xml
          git commit -m "Nowy wpis na blogu (automat, zaakceptowany mailem) + sitemap" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
