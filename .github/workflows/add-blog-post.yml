name: Add Blog Post

on:
  repository_dispatch:
    types: [add-blog-post]

permissions:
  contents: write

jobs:
  add-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add new post to blog-posts.js
        env:
          NEW_POST_JSON: ${{ toJson(github.event.client_payload.post) }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'blog-posts.js';

          let content = fs.readFileSync(path, 'utf8');

          // NEW_POST_JSON is a JSON-encoded string - parse it back to raw text
          const rawPost = JSON.parse(process.env.NEW_POST_JSON);

          // Fill in today's date if the post text still has the placeholder
          const today = new Date().toISOString().slice(0, 10);
          const postText = rawPost.replace(/DATE_TODAY/g, today);

          const marker = 'window.BLOG_POSTS = [';
          if (!content.includes(marker)) {
            throw new Error('Nie znaleziono "window.BLOG_POSTS = [" w blog-posts.js');
          }

          content = content.replace(marker, marker + '\n' + postText + ',');
          fs.writeFileSync(path, content, 'utf8');
          console.log('Wpis dodany poprawnie.');
          EOF

      - name: Update sitemap.xml with the new post
        run: |
          node <<'EOF'
          const fs = require('fs');

          const postsFileText = fs.readFileSync('blog-posts.js', 'utf8');
          const fakeWindow = {};
          new Function('window', postsFileText)(fakeWindow);
          const posts = fakeWindow.BLOG_POSTS;

          const today = new Date().toISOString().slice(0, 10);
          const isDate = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d || '');

          let sitemap = fs.readFileSync('sitemap.xml', 'utf8');

          // Remove all existing "blog.html?post=..." entries
          sitemap = sitemap.replace(
            /\s*<url>\s*<loc>https:\/\/eduboxpro\.pl\/blog\.html\?post=[^<]*<\/loc>[\s\S]*?<\/url>/g,
            ''
          );

          // Rebuild one entry per current post, newest (top of array) first
          const entries = posts.map((p) => {
            const lastmod = isDate(p.date) ? p.date : today;
            return (
              '  <url>\n' +
              `    <loc>https://eduboxpro.pl/blog.html?post=${p.slug}</loc>\n` +
              `    <lastmod>${lastmod}</lastmod>\n` +
              '    <changefreq>monthly</changefreq>\n' +
              '    <priority>0.7</priority>\n' +
              '  </url>'
            );
          }).join('\n');

          // Insert the fresh list right after the plain blog.html entry,
          // and bump that entry's own lastmod to today.
          sitemap = sitemap.replace(
            /<url>\s*<loc>https:\/\/eduboxpro\.pl\/blog\.html<\/loc>\s*<lastmod>[^<]*<\/lastmod>([\s\S]*?)<\/url>/,
            `<url>\n    <loc>https://eduboxpro.pl/blog.html</loc>\n    <lastmod>${today}</lastmod>$1</url>\n${entries}`
          );

          fs.writeFileSync('sitemap.xml', sitemap);
          console.log('sitemap.xml zaktualizowany, wpisów w mapie:', posts.length);
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-posts.js sitemap.xml
          git commit -m "Nowy wpis na blogu (automat) + aktualizacja sitemap" || echo "Brak zmian do commitu"
          git push
