name: Kontrola przepisów (ISAP)

# Co poniedziałek sprawdza w oficjalnym API Sejmu (ELI/ISAP), czy akty prawne, na których opierają się
# narzędzia i wzory EduBox, nie zostały znowelizowane lub uchylone. Zmiana = czerwony przebieg = mail
# z GitHuba. Po przejrzeniu i poprawieniu treści: npm run legal:update i commit scripts/legal-acts.json.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Sprawdź status aktów prawnych w API Sejmu
        run: node scripts/check-legal.js
