<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduBox - Generator Influencerki</title>

    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons (do UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Fonty -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Baza aplikacji EduBox (ładowana dynamicznie, jak w Katalogu) -->
    <script>
        const eduboxAppsScript = document.createElement('script');
        eduboxAppsScript.src = './apps.js?v=' + new Date().getTime();
        eduboxAppsScript.onerror = () => { window.appsJsError = true; };
        document.head.appendChild(eduboxAppsScript);
    </script>

    <!-- Wspólne dane: święta (jak EduKalendarz), sekcje Bazy Materiałów, tematy i instrukcje postów -->
    <script src="/kalendarz-dane.js"></script>
    <script src="/materialy-wspolne.js"></script>
    <script src="/ewa-tematy.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Fredoka', 'sans-serif'] },
                    colors: { slate: { 950: '#020617' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
  <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body>
    <a href="index.html" title="Strona główna EduBox AI" class="no-print" style="position:fixed;bottom:14px;left:14px;z-index:9999;width:46px;height:46px;border-radius:9999px;background:rgba(15,23,42,0.88);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.3);text-decoration:none;font-size:22px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.15);">
        <i class="ph-bold ph-house"></i>
    </a>
    <a href="panel-jakosci.html" title="Otwórz prywatny Panel jakości Make" class="no-print" style="position:fixed;bottom:14px;left:70px;z-index:9999;height:46px;border-radius:9999px;background:rgba(79,70,229,0.94);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;box-shadow:0 4px 14px rgba(0,0,0,0.3);text-decoration:none;font-size:14px;font-weight:800;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.18);">
        <i class="ph-bold ph-chart-line-up" style="font-size:20px"></i><span>Panel jakości</span>
    </a>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const T = window.EwaTematy;

        const CAT_LABELS = {
            'terapia': 'Terapia i SPE',
            'biurokracja': 'Biurokracja i Dokumenty',
            'zajecia': 'Zajęcia i Gry',
            'grafika': 'Grafika i Kreatywne',
            'inne': 'Pozostałe Aplikacje'
        };
        // Publiczny klucz projektu Firebase (ten sam co na stronach) – tylko do ODCZYTU katalogu pakietów.
        const FIREBASE_KEY = 'AIzaSyDL_mvepNJjMmZYQzifN2cXzoKwCE8jNd0';
        const ZRODLA = [
            { id: 'narzedzie', label: 'Narzędzie', icon: 'ph-app-window' },
            { id: 'swieto', label: 'Dzień z kalendarza', icon: 'ph-calendar-star' },
            { id: 'pakiet', label: 'Pakiet', icon: 'ph-package' },
            { id: 'temat', label: 'Własny temat', icon: 'ph-chat-text' },
            { id: 'plan', label: 'Plan tygodnia', icon: 'ph-calendar-dots' },
        ];
        const TYP_ETYKIETA = { narzedzie: 'Narzędzie', swieto: 'Święto', pakiet: 'Pakiet', temat: 'Temat' };
        const BASE_EWA_PROMPT = "SOLO PORTRAIT, ONLY ONE PERSON. A 32-year-old beautiful Polish female teacher named Ewa, short wavy blonde hair, wearing a stylish grey suit and a white shirt. Friendly expression, looking directly at the camera, photorealistic, 8k, highly detailed, alone in the scene.";
        const dzisISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

        // Tekst posta przez wspólny /api/chat (balanced = gpt-5.4-mini – lepszy język postów niż domyślny model).
        async function napiszPost(z, platform) {
            const { system, prompt } = T.promptEwy(z, platform);
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, system, format: 'json', temperature: 0.7, model: 'balanced' })
            });
            if (!res.ok) throw new Error('Błąd serwera tekstu (' + res.status + '). Spróbuj ponownie.');
            const data = await res.json();
            const raw = data.text || data.message || data.response || (data.choices && data.choices[0]?.message?.content);
            if (!raw) throw new Error('Serwer nie zwrócił tekstu.');
            const wynik = T.parsujOdpowiedz(raw, z.apps || []);
            return { ...wynik, linki: T.linkiPosta(z, wynik) };
        }

        // Zdjęcie Ewy (fal.ai przez /api/ewa-generate) – zablokowany opis wyglądu, żeby twarz była zawsze ta sama.
        async function zdjecieEwy(imagePrompt) {
            const res = await fetch('/api/ewa-generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'image',
                    prompt: `${BASE_EWA_PROMPT} ${imagePrompt || 'Ewa smiling in a bright classroom'}. NO TEXT, NO WATERMARKS.`,
                    negative_prompt: "text, words, letters, watermark, mutated, ugly, multiple people, extra person, man, men, crowd, boyfriend, date, background characters",
                    aspect_ratio: '4:5',
                    size: '1024x1280'
                })
            });
            if (!res.ok) throw new Error('Nie udało się wygenerować zdjęcia z FAL AI.');
            const d = await res.json();
            let url = d.imageUrl || d.url || (d.data && d.data[0]?.url) || d.image;
            if (url && url.length > 1000 && !url.startsWith('http')) url = `data:image/png;base64,${url}`;
            return url;
        }

        const tekstDoSkopiowania = (post, linki) => (linki && linki.length ? `${post}\n\n${linki.map((l) => `🔗 ${l.url}`).join('\n')}` : post);

        function KopiujPrzycisk({ tekst, etykieta = 'Kopiuj', className = '' }) {
            const [ok, setOk] = useState(false);
            return (
                <button onClick={() => { navigator.clipboard.writeText(tekst); setOk(true); setTimeout(() => setOk(false), 1800); }}
                    className={`shrink-0 bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors ${className}`}>
                    <i className={ok ? 'ph-bold ph-check' : 'ph-bold ph-copy'}></i> {ok ? 'Skopiowano' : etykieta}
                </button>
            );
        }

        function App() {
            const [zrodlo, setZrodlo] = useState(() => { try { const z = localStorage.getItem('ewaZrodlo'); return ZRODLA.some((x) => x.id === z) ? z : 'narzedzie'; } catch (e) { return 'narzedzie'; } });
            const [platform, setPlatform] = useState('Facebook - Grupy dla Nauczycieli');
            const [topic, setTopic] = useState('');
            const [includeImage, setIncludeImage] = useState(true);
            const [uzyjOkladki, setUzyjOkladki] = useState(true);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const [apps, setApps] = useState([]);
            const [appsError, setAppsError] = useState(false);
            const [selectedAppIndex, setSelectedAppIndex] = useState('random');
            const [pakiety, setPakiety] = useState(null); // null = jeszcze się wczytuje
            const [pakietyError, setPakietyError] = useState('');
            const [pakietId, setPakietId] = useState('');
            const [swietoKlucz, setSwietoKlucz] = useState('');

            // Wynik (jeden post)
            const [wynik, setWynik] = useState(null); // { post, titles, pinTitle, keywords, imagePrompt, linki, nazwa, typ }
            const [imageUrl, setImageUrl] = useState('');
            const [imageLoading, setImageLoading] = useState(false);

            // Plan tygodnia
            const [planStart, setPlanStart] = useState(dzisISO());
            const [plan, setPlan] = useState([]); // [{ ...slot, stan: 'nowy'|'pisze'|'gotowy'|'blad', wynik, blad }]
            const [planPisze, setPlanPisze] = useState(false);

            useEffect(() => { try { if (ZRODLA.some((x) => x.id === zrodlo)) localStorage.setItem('ewaZrodlo', zrodlo); } catch (e) {} }, [zrodlo]);

            useEffect(() => {
                let attempts = 0;
                const checkData = setInterval(() => {
                    if (window.appsJsError) { clearInterval(checkData); setAppsError(true); return; }
                    if (window.EduBoxData && window.EduBoxData.APPS) { setApps(window.EduBoxData.APPS); clearInterval(checkData); }
                    else if (++attempts > 25) { clearInterval(checkData); setAppsError(true); }
                }, 200);
                return () => clearInterval(checkData);
            }, []);

            useEffect(() => {
                fetch(`${T.FIRESTORE_KATALOG}?key=${FIREBASE_KEY}&pageSize=300`)
                    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
                    .then((j) => setPakiety(T.pakietyZFirestore(j)))
                    .catch((e) => { console.error(e); setPakiety([]); setPakietyError('Nie udało się wczytać katalogu pakietów (' + e.message + ').'); });
            }, []);

            const swieta = useMemo(() => T.nadchodzaceSwieta(new Date(), 60).map((x) => ({ ...x, klucz: `${x.month}|${x.swieto.name}`, pakiety: T.pakietyDoSwieta(x.swieto, pakiety || []) })), [pakiety]);
            useEffect(() => { if (!swietoKlucz && swieta.length) setSwietoKlucz(swieta[0].klucz); }, [swieta]);
            useEffect(() => { if (!pakietId && pakiety && pakiety.length) setPakietId(pakiety[0].id); }, [pakiety]);

            const groupedApps = apps.reduce((acc, app, idx) => { const cat = app.category || 'inne'; (acc[cat] = acc[cat] || []).push({ ...app, idx }); return acc; }, {});
            const pakietyWSekcjach = (pakiety || []).reduce((acc, p) => { const s = T.sekcjaPakietu(p); (acc[s] = acc[s] || []).push(p); return acc; }, {});
            const wybranyPakiet = (pakiety || []).find((p) => p.id === pakietId) || null;
            const wybraneSwieto = swieta.find((x) => x.klucz === swietoKlucz) || null;
            const okladka = wybranyPakiet ? T.okladkaPakietu(wybranyPakiet) : '';

            // Opis źródła posta (to samo, co trafia do instrukcji dla AI i do linków).
            function biezaceZrodlo() {
                if (zrodlo === 'narzedzie') {
                    const app = selectedAppIndex === 'random' ? apps[Math.floor(Math.random() * apps.length)] : apps[Number(selectedAppIndex)];
                    return app ? { typ: 'narzedzie', app, temat: topic.trim() } : null;
                }
                if (zrodlo === 'swieto') {
                    if (!wybraneSwieto) return null;
                    return { typ: 'swieto', swieto: wybraneSwieto.swieto, month: wybraneSwieto.month, data: wybraneSwieto.data, dniDo: T.roznicaDni(new Date(), wybraneSwieto.data), pakiety: wybraneSwieto.pakiety, temat: topic.trim() };
                }
                if (zrodlo === 'pakiet') return wybranyPakiet ? { typ: 'pakiet', pakiet: wybranyPakiet, temat: topic.trim() } : null;
                if (zrodlo === 'temat') return topic.trim() ? { typ: 'temat', temat: topic.trim(), apps } : null;
                return null;
            }

            const zGrafikaOkladki = (z) => z && z.typ === 'pakiet' && uzyjOkladki && T.okladkaPakietu(z.pakiet);

            const generateContent = async () => {
                const z = biezaceZrodlo();
                if (!z) return;
                setLoading(true); setErrorMsg(''); setWynik(null); setImageUrl('');
                try {
                    const w = await napiszPost(z, platform);
                    setWynik({ ...w, nazwa: T.nazwaZrodla(z), typ: z.typ });
                    const okl = zGrafikaOkladki(z);
                    if (okl) setImageUrl(okl);
                    else if (includeImage) await generujZdjecie(w.imagePrompt);
                } catch (err) {
                    console.error(err);
                    setErrorMsg(err.message || 'Wystąpił nieznany błąd podczas generowania.');
                } finally {
                    setLoading(false);
                }
            };

            const generujZdjecie = async (imagePrompt) => {
                setImageLoading(true);
                try { setImageUrl(await zdjecieEwy(imagePrompt)); }
                catch (e) { setErrorMsg(e.message); }
                finally { setImageLoading(false); }
            };

            // ---------- Plan tygodnia ----------
            const ulozPlan = () => {
                const [y, m, d] = planStart.split('-').map(Number);
                setPlan(T.planTygodnia(new Date(y, m - 1, d), { pakiety: pakiety || [], apps }).map((s) => ({ ...s, stan: 'nowy' })));
            };
            const napiszSzkic = async (i) => {
                const slot = plan[i];
                setPlan((p) => p.map((x, j) => (j === i ? { ...x, stan: 'pisze', blad: '' } : x)));
                try {
                    const w = await napiszPost(slot, platform);
                    setPlan((p) => p.map((x, j) => (j === i ? { ...x, stan: 'gotowy', wynik: w } : x)));
                } catch (e) {
                    setPlan((p) => p.map((x, j) => (j === i ? { ...x, stan: 'blad', blad: e.message } : x)));
                }
            };
            const napiszWszystkie = async () => {
                setPlanPisze(true);
                for (let i = 0; i < plan.length; i += 1) { if (plan[i].stan !== 'gotowy') await napiszSzkic(i); } // po kolei – bez zalewania serwera
                setPlanPisze(false);
            };
            const otworzSzkic = (slot) => {
                setWynik({ ...slot.wynik, nazwa: T.nazwaZrodla(slot), typ: slot.typ });
                setImageUrl(slot.typ === 'pakiet' ? T.okladkaPakietu(slot.pakiet) : '');
                setZrodlo('wynik-planu');
            };

            const gotowyDoGeneracji = !!biezaceZrodlo() || (zrodlo === 'narzedzie' && apps.length > 0);
            const pokazPlan = zrodlo === 'plan';
            const pokazZdjecieEwy = zrodlo !== 'pakiet' || !uzyjOkladki || !okladka;

            const selectCls = "w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-xl outline-none focus:border-pink-500";
            const labelCls = "block text-xs font-bold text-slate-400 uppercase mb-2";

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-6 flex items-center gap-4">
                            <div className="w-14 h-14 bg-gradient-to-br from-pink-500 to-rose-600 rounded-2xl flex items-center justify-center shadow-lg shrink-0">
                                <i className="ph-fill ph-instagram-logo text-3xl text-white"></i>
                            </div>
                            <div className="min-w-0">
                                <h1 className="text-3xl font-display font-bold text-white">EduInfluencer Studio</h1>
                                <p className="text-slate-400">Posty Ewy: narzędzia, dni z EduKalendarza, pakiety z Bazy Materiałów i własne tematy</p>
                            </div>
                        </header>

                        <div className="flex flex-wrap gap-2 mb-6" role="tablist" aria-label="O czym piszemy">
                            {ZRODLA.map((z) => (
                                <button key={z.id} role="tab" aria-selected={zrodlo === z.id} onClick={() => setZrodlo(z.id)}
                                    className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 border transition-colors ${zrodlo === z.id ? 'bg-pink-600 border-pink-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-pink-500'}`}>
                                    <i className={`ph-bold ${z.icon}`}></i>{z.label}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* LEWA KOLUMNA – PARAMETRY */}
                            <div className="lg:col-span-1 space-y-6 min-w-0">
                                <div className="glass-panel p-6 rounded-2xl shadow-xl space-y-5">
                                    <div>
                                        <label className={labelCls}>Gdzie Ewa publikuje?</label>
                                        <select value={platform} onChange={(e) => setPlatform(e.target.value)} className={selectCls}>
                                            <option>Facebook - Grupy dla Nauczycieli</option>
                                            <option>Instagram - Profil EduBox</option>
                                            <option>LinkedIn - Profil Profesjonalny</option>
                                            <option>Pinterest - Piny EduBox</option>
                                            <option>YouTube - Opis pod filmem</option>
                                            <option>Blog EduBoxPRO</option>
                                        </select>
                                    </div>

                                    {zrodlo === 'narzedzie' && (
                                        <div>
                                            <label className={labelCls}>Którą aplikację promujemy?</label>
                                            <select value={selectedAppIndex} onChange={(e) => setSelectedAppIndex(e.target.value)} className={selectCls}>
                                                <option value="random">🎲 Zaskocz mnie (losowa aplikacja)</option>
                                                {Object.keys(CAT_LABELS).map((cat) => groupedApps[cat] && (
                                                    <optgroup key={cat} label={CAT_LABELS[cat]}>
                                                        {groupedApps[cat].map((app) => <option key={app.idx} value={app.idx}>{app.title}</option>)}
                                                    </optgroup>
                                                ))}
                                            </select>
                                        </div>
                                    )}

                                    {zrodlo === 'swieto' && (
                                        <div>
                                            <label className={labelCls}>Które święto? (najbliższe 60 dni)</label>
                                            {swieta.length === 0 ? (
                                                <p className="text-sm text-slate-400">W najbliższych tygodniach nie ma świąt w kalendarzu (wakacje).</p>
                                            ) : (
                                                <select value={swietoKlucz} onChange={(e) => setSwietoKlucz(e.target.value)} className={selectCls}>
                                                    {swieta.map((x) => (
                                                        <option key={x.klucz} value={x.klucz}>{T.dataKrotko(x.data)} – {x.swieto.name}{x.pakiety.length ? `  📦${x.pakiety.length}` : ''}</option>
                                                    ))}
                                                </select>
                                            )}
                                            {wybraneSwieto && (
                                                <div className="mt-3 text-xs text-slate-400 space-y-1">
                                                    <p>{T.dataSlownie(wybraneSwieto.data)} · {wybraneSwieto.swieto.desc}</p>
                                                    <p>{wybraneSwieto.pakiety.length ? `Pakiety do tego dnia: ${wybraneSwieto.pakiety.map((p) => p.title).join(', ')}` : 'Brak pakietu do tego dnia – post poleci EduKalendarz.'}</p>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {zrodlo === 'pakiet' && (
                                        <div>
                                            <label className={labelCls}>Który pakiet?</label>
                                            {pakiety === null ? <p className="text-sm text-slate-400">Wczytuję katalog…</p> : pakiety.length === 0 ? (
                                                <p className="text-sm text-slate-400">{pakietyError || 'Katalog jest pusty – dodaj pakiet w panelu materiałów.'}</p>
                                            ) : (
                                                <select value={pakietId} onChange={(e) => setPakietId(e.target.value)} className={selectCls}>
                                                    {Object.keys(T.SEKCJE).map((s) => pakietyWSekcjach[s] && (
                                                        <optgroup key={s} label={T.SEKCJE[s]}>
                                                            {pakietyWSekcjach[s].map((p) => <option key={p.id} value={p.id}>{p.title}</option>)}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                            )}
                                            {wybranyPakiet && (
                                                <div className="mt-3 flex gap-3 items-start">
                                                    {okladka && <img src={okladka} alt="" className="w-16 h-20 object-cover object-top rounded-lg border border-slate-700 shrink-0" />}
                                                    <p className="text-xs text-slate-400 min-w-0">{T.zawartoscPakietu(wybranyPakiet) || 'Bez informacji o zawartości'}{wybranyPakiet.opis ? ` · ${wybranyPakiet.opis}` : ''}</p>
                                                </div>
                                            )}
                                            {okladka && (
                                                <label className="mt-3 flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl p-3 cursor-pointer select-none">
                                                    <input type="checkbox" checked={uzyjOkladki} onChange={(e) => setUzyjOkladki(e.target.checked)} className="w-5 h-5 accent-pink-600" />
                                                    <span className="text-sm font-bold text-slate-200">Grafika: okładka pakietu (pin) zamiast zdjęcia Ewy</span>
                                                </label>
                                            )}
                                        </div>
                                    )}

                                    {zrodlo === 'plan' && (
                                        <div className="space-y-3">
                                            <label className={labelCls}>Plan od dnia</label>
                                            <input type="date" value={planStart} onChange={(e) => setPlanStart(e.target.value)} className={selectCls} />
                                            <p className="text-xs text-slate-400">7 dni: święta z EduKalendarza ok. 3 dni przed datą (z pasującymi pakietami), resztę wypełniają na zmianę pakiety i narzędzia. Szkice bez zdjęć – zdjęcie dorobisz po „Otwórz”.</p>
                                            <button onClick={ulozPlan} disabled={apps.length === 0 || pakiety === null} className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-50">
                                                <i className="ph-bold ph-calendar-plus"></i> Ułóż plan
                                            </button>
                                            {plan.length > 0 && (
                                                <button onClick={napiszWszystkie} disabled={planPisze} className="w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-50">
                                                    {planPisze ? <i className="ph-bold ph-spinner animate-spin"></i> : <i className="ph-bold ph-magic-wand"></i>}
                                                    {planPisze ? 'Ewa pisze szkice…' : 'Napisz wszystkie szkice'}
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {['narzedzie', 'swieto', 'pakiet', 'temat'].includes(zrodlo) && (
                                        <>
                                            <div>
                                                <label className={labelCls}>{zrodlo === 'temat' ? 'Temat posta *' : zrodlo === 'narzedzie' ? 'Jaki problem rozwiązujemy? (opcjonalnie)' : 'Wskazówka dla Ewy (opcjonalnie)'}</label>
                                                <textarea value={topic} onChange={(e) => setTopic(e.target.value)}
                                                    placeholder={zrodlo === 'temat' ? 'np. Wywiadówki w listopadzie, jak przetrwać grudzień w przedszkolu…' : zrodlo === 'narzedzie' ? 'np. Długie pisanie ocen opisowych, trudni rodzice…' : 'np. podkreśl piosenki, post na wtorek rano…'}
                                                    className="w-full h-28 bg-slate-900 border border-slate-700 text-white p-4 rounded-xl resize-none outline-none focus:border-pink-500"></textarea>
                                            </div>
                                            {pokazZdjecieEwy && (
                                                <label className="flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl p-3 cursor-pointer select-none">
                                                    <input type="checkbox" checked={includeImage} onChange={(e) => setIncludeImage(e.target.checked)} className="w-5 h-5 accent-pink-600" />
                                                    <span className="text-sm font-bold text-slate-200">Generuj też zdjęcie Ewy</span>
                                                </label>
                                            )}
                                            <button onClick={generateContent} disabled={loading || !gotowyDoGeneracji}
                                                className="w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                                {loading ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-magic-wand text-xl"></i>}
                                                {loading ? 'Ewa przygotowuje materiał...' : apps.length === 0 && !appsError ? 'Ładowanie listy aplikacji...' : (pokazZdjecieEwy && includeImage) ? 'Wygeneruj post i zdjęcie' : 'Wygeneruj post'}
                                            </button>
                                        </>
                                    )}

                                    {errorMsg && <div className="p-3 bg-red-900/50 border border-red-500/50 text-red-300 rounded-xl text-sm"><i className="ph-fill ph-warning-circle"></i> {errorMsg}</div>}
                                    {appsError && <div className="p-3 bg-amber-900/50 border border-amber-500/50 text-amber-300 rounded-xl text-sm"><i className="ph-fill ph-warning-circle"></i> Nie udało się wczytać listy aplikacji (apps.js).</div>}
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA – WYNIK */}
                            <div className="lg:col-span-2 min-w-0">
                                <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-xl min-h-[500px]">
                                    {pokazPlan ? (
                                        <PlanWidok plan={plan} onNapisz={napiszSzkic} onUsun={(i) => setPlan((p) => p.filter((_, j) => j !== i))} onOtworz={otworzSzkic} planPisze={planPisze} />
                                    ) : (
                                        <WynikWidok wynik={wynik} loading={loading} imageUrl={imageUrl} imageLoading={imageLoading}
                                            pokazKolumneZdjecia={!!imageUrl || imageLoading || (loading && includeImage)}
                                            onZdjecie={() => generujZdjecie(wynik && wynik.imagePrompt)}
                                            zPlanu={zrodlo === 'wynik-planu'} onWrocDoPlanu={() => setZrodlo('plan')} />
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function WynikWidok({ wynik, loading, imageUrl, imageLoading, pokazKolumneZdjecia, onZdjecie, zPlanu, onWrocDoPlanu }) {
            if (!wynik && !loading) {
                return (
                    <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-60 py-20 text-center">
                        <i className="ph-fill ph-images text-6xl mb-4"></i>
                        <p className="font-medium text-lg">Tutaj pojawi się gotowy post Ewy i grafika.</p>
                    </div>
                );
            }
            if (!wynik) return <div className="py-20 text-center text-slate-400"><i className="ph-bold ph-spinner animate-spin text-3xl"></i><p className="mt-3">Ewa pisze…</p></div>;
            return (
                <div>
                    {zPlanu && <button onClick={onWrocDoPlanu} className="mb-4 text-sm text-pink-300 hover:text-pink-200 font-bold flex items-center gap-1"><i className="ph-bold ph-arrow-left"></i> Wróć do planu tygodnia</button>}
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-2">
                        <h2 className="text-2xl font-display font-bold text-white flex items-center gap-2"><i className="ph-fill ph-check-circle text-green-500"></i> Gotowe do publikacji</h2>
                        <KopiujPrzycisk tekst={tekstDoSkopiowania(wynik.post, wynik.linki)} etykieta="Skopiuj post + link" className="!px-4 !py-2 !text-sm" />
                    </div>
                    <p className="text-sm text-slate-400 mb-6">{TYP_ETYKIETA[wynik.typ] || 'Post'}: <span className="text-pink-400 font-bold">{wynik.nazwa}</span></p>
                    <div className="flex flex-col md:flex-row gap-8">
                        {pokazKolumneZdjecia ? (
                            <div className="w-full md:w-1/2">
                                <div className="aspect-[4/5] bg-slate-900 rounded-xl border-2 border-slate-700 overflow-hidden relative">
                                    {imageUrl ? <img src={imageUrl} alt="Grafika do posta" className="w-full h-full object-cover object-top" />
                                        : <div className="absolute inset-0 flex items-center justify-center text-slate-500">{imageLoading || loading ? 'Generowanie zdjęcia...' : 'Brak zdjęcia'}</div>}
                                </div>
                                <p className="text-xs text-slate-500 mt-2 text-center">Prawy przycisk myszy → „Zapisz obraz jako…”.</p>
                            </div>
                        ) : (
                            <div className="w-full md:w-auto">
                                <button onClick={onZdjecie} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white text-sm font-bold px-4 py-2 rounded-xl flex items-center gap-2"><i className="ph-bold ph-image"></i> Wygeneruj zdjęcie Ewy</button>
                            </div>
                        )}
                        <div className={`w-full flex flex-col gap-4 min-w-0 ${pokazKolumneZdjecia ? 'md:w-1/2' : ''}`}>
                            {wynik.pinTitle && (
                                <div className="bg-slate-900 border border-pink-500/40 rounded-xl p-4 flex items-center justify-between gap-3">
                                    <div className="min-w-0"><p className="text-xs text-slate-400 uppercase font-bold mb-1">Tytuł pina</p><p className="text-slate-200 text-sm">{wynik.pinTitle}</p></div>
                                    <KopiujPrzycisk tekst={wynik.pinTitle} />
                                </div>
                            )}
                            <div className="bg-slate-900 border border-slate-700 rounded-xl p-5 flex-1">
                                <p className="text-slate-200 whitespace-pre-wrap font-medium leading-relaxed">{wynik.post}</p>
                            </div>
                            {wynik.keywords && wynik.keywords.length > 0 && (
                                <div className="bg-slate-900 border border-slate-700 rounded-xl p-4">
                                    <div className="flex items-center justify-between gap-2 mb-2"><p className="text-xs font-bold text-slate-400 uppercase">Słowa kluczowe</p><KopiujPrzycisk tekst={wynik.keywords.join(', ')} /></div>
                                    <div className="flex flex-wrap gap-2">{wynik.keywords.map((k) => <span key={k} className="text-xs bg-slate-800 border border-slate-700 rounded-full px-2 py-1 text-slate-300">{k}</span>)}</div>
                                </div>
                            )}
                            {wynik.titles && wynik.titles.length > 0 && (
                                <div className="bg-slate-900 border border-pink-500/40 rounded-xl p-4">
                                    <p className="text-xs font-bold text-pink-300 uppercase mb-3 flex items-center gap-2"><i className="ph-bold ph-text-aa"></i> Propozycje tytułów (na zdjęcie/wideo)</p>
                                    <div className="space-y-2">
                                        {wynik.titles.map((t, idx) => (
                                            <div key={idx} className="flex items-center justify-between gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                                                <span className="text-sm text-slate-200 min-w-0">{t}</span><KopiujPrzycisk tekst={t} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {(wynik.linki || []).map((l) => (
                                <div key={l.url} className="bg-slate-900 border border-pink-500/40 rounded-xl p-4 flex items-center justify-between gap-3">
                                    <div className="min-w-0"><p className="text-xs text-slate-400 uppercase font-bold mb-1">{l.label}</p><p className="text-pink-300 text-sm truncate">{l.url}</p></div>
                                    <KopiujPrzycisk tekst={l.url} etykieta="Link" />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function PlanWidok({ plan, onNapisz, onUsun, onOtworz, planPisze }) {
            if (!plan.length) {
                return (
                    <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-60 py-20 text-center">
                        <i className="ph-fill ph-calendar-dots text-6xl mb-4"></i>
                        <p className="font-medium text-lg">Wybierz dzień startu i kliknij „Ułóż plan”.</p>
                    </div>
                );
            }
            const kolor = { swieto: 'bg-amber-500/15 text-amber-300 border-amber-500/40', pakiet: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40', narzedzie: 'bg-sky-500/15 text-sky-300 border-sky-500/40' };
            return (
                <div className="space-y-4">
                    <h2 className="text-2xl font-display font-bold text-white flex items-center gap-2"><i className="ph-fill ph-calendar-dots text-pink-500"></i> Plan tygodnia</h2>
                    {plan.map((s, i) => (
                        <div key={i} className="bg-slate-900 border border-slate-700 rounded-xl p-4">
                            <div className="flex flex-wrap items-center gap-2 mb-2">
                                <span className="text-sm font-bold text-white">{T.duzaLitera(T.dataSlownie(s.data))}</span>
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full border ${kolor[s.typ] || ''}`}>{TYP_ETYKIETA[s.typ]}</span>
                                <span className="text-sm text-slate-300 min-w-0">{T.nazwaZrodla(s)}</span>
                                {s.typ === 'swieto' && s.pakiety && s.pakiety.length > 0 && <span className="text-xs text-emerald-300">📦 {s.pakiety.length}</span>}
                                <div className="ml-auto flex gap-2">
                                    {s.stan !== 'gotowy' && <button onClick={() => onNapisz(i)} disabled={s.stan === 'pisze' || planPisze} className="text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-3 py-1.5 rounded-lg disabled:opacity-50">{s.stan === 'pisze' ? 'Pisze…' : 'Napisz szkic'}</button>}
                                    <button onClick={() => onUsun(i)} disabled={planPisze} className="text-xs text-slate-400 hover:text-red-400 px-2" aria-label="Usuń z planu"><i className="ph-bold ph-x"></i></button>
                                </div>
                            </div>
                            {s.stan === 'blad' && <p className="text-xs text-red-300">{s.blad}</p>}
                            {s.stan === 'gotowy' && s.wynik && (
                                <div>
                                    <p className="text-sm text-slate-300 whitespace-pre-wrap line-clamp-4">{s.wynik.post}</p>
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        <KopiujPrzycisk tekst={tekstDoSkopiowania(s.wynik.post, s.wynik.linki)} etykieta="Skopiuj post + link" />
                                        <button onClick={() => onOtworz(s)} className="text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1"><i className="ph-bold ph-arrow-square-out"></i> Otwórz (tytuły, grafika)</button>
                                        <button onClick={() => onNapisz(i)} disabled={planPisze} className="text-xs font-bold text-slate-400 hover:text-white px-2 disabled:opacity-50">Napisz od nowa</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
