<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBox PRO - Kreator Wpisów do Menu</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Tailwind CSS & Phosphor Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root" class="h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState } = React;

        const COLORS = [
            { name: 'Niebieski (Blue)', val: 'blue' },
            { name: 'Szmaragdowy (Emerald)', val: 'emerald' },
            { name: 'Różowy (Rose)', val: 'rose' },
            { name: 'Fuksja (Fuchsia)', val: 'fuchsia' },
            { name: 'Fioletowy (Violet)', val: 'violet' },
            { name: 'Bursztynowy (Amber)', val: 'amber' },
            { name: 'Morski (Teal)', val: 'teal' },
            { name: 'Szary (Slate)', val: 'slate' }
        ];

        const ICONS = [
            { id: 'ph-magic-wand', label: 'Magiczna Różdżka (AI)' },
            { id: 'ph-file-text', label: 'Dokument / Plik' },
            { id: 'ph-file-pdf', label: 'Plik PDF' },
            { id: 'ph-chalkboard-teacher', label: 'Nauczyciel / Tablica' },
            { id: 'ph-users-three', label: 'Grupa / Klasa' },
            { id: 'ph-palette', label: 'Paleta (Grafika)' },
            { id: 'ph-game-controller', label: 'Gry / Grywalizacja' },
            { id: 'ph-brain', label: 'Mózg / Myślenie' },
            { id: 'ph-heart', label: 'Serce / Terapia' },
            { id: 'ph-scales', label: 'Waga / Prawo' },
            { id: 'ph-sun', label: 'Słońce / Wakacje' },
            { id: 'ph-calculator', label: 'Kalkulator / Matma' },
            { id: 'ph-image', label: 'Obrazek / Zdjęcie' },
            { id: 'ph-star', label: 'Gwiazdka' }
        ];

        const CATEGORIES = [
            { id: 'terapia', label: 'Terapia i SPE' },
            { id: 'biurokracja', label: 'Biurokracja i Dokumenty' },
            { id: 'zajecia', label: 'Zajęcia i Gry' },
            { id: 'grafika', label: 'Grafika i Kreatywne' }
        ];

        function App() {
            const [title, setTitle] = useState('Nowa Aplikacja AI');
            const [desc, setDesc] = useState('Krótki opis tego, co robi aplikacja. Pomaga w szybkiej automatyzacji...');
            const [url, setUrl] = useState('nowy-plik.html');
            const [category, setCategory] = useState('zajecia');
            const [icon, setIcon] = useState('ph-magic-wand');
            const [color, setColor] = useState('blue');
            const [badge, setBadge] = useState('NOWOŚĆ');
            const [tags, setTags] = useState('ai, szkoła, ułatwienie');
            const [copied, setCopied] = useState(false);

            const generateCode = () => {
                const tagsArray = tags.split(',').map(t => `'${t.trim()}'`).filter(t => t !== "''").join(', ');
                
                let code = `        { \n`;
                code += `            title: '${title}', \n`;
                code += `            desc: '${desc}', \n`;
                code += `            url: '${url}', \n`;
                if (badge.trim()) {
                    code += `            badge: '${badge.trim()}', \n`;
                    code += `            badgeColor: 'bg-${color}-600', \n`;
                }
                code += `            icon: '${icon}', \n`;
                code += `            color: 'text-${color}-500', \n`;
                code += `            category: '${category}', \n`;
                code += `            tags: [${tagsArray}] \n`;
                code += `        },`;

                return code;
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(generateCode());
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden">
                    {/* LEWA STRONA - FORMULARZ */}
                    <div className="w-1/2 bg-white border-r border-slate-200 p-8 overflow-y-auto custom-scrollbar shadow-lg z-10">
                        <div className="mb-8">
                            <h1 className="text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                <i className="ph-fill ph-code text-blue-500"></i> Kreator Wpisów
                            </h1>
                            <p className="text-slate-500 text-sm mt-2">Wyklikaj wygląd swojej nowej aplikacji, a następnie skopiuj gotowy kod do pliku <strong>apps.js</strong>.</p>
                        </div>

                        <div className="space-y-6">
                            {/* DANE PODSTAWOWE */}
                            <div className="space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tytuł Aplikacji</label>
                                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none font-bold text-slate-800" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Opis (max 2 zdania)</label>
                                    <textarea value={desc} onChange={e => setDesc(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none resize-none h-20" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nazwa Pliku (np. edupdf.html)</label>
                                    <input type="text" value={url} onChange={e => setUrl(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none font-mono text-blue-600" />
                                </div>
                            </div>

                            {/* WYGLĄD */}
                            <div className="space-y-4 bg-blue-50/50 p-5 rounded-2xl border border-blue-100">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Kolor Główny</label>
                                        <select value={color} onChange={e => setColor(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                                            {COLORS.map(c => <option key={c.val} value={c.val}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Kategoria w Menu</label>
                                        <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                                            {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Ikonka</label>
                                    <select value={icon} onChange={e => setIcon(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                                        {ICONS.map(i => <option key={i.id} value={i.id}>{i.label} ({i.id})</option>)}
                                    </select>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Etykieta (Opcjonalnie)</label>
                                        <input type="text" value={badge} onChange={e => setBadge(e.target.value)} placeholder="np. NOWOŚĆ, PRO" className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tagi (Po przecinku)</label>
                                        <input type="text" value={tags} onChange={e => setTags(e.target.value)} placeholder="np. szkoła, pdf, edytor" className="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500 outline-none" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* PRAWA STRONA - WYNIK I PODGLĄD */}
                    <div className="w-1/2 p-8 flex flex-col bg-slate-100">
                        
                        {/* PODGLĄD NA ŻYWO (Odwzorowanie kafelka z Twojego Menu) */}
                        <div className="mb-8">
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Podgląd na żywo:</h2>
                            <div className="w-full max-w-sm">
                                {/* Ten fragment idealnie symuluje wygląd kafelka z Twojego głównego menu */}
                                <a href="#" className="block bg-white rounded-2xl p-5 border border-slate-200 hover:border-slate-300 transition-all shadow-sm hover:shadow-md relative group h-full cursor-default">
                                    {badge.trim() && (
                                        <span className={`absolute top-4 right-4 bg-${color}-600 text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider`}>
                                            {badge}
                                        </span>
                                    )}
                                    <div className="flex items-start gap-4">
                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center bg-${color}-50 text-${color}-600 shrink-0 group-hover:scale-110 transition-transform duration-300`}>
                                            <i className={`ph-fill ${icon} text-2xl`}></i>
                                        </div>
                                        <div className="flex-1 min-w-0 pr-8">
                                            <h3 className="text-lg font-black text-slate-800 leading-tight mb-1 truncate">{title}</h3>
                                            <p className="text-xs text-slate-500 leading-relaxed line-clamp-2">{desc}</p>
                                        </div>
                                    </div>
                                    <div className="mt-4 flex flex-wrap gap-1.5">
                                        {tags.split(',').map((tag, i) => tag.trim() && (
                                            <span key={i} className="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-md font-semibold">#{tag.trim()}</span>
                                        ))}
                                    </div>
                                </a>
                            </div>
                        </div>

                        {/* WYGENEROWANY KOD */}
                        <div className="flex-1 flex flex-col">
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex justify-between items-end">
                                <span>Kod do pliku apps.js:</span>
                                <button onClick={copyToClipboard} className={`px-4 py-2 rounded-lg text-white font-bold transition-all ${copied ? 'bg-green-500' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                    {copied ? <><i className="ph-bold ph-check"></i> Skopiowano!</> : <><i className="ph-bold ph-copy"></i> Kopiuj Kod</>}
                                </button>
                            </h2>
                            <div className="flex-1 relative">
                                <textarea 
                                    readOnly 
                                    value={generateCode()} 
                                    className="w-full h-full bg-slate-900 text-green-400 font-mono text-sm p-6 rounded-2xl outline-none resize-none shadow-inner"
                                />
                            </div>
                            <p className="text-xs text-slate-500 mt-4 text-center">
                                Skopiuj powyższy tekst i wklej go do pliku <strong>apps.js</strong> w odpowiedniej kategorii (pomiędzy inne klamry).
                            </p>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
