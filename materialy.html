    <script>

            function wstawMenuAwaryjne() {

                    <nav class="w-full z-50 shadow-lg print-hidden bg-slate-900 border-b border-slate-800 p-4 fixed top-0">

            }
            try {

                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);

                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const appId = window.__app_id;
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        window.__materialyPublicReady = new Promise((resolve) => {
            onAuthStateChanged(auth, (user) => { if (user) resolve({ db, appId }); });
            signInAnonymously(auth).catch((e) => console.error("Firebase Auth Error:", e));
        });

        window.__materialyPublicApi = {
            collectionRef: (deps) => collection(deps.db, 'artifacts', deps.appId, 'public', 'data', 'materialy_katalog'),
            query, orderBy, onSnapshot,
        };
    </script>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;

        function jestPro() {
            const status = localStorage.getItem('eduboxProStatus');
            return status === 'PRO' || status === 'active';
        }

        // Pobranie pliku realnie sprawdzane po stronie serwera (nie tylko flaga w
        // przeglądarce) - kod zapamiętany przy aktywacji PRO w menu.html jest wysyłany
        // do /api/verify-code przy KAŻDYM pobraniu, więc bez ważnego kodu plik po
        // prostu nie przyjdzie, nawet gdyby ktoś ręcznie ustawił flagę eduboxProStatus.
        // Do 21.10.2026 kod zapamiętywało tylko górne menu, więc kto odblokował PRO w narzędziu,
        // nie miał tu czego wysłać i dostawał „Nieprawidłowy kod”. Przy odmowie (403) prosimy raz o kod,
        // zapamiętujemy go i próbujemy jeszcze raz. Serwer tylko sprawdza kod - niczego nie zużywa.
        async function pobierzPlik(sciezka, nazwaPliku, onBlad, ponownie = false) {
            const kod = localStorage.getItem('eduboxProCode') || '';
            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'materialy-download', path: sciezka, code: kod, mode: 'link', name: nazwaPliku }),
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 403 && !ponownie) {
                    const wpisany = (window.prompt('Wpisz kod PRO, którym odblokowano dostęp (np. z maila z podziękowaniem):', kod) || '').trim().toUpperCase();
                    if (wpisany) {
                        try { localStorage.setItem('eduboxProCode', wpisany); } catch (e) {}
                        return pobierzPlik(sciezka, nazwaPliku, onBlad, true);
                    }
                }
                if (!res.ok || !data.url) {
                    onBlad(data.error || 'Nie udało się pobrać pliku.');
                    return;
                }
                // Serwer oddaje link ważny 5 minut prosto do pliku (duże pakiety nie mieszczą się
                // w odpowiedzi funkcji Vercela); nazwę pliku i „pobierz” ustawia sam link.
                const a = document.createElement('a');
                a.href = data.url;
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                onBlad('Błąd połączenia z serwerem.');
            }
        }

        function formatBytes(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0; let val = bytes;
            while (val >= 1024 && i < units.length - 1) { val /= 1024; i += 1; }
            return `${val.toFixed(val < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
        }

        function iconForFile(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (ext === 'pdf') return 'ph-file-pdf text-red-400';
            if (['doc', 'docx'].includes(ext)) return 'ph-file-doc text-blue-400';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return 'ph-file-audio text-emerald-400';
            if (['zip', 'rar', '7z'].includes(ext)) return 'ph-file-zip text-amber-400';
            if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) return 'ph-file-image text-fuchsia-400';
            return 'ph-file text-slate-400';
        }

        function PrzyciskPobierz({ plik }) {
            const [stan, setStan] = useState('gotowy'); // gotowy | pobieranie | blad
            const [blad, setBlad] = useState('');

            const klik = async () => {
                setStan('pobieranie');
                setBlad('');
                await pobierzPlik(plik.path, plik.name, (msg) => { setBlad(msg); setStan('blad'); });
                setStan((s) => (s === 'pobieranie' ? 'gotowy' : s));
            };

            return (
                <div>
                    <button onClick={klik} disabled={stan === 'pobieranie'}
                        className="btn-bounce w-full inline-flex items-center justify-center gap-2 text-sm font-bold text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-4 py-2.5 hover:bg-emerald-500/20 transition-colors disabled:opacity-50">
                        {stan === 'pobieranie' ? <><i className="ph-bold ph-circle-notch animate-spin"></i>Pobieranie…</> : <><i className="ph-bold ph-download-simple"></i>Pobierz {plik.name}</>}
                    </button>
                    {stan === 'blad' && <p className="text-xs text-red-400 mt-1 flex items-center gap-1"><i className="ph-bold ph-warning-circle"></i>{blad}</p>}
                </div>
            );
        }

        const { SEKCJE, SEKCJA_IDS, sekcjaPakietu, adresPodgladu, ilePakietow } = window.EduMaterialy;

        // Podgląd stron: duży obrazek, strzałki, miniatury; klawiatura (← → Esc) i przesuwanie palcem.
        function Podglad({ pakiet, onZamknij }) {
            const strony = pakiet.podglad || [];
            const [i, setI] = useState(0);
            const startX = React.useRef(null);
            const idz = (d) => setI((x) => (x + d + strony.length) % strony.length);

            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') onZamknij();
                    if (e.key === 'ArrowRight') idz(1);
                    if (e.key === 'ArrowLeft') idz(-1);
                };
                window.addEventListener('keydown', onKey);
                const overflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = overflow; };
            }, [strony.length]);

            if (!strony.length) return null;
            const s = strony[i];
            // Portal do <body>: #root ma z-10, a menu z-50 – bez portalu pasek z „Zamknij” chował się pod menu.
            return ReactDOM.createPortal(
                <div className="fixed inset-0 z-[100] bg-slate-950/95 flex flex-col" role="dialog" aria-modal="true" aria-label={`Podgląd: ${pakiet.title}`}>
                    <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-800">
                        <div className="min-w-0 flex-1">
                            <p className="font-bold text-slate-100 truncate">{pakiet.title}</p>
                            <p className="text-xs text-slate-400">Strona {s.strona || i + 1}{pakiet.stron ? ` z ${pakiet.stron}` : ''} • podgląd {i + 1}/{strony.length}</p>
                        </div>
                        <button onClick={onZamknij} className="btn-bounce w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center" aria-label="Zamknij podgląd"><i className="ph-bold ph-x text-lg"></i></button>
                    </div>
                    <div className="flex-1 min-h-0 relative flex items-center justify-center p-3"
                        onTouchStart={(e) => { startX.current = e.touches[0].clientX; }}
                        onTouchEnd={(e) => { if (startX.current === null) return; const dx = e.changedTouches[0].clientX - startX.current; if (Math.abs(dx) > 40) idz(dx < 0 ? 1 : -1); startX.current = null; }}>
                        <img src={adresPodgladu(s.path)} alt={`Podgląd strony ${s.strona || i + 1}`} className="max-h-full max-w-full object-contain rounded-lg shadow-2xl bg-white select-none" draggable="false" />
                        {strony.length > 1 && <>
                            <button onClick={() => idz(-1)} className="btn-bounce absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center" aria-label="Poprzednia strona"><i className="ph-bold ph-caret-left text-xl"></i></button>
                            <button onClick={() => idz(1)} className="btn-bounce absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center" aria-label="Następna strona"><i className="ph-bold ph-caret-right text-xl"></i></button>
                        </>}
                    </div>
                    <div className="flex gap-2 overflow-x-auto px-4 py-3 border-t border-slate-800">
                        {strony.map((p, n) => (
                            <button key={p.path} onClick={() => setI(n)} className={`shrink-0 rounded-md overflow-hidden border-2 ${n === i ? 'border-indigo-400' : 'border-transparent opacity-60 hover:opacity-100'}`} aria-label={`Pokaż stronę ${p.strona || n + 1}`}>
                                <img src={adresPodgladu(p.path)} alt="" loading="lazy" className="h-16 w-auto bg-white" />
                            </button>
                        ))}
                    </div>
                </div>,
                document.body
            );
        }

        function KartaPakietu({ pakiet, odblokowane, pokazSekcje, onPodglad }) {
            const okladka = pakiet.okladka || (pakiet.podglad || [])[0];
            const sekcja = SEKCJE.find((x) => x.id === sekcjaPakietu(pakiet));
            const ilePodgladu = (pakiet.podglad || []).length;
            return (
                <div className="card-bg rounded-2xl flex flex-col fade-in min-w-0 overflow-hidden">
                    {okladka && (
                        <button onClick={() => ilePodgladu && onPodglad(pakiet)} className="relative block w-full h-52 bg-slate-100 overflow-hidden group" aria-label={`Podgląd: ${pakiet.title}`}>
                            <img src={adresPodgladu(okladka.path)} alt={`Okładka: ${pakiet.title}`} loading="lazy" className="w-full h-full object-cover object-top group-hover:scale-[1.02] transition-transform" />
                            {ilePodgladu > 0 && <span className="absolute bottom-2 right-2 inline-flex items-center gap-1.5 text-xs font-bold bg-slate-900/85 text-white rounded-full px-3 py-1.5"><i className="ph-bold ph-eye"></i>Zajrzyj do środka</span>}
                        </button>
                    )}
                    <div className="p-6 flex flex-col flex-1">
                        {pokazSekcje && sekcja && <span className="self-start text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2"><i className={`ph-bold ${sekcja.icon} mr-1`}></i>{sekcja.label}</span>}
                        <div className="flex items-start gap-3 mb-3">
                            {!okladka && <i className="ph-fill ph-package text-indigo-400 text-2xl shrink-0 mt-0.5"></i>}
                            <h3 className="font-bold text-slate-100 leading-snug">{pakiet.title}</h3>
                        </div>
                        {pakiet.opis && <p className="text-sm text-slate-400 leading-relaxed flex-1 mb-4">{pakiet.opis}</p>}
                        <ul className="space-y-1.5 mb-4">
                            {(pakiet.pliki || []).map((p, i) => (
                                <li key={i} className="text-xs text-slate-400 flex items-center gap-2">
                                    <i className={`ph-bold ${iconForFile(p.name)}`}></i>
                                    <span className="flex-1 min-w-0 truncate">{p.name}</span>
                                    <span className="text-slate-600">{formatBytes(p.size)}</span>
                                </li>
                            ))}
                        </ul>
                        {ilePodgladu > 0 && (
                            <button onClick={() => onPodglad(pakiet)} className="btn-bounce w-full inline-flex items-center justify-center gap-2 text-sm font-bold text-indigo-200 bg-indigo-500/10 border border-indigo-500/30 rounded-lg px-4 py-2.5 hover:bg-indigo-500/20 transition-colors mb-2">
                                <i className="ph-bold ph-eye"></i>Podgląd – {ilePodgladu} {ilePodgladu === 1 ? 'strona' : (ilePodgladu < 5 ? 'strony' : 'stron')}{pakiet.stron ? ` z ${pakiet.stron}` : ''}
                            </button>
                        )}
                        {odblokowane ? (
                            <div className="space-y-2 mt-auto">
                                {(pakiet.pliki || []).map((p, i) => <PrzyciskPobierz key={i} plik={p} />)}
                            </div>
                        ) : (
                            <div className="mt-auto bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-200/90 leading-relaxed flex items-start gap-2">
                                <i className="ph-bold ph-lock-key text-amber-400 shrink-0 mt-0.5"></i>
                                <span>Postaw kawę, żeby odblokować pobieranie w tej przeglądarce. Kod z podziękowania wpisz w górnym menu.</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function sekcjaStartowa() {
            const zAdresu = new URLSearchParams(window.location.search).get('sekcja');
            if (SEKCJA_IDS.includes(zAdresu)) return zAdresu;
            try { const zapisana = localStorage.getItem('eduboxMaterialySekcja'); if (SEKCJA_IDS.includes(zapisana)) return zapisana; } catch (e) {}
            return SEKCJE[0].id;
        }

        function App() {
            const [deps, setDeps] = useState(null);
            const [pakiety, setPakiety] = useState([]);
            const [sekcja, setSekcja] = useState(sekcjaStartowa());
            const [aktywnyFolder, setAktywnyFolder] = useState('');
            // ?szukaj=Dzień%20Dyni (z postów Ewy, gdy na jedno święto jest kilka pakietów) wpisuje frazę w wyszukiwarkę.
            const [search, setSearch] = useState(() => { try { return (new URLSearchParams(window.location.search).get('szukaj') || '').slice(0, 80); } catch (e) { return ''; } });
            const [pro, setPro] = useState(jestPro());
            const [podglad, setPodglad] = useState(null);
            // Link do konkretnego pakietu (?pakiet=<id>, np. z pina albo z panelu) od razu otwiera jego podgląd.
            const [pakietZAdresu, setPakietZAdresu] = useState(() => new URLSearchParams(window.location.search).get('pakiet'));

            useEffect(() => { window.__materialyPublicReady.then(setDeps); }, []);

            useEffect(() => {
                const onFocus = () => setPro(jestPro());
                window.addEventListener('focus', onFocus);
                const interval = setInterval(() => setPro(jestPro()), 3000);
                return () => { window.removeEventListener('focus', onFocus); clearInterval(interval); };
            }, []);

            useEffect(() => {
                if (!deps) return;
                const api = window.__materialyPublicApi;
                const q = api.query(api.collectionRef(deps), api.orderBy('createdAt', 'desc'));
                const unsub = api.onSnapshot(q, (snap) => {
                    const items = [];
                    snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
                    setPakiety(items);
                }, (err) => console.error('Firestore sync error', err));
                return () => unsub();
            }, [deps]);

            useEffect(() => {
                if (!pakietZAdresu || !pakiety.length) return;
                const p = pakiety.find((x) => x.id === pakietZAdresu);
                if (p) {
                    setSekcja(sekcjaPakietu(p));
                    if ((p.podglad || []).length) setPodglad(p);
                }
                setPakietZAdresu(null);
            }, [pakiety, pakietZAdresu]);

            const wybierzSekcje = (id) => {
                setSekcja(id);
                setAktywnyFolder('');
                try { localStorage.setItem('eduboxMaterialySekcja', id); } catch (e) {}
                const url = new URL(window.location.href);
                url.searchParams.set('sekcja', id);
                window.history.replaceState(null, '', url);
            };

            const q = search.trim().toLowerCase();
            const wSekcji = pakiety.filter((p) => sekcjaPakietu(p) === sekcja);
            const foldery = [...new Set(wSekcji.map((p) => p.kategoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pl'));
            // Wyszukiwanie przeszukuje wszystkie sekcje – nauczyciel nie musi wiedzieć, gdzie leży pakiet.
            const filtrowane = q
                ? pakiety.filter((p) => p.title.toLowerCase().includes(q) || (p.opis || '').toLowerCase().includes(q) || (p.kategoria || '').toLowerCase().includes(q))
                : wSekcji.filter((p) => !aktywnyFolder || p.kategoria === aktywnyFolder);
            const pogrupowane = {};
            if (!q && !aktywnyFolder) filtrowane.forEach((p) => { const k = p.kategoria || 'Pozostałe'; (pogrupowane[k] = pogrupowane[k] || []).push(p); });

            const siatka = (lista) => (
                <div className="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                    {lista.map((p) => <KartaPakietu key={p.id} pakiet={p} odblokowane={pro} pokazSekcje={!!q} onPodglad={setPodglad} />)}
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 py-10">
                    <div className="mb-8">
                        <h1 className="text-3xl sm:text-4xl font-black text-slate-50 flex items-center gap-3"><span>📦 Materiały do pobrania</span></h1>
                        <p className="text-slate-400 mt-2">Gotowe pakiety tematyczne: scenariusze, piosenki, karty i plansze do druku - twórz razem z nami skarbnicę materiałów dla przedszkola i szkoły.</p>
                    </div>

                    <div className="flex items-start gap-3 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl p-4 mb-8">
                        <i className="ph-bold ph-heart text-indigo-400 text-xl shrink-0 mt-0.5"></i>
                        <p className="text-sm text-indigo-100/90 leading-relaxed">
                            Te materiały robię sam, na własny koszt czasu i narzędzi AI. Podgląd zawartości jest zawsze darmowy - kliknij „Podgląd”, żeby zobaczyć wybrane strony pakietu. Jeśli chcesz pobrać pliki, postaw mi kawę (link w górnym menu) i wpisz otrzymany kod. To nie jest płatność za produkt, tylko podziękowanie, które pozwala mi tworzyć kolejne pakiety.
                        </p>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6" role="tablist" aria-label="Sekcje materiałów">
                        {SEKCJE.map((s) => {
                            const ile = pakiety.filter((p) => sekcjaPakietu(p) === s.id).length;
                            const aktywna = !q && sekcja === s.id;
                            return (
                                <button key={s.id} role="tab" aria-selected={aktywna} onClick={() => { setSearch(''); wybierzSekcje(s.id); }}
                                    className={`btn-bounce text-left rounded-2xl border p-4 transition-colors ${aktywna ? 'bg-indigo-600/20 border-indigo-500/60' : 'card-bg hover:border-slate-600'}`}>
                                    <i className={`ph-duotone ${s.icon} text-2xl ${aktywna ? 'text-indigo-300' : 'text-slate-400'}`}></i>
                                    <span className={`block font-black mt-1 ${aktywna ? 'text-white' : 'text-slate-200'}`}>{s.label}</span>
                                    <span className="block text-xs text-slate-400">{s.opis} • {ilePakietow(ile)}</span>
                                </button>
                            );
                        })}
                    </div>

                    <div className="relative mb-6">
                        <i className="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input
                            type="text"
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            placeholder="Szukaj pakietu we wszystkich sekcjach…"
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500"
                        />
                    </div>

                    {!q && foldery.length > 0 && (
                        <div className="flex flex-wrap gap-2 mb-8">
                            <button onClick={() => setAktywnyFolder('')} className={`chip rounded-full px-4 py-1.5 text-sm font-bold border ${!aktywnyFolder ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-slate-800/60 border-slate-700 text-slate-300'}`}>Wszystkie</button>
                            {foldery.map((f) => (
                                <button key={f} onClick={() => setAktywnyFolder(f)} className={`chip rounded-full px-4 py-1.5 text-sm font-bold border ${aktywnyFolder === f ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-slate-800/60 border-slate-700 text-slate-300'}`}>
                                    <i className="ph-fill ph-folder mr-1.5"></i>{f}
                                </button>
                            ))}
                        </div>
                    )}

                    {!deps ? (
                        <div className="text-slate-500 text-sm flex items-center gap-2"><i className="ph-bold ph-circle-notch animate-spin"></i>Ładowanie katalogu…</div>
                    ) : filtrowane.length === 0 ? (
                        <div className="card-bg rounded-2xl p-10 text-center">
                            <i className="ph-bold ph-package text-4xl text-slate-600 mb-3 block"></i>
                            <p className="text-slate-400 text-sm">{q ? 'Brak wyników dla wpisanej frazy.' : 'W tej sekcji pakiety pojawią się już wkrótce.'}</p>
                        </div>
                    ) : Object.keys(pogrupowane).length > 0 ? (
                        Object.entries(pogrupowane).sort(([a], [b]) => a.localeCompare(b, 'pl')).map(([folder, lista]) => (
                            <section key={folder} className="mb-10">
                                <h2 className="text-sm font-black uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2"><i className="ph-fill ph-folder text-amber-500"></i>{folder}</h2>
                                {siatka(lista)}
                            </section>
                        ))
                    ) : siatka(filtrowane)}

                    {podglad && <Podglad pakiet={podglad} onZamknij={() => setPodglad(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
