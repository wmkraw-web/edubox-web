    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDL_mvepNJjMmZYQzifN2cXzoKwCE8jNd0",
            authDomain: "edubox-pro.firebaseapp.com",
            projectId: "edubox-pro",
            storageBucket: "edubox-pro.firebasestorage.app",
            messagingSenderId: "570263845714",
            appId: "1:570263845714:web:0b029211f7af071b66988b"
        };
        const APP_ID = "eduboxpro";

        let app, auth, db;
        try {
            app = initializeApp(FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) { console.warn("Firebase init failed", e); }

        window.EduBoxCore = {
            user: null,
            init: (callback) => {
                if (!auth) return;
                signInAnonymously(auth).catch(e => console.error(e));
                onAuthStateChanged(auth, (user) => {
                    window.EduBoxCore.user = user;
                    if(callback) callback(user);
                });
            },
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!db || !window.EduBoxCore.user) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, {
                    userId: window.EduBoxCore.user.uid,
                    createdAt: serverTimestamp(),
                    type: appType,
                    name: itemName,
                    config: config
                });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

<body>
    <div id="root" class="h-screen flex flex-col"></div>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MODULES = [
            { id: 'plan', icon: 'ph-calendar-check', title: 'Plan Półkolonii', desc: '5-dniowy harmonogram', color: 'from-amber-500 to-orange-500' },
            { id: 'sos', icon: 'ph-cloud-rain', title: 'Przycisk S.O.S', desc: 'Gry ratunkowe', color: 'from-cyan-500 to-blue-500' },
            { id: 'teren', icon: 'ph-compass', title: 'Gra Terenowa', desc: 'Zagadki w plenerze', color: 'from-emerald-500 to-teal-500' },
            { id: 'druzyny', icon: 'ph-users-three', title: 'Baza Drużyn', desc: 'Okrzyki dla grup', color: 'from-purple-500 to-pink-500' }
        ];

        const parseAIResponse = (aiOutput) => {
            if (aiOutput && typeof aiOutput === 'object') {
                if (aiOutput.items || Array.isArray(aiOutput)) return aiOutput;
                if (aiOutput.text) aiOutput = aiOutput.text;
                else if (aiOutput.content) aiOutput = aiOutput.content;
                else if (aiOutput.response) aiOutput = aiOutput.response;
                else return aiOutput; 
            }

            let text = String(aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();

            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    jsonStr = jsonStr.replace(/,\s*([\]}])/g, '$1');
                    try { return JSON.parse(jsonStr); } catch (e1) { return JSON.parse(jsonStr.replace(/[\n\r\t]+/g, ' ')); }
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                console.error("Błąd parsowania:", text, e);
                throw new Error("BŁĄD Z SERWERA: Odpowiedź jest wadliwa.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, system: systemInstruction, format: "json" })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.message || data.content || data;
                } else {
                    const errData = await res.text();
                    throw new Error(`Błąd Vercel HTTP ${res.status}: ${errData}`);
                }
            } catch(e) { throw new Error("Brak połączenia z serwerem API na Vercelu. Szczegóły: " + e.message); }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [activeModule, setActiveModule] = useState('plan');
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [resultData, setResultData] = useState(null);

            // Form States
            const [theme, setTheme] = useState('Tropikalna Wyspa');
            const [age, setAge] = useState('7-10 lat');
            const [location, setLocation] = useState('Świetlica');
            const [props, setProps] = useState('Brak rekwizytów');
            const [specialNeeds, setSpecialNeeds] = useState('Brak (Grupa ogólnodostępna)');

            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else { setTimeout(initDb, 100); }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_eduwakacje_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    if (savedPremium === 'unlocked') setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3500);
            };

            const handlePremiumCheck = async () => {
                const __res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: premiumCode })
                });
                const __data = await __res.json();
                if (__data.valid) {
                    setIsPremium(true);
                    try { window.localStorage.setItem('edubox_premium', 'unlocked'); } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { showMessage('Nieprawidłowy kod', 'error'); }
            };

            const generateContent = async () => {
                if (!isPremium && aiGenerations >= 3) {
                    showMessage('Limit darmowych generacji wyczerpany. Wpisz kod odblokowujący.', 'error');
                    return;
                }
                
                setIsGenerating(true);
                setResultData(null);
                
                let prompt = "";
                let sysPrompt = "";

                if (activeModule === 'plan') {
                    sysPrompt = `Jesteś doskonałym pedagogiem. Stwórz 5-dniowy plan tematycznych półkolonii.
WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON z pięcioma dniami, uzupełniając teksty wewnątrz kluczy:

{
  "items": [
    { "title": "Poniedziałek", "subtitle": "Tytuł dnia", "text1": "Zajęcia poranne...", "text2": "Zajęcia popołudniowe..." },
    { "title": "Wtorek", "subtitle": "Tytuł dnia", "text1": "Zajęcia poranne...", "text2": "Zajęcia popołudniowe..." },
    { "title": "Środa", "subtitle": "Tytuł dnia", "text1": "Zajęcia poranne...", "text2": "Zajęcia popołudniowe..." },
    { "title": "Czwartek", "subtitle": "Tytuł dnia", "text1": "Zajęcia poranne...", "text2": "Zajęcia popołudniowe..." },
    { "title": "Piątek", "subtitle": "Tytuł dnia", "text1": "Zajęcia poranne...", "text2": "Zajęcia popołudniowe..." }
  ]
}`;
                    prompt = `Temat: ${theme}. Wiek dzieci: ${age}. Specyficzne potrzeby: ${specialNeeds}.`;
                } else if (activeModule === 'sos') {
                    sysPrompt = `Jesteś animatorem zabaw. Wymyśl błyskawiczne, genialne gry ratunkowe.
WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON z trzema grami:
{ "items": [ { "title": "Nazwa pierwszej gry", "subtitle": "Czas np. 15 min", "text1": "Zasady w 3 zdaniach...", "text2": "" }, ... ] }`;
                    prompt = `Gdzie utknęliśmy: ${location}. Dostępne rekwizyty: ${props}. Wiek: ${age}. SPE: ${specialNeeds}.`;
                } else if (activeModule === 'teren') {
                    sysPrompt = `Jesteś mistrzem gier terenowych. Ułóż rymowane zagadki.
WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON z pięcioma krokami:
{ "items": [ { "title": "Krok 1", "subtitle": "Kryjówka", "text1": "Rymowanka (4 linijki)...", "text2": "" }, ... ] }`;
                    prompt = `Teren gry: ${theme}. Wiek: ${age}. SPE: ${specialNeeds}.`;
                } else if (activeModule === 'druzyny') {
                    sysPrompt = `Jesteś kierownikiem kolonii. Wymyśl nazwy i okrzyki drużyn.
WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON z 4 drużynami:
{ "items": [ { "title": "Nazwa drużyny", "subtitle": "", "text1": "Okrzyk...", "text2": "" }, ... ] }`;
                    prompt = `Tematyka kolonii/obozu: ${theme}. Wiek: ${age}. SPE: ${specialNeeds}.`;
                }

                try {
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setResultData({ type: activeModule, data: parsedJson, params: { theme, age, location, props, specialNeeds } });
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_eduwakacje_ai', newCount.toString()); } catch(e){}
                    }
                    showMessage('Gotowe!', 'success');
                } catch (error) {
                    showMessage(error.message, 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Zaloguj się lub odśwież stronę, aby udostępnić.', 'error'); return; }
                setIsPublishing(true);
                try {
                    await window.EduBoxCore.saveToGielda('eduwakacje_market', 'eduwakacje', resultData.params.theme || resultData.params.location || 'Plan', resultData);
                    showMessage('Opublikowano na Giełdzie!', 'success');
                    setAppMode('gielda');
                } catch (error) {
                    showMessage(error.message || 'Błąd publikacji.', 'error');
                } finally {
                    setIsPublishing(false);
                }
            };

            useEffect(() => {
                let unsubscribe = null;
                if (appMode === 'gielda') {
                    setIsFetchingMarket(true);
                    const checkAndSub = () => {
                        if(window.EduBoxCore && window.EduBoxCore.subscribeToGielda) {
                            unsubscribe = window.EduBoxCore.subscribeToGielda('eduwakacje_market', (items) => {
                                setMarketItems(items);
                                setIsFetchingMarket(false);
                            }, (err) => { setIsFetchingMarket(false); });
                        } else { setTimeout(checkAndSub, 100); }
                    };
                    checkAndSub();
                }
                return () => { if (unsubscribe) unsubscribe(); }
            }, [appMode]);

            const renderResult = () => {
                if (!resultData) return (
                    <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-50 no-print">
                        <i className="ph-fill ph-sun text-6xl mb-4"></i>
                        <p className="font-bold text-center">Skonfiguruj ustawienia po lewej stronie<br/>i kliknij Wygeneruj.</p>
                    </div>
                );

                const { type, data, params } = resultData;

                const findArrayInObject = (obj) => {
                    if (Array.isArray(obj)) return obj;
                    if (obj && typeof obj === 'object') {
                        for (let key in obj) {
                            if (Array.isArray(obj[key])) return obj[key];
                            const nested = findArrayInObject(obj[key]);
                            if (nested) return nested;
                        }
                    }
                    return null;
                };

                let itemsList = findArrayInObject(data);
                if (!itemsList && data && typeof data === 'object') itemsList = [data]; 

                if (!itemsList || itemsList.length === 0) {
                    return (
                        <div className="bg-red-500/10 border border-red-500/20 p-6 rounded-2xl text-red-400 text-center">
                            <i className="ph-fill ph-warning-circle text-4xl mb-2"></i>
                            <p className="font-bold">Brak wyników do wyrysowania.</p>
                        </div>
                    );
                }

                let resultContent = null;

                if (type === 'plan') {
                    resultContent = (
                        <div className="space-y-6">
                            <div className="text-center mb-8 pb-6 border-b border-slate-800 print:border-slate-300">
                                <h2 className="text-3xl font-summer text-amber-400 print-text font-black uppercase mb-2">Tydzień: {params.theme}</h2>
                                <p className="text-sm text-slate-400 print-text font-bold"><i className="ph-bold ph-users"></i> Grupa wiekowa: {params.age}</p>
                                {params.specialNeeds && params.specialNeeds !== 'Brak (Grupa ogólnodostępna)' && <p className="text-sm text-emerald-400 print:text-emerald-700 print-text font-bold mt-1"><i className="ph-bold ph-wheelchair"></i> SPE: {params.specialNeeds}</p>}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {itemsList.map((item, i) => {
                                    const day = item.title || item.day || item.Day || `Dzień ${i+1}`;
                                    const themeOfDay = item.subtitle || item.title || "Zajęcia";
                                    const morning = item.text1 || item.morning || item.Morning || "Brak opisu";
                                    const afternoon = item.text2 || item.afternoon || item.Afternoon || "Brak opisu";
                                    
                                    return (
                                        <div key={i} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 print-card relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-500 to-orange-500"></div>
                                            <h3 className="text-xl font-black text-white print-text mb-1">{day}</h3>
                                            <p className="text-sm font-bold text-amber-500 print-text mb-4 uppercase tracking-wide">{themeOfDay}</p>
                                            <div className="space-y-4">
                                                <div>
                                                    <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-1 mb-1"><i className="ph-bold ph-sun"></i> Poranek</div>
                                                    <p className="text-sm text-slate-300 print-text leading-relaxed">{morning}</p>
                                                </div>
                                                <div>
                                                    <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-1 mb-1"><i className="ph-bold ph-moon"></i> Popołudnie</div>
                                                    <p className="text-sm text-slate-300 print-text leading-relaxed">{afternoon}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                } else if (type === 'sos') {
                    resultContent = (
                        <div className="space-y-6">
                            <div className="text-center mb-8 pb-6 border-b border-slate-800 print:border-slate-300">
                                <h2 className="text-3xl font-summer text-cyan-400 print-text font-black uppercase mb-2">Ratunkowe Gry S.O.S</h2>
                                <p className="text-sm text-slate-400 print-text font-bold"><i className="ph-bold ph-map-pin"></i> {params.location} | <i className="ph-bold ph-backpack"></i> {params.props}</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {itemsList.map((item, i) => (
                                    <div key={i} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 print-card relative">
                                        <div className="w-12 h-12 bg-cyan-500/20 text-cyan-400 rounded-2xl flex items-center justify-center mb-4 text-2xl print:bg-cyan-100 print:text-cyan-800"><i className="ph-bold ph-lightning"></i></div>
                                        <h3 className="text-lg font-black text-white print-text mb-2">{item.title || `Gra nr ${i+1}`}</h3>
                                        <p className="text-[10px] bg-slate-800 print:bg-slate-200 text-slate-300 print-text px-2 py-1 rounded inline-block font-bold mb-4"><i className="ph-bold ph-timer"></i> Czas: {item.subtitle}</p>
                                        <p className="text-sm text-slate-300 print-text leading-relaxed">{item.text1}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                } else if (type === 'teren') {
                    resultContent = (
                        <div className="space-y-6">
                            <div className="text-center mb-8 pb-6 border-b border-slate-800 print:border-slate-300">
                                <h2 className="text-3xl font-summer text-emerald-400 print-text font-black uppercase mb-2">Terenowe Podchody</h2>
                                <p className="text-sm text-slate-400 print-text font-bold"><i className="ph-bold ph-compass"></i> Teren: {params.theme}</p>
                            </div>
                            <div className="space-y-4 max-w-2xl mx-auto">
                                {itemsList.map((item, i) => (
                                    <div key={i} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 print-card flex gap-6 items-center">
                                        <div className="text-5xl font-black text-slate-800 print:text-slate-200">{i+1}</div>
                                        <div className="flex-1">
                                            <p className="text-lg font-summer text-emerald-300 print-text leading-relaxed italic mb-3">"{item.text1}"</p>
                                            <div className="bg-slate-950 print:bg-slate-100 p-3 rounded-xl border border-dashed border-slate-700 print:border-slate-300 text-xs text-slate-400 print-text font-bold flex items-center gap-2">
                                                <i className="ph-fill ph-eye"></i> Kryjówka: <span className="text-white print-text">{item.subtitle}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                } else if (type === 'druzyny') {
                    resultContent = (
                        <div className="space-y-6">
                            <div className="text-center mb-8 pb-6 border-b border-slate-800 print:border-slate-300">
                                <h2 className="text-3xl font-summer text-purple-400 print-text font-black uppercase mb-2">Baza Drużyn i Okrzyków</h2>
                                <p className="text-sm text-slate-400 print-text font-bold"><i className="ph-bold ph-palette"></i> Motyw: {params.theme}</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {itemsList.map((item, i) => (
                                    <div key={i} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 print-card text-center">
                                        <div className="w-16 h-16 bg-purple-500/20 text-purple-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl print:bg-purple-100 print:text-purple-800"><i className="ph-bold ph-flag-banner"></i></div>
                                        <h3 className="text-2xl font-black text-white print-text mb-4 uppercase">{item.title}</h3>
                                        <div className="bg-slate-950 print:bg-slate-100 p-4 rounded-2xl">
                                            <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Okrzyk:</div>
                                            <p className="text-base text-purple-300 print-text font-bold italic leading-relaxed whitespace-pre-line">{item.text1}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="space-y-8 animate-[reveal_0.4s_ease-out]">
                        {resultContent}
                        
                        <div className="mt-10 bg-slate-900 border border-blue-500/30 rounded-3xl p-8 text-center relative overflow-hidden group no-print shadow-xl">
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-600/10 to-amber-500/10 z-0"></div>
                            <div className="relative z-10">
                                <h3 className="text-xl font-bold text-white mb-2">Gotowe! Co dalej?</h3>
                                <p className="text-slate-400 text-sm mb-6 max-w-lg mx-auto">Wydrukuj ten plan, aby mieć go przy sobie podczas zajęć, lub udostępnij na Giełdzie, aby ułatwić pracę innym wychowawcom i animatorom.</p>
                                <div className="flex flex-col sm:flex-row justify-center gap-4">
                                    <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3">
                                        <i className="ph-bold ph-printer text-2xl"></i> Wydrukuj Dokument
                                    </button>
                                    <button onClick={publishToMarket} disabled={isPublishing} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all flex items-center justify-center gap-3 disabled:opacity-50">
                                        {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-2xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-2xl"></i>} 
                                        Zapisz w Bazie Giełdy
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 overflow-hidden relative selection:bg-amber-500/30">
                    <div className="aura-container no-print"><div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div></div>

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'} no-print`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    <aside className="w-80 flex-shrink-0 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-full z-10 no-print transition-all duration-300">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                                <i className="ph-bold ph-sun text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-summer font-bold tracking-tight text-white leading-none uppercase">EduWakacje</h1>
                                <p className="text-[10px] text-amber-500 font-bold tracking-wider uppercase mt-1">Zero-Prep PRO MAX</p>
                            </div>
                        </div>

                        <div className="px-4 py-3 flex gap-2 border-b border-slate-800">
                            <button onClick={() => setAppMode('kreator')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-amber-500 text-slate-900 shadow-lg shadow-amber-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                <i className="ph-bold ph-paint-brush"></i> Asystent
                            </button>
                            <button onClick={() => setAppMode('gielda')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                <i className="ph-bold ph-globe"></i> Giełda
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            {appMode === 'kreator' && (
                                <>
                                    <div className="grid grid-cols-2 gap-2">
                                        {MODULES.map(m => (
                                            <button key={m.id} onClick={() => setActiveModule(m.id)} className={`p-3 rounded-xl flex flex-col items-center text-center gap-2 transition-all border ${activeModule === m.id ? 'bg-slate-800 border-slate-600 shadow-lg' : 'bg-slate-900/50 border-transparent text-slate-500 hover:bg-slate-800 hover:text-slate-300'}`}>
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-br ${m.color} ${activeModule === m.id ? 'opacity-100' : 'opacity-50 grayscale'}`}>
                                                    <i className={`text-xl text-white ${activeModule === m.id ? 'ph-fill' : 'ph-bold'} ${m.icon}`}></i>
                                                </div>
                                                <span className={`text-[10px] font-bold uppercase leading-tight ${activeModule === m.id ? 'text-white' : ''}`}>{m.title}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="space-y-4 bg-slate-900 border border-slate-800 rounded-2xl p-4">
                                        <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2 mb-2 flex items-center gap-2">
                                            <i className="ph-bold ph-sliders"></i> Ustawienia Parametrów
                                        </div>

                                        {(activeModule === 'plan' || activeModule === 'druzyny') && (
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Temat / Motyw przewodni</label>
                                                <input type="text" value={theme} onChange={e => setTheme(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-amber-500 transition-colors" placeholder="np. Piraci z Karaibów" />
                                            </div>
                                        )}

                                        {(activeModule === 'teren') && (
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Opis Terenu Gry</label>
                                                <textarea value={theme} onChange={e => setTheme(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-amber-500 transition-colors resize-none" rows="2" placeholder="np. Stary park z dębami i fontanną" />
                                            </div>
                                        )}

                                        {(activeModule === 'sos') && (
                                            <>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Gdzie jesteśmy?</label>
                                                    <select value={location} onChange={e => setLocation(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-amber-500">
                                                        <option>Mała Świetlica</option><option>Autokar / Pociąg</option><option>Las / Plener</option><option>Sala gimnastyczna</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Co mamy do dyspozycji?</label>
                                                    <select value={props} onChange={e => setProps(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-amber-500">
                                                        <option>Kompletnie nic (Zero-prep)</option><option>Kartki i długopisy</option><option>Piłka i skakanka</option><option>Chusta Klanzy</option>
                                                    </select>
                                                </div>
                                            </>
                                        )}

                                        <div className="space-y-4">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Wiek Dzieci</label>
                                                <select value={age} onChange={e => setAge(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-amber-500">
                                                    <option>Przedszkolaki (4-6 lat)</option><option>7-10 lat</option><option>11-14 lat</option><option>Młodzież (15+)</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase text-emerald-400 flex items-center gap-1"><i className="ph-bold ph-wheelchair"></i> Potrzeby Specjalne (SPE)</label>
                                                <select value={specialNeeds} onChange={e => setSpecialNeeds(e.target.value)} className="w-full bg-slate-950 border border-emerald-700/50 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500">
                                                    <option>Brak (Grupa ogólnodostępna)</option>
                                                    <option>Przedszkolaki z niepełnosprawnością (Ogólne)</option>
                                                    <option>Spektrum Autyzmu i Asperger</option>
                                                    <option>Zaburzenia sensoryczne (SI) / Wyciszenie</option>
                                                    <option>Niepełnosprawność intelektualna</option>
                                                    <option>Dzieci ze spektrum ADHD</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <button onClick={generateContent} disabled={isGenerating} className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-900 font-black py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2">
                                            {isGenerating ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-magic-wand text-xl"></i>} 
                                            Generuj Rozwiązanie
                                        </button>
                                    </div>
                                </>
                            )}

                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-4 text-center">
                                        <i className="ph-fill ph-sun-horizon text-3xl text-blue-400 mb-2"></i>
                                        <h3 className="text-sm font-bold text-white mb-1">Letnie Inspiracje</h3>
                                        <p className="text-[10px] text-slate-400">Pobieraj plany i gry stworzone przez innych wychowawców.</p>
                                    </div>

                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-500"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak projektów. Opublikuj pierwszy!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => {
                                                const mod = MODULES.find(m => m.id === item.config?.type);
                                                return (
                                                    <div key={item.id} className="bg-slate-800 rounded-xl p-3 border border-slate-700 hover:border-blue-500 transition-colors group cursor-pointer" onClick={() => { setResultData(item.config); setAppMode('kreator'); showMessage('Wczytano z Giełdy!', 'success'); }}>
                                                        <div className="flex justify-between items-start mb-2">
                                                            <div className="flex items-center gap-2 overflow-hidden">
                                                                <i className={`ph-fill ${mod?.icon || 'ph-sun'} text-amber-500`}></i>
                                                                <span className="text-xs font-black text-white truncate">{item.name}</span>
                                                            </div>
                                                            <span className="text-[9px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full whitespace-nowrap shrink-0">{item.config?.params?.age || 'Wszystkie'}</span>
                                                        </div>
                                                        <p className="text-[10px] text-slate-400 line-clamp-2 leading-relaxed">
                                                            Pobierz gotowe materiały jednym kliknięciem.
                                                        </p>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-amber-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/30 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-amber-400"></i>
                                    <div><p className="text-xs font-bold text-white">Wersja PRO MAX</p><p className="text-[9px] text-amber-300">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    {/* Main Workspace (Preview Area) */}
                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 print-container relative">
                            <div className="max-w-4xl mx-auto pb-32">
                                {renderResult()}
                            </div>
                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
