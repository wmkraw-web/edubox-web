                    </nav>

            try {
                fetch('/menu.html')

                    .then(data => {

                        container.querySelectorAll('script').forEach(oldScript => {

                            newScript.textContent = oldScript.textContent;

                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();

            } catch (error) { wstawMenuAwaryjne(); }
        });

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
                import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useRef, useEffect } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                Word: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        const SUBJECTS = [
            'Edukacja wczesnoszkolna', 'Język polski', 'Matematyka', 'Język obcy (np. angielski)', 
            'Historia', 'Geografia', 'Biologia / Przyroda', 'Fizyka', 'Chemia', 'Wychowanie fizyczne', 'Informatyka'
        ];

        const DIAGNOSES = [
            'Dysleksja rozwojowa', 'Dysortografia / Dysgrafia', 'Dyskalkulia', 
            'ADHD (Nadpobudliwość psychoruchowa)', 'ADD (Zaburzenia koncentracji uwagi)', 
            'Spektrum Autyzmu / Zespół Aspergera', 'Niedosłuch', 'Słabowidzenie',
            'Niepełnosprawność intelektualna w stopniu lekkim', 'Uczeń zdolny / uzdolniony'
        ];

        const SYSTEM_PROMPT = `Jesteś ekspertem ds. edukacji włączającej, pedagogiem specjalnym oraz metodykiem. Trwa rok szkolny 2026/2027.
Twoje zadanie: Na podstawie wybranego przedmiotu i diagnozy z PPP wygeneruj oficjalny dokument "Dostosowanie wymagań edukacyjnych".
Styl: Wysoce sformalizowany, zgodny z najnowszymi wytycznymi Ministerstwa Edukacji Narodowej (MEN), gotowy do wpięcia w teczkę ucznia i IPET.

Struktura dokumentu, którą musisz zastosować:
1. NAGŁÓWEK: Dostosowanie wymagań edukacyjnych z przedmiotu: [Przedmiot] dla ucznia z diagnozą: [Diagnoza].
2. WARUNKI I FORMY PRACY NA LEKCJI (wypunktowane zasady wsparcia w czasie zajęć, np. miejsce w klasie, czas na odpowiedź, forma przekazu instrukcji).
3. FORMY SPRAWDZANIA WIEDZY I UMIEJĘTNOŚCI (wypunktowane, np. wydłużony czas na sprawdzianie, ustna forma odpowiedzi zamiast pisemnej).
4. KRYTERIA OCENIANIA (wypunktowane zasady oceniania, np. ocenianie wysiłku wkładanego w pracę, nieocenianie błędów ortograficznych, dostosowanie skali ocen).
5. UWAGI DODATKOWE (opcjonalne, w tym te przekazane przez nauczyciela).
6. Miejsce na "Data i podpis nauczyciela: ......................................."`;

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator');

            const [selectedSubject, setSelectedSubject] = useState('');
            const [selectedDiagnosis, setSelectedDiagnosis] = useState('');
            const [extraNotes, setExtraNotes] = useState('');
            
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            // --- LOGOWANIE (wspólny silnik) ---
            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edudostosowania_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const updateAndCheckLimit = () => {
                if (isPro) return true; 

                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData(prev => ({ ...prev, remaining: 0, showWarning: true }));
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateDocument = async () => {
                if (!selectedSubject || !selectedDiagnosis) {
                    setError('Proszę wybrać przedmiot oraz diagnozę ucznia.');
                    return;
                }

                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setError('');
                setGeneratedText('');

                try {
                    const finalPrompt = `Przedmiot: ${selectedSubject}\nDiagnoza: ${selectedDiagnosis}\nDodatkowe uwagi nauczyciela: ${extraNotes || 'Brak'}`;

                    if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("LocalTest");
                    }

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            system: SYSTEM_PROMPT,
                            prompt: finalPrompt,
                            temperature: 0.2
                        })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || data.error || `Błąd serwera API: ${response.status}`);

                    let text = data.text;
                    if (text) {
                        setGeneratedText(text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim());
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setError('Tryb lokalny. Symulacja.');
                        setTimeout(() => {
                            const demoText = `DOSTOSOWANIE WYMAGAŃ EDUKACYJNYCH\nPrzedmiot: ${selectedSubject}\nDiagnoza: ${selectedDiagnosis}\n\nI. WARUNKI I FORMY PRACY NA LEKCJI:\n1. Zapewnienie uczniowi optymalnego miejsca w sali.\n2. Wydłużenie czasu na czytanie tekstów.\n3. Unikanie głośnego czytania.\n\nII. FORMY SPRAWDZANIA WIEDZY:\n1. Wydłużenie czasu na napisanie sprawdzianu.\n2. Możliwość zaliczenia materiału w formie ustnej.\n\nIII. KRYTERIA OCENIANIA:\n1. Ocenianie przede wszystkim wiedzy merytorycznej.\n2. Branie pod uwagę wysiłku ucznia.\n\nData i podpis nauczyciela: .......................................`;
                            setGeneratedText(demoText);
                            setIsGenerating(false);
                        }, 1500);
                    } else {
                        setError('Wystąpił błąd serwera. Spróbuj ponownie.');
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = (text) => {
                if (!text) return;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Skopiowano do schowka!');
            };

            const exportToWord = (text, title) => {
                if (!text) return;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${title}</title><style>body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: #000; text-align: justify; }</style></head><body>`;
                const footer = `<\/body><\/html>`;
                const formattedText = text.replace(/\n/g, '<br>');
                const blob = new Blob(['\ufeff', header + formattedText + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${title.replace(/\s+/g, '_')}.doc`; link.click();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj krótki tytuł!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edudostosowania_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            subject: selectedSubject,
                            diagnosis: selectedDiagnosis,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const printDocument = () => {
                window.print();
            };

            return (
                <div className="relative flex flex-col min-h-screen print:bg-white">
                    <div className="hero-glow print-hidden"></div>

                    {toastMessage && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-teal-600 text-white px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(20,184,166,0.4)] font-bold text-sm animate-toast flex items-center gap-3 border border-teal-400 print-hidden`}>
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                            <div className="bg-slate-900 border border-teal-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-teal-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Bazie Wzorów</h3>
                                <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs font-bold mb-4">
                                    Dokument nie zawiera danych ucznia. Możesz bezpiecznie opublikować go jako wzór dla innych nauczycieli.
                                </div>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł wzoru</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder={`np. Dostosowania - ${selectedSubject}`} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-teal-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10 print:p-0">
                        <div className="max-w-5xl mx-auto">
                            
                            {/* Nagłówek */}
                            <div className="text-center mb-10 fade-in print-hidden">
                                <div className="inline-flex items-center gap-2 bg-teal-900/30 border border-teal-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-teal-400 uppercase tracking-widest mb-4">
                                    Narzędzie Ochrony Prawnej i IPET
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Dostosowania <span className="text-gradient">na tacy.</span>
                                </h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                    Wybierz przedmiot i diagnozę z PPP, a AI wygeneruje gotowy do wydruku dokument z metodami pracy i kryteriami oceniania ucznia.
                                </p>
                            </div>

                            {/* TOGGLE WIDOKÓW */}
                            <div className="flex justify-center mb-8 print-hidden fade-in">
                                <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg w-full max-w-md">
                                    <button onClick={() => setViewMode('kreator')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 ${viewMode === 'kreator' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Sparkles" size={16} /> Kreator Dokumentów
                                    </button>
                                    <button onClick={() => setViewMode('biblioteka')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-purple-600 text-white shadow-[0_0_15px_rgba(139,92,246,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Library" size={16} /> Baza Dostosowań
                                    </button>
                                </div>
                            </div>

                            {viewMode === 'kreator' && (
                                <div className="animate-[fadeIn_0.3s_ease-out]">
                                    
                                    {limitData.showWarning && !isPro && (
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in relative overflow-hidden">
                                            <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                            <p className="text-slate-300 mb-4 text-sm sm:text-base">
                                                Aby korzystać z modułu AI bez limitów, wpisz kod PRO na górnym pasku w menu.
                                            </p>
                                        </div>
                                    )}

                                    {/* Panel Sterowania */}
                                    <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50 print-hidden" style={{animationDelay: '0.1s'}}>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-8 mb-8">
                                            <div>
                                                <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider flex items-center gap-2">
                                                    <span className="text-teal-400">1.</span> Wybierz diagnozę / potrzebę:
                                                </label>
                                                <select 
                                                    value={selectedDiagnosis} 
                                                    onChange={(e) => setSelectedDiagnosis(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl p-4 focus:ring-2 focus:ring-teal-500 outline-none"
                                                >
                                                    <option value="" disabled>--- Wybierz z listy ---</option>
                                                    {DIAGNOSES.map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider flex items-center gap-2">
                                                    <span className="text-teal-400">2.</span> Wybierz nauczany przedmiot:
                                                </label>
                                                <select 
                                                    value={selectedSubject} 
                                                    onChange={(e) => setSelectedSubject(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl p-4 focus:ring-2 focus:ring-teal-500 outline-none"
                                                >
                                                    <option value="" disabled>--- Wybierz z listy ---</option>
                                                    {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider flex items-center gap-2">
                                                <span className="text-teal-400">3.</span> Twoje uwagi do dokumentu (opcjonalnie):
                                            </label>
                                            <textarea 
                                                value={extraNotes}
                                                onChange={(e) => setExtraNotes(e.target.value)}
                                                placeholder="Np. Uczeń słabo widzi na lewe oko, musi siedzieć w pierwszej ławce przy oknie. Bardzo stresuje się przy odpowiedzi ustnej."
                                                className="w-full h-24 bg-slate-900/50 border border-slate-700 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 custom-scrollbar resize-y text-sm"
                                            ></textarea>
                                        </div>

                                        {error && <div className="mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>}

                                        <div className="mt-8 flex justify-center">
                                            <button 
                                                onClick={generateDocument}
                                                disabled={isGenerating || !selectedSubject || !selectedDiagnosis || (!isPro && limitData.remaining === 0)}
                                                className={`w-full sm:w-auto px-10 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(20,184,166,0.2)] btn-bounce
                                                    ${(isGenerating || !selectedSubject || !selectedDiagnosis || (!isPro && limitData.remaining === 0)) ? 'bg-slate-700 cursor-not-allowed border border-slate-600' : 'bg-gradient-to-r from-teal-500 to-purple-600 hover:scale-105'}`}
                                            >
                                                {isGenerating ? (
                                                    <><svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Przetwarzanie wytycznych MEN...</>
                                                ) : 'Wygeneruj Oficjalny Dokument'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Sekcja Wyników */}
                                    {generatedText && (
                                        <div ref={resultRef} className="mt-12 fade-in print:mt-0">

                                            <div className="glass-panel p-8 sm:p-12 rounded-[2.5rem] border border-teal-500/30 shadow-[0_0_40px_rgba(20,184,166,0.15)] relative overflow-hidden bg-white print:shadow-none print:border-none print:p-0 print:rounded-none print:bg-white">
                                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-teal-400 to-purple-600 print-hidden"></div>
                                                
                                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 print-hidden border-b border-slate-200 pb-4">
                                                    <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                        <svg className="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                        Gotowe "Dostosowania"
                                                    </h3>
                                                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                                        <button onClick={() => setShowPublishModal(true)} className="flex-1 sm:flex-none bg-amber-500 hover:bg-amber-400 text-slate-900 px-4 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-md">
                                                            <Icon name="Share" size={16}/> Jako Wzór
                                                        </button>
                                                        <button onClick={() => exportToWord(generatedText, `Dostosowania_${selectedSubject}`)} className="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold transition-all btn-bounce flex items-center justify-center gap-2">
                                                            <Icon name="Word" size={16}/> Word
                                                        </button>
                                                        <button onClick={() => copyToClipboard(generatedText)} className="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold transition-all btn-bounce flex items-center justify-center gap-2">
                                                            <Icon name="Copy" size={16}/> Kopiuj
                                                        </button>
                                                        <button onClick={printDocument} className="flex-1 sm:flex-none bg-teal-600 hover:bg-teal-500 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-md shadow-teal-500/30">
                                                            <Icon name="Printer" size={16}/> Drukuj
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="text-black print-content whitespace-pre-wrap">
                                                    {generatedText}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* WIDOK BIBLIOTEKI ZESTAWÓW */}
                            {viewMode === 'biblioteka' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] w-full print-hidden">
                                    <div className="text-center max-w-3xl mx-auto mb-10">
                                        <h2 className="text-3xl font-black text-purple-400 mb-2">Baza Wzorów Dostosowań</h2>
                                        <p className="text-slate-400">Przeglądaj, kopiuj i pobieraj gotowe wzory dostosowań wymagań stworzonych przez innych nauczycieli dla konkretnych przedmiotów.</p>
                                    </div>
                                    
                                    {libraryItems.length === 0 ? (
                                        <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                            <div className="text-5xl mb-4">📚</div>
                                            <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                            <p className="text-slate-400">Bądź pierwszy! Wygeneruj dokument i dodaj go do Biblioteki Wzorów.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[600px] border-purple-500/30 hover:border-purple-500/60">
                                                    <div className="flex justify-between items-start mb-3 flex-wrap gap-2">
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-teal-500/20 text-teal-400">
                                                            {item.subject}
                                                        </span>
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-purple-500/20 text-purple-400">
                                                            {item.diagnosis}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white mb-4 leading-tight">{item.title}</h3>
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar font-serif text-justify">
                                                        {item.content}
                                                    </div>
                                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                        <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                            <Icon name="Copy" size={16} />
                                                        </button>
                                                        <button onClick={() => exportToWord(item.content, item.title)} className="p-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                            <Icon name="Word" size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="py-6 border-t border-slate-800/50 text-center text-xs font-bold text-slate-500 uppercase tracking-widest mt-auto print-hidden">
                        Część potężnego systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
