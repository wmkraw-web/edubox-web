    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-fuchsia-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }

            try {
                fetch('/menu.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Błąd ładowania menu');
                        return response.text();
                    })
                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(error => wstawMenuAwaryjne());
            } catch (error) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Cards: <><rect x="2" y="6" width="14" height="16" rx="2" ry="2"></rect><path d="M6 2h14a2 2 0 0 1 2 2v14"></path></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                BookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
                SquaresFour: <><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.Sparkles}</svg>;
        };

        function EduFiszkiApp() {
            const [user, setUser] = useState(null);

            // --- PREMIUM & LIMITS ---
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // --- STATE APLIKACJI ---
            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka
            const [inputText, setInputText] = useState('');
            const [pairsCount, setPairsCount] = useState(8);
            const [printMode, setPrintMode] = useState('fiszki'); // fiszki | memory
            
            const [aiCards, setAiCards] = useState([]); 
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // --- BIBLIOTEKA ---
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edufiszki_sets');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateCards = async () => {
                if (!inputText.trim()) {
                    showToast("⚠️ Wklej tekst źródłowy lub podaj temat fiszek.");
                    return;
                }

                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setAiCards([]);

                const systemPrompt = `Jesteś wybitnym ekspertem edukacyjnym i lingwistą. 
ZADANIE: Wygeneruj DOKŁADNIE ${pairsCount} par edukacyjnych (hasło i definicja).

ZASADY:
1. Jeśli użytkownik wkleił DŁUGI TEKST (notatkę), wyciągnij z niego najważniejsze pojęcia i napisz do nich definicje.
2. Jeśli użytkownik wpisał KRÓTKIE HASŁO (np. "zwierzęta po angielsku", "ułamki", "stolica Polski"), potraktuj to jako TEMAT. Samodzielnie wymyśl ${pairsCount} haseł z tego tematu.
3. UWAGA JĘZYKOWA: Jeśli temat sugeruje naukę języka obcego (np. "po angielsku", "niemiecki"), w polu "term" wpisz słówko w języku obcym, a w "def" polskie tłumaczenie.

WYMÓG KRYTYCZNY: Zwracaj odpowiedź w CZYSTYM, PRAWIDŁOWYM FORMACIE JSON.`;

                const finalPrompt = `Wytyczne od nauczyciela:\n${inputText}`;

                try {
                    if (window.location.protocol === 'file:' || window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("TestLocal");
                    }

                    const payload = { 
                        system: systemPrompt, 
                        prompt: finalPrompt, 
                        temperature: 0.3, 
                        format: "json", 
                        model: "gpt-4o-mini" 
                    };
                    
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || data.details || "Błąd API");

                    let cleanText = data.text;
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const outerObj = JSON.parse(cleanText); if(outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch(e){}
                    }
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('[') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('['), jsonStr.lastIndexOf(']') + 1);

                    const parsedData = JSON.parse(jsonStr);
                    if (Array.isArray(parsedData) && parsedData.length > 0) {
                        setAiCards(parsedData);
                        showToast("✨ Karty zostały wygenerowane!");
                    } else {
                        throw new Error("Niepoprawny format danych (brak tablicy)");
                    }
                    
                } catch (error) {
                    if (error.message === "TestLocal") {
                        setAiCards([
                            {term: "Apple", def: "Jabłko"}, {term: "Dog", def: "Pies"}, {term: "Cat", def: "Kot"}, {term: "House", def: "Dom"}
                        ]);
                        showToast("Tryb testowy.");
                    } else {
                        console.error("API Error:", error);
                        showToast("🚨 Wystąpił błąd komunikacji z serwerem.");
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj tytuł zestawu!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edufiszki_sets');
                        await addDoc(libRef, {
                            title: publishTitle,
                            cards: aiCards,
                            pairsCount: aiCards.length,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Giełdzie!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadSetFromLibrary = (cardsArray) => {
                setAiCards(cardsArray);
                setViewMode('kreator');
                showToast("✅ Pomyślnie załadowano zestaw kart!");
                window.scrollTo(0,0);
            };

            // RENDEROWANIE DO DRUKU - WIDOK 1 (FISZKI SKŁADANE)
            const renderFiszkiPrint = () => {
                return (
                    <div className="hidden print:block w-full">
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold uppercase tracking-widest text-black">Fiszki Edukacyjne</h2>
                            <p className="text-sm text-gray-700 mb-4">Wytnij każdą kartę, a następnie zegnij ją wpół wzdłuż przerywanej linii i sklej.</p>
                        </div>
                        <div className="flex flex-col gap-4">
                            {aiCards.map((card, idx) => (
                                <div key={idx} className="flex w-full min-h-[4cm] print-break-inside-avoid border-2 border-black rounded-md overflow-hidden">
                                    {/* Lewa strona (Hasło) */}
                                    <div className="w-1/2 flex items-center justify-center p-6 border-r-2 border-dashed border-gray-400">
                                        <h3 className="text-3xl font-black text-center text-black">{card.term}</h3>
                                    </div>
                                    {/* Prawa strona (Definicja) */}
                                    <div className="w-1/2 flex items-center justify-center p-6 bg-gray-50">
                                        <p className="text-lg text-center leading-relaxed font-medium text-black">{card.def}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // RENDEROWANIE DO DRUKU - WIDOK 2 (GRA MEMORY)
            const renderMemoryPrint = () => {
                return (
                    <div className="hidden print:block w-full">
                        {/* STRONA 1: HASŁA */}
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold uppercase tracking-widest text-black">Gra Memory - Arkusz 1 (Hasła)</h2>
                            <p className="text-sm text-gray-700 mb-4">Wydrukuj i potnij na pojedyncze karty wzdłuż przerywanych linii.</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {aiCards.map((card, idx) => (
                                <div key={`term-${idx}`} className="flex items-center justify-center p-6 h-[5cm] print-break-inside-avoid border-2 border-black print-dashed rounded-md">
                                    <h3 className="text-2xl font-black text-center text-black">{card.term}</h3>
                                </div>
                            ))}
                        </div>

                        {/* Wymuszenie nowej strony */}
                        <div className="print-page-break"></div>

                        {/* STRONA 2: DEFINICJE */}
                        <div className="text-center mb-6 mt-8">
                            <h2 className="text-2xl font-bold uppercase tracking-widest text-black">Gra Memory - Arkusz 2 (Definicje)</h2>
                            <p className="text-sm text-gray-700 mb-4">Polecamy wydrukować ten arkusz na innym kolorze papieru!</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            {aiCards.map((card, idx) => (
                                <div key={`def-${idx}`} className="flex items-center justify-center p-6 h-[5cm] print-break-inside-avoid border-2 border-black print-dashed bg-gray-100 rounded-md">
                                    <p className="text-xl text-center leading-relaxed font-medium text-black">{card.def}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative flex flex-col pb-10">
                    <div className="hero-glow print-hidden"></div>

                    {/* Toast */}
                    {toastMessage && (
                        <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 print-hidden ${toastMessage ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                            <div className="bg-slate-900 border border-fuchsia-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-fuchsia-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Giełdzie</h3>
                                <p className="text-slate-400 text-sm mb-6">Udostępnij ten zestaw słów/definicji dla innych nauczycieli.</p>
                                
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Nazwa Twojego Zestawu</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Słówka angielskie - Pogoda" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-fuchsia-500" />
                                
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj Zestaw'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Nawigacja / Wstęp */}
                    <div className="max-w-[90rem] mx-auto px-4 pt-10 sm:pt-16 pb-8 text-center print-hidden fade-in">
                        <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                            Edu<span className="text-fuchsia-500">Fiszki</span> AI
                        </h1>
                        <p className="text-slate-400 text-lg max-w-2xl mx-auto mb-8">
                            Błyskawiczny kreator dwustronnych materiałów edukacyjnych.
                        </p>

                        {/* TOGGLE WIDOKÓW */}
                        <div className="flex justify-center mb-6">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-fuchsia-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Sparkles" size={16} /> Kreator Kart
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Giełda Zestawów
                                </button>
                            </div>
                        </div>
                    </div>

                    <main className="flex-grow max-w-[90rem] w-full mx-auto px-4 sm:px-6 pb-8 relative z-10 flex flex-col xl:flex-row gap-8 items-start print:p-0 print:m-0 print:block">
                        
                        {viewMode === 'kreator' && (
                            <>
                                {/* ================================== */}
                                {/* LEWA KOLUMNA: Kreator (UI)         */}
                                {/* ================================== */}
                                <div className="w-full xl:w-4/12 flex flex-col gap-6 print-hidden animate-[fadeIn_0.3s_ease-out]">
                                    
                                    {limitData.showWarning && !isPro && (
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg">
                                            <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny (5/5)</h3>
                                            <p className="text-slate-300 text-sm">Wykorzystałeś dzisiejsze 5 darmowych generowań. Odblokuj pełen potencjał kodem na górnym pasku.</p>
                                        </div>
                                    )}

                                    <div className="glass-panel rounded-[2rem] p-6 md:p-8 border-t-4 border-fuchsia-500">
                                        <h2 className="text-2xl font-black text-white mb-2">Panel Tworzenia</h2>
                                        <p className="text-slate-400 text-sm mb-8 leading-relaxed">Wklej ścianę tekstu (notatkę) ALBO wpisz krótki temat (np. "zwierzęta po angielsku"). AI wyciągnie hasła i stworzy dla Ciebie zestawy.</p>

                                        {/* Wybór ilości */}
                                        <div className="mb-6">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">Ile haseł wyciągnąć/wymyslić?</label>
                                            <select value={pairsCount} onChange={e => setPairsCount(parseInt(e.target.value))} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-fuchsia-500 text-sm transition-colors cursor-pointer">
                                                <option value="6">6 haseł (12 kart memory)</option>
                                                <option value="8">8 haseł (16 kart memory)</option>
                                                <option value="12">12 haseł (24 karty memory)</option>
                                                <option value="16">16 haseł (Trudne)</option>
                                            </select>
                                        </div>

                                        {/* Tekst Źródłowy */}
                                        <div className="mb-8">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-3 flex items-center justify-between">
                                                <span>Tekst źródłowy / Temat</span>
                                                <button onClick={() => setInputText('')} className="text-slate-500 hover:text-white"><i className="ph-bold ph-eraser"></i> Wyczyść</button>
                                            </label>
                                            <textarea 
                                                value={inputText}
                                                onChange={e => setInputText(e.target.value)}
                                                placeholder="Wklej notatkę z historii, fragment podręcznika, LUB wpisz 'Zwierzęta po angielsku'..."
                                                className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 h-48 focus:outline-none focus:border-fuchsia-500 transition-colors text-sm custom-scrollbar resize-none"
                                            />
                                        </div>

                                        {/* Przycisk Generowania */}
                                        <button 
                                            onClick={generateCards}
                                            disabled={isGenerating || !inputText.trim() || (!isPro && limitData.remaining === 0)}
                                            className="w-full bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 disabled:opacity-50 text-white py-4 rounded-xl font-bold shadow-[0_10px_30px_-10px_rgba(217,70,239,0.5)] transition-all btn-bounce uppercase tracking-widest flex items-center justify-center gap-3 text-sm"
                                        >
                                            {isGenerating ? <div className="loader"></div> : (
                                                <><Icon name="Sparkles" size={20} /> Generuj Arkusze</>
                                            )}
                                        </button>
                                    </div>
                                </div>

                                {/* ================================== */}
                                {/* PRAWA KOLUMNA: Podgląd i Wydruk    */}
                                {/* ================================== */}
                                <div className="w-full xl:w-8/12 flex flex-col h-full print:w-full print:m-0 animate-[fadeIn_0.3s_ease-out]">
                                    
                                    {/* Zakładki Wyboru Formatu Druku */}
                                    <div className="glass-panel p-2 rounded-2xl flex gap-1 bg-slate-900/60 mb-6 w-full print-hidden">
                                        <button onClick={() => setPrintMode('fiszki')} className={`flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest transition-all ${printMode === 'fiszki' ? 'bg-fuchsia-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                            <Icon name="BookOpen" size={18} /> Fiszki (Zginane)
                                        </button>
                                        <button onClick={() => setPrintMode('memory')} className={`flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest transition-all ${printMode === 'memory' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                            <Icon name="SquaresFour" size={18} /> Gra Memory (Rozdzielne)
                                        </button>
                                    </div>

                                    <div className="glass-panel rounded-[2rem] p-6 md:p-10 flex-grow relative overflow-hidden print:p-0 print:border-none print:bg-transparent print:backdrop-filter-none">
                                        
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 print-hidden border-b border-slate-700/50 pb-4 gap-4">
                                            <div>
                                                <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                                    <Icon name="Printer" className="text-fuchsia-400" /> Gotowe do druku
                                                </h3>
                                                <p className="text-xs text-slate-400 mt-1">Po kliknięciu "Drukuj" ukryjemy interfejs i dostosujemy siatkę do formatu A4 czarno-białego.</p>
                                            </div>
                                            
                                            {aiCards.length > 0 && (
                                                <div className="flex gap-2 w-full sm:w-auto">
                                                    <button onClick={() => setShowPublishModal(true)} className="flex-1 sm:flex-none bg-amber-500 hover:bg-amber-400 px-4 py-2 rounded-lg text-slate-900 font-bold flex items-center justify-center gap-2 transition-colors btn-bounce text-sm shadow-md">
                                                        <Icon name="Share" size={16}/> Do Giełdy
                                                    </button>
                                                    <button onClick={() => window.print()} className="flex-1 sm:flex-none bg-fuchsia-600 hover:bg-fuchsia-500 px-6 py-2 rounded-lg text-white font-bold transition-colors shadow-[0_0_15px_rgba(217,70,239,0.4)] flex items-center justify-center gap-2 btn-bounce text-sm uppercase tracking-wider">
                                                        <Icon name="Printer" size={16}/> Drukuj PDF
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        {aiCards.length === 0 ? (
                                            <div className="flex-1 min-h-[400px] flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-slate-700/50 rounded-2xl p-10 print-hidden">
                                                <Icon name="Cards" size={70} className="mb-4 text-slate-700 opacity-50" />
                                                <p className="text-center font-medium">Brak wygenerowanych kart.<br/>Wklej tekst lub wpisz temat i kliknij Generuj po lewej stronie.</p>
                                            </div>
                                        ) : (
                                            <div className="print:hidden w-full space-y-4">
                                                {/* Podgląd na ekranie (Ciemny motyw) */}
                                                {printMode === 'fiszki' ? (
                                                    <div className="grid grid-cols-1 gap-3">
                                                        {aiCards.map((c, i) => (
                                                            <div key={i} className="flex bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-inner">
                                                                <div className="w-1/3 bg-slate-800/50 p-4 border-r border-dashed border-slate-600 flex items-center justify-center">
                                                                    <span className="font-black text-fuchsia-400 text-center">{c.term}</span>
                                                                </div>
                                                                <div className="w-2/3 p-4 flex items-center text-sm text-slate-300">
                                                                    {c.def}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                        {aiCards.map((c, i) => (
                                                            <div key={`term-${i}`} className="aspect-square bg-slate-800 border border-slate-600 rounded-xl flex items-center justify-center p-3 text-center shadow-inner">
                                                                <span className="font-black text-white">{c.term}</span>
                                                            </div>
                                                        ))}
                                                        {aiCards.map((c, i) => (
                                                            <div key={`def-${i}`} className="aspect-square bg-slate-900 border border-slate-700 rounded-xl flex items-center justify-center p-4 text-center shadow-inner">
                                                                <span className="text-xs text-slate-300 font-medium leading-relaxed">{c.def}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* ELEMENTY TYLKO DO DRUKU */}
                                        {aiCards.length > 0 && printMode === 'fiszki' && renderFiszkiPrint()}
                                        {aiCards.length > 0 && printMode === 'memory' && renderMemoryPrint()}

                                    </div>
                                </div>
                            </>
                        )}

                        {/* WIDOK BIBLIOTEKI */}
                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out] w-full print-hidden">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Giełda Zestawów</h2>
                                    <p className="text-slate-400">Pobieraj gotowe słowniczki, definicje i zestawy historyczne udostępnione przez innych nauczycieli. Jedno kliknięcie i gotowe do druku jako Fiszki lub gra Memory!</p>
                                </div>
                                
                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                        <div className="text-5xl mb-4">🗂️</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Wygeneruj zestaw fiszek i dodaj go do Giełdy jako pierwszy.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col border-fuchsia-500/30 hover:border-fuchsia-500/60 relative overflow-hidden">
                                                
                                                <div className="flex justify-between items-start mb-3 flex-wrap gap-2 relative z-10">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-amber-500/20 text-amber-400">
                                                        {item.pairsCount} Par (Fiszki / Memory)
                                                    </span>
                                                </div>
                                                
                                                <h3 className="text-lg font-bold text-white mb-4 leading-tight relative z-10">{item.title}</h3>
                                                
                                                <div className="text-xs text-slate-400 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 flex-grow overflow-y-auto custom-scrollbar font-sans text-left space-y-2 relative z-10 max-h-40">
                                                    {item.cards?.slice(0, 3).map((c, i) => (
                                                        <div key={i} className="flex gap-2 border-b border-slate-700/50 pb-2 mb-2 last:border-0 last:mb-0 last:pb-0">
                                                            <strong className="text-white w-1/3 break-words">{c.term}</strong>
                                                            <span className="w-2/3">{c.def}</span>
                                                        </div>
                                                    ))}
                                                    {item.cards?.length > 3 && <div className="text-center text-slate-500 italic mt-2">...i {item.cards.length - 3} więcej</div>}
                                                </div>
                                                
                                                <div className="pt-2 mt-auto relative z-10">
                                                    <button onClick={() => loadSetFromLibrary(item.cards)} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl text-white py-3 transition-colors text-sm font-bold flex items-center justify-center gap-2 btn-bounce shadow-md">
                                                        <Icon name="Cards" size={18} /> Użyj tego zestawu
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduFiszkiApp />);
    </script>


</body></html>
