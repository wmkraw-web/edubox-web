        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-blue-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }

            try {
                fetch('/menu.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Błąd ładowania menu');
                        return response.text();
                    })
                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(error => wstawMenuAwaryjne());
            } catch (error) { wstawMenuAwaryjne(); }
        });

    <!-- GŁÓWNA ZAWARTOŚĆ APLIKACJI -->

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
                import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;
        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                Word: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        // --- KONFIGURACJA AI ---
        const SYSTEM_PROMPT_NVC = `Jesteś ekspertem ds. komunikacji NVC (Porozumienie Bez Przemocy) oraz dyplomacji szkolnej. 
Zadanie: Przekształć surowe, emocjonalne notatki nauczyciela o uczniu w profesjonalną, empatyczną i kulturalną wiadomość do rodzica (np. na e-dziennik Librus/Vulcan).
Zasady:
1. Używaj "metody kanapki" (zacznij od czegoś pozytywnego, przejdź do problemu, zakończ propozycją współpracy).
2. Pisz o faktach, unikaj oceniania i etykietowania ucznia (zamiast "jest leniwy" napisz "obserwuję trudności z zaangażowaniem w zadania").
3. Wyrażaj troskę o ucznia.
4. Zaproponuj konkretny krok (rozmowa telefoniczna, spotkanie, prośba o wsparcie w domu).
5. Zachowaj wysoce profesjonalny, oficjalny, ale ciepły ton.
6. Zwróć tylko i wyłącznie sam gotowy tekst do skopiowania.`;

        const SYSTEM_PROMPT_PPP = `Jesteś wybitnym pedagogiem specjalnym i ekspertem ds. diagnozy psychologiczno-pedagogicznej.
Zadanie: Przekształć potoczne notatki nauczyciela w wysoce sformalizowany fragment opinii o uczniu, przeznaczony dla Poradni Psychologiczno-Pedagogicznej (PPP) lub do IPET/WOPFU.
Zasady:
1. Zmień język potoczny na rygorystyczny, naukowy żargon pedagogiczny.
   - Np. "bije innych" -> "przejawia zachowania agresywne i trudności w regulacji emocji"
   - Np. "nie uważa na lekcji" -> "wykazuje deficyty uwagi, ma trudności z koncentracją i utrzymaniem zadania"
   - Np. "nie potrafi czytać" -> "prezentuje opóźnienia w zakresie dekodowania tekstu i technik czytania"
2. Zachowaj obiektywizm i opisowość. Unikaj stygmatyzacji.
3. Konstruuj zdania złożone, profesjonalne, typowe dla oficjalnych orzeczeń.
4. Zwróć tylko gotowy tekst, podzielony na czytelne akapity. Nie używaj znaczników markdown.`;

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator');

            const requestedMode = new URLSearchParams(window.location.search).get('mode');
            const [activeTab, setActiveTab] = useState(() => ['nvc', 'ppp'].includes(requestedMode) ? requestedMode : 'nvc');
            const [inputText, setInputText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            // --- LOGOWANIE (wspólny silnik) ---
            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edudialog_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateResponse = async () => {
                if (!inputText.trim()) {
                    setError('Proszę wprowadzić notatki o uczniu.');
                    return;
                }

                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setError('');
                setGeneratedText('');

                try {
                    const systemInstruction = activeTab === 'nvc' ? SYSTEM_PROMPT_NVC : SYSTEM_PROMPT_PPP;
                    const finalPrompt = `Przekształć poniższe notatki. PAMIĘTAJ BY ZMIENIĆ PRAWDZIWE IMIĘ/NAZWISKO Z NOTATEK NA INICJAŁ (LUB 'UCZEŃ'), aby zachować anonimowość. Notatki nauczyciela:\n"""\n${inputText}\n"""`;

                    if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("LocalTest");
                    }

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: finalPrompt,
                            system: systemInstruction,
                            temperature: 0.3
                        })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || data.error || `Błąd serwera API: ${response.status}`);

                    let text = data.text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    text = text.replace(/\*\*(.*?)\*\*/g, '$1'); 

                    if (text) {
                        setGeneratedText(text);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setError('Tryb lokalny.');
                        setTimeout(() => {
                            setGeneratedText(`[WERSJA LOKALNA / OFFLINE]\n\nDo aplikacji wpisano:\n"${inputText}"\n\nGdy umieścisz ten plik na serwerze eduboxpro.pl, połączy się on z API i wygeneruje poprawny dokument. Lincznik darmowych użyć został zaktualizowany.`);
                            setIsGenerating(false);
                        }, 800);
                    } else {
                        setError(`Błąd: ${err.message}. Spróbuj ponownie.`);
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Skopiowano do schowka!');
            };

            const exportToWord = (text, type) => {
                const title = type === 'nvc' ? 'Wiadomość do E-dziennika' : 'Fragment Opinii do PPP';
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${title}</title><style>body {font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: #000; text-align: justify;}</style></head><body>`;
                const footer = `<\/body><\/html>`;
                const formattedText = text.split('\n').map(para => `<p>${para}</p>`).join('');
                const blob = new Blob(['\ufeff', header + formattedText + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${title.replace(/\s/g, '_')}.doc`; link.click();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Podaj krótki tytuł, np. 'Wiadomość - Bójka na przerwie'");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edudialog_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            mode: activeTab,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            return (
                <div className="relative flex flex-col min-h-screen">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-blue-600 text-white px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(59,130,246,0.4)] font-bold text-sm animate-toast flex items-center gap-3 border border-blue-400`}>
                            <Icon name="AlertCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-amber-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Bazie Wzorów</h3>
                                <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs font-bold mb-4">
                                    AI wymazało dane z tekstu. Możesz bezpiecznie opublikować go dla innych.
                                </div>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł wzoru</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Brak zadań domowych" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-amber-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10">
                        <div className="max-w-6xl mx-auto">
                            
                            <div className="text-center mb-8 fade-in print-hidden">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Trudne rozmowy, <span className="text-gradient">proste rozwiązania.</span>
                                </h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                    Wyrzuć z siebie frustrację i obserwacje, a AI zamieni je w profesjonalną wiadomość NVC lub formalną opinię.
                                </p>
                            </div>

                            <div className="glass-panel p-4 rounded-2xl border border-slate-700/50 mb-6 flex gap-3 items-start max-w-2xl mx-auto print-hidden">
                                <span className="text-xl flex-shrink-0">ℹ️</span>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed"><strong className="text-white">Jak to działa:</strong> wybierz „E-dziennik (Rodzic)" jeśli chcesz przetłumaczyć nerwowy tekst na spokojną, dyplomatyczną wiadomość do rodzica, albo „Opinia (PPP/IPET)" jeśli masz brudnopis obserwacji, który ma się stać oficjalną opinią z żargonem PPP - wpisz swój tekst i wygeneruj.</p>
                            </div>

                            {/* TOGGLE WIDOKÓW */}
                            <div className="flex justify-center mb-8 print-hidden fade-in">
                                <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg w-full max-w-md">
                                    <button onClick={() => setViewMode('kreator')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 ${viewMode === 'kreator' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Sparkles" size={16} /> Kreator Tekstu
                                    </button>
                                    <button onClick={() => setViewMode('biblioteka')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Library" size={16} /> Baza Wzorów 
                                    </button>
                                </div>
                            </div>

                            {viewMode === 'kreator' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] max-w-4xl mx-auto">
                                    {limitData.showWarning && !isPro && (
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in">
                                            <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                            <p className="text-slate-300 mb-4 text-sm sm:text-base">
                                                Odblokuj nielimitowane generowanie wpisując kod PRO na górnym pasku w menu.
                                            </p>
                                        </div>
                                    )}

                                    <div className="flex flex-col sm:flex-row gap-4 mb-8 fade-in" style={{animationDelay: '0.1s'}}>
                                        <button 
                                            onClick={() => setActiveTab('nvc')}
                                            className={`flex-1 p-6 rounded-3xl border-2 transition-all duration-300 flex items-start gap-4 text-left ${activeTab === 'nvc' ? 'bg-blue-900/20 border-blue-500 shadow-[0_0_30px_rgba(59,130,246,0.15)]' : 'glass-panel border-slate-700/50 hover:border-slate-600 opacity-70'}`}
                                        >
                                            <div className={`p-3 rounded-2xl ${activeTab === 'nvc' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                            </div>
                                            <div>
                                                <h3 className={`font-bold text-lg mb-1 ${activeTab === 'nvc' ? 'text-white' : 'text-slate-300'}`}>E-dziennik (Rodzic)</h3>
                                                <p className="text-sm text-slate-400">Język korzyści, NVC, empatia i współpraca. Idealne do trudnych wiadomości.</p>
                                            </div>
                                        </button>

                                        <button 
                                            onClick={() => setActiveTab('ppp')}
                                            className={`flex-1 p-6 rounded-3xl border-2 transition-all duration-300 flex items-start gap-4 text-left ${activeTab === 'ppp' ? 'bg-purple-900/20 border-purple-500 shadow-[0_0_30px_rgba(168,85,247,0.15)]' : 'glass-panel border-slate-700/50 hover:border-slate-600 opacity-70'}`}
                                        >
                                            <div className={`p-3 rounded-2xl ${activeTab === 'ppp' ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                            </div>
                                            <div>
                                                <h3 className={`font-bold text-lg mb-1 ${activeTab === 'ppp' ? 'text-white' : 'text-slate-300'}`}>Opinia (PPP / IPET)</h3>
                                                <p className="text-sm text-slate-400">Formalny żargon pedagogiczny, diagnoza deficytów, język specjalistyczny.</p>
                                            </div>
                                        </button>
                                    </div>

                                    <div className="glass-panel p-6 sm:p-8 rounded-3xl fade-in" style={{animationDelay: '0.2s'}}>
                                        <label className="block text-white font-bold mb-4 flex items-center justify-between">
                                            <span>Twoje surowe notatki / obserwacje:</span>
                                            <span className={`text-xs px-2 py-1 rounded-md ${inputText.length > 50 ? 'bg-emerald-900/50 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                                                {inputText.length} znaków
                                            </span>
                                        </label>
                                        
                                        <textarea 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder={activeTab === 'nvc' 
                                                ? "Np. Uczeń znowu dzisiaj przeszkadzał na lekcji, ciągle gadał, uderzył kolegę na przerwie. Rodzice muszą coś z tym zrobić, bo ja nie mam siły..."
                                                : "Np. Uczeń nic nie umie z czytania, strasznie wolno sylabizuje, zgaduje wyrazy. Na lekcji się kręci, rysuje po ławce, nie wykonuje moich poleceń."}
                                            className="w-full h-40 bg-slate-900/50 border border-slate-700 text-slate-200 rounded-2xl p-4 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 custom-scrollbar resize-y transition-colors text-sm sm:text-base"
                                        ></textarea>

                                        {error && (
                                            <div className="mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm flex items-start gap-3">
                                                <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                <p>{error}</p>
                                            </div>
                                        )}

                                        <div className="mt-6 flex justify-end">
                                            <button 
                                                onClick={generateResponse}
                                                disabled={isGenerating || !inputText.trim() || (!isPro && limitData.remaining === 0)}
                                                className={`w-full sm:w-auto px-10 py-4 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-lg btn-bounce
                                                    ${isGenerating ? 'bg-slate-700 cursor-wait' : (!isPro && limitData.remaining === 0) ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700' : activeTab === 'nvc' ? 'bg-blue-600 hover:bg-blue-500 hover:shadow-blue-500/25' : 'bg-purple-600 hover:bg-purple-500 hover:shadow-purple-500/25'}
                                                    disabled:opacity-50`}
                                            >
                                                {isGenerating ? (
                                                    <>
                                                        <svg className="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                        </svg>
                                                        Przetwarzanie AI...
                                                    </>
                                                ) : (
                                                    <>
                                                        <Icon name="Sparkles" size={20} />
                                                        Przekształć w {activeTab === 'nvc' ? 'wiadomość' : 'opinię'}
                                                    </>
                                                )}
                                            </button>
                                        </div>
                                    </div>

                                    {generatedText && (
                                        <div ref={resultRef} className={`mt-8 glass-panel p-6 sm:p-8 rounded-3xl fade-in ${activeTab === 'nvc' ? 'border-blue-500/30 shadow-[0_0_30px_rgba(59,130,246,0.1)]' : 'border-purple-500/30 shadow-[0_0_30px_rgba(168,85,247,0.1)]'}`}>
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4 border-b border-slate-700/50 pb-4">
                                                <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                                    <span className="text-emerald-400">
                                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                    </span>
                                                    Gotowy materiał
                                                </h3>
                                                <div className="flex flex-wrap gap-2">
                                                    <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce shadow-md">
                                                        <Icon name="Share" size={16}/> Jako Wzór
                                                    </button>
                                                    <button onClick={() => exportToWord(generatedText, activeTab)} className="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                        <Icon name="Word" size={16}/> Word
                                                    </button>
                                                    <button onClick={() => copyToClipboard(generatedText)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                        <Icon name="Copy" size={16}/> Kopiuj
                                                    </button>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-[#0f172a] p-6 rounded-2xl border border-slate-700/50">
                                                <p className="text-slate-200 whitespace-pre-wrap leading-relaxed text-sm sm:text-base font-serif text-justify">
                                                    {generatedText}
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {viewMode === 'biblioteka' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] w-full">
                                    <div className="text-center max-w-3xl mx-auto mb-10">
                                        <h2 className="text-3xl font-black text-amber-500 mb-2">Baza Trudnych Sytuacji</h2>
                                        <p className="text-slate-400">Zobacz jak inni nauczyciele profesjonalnie poradzili sobie z napisaniem opinii do poradni lub ciężkiej wiadomości do rodziców.</p>
                                    </div>
                                    
                                    {libraryItems.length === 0 ? (
                                        <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                            <div className="text-5xl mb-4">📚</div>
                                            <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                            <p className="text-slate-400">Wygeneruj wiadomość w Kreatorze i opublikuj ją dla innych!</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className={`glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[600px] ${item.mode === 'nvc' ? 'border-blue-500/30 hover:border-blue-500/60' : 'border-purple-500/30 hover:border-purple-500/60'}`}>
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-md ${item.mode === 'nvc' ? 'bg-blue-500/20 text-blue-400' : 'bg-purple-500/20 text-purple-400'}`}>
                                                            {item.mode === 'nvc' ? 'E-dziennik (NVC)' : 'Opinia (PPP)'}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white mb-4 leading-tight">{item.title}</h3>
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar font-serif text-justify">
                                                        {item.content}
                                                    </div>
                                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                        <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                            <Icon name="Copy" size={16} />
                                                        </button>
                                                        <button onClick={() => exportToWord(item.content, item.mode)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                            <Icon name="Word" size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="py-6 border-t border-slate-800/50 text-center text-xs font-bold text-slate-500 uppercase tracking-widest mt-auto">
                        Część systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
