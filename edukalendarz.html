    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDL_mvepNJjMmZYQzifN2cXzoKwCE8jNd0",
            authDomain: "edubox-pro.firebaseapp.com",
            projectId: "edubox-pro",
            storageBucket: "edubox-pro.firebasestorage.app",
            messagingSenderId: "570263845714",
            appId: "1:570263845714:web:0b029211f7af071b66988b"
        };
        const APP_ID = "eduboxpro";

        let app, auth, db;
        try {
            app = initializeApp(FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) { console.warn("Firebase init failed", e); }

        window.EduBoxCore = {
            user: null,
            init: (callback) => {
                if (!auth) return;
                signInAnonymously(auth).catch(e => console.error(e));
                onAuthStateChanged(auth, (user) => {
                    window.EduBoxCore.user = user;
                    if(callback) callback(user);
                });
            },
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!db || !window.EduBoxCore.user) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, {
                    userId: window.EduBoxCore.user.uid,
                    createdAt: serverTimestamp(),
                    type: appType,
                    name: itemName,
                    config: config
                });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

        const parseAIResponse = (aiOutput) => {
            let text = String(aiOutput?.text || aiOutput?.response || aiOutput?.content || aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    return JSON.parse(jsonStr.replace(/,\s*([\]}])/g, '$1'));
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu. Spróbuj ponownie.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON. Nie używaj znaczników markdown.\n\n${systemInstruction}\n\nZADANIE:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.content || data;
                } else {
                    throw new Error(`Błąd API Text`);
                }
            } catch(e) { throw new Error("Brak połączenia z AI. " + e.message); }
        };

                                <i className="ph-bold ph-calendar-star text-white text-2xl"></i>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-6">
                            
                            {!selectedHoliday ? (

                                            <button 
                                                key={m.id} 
                                                onClick={() => setActiveMonth(m.id)}
                                                className={`month-tab py-3 px-2 rounded-xl text-xs font-bold border transition-colors ${activeMonth === m.id ? 'active' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                            >
                                                {m.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-[reveal_0.2s_ease-out]">
                                    <button onClick={() => setSelectedHoliday(null)} className="text-xs font-bold text-slate-500 hover:text-violet-600 flex items-center gap-1 transition-colors">
                                        <i className="ph-bold ph-arrow-left"></i> Powrót do Kalendarza
                                    </button>

                                    <div className="bg-gradient-to-br from-violet-600 to-fuchsia-600 rounded-2xl p-6 text-white text-center shadow-lg relative overflow-hidden">
                                        <i className={`ph-fill ${selectedHoliday.icon} text-6xl opacity-20 absolute -right-4 -bottom-4`}></i>
                                        <p className="text-[10px] font-bold uppercase tracking-widest text-violet-200 mb-1">{selectedHoliday.day} {MONTHS.find(m=>m.id === activeMonth)?.name}</p>
                                        <h2 className="text-2xl font-display font-black leading-tight mb-2 relative z-10">{selectedHoliday.name}</h2>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1"><i className="ph-bold ph-users text-violet-400"></i> Grupa docelowa</label>
                                            <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold text-slate-700 focus:border-violet-500 outline-none shadow-sm cursor-pointer">
                                                <option>Przedszkole (Młodsze)</option>
                                                <option>Przedszkole (Starszaki / Zerówka)</option>
                                                <option>Edukacja Wczesnoszkolna (1-3)</option>
                                                <option>Świetlica Szkolna</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1.5 bg-rose-50 p-3 rounded-xl border border-rose-100">
                                            <label className="text-[10px] font-bold text-rose-600 uppercase tracking-widest flex items-center gap-1"><i className="ph-bold ph-wheelchair"></i> Potrzeby SPE</label>
                                            <select value={speNeeds} onChange={e => setSpeNeeds(e.target.value)} className="w-full bg-white border border-rose-200 rounded-lg p-2.5 text-xs font-semibold text-rose-800 focus:border-rose-400 outline-none cursor-pointer">
                                                <option>Brak (Grupa standardowa)</option>
                                                <option>Wyciszenie (Grupa przebodźcowana / SI)</option>
                                                <option>Spektrum Autyzmu (Więcej przewidywalności)</option>
                                                <option>ADHD (Dużo ruchu i zmian)</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Czas trwania</label>
                                            <select value={timeLimit} onChange={e => setTimeLimit(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700 focus:border-violet-500 outline-none shadow-sm cursor-pointer">
                                                <option>Szybki przerywnik (15 min)</option>
                                                <option>Pełne zajęcia (ok. 45 min)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button onClick={generateLessonPlan} disabled={isGenerating} className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white font-black py-4 rounded-xl shadow-[0_10px_20px_-10px_rgba(139,92,246,0.5)] transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-50 min-h-[70px]">
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-2xl"></i><span className="text-xs">Komponowanie zajęć...</span></>
                                        ) : (
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-magic-wand text-2xl"></i> Twórz Zajęcia (Zero-Prep)</span>
                                        )}
                                    </button>
                                </div>
                            )}

                        </div>

                        <div className="p-4 border-t border-slate-200 bg-slate-50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-violet-600 bg-violet-100 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:border-violet-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-violet-50 to-fuchsia-50 border border-violet-200 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-violet-500"></i>
                                    <div><p className="text-xs font-bold text-violet-900">Wersja PRO MAX</p><p className="text-[9px] text-violet-700">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-0 overflow-hidden app-bg">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 relative">
                            
                            {/* WIDOK: LISTA ŚWIĄT W MIESIĄCU */}
                            {!selectedHoliday && (
                                <div className="max-w-4xl mx-auto animate-[reveal_0.3s_ease-out]">
                                    <div className="flex items-center justify-between mb-8 pb-4 border-b border-slate-300">
                                        <div>
                                            <h2 className="text-3xl font-display font-black text-slate-800">{MONTHS.find(m=>m.id === activeMonth)?.name}</h2>
                                            <p className="text-sm font-medium text-slate-500 mt-1">Najciekawsze święta nietypowe w tym miesiącu</p>
                                        </div>
                                        <i className="ph-fill ph-calendar text-4xl text-slate-300"></i>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        {HOLIDAYS[activeMonth]?.map((h, i) => (
                                            <div key={i} onClick={() => handleHolidaySelect(h)} className="bg-white border border-slate-200 hover:border-violet-400 rounded-2xl p-5 shadow-sm hover:shadow-lg transition-all cursor-pointer group flex items-center gap-5">
                                                <div className="w-16 h-16 rounded-2xl bg-violet-50 text-violet-600 flex flex-col items-center justify-center shrink-0 border border-violet-100 group-hover:scale-105 transition-transform">
                                                    <span className="text-[10px] font-black uppercase mb-[-4px]">Dzień</span>
                                                    <span className="text-2xl font-display font-black">{h.day}</span>
                                                </div>
                                                <div className="flex-1">
                                                    <h3 className="text-lg font-black text-slate-800 group-hover:text-violet-600 transition-colors leading-tight mb-1">{h.name}</h3>
                                                    <p className="text-xs text-slate-500 leading-snug">{h.desc}</p>
                                                </div>
                                                <i className="ph-bold ph-caret-right text-slate-300 group-hover:text-violet-500 text-xl"></i>
                                            </div>
                                        ))}
                                    </div>
                                    {(!HOLIDAYS[activeMonth] || HOLIDAYS[activeMonth].length === 0) && (
                                        <div className="text-center py-20 text-slate-400">
                                            <i className="ph-fill ph-coffee text-5xl mb-4"></i>
                                            <p>W tym miesiącu EduKalendarz proponuje przerwę!</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* WIDOK: ŁADOWANIE */}
                            {isGenerating && (
                                <div className="h-full flex flex-col items-center justify-center max-w-md mx-auto text-center">
                                    <div className="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center mb-6 animate-pulse">
                                        <i className="ph-fill ph-sparkle text-5xl text-violet-500"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-800 mb-2 font-display">Magia w toku...</h2>
                                    <p className="text-violet-600 font-medium text-sm animate-pulse">Projektujemy wciągające zabawy na {selectedHoliday.name} bez kserowania i wycinania!</p>
                                </div>
                            )}

                            {/* WIDOK: WYNIK (SCENARIUSZ + EKOSYSTEM) */}
                            {resultData && !isGenerating && (
                                <div className="max-w-3xl mx-auto pb-20 animate-[reveal_0.4s_ease-out]">
                                    
                                    {/* Górny panel scenariusza */}
                                    <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden mb-8 print-break-inside-avoid">
                                        <div className="bg-slate-900 text-white p-8 relative overflow-hidden">
                                            <div className="absolute top-[-50px] right-[-50px] w-48 h-48 bg-violet-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                                            <div className="relative z-10">
                                                <div className="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[10px] font-black tracking-widest uppercase mb-3">Scenariusz EduBox Zero-Prep</div>
                                                <h1 className="text-4xl font-display font-black leading-tight mb-2">{selectedHoliday.name}</h1>
                                                <div className="flex gap-4 text-sm font-medium text-slate-300">
                                                    <span><i className="ph-fill ph-users"></i> {ageGroup}</span>
                                                    <span><i className="ph-fill ph-clock"></i> {timeLimit}</span>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="p-8 space-y-8">
                                            {/* Wstęp */}
                                            <div>
                                                <h3 className="text-xs font-black text-violet-600 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-fill ph-microphone-stage text-lg"></i> Wstęp i Zaciekawienie</h3>
                                                <p className="text-slate-700 leading-relaxed font-medium bg-slate-50 p-5 rounded-2xl border border-slate-100">{resultData.intro}</p>
                                            </div>

                                            {/* Zabawy */}
                                            <div>
                                                <h3 className="text-xs font-black text-emerald-600 uppercase tracking-widest mb-4 flex items-center gap-2"><i className="ph-fill ph-game-controller text-lg"></i> Zabawy i Aktywności</h3>
                                                <div className="space-y-4">
                                                    {resultData.activities.map((act, i) => (
                                                        <div key={i} className="flex gap-4 items-start">
                                                            <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-black shrink-0 mt-1">{i+1}</div>
                                                            <div>
                                                                <h4 className="font-bold text-slate-800 mb-1">{act.name}</h4>
                                                                <p className="text-sm text-slate-600 leading-relaxed">{act.desc}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Plastyka */}
                                            <div>
                                                <h3 className="text-xs font-black text-amber-500 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-fill ph-palette text-lg"></i> Praca Plastyczna (Z tego co jest)</h3>
                                                <p className="text-slate-700 leading-relaxed text-sm bg-amber-50 p-4 rounded-xl border border-amber-100">{resultData.art}</p>
                                            </div>

                                            {/* Podsumowanie */}
                                            <div>
                                                <h3 className="text-xs font-black text-blue-500 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-fill ph-flag-checkered text-lg"></i> Ewaluacja</h3>
                                                <p className="text-slate-700 leading-relaxed text-sm border-l-4 border-blue-400 pl-4">{resultData.summary}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* MAGIA INTEGRACJI EDUBOX: Panel Rekomendacji! */}
                                    <div className="no-print">
                                        <div className="text-center mb-6 mt-12">
                                            <h3 className="text-xl font-display font-black text-slate-800">Uzupełnij zajęcia z ekosystemem EduBox!</h3>
                                            <p className="text-sm text-slate-500">Użyj innych aplikacji, aby w 2 minuty stworzyć dodatkowe materiały na <strong>{selectedHoliday.name}</strong>.</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {/* Rekomendacja 1: Dyplomy */}
                                            <a href="edudyplomy.html" target="_blank" className="bg-white border border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-rose-400 hover:shadow-md transition-all group">
                                                <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center text-2xl group-hover:bg-rose-500 group-hover:text-white transition-colors"><i className="ph-fill ph-medal"></i></div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-slate-800 text-sm mb-0.5">EduDyplomy AI</h4>
                                                    <p className="text-xs text-slate-500">Wygeneruj śmieszne, rymowane dyplomy dla klasy za udział w {selectedHoliday.name}.</p>
                                                </div>
                                            </a>

                                            {/* Rekomendacja 2: MagicLetters */}
                                            <a href="magicletters.html" target="_blank" className="bg-white border border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-purple-400 hover:shadow-md transition-all group">
                                                <div className="w-12 h-12 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center text-2xl group-hover:bg-purple-500 group-hover:text-white transition-colors"><i className="ph-fill ph-text-aa"></i></div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-slate-800 text-sm mb-0.5">MagicLetters PRO</h4>
                                                    <p className="text-xs text-slate-500">Stwórz piękną, kolorową girlandę z napisem na tablicę korkową.</p>
                                                </div>
                                            </a>

                                            {/* Rekomendacja 3: Prezentacje */}
                                            <a href="eduprezentacja.html" target="_blank" className="bg-white border border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-blue-400 hover:shadow-md transition-all group">
                                                <div className="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-2xl group-hover:bg-blue-500 group-hover:text-white transition-colors"><i className="ph-fill ph-projector-screen-chart"></i></div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-slate-800 text-sm mb-0.5">EduPrezentacja</h4>
                                                    <p className="text-xs text-slate-500">Wygeneruj gotowy pokaz slajdów na ekran interaktywny o dzisiejszym święcie.</p>
                                                </div>
                                            </a>

                                            {/* Rekomendacja 4: Fiszki / Dobble */}
                                            <a href="edubystrzak.html" target="_blank" className="bg-white border border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-amber-400 hover:shadow-md transition-all group">
                                                <div className="w-12 h-12 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-2xl group-hover:bg-amber-500 group-hover:text-white transition-colors"><i className="ph-fill ph-lightning"></i></div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-slate-800 text-sm mb-0.5">EduBystrzak (Dobble)</h4>
                                                    <p className="text-xs text-slate-500">Stwórz z AI tematyczne karty do gry na spostrzegawczość.</p>
                                                </div>
                                            </a>
                                        </div>

                                        <div className="mt-8 text-center flex flex-wrap justify-center gap-3">
                                            <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all inline-flex items-center gap-2">
                                                <i className="ph-bold ph-printer text-xl"></i> Wydrukuj ten scenariusz
                                            </button>
                                            <button onClick={() => setShowPublishModal(true)} className="bg-white border border-purple-300 text-purple-600 font-bold py-3 px-8 rounded-xl shadow-lg transition-all inline-flex items-center gap-2">
                                                <i className="ph-bold ph-share-network text-xl"></i> Udostępnij w Bibliotece
                                            </button>
                                        </div>
                                    </div>
                                    
                                </div>
                            )}

                        </div>
                    </main>

                    {/* PRZYCISK BIBLIOTEKI */}
                    <button onClick={() => setViewMode('biblioteka')} className="no-print fixed bottom-6 left-6 z-40 bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_0_25px_rgba(168,85,247,0.6)] flex items-center gap-2 hover:scale-105 transition-all animate-pulse">
                        <i className="ph-bold ph-books"></i> Biblioteka Wzorów
                    </button>

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="no-print fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm">
                            <div className="bg-white border border-purple-300 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800">✕</button>
                                <h3 className="text-2xl font-black text-purple-600 mb-2 flex items-center gap-2"><i className="ph-bold ph-share-network"></i> Udostępnij plan</h3>
                                <div className="bg-red-50 border border-red-200 text-red-600 p-3 rounded-lg text-xs font-bold mb-4">
                                    ⚠️ Upewnij się, że plan nie zawiera prawdziwych imion uczniów, zanim go opublikujesz!
                                </div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">Krótki tytuł</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Plan na Dzień Kota" className="w-full bg-slate-100 border border-slate-300 text-slate-800 rounded-xl p-3 mb-6 focus:outline-none focus:border-purple-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* NAKŁADKA BIBLIOTEKI */}
                    {viewMode === 'biblioteka' && (
                        <div className="no-print fixed inset-0 z-[140] bg-slate-950/95 backdrop-blur-sm overflow-y-auto">
                            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10">
                                <div className="flex items-center justify-between mb-8">
                                    <h2 className="text-3xl font-black text-white">Biblioteka Wzorów Kalendarzowych</h2>
                                    <button onClick={() => setViewMode('generator')} className="text-slate-400 hover:text-white flex items-center gap-2 text-sm font-bold">
                                        <i className="ph-bold ph-x text-xl"></i> Zamknij
                                    </button>
                                </div>
                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <i className="ph-duotone ph-books text-6xl mb-4 text-slate-400"></i>
                                        <h3 className="text-xl font-bold text-white mb-2">Biblioteka jest jeszcze pusta...</h3>
                                        <p className="text-slate-400">Wygeneruj plan i opublikuj go jako pierwszy!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border border-purple-500/20 hover:border-purple-500/50 transition-all shadow-lg flex flex-col">
                                                <h3 className="text-lg font-bold text-white mb-4">{item.name}</h3>
                                                <button onClick={() => loadFromLibrary(item)} className="mt-auto bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm">
                                                    <i className="ph-bold ph-download-simple"></i> Wczytaj plan
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
