    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        let FIREBASE_CONFIG;
        try { FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", authDomain: "mock", projectId: "mock", appId: "1:123" }; } catch(e) { FIREBASE_CONFIG = {}; }
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "eduboxpro";
        
        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: async (onUserLoad) => {
                if (!isInitialized) {
                    try {
                        app = initializeApp(FIREBASE_CONFIG);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                        isInitialized = true;
                        window.EduBoxCore.loadMenu();
                    } catch(e) { console.warn("Firebase init error", e); }
                }
                if (auth) onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                else if(onUserLoad) onUserLoad({ uid: 'mock-user-123' });
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) container.innerHTML = `<div class="bg-cyan-600 text-white text-xs text-center py-1 font-bold print-hidden">EduBox V3 PRO MAX - System Core Loaded</div>`;
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na pasku bocznym!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser && !db) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                const payload = { userId: currentUser?.uid || 'anonymous', createdAt: serverTimestamp(), type: appType, name: itemName, config: config };
                if (JSON.stringify(payload).length > 950000) throw new Error("🚨 Użyta grafika jest za duża by zapisać ją w chmurze (Max ~1MB)!");
                await addDoc(publicRef, payload);
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [topic, setTopic] = useState('');
            const [audience, setAudience] = useState('przedszkole'); 
            const [contentType, setContentType] = useState('wierszyk'); 
            const [mood, setMood] = useState('zabawny'); 
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [generationStep, setGenerationStep] = useState(null); 
            const [generatedData, setGeneratedData] = useState(null);
            const [botMessage, setBotMessage] = useState("Cześć! O czym napiszemy dzisiaj? Podaj mi temat, a ja ułożę rytmiczną rymowankę i narysuję do niej piękną, kolorową ilustrację!");

            // === STUDIO NAGRANIOWE (AUDIO AI & FALLBACK) ===
            const [audioUrl, setAudioUrl] = useState(null);
            const [isAudioGenerating, setIsAudioGenerating] = useState(false);
            const [isPlayingTTS, setIsPlayingTTS] = useState(false); // Do natywnego lektora

            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'edutik_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                };
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS ===
            const parseAIResponse = (rawText) => {
                try {
                    let jsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = jsonStr.indexOf('{');
                    const endIdx = jsonStr.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) {
                        jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                    }
                    // Pancerna ochrona: Usuwamy WSZYSTKIE surowe znaki kontrolne (w tym twarde entery), które psują JSON
                    jsonStr = jsonStr.replace(/[\u0000-\u001F]+/g, ' ');
                    return JSON.parse(jsonStr);
                } catch (err) {
                    console.error("JSON Parse Error. Surowy tekst:", rawText);
                    throw new Error("Model AI zwrócił uszkodzony tekst.");
                }
            };

            const fetchRhymeText = async (userPrompt, systemInstruction) => {
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: userPrompt, 
                            system: systemInstruction,
                            temperature: 0.6, // Mniejsza temperatura gwarantuje lepsze trzymanie rymów i formatu
                            format: "json",
                            model: "gpt-4o-mini"
                        })
                    });
                    
                    if (!res.ok) throw new Error(`Serwer główny: ${res.status}`);
                    const data = await res.json();
                    return parseAIResponse(data.text);
                } catch (e) {
                    console.warn("Przełączam na model awaryjny:", e.message);
                    let attempt = 0;
                    let lastError = e.message;
                    while (attempt < 3) {
                        try {
                            const apiKey = ""; 
                            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                            const res = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: userPrompt }] }],
                                    systemInstruction: { parts: [{ text: systemInstruction }] }
                                })
                            });
                            
                            if (!res.ok) {
                                const errText = await res.text();
                                throw new Error(`HTTP ${res.status}: ${errText.substring(0, 60)}...`);
                            }
                            
                            const data = await res.json();
                            return parseAIResponse(data.candidates[0].content.parts[0].text);
                        } catch (err) {
                            lastError = err.message;
                            attempt++;
                            if (attempt >= 3) throw new Error(`Błąd AI: ${lastError}`);
                            await new Promise(r => setTimeout(r, 1000 * attempt));
                        }
                    }
                }
            };

            const secureApiImageCall = async (payloadData) => {
                try {
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadData) 
                    });
                    if (res.ok) return await res.json();
                    throw new Error(`Status API: ${res.status}`);
                } catch (e) {
                    console.warn("Przełączam na model awaryjny obrazu (Canvas):", e.message);
                    let attempt = 0;
                    let lastError = e.message;
                    while(attempt < 3) {
                        try {
                            const apiKey = ""; 
                            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                            const fallbackRes = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: { prompt: payloadData.prompt },
                                    parameters: { sampleCount: 1 } 
                                })
                            });
                            
                            if (!fallbackRes.ok) throw new Error(`HTTP ${fallbackRes.status}`);
                            return await fallbackRes.json();
                        } catch(err) {
                            lastError = err.message;
                            attempt++;
                            if (attempt >= 3) throw new Error(`Błąd obrazu: ${lastError}`);
                            await new Promise(r => setTimeout(r, 1000 * attempt));
                        }
                    }
                }
            };

            // === LOGIC ===
            const generateContent = () => {
                if (!topic.trim()) { showToast('Wpisz najpierw temat!', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedData(null);
                        setAudioUrl(null); 
                        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                        setIsPlayingTTS(false);
                        
                        try {
                            setGenerationStep('text');
                            setBotMessage("Piszę rymowankę. Składam dokładne, piękne rymy...");
                            
                            const formatDesc = contentType === 'wierszyk' ? 'Wierszyk' : (contentType === 'piosenka' ? 'Tekst piosenki z podziałem na Zwrotki i Refren' : 'Krótka, rytmiczna wyliczanka (jak do zabawy w chowanego)');
                            const moodDesc = mood === 'zabawny' ? 'śmieszny, wesoły, wywołujący uśmiech' : (mood === 'spokojny' ? 'wyciszający, kojący, idealny do zasypiania' : 'edukacyjny, uczący ważnych wartości lub wiedzy');
                            const audienceDesc = audience === 'maluchy' ? 'najmłodszych dzieci (2-3 lata), bardzo proste słowa, onomatopeje' : (audience === 'przedszkole' ? 'przedszkolaków (4-6 lat)' : 'dzieci szkolnych (7-9 lat), bogatsze słownictwo');

                            // RYGORYSTYCZNY PROMPT WYMUSZAJĄCY RYMY I RYTMIKĘ
                            const sysPrompt = `Jesteś najwybitniejszym polskim autorem wierszy dla dzieci (jak Jan Brzechwa). 
Twoim ABSOLUTNYM priorytetem jest RYTMIKA i DOKŁADNE RYMY.
ZASADY KRYTYCZNE:
1. Każdy wers w strofie MUSI mieć zbliżoną liczbę sylab, aby czytało się to śpiewająco.
2. Wiersz MUSI posiadać DOKŁADNE POLSKIE RYMY na końcach wersów (np. kotek/płotek, rano/kolano). Układ AABB lub ABAB.
3. Kategoryczny zakaz pisania wierszy białych (bez rymów)!
ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON o strukturze:
{
  "title": "Kreatywny tytuł",
  "content": "Treść wiersza. Używaj WYŁĄCZNIE znacznika <br/> do oznaczania nowych linii (żadnych prawdziwych enterów w stringu!). Używaj <strong> do zaznaczania np. [Refren].",
  "imagePrompt": "A highly concise, purely visual English description (max 15 words) of the main subject of this poem. E.g. 'a cute little red dog playing with a ball'. No text."
}`;
                            const usrPrompt = `Napisz utwór na temat: "${topic}".\nFormat: ${formatDesc}.\nOdbiorca: dla ${audienceDesc}.\nNastrój: ${moodDesc}.\nPamiętaj: RÓWNE SYLABY i IDEALNE RYMY!`;

                            const textData = await fetchRhymeText(usrPrompt, sysPrompt);

                            setGenerationStep('image');
                            setBotMessage("Rymowanka gotowa! Teraz maluję do niej przepiękną, kolorową ilustrację...");
                            
                            const safeImagePrompt = (textData.imagePrompt || '').replace(/['"\n]/g, ' ').trim();
                            const hiddenInstruction = `A beautiful, highly detailed 3D Pixar style children's book illustration. MAIN SUBJECT: ${safeImagePrompt}. Cozy, warm, cheerful environment. Single unified scene. CRITICAL RULE: ABSOLUTELY NO TEXT, NO LETTERS, NO WORDS anywhere on the image. Perfect masterpiece.`;
                            
                            const payload = {
                                prompt: hiddenInstruction, 
                                negative_prompt: "text, letters, words, spelling, writing, typography, watermark, creepy, scary, deformed", 
                                style_preset: "3d-model",
                                aspect_ratio: '1:1',
                                width: 1024,
                                height: 1024
                            };

                            const imgData = await secureApiImageCall(payload);
                            const base64Image = imgData.predictions?.[0]?.bytesBase64Encoded || imgData.artifacts?.[0]?.base64 || imgData.image || imgData.imageUrl || imgData.image_url || imgData.url; 
                            
                            let finalImage = null;
                            if (base64Image) finalImage = base64Image.startsWith('http') || base64Image.startsWith('data:image') ? base64Image : `data:image/png;base64,${base64Image}`;

                            setGeneratedData({ title: textData.title, content: textData.content, image: finalImage });
                            setBotMessage("Tadaam! Masz przed sobą rymowankę z piękną grafiką. Możesz ją wydrukować lub kazać mi przeczytać na głos!");

                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                        } catch (error) {
                            console.error("Szczegóły błędu:", error); 
                            showToast(`Błąd: ${error.message.substring(0, 80)}`, 'error');
                            setBotMessage(`Napotkałem problem. Szczegóły: ${error.message}`);
                        } finally { 
                            setIsGenerating(false); 
                            setGenerationStep(null);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedData) return;
                setIsSavingToGielda(true);
                try {
                    let safeData = { ...generatedData };
                    if (safeData.image && safeData.image.length > 800000) {
                        safeData.image = null; 
                    }

                    const configToSave = { topic, audience, contentType, mood, generatedData: safeData };
                    const shortName = topic.substring(0, 30) || generatedData.title.substring(0, 30);
                    
                    await window.EduBoxCore.saveToGielda('edutik_market', 'EduTik', shortName, configToSave);
                    showToast("Opublikowano na Giełdzie! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setTopic(item.config.topic || '');
                setAudience(item.config.audience || 'przedszkole');
                setContentType(item.config.contentType || 'wierszyk');
                setMood(item.config.mood || 'zabawny');
                setGeneratedData(item.config.generatedData);
                setAudioUrl(null); 
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                setIsPlayingTTS(false);
                setAppMode('generator');
                showToast("Wczytano z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            // === TEXT TO SPEECH (AUDIO AI + ROBUST FALLBACK) ===
            const pcmToWav = (base64Pcm, sampleRate) => {
                const binaryString = atob(base64Pcm);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const pcmData = new Int16Array(bytes.buffer);
                
                const numChannels = 1;
                const byteRate = sampleRate * numChannels * 2;
                const blockAlign = numChannels * 2;
                const wavHeader = new ArrayBuffer(44);
                const view = new DataView(wavHeader);
                
                const writeString = (view, offset, string) => {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                };
                
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + pcmData.length * 2, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true); 
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, byteRate, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, 16, true); 
                writeString(view, 36, 'data');
                view.setUint32(40, pcmData.length * 2, true);
                
                const wavBlob = new Blob([wavHeader, pcmData], { type: 'audio/wav' });
                return URL.createObjectURL(wavBlob);
            };

            const generateAudio = async () => {
                if (!generatedData || !generatedData.content) return;
                setIsAudioGenerating(true);
                
                const cleanText = generatedData.content.replace(/<br\s*\/?>/gi, '. ').replace(/<[^>]*>?/gm, '').replace(/\[.*?\]/g, ''); 
                
                try {
                    // Próba użycia potężnego modelu Gemini TTS - środowisko podglądu automatycznie dostarczy tu klucz w tle!
                    const apiKey = ""; 
                    const moodPrefix = mood === 'zabawny' ? 'Przeczytaj to radośnie, wesoło i bardzo rytmicznie po polsku: ' : (mood === 'spokojny' ? 'Przeczytaj to cichym, spokojnym i kojącym szeptem po polsku: ' : 'Przeczytaj to wyraźnie i dynamicznie po polsku: ');
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: moodPrefix + cleanText.substring(0, 1500) }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                        }
                    };

                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error("API odrzuciło zapytanie.");
                    
                    const data = await res.json();
                    const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    const mimeType = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.mimeType || "audio/pcm;rate=24000";
                    
                    if (pcmBase64) {
                        let sampleRate = 24000;
                        const match = mimeType.match(/rate=(\d+)/);
                        if (match) sampleRate = parseInt(match[1]);
                        
                        const wavUrl = pcmToWav(pcmBase64, sampleRate);
                        setAudioUrl(wavUrl);
                        showToast("🎧 Nagranie gotowe! Możesz odtworzyć.");
                        setIsAudioGenerating(false);
                        return;
                    }
                    throw new Error("Brak danych audio");
                } catch (e) {
                    console.warn("Używam natywnego lektora przeglądarki (Web Speech API):", e.message);
                    // PANCERNY FALLBACK: Używamy darmowego lektora zbudowanego w każdą przeglądarkę.
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel(); 
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'pl-PL';
                        utterance.rate = 0.9; // Odrobinę wolniej dla rytmiki dziecięcej
                        utterance.pitch = mood === 'zabawny' ? 1.2 : (mood === 'spokojny' ? 0.8 : 1.0);
                        
                        utterance.onend = () => setIsPlayingTTS(false);
                        utterance.onerror = () => setIsPlayingTTS(false);
                        
                        window.speechSynthesis.speak(utterance);
                        setIsPlayingTTS(true);
                        showToast("🎧 Lektor odczytuje utwór.");
                    } else {
                        showToast("Twoja przeglądarka nie obsługuje czytania głosem.", "error");
                    }
                    setIsAudioGenerating(false);
                }
            };

            const stopBrowserTTS = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setIsPlayingTTS(false);
                }
            };

            const exportToWord = () => {
                if(!generatedData) return;
                const content = document.getElementById('document-render-area').innerHTML;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${generatedData.title}</title><style>body { font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 16pt; line-height: 1.6; color: #000; text-align: center; } h1 { font-size: 24pt; color: #db2777; margin-bottom: 20px; } img { max-width: 80%; height: auto; border-radius: 15px; margin-bottom: 20px; }</style></head><body>`;
                const footer = `</body></html>`;
                const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `EduTik_${Date.now()}.doc`; link.click();
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-cyan-500 to-rose-500 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                            <i className="ph-bold ph-music-notes text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-cyan-400">Tik</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-cyan-600/20 text-cyan-400 border border-cyan-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-microphone-stage text-lg"></i> Studio Muzyczne
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-rose-600/20 text-rose-400 border border-rose-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-playlist text-lg"></i> Giełda Hitów
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-cyan-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-cyan-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-cyan-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // GIEŁDA WIDOK
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Hitów</h2>
                            <p className="text-slate-400 mb-8">Eksploruj wierszyki, piosenki i wyliczanki stworzone przez społeczność Nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-cyan-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="p-3 rounded-xl bg-cyan-500/20 text-cyan-400 group-hover:scale-110 transition-transform">
                                                <i className="ph-fill ph-music-note text-2xl"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">{item.name}</h3>
                                        <div className="flex gap-2 text-[10px] text-slate-400 mb-4 flex-wrap">
                                            <span className="bg-slate-800 px-2 py-1 rounded capitalize">{item.config.contentType}</span>
                                            <span className="bg-slate-800 px-2 py-1 rounded capitalize">{item.config.audience}</span>
                                            <span className="bg-slate-800 px-2 py-1 rounded capitalize">{item.config.mood}</span>
                                        </div>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-cyan-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Wczytaj Utwór
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych rymowanek w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // GŁÓWNY WIDOK
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>
                    <div className="aura-blob aura-3 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-cyan-500/20 shadow-[0_0_50px_rgba(6,182,212,0.2)]">
                                <i className="ph-bold ph-spinner-gap animate-spin text-5xl text-cyan-500"></i>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Praca Twórcza...</h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-16 md:pl-80 pb-16 px-4 sm:px-6 print:p-0 print:overflow-visible relative z-10">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 print:block">
                            
                            {/* LEWA KOLUMNA: KONFIGURATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="text-left mb-8 fade-in">
                                    <div className="inline-flex items-center gap-2 bg-cyan-900/30 border border-cyan-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-cyan-400 uppercase tracking-widest mb-4">
                                        Edukacyjne Wierszyki
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Wierszyki i <br/><span className="text-gradient">Piosenki AI.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Wpisz temat, a sztuczna inteligencja stworzy piękny, w pełni rymujący się wierszyk oraz wygeneruje do niego ilustrację.
                                    </p>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] border border-slate-700/50 fade-in" style={{animationDelay: '0.1s'}}>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Rodzaj utworu</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {['wierszyk', 'piosenka', 'wyliczanka'].map(type => (
                                                    <button key={type} onClick={() => setContentType(type)} className={`py-3 px-1 rounded-xl text-xs font-bold border-2 transition-all capitalize ${contentType === type ? 'bg-cyan-600/20 border-cyan-500 text-cyan-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                        {type}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Dla kogo (Wiek)</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {['maluchy', 'przedszkole', 'szkolne'].map(age => (
                                                    <button key={age} onClick={() => setAudience(age)} className={`py-3 px-1 rounded-xl text-xs font-bold border-2 transition-all capitalize ${audience === age ? 'bg-rose-600/20 border-rose-500 text-rose-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                        {age}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Nastrój / Cel</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {['zabawny', 'spokojny', 'edukacyjny'].map(m => (
                                                    <button key={m} onClick={() => setMood(m)} className={`py-3 px-1 rounded-xl text-xs font-bold border-2 transition-all capitalize ${mood === m ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                        {m}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest block mb-2"><i className="ph-bold ph-pencil-simple text-sm"></i> O czym ma być utwór?</label>
                                            <textarea 
                                                value={topic} 
                                                onChange={e=>setTopic(e.target.value)} 
                                                placeholder="np. O tym, jak ważne jest mycie zębów przed snem..." 
                                                className="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-cyan-500 h-28 resize-y custom-scrollbar transition-colors" 
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={generateContent} 
                                        disabled={isGenerating || !topic.trim()} 
                                        className={`w-full mt-6 text-white py-5 rounded-xl font-black text-sm tracking-widest shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95 uppercase disabled:opacity-50 btn-bounce ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-cyan-600 to-rose-500 hover:from-cyan-500 hover:to-rose-400'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> {generationStep === 'text' ? 'Pisanie tekstu (1/2)...' : generationStep === 'image' ? 'Malowanie grafiki (2/2)...' : 'Opracowywanie...'}</>
                                        ) : (
                                            <><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Utwór</>
                                        )}
                                    </button>
                                </div>

                                <div className="p-5 rounded-3xl shadow-lg border flex items-start gap-4 bg-slate-800/50 border-slate-700">
                                    <div className="w-12 h-12 bg-cyan-500 rounded-2xl flex items-center justify-center shrink-0 shadow-lg"><i className="ph-fill ph-robot text-white text-2xl"></i></div>
                                    <div className="flex-1 pt-1">
                                        <h4 className="font-black text-xs uppercase tracking-widest mb-1.5 text-cyan-400">EduBot Twórca</h4>
                                        <p className="text-sm font-medium leading-relaxed text-slate-300">{botMessage}</p>
                                    </div>
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA: WYNIK (KARTKA) */}
                            <div className="lg:col-span-7 flex justify-center items-start overflow-x-auto pb-10 print:block print:overflow-visible">
                                {!generatedData ? (
                                    <div className="glass-panel w-full max-w-[210mm] min-h-[297mm] p-8 rounded-[2rem] flex flex-col items-center justify-center text-center space-y-6 print-hidden border-2 border-dashed border-slate-700/50 opacity-50">
                                        <div className="p-6 bg-slate-800/50 rounded-full border border-slate-700"><i className="ph-thin ph-music-notes text-6xl text-slate-500"></i></div>
                                        <div>
                                            <h2 className="text-xl font-bold mb-3 text-slate-400">Twój Utwór</h2>
                                            <p className="max-w-sm mx-auto text-slate-500 leading-relaxed text-sm">Zdefiniuj opcje w panelu bocznym. Sztuczna inteligencja wygeneruje piękną, gotową do druku kartę z wierszykiem i odpowiednim obrazkiem.</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="w-full max-w-[210mm] print:max-w-full relative fade-in">
                                        <div className="flex justify-end gap-3 mb-6 print-hidden bg-slate-900/50 p-2 rounded-2xl border border-slate-800 backdrop-blur-md sticky top-24 z-20">
                                            <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                                <i className="ph-bold ph-globe text-lg"></i> Na Giełdę
                                            </button>
                                            <button onClick={exportToWord} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm shadow-lg btn-bounce"><i className="ph-bold ph-file-doc text-lg"></i> .DOCX</button>
                                            <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm btn-bounce"><i className="ph-bold ph-printer text-lg"></i> Wydruk</button>
                                        </div>

                                        <div id="print-container" className="bg-white shadow-2xl p-10 md:p-14 rounded-[2rem] min-h-[297mm] text-slate-900 border-4 border-cyan-100 print:border-none print:shadow-none print:rounded-none">
                                            <div id="document-render-area" className="poem-font">
                                                <h1 className="text-3xl md:text-4xl font-black text-center mb-8 text-rose-600">{generatedData.title}</h1>
                                                
                                                {generatedData.image && (
                                                    <div className="w-full mb-10 flex justify-center page-break-inside-avoid">
                                                        <img src={generatedData.image} className="w-full max-w-sm rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.15)] border-4 border-white object-cover aspect-square" alt="Ilustracja do utworu" />
                                                    </div>
                                                )}

                                                <div 
                                                    className="text-lg md:text-xl text-slate-800 text-center leading-loose tracking-wide" 
                                                    dangerouslySetInnerHTML={{ __html: generatedData.content }} 
                                                />
                                            </div>
                                            
                                            {/* Zintegrowany odtwarzacz Audio (Natywny + API) */}
                                            {audioUrl && (
                                                <div className="mt-10 flex justify-center print-hidden fade-in">
                                                    <audio controls src={audioUrl} className="w-full max-w-sm rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.15)] border-2 border-cyan-200" />
                                                </div>
                                            )}
                                            
                                            {isPlayingTTS && (
                                                <div className="mt-10 flex justify-center print-hidden fade-in">
                                                    <button onClick={stopBrowserTTS} className="flex items-center justify-center gap-3 bg-red-600 hover:bg-red-500 text-white px-8 py-4 rounded-xl font-black shadow-lg btn-bounce text-sm uppercase tracking-widest transition-all">
                                                        <i className="ph-bold ph-stop-circle text-2xl"></i> Zatrzymaj Lektora
                                                    </button>
                                                </div>
                                            )}

                                            {!audioUrl && !isAudioGenerating && !isPlayingTTS && (
                                                <div className="mt-10 flex justify-center print-hidden">
                                                    <button onClick={generateAudio} className="flex items-center justify-center gap-3 bg-gradient-to-r from-purple-600 to-fuchsia-500 hover:from-purple-500 hover:to-fuchsia-400 text-white px-8 py-4 rounded-xl font-black shadow-lg btn-bounce text-sm uppercase tracking-widest transition-all">
                                                        <i className="ph-bold ph-speaker-high text-2xl"></i> Przeczytaj Głosowo
                                                    </button>
                                                </div>
                                            )}
                                            
                                            {isAudioGenerating && (
                                                <div className="mt-10 flex items-center justify-center gap-3 text-fuchsia-500 font-bold print-hidden">
                                                    <i className="ph-bold ph-spinner animate-spin text-3xl"></i> Uruchamiam lektora...
                                                </div>
                                            )}

                                            <div className="mt-12 text-center text-xs font-bold text-slate-400 print-hidden border-t border-slate-200 pt-4 font-sans">
                                                Wygenerowano w EduTik AI. Wydrukuj tę kartę i zawieś w sali lub wklej do śpiewnika!
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
