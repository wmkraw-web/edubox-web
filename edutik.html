<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTIK PRO - Asystent Nowoczesnej Lekcji</title>
    
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Ikony Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .glass-nav { 
            background: rgba(2, 6, 23, 0.8); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }

        .hero-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(2, 6, 23, 0) 60%);
            z-index: -1;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #d946ef; /* fuchsia-500 */
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Animacja wejścia karty */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";
        const apiKey = ""; // API KEY injectowane w środowisku produkcyjnym

        // ==========================================
        // BAZA DANYCH - NARZĘDZIA I PROMPTY DLA AI
        // ==========================================
        const TOOLS_DB = [
            { 
                id: 't1', phase: 'rozgrzewka', tool: 'Mentimeter', name: 'Interaktywna Chmura Wyrazów', 
                icon: 'ph-cloud', color: 'text-blue-400', bg: 'bg-blue-500/20', border: 'border-blue-500/30',
                desc: 'Błyskawicznie angażuje klasę na początku lekcji. Uczniowie wpisują słowa na telefonach, tworząc na tablicy piękną chmurę ze skojarzeniami.',
                steps: [
                    'Zaloguj się na Mentimeter.com i wybierz typ slajdu "Word Cloud".',
                    'Wklej wygenerowane poniżej pytanie/zagadnienie pobudzające.',
                    'Wyświetl slajd na rzutniku. Uczniowie wchodzą na menti.com i wpisują kod.',
                    'Z omówienia największych słów płynnie przejdź do tematu właściwego lekcji.'
                ],
                aiPrompt: 'Jesteś kreatywnym metodykiem. Użytkownik podał temat lekcji: "{topic}". Wygeneruj 1 intrygujące, otwarte pytanie startowe (np. "Z czym kojarzy Ci się...", "Gdy słyszysz... to myślisz o..."), które nauczyciel zada w programie Mentimeter do zrobienia Chmury Wyrazów. Następnie podaj przewidywaną listę 10 słów-kluczy, jakie mogą wymyślić uczniowie, aby nauczyciel był na nie gotowy.'
            },
            { 
                id: 't2', phase: 'wlasciwa', tool: 'Blooket / Kahoot', name: 'Grywalizacja - Test Wiedzy', 
                icon: 'ph-gamepad', color: 'text-purple-400', bg: 'bg-purple-500/20', border: 'border-purple-500/30',
                desc: 'Przekształć żmudne sprawdzanie wiedzy w turniej e-sportowy. Klasa rywalizuje odpowiadając na pytania, zdobywając punkty lub wirtualne złoto.',
                steps: [
                    'Stwórz nowy "Question Set" (Zestaw Pytań) w Blooket lub Kahoot.',
                    'Skopiuj wygenerowane poniżej przez AI gotowe pytania ABCD.',
                    'Podczas lekcji włącz tryb "Host" na ekranie głównym.',
                    'Obserwuj zaangażowanie uczniów i zatrzymuj grę, by wyjaśniać najczęstsze błędy.'
                ],
                aiPrompt: 'Jesteś ekspertem układania quizów. Wygeneruj dokładnie 5 pytań wielokrotnego wyboru (ABCD) na poziom szkoły podstawowej/średniej na temat: "{topic}". Do każdego pytania podaj 4 odpowiedzi i WYRAŹNIE zaznacz pogrubieniem prawidłową. Pytania mają być zwięzłe.'
            },
            { 
                id: 't3', phase: 'podsumowanie', tool: 'Padlet', name: 'Bilet Wyjścia (Exit Ticket)', 
                icon: 'ph-kanban', color: 'text-pink-400', bg: 'bg-pink-500/20', border: 'border-pink-500/30',
                desc: 'Ewaluacja lekcji w nowoczesnym wydaniu. Zanim uczniowie opuszczą klasę, przypinają wirtualną karteczkę z podsumowaniem tego, czego się nauczyli.',
                steps: [
                    'Utwórz nową tablicę (Wall) na platformie Padlet.',
                    'Na górze tablicy wstaw wygenerowane zadanie refleksyjne.',
                    'Wygeneruj kod QR w Padlecie i pokaż na rzutniku pod koniec lekcji.',
                    'Uczniowie skanują kod, anonimowo wklejają swoje karteczki (odpowiedzi) i mogą opuścić klasę.'
                ],
                aiPrompt: 'Zaprojektuj zadanie typu "Bilet wyjścia" dla uczniów po lekcji na temat: "{topic}". Zamiast pytać "Czego się nauczyłeś?", wymyśl 3 kreatywne, krótkie pytania podsumowujące, które zmuszą ucznia do refleksji (np. 3-2-1: 3 nowe fakty, 2 pytania, 1 emocja). Sformatuj to czytelnie dla nauczyciela.'
            },
            { 
                id: 't4', phase: 'rozgrzewka', tool: 'Wordwall', name: 'Koło Fortuny', 
                icon: 'ph-aperture', color: 'text-emerald-400', bg: 'bg-emerald-500/20', border: 'border-emerald-500/30',
                desc: 'Wykorzystaj element losowości, aby skupić uwagę klasy. Zamiast wyczytywać z dziennika, wylosuj zagadnienie na wirtualnym kole.',
                steps: [
                    'Wejdź na Wordwall.net i utwórz aktywność "Random Wheel" (Koło fortuny).',
                    'Skopiuj i wklej wygenerowane przez nas zagadnienia jako pola na kole.',
                    'Na początku lekcji zaproś pierwszego ucznia do zakręcenia wirtualnym kołem na tablicy interaktywnej.',
                    'Uczeń lub klasa odpowiada na wylosowane hasło.'
                ],
                aiPrompt: 'Na temat: "{topic}", wygeneruj listę 8 intrygujących, krótkich haseł (1-3 słowa) lub bardzo krótkich pojęć, które nauczyciel wpisze na pola "Koła Fortuny" Wordwall. Uczniowie będą je losować na początku lekcji, aby o nich opowiedzieć. Podaj tylko tę listę haseł.'
            },
            { 
                id: 't5', phase: 'wlasciwa', tool: 'Genially', name: 'Mini Escape Room', 
                icon: 'ph-key', color: 'text-amber-400', bg: 'bg-amber-500/20', border: 'border-amber-500/30',
                desc: 'Zamknij materiał lekcyjny w zagadkach logicznych. Genially pozwala tworzyć przepiękne, interaktywne pokoje zagadek bez programowania.',
                steps: [
                    'Wybierz darmowy szablon "Gamification -> Breakout" w Genially.',
                    'W miejscach zagadek i kłódek (passwords) użyj wygenerowanych przez nas wyzwań.',
                    'Podziel klasę na 3-4 osobowe zespoły z jednym tabletem/laptopem.',
                    'Drużyna, która pierwsza poda kod końcowy z walizki, wygrywa!'
                ],
                aiPrompt: 'Wygeneruj koncepcję na edukacyjny Mini-Escape Room na lekcję o tematyce: "{topic}". Zaproponuj 3 zagadki dla uczniów. Każda zagadka musi dawać jako rozwiązanie cyfrę lub krótkie słowo. Na koniec podaj finalny 3-elementowy kod potrzebny do "wyjścia z pokoju".'
            }
        ];

        function EduTikApp() {
            // --- STATE APLIKACJI ---
            const [selectedPhase, setSelectedPhase] = useState('wszystkie');
            const [currentTool, setCurrentTool] = useState(null);
            
            // AI Generator State
            const [lessonTopic, setLessonTopic] = useState('');
            const [aiContent, setAiContent] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Inicjalnie po załadowaniu wylosuj cokolwiek
            useEffect(() => {
                handleRandomTool();
            }, []);

            // --- FUNKCJE ---
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleRandomTool = () => {
                setAiContent(''); // Reset wygenerowanego tekstu po zmianie narzędzia
                setLessonTopic('');
                
                let available = TOOLS_DB;
                if (selectedPhase !== 'wszystkie') {
                    available = TOOLS_DB.filter(t => t.phase === selectedPhase);
                }
                
                // Nie losuj tego samego pod rząd (jeśli to możliwe)
                if (available.length > 1 && currentTool) {
                    available = available.filter(t => t.id !== currentTool.id);
                }

                const random = available[Math.floor(Math.random() * available.length)];
                
                // Hack na zrestartowanie animacji CSS
                setCurrentTool(null);
                setTimeout(() => setCurrentTool(random), 50);
            };

            const handleCopyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                showToast("✅ Skopiowano materiał do schowka!");
            };

            const generateContent = async () => {
                if (!lessonTopic.trim() || !currentTool) return;
                setIsGenerating(true);
                setAiContent('');

                // Przygotuj prompt wymieniając {topic} na wpisany temat
                const prompt = currentTool.aiPrompt.replace('{topic}', lessonTopic);

                const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
                    for (let i = 0; i < retries; i++) {
                        try {
                            const res = await fetch(url, options);
                            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                            return await res.json();
                        } catch (e) {
                            if (i === retries - 1) throw e;
                            await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                        }
                    }
                };

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const payload = { contents: [{ parts: [{ text: prompt }] }] };

                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Błąd generowania. Spróbuj ponownie.";
                    setAiContent(text);
                } catch (error) {
                    console.error("AI Error:", error);
                    setAiContent("Wystąpił błąd podczas łączenia z AI. Upewnij się, że masz połączenie z internetem i spróbuj ponownie.");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen relative flex flex-col pb-10">
                    <div className="hero-glow"></div>

                    {/* Powiadomienie Toast */}
                    <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 ${toastMessage ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                        {toastMessage}
                    </div>

                    {/* Nawigacja */}
                    <nav className="w-full z-[100] glass-nav sticky top-0">
                        <div className="max-w-[90rem] mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-fuchsia-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(192,38,211,0.5)]">
                                    <i className="ph-bold ph-lightbulb text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduTIK<span className="text-fuchsia-500">PRO</span></span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-widest hidden md:block">
                                    Kreator Aktywności
                                </div>
                                <a href={BUY_COFFEE_LINK} target="_blank" className="flex items-center gap-2 bg-slate-800 border border-slate-700 text-amber-400 px-5 py-2.5 rounded-full hover:bg-slate-700 hover:border-amber-500/50 hover:text-amber-300 transition-all shadow-lg btn-bounce text-xs font-bold uppercase tracking-wider">
                                    <i className="ph-fill ph-coffee text-base"></i> Postaw Kawę
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow max-w-[90rem] w-full mx-auto px-4 sm:px-6 py-8 relative z-10 flex flex-col xl:flex-row gap-8 items-start">
                        
                        {/* ================================== */}
                        {/* LEWA KOLUMNA: Nawigacja i Wybór  */}
                        {/* ================================== */}
                        <div className="w-full xl:w-1/3 flex flex-col gap-6">
                            
                            {/* Panel Sterowania */}
                            <div className="glass-panel rounded-[2rem] p-8">
                                <h2 className="text-2xl font-bold text-white mb-2">Inspirator TIK</h2>
                                <p className="text-slate-400 text-sm mb-8 leading-relaxed">
                                    Nie wiesz jak urozmaicić lekcję? Wybierz jej etap, a system podpowie świetną aplikację i przygotuje Ci do niej gotowy wkład (quiz, hasła, pytania).
                                </p>

                                {/* Wybór Etapu */}
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 block">Faza lekcji</label>
                                        <div className="grid grid-cols-1 gap-2">
                                            {[
                                                { id: 'wszystkie', name: 'Zaskocz mnie!', icon: 'ph-magic-wand' },
                                                { id: 'rozgrzewka', name: 'Wstęp / Rozgrzewka', icon: 'ph-fire' },
                                                { id: 'wlasciwa', name: 'Praca Właściwa (Trening)', icon: 'ph-brain' },
                                                { id: 'podsumowanie', name: 'Podsumowanie (Ewaluacja)', icon: 'ph-check-circle' }
                                            ].map(phase => (
                                                <button
                                                    key={phase.id}
                                                    onClick={() => { setSelectedPhase(phase.id); handleRandomTool(); }}
                                                    className={`flex items-center gap-3 p-3.5 rounded-xl border transition-all text-sm font-medium ${
                                                        selectedPhase === phase.id 
                                                        ? 'bg-fuchsia-600/20 border-fuchsia-500/50 text-white shadow-[0_0_15px_rgba(192,38,211,0.2)]' 
                                                        : 'bg-slate-800/50 border-slate-700/50 text-slate-400 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    <i className={`ph-fill ${phase.icon} text-lg ${selectedPhase === phase.id ? 'text-fuchsia-400' : ''}`}></i>
                                                    {phase.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleRandomTool}
                                        className="w-full bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 py-4 rounded-xl font-bold transition-all btn-bounce flex items-center justify-center gap-2"
                                    >
                                        <i className="ph-bold ph-arrows-clockwise text-lg text-fuchsia-400"></i> Losuj Inne Narzędzie
                                    </button>
                                </div>
                            </div>
                            
                            {/* Baner informacyjny */}
                            <div className="glass-panel rounded-[2rem] p-6 border-fuchsia-500/20 border bg-gradient-to-b from-fuchsia-900/10 to-transparent flex items-start gap-4">
                                <div className="w-12 h-12 bg-fuchsia-500/20 rounded-full flex items-center justify-center shrink-0">
                                    <i className="ph-fill ph-rocket text-2xl text-fuchsia-400"></i>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-sm mb-1">To jest wersja PRO!</h4>
                                    <p className="text-slate-400 text-xs leading-relaxed">Ta aplikacja nie tylko podpowiada pomysły, ale po prawej stronie tworzy fizyczne, merytoryczne pomoce (zagadki, testy) bezpośrednio pod Twój temat lekcji.</p>
                                </div>
                            </div>

                        </div>

                        {/* ================================== */}
                        {/* PRAWA KOLUMNA: Prezentacja & AI    */}
                        {/* ================================== */}
                        <div className="w-full xl:w-2/3 flex flex-col gap-6">
                            
                            {currentTool && (
                                <div className="anim-slide-up flex flex-col gap-6">
                                    
                                    {/* 1. Karta Informacyjna (Góra) */}
                                    <div className="glass-panel rounded-[2rem] p-8 md:p-10 relative overflow-hidden">
                                        <div className={`absolute top-0 right-0 p-10 opacity-[0.05] pointer-events-none`}>
                                            <i className={`ph-fill ${currentTool.icon} text-9xl ${currentTool.color}`}></i>
                                        </div>

                                        <div className="relative z-10 flex flex-col md:flex-row gap-8 items-start">
                                            
                                            {/* Lewa strona karty: Opis narzędzia */}
                                            <div className="flex-1">
                                                <div className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest mb-4 ${currentTool.bg} ${currentTool.color} border ${currentTool.border}`}>
                                                    <i className="ph-fill ph-wrench"></i> Narzędzie: {currentTool.tool}
                                                </div>
                                                
                                                <h1 className="text-3xl md:text-4xl font-black text-white mb-4 tracking-tight leading-tight">
                                                    {currentTool.name}
                                                </h1>
                                                
                                                <p className="text-slate-300 text-base leading-relaxed mb-6 font-medium">
                                                    {currentTool.desc}
                                                </p>

                                                <a href={`https://www.google.com/search?q=${currentTool.tool}`} target="_blank" className="inline-flex items-center gap-2 text-sm font-bold bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl transition-colors border border-slate-600">
                                                    <i className="ph-bold ph-arrow-square-out"></i> Przejdź do strony {currentTool.tool}
                                                </a>
                                            </div>

                                            {/* Prawa strona karty: Instrukcja */}
                                            <div className="w-full md:w-80 shrink-0 bg-slate-900/60 rounded-2xl p-6 border border-slate-700/50">
                                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                                    <i className="ph-fill ph-list-numbers"></i> Jak to wdrożyć?
                                                </h4>
                                                <div className="space-y-3">
                                                    {currentTool.steps.map((step, idx) => (
                                                        <div key={idx} className="flex items-start gap-3">
                                                            <div className="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-400 shrink-0 mt-0.5 border border-slate-600">
                                                                {idx + 1}
                                                            </div>
                                                            <p className="text-sm text-slate-300 leading-snug">{step}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 2. Generator Materiałów AI (Dół) */}
                                    <div className="glass-panel rounded-[2rem] p-8 md:p-10 border border-fuchsia-500/30 relative">
                                        
                                        <div className="flex flex-col md:flex-row items-start justify-between gap-6 mb-8">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-3 mb-2">
                                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-fuchsia-500 to-purple-600 flex items-center justify-center shadow-lg">
                                                        <i className="ph-fill ph-magic-wand text-white text-xl"></i>
                                                    </div>
                                                    <h2 className="text-2xl font-bold text-white">Generator Materiałów</h2>
                                                </div>
                                                <p className="text-slate-400 text-sm ml-13">Nie trać czasu na wymyślanie pytań z głowy. Podaj temat, a Sztuczna Inteligencja stworzy gotową merytorykę specjalnie pod aplikację <strong>{currentTool.tool}</strong>.</p>
                                            </div>
                                        </div>

                                        <div className="flex flex-col md:flex-row gap-4 items-end bg-slate-900/50 p-5 rounded-2xl border border-slate-700/50">
                                            <div className="w-full flex-grow">
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block ml-1">Wpisz temat (lub wklej fragment notatki):</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="Np. 'Odkrycia geograficzne 6 klasa', 'Czas Present Simple'..."
                                                    value={lessonTopic}
                                                    onChange={(e) => setLessonTopic(e.target.value)}
                                                    onKeyPress={(e) => e.key === 'Enter' && generateContent()}
                                                    className="w-full bg-slate-800 border border-slate-600 text-white rounded-xl py-3 px-4 focus:outline-none focus:border-fuchsia-500 transition-colors shadow-inner text-sm"
                                                />
                                            </div>
                                            <button 
                                                onClick={generateContent}
                                                disabled={isGenerating || !lessonTopic.trim()}
                                                className="w-full md:w-auto bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-50 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(217,70,239,0.3)] btn-bounce flex items-center justify-center gap-2 shrink-0 h-[46px]"
                                            >
                                                {isGenerating ? <div className="loader"></div> : <><i className="ph-bold ph-sparkle text-lg"></i> Stwórz materiał</>}
                                            </button>
                                        </div>

                                        {/* Wynik Generowania AI */}
                                        {aiContent && (
                                            <div className="mt-8 animate-[reveal_0.3s_ease-out]">
                                                <div className="flex justify-between items-end mb-3">
                                                    <label className="text-xs font-bold text-fuchsia-400 uppercase tracking-widest block ml-1">Wygenerowany materiał do {currentTool.tool}:</label>
                                                    <button 
                                                        onClick={() => handleCopyToClipboard(aiContent)} 
                                                        className="text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg border border-slate-600 transition-colors flex items-center gap-1.5 btn-bounce shadow-sm"
                                                    >
                                                        <i className="ph-bold ph-copy text-sm"></i> Skopiuj całość
                                                    </button>
                                                </div>
                                                <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-inner relative group">
                                                    {/* Dekoracyjny cytat */}
                                                    <i className="ph-fill ph-quotes text-4xl text-slate-800 absolute top-4 left-4 pointer-events-none"></i>
                                                    
                                                    <div className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap relative z-10 font-medium">
                                                        {aiContent}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                </div>
                            )}

                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduTikApp />);
    </script>
</body>
</html>
