<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduBox - Generator Wideo Ani</title>

    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons (do UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Fonty -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Baza aplikacji EduBox (ładowana dynamicznie, jak w Katalogu / EwaMarketing) -->
    <script>
        const eduboxAppsScript = document.createElement('script');
        eduboxAppsScript.src = './apps.js?v=' + new Date().getTime();
        eduboxAppsScript.onerror = () => { window.appsJsError = true; };
        document.head.appendChild(eduboxAppsScript);
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Fredoka', 'sans-serif'] },
                    colors: { slate: { 950: '#020617' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.35s ease-out; }
    </style>
</head>
<body>
    <a href="index.html" title="Strona główna EduBox AI" class="no-print" style="position:fixed;bottom:14px;left:14px;z-index:9999;width:46px;height:46px;border-radius:9999px;background:rgba(15,23,42,0.88);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.3);text-decoration:none;font-size:22px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.15);">
        <i class="ph-bold ph-house"></i>
    </a>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CAT_LABELS = {
            'terapia': 'Terapia i SPE',
            'biurokracja': 'Biurokracja i Dokumenty',
            'zajecia': 'Zajęcia i Gry',
            'grafika': 'Grafika i Kreatywne',
            'inne': 'Pozostałe Aplikacje'
        };
        const SITE_ORIGIN = 'https://eduboxpro.pl';
        const PHOTO_STORAGE_KEY = 'aniaWideoPhotoDataUrl';

        function App() {
            // Zdjęcie referencyjne Ani (wgrywane raz, zapamiętywane w tej przeglądarce)
            const [photoDataUrl, setPhotoDataUrl] = useState(() => {
                try { return localStorage.getItem(PHOTO_STORAGE_KEY) || ''; } catch (e) { return ''; }
            });
            const fileInputRef = useRef(null);

            // Tryb treści: własny tekst albo AI na podstawie tematu/aplikacji
            const [mode, setMode] = useState('ai'); // 'ai' | 'custom'
            const [topic, setTopic] = useState('');
            const [customScript, setCustomScript] = useState('');
            const [apps, setApps] = useState([]);
            const [appsError, setAppsError] = useState(false);
            const [selectedAppIndex, setSelectedAppIndex] = useState('random');

            const [isWritingScript, setIsWritingScript] = useState(false);
            const [scriptError, setScriptError] = useState('');

            const [isGeneratingVideo, setIsGeneratingVideo] = useState(false);
            const [videoStatusMsg, setVideoStatusMsg] = useState('');
            const [videoUrl, setVideoUrl] = useState('');
            const [videoError, setVideoError] = useState('');

            useEffect(() => {
                let attempts = 0;
                const checkData = setInterval(() => {
                    if (window.appsJsError) { clearInterval(checkData); setAppsError(true); return; }
                    if (window.EduBoxData && window.EduBoxData.APPS) {
                        setApps(window.EduBoxData.APPS);
                        clearInterval(checkData);
                    } else {
                        attempts++;
                        if (attempts > 25) { clearInterval(checkData); setAppsError(true); }
                    }
                }, 200);
                return () => clearInterval(checkData);
            }, []);

            const groupedApps = apps.reduce((acc, app, idx) => {
                const cat = app.category || 'inne';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push({ ...app, idx });
                return acc;
            }, {});

            const handlePhotoUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    setPhotoDataUrl(dataUrl);
                    try { localStorage.setItem(PHOTO_STORAGE_KEY, dataUrl); } catch (err) {
                        console.warn('Nie udało się zapisać zdjęcia lokalnie (za duże?).', err);
                    }
                };
                reader.readAsDataURL(file);
            };

            // AI pisze krótki, mówiony scenariusz (nie post - zdanie/dwa do nagrania głosem)
            const generateScript = async () => {
                if (!topic.trim() || apps.length === 0) return;
                setIsWritingScript(true);
                setScriptError('');
                try {
                    const app = selectedAppIndex === 'random'
                        ? apps[Math.floor(Math.random() * apps.length)]
                        : apps[Number(selectedAppIndex)];

                    const systemPrompt = `Jesteś Anią, ciepłą i naturalną cyfrową asystentką EduBox, która nagrywa krótkie wideo do social media dla nauczycieli.
Piszesz TYLKO tekst DO WYPOWIEDZENIA na głos (nie post pisany) - naturalny, mówiony język polski, jakbyś zwracała się bezpośrednio do widza.
Promujesz KONKRETNIE narzędzie: "${app.title}" - ${app.desc}. Adres: eduboxpro.pl/${app.url}.
Struktura: 1-2 zdania o problemie/temacie, 1-2 zdania co narzędzie robi, na końcu zaproszenie w stylu "Sprawdź na eduboxpro.pl/${app.url}".
Maksymalnie 45 słów łącznie - to ma być krótkie wideo, nie referat. Bez wstępów typu "cześć, tu Ania" (to zostanie dodane osobno). Zwróć WYŁĄCZNIE czysty tekst do przeczytania, bez cudzysłowów.`;

                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: `Temat: ${topic}`, system: systemPrompt, temperature: 0.8 })
                    });
                    if (!res.ok) throw new Error(`Błąd serwera tekstu (HTTP ${res.status}).`);
                    const data = await res.json();
                    const text = (data.text || '').trim();
                    if (!text) throw new Error('Serwer nie zwrócił scenariusza.');
                    setCustomScript(`Cześć, tu Ania z EduBox! ${text}`);
                } catch (err) {
                    setScriptError(err.message || 'Nie udało się napisać scenariusza.');
                } finally {
                    setIsWritingScript(false);
                }
            };

            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            const generateVideo = async () => {
                if (!photoDataUrl) { setVideoError('Najpierw wgraj zdjęcie Ani.'); return; }
                if (!customScript.trim()) { setVideoError('Brak tekstu do nagrania - napisz własny albo wygeneruj przez AI.'); return; }

                setIsGeneratingVideo(true);
                setVideoError('');
                setVideoUrl('');
                setVideoStatusMsg('Wysyłam zlecenie do D-ID...');

                try {
                    const createRes = await fetch('/api/ewa-generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'video-create', photoDataUrl, script: customScript })
                    });
                    const createData = await createRes.json();
                    if (!createRes.ok) throw new Error(createData.message || 'Nie udało się utworzyć zlecenia wideo.');

                    const talkId = createData.talkId;
                    setVideoStatusMsg('Ania nagrywa... (zwykle 15-40 sekund)');

                    // Odpytujemy o status co 3s, maksymalnie 2 minuty
                    const maxAttempts = 40;
                    for (let i = 0; i < maxAttempts; i++) {
                        await sleep(3000);
                        const statusRes = await fetch('/api/ewa-generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ type: 'video-status', talkId })
                        });
                        const statusData = await statusRes.json();
                        if (!statusRes.ok) throw new Error(statusData.message || 'Błąd sprawdzania statusu.');

                        if (statusData.status === 'done' && statusData.resultUrl) {
                            setVideoUrl(statusData.resultUrl);
                            setVideoStatusMsg('');
                            setIsGeneratingVideo(false);
                            return;
                        }
                        if (statusData.status === 'error') {
                            throw new Error(statusData.error || 'D-ID zgłosił błąd renderowania.');
                        }
                        setVideoStatusMsg(`Ania nagrywa... (${statusData.status || 'przetwarzanie'})`);
                    }
                    throw new Error('Przekroczono czas oczekiwania (2 min). Sprawdź panel D-ID - zlecenie mogło się jeszcze dokończyć.');
                } catch (err) {
                    setVideoError(err.message || 'Nieznany błąd podczas generowania wideo.');
                    setIsGeneratingVideo(false);
                    setVideoStatusMsg('');
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">
                    <div className="max-w-5xl mx-auto">

                        <header className="mb-8 flex items-center gap-4">
                            <div className="w-14 h-14 bg-gradient-to-br from-teal-500 to-cyan-600 rounded-2xl flex items-center justify-center shadow-lg">
                                <i className="ph-fill ph-video-camera text-3xl text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-3xl font-display font-bold text-white">Generator Wideo Ani</h1>
                                <p className="text-slate-400">Twój prywatny moduł do nagrywania krótkich wideo Ani - do ręcznego wrzucenia na FB / IG / YouTube</p>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">

                            {/* LEWA KOLUMNA - PANEL STEROWANIA */}
                            <div className="lg:col-span-1 space-y-6">

                                {/* ZDJĘCIE REFERENCYJNE */}
                                <div className="glass-panel p-6 rounded-2xl shadow-xl">
                                    <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                        <i className="ph-fill ph-image text-teal-400"></i> Zdjęcie Ani
                                    </h2>
                                    {photoDataUrl ? (
                                        <div className="mb-4">
                                            <img src={photoDataUrl} alt="Ania" className="w-full aspect-square object-cover rounded-xl border-2 border-slate-700" />
                                        </div>
                                    ) : (
                                        <div className="mb-4 aspect-square rounded-xl border-2 border-dashed border-slate-700 flex items-center justify-center text-slate-500 text-sm text-center p-4">
                                            Brak wgranego zdjęcia
                                        </div>
                                    )}
                                    <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                    <button onClick={() => fileInputRef.current?.click()} className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-colors">
                                        <i className="ph-bold ph-upload"></i> {photoDataUrl ? 'Zmień zdjęcie' : 'Wgraj zdjęcie'}
                                    </button>
                                    <p className="text-xs text-slate-500 mt-2">Zapamiętywane w tej przeglądarce - wgrywasz raz, używasz przy każdym filmie.</p>
                                </div>

                                {/* TEKST DO NAGRANIA */}
                                <div className="glass-panel p-6 rounded-2xl shadow-xl">
                                    <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                        <i className="ph-fill ph-microphone text-teal-400"></i> Co Ania powie?
                                    </h2>

                                    <div className="flex bg-slate-900 p-1 rounded-xl mb-4 border border-slate-700">
                                        <button onClick={() => setMode('ai')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mode === 'ai' ? 'bg-teal-600 text-white' : 'text-slate-400'}`}>AI wymyśli</button>
                                        <button onClick={() => setMode('custom')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${mode === 'custom' ? 'bg-teal-600 text-white' : 'text-slate-400'}`}>Własny tekst</button>
                                    </div>

                                    {mode === 'ai' && (
                                        <div className="space-y-3 mb-2">
                                            <label className="block text-xs font-bold text-slate-400 uppercase">Którą aplikację promujemy?</label>
                                            <select value={selectedAppIndex} onChange={e => setSelectedAppIndex(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-xl outline-none focus:border-teal-500">
                                                <option value="random">🎲 Zaskocz mnie (losowa aplikacja)</option>
                                                {Object.keys(CAT_LABELS).map(cat => (
                                                    groupedApps[cat] && groupedApps[cat].length > 0 && (
                                                        <optgroup key={cat} label={CAT_LABELS[cat]}>
                                                            {groupedApps[cat].map(app => (
                                                                <option key={app.idx} value={app.idx}>{app.title}</option>
                                                            ))}
                                                        </optgroup>
                                                    )
                                                ))}
                                            </select>
                                            <label className="block text-xs font-bold text-slate-400 uppercase">Jaki problem rozwiązujemy?</label>
                                            <textarea value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Długie pisanie ocen opisowych..." className="w-full h-24 bg-slate-900 border border-slate-700 text-white p-4 rounded-xl resize-none outline-none focus:border-teal-500"></textarea>
                                            <button onClick={generateScript} disabled={isWritingScript || !topic.trim() || apps.length === 0} className="w-full bg-slate-800 hover:bg-slate-700 border border-teal-600/50 text-teal-300 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-colors disabled:opacity-50">
                                                {isWritingScript ? <i className="ph-bold ph-spinner animate-spin"></i> : <i className="ph-bold ph-magic-wand"></i>}
                                                {isWritingScript ? 'Ania pisze...' : 'Napisz scenariusz'}
                                            </button>
                                            {scriptError && <p className="text-red-400 text-xs">{scriptError}</p>}
                                        </div>
                                    )}

                                    <label className="block text-xs font-bold text-slate-400 uppercase mt-4 mb-2">Tekst do nagrania (edytowalny)</label>
                                    <textarea value={customScript} onChange={e => setCustomScript(e.target.value)} placeholder="Cześć, tu Ania z EduBox! ..." className="w-full h-32 bg-slate-900 border border-slate-700 text-white p-4 rounded-xl resize-none outline-none focus:border-teal-500 mb-4"></textarea>

                                    <button onClick={generateVideo} disabled={isGeneratingVideo || !photoDataUrl || !customScript.trim()} className="w-full bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-500 hover:to-cyan-500 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                        {isGeneratingVideo ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-film-strip text-xl"></i>}
                                        {isGeneratingVideo ? 'Generowanie wideo...' : 'Nagraj wideo'}
                                    </button>
                                    {videoError && (
                                        <div className="mt-4 p-3 bg-red-900/50 border border-red-500/50 text-red-300 rounded-xl text-sm">
                                            <i className="ph-fill ph-warning-circle"></i> {videoError}
                                        </div>
                                    )}
                                    {appsError && (
                                        <div className="mt-4 p-3 bg-amber-900/50 border border-amber-500/50 text-amber-300 rounded-xl text-sm">
                                            <i className="ph-fill ph-warning-circle"></i> Nie udało się wczytać listy aplikacji.
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA - WYNIK */}
                            <div className="lg:col-span-2">
                                <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-xl min-h-[500px] flex flex-col">
                                    {!videoUrl && !isGeneratingVideo && (
                                        <div className="h-full flex-1 flex flex-col items-center justify-center text-slate-500 opacity-50 py-20">
                                            <i className="ph-fill ph-video-camera text-6xl mb-4"></i>
                                            <p className="font-medium text-lg text-center">Tutaj pojawi się gotowe wideo Ani.</p>
                                        </div>
                                    )}
                                    {isGeneratingVideo && (
                                        <div className="h-full flex-1 flex flex-col items-center justify-center text-slate-300 py-20">
                                            <i className="ph-bold ph-spinner-gap animate-spin text-6xl text-teal-400 mb-4"></i>
                                            <p className="font-medium text-lg text-center">{videoStatusMsg}</p>
                                        </div>
                                    )}
                                    {videoUrl && (
                                        <div className="animate-fade-in flex-1 flex flex-col">
                                            <div className="flex items-center justify-between mb-4">
                                                <h2 className="text-2xl font-display font-bold text-white flex items-center gap-2">
                                                    <i className="ph-fill ph-check-circle text-green-500"></i> Gotowe!
                                                </h2>
                                                <a href={videoUrl} download="ania-wideo.mp4" target="_blank" rel="noreferrer" className="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors">
                                                    <i className="ph-bold ph-download-simple"></i> Pobierz wideo
                                                </a>
                                            </div>
                                            <div className="flex-1 flex items-center justify-center bg-black rounded-xl overflow-hidden">
                                                <video src={videoUrl} controls autoPlay playsInline className="max-h-[600px] max-w-full"></video>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-3 text-center">Link do wideo hostowany przez D-ID może wygasnąć - pobierz plik od razu.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
