<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAwans PRO - Kreator Dokumentacji</title>
    
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Ikony Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .glass-nav { 
            background: rgba(2, 6, 23, 0.8); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }

        .hero-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(2, 6, 23, 0) 60%);
            z-index: -1;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #a855f7;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Ustawienia do wydruku - perfekcyjne formatowanie */
        @media print {
            @page { margin: 1.5cm; size: A4 portrait; }
            body, html, #root { 
                background: white !important; 
                color: black !important; 
                font-family: 'Times New Roman', Times, serif !important; 
                margin: 0 !important;
                padding: 0 !important;
                font-size: 12pt !important;
            }
            
            /* Ukrywamy UI aplikacji */
            .print-hidden { display: none !important; }
            
            /* Pokazujemy to co ma być drukowane z mocnymi marginesami fizycznymi */
            .print-only { 
                display: block !important; 
                width: 100% !important;
                max-width: 100% !important;
                padding: 2cm 2.5cm !important; /* Wymuszone fizyczne marginesy: 2cm góra/dół, 2.5cm boki */
                box-sizing: border-box !important;
            }
            
            /* Naprawa przecinających się linii i łamania stron */
            .print-break-avoid { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important; 
                display: block !important;
                margin-bottom: 20pt !important;
            }
            
            h1 { font-size: 16pt !important; text-align: center !important; margin-bottom: 10pt !important; font-weight: bold !important; }
            h2 { font-size: 14pt !important; margin-top: 15pt !important; margin-bottom: 8pt !important; font-weight: bold !important; }
            p { text-align: justify !important; line-height: 1.6 !important; font-size: 12pt !important; margin-bottom: 10pt !important; }
            
            .signatures { display: flex !important; justify-content: space-between !important; margin-top: 50pt !important; }
            .signatures > div { width: 40% !important; text-align: center !important; }
            .signatures p { text-align: center !important; margin-bottom: 5pt !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";
        const apiKey = ""; // API KEY is injected by environment

        // BAZA DANYCH WYMAGAŃ PRAWNYCH I PRZYKŁADÓW
        const AWANS_DATA = {
            mianowany: [
                {
                    id: 'm1',
                    law: "§ 7 ust. 2 pkt 1",
                    title: "Prowadzenie zajęć w sposób zapewniający właściwą realizację statutowych zadań szkoły",
                    icon: "ph-chalkboard-teacher",
                    checklist: [
                        { id: 'm1_c1', text: "Nawiązanie współpracy z mentorem (opracowanie planu/kontraktu)" },
                        { id: 'm1_c2', text: "Obserwacja zajęć prowadzonych przez mentora" },
                        { id: 'm1_c3', text: "Prowadzenie zajęć w obecności mentora" },
                        { id: 'm1_c4', text: "Prowadzenie zajęć w obecności dyrektora" }
                    ],
                    examples: [
                        {
                            name: "Współpraca z mentorem",
                            plan: "Podjęcie współpracy z mentorem. Opracowanie kontraktu oraz harmonogramu spotkań. Obserwacja zajęć.",
                            report: "Nawiązałam współpracę z mentorem, z którym zawarłam kontrakt. Zgodnie z harmonogramem obserwowałam zajęcia prowadzone przez mentora, co pozwoliło mi na wzbogacenie warsztatu pracy o nowe formy aktywizujące. Ponadto prowadziłam zajęcia w jego obecności, a późniejsza ewaluacja przyczyniła się do korekty moich metod nauczania."
                        }
                    ]
                },
                {
                    id: 'm2',
                    law: "§ 7 ust. 2 pkt 2",
                    title: "Umiejętność rozpoznawania potrzeb rozwojowych uczniów",
                    icon: "ph-users-three",
                    checklist: [
                        { id: 'm2_c1', text: "Analiza opinii i orzeczeń z Poradni Psychologiczno-Pedagogicznej" },
                        { id: 'm2_c2', text: "Dostosowanie wymagań edukacyjnych do zdiagnozowanych potrzeb" },
                        { id: 'm2_c3', text: "Indywidualizacja pracy na zajęciach (karty pracy, tempo)" }
                    ],
                    examples: [
                        {
                            name: "Dostosowanie wymagań edukacyjnych",
                            plan: "Diagnoza potrzeb uczniów. Dostosowanie wymagań edukacyjnych do zaleceń PPP. Tworzenie autorskich materiałów.",
                            report: "Dokonałam wnikliwej diagnozy potrzeb moich uczniów, opierając się na opiniach PPP. Systematycznie dostosowywałam metody i formy pracy. Dla uczniów z trudnościami przygotowywałam uproszczone karty pracy, natomiast dla uczniów uzdolnionych zadania o podwyższonym stopniu trudności, co wpłynęło na ich motywację wewnętrzną."
                        }
                    ]
                },
                {
                    id: 'm3',
                    law: "§ 7 ust. 2 pkt 3",
                    title: "Wykorzystanie w pracy technologii informacyjno-komunikacyjnej (TIK)",
                    icon: "ph-desktop",
                    checklist: [
                        { id: 'm3_c1', text: "Wykorzystanie tablicy interaktywnej/projektora na zajęciach" },
                        { id: 'm3_c2', text: "Korzystanie z aplikacji edukacyjnych (np. Wordwall, Quizizz, Canva)" },
                        { id: 'm3_c3', text: "Prowadzenie dokumentacji w dzienniku elektronicznym" }
                    ],
                    examples: [
                        {
                            name: "Nowoczesne technologie na lekcjach",
                            plan: "Wykorzystanie platform edukacyjnych, tablicy interaktywnej oraz narzędzi online do aktywizowania uczniów.",
                            report: "W codziennej pracy systematycznie korzystałam z TIK. Wykorzystywałam tablicę interaktywną do prezentacji. Regularnie tworzyłam interaktywne quizy sprawdzające wiedzę (Quizizz, Blooket), co zwiększyło atrakcyjność zajęć. Biegle obsługiwałam dziennik elektroniczny, co usprawniło komunikację z rodzicami."
                        }
                    ]
                }
            ],
            dyplomowany: [
                {
                    id: 'd1',
                    law: "Wymaganie Dyplomowany 1",
                    title: "Doskonalenie warsztatu pracy, dzielenie się wiedzą",
                    icon: "ph-share-network",
                    checklist: [
                        { id: 'd1_c1', text: "Prowadzenie zajęć otwartych dla innych nauczycieli" },
                        { id: 'd1_c2', text: "Pełnienie funkcji mentora lub opiekuna praktyk studenckich" },
                        { id: 'd1_c3', text: "Szkoleniowe Rady Pedagogiczne (prowadzenie WDN)" }
                    ],
                    examples: [
                        {
                            name: "Prowadzenie zajęć otwartych",
                            plan: "Zorganizowanie zajęć otwartych dla nauczycieli. Opracowanie i udostępnienie materiałów metodycznych.",
                            report: "Aktywnie dzieliłam się swoją wiedzą i doświadczeniem. Zorganizowałam zajęcia otwarte, w których uczestniczyli młodzi nauczyciele. Przygotowywałam pakiety materiałów metodycznych (scenariusze, karty pracy), które udostępniałam w szkolnej bazie wiedzy. Omawianie zajęć sprzyjało autoewaluacji."
                        }
                    ]
                }
            ]
        };

        function EduAwansApp() {
            // --- STATE APLIKACJI ---
            const [activeTab, setActiveTab] = useState('kreator'); // 'kreator' | 'dokument'
            const [selectedPath, setSelectedPath] = useState('mianowany');
            const [expandedReqId, setExpandedReqId] = useState('m1');
            const [checkedTasks, setCheckedTasks] = useState([]);
            
            // --- STATE KREATORA DOKUMENTU ---
            const [docItems, setDocItems] = useState([]); // { id, section, text }
            
            // --- STATE AI GENERATORA ---
            const [aiInput, setAiInput] = useState('');
            const [aiOutput, setAiOutput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // --- FUNKCJE POMOCNICZE ---
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const toggleTask = (taskId) => {
                if (checkedTasks.includes(taskId)) {
                    setCheckedTasks(checkedTasks.filter(id => id !== taskId));
                } else {
                    setCheckedTasks([...checkedTasks, taskId]);
                }
            };

            // Doda do dokumentu (Kluczowa funkcja)
            const handleAddToDocument = (textToInsert, forcedSectionName = null) => {
                const activeReq = AWANS_DATA[selectedPath].find(r => r.id === expandedReqId);
                const sectionTitle = forcedSectionName || (activeReq ? activeReq.title : "Inne działania");
                
                setDocItems([...docItems, { 
                    id: Date.now(), 
                    section: sectionTitle, 
                    text: textToInsert 
                }]);
                
                showToast("✅ Dodano do Twojego dokumentu!");
            };

            // Aktualizacja tekstu w dokumencie
            const updateDocItem = (id, field, value) => {
                setDocItems(docItems.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            // Usuwanie z dokumentu
            const removeDocItem = (id) => {
                setDocItems(docItems.filter(item => item.id !== id));
            };

            // --- LOGIKA AI ---
            const generateAIText = async () => {
                if (!aiInput.trim()) return;
                setIsGenerating(true);
                setAiOutput('');

                const prompt = `Jesteś ekspertem ds. awansu zawodowego nauczycieli w Polsce. 
                Zadanie: Zamień poniższe potoczne zdanie na oficjalny, elokwentny, urzędowy akapit (ok. 3-4 zdania), 
                idealny do teczki/sprawozdania z awansu zawodowego nauczyciela. 
                Używaj czasu przeszłego (np. zorganizowałam/em, wdrożyłam/em) i specjalistycznego żargonu pedagogicznego. 
                Tekst potoczny nauczyciela: "${aiInput}"`;

                const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
                    for (let i = 0; i < retries; i++) {
                        try {
                            const res = await fetch(url, options);
                            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                            return await res.json();
                        } catch (e) {
                            if (i === retries - 1) throw e;
                            await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                        }
                    }
                };

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Błąd generowania tekstu. Spróbuj ponownie.";
                    setAiOutput(text);
                } catch (error) {
                    setAiOutput("Wystąpił błąd podczas łączenia z AI. Sprawdź połączenie.");
                } finally {
                    setIsGenerating(false);
                }
            };

            // Postęp
            const requirements = AWANS_DATA[selectedPath];
            const allChecklistItems = requirements.flatMap(req => req.checklist);
            const totalTasks = allChecklistItems.length;
            const completedTasks = allChecklistItems.filter(task => checkedTasks.includes(task.id)).length;
            const progressPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            // --- RENDEROWANIE ---
            return (
                <div className="min-h-screen relative flex flex-col pb-10">
                    <div className="hero-glow print-hidden"></div>

                    {/* Powiadomienia */}
                    <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 print-hidden ${toastMessage ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                        {toastMessage}
                    </div>

                    {/* Nawigacja Główna (Ukryta przy druku) */}
                    <nav className="w-full z-[100] glass-nav print-hidden sticky top-0">
                        <div className="max-w-[90rem] mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                                    <i className="ph-bold ph-graduation-cap text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduAwans<span className="text-blue-500">PRO MAX</span></span>
                            </div>
                            
                            {/* Zakładki */}
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50">
                                <button 
                                    onClick={() => setActiveTab('kreator')}
                                    className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${activeTab === 'kreator' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <i className="ph-bold ph-magic-wand"></i> Kreator
                                </button>
                                <button 
                                    onClick={() => setActiveTab('dokument')}
                                    className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${activeTab === 'dokument' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <i className="ph-bold ph-file-text"></i> Twój Dokument
                                    {docItems.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-emerald-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full animate-bounce">{docItems.length}</span>
                                    )}
                                </button>
                            </div>

                            <a href={BUY_COFFEE_LINK} target="_blank" className="hidden lg:flex items-center gap-2 bg-slate-800 border border-slate-700 text-amber-400 px-5 py-2.5 rounded-full hover:bg-slate-700 transition-all shadow-lg btn-bounce text-xs font-bold uppercase tracking-wider">
                                <i className="ph-fill ph-coffee text-base"></i> Postaw Kawę
                            </a>
                        </div>
                    </nav>

                    {/* ================================================================= */}
                    {/* WIDOK: KREATOR (Wyszukiwanie, AI, Checklisty)                     */}
                    {/* ================================================================= */}
                    {activeTab === 'kreator' && (
                        <main className="flex-grow max-w-[90rem] w-full mx-auto px-4 sm:px-6 py-8 relative z-10 flex flex-col xl:flex-row gap-8 items-start print-hidden animate-[reveal_0.4s_ease-out]">
                            
                            {/* LEWA KOLUMNA: Wymagania */}
                            <div className="w-full xl:w-7/12 flex flex-col gap-6">
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <div>
                                            <h2 className="text-3xl font-black text-white tracking-tight">Katalog Wymagań</h2>
                                            <p className="text-sm text-slate-400 mt-1">Wybierz wymaganie i dodaj gotowe wpisy do swojego dokumentu.</p>
                                        </div>
                                        <div className="w-full sm:w-48 bg-slate-800 rounded-2xl p-3 border border-slate-700">
                                            <div className="flex justify-between text-xs font-bold mb-1 text-slate-300">
                                                <span>Postęp (Checklista)</span>
                                                <span className="text-blue-400">{progressPercent}%</span>
                                            </div>
                                            <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                                                <div className="bg-blue-500 h-2 rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Przełącznik Stopnia */}
                                    <div className="flex p-1.5 bg-slate-900/80 rounded-2xl mb-8 border border-slate-700/50 relative">
                                        <button onClick={() => { setSelectedPath('mianowany'); setExpandedReqId(AWANS_DATA['mianowany'][0].id); }} className={`flex-1 py-4 text-sm font-black rounded-xl z-10 ${selectedPath === 'mianowany' ? 'text-white' : 'text-slate-500'}`}>Nauczyciel Mianowany</button>
                                        <button onClick={() => { setSelectedPath('dyplomowany'); setExpandedReqId(AWANS_DATA['dyplomowany'][0].id); }} className={`flex-1 py-4 text-sm font-black rounded-xl z-10 ${selectedPath === 'dyplomowany' ? 'text-white' : 'text-slate-500'}`}>Nauczyciel Dyplomowany</button>
                                        <div className={`absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-blue-600 rounded-xl transition-transform duration-300 ${selectedPath === 'mianowany' ? 'translate-x-0' : 'translate-x-[calc(100%+6px)]'}`}></div>
                                    </div>

                                    {/* Akordeon Wymagań */}
                                    <div className="space-y-4">
                                        {requirements.map((req) => {
                                            const isExpanded = expandedReqId === req.id;
                                            return (
                                                <div key={req.id} className={`border rounded-2xl transition-all overflow-hidden ${isExpanded ? 'bg-slate-800/80 border-blue-500/50 shadow-lg' : 'bg-slate-900/40 border-slate-700/50 hover:border-slate-600'}`}>
                                                    <button onClick={() => setExpandedReqId(isExpanded ? null : req.id)} className="w-full flex items-center justify-between p-5 text-left focus:outline-none">
                                                        <div className="flex items-center gap-4">
                                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${isExpanded ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}><i className={`${req.icon} text-2xl`}></i></div>
                                                            <div>
                                                                <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{req.law}</div>
                                                                <div className={`font-bold leading-snug ${isExpanded ? 'text-white' : 'text-slate-300'}`}>{req.title}</div>
                                                            </div>
                                                        </div>
                                                        <i className={`ph-bold ph-caret-down text-xl text-slate-500 transition-transform ${isExpanded ? 'rotate-180 text-blue-400' : ''}`}></i>
                                                    </button>

                                                    {isExpanded && (
                                                        <div className="px-5 pb-6 pt-2 border-t border-slate-700/50 bg-slate-900/50">
                                                            
                                                            {/* Checklista */}
                                                            <div className="mb-6">
                                                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-bold ph-check-square"></i> Pomysły na działania (Odhacz zrobione):</h4>
                                                                <div className="space-y-2">
                                                                    {req.checklist.map(task => {
                                                                        const isChecked = checkedTasks.includes(task.id);
                                                                        return (
                                                                            <div key={task.id} className="flex items-center justify-between p-3 rounded-xl border bg-slate-800/40 border-slate-700/50 group">
                                                                                <div onClick={() => toggleTask(task.id)} className="flex items-center gap-3 cursor-pointer flex-grow">
                                                                                    <div className={`w-5 h-5 rounded flex items-center justify-center border ${isChecked ? 'bg-blue-500 border-blue-500 text-white' : 'bg-slate-900 border-slate-600 text-transparent'}`}><i className="ph-bold ph-check text-xs"></i></div>
                                                                                    <div className={`text-sm ${isChecked ? 'text-slate-400 line-through' : 'text-slate-200'}`}>{task.text}</div>
                                                                                </div>
                                                                                {/* Dodawanie do dokumentu prosto z checklisty */}
                                                                                <button onClick={() => handleAddToDocument(task.text, req.title)} className="text-xs font-bold text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg transition-colors border border-blue-500/20 whitespace-nowrap opacity-0 group-hover:opacity-100 flex items-center gap-1"><i className="ph-bold ph-plus"></i> Do dok.</button>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>

                                                            {/* Gotowe Wpisy */}
                                                            <div className="mb-2 border-t border-slate-700/50 pt-4">
                                                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-bold ph-books"></i> Gotowe wpisy (Skopiuj do dokumentu):</h4>
                                                                {req.examples.map((ex, idx) => (
                                                                    <div key={idx} className="bg-slate-800/40 border border-slate-700 rounded-xl p-4 mb-3">
                                                                        <div className="font-bold text-white mb-3">{ex.name}</div>
                                                                        <div className="grid grid-cols-1 gap-4">
                                                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                                                                                <div className="text-[10px] text-amber-400 uppercase font-black mb-2 flex justify-between">
                                                                                    Sprawozdanie: 
                                                                                    <button onClick={() => handleAddToDocument(ex.report, req.title)} className="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1"><i className="ph-bold ph-file-plus"></i> Dodaj do dokumentu</button>
                                                                                </div>
                                                                                <p className="text-sm text-slate-300">{ex.report}</p>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA: AI Generator */}
                            <div className="w-full xl:w-5/12 flex flex-col gap-6 sticky top-24">
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8 relative border border-purple-500/30">
                                    <div className="absolute top-0 right-0 p-8 opacity-[0.03] pointer-events-none"><i className="ph-fill ph-brain text-9xl text-purple-500"></i></div>
                                    <div className="relative z-10">
                                        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest mb-4 bg-purple-500/20 text-purple-400 border border-purple-500/30">
                                            <i className="ph-fill ph-sparkle"></i> Tłumacz AI
                                        </div>
                                        <h2 className="text-2xl font-black text-white mb-2 tracking-tight">Kreator Akapitów</h2>
                                        <p className="text-slate-400 text-sm mb-6">Napisz prosto co zrobiłeś, a AI zamieni to w oficjalny tekst, który będziesz mógł od razu edytować i dodać do dokumentu.</p>

                                        <div className="space-y-4">
                                            <textarea 
                                                value={aiInput} onChange={(e) => setAiInput(e.target.value)}
                                                placeholder="Np. zorganizowałem wycieczkę do teatru dla klasy 4..."
                                                className="w-full h-24 bg-slate-900/80 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-purple-500 transition-colors shadow-inner text-sm custom-scrollbar"
                                            ></textarea>

                                            <button 
                                                onClick={generateAIText} disabled={isGenerating || !aiInput.trim()}
                                                className="w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 disabled:opacity-50 text-white py-3.5 rounded-xl font-bold btn-bounce flex items-center justify-center gap-2"
                                            >
                                                {isGenerating ? <div className="loader"></div> : <><i className="ph-bold ph-magic-wand text-lg"></i> Wygeneruj tekst</>}
                                            </button>

                                            {/* Wynik AI - EDYTOWALNY! */}
                                            {aiOutput && (
                                                <div className="mt-6 border-t border-slate-700/50 pt-6 animate-[reveal_0.3s_ease-out]">
                                                    <label className="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-2">Wygenerowany Tekst (Możesz go poprawić!):</label>
                                                    <textarea 
                                                        value={aiOutput} onChange={(e) => setAiOutput(e.target.value)}
                                                        className="w-full h-40 bg-purple-900/10 border border-purple-500/50 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-purple-400 text-sm leading-relaxed custom-scrollbar mb-4 resize-y"
                                                    ></textarea>
                                                    
                                                    <button 
                                                        onClick={() => handleAddToDocument(aiOutput)}
                                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 btn-bounce shadow-lg"
                                                    >
                                                        <i className="ph-bold ph-file-plus text-lg"></i> Dodaj tekst do Mój Dokument
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* ================================================================= */}
                    {/* WIDOK: TWÓJ DOKUMENT (Edytor typu WYSIWYG przed wydrukiem)        */}
                    {/* ================================================================= */}
                    {activeTab === 'dokument' && (
                        <main className="flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 relative z-10 print-hidden animate-[reveal_0.4s_ease-out]">
                            
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h2 className="text-3xl font-black text-white">Zbudowany Dokument</h2>
                                    <p className="text-slate-400 text-sm mt-1">Tutaj możesz poprawić wszystkie teksty i wydrukować gotowe sprawozdanie.</p>
                                </div>
                                <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg btn-bounce text-sm uppercase tracking-wider flex items-center gap-2">
                                    <i className="ph-bold ph-printer text-xl"></i> Drukuj PDF
                                </button>
                            </div>

                            <div className="bg-slate-100 rounded-sm shadow-2xl p-6 md:p-16 min-h-[1056px] text-slate-900 font-serif relative">
                                <div className="border-b-2 border-slate-900 pb-4 mb-8 text-center">
                                    <h1 className="text-3xl font-bold uppercase tracking-wider">Sprawozdanie Zawodowe</h1>
                                    <p className="text-lg text-slate-600 mt-2">Dostosuj zawartość poniżej</p>
                                </div>

                                {docItems.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-20 border-2 border-dashed border-slate-300 p-10 rounded-xl">
                                        <i className="ph-duotone ph-file-dashed text-6xl mb-4"></i>
                                        <p className="text-lg font-bold">Twój dokument jest pusty!</p>
                                        <p className="text-sm">Przejdź do zakładki "Kreator", aby wygenerować i dodać pierwsze akapity.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-8">
                                        {docItems.map((item, index) => (
                                            <div key={item.id} className="relative group p-4 border border-transparent hover:border-slate-300 hover:bg-white rounded-lg transition-colors">
                                                
                                                {/* Przycisk Usuń (widoczny tylko po najechaniu) */}
                                                <button 
                                                    onClick={() => removeDocItem(item.id)}
                                                    className="absolute -left-3 -top-3 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md"
                                                    title="Usuń ten wpis"
                                                >
                                                    <i className="ph-bold ph-trash"></i>
                                                </button>

                                                {/* Edytowalny Nagłówek Sekcji */}
                                                <input 
                                                    type="text" 
                                                    value={item.section} 
                                                    onChange={(e) => updateDocItem(item.id, 'section', e.target.value)}
                                                    className="w-full font-bold text-xl mb-3 border-b border-transparent hover:border-slate-300 focus:border-blue-500 outline-none bg-transparent"
                                                    placeholder="Nazwa Wymagania / Sekcji"
                                                />
                                                
                                                {/* Edytowalny Tekst (Textarea z automatycznym dopasowaniem wysokości do minimum) */}
                                                <textarea 
                                                    value={item.text} 
                                                    onChange={(e) => updateDocItem(item.id, 'text', e.target.value)}
                                                    className="w-full min-h-[120px] resize-y text-justify leading-relaxed border border-transparent hover:border-slate-300 focus:border-blue-500 outline-none bg-transparent p-2 rounded"
                                                    placeholder="Wpisz lub popraw tekst sprawozdania..."
                                                ></textarea>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {/* Przycisk dodawania pustego bloku bezpośrednio w dokumencie */}
                                <button 
                                    onClick={() => handleAddToDocument("", "Nowy Nagłówek Własny")}
                                    className="mt-10 w-full py-4 border-2 border-dashed border-slate-300 text-slate-500 font-bold hover:bg-slate-200 hover:text-slate-700 transition-colors rounded-xl flex items-center justify-center gap-2"
                                >
                                    <i className="ph-bold ph-plus"></i> Dodaj pusty akapit do napisania
                                </button>
                            </div>
                        </main>
                    )}

                    {/* ================================================================= */}
                    {/* WIDOK: TYLKO DO DRUKU (@media print)                              */}
                    {/* ================================================================= */}
                    {/* Ta sekcja wyświetla się fizycznie TYLKO na podglądzie wydruku     */}
                    {/* Rozwiązuje to problem nachodzących na siebie linii (break-inside) */}
                    
                    <div className="hidden print-only">
                        <div className="text-center mb-10 border-b-2 border-black pb-4 print-break-avoid">
                            <h1 className="uppercase tracking-wider">Sprawozdanie z realizacji planu rozwoju zawodowego</h1>
                            <p className="mt-1">Nauczyciel {selectedPath === 'mianowany' ? 'Mianowany' : 'Dyplomowany'}</p>
                        </div>

                        {docItems.length === 0 ? (
                            <p className="italic text-center text-gray-500">Brak dodanych treści.</p>
                        ) : (
                            docItems.map((item, index) => (
                                <div key={`print-${item.id}`} className="mb-6 print-break-avoid">
                                    <h2 className="mb-3">{index + 1}. {item.section}</h2>
                                    <p className="whitespace-pre-wrap">{item.text}</p>
                                </div>
                            ))
                        )}
                        
                        {/* Miejsce na podpisy */}
                        <div className="signatures print-break-avoid">
                            <div>
                                <p>....................................................</p>
                                <p className="text-sm">(Miejscowość i data)</p>
                            </div>
                            <div>
                                <p>....................................................</p>
                                <p className="text-sm">(Podpis nauczyciela)</p>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduAwansApp />);
    </script>
</body>
</html>
