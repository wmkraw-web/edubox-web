        function EduAwansApp() {
            // --- STATE APLIKACJI ---
            const [activeTab, setActiveTab] = useState('kreator');
            const [selectedPath, setSelectedPath] = useState('mianowany');
            const [expandedReqId, setExpandedReqId] = useState('m1');
            const [checkedTasks, setCheckedTasks] = useState([]);
            
            // --- STATE DOKUMENTU ---
            const [docItems, setDocItems] = useState([]); 
            
            // --- STATE AI GENERATORA ---
            const [aiInput, setAiInput] = useState('');
            const [aiOutput, setAiOutput] = useState('');
            const [aiCategory, setAiCategory] = useState('sprawozdanie'); // sprawozdanie | plan | wniosek
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // --- FUNKCJE ---
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const toggleTask = (taskId) => {
                if (checkedTasks.includes(taskId)) {
                    setCheckedTasks(checkedTasks.filter(id => id !== taskId));
                } else {
                    setCheckedTasks([...checkedTasks, taskId]);
                }
            };

            // Dokument wirtualny
            const handleAddToDocument = (textToInsert, forcedSectionName = null) => {
                const activeReq = AWANS_DATA[selectedPath].find(r => r.id === expandedReqId);
                const sectionTitle = forcedSectionName || (activeReq ? activeReq.title : "Nowy nagłówek");
                setDocItems([...docItems, { id: Date.now(), section: sectionTitle, text: textToInsert }]);
                showToast("✅ Dodano do Twojego dokumentu!");
            };

            const updateDocItem = (id, field, value) => {
                setDocItems(docItems.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const removeDocItem = (id) => {
                if(window.confirm("Na pewno usunąć ten fragment dokumentu?")) {
                    setDocItems(docItems.filter(item => item.id !== id));
                }
            };

            // Kopiowanie całego dokumentu do schowka
            const copyEntireDocument = () => {
                if(docItems.length === 0) return showToast("⚠️ Dokument jest pusty!");
                let textToCopy = `SPRAWOZDANIE Z REALIZACJI PLANU ROZWOJU ZAWODOWEGO\nŚcieżka: Nauczyciel ${selectedPath === 'mianowany' ? 'Mianowany' : 'Dyplomowany'}\n\n`;
                docItems.forEach((item, index) => {
                    textToCopy += `${index + 1}. ${item.section}\n${item.text}\n\n`;
                });
                navigator.clipboard.writeText(textToCopy);
                showToast("✅ Cały dokument skopiowany do schowka!");
            };

            // --- POŁĄCZENIE Z AI PRZEZ VERCEL (OPENAI BACKEND) ---
            const generateAIText = async () => {
                if (!aiInput.trim()) return;
                setIsGenerating(true);
                setAiOutput('');

                // Tworzymy mądry, dedykowany prompt na podstawie wybranej z listy kategorii
                let contextInstruction = "";
                if (aiCategory === "sprawozdanie") {
                    contextInstruction = "Zamień to na rozbudowany, piękny urzędowy akapit do Sprawozdania z Awansu. Używaj czasu przeszłego (np. 'Zorganizowałem/am'). Użyj profesjonalnego żargonu pedagogicznego.";
                } else if (aiCategory === "plan") {
                    contextInstruction = "Zamień to na krótki, zwięzły cel operacyjny do Planu Rozwoju Zawodowego. Używaj bezokoliczników (np. 'Zorganizowanie', 'Nawiązanie', 'Wdrożenie').";
                } else if (aiCategory === "wniosek") {
                    contextInstruction = "Napisz na podstawie tego refleksyjny Wniosek/Ewaluację dla nauczyciela (np. 'Podjęte działania sprawiły, że...', 'Dzięki temu proces nauczania stał się...').";
                }

                const prompt = `Jesteś ekspertem ds. awansu zawodowego nauczycieli w Polsce. ${contextInstruction} \n\nSzkic od nauczyciela: "${aiInput}"`;

                try {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: prompt })
                    });
                    
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Błąd generowania tekstu. Sprawdź plik api/gemini.js.";
                    setAiOutput(text);
                } catch (error) {
                    console.error("Backend Error:", error);
                    setAiOutput("Wystąpił błąd podczas łączenia z serwerem. Upewnij się, że masz poprawnie skonfigurowany plik backendu.");
                } finally {
                    setIsGenerating(false);
                }
            };

            // Obliczanie statystyk
            const requirements = AWANS_DATA[selectedPath];
            const allChecklistItems = requirements.flatMap(req => req.checklist);
            const totalTasks = allChecklistItems.length;
            const completedTasks = allChecklistItems.filter(task => checkedTasks.includes(task.id)).length;
            const progressPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            
            const totalWords = docItems.reduce((acc, item) => acc + (item.text.match(/\b[-?a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\b/gi) || []).length, 0);

            // Magiczne pigułki (podpowiedzi dla AI)
            const aiPills = [
                "Gazetki w klasie", "Rozmowy z rodzicami", "Udział w webinarach", "Rozwiązanie kłótni", "Sprawdziany"
            ];

            return (
                <div className="min-h-screen relative flex flex-col pb-10">
                    <div className="hero-glow print-hidden"></div>

                    {/* Powiadomienia (Toast) */}
                    <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 print-hidden ${toastMessage ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                        <i className="ph-bold ph-check-circle text-xl"></i> {toastMessage}
                    </div>

                    {/* Nawigacja */}
                    <nav className="w-full z-[100] glass-nav print-hidden sticky top-0">
                        <div className="max-w-[90rem] mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                                    <i className="ph-bold ph-graduation-cap text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduAwans<span className="text-blue-500">PRO MAX</span></span>
                            </div>
                            
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50">
                                <button onClick={() => setActiveTab('kreator')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${activeTab === 'kreator' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-magic-wand"></i> Baza & AI
                                </button>
                                <button onClick={() => setActiveTab('dokument')} className={`px-6 py-2 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${activeTab === 'dokument' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-file-text"></i> Dokument
                                    {docItems.length > 0 && <span className="absolute -top-1 -right-1 bg-emerald-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full animate-bounce">{docItems.length}</span>}
                                </button>
                            </div>

                            <a href={BUY_COFFEE_LINK} target="_blank" className="hidden lg:flex items-center gap-2 bg-slate-800 border border-slate-700 text-amber-400 px-5 py-2.5 rounded-full hover:bg-slate-700 transition-all shadow-lg btn-bounce text-xs font-bold uppercase tracking-wider">
                                <i className="ph-fill ph-coffee text-base"></i> Postaw Kawę
                            </a>
                        </div>
                    </nav>

                    {/* ================================================================= */}
                    {/* ZAKŁADKA 1: KREATOR (Baza wymagań + AI Generator)                 */}
                    {/* ================================================================= */}
                    {activeTab === 'kreator' && (
                        <main className="flex-grow max-w-[90rem] w-full mx-auto px-4 sm:px-6 py-8 relative z-10 flex flex-col xl:flex-row gap-8 items-start print-hidden animate-[reveal_0.4s_ease-out]">
                            
                            {/* LEWA KOLUMNA: Baza i Akordeon */}
                            <div className="w-full xl:w-7/12 flex flex-col gap-6">
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <div>
                                            <h2 className="text-3xl font-black text-white tracking-tight">Katalog Wymagań</h2>
                                            <p className="text-sm text-slate-400 mt-1">Wybierz wymaganie i dodaj gotowe wpisy do dokumentu.</p>
                                        </div>
                                        <div className="w-full sm:w-48 bg-slate-800 rounded-2xl p-3 border border-slate-700">
                                            <div className="flex justify-between text-xs font-bold mb-1 text-slate-300">
                                                <span>Checklista</span>
                                                <span className="text-blue-400">{progressPercent}%</span>
                                            </div>
                                            <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden"><div className="bg-blue-500 h-2 rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div></div>
                                        </div>
                                    </div>

                                    {/* Przełącznik Stopnia */}
                                    <div className="flex p-1.5 bg-slate-900/80 rounded-2xl mb-8 border border-slate-700/50 relative">
                                        <button onClick={() => { setSelectedPath('mianowany'); setExpandedReqId(AWANS_DATA['mianowany'][0].id); }} className={`flex-1 py-4 text-sm font-black rounded-xl z-10 ${selectedPath === 'mianowany' ? 'text-white' : 'text-slate-500 hover:text-slate-300'}`}>Nauczyciel Mianowany</button>
                                        <button onClick={() => { setSelectedPath('dyplomowany'); setExpandedReqId(AWANS_DATA['dyplomowany'][0].id); }} className={`flex-1 py-4 text-sm font-black rounded-xl z-10 ${selectedPath === 'dyplomowany' ? 'text-white' : 'text-slate-500 hover:text-slate-300'}`}>Nauczyciel Dyplomowany</button>
                                        <div className={`absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-blue-600 rounded-xl transition-transform duration-300 ${selectedPath === 'mianowany' ? 'translate-x-0' : 'translate-x-[calc(100%+6px)]'}`}></div>
                                    </div>

                                    {/* Akordeon Wymagań */}
                                    <div className="space-y-4">
                                        {requirements.map((req) => {
                                            const isExpanded = expandedReqId === req.id;
                                            return (
                                                <div key={req.id} className={`border rounded-2xl transition-all overflow-hidden ${isExpanded ? 'bg-slate-800/80 border-blue-500/50 shadow-lg' : 'bg-slate-900/40 border-slate-700/50 hover:border-slate-600'}`}>
                                                    <button onClick={() => setExpandedReqId(isExpanded ? null : req.id)} className="w-full flex items-center justify-between p-5 text-left focus:outline-none">
                                                        <div className="flex items-center gap-4">
                                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${isExpanded ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}><i className={`${req.icon} text-2xl`}></i></div>
                                                            <div>
                                                                <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{req.law}</div>
                                                                <div className={`font-bold leading-snug ${isExpanded ? 'text-white' : 'text-slate-300'}`}>{req.title}</div>
                                                            </div>
                                                        </div>
                                                        <i className={`ph-bold ph-caret-down text-xl text-slate-500 transition-transform ${isExpanded ? 'rotate-180 text-blue-400' : ''}`}></i>
                                                    </button>

                                                    {isExpanded && (
                                                        <div className="px-5 pb-6 pt-2 border-t border-slate-700/50 bg-slate-900/50">
                                                            {/* Checklista */}
                                                            <div className="mb-6">
                                                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-bold ph-check-square"></i> Pomysły na działania (Checklista):</h4>
                                                                <div className="space-y-2">
                                                                    {req.checklist.map(task => {
                                                                        const isChecked = checkedTasks.includes(task.id);
                                                                        return (
                                                                            <div key={task.id} className="flex items-center justify-between p-3 rounded-xl border bg-slate-800/40 border-slate-700/50 group">
                                                                                <div onClick={() => toggleTask(task.id)} className="flex items-center gap-3 cursor-pointer flex-grow">
                                                                                    <div className={`w-5 h-5 rounded flex items-center justify-center border ${isChecked ? 'bg-blue-500 border-blue-500 text-white' : 'bg-slate-900 border-slate-600 text-transparent'}`}><i className="ph-bold ph-check text-xs"></i></div>
                                                                                    <div className={`text-sm ${isChecked ? 'text-slate-400 line-through' : 'text-slate-200'}`}>{task.text}</div>
                                                                                </div>
                                                                                <button onClick={() => handleAddToDocument(task.text, "Zadanie z checklisty")} className="text-xs font-bold text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg transition-colors border border-blue-500/20 whitespace-nowrap opacity-0 group-hover:opacity-100 flex items-center gap-1"><i className="ph-bold ph-plus"></i> Do dok.</button>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>

                                                            {/* Gotowce */}
                                                            <div className="border-t border-slate-700/50 pt-4">
                                                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i className="ph-bold ph-books"></i> Pełne wpisy (Do dodania):</h4>
                                                                {req.examples.map((ex, idx) => (
                                                                    <div key={idx} className="bg-slate-800/40 border border-slate-700 rounded-xl p-4 mb-4">
                                                                        <div className="font-bold text-white mb-3 text-sm">{ex.name}</div>
                                                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col justify-between">
                                                                                <div>
                                                                                    <div className="text-[10px] text-emerald-400 uppercase font-black mb-2 flex items-center gap-1"><i className="ph-fill ph-file-text"></i> Do Planu Rozwoju</div>
                                                                                    <p className="text-sm text-slate-400 italic mb-3">{ex.plan}</p>
                                                                                </div>
                                                                                <button onClick={() => handleAddToDocument(ex.plan, ex.name + " (Plan Rozwoju)")} className="text-xs text-blue-400 hover:text-blue-300 self-start font-bold"><i className="ph-bold ph-file-plus"></i> Dodaj do dokumentu</button>
                                                                            </div>
                                                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col justify-between">
                                                                                <div>
                                                                                    <div className="text-[10px] text-amber-400 uppercase font-black mb-2 flex items-center gap-1"><i className="ph-fill ph-file-text"></i> Do Sprawozdania</div>
                                                                                    <p className="text-sm text-slate-300 mb-3">{ex.report}</p>
                                                                                </div>
                                                                                <button onClick={() => handleAddToDocument(ex.report, ex.name)} className="text-xs text-blue-400 hover:text-blue-300 self-start font-bold"><i className="ph-bold ph-file-plus"></i> Dodaj do dokumentu</button>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA: Ulepszony AI Generator */}
                            <div className="w-full xl:w-5/12 flex flex-col gap-6 sticky top-24">
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8 relative border border-purple-500/30">
                                    <div className="absolute top-0 right-0 p-8 opacity-[0.03] pointer-events-none"><i className="ph-fill ph-brain text-9xl text-purple-500"></i></div>
                                    <div className="relative z-10">
                                        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest mb-4 bg-purple-500/20 text-purple-400 border border-purple-500/30">
                                            <i className="ph-fill ph-sparkle"></i> Kreator Akapitów AI
                                        </div>
                                        <h2 className="text-2xl font-black text-white mb-2 tracking-tight">Osobisty Tłumacz</h2>
                                        <p className="text-slate-400 text-sm mb-6">Napisz swoimi słowami, a AI przetłumaczy to na język kuratoryjny.</p>

                                        <div className="space-y-4">
                                            {/* ZMIANA: Dodano wybór kontekstu dla AI */}
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Co dokładnie piszemy?</label>
                                                <select value={aiCategory} onChange={(e) => setAiCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 focus:outline-none focus:border-purple-500 text-sm">
                                                    <option value="sprawozdanie">Rozbudowany akapit do Sprawozdania</option>
                                                    <option value="plan">Zwięzły cel do Planu Rozwoju (bezokoliczniki)</option>
                                                    <option value="wniosek">Refleksja / Wniosek podsumowujący działania</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Szkic działania:</label>
                                                <textarea 
                                                    value={aiInput} onChange={(e) => setAiInput(e.target.value)}
                                                    placeholder="Wpisz np. 'pomagałem słabszym uczniom robiąc łatwiejsze sprawdziany'..."
                                                    className="w-full h-24 bg-slate-900/80 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-purple-500 transition-colors shadow-inner text-sm custom-scrollbar"
                                                ></textarea>
                                                
                                                {/* ZMIANA: Szablony - Szybkie podpowiedzi */}
                                                <div className="flex flex-wrap gap-2 mt-3">
                                                    {aiPills.map(pill => (
                                                        <button key={pill} onClick={() => setAiInput(pill)} className="text-[10px] uppercase font-bold tracking-wider bg-slate-800 hover:bg-purple-900 text-slate-400 hover:text-purple-300 px-3 py-1.5 rounded-full border border-slate-700 transition-colors">
                                                            {pill}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <button 
                                                onClick={generateAIText} disabled={isGenerating || !aiInput.trim()}
                                                className="w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 disabled:opacity-50 text-white py-3.5 rounded-xl font-bold btn-bounce flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(168,85,247,0.3)] mt-2"
                                            >
                                                {isGenerating ? <div className="loader"></div> : <><i className="ph-bold ph-magic-wand text-lg"></i> Zredaguj profesjonalnie</>}
                                            </button>

                                            {/* Wynik AI - EDYTOWALNY */}
                                            {aiOutput && (
                                                <div className="mt-6 border-t border-slate-700/50 pt-6 animate-[reveal_0.3s_ease-out]">
                                                    <label className="text-xs font-bold text-purple-400 uppercase tracking-widest block mb-2">Wynik (Możesz go poprawić przed dodaniem):</label>
                                                    <textarea 
                                                        value={aiOutput} onChange={(e) => setAiOutput(e.target.value)}
                                                        className="w-full min-h-[160px] bg-purple-900/10 border border-purple-500/50 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-purple-400 text-sm leading-relaxed custom-scrollbar mb-4 resize-y"
                                                    ></textarea>
                                                    
                                                    <button 
                                                        onClick={() => handleAddToDocument(aiOutput, "Opis działania")}
                                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 btn-bounce shadow-lg"
                                                    >
                                                        <i className="ph-bold ph-file-plus text-lg"></i> Dodaj do 'Twój Dokument'
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* ================================================================= */}
                    {/* ZAKŁADKA 2: TWÓJ DOKUMENT (Edytor i przygotowanie do druku)       */}
                    {/* ================================================================= */}
                    {activeTab === 'dokument' && (
                        <main className="flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 relative z-10 print-hidden animate-[reveal_0.4s_ease-out]">
                            
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
                                <div>
                                    <h2 className="text-3xl font-black text-white">Zbudowany Dokument</h2>
                                    <p className="text-slate-400 text-sm mt-1">Popraw wygenerowane teksty i eksportuj sprawozdanie.</p>
                                    {/* Statystyki */}
                                    {docItems.length > 0 && (
                                        <div className="flex gap-4 mt-3">
                                            <span className="text-xs font-bold bg-slate-800 text-blue-400 px-3 py-1 rounded-full"><i className="ph-bold ph-text-align-left"></i> Słów: {totalWords}</span>
                                            <span className="text-xs font-bold bg-slate-800 text-purple-400 px-3 py-1 rounded-full"><i className="ph-bold ph-list-numbers"></i> Akapitów: {docItems.length}</span>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                                    <button onClick={copyEntireDocument} className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl font-bold transition-all border border-slate-600 btn-bounce text-sm flex items-center justify-center gap-2">
                                        <i className="ph-bold ph-copy text-xl"></i> Kopiuj Całość
                                    </button>
                                    <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(16,185,129,0.4)] btn-bounce text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                                        <i className="ph-bold ph-printer text-xl"></i> Drukuj PDF
                                    </button>
                                </div>
                            </div>

                            <div className="bg-slate-100 rounded-sm shadow-2xl p-6 md:p-16 min-h-[1056px] text-slate-900 font-serif relative border border-slate-300">
                                <div className="border-b-2 border-slate-900 pb-4 mb-8 text-center">
                                    <h1 className="text-3xl font-bold uppercase tracking-wider">Sprawozdanie Zawodowe</h1>
                                    <p className="text-lg text-slate-600 mt-2">Dostosuj zawartość poniżej</p>
                                </div>

                                {docItems.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-20 border-2 border-dashed border-slate-300 p-10 rounded-xl">
                                        <i className="ph-duotone ph-file-dashed text-6xl mb-4"></i>
                                        <p className="text-lg font-bold text-slate-600">Twój dokument jest pusty!</p>
                                        <p className="text-sm mt-2">Wróć do zakładki "Kreator", aby wygenerować i ułożyć pierwsze akapity.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-8">
                                        {docItems.map((item, index) => (
                                            <div key={item.id} className="relative group p-4 border border-transparent hover:border-slate-300 hover:bg-white hover:shadow-sm rounded-lg transition-all">
                                                
                                                <button 
                                                    onClick={() => removeDocItem(item.id)}
                                                    className="absolute -left-3 -top-3 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md z-10"
                                                    title="Usuń ten wpis"
                                                >
                                                    <i className="ph-bold ph-trash"></i>
                                                </button>

                                                <input 
                                                    type="text" 
                                                    value={item.section} 
                                                    onChange={(e) => updateDocItem(item.id, 'section', e.target.value)}
                                                    className="w-full font-bold text-xl mb-3 border-b border-transparent hover:border-slate-300 focus:border-blue-500 outline-none bg-transparent"
                                                    placeholder="Tytuł Wymagania / Sekcji"
                                                />
                                                
                                                <textarea 
                                                    value={item.text} 
                                                    onChange={(e) => updateDocItem(item.id, 'text', e.target.value)}
                                                    className="w-full min-h-[150px] resize-y text-justify leading-relaxed border border-transparent hover:border-slate-300 focus:border-blue-500 outline-none bg-transparent p-2 rounded custom-scrollbar"
                                                    placeholder="Treść sprawozdania..."
                                                ></textarea>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <button 
                                    onClick={() => handleAddToDocument("", "Własny nowy punkt")}
                                    className="mt-10 w-full py-4 border-2 border-dashed border-slate-300 text-slate-500 font-bold hover:bg-slate-200 hover:text-slate-700 transition-colors rounded-xl flex items-center justify-center gap-2"
                                >
                                    <i className="ph-bold ph-plus"></i> Dodaj pusty blok tekstowy
                                </button>
                            </div>
                        </main>
                    )}

                    {/* ================================================================= */}
                    {/* WIDOK: TYLKO DO DRUKU (@media print)                              */}
                    {/* ================================================================= */}
                    <div className="hidden print-only">
                        <div className="text-center mb-10 border-b-2 border-black pb-4 print-break-avoid">
                            <h1 className="uppercase tracking-wider">Sprawozdanie z realizacji planu rozwoju zawodowego</h1>
                            <p className="mt-1">Nauczyciel {selectedPath === 'mianowany' ? 'Mianowany' : 'Dyplomowany'}</p>
                        </div>

                        {docItems.length === 0 ? (
                            <p className="italic text-center text-gray-500">Brak dodanych treści do wydruku.</p>
                        ) : (
                            docItems.map((item, index) => (
                                <div key={`print-${item.id}`} className="mb-6 print-break-avoid">
                                    <h2 className="mb-3">{index + 1}. {item.section}</h2>
                                    <p className="whitespace-pre-wrap">{item.text}</p>
                                </div>
                            ))
                        )}
                        
                        <div className="signatures print-break-avoid">
                            <div>
                                <p>....................................................</p>
                                <p className="text-sm">(Miejscowość i data)</p>
                            </div>
                            <div>
                                <p>....................................................</p>
                                <p className="text-sm">(Podpis nauczyciela)</p>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EduAwansApp />);
    </script>
</body>
</html>
