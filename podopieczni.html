<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teczka podopiecznych — EduBox</title>
    <meta name="description" content="Prywatna, zaszyfrowana teczka podopiecznych przedszkola specjalnego. Dane tylko na tym komputerze.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <!-- PRYWATNE NARZĘDZIE (21.10.2026). Dane dzieci są wyłącznie w tej przeglądarce, zaszyfrowane hasłem
         (podopieczni-core.js). Celowo bez analityki, bazy w chmurze, wspólnego skryptu i menu EduBox – nic nie
         może wysyłać danych w tle (pilnuje tego scripts/check-podopieczni.js). Do AI (/api/chat) idzie tylko
         anonimowy opis, widoczny przed wysłaniem. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>
    <script src="/asystent-dokumenty.js"></script>
    <script src="/doc-tools.js"></script>
    <script src="/sos-porady.js"></script>
    <script src="/tekst-jakosc.js"></script>
    <script src="/podopieczni-core.js"></script>
    <link rel="stylesheet" href="/doc-paper.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        .field { width: 100%; background: #0b1220; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #e2e8f0; outline: none; }
        .field:focus { border-color: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.15); }
        textarea.field { resize: vertical; min-height: 84px; line-height: 1.5; }
        .lbl { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px; border-radius: 12px; padding: 10px 16px; transition: background .15s, opacity .15s; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-main { background: #34d399; color: #052e1c; } .btn-main:hover:not(:disabled) { background: #6ee7b7; }
        .btn-soft { background: #1e293b; color: #e2e8f0; } .btn-soft:hover:not(:disabled) { background: #334155; }
        .btn-danger { background: transparent; color: #fca5a5; border: 1px solid #7f1d1d; } .btn-danger:hover { background: #450a0a; }
        .tab { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #94a3b8; white-space: nowrap; }
        .tab[aria-pressed="true"] { background: #34d399; color: #052e1c; }
        .tag-local { color: #fcd34d; } .tag-ai { color: #6ee7b7; }
        .doc-paper mark { background: #fff3a3; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <noscript><p style="padding:24px">Teczka wymaga włączonego JavaScriptu.</p></noscript>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const P = window.EduPodopieczni;
        const AD = window.EduAsystentDocs;
        const DT = window.EduDocTools;
        const SOS = window.EduSosPrompts;

        // Te same modele co w Asystencie Pedagoga: dokumenty urzędowe – najmocniejszy, materiały robocze – szybszy.
        const STRONG_DOCS = ['ipet', 'wopfu', 'opinia', 'gotowosc', 'diagnoza_funkcjonalna', 'ipww', 'ewaluacja_wwrd'];
        const LOCK_MINUTES = 15;
        const IS_LOCAL = location.protocol === 'file:';

        const today = () => new Date().toISOString().slice(0, 10);
        const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const sanitize = (h) => window.DOMPurify ? window.DOMPurify.sanitize(String(h || ''), {
            ALLOWED_TAGS: ['h1', 'h2', 'h3', 'p', 'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'strong', 'em', 'br', 'mark', 'sup', 'sub', 'div', 'span'],
            ALLOWED_ATTR: ['class']
        }) : escapeHtml(h);
        const readStored = () => { try { const r = localStorage.getItem(P.VAULT_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
        const docLabel = (module, id) => ((module === 'wwrd' ? AD.WWRD_DOC_TYPES : AD.DOC_TYPES).find(d => d.id === id) || {}).label || id;
        const fileSafe = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');

        // Ostatnia kontrola tuż przed wysłaniem do AI – jeśli anonimizacja coś przepuściła, nic nie wychodzi.
        function assertNoLeak(text, child) {
            const found = P.leaks(text, child);
            if (found.length) throw new Error('Wysyłka wstrzymana: w tekście dla AI zostało „' + found.join('”, „') + '”. Popraw opis i spróbuj jeszcze raz.');
        }

        // Imię i nazwisko wstawiamy dopiero na kartce, w przeglądarce.
        const fillChild = (html, child) => DT.fillName(html, P.fullName(child)).split('[imię]').join(escapeHtml(child.imie || '[imię]'));

        function downloadJson(obj, name) {
            const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        }

        function readFileJson(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => { try { resolve(JSON.parse(r.result)); } catch (e) { reject(new Error('Plik jest uszkodzony albo to nie jest kopia Teczki.')); } };
                r.onerror = () => reject(new Error('Nie udało się odczytać pliku.'));
                r.readAsText(file);
            });
        }

        const Tag = ({ ai }) => ai
            ? <span className="tag-ai text-[11px] font-bold normal-case tracking-normal ml-1">· do AI bez imion</span>
            : <span className="tag-local text-[11px] font-bold normal-case tracking-normal ml-1">· tylko na tym komputerze</span>;

        function Field({ label, ai, local, children }) {
            return <label className="block"><span className="lbl">{label}{ai ? <Tag ai /> : local ? <Tag /> : null}</span>{children}</label>;
        }

        // ---------- ekrany startowe ----------
        function ImportButton({ onImported, label }) {
            const ref = useRef(null);
            const [err, setErr] = useState('');
            const pick = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                try {
                    const sealed = await readFileJson(f);
                    if (!sealed || sealed.app !== 'edubox-podopieczni' || !sealed.ct) throw new Error('To nie jest kopia Teczki podopiecznych.');
                    if (readStored() && !window.confirm('Wczytanie kopii zastąpi dane zapisane teraz w tej przeglądarce. Kontynuować?')) return;
                    localStorage.setItem(P.VAULT_KEY, JSON.stringify(sealed));
                    setErr('');
                    onImported();
                } catch (x) { setErr(x.message); }
            };
            return (
                <div>
                    <button type="button" className="btn btn-soft w-full" onClick={() => ref.current && ref.current.click()}><i className="ph-bold ph-upload-simple"></i>{label || 'Wczytaj kopię zapasową'}</button>
                    <input ref={ref} type="file" accept=".json,application/json" className="hidden" onChange={pick} />
                    {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
                </div>
            );
        }

        function Setup({ onCreated, onImported }) {
            const [name1, setName1] = useState('');
            const [pw, setPw] = useState('');
            const [pw2, setPw2] = useState('');
            const [name2, setName2] = useState('');
            const [bpw, setBpw] = useState('');
            const [bpw2, setBpw2] = useState('');
            const [ack, setAck] = useState(false);
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const create = async (e) => {
                e.preventDefault();
                setErr('');
                if (pw.length < 8) return setErr('Hasło musi mieć co najmniej 8 znaków.');
                if (pw !== pw2) return setErr('Hasła się różnią.');
                if (bpw || bpw2) {
                    if (bpw.length < 8) return setErr('Hasło zapasowe musi mieć co najmniej 8 znaków.');
                    if (bpw !== bpw2) return setErr('Hasła zapasowe się różnią.');
                    if (bpw === pw) return setErr('Hasło zapasowe musi być inne niż główne.');
                }
                setBusy(true);
                try {
                    let s = await P.createSession(pw, name1.trim() || 'Hasło główne');
                    if (bpw) s = await P.addPassword(s, bpw, name2.trim() || 'Hasło zapasowe');
                    onCreated(s);
                } catch (x) { setErr(x.message); setBusy(false); }
            };
            return (
                <div className="max-w-lg mx-auto px-4 py-12">
                    <div className="text-5xl mb-4">🗂️</div>
                    <h1 className="text-3xl font-black mb-3">Teczka podopiecznych</h1>
                    <p className="text-slate-300 leading-relaxed mb-6">Dane dzieci, dokumenty, terminy i notatki z obserwacji – w jednym miejscu, <strong>tylko na tym komputerze</strong>, zaszyfrowane Twoim hasłem. Dokumenty (IPET, WOPFU, opinia, WWRD) pisze AI, ale dostaje wyłącznie opis bez imion i dat.</p>
                    <form onSubmit={create} className="card p-6 space-y-5">
                        <div className="space-y-3">
                            <h2 className="font-black">1. Hasło codzienne</h2>
                            <Field label="Czyje to hasło"><input className="field" value={name1} onChange={e => setName1(e.target.value)} placeholder="np. Ania" maxLength={40} /></Field>
                            <div className="grid sm:grid-cols-2 gap-3">
                                <Field label="Hasło"><input type="password" autoComplete="new-password" className="field" value={pw} onChange={e => setPw(e.target.value)} placeholder="min. 8 znaków" /></Field>
                                <Field label="Powtórz hasło"><input type="password" autoComplete="new-password" className="field" value={pw2} onChange={e => setPw2(e.target.value)} /></Field>
                            </div>
                        </div>
                        <div className="space-y-3 border-t border-slate-800 pt-4">
                            <h2 className="font-black">2. Hasło zapasowe <span className="text-xs text-emerald-300 font-bold">(zalecane)</span></h2>
                            <p className="text-sm text-slate-400">Drugie hasło do tej samej Teczki – dla osoby, która pomoże, gdy pierwsze się zapomni. Otwiera te same dane.</p>
                            <Field label="Czyje to hasło"><input className="field" value={name2} onChange={e => setName2(e.target.value)} placeholder="np. Witold" maxLength={40} /></Field>
                            <div className="grid sm:grid-cols-2 gap-3">
                                <Field label="Hasło zapasowe"><input type="password" autoComplete="new-password" className="field" value={bpw} onChange={e => setBpw(e.target.value)} placeholder="min. 8 znaków" /></Field>
                                <Field label="Powtórz"><input type="password" autoComplete="new-password" className="field" value={bpw2} onChange={e => setBpw2(e.target.value)} /></Field>
                            </div>
                        </div>
                        <label className="flex gap-3 items-start text-sm text-amber-100 bg-amber-500/10 border border-amber-400/30 rounded-xl p-3">
                            <input type="checkbox" className="mt-1" checked={ack} onChange={e => setAck(e.target.checked)} />
                            <span><strong>Haseł nie da się zresetować.</strong> Nikt – także EduBox – nie odczyta danych bez jednego z nich. Zapiszcie je w bezpiecznym miejscu i regularnie pobierajcie kopię zapasową.</span>
                        </label>
                        {err && <p className="text-sm text-red-300">{err}</p>}
                        <button className="btn btn-main w-full" disabled={!ack || busy}>{busy ? 'Tworzę sejf…' : 'Utwórz Teczkę'}</button>
                    </form>
                    <div className="mt-4"><ImportButton onImported={onImported} label="Mam już kopię – wczytaj ją" /></div>
                </div>
            );
        }

        function Locked({ onOpened, onImported }) {
            const [pw, setPw] = useState('');
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const unlock = async (e) => {
                e.preventDefault();
                setBusy(true); setErr('');
                try {
                    const res = await P.open(readStored(), pw);
                    onOpened(res.data, res.session, res.migrated);
                } catch (x) { setErr(x.message); setBusy(false); }
            };
            return (
                <div className="max-w-md mx-auto px-4 py-16">
                    <div className="text-5xl mb-4">🔒</div>
                    <h1 className="text-3xl font-black mb-2">Teczka podopiecznych</h1>
                    <p className="text-slate-400 mb-6">Teczka jest zablokowana. Wpisz swoje hasło (codzienne albo zapasowe).</p>
                    <form onSubmit={unlock} className="card p-6 space-y-4">
                        <input type="password" autoFocus autoComplete="current-password" className="field" value={pw} onChange={e => setPw(e.target.value)} placeholder="Hasło do Teczki" />
                        {err && <p className="text-sm text-red-300">{err}</p>}
                        <button className="btn btn-main w-full" disabled={busy || !pw}>{busy ? 'Otwieram…' : 'Otwórz'}</button>
                    </form>
                    <div className="mt-4"><ImportButton onImported={onImported} /></div>
                </div>
            );
        }

        // ---------- kartka dokumentu ----------
        function Paper({ html, editable, streaming, paperRef }) {
            return <div ref={paperRef} contentEditable={!!editable && !streaming} suppressContentEditableWarning={true}
                className={'doc-paper outline-none focus:ring-2 focus:ring-emerald-400 ' + (streaming ? 'doc-caret' : '')}
                dangerouslySetInnerHTML={{ __html: sanitize(html) }} />;
        }

        function ExportBar({ getHtml, filename, title, extra }) {
            const [msg, setMsg] = useState('');
            const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 2500); };
            return (
                <div className="flex flex-wrap gap-2 items-center">
                    <button className="btn btn-soft" onClick={async () => flash((await DT.copyRich(getHtml())) ? 'Skopiowano' : 'Nie udało się skopiować')}><i className="ph-bold ph-copy"></i>Kopiuj</button>
                    <button className="btn btn-soft" onClick={async () => { try { await DT.downloadDocx(getHtml(), { filename, title }); } catch (e) { flash('Błąd Worda: ' + e.message); } }}><i className="ph-bold ph-file-doc"></i>Word</button>
                    <button className="btn btn-soft" onClick={() => DT.printDoc(getHtml(), filename)}><i className="ph-bold ph-printer"></i>Drukuj / PDF</button>
                    {extra}
                    {msg && <span className="text-sm text-emerald-300 font-bold">{msg}</span>}
                </div>
            );
        }

        function PromptPreview({ text }) {
            return (
                <details className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3 text-sm">
                    <summary className="cursor-pointer font-bold text-emerald-300"><i className="ph-bold ph-eye"></i> Co dokładnie trafi do AI (sprawdź przed wysłaniem)</summary>
                    <pre className="whitespace-pre-wrap text-slate-300 text-xs leading-relaxed mt-3 max-h-80 overflow-auto">{text}</pre>
                    <p className="text-xs text-slate-400 mt-2">Imiona, nazwisko, data urodzenia i PESEL są zamieniane na [imię] / [data urodzenia] / [PESEL]. Numery orzeczeń, poradnie i grupa w ogóle nie są wysyłane. Do tego idzie stała instrukcja z przepisami (ta sama co w Asystencie Pedagoga).</p>
                </details>
            );
        }

        // ---------- zakładki dziecka ----------
        function TabDane({ child, set, settings }) {
            const age = P.ageYears(child.dataUr);
            const toggleProg = (id) => set({ programy: child.programy.includes(id) ? child.programy.filter(p => p !== id) : [...child.programy, id] });
            return (
                <div className="space-y-6">
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="Imię" local><input className="field" value={child.imie} onChange={e => set({ imie: e.target.value })} /></Field>
                        <Field label="Nazwisko" local><input className="field" value={child.nazwisko} onChange={e => set({ nazwisko: e.target.value })} /></Field>
                        <Field label="Zdrobnienia (po przecinku)" local><input className="field" value={child.zdrobnienie} onChange={e => set({ zdrobnienie: e.target.value })} placeholder="np. Kasia, Kasieńka" /></Field>
                        <Field label={'Data urodzenia' + (age !== '' ? ` (${age} l.)` : '')} local><input type="date" className="field" value={child.dataUr} onChange={e => set({ dataUr: e.target.value })} /></Field>
                        <Field label="Płeć (do odmiany w dokumentach)" ai>
                            <select className="field" value={child.plec} onChange={e => set({ plec: e.target.value })}>
                                <option value="">nie podano</option><option value="k">dziewczynka</option><option value="m">chłopiec</option>
                            </select>
                        </Field>
                        <Field label="Grupa" local><input className="field" value={child.grupa} onChange={e => set({ grupa: e.target.value })} placeholder="np. Motylki" /></Field>
                    </div>
                    <div>
                        <span className="lbl">Formy wsparcia<Tag ai /></span>
                        <div className="flex flex-wrap gap-2">
                            {P.PROGRAMY.map(p => (
                                <button key={p.id} type="button" className="tab border border-slate-700" aria-pressed={child.programy.includes(p.id)} onClick={() => toggleProg(p.id)}>{p.label}</button>
                            ))}
                        </div>
                    </div>
                    <Field label="Orzeczenie wydane ze względu na" ai>
                        <select className="field" value={child.orzeczenie} onChange={e => set({ orzeczenie: e.target.value })}>
                            <option value="">— wybierz —</option>
                            {AD.ORZECZENIA.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                        </select>
                    </Field>
                    <Field label="Funkcjonowanie / rozpoznanie (Twoimi słowami)" ai><textarea className="field" value={child.rozpoznanie} onChange={e => set({ rozpoznanie: e.target.value })} placeholder="np. autyzm, nie mówi, komunikuje się gestem i obrazkami, chodzi samodzielnie" /></Field>
                    <Field label="Mocne strony i zainteresowania" ai><textarea className="field" value={child.mocneStrony} onChange={e => set({ mocneStrony: e.target.value })} /></Field>
                    <Field label="Trudności" ai><textarea className="field" value={child.trudnosci} onChange={e => set({ trudnosci: e.target.value })} /></Field>
                    <Field label="Zalecenia z orzeczenia / opinii (przepisz najważniejsze)" ai><textarea className="field" rows="5" value={child.zalecenia} onChange={e => set({ zalecenia: e.target.value })} placeholder="np. AAC, terapia integracji sensorycznej, zajęcia rewalidacyjne, stały plan dnia" /></Field>
                    <p className="text-xs text-slate-500">Możesz pisać imieniem dziecka – przed wysłaniem do AI imię, nazwisko i zdrobnienia są zamieniane na [imię]. Nie wpisuj tu danych innych dzieci ani rodziców. Oddział w dokumentach: {(AD.ODDZIALY.find(o => o.id === settings.oddzial) || {}).label} (zmienisz w Ustawieniach).</p>
                </div>
            );
        }

        function TabDokumenty({ child, set, onImport }) {
            const setDoc = (id, patch) => set({ dokumenty: child.dokumenty.map(d => d.id === id ? Object.assign({}, d, patch) : d) });
            const setTerm = (id, patch) => set({ terminy: child.terminy.map(t => t.id === id ? Object.assign({}, t, patch) : t) });
            const dl = P.deadlines(child);
            const statusOf = (date) => { const x = dl.find(d => d.date === date); return x ? x.status : ''; };
            const badge = (s) => s === 'po terminie' ? 'bg-red-500/20 text-red-300' : s === 'wkrótce' ? 'bg-amber-500/20 text-amber-200' : 'bg-slate-800 text-slate-400';
            return (
                <div className="space-y-8">
                    <section>
                        <div className="flex items-center justify-between gap-3 mb-3">
                            <h3 className="text-lg font-black">Dokumenty z poradni i placówki <Tag /></h3>
                            <span className="flex-1"></span>
                            <button className="btn btn-main" onClick={onImport}><i className="ph-bold ph-file-arrow-up"></i>Wczytaj plik</button>
                            <button className="btn btn-soft" onClick={() => set({ dokumenty: [{ id: P.uid(), rodzaj: 'orzeczenie', numer: '', wydany: '', wazneDo: '', poradnia: '', skan: '', uwagi: '' }, ...child.dokumenty] })}><i className="ph-bold ph-plus"></i>Dodaj</button>
                        </div>
                        {child.dokumenty.length === 0 && <p className="text-sm text-slate-500">Brak dokumentów. Wczytaj orzeczenie lub opinię (PDF, Word, skan) albo dodaj ręcznie – Teczka przypomni, kiedy kończy się ważność.</p>}
                        <div className="space-y-3">
                            {child.dokumenty.map(d => (
                                <div key={d.id} className="card p-4">
                                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        <Field label="Rodzaj"><select className="field" value={d.rodzaj} onChange={e => setDoc(d.id, { rodzaj: e.target.value })}>{P.RODZAJE_DOKUMENTOW.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}</select></Field>
                                        <Field label="Numer"><input className="field" value={d.numer} onChange={e => setDoc(d.id, { numer: e.target.value })} /></Field>
                                        <Field label="Poradnia / wystawca"><input className="field" value={d.poradnia} onChange={e => setDoc(d.id, { poradnia: e.target.value })} /></Field>
                                        <Field label="Data wydania"><input type="date" className="field" value={d.wydany} onChange={e => setDoc(d.id, { wydany: e.target.value })} /></Field>

        // ---------- wczytywanie dokumentów: wszystko w przeglądarce ----------
        // PDF z tekstem → pdf.js; skan (PDF bez tekstu) i zdjęcie → OCR tesseract.js na tym komputerze (skan z imieniem,
        // PESEL i adresem NIE może iść do chmury); Word .docx → mammoth. Biblioteki ładowane dopiero przy pierwszym pliku.
        const LIBS = {
            pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
            pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
            mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js',
            tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
            tessWorker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
            tessCore: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
            tessLang: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/pol/4.0.0_best_int'
        };
        const scriptCache = {};
        const loadScript = (src) => scriptCache[src] || (scriptCache[src] = new Promise((resolve, reject) => {
            const sc = document.createElement('script');
            sc.src = src;
            sc.onload = resolve;
            sc.onerror = () => { delete scriptCache[src]; reject(new Error('Nie udało się wczytać biblioteki do odczytu plików. Sprawdź internet i spróbuj ponownie.')); };
            document.head.appendChild(sc);
        }));
        const MAX_OCR_PAGES = 15;

        async function ocrImages(sources, onProgress) {
            await loadScript(LIBS.tesseract);
            const worker = await window.Tesseract.createWorker('pol', 1, {
                workerPath: LIBS.tessWorker, corePath: LIBS.tessCore, langPath: LIBS.tessLang,
                logger: (m) => { if (m.status === 'recognizing text') onProgress(`Rozpoznaję tekst… ${Math.round((m.progress || 0) * 100)}%`); else if (/load/.test(m.status || '')) onProgress('Pobieram słownik polski do rozpoznawania (jednorazowo, ok. 3 MB)…'); }
            });
            try {
                const out = [];
                for (let i = 0; i < sources.length; i++) {
                    onProgress(`Rozpoznaję stronę ${i + 1} z ${sources.length}…`);
                    const { data } = await worker.recognize(sources[i]);
                    out.push(data.text || '');
                }
                return out.join('\n\n');
            } finally { await worker.terminate(); }
        }

        async function readDocument(file, onProgress) {
            const name = file.name || 'plik';
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (ext === 'doc') throw new Error('Stary format .doc – otwórz plik w Wordzie i zapisz jako .docx albo PDF.');
            if (ext === 'txt') return { text: await file.text(), ocr: false, pages: 1 };
            if (ext === 'docx') {
                onProgress('Czytam dokument Word…');
                await loadScript(LIBS.mammoth);
                const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                return { text: r.value || '', ocr: false, pages: 1 };
            }
            if (['jpg', 'jpeg', 'png', 'webp', 'bmp'].includes(ext) || /^image\//.test(file.type)) {
                if (/heic|heif/.test(ext + file.type)) throw new Error('Zdjęcie w formacie HEIC (iPhone) – zapisz je jako JPG albo zrób skan do PDF.');
                const zeZdjecia = await ocrImages([file], onProgress);
                if (!window.EduTekstJakosc.textQuality(zeZdjecia).ok) throw new Error('Ze zdjęcia nie udało się odczytać tekstu. Zrób je prosto nad dokumentem, w dobrym świetle, bez cienia i tak, żeby wypełniał cały kadr.');
                return { text: zeZdjecia, ocr: true, pages: 1 };
            }
            if (ext !== 'pdf') throw new Error('Obsługiwane pliki: PDF, Word (.docx), zdjęcia (JPG, PNG) i .txt.');
            onProgress('Czytam PDF…');
            await loadScript(LIBS.pdf);
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
            const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
            const parts = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const tc = await (await pdf.getPage(i)).getTextContent();
                parts.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+\n/g, '\n'));
            }
            const text = parts.join('\n\n');
            // Sama liczba znaków nic nie mówi: PDF z czcionką bez mapy znaków zwraca tysiące glifów-krzaków
            // (orzeczenia i opinie z poradni bywają takie). Liczy się, czy to w ogóle jest tekst.
            const dosc = text.replace(/\s/g, '').length >= 40 * pdf.numPages;
            const jakosc = window.EduTekstJakosc.textQuality(text);
            if (dosc && jakosc.ok) return { text, ocr: false, pages: pdf.numPages };
            const zepsuty = dosc && !jakosc.ok;
            const n = Math.min(pdf.numPages, MAX_OCR_PAGES);
            const canvases = [];
            for (let i = 1; i <= n; i++) {
                onProgress(zepsuty
                    ? `Ten PDF ma uszkodzoną warstwę tekstową (${window.EduTekstJakosc.qualityMessage(jakosc)}) – rozpoznaję go jak skan, strona ${i} z ${n}…`
                    : `To skan – przygotowuję stronę ${i} z ${n} do rozpoznania…`);
                const page = await pdf.getPage(i);
                const vp = page.getViewport({ scale: 2 });
                const c = document.createElement('canvas');
                c.width = vp.width; c.height = vp.height;
                await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
                canvases.push(c);
            }
            const rozpoznany = await ocrImages(canvases, onProgress);
            if (!window.EduTekstJakosc.textQuality(rozpoznany).ok) {
                throw new Error(zepsuty
                    ? 'Ten PDF ma uszkodzoną warstwę tekstową, a rozpoznawanie obrazu też nic nie dało. Spróbuj zapisać go jeszcze raz (Drukuj → Zapisz jako PDF) albo zrób wyraźne zdjęcie dokumentu.'
                    : 'Nie udało się odczytać tekstu z tego pliku. Jeśli to skan, zrób go prosto i w dobrym świetle.');
            }
            return { text: rozpoznany, ocr: true, pages: pdf.numPages, cut: pdf.numPages > n, naprawiony: zepsuty };
        }

        const FIELD_LABELS = [
            ['rozpoznanie', 'Funkcjonowanie / rozpoznanie'],
            ['mocneStrony', 'Mocne strony i zainteresowania'],
            ['trudnosci', 'Trudności'],
            ['zalecenia', 'Zalecenia z dokumentu']
        ];
        const PROGRAM_FOR = { orzeczenie: 'ks', ipet: 'ks', wopfu: 'ks', opinia_wwrd: 'wwrd', ipww: 'wwrd' };
        const normName = (s) => String(s || '').trim().toLocaleLowerCase('pl');

        function ImportDoc({ vault, update, presetChildId, onDone, onCancel }) {
            const fileRef = useRef(null);
            const [step, setStep] = useState('pick');
            const [progress, setProgress] = useState('');
            const [err, setErr] = useState('');
            const [fileInfo, setFileInfo] = useState(null);
            const [text, setText] = useState('');
            const [idf, setIdf] = useState(null);
            const [target, setTarget] = useState(presetChildId || 'new');
            const [ai, setAi] = useState(null);
            const [aiBusy, setAiBusy] = useState(false);
            const [aiErr, setAiErr] = useState('');
            const [modes, setModes] = useState({});

            const existing = vault.children.find(c => c.id === target) || null;
            const setI = (patch) => setIdf(prev => Object.assign({}, prev, patch));

            const pick = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                setErr(''); setStep('reading'); setProgress('Otwieram plik…');
                try {
                    const r = await readDocument(f, setProgress);
                    const clean = String(r.text || '').replace(/\u0000/g, '').trim();
                    if (clean.replace(/\s/g, '').length < 20) throw new Error('Nie udało się odczytać tekstu z tego pliku. Jeśli to zdjęcie, zrób je prosto, w dobrym świetle, i spróbuj ponownie.');
                    const found = P.extractIdentity(clean);
                    setText(clean);
                    setIdf(found);
                    setFileInfo({ name: f.name, ocr: r.ocr, pages: r.pages, cut: r.cut, naprawiony: r.naprawiony });
                    if (!presetChildId) {
                        const match = vault.children.find(c => normName(P.fullName(c)) && normName(P.fullName(c)) === normName([found.imie, found.nazwisko].join(' ')))
                            || vault.children.find(c => found.nazwisko && normName(c.nazwisko) === normName(found.nazwisko) && c.dataUr && c.dataUr === found.dataUr);
                        setTarget(match ? match.id : 'new');
                    }
                    setStep('review');
                } catch (x) { setErr(x.message); setStep('pick'); }
            };

            // Dziecko „robocze” do anonimizacji: imię i dane z formularza + to, co już jest w karcie (zdrobnienia, grupa, dokumenty).
            const scrubChild = idf ? Object.assign({}, existing || P.newChild(), {
                imie: idf.imie || (existing && existing.imie) || '',
                nazwisko: idf.nazwisko || (existing && existing.nazwisko) || '',
                zdrobnienie: [existing && existing.zdrobnienie, idf.zdrobnienie].filter(Boolean).join(', '),
                dataUr: idf.dataUr || (existing && existing.dataUr) || '',
                dokumenty: [...((existing && existing.dokumenty) || []), { numer: idf.numer, poradnia: idf.poradnia }]
            }) : null;
            const anon = idf ? P.anonymizeDocText(text, scrubChild) : '';
            const prompts = idf ? P.cardExtractionPrompts(anon, idf.rodzaj, AD.ORZECZENIA) : null;
            const canAi = idf && idf.imie.trim() && idf.nazwisko.trim();

            const runAi = async () => {
                setAiErr('');
                if (IS_LOCAL) return setAiErr('Plik otwarty lokalnie – AI działa tylko na eduboxpro.pl.');
                try {
                    assertNoLeak(prompts.prompt, scrubChild);
                    setAiBusy(true);
                    const res = await DT.streamChat({ system: prompts.system, prompt: prompts.prompt, model: 'balanced', temperature: 0.2 });
                    const card = P.parseCardJson(res.text, AD.ORZECZENIA);
                    const fill = (s) => String(s || '').split('[imię]').join(idf.imie.split(' ')[0] || '[imię]');
                    setAi({ rozpoznanie: fill(card.rozpoznanie), mocneStrony: fill(card.mocneStrony), trudnosci: fill(card.trudnosci), zalecenia: fill(card.zalecenia) });
                    const patch = {};
                    if (card.orzeczenie && !idf.orzeczenie) patch.orzeczenie = card.orzeczenie;
                    if (card.rodzaj && idf.rodzaj === 'inne') patch.rodzaj = card.rodzaj;
                    if (card.okres && !idf.okres) patch.okres = card.okres;
                    setI(patch);
                    const m = {};
                    FIELD_LABELS.forEach(([k]) => { m[k] = existing && String(existing[k] || '').trim() ? 'dopisz' : 'zastap'; });
                    setModes(m);
                } catch (x) { setAiErr(x.message); }
                finally { setAiBusy(false); }
            };

            const save = () => {
                if (!idf.imie.trim() && !existing) return setErr('Wpisz imię dziecka.');
                const now = new Date().toISOString();
                const doc = { id: P.uid(), rodzaj: idf.rodzaj, numer: idf.numer, wydany: idf.wydany, wazneDo: idf.wazneDo, poradnia: idf.poradnia, skan: fileInfo.name, plik: fileInfo.name, tekst: text, uwagi: idf.okres ? 'Okres: ' + idf.okres : '', wczytano: now };
                const base = existing || P.newChild();
                const next = Object.assign({}, base, {
                    imie: base.imie || idf.imie.trim(),
                    nazwisko: base.nazwisko || idf.nazwisko.trim(),
                    dataUr: base.dataUr || idf.dataUr,
                    zdrobnienie: [base.zdrobnienie, idf.zdrobnienie].map(x => String(x || '').trim()).filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).join(', '),
                    orzeczenie: (idf.rodzaj === 'orzeczenie' && idf.orzeczenie) ? idf.orzeczenie : (base.orzeczenie || idf.orzeczenie),
                    programy: PROGRAM_FOR[idf.rodzaj] && !base.programy.includes(PROGRAM_FOR[idf.rodzaj]) ? [...base.programy, PROGRAM_FOR[idf.rodzaj]] : base.programy,
                    dokumenty: [doc, ...base.dokumenty],
                    zmieniono: now
                });
                if (ai) FIELD_LABELS.forEach(([k]) => { next[k] = P.mergeField(base[k], ai[k], modes[k] || 'dopisz'); });
                update(v => Object.assign({}, v, { children: existing ? v.children.map(c => c.id === existing.id ? next : c) : [...v.children, next] }));
                onDone(next.id);
            };

            if (step === 'pick' || step === 'reading') {
                return (
                    <div className="card p-6 space-y-4 min-w-0">
                        <div className="flex justify-between items-center gap-3"><h2 className="text-xl font-black">Dodaj z dokumentu</h2><button className="btn btn-soft" onClick={onCancel}><i className="ph-bold ph-x"></i>Anuluj</button></div>
                        <p className="text-sm text-slate-300 leading-relaxed">Wybierz orzeczenie, opinię, IPET, WOPFU albo inny dokument: <strong>PDF, Word (.docx) lub zdjęcie/skan</strong>. Plik jest czytany <strong>na tym komputerze</strong> – nie jest nigdzie wysyłany. Teczka podpowie dane do karty, a Ty je sprawdzisz przed zapisaniem.</p>
                        {step === 'reading'
                            ? <p className="text-emerald-300 font-bold flex items-center gap-2"><i className="ph-bold ph-circle-notch animate-spin"></i>{progress}</p>
                            : <button className="btn btn-main" onClick={() => fileRef.current && fileRef.current.click()}><i className="ph-bold ph-file-arrow-up"></i>Wybierz plik</button>}
                        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,.jpg,.jpeg,.png,.webp,application/pdf,image/*" className="hidden" onChange={pick} />
                        <p className="text-xs text-slate-500">Skany i zdjęcia są rozpoznawane w przeglądarce (pierwszy raz pobiera się słownik polski, ok. 3 MB) – sprawdź potem tekst, bo przy słabym skanie zdarzają się literówki. Najwyżej {MAX_OCR_PAGES} stron skanu naraz.</p>
                        {err && <p className="text-sm text-red-300 font-bold">{err}</p>}
                    </div>
                );
            }

            const docOpts = P.RODZAJE_DOKUMENTOW;
            return (
                <div className="space-y-5 min-w-0">
                    <div className="card p-6 space-y-2">
                        <div className="flex flex-wrap justify-between items-center gap-3">
                            <h2 className="text-xl font-black">Sprawdź dane z dokumentu</h2>
                            <button className="btn btn-soft" onClick={onCancel}><i className="ph-bold ph-x"></i>Anuluj</button>
                        </div>
                        <p className="text-sm text-slate-400"><i className="ph-bold ph-file-text"></i> {fileInfo.name} · {fileInfo.pages} {fileInfo.pages === 1 ? 'strona' : 'str.'}{fileInfo.naprawiony ? ' · PDF miał uszkodzoną warstwę tekstową, odczytany jak skan – tym bardziej sprawdź literówki' : fileInfo.ocr ? ' · tekst rozpoznany ze skanu – sprawdź literówki' : ''}{fileInfo.cut ? ` · rozpoznano pierwsze ${MAX_OCR_PAGES} stron` : ''}</p>
                    </div>

                    <div className="card p-6 space-y-4">
                        <h3 className="font-black">1. Komu przypisać dokument</h3>
                        <select className="field" value={target} onChange={e => setTarget(e.target.value)} disabled={!!presetChildId}>
                            <option value="new">➕ Nowe dziecko</option>
                            {vault.children.map(c => <option key={c.id} value={c.id}>{P.fullName(c) || 'Bez imienia'}</option>)}
                        </select>
                        {existing && <p className="text-xs text-slate-500">Puste pola karty zostaną uzupełnione, a wypełnione – zostają, chyba że niżej wybierzesz inaczej.</p>}
                    </div>

                    <div className="card p-6 space-y-4">
                        <h3 className="font-black">2. Dane z nagłówka <Tag /></h3>
                        <p className="text-xs text-slate-500">Rozpoznane automatycznie, bez AI. Popraw, jeśli coś się nie zgadza – imię i nazwisko są potrzebne, żeby usunąć je z tekstu przed wysłaniem do AI.</p>
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            <Field label="Imię (imiona)"><input className="field" value={idf.imie} onChange={e => setI({ imie: e.target.value })} /></Field>
                            <Field label="Nazwisko"><input className="field" value={idf.nazwisko} onChange={e => setI({ nazwisko: e.target.value })} /></Field>
                            <Field label="Zdrobnienie użyte w dokumencie"><input className="field" value={idf.zdrobnienie || ''} onChange={e => setI({ zdrobnienie: e.target.value })} placeholder="np. Kasia" /></Field>
                            <Field label="Data urodzenia"><input type="date" className="field" value={idf.dataUr} onChange={e => setI({ dataUr: e.target.value })} /></Field>
                            <Field label="Rodzaj dokumentu"><select className="field" value={idf.rodzaj} onChange={e => setI({ rodzaj: e.target.value })}>{docOpts.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}</select></Field>
                            <Field label="Numer"><input className="field" value={idf.numer} onChange={e => setI({ numer: e.target.value })} /></Field>
                            <Field label="Data wydania"><input type="date" className="field" value={idf.wydany} onChange={e => setI({ wydany: e.target.value })} /></Field>
                            <Field label="Ważne do"><input type="date" className="field" value={idf.wazneDo} onChange={e => setI({ wazneDo: e.target.value })} /></Field>
                            <Field label="Poradnia / wystawca"><input className="field" value={idf.poradnia} onChange={e => setI({ poradnia: e.target.value })} /></Field>
                        </div>
                        {idf.okres && <p className="text-sm text-slate-300">Okres z dokumentu: <em>„{idf.okres}”</em>{!idf.wazneDo && <span className="text-amber-200"> – wpisz datę „Ważne do”, żeby Teczka przypomniała o terminie.</span>}</p>}
                        <Field label="Orzeczenie wydane ze względu na" ai><select className="field" value={idf.orzeczenie} onChange={e => setI({ orzeczenie: e.target.value })}><option value="">— nie dotyczy / nie wiem —</option>{AD.ORZECZENIA.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}</select></Field>
                    </div>

                    <div className="card p-6 space-y-4">
                        <h3 className="font-black">3. Opis do karty dziecka <Tag ai /></h3>
                        <p className="text-sm text-slate-400">AI przeczyta treść dokumentu <strong>po usunięciu danych osobowych</strong> i wypisze funkcjonowanie, mocne strony, trudności i zalecenia. Możesz to pominąć i uzupełnić kartę sama.</p>
                        <PromptPreview text={prompts.prompt} />
                        <button className="btn btn-main" onClick={runAi} disabled={!canAi || aiBusy}>{aiBusy ? <><i className="ph-bold ph-circle-notch animate-spin"></i>Czytam dokument…</> : <><i className="ph-bold ph-magic-wand"></i>{ai ? 'Wyciągnij jeszcze raz' : 'Wyciągnij opis przez AI'}</>}</button>
                        {!canAi && <p className="text-xs text-amber-200">Najpierw wpisz imię i nazwisko dziecka w punkcie 2.</p>}
                        {aiErr && <p className="text-sm text-red-300 font-bold">{aiErr}</p>}
                        {ai && FIELD_LABELS.map(([k, label]) => (
                            <div key={k} className="space-y-2">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <span className="lbl mb-0">{label}</span>
                                    {existing && String(existing[k] || '').trim() && (
                                        <select className="field w-auto py-1 text-xs" value={modes[k] || 'dopisz'} onChange={e => setModes(m => Object.assign({}, m, { [k]: e.target.value }))}>
                                            <option value="dopisz">dopisz do karty</option><option value="zastap">zastąp to, co w karcie</option><option value="pomin">pomiń</option>
                                        </select>
                                    )}
                                </div>
                                <textarea className="field" rows="4" value={ai[k]} onChange={e => setAi(a => Object.assign({}, a, { [k]: e.target.value }))} />
                                {existing && String(existing[k] || '').trim() && <p className="text-xs text-slate-500">Teraz w karcie: {String(existing[k]).slice(0, 160)}{String(existing[k]).length > 160 ? '…' : ''}</p>}
                            </div>
                        ))}
                    </div>

                    <details className="card p-6">
                        <summary className="cursor-pointer font-black">4. Tekst dokumentu ({text.length.toLocaleString('pl-PL')} znaków) – sprawdź albo popraw</summary>
                        <p className="text-xs text-slate-500 mt-2 mb-3">Ten tekst zostaje zaszyfrowany w karcie dziecka i (bez danych osobowych) pomaga AI pisać kolejne dokumenty. Popraw literówki ze skanu, jeśli są.</p>
                        <textarea className="field font-mono text-xs" rows="14" value={text} onChange={e => setText(e.target.value)} />
                    </details>

                    {err && <p className="text-sm text-red-300 font-bold">{err}</p>}
                    <div className="flex flex-wrap gap-2">
                        <button className="btn btn-main" onClick={save}><i className="ph-bold ph-floppy-disk"></i>{existing ? 'Zapisz w karcie: ' + P.fullName(existing) : 'Utwórz kartę dziecka'}</button>
                        <button className="btn btn-soft" onClick={onCancel}>Anuluj</button>
                    </div>
                </div>
            );
        }

        function Dashboard({ vault, openChild, onImport }) {
            const al = P.alerts(vault.children);
            return (
                <div className="space-y-5 min-w-0">
                    {vault.children.length === 0 && (
                        <div className="card p-6 border-emerald-500/40">
                            <h2 className="text-xl font-black mb-2">Zacznij od dokumentu</h2>
                            <p className="text-sm text-slate-300 mb-4">Wczytaj orzeczenie albo opinię (PDF, Word, zdjęcie lub skan) – Teczka sama założy kartę dziecka, a Ty tylko sprawdzisz dane.</p>
                            <button className="btn btn-main" onClick={onImport}><i className="ph-bold ph-file-arrow-up"></i>Dodaj z dokumentu</button>
                        </div>
                    )}
                    <div className="card p-6">
                        <h2 className="text-xl font-black mb-3"><i className="ph-bold ph-bell-ringing text-amber-300"></i> Do zrobienia</h2>
                        {al.length === 0 ? <p className="text-sm text-slate-400">Nic pilnego. Tu pojawią się dokumenty, którym kończy się ważność, i terminy z najbliższych {P.SOON_DAYS} dni.</p> : (
                            <ul className="space-y-2">
                                {al.map((a, i) => (
                                    <li key={i}><button className="w-full text-left flex flex-wrap gap-x-3 items-center rounded-xl px-3 py-2 hover:bg-slate-800" onClick={() => openChild(a.childId, 'dokumenty')}>
                                        <span className={'text-xs font-black px-2 py-1 rounded-full ' + (a.status === 'po terminie' ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/20 text-amber-200')}>{a.days < 0 ? Math.abs(a.days) + ' dni po terminie' : 'za ' + a.days + ' dni'}</span>
                                        <strong className="text-sm">{a.name}</strong><span className="text-sm text-slate-400">{a.label} {P.formatDatePl(a.date)}</span>
                                    </button></li>
                                ))}
                            </ul>
                        )}
                    </div>
                    <div className="card p-6 text-sm text-slate-300 leading-relaxed space-y-2">
                        <h2 className="text-xl font-black text-slate-100 mb-1"><i className="ph-bold ph-shield-check text-emerald-300"></i> Jak to działa</h2>
                        <p>Wszystko, co tu wpiszesz, jest zaszyfrowane Twoim hasłem i zostaje <strong>w tej przeglądarce na tym komputerze</strong>. Nic nie trafia do chmury.</p>
                        <p>Gdy prosisz AI o dokument lub poradę, wysyłany jest tylko opis bez imienia, nazwiska, daty urodzenia i numerów dokumentów – możesz to sprawdzić w „Co dokładnie trafi do AI”. Imię wstawia przeglądarka dopiero na gotowej kartce.</p>
                        <p>Po {LOCK_MINUTES} minutach bezczynności Teczka sama się blokuje. Raz w tygodniu pobierz <strong>kopię zapasową</strong> (też zaszyfrowaną) – wyczyszczenie danych przeglądarki usunęłoby Teczkę.</p>
                    </div>
                    <div className="card p-6">
                        <h2 className="text-lg font-black mb-3">Przydatne narzędzia EduBox</h2>
                        <div className="flex flex-wrap gap-2 text-sm">
                            <a className="btn btn-soft" href="/eduwpisy.html" target="_blank" rel="noopener">Wpisy do dziennika</a>
                            <a className="btn btn-soft" href="/edukalendarz.html" target="_blank" rel="noopener">EduKalendarz</a>
                            <a className="btn btn-soft" href="/materialy.html" target="_blank" rel="noopener">Baza Materiałów</a>
                            <a className="btn btn-soft" href="/asystent-pedagoga.html" target="_blank" rel="noopener">Asystent Pedagoga</a>
                        </div>
                    </div>
                </div>
            );
        }

        function PasswordForm({ onSubmit, withLabel, button }) {
            const [label, setLabel] = useState('');
            const [pw, setPw] = useState('');
            const [pw2, setPw2] = useState('');
            const [msg, setMsg] = useState('');
            const [busy, setBusy] = useState(false);
            const go = async (e) => {
                e.preventDefault();
                if (pw.length < 8) return setMsg('Hasło musi mieć co najmniej 8 znaków.');
                if (pw !== pw2) return setMsg('Hasła się różnią.');
                setBusy(true);
                try { await onSubmit(pw, label.trim()); setPw(''); setPw2(''); setLabel(''); setMsg(''); } catch (x) { setMsg(x.message); }
                setBusy(false);
            };
            return (
                <form onSubmit={go} className="space-y-3">
                    {withLabel && <input className="field" value={label} onChange={e => setLabel(e.target.value)} placeholder="Czyje to hasło, np. Witold" maxLength={40} />}
                    <div className="grid sm:grid-cols-2 gap-3">
                        <input type="password" autoComplete="new-password" className="field" value={pw} onChange={e => setPw(e.target.value)} placeholder="Nowe hasło (min. 8 znaków)" />
                        <input type="password" autoComplete="new-password" className="field" value={pw2} onChange={e => setPw2(e.target.value)} placeholder="Powtórz" />
                    </div>
                    <button className="btn btn-soft" disabled={busy}>{busy ? 'Zapisuję…' : button}</button>
                    {msg && <p className="text-sm text-red-300">{msg}</p>}
                </form>
            );
        }

        function Settings({ vault, update, session, setSession, wipe, close }) {
            const [editId, setEditId] = useState(null);
            const [adding, setAdding] = useState(false);
            const [note, setNote] = useState('');
            const after = (txt) => { setNote(txt + ' Kopie zapasowe zrobione WCZEŚNIEJ otwierają się starymi hasłami – pobierz nową kopię.'); };
            return (
                <div className="card p-6 space-y-6 min-w-0">
                    <div className="flex justify-between items-center"><h2 className="text-xl font-black">Ustawienia</h2><button className="btn btn-soft" onClick={close}><i className="ph-bold ph-x"></i>Zamknij</button></div>
                    <Field label="Rodzaj oddziału (do dokumentów)">
                        <select className="field" value={vault.settings.oddzial} onChange={e => update(v => Object.assign({}, v, { settings: Object.assign({}, v.settings, { oddzial: e.target.value }) }))}>
                            {AD.ODDZIALY.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                        </select>
                    </Field>
                    <div className="space-y-3">
                        <span className="lbl">Hasła do tej Teczki</span>
                        <p className="text-sm text-slate-400">Każde hasło otwiera te same dane. Dobrze mieć dwa: codzienne i zapasowe u drugiej osoby.</p>
                        {session.slots.length < 2 && <p className="text-sm text-amber-200 bg-amber-500/10 border border-amber-400/30 rounded-xl p-3">Jest tylko jedno hasło. Jeśli się zapomni, danych nie da się odzyskać – dodaj hasło zapasowe.</p>}
                        <ul className="space-y-2">
                            {session.slots.map(sl => (
                                <li key={sl.id} className="rounded-xl border border-slate-800 p-3 space-y-3">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <i className="ph-bold ph-key text-emerald-300"></i>
                                        <strong className="text-sm">{sl.label}</strong>
                                        <span className="text-xs text-slate-500">ustawione {P.formatDatePl(String(sl.created || '').slice(0, 10))}</span>
                                        {sl.id === session.openedWith && <span className="text-xs font-bold text-emerald-300">· tym hasłem otwarto Teczkę</span>}
                                        <span className="flex-1"></span>
                                        <button className="btn btn-soft" onClick={() => setEditId(editId === sl.id ? null : sl.id)}>Zmień</button>
                                        {session.slots.length > 1 && sl.id !== session.openedWith && <button className="btn btn-danger" onClick={() => {
                                            if (!window.confirm(`Usunąć hasło „${sl.label}”? Tym hasłem nie otworzy się już Teczki w tej przeglądarce.`)) return;
                                            try { setSession(P.removePassword(session, sl.id)); after('Hasło usunięte.'); } catch (x) { setNote(x.message); }
                                        }}><i className="ph-bold ph-trash"></i></button>}
                                    </div>
                                    {editId === sl.id && <PasswordForm button="Zapisz nowe hasło" onSubmit={async (pw) => { setSession(await P.changePassword(session, sl.id, pw)); setEditId(null); after(`Hasło „${sl.label}” zmienione.`); }} />}
                                </li>
                            ))}
                        </ul>
                        {adding
                            ? <div className="rounded-xl border border-emerald-500/30 p-3"><PasswordForm withLabel button="Dodaj hasło" onSubmit={async (pw, label) => { setSession(await P.addPassword(session, pw, label || 'Hasło zapasowe')); setAdding(false); after('Hasło dodane.'); }} /></div>
                            : session.slots.length < 5 && <button className="btn btn-soft" onClick={() => setAdding(true)}><i className="ph-bold ph-plus"></i>Dodaj hasło</button>}
                        {note && <p className="text-sm text-amber-200">{note}</p>}
                    </div>
                    <div className="border-t border-slate-800 pt-5">
                        <span className="lbl">Usuń Teczkę z tej przeglądarki</span>
                        <p className="text-sm text-slate-400 mb-3">Kasuje wszystkie dane z tego komputera. Kopie zapasowe zostają na dysku.</p>
                        <button className="btn btn-danger" onClick={wipe}><i className="ph-bold ph-trash"></i>Usuń wszystkie dane</button>
                    </div>
                </div>
            );
        }

        // ---------- aplikacja ----------
        function App() {
            const [stage, setStage] = useState(() => readStored() ? 'locked' : 'setup');
            const [vault, setVault] = useState(null);
            const [selId, setSelId] = useState(null);
            const [tab, setTab] = useState('dane');
            const [showSettings, setShowSettings] = useState(false);
            const [query, setQuery] = useState('');
            const [saveState, setSaveState] = useState('');
            const [sessionView, setSessionView] = useState(null);
            const [importFor, setImportFor] = useState(null); // null | 'new' | id dziecka – kreator „Dodaj z dokumentu”
            const sessionRef = useRef(null);
            const vaultRef = useRef(null);
            const timerRef = useRef(null);
            const pendingRef = useRef(false);
            const lastActive = useRef(Date.now());

            const writeNow = useCallback(async (v) => {
                if (!sessionRef.current || !v) return;
                try {
                    const sealed = await P.seal(v, sessionRef.current);
                    localStorage.setItem(P.VAULT_KEY, JSON.stringify(sealed));
                    pendingRef.current = false;
                    setSaveState('Zapisano ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }));
                } catch (e) {
                    setSaveState('BŁĄD ZAPISU: ' + (e && e.name === 'QuotaExceededError' ? 'brak miejsca' : e.message));
                }
            }, []);

            const update = useCallback((fn) => {
                const next = fn(vaultRef.current);
                vaultRef.current = next;
                setVault(next);
                pendingRef.current = true;
                setSaveState('Zapisuję…');
                clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => writeNow(vaultRef.current), 500);
            }, [writeNow]);

            const opened = (data, session, migrated) => {
                sessionRef.current = session;
                setSessionView(session);
                if (migrated) setTimeout(() => writeNow(data), 0);
                vaultRef.current = data;
                setVault(data);
                setStage('open');
                lastActive.current = Date.now();
            };

            const lock = useCallback(async () => {
                clearTimeout(timerRef.current);
                if (pendingRef.current) await writeNow(vaultRef.current);
                sessionRef.current = null;
                setSessionView(null);
                setImportFor(null);
                vaultRef.current = null;
                setVault(null);
                setSelId(null);
                setShowSettings(false);
                setSaveState('');
                setStage(readStored() ? 'locked' : 'setup');
            }, [writeNow]);

            // Automatyczna blokada po bezczynności + ostrzeżenie przy zamykaniu karty w trakcie zapisu.
            useEffect(() => {
                if (stage !== 'open') return;
                const touch = () => { lastActive.current = Date.now(); };
                const evs = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
                evs.forEach(e => window.addEventListener(e, touch, { passive: true }));
                const iv = setInterval(() => { if (Date.now() - lastActive.current > LOCK_MINUTES * 60000) lock(); }, 20000);
                const before = (e) => { if (pendingRef.current) { e.preventDefault(); e.returnValue = ''; } };
                window.addEventListener('beforeunload', before);
                return () => { evs.forEach(e => window.removeEventListener(e, touch)); clearInterval(iv); window.removeEventListener('beforeunload', before); };
            }, [stage, lock]);

            if (stage === 'setup') return <Setup onImported={() => setStage('locked')} onCreated={(s) => { const v = P.emptyVault(); opened(v, s); writeNow(v); }} />;
            if (stage === 'locked' || !vault) return <Locked onOpened={opened} onImported={() => setStage('locked')} />;

            const child = vault.children.find(c => c.id === selId);
            const setChild = (id) => (patch) => update(v => Object.assign({}, v, { children: v.children.map(c => c.id === id ? Object.assign({}, c, patch, { zmieniono: new Date().toISOString() }) : c) }));
            const addChild = () => { setImportFor(null); const c = P.newChild(); update(v => Object.assign({}, v, { children: [...v.children, c] })); setSelId(c.id); setTab('dane'); setShowSettings(false); };
            const removeChild = (c) => () => {
                if (!window.confirm(`Usunąć ${P.fullName(c) || 'to dziecko'} z Teczki razem z dokumentami, obserwacjami i historią?`)) return;
                update(v => Object.assign({}, v, { children: v.children.filter(x => x.id !== c.id) }));
                setSelId(null);
            };
            const openChild = (id, t) => { setImportFor(null); setSelId(id); setTab(t || 'dane'); setShowSettings(false); };
            const backup = async () => {
                const sealed = await P.seal(vaultRef.current, sessionRef.current);
                downloadJson(sealed, `teczka-podopiecznych-${today()}.json`);
            };
            const setSession = (sNew) => {
                sessionRef.current = sNew;
                setSessionView(sNew);
                writeNow(vaultRef.current);
            };
            const wipe = () => {
                if (window.prompt('Aby usunąć WSZYSTKIE dane Teczki z tej przeglądarki, wpisz: USUŃ') !== 'USUŃ') return;
                try { localStorage.removeItem(P.VAULT_KEY); } catch (e) {}
                pendingRef.current = false;
                sessionRef.current = null; vaultRef.current = null; setSessionView(null); setImportFor(null);
                setVault(null); setSelId(null); setShowSettings(false); setStage('setup');
            };

            const q = query.trim().toLocaleLowerCase('pl');
            const alertIds = new Set(P.alerts(vault.children).map(a => a.childId));
            const list = vault.children
                .filter(c => !q || [c.imie, c.nazwisko, c.zdrobnienie, c.grupa].join(' ').toLocaleLowerCase('pl').includes(q))
                .sort((a, b) => (a.nazwisko + a.imie).localeCompare(b.nazwisko + b.imie, 'pl'));

            return (
                <div>
                    <header className="border-b border-slate-800 bg-slate-950/95 sticky top-0 z-20 backdrop-blur">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            <button className="font-black text-lg tracking-tight text-left" onClick={() => { setSelId(null); setShowSettings(false); setImportFor(null); }}>🗂️ Teczka <span className="text-emerald-300">podopiecznych</span></button>
                            <div className="flex flex-wrap items-center gap-2">
                                <span className={'text-xs mr-1 ' + (saveState.startsWith('BŁĄD') ? 'text-red-300 font-bold' : 'text-slate-500')}>{sessionView ? <span className="hidden md:inline">🔑 {P.slotLabel(sessionView)} · </span> : null}{saveState}</span>
                                <button className="btn btn-soft" onClick={backup} title="Pobierz zaszyfrowaną kopię"><i className="ph-bold ph-download-simple"></i><span className="hidden sm:inline">Kopia zapasowa</span></button>
                                <button className="btn btn-soft" onClick={() => { setShowSettings(true); setSelId(null); setImportFor(null); }} title="Ustawienia"><i className="ph-bold ph-gear"></i></button>
                                <button className="btn btn-main" onClick={lock}><i className="ph-bold ph-lock"></i><span className="hidden sm:inline">Zablokuj</span></button>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-6 grid lg:grid-cols-[300px_minmax(0,1fr)] gap-6 items-start">
                        <aside className="card p-4 lg:sticky lg:top-20 space-y-3 min-w-0">
                            <button className="btn btn-main w-full" onClick={addChild}><i className="ph-bold ph-user-plus"></i>Dodaj dziecko</button>
                            <button className="btn btn-soft w-full" onClick={() => { setImportFor('new'); setShowSettings(false); }}><i className="ph-bold ph-file-arrow-up"></i>Dodaj z dokumentu</button>
                            {vault.children.length > 4 && <input className="field" value={query} onChange={e => setQuery(e.target.value)} placeholder="Szukaj…" />}
                            {vault.children.length === 0 && <p className="text-sm text-slate-500 px-1">Nie ma jeszcze dzieci. Zacznij od „Dodaj dziecko”.</p>}
                            <ul className="space-y-1 max-h-[60vh] overflow-y-auto">
                                {list.map(c => (
                                    <li key={c.id}><button onClick={() => openChild(c.id, selId === c.id ? tab : 'dane')} className={'w-full text-left rounded-xl px-3 py-2 flex items-center gap-2 ' + (c.id === selId ? 'bg-emerald-500/15 text-emerald-200' : 'hover:bg-slate-800')}>
                                        <span className="flex-1 min-w-0"><span className="block font-bold text-sm truncate">{P.fullName(c) || 'Bez imienia'}</span><span className="block text-xs text-slate-500 truncate">{[c.grupa, c.programy.map(p => p.toUpperCase().replace('ZAZYCIEM', 'Za życiem')).join(' · ')].filter(Boolean).join(' · ')}</span></span>
                                        {alertIds.has(c.id) && <span className="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0" title="Pilny termin"></span>}
                                    </button></li>
                                ))}
                            </ul>
                        </aside>
                        {importFor ? <ImportDoc key={importFor} vault={vault} update={update} presetChildId={importFor === 'new' ? null : importFor} onCancel={() => setImportFor(null)} onDone={(id) => { setImportFor(null); setSelId(id); setTab('dane'); }} />
                            : showSettings ? <Settings vault={vault} update={update} session={sessionView} setSession={setSession} wipe={wipe} close={() => setShowSettings(false)} />
                            : child ? <ChildView key={child.id} child={child} set={setChild(child.id)} remove={removeChild(child)} tab={tab} setTab={setTab} settings={vault.settings} onImport={() => setImportFor(child.id)} />
                            : <Dashboard vault={vault} openChild={openChild} onImport={() => setImportFor('new')} />}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
