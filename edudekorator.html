    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const parseAIResponse = (aiOutput) => {
            let text = String(aiOutput?.text || aiOutput?.response || aiOutput?.content || aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    return JSON.parse(jsonStr.replace(/,\s*([\]}])/g, '$1'));
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu. Spróbuj ponownie.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON. Nie używaj znaczników markdown.\n\n${systemInstruction}\n\nZADANIE:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.content || data;
                } else {
                    throw new Error(`Błąd API Text`);
                }
            } catch(e) { throw new Error("Brak połączenia z AI. " + e.message); }
        };

        const fetchImageAI = async (imagePrompt) => {
            try {
                const res = await fetch('/api/malarz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `${imagePrompt}. Modern 3D Pixar Disney style illustration, 8k resolution, masterpiece, highly detailed, vivid vibrant colors, cute and friendly, pure white background, perfectly centered, isolated subject.`, 
                        style: 'disney', 
                        format: 'naklejka', 
                        customText: '' 
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.url;
                }
                return null;
            } catch (e) {
                console.error("Błąd generowania obrazka:", e);
                return null;
            }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [genStatus, setGenStatus] = useState(''); 
            
            const [layoutType, setLayoutType] = useState('kodeks'); 
            const [theme, setTheme] = useState('Pszczółki');
            const [groupAge, setGroupAge] = useState('Przedszkolaki');
            
            const [resultData, setResultData] = useState(null);
            const [printSize, setPrintSize] = useState('medium');
            const [labelNames, setLabelNames] = useState({});
            const [fontChoice, setFontChoice] = useState('baloo');

            // --- WŁASNY ELEMENT ZE ZDJĘCIA (upload + AI restyle), działa dla KAŻDEGO układu ---
            const [refImage, setRefImage] = useState(null); // data:URL wgranego zdjęcia/rysunku
            const [refImageName, setRefImageName] = useState('');
            const [refImageCaption, setRefImageCaption] = useState(''); // podpis - potrzebny wszędzie poza "etykiety"
            const [refImageMode, setRefImageMode] = useState('close'); // 'close'/'creative' = SDXL image-to-image (trzyma się zdjęcia), 'describe' = pełny styl 3D przez opis AI
            const [isAddingOwnLabel, setIsAddingOwnLabel] = useState(false);
            const OWN_ITEM_PALETTE = [
                { bgColor: 'bg-blue-50', textColor: 'text-blue-800', headerColor: 'bg-blue-500', borderColor: 'border-blue-400' },
                { bgColor: 'bg-amber-100', textColor: 'text-amber-800', headerColor: 'bg-amber-500', borderColor: 'border-amber-400' },
                { bgColor: 'bg-emerald-50', textColor: 'text-emerald-700', headerColor: 'bg-emerald-500', borderColor: 'border-emerald-400' },
                { bgColor: 'bg-pink-50', textColor: 'text-pink-700', headerColor: 'bg-pink-500', borderColor: 'border-pink-400' },
                { bgColor: 'bg-sky-50', textColor: 'text-sky-800', headerColor: 'bg-sky-500', borderColor: 'border-sky-400' },
            ];
            
            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);
            const [isDownloadingPdf, setIsDownloadingPdf] = useState(false);
            const previewRef = useRef(null);
            const printOnlyRef = useRef(null);

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else { setTimeout(initDb, 100); }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_eduwystroj_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    const sharedPro = window.localStorage.getItem('eduboxProStatus') === 'active' || window.localStorage.getItem('eduAwansPremium') === 'active';
                    if (savedPremium === 'unlocked' || sharedPro) setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 4000);
            };

            const handlePremiumCheck = async () => {
                const __res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: premiumCode })
                });
                const __data = await __res.json();
                if (__data.valid) {
                    setIsPremium(true);
                    try {
                        if (__data.bonus === true && __data.until) {
                            window.localStorage.setItem('eduboxBonusUntil', __data.until);
                            window.localStorage.setItem('eduboxProStatus', 'active');
                        } else {
                            window.localStorage.setItem('edubox_premium', 'unlocked');
                        }
                    } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else {
                    showMessage('Nieprawidłowy kod', 'error');
                }
            };

            const handleRefImageUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                if (file.size > 4 * 1024 * 1024) {
                    showMessage('Plik jest za duży (max 4MB). Wybierz mniejsze zdjęcie.', 'error');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => { setRefImage(ev.target.result); setRefImageName(file.name); };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            // Domyślne tytuły/podpisy używane, gdy dodajemy WŁASNE zdjęcie jako pierwszy element
            // danego układu (czyli jeszcze nic nie zostało wcześniej wygenerowane przez AI).
            const OWN_ITEM_DEFAULTS = {
                etykiety: { title: 'Etykiety na szafki' },
                drzwi: { title: 'W naszej sali dzieci są:' },
                kodeks: { title: 'Nasz Kodeks' },
                kaciki: { title: 'Nasze Kąciki' },
                plakat_choroba: { title: 'Zostaw dziecko w domu, gdy:', subtitle: 'Dbajmy wspólnie o zdrowie!', footer: 'DZIĘKUJEMY ZA WSPÓŁPRACĘ!' }
            };

            // Przerabia WŁASNE wgrane zdjęcie/rysunek (image-to-image) i dokłada je jako kolejny element
            // do BIEŻĄCEGO układu (etykiety, drzwi, kodeks, kąciki albo plakat) - albo zakłada nowy zestaw
            // z tym jednym elementem, jeśli jeszcze nic nie było wygenerowane. W przeciwieństwie do
            // "Wygeneruj Zestaw" (który wymyśla treść od zera), tutaj AI ma się trzymać KONKRETNIE tego,
            // co użytkownik wgrał.
            const addOwnLabelFromImage = async () => {
                if (!refImage) return;
                const imgProStatus = localStorage.getItem('eduboxProStatus');
                const imgIsPro = imgProStatus === 'PRO' || imgProStatus === 'active' || isPremium;
                if (!imgIsPro && window.EduBoxCore.getImageUsageCount() >= 2) { showMessage('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący!', 'error'); return; }

                setIsAddingOwnLabel(true);
                try {
                    // Tryb "Pełny styl (opis AI)": zamiast wklejać zdjęcie bezpośrednio do generatora
                    // (co blokuje styl 3D Pixar - SDXL image-to-image mocno trzyma się oryginalnych
                    // pikseli), najpierw prosimy AI o opisanie tego, co widzi na zdjęciu, i rysujemy
                    // od nowa na podstawie tego opisu. Traci się dosłowną wierność zdjęciu, ale styl
                    // 3D Pixar zadziała w pełni - dokładnie ten sam mechanizm co w EduPlakat.
                    const useDescribeMode = refImageMode === 'describe';
                    let bodyParams;
                    if (useDescribeMode) {
                        const descRes = await fetch('/api/describe-image', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image_url: refImage })
                        });
                        const descData = await descRes.json().catch(() => ({}));
                        if (!descRes.ok || !descData.description) throw new Error(descData.error || 'Nie udało się przeanalizować wzoru.');
                        const stylePrompt = theme.trim()
                            ? `Cute 3D Pixar Disney style illustration of: ${descData.description}. Matching the theme "${theme}", white background, isolated subject`
                            : `Cute 3D Pixar Disney style illustration of: ${descData.description}. White background, isolated subject`;
                        bodyParams = { prompt: stylePrompt, style: 'disney', format: 'naklejka', customText: '' };
                    } else {
                        const stylePrompt = theme.trim()
                            ? `Cute 3D Pixar Disney style illustration based on the uploaded reference image, matching the theme "${theme}", white background, isolated subject`
                            : `Cute 3D Pixar Disney style illustration based on the uploaded reference image, white background, isolated subject`;
                        bodyParams = { prompt: stylePrompt, style: 'disney', format: 'naklejka', customText: '', init_image: refImage, image_strength: refImageMode === 'close' ? 0.35 : 0.6 };
                    }

                    const res = await fetch('/api/malarz', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyParams)
                    });
                    // WAŻNE: czytamy body PRZED sprawdzeniem res.ok, żeby konkretny komunikat backendu
                    // (np. o zablokowaniu zdjęcia przez filtr bezpieczeństwa AI) faktycznie dotarł do
                    // użytkownika, zamiast być zastąpiony ogólnikowym "Błąd generowania obrazka".
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.error || 'Błąd generowania obrazka.');
                    if (!data.url) throw new Error('Brak wygenerowanego obrazka.');

                    const palette = OWN_ITEM_PALETTE[Math.floor(Math.random() * OWN_ITEM_PALETTE.length)];
                    const currentType = (resultData && resultData.type) || layoutType;
                    const caption = refImageCaption.trim();

                    let newItem;
                    if (currentType === 'etykiety') {
                        newItem = { imgUrl: data.url, borderColor: palette.borderColor };
                    } else if (currentType === 'plakat_choroba') {
                        newItem = { title: caption || 'Dodane ręcznie', desc: 'Element dodany przez nauczyciela.', imgUrl: data.url, bgColor: palette.bgColor, headerColor: palette.headerColor };
                    } else {
                        // drzwi, kodeks, kaciki mają identyczny kształt elementu: {text, imgUrl, bgColor, textColor}
                        newItem = { text: caption || 'Mój wpis', imgUrl: data.url, bgColor: palette.bgColor, textColor: palette.textColor };
                    }

                    setResultData(prev => {
                        if (prev && prev.type === currentType && prev.data && prev.data.items) {
                            return { ...prev, data: { ...prev.data, items: [...prev.data.items, newItem] } };
                        }
                        return { type: currentType, data: { ...OWN_ITEM_DEFAULTS[currentType], items: [newItem] }, params: { theme, groupAge } };
                    });
                    setLayoutType(currentType);
                    setPrintSize('medium');

                    if (!imgIsPro) {
                        const today = new Date().toISOString().split('T')[0];
                        const newImgCount = window.EduBoxCore.getImageUsageCount() + 1;
                        localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                    }
                    setRefImage(null);
                    setRefImageName('');
                    setRefImageCaption('');
                    showMessage('Dodano do zestawu!', 'success');
                } catch (error) {
                    showMessage(error.message, 'error');
                } finally {
                    setIsAddingOwnLabel(false);
                }
            };

            const generateContent = async () => {
                const imgProStatus = localStorage.getItem('eduboxProStatus');
                const imgIsPro = imgProStatus === 'PRO' || imgProStatus === 'active' || isPremium;
                if (!imgIsPro && window.EduBoxCore.getImageUsageCount() >= 2) { showMessage('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący!', 'error'); return; }
                if (!theme.trim()) { showMessage('Wpisz motyw!', 'error'); return; }
                
                setIsGenerating(true);
                setResultData(null);
                setLabelNames({});

                let sysPrompt = "";
                
                if (layoutType === 'drzwi') {
                    sysPrompt = `Projektujesz premium dekoracje przedszkolne. Wygeneruj zestaw na drzwi z głównym hasłem i 5 cechami dzieci.
Wymyśl angielski 'image_prompt' dla uroczej ilustracji 3D (Pixar style) radośnie bawiących się dzieci pasujących do cechy.
WYMÓG JSON:
{
  "title": "W naszej sali dzieci są:",
  "header_img_prompt": "Cute 3D illustration of happy kids waving hands, full body, white background",
  "items": [
    { "text": "Kreatywne", "image_prompt": "Cute 3D Pixar style illustration of a happy little child painting, white background", "bgColor": "bg-green-100", "textColor": "text-green-700" }
  ]
}`;
                } else if (layoutType === 'kodeks') {
                    sysPrompt = `Projektujesz "Kodeks Przedszkolaka". Wymyśl 6 krótkich zasad (w 1. os. l. mnogiej).
Dla każdej zasady podaj angielski 'image_prompt' ilustracji 3D (Pixar style) demonstrującej zasadę.
WYMÓG JSON:
{
  "title": "Nasz Kodeks",
  "header_img_prompt": "Cute 3D illustration of kids holding hands smiling, white background",
  "items": [
    { "text": "Sprzątamy zabawki", "image_prompt": "Cute 3D Pixar style illustration of two kids putting toys in a box, white background", "bgColor": "bg-blue-50", "textColor": "text-blue-800" }
  ] 
}`;
                } else if (layoutType === 'kaciki') {
                    sysPrompt = `Projektujesz szyldy do kącików tematycznych. Wygeneruj 4 kąciki pasujące do wieku i tematu.
Dla każdego podaj angielski 'image_prompt' z przepiękną, szczegółową ilustracją 3D.
WYMÓG JSON:
{
  "title": "Nasze Kąciki",
  "items": [
    { "text": "Kącik Czytelniczy", "image_prompt": "Cute 3D Pixar style illustration of kids reading a big magical storybook, white background", "bgColor": "bg-amber-100", "textColor": "text-amber-800" }
  ] 
}`;
                } else if (layoutType === 'plakat_choroba') {
                    sysPrompt = `Projektujesz plakat edukacyjny o objawach chorób.
Dla każdego z 4 objawów podaj uroczy 'image_prompt' 3D Pixar style obrazujący chore dziecko.
WYMÓG JSON:
{
  "title": "Zostaw dziecko w domu, gdy:",
  "subtitle": "Dbajmy wspólnie o zdrowie!",
  "footer": "DZIĘKUJEMY ZA WSPÓŁPRACĘ!",
  "items": [
    { "title": "Ma Gorączkę", "desc": "Zawsze zostań w domu...", "image_prompt": "Cute 3D Pixar style illustration of a sad kid in bed with thermometer, white background", "bgColor": "bg-red-50", "headerColor": "bg-red-500" }
  ] 
}`;
                } else if (layoutType === 'etykiety') {
                    sysPrompt = `Projektujesz luksusowe etykiety na szafki w szatni przedszkolnej.
Na podstawie podanego motywu (np. pszczółki, zwierzątka) wygeneruj 10 RÓŻNYCH symboli.
Dla każdego z nich podaj angielski 'image_prompt' dla uroczej ilustracji 3D (Pixar/Disney style).
WYMÓG JSON:
{
  "title": "Etykiety na szafki",
  "items": [
    { "image_prompt": "Cute 3D Pixar style illustration of a happy little yellow bee holding a flower", "borderColor": "border-yellow-400" },
    { "image_prompt": "Cute 3D Pixar style illustration of a happy little yellow bee wearing a tiny crown", "borderColor": "border-amber-400" }
  ]
}`;
                }

                const prompt = `Motyw przewodni: ${theme}. Wiek: ${groupAge}. Stwórz piękny, zróżnicowany pakiet.`;

                try {
                    setGenStatus('Krok 1: Planowanie koncepcji (OpenAI)...');
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setGenStatus('Krok 2: Malowanie głównych grafik (Pixar 3D Style)...');
                    
                    if (parsedJson.header_img_prompt) {
                        parsedJson.headerImgUrl = await fetchImageAI(parsedJson.header_img_prompt);
                    }

                    setGenStatus(`Krok 3: Rysowanie ${parsedJson.items.length} unikalnych ilustracji (Może potrwać ok. 20 sek)...`);
                    const itemsWithImages = await Promise.all(
                        parsedJson.items.map(async (item) => {
                            const imgUrl = await fetchImageAI(item.image_prompt);
                            return { ...item, imgUrl: imgUrl || 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop' }; 
                        })
                    );
                    
                    parsedJson.items = itemsWithImages;

                    if (!imgIsPro) {
                        const today = new Date().toISOString().split('T')[0];
                        const newImgCount = window.EduBoxCore.getImageUsageCount() + 1;
                        localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                    }
                    setResultData({ type: layoutType, data: parsedJson, params: { theme, groupAge } });
                    
                    // "Wielkie/1 kolumna" ma sens tylko dla "drzwi" (kilka szerokich, owalnych rzędów).
                    // Dla pozostałych układów z wieloma kartami (kodeks, kaciki, plakat_choroba) wymuszanie
                    // 1 kolumny + ogromnego tytułu (skalowanego razem z printSize) potrafiło zepchnąć CAŁĄ
                    // treść na 2. stronę wydruku, zostawiając 1. stronę praktycznie pustą (tylko tytuł).
                    if (layoutType === 'etykiety') setPrintSize('medium');
                    else if (layoutType === 'drzwi') setPrintSize('large');
                    else setPrintSize('medium');
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_eduwystroj_ai', newCount.toString()); } catch(e) {}
                    }
                    showMessage('Gotowe do druku!', 'success');
                } catch (error) {
                    showMessage(error.message, 'error'); 
                } finally { 
                    setIsGenerating(false); 
                    setGenStatus('');
                }
            };

            const downloadPDF = async () => {
                const printEl = printOnlyRef.current;
                if (!printEl) return;
                setIsDownloadingPdf(true);

                // .print-only jest normalnie ukryte (display:none) na ekranie - html2canvas nie potrafi
                // porządnie sfotografować czegoś niewidocznego, więc chwilowo "odsłaniamy" je poza kadrem,
                // robimy zdjęcie DOKŁADNIE tego, co idzie na wydruk (więc PDF = wydruk 1:1), i chowamy z powrotem.
                const prevCssText = printEl.style.cssText;
                const pdfFontSize = printSize === 'large' ? '22px' : printSize === 'small' ? '12px' : '16px';
                printEl.style.cssText = `display:block !important; position:fixed; left:-9999px; top:0; width:794px; background:#ffffff; z-index:-1; font-size:${pdfFontSize};`;

                try {
                    // Krótka pauza, by przeglądarka zdążyła policzyć layout/obrazki przed zrzutem.
                    await new Promise(r => setTimeout(r, 50));
                    const canvas = await html2canvas(printEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const imgWidth = pdfWidth;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    let heightLeft = imgHeight;
                    let position = 0;
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pdfHeight;
                    while (heightLeft > 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pdfHeight;
                    }
                    pdf.save(`EduWystroj_${(theme || 'projekt').replace(/[^a-zA-Z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ ]/g, '')}.pdf`);
                } catch (error) {
                    console.error('Błąd generowania PDF:', error);
                    showMessage('Nie udało się pobrać PDF. Użyj przycisku "Drukuj" i wybierz "Zapisz jako PDF".', 'error');
                } finally {
                    printEl.style.cssText = prevCssText;
                    setIsDownloadingPdf(false);
                }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Błąd autoryzacji bazy.', 'error'); return; }

                try {

                                                </>

                                ))}
                            </div>

                    {message && (

                                    <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-3 flex gap-2 items-start">
                                        <span className="text-base flex-shrink-0">ℹ️</span>
                                        <p className="text-[11px] text-emerald-900 leading-relaxed"><strong>Jak to działa:</strong> wybierz co projektujesz (etykiety, zestaw na drzwi, kodeks, szyldy do kącików...), podaj motyw (np. „Kosmos") i grupę wiekową - AI wygeneruje spójny, gotowy do druku layout w wektorowym formacie.</p>
                                    </div>

                                    <div className="space-y-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Co projektujemy?</label>
                                            <select value={layoutType} onChange={e => setLayoutType(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm font-semibold text-slate-800 focus:border-emerald-500 outline-none shadow-sm">
                                                <option value="etykiety">🏷️ Etykiety na Szafki (Z miejscem na imię)</option>
                                                <option value="drzwi">🚪 Zestaw na Drzwi (W naszej sali...)</option>
                                                <option value="kodeks">📌 Kodeks Przedszkolaka (Tablica)</option>
                                                <option value="kaciki">🧩 Duże Szyldy do Kącików</option>
                                                <option value="plakat_choroba">🤒 Plakat informacyjny "Zostaw dziecko w domu"</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Motyw / Nazwa / Symbole</label>
                                            <input 
                                                type="text" 
                                                value={theme} 
                                                onChange={e => setTheme(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Zwierzątka, Kosmos, Pszczółki..." 
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Grupa docelowa</label>
                                            <input 
                                                type="text" 
                                                value={groupAge} 
                                                onChange={e => setGroupAge(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Przedszkolaki 4-letnie" 
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-3 bg-indigo-50 border border-indigo-200 rounded-2xl p-4 shadow-sm">
                                        <label className="text-[10px] font-bold text-indigo-700 uppercase flex items-center gap-1">
                                            <i className="ph-bold ph-camera"></i> Własny element ze zdjęcia (opcjonalnie)
                                        </label>
                                        <p className="text-[10px] text-indigo-600 leading-snug">Wgraj zdjęcie zabawki, maskotki albo rysunek dziecka - AI narysuje je w wybranym stylu i doda jako kolejny element do bieżącego układu (etykiety, drzwi, kodeks, kąciki albo plakat).</p>
                                        {!refImage ? (
                                            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-indigo-300 rounded-xl p-3 text-xs font-bold text-indigo-600 cursor-pointer hover:bg-indigo-100 transition-colors">
                                                <i className="ph-bold ph-upload-simple"></i> Wybierz plik
                                                <input type="file" accept="image/*" className="hidden" onChange={handleRefImageUpload} />
                                            </label>
                                        ) : (
                                            <div className="space-y-2">
                                                <div className="flex items-center gap-3 bg-white rounded-xl p-2 border border-indigo-200">
                                                    <img src={refImage} className="w-12 h-12 object-cover rounded-lg shrink-0" />
                                                    <span className="flex-1 text-[10px] text-slate-500 truncate">{refImageName}</span>
                                                    <button onClick={() => { setRefImage(null); setRefImageName(''); }} className="text-slate-400 hover:text-red-500 shrink-0"><i className="ph-bold ph-x"></i></button>
                                                </div>
                                                <div className="flex gap-1.5">
                                                    <button onClick={() => setRefImageMode('close')} className={`flex-1 py-2 px-2 rounded-lg border-2 text-[10px] font-bold transition-all ${refImageMode === 'close' ? 'bg-indigo-100 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-400'}`}>Podobne do wzoru</button>
                                                    <button onClick={() => setRefImageMode('creative')} className={`flex-1 py-2 px-2 rounded-lg border-2 text-[10px] font-bold transition-all ${refImageMode === 'creative' ? 'bg-indigo-100 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-400'}`}>Tylko inspiracja</button>
                                                    <button onClick={() => setRefImageMode('describe')} className={`flex-1 py-2 px-2 rounded-lg border-2 text-[10px] font-bold transition-all ${refImageMode === 'describe' ? 'bg-purple-100 border-purple-500 text-purple-700' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-400'}`}>Pełny styl (opis AI)</button>
                                                </div>
                                                <p className="text-[9px] text-indigo-500 leading-snug px-0.5">
                                                    {refImageMode === 'close' && 'Obraz zostanie blisko wzoru - styl 3D Pixar ma ograniczony wpływ.'}
                                                    {refImageMode === 'creative' && 'Wzór to tylko inspiracja - więcej swobody dla AI, nadal ograniczony wpływ stylu.'}
                                                    {refImageMode === 'describe' && 'AI opisze wzór słowami i narysuje od nowa w pełnym stylu 3D Pixar - traci dosłowną wierność zdjęciu.'}
                                                </p>
                                                {layoutType !== 'etykiety' && (
                                                    <input
                                                        type="text"
                                                        value={refImageCaption}
                                                        onChange={e => setRefImageCaption(e.target.value)}
                                                        placeholder="Podpis (np. Dbamy o rośliny)"
                                                        className="w-full bg-white border border-indigo-200 rounded-lg p-2 text-xs text-slate-800 focus:border-indigo-500 outline-none"
                                                    />
                                                )}
                                            </div>
                                        )}
                                        <button onClick={addOwnLabelFromImage} disabled={!refImage || isAddingOwnLabel} className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 disabled:opacity-50 transition-all">
                                            {isAddingOwnLabel ? (<><i className="ph-bold ph-spinner animate-spin"></i> Przerabiam zdjęcie...</>) : (<><i className="ph-bold ph-magic-wand"></i> Dodaj do zestawu</>)}
                                        </button>
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[10px] font-bold text-amber-700 flex flex-col gap-2 shadow-inner">
                                        <div className="flex gap-2 items-center"><i className="ph-fill ph-magic-wand text-xl shrink-0"></i> <span>Aplikacja użyje potężnego silnika 3D (Pixar Style) z systemu Fal.ai.</span></div>
                                        <span className="text-amber-600">Proces potrwa ok. 20 sekund – malujemy wysokiej jakości wektory!</span>
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <button onClick={generateContent} disabled={isGenerating} className="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-50 min-h-[70px]">
                                            {isGenerating ? (
                                                <><i className="ph-bold ph-spinner animate-spin text-xl"></i><span className="text-xs font-semibold">{genStatus}</span></>
                                            ) : (
                                                <span className="flex items-center gap-2"><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Zestaw</span>
                                            )}
                                        </button>
                                    </div>
                                </>
                            )}

                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-400"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak projektów. Zrób pierwszy!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-white rounded-xl p-4 border border-slate-200 hover:border-emerald-500 transition-colors shadow-sm cursor-pointer" 
                                                     onClick={() => { 
                                                        setResultData({ type: item.config.type, data: item.config.data, params: item.config.params }); 
                                                        setLayoutType(item.config.type);
                                                        setAppMode('kreator'); 
                                                     }}>
                                                    <div className="flex items-center gap-2 font-kids font-bold text-slate-800">
                                                        <i className="ph-fill ph-file-pdf text-emerald-500 text-lg"></i> {item.name}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-200 bg-slate-50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:border-emerald-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-emerald-100 to-teal-100 border border-emerald-300 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-emerald-600"></i>
                                    <div><p className="text-xs font-bold text-emerald-900">Wersja PRO MAX</p><p className="text-[9px] text-emerald-700">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 min-h-0 flex flex-col relative z-10 overflow-hidden no-print bg-slate-200/50">
                        <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-6 lg:p-12 relative flex justify-center">
                            
                            {!resultData ? (
                                <div className="text-center text-emerald-900/20 max-w-md mx-auto my-auto">
                                    <i className="ph-fill ph-layout text-7xl mb-6 animate-pulse"></i>
                                    <p className="font-bold text-lg text-emerald-900/40">Wybierz moduł dekoracji. Model Flux 3D wygeneruje ilustracje w stylu popularnych filmów animowanych, zachowując najwyższą jakość wydruku.</p>
                                </div>
                            ) : (
                                <div className="space-y-8 animate-[reveal_0.4s_ease-out] w-full max-w-5xl">
                                    
                                    {/* PODGLĄD NA ŻYWO */}
                                    <div className="shadow-2xl rounded-2xl overflow-hidden border border-slate-300 bg-slate-100/80 backdrop-blur-md pb-10">
                                        <div className="bg-slate-800 text-slate-300 text-xs font-bold px-4 py-2 flex items-center justify-between">
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-eye"></i> Podgląd Układu (Jak w PDF)</span>
                                            <span className="flex gap-1.5"><div className="w-2.5 h-2.5 rounded-full bg-red-500"></div><div className="w-2.5 h-2.5 rounded-full bg-yellow-500"></div><div className="w-2.5 h-2.5 rounded-full bg-green-500"></div></span>
                                        </div>
                                        <div className="p-4 md:p-8 overflow-x-auto">
                                            <div ref={previewRef} className="preview-scale-wrap">
                                                {renderLayout(false)}
                                            </div>
                                        </div>
                                    </div>

                                    {/* AKCJE I ROZMIAR */}
                                    <div className="mt-10 bg-white border-4 border-emerald-300 rounded-3xl p-8 text-center shadow-2xl flex flex-col items-center mb-32">
                                        <h3 className="text-2xl font-kids font-black text-slate-800 mb-6">Gotowe do druku! 🖨️</h3>

                                        {/* PANEL WYBORU ROZMIARU WYDRUKU */}
                                        <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 w-full max-w-2xl mb-8 shadow-sm">
                                            <h4 className="text-sm font-bold text-emerald-800 mb-4 uppercase tracking-wider flex items-center justify-center gap-2">
                                                <i className="ph-bold ph-frame-corners text-xl"></i> Wybierz rozmiar na wydruku A4
                                            </h4>
                                            <div className="flex flex-wrap justify-center gap-3">
                                                <button onClick={() => setPrintSize('large')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all ${printSize === 'large' ? 'bg-emerald-600 text-white shadow-md' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-50'}`}>Wielkie (1-2 na stronę)</button>
                                                <button onClick={() => setPrintSize('medium')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all ${printSize === 'medium' ? 'bg-emerald-600 text-white shadow-md' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-50'}`}>Średnie (4-6 na stronę)</button>
                                                <button onClick={() => setPrintSize('small')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all ${printSize === 'small' ? 'bg-emerald-600 text-white shadow-md' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-50'}`}>Małe (9+ na stronę)</button>
                                            </div>
                                            <p className="text-[10px] text-emerald-600 mt-4 font-semibold">
                                                Rozmiar zmieni się automatycznie w oknie podglądu druku (CTRL+P).
                                            </p>
                                        </div>

                                        <div className="bg-sky-50 border border-sky-200 rounded-2xl p-6 w-full max-w-2xl mb-8 shadow-sm">
                                            <h4 className="text-sm font-bold text-sky-800 mb-4 uppercase tracking-wider flex items-center justify-center gap-2">
                                                <i className="ph-bold ph-text-aa text-xl"></i> Wybierz czcionkę napisów
                                            </h4>
                                            <div className="flex flex-wrap justify-center gap-3">
                                                {Object.entries(FONT_OPTIONS).map(([key, opt]) => (
                                                    <button key={key} onClick={() => setFontChoice(key)} style={{ fontFamily: opt.css }} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all ${fontChoice === key ? 'bg-sky-600 text-white shadow-md' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-50'}`}>{opt.label}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <p className="text-slate-500 text-sm max-w-md mx-auto">Wciśnij Drukuj i upewnij się, że w oknie drukarki zaznaczona jest opcja <strong>"Drukuj grafiki tła" (Background graphics)</strong>. Przyciski DRUKUJ / POBIERZ PDF / DODAJ DO BAZY są zawsze widoczne na dole ekranu ⬇️</p>
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* PASEK AKCJI - position:fixed do samego viewportu (NIE zależy od tego, czy
                            zagnieżdżony flex/overflow-y-auto łańcuch się prawidłowo domknie do 100vh -
                            to okazało się zawodne w praktyce), więc jest gwarantowanie zawsze widoczny.
                            WAŻNE: rodzic (<main>) NIE MOŻE mieć backdrop-filter/filter/transform - taka
                            właściwość tworzy nowy "containing block" dla potomków position:fixed (zgodnie
                            ze specyfikacją CSS), więc pasek zaczyna się pozycjonować względem <main>
                            zamiast względem realnego viewportu i ginie za overflow-hidden na <main>.
                            To była prawdziwa przyczyna całkowitego zniknięcia przycisków (usunięto
                            klasę Tailwind "backdrop-blur-sm" z <main> powyżej). */}
                        {resultData && (
                            <div className="no-print action-bar-fixed border-t-4 border-emerald-400 bg-white/95 backdrop-blur-md px-4 py-3 flex items-center justify-center gap-3 flex-wrap shadow-[0_-8px_24px_rgba(0,0,0,0.25)]" style={{ position: 'fixed', bottom: 0, left: '20rem', right: 0, zIndex: 200 }}>
                                <button onClick={() => window.print()} className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30">
                                    <i className="ph-bold ph-printer text-xl"></i> DRUKUJ
                                </button>
                                <button onClick={downloadPDF} disabled={isDownloadingPdf} className="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-rose-500/30 disabled:opacity-50">
                                    {isDownloadingPdf ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-file-pdf text-xl"></i>} POBIERZ PDF
                                </button>
                                <button onClick={publishToMarket} disabled={isPublishing} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30 disabled:opacity-50">
                                    {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-xl"></i>} DODAJ DO BAZY
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
