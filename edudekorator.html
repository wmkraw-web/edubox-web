<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBox V3 PRO MAX - EduWystrój AI (Ilustrowany)</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- NOWE, PEWNE CZCIONKI Z POLSKIMI ZNAKAMI (Baloo 2 i Kalam) -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Globalny Core Bazy Danych -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
    </script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; color: #0f172a; overflow: hidden; }
        
        /* Zaktualizowane klasy dla nowych czcionek z polskimi znakami */

        .font-hand { font-family: 'Kalam', cursive; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        .aura-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .aura-blob { position: absolute; filter: blur(130px); border-radius: 50%; opacity: 0.4; animation: float 20s ease-in-out infinite alternate; }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, rgba(0,0,0,0) 70%); }
        .aura-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(0,0,0,0) 70%); animation-delay: -5s; }
        .aura-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(244, 63, 94, 0.3) 0%, rgba(0,0,0,0) 70%); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.05); }
        }

        /* --- PREMIUM BORDERS & STYLES --- */
        .premium-border {
            border: 6px solid white;
            outline: 4px dashed rgba(0,0,0,0.1);
            outline-offset: -8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* --- STUDIO WYDRUKU: ABSOLUTNIE PANCERNA WIELOSTRONICOWOŚĆ --- */
        @media screen {
            .print-only { display: none !important; }
        }

        @media print {
            @page { margin: 10mm; size: A4 portrait; }
            
            html, body, #root, .h-screen, .flex, .flex-col, .overflow-hidden, .overflow-y-auto { 
                display: block !important;

                height: auto !important;

            main { display: block !important; width: 100% !important; height: auto !important; background: white !important; }

                background: white !important;

            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    </style>
</head>
<body>
    <div id="root" class="h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseAIResponse = (aiOutput) => {
            let text = String(aiOutput?.text || aiOutput?.response || aiOutput?.content || aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    return JSON.parse(jsonStr.replace(/,\s*([\]}])/g, '$1'));
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu. Spróbuj ponownie.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON. Nie używaj znaczników markdown.\n\n${systemInstruction}\n\nZADANIE:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.content || data;
                } else {
                    throw new Error(`Błąd API Text`);
                }
            } catch(e) { throw new Error("Brak połączenia z AI. " + e.message); }
        };

        const fetchImageAI = async (imagePrompt) => {
            try {
                const res = await fetch('/api/malarz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `${imagePrompt}. Modern 3D Pixar Disney style illustration, 8k resolution, masterpiece, highly detailed, vivid vibrant colors, cute and friendly, pure white background, perfectly centered, isolated subject.`, 
                        style: 'disney', 
                        format: 'naklejka', 
                        customText: '' 
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.url;
                }
                return null;
            } catch (e) {
                console.error("Błąd generowania obrazka:", e);
                return null;
            }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [genStatus, setGenStatus] = useState(''); 
            
            const [layoutType, setLayoutType] = useState('etykiety'); 
            const [theme, setTheme] = useState('Pszczółki');
            const [groupAge, setGroupAge] = useState('Przedszkolaki');
            
            const [resultData, setResultData] = useState(null);
            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else { setTimeout(initDb, 100); }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_eduwystroj_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    if (savedPremium === 'KAWA2024') setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 4000);
            };

            const handlePremiumCheck = () => {
                if (premiumCode.toUpperCase() === 'KAWA2024') {
                    setIsPremium(true); 
                    try { window.localStorage.setItem('edubox_premium', 'KAWA2024'); } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { 
                    showMessage('Nieprawidłowy kod', 'error'); 
                }
            };

            const generateContent = async () => {
                if (!isPremium && aiGenerations >= 3) { showMessage('Limit wyczerpany.', 'error'); return; }
                if (!theme.trim()) { showMessage('Wpisz motyw!', 'error'); return; }
                
                setIsGenerating(true);
                setResultData(null);

                let sysPrompt = "";
                
                if (layoutType === 'drzwi') {
                    sysPrompt = `Projektujesz premium dekoracje przedszkolne. Wygeneruj zestaw na drzwi z głównym hasłem i 5 cechami dzieci.
Wymyśl angielski 'image_prompt' dla uroczej ilustracji 3D (Pixar style) radośnie bawiących się dzieci pasujących do cechy.
WYMÓG JSON:
{
  "title": "W naszej sali dzieci są:",
  "header_img_prompt": "Cute 3D illustration of happy kids waving hands, full body, white background",
  "items": [
    { "text": "Kreatywne", "image_prompt": "Cute 3D Pixar style illustration of a happy little child painting, white background", "bgColor": "bg-green-100", "textColor": "text-green-700" }
  ]
}`;
                } else if (layoutType === 'kodeks') {
                    sysPrompt = `Projektujesz "Kodeks Przedszkolaka". Wymyśl 6 krótkich zasad (w 1. os. l. mnogiej).
Dla każdej zasady podaj angielski 'image_prompt' ilustracji 3D (Pixar style) demonstrującej zasadę.
WYMÓG JSON:
{
  "title": "Nasz Kodeks",
  "header_img_prompt": "Cute 3D illustration of kids holding hands smiling, white background",
  "items": [
    { "text": "Sprzątamy zabawki", "image_prompt": "Cute 3D Pixar style illustration of two kids putting toys in a box, white background", "bgColor": "bg-blue-50", "textColor": "text-blue-800" }
  ] 
}`;
                } else if (layoutType === 'kaciki') {
                    sysPrompt = `Projektujesz szyldy do kącików tematycznych. Wygeneruj 4 kąciki pasujące do wieku i tematu.
Dla każdego podaj angielski 'image_prompt' z przepiękną, szczegółową ilustracją 3D.
WYMÓG JSON:
{
  "title": "Nasze Kąciki",
  "items": [
    { "text": "Kącik Czytelniczy", "image_prompt": "Cute 3D Pixar style illustration of kids reading a big magical storybook, white background", "bgColor": "bg-amber-100", "textColor": "text-amber-800" }
  ] 
}`;
                } else if (layoutType === 'plakat_choroba') {
                    sysPrompt = `Projektujesz plakat edukacyjny o objawach chorób.
Dla każdego z 4 objawów podaj uroczy 'image_prompt' 3D Pixar style obrazujący chore dziecko.
WYMÓG JSON:
{
  "title": "Zostaw dziecko w domu, gdy:",
  "subtitle": "Dbajmy wspólnie o zdrowie!",
  "footer": "DZIĘKUJEMY ZA WSPÓŁPRACĘ!",
  "items": [
    { "title": "Ma Gorączkę", "desc": "Zawsze zostań w domu...", "image_prompt": "Cute 3D Pixar style illustration of a sad kid in bed with thermometer, white background", "bgColor": "bg-red-50", "headerColor": "bg-red-500" }
  ] 
}`;
                } else if (layoutType === 'etykiety') {
                    sysPrompt = `Projektujesz luksusowe etykiety na szafki w szatni przedszkolnej.
Na podstawie podanego motywu (np. pszczółki, zwierzątka) wygeneruj 10 RÓŻNYCH symboli.
Dla każdego z nich podaj angielski 'image_prompt' dla uroczej ilustracji 3D (Pixar/Disney style).
WYMÓG JSON:
{
  "title": "Etykiety na szafki",
  "items": [
    { "image_prompt": "Cute 3D Pixar style illustration of a happy little yellow bee holding a flower", "borderColor": "border-yellow-400" },
    { "image_prompt": "Cute 3D Pixar style illustration of a happy little yellow bee wearing a tiny crown", "borderColor": "border-amber-400" }
  ]
}`;
                }

                const prompt = `Motyw przewodni: ${theme}. Wiek: ${groupAge}. Stwórz piękny, zróżnicowany pakiet.`;

                try {
                    setGenStatus('Krok 1: Planowanie koncepcji (OpenAI)...');
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setGenStatus('Krok 2: Malowanie głównych grafik (Pixar 3D Style)...');
                    
                    if (parsedJson.header_img_prompt) {
                        parsedJson.headerImgUrl = await fetchImageAI(parsedJson.header_img_prompt);
                    }

                    setGenStatus(`Krok 3: Rysowanie ${parsedJson.items.length} unikalnych ilustracji (Może potrwać ok. 20 sek)...`);
                    const itemsWithImages = await Promise.all(
                        parsedJson.items.map(async (item) => {
                            const imgUrl = await fetchImageAI(item.image_prompt);
                            return { ...item, imgUrl: imgUrl || 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop' }; 
                        })
                    );
                    
                    parsedJson.items = itemsWithImages;

                    setResultData({ type: layoutType, data: parsedJson, params: { theme, groupAge } });
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_eduwystroj_ai', newCount.toString()); } catch(e) {}
                    }
                    showMessage('Gotowe do druku!', 'success');
                } catch (error) { 
                    showMessage(error.message, 'error'); 
                } finally { 
                    setIsGenerating(false); 
                    setGenStatus('');
                }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Błąd autoryzacji bazy.', 'error'); return; }
                setIsPublishing(true);
                try {
                    await window.EduBoxCore.saveToGielda('eduwystroj_market', 'eduwystroj', `${layoutType} - ${theme}`, resultData);
                    showMessage('Opublikowano w Galerii!', 'success');
                    setAppMode('gielda');
                } catch (error) { showMessage(error.message || 'Błąd publikacji.', 'error'); } 
                finally { setIsPublishing(false); }
            };

            useEffect(() => {
                let unsubscribe = null;
                if (appMode === 'gielda') {
                    setIsFetchingMarket(true);
                    if(window.EduBoxCore && window.EduBoxCore.subscribeToGielda) {
                        unsubscribe = window.EduBoxCore.subscribeToGielda('eduwystroj_market', (items) => {
                            setMarketItems(items); setIsFetchingMarket(false);
                        }, () => setIsFetchingMarket(false));
                    }
                }
                return () => { if (unsubscribe) unsubscribe(); }
            }, [appMode]);

            // --- RENDEROWANIE PIĘKNYCH UKŁADÓW ---
            const renderLayout = () => {
                if (!resultData || !resultData.data) return null;
                const { type, data } = resultData;

                if (type === 'etykiety') {
                    return (
                        <div className="bg-white p-6 w-full max-w-5xl mx-auto rounded-xl">
                            <div className="bg-emerald-50 text-emerald-800 border-2 border-emerald-200 px-6 py-4 rounded-xl mb-6 text-center font-bold no-print flex flex-col md:flex-row items-center justify-center gap-3">
                                <i className="ph-fill ph-keyboard text-3xl"></i>
                                <span>Kliknij w pola z napisem <strong>"Imię Dziecka"</strong> poniżej, aby wpisać imiona przedszkolaków! Dopiero potem wciśnij Drukuj.</span>
                            </div>

                            <div className="grid grid-cols-2 gap-6">
                                {data.items.map((item, i) => (
                                    <div key={i} className={`bg-white border-[6px] ${item.borderColor || 'border-yellow-400'} rounded-[32px] p-2 flex items-stretch shadow-md print-break-inside-avoid h-[130px] md:h-[150px] relative overflow-hidden group`}>
                                        <div className="w-24 md:w-32 h-full shrink-0 bg-white rounded-[20px] overflow-hidden border-[3px] border-slate-100 shadow-sm mr-3 flex items-center justify-center">
                                            <img src={item.imgUrl} className="max-w-full max-h-full object-contain p-1" />
                                        </div>
                                        <div className="flex-1 bg-slate-50/80 rounded-[20px] border-2 border-dashed border-slate-300 relative flex items-center justify-center overflow-hidden transition-colors hover:bg-slate-100/80 focus-within:border-emerald-400">
                                            <div className="absolute top-2 right-3 text-xl opacity-30">⭐</div>
                                            <div className="absolute bottom-2 left-3 text-xl opacity-30">❤️</div>
                                            <input 
                                                type="text" 
                                                placeholder="Imię Dziecka"
                                                className="w-full h-full bg-transparent text-center outline-none font-kids text-2xl md:text-3xl font-bold text-slate-800 placeholder-slate-300 px-4 z-10"
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (type === 'drzwi') {
                    return (
                        <div className="flex flex-col items-center gap-6 bg-white p-10 w-full max-w-3xl mx-auto rounded-xl">
                            <div className="bg-sky-50 premium-border rounded-[60px] p-8 text-center relative w-full print-break-inside-avoid">
                                {data.headerImgUrl && (
                                    <div className="w-48 h-32 mx-auto mb-4 overflow-hidden rounded-full border-4 border-white shadow-inner">
                                        <img src={data.headerImgUrl} className="w-full h-full object-cover" />
                                    </div>
                                )}
                                <h1 className="text-4xl md:text-5xl font-kids font-black text-sky-700 leading-tight drop-shadow-sm">
                                    {data.title}
                                </h1>
                            </div>
                            {data.items.map((item, i) => (
                                <div key={i} className={`w-[90%] ${item.bgColor} premium-border rounded-full p-2 pr-10 flex items-center shadow-md print-break-inside-avoid`}>
                                    <div className="w-24 h-24 rounded-full border-4 border-white shadow-sm overflow-hidden shrink-0 bg-white flex items-center justify-center">
                                        <img src={item.imgUrl} className="max-w-full max-h-full object-contain p-1" />
                                    </div>
                                    <div className={`font-kids font-black text-3xl md:text-4xl ${item.textColor} tracking-wide text-center flex-1`}>
                                        {item.text}
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                }

                if (type === 'kodeks') {
                    return (
                        <div className="bg-[#e7d5b8] p-10 w-full max-w-5xl mx-auto rounded-xl shadow-inner relative" style={{backgroundImage: 'url("https://www.transparenttextures.com/patterns/cork-board.png")'}}>
                            <div className="text-center mb-12 print-break-inside-avoid">
                                <div className="inline-block bg-white/95 premium-border rounded-[40px] px-16 py-6 shadow-xl rotate-1 relative">
                                    <div className="absolute -top-6 -left-6 text-5xl transform -rotate-12 drop-shadow-md">📌</div>
                                    <h1 className="text-5xl md:text-7xl font-kids font-black text-amber-600 drop-shadow-sm">{data.title}</h1>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-8">
                                {data.items.map((item, i) => (
                                    <div key={i} className={`${item.bgColor} premium-border rounded-3xl p-4 flex flex-col items-center text-center shadow-lg relative print-break-inside-avoid transform ${i%2 === 0 ? '-rotate-1' : 'rotate-2'}`}>
                                        <div className="absolute -top-4 left-1/2 -translate-x-1/2 text-3xl drop-shadow-md">📍</div>
                                        <div className="w-full aspect-square rounded-2xl bg-white border-2 border-white/50 shadow-inner overflow-hidden mb-4 p-2 flex items-center justify-center">
                                            <img src={item.imgUrl} className="max-w-full max-h-full object-contain" />
                                        </div>
                                        <div className={`font-kids font-bold text-xl md:text-2xl leading-snug px-2 pb-2 ${item.textColor}`}>
                                            {item.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (type === 'kaciki') {
                    return (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 w-full max-w-5xl mx-auto rounded-xl">
                            {data.items.map((item, i) => (
                                <div key={i} className={`${item.bgColor} premium-border rounded-[40px] p-4 relative flex items-center shadow-lg print-break-inside-avoid`}>
                                    <div className="w-40 h-40 rounded-3xl bg-white shadow-inner overflow-hidden shrink-0 border-4 border-white/60 z-10 relative left-2 p-2 flex items-center justify-center">
                                        <img src={item.imgUrl} className="max-w-full max-h-full object-contain" />
                                    </div>
                                    <div className="flex-1 text-center pr-6 pl-4 relative z-10">
                                        <h2 className={`font-kids font-black text-3xl md:text-4xl ${item.textColor} uppercase leading-tight drop-shadow-sm`}>
                                            {item.text}
                                        </h2>
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                }

                if (type === 'plakat_choroba') {
                    return (
                        <div className="bg-white p-8 md:p-12 w-full max-w-5xl mx-auto rounded-xl shadow-2xl print-break-inside-avoid border-8 border-sky-100">
                            <div className="text-center mb-10 bg-sky-50 rounded-[50px] premium-border p-8 relative">
                                <h1 className="text-5xl md:text-6xl font-kids font-black text-red-600 uppercase tracking-tight mb-4 drop-shadow-md leading-none">{data.title}</h1>
                                <p className="text-2xl font-kids font-bold text-sky-800">{data.subtitle}</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {data.items.map((item, i) => (
                                    <div key={i} className={`${item.bgColor} premium-border rounded-[40px] overflow-hidden shadow-lg flex flex-col h-full print-break-inside-avoid`}>
                                        <div className={`${item.headerColor} text-white p-5 flex items-center gap-4 border-b-4 border-white/20`}>
                                            <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl font-black text-slate-800 shadow-inner shrink-0">{i+1}</div>
                                            <h2 className="font-kids font-black text-2xl md:text-3xl leading-tight drop-shadow-sm">{item.title}</h2>
                                        </div>
                                        <div className="p-6 flex items-center gap-6 grow">
                                            <p className="font-sans font-semibold text-slate-800 leading-relaxed text-lg flex-1">{item.desc}</p>
                                            <div className="w-32 h-32 shrink-0 rounded-full border-4 border-white shadow-md overflow-hidden bg-white p-1 flex items-center justify-center">
                                                <img src={item.imgUrl} className="max-w-full max-h-full object-contain" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-10 text-center bg-pink-50 rounded-full py-6 px-10 premium-border">
                                <p className="font-kids font-black text-3xl text-pink-600 drop-shadow-sm">💖 {data.footer} 💖</p>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            return (
                <div className="flex h-screen w-full bg-emerald-950 text-slate-800 overflow-hidden relative selection:bg-emerald-500/30">
                    <div className="aura-container no-print"><div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div></div>

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'} no-print`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    {/* Widok Drukowania */}
                    <div className="print-only">
                        {renderLayout()}
                    </div>

                    <aside className="w-80 flex-shrink-0 bg-white/90 backdrop-blur-xl border-r border-emerald-100 flex flex-col h-full z-10 no-print transition-all duration-300 shadow-xl">
                        <div className="p-6 border-b border-emerald-100 flex items-center gap-3 bg-emerald-50/50">
                            <div className="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                                <i className="ph-bold ph-scissors text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-kids font-black tracking-tight text-emerald-800 leading-none uppercase">EduWystrój</h1>
                                <p className="text-[10px] text-emerald-500 font-bold tracking-wider uppercase mt-1">Kreator Layoutów</p>
                            </div>
                        </div>

                        <div className="px-4 py-3 flex gap-2 border-b border-emerald-100">
                            <button onClick={() => setAppMode('kreator')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                <i className="ph-bold ph-pencil-simple"></i> Szablony
                            </button>
                            <button onClick={() => setAppMode('gielda')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                <i className="ph-bold ph-image"></i> Baza
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            {appMode === 'kreator' && (
                                <>
                                    <div className="space-y-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Co projektujemy?</label>
                                            <select value={layoutType} onChange={e => setLayoutType(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm font-semibold text-slate-800 focus:border-emerald-500 outline-none shadow-sm">
                                                <option value="etykiety">🏷️ Etykiety na Szafki (Z miejscem na imię)</option>
                                                <option value="drzwi">🚪 Zestaw na Drzwi (W naszej sali...)</option>
                                                <option value="kodeks">📌 Kodeks Przedszkolaka (Tablica)</option>
                                                <option value="kaciki">🧩 Duże Szyldy do Kącików</option>
                                                <option value="plakat_choroba">🤒 Plakat informacyjny "Zostaw dziecko w domu"</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Motyw / Nazwa / Symbole</label>
                                            <input 
                                                type="text" 
                                                value={theme} 
                                                onChange={e => setTheme(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Zwierzątka, Kosmos, Pszczółki..." 
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Grupa docelowa</label>
                                            <input 
                                                type="text" 
                                                value={groupAge} 
                                                onChange={e => setGroupAge(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Przedszkolaki 4-letnie" 
                                            />
                                        </div>
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[10px] font-bold text-amber-700 flex flex-col gap-2 shadow-inner">
                                        <div className="flex gap-2 items-center"><i className="ph-fill ph-magic-wand text-xl shrink-0"></i> <span>Aplikacja użyje potężnego silnika 3D (Pixar Style) z systemu Fal.ai.</span></div>
                                        <span className="text-amber-600">Proces potrwa ok. 20 sekund – malujemy wysokiej jakości wektory!</span>
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <button onClick={generateContent} disabled={isGenerating} className="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-50 min-h-[70px]">
                                            {isGenerating ? (
                                                <><i className="ph-bold ph-spinner animate-spin text-xl"></i><span className="text-xs font-semibold">{genStatus}</span></>
                                            ) : (
                                                <span className="flex items-center gap-2"><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Zestaw</span>
                                            )}
                                        </button>
                                    </div>
                                </>
                            )}

                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-400"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak projektów. Zrób pierwszy!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-white rounded-xl p-4 border border-slate-200 hover:border-emerald-500 transition-colors shadow-sm cursor-pointer" 
                                                     onClick={() => { 
                                                        setResultData({ type: item.config.type, data: item.config.data, params: item.config.params }); 
                                                        setLayoutType(item.config.type);
                                                        setAppMode('kreator'); 
                                                     }}>
                                                    <div className="flex items-center gap-2 font-kids font-bold text-slate-800">
                                                        <i className="ph-fill ph-file-pdf text-emerald-500 text-lg"></i> {item.name}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-200 bg-slate-50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:border-emerald-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-emerald-100 to-teal-100 border border-emerald-300 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-emerald-600"></i>
                                    <div><p className="text-xs font-bold text-emerald-900">Wersja PRO MAX</p><p className="text-[9px] text-emerald-700">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden no-print bg-slate-200/50 backdrop-blur-sm">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 relative flex justify-center">
                            
                            {!resultData ? (
                                <div className="text-center text-emerald-900/20 max-w-md mx-auto my-auto">
                                    <i className="ph-fill ph-layout text-7xl mb-6 animate-pulse"></i>
                                    <p className="font-bold text-lg text-emerald-900/40">Wybierz moduł dekoracji. Model Flux 3D wygeneruje ilustracje w stylu popularnych filmów animowanych, zachowując najwyższą jakość wydruku.</p>
                                </div>
                            ) : (
                                <div className="space-y-8 animate-[reveal_0.4s_ease-out] w-full max-w-5xl">
                                    
                                    {/* PODGLĄD NA ŻYWO */}
                                    <div className="shadow-2xl rounded-2xl overflow-hidden border border-slate-300 bg-slate-100/80 backdrop-blur-md pb-10">
                                        <div className="bg-slate-800 text-slate-300 text-xs font-bold px-4 py-2 flex items-center justify-between">
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-eye"></i> Podgląd Układu (Jak w PDF)</span>
                                            <span className="flex gap-1.5"><div className="w-2.5 h-2.5 rounded-full bg-red-500"></div><div className="w-2.5 h-2.5 rounded-full bg-yellow-500"></div><div className="w-2.5 h-2.5 rounded-full bg-green-500"></div></span>
                                        </div>
                                        <div className="p-4 md:p-8 overflow-x-auto">
                                            {renderLayout()}
                                        </div>
                                    </div>

                                    {/* AKCJE */}
                                    <div className="mt-10 bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-xl flex flex-col items-center">
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">Plik gotowy do druku! 🖨️</h3>
                                        <p className="text-slate-500 text-sm mb-6 max-w-md mx-auto">Wciśnij Drukuj i upewnij się, że w oknie drukarki zaznaczona jest opcja <strong>"Drukuj grafiki tła" (Background graphics)</strong>. Możesz przewijać okno wydruku, aby zobaczyć wszystkie strony.</p>
                                        
                                        <div className="flex flex-col sm:flex-row gap-4">
                                            <button onClick={() => window.print()} className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30">
                                                <i className="ph-bold ph-printer text-xl"></i> Otwórz Drukarkę
                                            </button>
                                            <button onClick={publishToMarket} disabled={isPublishing} className="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                                                {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-xl"></i>} Do Bazy Wzorów
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
