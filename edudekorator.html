<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBox V3 PRO MAX - EduWystrój AI</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Piękne, dziecięce czcionki -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- WBUDOWANA BAZA DANYCH (Omija błędy z ładowaniem modułów z dysku) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDL_mvepNJjMmZYQzifN2cXzoKwCE8jNd0",
            authDomain: "edubox-pro.firebaseapp.com",
            projectId: "edubox-pro",
            storageBucket: "edubox-pro.firebasestorage.app",
            messagingSenderId: "570263845714",
            appId: "1:570263845714:web:0b029211f7af071b66988b"
        };
        const APP_ID = "eduboxpro";

        let app, auth, db;
        try {
            app = initializeApp(FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) { console.warn("Firebase init failed", e); }

        window.EduBoxCore = {
            user: null,
            init: (callback) => {
                if (!auth) return;
                signInAnonymously(auth).catch(e => console.error(e));
                onAuthStateChanged(auth, (user) => {
                    window.EduBoxCore.user = user;
                    if(callback) callback(user);
                });
            },
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!db || !window.EduBoxCore.user) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, {
                    userId: window.EduBoxCore.user.uid,
                    createdAt: serverTimestamp(),
                    type: appType,
                    name: itemName,
                    config: config
                });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; color: #0f172a; overflow: hidden; }
        .font-kids { font-family: 'Fredoka', sans-serif; }
        .font-hand { font-family: 'Caveat', cursive; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        /* Auras - Wiosenny / Radosny klimat */
        .aura-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .aura-blob { position: absolute; filter: blur(130px); border-radius: 50%; opacity: 0.4; animation: float 20s ease-in-out infinite alternate; }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, rgba(0,0,0,0) 70%); }
        .aura-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(0,0,0,0) 70%); animation-delay: -5s; }
        .aura-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(244, 63, 94, 0.3) 0%, rgba(0,0,0,0) 70%); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.05); }
        }

        /* --- STUDIO WYDRUKU: JAKOŚĆ PREMIUM (Jak z PDF z Facebooka) --- */
        @media screen {
            .print-only { display: none !important; }
        }

        @media print {
            @page { margin: 5mm; }
            body, html, #root { 
                background: white !important; 
                margin: 0 !important; padding: 0 !important; 
                overflow: visible !important; height: auto !important;
            }
            .no-print { display: none !important; }
            .print-only { 
                display: block !important; 
                width: 100%; height: 100%; 
                background: white !important; 
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* Zapobieganie ucinaniu elementów wpół strony */
            .print-break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
            .page-break-after { break-after: page; page-break-after: always; }
        }
        
        /* Dekoracyjne klasy na podstawie przysłanych zdjęć */
        .dash-border { border: 3px dashed currentColor; padding: 4px; border-radius: inherit; }
    </style>
</head>
<body>
    <div id="root" class="h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseAIResponse = (aiOutput) => {
            let text = String(aiOutput?.text || aiOutput?.response || aiOutput?.content || aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    return JSON.parse(jsonStr.replace(/,\s*([\]}])/g, '$1'));
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON. Nie używaj znaczników markdown.\n\n${systemInstruction}\n\nZADANIE:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.content || data;
                } else {
                    throw new Error(`Błąd API`);
                }
            } catch(e) { throw new Error("Brak połączenia z AI. " + e.message); }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            
            // Konfigurator Wystroju
            const [layoutType, setLayoutType] = useState('drzwi');
            const [theme, setTheme] = useState('Pszczółki / Wiosna');
            const [groupAge, setGroupAge] = useState('Przedszkolaki');
            
            const [resultData, setResultData] = useState(null);
            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else { setTimeout(initDb, 100); }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_eduwystroj_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    if (savedPremium === 'KAWA2024') setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3500);
            };

            // DODANA FUNKCJA OBSŁUGUJĄCA KOD PREMIUM!
            const handlePremiumCheck = () => {
                if (premiumCode.toUpperCase() === 'KAWA2024') {
                    setIsPremium(true); 
                    try { window.localStorage.setItem('edubox_premium', 'KAWA2024'); } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { 
                    showMessage('Nieprawidłowy kod', 'error'); 
                }
            };

            const generateContent = async () => {
                if (!isPremium && aiGenerations >= 3) { showMessage('Limit wyczerpany.', 'error'); return; }
                setIsGenerating(true);
                setResultData(null);

                let sysPrompt = "";
                if (layoutType === 'drzwi') {
                    sysPrompt = `Jesteś projektantem dekoracji przedszkolnych. Użytkownik chce stworzyć zestaw banerów na drzwi (jak z Facebooka) z napisem głownym "W naszej sali dzieci są:" oraz 10 cechami (każda na osobny baner).
Wybierz kolorowe, radosne emoji, które świetnie wyglądają w druku. Dobierz jasne, pastelowe tła Tailwind (np. bg-pink-100, bg-blue-100).
WYMÓG JSON:
{
  "title": "W naszej sali dzieci są:",
  "items": [
    { "text": "Szczęśliwe", "emoji": "😊", "bgColor": "bg-pink-100", "textColor": "text-pink-600", "borderColor": "border-pink-300" },
    { "text": "Kreatywne", "emoji": "🎨", "bgColor": "bg-green-100", "textColor": "text-green-600", "borderColor": "border-green-300" }
    // wygeneruj łącznie 10 takich obiektów
  ]
}`;
                } else if (layoutType === 'kodeks') {
                    sysPrompt = `Projektujesz "Kodeks Przedszkolaka" na tablicę korkową. Wymyśl 9 pozytywnych zasad dostosowanych do podanej grupy.
Zasady mają być krótkie i w pierwszej osobie liczby mnogiej (np. "Pomagamy sobie nawzajem").
WYMÓG JSON:
{
  "title": "Nasz Kodeks",
  "items": [
    { "text": "Mówimy sobie 'Dzień dobry'", "emoji": "👋", "bgColor": "bg-blue-50", "borderColor": "border-blue-300", "textColor": "text-blue-800" },
    { "text": "Sprzątamy po zabawie", "emoji": "🧸", "bgColor": "bg-yellow-50", "borderColor": "border-yellow-300", "textColor": "text-yellow-800" }
    // łącznie 9 zasad
  ]
}`;
                } else if (layoutType === 'kaciki') {
                    sysPrompt = `Projektujesz duże, piękne szyldy do kącików tematycznych w sali (np. Kącik Majsterkowicza, Kącik Lalek). Wygeneruj 6 różnych kącików pasujących do tematu/grupy.
WYMÓG JSON:
{
  "title": "Nasze Kąciki",
  "items": [
    { "text": "KĄCIK PLASTYCZNY", "emoji": "🖌️", "bgColor": "bg-red-50", "borderColor": "border-red-400", "textColor": "text-red-700" },
    { "text": "KĄCIK KONSTRUKTORA", "emoji": "🔨", "bgColor": "bg-blue-50", "borderColor": "border-blue-400", "textColor": "text-blue-700" }
    // łącznie 6 kącików
  ]
}`;
                } else if (layoutType === 'plakat_choroba') {
                    sysPrompt = `Projektujesz plakat edukacyjny na drzwi o tytule "Drogi Rodzicu! Zostaw dziecko w domu, gdy:". Plakat ma mieć 4 kafelki opisujące najczęstsze objawy (gorączka, katar/kaszel, wymioty, wysypka) napisane życzliwie, ale stanowczo.
WYMÓG JSON:
{
  "title": "Drogi Rodzicu! Zostaw dziecko w domu, gdy:",
  "subtitle": "Dbajmy wspólnie o zdrowie wszystkich dzieci w naszym przedszkolu ❤️",
  "footer": "DZIĘKUJEMY ZA ZROZUMIENIE I WSPÓŁPRACĘ!",
  "items": [
    { "title": "MA GORĄCZKĘ LUB DRESZCZE", "desc": "Podwyższona temperatura to sygnał, że organizm walczy z infekcją...", "emoji": "🤒", "bgColor": "bg-green-100", "headerColor": "bg-green-600" },
    { "title": "MA MOCNY KATAR LUB KASZEL", "desc": "Objawy te mogą się nasilać i zarażać inne dzieci...", "emoji": "🤧", "bgColor": "bg-blue-100", "headerColor": "bg-blue-500" },
    { "title": "MA BÓLE BRZUCHA LUB WYMIOTY", "desc": "Mogą być objawem infekcji jelitowej...", "emoji": "🤢", "bgColor": "bg-orange-100", "headerColor": "bg-orange-500" },
    { "title": "MA WYSYPKĘ LUB ZMIANY SKÓRNE", "desc": "Zaczerwienienie i wysypki mogą sugerować chorobę zakaźną...", "emoji": "🤕", "bgColor": "bg-purple-100", "headerColor": "bg-purple-500" }
  ]
}`;
                }

                const prompt = `Motyw przewodni / Nazwa Grupy: ${theme}. Wiek dzieci: ${groupAge}. Stwórz piękny pakiet dekoracyjny.`;

                try {
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    setResultData({ type: layoutType, data: parsedJson, params: { theme, groupAge } });
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_eduwystroj_ai', newCount.toString()); } catch(e) {}
                    }
                    showMessage('Wygenerowano Pakiet Dekoracyjny!', 'success');
                } catch (error) { showMessage(error.message, 'error'); } 
                finally { setIsGenerating(false); }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Błąd autoryzacji bazy.', 'error'); return; }
                setIsPublishing(true);
                try {
                    await window.EduBoxCore.saveToGielda('eduwystroj_market', 'eduwystroj', `${layoutType} - ${theme}`, resultData);
                    showMessage('Opublikowano w Galerii!', 'success');
                    setAppMode('gielda');
                } catch (error) { showMessage(error.message || 'Błąd publikacji.', 'error'); } 
                finally { setIsPublishing(false); }
            };

            useEffect(() => {
                let unsubscribe = null;
                if (appMode === 'gielda') {
                    setIsFetchingMarket(true);
                    if(window.EduBoxCore && window.EduBoxCore.subscribeToGielda) {
                        unsubscribe = window.EduBoxCore.subscribeToGielda('eduwystroj_market', (items) => {
                            setMarketItems(items); setIsFetchingMarket(false);
                        }, () => setIsFetchingMarket(false));
                    }
                }
                return () => { if (unsubscribe) unsubscribe(); }
            }, [appMode]);

            // --- RENDEROWANIE PIĘKNYCH UKŁADÓW (HTML/CSS) ---
            const renderLayout = () => {
                if (!resultData || !resultData.data) return null;
                const { type, data } = resultData;

                if (type === 'drzwi') {
                    return (
                        <div className="flex flex-col items-center gap-4 bg-white p-8 w-full max-w-2xl mx-auto rounded-xl">
                            {/* Nagłówek (Chmurka) */}
                            <div className="bg-sky-50 border-[4px] border-sky-300 rounded-[50px] px-12 py-6 text-center shadow-md relative w-[90%] mb-4 print-break-inside-avoid">
                                <div className="absolute top-2 left-4 text-3xl">☀️</div>
                                <div className="absolute top-2 right-4 text-3xl">☁️</div>
                                <h1 className="text-3xl md:text-5xl font-kids font-black text-sky-700 leading-tight">
                                    {data.title}
                                </h1>
                            </div>

                            {/* Banery Cech */}
                            {data.items.map((item, i) => (
                                <div key={i} className={`w-[85%] ${item.bgColor} border-[4px] ${item.borderColor} rounded-full py-4 px-8 flex items-center justify-between shadow-sm transform hover:scale-105 transition-transform print-break-inside-avoid`}>
                                    <div className="text-4xl drop-shadow-md">{item.emoji}</div>
                                    <div className={`font-kids font-black text-3xl md:text-4xl ${item.textColor} tracking-wide text-center flex-1`}>
                                        {item.text}
                                    </div>
                                    <div className="text-4xl drop-shadow-md">{item.emoji}</div>
                                </div>
                            ))}
                        </div>
                    );
                }

                if (type === 'kodeks') {
                    return (
                        <div className="bg-[#e7d5b8] p-8 w-full max-w-4xl mx-auto rounded-xl shadow-inner relative" style={{backgroundImage: 'url("https://www.transparenttextures.com/patterns/cork-board.png")'}}>
                            <div className="text-center mb-10 print-break-inside-avoid">
                                <div className="inline-block bg-white/90 backdrop-blur-sm border-4 border-amber-300 rounded-[40px] px-12 py-6 shadow-lg rotate-1 relative">
                                    <div className="absolute -top-4 -left-4 text-4xl transform -rotate-12">📌</div>
                                    <h1 className="text-4xl md:text-6xl font-kids font-black text-amber-600 drop-shadow-sm">{data.title}</h1>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                {data.items.map((item, i) => (
                                    <div key={i} className={`${item.bgColor} border-[3px] ${item.borderColor} rounded-3xl p-6 flex flex-col items-center text-center shadow-lg relative print-break-inside-avoid transform ${i%2 === 0 ? '-rotate-1' : 'rotate-2'}`}>
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 text-2xl">📍</div>
                                        <div className="text-6xl mb-4 drop-shadow-lg">{item.emoji}</div>
                                        <div className={`font-kids font-bold text-xl leading-snug ${item.textColor}`}>
                                            {item.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (type === 'kaciki') {
                    return (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 w-full max-w-4xl mx-auto rounded-xl">
                            {data.items.map((item, i) => (
                                <div key={i} className={`${item.bgColor} border-4 ${item.borderColor} rounded-[40px] p-6 relative flex items-center shadow-md print-break-inside-avoid h-[200px]`}>
                                    <div className="absolute inset-2 border-[3px] border-dashed border-white/60 rounded-[32px]"></div>
                                    
                                    <div className="flex-1 text-center px-4 relative z-10">
                                        <div className="text-6xl mb-2 drop-shadow-md">{item.emoji}</div>
                                        <h2 className={`font-kids font-black text-3xl md:text-4xl ${item.textColor} uppercase leading-none`}>
                                            {item.text}
                                        </h2>
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                }

                if (type === 'plakat_choroba') {
                    return (
                        <div className="bg-white p-6 md:p-10 w-full max-w-4xl mx-auto rounded-xl shadow-2xl print-break-inside-avoid border-8 border-sky-200">
                            <div className="text-center mb-8 bg-sky-50 rounded-[40px] border-[3px] border-dashed border-sky-300 p-6 relative">
                                <div className="absolute top-4 left-6 text-5xl">☀️</div>
                                <div className="absolute top-4 right-6 text-5xl">☁️</div>
                                <h1 className="text-4xl md:text-6xl font-kids font-black text-red-600 uppercase tracking-tight mb-2 drop-shadow-md leading-none">{data.title}</h1>
                                <p className="text-xl font-kids font-bold text-sky-800">{data.subtitle}</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {data.items.map((item, i) => (
                                    <div key={i} className={`${item.bgColor} border-4 border-white outline outline-[3px] outline-slate-200 rounded-3xl overflow-hidden shadow-sm flex flex-col h-full print-break-inside-avoid`}>
                                        <div className={`${item.headerColor} text-white p-4 flex items-center gap-4`}>
                                            <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center text-3xl font-black text-slate-800 shadow-inner shrink-0">{i+1}</div>
                                            <h2 className="font-kids font-black text-xl md:text-2xl leading-tight">{item.title}</h2>
                                        </div>
                                        <div className="p-6 flex items-center gap-6 grow">
                                            <p className="font-sans font-semibold text-slate-700 leading-relaxed text-sm md:text-base flex-1">{item.desc}</p>
                                            <div className="text-7xl drop-shadow-xl">{item.emoji}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-8 text-center bg-pink-100 rounded-full py-4 px-8 border-[3px] border-dashed border-pink-300">
                                <p className="font-kids font-black text-2xl text-pink-600">💖 {data.footer} 💖</p>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            return (
                <div className="flex h-screen w-full bg-emerald-950 text-slate-800 overflow-hidden relative selection:bg-emerald-500/30">
                    <div className="aura-container no-print"><div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div></div>

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'} no-print`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    {/* Widok Drukowania - ukryty normalnie, zajmuje 100% ekranu podczas druku */}
                    <div className="print-only">
                        {renderLayout()}
                    </div>

                    <aside className="w-80 flex-shrink-0 bg-white/90 backdrop-blur-xl border-r border-emerald-100 flex flex-col h-full z-10 no-print transition-all duration-300 shadow-xl">
                        <div className="p-6 border-b border-emerald-100 flex items-center gap-3 bg-emerald-50/50">
                            <div className="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                                <i className="ph-bold ph-scissors text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-kids font-black tracking-tight text-emerald-800 leading-none uppercase">EduWystrój</h1>
                                <p className="text-[10px] text-emerald-500 font-bold tracking-wider uppercase mt-1">Kreator Layoutów</p>
                            </div>
                        </div>

                        <div className="px-4 py-3 flex gap-2 border-b border-emerald-100">
                            <button onClick={() => setAppMode('kreator')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                <i className="ph-bold ph-pencil-simple"></i> Szablony
                            </button>
                            <button onClick={() => setAppMode('gielda')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                <i className="ph-bold ph-image"></i> Baza
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            {appMode === 'kreator' && (
                                <>
                                    <div className="space-y-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Co projektujemy?</label>
                                            <select value={layoutType} onChange={e => setLayoutType(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm font-semibold text-slate-800 focus:border-emerald-500 outline-none shadow-sm">
                                                <option value="drzwi">🚪 Zestaw na Drzwi (W naszej sali...)</option>
                                                <option value="kodeks">📌 Kodeks Przedszkolaka (Tablica)</option>
                                                <option value="kaciki">🧩 Duże Szyldy do Kącików</option>
                                                <option value="plakat_choroba">🤒 Plakat informacyjny "Zostaw dziecko w domu"</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Motyw / Nazwa</label>
                                            <input 
                                                type="text" 
                                                value={theme} 
                                                onChange={e => setTheme(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Biedronki, Kosmos..." 
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Grupa docelowa</label>
                                            <input 
                                                type="text" 
                                                value={groupAge} 
                                                onChange={e => setGroupAge(e.target.value)} 
                                                className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-800 focus:border-emerald-500 transition-colors shadow-sm" 
                                                placeholder="np. Przedszkolaki 4-letnie" 
                                            />
                                        </div>
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[10px] font-bold text-amber-700 flex gap-2">
                                        <i className="ph-fill ph-info text-xl shrink-0"></i>
                                        Aplikacja automatycznie dobierze teksty, ramki, pastelowe tła i urocze emotikony HD do wydruku.
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <button onClick={generateContent} disabled={isGenerating} className="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                                            {isGenerating ? <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Składanie layoutu...</> : <><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Zestaw</>}
                                        </button>
                                    </div>
                                </>
                            )}

                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-400"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak projektów. Zrób pierwszy!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-white rounded-xl p-4 border border-slate-200 hover:border-emerald-500 transition-colors shadow-sm cursor-pointer" 
                                                     onClick={() => { 
                                                        setResultData({ type: item.config.type, data: item.config.data, params: item.config.params }); 
                                                        setLayoutType(item.config.type);
                                                        setAppMode('kreator'); 
                                                     }}>
                                                    <div className="flex items-center gap-2 font-kids font-bold text-slate-800">
                                                        <i className="ph-fill ph-file-pdf text-emerald-500 text-lg"></i> {item.name}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-200 bg-slate-50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:border-emerald-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-emerald-100 to-teal-100 border border-emerald-300 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-emerald-600"></i>
                                    <div><p className="text-xs font-bold text-emerald-900">Wersja PRO MAX</p><p className="text-[9px] text-emerald-700">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden no-print bg-slate-200/50 backdrop-blur-sm">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 relative flex justify-center">
                            
                            {!resultData ? (
                                <div className="text-center text-emerald-900/20 max-w-md mx-auto my-auto">
                                    <i className="ph-fill ph-layout text-7xl mb-6 animate-pulse"></i>
                                    <p className="font-bold text-lg text-emerald-900/40">Wybierz moduł dekoracji w panelu bocznym. Sztuczna Inteligencja przygotuje kompletny, gotowy do druku układ z wektorowymi emojis.</p>
                                </div>
                            ) : (
                                <div className="space-y-8 animate-[reveal_0.4s_ease-out] w-full max-w-5xl">
                                    
                                    {/* PODGLĄD NA ŻYWO (Zupełnie jak wydruk) */}
                                    <div className="shadow-2xl rounded-2xl overflow-hidden border border-slate-300 bg-white/50 backdrop-blur-md pb-10">
                                        <div className="bg-slate-800 text-slate-300 text-xs font-bold px-4 py-2 flex items-center justify-between">
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-eye"></i> Podgląd Układu (Jak w PDF)</span>
                                            <span className="flex gap-1.5"><div className="w-2.5 h-2.5 rounded-full bg-red-500"></div><div className="w-2.5 h-2.5 rounded-full bg-yellow-500"></div><div className="w-2.5 h-2.5 rounded-full bg-green-500"></div></span>
                                        </div>
                                        <div className="p-8 overflow-x-auto">
                                            {renderLayout()}
                                        </div>
                                    </div>

                                    {/* AKCJE */}
                                    <div className="mt-10 bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-xl flex flex-col items-center">
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">Plik gotowy do cięcia! ✂️</h3>
                                        <p className="text-slate-500 text-sm mb-6 max-w-md mx-auto">Wciśnij Drukuj i upewnij się, że w oknie drukarki zaznaczona jest opcja <strong>"Drukuj grafiki tła" (Background graphics)</strong>.</p>
                                        
                                        <div className="flex flex-col sm:flex-row gap-4">
                                            <button onClick={() => window.print()} className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30">
                                                <i className="ph-bold ph-printer text-xl"></i> Otwórz Drukarkę
                                            </button>
                                            <button onClick={publishToMarket} disabled={isPublishing} className="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                                                {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-xl"></i>} Do Bazy
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
