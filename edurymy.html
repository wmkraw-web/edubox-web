    <!-- GŁÓWNA ZAWARTOŚĆ APLIKACJI -->
    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;

        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                Printer: <><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></>,
                Refresh: <><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>,
                Search: <><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [word, setWord] = useState('');
            const [audience, setAudience] = useState('przedszkole');
            const [isGenerating, setIsGenerating] = useState(false);
            const [genStep, setGenStep] = useState(null); // 'candidates' | 'verify'
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            const [recent, setRecent] = useState([]);
            const [isPro, setIsPro] = useState(() => {
                const s = localStorage.getItem('eduboxProStatus');
                return s === 'PRO' || s === 'active';
            });

            const resultRef = useRef(null);

            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
                try {
                    const stored = JSON.parse(localStorage.getItem('eduRymyRecent') || '[]');
                    setRecent(Array.isArray(stored) ? stored : []);
                } catch (e) {}
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const saveRecent = (w) => {
                try {
                    const next = [w, ...recent.filter(r => r.toLowerCase() !== w.toLowerCase())].slice(0, 8);
                    setRecent(next);
                    localStorage.setItem('eduRymyRecent', JSON.stringify(next));
                } catch (e) {}
            };

            const audienceMeta = {
                maluchy: { label: 'Maluchy (2-3 lata)', desc: 'najprostsze, krótkie, dobrze znane słowa, jak najwięcej onomatopei' },
                przedszkole: { label: 'Przedszkole (4-6 lat)', desc: 'słowa znane z bajek i codziennego otoczenia dziecka' },
                szkolne: { label: 'Szkolne (7-9 lat)', desc: 'możesz użyć bogatszego, ale wciąż naturalnego słownictwa' }
            };

            const runSearch = (targetWord) => {
                const w = (targetWord || word).trim();
                if (!w) { setError('Wpisz najpierw słowo.'); return; }
                setError('');

                EduBoxCore.executeWithLimitCheck(
                    isPro,
                    async (newCount) => {
                        setIsGenerating(true);
                        setGenStep('candidates');
                        setResult(null);
                        try {
                            const parseJson = (raw) => {
                                let jsonStr = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
                                const startIdx = jsonStr.indexOf('{');
                                const endIdx = jsonStr.lastIndexOf('}');
                                if (startIdx !== -1 && endIdx !== -1) jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                                return JSON.parse(jsonStr);
                            };

                            const askAI = async (system, prompt) => {
                                const res = await fetch('/api/chat', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt, system, temperature: 0.2, format: 'json', model: 'gpt-4o' })
                                });
                                if (!res.ok) throw new Error(`Serwer główny: HTTP ${res.status}`);
                                const data = await res.json();
                                return parseJson(data.text);
                            };

                            // KROK 1: KANDYDACI - łagodniejszy, kreatywny etap. Może zaproponować za dużo,
                            // od tego jest krok 2.
                            const genSys = `Jesteś polskim logopedą, ekspertem od rymów dla dzieci. Zaproponuj KANDYDATÓW na rymy do podanego słowa - kolejny, niezależny etap je surowo zweryfikuje, więc staraj się podawać prawdziwe polskie słowa, ale nie musisz być stuprocentowo pewny każdego.
Dla podanego słowa zaproponuj do 8 kandydatów na rym dokładny (niemal identyczna końcówka fonetyczna) i do 6 kandydatów na rym przybliżony (podobne brzmienie). Dopasuj trudność słownictwa do grupy wiekowej: ${audienceMeta[audience].desc}.
Zwróć WYŁĄCZNIE poprawny JSON: {"exact": ["..."], "near": ["..."]}`;
                            const candidates = await askAI(genSys, `Podaj kandydatów na rymy do słowa: "${w}".`);

                            setGenStep('verify');

                            // KROK 2: WERYFIKACJA - osobne, surowe zapytanie widzi TYLKO listę słów
                            // (nie wie już, że mają się "ładnie rymować") i ocenia każde z osobna.
                            const verifySys = `Jesteś rygorystycznym korektorem języka polskiego. Dostajesz listę słów-kandydatów zaproponowanych przez inny, mniej dokładny system jako rymy do pewnego słowa bazowego. Część kandydatów może być ZMYŚLONA (nieistniejąca, fonetycznie tylko podobna forma, np. "bole" zamiast prawdziwego "boli", albo wymyślone "wot", "mot", "fot"), a część może być prawdziwym słowem, które mimo to WCALE SIĘ NIE RYMUJE ze słowem bazowym (np. "stołek" jako "rym" do "przedszkole" - to prawdziwe słowo, ale kończy się na "-ołek", a nie na "-ole/-edszkole", więc się nie rymuje i musi zostać odrzucone).
TWOJE ZADANIE: dla każdego kandydata sprawdź DWA niezależne warunki, oba muszą być spełnione:
1. ISTNIENIE: czy to NAPRAWDĘ istniejące, powszechnie znane słowo/forma języka polskiego? W razie najmniejszej wątpliwości - ODRZUĆ. Nie odrzucaj tylko dlatego, że to rzadsza, ale prawdziwa forma odmiany.
2. RYM: czy jego zakończenie fonetyczne NAPRAWDĘ pasuje do zakończenia słowa bazowego "${w}" - przeczytaj oba słowa na głos i porównaj ostatnią akcentowaną sylabę (lub więcej). Jeśli brzmią wyraźnie inaczej na końcu, to NIE jest rym, nawet jeśli słowo istnieje - ODRZUĆ je z tej listy (niezależnie czy było w grupie "exact" czy "near").
3. Zwróć wyłącznie kandydatów spełniających OBA warunki - możesz zwrócić mniej niż dostałeś, a nawet zero. To lepszy wynik niż przepuszczenie złego kandydata.
4. Napisz dwuwiersz o słowie bazowym "${w}" jako DWIE OSOBNE, PEŁNE linijki (pola "coupletLine1" i "coupletLine2") - nie jedno zdanie połamane przecinkami. Ostatnie słowo linijki 2 musi się rymować z ostatnim słowem linijki 1 (rym AA), a oba te słowa muszą pochodzić ze zweryfikowanej listy "exact" (a jeśli jest pusta - z "near"). NAJWAŻNIEJSZE: całość musi mieć SENS - to ma być prosta, konkretna, zrozumiała dla dziecka scenka (np. co robi/gdzie jest/jak wygląda "${w}"), a nie zdanie na siłę sklejone z przypadkowych rymów. Jeśli któryś zweryfikowany rym nie daje się sensownie użyć, wybierz inny z listy - nie każdy rym musi trafić do dwuwiersza.
   Przykład DOBRZE (dla słowa "kot", lista zawiera m.in. "koc" i "noc"): coupletLine1: "Szary kotek śpi pod kocem,", coupletLine2: "Cichą, ciepłą, długą nocą." - sensowna scenka, dwie osobne linijki, czysty rym.
   Przykład ŹLE (unikaj takiej formy): "Kot na płocie siedzi, patrzy na lot, a w sercu ma miot." - to jedno zdanie, nie dwuwiersz, a "w sercu ma miot" nie ma sensu - taki wynik jest niedopuszczalny.
   Jeśli obie grupy po weryfikacji są puste, zwróć oba pola jako pusty string.
5. Zaproponuj JEDNO konkretne ćwiczenie/zabawę z rymami dla grupy wiekowej: ${audienceMeta[audience].desc} (1-2 zdania, bez ogólników) - użyj w przykładzie WYŁĄCZNIE słów ze zweryfikowanej listy, nigdy przypadkowej pary spoza niej.
Zwróć WYŁĄCZNIE poprawny JSON: {"exact": ["..."], "near": ["..."], "coupletLine1": "...", "coupletLine2": "...", "activity": "..."}`;
                            const verifyPrompt = `Słowo bazowe: "${w}". Kandydaci - rym dokładny: [${(candidates.exact || []).join(', ')}]. Kandydaci - rym przybliżony: [${(candidates.near || []).join(', ')}].`;
                            const parsed = await askAI(verifySys, verifyPrompt);

                            if ((!parsed.exact || !parsed.exact.length) && (!parsed.near || !parsed.near.length)) {
                                throw new Error('Po weryfikacji nie zostały żadne pewne rymy dla tego słowa. Spróbuj innego słowa.');
                            }

                            setResult({ word: w, ...parsed });
                            saveRecent(w);
                            showToast(`Wykorzystano ${newCount}/5 darmowych wyszukiwań dzisiaj`);
                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                        } catch (err) {
                            setError(`Błąd: ${err.message}. Spróbuj ponownie.`);
                        } finally {
                            setIsGenerating(false);
                            setGenStep(null);
                        }
                    },
                    (errMsg) => showToast(errMsg),
                    (msg) => {} // toast o limicie pokazujemy dopiero po sukcesie (patrz wyżej)
                );
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Skopiowano do schowka!');
            };

            const copyAll = () => {
                if (!result) return;
                const lines = [
                    `Słowo: ${result.word}`,
                    `Rymy dokładne: ${result.exact.join(', ')}`,
                    result.near?.length ? `Rymy przybliżone: ${result.near.join(', ')}` : null,
                    result.coupletLine1 ? `Dwuwiersz: ${result.coupletLine1} ${result.coupletLine2}` : null
                ].filter(Boolean).join('\n');
                copyToClipboard(lines);
            };

            return (
                <div className="relative flex flex-col min-h-screen">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(16,185,129,0.4)] font-bold text-sm animate-toast flex items-center gap-3 border border-emerald-400 print-hidden">
                            <Icon name="AlertCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    <main className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10">
                        <div className="max-w-4xl mx-auto">

                            <div className="text-center mb-8 fade-in print-hidden">
                                <div className="inline-flex items-center gap-2 bg-emerald-900/40 border border-emerald-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-4">
                                    Nowość
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Każde słowo ma swój <span className="text-gradient">rym.</span>
                                </h1>
                                <p className="text-emerald-100/70 text-lg max-w-2xl mx-auto">
                                    Wpisz jedno słowo, a AI znajdzie do niego prawdziwe polskie rymy - do zabaw fonologicznych, memory, zagadek i własnych rymowanek dzieci.
                                </p>
                            </div>

                            <div className="glass-panel p-4 rounded-2xl border border-emerald-500/20 mb-6 flex gap-3 items-start max-w-2xl mx-auto print-hidden">
                                <span className="text-xl flex-shrink-0">ℹ️</span>
                                <p className="text-xs sm:text-sm text-emerald-50/80 leading-relaxed"><strong className="text-white">Jak to działa:</strong> wpisz dowolne słowo (np. „kot", „szkoła", „lato"), wybierz grupę wiekową i kliknij „Znajdź rymy". Dostaniesz listę prawdziwych rymów podzieloną na dokładne i przybliżone, gotowy dwuwiersz oraz pomysł na zabawę. To osobne narzędzie od EduTik PRO - tam AI pisze za Ciebie cały wierszyk, tutaj Ty (albo dzieci) układacie go sami, mając gotowe podpowiedzi rymów.</p>
                            </div>

                            <div className="glass-panel p-6 sm:p-8 rounded-3xl fade-in print-hidden" style={{animationDelay: '0.1s'}}>
                                <label className="text-[10px] font-bold text-emerald-300/80 uppercase tracking-widest block mb-2">Grupa wiekowa</label>
                                <div className="grid grid-cols-3 gap-2 mb-6">
                                    {Object.entries(audienceMeta).map(([key, meta]) => (
                                        <button key={key} onClick={() => setAudience(key)} className={`py-3 px-1 rounded-xl text-xs font-bold border-2 transition-all ${audience === key ? 'bg-emerald-600/25 border-emerald-500 text-emerald-300' : 'bg-slate-900/40 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                            {meta.label}
                                        </button>
                                    ))}
                                </div>

                                <label className="text-[10px] font-bold text-emerald-300/80 uppercase tracking-widest block mb-2">Słowo</label>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <input
                                        type="text"
                                        value={word}
                                        onChange={(e) => setWord(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === 'Enter') runSearch(); }}
                                        placeholder="np. kot, szkoła, lato..."
                                        className="flex-grow bg-slate-900/60 border border-slate-700 text-white rounded-xl px-4 py-4 text-lg font-baloo focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors"
                                    />
                                    <button
                                        onClick={() => runSearch()}
                                        disabled={isGenerating || !word.trim()}
                                        className="px-8 py-4 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-lg btn-bounce bg-gradient-to-r from-emerald-600 to-amber-500 hover:from-emerald-500 hover:to-amber-400 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner-gap animate-spin text-xl"></i> {genStep === 'verify' ? 'Sprawdzam...' : 'Szukam...'}</>
                                        ) : (
                                            <><Icon name="Search" size={20} /> Znajdź rymy</>
                                        )}
                                    </button>
                                </div>

                                {error && (
                                    <div className="mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-300 text-sm flex items-start gap-3">
                                        <Icon name="AlertCircle" size={18} className="flex-shrink-0 mt-0.5" />
                                        <p>{error}</p>
                                    </div>
                                )}

                                {recent.length > 0 && (
                                    <div className="mt-5 flex flex-wrap items-center gap-2">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-1">Ostatnio:</span>
                                        {recent.map((w) => (
                                            <button key={w} onClick={() => { setWord(w); runSearch(w); }} className="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800/70 border border-slate-700 text-slate-300 hover:border-emerald-500 hover:text-emerald-300 transition-colors">
                                                {w}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {result && (
                                <div ref={resultRef} className="mt-8 glass-panel p-6 sm:p-8 rounded-3xl fade-in border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.12)]">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4 border-b border-emerald-500/20 pb-5 print-hidden">
                                        <h2 className="text-3xl font-baloo font-extrabold text-white">
                                            <i className="ph-fill ph-quotes text-2xl text-amber-400 align-middle mr-2"></i>{result.word}
                                        </h2>
                                        <div className="flex flex-wrap gap-2">
                                            <button onClick={copyAll} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                <Icon name="Copy" size={16}/> Kopiuj
                                            </button>
                                            <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                <Icon name="Printer" size={16}/> Drukuj kartę
                                            </button>
                                        </div>
                                    </div>

                                    <div className="hidden print-only mb-6">
                                        <h2 className="text-3xl font-black">Rymy do słowa: {result.word}</h2>
                                    </div>

                                    <p className="text-xs text-slate-400 mb-6 -mt-2 print-hidden">Przeczytaj rymy na głos razem z dziećmi — AI czasem się myli, a to świetna okazja, żeby wspólnie to sprawdzić.</p>

                                    <div className="mb-6">
                                        <h3 className="text-xs font-bold text-emerald-300 uppercase tracking-widest mb-3">Rymy dokładne</h3>
                                        <div className="flex flex-wrap gap-2">
                                            {result.exact.map((w, i) => (
                                                <button key={w} onClick={() => copyToClipboard(w)} style={{animationDelay: `${i * 0.05}s`}} className="rhyme-chip font-baloo font-bold text-base px-4 py-2 rounded-2xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-200 hover:bg-emerald-600/40 hover:border-emerald-400 transition-colors">
                                                    {w}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {result.near?.length > 0 && (
                                        <div className="mb-6">
                                            <h3 className="text-xs font-bold text-amber-300 uppercase tracking-widest mb-3">Rymy przybliżone</h3>
                                            <div className="flex flex-wrap gap-2">
                                                {result.near.map((w, i) => (
                                                    <button key={w} onClick={() => copyToClipboard(w)} style={{animationDelay: `${i * 0.05}s`}} className="rhyme-chip font-baloo font-bold text-base px-4 py-2 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-200 hover:bg-amber-500/30 hover:border-amber-400 transition-colors">
                                                        {w}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {result.coupletLine1 && (
                                        <div className="mb-6 bg-slate-950/40 border border-slate-700/50 rounded-2xl p-5">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Przykładowy dwuwiersz</h3>
                                            <p className="font-baloo text-xl text-white leading-relaxed">{result.coupletLine1}</p>
                                            <p className="font-baloo text-xl text-white leading-relaxed">{result.coupletLine2}</p>
                                        </div>
                                    )}

                                    {result.activity && (
                                        <div className="bg-amber-900/20 border border-amber-500/30 rounded-2xl p-5 flex gap-3 items-start print-hidden">
                                            <span className="text-xl flex-shrink-0">💡</span>
                                            <p className="text-sm text-amber-100/90 leading-relaxed"><strong className="text-amber-300">Pomysł na zabawę:</strong> {result.activity}</p>
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="py-6 border-t border-emerald-900/40 text-center text-xs font-bold text-slate-500 uppercase tracking-widest mt-auto print-hidden">
                        Część systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
