<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel jakości Make — EduBox AI</title>
    <meta name="description" content="Prywatny panel kontroli automatyzacji publikacyjnych EduBox AI.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: #020617; }
        .glass { background: rgba(15, 23, 42, .78); border: 1px solid rgba(148, 163, 184, .16); box-shadow: 0 20px 55px rgba(2, 6, 23, .32); }
        .status-dot { width: .7rem; height: .7rem; border-radius: 999px; box-shadow: 0 0 14px currentColor; }
        .scenario-card { transition: transform .18s ease, border-color .18s ease; }
        .scenario-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-44 -left-24 h-96 w-96 rounded-full bg-indigo-600/20 blur-3xl"></div>
        <div class="absolute top-1/3 -right-36 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
    </div>

    <main class="relative max-w-7xl mx-auto px-5 py-8 md:py-12">
        <header class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
            <div>
                <a href="/" class="inline-flex items-center gap-2 text-cyan-300 hover:text-cyan-200 text-sm font-bold mb-5"><i class="ph-bold ph-arrow-left"></i> EduBox AI</a>
                <p class="text-xs uppercase tracking-[.28em] text-indigo-300 font-black mb-3">Prywatne centrum kontroli</p>
                <h1 class="text-4xl md:text-6xl font-black tracking-tight">Panel jakości <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-300">Make</span></h1>
                <p class="mt-4 text-slate-400 max-w-2xl leading-relaxed">Sprawdza zdrowie automatów publikacyjnych. Panel wyłącznie czyta dane — nie uruchamia, nie zatrzymuje i nie zmienia żadnego scenariusza.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="logout-button" class="hidden inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl font-bold transition-colors">
                    <i class="ph-bold ph-sign-out"></i><span>Wyloguj</span>
                </button>
                <button id="refresh-button" class="hidden inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-wait px-5 py-3 rounded-xl font-black transition-colors">
                    <i class="ph-bold ph-arrows-clockwise"></i><span>Odśwież dane</span>
                </button>
            </div>
        </header>

        <section id="message" class="glass rounded-2xl p-5 mb-6" aria-live="polite"></section>

        <section id="summary" class="hidden grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6"></section>

        <div id="filters" class="hidden flex flex-wrap gap-2 mb-6" aria-label="Filtry kanałów">
            <button data-filter="all" class="filter bg-white text-slate-950 px-4 py-2 rounded-full text-sm font-black">Wszystkie</button>
            <button data-filter="facebook" class="filter bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold">Facebook</button>
            <button data-filter="pinterest" class="filter bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold">Pinterest</button>
            <button data-filter="youtube" class="filter bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold">YouTube</button>
        </div>

        <section id="scenario-list" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></section>

        <footer class="mt-8 glass rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 text-sm text-slate-400">
            <div class="flex flex-wrap gap-x-5 gap-y-2">
                <span class="inline-flex items-center gap-2"><span class="status-dot bg-emerald-400 text-emerald-400"></span>Działa</span>
                <span class="inline-flex items-center gap-2"><span class="status-dot bg-amber-400 text-amber-400"></span>Wymaga uwagi</span>
                <span class="inline-flex items-center gap-2"><span class="status-dot bg-rose-400 text-rose-400"></span>Problem</span>
            </div>
            <a id="make-link" href="https://eu1.make.com/" target="_blank" rel="noopener noreferrer" class="text-cyan-300 hover:text-cyan-200 font-bold">Otwórz Make <i class="ph-bold ph-arrow-square-out ml-1"></i></a>
        </footer>
    </main>

    <script>
        const state = { scenarios: [], filter: 'all', authHeader: null };
        const statusStyles = {
            ok: { dot: 'bg-emerald-400 text-emerald-400', badge: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25', border: 'hover:border-emerald-500/35' },
            warning: { dot: 'bg-amber-400 text-amber-400', badge: 'bg-amber-500/10 text-amber-300 border-amber-500/25', border: 'hover:border-amber-500/35' },
            error: { dot: 'bg-rose-400 text-rose-400', badge: 'bg-rose-500/10 text-rose-300 border-rose-500/25', border: 'hover:border-rose-500/35' },
            neutral: { dot: 'bg-slate-400 text-slate-400', badge: 'bg-slate-500/10 text-slate-300 border-slate-500/25', border: 'hover:border-slate-500/35' },
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
        }

        function formatDate(value) {
            if (!value) return 'brak danych';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'brak danych';
            return date.toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
        }

        function formatDuration(milliseconds) {
            if (!milliseconds) return '—';
            if (milliseconds < 1000) return `${milliseconds} ms`;
            return `${Math.round(milliseconds / 100) / 10} s`;
        }

        function channelIcon(channel) {
            return channel === 'facebook' ? 'ph-facebook-logo' : channel === 'pinterest' ? 'ph-pinterest-logo' : 'ph-youtube-logo';
        }

        function createBasicHeader(user, pass) {
            const bytes = new TextEncoder().encode(`${user}:${pass}`);
            let binary = '';
            bytes.forEach(byte => { binary += String.fromCharCode(byte); });
            return `Basic ${btoa(binary)}`;
        }

        function renderLogin(errorMessage = '') {
            state.authHeader = null;
            state.scenarios = [];
            document.getElementById('summary').classList.add('hidden');
            document.getElementById('filters').classList.add('hidden');
            document.getElementById('scenario-list').innerHTML = '';
            document.getElementById('refresh-button').classList.add('hidden');
            document.getElementById('logout-button').classList.add('hidden');
            document.getElementById('message').innerHTML = `
                <div class="max-w-md mx-auto py-3">
                    <div class="h-12 w-12 rounded-2xl bg-indigo-500/15 text-indigo-300 flex items-center justify-center text-2xl mb-4"><i class="ph-bold ph-lock-key"></i></div>
                    <h2 class="text-2xl font-black">Zaloguj się do panelu</h2>
                    <p class="text-sm text-slate-400 mt-2 leading-relaxed">Użyj tego samego loginu i hasła co w prywatnych narzędziach Ewy i Ani. Dane nie są zapisywane — znikną po zamknięciu tej karty.</p>
                    <form id="login-form" class="mt-5 space-y-3">
                        <label class="block"><span class="text-xs font-bold text-slate-400">Login</span><input id="login-user" type="text" autocomplete="username" required class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-indigo-400"></label>
                        <label class="block"><span class="text-xs font-bold text-slate-400">Hasło</span><input id="login-pass" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-indigo-400"></label>
                        <p id="login-error" class="${errorMessage ? '' : 'hidden'} text-sm text-rose-300"><i class="ph-bold ph-warning-circle mr-1"></i>${escapeHtml(errorMessage)}</p>
                        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl font-black transition-colors"><i class="ph-bold ph-sign-in"></i>Wejdź do panelu</button>
                    </form>
                </div>`;
            document.getElementById('login-form').addEventListener('submit', async event => {
                event.preventDefault();
                const user = document.getElementById('login-user').value;
                const passInput = document.getElementById('login-pass');
                state.authHeader = createBasicHeader(user, passInput.value);
                passInput.value = '';
                await loadData();
            });
        }

        function renderSummary(summary, updatedAt) {
            const cards = [
                ['Scenariusze', summary.total, 'text-white'],
                ['Działa', summary.ok, 'text-emerald-300'],
                ['Uwagi', summary.warning, 'text-amber-300'],
                ['Problemy', summary.error, 'text-rose-300'],
                ['Zaległe', summary.incomplete, 'text-cyan-300'],
            ];
            document.getElementById('summary').innerHTML = cards.map(([label, value, color]) => `
                <article class="glass rounded-2xl p-4">
                    <p class="text-[11px] uppercase tracking-wider text-slate-500 font-black">${label}</p>
                    <p class="text-3xl font-black mt-1 ${color}">${value}</p>
                </article>`).join('');
            document.getElementById('summary').classList.remove('hidden');
            document.getElementById('message').innerHTML = `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2"><span class="text-emerald-300 font-bold"><i class="ph-bold ph-shield-check mr-2"></i>Dane pobrane bez uruchamiania scenariuszy.</span><span class="text-xs text-slate-500">Aktualizacja: ${escapeHtml(formatDate(updatedAt))}</span></div>`;
        }

        function renderScenarios() {
            const items = state.filter === 'all' ? state.scenarios : state.scenarios.filter(item => item.channel === state.filter);
            document.getElementById('scenario-list').innerHTML = items.map(item => {
                const style = statusStyles[item.health.level] || statusStyles.neutral;
                const runLabel = item.lastRun ? (item.lastRun.status === 1 ? 'Sukces' : item.lastRun.status === 2 ? 'Ostrzeżenie' : 'Błąd') : 'Brak historii';
                return `
                    <article class="scenario-card glass ${style.border} rounded-2xl p-5" data-channel="${escapeHtml(item.channel)}">
                        <div class="flex items-start justify-between gap-3 mb-5">
                            <div class="flex gap-3 min-w-0">
                                <div class="h-11 w-11 shrink-0 rounded-xl bg-slate-800 flex items-center justify-center text-xl text-slate-300"><i class="ph-fill ${channelIcon(item.channel)}"></i></div>
                                <div class="min-w-0">
                                    <p class="text-[10px] uppercase tracking-wider text-slate-500 font-black">${escapeHtml(item.channel)}</p>
                                    <h2 class="font-black leading-tight mt-1">${escapeHtml(item.label)}</h2>
                                </div>
                            </div>
                            <span class="shrink-0 inline-flex items-center gap-2 border ${style.badge} rounded-full px-2.5 py-1 text-[11px] font-black"><span class="status-dot ${style.dot}"></span>${escapeHtml(item.health.label)}</span>
                        </div>
                        <dl class="grid grid-cols-2 gap-3 text-sm">
                            <div class="bg-slate-950/55 rounded-xl p-3"><dt class="text-xs text-slate-500">Ostatnie wykonanie</dt><dd class="font-bold mt-1">${escapeHtml(formatDate(item.lastRun?.timestamp))}</dd></div>
                            <div class="bg-slate-950/55 rounded-xl p-3"><dt class="text-xs text-slate-500">Wynik</dt><dd class="font-bold mt-1">${escapeHtml(runLabel)}</dd></div>
                            <div class="bg-slate-950/55 rounded-xl p-3"><dt class="text-xs text-slate-500">Następne</dt><dd class="font-bold mt-1">${item.manual ? 'Uruchamiany ręcznie' : escapeHtml(formatDate(item.nextExecution))}</dd></div>
                            <div class="bg-slate-950/55 rounded-xl p-3"><dt class="text-xs text-slate-500">Czas / operacje</dt><dd class="font-bold mt-1">${escapeHtml(formatDuration(item.lastRun?.duration))} / ${item.lastRun?.operations ?? '—'}</dd></div>
                        </dl>
                        ${item.incompleteExecutions ? `<p class="mt-4 text-sm text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-xl p-3"><i class="ph-bold ph-warning mr-1"></i>Zapisane niepełne wykonania: <strong>${item.incompleteExecutions}</strong></p>` : ''}
                        ${item.historyError ? `<p class="mt-4 text-xs text-amber-300">${escapeHtml(item.historyError)}</p>` : ''}
                    </article>`;
            }).join('');
        }

        async function loadData() {
            const button = document.getElementById('refresh-button');
            button.disabled = true;
            button.querySelector('i').classList.add('animate-spin');
            try {
                const response = await fetch('/api/weekly-report?view=make-health', {
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: { Authorization: state.authHeader },
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const error = new Error(data.error || `Nie udało się pobrać danych (HTTP ${response.status}).`);
                    error.status = response.status;
                    throw error;
                }
                state.scenarios = Array.isArray(data.scenarios) ? data.scenarios : [];
                renderSummary(data.summary, data.updatedAt);
                renderScenarios();
                document.getElementById('filters').classList.remove('hidden');
                document.getElementById('refresh-button').classList.remove('hidden');
                document.getElementById('logout-button').classList.remove('hidden');
                if (data.makeUrl) document.getElementById('make-link').href = data.makeUrl;
            } catch (error) {
                if (error.status === 401) {
                    renderLogin('Login lub hasło są niepoprawne. Spróbuj ponownie.');
                    return;
                }
                document.getElementById('message').innerHTML = `<div class="flex gap-3 text-amber-200"><i class="ph-bold ph-warning-circle text-2xl"></i><div><p class="font-black">Panel nie może jeszcze pobrać danych.</p><p class="text-sm text-slate-400 mt-1">${escapeHtml(error.message)}</p></div></div>`;
            } finally {
                button.disabled = false;
                button.querySelector('i').classList.remove('animate-spin');
            }
        }

        document.getElementById('refresh-button').addEventListener('click', loadData);
        document.getElementById('logout-button').addEventListener('click', () => renderLogin('Wylogowano z panelu.'));
        document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
            state.filter = button.dataset.filter;
            document.querySelectorAll('.filter').forEach(item => item.className = 'filter bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold');
            button.className = 'filter bg-white text-slate-950 px-4 py-2 rounded-full text-sm font-black';
            renderScenarios();
        }));
        renderLogin();
    </script>
</body>
</html>
