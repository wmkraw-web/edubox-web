<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Asystent Pedagoga - Kombajn Modułowy PRO</title>
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteka do czytania PDF w przeglądarce -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .card-bg { background-color: #0b1120; border: 1px solid #1e293b; }
        .input-bg { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; transition: all 0.2s; }
        .input-bg:focus { border-color: #ef4444; outline: none; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        
        .btn-red { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: white; transition: all 0.3s; }
        .btn-red:hover { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4); }
        .btn-red:active { transform: translateY(0); }
        .btn-red:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; transform: none; box-shadow: none; }

        .module-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; transition: all 0.2s; color: #cbd5e1; font-weight: 500; font-size: 0.875rem; cursor: pointer; }
        .module-btn:hover { background-color: #1e293b; color: #f8fafc; }
        .module-btn.active { background-color: #1e293b; color: #f8fafc; border-left: 3px solid #ef4444; }

        .doc-radio { display: none; }
        .doc-label { display: block; padding: 0.75rem 1rem; background-color: #0b1120; border: 1px solid #1e293b; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; margin-bottom: 0.5rem; }
        .doc-radio:checked + .doc-label { background-color: rgba(225, 29, 72, 0.1); border-color: #e11d48; color: #fff; font-weight: 600; }
        
        .upload-box { border: 2px dashed #475569; border-radius: 0.75rem; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(30, 41, 59, 0.5); }
        .upload-box:hover { border-color: #ef4444; background: rgba(225, 29, 72, 0.05); }

        @media print {
            body { background-color: white !important; color: black !important; }
            .print-hidden, .sidebar { display: none !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
            .card-bg { border: none !important; box-shadow: none !important; background: transparent !important; }
            .print-area { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: black !important; white-space: pre-wrap; }
            .print-images-grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 1rem !important; margin-bottom: 2rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SECRET_PIN = "KAWA2024"; 

        const DOC_TYPES = [
            { id: 'gotowosc', label: 'Informacja o gotowości do podjęcia nauki w szkole (Przedszkole)' },
            { id: 'ipet', label: 'IPET (Indywidualny Program Edukacyjno-Terapeutyczny)' },
            { id: 'wopfu', label: 'WOPFU (Wielospecjalistyczna Ocena Poziomu Funkcjonowania Ucznia)' },
            { id: 'opinia', label: 'Opinia o uczniu do Poradni (PPP)' },
            { id: 'notatka', label: 'Arkusz Obserwacji / Notatka służbowa' }
        ];

        const MODULES = [
            { id: 'dokumenty', label: 'Asystent Dokumentów (Z plikami)', icon: '📄' },
            { id: 'historyjki', label: 'Historyjki Społeczne', icon: '🧩' },
            { id: 'rymowanki', label: 'Rymowanki Przedszkolne', icon: '🎈' },
            { id: 'tus', label: 'Kreator TUS', icon: '🫂' },
            { id: 'rodzice', label: 'Komunikacja z Rodzicem', icon: '🤝' }
        ];

        const getSystemPrompt = (module, docType, customHeaders, formatLength) => {
            if (module === 'dokumenty') {
                let lengthInstruction = formatLength === 'epic' 
                    ? "Wymagam BARDZO ROZBUDOWANEGO, wyczerpującego i profesjonalnego dokumentu. Każdy punkt musi być opisany w formie pełnych, bogatych w żargon pedagogiczny akapitów." 
                    : "Wymagam ZWIĘZŁEGO dokumentu (skrócona forma). Używaj punktatorów i krótkich, konkretnych zdań.";

                let base = `Jesteś wybitnym pedagogiem specjalnym. Wygeneruj profesjonalny dokument urzędowy o typie: ${docType}. Używaj języka formalnego, pedagogicznego. Nie używaj gwiazdek **.\n${lengthInstruction}\n`;
                
                if (docType === 'gotowosc') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi BEZWZGLĘDNIE obejmować rozwój fizyczny, emocjonalno-społeczny, poznawczy (mowa, myślenie, uwaga), samodzielność oraz wskazówki dla rodziców.";
                } else if (docType === 'ipet') {
                    base += "WYTYCZNE DLA DOKUMENTU: Struktura musi obejmować diagnozę, cele, metody, dostosowania oraz działania wspierające.";
                }
                
                if (customHeaders && customHeaders.trim() !== '') {
                    base += `\n\nUWAGA KRYTYCZNA! Użytkownik podał własny wzór placówki. ZIGNORUJ standardowe wytyczne i użyj DOKŁADNIE tych nagłówków w dokumencie:\n"${customHeaders}"`;
                }
                return base;
            }
            if (module === 'historyjki') {
                return `Jesteś pedagogiem specjalnym. Napisz rozbudowaną 'Historyjkę Społeczną'. Napisz ją w pierwszej osobie ("Ja"). Podziel tekst na 3 akapity: 1. PROBLEM, 2. STRATEGIA, 3. EFEKT. Zwróć tylko sformatowany tekst.`;
            }
            return "Jesteś ekspertem edukacyjnym.";
        };

        const extractTextFromPDF = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let text = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const strings = content.items.map(item => item.str);
                            text += strings.join(" ") + "\n";
                        }
                        resolve(text);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        function App() {
            const [activeModule, setActiveModule] = useState('dokumenty');
            const [authCode, setAuthCode] = useState('');
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            const [docType, setDocType] = useState('gotowosc');
            const [diagnoza, setDiagnoza] = useState('');
            const [naglowki, setNaglowki] = useState('');
            const [mocneStrony, setMocneStrony] = useState('');
            const [trudnosci, setTrudnosci] = useState('');
            const [formatLength, setFormatLength] = useState('epic');
            const [genericInput, setGenericInput] = useState('');
            const [uploadedFilesText, setUploadedFilesText] = useState('');

            const [generatedText, setGeneratedText] = useState('');
            const [generatedImages, setGeneratedImages] = useState([]); 
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState(''); 
            const [error, setError] = useState('');

            const resultRef = useRef(null);

            useEffect(() => { 
                setIsUnlocked(authCode.toUpperCase() === SECRET_PIN); 
            }, [authCode]);

            const fetchWithRetry = async (url, options, retries = 3) => {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(`Błąd HTTP ${response.status}: ${errText}`);
                        }
                        return await response.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(res => setTimeout(res, 2000 * Math.pow(2, i)));
                    }
                }
            };

            const secureApiCall = async (payload, type = 'text') => {
                const apiKey = ""; // Klucz z Canvas

                if (apiKey) {
                    const url = type === 'text' 
                        ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`
                        : `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    
                    return await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    if (isLocal) throw new Error("Uruchamiasz plik prosto z dysku (lokalnie)! 🛑 Użyj przycisku 'Podgląd' (Preview) lub wrzuć plik na serwer Vercel.");

                    // Inteligentny Fallback dla Vercela
                    try {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ payload: payload, type: type })
                        });

                        if (!response.ok) {
                            // Jeśli plik /api/gemini nie istnieje, zróbmy Fallback do starszych endpointów
                            if (response.status === 404) {
                                if (type === 'text') {
                                    const sysText = payload.systemInstruction?.parts[0]?.text || "";
                                    const usrText = payload.contents[0]?.parts[0]?.text || "";
                                    const fbRes = await fetch('/api/chat', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ system: sysText, prompt: usrText, temperature: payload.generationConfig?.temperature || 0.4, format: "text", model: "gpt-4o-mini" })
                                    });
                                    if(!fbRes.ok) throw new Error("Błąd Vercel /api/chat");
                                    const fbData = await fbRes.json();
                                    return { candidates: [{ content: { parts: [{ text: fbData.text }] } }] };
                                } else {
                                    const imgPrompt = payload.instances?.prompt || payload.instances[0]?.prompt;
                                    const fbRes = await fetch('/api/generate', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ prompt: imgPrompt })
                                    });
                                    if(!fbRes.ok) throw new Error("Błąd Vercel /api/generate");
                                    const fbData = await fbRes.json();
                                    return { isVercelUrl: true, url: fbData.imageUrl };
                                }
                            }
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`Błąd Vercel API: ${errData.error || response.statusText}`);
                        }
                        return await response.json();
                    } catch (e) {
                        throw new Error("Błąd sieciowy z serwerem: " + e.message);
                    }
                }
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setLoadingMsg('Analizuję przesłane pliki (PDF/TXT)...');
                setIsGenerating(true);
                setError('');
                
                let combinedText = "";
                try {
                    for (const file of files) {
                        if (file.type === "text/plain") {
                            const text = await file.text();
                            combinedText += `\n[PLIK TXT: ${file.name}]\n${text}\n`;
                        } else if (file.type === "application/pdf") {
                            const text = await extractTextFromPDF(file);
                            combinedText += `\n[PLIK PDF: ${file.name}]\n${text}\n`;
                        }
                    }
                    setUploadedFilesText(combinedText);
                } catch(err) {
                    setError(`Błąd odczytu pliku: ${err.message}`);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const handleGenerate = async () => {
                if (!isUnlocked) { setError("Wpisz poprawny kod aktywacyjny!"); return; }
                
                setIsGenerating(true); 
                setError(''); 
                setGeneratedText(''); 
                setGeneratedImages([]);
                setLoadingMsg('Przygotowuję treść dokumentu...');

                try {
                    let finalPrompt = "";
                    if (activeModule === 'dokumenty') {
                        finalPrompt = `Dokument: ${docType}\nDiagnoza: ${diagnoza}\nMocne strony: ${mocneStrony}\nTrudności: ${trudnosci}\n\nDODATKOWE PLIKI OD NAUCZYCIELA DO ANALIZY:\n${uploadedFilesText}`;
                    } else {
                        finalPrompt = `Temat: ${genericInput}`;
                    }

                    const textData = await secureApiCall({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: getSystemPrompt(activeModule, docType, naglowki, formatLength) }] },
                        generationConfig: { temperature: 0.4 }
                    }, 'text');

                    const story = textData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!story) throw new Error("AI nie zwróciło tekstu. Spróbuj wygenerować jeszcze raz.");
                    
                    let cleanText = story.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    setGeneratedText(cleanText);
                    
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                    // Obrazy (sekwencyjnie)
                    if (activeModule === 'historyjki') {
                        const prompts = [
                            `2D Flat vector illustration, storybook style. A charming friendly character looking pensive and thoughtful in a school environment. Soft pastel colors, innocent look. NO TEXT.`,
                            `2D Flat vector illustration, storybook style. A charming friendly character taking a deep breath and feeling very calm and peaceful. School environment. Soft blue colors. NO TEXT.`,
                            `2D Flat vector illustration, storybook style. A charming friendly character with a very big happy smile, feeling proud and successful. Bright joyful colors. NO TEXT.`
                        ];
                        
                        try {
                            const newImages = [];
                            for (let i = 0; i < prompts.length; i++) {
                                setLoadingMsg(`Maluję obrazek ${i + 1} z 3...`);
                                const res = await secureApiCall({ 
                                    instances: { prompt: prompts[i] }, 
                                    parameters: { sampleCount: 1 } 
                                }, 'image');
                                
                                if (res.isVercelUrl) {
                                    newImages.push(res.url);
                                } else if (res.predictions && res.predictions[0] && res.predictions[0].bytesBase64Encoded) {
                                    newImages.push(`data:image/png;base64,${res.predictions[0].bytesBase64Encoded}`);
                                }
                            }
                            setGeneratedImages(newImages);
                        } catch(e) { 
                            console.error("Błąd grafiki:", e); 
                            setError(`Zignorowano błąd obrazków: ${e.message}`);
                        }
                    }

                } catch (err) {
                    setError('Błąd: ' + err.message);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const resetForm = () => {
                setGeneratedText('');
                setGeneratedImages([]);
                setError('');
                setLoadingMsg('');
            };

            return (
                <div className="flex min-h-screen relative">
                    <div className="sidebar w-72 flex-shrink-0 flex flex-col h-screen sticky top-0 print-hidden z-20">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-bold text-slate-300 text-sm tracking-widest uppercase">Asystent Pedagoga PRO</h1>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            <div className="mb-8">
                                <h2 className="font-bold text-white mb-3 flex items-center gap-2"><span>🛡️</span> Wersja PRO</h2>
                                {!isUnlocked ? (
                                    <div className="space-y-4">
                                        <div className="relative">
                                            <input 
                                                type={showPassword ? "text" : "password"} 
                                                value={authCode} 
                                                onChange={(e) => setAuthCode(e.target.value)} 
                                                placeholder="Wpisz kod aktywacyjny..." 
                                                className="w-full bg-[#1e293b] border border-[#334155] focus:border-amber-500 text-white rounded-xl px-4 py-3 text-sm pr-10 outline-none transition-colors" 
                                            />
                                            <button onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                                                {showPassword ? "🙈" : "👁️"}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl flex items-center gap-4 shadow-inner">
                                        <div className="bg-emerald-500/20 p-2 rounded-lg"><span className="text-xl">✅</span></div>
                                        <div>
                                            <div className="uppercase tracking-widest text-[10px] opacity-80 font-bold">Status Premium</div>
                                            <div className="text-sm font-bold text-white">System Odblokowany</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <div className="space-y-1">
                                {MODULES.map(mod => (
                                    <div key={mod.id} onClick={() => { setActiveModule(mod.id); resetForm(); }} className={`module-btn ${activeModule === mod.id ? 'active' : ''}`}>
                                        <span className="w-6 text-center text-lg">{mod.icon}</span>
                                        <span>{mod.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="main-content flex-1 bg-[#020617] p-6 lg:p-10 min-w-0 z-10 relative">
                        {!generatedText && !isGenerating ? (
                            <div className="max-w-4xl fade-in print-hidden">
                                <h2 className="text-3xl font-black text-white mb-8 border-b border-slate-800 pb-4">{MODULES.find(m => m.id === activeModule)?.label}</h2>
                                {activeModule === 'dokumenty' ? (
                                    <div className="space-y-6">
                                        <div className="card-bg p-3 rounded-2xl flex flex-wrap gap-2">
                                            {DOC_TYPES.map(doc => (
                                                <div key={doc.id} className="flex-1 min-w-[200px]">
                                                    <input type="radio" id={doc.id} checked={docType === doc.id} onChange={() => setDocType(doc.id)} className="doc-radio" />
                                                    <label htmlFor={doc.id} className="doc-label text-center h-full flex items-center justify-center">{doc.label}</label>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <div className="mt-4">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Własne pliki do analizy (PDF, TXT)</label>
                                            <div className="upload-box relative">
                                                <input type="file" multiple accept=".pdf,.txt" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                <div className="flex flex-col items-center gap-2 text-slate-400">
                                                    <span className="text-2xl">📂</span>
                                                    <span className="text-sm font-bold text-white">Kliknij lub upuść pliki opinii/orzeczeń tutaj</span>
                                                    <span className="text-xs">Sztuczna Inteligencja przeczyta je i uwzględni w dokumencie!</span>
                                                </div>
                                            </div>
                                            {uploadedFilesText && <div className="mt-3 p-3 bg-emerald-900/30 border border-emerald-500/50 rounded-xl text-xs text-emerald-400 font-bold">✅ Pliki wczytane pomyślnie! AI przeanalizuje je przy generowaniu.</div>}
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Główna Diagnoza / Problem</label>
                                                <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} placeholder="Np. Spektrum autyzmu, Afazja, Brak dojrzałości szkolnej..." className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none"></textarea>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-amber-400 uppercase tracking-wider block mb-2">Wzór wymagany przez szkołę (Szablon)</label>
                                                <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} placeholder="Wklej tutaj puste nagłówki ze szkolnego druczku (np. 1. Zachowanie, 2. Umiejętności). AI dokładnie wypełni Twój szablon!" className="w-full h-28 input-bg rounded-xl p-4 text-sm resize-none border-amber-900/50 focus:border-amber-500"></textarea>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-2">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-3">Długość wygenerowanego dokumentu</label>
                                            <div className="flex gap-4">
                                                <label className="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
                                                    <input type="radio" checked={formatLength === 'epic'} onChange={() => setFormatLength('epic')} className="w-4 h-4 accent-red-500" /> Rozbudowany (Lany tekst)
                                                </label>
                                                <label className="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
                                                    <input type="radio" checked={formatLength === 'short'} onChange={() => setFormatLength('short')} className="w-4 h-4 accent-red-500" /> Zwięzły (Krótkie punkty)
                                                </label>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-2">Mocne Strony ucznia (Zasoby)</label>
                                            <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} placeholder="Co uczeń potrafi, w czym jest dobry..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-emerald-900/30 focus:border-emerald-500"></textarea>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-rose-400 uppercase tracking-wider block mb-2">Trudności do pokonania (Bariery)</label>
                                            <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} placeholder="Z czym ma problemy, co sprawia trudność na zajęciach..." className="w-full h-24 input-bg rounded-xl p-4 text-sm resize-none border-rose-900/30 focus:border-rose-500"></textarea>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Opisz temat lub problem</label>
                                        <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} placeholder="Opisz krótko sytuację, z którą pracujemy..." className="w-full h-48 input-bg rounded-2xl p-5 text-base resize-none"></textarea>
                                    </div>
                                )}
                            </div>
                        ) : null}

                        {error && (
                            <div className="mt-6 max-w-4xl p-5 bg-red-900/20 border border-red-500/30 rounded-2xl text-red-400 text-sm font-medium flex items-center gap-3">
                                <span className="text-xl">⚠️</span> {error}
                            </div>
                        )}

                        <div className="mt-8 max-w-4xl print-hidden">
                            {!generatedText || isGenerating ? (
                                <button onClick={handleGenerate} disabled={isGenerating || !isUnlocked} className="btn-red px-10 py-5 rounded-2xl font-black text-lg w-full sm:w-auto flex items-center justify-center gap-3 shadow-lg btn-bounce">
                                    {isGenerating ? (
                                        <><svg className="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> {loadingMsg || "Generuję..."}</>
                                    ) : `✨ GENERUJ MATERIAŁ`}
                                </button>
                            ) : null}
                        </div>

                        {generatedText && (
                            <div ref={resultRef} className="max-w-5xl fade-in pb-10 mt-6">
                                <div className="flex flex-col sm:flex-row items-center justify-between mb-8 print-hidden border-b border-slate-800 pb-6 gap-4">
                                    <h2 className="text-3xl font-black text-white">Gotowy Materiał</h2>
                                    <div className="flex gap-3 w-full sm:w-auto">
                                        <button onClick={() => window.print()} className="flex-1 sm:flex-none bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl text-sm font-bold border border-slate-600 transition-colors flex items-center justify-center gap-2">
                                            <span>🖨️</span> Drukuj
                                        </button>
                                        <button onClick={resetForm} className="flex-1 sm:flex-none btn-red px-6 py-3 rounded-xl text-sm font-bold shadow-md">
                                            Wróć
                                        </button>
                                    </div>
                                </div>

                                <div className="card-bg p-8 sm:p-14 rounded-[2rem] print-area flex flex-col gap-8 shadow-2xl">
                                    {activeModule === 'historyjki' && generatedImages.length > 0 && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full print-images-grid mb-6">
                                            {generatedImages.map((img, idx) => (
                                                <div key={idx} className="flex flex-col items-center fade-in bg-slate-900/30 p-4 rounded-3xl border border-slate-800">
                                                    <img src={img} alt="Ilustracja AI" className="w-full aspect-square object-cover rounded-2xl border border-slate-700 shadow-md" />
                                                    <p className="text-center text-xs text-white mt-4 font-black uppercase tracking-widest bg-blue-600 px-5 py-2 rounded-full shadow-lg">
                                                        {idx === 0 ? "1. Problem" : idx === 1 ? "2. Strategia" : "3. Efekt"}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="w-full text-slate-200 whitespace-pre-wrap text-lg leading-relaxed font-serif">
                                        <div dangerouslySetInnerHTML={{ __html: generatedText.replace(/\n/g, '<br/>') }} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
