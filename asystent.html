<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Asystent Pedagoga - Kombajn Modułowy PRO</title>
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Komponenty UI */
        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .card-bg { background-color: #0b1120; border: 1px solid #1e293b; }
        .input-bg { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
        .input-bg:focus { border-color: #ef4444; outline: none; }
        
        .btn-red { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: white; }
        .btn-red:hover { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); }
        .btn-red:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

        .auth-box { background-color: #27272a; border: 1px solid #3f3f46; color: #d4d4d8; }
        .auth-box.unlocked { background-color: rgba(22, 101, 52, 0.2); border-color: #166534; color: #86efac; }

        .module-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; transition: all 0.2s; color: #cbd5e1; font-weight: 500; font-size: 0.875rem; cursor: pointer; }
        .module-btn:hover { background-color: #1e293b; color: #f8fafc; }
        .module-btn.active { background-color: #1e293b; color: #f8fafc; border-left: 3px solid #ef4444; }

        .doc-radio { display: none; }
        .doc-label { display: block; padding: 0.75rem 1rem; background-color: #0b1120; border: 1px solid #1e293b; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; margin-bottom: 0.5rem; }
        .doc-radio:checked + .doc-label { background-color: rgba(225, 29, 72, 0.1); border-color: #e11d48; color: #fff; font-weight: 600; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 0.75rem; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; background: #0f172a; }
        .upload-box:hover { border-color: #ef4444; background: rgba(225, 29, 72, 0.05); }

        @media print {
            body { background-color: white !important; color: black !important; }
            .print-hidden, .sidebar { display: none !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
            .card-bg { border: none !important; box-shadow: none !important; background: transparent !important; }
            .print-area { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: black !important; white-space: pre-wrap; }
            .print-images-grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 1rem !important; margin-bottom: 2rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SECRET_PIN = "KAWA2024"; 

        const DOC_TYPES = [
            { id: 'ipet', label: 'IPET (Indywidualny Program Edukacyjno-Terapeutyczny)' },
            { id: 'wopfu', label: 'WOPFU (Wielospecjalistyczna Ocena Poziomu Funkcjonowania Ucznia)' },
            { id: 'opinia', label: 'Opinia o uczniu do Poradni (PPP)' },
            { id: 'notatka', label: 'Arkusz Obserwacji / Notatka służbowa' }
        ];

        const MODULES = [
            { id: 'dokumenty', label: 'Asystent Dokumentów (IPET/WOPFU)', icon: '📄' },
            { id: 'historyjki', label: 'Historyjki Społeczne (3-etapowe)', icon: '🧩' },
            { id: 'rymowanki', label: 'Rymowanki Przedszkolne', icon: '🎈' },
            { id: 'tus', label: 'Kreator TUS', icon: '🫂' },
            { id: 'rodzice', label: 'Komunikacja z Rodzicem', icon: '🤝' }
        ];

        const getSystemPrompt = (module, docType, customHeaders) => {
            if (module === 'dokumenty') {
                let base = `Jesteś wybitnym pedagogiem specjalnym. Wygeneruj profesjonalny dokument urzędowy o typie: ${docType}. Używaj języka formalnego, pedagogicznego. Nie używaj gwiazdek **.`;
                if (customHeaders) {
                    base += `\n\nUWAGA! Użyj tych nagłówków:\n"${customHeaders}"`;
                }
                return base;
            }
            if (module === 'historyjki') {
                return `Jesteś pedagogiem specjalnym. Napisz rozbudowaną 'Historyjkę Społeczną'. Napisz ją w pierwszej osobie ("Ja"). Podziel tekst na 3 akapity: 1. PROBLEM, 2. STRATEGIA, 3. EFEKT.`;
            }
            return "Jesteś ekspertem edukacyjnym.";
        };

        function App() {
            const [activeModule, setActiveModule] = useState('dokumenty');
            const [authCode, setAuthCode] = useState('');
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            const [docType, setDocType] = useState('ipet');
            const [diagnoza, setDiagnoza] = useState('');
            const [naglowki, setNaglowki] = useState('');
            const [mocneStrony, setMocneStrony] = useState('');
            const [trudnosci, setTrudnosci] = useState('');
            const [genericInput, setGenericInput] = useState('');

            const [generatedText, setGeneratedText] = useState('');
            const [generatedImages, setGeneratedImages] = useState([]); 
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState(''); 
            const [error, setError] = useState('');

            const resultRef = useRef(null);

            useEffect(() => { 
                setIsUnlocked(authCode.toUpperCase() === SECRET_PIN); 
            }, [authCode]);

            // ==================================================================================
            // BEZPIECZNY KONTROLER API - Zoptymalizowany dla środowiska podglądu z wykupionym pakietem
            // ==================================================================================
            const fetchWithRetry = async (url, options, retries = 5) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(`Status API: ${response.status} - ${errText}`);
                        }
                        return await response.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(res => setTimeout(res, delays[i]));
                    }
                }
            };

            const secureApiCall = async (payload, type = 'text') => {
                const apiKey = ""; // Środowisko ładuje klucz automatycznie w podglądzie
                const url = type === 'text' 
                    ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`
                    : `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                
                return await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            };

            const handleGenerate = async () => {
                if (!isUnlocked) { setError("Wpisz poprawny kod aktywacyjny!"); return; }
                
                setIsGenerating(true); 
                setError(''); 
                setGeneratedText(''); 
                setGeneratedImages([]);
                setLoadingMsg('Przygotowuję treść dokumentu...');

                try {
                    let finalPrompt = "";
                    if (activeModule === 'dokumenty') {
                        finalPrompt = `Dokument: ${docType}\nDiagnoza: ${diagnoza}\nMocne strony: ${mocneStrony}\nTrudności: ${trudnosci}`;
                    } else {
                        finalPrompt = `Temat: ${genericInput}`;
                    }

                    // GENEROWANIE TEKSTU
                    const textData = await secureApiCall({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: getSystemPrompt(activeModule, docType, naglowki) }] }
                    }, 'text');

                    const story = textData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!story) throw new Error("AI nie zwróciło tekstu.");
                    setGeneratedText(story);
                    
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                    // GENEROWANIE OBRAZÓW (Sekwencyjne - zapobiega błędom 403 API)
                    if (activeModule === 'historyjki') {
                        const prompts = [
                            `2D Flat vector illustration, storybook style. A charming friendly character looking pensive and thoughtful in a school environment. Soft pastel colors, innocent look.`,
                            `2D Flat vector illustration, storybook style. A charming friendly character taking a deep breath and feeling very calm and peaceful. School environment. Soft blue colors.`,
                            `2D Flat vector illustration, storybook style. A charming friendly character with a very big happy smile, feeling proud and successful. Bright joyful colors.`
                        ];
                        
                        try {
                            const newImages = [];
                            
                            // Pobieramy obrazy jeden po drugim, dając serwerowi odetchnąć
                            for (let i = 0; i < prompts.length; i++) {
                                setLoadingMsg(`Maluję obrazek ${i + 1} z 3...`);
                                const res = await secureApiCall({ 
                                    instances: { prompt: prompts[i] }, 
                                    parameters: { sampleCount: 1 } 
                                }, 'image');
                                
                                if (res && res.predictions && res.predictions[0] && res.predictions[0].bytesBase64Encoded) {
                                    newImages.push(`data:image/png;base64,${res.predictions[0].bytesBase64Encoded}`);
                                }
                            }
                            
                            setGeneratedImages(newImages);
                            
                            if (newImages.length === 0) {
                                setError("Serwer graficzny odrzucił zapytanie. Spróbuj wygenerować ponownie za chwilę.");
                            }
                        } catch(e) { 
                            console.error("Błąd grafiki:", e); 
                            setError(`Błąd podczas generowania obrazków: ${e.message}`);
                        }
                    }

                } catch (err) {
                    setError('Wystąpił błąd: ' + err.message);
                } finally {
                    setIsGenerating(false);
                    setLoadingMsg('');
                }
            };

            const resetForm = () => {
                setGeneratedText('');
                setGeneratedImages([]);
                setError('');
                setLoadingMsg('');
            };

            return (
                <div className="flex min-h-screen relative">
                    <div className="sidebar w-72 flex-shrink-0 flex flex-col h-screen sticky top-0 print-hidden">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-bold text-slate-300 text-sm tracking-widest uppercase">Asystent Pedagoga PRO</h1>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            {/* POPRAWIONA SEKCJA Z KODEM I KAWĄ */}
                            <div className="mb-8">
                                <h2 className="font-bold text-white mb-2">🔑 Kod Dostępu</h2>
                                <div className="relative mb-4">
                                    <input 
                                        type={showPassword ? "text" : "password"} 
                                        value={authCode} 
                                        onChange={(e) => setAuthCode(e.target.value)} 
                                        placeholder="Wpisz kod..." 
                                        className="w-full input-bg rounded-lg px-3 py-2 text-sm pr-10" 
                                    />
                                    <button onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">👁️</button>
                                </div>
                                <div className={`p-4 rounded-lg text-xs ${isUnlocked ? 'auth-box unlocked' : 'auth-box'}`}>
                                    {isUnlocked ? "✅ Kod poprawny - Odblokowano" : "Wpisz aktywny kod Premium, aby odblokować system."}
                                </div>
                                {!isUnlocked && (
                                    <a href="https://buycoffee.to/magiccolor" target="_blank" rel="noreferrer" className="mt-3 flex items-center justify-center gap-2 w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg transition-colors text-xs">
                                        ☕ Postaw Kawę po kod
                                    </a>
                                )}
                            </div>
                            
                            <div className="space-y-1">
                                {MODULES.map(mod => (
                                    <div key={mod.id} onClick={() => { setActiveModule(mod.id); resetForm(); }} className={`module-btn ${activeModule === mod.id ? 'active' : ''}`}>
                                        <span className="w-5 text-center">{mod.icon}</span>
                                        <span>{mod.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="main-content flex-1 bg-[#020617] p-6 lg:p-10 min-w-0">
                        {!generatedText && !isGenerating ? (
                            <div className="max-w-4xl fade-in print-hidden">
                                <h2 className="text-2xl font-bold text-white mb-6">{MODULES.find(m => m.id === activeModule)?.label}</h2>
                                {activeModule === 'dokumenty' ? (
                                    <div className="space-y-6">
                                        <div className="card-bg p-2 rounded-xl">
                                            {DOC_TYPES.map(doc => (
                                                <div key={doc.id}>
                                                    <input type="radio" id={doc.id} checked={docType === doc.id} onChange={() => setDocType(doc.id)} className="doc-radio" />
                                                    <label htmlFor={doc.id} className="doc-label">{doc.label}</label>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} placeholder="Diagnoza..." className="w-full h-24 input-bg rounded-lg p-3 text-sm"></textarea>
                                            <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} placeholder="Własne nagłówki..." className="w-full h-24 input-bg rounded-lg p-3 text-sm"></textarea>
                                        </div>
                                        <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} placeholder="Mocne strony..." className="w-full h-24 input-bg rounded-lg p-3 text-sm"></textarea>
                                        <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} placeholder="Trudności..." className="w-full h-24 input-bg rounded-lg p-3 text-sm"></textarea>
                                    </div>
                                ) : (
                                    <div className="card-bg p-4 rounded-xl">
                                        <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} placeholder="Opisz krótko sytuację..." className="w-full h-40 input-bg rounded-lg p-4 text-sm"></textarea>
                                    </div>
                                )}
                            </div>
                        ) : null}

                        {error && <div className="mt-6 max-w-4xl p-4 bg-red-900/40 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium">{error}</div>}

                        <div className="mt-8 max-w-4xl print-hidden">
                            {!generatedText || isGenerating ? (
                                <button onClick={handleGenerate} disabled={isGenerating || !isUnlocked} className="btn-red px-8 py-4 rounded-xl font-bold w-full sm:w-auto flex items-center justify-center gap-3">
                                    {isGenerating ? (
                                        <><svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> {loadingMsg || "Generuję..."}</>
                                    ) : `✨ GENERUJ MATERIAŁ`}
                                </button>
                            ) : null}
                        </div>

                        {generatedText && (
                            <div ref={resultRef} className="max-w-5xl fade-in pb-10 mt-6">
                                <div className="flex items-center justify-between mb-6 print-hidden border-b border-slate-800 pb-4">
                                    <h2 className="text-2xl font-bold text-white">Gotowy Materiał</h2>
                                    <div className="flex gap-3">
                                        <button onClick={() => window.print()} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold border border-slate-600">🖨️ Drukuj</button>
                                        <button onClick={resetForm} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Wróć</button>
                                    </div>
                                </div>

                                <div className="card-bg p-8 sm:p-12 rounded-[2rem] print-area flex flex-col gap-8">
                                    {activeModule === 'historyjki' && generatedImages.length > 0 && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full print-images-grid">
                                            {generatedImages.map((img, idx) => (
                                                <div key={idx} className="flex flex-col items-center fade-in">
                                                    <img src={img} alt="AI" className="w-full aspect-square object-cover rounded-2xl border-4 border-slate-800 shadow-xl" />
                                                    <p className="text-center text-xs text-slate-300 mt-3 font-bold uppercase bg-slate-900 px-4 py-1.5 rounded-full border border-slate-700">
                                                        {idx === 0 ? "1. Problem" : idx === 1 ? "2. Strategia" : "3. Efekt"}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="w-full text-slate-200 whitespace-pre-wrap text-lg leading-relaxed">
                                        {generatedText}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
