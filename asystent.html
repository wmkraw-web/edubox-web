<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Asystent Pedagoga - Kombajn Modułowy</title>
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar { background-color: #0f172a; border-right: 1px solid #1e293b; }
        .card-bg { background-color: #0b1120; border: 1px solid #1e293b; }
        .input-bg { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
        .input-bg:focus { border-color: #ef4444; outline: none; }
        .btn-red { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: white; }
        .btn-red:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
        .auth-box { background-color: #27272a; border: 1px solid #3f3f46; color: #d4d4d8; }
        .auth-box.unlocked { background-color: rgba(22, 101, 52, 0.2); border-color: #166534; color: #86efac; }
        .module-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #cbd5e1; font-size: 0.875rem; cursor: pointer; }
        .module-btn.active { background-color: #1e293b; color: #f8fafc; border-left: 3px solid #ef4444; }
        .doc-radio { display: none; }
        .doc-label { display: block; padding: 0.75rem 1rem; background-color: #0b1120; border: 1px solid #1e293b; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .doc-radio:checked + .doc-label { background-color: rgba(225, 29, 72, 0.1); border-color: #e11d48; color: #fff; font-weight: 600; }
        @media print {
            body { background-color: white !important; color: black !important; }
            .print-hidden, .sidebar { display: none !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
            .card-bg { border: none !important; box-shadow: none !important; background: transparent !important; }
            .print-area { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: black !important; white-space: pre-wrap; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SECRET_PIN = "KAWA2024"; 
        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";

        const DOC_TYPES = [
            { id: 'ipet', label: 'IPET (Indywidualny Program Edukacyjno-Terapeutyczny)' },
            { id: 'wopfu', label: 'WOPFU (Wielospecjalistyczna Ocena Poziomu Funkcjonowania Ucznia)' },
            { id: 'opinia', label: 'Opinia o uczniu do Poradni (PPP)' },
            { id: 'notatka', label: 'Arkusz Obserwacji / Notatka służbowa' }
        ];

        const MODULES = [
            { id: 'dokumenty', label: 'Asystent Dokumentów', icon: '📄' },
            { id: 'historyjki', label: 'Historyjki Społeczne (+ AI)', icon: '🧩' },
            { id: 'rymowanki', label: 'Rymowanki Przedszkolne', icon: '🎈' },
            { id: 'tus', label: 'Kreator TUS', icon: '🫂' }
        ];

        const getSystemPrompt = (module, docType, customHeaders) => {
            if (module === 'dokumenty') {
                let base = `Jesteś pedagogiem specjalnym. Wygeneruj dokument: ${docType}. Język formalny. Nie używaj gwiazdek **.`;
                if (customHeaders) base += `\nUżyj tych nagłówków:\n"${customHeaders}"`;
                return base;
            }
            if (module === 'historyjki') return `Napisz 'Historyjkę Społeczną' wg Carol Gray. Krótkie zdania, 1 osoba, uspokajający ton. Max 5 zdań.`;
            if (module === 'rymowanki') return `Ułóż radosną rymowankę edukacyjną dla przedszkolaka.`;
            if (module === 'tus') return `Przygotuj krótki scenariusz ćwiczenia TUS dla grupy.`;
            return "Jesteś asystentem AI.";
        };

        function App() {
            const [activeModule, setActiveModule] = useState('dokumenty');
            const [authCode, setAuthCode] = useState('');
            const [isUnlocked, setIsUnlocked] = useState(false);
            
            const [docType, setDocType] = useState('ipet');
            const [diagnoza, setDiagnoza] = useState('');
            const [naglowki, setNaglowki] = useState('');
            const [mocneStrony, setMocneStrony] = useState('');
            const [trudnosci, setTrudnosci] = useState('');
            const [genericInput, setGenericInput] = useState('');

            const [generatedText, setGeneratedText] = useState('');
            const [generatedImage, setGeneratedImage] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => { setIsUnlocked(authCode === SECRET_PIN); }, [authCode]);

            // =======================================================================
            // TO JEST NOWE SERCE: ZAWSZE łączy się z Twoim Vercel /api/gemini
            // Zero wyjątków, zero starych modeli z Google. Totalnie bezpieczne.
            // =======================================================================
            const secureApiCall = async (payload, type = 'text') => {
                try {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payload, type })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || `Błąd serwera Vercel (${response.status})`);
                    }
                    return data;
                } catch (error) {
                    console.error("Szczegóły błędu:", error);
                    throw new Error("Nie udało się połączyć z Twoim serwerem Vercel. Sprawdź, czy masz internet i czy serwer działa.");
                }
            };

            const handleGenerate = async () => {
                if (!isUnlocked) { setError("Wpisz poprawny kod dostępu!"); return; }
                setIsGenerating(true); setError(''); setGeneratedText(''); setGeneratedImage('');

                try {
                    let finalPrompt = "";
                    if (activeModule === 'dokumenty') {
                        finalPrompt = `Wygeneruj dokument: ${docType}\nDiagnoza: ${diagnoza}\nMocne strony: ${mocneStrony}\nTrudności: ${trudnosci}`;
                    } else {
                        finalPrompt = `Temat / Problem: ${genericInput}`;
                    }

                    const textPayload = {
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: getSystemPrompt(activeModule, docType, naglowki) }] }
                    };

                    // Wysyłka do Vercela
                    const textData = await secureApiCall(textPayload, 'text');
                    const story = textData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!story) throw new Error("Vercel nie zwrócił tekstu.");
                    
                    setGeneratedText(story);

                    // Obrazek (tylko w historyjkach)
                    if (activeModule === 'historyjki') {
                        try {
                            const imgPayload = {
                                instances: { prompt: `A situation where: ${genericInput}. Cute simple 2D therapeutic illustration for kids, showing a positive resolution, calm colors.` }
                            };
                            const imgData = await secureApiCall(imgPayload, 'image');
                            if (imgData.predictions?.[0]?.bytesBase64Encoded) {
                                setGeneratedImage(`data:image/png;base64,\${imgData.predictions[0].bytesBase64Encoded}`);
                            }
                        } catch(e) { console.log("Obrazek zignorowany:", e); }
                    }
                } catch (err) {
                    setError('BŁĄD: ' + err.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="flex min-h-screen relative">
                    <div className="sidebar w-72 flex-shrink-0 flex flex-col h-screen sticky top-0 print-hidden">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="font-bold text-slate-300 text-sm tracking-widest uppercase">Asystent Pedagoga</h1>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            <div className="mb-8">
                                <h2 className="font-bold text-white mb-2">🔑 Autoryzacja</h2>
                                <input 
                                    type="password" value={authCode} onChange={(e) => setAuthCode(e.target.value)}
                                    placeholder="Wpisz PIN..." className="w-full input-bg rounded-lg px-3 py-2 text-sm mb-2" 
                                />
                                <div className={`p-3 rounded-lg text-xs \${isUnlocked ? 'auth-box unlocked' : 'auth-box'}`}>
                                    {isUnlocked ? "✅ Odblokowano" : "Podaj kod awans2024"}
                                </div>
                            </div>
                            
                            <div>
                                <h2 className="font-bold text-white mb-2">🛠️ Menu Główne</h2>
                                <div className="space-y-1">
                                    {MODULES.map(mod => (
                                        <div key={mod.id} onClick={() => { setActiveModule(mod.id); setGeneratedText(''); }} className={`module-btn \${activeModule === mod.id ? 'active' : ''}`}>
                                            <span className="w-5 text-center">{mod.icon}</span><span>{mod.label}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="main-content flex-1 bg-[#020617] p-6 lg:p-10 min-w-0">
                        {!generatedText ? (
                            <div className="max-w-4xl fade-in print-hidden">
                                {activeModule === 'dokumenty' && (
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-bold text-white mb-6">Asystent Dokumentów (IPET/WOPFU)</h2>
                                        <div className="card-bg p-2 rounded-xl">
                                            {DOC_TYPES.map(doc => (
                                                <div key={doc.id}>
                                                    <input type="radio" id={doc.id} checked={docType === doc.id} onChange={() => setDocType(doc.id)} className="doc-radio" />
                                                    <label htmlFor={doc.id} className="doc-label">{doc.label}</label>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="card-bg p-4 rounded-xl">
                                                <label className="block text-sm font-bold text-slate-300 mb-2">Diagnoza:</label>
                                                <textarea value={diagnoza} onChange={(e) => setDiagnoza(e.target.value)} className="w-full h-20 input-bg rounded-lg p-3 text-sm"></textarea>
                                            </div>
                                            <div className="card-bg p-4 rounded-xl">
                                                <label className="block text-sm font-bold text-slate-300 mb-2">Własne nagłówki:</label>
                                                <textarea value={naglowki} onChange={(e) => setNaglowki(e.target.value)} className="w-full h-20 input-bg rounded-lg p-3 text-sm"></textarea>
                                            </div>
                                        </div>
                                        <div className="card-bg p-4 rounded-xl">
                                            <label className="block text-sm font-bold text-amber-400 mb-2">Mocne strony:</label>
                                            <textarea value={mocneStrony} onChange={(e) => setMocneStrony(e.target.value)} className="w-full h-20 input-bg rounded-lg p-3 text-sm"></textarea>
                                        </div>
                                        <div className="card-bg p-4 rounded-xl">
                                            <label className="block text-sm font-bold text-rose-400 mb-2">Trudności / Bariery:</label>
                                            <textarea value={trudnosci} onChange={(e) => setTrudnosci(e.target.value)} className="w-full h-20 input-bg rounded-lg p-3 text-sm"></textarea>
                                        </div>
                                    </div>
                                )}

                                {activeModule !== 'dokumenty' && (
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-bold text-white mb-2">{MODULES.find(m => m.id === activeModule)?.label}</h2>
                                        <div className="card-bg p-4 rounded-xl">
                                            <label className="block text-sm font-bold text-slate-300 mb-2">Opisz sytuację:</label>
                                            <textarea value={genericInput} onChange={(e) => setGenericInput(e.target.value)} className="w-full h-32 input-bg rounded-lg p-4 text-sm"></textarea>
                                        </div>
                                    </div>
                                )}

                                {error && <div className="mt-6 p-4 bg-red-900/40 text-red-400 rounded-xl font-bold">{error}</div>}

                                <div className="mt-8">
                                    <button onClick={handleGenerate} disabled={isGenerating || !isUnlocked} className="btn-red px-8 py-4 rounded-xl font-bold w-full sm:w-auto">
                                        {isGenerating ? "GENEROWANIE TRWA..." : "✨ GENERUJ DOKUMENT"}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-4xl fade-in pb-10">
                                <div className="flex justify-between mb-6 print-hidden">
                                    <h2 className="text-2xl font-bold text-white">Twój Dokument</h2>
                                    <button onClick={() => setGeneratedText('')} className="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">Wróć</button>
                                </div>
                                <div className="card-bg p-8 rounded-3xl print-area flex flex-col md:flex-row gap-8">
                                    {generatedImage && (
                                        <div className="w-full md:w-1/3 print-hidden">
                                            <img src={generatedImage} alt="AI" className="w-full rounded-2xl border-4 border-slate-800" />
                                        </div>
                                    )}
                                    <div className="w-full text-slate-200">{generatedText}</div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
