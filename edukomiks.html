<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>EduKomiks AI PRO - EduBox</title>
    
    <!-- Wymuszenie HTTPS -->
    <script>
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3RQ9R0N0K8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3RQ9R0N0K8');
    </script>

    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Fonty Komiksowe -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        comic: ['"Comic Neue"', 'cursive'],
                        bangers: ['Bangers', 'cursive']
                    },
                    colors: { slate: { 950: '#020617' } },
                    boxShadow: {
                        'solid': '6px 6px 0px 0px rgba(0,0,0,1)',
                        'solid-sm': '3px 3px 0px 0px rgba(0,0,0,1)'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(234, 179, 8, 0.15) 0px, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0px, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .halftone-bg {
            background-image: radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 12px 12px;
        }

        /* COMIC STYLES */
        .comic-panel { 
            border: 4px solid black; 
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); 
            overflow: hidden; 
            background: white; 
            position: relative; 
            display: flex;
            flex-direction: column;
        }
        .narration-bar { 
            background: #fef08a; /* Żółty Pop-Art */
            color: black; 
            border-bottom: 4px solid black; 
            padding: 10px 14px; 
            font-weight: 900; 
            font-size: 1rem; 
            z-index: 40; 
            position: relative; 
            font-family: 'Outfit', sans-serif; 
            line-height: 1.3;
        }
        
        /* ZMIANA 1: DYMKI PRZENIESIONE NA GÓRĘ OBRAZKA */
        .comic-bubble { 
            background: white; 
            border: 3px solid black; 
            border-radius: 24px; 
            padding: 10px 16px; 
            color: black; 
            font-family: 'Comic Neue', cursive; 
            font-weight: 900; 
            text-align: center; 
            position: absolute; 
            top: 15px; /* UMIEJSCOWIENIE NA GÓRZE ZAMIAST BOTTOM */
            left: 50%; 
            transform: translateX(-50%); 
            width: 85%; 
            z-index: 50;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            font-size: 1.1rem;
            line-height: 1.2;
        }
        .bubble-tail { 
            position: absolute; 
            bottom: -15px; /* Ogon wskazuje z góry w dół na postać */
            left: 50%; 
            transform: translateX(-50%);
            width: 18px; 
            height: 18px; 
            background: white; 
            clip-path: polygon(0 0, 100% 0, 50% 100%); 
            z-index: 51;
        }
        .bubble-tail-border {
            position: absolute; 
            bottom: -20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 26px; 
            height: 22px; 
            background: black; 
            clip-path: polygon(0 0, 100% 0, 50% 100%); 
            z-index: 49;
        }

        /* Druk */
        @media print {
            body { background: white; color: black; background-image: none; }
            .no-print { display: none !important; }
            .print-area { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; border: none !important; box-shadow: none !important; background: white !important;}
            .comic-grid { gap: 15px !important; }
            .comic-panel { border-width: 3px !important; border-color: black !important; break-inside: avoid; box-shadow: none !important;}
            .narration-bar { border-bottom-width: 3px !important; border-color: black !important; }
            .comic-bubble { border-width: 3px !important; border-color: black !important; box-shadow: none !important; }
            .bubble-tail-border { display: none !important; } /* Uproszczenie do druku */
            @page { margin: 1cm; size: A4 portrait; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Freemium State
            const [isPremium, setIsPremium] = useState(false);
            const [usagesLeft, setUsagesLeft] = useState(2);
            const [showPremiumModal, setShowPremiumModal] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            // Generator State
            const [topic, setTopic] = useState('');
            const [ageGroup, setAgeGroup] = useState('Klasy 1-3');
            const [artStyle, setArtStyle] = useState('Bajkowe 3D (Disney)'); 
            
            const [step, setStep] = useState('config'); // config, generating, review
            const [comicData, setComicData] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('');
            const [loadingProgress, setLoadingProgress] = useState(0);

            // ZMIANA 2: Do regeneracji pojedynczego kadru
            const [regeneratingIndex, setRegeneratingIndex] = useState(null);

            useEffect(() => {
                const premiumStatus = localStorage.getItem('edubox_premium_unlocked');
                const storedUsages = localStorage.getItem('edukomiks_usages');
                if (premiumStatus === 'true') setIsPremium(true);
                else {
                    if (storedUsages !== null) setUsagesLeft(parseInt(storedUsages, 10));
                    else localStorage.setItem('edukomiks_usages', '2');
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const handleVerifyCode = (e) => {
                e?.preventDefault();
                if (accessCode.trim().toUpperCase() === 'KAWA2024') { 
                    localStorage.setItem('edubox_premium_unlocked', 'true');
                    setIsPremium(true); setShowPremiumModal(false); setAccessCode(''); 
                    showToast('Odblokowano Premium! 🌟'); 
                } else { showToast('Błędny kod dostępu!'); }
            };

            const translateStyle = (styleName) => {
                switch(styleName) {
                    case 'Klasyczny Komiks': return 'classic Marvel DC comic book style, pop art, vibrant flat colors, strong black ink outlines';
                    case 'Manga / Anime': return 'Japanese manga anime style, Studio Ghibli, highly detailed, beautiful lighting';
                    case 'Bajkowe 3D (Disney)': return 'cute 3D Pixar Disney style render, adorable, flawless, vibrant colors, unreal engine 5';
                    case 'Kredki / Szkic': return 'hand drawn crayon sketch, children book illustration, soft, artistic, playful';
                    default: return 'comic book style';
                }
            };

            // ETAP 1 & 2: GENEROWANIE ŁAŃCUCHOWE
            const generateComic = async () => {
                if (!isPremium && usagesLeft <= 0) return setShowPremiumModal(true);
                if (!topic.trim()) return showToast('Wpisz temat lub morał komiksu!');

                setStep('generating');
                setLoadingStatus('1/2 Wymyślam scenariusz i dialogi...');
                setLoadingProgress(10);
                
                try {
                    // 1. SCENARIUSZ Z GPT-4o-mini
                    const systemPrompt = `Jesteś genialnym scenarzystą komiksów edukacyjnych. Twoim zadaniem jest napisanie krótkiej, 4-kadrowej historii.
                    
                    ZASADY JĘZYKOWE:
                    - 'title', 'narration' oraz 'dialogue' MUSZĄ być w języku POLSKIM.
                    - 'imagePrompt' MUSI być po ANGIELSKU dla zagranicznego malarza AI.
                    
                    STABILIZACJA POSTACI (KRYTYCZNE):
                    1. Na podstawie podanego tematu wymyśl głównego bohatera.
                    2. Stwórz JEDEN, precyzyjny opis wyglądu w języku angielskim (np. "A 7-year-old Caucasian girl with blonde pigtails wearing a red shirt").
                    3. Wklej TEN SAM opis kropka w kropkę do KAŻDEGO z 4 'imagePrompt', opisując co ta postać akurat robi.
                    4. Aby postać nie ucinała głowy, w każdym 'imagePrompt' dopisz na końcu: "Medium shot, full body visible".
                    
                    Zwróć WYŁĄCZNIE poprawny JSON o strukturze:
                    {
                        "title": "Chwytliwy tytuł (max 4 słowa)",
                        "panels": [
                            {
                                "narration": "Tekst narratora (opis sytuacji, krótki, 1 zdanie).",
                                "dialogue": "Krótka wypowiedź bohatera (max 8 słów!). Jeśli brak, zostaw puste.",
                                "imagePrompt": "[Tutaj wklej stały opis postaci] is doing [czynność]. Medium shot, full body visible. ABSOLUTELY NO TEXT, NO SPEECH BUBBLES."
                            },
                            ... (dokładnie 4 takie obiekty)
                        ]
                    }`;

                    const userPrompt = `Temat / Morał / Bohater: ${topic}. Wiek odbiorców: ${ageGroup}.`;

                    const resChat = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.7, model: "gpt-4o-mini" })
                    });
                    
                    if (!resChat.ok) throw new Error("Błąd podczas tworzenia scenariusza");
                    const dataChat = await resChat.json();
                    
                    let jsonStr = dataChat.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('{') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                    let comicObj = JSON.parse(jsonStr);

                    // 2. GENEROWANIE OBRAZÓW (Flux na Vercel API)
                    setLoadingStatus('2/2 Rysuję kadry komiksu we Fluxie...');
                    const engStyle = translateStyle(artStyle);
                    
                    for (let i = 0; i < comicObj.panels.length; i++) {
                        setLoadingProgress(25 + (i * 18));
                        
                        const fullPrompt = `${comicObj.panels[i].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Perfect anatomy.`;

                        const responseImg = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                prompt: fullPrompt,
                                negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy, bad hands, extra limbs",
                                aspect_ratio: '1:1',
                                size: '1024x1024',
                                width: 1024,
                                height: 1024
                            })
                        });
                        
                        if (responseImg.ok) {
                            const dataImg = await responseImg.json();
                            let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                            if (imgUrl) {
                                if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                    imgUrl = `data:image/png;base64,${imgUrl}`;
                                }
                                comicObj.panels[i].imageUrl = imgUrl;
                            }
                        }
                    }

                    setComicData(comicObj);
                    setLoadingProgress(100);
                    
                    if (!isPremium) {
                        const newUsages = usagesLeft - 1;
                        setUsagesLeft(newUsages);
                        localStorage.setItem('edukomiks_usages', newUsages.toString());
                    }

                    setTimeout(() => setStep('review'), 500);

                } catch (error) {
                    console.error("Błąd generatora komiksu:", error);
                    showToast('Wystąpił błąd! Serwery są przeciążone. Spróbuj ponownie.');
                    setStep('config');
                }
            };

            // REGENERACJA JEDNEGO KADRU (Gdy AI zmutuje dłonie/twarz)
            const regeneratePanel = async (index) => {
                if (regeneratingIndex !== null) return; // Zapobiega klikaniu wielu na raz
                setRegeneratingIndex(index);
                showToast("Magia działa... Odświeżam ten kadr!");
                
                try {
                    const engStyle = translateStyle(artStyle);
                    const fullPrompt = `${comicData.panels[index].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Perfect anatomy.`;

                    const responseImg = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: fullPrompt,
                            negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy, deformed",
                            aspect_ratio: '1:1',
                            size: '1024x1024',
                            width: 1024,
                            height: 1024
                        })
                    });
                    
                    if (responseImg.ok) {
                        const dataImg = await responseImg.json();
                        let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                        if (imgUrl) {
                            if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                imgUrl = `data:image/png;base64,${imgUrl}`;
                            }
                            const newData = {...comicData};
                            newData.panels[index].imageUrl = imgUrl;
                            setComicData(newData);
                            showToast("Gotowe! Mamy nowy rysunek.");
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Błąd przy odświeżaniu. Spróbuj jeszcze raz.");
                } finally {
                    setRegeneratingIndex(null);
                }
            };

            // RENDER: Konfigurator
            if (step === 'config') {
                return (
                    <div className="min-h-screen flex flex-col font-sans halftone-bg relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-blue-500 text-white px-6 py-3 rounded-xl font-bold shadow-solid transition-all duration-300 border-2 border-black">
                                {toastMessage}
                            </div>
                        )}

                        {/* ZMIANA 3: Menu z dodanym Postaw Kawę */}
                        <nav className="fixed top-0 w-full z-[100] bg-white border-b-4 border-black h-20 shadow-sm">
                            <div className="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                    <div className="w-10 h-10 bg-yellow-400 border-2 border-black flex items-center justify-center shadow-solid-sm rounded">
                                        <i className="ph-bold ph-chats-circle text-black text-2xl"></i>
                                    </div>
                                    <span className="text-2xl font-bangers tracking-wider text-black mt-1">EduKomiks <span className="text-blue-600">AI</span></span>
                                </div>
                                <div className="flex items-center gap-3 md:gap-4 flex-wrap justify-end">
                                    {!isPremium && (
                                        <div className="text-xs md:text-sm px-3 md:px-4 py-2 bg-slate-100 border-2 border-black font-bold text-black rounded flex items-center gap-2">
                                            <i className="ph-fill ph-lightning text-yellow-500"></i>
                                            <span className="hidden sm:inline">Darmowe pule:</span><strong>{usagesLeft}</strong>
                                        </div>
                                    )}
                                    
                                    {/* NOWY PRZYCISK: Postaw Kawę */}
                                    <a href="https://buycoffee.to/magiccolor" target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-black hover:bg-yellow-100 transition-colors text-xs md:text-sm font-bold bg-white px-3 md:px-4 py-2 border-2 border-black rounded shadow-solid-sm">
                                        <i className="ph-fill ph-coffee text-yellow-500 text-lg"></i> <span className="hidden md:inline">Postaw Kawę</span>
                                    </a>

                                    <a href="index.html" className="flex items-center gap-2 text-black hover:bg-slate-100 transition-colors text-xs md:text-sm font-bold bg-white px-3 md:px-4 py-2 border-2 border-black rounded shadow-solid-sm">
                                        <i className="ph-bold ph-arrow-left"></i> <span className="hidden sm:inline">Portfolio</span>
                                    </a>
                                </div>
                            </div>
                        </nav>

                        <div className="max-w-3xl mx-auto px-4 pt-32 pb-24 flex-grow w-full relative z-10">
                            <div className="text-center mb-10 bg-white border-4 border-black p-8 rounded-2xl shadow-solid relative transform -rotate-1">
                                <div className="absolute -top-6 -right-6 bg-blue-500 text-white font-bangers text-2xl py-2 px-4 border-4 border-black rounded-full rotate-12 shadow-solid-sm">BAM!</div>
                                <h1 className="text-4xl md:text-5xl font-bangers text-black mb-2 tracking-wide">Twórz Komiksy z EduBox AI!</h1>
                                <p className="text-slate-600 font-bold font-comic text-lg">Podaj temat, bohatera lub sytuację, a sztuczna inteligencja wygeneruje 4-kadrowy komiks do wydruku.</p>
                            </div>

                            {/* ZMIANA 4: Rozbudowany formularz z wyborem wieku i stylu */}
                            <div className="bg-white p-8 rounded-2xl shadow-solid border-4 border-black space-y-6">
                                <div>
                                    <label className="text-sm font-black text-black uppercase block mb-2 font-comic">1. Temat lub Morał (o czym ma być komiks?)</label>
                                    <input type="text" value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Tomek uczy się, dlaczego warto myć zęby..." className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl text-lg font-bold outline-none text-black focus:bg-yellow-50 transition-colors font-comic" />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">2. Wiek odbiorców</label>
                                        <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Przedszkole</option><option>Klasy 1-3</option><option>Klasy 4-6</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">3. Styl rysunku</label>
                                        <select value={artStyle} onChange={e => setArtStyle(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Bajkowe 3D (Disney)</option>
                                            <option>Klasyczny Komiks</option>
                                            <option>Manga / Anime</option>
                                            <option>Kredki / Szkic</option>
                                        </select>
                                    </div>
                                </div>

                                <button onClick={generateComic} className="w-full mt-4 bg-yellow-400 hover:bg-yellow-300 text-black py-5 rounded-xl font-bangers text-3xl tracking-widest border-4 border-black shadow-solid transition-transform active:translate-y-2 active:shadow-none flex justify-center items-center gap-3">
                                    <i className="ph-fill ph-lightning"></i> Rysuj Komiks!
                                </button>
                                
                                {!isPremium && usagesLeft <= 0 && (
                                    <p className="text-center text-sm text-red-600 font-bold mt-2 cursor-pointer hover:underline font-comic" onClick={() => setShowPremiumModal(true)}>
                                        Wyczerpano darmowe próby. Kliknij, aby odblokować.
                                    </p>
                                )}
                            </div>
                        </div>

                        {/* Paywall ze wsparciem */}
                        {showPremiumModal && (
                            <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                                <div className="bg-white p-8 rounded-2xl border-4 border-black max-w-md w-full text-center shadow-solid relative transform rotate-1">
                                    <h3 className="text-3xl font-bangers text-black mb-2 tracking-wide">Konto Premium</h3>
                                    <p className="text-sm text-slate-600 mb-6 font-bold font-comic">Wyczerpałeś darmowe próby rysowania. Wpisz kod KAWA2024, aby tworzyć komiksy bez limitu!</p>
                                    
                                    <input type="text" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Wpisz kod..." className="w-full bg-slate-50 border-4 border-black rounded-xl px-4 py-3 text-center text-xl font-black text-black mb-4 outline-none focus:bg-yellow-50 uppercase tracking-widest font-comic" />
                                    <button onClick={handleVerifyCode} className="w-full bg-blue-500 text-white font-bangers tracking-widest text-2xl border-4 border-black py-3 rounded-xl shadow-solid-sm active:translate-y-1 active:shadow-none transition-transform mb-4">Aktywuj Kod</button>
                                    
                                    <a href="https://buycoffee.to/magiccolor" target="_blank" rel="noopener noreferrer" className="block w-full bg-yellow-400 border-4 border-black py-3 rounded-xl font-bangers text-xl shadow-solid-sm active:translate-y-1 text-black">☕ Zdobądź Kod (Postaw Kawę)</a>
                                    
                                    <button onClick={() => setShowPremiumModal(false)} className="mt-4 text-xs font-bold text-slate-400 font-comic uppercase hover:text-black">Anuluj</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // RENDER: Loading
            if (step === 'generating') {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col text-center px-4 bg-yellow-400 halftone-bg text-black">
                        <div className="bg-white border-4 border-black p-10 rounded-3xl shadow-solid flex flex-col items-center max-w-md w-full transform rotate-1">
                            <i className="ph-fill ph-palette animate-bounce text-7xl text-blue-500 mb-4 drop-shadow-md"></i>
                            <h2 className="text-4xl font-bangers tracking-widest mb-2">Praca wre!</h2>
                            <p className="font-comic font-bold text-slate-600 mb-6">{loadingStatus}</p>
                            
                            <div className="w-full h-6 bg-slate-200 border-4 border-black rounded-full overflow-hidden relative">
                                <div className="h-full bg-blue-500 transition-all duration-300 flex items-center justify-end px-2" style={{ width: `${loadingProgress}%` }}>
                                    <div className="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Podgląd i Wydruk
            if (step === 'review') {
                return (
                    <div className="min-h-screen flex flex-col halftone-bg text-slate-900 bg-slate-100">
                        {toastMessage && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-green-500 text-white px-6 py-3 border-4 border-black rounded-xl font-bold shadow-solid-sm font-comic">
                                {toastMessage}
                            </div>
                        )}
                        
                        <nav className="bg-white border-b-4 border-black h-16 flex items-center justify-between px-6 shadow-sm no-print sticky top-0 z-50">
                            <h1 className="text-2xl font-bangers tracking-wide text-black mt-1"><i className="ph-fill ph-check-circle text-green-500"></i> Komiks Gotowy!</h1>
                            <div className="flex gap-3">
                                <button onClick={() => window.print()} className="bg-yellow-400 hover:bg-yellow-300 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic flex items-center gap-2 shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">
                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj / PDF
                                </button>
                                <button onClick={() => setStep('config')} className="bg-white hover:bg-slate-100 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">Nowy Komiks</button>
                            </div>
                        </nav>

                        <div className="flex-1 p-4 md:p-8 flex justify-center">
                            {/* KONTENER A4 DO DRUKU */}
                            <div className="print-area bg-white border-4 border-black shadow-solid p-6 md:p-10 w-full max-w-4xl mx-auto rounded-xl">
                                
                                <h1 className="text-4xl md:text-6xl font-bangers text-center text-black mb-8 uppercase tracking-wider drop-shadow-sm border-b-4 border-black pb-4">
                                    {comicData.title}
                                </h1>

                                {/* SIATKA 2x2 KOMIKSU */}
                                <div className="comic-grid grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900 p-4 md:p-6 rounded-xl border-4 border-black">
                                    {comicData.panels.map((panel, idx) => (
                                        <div key={idx} className="comic-panel group">
                                            
                                            {/* Narrator (Górna żółta belka) */}
                                            {panel.narration && (
                                                <div className="narration-bar">
                                                    {panel.narration}
                                                </div>
                                            )}

                                            {/* Kontener na obrazek i dymek */}
                                            <div className="relative flex-1 bg-slate-200 overflow-hidden flex items-center justify-center min-h-[300px]">
                                                {/* Obrazek w tle */}
                                                {panel.imageUrl ? (
                                                    <img src={panel.imageUrl} className="absolute inset-0 w-full h-full object-cover z-0" />
                                                ) : (
                                                    <span className="relative z-0 font-comic font-bold text-slate-400">Brak obrazka</span>
                                                )}

                                                {/* Dymek z dialogiem (NA GÓRZE) */}
                                                {panel.dialogue && (
                                                    <div className="comic-bubble">
                                                        {panel.dialogue}
                                                        <div className="bubble-tail-border"></div>
                                                        <div className="bubble-tail"></div>
                                                    </div>
                                                )}

                                                {/* Numer Kadru (Prawy Dolny Róg) */}
                                                <div className="absolute bottom-3 right-3 bg-black text-white border-2 border-white font-bangers w-8 h-8 flex items-center justify-center rounded-full text-base z-30 shadow-md">
                                                    {idx + 1}
                                                </div>

                                                {/* PRZYCISK REGENERACJI (Pokazuje się na najechanie kursorem) */}
                                                <button 
                                                    onClick={() => regeneratePanel(idx)} 
                                                    disabled={regeneratingIndex !== null}
                                                    className={`no-print absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-500 border-4 border-black text-white font-bangers px-4 py-2 text-xl rounded shadow-solid transition-opacity z-[100] hover:bg-blue-400 ${regeneratingIndex === idx ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                                                >
                                                    {regeneratingIndex === idx ? (
                                                        <><i className="ph-bold ph-spinner animate-spin mr-1"></i> Rysuję...</>
                                                    ) : (
                                                        <><i className="ph-bold ph-arrows-clockwise mr-1"></i> Przerysuj Kadr</>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-6 text-right font-comic font-bold text-sm text-slate-500 uppercase tracking-widest">
                                    Stworzono w EduBox AI
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
