  <link rel="canonical" href="https://eduboxpro.pl/edukomiks.html">
  <meta name="description" content="Wymyśla opowieść z morałem, rysuje kadry i nakłada komiksowe dymki. Za darmo, prosto z przeglądarki – EduBox AI.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon"></head>
<body>
    <!-- KONTENER NA WSPÓLNE MENU V3 PRO MAX -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>

    <!-- ========================================================= -->
        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            // --- LOCAL STATES ---
            const [toastMessage, setToastMessage] = useState('');
            const [topic, setTopic] = useState('');
            const [ageGroup, setAgeGroup] = useState('Klasy 1-3');
            const [artStyle, setArtStyle] = useState('Bajkowe 3D (Disney)'); 
            
            const [step, setStep] = useState('config'); // config, generating, review
            const [comicData, setComicData] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('');
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [regeneratingIndex, setRegeneratingIndex] = useState(null);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_edukomiks', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const handleVerifyCode = async (e) => {
                e?.preventDefault();
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            const translateStyle = (styleName) => {
                switch(styleName) {
                    case 'Klasyczny Komiks': return 'classic Marvel DC comic book style, pop art, vibrant flat colors, strong black ink outlines';
                    case 'Manga / Anime': return 'Japanese manga anime style, Studio Ghibli, highly detailed, beautiful lighting';
                    case 'Bajkowe 3D (Disney)': return 'cute 3D Pixar Disney style render, adorable, flawless, vibrant colors, unreal engine 5';
                    case 'Kredki / Szkic': return 'hand drawn crayon sketch, children book illustration, soft, artistic, playful';
                    default: return 'comic book style';
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (!comicData) return;
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = comicData.title || `Komiks: ${topic.substring(0, 15)}...`;
                            const config = { topic, ageGroup, artStyle, comicData };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_edukomiks', 'Komiks AI', name, config);
                            showToast("✨ Udostępniono Komiks w Giełdzie Wzorów!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.comicData) {
                    if(c.topic) setTopic(c.topic);
                    if(c.ageGroup) setAgeGroup(c.ageGroup);
                    if(c.artStyle) setArtStyle(c.artStyle);
                    
                    setComicData(c.comicData);
                    setAppMode('editor');
                    setStep('review');
                    showToast("✨ Załadowano Komiks z Giełdy!");
                }
            };

            // --- GENERATOR AI ---
            const handleGenerateComic = () => {
                if (!topic.trim()) return showToast('Wpisz temat lub morał komiksu!');
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        generateComic();
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const generateComic = async () => {
                setStep('generating');
                setLoadingStatus('1/2 Wymyślam scenariusz i dialogi...');
                setLoadingProgress(10);
                
                try {
                    const systemPrompt = `Jesteś genialnym scenarzystą komiksów edukacyjnych. Twoim zadaniem jest napisanie krótkiej, 4-kadrowej historii.
                    
                    ZASADY JĘZYKOWE:
                    - 'title', 'narration' oraz 'dialogue' MUSZĄ być w języku POLSKIM.
                    - 'imagePrompt' MUSI być po ANGIELSKU dla zagranicznego malarza AI.
                    
                    STABILIZACJA POSTACI (KRYTYCZNE):
                    1. Na podstawie podanego tematu wymyśl głównego bohatera.
                    2. Stwórz JEDEN, precyzyjny opis wyglądu w języku angielskim (np. "A 7-year-old Caucasian girl with blonde pigtails wearing a red shirt").
                    3. Wklej TEN SAM opis kropka w kropkę do KAŻDEGO z 4 'imagePrompt', opisując co ta postać akurat robi.
                    4. Aby postać nie ucinała głowy, w każdym 'imagePrompt' dopisz na końcu: "Medium shot, full body visible".
                    
                    Zwróć WYŁĄCZNIE poprawny JSON o strukturze:
                    {
                        "title": "Chwytliwy tytuł (max 4 słowa)",
                        "panels": [
                            {
                                "narration": "Tekst narratora (opis sytuacji, krótki, 1 zdanie).",
                                "dialogue": "Krótka wypowiedź bohatera (max 8 słów!). Jeśli brak, zostaw puste.",
                                "imagePrompt": "[Tutaj wklej stały opis postaci] is doing [czynność]. Medium shot, full body visible. ABSOLUTELY NO TEXT, NO SPEECH BUBBLES."
                            }
                        ]
                    }`;

                    const userPrompt = `Temat / Morał / Bohater: ${topic}. Wiek odbiorców: ${ageGroup}.`;

                    const resChat = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.7, model: "gpt-4o-mini" })
                    });
                    
                    if (!resChat.ok) throw new Error("Błąd podczas tworzenia scenariusza");
                    const dataChat = await resChat.json();
                    
                    let jsonStr = dataChat.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('{') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                    let comicObj = JSON.parse(jsonStr);

                    setLoadingStatus('2/2 Rysuję kadry komiksu we Fluxie...');
                    const engStyle = translateStyle(artStyle);
                    
                    for (let i = 0; i < comicObj.panels.length; i++) {
                        setLoadingProgress(25 + (i * 18));
                        
                        const fullPrompt = `${comicObj.panels[i].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Perfect anatomy.`;

                        const responseImg = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                prompt: fullPrompt,
                                negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy, bad hands, extra limbs",
                                aspect_ratio: '1:1',
                                size: '1024x1024'
                            })
                        });
                        
                        if (responseImg.ok) {
                            const dataImg = await responseImg.json();
                            let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                            if (imgUrl) {
                                if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                    imgUrl = `data:image/png;base64,${imgUrl}`;
                                }
                                comicObj.panels[i].imageUrl = imgUrl;
                            }
                        }
                    }

                    setComicData(comicObj);
                    setLoadingProgress(100);
                    setTimeout(() => setStep('review'), 500);

                } catch (error) {
                    console.error("Błąd generatora komiksu:", error);
                    showToast('Wystąpił błąd! Serwery są przeciążone. Spróbuj ponownie.');
                    setStep('config');
                }
            };

            const handleRegeneratePanel = (index) => {
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        regeneratePanel(index);
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const regeneratePanel = async (index) => {
                if (regeneratingIndex !== null) return; 
                setRegeneratingIndex(index);
                showToast("Magia działa... Odświeżam ten kadr!");
                
                try {
                    const engStyle = translateStyle(artStyle);
                    const fullPrompt = `${comicData.panels[index].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Perfect anatomy.`;

                    const responseImg = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: fullPrompt,
                            negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy, deformed",
                            aspect_ratio: '1:1',
                            size: '1024x1024'
                        })
                    });
                    
                    if (responseImg.ok) {
                        const dataImg = await responseImg.json();
                        let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                        if (imgUrl) {
                            if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                imgUrl = `data:image/png;base64,${imgUrl}`;
                            }
                            const newData = {...comicData};
                            newData.panels[index].imageUrl = imgUrl;
                            setComicData(newData);
                            showToast("Gotowe! Mamy nowy rysunek.");
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Błąd przy odświeżaniu. Spróbuj jeszcze raz.");
                } finally {
                    setRegeneratingIndex(null);
                }
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex flex-col font-sans halftone-bg relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-blue-500 text-white px-6 py-3 rounded-xl font-bold shadow-solid transition-all duration-300 border-2 border-black">
                                {toastMessage}
                            </div>
                        )}
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="bg-white border-4 border-black p-8 rounded-2xl shadow-solid flex flex-col h-[800px]">
                                <div className="flex justify-between items-center mb-8 border-b-4 border-black pb-4">
                                    <h2 className="text-4xl font-bangers text-black uppercase tracking-widest"><i className="ph-bold ph-books text-blue-500"></i> Baza Komiksów</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-black bg-yellow-400 border-4 border-black hover:bg-yellow-300 px-4 py-2 rounded-xl text-xl font-bangers uppercase transition-all active:translate-y-1 shadow-solid-sm"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 font-comic">Komiksy od innych nauczycieli</h3>
                                <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-50 border-4 border-black p-5 rounded-xl hover:bg-yellow-100 transition-colors cursor-pointer group flex flex-col gap-3 shadow-solid-sm active:translate-y-1 active:shadow-none" onClick={() => loadPattern(p)}>
                                            <div className="flex justify-between items-start gap-2">
                                                <span className="text-xl font-black text-black group-hover:text-blue-600 transition-colors line-clamp-2 leading-tight font-comic">{p.name}</span>
                                                <span className="text-xs font-bold px-2 py-1 rounded bg-blue-100 border-2 border-black text-blue-800 whitespace-nowrap font-bangers">{p.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center font-comic font-bold">
                                                <p className="text-xs text-slate-500">Autor: <span className="text-black">{p.userId.substring(0,6)}</span></p>
                                                <p className="text-xs text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="text-center py-10 opacity-50 font-comic">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-400 mx-auto block"></i>
                                            <p className="text-lg text-slate-500 font-bold">Brak komiksów w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Konfigurator
            if (step === 'config') {
                return (
                    <div className="min-h-screen flex flex-col font-sans halftone-bg relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-blue-500 text-white px-6 py-3 rounded-xl font-bold shadow-solid transition-all duration-300 border-2 border-black">
                                {toastMessage}
                            </div>
                        )}

                        <div className="max-w-3xl mx-auto px-4 pt-28 pb-24 flex-grow w-full relative z-10 print-hidden">
                            
                            {/* PANEL LIMITÓW V3 PRO MAX - STYL KOMIKSOWY */}
                            {!isPremium && (
                                <div className="bg-white border-4 border-black p-4 rounded-2xl shadow-solid flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 transform rotate-1">
                                    <div className="flex flex-col font-comic">
                                        <span className="text-sm font-black text-black uppercase tracking-widest">Darmowe użycia: <span className="text-red-500">{Math.max(0, 5 - usageCount)}/5</span></span>
                                        <span className="text-[10px] text-slate-500 font-bold">Wersja Demo</span>
                                    </div>
                                    <div className="flex items-center gap-2 w-full sm:w-auto">
                                        <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod autoryzacji..." className="flex-1 sm:w-40 px-3 py-2 bg-slate-100 border-4 border-black rounded-lg text-sm outline-none text-black font-bold font-comic focus:bg-yellow-50 transition-colors uppercase"/>
                                        <button onClick={handleVerifyCode} className="px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white border-2 border-black rounded-lg text-sm font-bangers tracking-widest transition-all shadow-solid-sm active:translate-y-1 active:shadow-none">OK</button>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-end mb-6">
                                <button onClick={() => setAppMode('gielda')} className="bg-fuchsia-500 border-4 border-black hover:bg-fuchsia-400 text-white px-6 py-3 rounded-xl font-bangers text-xl tracking-widest shadow-solid transition-transform active:translate-y-1 active:shadow-none flex items-center gap-2">
                                    <i className="ph-bold ph-books"></i> Baza Komiksów
                                </button>
                            </div>

                            <div className="text-center mb-10 bg-white border-4 border-black p-8 rounded-2xl shadow-solid relative transform -rotate-1">
                                <div className="absolute -top-6 -right-6 bg-blue-500 text-white font-bangers text-2xl py-2 px-4 border-4 border-black rounded-full rotate-12 shadow-solid-sm">BAM!</div>
                                <h1 className="text-4xl md:text-5xl font-bangers text-black mb-2 tracking-wide">Twórz Komiksy z EduBox AI!</h1>
                                <p className="text-slate-600 font-bold font-comic text-lg">Podaj temat, bohatera lub sytuację, a sztuczna inteligencja wygeneruje 4-kadrowy komiks do wydruku.</p>
                            </div>

                            <div className="bg-white p-8 rounded-2xl shadow-solid border-4 border-black space-y-6">
                                <div>
                                    <label className="text-sm font-black text-black uppercase block mb-2 font-comic">1. Temat lub Morał (o czym ma być komiks?)</label>
                                    <input type="text" value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Tomek uczy się, dlaczego warto myć zęby..." className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl text-lg font-bold outline-none text-black focus:bg-yellow-50 transition-colors font-comic" />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">2. Wiek odbiorców</label>
                                        <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Przedszkole</option><option>Klasy 1-3</option><option>Klasy 4-6</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">3. Styl rysunku</label>
                                        <select value={artStyle} onChange={e => setArtStyle(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Bajkowe 3D (Disney)</option>
                                            <option>Klasyczny Komiks</option>
                                            <option>Manga / Anime</option>
                                            <option>Kredki / Szkic</option>
                                        </select>
                                    </div>
                                </div>

                                <button onClick={handleGenerateComic} className="w-full mt-4 bg-yellow-400 hover:bg-yellow-300 text-black py-5 rounded-xl font-bangers text-3xl tracking-widest border-4 border-black shadow-solid transition-transform active:translate-y-2 active:shadow-none flex justify-center items-center gap-3">
                                    <i className="ph-fill ph-lightning"></i> Rysuj Komiks! {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Loading
            if (step === 'generating') {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col text-center px-4 bg-yellow-400 halftone-bg text-black print-hidden">
                        <div className="bg-white border-4 border-black p-10 rounded-3xl shadow-solid flex flex-col items-center max-w-md w-full transform rotate-1">
                            <i className="ph-fill ph-palette animate-bounce text-7xl text-blue-500 mb-4 drop-shadow-md"></i>
                            <h2 className="text-4xl font-bangers tracking-widest mb-2">Praca wre!</h2>
                            <p className="font-comic font-bold text-slate-600 mb-6">{loadingStatus}</p>
                            
                            <div className="w-full h-6 bg-slate-200 border-4 border-black rounded-full overflow-hidden relative">
                                <div className="h-full bg-blue-500 transition-all duration-300 flex items-center justify-end px-2" style={{ width: `${loadingProgress}%` }}>
                                    <div className="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Podgląd i Wydruk
            if (step === 'review') {
                return (
                    <div className="min-h-screen flex flex-col halftone-bg text-slate-900 bg-slate-100">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[9999] bg-green-500 text-white px-6 py-3 border-4 border-black rounded-xl font-bold shadow-solid-sm font-comic print-hidden">
                                {toastMessage}
                            </div>
                        )}
                        
                        <nav className="bg-white border-b-4 border-black min-h-16 flex flex-col md:flex-row items-center justify-between px-6 py-4 shadow-sm print-hidden sticky top-0 z-50 gap-4">
                            <h1 className="text-2xl font-bangers tracking-wide text-black mt-1"><i className="ph-fill ph-check-circle text-green-500"></i> Komiks Gotowy!</h1>
                            <div className="flex flex-wrap justify-center gap-3">
                                <button onClick={sharePattern} className="bg-fuchsia-500 hover:bg-fuchsia-400 text-white border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic flex items-center gap-2 shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">
                                    <i className="ph-bold ph-cloud-arrow-up text-lg"></i> Do Bazy
                                </button>
                                <button onClick={() => window.print()} className="bg-yellow-400 hover:bg-yellow-300 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic flex items-center gap-2 shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">
                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj
                                </button>
                                <button onClick={() => setStep('config')} className="bg-white hover:bg-slate-100 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">
                                    Nowy Komiks
                                </button>
                            </div>
                        </nav>

                        <div className="flex-1 p-4 md:p-8 flex justify-center print:p-0">
                            {/* KONTENER A4 DO DRUKU */}
                            <div className="print-area bg-white border-4 border-black shadow-solid p-6 md:p-10 w-full max-w-4xl mx-auto rounded-xl">
                                
                                <h1 className="text-4xl md:text-6xl font-bangers text-center text-black mb-8 uppercase tracking-wider drop-shadow-sm border-b-4 border-black pb-4">
                                    {comicData.title}
                                </h1>

                                {/* SIATKA 2x2 KOMIKSU */}
                                <div className="comic-grid grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900 p-4 md:p-6 rounded-xl border-4 border-black">
                                    {comicData.panels.map((panel, idx) => (
                                        <div key={idx} className="comic-panel group">
                                            
                                            {/* Narrator */}
                                            {panel.narration && (
                                                <div className="narration-bar">
                                                    {panel.narration}
                                                </div>
                                            )}

                                            {/* Kontener na obrazek i dymek */}
                                            <div className="relative flex-1 bg-slate-200 overflow-hidden flex items-center justify-center min-h-[300px]">
                                                {/* Obrazek w tle */}
                                                {panel.imageUrl ? (
                                                    <img src={panel.imageUrl} className="absolute inset-0 w-full h-full object-cover z-0" />
                                                ) : (
                                                    <span className="relative z-0 font-comic font-bold text-slate-400">Brak obrazka</span>
                                                )}

                                                {/* Dymek z dialogiem */}
                                                {panel.dialogue && (
                                                    <div className="comic-bubble">
                                                        {panel.dialogue}
                                                        <div className="bubble-tail-border"></div>
                                                        <div className="bubble-tail"></div>
                                                    </div>
                                                )}

                                                {/* Numer Kadru */}
                                                <div className="absolute bottom-3 right-3 bg-black text-white border-2 border-white font-bangers w-8 h-8 flex items-center justify-center rounded-full text-base z-30 shadow-md">
                                                    {idx + 1}
                                                </div>

                                                {/* PRZYCISK REGENERACJI */}
                                                <button 
                                                    onClick={() => handleRegeneratePanel(idx)} 
                                                    disabled={regeneratingIndex !== null}
                                                    className={`print-hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-500 border-4 border-black text-white font-bangers px-4 py-2 text-xl rounded shadow-solid transition-opacity z-[100] hover:bg-blue-400 ${regeneratingIndex === idx ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                                                >
                                                    {regeneratingIndex === idx ? (
                                                        <><i className="ph-bold ph-spinner animate-spin mr-1"></i> Rysuję...</>
                                                    ) : (
                                                        <><i className="ph-bold ph-arrows-clockwise mr-1"></i> Przerysuj Kadr</>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-6 text-right font-comic font-bold text-sm text-slate-500 uppercase tracking-widest">
                                    Stworzono w EduBox AI
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
