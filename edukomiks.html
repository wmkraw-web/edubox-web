<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduKomiks AI v3 - Stabilna Wersja</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Outfit', sans-serif; min-height: 100vh; }
        .halftone-bg { background-image: radial-gradient(#334155 1.5px, transparent 1.5px); background-size: 12px 12px; }
        .shadow-solid { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        .shadow-solid-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        
        /* Poprawka dymków - teraz tekst MUSI być widoczny */
        .comic-bubble-fixed {
            background-color: white !important;
            color: black !important;
            border: 4px solid black !important;
            border-radius: 24px;
            padding: 12px 16px;
            font-family: 'Comic Neue', cursive;
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.1));
        }

        .bubble-tail { 
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 24px; background: white; 
            clip-path: polygon(0 0, 100% 0, 50% 100%); border: none; z-index: 10;
        }
        .bubble-tail-border {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            width: 34px; height: 30px; background: black;
            clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 9;
        }

        @media print { .no-print { display: none !important; } .print-area { width: 100% !important; background: white !important; padding: 0 !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [topic, setTopic] = useState('');
            const [step, setStep] = useState('config');
            const [comicData, setComicData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState(0);

            const generateComic = async () => {
                if (!topic.trim()) return;
                setStep('generating');
                setLoading(true);
                setProgress(10);
                
                try {
                    // System Prompt v3 - Bardziej rygorystyczny
                    const systemPrompt = `Jesteś ilustratorem komiksów edukacyjnych. Twoim zadaniem jest stworzenie 4 kadrowej historii.
                    BOHATEROWIE:
                    - Główny bohater to Jasiu: 7-letni chłopiec, krótkie ciemne włosy, ZIELONA KOSZULKA (zawsze!).
                    - Pies: Mały złoty szczeniak Golden Retriever.
                    
                    ZASADY OBRAZÓW (imagePrompt):
                    1. Opisuj kadr bardzo prosto. NIE używaj luster ani skomplikowanych odbić.
                    2. Zawsze pisz: "One boy (Jasiu) and one dog". Nigdy więcej postaci.
                    3. Styl: "Vibrant flat vector illustration, clean bold lines, comic book style, high contrast".
                    4. ZERO tekstu na grafice.
                    
                    Zwróć JSON:
                    {
                        "title": "Tytuł (max 3 słowa)",
                        "panels": [
                            {"narration": "tekst żółty", "dialogue": "tekst w dymku", "imagePrompt": "Description in English"}
                        ]
                    }`;

                    const resChat = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: `Temat: ${topic}. Pamiętaj o zielonej koszulce Jasia i jednym psie.`, 
                            system: systemPrompt, 
                            format: "json", 
                            model: "gpt-4o-mini" 
                        })
                    });
                    
                    const dataChat = await resChat.json();
                    let comicObj = JSON.parse(dataChat.text.match(/\{[\s\S]*\}/)[0]);

                    for (let i = 0; i < comicObj.panels.length; i++) {
                        setProgress(20 + (i * 20));
                        const finalPrompt = `${comicObj.panels[i].imagePrompt}. High quality vector art, cel shaded, clean bold outlines, flat colors, masterpiece. NO REFLECTIONS, NO MIRRORS, ONLY ONE BOY, ONLY ONE DOG.`;

                        const responseImg = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                prompt: finalPrompt,
                                negative_prompt: "text, words, blurry, mirror, reflection, two boys, two dogs, clones, extra limbs, ugly, messy lines, watermark",
                                aspect_ratio: '1:1'
                            })
                        });
                        
                        const dataImg = await responseImg.json();
                        comicObj.panels[i].imageUrl = dataImg.imageUrl || dataImg.url || (dataImg.data && dataImg.data[0]?.url);
                    }

                    setComicData(comicObj);
                    setStep('review');
                } catch (e) {
                    alert('Błąd! Spróbuj ponownie.');
                    setStep('config');
                } finally { setLoading(false); }
            };

            if (step === 'config') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 halftone-bg">
                        <div className="bg-white p-10 rounded-3xl shadow-solid border-4 border-black w-full max-w-lg">
                            <h1 className="text-5xl font-bangers text-black text-center mb-8 tracking-wide">EduKomiks <span className="text-red-500">PRO</span></h1>
                            <div className="space-y-6">
                                <div>
                                    <label className="block font-black text-black uppercase text-sm mb-2">O czym ma być komiks?</label>
                                    <input type="text" value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Jasiu uczy psa jak segregować papier" className="w-full p-4 border-4 border-black rounded-xl font-bold text-black outline-none focus:bg-yellow-50" />
                                </div>
                                <button onClick={generateComic} className="w-full bg-yellow-400 hover:bg-yellow-300 text-black py-5 rounded-xl font-bangers text-3xl border-4 border-black shadow-solid transition-transform active:translate-y-2">
                                    RYSUJ KOMIKS!
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'generating') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-red-500 halftone-bg p-6 text-white">
                        <div className="text-center bg-white border-4 border-black p-10 rounded-3xl shadow-solid text-black max-w-sm w-full">
                            <div className="w-20 h-20 bg-amber-400 border-4 border-black rounded-full flex items-center justify-center mx-auto mb-4 animate-spin">
                                <i className="ph-fill ph-pencil-line text-4xl"></i>
                            </div>
                            <h2 className="text-3xl font-bangers mb-2">PRODUKCJA...</h2>
                            <div className="w-full h-6 bg-slate-100 border-4 border-black rounded-full overflow-hidden">
                                <div className="h-full bg-blue-500 transition-all duration-500" style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'review') {
                return (
                    <div className="min-h-screen p-4 md:p-8 bg-slate-900 overflow-y-auto">
                        <div className="max-w-4xl mx-auto bg-white border-4 border-black shadow-solid p-6 md:p-10 print-area rounded-xl">
                            <h1 className="text-5xl font-bangers text-center text-black mb-10 border-b-8 border-black pb-4 uppercase tracking-widest">{comicData.title}</h1>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 bg-black p-4 rounded-xl border-4 border-black">
                                {comicData.panels.map((panel, idx) => (
                                    <div key={idx} className="relative bg-white aspect-square border-4 border-black overflow-hidden flex flex-col group">
                                        <img src={panel.imageUrl} className="absolute inset-0 w-full h-full object-cover" alt="panel" />
                                        
                                        {/* Narracja - Żółty pasek */}
                                        <div className="relative z-10 w-full bg-yellow-300 border-b-4 border-black p-3 font-bold text-sm text-black">
                                            {panel.narration}
                                        </div>

                                        {/* DYMEK - TERAZ ZAWSZE CZYTELNY */}
                                        {panel.dialogue && (
                                            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 w-[85%] z-20">
                                                <div className="comic-bubble-fixed relative">
                                                    {panel.dialogue}
                                                    <div className="bubble-tail-border"></div>
                                                    <div className="bubble-tail"></div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Numer kadru */}
                                        <div className="absolute bottom-2 right-2 bg-black text-white font-bangers w-8 h-8 flex items-center justify-center rounded-full text-lg z-30">
                                            {idx + 1}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-10 flex gap-4 no-print">
                                <button onClick={() => window.print()} className="flex-1 bg-green-500 hover:bg-green-400 text-white font-bangers text-3xl py-4 rounded-xl border-4 border-black shadow-solid-sm active:translate-y-1">DRUKUJ (PDF)</button>
                                <button onClick={() => setStep('config')} className="flex-1 bg-white hover:bg-slate-100 text-black font-bangers text-3xl py-4 rounded-xl border-4 border-black shadow-solid-sm active:translate-y-1">NOWY KOMIKS</button>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
