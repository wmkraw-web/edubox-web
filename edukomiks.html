<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>EduKomiks AI - EduBox PRO</title>
    
    <!-- Wymuszenie HTTPS -->
    <script>
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3RQ9R0N0K8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3RQ9R0N0K8');
    </script>

    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Fonty Komiksowe -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        comic: ['"Comic Neue"', 'cursive'],
                        bangers: ['Bangers', 'cursive']
                    },
                    colors: { slate: { 950: '#020617' } },
                    boxShadow: {
                        'solid': '6px 6px 0px 0px rgba(0,0,0,1)',
                        'solid-sm': '3px 3px 0px 0px rgba(0,0,0,1)'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(234, 179, 8, 0.15) 0px, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.15) 0px, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .halftone-bg {
            background-image: radial-gradient(#334155 2px, transparent 2px);
            background-size: 10px 10px;
        }

        .comic-border { border: 4px solid #000; }
        
        .bubble-tail {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: white;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border: none;
            z-index: 10;
        }
        .bubble-tail-border {
            position: absolute;
            bottom: -21px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 24px;
            background: #000;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 9;
        }

        /* Druk */
        @media print {
            body { background: white; color: black; background-image: none; }
            .no-print { display: none !important; }
            .print-area { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; border: none !important; box-shadow: none !important; background: white !important;}
            .comic-grid { gap: 10px !important; }
            .comic-panel { border-width: 3px !important; border-color: black !important; break-inside: avoid; }
            .comic-narration { border-bottom-width: 3px !important; border-color: black !important; }
            .comic-bubble { border-width: 3px !important; border-color: black !important; box-shadow: none !important; }
            @page { margin: 1cm; size: A4 portrait; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Freemium State
            const [isPremium, setIsPremium] = useState(false);
            const [usagesLeft, setUsagesLeft] = useState(2);
            const [showPremiumModal, setShowPremiumModal] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            // Generator State
            const [topic, setTopic] = useState('');
            const [ageGroup, setAgeGroup] = useState('Klasy 1-3');
            const [artStyle, setArtStyle] = useState('Klasyczny Komiks');
            
            const [step, setStep] = useState('config'); // config, generating, review
            const [comicData, setComicData] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('');
            const [loadingProgress, setLoadingProgress] = useState(0);

            // Ref for printing
            const printRef = useRef(null);

            useEffect(() => {
                const premiumStatus = localStorage.getItem('edubox_premium_unlocked');
                const storedUsages = localStorage.getItem('edukomiks_usages');
                if (premiumStatus === 'true') setIsPremium(true);
                else {
                    if (storedUsages !== null) setUsagesLeft(parseInt(storedUsages, 10));
                    else localStorage.setItem('edukomiks_usages', '2');
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const handleVerifyCode = (e) => {
                e?.preventDefault();
                if (accessCode.trim().toUpperCase() === 'KAWA2024') { 
                    localStorage.setItem('edubox_premium_unlocked', 'true');
                    setIsPremium(true); setShowPremiumModal(false); setAccessCode(''); 
                    showToast('Odblokowano Premium! 🌟'); 
                } else { showToast('Błędny kod dostępu!'); }
            };

            const translateStyle = (styleName) => {
                switch(styleName) {
                    case 'Klasyczny Komiks': return 'classic Marvel DC comic book style, pop art, vibrant colors, dynamic lines';
                    case 'Manga / Anime': return 'Japanese manga anime style, Studio Ghibli, highly detailed, beautiful lighting';
                    case 'Bajkowe 3D': return 'cute 3D Pixar Disney style render, adorable, flawless';
                    case 'Kredki / Szkic': return 'hand drawn crayon sketch, children book illustration, soft, artistic';
                    default: return 'comic book style';
                }
            };

            // ETAP 1 & 2: GENEROWANIE ŁAŃCUCHOWE
            const generateComic = async () => {
                if (!isPremium && usagesLeft <= 0) return setShowPremiumModal(true);
                if (!topic.trim()) return showToast('Wpisz temat lub morał komiksu!');

                setStep('generating');
                setLoadingStatus('1/2 Wymyślam scenariusz i dialogi...');
                setLoadingProgress(10);
                
                try {
                    // 1. SCENARIUSZ Z GPT-4o-mini
                    const systemPrompt = `Jesteś genialnym scenarzystą komiksów edukacyjnych. Twoim zadaniem jest napisanie krótkiej, 4-kadrowej historii z morałem/wiedzą.
                    
                    Zwróć WYŁĄCZNIE poprawny JSON o strukturze:
                    {
                        "title": "Chwytliwy tytuł (max 4 słowa)",
                        "panels": [
                            {
                                "narration": "Tekst w żółtej ramce u góry (opis sytuacji, krótki).",
                                "dialogue": "To co mówi postać w dymku (krótko, max 2 zdania). Jeśli brak, zostaw puste.",
                                "imagePrompt": "Szczegółowy opis obrazka po ANGIELSKU dla AI. Format kwadratowy. WAŻNE: Całkowity zakaz dodawania tekstu na obrazku (ABSOLUTELY NO TEXT, no speech bubbles). Tylko wizualny opis postaci i tła. Jeśli są ludzie: Caucasian/European."
                            },
                            ... (dokładnie 4 takie obiekty)
                        ]
                    }`;

                    const userPrompt = `Temat / Morał: ${topic}. Wiek odbiorców: ${ageGroup}. Zbuduj historię, w której jest jakiś bohater/bohaterowie (zwierzęta lub ludzie).`;

                    const resChat = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.7, model: "gpt-4o-mini" })
                    });
                    
                    if (!resChat.ok) throw new Error("Błąd podczas tworzenia scenariusza");
                    const dataChat = await resChat.json();
                    
                    let jsonStr = dataChat.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('{') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                    let comicObj = JSON.parse(jsonStr);

                    // 2. GENEROWANIE OBRAZÓW WE FLUXIE
                    setLoadingStatus('2/2 Rysuję kadry komiksu we Fluxie...');
                    const engStyle = translateStyle(artStyle);
                    
                    for (let i = 0; i < comicObj.panels.length; i++) {
                        setLoadingProgress(25 + (i * 18)); // Płynny pasek postępu
                        
                        const fullPrompt = `${comicObj.panels[i].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Only visuals. Perfect human anatomy if people are present.`;

                        const responseImg = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                prompt: fullPrompt,
                                negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy, bad hands, extra limbs",
                                aspect_ratio: '1:1', // Kwadraty najlepiej pasują do siatki komiksu
                                size: '1024x1024',
                                width: 1024,
                                height: 1024
                            })
                        });
                        
                        if (responseImg.ok) {
                            const dataImg = await responseImg.json();
                            let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                            if (imgUrl) {
                                if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                    imgUrl = `data:image/png;base64,${imgUrl}`;
                                }
                                comicObj.panels[i].imageUrl = imgUrl;
                            }
                        }
                    }

                    setComicData(comicObj);
                    setLoadingProgress(100);
                    
                    if (!isPremium) {
                        const newUsages = usagesLeft - 1;
                        setUsagesLeft(newUsages);
                        localStorage.setItem('edukomiks_usages', newUsages.toString());
                    }

                    setTimeout(() => setStep('review'), 500);

                } catch (error) {
                    console.error("Błąd generatora komiksu:", error);
                    showToast('Wystąpił błąd! Serwery są przeciążone. Spróbuj ponownie.');
                    setStep('config');
                }
            };

            // REGENERACJA JEDNEGO KADRU (Gdyby Flux zmutował obrazek)
            const regeneratePanel = async (index) => {
                showToast("Odświeżam ten kadr...");
                try {
                    const engStyle = translateStyle(artStyle);
                    const fullPrompt = `${comicData.panels[index].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO SPEECH BUBBLES. Only visuals.`;

                    const responseImg = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: fullPrompt,
                            negative_prompt: "text, words, speech bubbles, mutated, bad anatomy",
                            aspect_ratio: '1:1',
                            size: '1024x1024',
                            width: 1024,
                            height: 1024
                        })
                    });
                    
                    if (responseImg.ok) {
                        const dataImg = await responseImg.json();
                        let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                        if (imgUrl) {
                            if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                imgUrl = `data:image/png;base64,${imgUrl}`;
                            }
                            const newData = {...comicData};
                            newData.panels[index].imageUrl = imgUrl;
                            setComicData(newData);
                            showToast("Gotowe! Nowy rysunek załadowany.");
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Błąd przy odświeżaniu obrazka.");
                }
            };

            // DEMO DATA
            const loadDemo = () => {
                setComicData({
                    title: "Przygoda z Ułamkami",
                    panels: [
                        { narration: "Był piękny, słoneczny dzień. Tomek dostał na urodziny ogromną pizzę.", dialogue: "Ale super! Zjem całą sam!", imageUrl: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=800&auto=format&fit=crop" },
                        { narration: "Nagle pojawili się jego trzej najlepsi przyjaciele.", dialogue: "Cześć Tomek! Podzielisz się z nami?", imageUrl: "https://images.unsplash.com/photo-1604147495798-57beb5d6af73?q=80&w=800&auto=format&fit=crop" },
                        { narration: "Tomek musiał użyć ułamków, by sprawiedliwie rozdzielić pizzę na 4 równe części.", dialogue: "Każdy z nas dostanie jedną czwartą! To ułamek 1/4.", imageUrl: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=800&auto=format&fit=crop" },
                        { narration: "Przyjaciele wspólnie cieszyli się posiłkiem. Nauka ułamków jest pyszna!", dialogue: "Matematyka jeszcze nigdy nie była tak smaczna!", imageUrl: "https://images.unsplash.com/photo-1544982503-9f984c14501a?q=80&w=800&auto=format&fit=crop" }
                    ]
                });
                setStep('review');
            };

            // RENDER: Konfigurator
            if (step === 'config') {
                return (
                    <div className="min-h-screen flex flex-col font-sans halftone-bg relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-amber-500 text-black px-6 py-3 rounded-xl font-bold shadow-solid transition-all duration-300">
                                {toastMessage}
                            </div>
                        )}

                        <nav className="fixed top-0 w-full z-[100] bg-white border-b-4 border-black h-20 shadow-sm">
                            <div className="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                    <div className="w-10 h-10 bg-amber-400 border-2 border-black flex items-center justify-center shadow-solid-sm rounded">
                                        <i className="ph-bold ph-chats-circle text-black text-2xl"></i>
                                    </div>
                                    <span className="text-2xl font-bangers tracking-wider text-black mt-1">EduKomiks <span className="text-red-600">AI</span></span>
                                </div>
                                <div className="flex items-center gap-4">
                                    {!isPremium && (
                                        <div className="text-sm px-4 py-2 bg-amber-100 border-2 border-black font-bold text-black rounded flex items-center gap-2">
                                            <i className="ph-fill ph-lightning text-amber-500"></i>
                                            <span className="hidden sm:inline">Darmowe pule:</span><strong>{usagesLeft}</strong>
                                        </div>
                                    )}
                                    <a href="index.html" className="flex items-center gap-2 text-black hover:bg-slate-100 transition-colors text-sm font-bold bg-white px-4 py-2 border-2 border-black rounded shadow-solid-sm">
                                        <i className="ph-bold ph-arrow-left"></i> <span className="hidden sm:inline">Portfolio</span>
                                    </a>
                                </div>
                            </div>
                        </nav>

                        <div className="max-w-3xl mx-auto px-4 pt-32 pb-24 flex-grow w-full relative z-10">
                            <div className="text-center mb-10 bg-white border-4 border-black p-8 rounded-2xl shadow-solid relative transform -rotate-1">
                                <div className="absolute -top-6 -right-6 bg-red-500 text-white font-bangers text-2xl py-2 px-4 border-4 border-black rounded-full rotate-12 shadow-solid-sm">BAM!</div>
                                <h1 className="text-4xl md:text-5xl font-bangers text-black mb-2 tracking-wide">Twórz Komiksy z EduBox AI!</h1>
                                <p className="text-slate-600 font-bold font-comic text-lg">Podaj temat lekcji, a sztuczna inteligencja wygeneruje 4-kadrowy komiks edukacyjny do wydruku.</p>
                            </div>

                            <div className="bg-white p-8 rounded-2xl shadow-solid border-4 border-black space-y-6">
                                <div>
                                    <label className="text-sm font-black text-black uppercase block mb-2 font-comic">1. Temat lub Morał (o czym ma być komiks?)</label>
                                    <input type="text" value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Kasia uczy się segregować śmieci..." className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl text-lg font-bold outline-none text-black focus:bg-yellow-50 transition-colors font-comic" />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">2. Wiek odbiorców</label>
                                        <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Przedszkole</option><option>Klasy 1-3</option><option>Klasy 4-6</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm font-black text-black uppercase block mb-2 font-comic">3. Styl rysunku</label>
                                        <select value={artStyle} onChange={e => setArtStyle(e.target.value)} className="w-full p-4 bg-slate-50 border-4 border-black rounded-xl outline-none text-black font-bold focus:bg-yellow-50 font-comic cursor-pointer">
                                            <option>Klasyczny Komiks</option>
                                            <option>Manga / Anime</option>
                                            <option>Bajkowe 3D</option>
                                            <option>Kredki / Szkic</option>
                                        </select>
                                    </div>
                                </div>

                                <button onClick={generateComic} className="w-full mt-4 bg-yellow-400 hover:bg-yellow-300 text-black py-5 rounded-xl font-bangers text-3xl tracking-widest border-4 border-black shadow-solid transition-transform active:translate-y-2 active:shadow-none flex justify-center items-center gap-3">
                                    <i className="ph-fill ph-lightning"></i> Rysuj Komiks!
                                </button>
                                
                                {!isPremium && usagesLeft <= 0 && (
                                    <p className="text-center text-sm text-red-600 font-bold mt-2 cursor-pointer hover:underline font-comic" onClick={() => setShowPremiumModal(true)}>
                                        Wyczerpano darmowe próby. Kliknij, aby odblokować.
                                    </p>
                                )}
                            </div>
                            
                            <div className="mt-8 text-center">
                                <button onClick={loadDemo} className="font-bold text-slate-500 hover:text-white bg-slate-800 px-4 py-2 rounded-lg border-2 border-slate-700 transition-colors">Załaduj Demo: Przygoda z ułamkami</button>
                            </div>
                        </div>

                        {/* Paywall */}
                        {showPremiumModal && (
                            <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                                <div className="bg-white p-8 rounded-2xl border-4 border-black max-w-md w-full text-center shadow-solid relative transform rotate-1">
                                    <h3 className="text-3xl font-bangers text-black mb-2 tracking-wide">Konto Premium</h3>
                                    <p className="text-sm text-slate-600 mb-6 font-bold font-comic">Wyczerpałeś darmowe próby rysowania. Wpisz kod KAWA2024, aby tworzyć komiksy bez limitu!</p>
                                    <input type="text" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Wpisz kod..." className="w-full bg-slate-50 border-4 border-black rounded-xl px-4 py-3 text-center text-xl font-black text-black mb-4 outline-none focus:bg-yellow-50 uppercase tracking-widest font-comic" />
                                    <button onClick={handleVerifyCode} className="w-full bg-amber-400 text-black font-bangers tracking-widest text-2xl border-4 border-black py-3 rounded-xl shadow-solid-sm active:translate-y-1 active:shadow-none transition-transform">Aktywuj</button>
                                    <button onClick={() => setShowPremiumModal(false)} className="mt-4 text-xs font-bold text-slate-400 font-comic uppercase">Anuluj</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // RENDER: Loading
            if (step === 'generating') {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col text-center px-4 bg-amber-400 halftone-bg text-black">
                        <div className="bg-white border-4 border-black p-10 rounded-3xl shadow-solid flex flex-col items-center max-w-md w-full">
                            <i className="ph-fill ph-palette animate-bounce text-7xl text-red-500 mb-4 drop-shadow-md"></i>
                            <h2 className="text-3xl font-bangers tracking-widest mb-2">Praca wre!</h2>
                            <p className="font-comic font-bold text-slate-600 mb-6">{loadingStatus}</p>
                            
                            <div className="w-full h-6 bg-slate-200 border-4 border-black rounded-full overflow-hidden relative">
                                <div className="h-full bg-red-500 transition-all duration-300 flex items-center justify-end px-2" style={{ width: `${loadingProgress}%` }}>
                                    <div className="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Podgląd i Wydruk Komiksu
            if (step === 'review') {
                return (
                    <div className="min-h-screen flex flex-col halftone-bg text-slate-900 bg-slate-100">
                        {toastMessage && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-green-500 text-white px-6 py-3 border-4 border-black rounded-xl font-bold shadow-solid-sm font-comic">
                                {toastMessage}
                            </div>
                        )}
                        
                        <nav className="bg-white border-b-4 border-black h-16 flex items-center justify-between px-6 shadow-sm no-print sticky top-0 z-50">
                            <h1 className="text-2xl font-bangers tracking-wide text-black mt-1"><i className="ph-fill ph-check-circle text-green-500"></i> Komiks Gotowy!</h1>
                            <div className="flex gap-3">
                                <button onClick={() => window.print()} className="bg-amber-400 hover:bg-amber-300 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic flex items-center gap-2 shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">
                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj / PDF
                                </button>
                                <button onClick={() => setStep('config')} className="bg-white hover:bg-slate-100 text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold font-comic shadow-solid-sm active:translate-y-1 active:shadow-none transition-all">Nowy Komiks</button>
                            </div>
                        </nav>

                        <div className="flex-1 p-4 md:p-8 flex justify-center">
                            {/* KONTENER A4 DO DRUKU */}
                            <div ref={printRef} className="print-area bg-white border-4 border-black shadow-solid p-6 md:p-10 w-full max-w-4xl mx-auto rounded-xl">
                                
                                <h1 className="text-4xl md:text-6xl font-bangers text-center text-black mb-8 uppercase tracking-wider drop-shadow-sm border-b-4 border-black pb-4">
                                    {comicData.title}
                                </h1>

                                {/* SIATKA 2x2 KOMIKSU */}
                                <div className="comic-grid grid grid-cols-1 md:grid-cols-2 gap-6 bg-black p-4 md:p-6 rounded-xl border-4 border-black">
                                    {comicData.panels.map((panel, idx) => (
                                        <div key={idx} className="comic-panel relative bg-white aspect-square border-4 border-black overflow-hidden flex flex-col group">
                                            
                                            {/* Obrazek w tle */}
                                            {panel.imageUrl ? (
                                                <img src={panel.imageUrl} className="absolute inset-0 w-full h-full object-cover z-0" />
                                            ) : (
                                                <div className="absolute inset-0 bg-slate-200 flex items-center justify-center font-comic font-bold text-slate-400">Brak obrazka</div>
                                            )}

                                            {/* Narrator (Górna żółta belka) */}
                                            {panel.narration && (
                                                <div className="comic-narration relative z-10 w-full bg-yellow-300 border-b-4 border-black p-3 font-comic font-bold text-[14px] md:text-sm leading-tight text-black shadow-sm">
                                                    {panel.narration}
                                                </div>
                                            )}

                                            {/* Dymek z dialogiem */}
                                            {panel.dialogue && (
                                                <div className="comic-bubble absolute bottom-6 left-1/2 -translate-x-1/2 bg-white border-4 border-black rounded-3xl p-3 md:p-4 max-w-[85%] text-center font-comic font-black text-sm md:text-base leading-snug shadow-solid z-20 break-words">
                                                    {panel.dialogue}
                                                    {/* Ogonki dymka */}
                                                    <div className="bubble-tail-border"></div>
                                                    <div className="bubble-tail"></div>
                                                </div>
                                            )}

                                            {/* Numer Kadru */}
                                            <div className="absolute bottom-2 right-2 bg-black text-white font-bangers w-6 h-6 flex items-center justify-center rounded-full text-sm z-30 opacity-70">
                                                {idx + 1}
                                            </div>

                                            {/* Przycisk regeneracji (Ukryty w druku, widoczny na hover) */}
                                            <button 
                                                onClick={() => regeneratePanel(idx)} 
                                                className="no-print absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-amber-400 border-4 border-black text-black font-bangers px-4 py-2 text-xl rounded shadow-solid opacity-0 group-hover:opacity-100 transition-opacity z-50 hover:bg-amber-300"
                                            >
                                                <i className="ph-bold ph-arrows-clockwise mr-1"></i> Przerysuj
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-6 text-right font-comic font-bold text-sm text-slate-500 uppercase">
                                    Wygenerowano w EduBox AI
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
