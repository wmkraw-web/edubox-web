    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FACT_PLACEHOLDERS = [
            'np. Przeczytaliśmy razem 12 książek',
            'np. Wygraliśmy konkurs recytatorski',
            'np. Nauczyliśmy się liczyć do 100 po angielsku',
            'np. Zorganizowaliśmy kiermasz charytatywny',
            'np. Zwiedziliśmy 3 muzea'
        ];

        // Typ podsumowania - steruje odznaką na starcie wideo, etykietą kart oraz kontekstem
        // przekazywanym do AI (żeby "Wrapped" pasował do wycieczki tak samo dobrze jak do roku).
        const EVENT_TYPES = [
            { id: 'rok', label: 'Rok szkolny', badge: '🎬 PODSUMOWANIE ROKU', aiLabel: 'cały rok szkolny klasy', momentLabel: 'MOMENT' },
            { id: 'semestr', label: 'Semestr', badge: '🎬 PODSUMOWANIE SEMESTRU', aiLabel: 'semestr klasy', momentLabel: 'MOMENT' },
            { id: 'wycieczka', label: 'Wycieczka / wyjście', badge: '🧭 PODSUMOWANIE WYCIECZKI', aiLabel: 'wycieczkę lub wyjście klasowe', momentLabel: 'PRZYSTANEK' },
            { id: 'projekt', label: 'Projekt / akcja', badge: '🚀 PODSUMOWANIE PROJEKTU', aiLabel: 'projekt lub akcję szkolną', momentLabel: 'ETAP' },
            { id: 'konkurs', label: 'Konkurs / wydarzenie', badge: '🏆 PODSUMOWANIE WYDARZENIA', aiLabel: 'konkurs lub jednorazowe wydarzenie', momentLabel: 'HIGHLIGHT' },
            { id: 'inne', label: 'Inny temat', badge: '✨ NASZE PODSUMOWANIE', aiLabel: 'dowolne wydarzenie opisane przez nauczyciela', momentLabel: 'MOMENT' }
        ];
        const DEFAULT_EVENT_TYPE = 'rok';

        // Grupa wiekowa - wpływa na ton tekstu dobierany przez AI (przedszkole = prościej i cieplej,
        // starsze klasy = można podkreślić dumę z realnych osiągnięć).
        const AGE_GROUPS = [
            { id: 'przedszkole', label: 'Przedszkole', aiHint: 'bardzo proste słowa, dużo ciepła i entuzjazmu, zero trudnych pojęć' },
            { id: 'wczesnoszkolna', label: 'Klasy 1-3', aiHint: 'proste, żywe zdania, entuzjastyczny, ale zrozumiały dla dziecka ton' },
            { id: 'starsza', label: 'Klasy 4-8', aiHint: 'nieco bardziej dojrzały ton, można podkreślić osiągnięcia i dumę z efektów' }
        ];
        const DEFAULT_AGE_GROUP = 'wczesnoszkolna';

        // Cztery gotowe "nastroje" wideo - AI wybiera jeden na podstawie tego, co nauczyciel napisał
        // (typ, wiek, opis + fakty), a nastrój steruje kolorami aur, akcentów kart, tempem animacji
        // ORAZ podkładem muzycznym (ten sam klucz wybiera plik audio). To jest realna personalizacja
        // napędzana przez AI, ale zero ryzyka generowania obrazków - wszystko dalej renderuje się
        // w Canvasie, po prostu innymi paletami/tempem/muzyką.
        const MOOD_THEMES = {
            energetic: { aura: ['251,146,60', '236,72,153', '250,204,21'], accent: ['#FF7A45', '#FFC145', '#FF5DA2'], speed: 1.25, layout: 'corners' },
            cozy: { aura: ['245,158,11', '244,114,182', '168,85,247'], accent: ['#FBBF24', '#FB7185', '#C084FC'], speed: 0.8, layout: 'single' },
            proud: { aura: ['59,130,246', '234,179,8', '124,58,237'], accent: ['#FFD166', '#7B8CFF', '#60A5FA'], speed: 0.85, layout: 'wide' },
            playful: { aura: ['59,130,246', '168,85,247', '16,185,129'], accent: ['#FF5DA2', '#FFC145', '#57E6C4'], speed: 1, layout: 'scatter' }
        };
        const DEFAULT_MOOD = 'playful';

        // Motywy cząsteczek dopasowane do typu wydarzenia - zamiast zawsze tego samego confetti.
        // null = klasyczne, kolorowe prostokąty confetti (dobrze pasują do roku/semestru/"inne").
        // Grupa "Przedszkole" ma PIERWSZEŃSTWO nad typem wydarzenia - zawsze przyjazne, okrągłe motywy.
        const PARTICLE_MOTIFS = {
            rok: null,
            semestr: null,
            wycieczka: ['🧭', '🗺️', '👣', '⭐'],
            projekt: ['🚀', '⚙️', '💡', '✨'],
            konkurs: ['🏆', '⭐', '✨', '🎉'],
            inne: null
        };
        const PRZEDSZKOLE_MOTIFS = ['🎈', '⭐', '🌈', '✨'];
        function resolveMotifs(eventTypeId, ageGroupId) {
            if (ageGroupId === 'przedszkole') return PRZEDSZKOLE_MOTIFS;
            return PARTICLE_MOTIFS[eventTypeId] || null;
        }

        // Krótkie (~22-24s), zapętlalne podkłady muzyczne dobrane do każdego nastroju.
        // Źródło: kolekcja "Free PD" (domena publiczna, bez wymogu podawania autora) -
        // przycięte i znormalizowane głośnościowo lokalnie, żeby zawsze brzmiały spójnie.
        const MUSIC_TRACKS = {
            energetic: 'audio/podsumowanie/energetic.mp3',
            cozy: 'audio/podsumowanie/cozy.mp3',
            proud: 'audio/podsumowanie/proud.mp3',
            playful: 'audio/podsumowanie/playful.mp3'
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            const [eventType, setEventType] = useState(DEFAULT_EVENT_TYPE);
            const [ageGroup, setAgeGroup] = useState(DEFAULT_AGE_GROUP);
            const [className, setClassName] = useState('');
            const [description, setDescription] = useState('');
            const [facts, setFacts] = useState(['', '', '', '', '']);
            const [musicOn, setMusicOn] = useState(true);

            const [stage, setStage] = useState('form');
            const [statusText, setStatusText] = useState('');
            const [progressPct, setProgressPct] = useState(0);
            const [downloadUrl, setDownloadUrl] = useState(null);

            const canvasRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const particlesRef = useRef([]);
            const punchyFactsRef = useRef([]);
            const hookRef = useRef('');
            const closingLineRef = useRef('Dziękujemy za wspólny czas!');
            const iconsRef = useRef([]);
            const themeRef = useRef(MOOD_THEMES[DEFAULT_MOOD]);
            const badgeRef = useRef(EVENT_TYPES[0].badge);
            const momentLabelRef = useRef('MOMENT');
            const factCountRef = useRef(3);
            const moodKeyRef = useRef(DEFAULT_MOOD);
            const motifsRef = useRef(null);

            useEffect(() => {
                const initCore = () => {
                    if (window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                        const status = localStorage.getItem('eduboxProStatus');
                        if (status === 'PRO' || status === 'active') setIsPremium(true);
                    } else { setTimeout(initCore, 100); }
                };
                initCore();
            }, []);

            const showToast = (text) => { setToastMessage(text); setTimeout(() => setToastMessage(null), 4000); };

            const handleVerifyCode = async () => {
                const isValid = await window.EduBoxCore.verifyPremiumCode(accessCode);
                if (isValid) { setIsPremium(true); setAccessCode(''); localStorage.setItem('eduboxProStatus', 'active'); showToast('Kod aktywny! Witamy w Premium 🌟'); }
                else showToast('Nieprawidłowy kod dostępu!');
            };

            function ease(t) { return 1 - Math.pow(1 - t, 3); }
            function easeBounce(t) {
                const n1 = 7.5625, d1 = 2.75;
                if (t < 1 / d1) return n1 * t * t;
                if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
                if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
                return n1 * (t -= 2.625 / d1) * t + 0.984375;
            }

            function initParticles(W, H) {
                // Kolory konfetti dopasowane do wybranego przez AI nastroju wideo
                const particleColors = [...themeRef.current.accent, '#FFFFFF'];
                const motifs = motifsRef.current;
                const arr = [];
                for (let i = 0; i < 40; i++) {
                    const glyph = motifs ? motifs[Math.floor(Math.random() * motifs.length)] : null;
                    arr.push({
                        x: Math.random() * W, y: Math.random() * H,
                        size: glyph ? 16 + Math.random() * 14 : 6 + Math.random() * 10,
                        speed: 1.2 + Math.random() * 2,
                        drift: (Math.random() - 0.5) * 1.4, rot: Math.random() * 7,
                        rotSpeed: (Math.random() - 0.5) * (glyph ? 0.02 : 0.07),
                        color: particleColors[Math.floor(Math.random() * particleColors.length)],
                        glyph
                    });
                }
                particlesRef.current = arr;
            }

            function drawPill(ctx, cx, topY, text, font, padX, padY, bg, fg, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = font;
                const w = ctx.measureText(text).width + padX * 2;
                const h = parseInt(font.match(/(\d+)px/)[1]) + padY * 2;
                ctx.fillStyle = bg;
                const x = cx - w / 2, y = topY;
                const r = h / 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = fg;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, cx, y + h / 2 + 2);
                ctx.restore();
                return h;
            }

            function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '', lines = [];
                for (const w of words) {
                    const test = line + w + ' ';
                    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w + ' '; }
                    else line = test;
                }
                lines.push(line);
                lines.forEach((l, i) => ctx.fillText(l.trim(), x, y + i * lineHeight));
                return lines.length;
            }

            // Mini-bitmapa emoji cząsteczki - generowana RAZ na dany glif (nie na każdą klatkę!),
            // potem tylko przeskalowywana przez drawImage. To samo podejście co cache ziarna filmowego
            // poniżej - unika drogiego, powtarzanego fillText() z kolorowym fontem emoji co klatkę.
            const glyphCanvasCache = {};
            function getGlyphCanvas(glyph) {
                if (glyphCanvasCache[glyph]) return glyphCanvasCache[glyph];
                const size = 64;
                const gc = document.createElement('canvas');
                gc.width = size; gc.height = size;
                const gctx = gc.getContext('2d');
                gctx.font = `${Math.round(size * 0.8)}px sans-serif`;
                gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
                gctx.fillText(glyph, size / 2, size / 2 + 2);
                glyphCanvasCache[glyph] = gc;
                return gc;
            }

            // Ziarno filmowe (grain) - generowane RAZ jako mały kafelek z losowym szumem, potem
            // powtarzane (pattern) na całej klatce z niską przezroczystością. Daje kinowe, "drogie"
            // wykończenie zamiast płaskiego, cyfrowego gradientu.
            let grainPatternCache = null;
            function getGrainPattern(ctx) {
                if (grainPatternCache) return grainPatternCache;
                const tile = document.createElement('canvas');
                tile.width = 140; tile.height = 140;
                const tctx = tile.getContext('2d');
                const imgData = tctx.createImageData(140, 140);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const v = Math.random() * 255;
                    imgData.data[i] = v; imgData.data[i + 1] = v; imgData.data[i + 2] = v;
                    imgData.data[i + 3] = Math.random() * 40;
                }
                tctx.putImageData(imgData, 0, 0);
                grainPatternCache = ctx.createPattern(tile, 'repeat');
                return grainPatternCache;
            }

            // Dzieli tekst na linie (jak wrapText), ale zwraca słowa z ich pozycjami x/y, żeby
            // móc odsłaniać tekst słowo-po-słowie (kinetic typography) zamiast całym blokiem naraz.
            function layoutWords(ctx, text, font, maxWidth, lineHeight) {
                ctx.font = font;
                const spaceW = ctx.measureText(' ').width;
                const words = text.split(' ').filter(Boolean);
                const lines = [[]];
                let lineWidth = 0;
                words.forEach(w => {
                    const ww = ctx.measureText(w).width;
                    if (lineWidth + ww > maxWidth && lines[lines.length - 1].length) {
                        lines.push([]); lineWidth = 0;
                    }
                    lines[lines.length - 1].push({ text: w, w: ww });
                    lineWidth += ww + spaceW;
                });
                const placed = [];
                lines.forEach((line, li) => {
                    const lineW = line.reduce((s, w) => s + w.w, 0) + spaceW * (line.length - 1);
                    let x = -lineW / 2;
                    line.forEach(word => {
                        placed.push({ text: word.text, x: x + word.w / 2, y: li * lineHeight, w: word.w });
                        x += word.w + spaceW;
                    });
                });
                return { words: placed, lineCount: lines.length };
            }

            // Odsłania tekst słowo po słowie (fade + lekkie uniesienie), z przesunięciem czasowym
            // między słowami - dużo bardziej "żywe" niż wspólny fade całej linii naraz.
            function drawKineticText(ctx, text, cx, topY, font, color, progress, maxWidth, lineHeight) {
                const { words } = layoutWords(ctx, text, font, maxWidth, lineHeight);
                const n = Math.max(1, words.length);
                ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
                words.forEach((word, i) => {
                    const wordStart = i / n;
                    const wordEnd = wordStart + (1.6 / n);
                    const wp = Math.max(0, Math.min(1, (progress - wordStart) / (wordEnd - wordStart)));
                    if (wp <= 0) return;
                    const eased = ease(wp);
                    ctx.save();
                    ctx.globalAlpha = eased;
                    ctx.fillStyle = color;
                    ctx.fillText(word.text, cx + word.x, topY + word.y - (1 - eased) * 16);
                    ctx.restore();
                });
            }

            // Oś czasu jest teraz DYNAMICZNA - liczba "momentów" (2 do 5) realnie zmienia długość
            // wideo, zamiast sztywnych 3 kart za każdym razem. Dla factCount=3 daje dokładnie taki
            // sam przebieg jak poprzednia, sztywna wersja.
            function buildTimeline(factCount) {
                const GAP = 200;
                const title = { start: 300, end: 300 + 2900 };
                let cursor = title.end + GAP;
                const facts = [];
                for (let i = 0; i < factCount; i++) {
                    const seg = { start: cursor, end: cursor + 3800 };
                    facts.push(seg);
                    cursor = seg.end + GAP;
                }
                const closing = { start: cursor, end: cursor + 3100 };
                cursor = closing.end + GAP;
                const stars = [0, 1, 2].map(() => { const seg = { start: cursor, end: cursor + 700 }; cursor = seg.end; return seg; });
                return { title, facts, closing, stars, duration: cursor };
            }
            function prog(el, t) { if (t < el.start) return 0; if (t > el.end) return 1; return (t - el.start) / (el.end - el.start); }

            // Kierunek wjazdu karty (na przemian z lewej/prawej/dołu) - działa dla dowolnej liczby
            // kart (2-5), nie tylko dla sztywnych trzech jak poprzednio.
            function slideDir(idx) {
                const seq = [-1, 1, 0, -1, 1];
                return seq[idx % seq.length];
            }

            // Tło: ciemna baza + 3 miękkie, animowane gradientowe "aury" (dokładnie styl .aura-blob
            // z index.html) zamiast wygenerowanej przez AI ilustracji - spójne z resztą portfolio,
            // zawsze eleganckie, zero ryzyka "generycznego" wyglądu AI-clipartu. Same pozycje/tempo
            // za każdym razem, ale KOLORY pochodzą z nastroju wybranego przez AI (themeRef) - to
            // realna personalizacja bez ryzyka generowania obrazków.
            // Kilka układów "aur" do wyboru per nastrój - zamiast zawsze tego samego rozstawienia
            // trzech plam światła. "wide" to oryginalny, przestrzenny układ (proud), "single" to
            // jedna, spokojna duża poświata (cozy), "corners" to żywiołowe naroża (energetic),
            // a "scatter" to nieregularne, zabawowe rozproszenie (playful).
            const AURA_LAYOUTS = {
                wide: [
                    { baseX: 0.18, baseY: 0.15, r: 0.55, speed: 0.00018, phase: 0 },
                    { baseX: 0.82, baseY: 0.35, r: 0.48, speed: 0.00021, phase: 2.1 },
                    { baseX: 0.35, baseY: 0.85, r: 0.62, speed: 0.00015, phase: 4.2 }
                ],
                single: [
                    { baseX: 0.5, baseY: 0.4, r: 0.78, speed: 0.00014, phase: 0 }
                ],
                corners: [
                    { baseX: 0.12, baseY: 0.12, r: 0.5, speed: 0.0002, phase: 0 },
                    { baseX: 0.88, baseY: 0.14, r: 0.5, speed: 0.00019, phase: 1.5 },
                    { baseX: 0.5, baseY: 0.92, r: 0.6, speed: 0.00016, phase: 3 }
                ],
                scatter: [
                    { baseX: 0.25, baseY: 0.22, r: 0.4, speed: 0.00022, phase: 0.5 },
                    { baseX: 0.78, baseY: 0.2, r: 0.35, speed: 0.00025, phase: 2 },
                    { baseX: 0.5, baseY: 0.78, r: 0.5, speed: 0.0002, phase: 3.5 }
                ]
            };

            function renderFrame(ctx, W, H, t, timeline) {
                const theme = themeRef.current;
                ctx.fillStyle = '#0f0a2e';
                ctx.fillRect(0, 0, W, H);

                const auraLayout = AURA_LAYOUTS[theme.layout] || AURA_LAYOUTS.wide;
                auraLayout.forEach((b, i) => {
                    const color = theme.aura[i % theme.aura.length];
                    const spd = b.speed * theme.speed;
                    const drift = 0.04;
                    const x = (b.baseX + Math.sin(t * spd + b.phase) * drift) * W;
                    const y = (b.baseY + Math.cos(t * spd * 0.8 + b.phase) * drift) * H;
                    const r = b.r * W * (0.9 + Math.sin(t * spd * 1.4 + b.phase) * 0.1);
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, `rgba(${color},0.55)`);
                    grad.addColorStop(1, `rgba(${color},0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                });

                particlesRef.current.forEach(p => {
                    p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
                    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    if (p.glyph) {
                        // Rysujemy z RAZ przygotowanej mini-bitmapy (patrz getGlyphCanvas) zamiast
                        // fillText co klatkę - fillText emoji jest kosztowne (własny font, kolorowe
                        // glify) i przy 40 cząsteczkach x 30 kl/s potrafiło realnie "ciąć" nagranie.
                        const gc = getGlyphCanvas(p.glyph);
                        ctx.drawImage(gc, -p.size / 2, -p.size / 2, p.size, p.size);
                    } else {
                        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
                    }
                    ctx.restore();
                });

                // Tytuł - odznaka (dopasowana przez AI do typu wydarzenia) wjeżdża z odbiciem,
                // nazwa/temat i hasło AI odsłaniają się słowo po słowie
                const titleP = prog(timeline.title, t);
                if (titleP > 0) {
                    const s = easeBounce(Math.min(1, titleP * 1.8));
                    ctx.save();
                    ctx.translate(W / 2, H * 0.13);
                    ctx.scale(0.3 + s * 0.7, 0.3 + s * 0.7);
                    drawPill(ctx, 0, -34, badgeRef.current, "800 24px 'Baloo 2'", 20, 12, 'rgba(255,255,255,0.14)', '#FFC145', Math.min(1, s * 1.4));
                    ctx.restore();
                    drawKineticText(ctx, className || 'Nasza klasa', W / 2, H * 0.25, "800 56px 'Baloo 2'", '#FFFFFF', Math.min(1, titleP * 1.4), W * 0.86, 60);
                    // Hasło dopasowane przez AI do treści - startuje odrobinę później niż nazwa
                    const hookP = Math.max(0, Math.min(1, (titleP - 0.25) / 0.7));
                    if (hookP > 0 && hookRef.current) {
                        drawKineticText(ctx, hookRef.current, W / 2, H * 0.33, "700 26px 'Nunito'", theme.accent[0], hookP, W * 0.78, 32);
                    }
                }

                // Szklane karty faktów (2-5, zależnie od tego, ile podał nauczyciel), każda
                // z gigantyczną cyfrą w tle i innym kierunkiem wjazdu.
                timeline.facts.forEach((el, idx) => {
                    const raw = prog(el, t);
                    if (raw <= 0) return;
                    const p = ease(Math.min(1, raw * 3));
                    const cardY = H * 0.55 + (1 - p) * 18;
                    const xOffset = (1 - p) * slideDir(idx) * 90;
                    const alpha = Math.min(1, raw * 4) * (raw > 0.93 ? Math.max(0, (1 - raw) * 14) : 1);
                    const accent = theme.accent[idx % theme.accent.length];

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(xOffset, 0);
                    const cw = W * 0.84, ch = 230, cx = W / 2 - cw / 2;

                    // Karta w stylu "szkła": ciemna, półprzezroczysta, delikatna obwódka + pasek akcentu
                    ctx.beginPath();
                    ctx.moveTo(cx + 28, cardY); ctx.arcTo(cx + cw, cardY, cx + cw, cardY + ch, 28); ctx.arcTo(cx + cw, cardY + ch, cx, cardY + ch, 28); ctx.arcTo(cx, cardY + ch, cx, cardY, 28); ctx.arcTo(cx, cardY, cx + cw, cardY, 28);
                    ctx.closePath();
                    ctx.save();
                    ctx.clip();
                    ctx.fillStyle = 'rgba(20,15,55,0.62)';
                    ctx.fillRect(cx, cardY, cw, ch);
                    // Gigantyczna cyfra w tle karty (stat/wrapped-owy akcent)
                    ctx.font = "800 210px 'Baloo 2'";
                    ctx.fillStyle = `${accent}22`;
                    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
                    ctx.fillText(String(idx + 1).padStart(2, '0'), cx + cw + 30, cardY + ch - 6);
                    ctx.restore();
                    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke();
                    ctx.fillStyle = accent; ctx.fillRect(cx, cardY, cw, 5);

                    ctx.fillStyle = accent;
                    ctx.font = "800 20px 'Baloo 2'"; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
                    const icon = iconsRef.current[idx] || '✨';
                    ctx.fillText(`${icon} ${momentLabelRef.current} ${idx + 1}`, cx + 26, cardY + 46);

                    ctx.fillStyle = '#FFFFFF'; ctx.font = "800 34px 'Nunito'"; ctx.textAlign = 'left';
                    const factText = punchyFactsRef.current[idx] || facts[idx] || '';
                    wrapText(ctx, factText, cx + 26, cardY + 96, cw - 52, 42);
                    ctx.restore();
                });

                // Zamknięcie z brandingiem - linia zamknięcia od AI słowo po słowie, potem duży wordmark
                const closeRaw = prog(timeline.closing, t);
                if (closeRaw > 0) {
                    drawKineticText(ctx, closingLineRef.current, W / 2, H * 0.42, "800 42px 'Baloo 2'", '#FFFFFF', Math.min(1, closeRaw * 1.6), W * 0.86, 48);
                    const brandP = ease(Math.max(0, Math.min(1, (closeRaw - 0.35) / 0.5)));
                    if (brandP > 0) drawPill(ctx, W / 2, H * 0.855, 'eduboxpro.pl', "800 46px 'Baloo 2'", 30, 16, 'rgba(20,15,50,0.75)', theme.accent[2], brandP);
                }

                timeline.stars.forEach((se, idx) => {
                    const sp = prog(se, t);
                    if (sp > 0) {
                        const s = easeBounce(sp);
                        ctx.save(); ctx.translate(W / 2 + (idx - 1) * 100, H * 0.93); ctx.scale(s, s);
                        ctx.font = '64px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⭐', 0, 0);
                        ctx.restore();
                    }
                });

                // Ziarno filmowe na samej górze - subtelna tekstura zamiast płaskiego cyfrowego gradientu
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = getGrainPattern(ctx);
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            // Przygotowuje (opcjonalny) podkład muzyczny dopasowany do nastroju: wczytuje krótki
            // plik audio, dekoduje go Web Audio API i podpina jako osobny tor dźwiękowy do strumienia
            // z Canvasu. Jeśli cokolwiek zawiedzie (brak sieci, stary przeglądarka) - wideo i tak
            // powstaje, tylko bez dźwięku, więc generowanie nigdy nie blokuje się na muzyce.
            async function prepareAudioTrack(moodKey) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                const audioCtx = new AudioCtx();
                const src = MUSIC_TRACKS[moodKey] || MUSIC_TRACKS[DEFAULT_MOOD];
                const resp = await fetch(src);
                const arrBuf = await resp.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrBuf);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.loop = true;
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 0.5);
                const dest = audioCtx.createMediaStreamDestination();
                source.connect(gainNode).connect(dest);
                source.start(0);
                return {
                    audioTrack: dest.stream.getAudioTracks()[0],
                    fadeOut: (whenSeconds) => { try { gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + whenSeconds); } catch (e) {} },
                    cleanup: () => { try { source.stop(); } catch (e) {} try { audioCtx.close(); } catch (e) {} }
                };
            }

            async function playAndRecord(factCount, moodKey) {
                const canvas = canvasRef.current;
                const W = 720, H = 1280;
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');
                initParticles(W, H);
                const timeline = buildTimeline(factCount);
                const duration = timeline.duration;

                const canvasStream = canvas.captureStream(30);
                let finalStream = canvasStream;
                let audioHandle = null;

                if (musicOn) {
                    try {
                        audioHandle = await prepareAudioTrack(moodKey);
                        if (audioHandle) finalStream = new MediaStream([...canvasStream.getVideoTracks(), audioHandle.audioTrack]);
                    } catch (e) {
                        console.log('Muzyka niedostępna, generuję wideo bez dźwięku.');
                        audioHandle = null;
                        finalStream = canvasStream;
                    }
                }

                const mimeCandidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp9', 'video/webm'];
                const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
                const recorder = new MediaRecorder(finalStream, { mimeType, videoBitsPerSecond: 4000000 });
                chunksRef.current = [];
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
                recorder.onstop = () => {
                    if (audioHandle) audioHandle.cleanup();
                    const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                    setDownloadUrl(URL.createObjectURL(blob));
                    setStage('done');
                    setStatusText('');
                };
                mediaRecorderRef.current = recorder;
                recorder.start();

                let fadeStarted = false;
                const startTime = performance.now();
                function loop(now) {
                    const t = now - startTime;
                    renderFrame(ctx, W, H, t, timeline);
                    setProgressPct(Math.min(100, (t / duration) * 100));
                    if (audioHandle && !fadeStarted && t > duration - 900) {
                        fadeStarted = true;
                        audioHandle.fadeOut(0.85);
                    }
                    if (t < duration) requestAnimationFrame(loop);
                    else if (recorder.state !== 'inactive') recorder.stop();
                }
                requestAnimationFrame(loop);
            }

            const handleGenerate = () => {
                const filledFacts = facts.map(f => f.trim()).filter(Boolean);
                if (filledFacts.length < 2) { showToast('Wpisz przynajmniej 2 fakty/momenty!'); return; }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    async () => {
                        setStage('generating');
                        setStatusText('AI analizuje to, co się wydarzyło...');
                        setProgressPct(0);
                        try {
                            const eventTypeInfo = EVENT_TYPES.find(e => e.id === eventType) || EVENT_TYPES[0];
                            const ageGroupInfo = AGE_GROUPS.find(a => a.id === ageGroup) || AGE_GROUPS[1];

                            // JEDNO wywołanie AI, które analizuje CAŁOŚĆ (typ, wiek, opis + fakty) holistycznie
                            // i personalizuje wideo bez ryzykownego generowania obrazków: pisze spójną odznakę
                            // i hook, dopracowuje fakty, dobiera zamknięcie, WYBIERA NASTRÓJ (który realnie
                            // zmienia kolory/tempo/muzykę w renderFrame) i ikony do każdej karty.
                            const combinedSystem = `Jesteś kreatywnym dyrektorem tworzącym krótkie wideo "Wrapped" (jak roczne podsumowanie Spotify) podsumowujące ${eventTypeInfo.aiLabel}, dla grupy: ${ageGroupInfo.label}, na podstawie informacji od nauczyciela.
Dostajesz temat/nazwę, opcjonalny dłuższy opis oraz od 2 do 5 faktów/momentów. Zwróć WYŁĄCZNIE czysty obiekt JSON, bez żadnego dodatkowego tekstu:
{"badge": "krótka odznaka na górze wideo, WIELKIMI LITERAMI, z jednym pasującym emoji na początku, max 4 słowa (np. 'PODSUMOWANIE WYCIECZKI')", "hook": "jedno krótkie, chwytliwe zdanie (max 10 słów) pod tytułem", "facts": ["dla KAŻDEGO podanego faktu, w tej samej kolejności, dokładnie ${filledFacts.length} pozycji, mocniejsza max 8-słowowa wersja - nie zmyślaj nowych faktów, tylko wzmocnij podane"], "closing": "krótkie (max 8 słów), ciepłe zdanie zamykające, dopasowane do treści i wieku", "mood": "DOKŁADNIE jedno słowo z: energetic, cozy, proud, playful - dopasowane do charakteru i wieku (energetic = żywiołowe/aktywne, cozy = ciepłe/kameralne/małe dzieci, proud = osiągnięcia/duma, playful = zabawa/humor)", "icons": ["dla KAŻDEGO faktu, ta sama kolejność, dokładnie ${filledFacts.length} pozycji, jedno pasujące pojedyncze emoji"]}
Ton dopasuj do grupy wiekowej: ${ageGroupInfo.aiHint}.
Wszystko po polsku (poza wartością "mood"), bez cudzysłowów i dwukropków w treściach tekstowych.`;

                            let contextUser = `Temat/nazwa: ${className.trim() || 'brak nazwy'}\n`;
                            if (description.trim()) contextUser += `Dodatkowy opis od nauczyciela: ${description.trim()}\n`;
                            contextUser += `Fakty:\n` + filledFacts.map((f, i) => `${i + 1}. ${f}`).join('\n');

                            let result = {
                                badge: eventTypeInfo.badge,
                                hook: '',
                                facts: filledFacts,
                                closing: 'Dziękujemy za wspólny czas!',
                                mood: DEFAULT_MOOD,
                                icons: filledFacts.map(() => '✨')
                            };
                            try {
                                const resCombined = await fetch('/api/chat', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt: contextUser, system: combinedSystem, temperature: 0.85, format: 'json', model: 'gpt-4o-mini' })
                                });
                                if (resCombined.ok) {
                                    const dataCombined = await resCombined.json();
                                    const parsed = JSON.parse(dataCombined.text);
                                    if (typeof parsed.badge === 'string' && parsed.badge.trim()) result.badge = parsed.badge.trim();
                                    if (typeof parsed.hook === 'string') result.hook = parsed.hook.trim();
                                    if (Array.isArray(parsed.facts) && parsed.facts.length === filledFacts.length) result.facts = parsed.facts;
                                    if (typeof parsed.closing === 'string' && parsed.closing.trim()) result.closing = parsed.closing.trim();
                                    if (MOOD_THEMES[parsed.mood]) result.mood = parsed.mood;
                                    if (Array.isArray(parsed.icons) && parsed.icons.length === filledFacts.length) result.icons = parsed.icons;
                                }
                            } catch (e) { console.log('Nie udało się spersonalizować przez AI, używam wersji domyślnej.'); }

                            // Drugie, NIEZALEŻNE wywołanie AI jako krytyczny weryfikator (ten sam wzorzec
                            // "generator + weryfikator" co w EduRymy) - łapie halucynacje/nonsensy, których
                            // model nie widzi we własnym pierwszym przebiegu. Jeśli coś pójdzie nie tak,
                            // po prostu zostaje pierwsza wersja - weryfikacja nigdy nie blokuje wideo.
                            setStatusText('Sprawdzam jakość treści...');
                            try {
                                const verifySystem = `Jesteś rygorystycznym redaktorem jakości treści do wideo edukacyjnych. Dostajesz oryginalne fakty od nauczyciela oraz przygotowaną wersję JSON do wideo. Sprawdź krytycznie: (1) czy pole "facts" niczego nie zmyśla ponad to, co podał nauczyciel, tylko wzmacnia sformułowanie, (2) czy ton pasuje do grupy wiekowej: ${ageGroupInfo.label}, (3) czy nie ma powtórzeń, nonsensów lub pustych ogólników. Jeśli wszystko jest OK, zwróć DOKŁADNIE ten sam obiekt JSON bez zmian. Jeśli coś wymaga poprawy, zwróć POPRAWIONĄ wersję w TYM SAMYM formacie JSON (te same klucze: badge, hook, facts, closing, mood, icons). Zwróć WYŁĄCZNIE obiekt JSON, bez dodatkowego tekstu.`;
                                const verifyUser = `Oryginalne fakty od nauczyciela:\n${filledFacts.map((f, i) => `${i + 1}. ${f}`).join('\n')}\n\nWersja do weryfikacji:\n${JSON.stringify(result)}`;
                                const resVerify = await fetch('/api/chat', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt: verifyUser, system: verifySystem, temperature: 0.3, format: 'json', model: 'gpt-4o-mini' })
                                });
                                if (resVerify.ok) {
                                    const dataVerify = await resVerify.json();
                                    const parsedVerify = JSON.parse(dataVerify.text);
                                    if (Array.isArray(parsedVerify.facts) && parsedVerify.facts.length === filledFacts.length && typeof parsedVerify.closing === 'string' && parsedVerify.closing.trim() && MOOD_THEMES[parsedVerify.mood]) {
                                        result = {
                                            badge: typeof parsedVerify.badge === 'string' && parsedVerify.badge.trim() ? parsedVerify.badge.trim() : result.badge,
                                            hook: typeof parsedVerify.hook === 'string' ? parsedVerify.hook.trim() : result.hook,
                                            facts: parsedVerify.facts,
                                            closing: parsedVerify.closing.trim(),
                                            mood: parsedVerify.mood,
                                            icons: Array.isArray(parsedVerify.icons) && parsedVerify.icons.length === filledFacts.length ? parsedVerify.icons : result.icons
                                        };
                                    }
                                }
                            } catch (e) { console.log('Weryfikacja pominięta, używam pierwszej wersji.'); }

                            punchyFactsRef.current = result.facts;
                            hookRef.current = result.hook;
                            closingLineRef.current = result.closing;
                            themeRef.current = MOOD_THEMES[result.mood] || MOOD_THEMES[DEFAULT_MOOD];
                            iconsRef.current = result.icons;
                            badgeRef.current = result.badge;
                            momentLabelRef.current = eventTypeInfo.momentLabel;
                            factCountRef.current = filledFacts.length;
                            moodKeyRef.current = result.mood;
                            motifsRef.current = resolveMotifs(eventType, ageGroup);

                            setStage('recording');
                            setStatusText('Nagrywam wideo...');
                            await playAndRecord(filledFacts.length, result.mood);
                        } catch (err) {
                            showToast('Błąd: ' + err.message);
                            setStage('form');
                        }
                    },
                    (limitMsg) => { showToast(limitMsg); },
                    (toastMsg) => { showToast(toastMsg); }
                );
            };

            const handleReplay = async () => {
                setStage('recording'); setStatusText('Nagrywam wideo...');
                await playAndRecord(factCountRef.current, moodKeyRef.current);
            };

            const updateFact = (i, val) => {
                const next = [...facts]; next[i] = val; setFacts(next);
            };

            return (
                <div className="min-h-screen">
                    <main className="max-w-md mx-auto px-4 py-10">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center gap-2 bg-[#2A2170] text-[#FFC145] text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-4">
                                <i className="ph-bold ph-film-strip"></i> EduPodsumowanie
                            </div>
                            <h1 className="display-font text-3xl font-extrabold text-white mb-2">Wideo-podsumowanie dowolnego wydarzenia</h1>
                            <p className="text-sm text-[#A79FE0]">Rok, semestr, wycieczka, projekt czy konkurs - podaj typ, wiek dzieci i kilka faktów. AI dobiera ton, nastrój, kolory i muzykę.</p>
                        </div>

                        {!isPremium && (
                            <div className="max-w-sm mx-auto mb-6 flex items-center gap-2 bg-[#1b1447] border-2 border-[#3A2F8C] rounded-2xl p-2">
                                <input type="text" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} placeholder="Masz kod PRO? Wpisz tutaj..." className="flex-1 bg-transparent text-sm px-3 py-2 outline-none text-white placeholder-[#8981C2]" />
                                <button onClick={handleVerifyCode} className="bg-[#FF5DA2] text-white text-xs font-bold px-4 py-2.5 rounded-xl">Odblokuj</button>
                            </div>
                        )}

                        {stage === 'form' && (
                            <div className="card-panel p-5 space-y-5">
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Typ podsumowania</label>
                                        <select value={eventType} onChange={(e) => setEventType(e.target.value)} className="w-full fact-input">
                                            {EVENT_TYPES.map(et => <option key={et.id} value={et.id}>{et.label}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Grupa wiekowa</label>
                                        <select value={ageGroup} onChange={(e) => setAgeGroup(e.target.value)} className="w-full fact-input">
                                            {AGE_GROUPS.map(ag => <option key={ag.id} value={ag.id}>{ag.label}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Nazwa / temat</label>
                                    <input type="text" value={className} onChange={(e) => setClassName(e.target.value)} maxLength="40" placeholder="np. Klasa 4B albo Wycieczka do Muzeum" className="w-full fact-input" />
                                </div>

                                <div>
                                    <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Opisz szerzej (opcjonalnie)</label>
                                    <textarea value={description} onChange={(e) => setDescription(e.target.value)} maxLength="400" rows="3" placeholder="np. Byliśmy bardzo aktywni sportowo, dużo razem świętowaliśmy, klasa pełna energii i pomysłów..." className="w-full fact-input resize-none" />
                                    <p className="text-[10px] text-[#8981C2] mt-1">AI przeanalizuje to razem z faktami i dobierze nastrój, kolory, ton i muzykę całego wideo.</p>
                                </div>

                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="text-xs font-black uppercase text-[#A79FE0]">Fakty / momenty</label>
                                        <span className="text-[10px] text-[#8981C2]">wypełnij co najmniej 2 z 5</span>
                                    </div>
                                    <div className="space-y-3">
                                        {[0, 1, 2, 3, 4].map(i => (
                                            <input key={i} type="text" value={facts[i]} onChange={(e) => updateFact(i, e.target.value)} maxLength="120" placeholder={FACT_PLACEHOLDERS[i]} className="w-full fact-input" />
                                        ))}
                                    </div>
                                </div>

                                <label className="flex items-center gap-3 bg-[#14103a] border-2 border-[#3A2F8C] rounded-2xl px-4 py-3 cursor-pointer">
                                    <input type="checkbox" checked={musicOn} onChange={(e) => setMusicOn(e.target.checked)} className="w-4 h-4" />
                                    <span className="text-sm font-bold text-white">🎵 Dodaj podkład muzyczny dopasowany do nastroju</span>
                                </label>

                                <button onClick={handleGenerate} className="generate-btn w-full text-white display-font font-bold text-lg py-4 rounded-2xl">
                                    Wygeneruj wideo-podsumowanie
                                </button>
                            </div>
                        )}

                        {(stage === 'generating' || stage === 'recording' || stage === 'done') && (
                            <div className="card-panel p-5">
                                <div className="relative w-full max-w-[300px] mx-auto rounded-3xl overflow-hidden shadow-lg" style={{ aspectRatio: '9/16' }}>
                                    <canvas ref={canvasRef} className="w-full h-full block bg-[#1b1447]"></canvas>
                                    {stage === 'generating' && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-[#1b1447]">
                                            <i className="ph-bold ph-sparkle text-5xl text-[#FF5DA2] animate-pulse"></i>
                                        </div>
                                    )}
                                </div>
                                {stage !== 'done' && (
                                    <React.Fragment>
                                        <div className="h-1.5 bg-[#2A2170] rounded-full overflow-hidden mt-4 max-w-[300px] mx-auto">
                                            <div className="h-full bg-gradient-to-r from-[#FF5DA2] to-[#7B5CFF] transition-all" style={{ width: progressPct + '%' }}></div>
                                        </div>
                                        <p className="text-center text-xs text-[#A79FE0] mt-2">{statusText}</p>
                                    </React.Fragment>
                                )}
                                {stage === 'done' && (
                                    <div className="flex gap-2 mt-4 max-w-[300px] mx-auto">
                                        <a href={downloadUrl} download="edupodsumowanie.webm" className="flex-1 bg-[#57E6C4] text-[#0f0a2e] text-center font-bold text-sm py-3 rounded-xl">⬇ Pobierz wideo</a>
                                        <button onClick={handleReplay} className="flex-1 bg-transparent border-2 border-[#3A2F8C] text-[#ECE9FF] font-bold text-sm py-3 rounded-xl">↻ Podgląd</button>
                                    </div>
                                )}
                                {stage === 'done' && (
                                    <button onClick={() => { setStage('form'); setDownloadUrl(null); }} className="w-full text-center text-xs text-[#A79FE0] font-bold mt-4 underline">Zrób kolejne podsumowanie</button>
                                )}
                            </div>
                        )}

                        <p className="text-center text-[11px] text-[#A79FE0] mt-6 leading-relaxed">Nagrywanie tworzy prawdziwy plik wideo (WebM, z opcjonalną muzyką bez praw autorskich) w Twojej przeglądarce - do AI wysyłamy tylko wpisany tekst (fakty i opis), żeby dopracować treść i dobrać nastrój wideo.</p>
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#1b1447] border border-[#3A2F8C] text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl">{toastMessage}</div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>

</body></html>
