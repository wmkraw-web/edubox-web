    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FACT_PLACEHOLDERS = [
            'np. Przeczytaliśmy razem 12 książek',
            'np. Wygraliśmy konkurs recytatorski',
            'np. Nauczyliśmy się liczyć do 100 po angielsku'
        ];

        // Cztery gotowe "nastroje" wideo - AI wybiera jeden na podstawie tego, co nauczyciel napisał
        // (opis + fakty), a nastrój steruje kolorami aur, akcentów kart i tempem animacji. To jest
        // realna personalizacja napędzana przez AI, ale zero ryzyka generowania obrazków - wszystko
        // dalej renderuje się w Canvasie, po prostu innymi paletami/tempem.
        const MOOD_THEMES = {
            energetic: { aura: ['251,146,60', '236,72,153', '250,204,21'], accent: ['#FF7A45', '#FFC145', '#FF5DA2'], speed: 1.25 },
            cozy: { aura: ['245,158,11', '244,114,182', '168,85,247'], accent: ['#FBBF24', '#FB7185', '#C084FC'], speed: 0.8 },
            proud: { aura: ['59,130,246', '234,179,8', '124,58,237'], accent: ['#FFD166', '#7B8CFF', '#60A5FA'], speed: 0.85 },
            playful: { aura: ['59,130,246', '168,85,247', '16,185,129'], accent: ['#FF5DA2', '#FFC145', '#57E6C4'], speed: 1 }
        };
        const DEFAULT_MOOD = 'playful';

        function App() {
            const [user, setUser] = useState(null);
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            const [className, setClassName] = useState('');
            const [description, setDescription] = useState('');
            const [facts, setFacts] = useState(['', '', '']);

            const [stage, setStage] = useState('form');
            const [statusText, setStatusText] = useState('');
            const [progressPct, setProgressPct] = useState(0);
            const [downloadUrl, setDownloadUrl] = useState(null);

            const canvasRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const particlesRef = useRef([]);
            const punchyFactsRef = useRef(['', '', '']);
            const hookRef = useRef('');
            const closingLineRef = useRef('Dziękujemy za wspólny czas!');
            const iconsRef = useRef(['✨', '✨', '✨']);
            const themeRef = useRef(MOOD_THEMES[DEFAULT_MOOD]);

            useEffect(() => {
                const initCore = () => {
                    if (window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                        const status = localStorage.getItem('eduboxProStatus');
                        if (status === 'PRO' || status === 'active') setIsPremium(true);
                    } else { setTimeout(initCore, 100); }
                };
                initCore();
            }, []);

            const showToast = (text) => { setToastMessage(text); setTimeout(() => setToastMessage(null), 4000); };

            const handleVerifyCode = async () => {
                const isValid = await window.EduBoxCore.verifyPremiumCode(accessCode);
                if (isValid) { setIsPremium(true); setAccessCode(''); localStorage.setItem('eduboxProStatus', 'active'); showToast('Kod aktywny! Witamy w Premium 🌟'); }
                else showToast('Nieprawidłowy kod dostępu!');
            };

            function ease(t) { return 1 - Math.pow(1 - t, 3); }
            function easeBounce(t) {
                const n1 = 7.5625, d1 = 2.75;
                if (t < 1 / d1) return n1 * t * t;
                if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
                if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
                return n1 * (t -= 2.625 / d1) * t + 0.984375;
            }

            function initParticles(W, H) {
                // Kolory konfetti dopasowane do wybranego przez AI nastroju wideo
                const particleColors = [...themeRef.current.accent, '#FFFFFF'];
                const arr = [];
                for (let i = 0; i < 40; i++) {
                    arr.push({
                        x: Math.random() * W, y: Math.random() * H,
                        size: 6 + Math.random() * 10, speed: 1.2 + Math.random() * 2,
                        drift: (Math.random() - 0.5) * 1.4, rot: Math.random() * 7,
                        rotSpeed: (Math.random() - 0.5) * 0.07,
                        color: particleColors[Math.floor(Math.random() * particleColors.length)]
                    });
                }
                particlesRef.current = arr;
            }

            function drawPill(ctx, cx, topY, text, font, padX, padY, bg, fg, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = font;
                const w = ctx.measureText(text).width + padX * 2;
                const h = parseInt(font.match(/(\d+)px/)[1]) + padY * 2;
                ctx.fillStyle = bg;
                const x = cx - w / 2, y = topY;
                const r = h / 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = fg;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, cx, y + h / 2 + 2);
                ctx.restore();
                return h;
            }

            function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '', lines = [];
                for (const w of words) {
                    const test = line + w + ' ';
                    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w + ' '; }
                    else line = test;
                }
                lines.push(line);
                lines.forEach((l, i) => ctx.fillText(l.trim(), x, y + i * lineHeight));
                return lines.length;
            }

            // Ziarno filmowe (grain) - generowane RAZ jako mały kafelek z losowym szumem, potem
            // powtarzane (pattern) na całej klatce z niską przezroczystością. Daje kinowe, "drogie"
            // wykończenie zamiast płaskiego, cyfrowego gradientu.
            let grainPatternCache = null;
            function getGrainPattern(ctx) {
                if (grainPatternCache) return grainPatternCache;
                const tile = document.createElement('canvas');
                tile.width = 140; tile.height = 140;
                const tctx = tile.getContext('2d');
                const imgData = tctx.createImageData(140, 140);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const v = Math.random() * 255;
                    imgData.data[i] = v; imgData.data[i + 1] = v; imgData.data[i + 2] = v;
                    imgData.data[i + 3] = Math.random() * 40;
                }
                tctx.putImageData(imgData, 0, 0);
                grainPatternCache = ctx.createPattern(tile, 'repeat');
                return grainPatternCache;
            }

            // Dzieli tekst na linie (jak wrapText), ale zwraca słowa z ich pozycjami x/y, żeby
            // móc odsłaniać tekst słowo-po-słowie (kinetic typography) zamiast całym blokiem naraz.
            function layoutWords(ctx, text, font, maxWidth, lineHeight) {
                ctx.font = font;
                const spaceW = ctx.measureText(' ').width;
                const words = text.split(' ').filter(Boolean);
                const lines = [[]];
                let lineWidth = 0;
                words.forEach(w => {
                    const ww = ctx.measureText(w).width;
                    if (lineWidth + ww > maxWidth && lines[lines.length - 1].length) {
                        lines.push([]); lineWidth = 0;
                    }
                    lines[lines.length - 1].push({ text: w, w: ww });
                    lineWidth += ww + spaceW;
                });
                const placed = [];
                lines.forEach((line, li) => {
                    const lineW = line.reduce((s, w) => s + w.w, 0) + spaceW * (line.length - 1);
                    let x = -lineW / 2;
                    line.forEach(word => {
                        placed.push({ text: word.text, x: x + word.w / 2, y: li * lineHeight, w: word.w });
                        x += word.w + spaceW;
                    });
                });
                return { words: placed, lineCount: lines.length };
            }

            // Odsłania tekst słowo po słowie (fade + lekkie uniesienie), z przesunięciem czasowym
            // między słowami - dużo bardziej "żywe" niż wspólny fade całej linii naraz.
            function drawKineticText(ctx, text, cx, topY, font, color, progress, maxWidth, lineHeight) {
                const { words } = layoutWords(ctx, text, font, maxWidth, lineHeight);
                const n = Math.max(1, words.length);
                ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
                words.forEach((word, i) => {
                    const wordStart = i / n;
                    const wordEnd = wordStart + (1.6 / n);
                    const wp = Math.max(0, Math.min(1, (progress - wordStart) / (wordEnd - wordStart)));
                    if (wp <= 0) return;
                    const eased = ease(wp);
                    ctx.save();
                    ctx.globalAlpha = eased;
                    ctx.fillStyle = color;
                    ctx.fillText(word.text, cx + word.x, topY + word.y - (1 - eased) * 16);
                    ctx.restore();
                });
            }

            // Cztery odsłony: tytuł klasy -> fakt 1 -> fakt 2 -> fakt 3 -> zamknięcie (eduboxpro.pl)
            function buildTimeline() {
                return {
                    title: { start: 300, end: 3200 },
                    fact1: { start: 3400, end: 7200 },
                    fact2: { start: 7400, end: 11200 },
                    fact3: { start: 11400, end: 15200 },
                    closing: { start: 15400, end: 18500 },
                    stars: [{ start: 18700, end: 19400 }, { start: 19400, end: 20100 }, { start: 20100, end: 20800 }]
                };
            }
            function prog(el, t) { if (t < el.start) return 0; if (t > el.end) return 1; return (t - el.start) / (el.end - el.start); }

            // Tło: ciemna baza + 3 miękkie, animowane gradientowe "aury" (dokładnie styl .aura-blob
            // z index.html) zamiast wygenerowanej przez AI ilustracji - spójne z resztą portfolio,
            // zawsze eleganckie, zero ryzyka "generycznego" wyglądu AI-clipartu. Same pozycje/tempo
            // za każdym razem, ale KOLORY pochodzą z nastroju wybranego przez AI (themeRef) - to
            // realna personalizacja bez ryzyka generowania obrazków.
            const AURA_POSITIONS = [
                { baseX: 0.18, baseY: 0.15, r: 0.55, speed: 0.00018, phase: 0 },
                { baseX: 0.82, baseY: 0.35, r: 0.48, speed: 0.00021, phase: 2.1 },
                { baseX: 0.35, baseY: 0.85, r: 0.62, speed: 0.00015, phase: 4.2 }
            ];

            function renderFrame(ctx, W, H, t, timeline) {
                const theme = themeRef.current;
                ctx.fillStyle = '#0f0a2e';
                ctx.fillRect(0, 0, W, H);

                AURA_POSITIONS.forEach((b, i) => {
                    const color = theme.aura[i % theme.aura.length];
                    const spd = b.speed * theme.speed;
                    const drift = 0.04;
                    const x = (b.baseX + Math.sin(t * spd + b.phase) * drift) * W;
                    const y = (b.baseY + Math.cos(t * spd * 0.8 + b.phase) * drift) * H;
                    const r = b.r * W * (0.9 + Math.sin(t * spd * 1.4 + b.phase) * 0.1);
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, `rgba(${color},0.55)`);
                    grad.addColorStop(1, `rgba(${color},0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                });

                particlesRef.current.forEach(p => {
                    p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
                    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
                    ctx.restore();
                });

                // Tytuł klasy - odznaka wjeżdża z odbiciem, nazwa klasy i hasło AI odsłaniają się słowo po słowie
                const titleP = prog(timeline.title, t);
                if (titleP > 0) {
                    const s = easeBounce(Math.min(1, titleP * 1.8));
                    ctx.save();
                    ctx.translate(W / 2, H * 0.13);
                    ctx.scale(0.3 + s * 0.7, 0.3 + s * 0.7);
                    drawPill(ctx, 0, -34, '🎬 PODSUMOWANIE ROKU', "800 24px 'Baloo 2'", 20, 12, 'rgba(255,255,255,0.14)', '#FFC145', Math.min(1, s * 1.4));
                    ctx.restore();
                    drawKineticText(ctx, className || 'Nasza klasa', W / 2, H * 0.25, "800 56px 'Baloo 2'", '#FFFFFF', Math.min(1, titleP * 1.4), W * 0.86, 60);
                    // Hasło dopasowane przez AI do treści - startuje odrobinę później niż nazwa klasy
                    const hookP = Math.max(0, Math.min(1, (titleP - 0.25) / 0.7));
                    if (hookP > 0 && hookRef.current) {
                        drawKineticText(ctx, hookRef.current, W / 2, H * 0.33, "700 26px 'Nunito'", theme.accent[0], hookP, W * 0.78, 32);
                    }
                }

                // Trzy szklane karty faktów, każda z gigantyczną cyfrą w tle i innym kierunkiem wjazdu
                const SLIDE_FROM = [-1, 0, 1]; // karta 1 z lewej, 2 z dołu (bez przesunięcia X), 3 z prawej
                const factDefs = [
                    { key: 'fact1', idx: 0 },
                    { key: 'fact2', idx: 1 },
                    { key: 'fact3', idx: 2 }
                ];
                factDefs.forEach(({ key, idx }) => {
                    const el = timeline[key];
                    const raw = prog(el, t);
                    if (raw <= 0) return;
                    const p = ease(Math.min(1, raw * 3));
                    const cardY = H * 0.55 + (1 - p) * 18;
                    const xOffset = (1 - p) * SLIDE_FROM[idx] * 90;
                    const alpha = Math.min(1, raw * 4) * (raw > 0.93 ? Math.max(0, (1 - raw) * 14) : 1);
                    const accent = theme.accent[idx % theme.accent.length];

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(xOffset, 0);
                    const cw = W * 0.84, ch = 230, cx = W / 2 - cw / 2;

                    // Karta w stylu "szkła": ciemna, półprzezroczysta, delikatna obwódka + pasek akcentu
                    ctx.beginPath();
                    ctx.moveTo(cx + 28, cardY); ctx.arcTo(cx + cw, cardY, cx + cw, cardY + ch, 28); ctx.arcTo(cx + cw, cardY + ch, cx, cardY + ch, 28); ctx.arcTo(cx, cardY + ch, cx, cardY, 28); ctx.arcTo(cx, cardY, cx + cw, cardY, 28);
                    ctx.closePath();
                    ctx.save();
                    ctx.clip();
                    ctx.fillStyle = 'rgba(20,15,55,0.62)';
                    ctx.fillRect(cx, cardY, cw, ch);
                    // Gigantyczna cyfra w tle karty (stat/wrapped-owy akcent)
                    ctx.font = "800 210px 'Baloo 2'";
                    ctx.fillStyle = `${accent}22`;
                    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
                    ctx.fillText(String(idx + 1).padStart(2, '0'), cx + cw + 30, cardY + ch - 6);
                    ctx.restore();
                    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke();
                    ctx.fillStyle = accent; ctx.fillRect(cx, cardY, cw, 5);

                    ctx.fillStyle = accent;
                    ctx.font = "800 20px 'Baloo 2'"; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
                    const icon = iconsRef.current[idx] || '✨';
                    ctx.fillText(`${icon} MOMENT ${idx + 1}`, cx + 26, cardY + 46);

                    ctx.fillStyle = '#FFFFFF'; ctx.font = "800 34px 'Nunito'"; ctx.textAlign = 'left';
                    const factText = punchyFactsRef.current[idx] || facts[idx] || '';
                    wrapText(ctx, factText, cx + 26, cardY + 96, cw - 52, 42);
                    ctx.restore();
                });

                // Zamknięcie z brandingiem - linia zamknięcia od AI słowo po słowie, potem duży wordmark
                const closeRaw = prog(timeline.closing, t);
                if (closeRaw > 0) {
                    drawKineticText(ctx, closingLineRef.current, W / 2, H * 0.42, "800 42px 'Baloo 2'", '#FFFFFF', Math.min(1, closeRaw * 1.6), W * 0.86, 48);
                    const brandP = ease(Math.max(0, Math.min(1, (closeRaw - 0.35) / 0.5)));
                    if (brandP > 0) drawPill(ctx, W / 2, H * 0.855, 'eduboxpro.pl', "800 46px 'Baloo 2'", 30, 16, 'rgba(20,15,50,0.75)', theme.accent[2], brandP);
                }

                timeline.stars.forEach((se, idx) => {
                    const sp = prog(se, t);
                    if (sp > 0) {
                        const s = easeBounce(sp);
                        ctx.save(); ctx.translate(W / 2 + (idx - 1) * 100, H * 0.93); ctx.scale(s, s);
                        ctx.font = '64px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⭐', 0, 0);
                        ctx.restore();
                    }
                });

                // Ziarno filmowe na samej górze - subtelna tekstura zamiast płaskiego cyfrowego gradientu
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = getGrainPattern(ctx);
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            function playAndRecord() {
                const canvas = canvasRef.current;
                const W = 720, H = 1280;
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');
                initParticles(W, H);
                const timeline = buildTimeline();
                const duration = 21000;

                const stream = canvas.captureStream(30);
                const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
                const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 4000000 });
                chunksRef.current = [];
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
                recorder.onstop = () => {
                    const blob = new Blob(chunksRef.current, { type: 'video/webm' });
                    setDownloadUrl(URL.createObjectURL(blob));
                    setStage('done');
                    setStatusText('');
                };
                mediaRecorderRef.current = recorder;
                recorder.start();

                const startTime = performance.now();
                function loop(now) {
                    const t = now - startTime;
                    renderFrame(ctx, W, H, t, timeline);
                    setProgressPct(Math.min(100, (t / duration) * 100));
                    if (t < duration) requestAnimationFrame(loop);
                    else if (recorder.state !== 'inactive') recorder.stop();
                }
                requestAnimationFrame(loop);
            }

            const handleGenerate = () => {
                if (facts.every(f => !f.trim())) { showToast('Wpisz przynajmniej jeden fakt/wydarzenie!'); return; }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    async () => {
                        setStage('generating');
                        setStatusText('AI analizuje Waszą klasę...');
                        setProgressPct(0);
                        try {
                            // JEDNO wywołanie AI, które analizuje CAŁOŚĆ (opis + fakty) holistycznie i
                            // personalizuje wideo bez ryzykownego generowania obrazków: pisze spójny hook,
                            // dopracowuje fakty, dobiera zamknięcie, WYBIERA NASTRÓJ (który realnie zmienia
                            // kolory/tempo animacji w renderFrame) i ikony do każdej karty. Tło i tak dalej
                            // rysuje się w 100% w Canvasie - to jedyne wywołanie API w całym narzędziu.
                            const combinedSystem = `Jesteś kreatywnym dyrektorem tworzącym krótkie wideo "Wrapped" (jak roczne podsumowanie Spotify) podsumowujące rok szkolny klasy, na podstawie informacji od nauczyciela.
Dostajesz nazwę/opis klasy, opcjonalny dłuższy opis roku oraz do 3 faktów/wydarzeń. Na tej podstawie:
1. "hook" - jedno krótkie, chwytliwe zdanie (max 10 słów) pod nazwą klasy, oddające charakter/ducha tego roku.
2. "facts" - dla KAŻDEGO podanego faktu (pomijając puste, w tej samej kolejności) mocniejsza, max 8-słowowa wersja.
3. "closing" - krótkie (max 8 słów), ciepłe zdanie zamykające wideo, dopasowane do charakteru roku (nie musi być ogólnikiem typu "dziękujemy za wspólny czas" - dopasuj do treści).
4. "mood" - DOKŁADNIE jedno słowo z: energetic, cozy, proud, playful - to, które najlepiej pasuje do charakteru opisu/faktów (energetic = żywiołowa/sportowa/pełna energii klasa, cozy = ciepła/kameralna/spokojna, proud = osiągnięcia/sukcesy/duma, playful = zabawa/kreatywność/humor).
5. "icons" - dla KAŻDEGO podanego faktu (ta sama kolejność co "facts") jedno pasujące pojedyncze emoji.
Zwróć WYŁĄCZNIE czysty obiekt JSON, bez żadnego dodatkowego tekstu: {"hook": "...", "facts": ["...", "..."], "closing": "...", "mood": "...", "icons": ["...", "..."]}
Wszystko po polsku (poza wartością "mood"), bez cudzysłowów i dwukropków w treściach tekstowych.`;

                            let contextUser = `Nazwa/opis klasy: ${className.trim() || 'brak nazwy'}\n`;
                            if (description.trim()) contextUser += `Dodatkowy opis roku od nauczyciela: ${description.trim()}\n`;
                            contextUser += `Fakty:\n` + facts.filter(f => f.trim()).map((f, i) => `${i + 1}. ${f.trim()}`).join('\n');

                            let punchy = facts.map(f => f.trim());
                            let hook = '';
                            let closing = 'Dziękujemy za wspólny czas!';
                            let mood = DEFAULT_MOOD;
                            let icons = ['✨', '✨', '✨'];
                            try {
                                const resCombined = await fetch('/api/chat', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ prompt: contextUser, system: combinedSystem, temperature: 0.85, format: 'json', model: 'gpt-4o-mini' })
                                });
                                if (resCombined.ok) {
                                    const dataCombined = await resCombined.json();
                                    const parsed = JSON.parse(dataCombined.text);
                                    if (Array.isArray(parsed.facts)) {
                                        let j = 0;
                                        punchy = facts.map(f => f.trim() ? (parsed.facts[j++] || f.trim()) : '');
                                    }
                                    if (typeof parsed.hook === 'string' && parsed.hook.trim()) hook = parsed.hook.trim();
                                    if (typeof parsed.closing === 'string' && parsed.closing.trim()) closing = parsed.closing.trim();
                                    if (MOOD_THEMES[parsed.mood]) mood = parsed.mood;
                                    if (Array.isArray(parsed.icons)) {
                                        let k = 0;
                                        const defaultIcons = icons;
                                        icons = facts.map((f, idx) => f.trim() ? (parsed.icons[k++] || defaultIcons[idx]) : defaultIcons[idx]);
                                    }
                                }
                            } catch (e) { console.log('Nie udało się spersonalizować przez AI, używam wersji domyślnej.'); }

                            punchyFactsRef.current = punchy;
                            hookRef.current = hook;
                            closingLineRef.current = closing;
                            themeRef.current = MOOD_THEMES[mood] || MOOD_THEMES[DEFAULT_MOOD];
                            iconsRef.current = icons;

                            setStage('recording');
                            setStatusText('Nagrywam wideo...');
                            playAndRecord();
                        } catch (err) {
                            showToast('Błąd: ' + err.message);
                            setStage('form');
                        }
                    },
                    (limitMsg) => { showToast(limitMsg); },
                    (toastMsg) => { showToast(toastMsg); }
                );
            };

            const handleReplay = () => {
                setStage('recording'); setStatusText('Nagrywam wideo...'); playAndRecord();
            };

            const updateFact = (i, val) => {
                const next = [...facts]; next[i] = val; setFacts(next);
            };

            return (
                <div className="min-h-screen">
                    <main className="max-w-md mx-auto px-4 py-10">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center gap-2 bg-[#2A2170] text-[#FFC145] text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-4">
                                <i className="ph-bold ph-film-strip"></i> EduPodsumowanie
                            </div>
                            <h1 className="display-font text-3xl font-extrabold text-white mb-2">Roczne podsumowanie klasy</h1>
                            <p className="text-sm text-[#A79FE0]">Podaj fakty (i opcjonalnie opis roku) - AI naprawdę je analizuje i personalizuje wideo: dobiera nastrój, kolory i ton.</p>
                        </div>

                        {!isPremium && (
                            <div className="max-w-sm mx-auto mb-6 flex items-center gap-2 bg-[#1b1447] border-2 border-[#3A2F8C] rounded-2xl p-2">
                                <input type="text" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} placeholder="Masz kod PRO? Wpisz tutaj..." className="flex-1 bg-transparent text-sm px-3 py-2 outline-none text-white placeholder-[#8981C2]" />
                                <button onClick={handleVerifyCode} className="bg-[#FF5DA2] text-white text-xs font-bold px-4 py-2.5 rounded-xl">Odblokuj</button>
                            </div>
                        )}

                        {stage === 'form' && (
                            <div className="card-panel p-5 space-y-5">
                                <div>
                                    <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Nazwa/opis klasy</label>
                                    <input type="text" value={className} onChange={(e) => setClassName(e.target.value)} maxLength="40" placeholder="np. Klasa 4B" className="w-full fact-input" />
                                </div>

                                <div>
                                    <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Opisz swoją klasę/rok (opcjonalnie)</label>
                                    <textarea value={description} onChange={(e) => setDescription(e.target.value)} maxLength="400" rows="3" placeholder="np. Byliśmy bardzo aktywni sportowo, dużo razem świętowaliśmy, klasa pełna energii i pomysłów..." className="w-full fact-input resize-none" />
                                    <p className="text-[10px] text-[#8981C2] mt-1">AI przeanalizuje to razem z faktami i dobierze nastrój, kolory i ton całego wideo.</p>
                                </div>

                                {[0, 1, 2].map(i => (
                                    <div key={i}>
                                        <label className="text-xs font-black uppercase text-[#A79FE0] mb-2 block">Fakt / wydarzenie {i + 1}</label>
                                        <input type="text" value={facts[i]} onChange={(e) => updateFact(i, e.target.value)} maxLength="120" placeholder={FACT_PLACEHOLDERS[i]} className="w-full fact-input" />
                                    </div>
                                ))}

                                <button onClick={handleGenerate} className="generate-btn w-full text-white display-font font-bold text-lg py-4 rounded-2xl">
                                    Wygeneruj wideo-podsumowanie
                                </button>
                            </div>
                        )}

                        {(stage === 'generating' || stage === 'recording' || stage === 'done') && (
                            <div className="card-panel p-5">
                                <div className="relative w-full max-w-[300px] mx-auto rounded-3xl overflow-hidden shadow-lg" style={{ aspectRatio: '9/16' }}>
                                    <canvas ref={canvasRef} className="w-full h-full block bg-[#1b1447]"></canvas>
                                    {stage === 'generating' && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-[#1b1447]">
                                            <i className="ph-bold ph-sparkle text-5xl text-[#FF5DA2] animate-pulse"></i>
                                        </div>
                                    )}
                                </div>
                                {stage !== 'done' && (
                                    <React.Fragment>
                                        <div className="h-1.5 bg-[#2A2170] rounded-full overflow-hidden mt-4 max-w-[300px] mx-auto">
                                            <div className="h-full bg-gradient-to-r from-[#FF5DA2] to-[#7B5CFF] transition-all" style={{ width: progressPct + '%' }}></div>
                                        </div>
                                        <p className="text-center text-xs text-[#A79FE0] mt-2">{statusText}</p>
                                    </React.Fragment>
                                )}
                                {stage === 'done' && (
                                    <div className="flex gap-2 mt-4 max-w-[300px] mx-auto">
                                        <a href={downloadUrl} download="edupodsumowanie.webm" className="flex-1 bg-[#57E6C4] text-[#0f0a2e] text-center font-bold text-sm py-3 rounded-xl">⬇ Pobierz wideo</a>
                                        <button onClick={handleReplay} className="flex-1 bg-transparent border-2 border-[#3A2F8C] text-[#ECE9FF] font-bold text-sm py-3 rounded-xl">↻ Podgląd</button>
                                    </div>
                                )}
                                {stage === 'done' && (
                                    <button onClick={() => { setStage('form'); setDownloadUrl(null); }} className="w-full text-center text-xs text-[#A79FE0] font-bold mt-4 underline">Zrób kolejne podsumowanie</button>
                                )}
                            </div>
                        )}

                        <p className="text-center text-[11px] text-[#A79FE0] mt-6 leading-relaxed">Nagrywanie tworzy prawdziwy plik wideo (WebM) w Twojej przeglądarce - do AI wysyłamy tylko wpisany tekst (fakty i opis), żeby dopracować treść i dobrać nastrój wideo.</p>
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#1b1447] border border-[#3A2F8C] text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl">{toastMessage}</div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>

</body></html>
