        // ---------- zakładka: Dokumenty (odczyt plików LOKALNIE) ----------
        const LIBS = {
            pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
            pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
            mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js',
            tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
            tessWorker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
            tessCore: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
            tessLang: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/pol/4.0.0_best_int'
        };
        const scriptCache = {};
        const loadScript = (src) => scriptCache[src] || (scriptCache[src] = new Promise((resolve, reject) => {
            const sc = document.createElement('script');
            sc.src = src;
            sc.onload = resolve;
            sc.onerror = () => { delete scriptCache[src]; reject(new Error('Nie udało się wczytać biblioteki do odczytu plików. Sprawdź internet i spróbuj ponownie.')); };
            document.head.appendChild(sc);
        }));
        const MAX_OCR_PAGES = 15;

        // Rozpoznawanie tekstu chodzi w przeglądarce (WebAssembly). Skan z PESEL-em nie trafia do żadnego OCR w chmurze.
        async function ocrImages(sources, onProgress) {
            await loadScript(LIBS.tesseract);
            const worker = await window.Tesseract.createWorker('pol', 1, {
                workerPath: LIBS.tessWorker, corePath: LIBS.tessCore, langPath: LIBS.tessLang,
                logger: (m) => { if (m.status === 'recognizing text') onProgress(`Rozpoznaję tekst… ${Math.round((m.progress || 0) * 100)}%`); else if (/load/.test(m.status || '')) onProgress('Pobieram słownik polski do rozpoznawania (jednorazowo, ok. 3 MB)…'); }
            });
            try {
                const out = [];
                for (let i = 0; i < sources.length; i++) {
                    onProgress(`Rozpoznaję stronę ${i + 1} z ${sources.length}…`);
                    const { data } = await worker.recognize(sources[i]);
                    out.push(data.text || '');
                }
                return out.join('\n\n');
            } finally { await worker.terminate(); }
        }

        async function readDocument(file, onProgress) {
            const ext = ((file.name || '').split('.').pop() || '').toLowerCase();
            if (ext === 'doc') throw new Error('Stary format .doc – otwórz plik w Wordzie i zapisz jako .docx albo PDF.');
            if (ext === 'txt') return { text: await file.text(), ocr: false, pages: 1 };
            if (ext === 'docx') {
                onProgress('Czytam dokument Word…');
                await loadScript(LIBS.mammoth);
                const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                return { text: r.value || '', ocr: false, pages: 1 };
            }
            if (['jpg', 'jpeg', 'png', 'webp', 'bmp'].includes(ext) || /^image\//.test(file.type)) {
                if (/heic|heif/.test(ext + file.type)) throw new Error('Zdjęcie w formacie HEIC (iPhone) – zapisz je jako JPG albo zrób skan do PDF.');
                const zeZdjecia = await ocrImages([file], onProgress);
                if (!Z.textQuality(zeZdjecia).ok) throw new Error('Ze zdjęcia nie udało się odczytać tekstu. Zrób je prosto nad kartką, w dobrym świetle, bez cienia i tak, żeby wypełniała cały kadr.');
                return { text: zeZdjecia, ocr: true, pages: 1 };
            }
            if (ext !== 'pdf') throw new Error('Obsługiwane pliki: PDF, Word (.docx), zdjęcia (JPG, PNG) i .txt.');
            onProgress('Czytam PDF…');
            await loadScript(LIBS.pdf);
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
            const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
            const parts = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const tc = await (await pdf.getPage(i)).getTextContent();
                parts.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+\n/g, '\n'));
            }
            const text = parts.join('\n\n');
            // Sama liczba znaków nic nie mówi: PDF z czcionką bez mapy znaków zwraca tysiące glifów-krzaków.
            // Liczy się, czy to w ogóle jest tekst — jeśli nie, renderujemy strony i rozpoznajemy je jak skan.
            const dosc = text.replace(/\s/g, '').length >= 40 * pdf.numPages;
            const jakosc = Z.textQuality(text);
            if (dosc && jakosc.ok) return { text, ocr: false, pages: pdf.numPages };
            const zepsuty = dosc && !jakosc.ok;
            const n = Math.min(pdf.numPages, MAX_OCR_PAGES);
            const canvases = [];
            for (let i = 1; i <= n; i++) {
                onProgress(zepsuty
                    ? `Ten PDF ma uszkodzoną warstwę tekstową (${Z.qualityMessage(jakosc)}) – rozpoznaję go jak skan, strona ${i} z ${n}…`
                    : `To skan – przygotowuję stronę ${i} z ${n} do rozpoznania…`);
                const page = await pdf.getPage(i);
                const vp = page.getViewport({ scale: 2 });
                const c = document.createElement('canvas');
                c.width = vp.width; c.height = vp.height;
                await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
                canvases.push(c);
            }
            const rozpoznany = await ocrImages(canvases, onProgress);
            const poOcr = Z.textQuality(rozpoznany);
            if (!poOcr.ok) {
                throw new Error(zepsuty
                    ? 'Ten PDF ma uszkodzoną warstwę tekstową, a rozpoznawanie obrazu też nic nie dało. Spróbuj zapisać go jeszcze raz (Drukuj → Zapisz jako PDF) albo zrób wyraźne zdjęcie wydruku.'
                    : 'Nie udało się odczytać tekstu z tego pliku. Jeśli to skan, zrób go prosto i w dobrym świetle.');
            }
            return { text: rozpoznany, ocr: true, pages: pdf.numPages, cut: pdf.numPages > n, naprawiony: zepsuty };
        }

        function DocForm({ doc, isNew, onSave, onClose, onDelete }) {
            const [d, setD] = useState(() => Object.assign(Z.newDoc(), doc || {}));
            const [progress, setProgress] = useState('');
            const [err, setErr] = useState('');
            const [podglad, setPodglad] = useState(false);
            const fileRef = useRef(null);
            const set = (k, v) => setD(prev => Object.assign({}, prev, { [k]: v }));

            const wczytaj = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                setErr(''); setProgress('Otwieram plik…');
                try {
                    const r = await readDocument(f, setProgress);
                    const clean = String(r.text || '').replace(/\u0000/g, '').trim();
                    if (clean.replace(/\s/g, '').length < 20) throw new Error('Nie udało się odczytać tekstu. Jeśli to zdjęcie, zrób je prosto i w dobrym świetle.');
                    const info = Z.extractDocInfo(clean);
                    setD(prev => Object.assign({}, prev, {
                        tekst: clean, ocr: r.ocr,
                        rodzaj: prev.rodzaj === 'inne' ? info.rodzaj : prev.rodzaj,
                        tytul: prev.tytul || info.tytul,
                        data: prev.data || info.data,
                        placowka: prev.placowka || info.placowka,
                        lekarz: prev.lekarz || info.lekarz
                    }));
                    setProgress((r.naprawiony ? 'Ten PDF miał uszkodzoną warstwę tekstową, więc odczytałem go jak skan. ' : '')
                        + (r.cut ? `Odczytano ${MAX_OCR_PAGES} z ${r.pages} stron (reszta pominięta).` : `Odczytano ${r.pages} ${Z.plural(r.pages, 'stronę', 'strony', 'stron')}${r.ocr ? ' (rozpoznawanie tekstu)' : ''}.`));
                } catch (x) { setErr(x.message); setProgress(''); }
            };

            return (
                <Modal title={isNew ? 'Nowy dokument' : (doc.tytul || 'Dokument')} onClose={onClose} wide>
                    <Note tone="info">
                        Plik jest czytany w tej przeglądarce — PDF przez pdf.js, skan i zdjęcie przez rozpoznawanie tekstu
                        w WebAssembly. Nic nie jest wysyłane na żaden serwer. W kartotece zostaje sam tekst, zaszyfrowany.
                    </Note>

                    <div className="mt-4 flex flex-wrap items-center gap-3">
                        <button className="btn btn-soft" onClick={() => fileRef.current.click()}><Icon name="upload-simple" /> Wczytaj plik (PDF, Word, zdjęcie)</button>
                        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,image/*" className="hidden" onChange={wczytaj} />
                        {progress ? <span className="text-xs text-slate-400">{progress}</span> : null}
                    </div>
                    {err ? <div className="mt-3"><Note tone="stop">{err}</Note></div> : null}

                    <div className="grid sm:grid-cols-2 gap-4 mt-5">
                        <Field label="Rodzaj">
                            <select className="field" value={d.rodzaj} onChange={e => set('rodzaj', e.target.value)}>
                                {Z.RODZAJE_DOKUMENTOW.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
                            </select>
                        </Field>
                        <Field label="Tytuł"><input className="field" value={d.tytul} onChange={e => set('tytul', e.target.value)} placeholder="np. Morfologia krwi" /></Field>
                        <Field label="Data dokumentu"><input type="date" className="field" value={d.data} onChange={e => set('data', e.target.value)} /></Field>
                        <Field label="Placówka"><input className="field" value={d.placowka} onChange={e => set('placowka', e.target.value)} /></Field>
                        <Field label="Lekarz"><input className="field" value={d.lekarz} onChange={e => set('lekarz', e.target.value)} /></Field>
                        <Field label="Moja notatka"><input className="field" value={d.uwagi} onChange={e => set('uwagi', e.target.value)} placeholder="o co chodziło, co dalej" /></Field>
                    </div>

                    {d.tekst ? (
                        <div className="mt-5">
                            <button className="text-xs underline text-slate-400 hover:text-slate-200" onClick={() => setPodglad(!podglad)}>
                                {podglad ? 'Ukryj' : 'Pokaż'} odczytany tekst ({d.tekst.length.toLocaleString('pl')} znaków){d.ocr ? ' — z rozpoznawania, może mieć literówki' : ''}
                            </button>
                            {podglad ? <textarea className="field mt-2 font-mono text-xs" style={{ minHeight: '240px' }} value={d.tekst} onChange={e => set('tekst', e.target.value)} /> : null}
                        </div>
                    ) : null}

                    <div className="flex flex-wrap gap-2 mt-6">
                        <button className="btn btn-main" disabled={!d.tytul.trim() && !d.tekst} onClick={() => onSave(Object.assign({}, d, { tytul: d.tytul.trim() || 'Dokument' }))}><Icon name="check" /> Zapisz</button>
                        <button className="btn btn-soft" onClick={onClose}>Anuluj</button>
                        {onDelete ? <button className="btn btn-danger sm:ml-auto" onClick={() => { if (confirm('Usunąć ten dokument z kartoteki?')) onDelete(doc.id); }}>Usuń</button> : null}
                    </div>
                </Modal>
            );
        }

        function Dokumenty({ vault, save }) {
            const [edit, setEdit] = useState(null);
            const [filtr, setFiltr] = useState('');
            const lista = vault.dokumenty
                .filter(d => !filtr || d.rodzaj === filtr)
                .slice().sort((a, b) => String(b.data || b.utworzono).localeCompare(String(a.data || a.utworzono)));

            const zapisz = (d) => {
                const exists = vault.dokumenty.some(x => x.id === d.id);
                save(Object.assign({}, vault, { dokumenty: exists ? vault.dokumenty.map(x => x.id === d.id ? d : x) : [...vault.dokumenty, d] }));
                setEdit(null);
            };
            const usun = (id) => { save(Object.assign({}, vault, { dokumenty: vault.dokumenty.filter(x => x.id !== id) })); setEdit(null); };

            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-extrabold">Dokumenty</h2>
                        <button className="btn btn-main" onClick={() => setEdit(Z.newDoc())}><Icon name="plus" /> Wczytaj dokument</button>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        <button className="tab" aria-pressed={!filtr} onClick={() => setFiltr('')}>Wszystkie ({vault.dokumenty.length})</button>
                        {Z.RODZAJE_DOKUMENTOW.map(r => {
                            const n = vault.dokumenty.filter(d => d.rodzaj === r.id).length;
                            return n ? <button key={r.id} className="tab" aria-pressed={filtr === r.id} onClick={() => setFiltr(r.id)}>{r.label} ({n})</button> : null;
                        })}
                    </div>

                    {lista.length ? (
                        <div className="space-y-2">
                            {lista.map(d => (
                                <button key={d.id} className="card w-full text-left p-4 hover:border-slate-700" onClick={() => setEdit(d)}>
                                    <div className="flex items-start justify-between gap-3">
                                        <div className="min-w-0">
                                            <div className="font-extrabold truncate">{d.tytul}</div>
                                            <div className="text-xs text-slate-400 mt-0.5">
                                                {(Z.RODZAJE_DOKUMENTOW.find(r => r.id === d.rodzaj) || {}).label}
                                                {d.data ? ' · ' + Z.formatDatePl(d.data) : ''}{d.placowka ? ' · ' + d.placowka : ''}
                                            </div>
                                            {d.uwagi ? <div className="text-xs text-slate-500 mt-1">{d.uwagi}</div> : null}
                                        </div>
                                        {d.ocr ? <span className="pill pill-sprawdz shrink-0">skan</span> : null}
                                    </div>
                                </button>
                            ))}
                        </div>
                    ) : <div className="card p-6 text-center text-sm text-slate-400">Brak dokumentów{filtr ? ' w tej kategorii' : ''}.</div>}

                    {edit ? <DocForm doc={edit} isNew={!vault.dokumenty.some(x => x.id === edit.id)} onSave={zapisz} onClose={() => setEdit(null)} onDelete={vault.dokumenty.some(x => x.id === edit.id) ? usun : null} /> : null}
                </div>
            );
        }

        // ---------- zakładka: Kartki do druku ----------
        const esc = escapeHtml;
        const akapity = (txt) => String(txt || '').split(/\n+/).filter(Boolean).map(l => `<p>${esc(l)}</p>`).join('') || '<p>—</p>';

        function visitCardHtml(vault) {
            const k = Z.visitCard(vault);
            const leki = k.leki.length
                ? `<table><thead><tr><th>Lek</th><th>Dawkowanie</th><th>Na co</th></tr></thead><tbody>${k.leki.map(l => `<tr><td><strong>${esc(l.nazwa)}</strong></td><td>${esc(l.dawkowanie)}</td><td>${esc(l.naCo)}</td></tr>`).join('')}</tbody></table>`
                : '<p>Nie przyjmuję leków na stałe.</p>';
            const pytania = k.pytania.length
                ? `<h2>Moje pytania</h2><ol>${k.pytania.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`
                : '';
            const urzadzenia = k.urzadzenia.length
                ? `<h2>Wszczepione urządzenia i implanty</h2><table><thead><tr><th>Urządzenie</th><th>Szczegóły</th></tr></thead><tbody>${k.urzadzenia.map(u => `<tr><td><strong>${esc(u.nazwa)}</strong></td><td>${esc(u.szczegoly)}</td></tr>`).join('')}</tbody></table><p><strong>Uwaga przed badaniami:</strong> ${esc(k.urzadzenia.flatMap(u => u.ostrzezenia).join(' '))}</p>`
                : '';
            const skora = k.skora.length
                ? `<h2>Obserwowane zmiany skórne</h2>${k.skora.map(z => `<p><strong>${esc(z.nazwa)}</strong>${z.lokalizacja ? ' — ' + esc(z.lokalizacja) : ''}${z.odKiedy ? ', od ' + esc(z.odKiedy) : ''}: ${esc(z.opis)}${z.ostrzezenia.length ? ' <em>(' + esc(z.ostrzezenia.join(' ')) + ')</em>' : ''}</p>`).join('')}`
                : '';
            const badania = k.ostatnieBadania.length
                ? `<h2>Ostatnie badania</h2>${k.ostatnieBadania.map(b => {
                    const naglowek = `<p><strong>${esc(b.data)}</strong> — ${esc(b.opis)} (${b.ile} ${Z.plural(b.ile, 'parametr', 'parametry', 'parametrów')}, poza normą: ${b.odstajace.length})</p>`;
                    const tabela = b.odstajace.length
                        ? `<table><thead><tr><th>Parametr</th><th>Wynik</th><th>Norma z wydruku</th></tr></thead><tbody>${b.odstajace.map(x => `<tr><td>${esc(x.parametr)}</td><td><strong>${esc(x.wynik)}</strong> (${esc(x.kierunek)})</td><td>${esc(x.norma) || '—'}</td></tr>`).join('')}</tbody></table>`
                        : '';
                    return naglowek + tabela;
                }).join('')}`
                : '';
            const trendy = k.trendy.length
                ? `<h2>Co się zmienia w kolejnych badaniach</h2><table><thead><tr><th>Parametr</th><th>Kolejne wyniki</th><th>Kierunek</th></tr></thead><tbody>${k.trendy.map(t => `<tr><td>${esc(t.parametr)}${t.jednostka ? ' [' + esc(t.jednostka) + ']' : ''}</td><td>${esc(t.ciag)}</td><td>${esc(t.kierunek)}</td></tr>`).join('')}</tbody></table>`
                : '';
            return `<h1>Karta na wizytę</h1>
                <table><tbody>
                  <tr><th style="width:30%">Pacjent</th><td>${esc(k.kto)}</td></tr>
                  <tr><th>Data</th><td>${esc(k.data)}</td></tr>
                </tbody></table>
                <h2>Rozpoznania i choroby przewlekłe</h2>${akapity(k.choroby)}
                <h2>Uczulenia i nietolerancje</h2>${akapity(k.alergie)}
                ${urzadzenia}
                <h2>Leki przyjmowane na stałe</h2>${leki}
                ${badania}
                ${trendy}
                ${skora}
                ${k.uwagi ? '<h2>Dodatkowe informacje</h2>' + akapity(k.uwagi) : ''}
                ${pytania}
                <h2>Notatki z wizyty</h2><p class="linia"></p><p class="linia"></p><p class="linia"></p><p class="linia"></p><p class="linia"></p><p class="linia"></p>`;
        }

        function iceCardHtml(vault) {
            const k = Z.iceCard(vault);
            const row = (a, b) => `<tr><th style="width:34%">${esc(a)}</th><td>${esc(b) || '—'}</td></tr>`;
            const urzadzenia = k.urzadzenia.length
                ? `<p style="border:2px solid #000;padding:8px"><strong>UWAGA — wszczepione urządzenia:</strong> ${esc(k.urzadzenia.map(u => u.nazwa).join('; '))}.<br>${esc(k.urzadzenia.flatMap(u => u.ostrzezenia).join(' '))}</p>`
                : '';
            return `<h1>W razie wypadku (ICE)</h1>
                ${urzadzenia}
                <table><tbody>
                  ${row('Imię i nazwisko', k.imie)}
                  ${row('Wiek', k.wiek ? k.wiek + ' lat' : '')}
                  ${row('Grupa krwi', k.grupaKrwi)}
                  ${row('Uczulenia', k.alergie)}
                  ${row('Choroby przewlekłe', k.choroby)}
                  ${row('Leki na stałe', k.leki.join(', '))}
                </tbody></table>
                <h2>Powiadomić</h2>
                <table><tbody>${k.ice.length ? k.ice.map(x => `<tr><th style="width:34%">${esc(x.kto)}</th><td>${esc(x.telefon)}</td></tr>`).join('') : '<tr><td>Nie wpisano kontaktów.</td></tr>'}</tbody></table>
                <p><em>Kartka wydrukowana z prywatnej kartoteki — dane nie są nigdzie przechowywane poza urządzeniem właściciela.</em></p>`;
        }

        function relativeCardHtml(vault) {
            const k = Z.relativeCard(vault);
            const row = (a, b) => `<tr><th style="width:32%">${esc(a)}</th><td>${esc(b) || '—'}</td></tr>`;
            const leki = k.leki.length
                ? `<table><thead><tr><th>Lek</th><th>Dawkowanie</th><th>Na co</th></tr></thead><tbody>${k.leki.map(l => `<tr><td><strong>${esc(l.nazwa)}</strong></td><td>${esc(l.dawkowanie)}</td><td>${esc(l.naCo)}</td></tr>`).join('')}</tbody></table>`
                : '<p>Brak leków na stałe.</p>';
            const urzadzenia = k.urzadzenia.length
                ? `<h2>Wszczepione urządzenia</h2><p style="border:2px solid #000;padding:8px"><strong>${esc(k.urzadzenia.map(u => u.nazwa).join('; '))}</strong><br>${esc(k.urzadzenia.flatMap(u => u.ostrzezenia).join(' '))}</p>`
                : '';
            const lekarze = k.lekarze.length
                ? `<h2>Lekarze i placówki</h2><table><tbody>${k.lekarze.map(l => `<tr><th style="width:40%">${esc(l.kto)}</th><td>${esc([l.telefon, l.miejsce].filter(Boolean).join(', '))}</td></tr>`).join('')}</tbody></table>`
                : '';
            const terminy = k.terminy.length
                ? `<h2>Najbliższe terminy</h2><ul>${k.terminy.map(t => `<li>${esc(t.co)} — ${esc(t.kiedy)}</li>`).join('')}</ul>`
                : '';
            const ice = k.ice.length
                ? `<h2>Kogo powiadomić</h2><table><tbody>${k.ice.map(x => `<tr><th style="width:40%">${esc(x.kto)}</th><td>${esc(x.telefon)}</td></tr>`).join('')}</tbody></table>`
                : '';
            return `<h1>Co trzeba o mnie wiedzieć</h1>
                <table><tbody>${row('Osoba', k.kto)}${row('Grupa krwi', k.grupaKrwi)}${row('Uczulenia', k.alergie)}</tbody></table>
                <h2>Choroby przewlekłe</h2>${akapity(k.choroby)}
                ${urzadzenia}
                <h2>Leki przyjmowane na stałe</h2>${leki}
                ${lekarze}
                ${terminy}
                ${ice}
                ${k.uwagi ? '<h2>Inne ważne informacje</h2>' + akapity(k.uwagi) : ''}
                <p><em>Kartka dla bliskiej osoby — wydruk z prywatnej kartoteki, stan na ${esc(Z.formatDatePl(Z.today()))}.</em></p>`;
        }

        function Kartki({ vault, save }) {
            const [nowePytanie, setNowePytanie] = useState('');
            const otwarte = vault.pytania.filter(p => !p.zadane);
            const zadane = vault.pytania.filter(p => p.zadane);

            const dodaj = () => {
                const t = nowePytanie.trim();
                if (!t) return;
                save(Object.assign({}, vault, { pytania: [...vault.pytania, Object.assign(Z.newQuestion(), { tekst: t })] }));
                setNowePytanie('');
            };
            const przelacz = (id) => save(Object.assign({}, vault, { pytania: vault.pytania.map(p => p.id === id ? Object.assign({}, p, { zadane: !p.zadane }) : p) }));
            const usun = (id) => save(Object.assign({}, vault, { pytania: vault.pytania.filter(p => p.id !== id) }));
            const drukuj = (html, tytul) => DT.printDoc(html, tytul);

            return (
                <div className="space-y-5">
                    <h2 className="text-2xl font-extrabold">Kartki do druku</h2>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Karta na wizytę</h3>
                        <p className="text-sm text-slate-400 mb-4">Jedna kartka A4: choroby, uczulenia, leki z dawkowaniem, ostatnie badania i Twoje pytania. Na dole miejsce na notatki z gabinetu.</p>
                        <div className="flex flex-wrap gap-2">
                            <button className="btn btn-main" onClick={() => drukuj(visitCardHtml(vault), 'Karta na wizytę')}><Icon name="printer" /> Drukuj / zapisz PDF</button>
                            <button className="btn btn-soft" onClick={() => DT.copyRich(visitCardHtml(vault))}><Icon name="copy" /> Kopiuj</button>
                        </div>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Karta ICE do portfela</h3>
                        <p className="text-sm text-slate-400 mb-4">Grupa krwi, uczulenia, leki i kontakt do bliskich — to, czego ratownik szuka najpierw.</p>
                        <button className="btn btn-main" onClick={() => drukuj(iceCardHtml(vault), 'Karta ICE')}><Icon name="printer" /> Drukuj / zapisz PDF</button>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Kartka dla bliskiej osoby</h3>
                        <p className="text-sm text-slate-400 mb-4">Wszystko, co żona albo syn muszą wiedzieć, gdyby trzeba było zadzwonić po pomoc albo pojechać z Tobą do szpitala: leki, urządzenia, lekarze, najbliższe terminy. Ta kartka zostaje w domu.</p>
                        <div className="flex flex-wrap gap-2">
                            <button className="btn btn-main" onClick={() => drukuj(relativeCardHtml(vault), 'Co trzeba o mnie wiedzieć')}><Icon name="printer" /> Drukuj / zapisz PDF</button>
                            <button className="btn btn-soft" onClick={() => DT.copyRich(relativeCardHtml(vault))}><Icon name="copy" /> Kopiuj</button>
                        </div>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Pytania do lekarza</h3>
                        <p className="text-sm text-slate-400 mb-4">Zapisuj je, kiedy przyjdą do głowy — na karcie na wizytę wydrukują się same.</p>
                        <div className="flex gap-2">
                            <input className="field" value={nowePytanie} onChange={e => setNowePytanie(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter') dodaj(); }} placeholder="np. czy mogę łączyć te dwa leki?" />
                            <button className="btn btn-main shrink-0" onClick={dodaj}>Dodaj</button>
                        </div>
                        {otwarte.length ? (
                            <ul className="mt-4 space-y-2">
                                {otwarte.map(p => (
                                    <li key={p.id} className="flex items-start gap-3 text-sm">
                                        <input type="checkbox" className="w-4 h-4 mt-0.5 accent-teal-400" checked={false} onChange={() => przelacz(p.id)} title="Oznacz jako zadane" />
                                        <span className="flex-1">{p.tekst}</span>
                                        <button className="text-slate-500 hover:text-red-300" onClick={() => usun(p.id)} aria-label="Usuń pytanie">×</button>
                                    </li>
                                ))}
                            </ul>
                        ) : <p className="mt-4 text-sm text-slate-500">Brak otwartych pytań.</p>}
                        {zadane.length ? (
                            <details className="mt-4">
                                <summary className="cursor-pointer text-xs font-bold text-slate-500">Zadane ({zadane.length})</summary>
                                <ul className="mt-2 space-y-1 text-sm text-slate-500">
                                    {zadane.map(p => (
                                        <li key={p.id} className="flex items-start gap-3">
                                            <button className="underline" onClick={() => przelacz(p.id)}>przywróć</button>
                                            <span className="flex-1 line-through">{p.tekst}</span>
                                            <button className="hover:text-red-300" onClick={() => usun(p.id)} aria-label="Usuń pytanie">×</button>
                                        </li>
                                    ))}
                                </ul>
                            </details>
                        ) : null}
                    </div>
                </div>
            );
        }

        // ---------- zakładka: Profil ----------
        function Profil({ vault, save }) {
            const p = vault.profil;
            const set = (k, v) => save(Object.assign({}, vault, { profil: Object.assign({}, p, { [k]: v }) }));
            const setIce = (i, k, v) => set('ice', p.ice.map((x, j) => j === i ? Object.assign({}, x, { [k]: v }) : x));
            const wiek = Z.ageYears(p.dataUr);

            return (
                <div className="space-y-5">
                    <h2 className="text-2xl font-extrabold">Profil</h2>
                    <Note tone="info">Te dane zostają w przeglądarce i wchodzą na kartki do druku. Do AI nigdy nie trafia imię, nazwisko, PESEL ani data urodzenia — tylko wiek, płeć i opis zdrowia.</Note>

                    <div className="card p-5 grid sm:grid-cols-2 gap-4">
                        <Field label="Imię"><input className="field" value={p.imie} onChange={e => set('imie', e.target.value)} /></Field>
                        <Field label="Nazwisko"><input className="field" value={p.nazwisko} onChange={e => set('nazwisko', e.target.value)} /></Field>
                        <Field label="Data urodzenia" hint={wiek === '' ? '' : `${wiek} lat`}><input type="date" className="field" value={p.dataUr} onChange={e => set('dataUr', e.target.value)} /></Field>
                        <Field label="Płeć" hint="Trafia do AI — wpływa na normy w badaniach">
                            <select className="field" value={p.plec} onChange={e => set('plec', e.target.value)}>
                                <option value="">nie podaję</option><option value="k">kobieta</option><option value="m">mężczyzna</option>
                            </select>
                        </Field>
                        <Field label="Grupa krwi">
                            <select className="field" value={p.grupaKrwi} onChange={e => set('grupaKrwi', e.target.value)}>
                                <option value="">nie podaję</option>
                                {Z.GRUPY_KRWI.map(g => <option key={g} value={g}>{g}</option>)}
                            </select>
                        </Field>
                        <Field label="Zdrobnienie / jak na mnie mówią" hint="Żeby anonimizacja wycięła je z dokumentów">
                            <input className="field" value={p.zdrobnienie} onChange={e => set('zdrobnienie', e.target.value)} />
                        </Field>
                        <Field label="Wzrost (cm)"><input className="field" value={p.wzrost} onChange={e => set('wzrost', e.target.value)} inputMode="numeric" /></Field>
                        <Field label="Waga (kg)"><input className="field" value={p.waga} onChange={e => set('waga', e.target.value)} inputMode="numeric" /></Field>
                    </div>

                    <div className="card p-5 space-y-4">
                        <Field label="Uczulenia i nietolerancje" hint="Oddziel przecinkami — po tej liście sprawdzam nowe leki">
                            <textarea className="field" value={p.alergie} onChange={e => set('alergie', e.target.value)} placeholder="penicylina, jad osy, laktoza" />
                        </Field>
                        <Field label="Rozpoznania i choroby przewlekłe">
                            <textarea className="field" value={p.choroby} onChange={e => set('choroby', e.target.value)} placeholder="nadciśnienie od 2019, niedoczynność tarczycy" />
                        </Field>
                        <Field label="Inne ważne informacje" hint="np. rozrusznik, implant, przebyte operacje">
                            <textarea className="field" value={p.uwagi} onChange={e => set('uwagi', e.target.value)} />
                        </Field>
                    </div>

                    <div className="card p-5">
                        <div className="flex items-center justify-between mb-3">
                            <h3 className="font-extrabold">Kogo powiadomić w razie wypadku</h3>
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => set('ice', [...p.ice, { kto: '', telefon: '' }])}><Icon name="plus" /> Dodaj</button>
                        </div>
                        {p.ice.length ? (
                            <div className="space-y-2">
                                {p.ice.map((x, i) => (
                                    <div key={i} className="flex gap-2">
                                        <input className="field" value={x.kto} onChange={e => setIce(i, 'kto', e.target.value)} placeholder="np. żona Anna" />
                                        <input className="field sm:w-48" value={x.telefon} onChange={e => setIce(i, 'telefon', e.target.value)} placeholder="telefon" inputMode="tel" />
                                        <button className="btn btn-danger !py-1.5 !px-3 shrink-0" onClick={() => set('ice', p.ice.filter((_, j) => j !== i))} aria-label="Usuń kontakt">×</button>
                                    </div>
                                ))}
                            </div>
                        ) : <p className="text-sm text-slate-500">Brak kontaktów. Wejdą na kartkę ICE do portfela.</p>}
                    </div>
                </div>
            );
        }

        // ---------- zakładka: Ustawienia ----------
        function Ustawienia({ vault, save, session, setSession, onLock, onWipe }) {
            const [nowe, setNowe] = useState({ label: '', pass: '', pass2: '' });
            const [komunikat, setKomunikat] = useState('');
            const [podgladAi, setPodgladAi] = useState(false);
            const [udostepnij, setUdostepnij] = useState(false);
            const s = vault.settings;
            const setS = (k, v) => save(Object.assign({}, vault, { settings: Object.assign({}, s, { [k]: v }) }));

            const kopia = async () => {
                const blob = await Z.seal(vault, session);
                const zdjecia = await Z.exportPhotos().catch(() => []);
                download(JSON.stringify(Object.assign({}, blob, { zdjecia })), `moje-zdrowie-kopia-${todayIso()}.json`, 'application/json');
            };
            const kalendarzLekow = () => {
                const ev = Z.medEvents(vault.leki, { alarmMinutes: Number(s.alarmMinutes) || 0 });
                if (!ev.length) return alert('Nie masz wpisanych leków do wyeksportowania.');
                download(Z.buildIcs(ev), 'leki.ics', 'text/calendar;charset=utf-8');
            };
            const dodajHaslo = async () => {
                setKomunikat('');
                try {
                    if (nowe.pass !== nowe.pass2) throw new Error('Hasła się różnią.');
                    const next = await Z.addPassword(session, nowe.pass, nowe.label || 'Hasło zapasowe');
                    setSession(next);
                    setNowe({ label: '', pass: '', pass2: '' });
                    setKomunikat('Dodano hasło. Zapisz je w bezpiecznym miejscu.');
                } catch (x) { setKomunikat(x.message); }
            };
            const usunHaslo = async (id) => {
                try { setSession(Z.removePassword(session, id)); setKomunikat('Hasło usunięte.'); }
                catch (x) { setKomunikat(x.message); }
            };
            const wlaczPowiadomienia = async () => {
                try {
                    if (!window.Notification) return setKomunikat('Ta przeglądarka nie obsługuje powiadomień.');
                    const r = await Notification.requestPermission();
                    setKomunikat(r === 'granted' ? 'Powiadomienia włączone (działają, gdy aplikacja jest otwarta).' : 'Powiadomienia odrzucone — zostaje sam głos i kalendarz.');
                } catch (x) { setKomunikat('Nie udało się włączyć powiadomień.'); }
            };

            return (
                <div className="space-y-5">
                    <h2 className="text-2xl font-extrabold">Ustawienia</h2>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Przypomnienia o lekach</h3>
                        <p className="text-sm text-slate-400 mb-4">
                            Pewne przypomnienie daje kalendarz telefonu — pobierz plik .ics i otwórz go na telefonie.
                            Głos i powiadomienia w aplikacji są dodatkiem i działają tylko przy otwartej karcie.
                        </p>
                        <div className="space-y-3">
                            <label className="flex items-center gap-3 text-sm">
                                <input type="checkbox" className="w-4 h-4 accent-teal-400" checked={!!s.glos} onChange={e => setS('glos', e.target.checked)} />
                                Mów na głos, gdy minie pora leków
                            </label>
                            <Field label="Alarm w kalendarzu — ile minut wcześniej">
                                <input type="number" min="0" max="120" className="field sm:w-40" value={s.alarmMinutes} onChange={e => setS('alarmMinutes', Number(e.target.value) || 0)} />
                            </Field>
                            <Field label="Przypominaj o recepcie, gdy zostało mniej niż (dni)">
                                <input type="number" min="1" max="90" className="field sm:w-40" value={s.refillDays} onChange={e => setS('refillDays', Number(e.target.value) || Z.REFILL_DAYS)} />
                            </Field>
                        </div>
                        <div className="flex flex-wrap gap-2 mt-4">
                            <button className="btn btn-main" onClick={kalendarzLekow}><Icon name="calendar-plus" /> Plan leków do kalendarza (.ics)</button>
                            <button className="btn btn-soft" onClick={wlaczPowiadomienia}><Icon name="bell" /> Włącz powiadomienia</button>
                        </div>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Kopia zapasowa</h3>
                        <p className="text-sm text-slate-400 mb-4">
                            Plik jest zaszyfrowany tym samym hasłem — bez niego to nieczytelny szum, więc spokojnie możesz go trzymać
                            na dysku w chmurze albo przenieść na telefon. Tak samo przenosisz kartotekę na drugie urządzenie.
                        </p>
                        <div className="flex flex-wrap gap-2">
                            <button className="btn btn-main" onClick={kopia}><Icon name="download-simple" /> Pobierz kopię</button>
                            <button className="btn btn-soft" onClick={onLock}><Icon name="lock" /> Zablokuj teraz</button>
                        </div>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Osoba bliska</h3>
                        <p className="text-sm text-slate-400 mb-4">
                            Możesz dać żonie albo dziecku własne hasło i zaszyfrowaną kopię kartoteki. To pełny dostęp do kopii,
                            bez synchronizacji — prowadzę przez to krok po kroku.
                        </p>
                        <button className="btn btn-main" onClick={() => setUdostepnij(true)}><Icon name="users" /> Udostępnij bliskiej osobie</button>
                    </div>

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Hasła ({session.slots.length} z 5)</h3>
                        <p className="text-sm text-slate-400 mb-4">Każde hasło otwiera te same dane. Dobrze mieć drugie, zapisane poza komputerem — zapomnianego nie da się odzyskać.</p>
                        <ul className="space-y-2 mb-4">
                            {session.slots.map(sl => (
                                <li key={sl.id} className="flex items-center gap-3 text-sm">
                                    <Icon name="key" className="text-slate-500" />
                                    <span className="flex-1">{sl.label}{sl.id === session.openedWith ? <span className="text-xs text-teal-300"> — tym otworzyłeś</span> : null}</span>
                                    {sl.id === session.openedWith || session.slots.length <= 1 ? null :
                                        <button className="text-xs underline text-slate-500 hover:text-red-300" onClick={() => usunHaslo(sl.id)}>usuń</button>}
                                </li>
                            ))}
                        </ul>
                        {session.slots.length < 5 ? (
                            <div className="grid sm:grid-cols-3 gap-3">
                                <input className="field" value={nowe.label} onChange={e => setNowe(Object.assign({}, nowe, { label: e.target.value }))} placeholder="nazwa, np. zapasowe" />
                                <input type="password" className="field" value={nowe.pass} onChange={e => setNowe(Object.assign({}, nowe, { pass: e.target.value }))} placeholder="nowe hasło" autoComplete="new-password" />
                                <input type="password" className="field" value={nowe.pass2} onChange={e => setNowe(Object.assign({}, nowe, { pass2: e.target.value }))} placeholder="powtórz" autoComplete="new-password" />
                            </div>
                        ) : null}
                        {session.slots.length < 5 ? <button className="btn btn-soft mt-3" disabled={nowe.pass.length < 8} onClick={dodajHaslo}><Icon name="plus" /> Dodaj hasło</button> : null}
                        {komunikat ? <p className="mt-3 text-sm text-teal-300">{komunikat}</p> : null}
                    </div>

                    {udostepnij ? <Udostepnianie vault={vault} session={session} setSession={setSession} onClose={() => setUdostepnij(false)} /> : null}

                    <div className="card p-5">
                        <h3 className="font-extrabold mb-1">Co zobaczyłaby sztuczna inteligencja</h3>
                        <p className="text-sm text-slate-400 mb-4">
                            Aplikacja wysyła coś na zewnątrz tylko wtedy, gdy sam klikniesz „Przygotuj dokument”, „Wyjaśnij protokół”,
                            „Uporządkuj przebieg” albo „Poproś AI o opis zdjęcia”. Tak wygląda opis, który wtedy wychodzi — bez imienia,
                            PESEL-u, lekarzy, placówek i numerów urządzeń. Przed każdą wysyłką możesz go zobaczyć, a osobna kontrola
                            wstrzyma ją, gdyby cokolwiek się prześlizgnęło.
                        </p>
                        <button className="btn btn-soft" onClick={() => setPodgladAi(!podgladAi)}>{podgladAi ? 'Ukryj' : 'Pokaż'} podgląd</button>
                        {podgladAi ? <pre className="mt-3 whitespace-pre-wrap text-xs bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-300 max-h-96 overflow-y-auto">{Z.reportInput(vault) || '(za mało danych w kartotece)'}</pre> : null}
                    </div>

                    <div className="card p-5 border-red-900/60">
                        <h3 className="font-extrabold mb-1 text-red-300">Blokada i usuwanie</h3>
                        <Field label="Zablokuj po bezczynności (minut)">
                            <input type="number" min="1" max="120" className="field sm:w-40" value={s.lockMinutes} onChange={e => setS('lockMinutes', Number(e.target.value) || 15)} />
                        </Field>
                        <button className="btn btn-danger mt-4" onClick={onWipe}><Icon name="trash" /> Usuń kartotekę z tego urządzenia</button>
                        <p className="text-xs text-slate-500 mt-2">Nieodwracalne. Jeśli masz kopię zapasową i hasło — odtworzysz z niej dane.</p>
                    </div>
                </div>
            );
        }

        // ---------- wspólne: wysyłka do AI z bramką i kartka A4 ----------
        // Nic nie wychodzi z komputera, zanim leaks() nie potwierdzi, że w tekście nie został ślad tożsamości.
        function assertNoLeak(text, vault) {
            const found = Z.leaks(text, vault);
            if (found.length) throw new Error('Wysyłka wstrzymana: w tekście dla AI zostało „' + found.join('”, „') + '”. Popraw zapis i spróbuj jeszcze raz.');
        }

        function AiKartka({ tytul, prompts, vault, model, onZapisz, dodatkowe }) {
            const [stan, setStan] = useState('gotowe');
            const [html, setHtml] = useState('');
            const [err, setErr] = useState('');
            const [podglad, setPodglad] = useState(false);
            const kartkaRef = useRef(null);
            const baseRef = useRef('');

            const start = async () => {
                setErr(''); setStan('pisze'); setHtml('');
                try {
                    assertNoLeak(prompts.prompt, vault);
                    const r = await DT.streamChat(
                        { system: prompts.system, prompt: prompts.prompt, model: model || 'strong', stream: true },
                        (t) => setHtml(DT.normalize(t))
                    );
                    const gotowy = DT.markPlaceholders(DT.normalize(r.text));
                    baseRef.current = gotowy;
                    setHtml(gotowy);
                    setStan('gotowe-tekst');
                } catch (x) { setErr(x.message); setStan('gotowe'); }
            };

            const biezacy = () => (kartkaRef.current && kartkaRef.current.innerHTML) || html;

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap gap-2">
                        <button className="btn btn-main" disabled={stan === 'pisze'} onClick={start}>
                            <Icon name={stan === 'pisze' ? 'circle-notch' : 'sparkle'} />
                            {stan === 'pisze' ? 'Piszę…' : html ? 'Napisz jeszcze raz' : tytul}
                        </button>
                        {html && stan !== 'pisze' ? (
                            <>
                                <button className="btn btn-soft" onClick={() => DT.copyRich(biezacy())}><Icon name="copy" /> Kopiuj</button>
                                <button className="btn btn-soft" onClick={() => DT.downloadDocx(biezacy(), fileSafe(tytul) + '.docx')}><Icon name="file-doc" /> Word</button>
                                <button className="btn btn-soft" onClick={() => DT.printDoc(biezacy(), tytul)}><Icon name="printer" /> Drukuj / PDF</button>
                                {onZapisz ? <button className="btn btn-soft" onClick={() => onZapisz(biezacy())}><Icon name="floppy-disk" /> Zapisz w kartotece</button> : null}
                            </>
                        ) : null}
                        <button className="btn btn-soft sm:ml-auto !text-xs" onClick={() => setPodglad(!podglad)}>
                            <Icon name="eye" /> {podglad ? 'Ukryj' : 'Pokaż'}, co pójdzie do AI
                        </button>
                    </div>

                    {dodatkowe}

                    {podglad ? (
                        <div>
                            <Note tone="info">Dokładnie ten tekst zostanie wysłany. Nie ma w nim imienia, PESEL-u, nazwisk lekarzy, placówek ani numerów urządzeń — przed wysyłką sprawdza to jeszcze raz osobna kontrola.</Note>
                            <pre className="mt-2 whitespace-pre-wrap text-xs bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-300 max-h-80 overflow-y-auto">{prompts.prompt}</pre>
                        </div>
                    ) : null}

                    {err ? <Note tone="stop">{err}</Note> : null}

                    {html ? (
                        <div>
                            {stan === 'gotowe-tekst' ? <p className="text-xs text-slate-500 mb-2">Możesz poprawiać tekst wprost na kartce — eksport bierze to, co widzisz.</p> : null}
                            <div
                                ref={kartkaRef}
                                className="doc-paper"
                                contentEditable={stan === 'gotowe-tekst'}
                                suppressContentEditableWarning
                                dangerouslySetInnerHTML={{ __html: html }}
                            />
                        </div>
                    ) : null}
                </div>
            );
        }

        // ---------- zakładka: Urządzenia (kardiowerter, stymulator, implanty) ----------
        function DeviceCheckForm({ dev, check, onSave, onClose, onDelete, vault }) {
            const [k, setK] = useState(() => {
                const base = Object.assign(Z.newDeviceCheck(), check || {});
                return Object.assign(base, { data: base.data || todayIso() });
            });
            const [progress, setProgress] = useState('');
            const [err, setErr] = useState('');
            const [analiza, setAnaliza] = useState(false);
            const fileRef = useRef(null);
            const set = (f, v) => setK(prev => Object.assign({}, prev, { [f]: v }));

            const wczytaj = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                setErr(''); setProgress('Otwieram plik…');
                try {
                    const r = await readDocument(f, setProgress);
                    const clean = String(r.text || '').replace(/\u0000/g, '').trim();
                    if (clean.replace(/\s/g, '').length < 20) throw new Error('Nie udało się odczytać tekstu z tego pliku.');
                    const info = Z.extractDocInfo(clean);
                    setK(prev => Object.assign({}, prev, { tekst: clean, ocr: r.ocr, data: prev.data || info.data, miejsce: prev.miejsce || info.placowka }));
                    setProgress((r.naprawiony ? 'Ten PDF miał uszkodzoną warstwę tekstową, więc odczytałem go jak skan. ' : '')
                        + `Odczytano ${r.pages} ${Z.plural(r.pages, 'stronę', 'strony', 'stron')}${r.ocr ? ' (rozpoznawanie tekstu)' : ''}.`);
                } catch (x) { setErr(x.message); setProgress(''); }
            };

            const historia = (dev.kontrole || []).filter(x => x.id !== k.id).slice(-2)
                .map(x => `${Z.formatDatePl(x.data)}: ${x.wynik || '—'}${x.bateria ? `, bateria ${x.bateria}` : ''}`).join(' | ') || 'brak zapisanych';
            const anon = k.tekst ? Z.anonymizeDocText(k.tekst, vault) : '';
            const prompts = Z.deviceCheckPrompts(anon, dev, { historia });

            return (
                <Modal title="Kontrola urządzenia" onClose={onClose} wide>
                    <div className="flex flex-wrap items-center gap-3">
                        <button className="btn btn-soft" onClick={() => fileRef.current.click()}><Icon name="upload-simple" /> Wczytaj protokół (PDF, zdjęcie)</button>
                        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,image/*" className="hidden" onChange={wczytaj} />
                        {progress ? <span className="text-xs text-slate-400">{progress}</span> : null}
                    </div>
                    {err ? <div className="mt-3"><Note tone="stop">{err}</Note></div> : null}

                    <div className="grid sm:grid-cols-2 gap-4 mt-5">
                        <Field label="Data kontroli"><input type="date" className="field" value={k.data} onChange={e => set('data', e.target.value)} /></Field>
                        <Field label="Gdzie"><input className="field" value={k.miejsce} onChange={e => set('miejsce', e.target.value)} placeholder="poradnia kontroli urządzeń" /></Field>
                        <Field label="Stan baterii" hint="np. 6,5 roku, 2,78 V, ERI/ERT"><input className="field" value={k.bateria} onChange={e => set('bateria', e.target.value)} /></Field>
                        <Field label="Następna kontrola"><input type="date" className="field" value={k.nastepna} onChange={e => set('nastepna', e.target.value)} /></Field>
                    </div>
                    <div className="mt-4 space-y-4">
                        <Field label="Wynik / co powiedział lekarz"><textarea className="field" value={k.wynik} onChange={e => set('wynik', e.target.value)} /></Field>
                        <Field label="Epizody i interwencje urządzenia" hint="np. liczba epizodów, wyładowania, stymulacja ATP"><textarea className="field" value={k.interwencje} onChange={e => set('interwencje', e.target.value)} /></Field>
                    </div>

                    {k.tekst ? (
                        <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                            <div className="flex items-center justify-between gap-3">
                                <h3 className="font-extrabold text-sm">Wyjaśnij protokół prostym językiem</h3>
                                <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => setAnaliza(!analiza)}>{analiza ? 'Ukryj' : 'Pokaż'}</button>
                            </div>
                            <p className="text-xs text-slate-400 mt-1">AI objaśni skróty i jednostki z protokołu i wypisze pytania na następną wizytę. Nie ocenia, czy urządzenie działa dobrze — to robi poradnia.</p>
                            {analiza ? <div className="mt-4"><AiKartka tytul="Wyjaśnij protokół" prompts={prompts} vault={vault} /></div> : null}
                        </div>
                    ) : null}

                    <div className="flex flex-wrap gap-2 mt-6">
                        <button className="btn btn-main" disabled={!k.data} onClick={() => onSave(k)}><Icon name="check" /> Zapisz kontrolę</button>
                        <button className="btn btn-soft" onClick={onClose}>Anuluj</button>
                        {check && onDelete ? <button className="btn btn-danger sm:ml-auto" onClick={() => { if (confirm('Usunąć tę kontrolę?')) onDelete(check.id); }}>Usuń</button> : null}
                    </div>
                </Modal>
            );
        }

        function DeviceForm({ dev, isNew, onSave, onClose, onDelete, vault }) {
            const [u, setU] = useState(() => Object.assign(Z.newDevice(), dev || {}));
            const [kontrola, setKontrola] = useState(null);
            const set = (k, v) => setU(prev => Object.assign({}, prev, { [k]: v }));
            const typ = Z.deviceType(u);
            const nastepna = Z.nextCheck(u);

            const zapiszKontrole = (k) => {
                const sa = u.kontrole || [];
                const next = sa.some(x => x.id === k.id) ? sa.map(x => x.id === k.id ? k : x) : [...sa, k];
                const najnowsza = next.slice().sort((a, b) => String(a.data).localeCompare(String(b.data))).pop();
                setU(prev => Object.assign({}, prev, {

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <div className="flex items-center justify-between mb-3">
                            <h3 className="font-extrabold text-sm">Kontrole ({(u.kontrole || []).length})</h3>

                                {(u.kontrole || []).slice().sort((a, b) => String(b.data).localeCompare(String(a.data))).map(k => (

                                        <div className="text-sm font-bold">{Z.formatDatePl(k.data) || 'bez daty'}{k.miejsce ? ' · ' + k.miejsce : ''}</div>
                                        <div className="text-xs text-slate-400 mt-0.5">{[k.bateria ? 'bateria: ' + k.bateria : '', k.wynik].filter(Boolean).join(' · ') || 'bez opisu'}</div>

                    <label className="flex items-center gap-2 mt-4 text-sm">

                    </div>

                    {kontrola ? <DeviceCheckForm dev={u} check={(u.kontrole || []).some(x => x.id === kontrola.id) ? kontrola : null} vault={vault}
                        onSave={zapiszKontrole} onClose={() => setKontrola(null)}
                        onDelete={(id) => { setU(prev => Object.assign({}, prev, { kontrole: (prev.kontrole || []).filter(x => x.id !== id) })); setKontrola(null); }} /> : null}
                </Modal>

        }

        function Urzadzenia({ vault, save }) {
            const [edit, setEdit] = useState(null);
            const lista = vault.urzadzenia.filter(u => u.aktywne !== false);
            const dawne = vault.urzadzenia.filter(u => u.aktywne === false);

            const zapisz = (u) => {

                save(Object.assign({}, vault, { urzadzenia: exists ? vault.urzadzenia.map(x => x.id === u.id ? u : x) : [...vault.urzadzenia, u] }));
                setEdit(null);

            const usun = (id) => { save(Object.assign({}, vault, { urzadzenia: vault.urzadzenia.filter(x => x.id !== id) })); setEdit(null); };
            const doKalendarza = () => {

                download(Z.buildIcs(ev), 'kontrole-urzadzen.ics', 'text/calendar;charset=utf-8');
            };

            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-extrabold">Urządzenia i implanty</h2>
                        <div className="flex gap-2">
                            {lista.length ? <button className="btn btn-soft" onClick={doKalendarza}><Icon name="calendar-plus" /> Kontrole do kalendarza</button> : null}
                            <button className="btn btn-main" onClick={() => setEdit(Z.newDevice())}><Icon name="plus" /> Dodaj urządzenie</button>
                        </div>
                    </div>

                    {lista.length ? (
                        <div className="space-y-3">
                            {lista.map(u => {
                                const data = Z.nextCheck(u);
                                const d = data ? Z.daysUntil(data) : null;
                                return (
                                    <div key={u.id} className="card p-4">
                                        <button className="w-full text-left" onClick={() => setEdit(u)}>
                                            <div className="flex items-start justify-between gap-3">
                                                <div className="min-w-0">
                                                    <div className="font-extrabold">{Z.deviceLabel(u)}</div>
                                                    <div className="text-xs text-slate-400 mt-0.5">
                                                        {u.dataWszczepienia ? 'wszczepione ' + Z.formatDatePl(u.dataWszczepienia) : 'bez daty wszczepienia'}
                                                        {u.bateria ? ' · bateria: ' + u.bateria : ''}

                                                    </div>
                                                </div>
                                                {d != null ? <span className={`pill ${d < 0 ? 'pill-stop' : d <= 60 ? 'pill-sprawdz' : 'pill-ok'} shrink-0`}>kontrola {dayWord(d)}</span> : null}
                                            </div>
                                        </button>
                                        <div className="mt-3 text-xs text-amber-200/90 border-t border-slate-800 pt-3">
                                            {Z.deviceWarnings(u).map((w, i) => <p key={i}>⚠️ {w}</p>)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="card p-6 text-center text-sm text-slate-400">
                            <p className="mb-3">Nie masz wpisanych urządzeń ani implantów.</p>
                            <p className="text-xs">Kardiowerter, stymulator, pompa, zastawka, endoproteza — wszystko, o czym musi wiedzieć ratownik i radiolog.</p>
                        </div>
                    )}

                    {dawne.length ? (
                        <details className="card p-4">
                            <summary className="cursor-pointer text-sm font-bold text-slate-400">Usunięte / wymienione ({dawne.length})</summary>
                            <div className="mt-3 space-y-2">
                                {dawne.map(u => <button key={u.id} className="w-full text-left text-sm text-slate-400 hover:text-slate-200" onClick={() => setEdit(u)}>{Z.deviceLabel(u)}</button>)}
                            </div>
                        </details>
                    ) : null}

                    {edit ? <DeviceForm dev={edit} isNew={!vault.urzadzenia.some(x => x.id === edit.id)} vault={vault}
                        onSave={zapisz} onClose={() => setEdit(null)} onDelete={vault.urzadzenia.some(x => x.id === edit.id) ? usun : null} /> : null}
                </div>
            );
        }

        // ---------- zakładka: Skóra ----------
        // Zdjęcie przerysowujemy na canvas: to usuwa dane EXIF (w tym miejsce zrobienia zdjęcia),
        // zmniejsza plik i prostuje orientację z telefonu.
        const FOTO_MAX = 1280;
        async function photoFromFile(file) {
            if (!/^image\//.test(file.type)) throw new Error('To nie jest zdjęcie.');
            let bitmap;
            try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
            catch (e) { throw new Error('Nie udało się otworzyć zdjęcia. Jeśli to HEIC z iPhone’a, zapisz je jako JPG.'); }
            const skala = Math.min(1, FOTO_MAX / Math.max(bitmap.width, bitmap.height));
            const c = document.createElement('canvas');
            c.width = Math.round(bitmap.width * skala);
            c.height = Math.round(bitmap.height * skala);
            c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
            bitmap.close && bitmap.close();
            return { dataUrl: c.toDataURL('image/jpeg', 0.82), szerokosc: c.width, wysokosc: c.height };
        }

        function Zdjecie({ id, session, alt, className }) {
            const [src, setSrc] = useState('');
            useEffect(() => {
                let zywy = true;
                if (!id) { setSrc(''); return; }
                Z.loadPhoto(id, session).then(d => { if (zywy) setSrc(d); }).catch(() => { if (zywy) setSrc(''); });
                return () => { zywy = false; };
            }, [id, session]);
            if (!id) return null;
            return src
                ? <img src={src} alt={alt || 'Zdjęcie zmiany'} className={className || 'rounded-xl border border-slate-800'} />
                : <div className={`rounded-xl border border-slate-800 bg-slate-900 grid place-items-center text-xs text-slate-500 ${className || ''}`} style={{ minHeight: '120px' }}>wczytuję zdjęcie…</div>;
        }

        function SkinEntryForm({ spot, entry, isNew, session, vault, onSave, onClose, onDelete }) {
            const [w, setW] = useState(() => {
                const base = Object.assign(Z.newSkinEntry(), entry || {});
                return Object.assign(base, { data: base.data || todayIso() });
            });
            const [podglad, setPodglad] = useState('');
            const [busy, setBusy] = useState('');
            const [err, setErr] = useState('');
            const fileRef = useRef(null);
            const set = (k, v) => setW(prev => Object.assign({}, prev, { [k]: v }));

            useEffect(() => {
                if (!w.zdjecieId) return;
                Z.loadPhoto(w.zdjecieId, session).then(setPodglad).catch(() => setPodglad(''));
            }, [w.zdjecieId, session]);

            const wczytajZdjecie = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                setErr(''); setBusy('Przygotowuję zdjęcie…');
                try {
                    const foto = await photoFromFile(f);
                    const id = w.zdjecieId || Z.uid();
                    await Z.savePhoto(id, foto.dataUrl, session);
                    setPodglad(foto.dataUrl);
                    set('zdjecieId', id);
                    setBusy('');
                } catch (x) { setErr(x.message); setBusy(''); }
            };

            // Zdjęcie wychodzi z komputera TYLKO po osobnym kliknięciu — i tylko ono, bez żadnych innych danych.
            const opiszZdjecie = async () => {
                if (!podglad) return;
                if (!confirm('Zdjęcie zostanie wysłane do modelu AI, żeby opisał, co na nim widać.\n\nWysyłane jest samo zdjęcie — bez imienia i bez reszty kartoteki. Dane o miejscu i czasie zrobienia zdjęcia zostały już z niego usunięte.\n\nWysłać?')) return;
                setErr(''); setBusy('AI ogląda zdjęcie…');
                try {
                    const res = await fetch('/api/describe-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: 'skin', image_url: podglad })
                    });
                    const j = await res.json();
                    if (!res.ok) throw new Error(j.error || 'Nie udało się opisać zdjęcia.');
                    set('aiOpis', j.description || '');
                    setBusy('');
                } catch (x) { setErr(x.message); setBusy(''); }
            };

            const przelaczDolegliwosc = (d) => set('dolegliwosci', (w.dolegliwosci || []).includes(d)
                ? w.dolegliwosci.filter(x => x !== d)
                : [...(w.dolegliwosci || []), d]);

            return (
                <Modal title={isNew ? 'Nowa obserwacja' : 'Obserwacja z ' + (Z.formatDatePl(w.data) || '—')} onClose={onClose} wide>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="Data"><input type="date" className="field" value={w.data} onChange={e => set('data', e.target.value)} /></Field>
                        <Field label="Rozmiar (mm)" hint="Zmierz linijką w najszerszym miejscu"><input className="field" value={w.rozmiarMm} onChange={e => set('rozmiarMm', e.target.value)} inputMode="decimal" /></Field>
                    </div>

                    <div className="mt-4">
                        <span className="lbl">Dolegliwości</span>
                        <div className="flex flex-wrap gap-2">
                            {Z.DOLEGLIWOSCI.map(d => (
                                <button key={d} className="tab" aria-pressed={(w.dolegliwosci || []).includes(d)} onClick={() => przelaczDolegliwosc(d)}>{d}</button>
                            ))}
                        </div>
                    </div>

                    <Field label="Co widzisz / co się zmieniło">
                        <textarea className="field mt-4" value={w.opis} onChange={e => set('opis', e.target.value)} placeholder="np. ciemniejsza niż miesiąc temu, brzeg po lewej rozmyty" />
                    </Field>

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <div className="flex flex-wrap items-center gap-2">
                            <button className="btn btn-soft" onClick={() => fileRef.current.click()}><Icon name="camera" /> {w.zdjecieId ? 'Zmień zdjęcie' : 'Dodaj zdjęcie'}</button>
                            <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={wczytajZdjecie} />
                            {podglad ? <button className="btn btn-soft" disabled={!!busy} onClick={opiszZdjecie}><Icon name="sparkle" /> Poproś AI o opis zdjęcia</button> : null}
                            {w.zdjecieId ? <button className="btn btn-danger !py-1.5 !text-xs" onClick={async () => { await Z.deletePhoto(w.zdjecieId); setPodglad(''); set('zdjecieId', ''); }}>Usuń zdjęcie</button> : null}
                            {busy ? <span className="text-xs text-slate-400">{busy}</span> : null}
                        </div>
                        <p className="text-xs text-slate-500 mt-2">
                            Zdjęcie jest zmniejszane i zapisywane zaszyfrowane na tym urządzeniu — razem z datą i miejscem wykonania,
                            które usuwamy z pliku. Do AI trafia tylko wtedy, gdy klikniesz powyżej. Kadruj samą zmianę, bez twarzy.
                        </p>
                        {podglad ? <img src={podglad} alt="Zdjęcie zmiany" className="mt-3 rounded-xl border border-slate-800 max-h-72" /> : null}
                        {w.aiOpis ? (
                            <div className="mt-3">
                                <span className="lbl">Opis zdjęcia od AI</span>
                                <p className="text-sm text-slate-300 bg-slate-950 border border-slate-800 rounded-xl p-3">{w.aiOpis}</p>
                                <button className="text-xs underline text-slate-500 hover:text-slate-300 mt-1" onClick={() => set('aiOpis', '')}>Usuń opis</button>
                            </div>
                        ) : null}
                    </div>

                    {err ? <div className="mt-3"><Note tone="stop">{err}</Note></div> : null}

                    <div className="flex flex-wrap gap-2 mt-6">
                        <button className="btn btn-main" disabled={!w.data} onClick={() => onSave(w)}><Icon name="check" /> Zapisz obserwację</button>
                        <button className="btn btn-soft" onClick={onClose}>Anuluj</button>
                        {onDelete ? <button className="btn btn-danger sm:ml-auto" onClick={() => { if (confirm('Usunąć tę obserwację?')) onDelete(w.id); }}>Usuń</button> : null}
                    </div>
                </Modal>
            );
        }

        function TreatmentRow({ t, onChange, onDelete }) {
            const set = (k, v) => onChange(Object.assign({}, t, { [k]: v }));
