<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Zdrowie</title>
    <meta name="description" content="Prywatna, zaszyfrowana kartoteka zdrowia. Dane tylko na tym urządzeniu.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- PRYWATNA APLIKACJA (27.10.2026). Dane o zdrowiu są wyłącznie w tej przeglądarce, zaszyfrowane hasłem
         (zdrowie-core.js). Celowo bez analityki, bazy w chmurze, wspólnego global-core.js i menu EduBox – nic nie
         może wysyłać danych w tle (pilnuje tego scripts/check-zdrowie.js). Skany i PDF-y czyta pdf.js, mammoth
         i OCR tesseract LOKALNIE, dlatego /zdrowie.html ma w vercel.json własne CSP z 'wasm-unsafe-eval'. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin=""></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="/doc-tools.js"></script>
    <script src="/zdrowie-core.js"></script>
    <link rel="stylesheet" href="/doc-paper.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        .field { width: 100%; background: #0b1220; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #e2e8f0; outline: none; }
        .field:focus { border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45,212,191,.15); }
        textarea.field { resize: vertical; min-height: 84px; line-height: 1.5; }
        .lbl { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px; border-radius: 12px; padding: 10px 16px; transition: background .15s, opacity .15s; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-main { background: #2dd4bf; color: #042f2e; } .btn-main:hover:not(:disabled) { background: #5eead4; }
        .btn-soft { background: #1e293b; color: #e2e8f0; } .btn-soft:hover:not(:disabled) { background: #334155; }
        .btn-danger { background: transparent; color: #fca5a5; border: 1px solid #7f1d1d; } .btn-danger:hover { background: #450a0a; }
        .tab { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #94a3b8; white-space: nowrap; }
        .tab[aria-pressed="true"] { background: #2dd4bf; color: #042f2e; }
        .pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
        .pill-stop { background: #450a0a; color: #fca5a5; }
        .pill-sprawdz { background: #422006; color: #fcd34d; }
        .pill-ok { background: #052e1c; color: #6ee7b7; }
        .dose { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid #1e293b; background: #0b1220; }
        .dose.done { opacity: .55; }
        .dose.done .dose-name { text-decoration: line-through; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        @media print { #root { display: none !important; } }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <noscript><p style="padding:24px">Aplikacja wymaga włączonego JavaScriptu.</p></noscript>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const Z = window.EduZdrowie;
        const DT = window.EduDocTools;

        const IS_LOCAL = location.protocol === 'file:';
        const todayIso = () => Z.today();
        const nowHHMM = () => new Date().toTimeString().slice(0, 5);
        const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const readStored = () => { try { const r = localStorage.getItem(Z.VAULT_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
        const fileSafe = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');

        function download(content, name, type) {
            const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        // ---------- drobne elementy ----------
        const Icon = ({ name, className }) => <i className={`ph ph-${name} ${className || ''}`} aria-hidden="true"></i>;

        function Field({ label, hint, children }) {
            return (
                <label className="block">
                    <span className="lbl">{label}</span>
                    {children}
                    {hint ? <span className="block mt-1 text-[11px] text-slate-500">{hint}</span> : null}
                </label>
            );
        }

        function Modal({ title, onClose, children, wide }) {
            useEffect(() => {
                const esc = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', esc);
                return () => document.removeEventListener('keydown', esc);
            }, [onClose]);
            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 p-3 sm:p-6 overflow-y-auto" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className={`card mx-auto p-5 sm:p-6 ${wide ? 'max-w-3xl' : 'max-w-xl'}`} role="dialog" aria-modal="true" aria-label={title}>
                        <div className="flex items-start justify-between gap-4 mb-4">
                            <h2 className="text-lg font-extrabold">{title}</h2>
                            <button className="text-slate-400 hover:text-slate-100 text-xl leading-none" onClick={onClose} aria-label="Zamknij">×</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        function Note({ children, tone }) {
            const tones = { info: 'border-sky-900 bg-sky-950/40 text-sky-200', warn: 'border-amber-900 bg-amber-950/40 text-amber-200', stop: 'border-red-900 bg-red-950/40 text-red-200' };
            return <div className={`rounded-2xl border px-4 py-3 text-sm leading-relaxed ${tones[tone || 'info']}`}>{children}</div>;
        }

        const STATUS_PILL = { pusto: 'pill-stop', pilne: 'pill-stop', minelo: 'pill-stop', dzisiaj: 'pill-sprawdz', wkrotce: 'pill-sprawdz', ok: 'pill-ok' };
        const dayWord = (n) => n < 0 ? `${Z.dni(-n)} temu` : n === 0 ? 'dzisiaj' : n === 1 ? 'jutro' : `za ${Z.dni(n)}`;

        // ---------- ekran hasła ----------
        function Gate({ stored, onOpen }) {
            const [pass, setPass] = useState('');
            const [pass2, setPass2] = useState('');
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');
            const [importBlob, setImportBlob] = useState(null);
            const fileRef = useRef(null);
            const blob = importBlob || stored;
            const isNew = !blob;

            const go = async (e) => {
                e.preventDefault();
                setErr(''); setBusy(true);
                try {
                    if (isNew) {
                        if (pass !== pass2) throw new Error('Hasła się różnią.');
                        const session = await Z.createSession(pass, 'Hasło główne');
                        onOpen(Z.emptyVault(), session);
                    } else {
                        const r = await Z.open(blob, pass);
                        onOpen(r.data, r.session);
                    }
                } catch (x) { setErr(x.message); } finally { setBusy(false); setPass(''); setPass2(''); }
            };

            const pickBackup = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                try {
                    const j = JSON.parse(await f.text());
                    if (j.app !== Z.APP_ID) throw new Error('To nie jest kopia zapasowa aplikacji Moje Zdrowie.');
                    // Zdjęcia z kopii trafiają do bazy od razu – są już zaszyfrowane, więc otworzy je dopiero hasło.
                    if (Array.isArray(j.zdjecia) && j.zdjecia.length) { try { await Z.importPhotos(j.zdjecia); } catch (e) { /* bez zdjęć kartoteka i tak się otworzy */ } }
                    setImportBlob(j); setErr('');
                } catch (x) { setErr(x.message || 'Nie udało się odczytać pliku.'); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="card w-full max-w-md p-6 sm:p-8">
                        <div className="flex items-center gap-3 mb-5">
                            <div className="w-11 h-11 rounded-2xl bg-teal-400 text-teal-950 grid place-items-center text-2xl"><Icon name="heartbeat" /></div>
                            <div>
                                <h1 className="text-xl font-extrabold">Moje Zdrowie</h1>
                                <p className="text-xs text-slate-400">Kartoteka zaszyfrowana na tym urządzeniu</p>
                            </div>
                        </div>

                        {isNew ? (
                            <Note tone="info">
                                Zakładasz kartotekę po raz pierwszy. Hasło szyfruje wszystko, co w niej zapiszesz —
                                leki, wyniki, skany. <strong>Nie da się go odzyskać.</strong> Zapisz je w menedżerze haseł,
                                zanim przejdziesz dalej.
                            </Note>
                        ) : (
                            <Note tone="info">Dane są w tej przeglądarce i nigdzie poza nią. Podaj hasło, żeby je odszyfrować.</Note>
                        )}

                        <form onSubmit={go} className="mt-5 space-y-4">
                            <Field label={isNew ? 'Nowe hasło (min. 8 znaków)' : 'Hasło'}>
                                <input type="password" className="field" value={pass} onChange={e => setPass(e.target.value)}
                                    autoFocus autoComplete={isNew ? 'new-password' : 'current-password'} />
                            </Field>
                            {isNew ? (
                                <Field label="Powtórz hasło">
                                    <input type="password" className="field" value={pass2} onChange={e => setPass2(e.target.value)} autoComplete="new-password" />
                                </Field>
                            ) : null}
                            {err ? <Note tone="stop">{err}</Note> : null}
                            <button className="btn btn-main w-full" disabled={busy || pass.length < 8}>
                                {busy ? 'Odszyfrowuję…' : isNew ? 'Załóż kartotekę' : 'Otwórz'}
                            </button>
                        </form>

                        <div className="mt-5 pt-4 border-t border-slate-800 text-xs text-slate-400 space-y-2">
                            <button className="underline hover:text-slate-200" onClick={() => fileRef.current.click()}>
                                {importBlob ? 'Wczytano kopię zapasową – podaj do niej hasło' : 'Otwórz z kopii zapasowej (plik .json)'}
                            </button>
                            <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={pickBackup} />
                            <p>Szyfrowanie: PBKDF2-SHA256 ({Z.ITERATIONS.toLocaleString('pl')} obiegów) + AES-GCM 256. Bez hasła dane są nie do odczytania — także dla mnie.</p>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- przypomnienia w otwartej karcie ----------
        // Uczciwie: przeglądarka nie obudzi nikogo przy zamkniętej karcie. Dlatego to tylko dodatek do pliku .ics,
        // który trafia do kalendarza telefonu i dzwoni sam. Tu przypominamy, gdy aplikacja jest otwarta.
        function useReminders(vault, enabled) {
            const announced = useRef(new Set());
            useEffect(() => {
                if (!enabled) return;
                const tick = () => {
                    const day = todayIso();
                    Z.dueDoses(vault, day, nowHHMM()).forEach(g => {
                        const key = day + '|' + g.czas;
                        if (announced.current.has(key)) return;
                        announced.current.add(key);
                        const tekst = Z.spokenReminder(g.czas, g.leki);
                        try {
                            if (window.speechSynthesis) {
                                const u = new SpeechSynthesisUtterance(tekst);
                                u.lang = 'pl-PL'; u.rate = 0.95;
                                window.speechSynthesis.speak(u);
                            }
                        } catch (e) { /* głos jest dodatkiem – brak syntezatora nie psuje przypomnienia */ }
                        try {
                            if (window.Notification && Notification.permission === 'granted') {
                                new Notification('Pora na leki — ' + g.czas, { body: g.leki.map(l => `${l.nazwa} ${l.ile} szt.`).join(', '), tag: key });
                            }
                        } catch (e) { /* powiadomienia bywają zablokowane – to nie błąd aplikacji */ }
                    });
                };
                tick();
                const id = setInterval(tick, 30000);
                return () => clearInterval(id);
            }, [vault, enabled]);
        }

        // ---------- zakładka: Dziś ----------
        function Dzis({ vault, save, goto }) {
            const day = todayIso();
            const [, odswiez] = useState(0);
            useEffect(() => { const id = setInterval(() => odswiez(x => x + 1), 60000); return () => clearInterval(id); }, []);

            const plan = Z.planForDay(vault.leki, day);
            const alerty = Z.alerts(vault);
            const ostrzezenia = Z.checkCombo(vault.leki, vault.profil).filter(o => o.poziom === 'stop');
            const teraz = nowHHMM();
            const wzieteDzis = plan.reduce((a, g) => a + g.leki.filter(l => Z.isTaken(vault, day, l.id, g.czas)).length, 0);
            const wszystkie = plan.reduce((a, g) => a + g.leki.length, 0);
            const dataPl = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });

            const przelacz = (medId, czas, stan) => save(Z.markDose(vault, day, medId, czas, stan));

            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap items-end justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-extrabold capitalize">{dataPl}</h2>
                            <p className="text-sm text-slate-400">{wszystkie ? `Leki na dziś: ${wzieteDzis} z ${wszystkie} wzięte` : 'Na dziś nie masz wpisanych leków.'}</p>
                        </div>
                        {wszystkie ? (
                            <div className="text-right">
                                <div className="text-3xl font-extrabold text-teal-300">{Math.round((wzieteDzis / wszystkie) * 100)}%</div>
                                <div className="text-[11px] uppercase tracking-wider text-slate-500">dzisiejszego planu</div>
                            </div>
                        ) : null}
                    </div>

                    {ostrzezenia.length ? (
                        <Note tone="stop">
                            <strong>Sprawdź zestaw leków.</strong>
                            <ul className="mt-2 space-y-1 list-disc pl-5">{ostrzezenia.map((o, i) => <li key={i}>{o.tekst}</li>)}</ul>
                        </Note>
                    ) : null}

                    {alerty.length ? (
                        <div className="card p-4">
                            <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Wymaga uwagi</h3>
                            <ul className="space-y-2">
                                {alerty.map((a, i) => (
                                    <li key={i}>
                                        <button className="w-full flex items-center gap-3 text-left hover:bg-slate-800/60 rounded-xl px-2 py-2"
                                            onClick={() => goto({ wizyta: 'wizyty', urzadzenie: 'urzadzenia', skora: 'skora', badanie: 'badania' }[a.kind] || 'leki')}>
                                            <Icon name={{ wizyta: 'stethoscope', urzadzenie: 'heartbeat', skora: 'eye', badanie: 'test-tube' }[a.kind] || 'pill'} className="text-lg text-slate-400" />
                                            <span className="flex-1 text-sm">{a.label}</span>
                                            <span className={`pill ${STATUS_PILL[a.status] || 'pill-ok'}`}>{dayWord(a.days)}</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    ) : null}

                    {plan.length ? (
                        <div className="space-y-3">
                            {plan.map(g => {
                                const minelo = g.czas <= teraz;
                                const komplet = g.leki.every(l => Z.isTaken(vault, day, l.id, g.czas));
                                return (
                                    <div key={g.czas} className={`card p-4 ${minelo && !komplet ? 'border-amber-800' : ''}`}>
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-lg font-extrabold tabular-nums">{g.czas}</h3>
                                            {minelo && !komplet ? <span className="pill pill-sprawdz">pora minęła</span> : komplet ? <span className="pill pill-ok">wzięte</span> : null}
                                        </div>
                                        <div className="space-y-2">
                                            {g.leki.map(l => {
                                                const done = Z.isTaken(vault, day, l.id, g.czas);
                                                const pos = (Z.POSILEK.find(p => p.id === l.posilek) || {}).label;
                                                return (
                                                    <label key={l.id} className={`dose ${done ? 'done' : ''} cursor-pointer`}>
                                                        <input type="checkbox" className="w-5 h-5 accent-teal-400" checked={done} onChange={e => przelacz(l.id, g.czas, e.target.checked)} />
                                                        <span className="flex-1">
                                                            <span className="dose-name font-bold">{l.nazwa}{l.moc ? ' ' + l.moc : ''}</span>
                                                            <span className="block text-xs text-slate-400">{l.ile} {Z.plural(l.ile, 'sztuka', 'sztuki', 'sztuk')}{pos && l.posilek ? ' · ' + pos : ''}</span>
                                                        </span>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="card p-6 text-center text-sm text-slate-400">
                            <p className="mb-3">Nie masz jeszcze wpisanych leków na dziś.</p>
                            <button className="btn btn-main" onClick={() => goto('leki')}><Icon name="plus" /> Dodaj pierwszy lek</button>
                        </div>
                    )}
                </div>
            );
        }

        // ---------- zakładka: Leki ----------
        const POSTACIE = ['tabletka', 'kapsułka', 'saszetka', 'ml', 'kropla', 'dawka wziewna', 'zastrzyk', 'plaster', 'czopek'];

        function MedForm({ med, isNew, onSave, onClose, onDelete }) {
            const [m, setM] = useState(() => Object.assign(Z.newMed(), med || {}));
            const set = (k, v) => setM(prev => Object.assign({}, prev, { [k]: v }));
            const setDawka = (i, k, v) => setM(prev => Object.assign({}, prev, { dawki: prev.dawki.map((d, j) => j === i ? Object.assign({}, d, { [k]: v }) : d) }));
            const codziennie = !Array.isArray(m.dni);
            const sub = Z.substanceOf(m);

            return (
                <Modal title={isNew ? 'Nowy lek' : 'Lek: ' + (med.nazwa || '')} onClose={onClose} wide>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="Nazwa z opakowania">
                            <input className="field" value={m.nazwa} onChange={e => set('nazwa', e.target.value)} placeholder="np. Ibuprom Max" autoFocus />
                        </Field>
                        <Field label="Moc jednej sztuki" hint="np. 400 mg, 12,5 mg, 5 ml">
                            <input className="field" value={m.moc} onChange={e => set('moc', e.target.value)} placeholder="400 mg" />
                        </Field>
                        <Field label="Substancja czynna" hint={sub && !m.substancja ? `Rozpoznana z nazwy: ${sub}` : 'Przepisz z ulotki — dzięki temu wyłapię powtórzenia'}>
                            <input className="field" value={m.substancja} onChange={e => set('substancja', e.target.value)} placeholder={sub || 'np. ibuprofen'} />
                        </Field>
                        <Field label="Postać">
                            <select className="field" value={m.postac} onChange={e => set('postac', e.target.value)}>
                                {POSTACIE.map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                        </Field>
                    </div>

                    <div className="mt-5">
                        <span className="lbl">Pory i dawki</span>
                        <div className="space-y-2">
                            {m.dawki.map((d, i) => (
                                <div key={i} className="flex items-center gap-2">
                                    <input type="time" className="field w-32" value={d.pora} onChange={e => setDawka(i, 'pora', e.target.value)} />
                                    <input type="number" min="0.25" step="0.25" className="field w-24" value={d.ile} onChange={e => setDawka(i, 'ile', Number(e.target.value))} />
                                    <span className="text-sm text-slate-400 flex-1">{m.postac}{Number(d.ile) === 1 ? '' : 'i/ek'}</span>
                                    {m.dawki.length > 1 ? (
                                        <button className="btn btn-danger !py-1.5 !px-3" onClick={() => set('dawki', m.dawki.filter((_, j) => j !== i))} aria-label="Usuń porę">×</button>
                                    ) : null}
                                </div>
                            ))}
                        </div>
                        <div className="mt-2 flex flex-wrap gap-2">
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => set('dawki', [...m.dawki, { pora: '20:00', ile: 1 }])}><Icon name="plus" /> Dodaj porę</button>
                            {Z.PORY.map(p => (
                                <button key={p.id} className="btn btn-soft !py-1.5 !text-xs" onClick={() => set('dawki', [...m.dawki.filter(d => d.pora !== p.czas), { pora: p.czas, ile: 1 }].sort((a, b) => a.pora.localeCompare(b.pora)))}>
                                    {p.label} {p.czas}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="mt-5">
                        <span className="lbl">Które dni</span>
                        <div className="flex flex-wrap gap-2">
                            <button className="tab" aria-pressed={codziennie} onClick={() => set('dni', 'codziennie')}>Codziennie</button>
                            {Z.DNI_TYGODNIA.map((nazwa, i) => {
                                const nr = i + 1;
                                const on = Array.isArray(m.dni) && m.dni.includes(nr);
                                return (
                                    <button key={nr} className="tab" aria-pressed={on} onClick={() => {
                                        const base = Array.isArray(m.dni) ? m.dni : [];

        // ---------- „Czy mogę to wziąć?” (sprawdzenie mechaniczne, bez AI) ----------
