        function SkinSpotForm({ spot, isNew, session, vault, onSave, onClose, onDelete }) {
            const [z, setZ] = useState(() => Object.assign(Z.newSkinSpot(), spot || {}));
            const [wpis, setWpis] = useState(null);
            const [analiza, setAnaliza] = useState(false);
            const set = (k, v) => setZ(prev => Object.assign({}, prev, { [k]: v }));
            const ostrzezenia = Z.skinWarnings(z);
            const podsum = Z.treatmentSummary(z);
            const wpisy = Z.sortedEntries(z);

            const zapiszWpis = (w) => {
                const sa = z.wpisy || [];
                setZ(prev => Object.assign({}, prev, { wpisy: sa.some(x => x.id === w.id) ? sa.map(x => x.id === w.id ? w : x) : [...sa, w] }));
                setWpis(null);
            };
            const usunWpis = async (id) => {
                const w = (z.wpisy || []).find(x => x.id === id);
                if (w && w.zdjecieId) { try { await Z.deletePhoto(w.zdjecieId); } catch (e) { /* brak zdjęcia nie blokuje usunięcia wpisu */ } }
                setZ(prev => Object.assign({}, prev, { wpisy: (prev.wpisy || []).filter(x => x.id !== id) }));
                setWpis(null);
            };
            const setLeczenie = (i, t) => set('leczenie', z.leczenie.map((x, j) => j === i ? t : x));

            return (
                <Modal title={isNew ? 'Nowa zmiana skórna' : (z.nazwa || 'Zmiana skórna')} onClose={onClose} wide>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="Nazwa robocza"><input className="field" value={z.nazwa} onChange={e => set('nazwa', e.target.value)} placeholder="np. znamię na plecach" autoFocus /></Field>
                        <Field label="Umiejscowienie"><input className="field" value={z.lokalizacja} onChange={e => set('lokalizacja', e.target.value)} placeholder="np. lewa łopatka" /></Field>
                        <Field label="Od kiedy ją widzisz"><input type="date" className="field" value={z.odKiedy} onChange={e => set('odKiedy', e.target.value)} /></Field>
                        <Field label="Rozmiar na początku (mm)"><input className="field" value={z.rozmiarMm} onChange={e => set('rozmiarMm', e.target.value)} inputMode="decimal" /></Field>
                        <Field label="Status">
                            <select className="field" value={z.status} onChange={e => set('status', e.target.value)}>
                                {Z.STATUSY_SKORA.map(x => <option key={x.id} value={x.id}>{x.label}</option>)}
                            </select>
                        </Field>
                    </div>
                    <Field label="Opis początkowy"><textarea className="field mt-4" value={z.opis} onChange={e => set('opis', e.target.value)} placeholder="kształt, kolor, czy wystaje, czy swędzi" /></Field>

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <h3 className="font-extrabold text-sm mb-1">Lista ABCDE</h3>
                        <p className="text-xs text-slate-400 mb-3">
                            Zaznacz, co pasuje do tej zmiany. To nie jest test ani rozpoznanie — tylko znana lista cech,
                            które są powodem, żeby pokazać zmianę dermatologowi.
                        </p>
                        <div className="space-y-2">
                            {Z.ABCDE.map(x => (
                                <label key={x.id} className="flex items-start gap-3 text-sm cursor-pointer">
                                    <input type="checkbox" className="w-4 h-4 mt-0.5 accent-teal-400" checked={!!z.abcde[x.id]}
                                        onChange={e => set('abcde', Object.assign({}, z.abcde, { [x.id]: e.target.checked }))} />
                                    <span><strong>{x.label}</strong><span className="block text-xs text-slate-400">{x.opis}</span></span>
                                </label>
                            ))}
                        </div>
                    </div>

                    {ostrzezenia.length ? (
                        <div className="mt-4 space-y-2">
                            {ostrzezenia.map((o, i) => <Note key={i} tone={o.waga === 'pilne' ? 'stop' : 'warn'}>{o.tekst}</Note>)}
                        </div>
                    ) : null}

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <div className="flex items-center justify-between mb-3">
                            <h3 className="font-extrabold text-sm">Obserwacje ({wpisy.length})</h3>
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => setWpis(Z.newSkinEntry())}><Icon name="plus" /> Dodaj obserwację</button>
                        </div>
                        {wpisy.length ? (
                            <div className="grid sm:grid-cols-2 gap-3">
                                {wpisy.map(w => (
                                    <button key={w.id} className="text-left rounded-xl border border-slate-800 bg-slate-950 p-3 hover:border-slate-700" onClick={() => setWpis(w)}>
                                        <div className="text-sm font-bold">{Z.formatDatePl(w.data) || 'bez daty'}{w.rozmiarMm ? ` · ${w.rozmiarMm} mm` : ''}</div>
                                        {(w.dolegliwosci || []).length ? <div className="text-xs text-amber-200/80 mt-0.5">{w.dolegliwosci.join(', ')}</div> : null}
                                        {w.opis ? <div className="text-xs text-slate-400 mt-1">{w.opis}</div> : null}
                                        <Zdjecie id={w.zdjecieId} session={session} className="mt-2 rounded-lg border border-slate-800 max-h-40" />
                                    </button>
                                ))}
                            </div>
                        ) : <p className="text-sm text-slate-500">Brak obserwacji. Zdjęcie co kilka tygodni z tej samej odległości pokaże, czy zmiana rośnie.</p>}
                    </div>

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <div className="flex items-center justify-between mb-1">
                            <h3 className="font-extrabold text-sm">Leczenie ({(z.leczenie || []).length})</h3>
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => set('leczenie', [...(z.leczenie || []), Object.assign(Z.newTreatment(), { odKiedy: todayIso() })])}><Icon name="plus" /> Dodaj</button>
                        </div>
                        <p className="text-xs text-slate-400 mb-3">Osobno to, co zastosowałeś sam, i to, co zalecił lekarz — żeby dało się potem porównać.</p>
                        <div className="space-y-3">
                            {(z.leczenie || []).map((t, i) => (
                                <TreatmentRow key={t.id} t={t} onChange={(nt) => setLeczenie(i, nt)} onDelete={() => set('leczenie', z.leczenie.filter((_, j) => j !== i))} />
                            ))}
                        </div>
                        {podsum.ja.ile || podsum.lekarz.ile ? (
                            <div className="mt-4 grid sm:grid-cols-2 gap-3 text-sm">
                                {[['Moje próby', podsum.ja], ['Zalecone przez lekarza', podsum.lekarz]].map(([tytul, d]) => (
                                    <div key={tytul} className="rounded-xl border border-slate-800 bg-slate-950 p-3">
                                        <div className="font-bold">{tytul}</div>
                                        <div className="text-xs text-slate-400 mt-1">
                                            {d.ile} {Z.plural(d.ile, 'sposób', 'sposoby', 'sposobów')}
                                            {d.lacznieDni != null ? ` · łącznie ${Z.dni(d.lacznieDni)}` : ''}
                                            {d.sredniEfekt != null ? ` · średnia ocena ${d.sredniEfekt}/5` : ''}
                                        </div>
                                        {d.najlepsze ? <div className="text-xs text-teal-300 mt-1">najwyżej oceniasz: {d.najlepsze.co} ({d.najlepsze.efekt}/5)</div> : null}
                                    </div>
                                ))}
                            </div>
                        ) : null}
                    </div>

                    <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <div className="flex items-center justify-between">
                            <h3 className="font-extrabold text-sm">Uporządkuj przebieg przed wizytą</h3>
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => setAnaliza(!analiza)}>{analiza ? 'Ukryj' : 'Pokaż'}</button>
                        </div>
                        <p className="text-xs text-slate-400 mt-1">AI ułoży przebieg z dat i Twoich zapisów, zestawi leczenie i wypisze pytania. Nie nazwie zmiany i nie powie, że jest niegroźna — tego nie da się ocenić ze zdjęcia.</p>
                        {analiza ? <div className="mt-4"><AiKartka tytul="Uporządkuj przebieg" prompts={Z.skinPrompts(z, vault)} vault={vault} /></div> : null}
                    </div>

                    <div className="flex flex-wrap gap-2 mt-6">
                        <button className="btn btn-main" disabled={!z.nazwa.trim() && !z.lokalizacja.trim()} onClick={() => onSave(z)}><Icon name="check" /> Zapisz</button>
                        <button className="btn btn-soft" onClick={onClose}>Anuluj</button>
                        {onDelete ? <button className="btn btn-danger sm:ml-auto" onClick={() => { if (confirm('Usunąć tę zmianę razem ze zdjęciami?')) onDelete(z.id); }}>Usuń</button> : null}
                    </div>

                    {wpis ? <SkinEntryForm spot={z} entry={wpis} isNew={!(z.wpisy || []).some(x => x.id === wpis.id)} session={session} vault={vault}
                        onSave={zapiszWpis} onClose={() => setWpis(null)}
                        onDelete={(z.wpisy || []).some(x => x.id === wpis.id) ? usunWpis : null} /> : null}
                </Modal>
            );
        }

        function Skora({ vault, save, session }) {
            const [edit, setEdit] = useState(null);
            const aktywne = vault.skora.filter(z => z.status !== 'zagojona' && z.status !== 'usunieta');
            const zamkniete = vault.skora.filter(z => z.status === 'zagojona' || z.status === 'usunieta');

            const zapisz = (z) => {
                const exists = vault.skora.some(x => x.id === z.id);
                save(Object.assign({}, vault, { skora: exists ? vault.skora.map(x => x.id === z.id ? z : x) : [...vault.skora, z] }));
                setEdit(null);
            };
            const usun = async (id) => {
                const z = vault.skora.find(x => x.id === id);
                for (const w of ((z && z.wpisy) || [])) {
                    if (w.zdjecieId) { try { await Z.deletePhoto(w.zdjecieId); } catch (e) { /* brak zdjęcia nie blokuje usunięcia */ } }
                }
                save(Object.assign({}, vault, { skora: vault.skora.filter(x => x.id !== id) }));
                setEdit(null);
            };

            const Karta = ({ z }) => {
                const ostrz = Z.skinWarnings(z);
                const pilne = ostrz.filter(o => o.waga === 'pilne').length;
                const ostatni = Z.sortedEntries(z).slice(-1)[0];
                return (
                    <button className="card w-full text-left p-4 hover:border-slate-700" onClick={() => setEdit(z)}>
                        <div className="flex items-start justify-between gap-3">
                            <div className="min-w-0 flex-1">
                                <div className="font-extrabold">{z.nazwa || 'Zmiana skórna'}</div>
                                <div className="text-xs text-slate-400 mt-0.5">
                                    {z.lokalizacja ? z.lokalizacja : 'bez umiejscowienia'}
                                    {z.odKiedy ? ' · od ' + Z.formatDatePl(z.odKiedy) : ''}
                                    {` · ${(z.wpisy || []).length} ${Z.plural((z.wpisy || []).length, 'obserwacja', 'obserwacje', 'obserwacji')}`}
                                </div>
                                {ostatni && ostatni.rozmiarMm ? <div className="text-xs text-slate-500 mt-0.5">ostatni pomiar: {ostatni.rozmiarMm} mm</div> : null}
                            </div>
                            {ostatni && ostatni.zdjecieId ? <Zdjecie id={ostatni.zdjecieId} session={session} className="rounded-lg border border-slate-800 w-20 h-20 object-cover shrink-0" /> : null}
                        </div>
                        {pilne ? <div className="mt-2 text-xs text-red-300">⚠️ {ostrz.find(o => o.waga === 'pilne').tekst}</div> : null}
                    </button>
                );
            };

            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-extrabold">Zmiany skórne</h2>
                        <button className="btn btn-main" onClick={() => setEdit(Object.assign(Z.newSkinSpot(), { odKiedy: todayIso() }))}><Icon name="plus" /> Dodaj zmianę</button>
                    </div>

                    <Note tone="info">
                        Dziennik obserwacji: zdjęcia, pomiary i to, co stosowałeś. Zdjęcia są zaszyfrowane na tym urządzeniu.
                        <strong> Aplikacja nie ocenia, co to za zmiana</strong> — tego nie da się stwierdzić ze zdjęcia. Pomaga zauważyć, że coś się zmienia, i pokazać to lekarzowi z datami.
                    </Note>

                    {aktywne.length ? <div className="space-y-2">{aktywne.map(z => <Karta key={z.id} z={z} />)}</div>
                        : <div className="card p-6 text-center text-sm text-slate-400">Brak obserwowanych zmian.</div>}

                    {zamkniete.length ? (
                        <details className="card p-4">
                            <summary className="cursor-pointer text-sm font-bold text-slate-400">Zakończone ({zamkniete.length})</summary>
                            <div className="mt-3 space-y-2">{zamkniete.map(z => <Karta key={z.id} z={z} />)}</div>
                        </details>
                    ) : null}

                    {edit ? <SkinSpotForm spot={edit} isNew={!vault.skora.some(x => x.id === edit.id)} session={session} vault={vault}
                        onSave={zapisz} onClose={() => setEdit(null)} onDelete={vault.skora.some(x => x.id === edit.id) ? usun : null} /> : null}
                </div>
            );
        }

        // ---------- zakładka: Badania ----------
        const FLAGA_KOLOR = { wysoki: 'text-red-300', niski: 'text-sky-300', ok: 'text-slate-200', '': 'text-slate-400' };
        const FLAGA_PILL = { wysoki: 'pill-stop', niski: 'pill-sprawdz', ok: 'pill-ok', '': '' };
        const STRZALKA = { rosnie: '↑', spada: '↓', stabilnie: '→', brak: '' };

        // Wykres trendu rysowany wprost w SVG – żadnej biblioteki, więc nie trzeba ruszać CSP.
        // Pasmo normy to prostokąt w tle: od razu widać, czy punkt z niego wyszedł.
        function WykresTrendu({ seria }) {
            const punkty = (seria.punkty || []).filter(p => p.wartosc != null);
            if (punkty.length < 2) return null;
            const W = 320, H = 120, L = 6, R = 6, T = 10, B = 18;
            const wartosci = punkty.map(p => p.wartosc);
            const last = punkty[punkty.length - 1];
            const granice = [
                ...wartosci,
                ...(Number.isFinite(Number(last.normaOd)) ? [Number(last.normaOd)] : []),
                ...(Number.isFinite(Number(last.normaDo)) ? [Number(last.normaDo)] : [])
            ];
            let min = Math.min(...granice), max = Math.max(...granice);
            if (max === min) { max = min + 1; min = min - 1; }
            const zapas = (max - min) * 0.12;
            min -= zapas; max += zapas;
            const x = (i) => L + (i * (W - L - R)) / (punkty.length - 1);
            const y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min));

            const od = Number(last.normaOd), doo = Number(last.normaDo);
            const gornaY = Number.isFinite(doo) ? y(doo) : T;
            const dolnaY = Number.isFinite(od) ? y(od) : H - B;
            const pasmo = (Number.isFinite(od) || Number.isFinite(doo)) && dolnaY > gornaY;

            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-28" role="img"
                    aria-label={`Przebieg ${seria.parametr}: ${punkty.map(p => p.wynik).join(', ')}`}>
                    {pasmo ? <rect x="0" y={gornaY} width={W} height={dolnaY - gornaY} fill="#14532d" opacity="0.35" /> : null}
                    {pasmo ? <line x1="0" y1={gornaY} x2={W} y2={gornaY} stroke="#34d399" strokeWidth="1" strokeDasharray="4 3" opacity="0.7" /> : null}
                    {pasmo && Number.isFinite(od) ? <line x1="0" y1={dolnaY} x2={W} y2={dolnaY} stroke="#34d399" strokeWidth="1" strokeDasharray="4 3" opacity="0.7" /> : null}
                    <polyline fill="none" stroke="#2dd4bf" strokeWidth="2" strokeLinejoin="round"
                        points={punkty.map((p, i) => `${x(i)},${y(p.wartosc)}`).join(' ')} />
                    {punkty.map((p, i) => (
                        <circle key={i} cx={x(i)} cy={y(p.wartosc)} r={i === punkty.length - 1 ? 4.5 : 3}
                            fill={p.flaga === 'wysoki' ? '#fca5a5' : p.flaga === 'niski' ? '#7dd3fc' : '#2dd4bf'} />
                    ))}
                    <text x={L} y={H - 4} fill="#64748b" fontSize="9">{Z.formatDatePl(punkty[0].data)}</text>
                    <text x={W - R} y={H - 4} fill="#64748b" fontSize="9" textAnchor="end">{Z.formatDatePl(last.data)}</text>
                </svg>
            );
        }

        function PozycjaWiersz({ poz, onChange, onDelete }) {
            const set = (k, v) => {
                const next = Object.assign({}, poz, { [k]: v });
                if (k === 'parametr') next.key = Z.paramKey(v);
                if (k === 'wynik' || k === 'normaOd' || k === 'normaDo') next.flaga = Z.labFlag(next);
                onChange(next);
            };
            const liczba = (v) => (v === '' || v == null ? null : Number(String(v).replace(',', '.')));
            return (
                <div className="grid grid-cols-2 sm:grid-cols-12 gap-2 items-center">
                    <input className="field sm:col-span-4" value={poz.parametr} onChange={e => set('parametr', e.target.value)} placeholder="parametr" />
                    <input className="field sm:col-span-2" value={poz.wynik} onChange={e => set('wynik', e.target.value)} placeholder="wynik" inputMode="decimal" />
                    <input className="field sm:col-span-2" value={poz.jednostka} onChange={e => set('jednostka', e.target.value)} placeholder="jednostka" />
                    <input className="field sm:col-span-1" value={poz.normaOd == null ? '' : poz.normaOd} onChange={e => set('normaOd', liczba(e.target.value))} placeholder="od" inputMode="decimal" title="dolna granica normy z wydruku" />
                    <input className="field sm:col-span-1" value={poz.normaDo == null ? '' : poz.normaDo} onChange={e => set('normaDo', liczba(e.target.value))} placeholder="do" inputMode="decimal" title="górna granica normy z wydruku" />
                    <span className={`text-xs font-bold sm:col-span-1 ${FLAGA_KOLOR[poz.flaga || '']}`}>
                        {poz.flaga === 'wysoki' ? '▲ ponad' : poz.flaga === 'niski' ? '▼ poniżej' : poz.flaga === 'ok' ? '✓' : '—'}
                    </span>
                    <button className="btn btn-danger !py-1.5 !px-3 sm:col-span-1" onClick={onDelete} aria-label="Usuń pozycję">×</button>
                </div>
            );
        }

        function LabForm({ lab, isNew, vault, onSave, onClose, onDelete }) {
            const [b, setB] = useState(() => {
                const base = Object.assign(Z.newLab(), lab || {});
                return Object.assign(base, { data: base.data || todayIso() });
            });
            const [progress, setProgress] = useState('');
            const [err, setErr] = useState('');
            const [podglad, setPodglad] = useState(false);
            const fileRef = useRef(null);
            const set = (k, v) => setB(prev => Object.assign({}, prev, { [k]: v }));

            const wczytaj = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                setErr(''); setProgress('Otwieram plik…');
                try {
                    const r = await readDocument(f, setProgress);
                    const clean = String(r.text || '').replace(/\u0000/g, '').trim();
                    if (clean.replace(/\s/g, '').length < 20) throw new Error('Nie udało się odczytać tekstu z tego pliku.');
                    const info = Z.extractLabInfo(clean);
                    setB(prev => Object.assign({}, prev, {
                        tekst: clean, ocr: r.ocr,
                        data: info.data || prev.data,
                        laboratorium: prev.laboratorium || info.laboratorium,
                        pozycje: info.pozycje.length ? info.pozycje : prev.pozycje
                    }));
                    const skad = r.naprawiony
                        ? 'Ten PDF miał uszkodzoną warstwę tekstową, więc odczytałem go jak skan — tym bardziej sprawdź liczby. '
                        : r.ocr ? 'Odczyt z rozpoznawania obrazu — sprawdź liczby. ' : '';
                    setProgress(skad + (info.pozycje.length
                        ? `Rozpoznano ${info.pozycje.length} ${Z.plural(info.pozycje.length, 'parametr', 'parametry', 'parametrów')} — sprawdź je i popraw, co trzeba.`
                        : 'Nie rozpoznałem żadnego parametru. Dopisz je ręcznie poniżej.'));
                } catch (x) { setErr(x.message); setProgress(''); }
            };

            const poza = (b.pozycje || []).filter(p => p.flaga === 'wysoki' || p.flaga === 'niski');

            return (
                <Modal title={isNew ? 'Nowy wynik badania' : `Badanie ${Z.formatDatePl(b.data) || ''}`} onClose={onClose} wide>
                    <Note tone="info">
                        Wczytaj PDF z laboratorium — aplikacja wyciągnie parametry, wyniki i <strong>normy z tego wydruku</strong>.
                        Normy biorę wyłącznie z Twojego wyniku, nigdy z własnej listy: każde laboratorium ma inne.
                        Odczyt zawsze sprawdź, zwłaszcza przy skanach.
                    </Note>

                    <div className="mt-4 flex flex-wrap items-center gap-3">
                        <button className="btn btn-soft" onClick={() => fileRef.current.click()}><Icon name="upload-simple" /> Wczytaj wynik (PDF, zdjęcie)</button>
                        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,image/*" className="hidden" onChange={wczytaj} />
                        {progress ? <span className="text-xs text-slate-400">{progress}</span> : null}
                    </div>
                    {err ? <div className="mt-3"><Note tone="stop">{err}</Note></div> : null}

                    <div className="grid sm:grid-cols-3 gap-4 mt-5">
                        <Field label="Data pobrania"><input type="date" className="field" value={b.data} onChange={e => set('data', e.target.value)} /></Field>
                        <Field label="Laboratorium" hint="Do AI nie trafia"><input className="field" value={b.laboratorium} onChange={e => set('laboratorium', e.target.value)} /></Field>
                        <Field label="Co to za badanie"><input className="field" value={b.opis} onChange={e => set('opis', e.target.value)} placeholder="np. morfologia, panel reumatologiczny" /></Field>
                    </div>

                    <div className="mt-5">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <span className="lbl !mb-0">Parametry ({(b.pozycje || []).length}{poza.length ? `, poza normą: ${poza.length}` : ''})</span>
                            <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => set('pozycje', [...(b.pozycje || []), { id: Z.uid(), parametr: '', wynik: '', jednostka: '', normaOd: null, normaDo: null, normaTekst: '', flaga: '' }])}>
                                <Icon name="plus" /> Dopisz parametr
                            </button>
                        </div>
                        {(b.pozycje || []).length ? (
                            <div className="space-y-2">
                                {(b.pozycje || []).map((p, i) => (
                                    <PozycjaWiersz key={p.id || i} poz={p}
                                        onChange={(np) => set('pozycje', b.pozycje.map((x, j) => j === i ? np : x))}
                                        onDelete={() => set('pozycje', b.pozycje.filter((_, j) => j !== i))} />
                                ))}
                            </div>
                        ) : <p className="text-sm text-slate-500">Brak parametrów. Wczytaj plik albo dopisz je ręcznie.</p>}
                    </div>

                    {b.tekst ? (
                        <div className="mt-5">
                            <button className="text-xs underline text-slate-400 hover:text-slate-200" onClick={() => setPodglad(!podglad)}>
                                {podglad ? 'Ukryj' : 'Pokaż'} odczytany tekst ({b.tekst.length.toLocaleString('pl')} znaków){b.ocr ? ' — z rozpoznawania, może mieć literówki' : ''}
                            </button>
                            {podglad ? <textarea className="field mt-2 font-mono text-xs" style={{ minHeight: '200px' }} value={b.tekst} onChange={e => set('tekst', e.target.value)} /> : null}
                        </div>
                    ) : null}

                    <Field label="Moja notatka"><input className="field mt-4" value={b.uwagi} onChange={e => set('uwagi', e.target.value)} placeholder="np. na czczo, po antybiotyku" /></Field>

                    <div className="flex flex-wrap gap-2 mt-6">
                        <button className="btn btn-main" disabled={!b.data || !(b.pozycje || []).length} onClick={() => onSave(Object.assign({}, b, {
                            pozycje: b.pozycje.filter(p => String(p.parametr || '').trim()).map(p => Object.assign({}, p, { key: p.key || Z.paramKey(p.parametr), flaga: Z.labFlag(p) }))
                        }))}><Icon name="check" /> Zapisz badanie</button>
                        <button className="btn btn-soft" onClick={onClose}>Anuluj</button>
                        {onDelete ? <button className="btn btn-danger sm:ml-auto" onClick={() => { if (confirm('Usunąć ten wynik badania?')) onDelete(b.id); }}>Usuń</button> : null}
                    </div>
                </Modal>
            );
        }

        function TabelaPorownawcza({ badania, serie }) {
            const kolumny = badania.slice().sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 6);
            if (!serie.length) return null;
            const wartosc = (s, badanieId) => (s.punkty || []).find(p => p.badanieId === badanieId);
            return (
                <div className="card p-4">
                    <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Tabela porównawcza</h3>
                    <div className="overflow-x-auto -mx-1 px-1">
                        <table className="w-full text-sm border-collapse">
                            <thead>
                                <tr className="text-left">
                                    <th className="py-2 pr-3 font-bold text-slate-400 whitespace-nowrap">Parametr</th>
                                    <th className="py-2 pr-3 font-bold text-slate-400 whitespace-nowrap">Norma</th>
                                    {kolumny.map(b => <th key={b.id} className="py-2 px-2 font-bold text-slate-400 whitespace-nowrap text-right">{Z.formatDatePl(b.data) || '—'}</th>)}
                                    <th className="py-2 pl-2 font-bold text-slate-400 text-center">Trend</th>
                                </tr>
                            </thead>
                            <tbody>
                                {serie.map(s => {
                                    const ost = (s.punkty || []).slice(-1)[0] || {};
                                    return (
                                        <tr key={s.key} className="border-t border-slate-800">
                                            <td className="py-2 pr-3 font-bold whitespace-nowrap">{s.parametr}{s.jednostka ? <span className="text-slate-500 font-normal"> [{s.jednostka}]</span> : null}</td>
                                            <td className="py-2 pr-3 text-xs text-slate-500 whitespace-nowrap">{ost.normaTekst || '—'}</td>
                                            {kolumny.map(b => {
                                                const p = wartosc(s, b.id);
                                                return (
                                                    <td key={b.id} className={`py-2 px-2 text-right tabular-nums whitespace-nowrap ${p ? FLAGA_KOLOR[p.flaga || ''] : 'text-slate-600'}`}>
                                                        {p ? <>{p.wynik}{p.flaga === 'wysoki' ? ' ▲' : p.flaga === 'niski' ? ' ▼' : ''}</> : '·'}
                                                    </td>
                                                );
                                            })}
                                            <td className="py-2 pl-2 text-center text-lg" title={Z.KIERUNEK_SLOWO[s.trend.kierunek]}>{STRZALKA[s.trend.kierunek] || '·'}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <p className="text-[11px] text-slate-500 mt-3">
                        ▲ powyżej normy z wydruku, ▼ poniżej. Strzałka trendu to porównanie dwóch ostatnich pomiarów
                        (zmiana poniżej 5% liczona jako brak zmiany). Ocenę liczy aplikacja z norm wpisanych w Twoich wynikach.
                    </p>
                </div>
            );
        }

        function Badania({ vault, save }) {
            const [edit, setEdit] = useState(null);
            const [analiza, setAnaliza] = useState(false);
            const [extra, setExtra] = useState('');
            const badania = vault.badania.slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
            const serie = useMemo(() => Z.labSeries(vault.badania), [vault.badania]);
            const zTrendem = serie.filter(s => s.punkty.length > 1);
            const odstajace = serie.filter(s => { const o = s.punkty.slice(-1)[0] || {}; return o.flaga === 'wysoki' || o.flaga === 'niski'; });

            const zapisz = (b) => {
                const exists = vault.badania.some(x => x.id === b.id);
                save(Object.assign({}, vault, { badania: exists ? vault.badania.map(x => x.id === b.id ? b : x) : [...vault.badania, b] }));
                setEdit(null);
            };
            const usun = (id) => { save(Object.assign({}, vault, { badania: vault.badania.filter(x => x.id !== id) })); setEdit(null); };

            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-extrabold">Badania</h2>
                        <button className="btn btn-main" onClick={() => setEdit(Z.newLab())}><Icon name="plus" /> Dodaj wynik</button>
                    </div>

                    {!badania.length ? (
                        <div className="card p-6 text-center text-sm text-slate-400">
                            <p className="mb-3">Nie masz jeszcze wpisanych wyników.</p>
                            <p className="text-xs">Wczytaj PDF z laboratorium — parametry, wyniki i normy wyciągnę z wydruku, a potem pokażę, co się zmienia między badaniami.</p>
                        </div>
                    ) : null}

                    {odstajace.length ? (
                        <div className="card p-4">
                            <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Poza normą w najnowszym wyniku ({odstajace.length})</h3>
                            <div className="flex flex-wrap gap-2">
                                {odstajace.map(s => {
                                    const o = s.punkty.slice(-1)[0];
                                    return (
                                        <span key={s.key} className={`pill ${FLAGA_PILL[o.flaga]}`}>
                                            {s.parametr}: {o.wynik}{s.jednostka ? ' ' + s.jednostka : ''} {o.flaga === 'wysoki' ? '▲' : '▼'} {STRZALKA[s.trend.kierunek]}
                                        </span>
                                    );
                                })}
                            </div>
                        </div>
                    ) : null}

                    {zTrendem.length ? <TabelaPorownawcza badania={badania} serie={serie} /> : null}

                    {zTrendem.length ? (
                        <div className="card p-4">
                            <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Przebieg w czasie</h3>
                            <div className="grid sm:grid-cols-2 gap-4">
                                {zTrendem.map(s => (
                                    <div key={s.key} className="rounded-xl border border-slate-800 bg-slate-950 p-3">
                                        <div className="flex items-baseline justify-between gap-2">
                                            <span className="font-bold text-sm">{s.parametr}</span>
                                            <span className="text-xs text-slate-500">{s.jednostka}</span>
                                        </div>
                                        <WykresTrendu seria={s} />
                                        <div className="text-xs text-slate-400">
                                            {s.punkty.map(p => p.wynik).join(' → ')}
                                            {s.trend.zmianaProc != null && s.trend.kierunek !== 'stabilnie'
                                                ? ` (${s.trend.zmianaProc > 0 ? '+' : ''}${s.trend.zmianaProc}%)` : ''}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : null}

                    {badania.length ? (
                        <div className="space-y-2">
                            {badania.map(b => {
                                const poza = (b.pozycje || []).filter(p => p.flaga === 'wysoki' || p.flaga === 'niski');
                                return (
                                    <button key={b.id} className="card w-full text-left p-4 hover:border-slate-700" onClick={() => setEdit(b)}>
                                        <div className="flex items-start justify-between gap-3">
                                            <div className="min-w-0">
                                                <div className="font-extrabold">{Z.formatDatePl(b.data) || 'bez daty'}{b.opis ? ' — ' + b.opis : ''}</div>
                                                <div className="text-xs text-slate-400 mt-0.5">
                                                    {(b.pozycje || []).length} {Z.plural((b.pozycje || []).length, 'parametr', 'parametry', 'parametrów')}
                                                    {b.laboratorium ? ' · ' + b.laboratorium : ''}{b.uwagi ? ' · ' + b.uwagi : ''}
                                                </div>
                                            </div>
                                            {poza.length ? <span className="pill pill-stop shrink-0">poza normą: {poza.length}</span> : <span className="pill pill-ok shrink-0">wszystko w normie</span>}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    ) : null}

                    {badania.length ? (
                        <div className="card p-5">
                            <div className="flex items-center justify-between">
                                <h3 className="font-extrabold">Co z tych liczb wynika</h3>
                                <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => setAnaliza(!analiza)}>{analiza ? 'Ukryj' : 'Pokaż'}</button>
                            </div>
                            <p className="text-sm text-slate-400 mt-1 mb-3">
                                AI dostaje gotowe liczby i porównania policzone tutaj — nie przelicza ich i nie dopisuje własnych norm.
                                Wypisze, co odstaje, co się zmienia i o co zapytać lekarza.
                            </p>
                            {analiza ? (
                                <>
                                    <Field label="Co dopisać od siebie" hint="np. od miesiąca bóle stawów rąk nad ranem">
                                        <textarea className="field" value={extra} onChange={e => setExtra(e.target.value)} />
                                    </Field>
                                    <div className="mt-4"><AiKartka tytul="Omów moje wyniki" prompts={Z.labPrompts(vault, { extra })} vault={vault} /></div>
                                </>
                            ) : null}
                        </div>
                    ) : null}

                    {edit ? <LabForm lab={edit} isNew={!vault.badania.some(x => x.id === edit.id)} vault={vault}
                        onSave={zapisz} onClose={() => setEdit(null)} onDelete={vault.badania.some(x => x.id === edit.id) ? usun : null} /> : null}
                </div>
            );
        }

        // ---------- zakładka: Analiza (dokument dla lekarza) ----------
        function Analiza({ vault, save }) {
            const [extra, setExtra] = useState('');
            // Domyślnie bierzemy KAŻDY dokument z wczytaną treścią – właśnie na pomijaniu dokumentów
            // wywróciła się pierwsza wersja. Odznaczenie jest świadomą decyzją, nie przypadkiem.
            const zTrescia = vault.dokumenty.filter(d => d.tekst);
            const [docs, setDocs] = useState(() => zTrescia.map(d => d.id));
            const [wybor, setWybor] = useState(false);
            // Nowy dokument dokładamy do zaznaczonych sam, usunięty wypada z listy. Odznaczenia użytkownika zostają.
            const znaneRef = useRef(zTrescia.map(d => d.id));
            useEffect(() => {
                const istnieja = zTrescia.map(d => d.id);
                const nowe = istnieja.filter(id => !znaneRef.current.includes(id));
                znaneRef.current = istnieja;
                setDocs(prev => [...new Set([...prev.filter(id => istnieja.includes(id)), ...nowe])]);
            }, [vault.dokumenty]);
            const prompts = useMemo(() => Z.reportPrompts(vault, { extra, docs }), [vault, extra, docs]);
            const ile = {
                leki: vault.leki.filter(m => m.aktywny !== false).length,
                urzadzenia: vault.urzadzenia.filter(u => u.aktywne !== false).length,
                kontrole: vault.urzadzenia.reduce((a, u) => a + (u.kontrole || []).length, 0),
                badania: vault.badania.length,
                dokumenty: docs.length,
                skora: vault.skora.filter(z => z.status !== 'zagojona' && z.status !== 'usunieta').length,
                pytania: vault.pytania.filter(q => !q.zadane).length
            };
            const pusto = !Object.values(ile).some(Boolean) && !vault.profil.choroby;

            const zapiszJakoDokument = (html) => {
                const d = Object.assign(Z.newDoc(), {
                    rodzaj: 'inne', tytul: 'Karta informacyjna pacjenta', data: todayIso(),
                    tekst: DT.plainText(html), uwagi: 'Dokument przygotowany w aplikacji przed wizytą'
                });
                save(Object.assign({}, vault, { dokumenty: [...vault.dokumenty, d] }));
                alert('Zapisano w zakładce Dokumenty.');
            };

            return (
                <div className="space-y-5">
                    <h2 className="text-2xl font-extrabold">Dokument dla lekarza</h2>
                    <Note tone="info">
                        AI zbiera wszystko, co masz w kartotece — choroby, uczulenia, leki, wszczepione urządzenia,
                        ostatnie wyniki, obserwowane zmiany i Twoje pytania — i układa to w jedną kartkę do wydrukowania.
                        <strong> Nie stawia rozpoznań i nie ocenia wyników</strong>, tylko porządkuje to, co wpisałeś.
                    </Note>

                    <div className="card p-4">
                        <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Co wejdzie do dokumentu</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                            {[['Leki', ile.leki, 'pill'], ['Urządzenia', ile.urzadzenia, 'heartbeat'], ['Kontrole', ile.kontrole, 'activity'], ['Badania', ile.badania, 'test-tube'],
                              ['Dokumenty', ile.dokumenty, 'folders'], ['Zmiany skórne', ile.skora, 'eye'], ['Pytania', ile.pytania, 'question']].map(([label, n, ikona]) => (
                                <div key={label} className="rounded-xl border border-slate-800 bg-slate-950 p-3">
                                    <Icon name={ikona} className="text-lg text-slate-500" />
                                    <div className="text-xl font-extrabold text-teal-300">{n}</div>
                                    <div className="text-[11px] text-slate-500">{label}</div>
                                </div>
                            ))}
                        </div>
                        <p className="text-xs text-slate-500 mt-3">
                            Do zapytania idzie treść <strong>każdego</strong> wczytanego dokumentu i każdego protokołu kontroli —
                            przy długich wypisach każdy dostaje swój udział w limicie, zamiast wypadać na rzecz pierwszego.
                        </p>
                    </div>

                    {zTrescia.length ? (
                        <div className="card p-4">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-400">
                                    Dokumenty w zapytaniu ({docs.length} z {zTrescia.length})
                                </h3>
                                <button className="btn btn-soft !py-1.5 !text-xs" onClick={() => setWybor(!wybor)}>
                                    {wybor ? 'Ukryj listę' : 'Wybierz, które brać'}
                                </button>
                            </div>
                            {wybor ? (
                                <>
                                    <p className="text-xs text-slate-400 mt-2 mb-3">
                                        Wszystkie są zaznaczone. Odznacz tylko to, czego lekarz nie potrzebuje — im mniej dokumentów,
                                        tym więcej miejsca dla pozostałych.
                                    </p>
                                    <div className="space-y-2">
                                        {zTrescia.map(d => (
                                            <label key={d.id} className="flex items-start gap-3 text-sm cursor-pointer">
                                                <input type="checkbox" className="w-4 h-4 mt-0.5 accent-teal-400" checked={docs.includes(d.id)}
                                                    onChange={e => setDocs(prev => e.target.checked ? [...prev, d.id] : prev.filter(x => x !== d.id))} />
                                                <span className="flex-1">
                                                    {d.tytul || 'Dokument'}
                                                    <span className="block text-xs text-slate-500">
                                                        {(Z.RODZAJE_DOKUMENTOW.find(r => r.id === d.rodzaj) || {}).label}
                                                        {d.data ? ' · ' + Z.formatDatePl(d.data) : ' · bez daty'}
                                                        {` · ${d.tekst.length.toLocaleString('pl')} znaków`}
                                                    </span>
                                                </span>
                                            </label>
                                        ))}
                                    </div>
                                </>
                            ) : null}
                        </div>
                    ) : null}

                    {pusto ? (
                        <Note tone="warn">Kartoteka jest jeszcze pusta — uzupełnij profil i leki, inaczej dokument nie będzie miał z czego powstać.</Note>
                    ) : null}

                    <Field label="Co dopisać od siebie" hint="np. od dwóch tygodni duszność przy wchodzeniu na piętro">
                        <textarea className="field" value={extra} onChange={e => setExtra(e.target.value)} />
                    </Field>

                    <AiKartka tytul="Przygotuj dokument" prompts={prompts} vault={vault} model="strong" onZapisz={zapiszJakoDokument} />
                </div>
            );
        }

        // ---------- udostępnianie bliskiej osobie ----------
        function Udostepnianie({ vault, session, setSession, onClose }) {
            const [krok, setKrok] = useState(1);
            const [dane, setDane] = useState({ label: '', pass: '', pass2: '' });
            const [err, setErr] = useState('');
            const [busy, setBusy] = useState(false);
            const [nowaSesja, setNowaSesja] = useState(null);

            const dodajHaslo = async () => {
                setErr(''); setBusy(true);
                try {
                    if (dane.pass !== dane.pass2) throw new Error('Hasła się różnią.');
                    const next = await Z.addPassword(session, dane.pass, dane.label || 'Osoba bliska');
                    setSession(next);
                    setNowaSesja(next);
                    setKrok(2);
                } catch (x) { setErr(x.message); } finally { setBusy(false); }
            };

            const pobierzKopie = async () => {
                setBusy(true);
                try {
                    const blob = await Z.seal(vault, nowaSesja || session);
                    const zdjecia = await Z.exportPhotos().catch(() => []);
                    download(JSON.stringify(Object.assign({}, blob, { zdjecia })), `moje-zdrowie-dla-bliskiej-osoby-${todayIso()}.json`, 'application/json');
                    setKrok(3);
                } catch (x) { setErr(x.message); } finally { setBusy(false); }
            };

            return (
                <Modal title="Udostępnij bliskiej osobie" onClose={onClose} wide>
                    <Note tone="warn">
                        Nie ma tu „podglądu” ani ograniczonego dostępu: osoba, której dasz hasło, <strong>widzi całą kartotekę
                        i może ją zmieniać</strong> u siebie. Nie ma też synchronizacji — od chwili przekazania pliku to dwie
                        osobne kopie. Jeśli chcesz dać komuś tylko najważniejsze informacje, wydrukuj kartkę z zakładki „Kartki”.
                    </Note>

                    <ol className="mt-5 space-y-4">
                        <li className={`rounded-2xl border p-4 ${krok === 1 ? 'border-teal-700 bg-teal-950/20' : 'border-slate-800'}`}>
                            <h3 className="font-extrabold text-sm mb-1">1. Ustal hasło dla tej osoby</h3>
                            <p className="text-xs text-slate-400 mb-3">Osobne hasło, nie Twoje. W każdej chwili możesz je usunąć w Ustawieniach — wtedy przestanie otwierać nowe kopie.</p>
                            {krok === 1 ? (
                                <>
                                    <div className="grid sm:grid-cols-3 gap-3">
                                        <input className="field" value={dane.label} onChange={e => setDane(Object.assign({}, dane, { label: e.target.value }))} placeholder="kto, np. żona Anna" />
                                        <input type="password" className="field" value={dane.pass} onChange={e => setDane(Object.assign({}, dane, { pass: e.target.value }))} placeholder="hasło (min. 8 znaków)" autoComplete="new-password" />
                                        <input type="password" className="field" value={dane.pass2} onChange={e => setDane(Object.assign({}, dane, { pass2: e.target.value }))} placeholder="powtórz" autoComplete="new-password" />
                                    </div>
                                    <button className="btn btn-main mt-3" disabled={busy || dane.pass.length < 8} onClick={dodajHaslo}>Dodaj hasło</button>
                                </>
                            ) : <p className="text-sm text-teal-300">✓ Hasło dodane{dane.label ? ` („${dane.label}”)` : ''}.</p>}
                        </li>

                        <li className={`rounded-2xl border p-4 ${krok === 2 ? 'border-teal-700 bg-teal-950/20' : 'border-slate-800'} ${krok < 2 ? 'opacity-50' : ''}`}>
                            <h3 className="font-extrabold text-sm mb-1">2. Pobierz zaszyfrowaną kopię</h3>
                            <p className="text-xs text-slate-400 mb-3">Plik zawiera kartotekę i zdjęcia, zaszyfrowane. Bez hasła to nieczytelny szum, więc możesz go wysłać mailem albo wrzucić na dysk w chmurze.</p>
                            {krok === 2 ? <button className="btn btn-main" disabled={busy} onClick={pobierzKopie}><Icon name="download-simple" /> Pobierz plik</button> : null}
                            {krok > 2 ? <p className="text-sm text-teal-300">✓ Plik pobrany.</p> : null}
                        </li>

                        <li className={`rounded-2xl border p-4 ${krok === 3 ? 'border-teal-700 bg-teal-950/20' : 'border-slate-800'} ${krok < 3 ? 'opacity-50' : ''}`}>
                            <h3 className="font-extrabold text-sm mb-1">3. Co ta osoba ma zrobić</h3>
                            <ol className="text-sm text-slate-300 space-y-1 list-decimal pl-5">
                                <li>Otworzyć tę samą stronę na swoim komputerze lub telefonie (hasło do strony podajesz jej osobno).</li>
                                <li>Na ekranie hasła kliknąć „Otwórz z kopii zapasowej” i wskazać przesłany plik.</li>
                                <li>Wpisać hasło, które przed chwilą ustaliłeś — <strong>przekaż je inną drogą niż plik</strong>, najlepiej ustnie.</li>
                            </ol>
                        </li>
                    </ol>

                    {err ? <div className="mt-4"><Note tone="stop">{err}</Note></div> : null}
                    <div className="flex gap-2 mt-6"><button className="btn btn-soft" onClick={onClose}>Zamknij</button></div>
                </Modal>
            );
        }

        // ---------- aplikacja ----------
        const ZAKLADKI = [
            { id: 'dzis', label: 'Dziś', icon: 'sun' },
            { id: 'leki', label: 'Leki', icon: 'pill' },
            { id: 'wizyty', label: 'Wizyty', icon: 'stethoscope' },
            { id: 'urzadzenia', label: 'Urządzenia', icon: 'heartbeat' },
            { id: 'skora', label: 'Skóra', icon: 'eye' },
            { id: 'badania', label: 'Badania', icon: 'test-tube' },
            { id: 'dokumenty', label: 'Dokumenty', icon: 'folders' },
            { id: 'analiza', label: 'Dla lekarza', icon: 'first-aid-kit' },
            { id: 'kartki', label: 'Kartki', icon: 'printer' },
            { id: 'profil', label: 'Profil', icon: 'user' },
            { id: 'ustawienia', label: 'Ustawienia', icon: 'gear' }
        ];

        function App() {
            const [stored, setStored] = useState(readStored);
            const [vault, setVault] = useState(null);
            const [session, setSession] = useState(null);
            const [tab, setTab] = useState('dzis');
            const [zapis, setZapis] = useState('');
            const sessionRef = useRef(null);
            const ostatniRuch = useRef(Date.now());

            useReminders(vault || Z.emptyVault(), !!(vault && vault.settings && vault.settings.glos));

            const persist = useCallback(async (next, sess) => {
                const s = sess || sessionRef.current;
                if (!s) return;
                try {
                    const blob = await Z.seal(next, s);
                    localStorage.setItem(Z.VAULT_KEY, JSON.stringify(blob));
                    setStored(blob);
                    setZapis('zapisano ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }));
                } catch (e) {
                    setZapis('BŁĄD ZAPISU — zrób kopię zapasową');
                }
            }, []);

            const save = useCallback((next) => { setVault(next); persist(next); }, [persist]);

            const otworz = (data, sess) => {
                sessionRef.current = sess;
                setSession(sess);
                setVault(data);
                ostatniRuch.current = Date.now();
                persist(data, sess);
            };

            const zamknij = useCallback(() => {
                sessionRef.current = null;
                setSession(null); setVault(null); setTab('dzis');
                // Kartka przygotowana do druku zostaje w DOM poza Reactem – po zablokowaniu musi zniknąć
                // razem z danymi (znalezione przy teście w przeglądarce: leki były widoczne na ekranie hasła).
                const kartka = document.getElementById('edubox-print-root');
                if (kartka) kartka.innerHTML = '';
                try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* brak syntezatora nie przeszkadza w blokadzie */ }
            }, []);

            // Nowe hasło albo usunięte hasło zmienia sloty – trzeba je zapisać razem z danymi.
            const zmienSesje = (next) => { sessionRef.current = next; setSession(next); persist(vault, next); };

            const wymaz = () => {
                if (!confirm('Usunąć całą kartotekę z tego urządzenia? Bez kopii zapasowej danych nie da się odzyskać.')) return;
                if (!confirm('Na pewno? To już ostatnie pytanie.')) return;
                localStorage.removeItem(Z.VAULT_KEY);
                Z.clearPhotos().catch(() => { /* brak bazy zdjęć nie blokuje usunięcia kartoteki */ });
                setStored(null);
                zamknij();
            };

            // Blokada po bezczynności – klucz znika z pamięci, dane zostają zaszyfrowane.
            useEffect(() => {
                if (!vault) return;
                const minut = Number(vault.settings && vault.settings.lockMinutes) || 15;
                const ruch = () => { ostatniRuch.current = Date.now(); };
                ['mousemove', 'keydown', 'touchstart', 'click'].forEach(ev => window.addEventListener(ev, ruch, { passive: true }));
                const id = setInterval(() => { if (Date.now() - ostatniRuch.current > minut * 60000) zamknij(); }, 20000);
                return () => {
                    clearInterval(id);
                    ['mousemove', 'keydown', 'touchstart', 'click'].forEach(ev => window.removeEventListener(ev, ruch));
                };
            }, [vault, zamknij]);

            if (!vault || !session) return <Gate stored={stored} onOpen={otworz} />;

            const ileAlertow = Z.alerts(vault).length + Z.checkCombo(vault.leki, vault.profil).filter(o => o.poziom === 'stop').length;

            return (
                <div className="min-h-screen">
                    <header className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 py-3">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-teal-400 text-teal-950 grid place-items-center text-lg shrink-0"><Icon name="heartbeat" /></div>
                                <div className="min-w-0 flex-1">
                                    <h1 className="font-extrabold leading-tight">Moje Zdrowie</h1>
                                    <p className="text-[11px] text-slate-500 truncate">{zapis || 'dane zaszyfrowane na tym urządzeniu'}{IS_LOCAL ? ' · plik lokalny' : ''}</p>
                                </div>
                                {ileAlertow ? <span className="pill pill-sprawdz shrink-0">{ileAlertow}</span> : null}
                                <button className="btn btn-soft !py-1.5 !px-3 shrink-0" onClick={zamknij} title="Zablokuj"><Icon name="lock" /></button>
                            </div>
                            <nav className="flex gap-1 overflow-x-auto mt-3 -mx-1 px-1 pb-1">
                                {ZAKLADKI.map(z => (
                                    <button key={z.id} className="tab shrink-0" aria-pressed={tab === z.id} onClick={() => setTab(z.id)}>
                                        <Icon name={z.icon} className="mr-1" />{z.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 py-6">
                        {tab === 'dzis' ? <Dzis vault={vault} save={save} goto={setTab} /> : null}
                        {tab === 'leki' ? <Leki vault={vault} save={save} /> : null}
                        {tab === 'wizyty' ? <Wizyty vault={vault} save={save} /> : null}
                        {tab === 'urzadzenia' ? <Urzadzenia vault={vault} save={save} /> : null}
                        {tab === 'skora' ? <Skora vault={vault} save={save} session={session} /> : null}
                        {tab === 'badania' ? <Badania vault={vault} save={save} /> : null}
                        {tab === 'dokumenty' ? <Dokumenty vault={vault} save={save} /> : null}
                        {tab === 'analiza' ? <Analiza vault={vault} save={save} /> : null}
                        {tab === 'kartki' ? <Kartki vault={vault} save={save} /> : null}
                        {tab === 'profil' ? <Profil vault={vault} save={save} /> : null}
                        {tab === 'ustawienia' ? <Ustawienia vault={vault} save={save} session={session} setSession={zmienSesje} onLock={zamknij} onWipe={wymaz} /> : null}
                    </main>

                    <footer className="max-w-4xl mx-auto px-4 pb-10 text-[11px] text-slate-600 leading-relaxed">
                        Aplikacja pomaga się zorganizować — nie stawia diagnoz, nie zastępuje lekarza ani farmaceuty.
                        W nagłym wypadku dzwoń na 112, wieczorem i w weekend nocna pomoc lekarska, infolinia NFZ 800 190 590.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
