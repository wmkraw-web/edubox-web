    <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->

        import { EduBoxCore } from './global-core.js';

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // KREATOR KOLOROWANEK ZE ZDJĘCIA (Photoshop Engine - ZERO Halucynacji)
        // ==========================================
        const PhotoToColoringBook = ({ showToast }) => {
            const [imageSrc, setImageSrc] = useState(null);
            const [styleOption, setStyleOption] = useState('szkola');
            const [isProcessing, setIsProcessing] = useState(false);
            const canvasRef = useRef(null);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setImageSrc(event.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const processImage = () => {
                if (!imageSrc) return;
                setIsProcessing(true);
                
                setTimeout(() => {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const img = new Image();
                    
                    img.onload = () => {
                        // Ograniczamy maksymalny rozmiar, żeby przeglądarka nie "chrupnęła"
                        const MAX_WIDTH = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        
                        // Grubość krawędzi dostosowana do wybranego przycisku
                        let blurRadius = 4; // Szkoła
                        if (styleOption === 'przedszkole') blurRadius = 8;
                        if (styleOption === 'mandala') blurRadius = 2;

                        // 1. Warstwa bazowa: Skala szarości
                        ctx.filter = 'grayscale(100%)';
                        ctx.drawImage(img, 0, 0, width, height);
                        const grayData = ctx.getImageData(0, 0, width, height);
                        
                        // 2. Warstwa górna: Odwrócenie kolorów i rozmycie
                        ctx.filter = `grayscale(100%) invert(100%) blur(${blurRadius}px)`;
                        ctx.drawImage(img, 0, 0, width, height);
                        const blurredData = ctx.getImageData(0, 0, width, height);
                        
                        // 3. Magia Photoshopa: Łączenie warstw (Color Dodge)
                        const finalData = ctx.createImageData(width, height);
                        for(let i = 0; i < finalData.data.length; i += 4) {
                            const g = grayData.data[i];
                            const b = blurredData.data[i];
                            
                            let val;
                            if (b === 255) val = 255;
                            else val = Math.min(255, (g * 255) / (255 - b));
                            
                            // Wybielanie tła i ekstremalne przyciemnianie samych konturów
                            if (val > 215) val = 255; // Czysta kartka papieru
                            else val = val * 0.5;     // Wyraźny czarny ołówek
                            
                            finalData.data[i] = val;
                            finalData.data[i+1] = val;
                            finalData.data[i+2] = val;
                            finalData.data[i+3] = 255;
                        }
                        
                        ctx.putImageData(finalData, 0, 0);
                        setIsProcessing(false);
                    };
                    img.src = imageSrc;
                }, 50); // Minimalne opóźnienie, by React zdążył wyrenderować status
            };

            // Przelicz obrazek od nowa natychmiast po zmianie stylu z menu
            useEffect(() => {
                if (imageSrc) processImage();
            }, [imageSrc, styleOption]);

            const handleDownload = () => {
                const link = document.createElement('a');
                link.download = 'moja-kolorowanka.png';
                link.href = canvasRef.current.toDataURL('image/png');
                link.click();
            };

            return (
                <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50 mt-12 print-hidden shadow-xl">
                    <div className="text-center mb-8">
                        <div className="inline-flex items-center gap-2 bg-blue-900/30 border border-blue-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-blue-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                            <i className="ph-bold ph-lightning"></i> Smart Filter Local
                        </div>
                        <h2 className="text-3xl font-black text-white mb-4">Zamień Zdjęcie w Kolorowankę! 🪄</h2>
                        <p className="text-slate-400 max-w-xl mx-auto text-lg">
                            System działa w 100% lokalnie u Ciebie w przeglądarce. Zachowuje idealnie wszystkie twarze i postacie bez zniekształceń.
                        </p>
                    </div>

                    <div className="mb-8 max-w-3xl mx-auto">
                        <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider text-center">1. Wybierz grubość linii:</label>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <button onClick={() => setStyleOption('przedszkole')} className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'przedszkole' ? 'bg-pink-600/20 border-pink-500 text-pink-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                <span className="text-2xl">🧸</span> Przedszkole
                                <span className="text-[10px] font-normal opacity-80">(Grube linie)</span>
                            </button>
                            <button onClick={() => setStyleOption('szkola')} className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'szkola' ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                <span className="text-2xl">🎒</span> Klasy 1-3
                                <span className="text-[10px] font-normal opacity-80">(Standardowe)</span>
                            </button>
                            <button onClick={() => setStyleOption('mandala')} className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'mandala' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                <span className="text-2xl">✨</span> Mandala / Dorośli
                                <span className="text-[10px] font-normal opacity-80">(Cienkie detale)</span>
                            </button>
                        </div>
                    </div>

                    <div className="text-center">
                        <label className="inline-block bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-8 rounded-2xl cursor-pointer transition-all active:scale-95 mb-8 text-lg border border-slate-700">
                            <i className="ph-bold ph-upload-simple mr-2 text-xl"></i>
                            2. Wybierz zdjęcie
                            <input type="file" accept="image/jpeg, image/png, image/webp" className="hidden" onChange={handleImageUpload} />
                        </label>
                    </div>

                    {isProcessing && <div className="text-center text-blue-400 font-bold mb-4 animate-pulse">Analizowanie obrazu...</div>}

                    <div className={`overflow-hidden rounded-2xl border-4 border-dashed border-slate-700 bg-white relative ${imageSrc ? 'block' : 'hidden'} max-w-2xl mx-auto`}>
                        <canvas ref={canvasRef} className="max-w-full h-auto mx-auto print-only-image"></canvas>
                    </div>

                    {imageSrc && (
                        <div className="mt-8 flex justify-center gap-4">
                            <button onClick={() => setImageSrc(null)} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-6 rounded-xl transition-all">
                                Zmień zdjęcie
                            </button>
                            <button onClick={handleDownload} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center gap-2">
                                <i className="ph-bold ph-download-simple text-xl"></i> Pobierz do druku
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [promptInput, setPromptInput] = useState('');
            const [styleOption, setStyleOption] = useState('szkola'); 
            const [generatedImage, setGeneratedImage] = useState(null);
            const [generationStep, setGenerationStep] = useState(null); // 'translating' | 'generating' | null
            
            // === CANVAS STATE ===
            const [selectedColor, setSelectedColor] = useState("#f43f5e"); 
            const [brushSize, setBrushSize] = useState(15); 
            const canvasRef = useRef(null);
            const ctxRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false); 
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);

            const resultRef = useRef(null);
            const colors = ["#f43f5e", "#fbbf24", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#000000", "#ffffff"];

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'coloring_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === PANCERNE API FUNCTIONS ===
            const fetchWithExponentialBackoff = async (url, options, timeoutMs = 25000) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                let lastErr;
                for (let i = 0; i < 5; i++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                        const fetchOptions = { ...options, signal: controller.signal };
                        
                        const res = await fetch(url, fetchOptions);
                        clearTimeout(timeoutId);
                        
                        if (!res.ok) {
                            const errText = await res.text();
                            throw new Error(`HTTP ${res.status}: ${errText.substring(0, 80)}`);
                        }
                        return await res.json();
                    } catch (err) {
                        lastErr = err;
                        if (err.name === 'AbortError') lastErr = new Error("Serwer nie odpowiedział na czas (Timeout).");
                        if (i < 4) await new Promise(r => setTimeout(r, delays[i]));
                    }
                }
                throw lastErr;
            };

            // TŁUMACZ POLECEŃ
            const fetchTranslatedPrompt = async (polishText) => {
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: polishText, 
                            system: `Translate the following Polish coloring book subject into a highly concise, purely visual English description. Return ONLY the pure English phrase.`,
                            temperature: 0.3,
                            model: "gpt-4o-mini"
                        })
                    });
                    if(res.ok) {
                        const data = await res.json();
                        return data.text.trim().replace(/['"\n]/g, '');
                    }
                    throw new Error("Chat API failed");
                } catch(e) {
                    console.warn("Używam awaryjnego tłumacza (Canvas Mode)");
                    try {
                        const apiKey = ""; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: polishText }] }],
                                systemInstruction: { parts: [{ text: "Translate the following Polish coloring book subject into a highly concise, purely visual English description. Return ONLY the English phrase, no quotes." }] },
                                generationConfig: { temperature: 0.1 }
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            return data.candidates[0].content.parts[0].text.trim().replace(/['"\n]/g, '');
                        }
                        return polishText; // Fallback
                    } catch (err) {
                        return polishText;
                    }
                }
            };

            const secureApiImageCall = async (payloadData) => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000);
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadData),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (res.ok) return await res.json();
                    throw new Error(`Status API: ${res.status}`);
                } catch (e) {
                    console.warn("Przełączam na model awaryjny obrazu (Canvas):", e.message);
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    
                    const payload = {
                        instances: { prompt: payloadData.prompt },
                        parameters: { sampleCount: 1 } 
                    };

                    return await fetchWithExponentialBackoff(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }, 25000);
                }
            };

            // === LOGIC ===
            const generateColoringPage = () => {
                if (!promptInput.trim()) { showToast('Wpisz, co chcesz narysować!', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setGeneratedImage(null);
                        
                        try {
                            setGenerationStep('translating');
                            const englishSubject = await fetchTranslatedPrompt(promptInput);

                            setGenerationStep('generating');
                            let styleModifier = "";
                            if (styleOption === 'przedszkole') {
                                styleModifier = "extremely simple toddler coloring page, thick bold black vector lines, large empty white spaces";
                            } else if (styleOption === 'szkola') {
                                styleModifier = "standard kids coloring book page, clean bold black outlines, uncolored, 2D flat vector style";
                            } else if (styleOption === 'mandala') {
                                styleModifier = "detailed mandala coloring page, crisp black outlines, uncolored, geometric";
                            }

                            const hiddenInstruction = `Monochrome coloring book page of ${englishSubject}. ${styleModifier}. Strictly black outlines on pure white background. Flat 2D vector art. No shading, no grayscale, no halftones, no colors.`;
                            const negativePrompt = "shading, gradients, grayscale, sketch, pencil, realistic, 3d, colors, shadows, halftone, text, watermark, painted, complex background";

                            const payload = {
                                prompt: hiddenInstruction, 
                                negative_prompt: negativePrompt, 
                                style_preset: 'line-art',
                                aspect_ratio: '1:1',
                                width: 1024,
                                height: 1024
                            };

                            const data = await secureApiImageCall(payload);
                            const base64Image = data.predictions?.[0]?.bytesBase64Encoded || data.artifacts?.[0]?.base64 || data.image || data.imageUrl || data.image_url || data.url; 
                            
                            if (base64Image) {
                                const finalImage = base64Image.startsWith('http') || base64Image.startsWith('data:image') ? base64Image : `data:image/png;base64,${base64Image}`;
                                setGeneratedImage(finalImage);
                                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                            } else {
                                throw new Error("Brak danych obrazu");
                            }

                        } catch (error) {
                            console.error("Szczegóły błędu:", error); 
                            showToast(`Błąd: ${error.message.substring(0, 80)}`, 'error');
                        } finally { 
                            setGenerationStep(null); 
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedImage) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { promptInput, styleOption, imageUrl: generatedImage };
                    const shortTitle = promptInput.substring(0, 30) + (promptInput.length > 30 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('coloring_market', 'MagicColor', shortTitle, configToSave);
                    showToast("Opublikowano na Giełdzie Kolorowanek! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setPromptInput(item.config.promptInput || '');
                setStyleOption(item.config.styleOption || 'szkola');
                setGeneratedImage(item.config.imageUrl || null);
                setAppMode('generator');
                showToast("Wczytano projekt z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            // === CANVAS INTELLIGENT PIXEL WHITENER & DRAWING ===
            useEffect(() => {
                if (generatedImage && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext("2d");
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; 
                    
                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            
                            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                            
                            if (luminance > 220) { 
                                data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
                            } else {
                                const darken = Math.max(0, luminance - 100);
                                data[i] = darken; data[i + 1] = darken; data[i + 2] = darken;
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        
                        ctx.globalCompositeOperation = 'multiply';
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctxRef.current = ctx;
                    };
                    img.src = generatedImage;
                }
            }, [generatedImage]); 

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                if(e.cancelable) e.preventDefault(); 
                const { x, y } = getCoordinates(e);
                ctxRef.current.beginPath();
                ctxRef.current.moveTo(x, y);
                
                if (selectedColor === "#ffffff") {
                    ctxRef.current.globalCompositeOperation = 'source-over';
                    ctxRef.current.strokeStyle = "#ffffff";
                } else {
                    ctxRef.current.globalCompositeOperation = 'multiply';
                    ctxRef.current.strokeStyle = selectedColor;
                }
                
                ctxRef.current.lineWidth = brushSize;
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if(e.cancelable) e.preventDefault();
                const { x, y } = getCoordinates(e);
                ctxRef.current.lineTo(x, y);
                ctxRef.current.stroke();
            };

            const stopDrawing = () => {
                if(ctxRef.current) ctxRef.current.closePath();
                setIsDrawing(false);
            };

            const handlePrint = () => {
                window.print();
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-pink-500 to-amber-500 rounded-xl flex items-center justify-center shadow-lg shadow-pink-500/20">
                            <i className="ph-bold ph-palette text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">MagicColor<span className="text-pink-400">AI</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-pink-600/20 text-pink-400 border border-pink-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Kreator Kolorowanek
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-amber-600/20 text-amber-400 border border-amber-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-books text-lg"></i> Giełda Kolorowanek
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-pink-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-pink-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-pink-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Kolorowanek</h2>
                            <p className="text-slate-400 mb-8">Pobieraj i modyfikuj kolorowanki stworzone przez innych nauczycieli i dzieci.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-4 rounded-2xl flex flex-col hover:border-pink-500/50 transition-colors group">
                                        <div className="w-full h-48 bg-white rounded-xl mb-4 overflow-hidden border-2 border-slate-300 relative flex items-center justify-center p-2">
                                            {item.config.imageUrl ? (
                                                <img src={item.config.imageUrl} className="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform duration-500 mix-blend-multiply" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-600"><i className="ph-thin ph-image text-4xl"></i></div>
                                            )}
                                        </div>
                                        <h3 className="text-sm font-bold text-white mb-2 line-clamp-2">"{item.config.promptInput}"</h3>
                                        <div className="flex gap-2 text-[10px] text-slate-400 mb-4 flex-wrap">
                                            <span className="bg-slate-800 px-2 py-1 rounded capitalize">{item.config.styleOption}</span>
                                        </div>
                                        <div className="mt-auto flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-pink-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Maluj na nowo
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych kolorowanek w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div><div className="aura-blob aura-3 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    {generationStep && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-pink-500/20 shadow-[0_0_50px_rgba(244,63,94,0.2)]">
                                <i className="ph-bold ph-spinner-gap animate-spin text-5xl text-pink-500"></i>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">
                                        {generationStep === 'translating' ? 'Tłumaczenie pojęć...' : 'Szkicowanie grafiki...'}
                                    </h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-4xl mx-auto print-hidden">
                            
                            <div className="text-center mb-10 fade-in">
                                <div className="inline-flex items-center gap-2 bg-pink-900/30 border border-pink-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-pink-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                    Inteligentny Rysownik
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Narysuj wyobraźnię <span className="text-gradient">dzieci.</span>
                                </h1>
                                <p className="text-slate-400 text-lg">
                                    Wpisz dowolny szalony pomysł w języku polskim, a sztuczna inteligencja narysuje czarno-białą, idealną kolorowankę gotową do druku.
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50" style={{animationDelay: '0.1s'}}>
                                
                                <div className="mb-8">
                                    <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider">Wybierz stopień trudności (Styl):</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <button 
                                            onClick={() => setStyleOption('przedszkole')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'przedszkole' ? 'bg-pink-600/20 border-pink-500 text-pink-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">🧸</span> Przedszkole
                                            <span className="text-[10px] font-normal opacity-80">(Grube, proste linie)</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('szkola')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'szkola' ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">🎒</span> Klasy 1-3
                                            <span className="text-[10px] font-normal opacity-80">(Klasyczna kolorowanka)</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('mandala')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'mandala' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">✨</span> Mandala / Dorośli
                                            <span className="text-[10px] font-normal opacity-80">(Zaawansowane wzory)</span>
                                        </button>
                                    </div>
                                </div>

                                <label className="block text-white font-bold mb-4 text-lg">Co mam dzisiaj narysować?</label>
                                
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={promptInput}
                                        onChange={(e) => setPromptInput(e.target.value)}
                                        onKeyPress={(e) => { if(e.key === 'Enter') generateColoringPage(); }}
                                        placeholder="Np. Wesoła księżniczka z koroną..."
                                        className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-pink-500 outline-none text-lg pr-16"
                                    />
                                    <span className="absolute right-5 top-1/2 -translate-y-1/2 text-2xl"><i className="ph-fill ph-magic-wand text-pink-500"></i></span>
                                </div>

                                <div className="mt-6 flex flex-wrap gap-2">
                                    <span className="text-xs text-slate-500 font-bold uppercase mt-2 mr-2">Szybkie pomysły:</span>
                                    {['Wesoły dinozaur jedzący pizzę', 'Zamek księżniczki na chmurze', 'Piesek jadący na deskorolce', 'Sowa w okularach'].map(idea => (
                                        <button key={idea} onClick={() => setPromptInput(idea)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg border border-slate-700 transition-colors">
                                            {idea}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-10 flex justify-end">
                                    <button 
                                        onClick={generateColoringPage}
                                        disabled={generationStep !== null || !promptInput}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(244,63,94,0.3)] btn-bounce
                                            ${generationStep !== null ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-pink-600 to-amber-500 hover:scale-105 active:scale-95'}`}
                                    >
                                        {generationStep !== null ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Trwa praca ({(generationStep === 'translating' ? '1/2' : '2/2')})...</>
                                        ) : (
                                            <><i className="ph-bold ph-pencil-simple text-xl"></i> Wygeneruj Kolorowankę</>
                                        )}
                                    </button>
                                </div>
                            </div>
                            
                            {/* WSTAWIENIE MODUŁU "ZDJĘCIE -> KOLOROWANKA" */}
                            <PhotoToColoringBook showToast={showToast} />
                        </div>

                        {/* WYNIKI */}
                        {generatedImage && (
                            <div ref={resultRef} className="max-w-6xl mx-auto mt-12 print:mt-0 print:block">
                                
                                <div className="flex justify-end gap-3 mb-6 print-hidden">
                                    <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                        <i className="ph-bold ph-globe text-lg"></i> Zapisz na Giełdzie
                                    </button>
                                </div>

                                <div className="flex flex-col lg:flex-row gap-8 items-start">
                                    
                                    <div className="flex-1 flex flex-col items-center w-full">
                                        <div className="w-full text-center sm:text-left mb-6 print-hidden">
                                            <h3 className="text-2xl font-bold text-white mb-2">Twoja Kolorowanka</h3>
                                            <p className="text-slate-400 text-sm">Pokoloruj ją na ekranie palcem, używając pisaków obok, lub wydrukuj czystą!</p>
                                        </div>

                                        <div className="bg-white p-2 sm:p-4 rounded-3xl magic-border shadow-2xl print:shadow-none print:p-0 print:rounded-none w-full max-w-2xl relative">
                                            {/* Zintegrowane płótno z inteligentnym wybielaczem i malowaniem po liniach (multiply) */}
                                            <canvas
                                                ref={canvasRef}
                                                onMouseDown={startDrawing}
                                                onMouseMove={draw}
                                                onMouseUp={stopDrawing}
                                                onMouseOut={stopDrawing}
                                                onTouchStart={startDrawing}
                                                onTouchMove={draw}
                                                onTouchEnd={stopDrawing}
                                                className="w-full max-w-2xl rounded-xl bg-white block mx-auto print-only-image"
                                            />
                                        </div>
                                    </div>

                                    <div className="w-full lg:w-80 print-hidden sticky top-28">
                                        <div className="glass-panel p-6 rounded-[2rem] border border-slate-700/50 flex flex-col gap-6">
                                            
                                            <div>
                                                <h3 className="text-white font-bold mb-4 text-sm uppercase tracking-wider border-b border-slate-700 pb-2">Magiczne pisaki</h3>
                                                <div className="flex flex-wrap gap-3">
                                                    {colors.map((c) => (
                                                        <button
                                                            key={c}
                                                            onClick={() => setSelectedColor(c)}
                                                            className={`w-10 h-10 rounded-full shadow-md border-2 transition-transform ${
                                                                selectedColor === c ? "scale-125 border-white" : "border-slate-700 hover:scale-110"
                                                            }`}
                                                            style={{ backgroundColor: c }}
                                                            title={c === "#ffffff" ? "Gumka" : "Kolor"}
                                                        >
                                                            {c === "#ffffff" && <span className="text-slate-500 text-[10px] flex justify-center mt-2.5 font-bold uppercase"><i className="ph-bold ph-eraser"></i></span>}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <h3 className="text-white font-bold mb-3 text-sm uppercase tracking-wider">Grubość pisaka</h3>
                                                <input 
                                                    type="range" 
                                                    min="5" 
                                                    max="40" 
                                                    value={brushSize}
                                                    onChange={(e) => setBrushSize(e.target.value)}
                                                    className="w-full accent-pink-500"
                                                />
                                                <div className="flex justify-between text-xs text-slate-400 mt-1 font-medium">
                                                    <span>Cienki</span>
                                                    <span>Gruby</span>
                                                </div>
                                            </div>

                                            <div className="mt-4 pt-6 border-t border-slate-700">
                                                <button 
                                                    onClick={handlePrint}
                                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-[0_0_15px_rgba(16,185,129,0.3)] text-lg"
                                                >
                                                    <i className="ph-bold ph-printer text-2xl"></i> Wydrukuj 
                                                </button>
                                                <p className="text-xs text-slate-500 text-center mt-4 leading-relaxed font-medium">
                                                    Wskazówka: Zawsze rysuj palcem po ekranie w trybie dotykowym.<br/>Zamalowania nie zasłonią czarnych kresek dzięki trybowi "multiply".
                                                </p>
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
