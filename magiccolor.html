<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Magic Color AI - Generator Kolorowanek</title>
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            /* Zapobiega przypadkowemu przewijaniu strony podczas rysowania po ekranie na telefonach */
            overscroll-behavior-y: contain; 
        }
        
        .aura-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #db2777, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #f59e0b, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.05); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .text-gradient { background: linear-gradient(135deg, #f43f5e 0%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-bounce:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Magiczny efekt ramki obrazka */
        .magic-border {
            position: relative;
        }
        .magic-border::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, #f43f5e, #fbbf24, #f43f5e);
            border-radius: inherit;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 200% 200%;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ustawienia dla wirtualnego płótna */
        canvas {
            touch-action: none; 
            cursor: crosshair;
        }

        /* PERFEKCYJNY WYDRUK KOLOROWANKI */
        @media print {
            body { background-color: white !important; color: black !important; }
            .print-hidden { display: none !important; }
            .print-only-image { 
                display: block !important; 
                width: 100% !important; 
                height: auto !important; 
                max-height: 95vh;
                object-fit: contain;
                margin: 0 auto;
            }
            .glass-panel, .magic-border::before { display: none !important; }
            @page { margin: 1cm; size: portrait; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            // =========================================================================
            // Kod PIN dla aplikacji (Zostawiłem bez zmian)
            const SECRET_PIN = "KAWA2024"; 
            const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";
            const FREE_TRIES_LIMIT = 3;
            // =========================================================================

            // ZMIENNE STANU (Twoje + narzędzia do rysowania)
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [freeTries, setFreeTries] = useState(0);
            const [showPaywall, setShowPaywall] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            
            const [promptInput, setPromptInput] = useState('');
            const [styleOption, setStyleOption] = useState('szkola'); 
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');

            // Zmienne do kolorowania
            const [selectedColor, setSelectedColor] = useState("#f43f5e"); // Domyślny kolor pasujący do motywu
            const [brushSize, setBrushSize] = useState(10); 
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false); 
            const ctxRef = useRef(null);
            const resultRef = useRef(null);

            // Paleta kolorów
            const colors = ["#f43f5e", "#fbbf24", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#000000", "#ffffff"];

            // -------------------------------------------------------------
            // TWOJE FUNKCJE DO ŁADOWANIA DANYCH I API (Zostawiłem bez zmian)
            // -------------------------------------------------------------
            useEffect(() => {
                const savedAuth = localStorage.getItem('magicColorAuth') === 'true';
                if (savedAuth) setIsAuthenticated(true);
                const savedTries = parseInt(localStorage.getItem('magicColorFreeTries') || '0');
                setFreeTries(savedTries);
            }, []);

            const fetchWithRetry = async (url, options, retries = 3, delay = 1000) => {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error || `Status API: ${response.status}`);
                        }
                        return await response.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                    }
                }
            };

            const secureApiCall = async (payload) => {
                const isProduction = window.location.hostname.includes('vercel.app') || 
                                     (window.location.hostname !== '' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1');

                if (isProduction) {
                    return await fetchWithRetry('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payload, type: 'image' })
                    });
                } else {
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    return await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
            };

            const generateColoringPage = async () => {
                if (!isAuthenticated && freeTries >= FREE_TRIES_LIMIT) {
                    setShowPaywall(true);
                    return;
                }
                if (!promptInput.trim()) {
                    setError('Musisz wpisać, co chcesz narysować!');
                    return;
                }

                setIsGenerating(true);
                setError('');
                setGeneratedImage(null);

                try {
                    let styleModifier = "";
                    if (styleOption === 'przedszkole') {
                        styleModifier = "Very simple toddler coloring book, thick bold black contours, minimal details";
                    } else if (styleOption === 'szkola') {
                        styleModifier = "Standard kids coloring book page, clear black outlines";
                    } else if (styleOption === 'mandala') {
                        styleModifier = "Intricate adult coloring page, beautiful complex mandala design, detailed black lines";
                    }

                    const hiddenInstruction = `B&W vector line art coloring page, strictly uncolored contours ONLY. Subject: ${promptInput}. ${styleModifier}. Pure monochrome, pure white background, thick black bold lines, NO colors, no shading, no grayscale.`;

                    const payload = {
                        prompt: hiddenInstruction, 
                        instances: { prompt: hiddenInstruction }, 
                        parameters: { sampleCount: 1 }
                    };

                    const data = await secureApiCall(payload);
                    const base64Image = data.predictions?.[0]?.bytesBase64Encoded;
                    
                    if (base64Image) {
                        setGeneratedImage(`data:image/png;base64,${base64Image}`);
                        
                        if (!isAuthenticated) {
                            const newTries = freeTries + 1;
                            setFreeTries(newTries);
                            localStorage.setItem('magicColorFreeTries', newTries.toString());
                        }
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź API graficznego.");
                    }

                } catch (err) {
                    console.error("Błąd grafiki:", err);
                    setError('Wystąpił problem z przetworzeniem żądania. Serwer mógł być obciążony, spróbuj kliknąć jeszcze raz.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleLogin = () => {
                if (passwordInput === SECRET_PIN) {
                    setIsAuthenticated(true);
                    setShowPaywall(false);
                    localStorage.setItem('magicColorAuth', 'true');
                } else {
                    alert('Nieprawidłowy kod PIN!');
                }
            };

            // -------------------------------------------------------------
            // FUNKCJE RYSOWANIA PO PŁÓTNIE (CANVAS)
            // -------------------------------------------------------------
            useEffect(() => {
                if (generatedImage && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext("2d");
                    const img = new Image();
                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        // Zapewniamy białe tło dla poprawnego mieszania kolorów (multiply)
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        ctx.drawImage(img, 0, 0);
                        ctx.globalCompositeOperation = 'multiply';
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctxRef.current = ctx;
                    };
                    img.src = generatedImage;
                }
            }, [generatedImage]); 

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if(e.cancelable) e.preventDefault(); 
                const { x, y } = getCoordinates(e);
                ctxRef.current.beginPath();
                ctxRef.current.moveTo(x, y);
                
                if (selectedColor === "#ffffff") {
                    ctxRef.current.globalCompositeOperation = 'source-over';
                    ctxRef.current.strokeStyle = "#ffffff";
                } else {
                    ctxRef.current.globalCompositeOperation = 'multiply';
                    ctxRef.current.strokeStyle = selectedColor;
                }
                
                ctxRef.current.lineWidth = brushSize;
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if(e.cancelable) e.preventDefault();
                const { x, y } = getCoordinates(e);
                ctxRef.current.lineTo(x, y);
                ctxRef.current.stroke();
            };

            const stopDrawing = () => {
                ctxRef.current.closePath();
                setIsDrawing(false);
            };

            const handlePrint = () => {
                if (canvasRef.current) {
                    const dataUrl = canvasRef.current.toDataURL("image/png");
                    const windowContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Twoja Kolorowanka - EduBox PRO</title>
                            <style>
                                @page { size: A4; margin: 1cm; }
                                body { margin: 0; display: flex; justify-content: center; align-items: center; background-color: white; height: 100vh; }
                                img { max-width: 100%; max-height: 100%; object-fit: contain; }
                            </style>
                        </head>
                        <body>
                            <img src="${dataUrl}" />
                        </body>
                        </html>
                    `;
                    const printWin = window.open('', '', 'width=800,height=800');
                    printWin.document.open();
                    printWin.document.write(windowContent);
                    printWin.document.close();
                    
                    setTimeout(() => {
                        printWin.focus();
                        printWin.print();
                        printWin.close();
                    }, 500);
                }
            };

            // ==========================================
            // EKRAN BLOKADY (PAYWALL) 
            // ==========================================
            if (showPaywall) {
                return (
                    <div className="min-h-screen relative flex items-center justify-center p-4 print-hidden">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        
                        <div className="glass-panel p-10 rounded-3xl max-w-md w-full text-center shadow-[0_0_50px_rgba(244,63,94,0.2)] border border-rose-500/30 fade-in relative z-10">
                            <div className="w-24 h-24 bg-gradient-to-br from-pink-500 to-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <h2 className="text-3xl font-black text-white mb-2">Limit wyczerpany!</h2>
                            <p className="text-slate-300 text-sm mb-8 font-medium">Wykorzystałeś swoje darmowe próby ({FREE_TRIES_LIMIT}/{FREE_TRIES_LIMIT}). Podaj kod PIN, aby uzyskać nielimitowany dostęp PRO.</p>
                            
                            <input 
                                type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)}
                                onKeyPress={(e) => { if (e.key === 'Enter') handleLogin(); }}
                                placeholder="Wpisz PIN..."
                                className="w-full bg-slate-900 border border-slate-600 text-center text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-pink-500 outline-none mb-6 text-2xl tracking-[0.5em] font-bold uppercase"
                            />
                            
                            <button 
                                onClick={handleLogin}
                                className="w-full bg-gradient-to-r from-pink-600 to-amber-500 hover:from-pink-500 hover:to-amber-400 text-white font-black py-4 rounded-xl transition-all transform hover:scale-105 btn-bounce text-lg shadow-lg mb-4"
                            >
                                Odblokuj System
                            </button>
                            <button 
                                onClick={() => setShowPaywall(false)}
                                className="text-slate-400 hover:text-white text-sm font-bold mb-8"
                            >
                                Wróć do strony głównej
                            </button>

                            <div className="pt-6 border-t border-slate-700/50">
                                <p className="text-slate-400 text-xs mb-3 font-medium">Nie masz dostępu? Zdobądź kod PIN wspierając projekt!</p>
                                <a href={BUY_COFFEE_LINK} target="_blank" rel="noopener noreferrer" className="w-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-3 text-sm btn-bounce hover:border-amber-500/50 hover:text-amber-400 shadow-md">
                                    <span className="text-xl">☕</span> Postaw Kawę i odbierz PIN
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // GŁÓWNY WIDOK APLIKACJI
            // ==========================================
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-pink-500 to-amber-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">MagicColor<span className="text-pink-400">AI PRO</span></span>
                            </div>
                            <div className="flex items-center gap-4">
                                {!isAuthenticated ? (
                                    <div className="bg-slate-800/80 border border-slate-600 px-3 py-1.5 rounded-full text-xs font-bold text-slate-300 flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                                        Darmowe próby: {FREE_TRIES_LIMIT - freeTries}
                                    </div>
                                ) : (
                                    <div className="bg-emerald-500/20 border border-emerald-500/50 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-400 flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                        Konto PRO Aktywne
                                    </div>
                                )}
                                
                                {!isAuthenticated && (
                                    <button onClick={() => setShowPaywall(true)} className="text-pink-400 hover:text-pink-300 text-xs sm:text-sm font-bold transition-colors">
                                        Zaloguj
                                    </button>
                                )}
                                
                                <a href="index.html" className="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-300 hover:text-white transition-colors bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl border border-slate-600">
                                    Wróć
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-5xl mx-auto">
                            
                            <div className="text-center mb-12 fade-in print-hidden">
                                <div className="inline-flex items-center gap-2 bg-pink-900/30 border border-pink-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-pink-400 uppercase tracking-widest mb-4">
                                    Inteligentny Rysownik
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Narysuj wyobraźnię <span className="text-gradient">dzieci.</span>
                                </h1>
                                <p className="text-slate-400 text-lg">
                                    Wpisz dowolny szalony pomysł, a sztuczna inteligencja narysuje czarno-białą, idealną kolorowankę gotową do wydruku.
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50 print-hidden max-w-3xl mx-auto" style={{animationDelay: '0.1s'}}>
                                
                                <div className="mb-8">
                                    <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider">Wybierz stopień trudności (Styl):</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <button 
                                            onClick={() => setStyleOption('przedszkole')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'przedszkole' ? 'bg-pink-600/20 border-pink-500 text-pink-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">🧸</span> Przedszkole
                                            <span className="text-[10px] font-normal opacity-80">(Grube, proste linie)</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('szkola')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'szkola' ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">🎒</span> Klasy 1-3
                                            <span className="text-[10px] font-normal opacity-80">(Klasyczna kolorowanka)</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('mandala')}
                                            className={`p-3 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-1 ${styleOption === 'mandala' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <span className="text-2xl">✨</span> Mandala / Dorośli
                                            <span className="text-[10px] font-normal opacity-80">(Zaawansowane wzory)</span>
                                        </button>
                                    </div>
                                </div>

                                <label className="block text-white font-bold mb-4 text-lg">Co mam dzisiaj narysować?</label>
                                
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={promptInput}
                                        onChange={(e) => setPromptInput(e.target.value)}
                                        onKeyPress={(e) => { if(e.key === 'Enter') generateColoringPage(); }}
                                        placeholder="Np. Sowa w okularach czytająca książkę..."
                                        className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-pink-500 outline-none text-lg pr-16"
                                    />
                                    <span className="absolute right-5 top-1/2 -translate-y-1/2 text-2xl">🪄</span>
                                </div>

                                <div className="mt-6 flex flex-wrap gap-2">
                                    <span className="text-xs text-slate-500 font-bold uppercase mt-2 mr-2">Szybkie pomysły:</span>
                                    {['Wesoły dinozaur jedzący pizzę', 'Zamek księżniczki na chmurze', 'Piesek jadący na deskorolce', 'Sowa w okularach'].map(idea => (
                                        <button key={idea} onClick={() => setPromptInput(idea)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg border border-slate-700 transition-colors">
                                            {idea}
                                        </button>
                                    ))}
                                </div>

                                {error && <div className="mt-6 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>}

                                <div className="mt-10 flex justify-center">
                                    <button 
                                        onClick={generateColoringPage}
                                        disabled={isGenerating || !promptInput}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(244,63,94,0.3)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-pink-600 to-amber-500 hover:scale-105'}`}
                                    >
                                        {isGenerating ? (
                                            <><svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Rysowanie w toku...</>
                                        ) : (!isAuthenticated && freeTries >= FREE_TRIES_LIMIT ? 'Odblokuj dostęp PRO' : 'Wygeneruj Kolorowankę')}
                                    </button>
                                </div>
                            </div>

                            {/* WYNIK - POŁĄCZONY MOTYW CIEMNY Z NARZĘDZIAMI DO KOLOROWANIA */}
                            {generatedImage && (
                                <div ref={resultRef} className="mt-12 fade-in print:mt-0">
                                    
                                    <div className="flex flex-col lg:flex-row gap-8">
                                        
                                        {/* LEWA STRONA: WIRTUALNE PŁÓTNO */}
                                        <div className="flex-1 flex flex-col items-center">
                                            <div className="w-full text-center sm:text-left mb-6 print-hidden">
                                                <h3 className="text-2xl font-bold text-white mb-2">Twoja Kolorowanka</h3>
                                                <p className="text-slate-400 text-sm">Pokoloruj ją na ekranie używając narzędzi obok, lub wydrukuj czystą!</p>
                                            </div>

                                            <div className="bg-white p-2 sm:p-4 rounded-3xl magic-border shadow-2xl print:shadow-none print:p-0 w-full max-w-2xl relative">
                                                <canvas
                                                    ref={canvasRef}
                                                    onMouseDown={startDrawing}
                                                    onMouseMove={draw}
                                                    onMouseUp={stopDrawing}
                                                    onMouseOut={stopDrawing}
                                                    onTouchStart={startDrawing}
                                                    onTouchMove={draw}
                                                    onTouchEnd={stopDrawing}
                                                    className="w-full max-w-2xl rounded-xl touch-none bg-white block mx-auto print-only-image"
                                                />
                                            </div>
                                        </div>

                                        {/* PRAWA STRONA: PANEL Z NARZĘDZIAMI */}
                                        <div className="w-full lg:w-80 print-hidden">
                                            <div className="glass-panel p-6 rounded-[2rem] border border-slate-700/50 flex flex-col gap-6 sticky top-28">
                                                
                                                <div>
                                                    <h3 className="text-white font-bold mb-4 text-sm uppercase tracking-wider border-b border-slate-700 pb-2">Magiczne pisaki</h3>
                                                    <div className="flex flex-wrap gap-3">
                                                        {colors.map((c) => (
                                                            <button
                                                                key={c}
                                                                onClick={() => setSelectedColor(c)}
                                                                className={`w-10 h-10 rounded-full shadow-md border-2 transition-transform ${
                                                                    selectedColor === c ? "scale-125 border-white" : "border-slate-700 hover:scale-110"
                                                                }`}
                                                                style={{ backgroundColor: c }}
                                                                title={c === "#ffffff" ? "Gumka" : "Kolor"}
                                                            >
                                                                {c === "#ffffff" && <span className="text-slate-500 text-[10px] flex justify-center mt-1.5 font-bold uppercase">Gumka</span>}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <h3 className="text-white font-bold mb-3 text-sm uppercase tracking-wider">Grubość pisaka</h3>
                                                    <input 
                                                        type="range" 
                                                        min="5" 
                                                        max="40" 
                                                        value={brushSize}
                                                        onChange={(e) => setBrushSize(e.target.value)}
                                                        className="w-full accent-pink-500"
                                                    />
                                                    <div className="flex justify-between text-xs text-slate-400 mt-1 font-medium">
                                                        <span>Cienki</span>
                                                        <span>Gruby</span>
                                                    </div>
                                                </div>

                                                <div className="mt-4 pt-6 border-t border-slate-700">
                                                    <button 
                                                        onClick={handlePrint}
                                                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-[0_0_15px_rgba(16,185,129,0.3)] text-lg"
                                                    >
                                                        🖨️ Wydrukuj Dzieciom
                                                    </button>
                                                    <p className="text-xs text-slate-500 text-center mt-4 leading-relaxed font-medium">
                                                        Wskazówka: Rysuj palcem po ekranie!<br/>Zamalowania nie zasłonią czarnych kresek.
                                                    </p>
                                                </div>

                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
