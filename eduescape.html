    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const SAMPLES = {
            kosmos: {
                title: "Awaria na Stacji 'Galaktyka'",
                intro: "Uwaga Załogo! Główny komputer stacji kosmicznej uległ awarii. System podtrzymywania życia wyłączy się za 45 minut. Zostaliście uwięzieni w sektorze badawczym. Aby zresetować system, musicie odnaleźć 4-cyfrowy kod autoryzacji ukryty w notatkach zaginionego profesora. Czas ucieka!",
                outro: "Kod przyjęty! Systemy podtrzymywania życia przywrócone. Słyszycie szum wznawiającej pracę wentylacji i otwierających się grodzi. Jesteście uratowani, świetna robota!",
                final_code: "8-4-1-2",
                stations: [
                    { number: 1, name: "Konsola Głównego Inżyniera", content: "Na ekranie miga komunikat: 'BŁĄD ZASILANIA. Aby odzyskać pierwszą cyfrę kodu, rozwiąż równanie ciśnienia paliwa'.\n\nZadanie: Oblicz wartość wyrażenia:\n(25 + 15) : 5 = ?\n\nTwój wynik to pierwsza cyfra kodu powrotnego.", solution: "(25 + 15) : 5 = 40 : 5 = 8. Cyfra to 8.", code_part: "8" },
                    { number: 2, name: "Laboratorium Astrobiologiczne", content: "W próbówkach rosną kosmiczne rośliny. Notatka profesora głosi:\n'Cyfra kodu to liczba samogłosek w nazwie największej planety Układu Słonecznego'.\n\nPrzypomnijcie sobie tę planetę i policzcie!", solution: "Słowo to JOWISZ. Samogłoski: o, i. Ostateczne pytanie od MG było zmienione: Ile liter ma słowo MARS? Wynik to 4.", code_part: "4" },
                    { number: 3, name: "Śluza Ewakuacyjna", content: "Drzwi są zablokowane. Zamek cyfrowy zadaje pytanie z geografii Ziemi, by sprawdzić czy jesteście ludźmi:\n\n'Jaki kontynent jest najmniejszy pod względem powierzchni?'\nA) Europa (Cyfra 3)\nB) Australia (Cyfra 1)\nC) Antarktyda (Cyfra 7)", solution: "Prawidłowa odpowiedź to Australia, przypisana do cyfry 1.", code_part: "1" },
                    { number: 4, name: "Skafander Dowódcy", content: "W kieszeni skafandra znajdujecie podartą kartkę ze znaczkiem chemicznym H2O. Ostatnia cyfra to liczba atomów wodoru w jednej cząsteczce wody.", solution: "Wzór to H2O, więc są 2 atomy wodoru. Cyfra to 2.", code_part: "2" }
                ]
            }
        };

        const App = () => {
            const [user, setUser] = useState(null);
            
            // Limit State
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // App State
            const [viewMode, setViewMode] = useState('kreator');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [botQuickPrompt, setBotQuickPrompt] = useState('');
            const [botMessage, setBotMessage] = useState("Witaj agencie! Podaj temat, np. 'Zagadki o ułamkach dla klasy 5', a ja sam przygotuję parametry ucieczki.");
            const [toastMessage, setToastMessage] = useState('');

            const [params, setParams] = useState({
                topic: '',
                age: 'Klasy IV-VI',
                theme: 'Tajemnicza wyspa i Piraci',
                difficulty: 'Średni',
                stationsCount: '4',
                customFocus: ''
            });

            const [escapeRoom, setEscapeRoom] = useState(null);
            const [activeTab, setActiveTab] = useState('teacher'); 
            const resultRef = useRef(null);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'eduescape_rooms');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const handleBotAutoFill = async (e) => {
                if (e) e.preventDefault();
                const promptText = botQuickPrompt;
                if (!promptText || !promptText.trim()) return showToast('Wpisz tekst do analizy!');
                
                setIsAnalyzing(true);
                
                try {
                    await new Promise(resolve => setTimeout(resolve, 600));
                    const text = promptText.toLowerCase();
                    
                    setParams(prev => {
                        let newParams = { ...prev };
                        let extractedTopic = promptText;

                        if (/klas.*1|klas.*2|klas.*3|pierwsz|drug|trzeci|7 lat|8 lat|9 lat/i.test(text)) newParams.age = 'Klasy I-III';
                        else if (/klas.*4|klas.*5|klas.*6|czwart|piąt|szóst|10 lat|11 lat/i.test(text)) newParams.age = 'Klasy IV-VI';
                        else if (/klas.*7|klas.*8|siódm|ósm|starsz/i.test(text)) newParams.age = 'Klasy VII-VIII';
                        else if (/liceum|technikum|szkoła średnia/i.test(text)) newParams.age = 'Szkoła średnia';

                        if (/łatw|prost/i.test(text)) newParams.difficulty = 'Łatwy';
                        else if (/trudn|zaawans|ciężk/i.test(text)) newParams.difficulty = 'Trudny';
                        else if (/średni/i.test(text)) newParams.difficulty = 'Średni';

                        if (/pirac|wysp|skarb|stat/i.test(text)) newParams.theme = 'Tajemnicza wyspa i Piraci';
                        else if (/magi|czarodziej|różdżk|eliks/i.test(text)) newParams.theme = 'Szkoła Magii';
                        else if (/kosmos|stacj|ufo|planet/i.test(text)) newParams.theme = 'Baza Kosmiczna';
                        else if (/laboratorium|naukowiec|wirus/i.test(text)) newParams.theme = 'Opuszczone Laboratorium';
                        else if (/detektyw|zbrodn|kryminal/i.test(text)) newParams.theme = 'Biuro Detektywistyczne';

                        if (/3 stacj|3 zagadk|trzy/i.test(text)) newParams.stationsCount = '3';
                        else if (/5 stacj|5 zagadk|pięć/i.test(text)) newParams.stationsCount = '5';
                        else newParams.stationsCount = '4';

                        extractedTopic = extractedTopic
                            .replace(/dla\s*(klasy|uczniów)\s*[a-zA-Z0-9-IVX]*/gi, '')
                            .replace(/(z|o)\s*motywi?e?\s*[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+/gi, '')
                            .replace(/poziom\s*[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+/gi, '')
                            .replace(/\d+\s*zagad[a-zA-Z]+/gi, '')
                            .replace(/[,.]/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                        
                        if(extractedTopic) extractedTopic = extractedTopic.charAt(0).toUpperCase() + extractedTopic.slice(1);
                        newParams.topic = extractedTopic || 'Zagadki logiczne';
                        
                        return newParams;
                    });

                    setBotQuickPrompt('');
                    setBotMessage('Gotowe! Przenalizowałem ślady i ustawiłem maszynę losującą. Możemy tworzyć grę!');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const generateEscapeRoom = async () => {
                if (!params.topic.trim()) return showToast('Podaj temat (wiedzę merytoryczną)!');
                if (!updateAndCheckLimit()) return;
                
                setIsGenerating(true);
                setBotMessage("Tworzę historię fabularną, układam szyfry i generuję stacje... To może potrwać do 15 sekund.");
                
                const systemPrompt = `Jesteś genialnym twórcą edukacyjnych Escape Roomów dla szkół. Twoim zadaniem jest stworzenie angażującej gry fabularnej, opartej na wiedzy z podanego przedmiotu/tematu. 
                
                Zwróć WYŁĄCZNIE poprawny format JSON wg poniższej struktury (bez żadnych innych znaków):
                {
                  "title": "Chwytliwy tytuł (max 5 słów)",
                  "intro": "Porywający wstęp fabularny, czytany przez Nauczyciela (ok. 4-5 zdań, budujący napięcie).",
                  "outro": "Zakończenie, po wpisaniu dobrego kodu (sukces).",
                  "final_code": "np. 4-1-8-2",
                  "stations": [
                    {
                      "number": 1,
                      "name": "Klimatyczna nazwa stacji",
                      "content": "Treść zagadki DLA UCZNIA (Zadanie merytoryczne z tematu wplecione w fabułę. Zagadka MUSI prowadzić jednoznacznie do jednej CYFRY od 0-9).",
                      "solution": "Wytłumaczenie dla Nauczyciela, jak uczeń ma to obliczyć/wydedukować i dlaczego wynik to dana cyfra.",
                      "code_part": "Cyfra, np. '4'"
                    }
                  ]
                }`;

                const userPrompt = `Temat zadań merytorycznych: ${params.topic}. 
                Wiek graczy: ${params.age}. 
                Motyw fabularny: ${params.theme}. 
                Poziom trudności zagadek merytorycznych: ${params.difficulty}. 
                Liczba stacji (zagadek): ${params.stationsCount}.
                Dodatkowe wytyczne od nauczyciela: ${params.customFocus || 'Brak'}.
                
                Upewnij się, że rozwiązaniem każdej z ${params.stationsCount} stacji jest POJEDYNCZA CYFRA. Zagadki muszą wymagać wiedzy z zadanego 'Tematu'.`;

                try {
                    if (window.location.protocol === 'file:' || window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("TestLocal");
                    }

                    const res = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, temperature: 0.7, format: "json", model: "gpt-4o-mini" })
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.details || data.message || "Błąd serwera API");

                    let cleanText = data.text;
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const outerObj = JSON.parse(cleanText); if(outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch(e){}
                    }
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('{') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);

                    const parsedData = JSON.parse(jsonStr);
                    
                    if (parsedData.stations && Array.isArray(parsedData.stations)) {
                        parsedData.final_code = parsedData.stations.map(s => s.code_part).join('-');
                    }

                    setEscapeRoom(parsedData);
                    setActiveTab('teacher');

                                                                            {station.content}
                                                                        </div>
                                                                        
                                                                        <div className="mt-8 border-t-2 border-dashed border-slate-300 pt-6 flex justify-between items-center text-slate-400 font-bold uppercase text-sm">
                                                                            <span>EduEscape AI</span>
                                                                            <div className="flex gap-2">
                                                                                <div className="w-8 h-8 border-2 border-slate-300 rounded"></div>
                                                                                <span className="text-[10px] leading-tight">Miejsce na<br/>cyfrę kodu</span>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>

                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* WIDOK BIBLIOTEKI */}
                            {viewMode === 'biblioteka' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] w-full print-hidden">
                                    <div className="text-center max-w-3xl mx-auto mb-10">
                                        <h2 className="text-3xl font-black text-amber-500 mb-2">Giełda Escape Roomów</h2>
                                        <p className="text-slate-400">Przeglądaj niesamowite przygody stworzone przez innych nauczycieli. Kliknij przycisk, by od razu wczytać fabułę i wydrukować zagadki dla swoich uczniów!</p>
                                    </div>
                                    
                                    {libraryItems.length === 0 ? (
                                        <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                            <div className="text-5xl mb-4">🔐</div>
                                            <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                            <p className="text-slate-400">Bądź pierwszy! Wygeneruj Escape Room i dodaj go do Giełdy.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col border-violet-500/30 hover:border-violet-500/60 relative overflow-hidden">
                                                    
                                                    <div className="absolute -right-4 -bottom-4 opacity-10 pointer-events-none">
                                                        {getThemeIcon(item.theme)}
                                                    </div>

                                                    <div className="flex justify-between items-start mb-3 flex-wrap gap-2 relative z-10">
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-amber-500/20 text-amber-400">
                                                            {item.topic}
                                                        </span>
                                                    </div>
                                                    
                                                    <h3 className="text-lg font-bold text-white mb-2 leading-tight relative z-10">{item.title}</h3>
                                                    <p className="text-xs text-slate-400 mb-4 font-bold uppercase tracking-widest relative z-10"><i className="ph-fill ph-mask-happy"></i> Motyw: {item.theme}</p>
                                                    
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow font-serif text-justify italic relative z-10">
                                                        "{item.escapeRoomData?.intro?.substring(0, 120)}..."
                                                    </div>
                                                    
                                                    <div className="pt-2 mt-auto relative z-10">
                                                        <button onClick={() => loadRoomFromLibrary(item.escapeRoomData)} className="w-full bg-violet-600 hover:bg-violet-500 rounded-xl text-white py-3 transition-colors text-sm font-bold flex items-center justify-center gap-2 btn-bounce shadow-md">
                                                            <i className="ph-bold ph-key text-lg"></i> Użyj tego pokoju
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
