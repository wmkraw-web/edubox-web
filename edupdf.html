<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBox V3 PRO MAX - EduPDF Edytor</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Biblioteki PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Klasyczne czcionki (często używane w dokumentach) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- WBUDOWANA BAZA DANYCH -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDL_mvepNJjMmZYQzifN2cXzoKwCE8jNd0",
            authDomain: "edubox-pro.firebaseapp.com",
            projectId: "edubox-pro",
            storageBucket: "edubox-pro.firebasestorage.app",
            messagingSenderId: "570263845714",
            appId: "1:570263845714:web:0b029211f7af071b66988b"
        };
        const APP_ID = "eduboxpro";

        let app, auth, db;
        try {
            app = initializeApp(FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) { console.warn("Firebase init failed", e); }

        window.EduBoxCore = {
            user: null,
            init: (callback) => {
                if (!auth) return;
                signInAnonymously(auth).catch(e => console.error(e));
                onAuthStateChanged(auth, (user) => {
                    window.EduBoxCore.user = user;
                    if(callback) callback(user);
                });
            }
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; overflow: hidden; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .app-bg {
            background-color: #e2e8f0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- STYLIZACJA ELEMENTÓW NA PŁÓTNIE --- */
        .pdf-element { position: absolute; pointer-events: auto; }
        
        /* Aktywny kontur TYLKO gdy element jest zaznaczony (Dla korektora brak śladu bez zaznaczenia) */
        .pdf-element.selected { outline: 2px solid #3b82f6; z-index: 50; }
        
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* Obszar wpisywania tekstu */
        .content-editable-box {
            outline: none;
            min-width: 20px;
            min-height: 1.2em;
            cursor: text;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 2px;
            margin: -2px; /* kompensacja paddingu */
        }
        
        .content-editable-box:empty:before {
            content: attr(data-placeholder);
            color: #cbd5e1;
            pointer-events: none;
            display: block;
        }

        /* Floating Toolbar (Lewitujący pasek narzędzi) */
        .floating-toolbar {
            position: absolute;
            top: -45px;
            left: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding: 4px;
            gap: 4px;
            z-index: 100;
            white-space: nowrap;
        }
        
        .floating-btn {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 6px;
            color: #475569; transition: all 0.2s;
            cursor: pointer; background: transparent; border: none;
        }
        .floating-btn:hover { background: #f1f5f9; color: #0f172a; }
        .floating-divider { width: 1px; height: 20px; background: #e2e8f0; margin: 0 2px; }

    </style>
</head>
<body>
    <div id="root" class="h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Inicjalizacja workera PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const RENDER_WIDTH = 800;

        function App() {
            const [user, setUser] = useState(null);
            const [pages, setPages] = useState([]); 
            const [activePageIdx, setActivePageIdx] = useState(0);
            
            const [isLoading, setIsLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState('');
            const [message, setMessage] = useState(null);
            
            const [selectedElementId, setSelectedElementId] = useState(null);
            const [zoom, setZoom] = useState(1);
            
            const [dragState, setDragState] = useState(null);
            const [sidebarTab, setSidebarTab] = useState('narzedzia'); // 'narzedzia' lub 'tekst'
            
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);
            // Ref do pilnowania, czy aktualnie piszemy
            const editModeRef = useRef(false);

            useEffect(() => {
                if (window.EduBoxCore && window.EduBoxCore.init) {
                    window.EduBoxCore.init((u) => setUser(u));
                }
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 4000);
            };

            // --- OBSŁUGA PLIKU PDF Z EKSTRAKCJĄ TEKSTU ---
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') {
                    showMessage('Proszę wgrać plik PDF.', 'error');
                    return;
                }

                setIsLoading(true);
                setLoadingMsg('Analizowanie dokumentu i wyciąganie tekstów...');

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    
                    const newPages = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const unscaledViewport = page.getViewport({ scale: 1.0 });
                        const scale = RENDER_WIDTH / unscaledViewport.width;
                        const viewport = page.getViewport({ scale: scale * 2 }); 

                        // Renderowanie do obrazu
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        // Ekstrakcja tekstu (NOWOŚĆ!)
                        const textContent = await page.getTextContent();
                        // Łączymy teksty, dodając nowe linie na podstawie pozycji Y, aby w miarę zachować strukturę
                        let extractedText = '';
                        let lastY = -1;
                        textContent.items.forEach(item => {
                            if (lastY !== -1 && Math.abs(lastY - item.transform[5]) > 5) {
                                extractedText += '\n'; // Nowa linia jeśli zmieniła się wysokość
                            }
                            extractedText += item.str + ' ';
                            lastY = item.transform[5];
                        });

                        newPages.push({
                            id: `page_${Date.now()}_${i}`,
                            type: 'pdf',
                            imgData: canvas.toDataURL('image/jpeg', 0.95), 
                            width: RENDER_WIDTH,
                            height: unscaledViewport.height * scale, 
                            extractedText: extractedText.trim(),
                            elements: []
                        });
                    }

                    setPages(newPages);
                    setActivePageIdx(0);
                    setSelectedElementId(null);
                    setSidebarTab('tekst'); // Automatycznie przełącz na zakładkę z tekstem, żeby pokazać nową funkcję!
                    showMessage('Dokument załadowany!');
                } catch (error) {
                    console.error(error);
                    showMessage('Błąd odczytu pliku PDF. Dokument może być zaszyfrowany.', 'error');
                } finally {
                    setIsLoading(false);
                    e.target.value = null; 
                }
            };

            const addBlankPage = () => {
                const heightA4 = RENDER_WIDTH * 1.4142; 
                const newPage = {
                    id: `page_${Date.now()}_blank`,
                    type: 'blank',
                    imgData: null,
                    width: RENDER_WIDTH,
                    height: heightA4,
                    extractedText: 'To jest pusta strona dodana przez Ciebie.',
                    elements: []
                };
                setPages([...pages, newPage]);
                setActivePageIdx(pages.length); 
                setSelectedElementId(null);
                showMessage('Dodano pustą stronę!');
            };

            // --- ZARZĄDZANIE ELEMENTAMI ---
            const addElement = (type) => {
                if (pages.length === 0) return;
                
                // Oblicz środek aktualnego widoku (uproszczone pozycjonowanie)
                const container = containerRef.current;
                let startY = 150;
                if (container) {
                    const scrollY = container.scrollTop;
                    startY = (scrollY / zoom) + 150;
                }

                const newElement = {
                    id: `el_${Date.now()}`,
                    type: type,
                    x: RENDER_WIDTH / 2 - (type === 'whiteout' ? 75 : 50), 
                    y: startY,
                    content: type === 'text' ? '' : '',
                    fontSize: 16,
                    color: '#000000',
                    fontFamily: 'Arial, sans-serif', 
                    fontWeight: '400',
                    width: type === 'whiteout' ? 150 : null,
                    height: type === 'whiteout' ? 25 : null
                };

                const updatedPages = [...pages];
                updatedPages[activePageIdx].elements.push(newElement);
                setPages(updatedPages);
                setSelectedElementId(newElement.id);
            };

            const updateSelectedElement = (updates) => {
                if (!selectedElementId || pages.length === 0) return;
                const updatedPages = [...pages];
                const elements = updatedPages[activePageIdx].elements;
                const elIndex = elements.findIndex(el => el.id === selectedElementId);
                
                if (elIndex !== -1) {
                    elements[elIndex] = { ...elements[elIndex], ...updates };
                    setPages(updatedPages);
                }
            };

            const deleteElement = (id) => {
                if (pages.length === 0) return;
                const updatedPages = [...pages];
                updatedPages[activePageIdx].elements = updatedPages[activePageIdx].elements.filter(el => el.id !== id);
                setPages(updatedPages);
                if (selectedElementId === id) setSelectedElementId(null);
            };

            // Funkcja DUPLIKOWANIA (Kopiuj / Wklej) z przesunięciem
            const duplicateElement = (id) => {
                if (pages.length === 0) return;
                const elements = pages[activePageIdx].elements;
                const elToCopy = elements.find(el => el.id === id);
                
                if (elToCopy) {
                    const newElement = {
                        ...elToCopy,
                        id: `el_${Date.now()}`,
                        x: elToCopy.x + 20, 
                        y: elToCopy.y + 20
                    };
                    const updatedPages = [...pages];
                    updatedPages[activePageIdx].elements.push(newElement);
                    setPages(updatedPages);
                    setSelectedElementId(newElement.id);
                }
            };

            // --- DRAG & DROP LOGIC ---
            const handlePointerDown = (e, id) => {
                // Jeśli klikamy w aktywny edytor tekstu, by pisać, nie blokujmy tego dragiem!
                if (editModeRef.current) return;
                
                e.stopPropagation();
                setSelectedElementId(id);
                
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const element = pages[activePageIdx].elements.find(el => el.id === id);
                if (!element) return;

                setDragState({
                    id,
                    startX: clientX,
                    startY: clientY,
                    initX: element.x,
                    initY: element.y
                });
            };

            useEffect(() => {
                if (!dragState) return;

                const handlePointerMove = (e) => {
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    
                    const dx = (clientX - dragState.startX) / zoom;
                    const dy = (clientY - dragState.startY) / zoom;

                    const updatedPages = [...pages];
                    const elements = updatedPages[activePageIdx].elements;
                    const elIndex = elements.findIndex(el => el.id === dragState.id);
                    
                    if (elIndex !== -1) {
                        elements[elIndex].x = dragState.initX + dx;
                        elements[elIndex].y = dragState.initY + dy;
                        setPages(updatedPages);
                    }
                };

                const handlePointerUp = () => {
                    setDragState(null);
                };

                window.addEventListener('mousemove', handlePointerMove);
                window.addEventListener('mouseup', handlePointerUp);
                window.addEventListener('touchmove', handlePointerMove, { passive: false });
                window.addEventListener('touchend', handlePointerUp);

                return () => {
                    window.removeEventListener('mousemove', handlePointerMove);
                    window.removeEventListener('mouseup', handlePointerUp);
                    window.removeEventListener('touchmove', handlePointerMove);
                    window.removeEventListener('touchend', handlePointerUp);
                };
            }, [dragState, pages, activePageIdx, zoom]);

            // --- ZDEJMOWANIE ZAZNACZENIA ---
            const handleBackgroundClick = (e) => {
                // Zapobiegamy odznaczeniu, jeśli klikamy w narzędzia lub menu
                if (e.target.closest('.floating-toolbar') || e.target.closest('aside')) return;
                
                setSelectedElementId(null);
                editModeRef.current = false;
            };

            // --- EKSPORT DO PDF ---
            const exportToPDF = async () => {
                if (pages.length === 0) return;
                
                setIsLoading(true);
                setLoadingMsg('Pieczenie plików PDF (Zachowujemy super jakość)...');
                setSelectedElementId(null); 
                editModeRef.current = false;
                
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ unit: 'px', format: 'a4', orientation: 'portrait' });
                    const pdfWidth = pdf.internal.pageSize.getWidth();

                    for (let i = 0; i < pages.length; i++) {
                        const page = pages[i];
                        const ratio = page.height / page.width;
                        const pdfHeight = pdfWidth * ratio;

                        const tempDiv = document.createElement('div');
                        tempDiv.style.position = 'absolute';
                        tempDiv.style.left = '-9999px';
                        tempDiv.style.top = '-9999px';
                        tempDiv.style.width = `${page.width}px`;
                        tempDiv.style.height = `${page.height}px`;
                        tempDiv.style.backgroundColor = 'white';
                        
                        if (page.type === 'pdf') {
                            const img = document.createElement('img');
                            img.src = page.imgData;
                            img.style.position = 'absolute';
                            img.style.width = '100%';
                            img.style.height = '100%';
                            tempDiv.appendChild(img);
                        }

                        page.elements.forEach(el => {
                            const elDiv = document.createElement('div');
                            elDiv.style.position = 'absolute';
                            elDiv.style.left = `${el.x}px`;
                            elDiv.style.top = `${el.y}px`;
                            
                            if (el.type === 'whiteout') {
                                elDiv.style.width = `${el.width}px`;
                                elDiv.style.height = `${el.height}px`;
                                elDiv.style.backgroundColor = 'white';
                            } else if (el.type === 'text') {
                                elDiv.innerText = el.content;
                                elDiv.style.fontSize = `${el.fontSize}px`;
                                elDiv.style.color = el.color;
                                elDiv.style.fontFamily = el.fontFamily;
                                elDiv.style.fontWeight = el.fontWeight;
                                elDiv.style.whiteSpace = 'pre-wrap';
                                elDiv.style.wordBreak = 'break-word';
                                elDiv.style.lineHeight = '1.2';
                            }
                            tempDiv.appendChild(elDiv);
                        });

                        document.body.appendChild(tempDiv);

                        const canvas = await html2canvas(tempDiv, { scale: 2, useCORS: true, logging: false });
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        
                        if (i > 0) pdf.addPage();
                        
                        pdf.setPage(i + 1);
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                        
                        document.body.removeChild(tempDiv);
                    }

                    pdf.save('EduBox_Edytowany_Dokument.pdf');
                    showMessage('Zapisano pomyślnie!', 'success');
                } catch (error) {
                    console.error("Błąd zapisu:", error);
                    showMessage('Wystąpił problem podczas eksportu. Spróbuj ponownie.', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const activePage = pages[activePageIdx] || null;
            
            return (
                <div className="flex h-screen w-full bg-slate-900 text-slate-800 overflow-hidden relative selection:bg-blue-500/30">
                    
                    {isLoading && (
                        <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex flex-col items-center justify-center text-white">
                            <i className="ph-bold ph-spinner animate-spin text-6xl mb-4 text-blue-500"></i>
                            <h2 className="text-xl font-bold mb-2">{loadingMsg}</h2>
                            <p className="text-sm text-slate-400">Proszę nie zamykać okna...</p>
                        </div>
                    )}

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'}`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    {/* Pasek Boczny (Narzędzia) */}
                    <aside className="w-[340px] flex-shrink-0 bg-white border-r border-slate-200 flex flex-col h-full z-10 shadow-2xl relative z-50">
                        <div className="p-6 border-b border-slate-100 flex items-center gap-3 bg-slate-50">
                            <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20 text-white text-2xl shrink-0">
                                <i className="ph-bold ph-file-pdf"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight text-slate-800 leading-none">EduPDF Wypełniacz</h1>
                                <p className="text-[10px] text-blue-600 font-bold tracking-wider uppercase mt-1">Wersja V4 ULTRA</p>
                            </div>
                        </div>

                        {/* Zakładki */}
                        <div className="flex bg-slate-100 p-1 mx-4 mt-4 rounded-lg">
                            <button onClick={() => setSidebarTab('narzedzia')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${sidebarTab === 'narzedzia' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Narzędzia</button>
                            <button onClick={() => setSidebarTab('tekst')} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition-all ${sidebarTab === 'tekst' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Oryginalny Tekst <span className="bg-red-500 text-white text-[8px] px-1 rounded ml-1">NEW</span></button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-6">
                            
                            {sidebarTab === 'narzedzia' ? (
                                <>
                                    {/* KROK 1: Plik */}
                                    <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                        <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">1. Dokument</h3>
                                        <button onClick={() => fileInputRef.current?.click()} className="w-full bg-slate-50 border border-slate-300 hover:border-blue-400 hover:text-blue-600 text-slate-700 font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm">
                                            <i className="ph-bold ph-upload-simple text-lg"></i> Wgraj nowy plik PDF
                                        </button>
                                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="application/pdf" className="hidden" />
                                        
                                        {pages.length > 0 && (
                                            <div className="mt-3 flex items-center justify-between bg-blue-50/50 p-2 rounded-lg border border-blue-100 text-xs">
                                                <button onClick={() => setActivePageIdx(Math.max(0, activePageIdx - 1))} disabled={activePageIdx === 0} className="p-1 hover:bg-white rounded border border-transparent hover:border-blue-200 disabled:opacity-30 transition-all"><i className="ph-bold ph-caret-left text-blue-600"></i></button>
                                                <span className="font-bold text-blue-800">Strona {activePageIdx + 1} z {pages.length}</span>
                                                <button onClick={() => setActivePageIdx(Math.min(pages.length - 1, activePageIdx + 1))} disabled={activePageIdx === pages.length - 1} className="p-1 hover:bg-white rounded border border-transparent hover:border-blue-200 disabled:opacity-30 transition-all"><i className="ph-bold ph-caret-right text-blue-600"></i></button>
                                            </div>
                                        )}
                                    </div>

                                    {/* KROK 2: Narzędzia */}
                                    <div className={`bg-white border border-slate-200 rounded-xl p-4 shadow-sm transition-opacity ${pages.length === 0 ? 'opacity-50 pointer-events-none' : ''}`}>
                                        <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">2. Elementy</h3>
                                        <div className="grid grid-cols-2 gap-2 mb-3">
                                            <button onClick={() => addElement('whiteout')} className="bg-slate-50 border border-slate-200 hover:border-slate-400 text-slate-700 py-3 rounded-lg flex flex-col items-center gap-2 shadow-sm transition-all text-xs font-bold">
                                                <div className="w-8 h-8 border-2 border-slate-300 rounded bg-white flex items-center justify-center"><i className="ph-fill ph-eraser text-slate-400 text-lg"></i></div>
                                                Korektor
                                            </button>
                                            <button onClick={() => { addElement('text'); setTimeout(() => { const boxes = document.querySelectorAll('.content-editable-box'); if(boxes.length > 0) boxes[boxes.length-1].focus(); }, 100); }} className="bg-blue-50 border border-blue-200 hover:border-blue-500 text-blue-700 py-3 rounded-lg flex flex-col items-center gap-2 shadow-sm transition-all text-xs font-bold">
                                                <i className="ph-bold ph-text-t text-3xl"></i>
                                                Tekst
                                            </button>
                                        </div>
                                        
                                        <div className="text-[10px] text-slate-500 bg-slate-50 p-2 rounded border border-slate-100 flex items-start gap-2 mb-3">
                                            <i className="ph-fill ph-info text-blue-400 text-sm shrink-0 mt-0.5"></i>
                                            <p>Kliknij wygenerowany element na dokumencie, by otworzyć <b>pływający pasek opcji (czcionki, kopiuj, usuń)</b>.</p>
                                        </div>

                                        <button onClick={addBlankPage} className="w-full bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-700 py-2 rounded-lg transition-all flex items-center justify-center gap-2 text-xs font-bold shadow-sm">
                                            <i className="ph-bold ph-file-plus text-lg"></i> Dodaj czystą stronę
                                        </button>
                                    </div>
                                </>
                            ) : (
                                /* ZAKŁADKA: ORYGINALNY TEKST */
                                <div className="bg-white border border-blue-200 rounded-xl p-4 shadow-sm flex flex-col h-full animate-[reveal_0.2s_ease-out]">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="text-xs font-bold text-blue-800 flex items-center gap-2">
                                            <i className="ph-bold ph-scan"></i> Skaner Tekstu (OCR)
                                        </h3>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mb-3 leading-tight">
                                        Edycja oryginału jest zablokowana, aby PDF się nie "rozpadł". Ale oto tekst odzyskany z tej strony! Zaznacz słowo, skopiuj je i wklej do swojego narzędzia "Tekst".
                                    </p>
                                    
                                    {pages.length > 0 && activePage ? (
                                        <div className="flex-1 bg-slate-50 border border-slate-200 rounded-lg p-3 overflow-y-auto text-xs text-slate-700 font-mono leading-relaxed whitespace-pre-wrap select-text">
                                            {activePage.extractedText || <span className="italic text-slate-400">System nie wykrył żadnego tekstu na tej stronie (może to sam obrazek lub skan?).</span>}
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex items-center justify-center text-slate-400 text-xs italic">
                                            Wgraj plik PDF, aby wyciągnąć tekst.
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* KROK 3: Zapis */}
                        <div className="p-4 border-t border-slate-200 bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.02)] z-50">
                            <button 
                                onClick={exportToPDF} 
                                disabled={pages.length === 0 || isLoading}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:grayscale"
                            >
                                <i className="ph-bold ph-printer text-xl"></i> Generuj nowy PDF
                            </button>
                        </div>
                    </aside>

                    {/* Główny obszar roboczy (Płótno) */}
                    <main className="flex-1 relative flex flex-col items-center overflow-hidden app-bg" onClick={handleBackgroundClick} ref={containerRef}>
                        
                        {/* Zoom Controls */}
                        {pages.length > 0 && (
                            <div className="absolute top-6 right-6 z-40 bg-white rounded-full shadow-lg border border-slate-200 flex items-center p-1">
                                <button onClick={() => setZoom(Math.max(0.4, zoom - 0.1))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded-full"><i className="ph-bold ph-magnifying-glass-minus"></i></button>
                                <span className="text-xs font-bold w-12 text-center text-slate-700">{Math.round(zoom * 100)}%</span>
                                <button onClick={() => setZoom(Math.min(2.0, zoom + 0.1))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded-full"><i className="ph-bold ph-magnifying-glass-plus"></i></button>
                            </div>
                        )}

                        <div className="flex-1 w-full overflow-auto custom-scrollbar flex justify-center py-16 px-8 relative z-0">
                            
                            {pages.length === 0 ? (
                                <div className="max-w-md my-auto text-center opacity-70">
                                    <i className="ph-fill ph-files text-8xl text-slate-300 mb-4"></i>
                                    <h2 className="text-2xl font-black text-slate-500 mb-2">Puste biurko</h2>
                                    <p className="text-slate-400 text-sm">Wgraj plik PDF z menu po lewej stronie, aby rozpocząć pracę.</p>
                                </div>
                            ) : (
                                <div 
                                    className="bg-white shadow-2xl relative transition-transform duration-200 origin-top"
                                    style={{ 
                                        width: activePage.width, 
                                        height: activePage.height,
                                        transform: `scale(${zoom})`,
                                        marginBottom: `${(zoom - 1) * activePage.height}px` 
                                    }}
                                >
                                    {/* Tło PDF */}
                                    {activePage.type === 'pdf' && activePage.imgData && (
                                        <img src={activePage.imgData} alt="PDF Page" className="absolute inset-0 w-full h-full pointer-events-none no-select" />
                                    )}

                                    {/* ELEMENTY NAKŁADANE */}
                                    {activePage.elements.map(el => {
                                        const isSelected = selectedElementId === el.id;
                                        
                                        if (el.type === 'whiteout') {
                                            return (
                                                <div key={el.id}>
                                                    {/* Pływający pasek dla korektora */}
                                                    {isSelected && (
                                                        <div className="floating-toolbar" style={{ left: el.x, top: el.y - 45 }} onMouseDown={e => e.stopPropagation()}>
                                                            <div className="text-[10px] font-bold text-slate-400 px-2 flex items-center gap-1"><i className="ph-fill ph-eraser"></i> Korektor</div>
                                                            <div className="floating-divider"></div>
                                                            <button onClick={() => duplicateElement(el.id)} className="floating-btn" title="Duplikuj"><i className="ph-bold ph-copy"></i></button>
                                                            <button onClick={() => deleteElement(el.id)} className="floating-btn text-red-500 hover:text-red-600 hover:bg-red-50" title="Usuń"><i className="ph-bold ph-trash"></i></button>
                                                        </div>
                                                    )}
                                                    
                                                    {/* Obiekt Korektora */}
                                                    <div 
                                                        onMouseDown={(e) => {
                                                            const rect = e.target.getBoundingClientRect();
                                                            const isResizing = (e.clientX - rect.left > rect.width - 15) && (e.clientY - rect.top > rect.height - 15);
                                                            if (!isResizing) handlePointerDown(e, el.id);
                                                        }}
                                                        onTouchStart={(e) => handlePointerDown(e, el.id)}
                                                        onMouseUp={(e) => {
                                                            const target = e.currentTarget;
                                                            if (target.offsetWidth !== el.width || target.offsetHeight !== el.height) {
                                                                updateSelectedElement({ width: target.offsetWidth, height: target.offsetHeight });
                                                            }
                                                        }}
                                                        className={`pdf-element bg-white cursor-move ${isSelected ? 'selected' : ''}`}
                                                        style={{ 
                                                            left: el.x, top: el.y, 
                                                            width: el.width, height: el.height,
                                                            resize: isSelected ? 'both' : 'none', 
                                                            overflow: 'hidden'
                                                        }}
                                                    >
                                                        {/* Wskazówka widoczna tylko na hover, by całkowicie zniknęła poza selekcją */}
                                                        {!isSelected && <div className="absolute inset-0 hover:border-2 hover:border-blue-400/50 transition-colors pointer-events-none"></div>}
                                                    </div>
                                                </div>
                                            );
                                        }

                                        if (el.type === 'text') {
                                            return (
                                                <div key={el.id}>
                                                    {/* Pływający pasek opcji dla Tekstu! */}
                                                    {isSelected && (
                                                        <div className="floating-toolbar" style={{ left: el.x, top: el.y - 45 }} onMouseDown={e => e.stopPropagation()}>
                                                            {/* Wybór czcionki */}
                                                            <select 
                                                                value={el.fontFamily} 
                                                                onChange={e => updateSelectedElement({ fontFamily: e.target.value })} 
                                                                className="bg-transparent text-xs font-bold text-slate-700 outline-none w-24 cursor-pointer"
                                                            >
                                                                <option value="Arial, Helvetica, sans-serif">Arial</option>
                                                                <option value="'Calibri', sans-serif">Calibri</option>
                                                                <option value="'Times New Roman', Times, serif">Times</option>
                                                                <option value="Helvetica, sans-serif">Helvetica</option>
                                                                <option value="Tahoma, sans-serif">Tahoma</option>
                                                                <option value="Georgia, serif">Georgia</option>
                                                                <option value="'Courier New', Courier, monospace">Courier</option>
                                                                <option value="'Inter', sans-serif">Inter</option>
                                                                <option value="'Lora', serif">Lora</option>
                                                                <option value="'Montserrat', sans-serif">Montserrat</option>
                                                                <option value="'Caveat', cursive">Ręczna</option>
                                                            </select>
                                                            <div className="floating-divider"></div>
                                                            
                                                            {/* Rozmiar */}
                                                            <button onClick={() => updateSelectedElement({ fontSize: Math.max(8, el.fontSize - 2) })} className="floating-btn"><i className="ph-bold ph-minus"></i></button>
                                                            <span className="text-xs font-bold text-slate-600 w-6 text-center">{el.fontSize}</span>
                                                            <button onClick={() => updateSelectedElement({ fontSize: el.fontSize + 2 })} className="floating-btn"><i className="ph-bold ph-plus"></i></button>
                                                            <div className="floating-divider"></div>
                                                            
                                                            {/* Pogrubienie */}
                                                            <button 
                                                                onClick={() => updateSelectedElement({ fontWeight: el.fontWeight === '700' ? '400' : '700' })} 
                                                                className={`floating-btn font-black font-serif ${el.fontWeight === '700' ? 'bg-slate-200 text-blue-600' : ''}`}
                                                            >B</button>
                                                            
                                                            {/* Kolor */}
                                                            <input type="color" value={el.color} onChange={e => updateSelectedElement({ color: e.target.value })} className="w-6 h-6 p-0 border-0 rounded cursor-pointer ml-1" />
                                                            <div className="floating-divider"></div>

                                                            {/* Akcje */}
                                                            <button onClick={() => duplicateElement(el.id)} className="floating-btn" title="Duplikuj"><i className="ph-bold ph-copy"></i></button>
                                                            <button onClick={() => deleteElement(el.id)} className="floating-btn text-red-500 hover:text-red-600 hover:bg-red-50" title="Usuń"><i className="ph-bold ph-trash"></i></button>
                                                        </div>
                                                    )}

                                                    {/* Obiekt Tekstu */}
                                                    <div 
                                                        className={`pdf-element ${isSelected ? 'selected' : ''}`}
                                                        style={{ left: el.x, top: el.y }}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setSelectedElementId(el.id);
                                                        }}
                                                    >
                                                        {/* Rączka do przesuwania (ukrywana przez CSS gdy fokusujemy pole tekstu) */}
                                                        {isSelected && (
                                                            <div 
                                                                className="drag-handle absolute -left-6 top-1/2 -translate-y-1/2 bg-blue-500 text-white w-5 h-8 rounded flex items-center justify-center cursor-move shadow-md hover:bg-blue-600"
                                                                onMouseDown={(e) => handlePointerDown(e, el.id)}
                                                                onTouchStart={(e) => handlePointerDown(e, el.id)}
                                                                title="Przesuń element"
                                                            >
                                                                <i className="ph-bold ph-arrows-out-cardinal text-xs"></i>
                                                            </div>
                                                        )}
                                                        
                                                        {/* Aktywne Pole Tekstowe */}
                                                        <div
                                                            contentEditable={true}
                                                            suppressContentEditableWarning={true}
                                                            onFocus={() => { editModeRef.current = true; }}
                                                            onBlur={(e) => {
                                                                editModeRef.current = false;
                                                                const text = e.currentTarget.innerText;
                                                                // Sprzątanie po pustych polach
                                                                if (!text.trim()) {
                                                                    deleteElement(el.id);
                                                                } else {
                                                                    updateSelectedElement({ content: text });
                                                                }
                                                            }}
                                                            data-placeholder="Napisz coś..."
                                                            className="content-editable-box"
                                                            style={{
                                                                fontSize: `${el.fontSize}px`,
                                                                color: el.color,
                                                                fontFamily: el.fontFamily,
                                                                fontWeight: el.fontWeight,
                                                                lineHeight: '1.2'
                                                            }}
                                                        >
                                                            {el.content}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        }

                                        return null;
                                    })}
                                </div>
                            )}

                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
