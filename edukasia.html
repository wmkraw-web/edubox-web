            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);

            const [sosMode, setSosMode] = useState('zachowanie');

            const [sosResult, setSosResult] = useState('');
            const [isGeneratingSos, setIsGeneratingSos] = useState(false);

            const [generatedPanels, setGeneratedPanels] = useState([]);
            const [isGeneratingStory, setIsGeneratingStory] = useState(false);
            const [storyError, setStoryError] = useState('');

                { id: 1, word: 'Sok', img: '🧃' },
                { id: 2, word: 'Książka', img: '📖' },

            const [searchQuery, setSearchQuery] = useState('');

                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO' || status === 'active') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_edukasia', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            useEffect(() => {

                        utterance.voice = premiumVoice;

                    window.speechSynthesis.speak(utterance);

Problem dziecka: ${storyProblem}

ZASADY:
1. Bez trudnych słów, metafor i przenośni – tylko proste, dosłowne zdania (to, co dziecko widzi i robi).
2. Dokładnie 4 zwrotki: 1) sytuacja i uczucie, 2) ktoś pomaga / co mogę zrobić, 3) dziecko próbuje, 4) spokojny, dobry koniec.

                    // Rymy pisze mocny model (strumień -> GPT-6.1): słabsze modele dawały pseudo-rymy. Pisanie ~20–30 s.

${storyParts.slice(0, 4).map((p, i) => `PANEL ${i + 1}: ${p}`).join('\n')}
Problem (teacher's note): ${storyProblem}

Write 4 English scene descriptions for the illustrator. Describe the main character ONCE precisely (age, gender if clear, hair, skin tone, exact clothes with colours) and put this SAME description at the start of every prompt. Then: ONE clear action, the character's facial expression and the place – simple, literal, uncluttered. No text.

IMG1: [prompt 1]
IMG2: [prompt 2]
IMG3: [prompt 3]
IMG4: [prompt 4]`;

                            currentPanels[i].image = null;

                        currentPanels[i].isLoading = false;
                        setGeneratedPanels([...currentPanels]);

                            {/* WIDOK: BAJKA */}
                            {activeTab === 'bajka' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-amber-500/30 print-hidden">
                                    <h2 className="text-3xl font-black text-amber-400 mb-6 text-center">Magiczny Komiks AI 🎨</h2>
                                    <textarea value={storyProblem} onChange={(e) => setStoryProblem(e.target.value)} placeholder="Opisz lęk dziecka (np. Emilka boi się burzy)..." className="w-full h-24 bg-slate-900 border border-slate-600 text-white rounded-xl p-4 mb-4 custom-scrollbar"></textarea>
                                    
                                    {storyError && <div className="mb-4 text-red-400 text-sm font-bold p-3 bg-red-900/30 border border-red-500/50 rounded-xl text-center">{storyError}</div>}
                                    
                                    <button onClick={generateStoryAndImageWithLimit} disabled={isGeneratingStory || !storyProblem} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-xl disabled:bg-slate-700 shadow-lg btn-bounce transition-colors flex items-center justify-center gap-2">
                                        {isGeneratingStory ? '✨ Piszę wierszyk i rysuję kadry (ok. minuty)...' : 'Stwórz Magiczny Komiks'}
                                    </button>
                                    
                                    {generatedPanels.length > 0 && (
                                        <div className="mt-10 bg-slate-900/50 p-4 md:p-8 rounded-[2rem] border border-amber-500/30 fade-in shadow-inner">
                                            <div className="flex justify-center mb-8">
                                                <button onClick={() => speakText(generatedPanels.map(p => p.text).join(' '))} className="bg-amber-600 hover:bg-amber-500 text-white px-8 py-4 rounded-full font-black shadow-lg flex items-center gap-3 transition-all btn-bounce">
                                                    <span className="text-2xl">🔊</span> Posłuchaj Lektora
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                {generatedPanels.map((panel, idx) => (
                                                    <div key={idx} className="bg-slate-800 rounded-3xl overflow-hidden border-2 border-amber-500/20 shadow-xl flex flex-col group hover:border-amber-500/60 transition-colors">
                                                        <div className="relative bg-slate-900 flex items-center justify-center min-h-[224px] md:min-h-[288px]">
                                                            {panel.isLoading ? (
                                                                <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 z-0 text-amber-500 bg-slate-900">
                                                                    <div className="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                                                                    <span className="text-sm font-bold animate-pulse">Ładowanie kadru {idx + 1}... 🎨</span>
                                                                </div>
                                                            ) : (
                                                                panel.image ? (
                                                                    <img
                                                                        src={panel.image}
                                                                        className="w-full h-56 md:h-72 object-cover border-b-2 border-amber-500/20 relative z-10"
                                                                        alt={`Kadr ${idx + 1}`}
                                                                    />
                                                                ) : (
                                                                    <div className="w-full h-56 md:h-72 flex items-center justify-center text-center text-slate-500 text-sm p-6">Ten obrazek się nie udał – stwórz historyjkę ponownie.</div>
                                                                )
                                                            )}
                                                            <div className="absolute top-4 left-4 bg-amber-500 text-slate-900 w-8 h-8 rounded-full flex items-center justify-center font-black shadow-lg z-20">{idx + 1}</div>
                                                        </div>
                                                        <div className="p-6 text-slate-200 text-base md:text-lg italic flex-1 flex items-center justify-center text-center font-medium leading-relaxed bg-slate-900/50">
                                                            {panel.text.split(/\\n|\n/).map((line, i) => (<React.Fragment key={i}>{line}<br/></React.Fragment>))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* WIDOK: KARTY AAC */}
                            {activeTab === 'karty' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-emerald-500/30">
                                    <div className="flex justify-between items-center mb-6 print-hidden">
                                        <h2 className="text-2xl font-black text-emerald-400 flex items-center gap-2"><Icon name="Grid"/> Kreator Kart AAC (5x5 cm)</h2>
                                        <button onClick={handlePrintWithLimit} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 btn-bounce">
                                            <Icon name="Printer"/> Drukuj Karty {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                        </button>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6 print-hidden">
                                        {aacCards.map(card => (
                                            <div key={card.id} className="bg-slate-900 border border-slate-700 p-4 rounded-xl flex items-center gap-4">
                                                <div className="w-16 h-16 bg-white rounded-lg flex items-center justify-center overflow-hidden shrink-0 border-2 border-slate-400">
                                                    {card.img.length > 5 ? <img src={card.img} className="w-full h-full object-cover" /> : <span className="text-3xl">{card.img}</span>}
                                                </div>
                                                <div className="flex-1 space-y-2">
                                                    <input type="text" value={card.word} onChange={(e) => updateAacCard(card.id, 'word', e.target.value)} className="w-full bg-slate-800 text-white text-sm px-2 py-1 rounded outline-none border border-slate-600 focus:border-emerald-500 uppercase font-bold" />
                                                    <div className="flex gap-2">
                                                        <input type="text" value={card.img.length < 5 ? card.img : '📷'} onChange={(e) => updateAacCard(card.id, 'img', e.target.value)} className="w-10 text-center bg-slate-800 text-white text-sm px-1 py-1 rounded outline-none border border-slate-600" title="Wpisz Emoji" />
                                                        <label className="flex-1 text-center bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs py-1 rounded cursor-pointer border border-slate-600 font-bold flex items-center justify-center gap-1">
                                                            <Icon name="Image" className="w-3 h-3"/> Własne
                                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, card.id)} />
                                                        </label>
                                                    </div>
                                                </div>
                                                <button onClick={() => removeAacCard(card.id)} className="text-slate-500 hover:text-red-500 p-2"><Icon name="Trash"/></button>
                                            </div>
                                        ))}
                                        <button onClick={addAacCard} className="bg-emerald-900/30 border-2 border-dashed border-emerald-500/50 hover:bg-emerald-900/50 text-emerald-400 p-4 rounded-xl flex flex-col items-center justify-center gap-2 font-bold min-h-[100px] transition-colors btn-bounce">
                                            <Icon name="Plus"/> Dodaj Kartę
                                        </button>
                                    </div>

                                    <div className="hidden print:block">
                                        <div className="aac-print-container">
                                            {aacCards.map(card => (
                                                <div key={`print-${card.id}`} className="aac-card-print">
                                                    <div style={{ fontSize: '12pt', fontWeight: 'bold', textTransform: 'uppercase', textAlign: 'center', lineHeight: '1.1', height: '10mm', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%' }}>
                                                        {card.word}
                                                    </div>
                                                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                                        {card.img.length > 5 ? <img src={card.img} className="aac-img-print" /> : <span style={{ fontSize: '35pt' }}>{card.img}</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* WIDOK: RZEPY */}
                            {activeTab === 'rzepy' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-purple-500/30">
                                    <div className="flex justify-between items-center mb-6 print-hidden">
                                        <h2 className="text-2xl font-black text-purple-400 flex items-center gap-2"><Icon name="Puzzle"/> Zadania z Rzepami (Cienie)</h2>
                                        <button onClick={handlePrintWithLimit} className="bg-purple-600 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 btn-bounce">
                                            <Icon name="Printer"/> Drukuj Arkusz A4 {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                        </button>
                                    </div>
                                    
                                    <div className="flex gap-2 overflow-x-auto pb-4 mb-4 custom-scrollbar print-hidden">
                                        {RZEPY_SETS.map(set => (
                                            <button key={set.id} onClick={() => setSelectedRzepySet(set)} className={`px-4 py-2 rounded-xl font-bold whitespace-nowrap border-2 ${selectedRzepySet.id === set.id ? 'bg-purple-600/30 border-purple-500 text-white' : 'border-slate-700 text-slate-400 hover:bg-slate-800'}`}>
                                                {set.name}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-white rounded-xl p-4 md:p-8 text-center print-hidden border-2 border-dashed border-purple-500/50 opacity-80 pointer-events-none">
                                        <p className="text-slate-500 font-bold mb-4 uppercase">Podgląd Wydruku</p>
                                        <div className="grid grid-cols-3 gap-4 mb-4 pb-4 border-b-2 border-dashed border-slate-300">
                                            {selectedRzepySet.items.map((item, i) => <div key={`shadow-${i}`} className="text-5xl md:text-7xl filter grayscale contrast-0 opacity-20">{item}</div>)}
                                        </div>
                                        <div className="grid grid-cols-3 gap-4">
                                            {selectedRzepySet.items.map((item, i) => <div key={`color-${i}`} className="text-5xl md:text-7xl border-2 border-dashed border-slate-400 rounded-xl p-2">{item}</div>)}
                                        </div>
                                    </div>

                                    <div className="hidden print:block w-full">
                                        <div className="rzepy-page">
                                            <div className="rzepy-board" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10mm', alignContent: 'center', justifyItems: 'center' }}>
                                                {selectedRzepySet.items.map((item, i) => (
                                                    <div key={`p-shadow-${i}`} className="rzepy-shadow" style={{ fontSize: '60pt' }}>{item}</div>
                                                ))}
                                            </div>
                                            <div className="rzepy-elements" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10mm', alignContent: 'center', justifyItems: 'center' }}>
                                                {selectedRzepySet.items.map((item, i) => (
                                                    <div key={`p-color-${i}`} className="rzepy-cut" style={{ fontSize: '60pt', padding: '10mm' }}>{item}</div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* WIDOK: GIEŁDA WZORÓW */}
                            {activeTab === 'gielda' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-fuchsia-500/30 print-hidden h-[800px] flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><Icon name="Cloud" className="w-8 h-8"/> Baza Kart AAC (Giełda)</h2>
                                    </div>
                                    
                                    <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                        <Icon name="CloudArrowUp" className="w-5 h-5"/> Udostępnij swój obecny zestaw kart AAC
                                    </button>
                                    
                                    <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Zestawy udostępnione przez innych</h3>
                                    
                                    <div className="overflow-y-auto custom-scrollbar flex-1 space-y-3 pr-2">
                                        {patterns.map(p => (
                                            <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-5 rounded-xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-3" onClick={() => loadPattern(p)}>
                                                <div className="flex justify-between items-start gap-2">
                                                    <span className="text-sm font-bold text-white group-hover:text-fuchsia-400 transition-colors line-clamp-2 leading-tight">{p.name}</span>
                                                    <span className="text-[10px] font-bold px-2 py-1 rounded bg-fuchsia-900/50 text-fuchsia-300 whitespace-nowrap">{p.type}</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <p className="text-[10px] text-slate-500">Autor: <span className="text-slate-400">{p.userId.substring(0,6)}</span></p>
                                                    <p className="text-[10px] text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                                </div>
                                            </div>
                                        ))}
                                        {patterns.length === 0 && (
                                            <div className="text-center py-10 opacity-50">
                                                <Icon name="Cloud" className="w-12 h-12 mb-3 text-slate-500 mx-auto" />
                                                <p className="text-sm text-slate-400 font-bold">Brak wzorów w chmurze...</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* WIDOK: PORTFOLIO */}
                            {activeTab === 'portfolio' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-500/30 print-hidden">
                                    <h2 className="text-3xl font-black text-slate-300 mb-6 flex items-center gap-3"><Icon name="Compass" className="w-8 h-8 text-blue-500"/> Baza EduBox</h2>
                                    
                                    <div className="relative mb-8">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="Search"/></div>
                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Szukaj innych narzędzi (np. fiszki, dyplomy, gry)..." className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto custom-scrollbar pr-2">
                                        {filteredApps.length > 0 ? filteredApps.map((app, i) => (
                                            <a key={i} href={app.url} target="_blank" className="bg-slate-800/50 hover:bg-slate-700 border border-slate-700 hover:border-blue-500 p-5 rounded-2xl transition-all group flex flex-col h-full">
                                                <div className="text-3xl mb-3 group-hover:scale-110 transition-transform origin-left">{app.icon}</div>
                                                <h3 className="text-white font-bold mb-2 leading-tight">{app.title}</h3>
                                                <p className="text-slate-400 text-xs leading-relaxed flex-1">{app.desc}</p>
                                                <div className="mt-4 text-blue-400 text-xs font-bold uppercase tracking-widest group-hover:translate-x-2 transition-transform">Otwórz ➡️</div>
                                            </a>
                                        )) : (
                                            <div className="col-span-full text-center text-slate-500 py-10 font-bold">Nie znaleziono takiego narzędzia.</div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
