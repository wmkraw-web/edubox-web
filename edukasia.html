        const PROMPTS = {

        const ALL_APPS = [

            { title: 'Scenariusz AI PRO', desc: 'Tworzy 45-minutowe konspekty ze skryptem dialogowym.', url: 'eduscenariusz.html', icon: '📖' },
            { title: 'EduZadania AI', desc: 'Generuje wciągające zadania matematyczne z postaciami dzieci.', url: 'eduzadania.html', icon: '🧮' },
            { title: 'EduFiszki i Memory AI', desc: 'Wyciągnie słowa kluczowe i utworzy fiszki gotowe do druku.', url: 'edufiszki.html', icon: '🎴' },

            { title: 'EduBoxPro MagicLetters', desc: 'Profesjonalny generator girland ze wsparciem AI.', url: 'magicletters.html', icon: '✨' },
            { title: 'EduGenerator PRO', desc: 'Dyplomy dla klasy i ozdobne girlandy z wycinaniem tła.', url: 'edugenerator.html', icon: '📜' },
            { title: 'EduWizualizator (AAC)', desc: 'Dzieli trudną czynność na kroki z piktogramami.', url: 'eduwizualizator.html', icon: '👀' },
            { title: 'EduGrupy (Koło Fortuny)', desc: 'Koło Fortuny do losowania uczniów i podział na grupy.', url: 'edugrupy.html', icon: '🎡' }
        ];

        const RZEPY_SETS = [
            { id: 'farma', name: 'Zwierzęta na wsi', items: ['🐮', '🐷', '🐔', '🐴', '🐑', '🐶'] },
            { id: 'owoce', name: 'Zdrowe owoce', items: ['🍎', '🍌', '🍇', '🍉', '🍓', '🍊'] },
            { id: 'pojazdy', name: 'Pojazdy', items: ['🚗', '🚒', '🚓', '🚜', '🚁', '⛵'] },
            { id: 'ksztalty', name: 'Kształty i Kolory', items: ['🔴', '🟦', '⭐', '💚', '🔺', '🟪'] }
        ];

        function App() {
            const SECRET_PIN = "KAWA2024"; 

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [activeTab, setActiveTab] = useState('sos'); 
            const resultRef = useRef(null);

            const [sosMode, setSosMode] = useState('zachowanie');
            const [sosInput, setSosInput] = useState('');
            const [useWebSearch, setUseWebSearch] = useState(true);
            const [sosResult, setSosResult] = useState('');
            const [sosSources, setSosSources] = useState([]);
            const [isGeneratingSos, setIsGeneratingSos] = useState(false);
            const [sosError, setSosError] = useState('');

            const [customText, setCustomText] = useState('');
            const aacButtons = [
                { id: 1, label: 'Chcę przerwę', emoji: '⏸️' }, { id: 2, label: 'Toaleta', emoji: '🚽' },
                { id: 3, label: 'Pić', emoji: '💧' }, { id: 4, label: 'Jeść', emoji: '🍎' },
                { id: 5, label: 'Pomocy', emoji: '🆘' }, { id: 6, label: 'Boli mnie', emoji: '🩹' },
                { id: 7, label: 'Stop', emoji: '🛑' }, { id: 8, label: 'Koniec', emoji: '✅' },
                { id: 9, label: 'Zły', emoji: '😠' }, { id: 10, label: 'Wesoły', emoji: '😊' }
            ];

            const [successName, setSuccessName] = useState('');
            const [successAction, setSuccessAction] = useState('');
            const [successText, setSuccessText] = useState('');
            const [showSuccessCard, setShowSuccessCard] = useState(false);
            const [isGeneratingSuccess, setIsGeneratingSuccess] = useState(false);

            // Zmienione stany dla 4 kadrów
            const [storyProblem, setStoryProblem] = useState('');
            const [generatedPanels, setGeneratedPanels] = useState([]);
            const [isGeneratingStory, setIsGeneratingStory] = useState(false);
            const [storyError, setStoryError] = useState('');

            const [pecsCards, setPecsCards] = useState([
                { id: 1, word: 'Sok', img: '🧃' },
                { id: 2, word: 'Książka', img: '📖' },
                { id: 3, word: 'Zabawa', img: '🧸' }
            ]);

            const [selectedRzepySet, setSelectedRzepySet] = useState(RZEPY_SETS[0]);
            const [searchQuery, setSearchQuery] = useState('');

            // Wczytanie głosów na starcie, by uniknąć pustej listy w przeglądarkach (szczególnie Chrome)
            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            // Ulepszony Lektor (Głos TTS) - szuka głosów premium (Google/Zosia/Paulina), zwalnia tempo
            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Przerywa poprzednie
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'pl-PL';
                    utterance.rate = 0.85; // ZWOLNIONE TEMPO = bardziej uspokajająco (terapeutycznie)
                    utterance.pitch = 1.0; 
                    
                    const voices = window.speechSynthesis.getVoices();
                    // Szukamy najlepszego polskiego głosu (Google, Paulina, Zosia itp.)
                    const premiumVoice = voices.find(v => v.lang === 'pl-PL' && v.name.includes('Google')) ||
                                         voices.find(v => v.lang === 'pl-PL' && (v.name.includes('Paulina') || v.name.includes('Zosia'))) ||
                                         voices.find(v => v.lang.startsWith('pl'));
                    
                    if (premiumVoice) {
                        utterance.voice = premiumVoice;
                    }

                    window.speechSynthesis.speak(utterance);
                }
            };

            const handleImageUpload = (e, cardId) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPecsCards(pecsCards.map(c => c.id === cardId ? { ...c, img: event.target.result } : c));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const addPecsCard = () => setPecsCards([...pecsCards, { id: Date.now(), word: 'Nowe', img: '❓' }]);
            const removePecsCard = (id) => setPecsCards(pecsCards.filter(c => c.id !== id));
            const updatePecsCard = (id, field, value) => setPecsCards(pecsCards.map(c => c.id === id ? { ...c, [field]: value } : c));

            // BEZPIECZNY KONTROLER API
            const secureApiCall = async (payload, endpointType) => {
                const apiKey = ""; 

                if (apiKey) {
                    const url = endpointType === 'text' 
                        ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`
                        : `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    
                    const fetchWithRetry = async (url, options, retries = 5) => {
                        const delays = [1000, 2000, 4000, 8000, 16000];
                        for (let i = 0; i < retries; i++) {
                            try {
                                const response = await fetch(url, options);
                                if (!response.ok) throw new Error(await response.text());
                                return await response.json();
                            } catch (e) {
                                if (i === retries - 1) throw e;
                                await new Promise(res => setTimeout(res, delays[i]));
                            }
                        }
                    };
                    return await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                } else {
                    const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || !window.location.hostname;
                    if (isLocal) throw new Error("Uruchomiłeś plik lokalnie. Otwórz przez Vercel lub Preview w czacie.");

                    // Pobieramy prompt bezbłędnie - dla Twoich profesjonalnych kluczy!
                    let extractedPrompt = payload.prompt || "";
                    if (!extractedPrompt && payload && payload.contents && payload.contents[0] && payload.contents[0].parts && payload.contents[0].parts[0]) {
                        extractedPrompt = payload.contents[0].parts[0].text;
                    }

                    try {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ payload: payload, type: endpointType, prompt: extractedPrompt })
                        });
                        const contentType = response.headers.get("content-type");
                        if (!contentType || !contentType.includes("application/json")) throw new Error("Oczekiwano JSON. Sprawdź plik api/gemini.js na Vercel.");
                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`Błąd Vercela: ${errData.error || response.statusText}`);
                        }
                        return await response.json();
                    } catch (err) { throw new Error(`${err.message}`); }
                }
            };

            const generateSos = async () => {
                if (!sosInput.trim()) { setSosError('Opisz krótko sytuację w klasie.'); return; }
                setIsGeneratingSos(true); setSosError(''); setSosResult(''); setSosSources([]);
                try {
                    const fullText = `SYSTEM: ${PROMPTS[`sos_${sosMode}`]}\n\nPROBLEM DO ROZWIĄZANIA: ${sosInput}`;
                    const payload = { contents: [{ parts: [{ text: fullText }] }], generationConfig: { temperature: 0.5 } };
                    if (useWebSearch) payload.tools = [{ google_search: {} }];

                    const data = await secureApiCall(payload, 'text');
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        text = text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                        setSosResult(text);
                        if (useWebSearch && data.candidates[0].groundingMetadata?.groundingAttributions) {
                            const extractedSources = [];
                            const seenUris = new Set();
                            data.candidates[0].groundingMetadata.groundingAttributions.forEach(attr => {
                                if (attr.web && attr.web.uri && !seenUris.has(attr.web.uri)) {
                                    seenUris.add(attr.web.uri);
                                    extractedSources.push({ title: attr.web.title || attr.web.uri, uri: attr.web.uri });
                                }
                            });
                            setSosSources(extractedSources);
                        }
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else throw new Error("Pusta odpowiedź z API.");
                } catch (err) { setSosError('Błąd: ' + err.message); } finally { setIsGeneratingSos(false); }
            };

            const handleSuccessGenerate = async () => {
                if (!successName.trim() || !successAction.trim()) return;
                setIsGeneratingSuccess(true); setShowSuccessCard(false); setSuccessText('');
                try {
                    const fullText = `SYSTEM: Jesteś pełnym ciepła wychowawcą przedszkolnym.\n\nZADANIE: Dziecko o imieniu ${successName} osiągnęło sukces: ${successAction}. Napisz radosną, krótką (max 3 zdania) pochwałę dla rodziców. Zacznij od 'Wielkie brawa!'.`;
                    const payload = { contents: [{ parts: [{ text: fullText }] }], generationConfig: { temperature: 0.7 } };
                    const data = await secureApiCall(payload, 'text');
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) { setSuccessText(text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim()); setShowSuccessCard(true); } 
                    else throw new Error("Brak odpowiedzi z serwera.");
                } catch (err) { alert("Błąd generowania: " + err.message); } finally { setIsGeneratingSuccess(false); }
            };

            // NOWA WERSJA GENERATORA KOMIKSU (4 KADRY)
            const generateStoryAndImage = async () => {
                if (!storyProblem.trim()) { setStoryError('Wpisz problem ucznia.'); return; }
                setIsGeneratingStory(true); setStoryError(''); setGeneratedPanels([]);
                try {
                    // ZMIANA 1: Precyzyjny prompt terapeutyczny. ZERO metafor, wymuszona spójność postaci.
                    const fullText = `SYSTEM: Jesteś wybitnym pedagogiem specjalnym i autorem bajek terapeutycznych dla dzieci ze spektrum autyzmu. Odpowiadaj WYŁĄCZNIE jako JSON.
ZADANIE: Napisz bardzo dosłowną, prostą rymowankę uspokajającą.
Problem dziecka: ${storyProblem}

KRYTYCZNE ZASADY:
1. Użyj imienia dziecka z problemu. Język musi być BARDZO PROSTY, bezpieczny i dosłowny. Zero abstrakcyjnych metafor (np. zamiast "chmury tańczą" napisz "siedzę w ciepłym domu", "mama mnie przytula", "mam swój miękki kocyk").
2. Dokładnie 4 zwrotki (każda po 4 linijki, rymy parzyste AABB).
3. Stwórz "image_prompt" (PO ANGIELSKU, max 15 słów). W KAŻDYM prompcie MUSISZ zacząć od spójnego opisu dziecka (np. "Cute 5-year-old girl with blonde hair..."), aby postać na wszystkich 4 obrazkach wyglądała tak samo!

Format JSON:
{"panels": [{ "text": "...", "image_prompt": "..." }, ...]}`;
                    
                    const textPayload = { 
                        contents: [{ parts: [{ text: fullText }] }], 
                        generationConfig: { temperature: 0.4 } 
                    };
                    const textData = await secureApiCall(textPayload, 'text');
                    let rawText = textData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawText) throw new Error("Brak odpowiedzi z serwera.");
                    
                    rawText = rawText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const start = jsonStr.indexOf('{');
                    const end = jsonStr.lastIndexOf('}');
                    if (start !== -1 && end !== -1) jsonStr = jsonStr.substring(start, end + 1);
                    
                    let parsedData;
                    try {
                        parsedData = JSON.parse(jsonStr);
                        if (!parsedData.panels || parsedData.panels.length === 0) throw new Error();
                    } catch (e) {
                        throw new Error("AI zaplątało się w pisaniu rymów. Kliknij przycisk jeszcze raz!");
                    }
                    
                    const panelsData = parsedData.panels;

                    // ZMIANA: Wykorzystujemy Twoje PROFESJONALNE klucze API z Vercela do wygenerowania 4 obrazków równolegle!
                    const imagePromises = panelsData.map(async (panel, index) => {
                        const safePrompt = panel.image_prompt ? panel.image_prompt.substring(0, 150) : "cute happy child";
                        const finalPrompt = `Childrens book illustration, simple flat vector style, pastel colors. ${safePrompt}. NO TEXT.`;

                        try {
                            // Żądamy wygenerowania obrazka z Twojego własnego backendu na Vercelu (Użyje Twoich kluczy!)
                            const imgData = await secureApiCall({ prompt: finalPrompt }, 'image');
                            
                            let imageUrl = '';
                            // Sprytne odczytywanie url dla OpenAI / Fal.ai / Leonardo / DALL-E / Stability
                            if (imgData.url) imageUrl = imgData.url;
                            else if (imgData.image_url) imageUrl = imgData.image_url;
                            else if (imgData.data && imgData.data[0] && imgData.data[0].url) imageUrl = imgData.data[0].url; 
                            else if (imgData.images && imgData.images[0] && imgData.images[0].url) imageUrl = imgData.images[0].url;
                            else if (imgData.predictions && imgData.predictions[0] && imgData.predictions[0].bytesBase64Encoded) imageUrl = `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}`;
                            
                            if (imageUrl) {
                                return { text: panel.text, image: imageUrl, originalPrompt: encodeURIComponent(finalPrompt) };
                            }
                            throw new Error("API premium nie zwróciło linku do obrazka.");
                        } catch (apiError) {
                            console.error("Błąd API Premium (Skończyły się kredyty?), używam obrazka zapasowego:", apiError);
                            const encodedPrompt = encodeURIComponent(finalPrompt);
                            const seed = Math.floor(Math.random() * 1000000) + index;
                            return { text: panel.text, image: `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=512&height=512&nologo=true`, originalPrompt: encodedPrompt };
                        }
                    });

                                            <div className="rzepy-elements" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10mm', alignContent: 'center', justifyItems: 'center' }}>
                                                {selectedRzepySet.items.map((item, i) => (
                                                    <div key={`p-color-${i}`} className="rzepy-cut" style={{ fontSize: '60pt', padding: '10mm' }}>{item}</div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* WIDOK: PORTFOLIO */}
                            {activeTab === 'portfolio' && (
                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-500/30 print-hidden">
                                    <h2 className="text-3xl font-black text-slate-300 mb-6 flex items-center gap-3"><Icon name="Compass" className="w-8 h-8 text-blue-500"/> Baza EduBox</h2>
                                    
                                    <div className="relative mb-8">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="Search"/></div>
                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Szukaj innych narzędzi (np. fiszki, dyplomy, gry)..." className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto custom-scrollbar pr-2">
                                        {filteredApps.length > 0 ? filteredApps.map((app, i) => (
                                            <a key={i} href={app.url} target="_blank" className="bg-slate-800/50 hover:bg-slate-700 border border-slate-700 hover:border-blue-500 p-5 rounded-2xl transition-all group flex flex-col h-full">
                                                <div className="text-3xl mb-3 group-hover:scale-110 transition-transform origin-left">{app.icon}</div>
                                                <h3 className="text-white font-bold mb-2 leading-tight">{app.title}</h3>
                                                <p className="text-slate-400 text-xs leading-relaxed flex-1">{app.desc}</p>
                                                <div className="mt-4 text-blue-400 text-xs font-bold uppercase tracking-widest group-hover:translate-x-2 transition-transform">Otwórz ➡️</div>
                                            </a>
                                        )) : (
                                            <div className="col-span-full text-center text-slate-500 py-10 font-bold">Nie znaleziono takiego narzędzia.</div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
