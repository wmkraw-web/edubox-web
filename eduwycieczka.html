        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [dest, setDest] = useState('');
            const [cls, setCls] = useState('');
            const [date, setDate] = useState('');
            const [timeStart, setTimeStart] = useState('08:00');
            const [timeEnd, setTimeEnd] = useState('14:00');
            const [studentsCount, setStudentsCount] = useState(25);
            
            // Budżet
            const [costs, setCosts] = useState([
                { id: 1, name: 'Transport (Autokar)', amount: 600 },
                { id: 2, name: 'Bilety wstępu', amount: 350 },
            ]);
            const [newCostName, setNewCostName] = useState('');
            const [newCostAmount, setNewCostAmount] = useState('');

            // Wyniki
            const [activeTab, setActiveTab] = useState('librus'); // librus | game | consent
            const [generatedData, setGeneratedData] = useState(null); // { librusMessage, fieldGame }
            const [isGenerating, setIsGenerating] = useState(false);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                let unsubscribeSnapshot = null;

                // Dodano async, aby móc użyć await przy inicjalizacji
                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        
                        // CZEKAMY na poprawne logowanie, zanim odpytamy bazę danych! (Firebase RULE 3)
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        // Dopiero gdy mamy uprawnienia, pobieramy Giełdę
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'trips_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                showToast("✅ Skopiowano do schowka!", "success");
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === KALKULATOR BUDŻETU ===
            const totalCost = costs.reduce((acc, curr) => acc + curr.amount, 0);
            const costPerStudent = studentsCount > 0 ? (totalCost / studentsCount).toFixed(2) : 0;

            const addCost = () => {
                if (!newCostName.trim() || !newCostAmount || isNaN(newCostAmount)) return;
                setCosts([...costs, { id: Date.now(), name: newCostName, amount: parseFloat(newCostAmount) }]);
                setNewCostName('');
                setNewCostAmount('');
            };

            const removeCost = (id) => {
                setCosts(costs.filter(c => c.id !== id));
            };

            // === PANCERNE API FUNCTIONS ===
            const fetchWithExponentialBackoff = async (url, options, timeoutMs = 25000) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                let lastErr;
                for (let i = 0; i < 5; i++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                        const fetchOptions = { ...options, signal: controller.signal };
                        
                        const res = await fetch(url, fetchOptions);
                        clearTimeout(timeoutId);
                        
                        if (!res.ok) {
                            const errText = await res.text();
                            throw new Error(`HTTP ${res.status}: ${errText.substring(0, 80)}`);
                        }
                        return await res.json();
                    } catch (err) {
                        lastErr = err;
                        if (err.name === 'AbortError') lastErr = new Error("Serwer nie odpowiedział na czas (Timeout).");
                        if (i < 4) await new Promise(r => setTimeout(r, delays[i]));
                    }
                }
                throw lastErr;
            };

            const parseAIResponse = (rawText) => {
                try {
                    let jsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = jsonStr.indexOf('{');
                    const endIdx = jsonStr.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) {
                        jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                    }
                    // Pancerna ochrona przed twardymi enterami psującymi obiekt JSON
                    jsonStr = jsonStr.replace(/[\u0000-\u001F]+/g, ' ');
                    return JSON.parse(jsonStr);
                } catch (err) {
                    console.error("JSON Parse Error. Surowy tekst:", rawText);
                    throw new Error("Model AI zwrócił uszkodzony tekst.");
                }
            };

            const fetchTripData = async (usrPrompt, sysPrompt) => {
                try {
                    // Główne zapytanie do serwera
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: usrPrompt, 
                            system: sysPrompt,
                            temperature: 0.5,
                            format: "json",
                            model: "gpt-4o-mini"
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (!res.ok) throw new Error(`Serwer główny: HTTP ${res.status}`);
                    const data = await res.json();
                    return parseAIResponse(data.text);
                    
                } catch (e) {
                    console.warn("Przełączam na model awaryjny:", e.message);
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: usrPrompt }] }],
                        systemInstruction: { parts: [{ text: sysPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    librusMessage: { type: "STRING" },
                                    fieldGame: { type: "STRING" }
                                },
                                required: ["librusMessage", "fieldGame"]
                            }
                        }
                    };

                    const data = await fetchWithExponentialBackoff(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }, 20000);
                    
                    const responseText = data.candidates[0].content.parts[0].text;
                    return JSON.parse(responseText);
                }
            };

            // === LOGIC ===
            const generateAIPackage = () => {
                if (!dest.trim() || !cls.trim()) { showToast('Wpisz cel wycieczki i klasę!', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedData(null);
                        
                        try {
                            const sysPrompt = `Jesteś ekspertem edukacyjnym. Organizujesz wycieczki szkolne.
Twoim ZADANIEM jest przygotowanie komunikatu dla rodziców oraz wciągającej gry terenowej dla uczniów.
ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON o strukturze:
{
  "librusMessage": "Profesjonalna i miła wiadomość na e-dziennik (Librus). Musi zawierać podany cel wycieczki, godziny, klasę i koszt do zapłaty. Poproś o wpłatę i zgodę. Możesz używać tagu <br/> dla nowej linii.",
  "fieldGame": "Kreatywna gra terenowa / zestaw 3-4 zadań dla dzieci do wykonania na miejscu. Dopasowana do celu. Używaj tagów HTML takich jak <br/>, <strong>, <ul> do formatowania."
}
BARDZO WAŻNE: Nie używaj prawdziwych znaków nowej linii (enterów) wewnątrz stringów JSON, używaj <br/>!`;
                            
                            const usrPrompt = `Cel wycieczki: ${dest}\nKlasa/Wiek: ${cls}\nTermin: ${date || '[Uzupełnij datę]'}, godz. ${timeStart} - ${timeEnd}\nKoszt wycieczki do wpłaty na jednego ucznia: ${costPerStudent} zł.\nNapisz wiadomość i grę terenową.`;

                            const data = await fetchTripData(usrPrompt, sysPrompt);

                            setGeneratedData({
                                librusMessage: data.librusMessage.replace(/<br\s*\/?>/gi, '\n'), // Konwersja na standardowy text w textarea
                                fieldGame: data.fieldGame
                            });

                            setActiveTab('librus');
                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                        } catch (error) {
                            console.error("Szczegóły błędu:", error); 
                            showToast(`Błąd: ${error.message.substring(0, 80)}`, 'error');
                        } finally { 
                            setIsGenerating(false); 
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedData) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { 
                        dest, cls, date, timeStart, timeEnd, studentsCount, costs, costPerStudent,
                        generatedData
                    };
                    const shortName = `${dest} (${cls})`.substring(0, 40);
                    
                    await window.EduBoxCore.saveToGielda('trips_market', 'EduWycieczka', shortName, configToSave);
                    showToast("Opublikowano na Giełdzie Wycieczek! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setDest(item.config.dest || '');
                setCls(item.config.cls || '');
                setDate(item.config.date || '');
                setTimeStart(item.config.timeStart || '08:00');
                setTimeEnd(item.config.timeEnd || '14:00');
                setStudentsCount(item.config.studentsCount || 25);
                setCosts(item.config.costs || []);
                setGeneratedData(item.config.generatedData);
                setAppMode('generator');
                setActiveTab('librus');
                showToast("Wczytano wycieczkę z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            // === KOMPONENTY WIDOKU ===
            const ConsentTemplate = () => (
                <div className="print-consent-form bg-white text-slate-900 border-2 border-slate-300 relative">
                    <h2 className="text-center font-black text-xl mb-6 uppercase tracking-widest border-b-2 border-slate-200 pb-4">Zgoda na udział w wycieczce</h2>
                    
                    <div className="space-y-4 text-[13px] leading-loose">
                        <p>
                            Wyrażam zgodę na udział mojego dziecka:<br/>
                            <span className="inline-block w-full border-b border-slate-400 mt-4 bg-slate-50 h-6"></span><br/>
                            <span className="text-[10px] text-slate-400 uppercase tracking-widest">(imię i nazwisko ucznia)</span>
                        </p>
                        <p>
                            w wycieczce klasowej do: <strong className="text-emerald-700 bg-emerald-50 px-2 rounded">{dest || '...................................................'}</strong>.<br/>
                            Wspólnie z klasą: <strong>{cls || '.........'}</strong>.<br/>
                            Termin wycieczki: <strong>{date || '............................'}</strong> w godzinach: <strong>{timeStart} - {timeEnd}</strong>.
                        </p>
                        <p>
                            Zobowiązuję się do pokrycia kosztów wycieczki w wysokości: <strong className="text-lg bg-yellow-100 px-2 rounded border border-yellow-300">{costPerStudent} zł</strong>.<br/>
                            Biorę na siebie odpowiedzialność finansową za ewentualne szkody materialne wyrządzone przez moje dziecko podczas wycieczki.
                        </p>
                        <p>
                            Ważne informacje o stanie zdrowia dziecka (choroby przewlekłe, alergie, leki):<br/>
                            <span className="inline-block w-full border-b border-slate-400 mt-6 bg-slate-50 h-6"></span>
                        </p>
                    </div>

                    <div className="flex justify-between mt-12 pt-6">
                        <div className="text-center w-48">
                            <div className="border-b-2 border-slate-800 mb-2"></div>
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest">(miejscowość, data)</span>
                        </div>
                        <div className="text-center w-64">
                            <div className="border-b-2 border-slate-800 mb-2"></div>
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest">(czytelny podpis rodzica)</span>
                        </div>
                    </div>
                </div>
            );

            // RENDER SIDEBAR
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                            <i className="ph-bold ph-bus text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-emerald-400">Wycieczka</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-map-pin text-lg"></i> Asystent Wyjść
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-sky-600/20 text-sky-400 border border-sky-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-books text-lg"></i> Baza Wycieczek
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-emerald-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-emerald-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Baza Gotowych Wycieczek</h2>
                            <p className="text-slate-400 mb-8">Eksploruj sprawdzone wycieczki z obliczonym budżetem i scenariuszem gry terenowej.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-emerald-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="p-3 rounded-xl bg-emerald-500/10 text-emerald-400 group-hover:scale-110 transition-transform">
                                                <i className="ph-fill ph-map-pin-line text-2xl"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">Cel: {item.config.dest}</h3>
                                        <div className="flex gap-2 text-[10px] text-slate-400 mb-4 flex-wrap">
                                            <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">Koszt: {item.config.costPerStudent} zł</span>
                                            <span className="bg-slate-800 px-2 py-1 rounded border border-slate-700">Dla: {item.config.cls}</span>
                                        </div>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-emerald-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Wczytaj Pakiet
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych wycieczek w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div><div className="aura-blob aura-3 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-emerald-500/20 shadow-[0_0_50px_rgba(16,185,129,0.2)]">
                                <i className="ph-bold ph-spinner-gap animate-spin text-5xl text-emerald-500"></i>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Tworzenie Pakietu...</h3>
                                    <p className="text-xs text-slate-400 font-medium">Opracowuję ogłoszenie i wymyślam grę terenową.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 print:block">
                            
                            {/* LEWA KOLUMNA: KONFIGURATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="text-left mb-8 fade-in">
                                    <div className="inline-flex items-center gap-2 bg-emerald-900/30 border border-emerald-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                        Narzędzie Organizatora
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Wycieczka <br/><span className="text-gradient">bez stresu.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Rozlicz budżet, wydrukuj zgody dla rodziców, stwórz profesjonalne ogłoszenie na Librusa i wygeneruj grę terenową. Wszystko w jednym miejscu.
                                    </p>
                                </div>

                                {/* Panel Podstawowy */}
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8 fade-in">
                                    <h2 className="text-xl font-black text-white mb-6 flex items-center gap-2">
                                        <i className="ph-bold ph-map-pin text-emerald-400"></i> Dane wyjścia
                                    </h2>
                                    
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Cel wycieczki</label>
                                                <input type="text" value={dest} onChange={e => setDest(e.target.value)} placeholder="Np. Muzeum, Kino..." className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 transition-colors text-sm" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Klasa / Grupa</label>
                                                <input type="text" value={cls} onChange={e => setCls(e.target.value)} placeholder="Np. 4a" className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 transition-colors text-sm" />
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-3 gap-4">
                                            <div className="col-span-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Data</label>
                                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500 transition-colors text-sm" />
                                            </div>
                                            <div className="col-span-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Od godz.</label>
                                                <input type="time" value={timeStart} onChange={e => setTimeStart(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500 transition-colors text-sm" />
                                            </div>
                                            <div className="col-span-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Do godz.</label>
                                                <input type="time" value={timeEnd} onChange={e => setTimeEnd(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500 transition-colors text-sm" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Panel Budżetu */}
                                <div className="glass-panel rounded-[2rem] p-6 md:p-8 border border-emerald-500/30 fade-in">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-black text-white flex items-center gap-2">
                                            <i className="ph-bold ph-calculator text-emerald-400"></i> Kalkulator Budżetu
                                        </h2>
                                    </div>

                                    <div className="space-y-3 mb-6">
                                        {costs.map((c, i) => (
                                            <div key={c.id} className="flex justify-between items-center bg-slate-900/80 border border-slate-700 p-3 rounded-xl group">
                                                <span className="text-slate-300 text-sm flex items-center gap-2"><i className="ph-fill ph-check-circle text-emerald-500"></i> {c.name}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-mono text-emerald-400 font-bold">{c.amount.toFixed(2)} zł</span>
                                                    <button onClick={() => removeCost(c.id)} className="text-slate-500 hover:text-red-400 p-1 transition-colors"><i className="ph-bold ph-trash"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex gap-2 mb-8">
                                        <input type="text" placeholder="Nowy wydatek..." value={newCostName} onChange={e => setNewCostName(e.target.value)} className="flex-grow bg-slate-800 border border-slate-600 text-white rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 outline-none" />
                                        <input type="number" placeholder="Kwota" value={newCostAmount} onChange={e => setNewCostAmount(e.target.value)} className="w-24 bg-slate-800 border border-slate-600 text-white rounded-xl px-3 py-2.5 text-sm focus:border-emerald-500 outline-none text-center" />
                                        <button onClick={addCost} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold transition-colors shadow-lg"><i className="ph-bold ph-plus"></i></button>
                                    </div>

                                    <div className="bg-gradient-to-r from-slate-900 to-slate-800 p-5 rounded-2xl border border-slate-700 flex justify-between items-center shadow-inner">
                                        <div>
                                            <div className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Liczba Uczniów:</div>
                                            <div className="flex items-center gap-2">
                                                <i className="ph-fill ph-users text-emerald-500"></i>
                                                <input type="number" min="1" value={studentsCount} onChange={e => setStudentsCount(e.target.value)} className="bg-transparent text-white font-black text-xl w-16 outline-none focus:border-emerald-500 border-b border-transparent" />
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] text-emerald-400 uppercase tracking-widest font-bold mb-1">Składka na 1 ucznia</div>
                                            <div className="text-3xl font-black text-white tabular-nums">{costPerStudent} <span className="text-lg text-emerald-500">zł</span></div>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={generateAIPackage} 
                                    disabled={isGenerating || !dest}
                                    className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-50 text-white py-5 rounded-2xl font-black shadow-[0_10px_30px_-10px_rgba(16,185,129,0.5)] transition-all btn-bounce uppercase tracking-widest flex items-center justify-center gap-3 text-sm mt-4"
                                >
                                    <i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Pakiet Edukacyjny
                                </button>
                            </div>

                            {/* PRAWA KOLUMNA: WYNIKI (AI & Druk) */}
                            <div className="lg:col-span-7 flex flex-col h-full print:block print:col-span-12 print:m-0">
                                
                                <div className="glass-panel p-2 rounded-2xl flex gap-2 mb-6 print-hidden backdrop-blur-md">
                                    <button onClick={() => setActiveTab('librus')} className={`flex-1 py-3.5 px-2 rounded-xl flex items-center justify-center gap-2 text-[11px] sm:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'librus' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><i className="ph-bold ph-envelope-simple text-lg"></i> Ogłoszenie</button>
                                    <button onClick={() => setActiveTab('consent')} className={`flex-1 py-3.5 px-2 rounded-xl flex items-center justify-center gap-2 text-[11px] sm:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'consent' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><i className="ph-bold ph-file-signature text-lg"></i> Zgody (PDF)</button>
                                    <button onClick={() => setActiveTab('game')} className={`flex-1 py-3.5 px-2 rounded-xl flex items-center justify-center gap-2 text-[11px] sm:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'game' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><i className="ph-bold ph-compass text-lg"></i> Gra Terenowa</button>
                                </div>

                                <div className="glass-panel rounded-[2.5rem] p-6 md:p-10 flex-grow relative overflow-hidden print:p-0 print:border-none print:bg-transparent print:backdrop-filter-none shadow-2xl bg-slate-900/40">
                                    
                                    {/* Action Buttons Overlay */}
                                    <div className={`absolute top-6 right-6 z-20 flex gap-2 print-hidden transition-opacity ${generatedData || activeTab === 'consent' ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                        <button onClick={publishToGielda} disabled={isSavingToGielda || !generatedData} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition-all text-xs disabled:opacity-50">
                                            <i className="ph-bold ph-globe text-base"></i> Zapisz wzór
                                        </button>
                                    </div>

                                    {/* WIDOK 1: LIBRUS */}
                                    {activeTab === 'librus' && (
                                        <div className="animate-[reveal_0.3s_ease-out] print-hidden flex flex-col h-full">
                                            <div className="mb-8 pr-32">
                                                <h3 className="text-2xl font-black text-white mb-2">Wiadomość do rodziców</h3>
                                                <p className="text-slate-400 text-sm">Gotowa, w pełni sformułowana notatka do wklejenia w e-dzienniku.</p>
                                            </div>
                                            
                                            {!generatedData?.librusMessage ? (
                                                <div className="flex-1 flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-slate-700/50 rounded-2xl p-10 bg-slate-900/30">
                                                    <i className="ph-duotone ph-paper-plane-tilt text-7xl mb-6 text-slate-600"></i>
                                                    <p className="font-medium text-center">Wpisz dane po lewej stronie i wygeneruj pakiet,<br/>aby AI napisało kompletne ogłoszenie.</p>
                                                </div>
                                            ) : (
                                                <div className="flex-1 flex flex-col relative group">
                                                    <textarea 
                                                        value={generatedData.librusMessage} 
                                                        readOnly
                                                        className="w-full flex-1 min-h-[400px] bg-slate-900/80 border border-slate-700 rounded-2xl p-8 text-slate-200 text-[15px] leading-relaxed outline-none custom-scrollbar resize-none shadow-inner"
                                                    ></textarea>
                                                    <button onClick={() => copyToClipboard(generatedData.librusMessage)} className="absolute bottom-6 right-6 bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl text-sm font-bold transition-all shadow-lg flex items-center gap-2 btn-bounce">
                                                        <i className="ph-bold ph-copy text-lg"></i> Skopiuj do schowka
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* WIDOK 2: ZGODY DO DRUKU */}
                                    <div className={`${activeTab === 'consent' ? 'block' : 'hidden'} animate-[reveal_0.3s_ease-out] print:block w-full h-full flex flex-col`}>
                                        <div className="mb-8 pr-32 print-hidden">
                                            <h3 className="text-2xl font-black text-white mb-2">Oświadczenia do druku</h3>
                                            <p className="text-slate-400 text-sm">Zoptymalizowany układ - dwie zgody na jednej kartce A4, gotowe do przecięcia.</p>
                                        </div>
                                        
                                        <div className="print-hidden mb-6 flex items-center justify-center text-slate-400 text-xs font-bold uppercase tracking-widest gap-2 bg-slate-800/50 py-3 rounded-xl border border-slate-700">
                                            <i className="ph-bold ph-printer text-lg text-emerald-400"></i> Gotowe do wydruku czarno-białego
                                        </div>

                                        <div className="text-center print-hidden mb-6">
                                            <button onClick={() => window.print()} className="bg-amber-600 hover:bg-amber-500 text-white px-10 py-4 rounded-2xl text-sm font-black transition-all shadow-[0_10px_20px_rgba(217,119,6,0.3)] flex items-center justify-center gap-3 mx-auto btn-bounce uppercase tracking-widest">
                                                <i className="ph-bold ph-printer text-xl"></i> Drukuj Zgody (PDF)
                                            </button>
                                        </div>

                                        {/* Podgląd Kartki (Druk) */}
                                        <div className="bg-white rounded-sm shadow-2xl print:shadow-none print:bg-transparent overflow-hidden print-consent-wrapper">
                                            <ConsentTemplate />
                                            
                                            <div className="scissors-line w-full">
                                                <div className="scissors-icon"><i className="ph-fill ph-scissors"></i></div>
                                            </div>
                                            
                                            <ConsentTemplate />
                                        </div>
                                    </div>

                                    {/* WIDOK 3: GRA TERENOWA */}
                                    {activeTab === 'game' && (
                                        <div className="animate-[reveal_0.3s_ease-out] print-hidden flex flex-col h-full">
                                            <div className="mb-8 pr-32">
                                                <h3 className="text-2xl font-black text-white mb-2">Edukacyjna Gra Terenowa</h3>
                                                <p className="text-slate-400 text-sm">Kreatywne zagadki powiązane z celem wycieczki, wygenerowane przez AI.</p>
                                            </div>
                                            
                                            {!generatedData?.fieldGame ? (
                                                <div className="flex-1 flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-slate-700/50 rounded-2xl p-10 bg-slate-900/30">
                                                    <i className="ph-duotone ph-compass text-7xl mb-6 text-slate-600"></i>
                                                    <p className="font-medium text-center">Kliknij "Wygeneruj Pakiet", aby AI wymyśliło zagadki<br/>do miejsca: {dest || '[Wybrany cel]'}.</p>
                                                </div>
                                            ) : (
                                                <div className="bg-slate-900/80 border border-slate-700 rounded-2xl p-8 flex-1 overflow-y-auto custom-scrollbar relative shadow-inner">
                                                    <i className="ph-fill ph-quotes text-5xl text-emerald-500/10 absolute top-6 left-6 pointer-events-none"></i>
                                                    <div 
                                                        className="relative z-10 text-slate-200 text-[15px] leading-relaxed whitespace-pre-wrap markdown-body font-medium"
                                                        dangerouslySetInnerHTML={{ __html: generatedData.fieldGame }}
                                                    ></div>
                                                    
                                                    <div className="mt-8 pt-6 border-t border-slate-700 flex justify-end">
                                                        <button onClick={() => copyToClipboard(generatedData.fieldGame.replace(/<[^>]*>?/gm, ''))} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl text-sm font-bold transition-all shadow-lg flex items-center gap-2 btn-bounce">
                                                            <i className="ph-bold ph-copy text-lg"></i> Skopiuj treść
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
