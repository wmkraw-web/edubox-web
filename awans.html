                `;
            }

            try {
                fetch('/menu.html')

                    })

                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(error => wstawMenuAwaryjne());
            } catch (error) { wstawMenuAwaryjne(); }
        });

                import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const DAILY_LIMIT = 5;

                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                UserCheck: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></>,
                Mentor: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        const BotHelperAvatar = () => (
            <svg viewBox="0 0 100 100" className="w-14 h-14 drop-shadow-md flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 30 V15" stroke="#94a3b8" strokeWidth="4" strokeLinecap="round"/>
                <circle cx="50" cy="12" r="5" fill="#3b82f6"/>
                <rect x="25" y="30" width="50" height="40" rx="12" fill="#1e40af"/>
                <rect x="32" y="38" width="36" height="22" rx="6" fill="#ffffff"/>
                <circle cx="40" cy="49" r="3.5" fill="#1e40af" className="bot-eye"/>
                <circle cx="60" cy="49" r="3.5" fill="#1e40af" className="bot-eye"/>
                <path d="M 45 56 Q 50 60 55 56" stroke="#1e40af" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
            </svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator');

            const [isPremium, setIsPremium] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [botMessage, setBotMessage] = useState("Cześć! Wrzuć mi w formularz swoje chaotyczne notatki. Użyję profesjonalnego żargonu prawnego, aktualnego na przepisy po 2022 roku, by zamienić je w elegancki dokument!");
            const [mode, setMode] = useState('opiekun'); 
            
            const [params, setParams] = useState({
                teacherName: '',
                role: 'Nauczyciel edukacji wczesnoszkolnej',
                customRole: '',
                level: 'Nauczyciel początkujący (na mianowanego)',
                achievements: '',
                formatType: 'epic'
            });

            const [generatedData, setGeneratedData] = useState(null);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            const ROLES = [
                "Nauczyciel wychowania przedszkolnego",
                "Nauczyciel edukacji wczesnoszkolnej",
                "Nauczyciel przedmiotu (szkoła podstawowa/średnia)",
                "Pedagog szkolny / specjalny",
                "Psycholog szkolny",
                "Logopeda",
                "Fizjoterapeuta / Rehabilitant",
                "Inne (wpisz własne)"
            ];

            // --- LOGOWANIE (wspólny silnik) ---
            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'awans_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            useEffect(() => {
                if(mode === 'opiekun') setBotMessage("Tryb Dyrektora. Dokument zostanie zredagowany w 3-ciej osobie jako formalna OCENA PRACY dla nauczyciela.");
                else if(mode === 'mentor') setBotMessage("Tryb Mentora. Dokument to oficjalna OPINIA o nauczycielu początkującym, napisana z perspektywy wspierającego mentora, zgodnie z nowymi przepisami.");
                else setBotMessage("Tryb Nauczyciela. Dokument zostanie zredagowany w 1-szej osobie jako Twoje osobiste sprawozdanie z realizacji planu.");
            }, [mode]);

            const updateAndCheckLimit = () => {
                if (isPremium) return true;
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateDocument = async () => {
                const finalRole = params.role === "Inne (wpisz własne)" ? params.customRole : params.role;
                if (!finalRole.trim() || !params.achievements.trim()) return showToast('Wypełnij stanowisko i działania/sukcesy!');
                
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setGeneratedData(null);
                setBotMessage("Analizuję Twoje notatki i dopasowuję odpowiednie paragrafy z NAJNOWSZYCH przepisów (po 2022r.). Chwileczkę...");
                
                let lengthInstruction = params.formatType === 'epic' 
                    ? "Wymagam BARDZO ROZBUDOWANEGO i wyczerpującego dokumentu ('lany tekst'). Rozbuduj każdy podany punkt, używaj wyrafinowanego języka urzędowego/pedagogicznego, dodaj profesjonalne wnioski i podsumowania. Dokument musi wyglądać na profesjonalnie przygotowany esej."
                    : "Wymagam ZWIĘZŁEGO dokumentu. Używaj punktatorów i krótkich, konkretnych zdań. Tylko same fakty i profesjonalne podsumowanie.";

                let systemPrompt = "";
                let userPrompt = "";
                const kontekstCzasowy = `Trwa rok szkolny 2026/2027. Od reformy z 2022 r. obowiązują stopnie: nauczyciel początkujący, mianowany, dyplomowany (przepisy przejściowe dla nauczycieli kontraktowych/stażystów sprzed reformy obowiązują tylko do 31 sierpnia 2027 r.). `;

                if (mode === 'opiekun') {
                    systemPrompt = kontekstCzasowy + `Jesteś doświadczonym dyrektorem szkoły oraz ekspertem prawa oświatowego w Polsce. Znasz najnowsze przepisy dotyczące awansu zawodowego nauczycieli (w tym zmiany z 2022 r. i powiązane rozporządzenia o ocenie pracy).
ZASADY KRYTYCZNE:
1. Pisz w 3 osobie liczby pojedynczej o nauczycielu. Ton wybitnie profesjonalny, urzędowy. Będzie to oficjalna OCENA PRACY.
2. ${lengthInstruction}
3. Dopasuj słownictwo do specyfiki zawodu: ${finalRole}. Używaj pojęć takich jak: kompetencje, warsztat pracy, metody aktywizujące, ewaluacja.
4. Zwróć WYŁĄCZNIE format JSON: { "title": "...", "legal_basis": "Podstawa prawna z uwzględnieniem aktualnych przepisów KN i rozporządzeń z 2022/2023 r.", "document_body": "Używaj tu znaczników <br> oraz <b> do formatowania. Bez formatowania markdown." }`;
                    userPrompt = `Stanowisko: ${finalRole}\nStopień: ${params.level}\nDziałania: ${params.achievements}\nNapisz pełną, aktualną ocenę pracy nauczyciela za okres przygotowania do zawodu / stażu, wystawianą przez dyrektora. Nie używaj imienia i nazwiska, użyj ogólników.`;
                } 
                else if (mode === 'mentor') {
                    systemPrompt = kontekstCzasowy + `Jesteś doświadczonym nauczycielem mianowanym/dyplomowanym pełniącym funkcję MENTORA dla nauczyciela początkującego w Polsce. Znasz przepisy awansowe wprowadzone po 2022 roku (Karta Nauczyciela, przygotowanie do zawodu).
ZASADY KRYTYCZNE:
1. Pisz w 3 osobie liczby pojedynczej o obserwowanym nauczycielu, z perspektywy mentora (który obserwował zajęcia, wspierał, doradzał). Ton profesjonalny, wspierający i pedagogiczny.
2. ${lengthInstruction}
3. Dopasuj słownictwo do specyfiki zawodu: ${finalRole}. Używaj pojęć: obserwacja zajęć, doskonalenie warsztatu, współpraca z mentorem, adaptacja w szkole, omawianie lekcji.
4. Zwróć WYŁĄCZNIE format JSON: { "title": "...", "legal_basis": "Podstawa prawna z uwzględnieniem aktualnych przepisów KN z 2022/2023 r. dot. opinii mentora", "document_body": "Używaj tu znaczników <br> oraz <b> do formatowania. Bez formatowania markdown." }`;
                    userPrompt = `Stanowisko: ${finalRole}\nEtap: ${params.level}\nDziałania, postępy i sukcesy zauważone przeze mnie (mentora): ${params.achievements}\nNapisz pełną, aktualną opinię mentora o nauczycielu odbywającym przygotowanie do zawodu. Nie używaj imienia i nazwiska, użyj ogólników.`;
                }
                else if (mode === 'nauczyciel') {
                    systemPrompt = kontekstCzasowy + `Jesteś ekspertem prawa oświatowego w Polsce piszącym "Sprawozdanie z realizacji planu rozwoju zawodowego" dla nauczyciela. Znasz przepisy awansowe wprowadzone po 2022 roku.
ZASADY KRYTYCZNE:
1. Pisz w 1 osobie liczby pojedynczej ("Zrealizowałem/am"). Ton refleksyjny i urzędowy.
2. ${lengthInstruction}
3. Dopasuj działania do stanowiska: ${finalRole}. Skup się na efektach dla szkoły i ucznia.
4. Zwróć WYŁĄCZNIE format JSON: { "title": "...", "legal_basis": "Podstawa prawna z uwzględnieniem aktualnych przepisów KN i rozporządzeń z 2022/2023 r.", "document_body": "Używaj tu znaczników <br>, <b>, <ul>, <li> do formatowania. Bez formatowania markdown." }`;
                    userPrompt = `Stanowisko: ${finalRole}\nStopień: ${params.level}\nMoje zrealizowane działania: ${params.achievements}\nPrzekształć te notatki w moje urzędowe sprawozdanie, zgodne z nowymi przepisami awansowymi.`;
                }

                try {
                    if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                         throw new Error("TestLocal");
                    }

                    const payload = { system: systemPrompt, prompt: userPrompt, temperature: 0.4, format: "json", model: "gpt-4o-mini" };
                    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.details || data.message || "Błąd z serwera");
                    
                    let cleanText = data.text;
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const outerObj = JSON.parse(cleanText); if(outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch(e){}
                    }
                    
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = cleanText;
                    
                    jsonStr = jsonStr.replace(new RegExp('`{3}json', 'gi'), '').replace(new RegExp('`{3}', 'g'), '').trim();

                    if(jsonStr.indexOf('{') !== -1) {
                        jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                    }
                    
                    const parsedData = JSON.parse(jsonStr);
                    // Append Name if Provided
                    if(params.teacherName && params.teacherName.trim() !== '') {
                        parsedData.document_body = `<b>Dotyczy: ${params.teacherName}</b><br><br>${parsedData.document_body}`;
                    }
                    
                    setGeneratedData(parsedData);
                    setBotMessage("Gotowe! Przepisy zaaktualizowane. Możesz go wydrukować, pobrać lub dodać do Biblioteki.");
                } catch (error) {

                        showToast(`Tryb testowy na komputerze. Dokument symulowany.`);
                        setTimeout(() => {
                            setGeneratedData({
                                title: `OPINIA / OCENA / SPRAWOZDANIE (${mode.toUpperCase()})`,
                                legal_basis: "Podstawa prawna: Ustawa z dnia 26 stycznia 1982 r. – Karta Nauczyciela ze zmianami po 2022 roku.",
                                document_body: `<b>Dotyczy: ${params.teacherName || 'Imię Nazwisko'}</b><br><br>Twoja aplikacja <b>Kreator Awansu</b> zadziałała.<br><br>Testujesz ją na dysku, więc nie łączy się z serwerem kosztów.<br><br>Gdy umieścisz ją na serwerze (np. na eduboxpro.pl), połączy się ona z chmurą i wygeneruje poprawny dokument ze wskazanego trybu.`
                            });
                            setBotMessage("Oto testowy podgląd. Wrzuć plik na serwer Vercel, by używać pełnej AI.");
                            setIsGenerating(false);
                        }, 1000);
                    } else {
                        console.error("Błąd AI:", error); 
                        showToast(`Błąd: ${error.message}`); 
                        setBotMessage("Coś poszło nie tak z połączeniem. Spróbuj ponownie!");
                        setIsGenerating(false);

                const footer = `<\/body><\/html>`;
                
                let content = `<h1>${title}</h1>`;
                if(basis) content += `<p class="legal">${basis}</p>`;
                content += `<div>${body}</div>`;

                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className="glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-amber-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[600px]">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-blue-500/20 text-blue-400">
                                                            {item.mode} ({item.role})
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                                                    {item.legal_basis && <p className="text-xs text-slate-500 italic mb-4">{item.legal_basis}</p>}
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar document-font">
                                                        <div dangerouslySetInnerHTML={{ __html: item.document_body }} />
                                                    </div>
                                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                        <button onClick={() => copyToClipboard(item.document_body)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                            <Icon name="Copy" size={16} />
                                                        </button>
                                                        <button onClick={() => exportToWord(item.title, item.document_body, item.legal_basis)} className="p-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                            <Icon name="Download" size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <footer className="py-6 border-t border-slate-800 text-center text-sm font-bold text-slate-600 uppercase tracking-widest mt-auto">
                        EduBox Pro - Moduł Awansu
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>


</body></html>
