    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; min-height: 100vh; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .timeline-line { background: linear-gradient(to bottom, rgba(59,130,246,0.5), rgba(51,65,85,0.2)); }
    </style>

  <link rel="canonical" href="https://eduboxpro.pl/co-nowego.html">
  <meta name="description" content="Lista nowości, ulepszeń i poprawek w EduBox AI - śledź na bieżąco rozwój platformy dla nauczycieli.">
  <link rel="icon" href="/icon-96.png" type="image/png">
</head>
<body>
    <script>window.EDUBOX_IMAGE_APP = false;</script>
    <div id="wspolne-menu-kontener"></div>

    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TAG_STYLES = {
            "Nowość": { pill: "bg-blue-500/15 text-blue-400 border-blue-500/30", icon: "ph-sparkle" },
            "Ulepszenie": { pill: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30", icon: "ph-arrow-fat-lines-up" },
            "Poprawka": { pill: "bg-amber-500/15 text-amber-400 border-amber-500/30", icon: "ph-wrench" }
        };

        function EntryRow({ entry, isLast }) {
            const style = TAG_STYLES[entry.tag] || TAG_STYLES["Nowość"];
            return (
                <div className="relative pl-14 pb-10">
                    {!isLast && <div className="timeline-line absolute left-[19px] top-10 bottom-0 w-px"></div>}
                    <div className={`absolute left-0 top-0 w-10 h-10 rounded-full flex items-center justify-center border ${style.pill}`}>
                        <i className={`ph-bold ${style.icon} text-lg`}></i>
                    </div>
                    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition-colors">
                        <div className="flex flex-wrap items-center gap-3 mb-3">
                            <span className={`text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full border ${style.pill}`}>{entry.tag}</span>
                            <span className="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                                <i className="ph-bold ph-calendar-blank"></i>
                                {new Date(entry.date + 'T00:00:00').toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })}
                            </span>
                        </div>
                        <h2 className="text-lg font-black text-white mb-2 leading-snug">{entry.title}</h2>
                        <p className="text-slate-400 text-sm leading-relaxed">{entry.description}</p>
                    </div>
                </div>
            );
        }

        function App() {
            const ENTRIES = (window.CO_NOWEGO || []).slice().sort((a, b) => b.date.localeCompare(a.date));

            useEffect(() => {
                document.title = "Co nowego - EduBox AI";
                if (window.EduBoxCore) window.EduBoxCore.init(() => {});
                else window.addEventListener('EduBoxCoreReady', () => window.EduBoxCore.init(() => {}), { once: true });
            }, []);

            return (
                <main className="max-w-3xl mx-auto px-4 sm:px-6 py-14">
                    <div className="text-center mb-14">
                        <div className="inline-flex items-center gap-2 bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-5">
                            <i className="ph-bold ph-rocket-launch"></i> Co nowego
                        </div>
                        <h1 className="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">EduBox AI cały czas<br className="hidden sm:block" /> się rozwija</h1>
                        <p className="text-slate-400 max-w-xl mx-auto text-base md:text-lg">Nowe narzędzia, ulepszenia i poprawki - wszystko w jednym miejscu, na bieżąco.</p>
                    </div>

                    {ENTRIES.length === 0 ? (
                        <div className="text-center text-slate-500 py-20">Wkrótce pojawią się tu pierwsze wpisy.</div>
                    ) : (
                        <div className="fade-in">
                            {ENTRIES.map((entry, i) => (
                                <EntryRow key={entry.id || i} entry={entry} isLast={i === ENTRIES.length - 1} />
                            ))}
                        </div>
                    )}

                    <div className="text-center mt-6">
                        <a href="index.html" className="inline-flex items-center gap-2 text-slate-400 hover:text-white text-sm font-bold transition-colors">
                            <i className="ph-bold ph-arrow-left"></i> Wróć na stronę główną
                        </a>
                    </div>
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>

</body></html>
