    <!-- React & Babel -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Tailwind CSS -->

    <!-- Phosphor Icons -->

    <!-- Google Fonts dla liter -->
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bangers&family=Caveat:wght@700&family=Comic+Neue:wght@700&family=Dancing+Script:wght@700&family=Montserrat:wght@700&family=Oswald:wght@700&family=Pacifico&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Auras - Standard V3 PRO MAX */

            position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
        }
        .aura-blob {
            position: absolute; filter: blur(100px); border-radius: 50%; opacity: 0.4; animation: float 15s ease-in-out infinite alternate;

        .aura-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(59,130,246,0.5) 0%, rgba(0,0,0,0) 70%); animation-delay: -5s; }
        .aura-3 { top: 40%; left: 30%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(236,72,153,0.4) 0%, rgba(0,0,0,0) 70%); animation-delay: -10s; }

            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0; padding: 0; overflow: visible !important; }
            .no-print { display: none !important; }
            .print-container { background: white !important; padding: 0 !important; display: flex; flex-wrap: wrap; justify-content: center; width: 100% !important; overflow: visible !important; }
            .letter-page { page-break-inside: avoid; page-break-after: always; display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; }
            .half-page { width: 100%; padding: 0.5cm 0; page-break-inside: avoid; display: flex; align-items: center; justify-content: center; }
            #root { height: auto !important; overflow: visible !important; }

</head>
<body>
    <!-- Firebase & Core Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'edubox-magicletters-v3';
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase init ignored in dev environment.");
        }

        window.EduBoxCore = {
            db, auth, appId,
            user: null,
            initAuth: async () => {
                if (!auth) return null;
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) {
                    console.error("Auth error:", e);
                }
            },
            onUserChange: (callback) => {
                if (!auth) return;
                onAuthStateChanged(auth, (user) => {
                    window.EduBoxCore.user = user;
                    callback(user);
                });
            },
            publishToMarket: async (data) => {
                if (!db || !window.EduBoxCore.user) throw new Error("Brak autoryzacji");
                const marketRef = collection(db, 'artifacts', appId, 'public', 'data', 'market');
                await addDoc(marketRef, {
                    ...data,
                    authorId: window.EduBoxCore.user.uid,
                    createdAt: serverTimestamp()
                });
            },
            fetchMarket: async () => {
                if (!db || !window.EduBoxCore.user) return [];
                const marketRef = collection(db, 'artifacts', appId, 'public', 'data', 'market');
                // Proste zapytanie pobierające wszystkie dokumenty - sortowanie w JS pamięci dla optymalizacji limitów Firestore
                const snapshot = await getDocs(marketRef);
                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort by createdAt descending in memory
                return items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
            }
        };

        // Initialize immediately
        window.EduBoxCore.initAuth();
    </script>

    <div id="root" class="h-screen flex flex-col"></div>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- CONSTANTS & CONFIG ---
        const apiKey = ""; // Dostarczany przez środowisko (Canvas)

        const FONTS = [
            { name: 'Roboto', family: "'Roboto', sans-serif" },
            { name: 'Montserrat', family: "'Montserrat', sans-serif" },
            { name: 'Oswald', family: "'Oswald', sans-serif" },
            { name: 'Pacifico', family: "'Pacifico', cursive" },
            { name: 'Amatic SC', family: "'Amatic SC', cursive" },
            { name: 'Caveat', family: "'Caveat', cursive" },
            { name: 'Dancing Script', family: "'Dancing Script', cursive" },
            { name: 'Bangers', family: "'Bangers', cursive" },
            { name: 'Comic Neue', family: "'Comic Neue', cursive" }
        ];

        const SHAPES = [
            { id: 'rectangle', name: 'Prostokąt', icon: 'ph-square', clipPath: 'none' },
            { id: 'circle', name: 'Koło', icon: 'ph-circle', clipPath: 'circle(50% at 50% 50%)' },
            { id: 'triangle', name: 'Girlanda', icon: 'ph-triangle', clipPath: 'polygon(0 0, 100% 0, 50% 100%)' },
            { id: 'flag', name: 'Flaga', icon: 'ph-bookmark', clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%)' },
            { id: 'shield', name: 'Tarcza', icon: 'ph-shield', clipPath: 'polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%)' }
        ];

        const THEMES = [
            { id: 'none', name: 'Brak (Jednolity)', style: '' },
            { id: 'rainbow', name: 'Tęcza', style: 'linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)' },
            { id: 'ocean', name: 'Ocean', style: 'linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)' },
            { id: 'sunset', name: 'Zachód', style: 'linear-gradient(to right, #fa709a 0%, #fee140 100%)' },
            { id: 'forest', name: 'Las', style: 'linear-gradient(to top, #0ba360 0%, #3cba92 100%)' },
            { id: 'galaxy', name: 'Kosmos', style: 'linear-gradient(to right, #4facfe 0%, #00f2fe 100%)' }
        ];

        // --- UTILS ---
        const fetchWithExponentialBackoff = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        // Resize image to max 512px to prevent Firestore 1MB document limits
        const resizeImageToDataURL = (base64Str, maxWidth = 512) => {
            return new Promise((resolve) => {
                if(!base64Str) return resolve(null);
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    if(img.width <= maxWidth) return resolve(base64Str); // No need to resize
                    const canvas = document.createElement('canvas');
                    const ratio = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * ratio;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = () => resolve(base64Str); // Fallback
            });
        };

        // --- MAIN APP ---
        function App() {
            // Global State
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); // 'kreator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null); // {text, type: 'error' | 'success'}

            // Creator State
            const [text, setText] = useState('V3 PRO');
            const [shape, setShape] = useState(SHAPES[2]);
            const [font, setFont] = useState(FONTS[4]);
            const [lettersPerSheet, setLettersPerSheet] = useState(1);
            const [bgColor, setBgColor] = useState('#1e293b');
            const [bgTheme, setBgTheme] = useState(THEMES[0]);
            const [bgCustomImage, setBgCustomImage] = useState(null);
            const [textColor, setTextColor] = useState('#f8fafc');
            const [textTheme, setTextTheme] = useState(THEMES[0]);
            const [textCustomImage, setTextCustomImage] = useState(null);
            const [letterScale, setLetterScale] = useState(1);
            const [letterOffsetX, setLetterOffsetX] = useState(0);
            const [letterOffsetY, setLetterOffsetY] = useState(0);

            // AI State
            const [aiPrompt, setAiPrompt] = useState("");
            const [aiTarget, setAiTarget] = useState('background');
            const [isGenerating, setIsGenerating] = useState(false);

            // Market State
            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            // Init
            useEffect(() => {
                if (window.EduBoxCore) {
                    window.EduBoxCore.onUserChange((u) => setUser(u));
                }
                const savedGens = localStorage.getItem('edubox_magicletters_ai');
                if (savedGens) setAiGenerations(parseInt(savedGens));
                
                const savedPremium = localStorage.getItem('edubox_premium');
                if (savedPremium === 'KAWA2024') setIsPremium(true);
            }, []);

            // Handlers
            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3000);
            };

            const handlePremiumCheck = () => {
                if (premiumCode.toUpperCase() === 'KAWA2024') {
                    setIsPremium(true);
                    localStorage.setItem('edubox_premium', 'KAWA2024');
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else {
                    showMessage('Nieprawidłowy kod', 'error');
                }
            };

            const handleFileUpload = (e, setter) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setter(event.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handlePrint = () => window.print();

            // AI Generation (Two-Step V3 Standard)
            const generateAIImage = async () => {
                if (!aiPrompt.trim()) return;
                
                if (!isPremium && aiGenerations >= 3) {
                    showMessage('Limit darmowych generacji wyczerpany. Wpisz kod KAWA2024.', 'error');
                    return;
                }

                setIsGenerating(true);
                try {
                    // Krok 1: Tłumaczenie PL -> EN za pomocą text model
                    const translationUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const translatePayload = {
                        contents: [{ parts: [{ text: `Przetłumacz poniższy opis tekstury/tła na angielski. Zwróć TYLKO angielskie tłumaczenie, bez znaków zapytania, bez cudzysłowów. Tekst: ${aiPrompt}` }] }],
                        systemInstruction: { parts: [{ text: "You are a direct translator. Output strictly the translation." }] }
                    };
                    
                    let engPrompt = aiPrompt;
                    try {
                        const tRes = await fetchWithExponentialBackoff(translationUrl, {
                            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(translatePayload)
                        });
                        const tData = await tRes.json();
                        if (tData.candidates?.[0]?.content?.parts?.[0]?.text) {
                            engPrompt = tData.candidates[0].content.parts[0].text.trim();
                        }
                    } catch(e) { console.warn("Translation failed, using original prompt.", e); }

                    // Krok 2: Generowanie obrazu Imagen
                    const finalPrompt = `${engPrompt}, beautiful texture, high quality seamless pattern, vivid colors, NO TEXT, NO LETTERS, NO WORDS, NO WATERMARK`;
                    const imagenUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    const imagenPayload = {
                        instances: { prompt: finalPrompt },
                        parameters: { sampleCount: 1 }
                    };

                    const imgRes = await fetchWithExponentialBackoff(imagenUrl, {
                        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(imagenPayload)
                    });
                    const imgData = await imgRes.json();
                    
                    if (imgData.predictions && imgData.predictions[0]) {
                        const base64Img = `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}`;
                        if (aiTarget === 'background') setBgCustomImage(base64Img);
                        else setTextCustomImage(base64Img);

                        if (!isPremium) {
                            const newCount = aiGenerations + 1;
                            setAiGenerations(newCount);
                            localStorage.setItem('edubox_magicletters_ai', newCount.toString());
                        }
                        showMessage('Wygenerowano pomyślnie!', 'success');
                    } else {
                         throw new Error("Brak obrazu w odpowiedzi API");
                    }
                } catch (error) {
                    console.error("Błąd AI:", error);
                    showMessage('Wystąpił błąd podczas generowania obrazu.', 'error');
                } finally {
                    setIsGenerating(false);
                }
            };

            // Market Logic
            const publishToGielda = async () => {
                if (!user) { showMessage('Musisz poczekać na połączenie z serwerem.', 'error'); return; }
                if (!text.trim()) { showMessage('Napis nie może być pusty.', 'error'); return; }

                setIsPublishing(true);
                try {
                    // Kompresja base64 przed wysłaniem do Firestore (limit 1MB/doc)
                    const safeBgImg = await resizeImageToDataURL(bgCustomImage, 512);
                    const safeTextImg = await resizeImageToDataURL(textCustomImage, 512);

                    const payload = {
                        text,
                        shapeId: shape.id,
                        fontName: font.name,
                        bgColor,
                        bgThemeId: bgTheme.id,
                        bgCustomImage: safeBgImg,
                        textColor,
                        textThemeId: textTheme.id,
                        textCustomImage: safeTextImg,
                        letterScale,
                        letterOffsetX,
                        letterOffsetY
                    };

                    await window.EduBoxCore.publishToMarket(payload);
                    showMessage('Opublikowano na Giełdzie!', 'success');
                    setAppMode('gielda');
                    loadMarket();
                } catch (error) {
                    console.error("Publish error:", error);
                    showMessage('Błąd publikacji na Giełdzie.', 'error');
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadMarket = async () => {
                setIsFetchingMarket(true);
                try {
                    const items = await window.EduBoxCore.fetchMarket();
                    setMarketItems(items);
                } catch (error) {
                    console.error("Fetch market error:", error);
                    showMessage('Błąd ładowania Giełdy.', 'error');
                } finally {
                    setIsFetchingMarket(false);
                }
            };

            const loadFromMarket = (item) => {
                setText(item.text || 'NAPIS');
                setShape(SHAPES.find(s => s.id === item.shapeId) || SHAPES[0]);
                setFont(FONTS.find(f => f.name === item.fontName) || FONTS[0]);
                setBgColor(item.bgColor || '#1e293b');
                setBgTheme(THEMES.find(t => t.id === item.bgThemeId) || THEMES[0]);
                setBgCustomImage(item.bgCustomImage || null);
                setTextColor(item.textColor || '#ffffff');
                setTextTheme(THEMES.find(t => t.id === item.textThemeId) || THEMES[0]);
                setTextCustomImage(item.textCustomImage || null);
                setLetterScale(item.letterScale || 1);
                setLetterOffsetX(item.letterOffsetX || 0);
                setLetterOffsetY(item.letterOffsetY || 0);
                setAppMode('kreator');
                showMessage('Wczytano projekt!', 'success');
            };

            useEffect(() => {
                if (appMode === 'gielda') loadMarket();
            }, [appMode]);

            const characters = text.split('');

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 overflow-hidden font-sans relative">
                    
                    {/* Auras rendering in background */}
                    <div className="aura-container no-print">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        <div className="aura-blob aura-3"></div>
                    </div>

                    {/* Global Notifications */}
                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i>
                            {message.text}
                        </div>
                    )}

                    {/* Left Sidebar (No Print) */}
                    <aside className="w-80 flex-shrink-0 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-full z-10 no-print transition-all duration-300">
                        {/* Header */}
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center shadow-lg shadow-purple-500/20">
                                <i className="ph-bold ph-magic-wand text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight text-white leading-none">MagicLetters</h1>
                                <p className="text-[10px] text-purple-400 font-bold tracking-wider uppercase mt-1">EduBox V3 PRO MAX</p>
                            </div>
                        </div>

                        {/* Navigation */}
                        <div className="px-4 py-3 flex gap-2 border-b border-slate-800">
                            <button 
                                onClick={() => setAppMode('kreator')} 
                                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}
                            >
                                <i className="ph-bold ph-paint-brush"></i> Kreator
                            </button>
                            <button 
                                onClick={() => setAppMode('gielda')} 
                                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}
                            >
                                <i className="ph-bold ph-globe"></i> Giełda
                            </button>
                        </div>

                        {/* Sidebar Content Scrollable */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            
                            {/* KREATOR MODE */}
                            {appMode === 'kreator' && (
                                <>
                                    {/* Tekst Input */}
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-text-t"></i> Wpisz napis</label>
                                        <textarea 
                                            value={text} 
                                            onChange={(e) => setText(e.target.value.toUpperCase())}
                                            className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-lg font-bold focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all resize-none text-center"
                                            rows="2" placeholder="TWÓJ NAPIS"
                                        />
                                    </div>

                                    {/* Kształt */}
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-shapes"></i> Kształt</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {SHAPES.map(s => (
                                                <button 
                                                    key={s.id} 
                                                    onClick={() => setShape(s)} 
                                                    className={`p-2 rounded-xl flex flex-col items-center gap-1 transition-all border ${shape.id === s.id ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800 border-transparent text-slate-400 hover:bg-slate-700 hover:text-white'}`}
                                                >
                                                    <i className={`text-xl ${s.icon} ${shape.id === s.id ? 'ph-fill' : 'ph-bold'}`}></i>
                                                    <span className="text-[9px] font-bold uppercase">{s.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* AI Studio */}
                                    <div className="bg-slate-900 border border-purple-500/30 rounded-2xl p-4 space-y-3 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-purple-500/10 blur-xl rounded-full"></div>
                                        <div className="flex justify-between items-center relative z-10">
                                            <label className="text-[10px] font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2"><i className="ph-fill ph-sparkle text-purple-500"></i> AI Studio</label>
                                            <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${isPremium ? 'bg-green-500/20 text-green-400' : 'bg-slate-800 text-slate-300'}`}>
                                                {isPremium ? 'Bez limitu' : `${3 - aiGenerations} darmowe`}
                                            </span>
                                        </div>
                                        
                                        <div className="flex gap-2 relative z-10">
                                            <button onClick={() => setAiTarget('background')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition-colors ${aiTarget === 'background' ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>Tło</button>
                                            <button onClick={() => setAiTarget('text')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition-colors ${aiTarget === 'text' ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>Litery</button>
                                        </div>

                                        <div className="flex gap-2 relative z-10">
                                            <input 
                                                type="text" value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} 
                                                placeholder="Np. gwiaździste niebo..." 
                                                className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-purple-500" 
                                            />
                                            <button 
                                                onClick={generateAIImage} disabled={isGenerating} 
                                                className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 disabled:opacity-50 text-white p-2 rounded-lg transition-all shadow-lg shadow-purple-500/20 flex items-center justify-center w-10 shrink-0"
                                            >
                                                {isGenerating ? <i className="ph-bold ph-spinner animate-spin"></i> : <i className="ph-bold ph-magic-wand"></i>}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Typography & Position */}
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-text-aa"></i> Typografia</label>
                                        <select 
                                            value={font.name} onChange={(e) => setFont(FONTS.find(f => f.name === e.target.value))} 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-purple-500 transition-all appearance-none cursor-pointer"
                                            style={{ fontFamily: font.family }}
                                        >
                                            {FONTS.map(f => <option key={f.name} value={f.name} style={{ fontFamily: f.family }}>{f.name}</option>)}
                                        </select>
                                        
                                        <div className="grid grid-cols-2 gap-3 bg-slate-900 p-3 rounded-xl border border-slate-800">
                                            <div className="space-y-1">
                                                <div className="flex justify-between items-center text-[9px] text-slate-400 font-bold uppercase"><i className="ph-bold ph-arrows-out"></i> Skala</div>
                                                <input type="range" min="0.3" max="2" step="0.1" value={letterScale} onChange={(e) => setLetterScale(parseFloat(e.target.value))} className="w-full accent-purple-500" />
                                            </div>
                                            <div className="space-y-1">
                                                <div className="flex justify-between items-center text-[9px] text-slate-400 font-bold uppercase"><i className="ph-bold ph-arrows-out-line-vertical"></i> Pion</div>
                                                <input type="range" min="-100" max="100" step="5" value={letterOffsetY} onChange={(e) => setLetterOffsetY(parseInt(e.target.value))} className="w-full accent-purple-500" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Wygląd Tła */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-palette"></i> Tło Kształtu</span>
                                            <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0" />
                                        </label>
                                        
                                        <select value={bgTheme.id} onChange={(e) => setBgTheme(THEMES.find(t => t.id === e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                                            {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                        
                                        <label className="flex items-center justify-center gap-2 w-full p-3 border border-dashed border-slate-700 rounded-lg cursor-pointer hover:border-purple-500 hover:bg-slate-800/50 transition-all text-slate-400 hover:text-white">
                                            <i className="ph-bold ph-upload-simple"></i> <span className="text-[10px] font-bold uppercase">Wgraj z dysku</span>
                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setBgCustomImage)} />
                                        </label>
                                        {bgCustomImage && (
                                            <button onClick={() => setBgCustomImage(null)} className="text-[9px] text-red-400 font-bold uppercase w-full hover:underline flex justify-center items-center gap-1">
                                                <i className="ph-bold ph-trash"></i> Usuń własne tło
                                            </button>
                                        )}
                                    </div>

                                    {/* Wygląd Liter */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                                            <span className="flex items-center gap-2"><i className="ph-bold ph-text-aa"></i> Kolor Litery</span>
                                            <input type="color" value={textColor} onChange={(e) => setTextColor(e.target.value)} className="w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0" />
                                        </label>
                                        
                                        <select value={textTheme.id} onChange={(e) => setTextTheme(THEMES.find(t => t.id === e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                                            {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                        
                                        <label className="flex items-center justify-center gap-2 w-full p-3 border border-dashed border-slate-700 rounded-lg cursor-pointer hover:border-purple-500 hover:bg-slate-800/50 transition-all text-slate-400 hover:text-white">
                                            <i className="ph-bold ph-upload-simple"></i> <span className="text-[10px] font-bold uppercase">Wgraj wzór na litery</span>
                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setTextCustomImage)} />
                                        </label>
                                        {textCustomImage && (
                                            <button onClick={() => setTextCustomImage(null)} className="text-[9px] text-red-400 font-bold uppercase w-full hover:underline flex justify-center items-center gap-1">
                                                <i className="ph-bold ph-trash"></i> Usuń wzór liter
                                            </button>
                                        )}
                                    </div>
                                    
                                    {/* Opcje Druku & Publish */}
                                    <div className="pt-2 pb-6 space-y-3">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-printer"></i> Ustawienia Druku</label>
                                        <div className="flex gap-2">
                                            <button onClick={() => setLettersPerSheet(1)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all border ${lettersPerSheet === 1 ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-800 border-transparent text-slate-400 hover:bg-slate-700'}`}>1 na A4</button>
                                            <button onClick={() => setLettersPerSheet(2)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all border ${lettersPerSheet === 2 ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-800 border-transparent text-slate-400 hover:bg-slate-700'}`}>2 na A4</button>
                                        </div>
                                        
                                        <button 
                                            onClick={handlePrint}
                                            className="w-full bg-slate-100 text-slate-900 hover:bg-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                                        >
                                            <i className="ph-bold ph-printer text-lg"></i> Drukuj Projekt
                                        </button>
                                        <button 
                                            onClick={publishToGielda} disabled={isPublishing}
                                            className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-2"
                                        >
                                            {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-lg"></i> : <i className="ph-bold ph-share-network text-lg"></i>} 
                                            Opublikuj na Giełdzie
                                        </button>
                                    </div>
                                </>
                            )}

                            {/* GIEŁDA MODE */}
                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-4 text-center">
                                        <i className="ph-fill ph-users text-3xl text-blue-400 mb-2"></i>
                                        <h3 className="text-sm font-bold text-white mb-1">Giełda Projektów</h3>
                                        <p className="text-[10px] text-slate-400">Pobieraj i edytuj napisy stworzone przez innych nauczycieli.</p>
                                    </div>

                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-500"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak projektów. Opublikuj pierwszy!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-slate-800 rounded-xl p-3 border border-slate-700 hover:border-blue-500 transition-colors group">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs font-black text-white truncate pr-2">{item.text.length > 10 ? item.text.substring(0,10)+'...' : item.text}</span>
                                                        <span className="text-[9px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full whitespace-nowrap">{item.fontName}</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <div className="w-8 h-8 rounded bg-slate-900 flex items-center justify-center border border-slate-700 text-slate-500" style={{ backgroundColor: item.bgColor, backgroundImage: item.bgCustomImage ? `url(${item.bgCustomImage})` : 'none', backgroundSize: 'cover' }}>
                                                            <i className={`ph-bold ${SHAPES.find(s=>s.id === item.shapeId)?.icon || 'ph-square'}`}></i>
                                                        </div>
                                                        <button 
                                                            onClick={() => loadFromMarket(item)}
                                                            className="flex-1 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white rounded text-[10px] font-bold transition-all"
                                                        >
                                                            Użyj tego
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* Premium Footer */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            {!isPremium ? (
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-red-400 bg-red-400/10 px-2 py-0.5 rounded-full">Brak</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)}
                                            placeholder="Kod Premium" 
                                            className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-purple-500 uppercase"
                                        />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-500/30 p-3 rounded-xl">
                                    <i className="ph-fill ph-crown text-2xl text-purple-400"></i>
                                    <div>
                                        <p className="text-xs font-bold text-white">Wersja PRO MAX</p>
                                        <p className="text-[9px] text-purple-300">Wszystkie limity odblokowane</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </aside>

                    {/* Main Workspace (Preview Area) */}
                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden">
                        
                        {/* Live Preview Wrapper */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 print-container relative">
                            <div className="no-print max-w-5xl mx-auto mb-8 bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
                                <div className="flex items-center gap-3 text-slate-300">
                                    <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"><i className="ph-bold ph-eye text-lg"></i></div>
                                    <span className="text-sm font-bold tracking-wide">Podgląd na żywo</span>
                                </div>
                                <span className="text-xs font-medium text-slate-500 flex items-center gap-1">
                                    <i className="ph-fill ph-info"></i> Wygląd w druku może się nieznacznie różnić.
                                </span>
                            </div>

                            {/* Rendered Letters Area */}
                            <div className="max-w-6xl mx-auto flex flex-wrap justify-center gap-6 md:gap-10 no-print pb-32">
                                {characters.map((char, index) => {
                                    if (char === ' ') return <div key={`space-${index}`} className="w-16 md:w-32 h-auto" />;
                                    
                                    let backgroundStyle = { backgroundColor: bgColor };
                                    if (bgCustomImage) backgroundStyle = { backgroundImage: `url(${bgCustomImage})`, backgroundSize: 'cover', backgroundPosition: 'center' };
                                    else if (bgTheme.id !== 'none') backgroundStyle = { background: bgTheme.style };

                                    let textStyle = { color: textColor, fontFamily: font.family, transform: `scale(${letterScale}) translate(${letterOffsetX}px, ${letterOffsetY}px)` };
                                    if (textCustomImage || textTheme.id !== 'none') {
                                        textStyle = {
                                            ...textStyle,
                                            backgroundImage: textCustomImage ? `url(${textCustomImage})` : textTheme.style,
                                            backgroundSize: 'cover', backgroundPosition: 'center',
                                            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
                                            backgroundClip: 'text', color: 'transparent'
                                        };
                                    }

                                    return (
                                        <div 
                                            key={index} 
                                            className="flex items-center justify-center w-48 h-64 md:w-64 md:h-80 lg:w-80 lg:h-[400px] relative transition-transform duration-300 hover:scale-[1.02] hover:-translate-y-2 group" 
                                            style={{...backgroundStyle, clipPath: shape.clipPath}}
                                        >
                                            <span className="text-[120px] md:text-[180px] lg:text-[220px] font-bold leading-none select-none z-10 transition-all drop-shadow-2xl" style={textStyle}>{char}</span>
                                            <div className="absolute inset-0 border-[10px] border-black/10 pointer-events-none group-hover:border-white/20 transition-colors" style={{ clipPath: shape.clipPath }}></div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Wersja do DRUKU A4 (Ukryta na ekranie) */}
                            <div className="hidden print:block w-full z-50 bg-white">
                                {characters.map((char, index) => {
                                    if (char === ' ') return null;
                                    let backgroundStyle = { backgroundColor: bgColor };
                                    if (bgCustomImage) backgroundStyle = { backgroundImage: `url(${bgCustomImage})`, backgroundSize: 'cover', backgroundPosition: 'center' };
                                    else if (bgTheme.id !== 'none') backgroundStyle = { background: bgTheme.style };

                                    let textStyle = { color: textColor, fontFamily: font.family, transform: `scale(${letterScale}) translate(${letterOffsetX}px, ${letterOffsetY}px)` };
                                    if (textCustomImage || textTheme.id !== 'none') {
                                        textStyle = { ...textStyle, backgroundImage: textCustomImage ? `url(${textCustomImage})` : textTheme.style, backgroundSize: 'cover', backgroundPosition: 'center', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', color: 'transparent' };
                                    }

                                    return (
                                        <div key={`print-${index}`} className={lettersPerSheet === 1 ? 'letter-page' : 'half-page'}>
                                            <div className="relative flex items-center justify-center overflow-hidden" style={{ ...backgroundStyle, clipPath: shape.clipPath, width: lettersPerSheet === 1 ? '18cm' : '12cm', height: lettersPerSheet === 1 ? '25cm' : '13cm', margin: lettersPerSheet === 2 ? '0 auto' : '0' }}>
                                                <span className="font-bold leading-none" style={{ ...textStyle, fontSize: lettersPerSheet === 1 ? '400px' : '200px' }}>{char}</span>
                                                <div className="absolute inset-0 border-[8px] border-black border-opacity-10 pointer-events-none" style={{ clipPath: shape.clipPath }}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
