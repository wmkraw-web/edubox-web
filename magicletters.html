<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBoxPro MagicLetters - Generator Napisów z AI</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .print-container { background: white !important; padding: 0 !important; display: flex; flex-wrap: wrap; justify-content: center; }
            .letter-page { page-break-inside: avoid; page-break-after: always; display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; }
            .half-page { width: 100%; height: 48vh; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- BAZA IKON SVG ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z" />,
                Type: <path d="M4 7V4h16v3M9 20h6M12 4v16" />,
                Image: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>,
                Palette: <><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.688-1.688h1.906c3.11 0 5.625-2.515 5.625-5.625 0-4.75-4.477-8.75-10-8.75z"/></>,
                Triangle: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>,
                Circle: <circle cx="12" cy="12" r="10"/>,
                Square: <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>,
                Bookmark: <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>,
                Upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
                Settings2: <path d="M20 7h-9m4 10H6m5-14v4m6 6v4M5 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm14 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>,
                FileDown: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></>,
                Sun: <><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>,
                Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
                Wand2: <path d="M21.64 3.64l-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.21 1.21 0 0 0 1.72 0L21.64 5.36a1.21 1.21 0 0 0 0-1.72zM14 7l3 3M5 6v1M19 2v1M10 2v2M7 10H6M22 9h-2M15 2h1"/>,
                Coffee: <><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></>,
                Move: <><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="19 9 22 12 19 15"/><polyline points="9 19 12 22 15 19"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></>,
                Maximize: <><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></>,
                Sparkles: <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        // --- STAŁE I DANE ---
        const FONTS = [
            { name: 'Roboto', family: "'Roboto', sans-serif" },
            { name: 'Montserrat', family: "'Montserrat', sans-serif" },
            { name: 'Oswald', family: "'Oswald', sans-serif" },
            { name: 'Pacifico', family: "'Pacifico', cursive" },
            { name: 'Amatic SC', family: "'Amatic SC', cursive" },
            { name: 'Caveat', family: "'Caveat', cursive" },
            { name: 'Dancing Script', family: "'Dancing Script', cursive" },
            { name: 'Bangers', family: "'Bangers', cursive" },
            { name: 'Comic Neue', family: "'Comic Neue', cursive" }
        ];

        const SHAPES = [
            { id: 'rectangle', name: 'Prostokąt', icon: 'Square', clipPath: 'none' },
            { id: 'circle', name: 'Koło', icon: 'Circle', clipPath: 'circle(50% at 50% 50%)' },
            { id: 'triangle', name: 'Girlanda', icon: 'Triangle', clipPath: 'polygon(0 0, 100% 0, 50% 100%)' },
            { id: 'flag', name: 'Flaga', icon: 'Bookmark', clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%)' },
            { id: 'shield', name: 'Tarcza', icon: 'Bookmark', clipPath: 'polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%)' }
        ];

        const THEMES = [
            { id: 'none', name: 'Brak (Jednolity)', style: '' },
            { id: 'rainbow', name: 'Tęcza', style: 'linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)' },
            { id: 'ocean', name: 'Ocean', style: 'linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)' },
            { id: 'sunset', name: 'Zachód', style: 'linear-gradient(to right, #fa709a 0%, #fee140 100%)' },
            { id: 'forest', name: 'Las', style: 'linear-gradient(to top, #0ba360 0%, #3cba92 100%)' },
            { id: 'galaxy', name: 'Kosmos', style: 'linear-gradient(to right, #4facfe 0%, #00f2fe 100%)' }
        ];

        // --- GŁÓWNA APLIKACJA ---
        function App() {
            // Podstawowe stany
            const [text, setText] = useState('DZIEŃ ZIEMI');
            const [shape, setShape] = useState(SHAPES[3]);
            const [font, setFont] = useState(FONTS[4]);
            const [lettersPerSheet, setLettersPerSheet] = useState(1);
            
            // Tryb ciemny i AI
            const [darkMode, setDarkMode] = useState(true);
            const [aiGenerations, setAiGenerations] = useState(0);
            const [showPaywall, setShowPaywall] = useState(false);
            
            // Tło
            const [bgColor, setBgColor] = useState('#1e293b');
            const [bgTheme, setBgTheme] = useState(THEMES[0]);
            const [bgCustomImage, setBgCustomImage] = useState(null);

            // Tekst
            const [textColor, setTextColor] = useState('#f8fafc');
            const [textTheme, setTextTheme] = useState(THEMES[0]);
            const [textCustomImage, setTextCustomImage] = useState(null);

            // Kontrola pozycji
            const [letterScale, setLetterScale] = useState(1);
            const [letterOffsetX, setLetterOffsetX] = useState(0);
            const [letterOffsetY, setLetterOffsetY] = useState(0);

            // AI Stany
            const [aiPrompt, setAiPrompt] = useState("");
            const [aiTarget, setAiTarget] = useState('background');
            const [isGenerating, setIsGenerating] = useState(false);

            // Wczytywanie czcionek Google i limitu AI
            useEffect(() => {
                const link = document.createElement('link');
                link.href = 'https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bangers&family=Caveat:wght@700&family=Comic+Neue:wght@700&family=Dancing+Script:wght@700&family=Montserrat:wght@700&family=Oswald:wght@700&family=Pacifico&family=Roboto:wght@700&display=swap';
                link.rel = 'stylesheet';
                document.head.appendChild(link);
                
                const savedGenerations = localStorage.getItem('magiccolor_ai_count');
                if (savedGenerations) setAiGenerations(parseInt(savedGenerations));

                return () => document.head.removeChild(link);
            }, []);

            const handleFileUpload = (e, setter) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setter(event.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handlePrint = () => window.print();

            // Generator AI (Pollinations - darmowe)
            const generateAIImage = async () => {
                if (!aiPrompt.trim()) return;
                
                if (aiGenerations >= 2) {
                    setShowPaywall(true);
                    return;
                }

                setIsGenerating(true);
                try {
                    const seed = Math.floor(Math.random() * 1000000);
                    const encodedPrompt = encodeURIComponent(`high quality, beautiful texture, pattern, ${aiPrompt}`);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=1024&height=1024&nologo=true`;
                    
                    const img = new Image();
                    img.src = imageUrl;
                    img.onload = () => {
                        if (aiTarget === 'background') setBgCustomImage(imageUrl);
                        else setTextCustomImage(imageUrl);
                        
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        localStorage.setItem('magiccolor_ai_count', newCount);
                        setIsGenerating(false);
                    };
                    img.onerror = () => setIsGenerating(false);
                } catch (error) {
                    console.error("Błąd AI:", error);
                    setIsGenerating(false);
                }
            };

            const characters = text.split('');
            const themeClass = darkMode ? 'bg-slate-900 text-slate-200' : 'bg-gray-50 text-gray-800';
            const panelClass = darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200';
            const inputClass = darkMode ? 'bg-slate-700 border-slate-600 text-white' : 'bg-gray-50 border-gray-200 text-gray-800';

            return (
                <div className={`min-h-screen flex flex-col font-sans transition-colors duration-300 ${themeClass}`}>
                    
                    {/* Header */}
                    <header className={`shadow-sm border-b p-4 flex justify-between items-center no-print sticky top-0 z-30 ${panelClass}`}>
                        <div className="flex items-center gap-3">
                            <a href="index.html" className="text-slate-400 hover:text-blue-500 mr-2 flex items-center gap-1 font-bold text-sm">
                                <Icon name="Move" className="w-4 h-4 rotate-180" /> Powrót
                            </a>
                            <div className="bg-purple-600 p-2 rounded-lg"><Icon name="Wand2" className="text-white w-6 h-6" /></div>
                            <h1 className="text-xl md:text-2xl font-bold">MagicLetters <span className={`text-sm font-normal px-2 py-1 rounded-full ${darkMode ? 'bg-slate-700 text-slate-300' : 'bg-gray-100 text-gray-500'}`}>Wersja PRO</span></h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-full ${darkMode ? 'hover:bg-slate-700 text-yellow-400' : 'hover:bg-gray-100 text-slate-600'}`}>
                                <Icon name={darkMode ? "Sun" : "Moon"} className="w-6 h-6" />
                            </button>
                            <button onClick={handlePrint} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-semibold flex items-center gap-2 shadow-md hover:shadow-lg transition-all">
                                <Icon name="Printer" className="w-5 h-5" /> Drukuj
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                        
                        {/* Sidebar */}
                        <aside className={`w-full md:w-96 border-r overflow-y-auto no-print z-10 custom-scrollbar h-[calc(100vh-73px)] ${panelClass}`}>
                            <div className="p-6 space-y-8">
                                
                                {/* Tekst */}
                                <div className="space-y-3">
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-blue-500"><Icon name="Type" className="w-4 h-4" /> Napis</label>
                                    <textarea 
                                        value={text} onChange={(e) => setText(e.target.value.toUpperCase())}
                                        className={`w-full p-4 border-2 rounded-xl focus:border-blue-500 focus:ring-0 text-xl font-bold text-center resize-none ${inputClass}`}
                                        rows="2" placeholder="Wpisz napis..."
                                    />
                                </div>

                                {/* Kształt */}
                                <div className="space-y-3">
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-purple-500"><Icon name="Triangle" className="w-4 h-4" /> Kształt</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {SHAPES.map(s => (
                                            <button key={s.id} onClick={() => setShape(s)} className={`p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${shape.id === s.id ? 'border-purple-500 bg-purple-500/10 text-purple-500' : `border-transparent ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}`}>
                                                <Icon name={s.icon} className="w-5 h-5" />
                                                <span className="text-[10px] font-semibold">{s.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* AI Studio */}
                                <div className={`space-y-4 p-5 rounded-2xl border ${darkMode ? 'bg-slate-900 border-purple-500/30' : 'bg-purple-50 border-purple-100'}`}>
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center justify-between text-purple-500">
                                        <span className="flex items-center gap-2"><Icon name="Sparkles" className="w-4 h-4" /> AI Studio (Twórz Grafiki)</span>
                                        <span className="bg-purple-600 text-white px-2 py-0.5 rounded-full text-[10px]">{2 - aiGenerations} darmowe</span>
                                    </label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setAiTarget('background')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${aiTarget === 'background' ? 'bg-purple-500 text-white border-purple-500' : `border-purple-500/30 ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}`}>Na Tło</button>
                                        <button onClick={() => setAiTarget('text')} className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${aiTarget === 'text' ? 'bg-purple-500 text-white border-purple-500' : `border-purple-500/30 ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}`}>Na Litery</button>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={aiPrompt} onChange={(e) => setAiPrompt(e.target.value)} placeholder="Np. złote gwiazdki na niebie..." className={`flex-1 p-2 border rounded-lg text-sm ${inputClass}`} />
                                        <button onClick={generateAIImage} disabled={isGenerating} className="bg-purple-600 hover:bg-purple-500 disabled:bg-purple-800 text-white p-2 rounded-lg transition-colors">
                                            {isGenerating ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <Icon name="Wand2" className="w-5 h-5" />}
                                        </button>
                                    </div>
                                </div>

                                {/* Czcionka & Pozycja */}
                                <div className="space-y-4">
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-green-500"><Icon name="Settings2" className="w-4 h-4" /> Czcionka & Pozycja</label>
                                    <select value={font.name} onChange={(e) => setFont(FONTS.find(f => f.name === e.target.value))} className={`w-full p-3 border-2 rounded-xl text-lg ${inputClass}`} style={{ fontFamily: font.family }}>
                                        {FONTS.map(f => <option key={f.name} value={f.name} style={{ fontFamily: f.family }}>{f.name}</option>)}
                                    </select>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <span className="text-[10px] font-bold text-slate-400">Wielkość Litery</span>
                                            <input type="range" min="0.3" max="2" step="0.1" value={letterScale} onChange={(e) => setLetterScale(parseFloat(e.target.value))} className="w-full accent-green-500" />
                                        </div>
                                        <div className="space-y-1">
                                            <span className="text-[10px] font-bold text-slate-400">Pionowo (Y)</span>
                                            <input type="range" min="-100" max="100" step="5" value={letterOffsetY} onChange={(e) => setLetterOffsetY(parseInt(e.target.value))} className="w-full accent-green-500" />
                                        </div>
                                    </div>
                                </div>

                                {/* Tło ręczne */}
                                <div className={`space-y-4 p-4 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-gray-50 border-gray-100'}`}>
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center justify-between text-pink-500">
                                        <div className="flex items-center gap-2"><Icon name="Palette" className="w-4 h-4" /> Wygląd Tła</div>
                                        <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-8 h-8 rounded cursor-pointer border-0 p-0" />
                                    </label>
                                    <select value={bgTheme.id} onChange={(e) => setBgTheme(THEMES.find(t => t.id === e.target.value))} className={`w-full p-2 border rounded-lg text-sm ${inputClass}`}>
                                        {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <label className={`flex items-center justify-center gap-2 w-full p-2 border-2 border-dashed rounded-lg cursor-pointer transition-colors ${darkMode ? 'border-slate-600 hover:border-pink-500 hover:bg-slate-800' : 'border-gray-300 hover:border-pink-400 hover:bg-white'}`}>
                                        <Icon name="Upload" className="w-4 h-4 text-gray-400" />
                                        <span className="text-xs">Wgraj zdjęcie (JPG/PNG)</span>
                                        <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setBgCustomImage)} />
                                    </label>
                                    {bgCustomImage && <button onClick={() => setBgCustomImage(null)} className="text-[10px] text-red-400 w-full text-center hover:underline uppercase font-bold mt-1">Usuń własne tło</button>}
                                </div>

                                {/* Tekst ręczny */}
                                <div className={`space-y-4 p-4 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-gray-50 border-gray-100'}`}>
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center justify-between text-orange-500">
                                        <div className="flex items-center gap-2"><Icon name="Type" className="w-4 h-4" /> Kolor Tekstu</div>
                                        <input type="color" value={textColor} onChange={(e) => setTextColor(e.target.value)} className="w-8 h-8 rounded cursor-pointer border-0 p-0" />
                                    </label>
                                    <select value={textTheme.id} onChange={(e) => setTextTheme(THEMES.find(t => t.id === e.target.value))} className={`w-full p-2 border rounded-lg text-sm ${inputClass}`}>
                                        {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <label className={`flex items-center justify-center gap-2 w-full p-2 border-2 border-dashed rounded-lg cursor-pointer transition-colors ${darkMode ? 'border-slate-600 hover:border-orange-500 hover:bg-slate-800' : 'border-gray-300 hover:border-orange-400 hover:bg-white'}`}>
                                        <Icon name="Upload" className="w-4 h-4 text-gray-400" />
                                        <span className="text-xs">Wgraj wzór na litery</span>
                                        <input type="file" className="hidden" accept="image/*" onChange={(e) => handleFileUpload(e, setTextCustomImage)} />
                                    </label>
                                    {textCustomImage && <button onClick={() => setTextCustomImage(null)} className="text-[10px] text-red-400 w-full text-center hover:underline uppercase font-bold mt-1">Usuń wzór liter</button>}
                                </div>

                                {/* Opcje Druku */}
                                <div className="space-y-3 pb-8">
                                    <label className="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-indigo-500"><Icon name="FileDown" className="w-4 h-4" /> Układ na A4</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setLettersPerSheet(1)} className={`flex-1 py-2 rounded-lg border-2 font-bold text-xs ${lettersPerSheet === 1 ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500' : `border-transparent ${darkMode ? 'bg-slate-700' : 'bg-gray-100'}`}`}>1 Litera (Max)</button>
                                        <button onClick={() => setLettersPerSheet(2)} className={`flex-1 py-2 rounded-lg border-2 font-bold text-xs ${lettersPerSheet === 2 ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500' : `border-transparent ${darkMode ? 'bg-slate-700' : 'bg-gray-100'}`}`}>2 Litery</button>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* Live Preview Area */}
                        <main className={`flex-1 overflow-y-auto p-4 md:p-8 print-container relative ${darkMode ? 'bg-[#0f172a]' : 'bg-gray-200'}`}>
                            <div className="no-print mb-6 max-w-5xl mx-auto flex justify-between items-center bg-blue-500/10 border border-blue-500/20 text-blue-500 px-4 py-2 rounded-xl">
                                <span className="text-xs font-bold uppercase flex items-center gap-2"><Icon name="Image" className="w-4 h-4" /> Podgląd na żywo</span>
                                <span className="text-xs opacity-70">Kolory na ekranie mogą się lekko różnić przy druku.</span>
                            </div>

                            <div className="max-w-5xl mx-auto flex flex-wrap justify-center gap-4 md:gap-8 no-print pb-20">
                                {characters.map((char, index) => {
                                    if (char === ' ') return <div key={`space-${index}`} className="w-16 md:w-32 h-auto" />;
                                    
                                    let backgroundStyle = { backgroundColor: bgColor };
                                    if (bgCustomImage) backgroundStyle = { backgroundImage: `url(${bgCustomImage})`, backgroundSize: 'cover', backgroundPosition: 'center' };
                                    else if (bgTheme.id !== 'none') backgroundStyle = { background: bgTheme.style };

                                    let textStyle = { color: textColor, fontFamily: font.family, transform: `scale(${letterScale}) translate(${letterOffsetX}px, ${letterOffsetY}px)` };
                                    if (textCustomImage || textTheme.id !== 'none') {
                                        textStyle = {
                                            ...textStyle,
                                            backgroundImage: textCustomImage ? `url(${textCustomImage})` : textTheme.style,
                                            backgroundSize: 'cover', backgroundPosition: 'center',
                                            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
                                            backgroundClip: 'text', color: 'transparent'
                                        };
                                    }

                                    return (
                                        <div key={index} className="flex items-center justify-center w-48 h-64 md:w-64 md:h-80 lg:w-80 lg:h-[400px] shadow-2xl relative overflow-hidden transition-all duration-300 hover:scale-105" style={{...backgroundStyle, clipPath: shape.clipPath}}>
                                            <span className="text-[120px] md:text-[180px] lg:text-[220px] font-bold leading-none select-none z-10 transition-transform" style={textStyle}>{char}</span>
                                            <div className="absolute inset-0 border-[8px] border-black border-opacity-5 pointer-events-none" style={{ clipPath: shape.clipPath }}></div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Wersja do DRUKU A4 (Ukryta na ekranie) */}
                            <div className="hidden print:block w-full">
                                {characters.map((char, index) => {
                                    if (char === ' ') return null;
                                    let backgroundStyle = { backgroundColor: bgColor };
                                    if (bgCustomImage) backgroundStyle = { backgroundImage: `url(${bgCustomImage})`, backgroundSize: 'cover', backgroundPosition: 'center' };
                                    else if (bgTheme.id !== 'none') backgroundStyle = { background: bgTheme.style };

                                    let textStyle = { color: textColor, fontFamily: font.family, transform: `scale(${letterScale}) translate(${letterOffsetX}px, ${letterOffsetY}px)` };
                                    if (textCustomImage || textTheme.id !== 'none') {
                                        textStyle = { ...textStyle, backgroundImage: textCustomImage ? `url(${textCustomImage})` : textTheme.style, backgroundSize: 'cover', backgroundPosition: 'center', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', color: 'transparent' };
                                    }

                                    return (
                                        <div key={`print-${index}`} className={lettersPerSheet === 1 ? 'letter-page' : 'half-page flex items-center justify-center'}>
                                            <div className="relative flex items-center justify-center overflow-hidden" style={{ ...backgroundStyle, clipPath: shape.clipPath, width: lettersPerSheet === 1 ? '18cm' : '15cm', height: lettersPerSheet === 1 ? '25cm' : '20cm', margin: lettersPerSheet === 2 ? '1cm auto' : '0' }}>
                                                <span className="font-bold leading-none" style={{ ...textStyle, fontSize: lettersPerSheet === 1 ? '400px' : '300px' }}>{char}</span>
                                                <div className="absolute inset-0 border-[8px] border-black border-opacity-10 pointer-events-none" style={{ clipPath: shape.clipPath }}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </main>

                        {/* Paywall Modal */}
                        {showPaywall && (
                            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center relative overflow-hidden">
                                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-blue-500/20 blur-3xl rounded-full"></div>
                                    <Icon name="Coffee" className="w-16 h-16 text-blue-400 mx-auto mb-4 relative z-10" />
                                    <h2 className="text-2xl font-black text-white mb-2 relative z-10">Koniec darmowych generacji AI</h2>
                                    <p className="text-slate-400 mb-8 relative z-10">Wykorzystałeś darmowe użycia sztucznej inteligencji. Jeśli podoba Ci się to narzędzie i ułatwia Ci pracę, postaw mi wirtualną kawę, aby odblokować bez limitu!</p>
                                    <div className="flex flex-col gap-3 relative z-10">
                                        <a href="https://buycoffee.to/magiccolor" target="_blank" className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl flex justify-center items-center gap-2 transition-all shadow-lg">
                                            Postaw Kawę ☕
                                        </a>
                                        <button onClick={() => setShowPaywall(false)} className="text-slate-400 hover:text-white text-sm py-2">
                                            Wróć do darmowych funkcji
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
