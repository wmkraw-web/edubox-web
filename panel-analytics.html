<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel statystyk społecznościowych — EduBox AI</title>
    <meta name="description" content="Prywatny panel statystyk własnych kont EduBox AI w mediach społecznościowych.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: #020617; }
        .glass { background: rgba(15, 23, 42, .78); border: 1px solid rgba(148, 163, 184, .16); box-shadow: 0 20px 55px rgba(2, 6, 23, .32); }
        .pin-card { transition: transform .18s ease, border-color .18s ease; }
        .pin-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-44 -left-24 h-96 w-96 rounded-full bg-rose-600/20 blur-3xl"></div>
        <div class="absolute top-1/3 -right-36 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
    </div>

    <main class="relative max-w-6xl mx-auto px-5 py-8 md:py-12">
        <header class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
            <div>
                <a href="/" class="inline-flex items-center gap-2 text-cyan-300 hover:text-cyan-200 text-sm font-bold mb-5"><i class="ph-bold ph-arrow-left"></i> EduBox AI</a>
                <p class="text-xs uppercase tracking-[.28em] text-rose-300 font-black mb-3">Prywatne centrum kontroli</p>
                <h1 class="text-4xl md:text-6xl font-black tracking-tight">Statystyki <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-cyan-300">społecznościowe</span></h1>
                <p class="mt-4 text-slate-400 max-w-2xl leading-relaxed">Realne dane z Twoich kont (na razie Pinterest) - żeby wiedzieć, co faktycznie działa, zamiast zgadywać po liczbie wyświetleń na platformie.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="logout-button" class="hidden inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl font-bold transition-colors">
                    <i class="ph-bold ph-sign-out"></i><span>Wyloguj</span>
                </button>
                <button id="refresh-button" class="hidden inline-flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 disabled:cursor-wait px-5 py-3 rounded-xl font-black transition-colors">
                    <i class="ph-bold ph-arrows-clockwise"></i><span>Odśwież dane</span>
                </button>
            </div>
        </header>

        <div id="platform-tabs" class="hidden flex gap-2 mb-6">
            <button data-platform="pinterest" class="platform-tab bg-white text-slate-950 px-4 py-2 rounded-full text-sm font-black inline-flex items-center gap-2"><i class="ph-fill ph-pinterest-logo"></i>Pinterest</button>
            <button data-platform="youtube" class="platform-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold inline-flex items-center gap-2"><i class="ph-fill ph-youtube-logo"></i>YouTube</button>
            <button data-platform="facebook" class="platform-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold inline-flex items-center gap-2"><i class="ph-fill ph-facebook-logo"></i>Facebook</button>
        </div>

        <section id="message" class="glass rounded-2xl p-5 mb-6" aria-live="polite"></section>

        <section id="account-summary" class="hidden grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"></section>

        <section id="analytics-note" class="hidden mb-6"></section>

        <section id="ai-analysis-trigger" class="hidden mb-6">
            <button id="ai-analyze-button" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-cyan-500 hover:opacity-90 text-white font-black px-5 py-3 rounded-xl transition-opacity">
                <i class="ph-bold ph-sparkle"></i><span id="ai-analyze-label">Analizuj z AI</span>
            </button>
        </section>
        <section id="ai-analysis-result" class="hidden glass rounded-2xl p-6 mb-8"></section>

        <h2 id="pins-heading" class="hidden text-sm font-black uppercase tracking-widest text-slate-400 mb-3">Ostatnie piny</h2>
        <section id="pins-list" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
    </main>

    <div id="item-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 relative">
            <button id="item-modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl leading-none">✕</button>
            <div id="item-modal-content"></div>
        </div>
    </div>

    <script>
        const state = { authHeader: null, platform: 'pinterest' };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
        }

        function formatDate(value) {
            if (!value) return 'brak danych';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'brak danych';
            return date.toLocaleDateString('pl-PL', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function createBasicHeader(user, pass) {
            const bytes = new TextEncoder().encode(`${user}:${pass}`);
            let binary = '';
            bytes.forEach(byte => { binary += String.fromCharCode(byte); });
            return `Basic ${btoa(binary)}`;
        }

        function renderLogin(errorMessage = '') {
            state.authHeader = null;
            document.getElementById('account-summary').classList.add('hidden');
            document.getElementById('analytics-note').classList.add('hidden');
            document.getElementById('pins-heading').classList.add('hidden');
            document.getElementById('pins-list').innerHTML = '';
            document.getElementById('refresh-button').classList.add('hidden');
            document.getElementById('logout-button').classList.add('hidden');
            document.getElementById('platform-tabs').classList.add('hidden');
            document.getElementById('ai-analysis-trigger').classList.add('hidden');
            document.getElementById('ai-analysis-result').classList.add('hidden');
            document.getElementById('message').innerHTML = `
                <div class="max-w-md mx-auto py-3">
                    <div class="h-12 w-12 rounded-2xl bg-rose-500/15 text-rose-300 flex items-center justify-center text-2xl mb-4"><i class="ph-bold ph-lock-key"></i></div>
                    <h2 class="text-2xl font-black">Zaloguj się do panelu</h2>
                    <p class="text-sm text-slate-400 mt-2 leading-relaxed">Ten sam login i hasło co w pozostałych prywatnych panelach EduBox. Dane nie są zapisywane - znikną po zamknięciu tej karty.</p>
                    <form id="login-form" class="mt-5 space-y-3">
                        <label class="block"><span class="text-xs font-bold text-slate-400">Login</span><input id="login-user" type="text" autocomplete="username" required class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-rose-400"></label>
                        <label class="block"><span class="text-xs font-bold text-slate-400">Hasło</span><input id="login-pass" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-rose-400"></label>
                        <p id="login-error" class="${errorMessage ? '' : 'hidden'} text-sm text-rose-300"><i class="ph-bold ph-warning-circle mr-1"></i>${escapeHtml(errorMessage)}</p>
                        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 px-5 py-3 rounded-xl font-black transition-colors"><i class="ph-bold ph-sign-in"></i>Wejdź do panelu</button>
                    </form>
                </div>`;
            document.getElementById('login-form').addEventListener('submit', async event => {
                event.preventDefault();
                const user = document.getElementById('login-user').value;
                const passInput = document.getElementById('login-pass');
                state.authHeader = createBasicHeader(user, passInput.value);
                passInput.value = '';
                await loadData();
            });
        }

        function renderAccount(platform, account) {
            const cards = platform === 'youtube' ? [
                ['Kanał', account.title || '—', 'text-white'],
                ['Subskrybenci', account.subscribers ?? 'ukryte', 'text-rose-300'],
                ['Wyświetlenia (kanał)', account.totalViews ?? '—', 'text-cyan-300'],
                ['Liczba filmów', account.videoCount ?? '—', 'text-slate-300'],
            ] : platform === 'facebook' ? [
                ['Strona', account.name || '—', 'text-white'],
                ['Obserwujący', account.fans ?? '—', 'text-cyan-300'],
                ['Posty (ostatnie)', state.itemsCount ?? '—', 'text-rose-300'],
                ['Ostatnia aktualizacja', formatDate(state.updatedAt), 'text-slate-300'],
            ] : [
                ['Konto', account.username ? '@' + account.username : '—', 'text-white'],
                ['Obserwujący', account.followers ?? '—', 'text-cyan-300'],
                ['Piny (ostatnie)', state.itemsCount ?? '—', 'text-rose-300'],
                ['Ostatnia aktualizacja', formatDate(state.updatedAt), 'text-slate-300'],
            ];
            document.getElementById('account-summary').innerHTML = cards.map(([label, value, color]) => `
                <article class="glass rounded-2xl p-4">
                    <p class="text-[11px] uppercase tracking-wider text-slate-500 font-black">${escapeHtml(label)}</p>
                    <p class="text-xl md:text-2xl font-black mt-1 ${color} truncate">${escapeHtml(String(value))}</p>
                </article>`).join('');
            document.getElementById('account-summary').classList.remove('hidden');
        }

        function renderAnalytics(analytics, analyticsError) {
            const container = document.getElementById('analytics-note');
            if (analyticsError) {
                container.innerHTML = `<div class="glass rounded-2xl p-4 text-sm text-amber-200"><i class="ph-bold ph-info mr-2"></i>${escapeHtml(analyticsError)}</div>`;
                container.classList.remove('hidden');
                return;
            }
            if (!analytics || !analytics.all) {
                container.classList.add('hidden');
                return;
            }
            const totals = analytics.all.summary_metrics || {};
            const items = [
                ['Wyświetlenia (30 dni)', totals.IMPRESSION],
                ['Zapisania', totals.SAVE],
                ['Kliknięcia w pin', totals.PIN_CLICK],
                ['Kliknięcia na stronę', totals.OUTBOUND_CLICK],
            ].filter(([, value]) => value !== undefined);
            if (!items.length) { container.classList.add('hidden'); return; }
            container.innerHTML = `<div class="glass rounded-2xl p-5">
                <p class="text-xs uppercase tracking-widest text-slate-500 font-black mb-3">Ostatnie 30 dni - konto Pinterest</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    ${items.map(([label, value]) => `<div class="bg-slate-950/55 rounded-xl p-3"><dt class="text-xs text-slate-500">${escapeHtml(label)}</dt><dd class="font-black text-lg text-white mt-1">${escapeHtml(String(value))}</dd></div>`).join('')}
                </div>
            </div>`;
            container.classList.remove('hidden');
        }

        function renderItems(platform, rawItems) {
            const heading = document.getElementById('pins-heading');
            heading.textContent = platform === 'youtube' ? 'Ostatnie filmy' : platform === 'facebook' ? 'Ostatnie posty' : 'Ostatnie piny';
            heading.classList.toggle('hidden', rawItems.length === 0);

            document.getElementById('pins-list').innerHTML = rawItems.map((item, idx) => {
                if (platform === 'youtube') {
                    const metrics = [
                        item.views !== null ? `<span title="Wyświetlenia"><i class="ph-bold ph-eye"></i> ${escapeHtml(String(item.views))}</span>` : '',
                        item.likes !== null ? `<span title="Polubienia"><i class="ph-bold ph-thumbs-up"></i> ${escapeHtml(String(item.likes))}</span>` : '',
                        item.comments !== null ? `<span title="Komentarze"><i class="ph-bold ph-chat-circle"></i> ${escapeHtml(String(item.comments))}</span>` : '',
                    ].filter(Boolean).join(' ');
                    return `
                    <div class="pin-card glass rounded-2xl overflow-hidden flex flex-col">
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                            ${item.thumbnail ? `<img src="${escapeHtml(item.thumbnail)}" alt="" class="w-full h-40 object-cover" loading="lazy">` : `<div class="w-full h-40 bg-slate-800 flex items-center justify-center text-slate-600"><i class="ph-bold ph-video-camera text-4xl"></i></div>`}
                        </a>
                        <div class="p-4 flex flex-col flex-1">
                            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="font-bold text-sm text-white line-clamp-2 hover:text-cyan-300">${escapeHtml(item.title)}</a>
                            <div class="flex flex-wrap gap-3 text-xs text-cyan-300 font-bold mt-2">${metrics}</div>
                            <p class="text-xs text-slate-500 mt-2">${escapeHtml(formatDate(item.publishedAt))}</p>
                            <button data-idx="${idx}" class="analyze-item-btn mt-3 inline-flex items-center gap-1.5 self-start bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-200 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors"><i class="ph-bold ph-magnifying-glass"></i>Analizuj</button>
                        </div>
                    </div>`;
                }
                if (platform === 'facebook') {
                    const metrics = [
                        item.impressions !== null ? `<span title="Wyświetlenia"><i class="ph-bold ph-eye"></i> ${escapeHtml(String(item.impressions))}</span>` : '',
                        item.engaged !== null ? `<span title="Zaangażowani użytkownicy"><i class="ph-bold ph-users"></i> ${escapeHtml(String(item.engaged))}</span>` : '',
                        item.clicks !== null ? `<span title="Kliknięcia"><i class="ph-bold ph-cursor-click"></i> ${escapeHtml(String(item.clicks))}</span>` : '',
                    ].filter(Boolean).join(' ');
                    return `
                    <div class="pin-card glass rounded-2xl overflow-hidden flex flex-col">
                        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                            ${item.media ? `<img src="${escapeHtml(item.media)}" alt="" class="w-full h-40 object-cover" loading="lazy">` : `<div class="w-full h-40 bg-slate-800 flex items-center justify-center text-slate-600"><i class="ph-bold ph-thumbs-up text-4xl"></i></div>`}
                        </a>
                        <div class="p-4 flex flex-col flex-1">
                            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="font-bold text-sm text-white line-clamp-2 hover:text-cyan-300">${escapeHtml(item.title)}</a>
                            <div class="flex flex-wrap gap-3 text-xs text-cyan-300 font-bold mt-2">${metrics}</div>
                            <p class="text-xs text-slate-500 mt-2">${escapeHtml(formatDate(item.createdAt))}</p>
                            <button data-idx="${idx}" class="analyze-item-btn mt-3 inline-flex items-center gap-1.5 self-start bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-200 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors"><i class="ph-bold ph-magnifying-glass"></i>Analizuj</button>
                        </div>
                    </div>`;
                }
                return `
                <div class="pin-card glass rounded-2xl overflow-hidden flex flex-col">
                    <a href="${escapeHtml(item.pinUrl)}" target="_blank" rel="noopener noreferrer">
                        ${item.media ? `<img src="${escapeHtml(item.media)}" alt="" class="w-full h-40 object-cover" loading="lazy">` : `<div class="w-full h-40 bg-slate-800 flex items-center justify-center text-slate-600"><i class="ph-bold ph-image text-4xl"></i></div>`}
                    </a>
                    <div class="p-4 flex flex-col flex-1">
                        <a href="${escapeHtml(item.pinUrl)}" target="_blank" rel="noopener noreferrer" class="font-bold text-sm text-white line-clamp-2 hover:text-cyan-300">${escapeHtml(item.title)}</a>
                        <p class="text-xs text-slate-500 mt-2">${escapeHtml(formatDate(item.createdAt))}</p>
                        <button data-idx="${idx}" class="analyze-item-btn mt-3 inline-flex items-center gap-1.5 self-start bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-200 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors"><i class="ph-bold ph-magnifying-glass"></i>Analizuj</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadData() {
            const button = document.getElementById('refresh-button');
            button.disabled = true;
            button.querySelector('i')?.classList.add('animate-spin');
            try {
                const response = await fetch(`/api/social-stats?platform=${encodeURIComponent(state.platform)}`, {
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: { Authorization: state.authHeader },
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const error = new Error(data.error || `Nie udało się pobrać danych (HTTP ${response.status}).`);
                    error.status = response.status;
                    throw error;
                }
                const items = Array.isArray(data.pins) ? data.pins : (Array.isArray(data.videos) ? data.videos : (Array.isArray(data.posts) ? data.posts : []));
                state.itemsCount = items.length;
                state.updatedAt = data.updatedAt;
                state.lastPlatform = data.platform;
                state.lastItems = items;
                renderAccount(data.platform, data.account || {});
                renderAnalytics(data.analytics, data.analyticsError);
                renderItems(data.platform, items);
                document.getElementById('message').innerHTML = `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2"><span class="text-emerald-300 font-bold"><i class="ph-bold ph-shield-check mr-2"></i>Dane pobrane bez zmian na koncie.</span><span class="text-xs text-slate-500">Aktualizacja: ${escapeHtml(formatDate(data.updatedAt))}</span></div>`;
                document.getElementById('refresh-button').classList.remove('hidden');
                document.getElementById('logout-button').classList.remove('hidden');
                document.getElementById('platform-tabs').classList.remove('hidden');
                document.getElementById('ai-analysis-result').classList.add('hidden');
                document.getElementById('ai-analysis-trigger').classList.toggle('hidden', items.length < 3);
            } catch (error) {
                if (error.status === 401) {
                    renderLogin('Login lub hasło są niepoprawne. Spróbuj ponownie.');
                    return;
                }
                document.getElementById('platform-tabs').classList.remove('hidden');
                document.getElementById('message').innerHTML = `<div class="flex gap-3 text-amber-200"><i class="ph-bold ph-warning-circle text-2xl"></i><div><p class="font-black">Panel nie może jeszcze pobrać danych.</p><p class="text-sm text-slate-400 mt-1">${escapeHtml(error.message)}</p></div></div>`;
            } finally {
                button.disabled = false;
                button.querySelector('i')?.classList.remove('animate-spin');
            }
        }

        // Analiza AI - patrzy na już wczytane dane (tytuły + realne wyniki) i zwraca konkretny,
        // podzielony na sekcje raport, zamiast zostawiać same suche liczby. Korzysta z tego samego
        // współdzielonego endpointu /api/chat co wszystkie inne narzędzia EduBox (gpt-4o-mini) -
        // zero nowej infrastruktury, licznik użycia współdzielony z resztą strony.
        function buildAnalysisPrompt(platform, items) {
            const lines = items.slice(0, 25).map((item, i) => {
                if (platform === 'youtube') {
                    return `${i + 1}. "${item.title}" | ${item.views ?? '?'} wyświetleń | ${item.likes ?? '?'} polubień | ${item.comments ?? '?'} komentarzy | ${item.publishedAt ? item.publishedAt.slice(0, 10) : '?'}`;
                }
                if (platform === 'facebook') {
                    return `${i + 1}. "${item.title}" | ${item.impressions ?? '?'} wyświetleń | ${item.engaged ?? '?'} zaangażowanych | ${item.clicks ?? '?'} kliknięć | ${item.createdAt ? item.createdAt.slice(0, 10) : '?'}`;
                }
                return `${i + 1}. "${item.title}" | opublikowano: ${item.createdAt ? item.createdAt.slice(0, 10) : '?'}`;
            });
            return `Platforma: ${platform}\n${lines.join('\n')}`;
        }

        function renderAnalysisResult(result) {
            const box = document.getElementById('ai-analysis-result');
            const doItems = Array.isArray(result.doThis) ? result.doThis : [];
            const avoidItems = Array.isArray(result.avoidThis) ? result.avoidThis : [];
            const retryItems = Array.isArray(result.retryCandidates) ? result.retryCandidates : [];

            const retryHtml = retryItems.length ? `
                <div class="mb-6">
                    <p class="text-xs font-black uppercase tracking-wider text-cyan-300 mb-3"><i class="ph-bold ph-arrow-clockwise mr-1"></i>Materiały do poprawy i ponownej próby</p>
                    <div class="space-y-3">
                        ${retryItems.map(item => `
                            <div class="bg-slate-950/55 border border-cyan-500/20 rounded-xl p-4">
                                <p class="text-sm font-bold text-white">"${escapeHtml(item.title || '')}" <span class="text-xs font-normal text-slate-500">- ${escapeHtml(String(item.metric ?? ''))}</span></p>
                                ${item.diagnosis ? `<p class="text-xs text-slate-400 mt-2"><span class="text-rose-300 font-bold">Dlaczego prawdopodobnie nie zadziałało:</span> ${escapeHtml(item.diagnosis)}</p>` : ''}
                                ${item.newTitle ? `<p class="text-xs text-slate-300 mt-2"><span class="text-emerald-300 font-bold">Nowy tytuł/kąt do przetestowania:</span> "${escapeHtml(item.newTitle)}"</p>` : ''}
                                ${item.changeToTest ? `<p class="text-xs text-slate-300 mt-1"><span class="text-emerald-300 font-bold">Konkretna zmiana:</span> ${escapeHtml(item.changeToTest)}</p>` : ''}
                                <p class="text-xs text-cyan-200 mt-2 bg-cyan-500/10 rounded-lg px-3 py-2"><i class="ph-bold ph-flask mr-1"></i>Wrzuć ponownie z tą zmianą, zanotuj datę, i porównaj wynik z oryginałem po ok. tygodniu - to pokaże, czy zmiana faktycznie coś dała.</p>
                            </div>`).join('')}
                    </div>
                </div>` : '';

            box.innerHTML = `
                <h3 class="text-lg font-black text-white mb-4 flex items-center gap-2"><i class="ph-bold ph-sparkle text-cyan-300"></i>Analiza AI</h3>
                ${result.patterns ? `<p class="text-sm text-slate-300 leading-relaxed mb-5">${escapeHtml(result.patterns)}</p>` : ''}
                ${retryHtml}
                <div class="grid md:grid-cols-2 gap-4 mb-5">
                    <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl p-4">
                        <p class="text-xs font-black uppercase tracking-wider text-emerald-300 mb-2"><i class="ph-bold ph-check-circle mr-1"></i>Co robić</p>
                        <ul class="text-sm text-slate-200 space-y-1.5 list-disc list-inside">${doItems.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
                    </div>
                    <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl p-4">
                        <p class="text-xs font-black uppercase tracking-wider text-rose-300 mb-2"><i class="ph-bold ph-x-circle mr-1"></i>Czego unikać</p>
                        <ul class="text-sm text-slate-200 space-y-1.5 list-disc list-inside">${avoidItems.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    ${result.automationAdvice ? `<div class="bg-slate-950/55 rounded-xl p-4"><p class="text-xs font-black uppercase tracking-wider text-indigo-300 mb-2"><i class="ph-bold ph-robot mr-1"></i>Dla automatyzacji (Make)</p><p class="text-sm text-slate-300 leading-relaxed">${escapeHtml(result.automationAdvice)}</p></div>` : ''}
                    ${result.manualAdvice ? `<div class="bg-slate-950/55 rounded-xl p-4"><p class="text-xs font-black uppercase tracking-wider text-amber-300 mb-2"><i class="ph-bold ph-hand-tap mr-1"></i>Dla postów ręcznych</p><p class="text-sm text-slate-300 leading-relaxed">${escapeHtml(result.manualAdvice)}</p></div>` : ''}
                </div>`;
            box.classList.remove('hidden');
        }

        async function analyzeWithAI() {
            const items = state.lastItems || [];
            const platform = state.lastPlatform || state.platform;
            if (items.length < 3) return;

            const button = document.getElementById('ai-analyze-button');
            const label = document.getElementById('ai-analyze-label');
            button.disabled = true;
            label.textContent = 'Analizuję...';

            const system = `Jesteś doświadczonym analitykiem marketingu treści dla nauczycieli (EduBox AI - darmowe narzędzia AI dla nauczycieli). Dostajesz listę ostatnich postów/filmów z jednej platformy społecznościowej wraz z ich metrykami (wyświetlenia/polubienia/komentarze/daty).

Twoja analiza MUSI być konkretna i szczegółowa - zakaz ogólników typu "twórz lepsze treści" albo "unikaj słabych tytułów" bez wyjaśnienia DLACZEGO akurat ten tytuł jest słaby i CO dokładnie w nim zmienić. Zawsze odwołuj się do faktycznych tytułów i liczb z podanej listy.

Szczególnie ważne - zidentyfikuj 2-4 pozycje z NAJNIŻSZYMI wynikami (najlepiej takie z zerowymi lub bliskimi zeru wyświetleniami) i dla KAŻDEJ z osobna zaproponuj:
1. diagnosis: konkretną, specyficzną dla TEGO tytułu przyczynę słabego wyniku (nie ogólnikową) - np. czy tytuł jest zbyt ogólny/abstrakcyjny, czy temat nie ma pilnej potrzeby, czy brakuje w tytule konkretnej korzyści/liczby/emocji, itp.
2. newTitle: konkretną, gotową do użycia propozycję NOWEGO tytułu/kąta dla tego samego tematu (nie ogólnikowej rady, tylko realny przykładowy tytuł)
3. changeToTest: jedną konkretną, pojedynczą zmienną do przetestowania przy ponownej publikacji (np. "zmień tylko tytuł, zostaw resztę bez zmian, żeby wiedzieć że to tytuł zrobił różnicę" albo "dodaj konkretną liczbę/czas do tytułu" albo "zmień miniaturkę na zbliżenie efektu końcowego")

Chodzi o to, żeby użytkownik mógł dosłownie wrzucić ten sam materiał jeszcze raz z JEDNĄ konkretną zmianą i po tygodniu porównać wynik z oryginałem - więc changeToTest musi być pojedynczą, testowalną zmianą, nie kilkoma naraz.

Zwróć WYŁĄCZNIE czysty obiekt JSON:
{"patterns": "3-5 zdań: co konkretnie łączy najlepiej działające pozycje (odwołaj się do ich tytułów), a co najgorzej działające", "retryCandidates": [{"title": "dokładny tytuł z listy", "metric": "np. 0 wyświetleń", "diagnosis": "...", "newTitle": "...", "changeToTest": "..."}], "doThis": ["4-6 konkretnych punktów, każdy odwołujący się do realnego przykładu z listy tam gdzie to możliwe"], "avoidThis": ["3-5 konkretnych punktów z wyjaśnieniem dlaczego"], "automationAdvice": "2-4 zdania: konkretnie jak zmienić prompty/tematy w automatycznych publikacjach (Make.com), z przykładem", "manualAdvice": "2-4 zdania: jaką strategię przyjąć przy treściach publikowanych ręcznie, inną niż w automatyzacji, z przykładem"}
Pisz po polsku, konkretnie, bez lania wody i bez ogólników możliwych do powiedzenia o dowolnym koncie.`;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: buildAnalysisPrompt(platform, items), system, temperature: 0.5, format: 'json', model: 'gpt-4o-mini' }),
                });
                if (!response.ok) throw new Error(`Błąd AI (HTTP ${response.status}).`);
                const data = await response.json();
                const parsed = JSON.parse(data.text);
                renderAnalysisResult(parsed);
            } catch (error) {
                document.getElementById('ai-analysis-result').innerHTML = `<p class="text-sm text-amber-200"><i class="ph-bold ph-warning-circle mr-2"></i>Nie udało się przygotować analizy: ${escapeHtml(error.message)}</p>`;
                document.getElementById('ai-analysis-result').classList.remove('hidden');
            } finally {
                button.disabled = false;
                label.textContent = 'Analizuj z AI';
            }
        }

        // Analiza AI pojedynczej pozycji - klik "Analizuj" na konkretnej karcie. Dla kontekstu
        // podajemy też, jak ta pozycja wypada na tle najlepszej z aktualnie wczytanej listy, żeby
        // AI mogło ocenić dystans, a nie tylko samą liczbę w oderwaniu od reszty.
        function openItemModal(html) {
            document.getElementById('item-modal-content').innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
        }
        function closeItemModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }
        document.getElementById('item-modal-close').addEventListener('click', closeItemModal);
        document.getElementById('item-modal').addEventListener('click', (event) => {
            if (event.target.id === 'item-modal') closeItemModal();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeItemModal();
        });

        function itemMetricValue(platform, item) {
            if (platform === 'youtube') return item.views ?? 0;
            if (platform === 'facebook') return item.impressions ?? item.engaged ?? 0;
            return null;
        }

        async function analyzeSingleItem(idx) {
            const items = state.lastItems || [];
            const platform = state.lastPlatform || state.platform;
            const item = items[idx];
            if (!item) return;

            openItemModal(`<div class="flex items-center gap-3 text-slate-300"><i class="ph-bold ph-circle-notch animate-spin text-xl"></i>Analizuję "${escapeHtml(item.title)}"...</div>`);

            const metricValues = items.map(i => itemMetricValue(platform, i)).filter(v => v !== null);
            const best = metricValues.length ? Math.max(...metricValues) : null;
            const thisValue = itemMetricValue(platform, item);

            const details = platform === 'youtube'
                ? `Tytuł: "${item.title}"\nWyświetlenia: ${item.views ?? '?'} (najlepszy wynik na liście: ${best ?? '?'})\nPolubienia: ${item.likes ?? '?'}\nKomentarze: ${item.comments ?? '?'}\nData publikacji: ${item.publishedAt ? item.publishedAt.slice(0, 10) : '?'}`
                : platform === 'facebook'
                ? `Treść posta: "${item.title}"\nWyświetlenia: ${item.impressions ?? '?'} (najlepszy wynik na liście: ${best ?? '?'})\nZaangażowani użytkownicy: ${item.engaged ?? '?'}\nKliknięcia: ${item.clicks ?? '?'}\nData publikacji: ${item.createdAt ? item.createdAt.slice(0, 10) : '?'}`
                : `Tytuł: "${item.title}"\nData publikacji: ${item.createdAt ? item.createdAt.slice(0, 10) : '?'}`;

            const system = `Jesteś doświadczonym analitykiem marketingu treści dla nauczycieli (EduBox AI). Dostajesz JEDNĄ konkretną pozycję (post/film) do szczegółowej analizy, z kontekstem jak wypada na tle najlepszego wyniku z listy. Bądź maksymalnie konkretny i praktyczny - zero ogólników.

Zwróć WYŁĄCZNIE czysty obiekt JSON:
{"diagnosis": "3-5 zdań: dlaczego ta konkretna pozycja mogła osiągnąć taki wynik - odwołaj się do samego tytułu/tematu/daty, nie do ogólnych zasad", "titleAlternatives": ["2-3 konkretne, gotowe do użycia alternatywne tytuły dla TEGO SAMEGO tematu"], "thumbnailOrFormatTip": "1-2 zdania konkretnej rady dot. miniaturki/formatu/długości", "testPlan": "1-2 zdania: jak dokładnie przetestować zmianę (jedna zmienna na raz) i po jakim czasie sprawdzić wynik"}
Pisz po polsku, konkretnie.`;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `Platforma: ${platform}\n${details}`, system, temperature: 0.5, format: 'json', model: 'gpt-4o-mini' }),
                });
                if (!response.ok) throw new Error(`Błąd AI (HTTP ${response.status}).`);
                const data = await response.json();
                const result = JSON.parse(data.text);
                const alternatives = Array.isArray(result.titleAlternatives) ? result.titleAlternatives : [];
                openItemModal(`
                    <h3 class="text-lg font-black text-white mb-1 pr-8">${escapeHtml(item.title)}</h3>
                    <p class="text-xs text-slate-500 mb-4">${thisValue !== null ? `${escapeHtml(String(thisValue))} wyświetleń` : ''}</p>
                    ${result.diagnosis ? `<p class="text-sm text-slate-300 leading-relaxed mb-4">${escapeHtml(result.diagnosis)}</p>` : ''}
                    ${alternatives.length ? `<div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl p-4 mb-4"><p class="text-xs font-black uppercase tracking-wider text-emerald-300 mb-2">Alternatywne tytuły do przetestowania</p><ul class="text-sm text-slate-200 space-y-1.5 list-disc list-inside">${alternatives.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>` : ''}
                    ${result.thumbnailOrFormatTip ? `<div class="bg-slate-950/55 rounded-xl p-4 mb-4"><p class="text-xs font-black uppercase tracking-wider text-amber-300 mb-2">Miniaturka / format</p><p class="text-sm text-slate-300 leading-relaxed">${escapeHtml(result.thumbnailOrFormatTip)}</p></div>` : ''}
                    ${result.testPlan ? `<p class="text-xs text-cyan-200 bg-cyan-500/10 rounded-lg px-3 py-2"><i class="ph-bold ph-flask mr-1"></i>${escapeHtml(result.testPlan)}</p>` : ''}
                `);
            } catch (error) {
                openItemModal(`<p class="text-sm text-amber-200"><i class="ph-bold ph-warning-circle mr-2"></i>Nie udało się przygotować analizy: ${escapeHtml(error.message)}</p>`);
            }
        }

        document.getElementById('pins-list').addEventListener('click', (event) => {
            const button = event.target.closest('.analyze-item-btn');
            if (!button) return;
            event.preventDefault();
            analyzeSingleItem(Number(button.dataset.idx));
        });

        document.getElementById('ai-analyze-button').addEventListener('click', analyzeWithAI);
        document.getElementById('refresh-button').addEventListener('click', loadData);
        document.getElementById('logout-button').addEventListener('click', () => renderLogin('Wylogowano z panelu.'));
        document.querySelectorAll('.platform-tab').forEach(button => button.addEventListener('click', () => {
            state.platform = button.dataset.platform;
            document.querySelectorAll('.platform-tab').forEach(tab => tab.className = 'platform-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-bold inline-flex items-center gap-2');
            button.className = 'platform-tab bg-white text-slate-950 px-4 py-2 rounded-full text-sm font-black inline-flex items-center gap-2';
            loadData();
        }));
        renderLogin();
    </script>
</body>
</html>
