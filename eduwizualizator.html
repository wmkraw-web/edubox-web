    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        let FIREBASE_CONFIG;
        try { FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", authDomain: "mock", projectId: "mock", appId: "1:123" }; } catch(e) { FIREBASE_CONFIG = {}; }
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "eduboxpro";
        
        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: async (onUserLoad) => {
                if (!isInitialized) {
                    try {
                        app = initializeApp(FIREBASE_CONFIG);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                        isInitialized = true;
                        window.EduBoxCore.loadMenu();
                    } catch(e) { console.warn("Firebase init error", e); }
                }
                if (auth) onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                else if(onUserLoad) onUserLoad({ uid: 'mock-user-123' });
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) container.innerHTML = `<div class="bg-amber-600 text-white text-xs text-center py-1 font-bold print-hidden">EduBox V3 PRO MAX - System Core Loaded</div>`;
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na pasku bocznym!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser && !db) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, { userId: currentUser?.uid || 'anonymous', createdAt: serverTimestamp(), type: appType, name: itemName, config: config });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BotHelperAvatar = () => (
            <svg viewBox="0 0 100 100" className="w-14 h-14 drop-shadow-md flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 30 V15" stroke="#fcd34d" strokeWidth="4" strokeLinecap="round"/>
                <circle cx="50" cy="12" r="5" fill="#f59e0b"/>
                <rect x="25" y="30" width="50" height="40" rx="12" fill="#ca8a04"/>
                <rect x="32" y="38" width="36" height="22" rx="6" fill="#ffffff"/>
                <circle cx="40" cy="49" r="3.5" fill="#ca8a04" className="bot-eye"/>
                <circle cx="60" cy="49" r="3.5" fill="#ca8a04" className="bot-eye"/>
                <path d="M 45 56 Q 50 60 55 56" stroke="#ca8a04" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
            </svg>
        );

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [activeTab, setActiveTab] = useState('steps');
            const [isGenerating, setIsGenerating] = useState(false);
            const [botMessage, setBotMessage] = useState("Cześć! Dzieci w spektrum to wzrokowcy. Wybierz zakładkę, a ja zamienię Twoje słowa na gotowe do laminowania piktogramy!");

            const [params, setParams] = useState({
                routine: '',
                firstTask: '',
                thenReward: '',
                goodBehavior: '',
                badBehavior: '',
                tokenChildName: '',
                tokenReward: '',
                tokenTheme: '',
                tokenCount: '5'
            });

            const [generatedData, setGeneratedData] = useState(null);

            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'eduwizualizator_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            useEffect(() => {
                if(activeTab === 'steps') setBotMessage("Plan Aktywności: Wpisz czynność (np. 'Wizyta u fryzjera' albo 'Mycie zębów'), a ja rozbiję ją na proste kroki i dobiorę piktogramy!");
                else if(activeTab === 'first_then') setBotMessage("Najpierw - Potem: Wpisz trudne zadanie i nagrodę. Wygeneruję wielką tablicę wizualną, która da dziecku poczucie przewidywalności.");
                else if(activeTab === 'rules') setBotMessage("Zasady Sali: Wpisz zachowania pożądane i niepożądane. Zrobię karty 'Tak robimy' (zielone) i 'Tego nie robimy' (czerwone).");
                else if(activeTab === 'tokens') setBotMessage("Tablice Żetonowe: Wpisz nagrodę i motyw (np. Kosmos). Zbuduję piękną planszę z żetonami do wycięcia i przyczepiania na rzepy!");
            }, [activeTab]);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === PANCERNE API FUNCTIONS ===
            const fetchWithExponentialBackoff = async (url, options, timeoutMs = 20000) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                let lastErr;
                for (let i = 0; i < 5; i++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                        const fetchOptions = { ...options, signal: controller.signal };
                        
                        const res = await fetch(url, fetchOptions);
                        clearTimeout(timeoutId);
                        
                        if (!res.ok) {
                            const errText = await res.text();
                            throw new Error(`HTTP ${res.status}: ${errText.substring(0, 80)}`);
                        }
                        return await res.json();
                    } catch (err) {
                        lastErr = err;
                        if (err.name === 'AbortError') lastErr = new Error("Serwer nie odpowiedział na czas (Timeout).");
                        if (i < 4) await new Promise(r => setTimeout(r, delays[i]));
                    }
                }
                throw lastErr;
            };

            const parseAIResponse = (rawText) => {
                try {
                    let jsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = jsonStr.indexOf('{');
                    const endIdx = jsonStr.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) {
                        jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                    }
                    // Pancerna ochrona: Usuwamy WSZYSTKIE surowe znaki kontrolne (w tym twarde entery), które psują JSON
                    jsonStr = jsonStr.replace(/[\u0000-\u001F]+/g, ' ');
                    return JSON.parse(jsonStr);
                } catch (err) {
                    console.error("JSON Parse Error. Surowy tekst:", rawText);
                    throw new Error("Model AI zwrócił uszkodzony tekst. Spróbuj ponownie.");
                }
            };

            const fetchVisualData = async (usrPrompt, sysPrompt) => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: usrPrompt, 
                            system: sysPrompt,
                            temperature: 0.3,
                            format: "json",
                            model: "gpt-4o-mini"
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (!res.ok) throw new Error(`Serwer główny: HTTP ${res.status}`);
                    const data = await res.json();
                    return parseAIResponse(data.text);
                    
                } catch (e) {
                    console.warn("Przełączam na model awaryjny tekstu:", e.message);
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: usrPrompt }] }],
                        systemInstruction: { parts: [{ text: sysPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const data = await fetchWithExponentialBackoff(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }, 20000);
                    
                    const responseText = data.candidates[0].content.parts[0].text;
                    return parseAIResponse(responseText);
                }
            };

            // === LOGIC ===
            const generateContent = () => {
                // Validation
                if (activeTab === 'steps' && !params.routine.trim()) { showToast('Wpisz czynność, np. Mycie rąk!', 'error'); return; }
                if (activeTab === 'first_then' && (!params.firstTask.trim() || !params.thenReward.trim())) { showToast('Wpisz zadanie i nagrodę!', 'error'); return; }
                if (activeTab === 'rules' && (!params.goodBehavior.trim() || !params.badBehavior.trim())) { showToast('Uzupełnij oba pola zasad!', 'error'); return; }
                if (activeTab === 'tokens' && (!params.tokenReward.trim() || !params.tokenTheme.trim())) { showToast('Wpisz motyw żetonów i nagrodę!', 'error'); return; }

                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedData(null);
                        
                        try {
                            let sysPrompt = "";
                            let usrPrompt = "";

                            if (activeTab === 'steps') {
                                setBotMessage("Analizuję czynność, dzielę na proste kroki dla dziecka w spektrum i dobieram idealne piktogramy...");
                                sysPrompt = `Jesteś ekspertem ds. komunikacji AAC. Podziel czynność na 4-8 bardzo prostych, zrozumiałych kroków (analiza zadania).
Do każdego kroku dopasuj DOKŁADNIE JEDNO, najlepiej opisujące je emoji.
ZWRÓĆ WYŁĄCZNIE JSON o strukturze: { "title": "Tytuł", "steps": [ {"emoji": "💧", "text": "Odkręcam wodę"}, {"emoji": "🧼", "text": "Biorę mydło"} ] }`;
                                usrPrompt = `Rozbij tę czynność na wizualne kroki: ${params.routine}`;
                            
                            } else if (activeTab === 'first_then') {
                                setBotMessage("Tworzę tablicę Najpierw-Potem. Zabezpieczam przed złośliwymi znakami...");
                                sysPrompt = `Jesteś pedagogiem specjalnym. Zredaguj podane zadanie i nagrodę na NAJPROSTSZY tekst (np. "Jem zupę", "Idę na plac").
Dopasuj do nich po jednym czytelnym Emoji.
ZWRÓĆ WYŁĄCZNIE JSON: { "first": {"text": "...", "emoji": "..."}, "then": {"text": "...", "emoji": "..."} }`;
                                usrPrompt = `Najpierw ma zrobić: ${params.firstTask}. Potem w nagrodę: ${params.thenReward}`;

                            } else if (activeTab === 'rules') {
                                setBotMessage("Generuję karty zasad. Jasny przekaz to podstawa poczucia bezpieczeństwa...");
                                sysPrompt = `Jesteś pedagogiem. Sformatuj podane zasady na BARDZO KRÓTKIE hasła dla dzieci z autyzmem.
Dobierz do każdego po jednym mocnym Emoji.
ZWRÓĆ WYŁĄCZNIE JSON: { "good": {"text": "...", "emoji": "..."}, "bad": {"text": "...", "emoji": "..."} }`;
                                usrPrompt = `Zachowanie pozytywne: ${params.goodBehavior}. Zachowanie negatywne: ${params.badBehavior}`;
                            
                            } else if (activeTab === 'tokens') {
                                setBotMessage("Projektuję tablicę motywacyjną. Rysuję żetony z wybranego motywu...");
                                sysPrompt = `Jesteś pedagogiem. Tworzysz tablicę żetonową (token economy).
Dopasuj do nagrody i motywu odpowiednie pojedyncze Emoji. Zredaguj nazwę nagrody na krótką.
ZWRÓĆ WYŁĄCZNIE JSON: { "rewardText": "...", "rewardEmoji": "...", "tokenEmoji": "..." }`;
                                usrPrompt = `Nagroda (na co pracuje): ${params.tokenReward}. Motyw żetonów (czym się interesuje): ${params.tokenTheme}`;
                            }

                            const resultData = await fetchVisualData(usrPrompt, sysPrompt);

                            setGeneratedData({ type: activeTab, data: resultData, localParams: { ...params } });
                            setBotMessage("Gotowe! Wyrenderowałem piktogramy. Możesz je teraz zapisać w Giełdzie lub wydrukować!");

                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                        } catch (error) {
                            console.error("Szczegóły błędu:", error); 
                            showToast(`Błąd: ${error.message.substring(0, 80)}`, 'error');
                            setBotMessage(`Napotkałem problem. Spróbuj ponownie lub użyj prostszych słów.`);
                        } finally { 
                            setIsGenerating(false); 
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedData) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { activeTab, params, generatedData };
                    
                    let shortName = "Wizualizacja AAC";
                    if (activeTab === 'steps') shortName = `Kroki: ${params.routine}`;
                    else if (activeTab === 'first_then') shortName = `Najpierw ${params.firstTask} -> Potem ${params.thenReward}`;
                    else if (activeTab === 'rules') shortName = `Zasady: ${params.goodBehavior}`;
                    else if (activeTab === 'tokens') shortName = `Tablica Żetonowa: ${params.tokenTheme}`;

                    shortName = shortName.substring(0, 40);
                    
                    await window.EduBoxCore.saveToGielda('eduwizualizator_market', 'EduWizualizator', shortName, configToSave);
                    showToast("Opublikowano na Giełdzie! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setActiveTab(item.config.activeTab || 'steps');
                setParams(item.config.params || {});
                setGeneratedData(item.config.generatedData);
                setAppMode('generator');
                showToast("Wczytano projekt z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-yellow-400 to-amber-600 rounded-xl flex items-center justify-center shadow-lg shadow-yellow-500/20">
                            <i className="ph-bold ph-image text-slate-900 text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-yellow-400">Wizualizator</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Kreator AAC

                                                <div className="cut-line border-4 border-dashed border-slate-300 p-6 rounded-3xl flex flex-col items-center bg-red-50 page-break-inside-avoid relative">
                                                    <div className="absolute top-4 left-4 w-16 h-16 bg-red-500 text-white rounded-full flex items-center justify-center text-3xl shadow-md border-4 border-white font-sans font-bold">✕</div>
                                                    <div className="text-[8rem] mb-6 drop-shadow-sm opacity-80 grayscale">{generatedData.data.bad.emoji}</div>
                                                    <div className="text-4xl font-black text-red-900 text-center uppercase leading-tight bg-white px-8 py-4 rounded-2xl shadow-sm w-full border border-red-100">
                                                        {generatedData.data.bad.text}
                                                    </div>
                                                </div>

                                            </div>
                                        )}

                                        {generatedData.type === 'tokens' && (
                                            <div className="flex-1 flex flex-col h-full">
                                                {/* Nagłówek i Nagroda */}
                                                <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b-4 border-slate-200 pb-6 gap-6">
                                                    <h1 className="text-3xl font-black text-slate-800 uppercase tracking-widest text-center md:text-left">
                                                        Tablica: <span className="text-sky-600">{generatedData.localParams.tokenChildName}</span>
                                                    </h1>
                                                    
                                                    {/* Pole na rzep (Nagroda) */}
                                                    <div className="flex items-center gap-4 bg-amber-100 p-4 rounded-[2rem] border-4 border-amber-300 shadow-sm relative">
                                                        <div className="absolute -top-3 left-6 bg-white px-2 text-amber-600 text-xs font-black uppercase tracking-widest rounded-full border-2 border-amber-300 font-sans">Pracuję na:</div>
                                                        <div className="w-16 h-16 bg-white rounded-full shadow-sm text-4xl border-4 border-dashed border-amber-300 flex items-center justify-center flex-shrink-0">
                                                            {generatedData.data.rewardEmoji}
                                                        </div>
                                                        <span className="text-2xl font-black text-amber-900 uppercase pr-4">{generatedData.data.rewardText}</span>
                                                    </div>
                                                </div>

                                                {/* Miejsca na żetony */}
                                                <div className="bg-slate-100 border-4 border-slate-300 rounded-[2.5rem] p-8 mb-12 flex justify-center flex-wrap gap-6 shadow-inner">
                                                    {Array.from({ length: parseInt(generatedData.localParams.tokenCount) }).map((_, i) => (
                                                        <div key={i} className="w-24 h-24 rounded-full border-4 border-slate-300 bg-white shadow-inner flex items-center justify-center relative">
                                                            <div className="w-4 h-4 rounded-full bg-slate-200 absolute"></div> {/* Oznaczenie na rzep */}
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Obszar do wycięcia - Żetony */}
                                                <div className="mt-auto border-t-4 border-dashed border-slate-300 pt-10 relative">
                                                    <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-white px-6 py-1 rounded-full text-slate-500 font-black text-sm uppercase tracking-widest border-2 border-dashed border-slate-300 flex items-center gap-2 font-sans">
                                                        <i className="ph-bold ph-scissors text-lg"></i> Wytnij żetony
                                                    </div>
                                                    <div className="flex flex-wrap justify-center gap-6">
                                                        {Array.from({ length: parseInt(generatedData.localParams.tokenCount) }).map((_, i) => (
                                                            <div key={i} className="cut-line w-24 h-24 rounded-full border-4 border-dashed border-sky-400 bg-sky-50 shadow-sm flex items-center justify-center text-[4rem]">
                                                                {generatedData.data.tokenEmoji}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
