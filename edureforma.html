<body>
    <script>window.EDUBOX_IMAGE_APP = false;</script>
    <div id="wspolne-menu-kontener" class="print-hidden"></div>

    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <div class="print-hidden flex justify-center pt-4 px-4">
        <div class="inline-flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 rounded-full px-4 py-1.5">
            <i class="ph-fill ph-shield-check text-emerald-500 text-base shrink-0"></i>
            <span>Zweryfikowano pod kątem przepisów i podstawy programowej na rok szkolny 2026/2027 (sierpień 2026)</span>
        </div>
    </div>

    <div id="root"></div>
    <div id="toast-container"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LEGAL_SOURCES = {
            podstawa_programowa: { name: "Rozporządzenie ws. nowej podstawy programowej \"Kompas Jutra\" (11.03.2026)", url: "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20260000378" },
            prawo_oswiatowe: { name: "Ustawa Prawo oświatowe - ISAP", url: "https://isap.sejm.gov.pl/isap.nsf/ByKeyword.xsp?key=Prawo+o%C5%9Bwiatowe" },
            oswiata_ogolnie: { name: "Portal Ministerstwa Edukacji - aktualności i akty prawne", url: "https://www.gov.pl/web/edukacja" }
        };

        const ETAPY = [
            { id: 'przedszkole', label: 'Przedszkole', sublabel: 'wszystkie grupy', icon: 'ph-baby' },
            { id: 'klasa1', label: 'Klasa I SP', sublabel: 'szkoła podstawowa', icon: 'ph-number-circle-one' },
            { id: 'klasa4', label: 'Klasa IV SP', sublabel: 'szkoła podstawowa', icon: 'ph-number-circle-four' },
            { id: 'inna', label: 'Inna klasa', sublabel: 'II, III, V-VIII', icon: 'ph-question' },
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [usageCount, setUsageCount] = useState(0);
            const [toastMessage, setToastMessage] = useState(null);

            const [selectedEtap, setSelectedEtap] = useState(null);
            const [extraContext, setExtraContext] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [resultData, setResultData] = useState(null);
            const [botMessage, setBotMessage] = useState("Cześć! Jestem Twoim asystentem wdrożenia reformy \"Kompas Jutra\". Wybierz etap, na którym uczysz, a przygotuję dla Ciebie dokładną, spersonalizowaną listę zmian.");

            useEffect(() => {
                const initCore = () => {
                    if (window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                        const status = localStorage.getItem('eduboxProStatus');
                        if (status === 'PRO' || status === 'active') setIsPremium(true);
                        setUsageCount(window.EduBoxCore.getUsageCount());
                    } else { setTimeout(initCore, 100); }
                };
                initCore();
            }, []);

            const showToast = (text) => {
                setToastMessage(text);
                setTimeout(() => setToastMessage(null), 4000);
            };

            const formatAIResponse = (text) => {
                if (!text) return "";
                return text.replace(/\n/g, '<br/>');
            };

            const handleVerifyCode = async () => {
                const isValid = await window.EduBoxCore.verifyPremiumCode(accessCode);
                if (isValid) {
                    setIsPremium(true);
                    setAccessCode('');
                    localStorage.setItem('eduboxProStatus', 'active');
                    showToast('Kod aktywny! Witamy w Premium 🌟');
                } else {
                    showToast('Nieprawidłowy kod dostępu!');
                }
            };

            const handleGenerate = (etapId) => {
                setSelectedEtap(etapId);
                setResultData(null);

                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    async (newCount) => {
                        setUsageCount(newCount);
                        setIsGenerating(true);
                        setBotMessage("Analizuję rozporządzenie z 11 marca 2026 r. i przygotowuję Twoją spersonalizowaną listę zmian...");

                        const etapLabel = ETAPY.find(e => e.id === etapId)?.label || etapId;

                        const systemPrompt = `Jesteś ekspertem ds. wdrażania reformy oświaty "Kompas Jutra" w Polsce. Dzisiejsza data to ${new Date().toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' })}, trwa rok szkolny 2026/2027.

ZWERYFIKOWANE FAKTY, na których musisz oprzeć odpowiedź (nie wymyślaj dodatkowych):
- Rozporządzenie Ministra Edukacji z 11 marca 2026 r. (Dz.U. 2026 poz. 378) wprowadza nową podstawę programową.
- Nowa podstawa obowiązuje OD 1 WRZEŚNIA 2026 R. wyłącznie w: wszystkich przedszkolach/oddziałach przedszkolnych, klasie I szkoły podstawowej, klasie IV szkoły podstawowej.
- Klasy II, III oraz V-VIII w roku szkolnym 2026/2027 NADAL uczą się według dotychczasowej podstawy z 2017 r. - reforma obejmie je w kolejnych latach, sukcesywnie.
- Zmiany dla PRZEDSZKOLA: ograniczenie urządzeń ekranowych (tylko do celów dydaktycznych), nacisk na 4 kluczowe kompetencje (fundamentalne, przekrojowe), więcej zabawy i aktywności grupowych, "higiena cyfrowa".
- Zmiany dla KLASY I: mniej pojęć/terminów do opanowania na rzecz rozwoju podstawowych umiejętności (mówienie, czytanie, pisanie, słuchanie); zwiększony tygodniowy wymiar godzin edukacji wczesnoszkolnej z 20 do 21 godzin; wprowadzenie "tygodnia projektowego"; nacisk na edukację medialną (w tym krytyczne podejście do treści, również generowanych przez AI).
- Zmiany dla KLASY IV: treści zorganizowane wokół 6 interdyscyplinarnych modułów tematycznych; powrót przedmiotu "przyroda" jako zintegrowanego przedmiotu (elementy biologii, chemii, fizyki, geografii) w klasach 4-6; "zajęcia praktyczno-techniczne" zastępują dotychczasową "technikę" w klasach IV-VI; "tydzień projektowy"; silniejszy nacisk na kompetencje przekrojowe (krytyczne myślenie, kreatywność, współpraca, rozwiązywanie problemów).
- Kontekst dodatkowy (już obowiązuje od roku 2025/2026, NIE jest częścią tej fali zmian): edukacja obywatelska (klasy VI-VII, zastąpiła WOS) i edukacja zdrowotna już funkcjonują.

ZASADY:
1. Jeśli użytkownik wybrał "inna klasa" (II, III, V-VIII) - jasno i uspokajająco wyjaśnij, że w roku szkolnym 2026/2027 nic się jeszcze nie zmienia w podstawie programowej dla tej klasy, ale warto zacząć się przygotowywać na kolejne lata.
2. Pisz wyłącznie o faktach z listy powyżej - nie zmyślaj dodatkowych szczegółów, konkretnych godzin lekcyjnych ani nazw podręczników.
3. Jeśli użytkownik podał dodatkowy kontekst (przedmiot, sytuację), dostosuj do niego praktyczne wskazówki, ale nie zmyślaj dla niego nowych przepisów.
4. W polu "related_topics" wskaż 1-2 klucze z listy: "podstawa_programowa", "prawo_oswiatowe", "oswiata_ogolnie" - wybieraj tylko z tej zamkniętej listy.

Odpowiadaj WYŁĄCZNIE poprawnym formatem JSON, bez znaczników Markdown wokół niego:
{
  "objety_reforma": true lub false,
  "status_naglowek": "krótki, jednozdaniowy nagłówek statusu dla tego etapu",
  "zmiany": "Wyczerpująca lista konkretnych zmian dla wybranego etapu, w formie wypunktowanej za pomocą • i pogrubień <strong> na kluczowych słowach. Użyj \\n do nowych linii.",
  "jak_sie_przygotowac": "3-5 konkretnych, praktycznych kroków przygotowania się do zmian (lub - jeśli 'inna klasa' - kroków na przyszłość), wypunktowanych za pomocą •",
  "related_topics": ["klucz1"]
}`;

                        const userPrompt = `Etap nauczania: ${etapLabel}. ${extraContext.trim() ? 'Dodatkowy kontekst od nauczyciela: ' + extraContext.trim() : ''}`;

                        try {
                            const res = await fetch('/api/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, temperature: 0.3, model: "gpt-4o-mini", format: "json" })
                            });
                            if (!res.ok) throw new Error("Błąd łączenia z serwerem AI.");
                            const data = await res.json();
                            let cleanText = data.text;

                            if (cleanText.includes('"reasoning_content"')) {
                                const startIdx = cleanText.indexOf('"content":"');
                                if (startIdx !== -1) {
                                    let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, '');
                                    cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"');
                                }
                            } else {
                                try { const outerObj = JSON.parse(cleanText); if (outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch (e) {}
                            }

                            cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                            let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();

                            let parsedData;
                            try {
                                const extractedJson = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                                parsedData = JSON.parse(extractedJson);
                            } catch (e) {
                                parsedData = { objety_reforma: null, status_naglowek: "Wystąpił problem z przetworzeniem odpowiedzi", zmiany: cleanText, jak_sie_przygotowac: "Spróbuj wygenerować ponownie.", related_topics: ["oswiata_ogolnie"] };
                            }

                            if (!parsedData.related_topics || parsedData.related_topics.length === 0) {
                                parsedData.related_topics = ["podstawa_programowa"];
                            }

                            setResultData(parsedData);
                            setBotMessage("Gotowe! Przygotowałem dla Ciebie dokładną listę zmian i praktyczne kroki przygotowania.");
                        } catch (err) {
                            showToast("Błąd: " + err.message);
                            setBotMessage("Coś poszło nie tak. Spróbuj ponownie za chwilę.");
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (limitMsg) => { showToast(limitMsg); },
                    (toastMsg) => { showToast(toastMsg); }
                );
            };

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow print-hidden"></div>

                    <main className="max-w-6xl mx-auto px-4 sm:px-6 py-10 w-full flex-1">
                        <div className="print-hidden text-center mb-10">
                            <div className="inline-flex items-center gap-2 bg-teal-500/10 border border-teal-500/30 text-teal-400 text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-5">
                                <i className="ph-bold ph-compass"></i> Reforma "Kompas Jutra"
                            </div>
                            <h1 className="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">Co dokładnie zmienia się<br className="hidden sm:block" /> w Twojej klasie?</h1>
                            <p className="text-slate-400 max-w-2xl mx-auto text-base md:text-lg">Wybierz etap, na którym uczysz - przygotuję spersonalizowaną, opartą na przepisach listę zmian i praktyczne kroki przygotowania.</p>
                        </div>

                        {!isPremium && (
                            <div className="print-hidden max-w-md mx-auto mb-8 flex items-center gap-2 bg-slate-900/60 border border-slate-700 rounded-2xl p-2">
                                <input type="text" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} placeholder="Masz kod PRO? Wpisz go tutaj..." className="flex-1 bg-transparent text-sm px-3 py-2 outline-none text-white placeholder-slate-500" />
                                <button onClick={handleVerifyCode} className="bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all">Odblokuj</button>
                            </div>
                        )}

                        <div className="print-hidden grid grid-cols-2 lg:grid-cols-4 gap-4 max-w-3xl mx-auto mb-10">
                            {ETAPY.map(etap => (
                                <button key={etap.id} onClick={() => handleGenerate(etap.id)} disabled={isGenerating}
                                    className={`flex flex-col items-center gap-3 p-6 rounded-3xl border transition-all disabled:opacity-50 ${selectedEtap === etap.id ? 'bg-teal-600/20 border-teal-500 shadow-[0_0_20px_rgba(45,212,191,0.2)]' : 'bg-slate-900/60 border-slate-700 hover:border-teal-500/50'}`}>
                                    <i className={`ph-bold ${etap.icon} text-3xl ${selectedEtap === etap.id ? 'text-teal-400' : 'text-slate-400'}`}></i>
                                    <div className="text-center">
                                        <div className="text-sm font-bold text-white">{etap.label}</div>
                                        <div className="text-[10px] text-slate-500">{etap.sublabel}</div>
                                    </div>
                                </button>
                            ))}
                        </div>

                        <div className="print-hidden max-w-xl mx-auto mb-10">
                            <textarea value={extraContext} onChange={(e) => setExtraContext(e.target.value)} placeholder="Opcjonalnie: dodaj kontekst (np. Twój przedmiot, konkretne pytanie)..." rows="2" className="w-full bg-slate-900/60 border border-slate-700 rounded-2xl p-4 text-sm text-white placeholder-slate-500 resize-none"></textarea>
                        </div>

                        {isGenerating && (
                            <div className="print-hidden flex flex-col items-center justify-center py-16">
                                <i className="ph-bold ph-compass text-6xl text-teal-500 compass-loading mb-4"></i>
                                <p className="text-slate-400 text-sm font-bold">{botMessage}</p>
                            </div>
                        )}

                        {!isGenerating && !resultData && (
                            <div className="print-hidden max-w-lg mx-auto text-center bg-slate-900/40 border border-slate-800 rounded-3xl p-8">
                                <i className="ph-duotone ph-chats-circle text-4xl text-teal-500/70 mb-3"></i>
                                <p className="text-slate-400 text-sm">{botMessage}</p>
                            </div>
                        )}

                        {resultData && !isGenerating && (
                            <div className="max-w-3xl mx-auto">
                                <div className="bg-white text-slate-900 rounded-sm p-10 md:p-14 shadow-2xl document-font fade-in print:shadow-none print:p-0" id="print-container">
                                    <div className="text-center border-b-2 border-slate-300 pb-6 mb-8 print-border-bottom">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Asystent Wdrożenia Reformy 2026</div>
                                        <h1 className="text-2xl md:text-3xl font-black uppercase text-teal-800 tracking-tight">{resultData.status_naglowek}</h1>
                                    </div>

                                    <div className="ai-content text-sm md:text-base leading-relaxed space-y-6 text-justify">
                                        {resultData.objety_reforma !== null && (
                                            <div className={`p-5 rounded-r-xl border-l-4 print-bg-light ${resultData.objety_reforma ? 'bg-teal-50 border-teal-600' : 'bg-slate-50 border-slate-400'}`}>
                                                <h3 className={`text-xs font-black uppercase tracking-widest mb-2 flex items-center gap-2 ${resultData.objety_reforma ? 'text-teal-800' : 'text-slate-600'}`}>
                                                    <i className={`ph-bold ${resultData.objety_reforma ? 'ph-check-circle' : 'ph-info'}`}></i>
                                                    {resultData.objety_reforma ? 'Ta klasa jest objęta reformą od 1.09.2026' : 'Ta klasa NIE jest jeszcze objęta reformą'}
                                                </h3>
                                            </div>
                                        )}

                                        <div>
                                            <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-3 border-b border-slate-200 pb-2">Co się zmienia</h3>
                                            <div className="text-slate-800" dangerouslySetInnerHTML={{ __html: formatAIResponse(resultData.zmiany) }}></div>
                                        </div>

                                        <div className="bg-slate-50 border border-slate-200 p-6 rounded-xl mt-8 print-bg-light">
                                            <h3 className="text-xs font-black uppercase text-emerald-600 tracking-widest mb-4 flex items-center gap-2"><i className="ph-bold ph-check-circle"></i> Jak się przygotować</h3>
                                            <div className="text-slate-800" dangerouslySetInnerHTML={{ __html: formatAIResponse(resultData.jak_sie_przygotowac) }}></div>
                                        </div>

                                        {resultData.related_topics && resultData.related_topics.length > 0 && (
                                            <div className="no-print border border-slate-200 p-6 rounded-xl">
                                                <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 flex items-center gap-2"><i className="ph-bold ph-link"></i> Źródła i dalsza lektura</h3>
                                                <div className="flex flex-col gap-2">
                                                    {resultData.related_topics.filter(key => LEGAL_SOURCES[key]).map(key => (
                                                        <a key={key} href={LEGAL_SOURCES[key].url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-sm text-teal-700 hover:text-teal-900 hover:underline font-semibold">
                                                            <i className="ph-bold ph-arrow-square-out shrink-0"></i>
                                                            {LEGAL_SOURCES[key].name}
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-20 pt-4 border-t border-slate-300 text-center">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Dokument wygenerowany przez system EduReforma AI.</p>
                                        <p className="text-[9px] text-slate-400 mt-1">Informacja ma charakter pomocniczy. W razie wątpliwości skonsultuj się z dyrekcją lub kuratorium oświaty.</p>
                                    </div>
                                </div>

                                <div className="print-hidden flex justify-center gap-3 mt-8">
                                    <button onClick={() => window.print()} className="bg-teal-600 hover:bg-teal-500 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-lg">
                                        <i className="ph-bold ph-printer"></i> Drukuj / Zapisz PDF
                                    </button>
                                    <button onClick={() => { setResultData(null); setSelectedEtap(null); setBotMessage("Wybierz kolejny etap, żeby sprawdzić dla niego zmiany."); }} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-all text-sm">
                                        <i className="ph-bold ph-arrow-counter-clockwise"></i> Sprawdź inny etap
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {toastMessage && (
                        <div className="no-print fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 border border-slate-600 text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl animate-toast">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>

</body></html>
