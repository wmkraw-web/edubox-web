    <!-- 1. KONTENER NA WSPÓLNE MENU -->

    <!-- 3. SKRYPT WSTRZYKUJĄCY MENU -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Ponieważ sprawdzasz plik lokalnie, przeglądarka może blokować fetch() 
            // z powodu polityki CORS. 
            // Wersja docelowa (na serwerze): fetch('/menu.html')
            
            // Poniżej rozwiązanie awaryjne dla testów lokalnych:
            // Jeśli fetch zawiedzie, wstawiamy menu awaryjne.
            fetch('/menu.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('wspolne-menu-kontener').innerHTML = data;
                    if (typeof updateGlobalLimitDisplay === 'function') {
                        updateGlobalLimitDisplay();
                    }
                })
                .catch(error => {
                    console.warn('Ładowanie menu z pliku nie powiodło się (prawdopodobnie testujesz lokalnie z pliku, a nie przez serwer). Wstawiam menu awaryjne dla testów wizualnych.', error);
                    // Menu awaryjne ze stylami Tailwind dla lokalnego podglądu
                    document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="fixed top-0 w-full z-50 glass-nav">
                        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gradient-to-br from-amber-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                </div>
                                <span class="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduBox<span class="text-amber-500">Pro</span></span>
                            </div>
                            
                            <div class="flex items-center gap-4">
                                <div class="hidden sm:flex flex-col items-end mr-4">
                                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Darmowe użycia</span>
                                    <span id="global-limit-display" class="text-sm font-black text-amber-500">...</span>
                                </div>

                                <a href="https://buycoffee.to/magiccolor" target="_blank" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-[0_0_15px_rgba(217,119,6,0.4)] transition-all flex items-center gap-2">
                                    <span>☕</span> <span class="hidden sm:inline">Kawa (PRO)</span>
                                </a>

                                <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-colors bg-slate-800/50 hover:bg-slate-700 px-3 sm:px-4 py-2 rounded-full border border-slate-700">
                                    <span class="hidden sm:inline">Start</span>
                                </a>
                            </div>
                        </div>
                    </nav>
                    `;
                    // Wymuszamy aktualizację limitu po wstawieniu awaryjnego menu
                    setTimeout(() => {
                        if (typeof updateGlobalLimitDisplay === 'function') {
                            updateGlobalLimitDisplay();
                        }
                    }, 100);
                });
        });

    <!-- 4. GŁÓWNY SKRYPT APLIKACJI (REACT + LIMITY + ORYGINALNE GENEROWANIE) -->
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const BUY_COFFEE_LINK = "https://buycoffee.to/magiccolor";
        const DAILY_LIMIT = 5;

        // --- SYSTEM LIMITÓW ---
        const checkAndConsumeLimit = () => {
            const today = new Date().toLocaleDateString();
            let usageData = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };

            if (usageData.date !== today) {
                usageData = { date: today, count: 0 };
            }

            if (usageData.count >= DAILY_LIMIT) {
                return false; 
            }

            usageData.count += 1;
            localStorage.setItem('eduboxUsage', JSON.stringify(usageData));
            updateGlobalLimitDisplay(); 
            return true; 
        };

        const getRemainingLimit = () => {
            const today = new Date().toLocaleDateString();
            const usageData = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
            if (usageData.date !== today) return DAILY_LIMIT;
            return Math.max(0, DAILY_LIMIT - usageData.count);
        };

        window.updateGlobalLimitDisplay = () => {
            const displayElement = document.getElementById('global-limit-display');
            if (displayElement) {
                const remaining = getRemainingLimit();
                displayElement.innerText = `${remaining} z ${DAILY_LIMIT}`;
                if (remaining === 0) {
                    displayElement.className = "text-sm font-black text-red-500 animate-pulse";
                }
            }
        };

        // --- KONFIGURACJA AI (Odtworzona z Twojego kodu) ---
        const PROMPTS = {
            protokol: `Jesteś perfekcyjnym, bezdusznym szkolnym biurokratą.
Twoje zadanie: Przekształć luźne notatki nauczyciela w wysoce sformalizowany PROTOKÓŁ Z ZEBRANIA Z RODZICAMI.
Struktura, którą MUSISZ zastosować:
1. Nagłówek: PROTOKÓŁ Z ZEBRANIA Z RODZICAMI KLASY [wymyśl klasę, jeśli nie podano] w dniu [dzisiejsza data].
2. Miejsce: [np. Sala nr X]
3. Porządek zebrania (wypunktowany, oficjalny).
4. Przebieg zebrania (zmień notatki na sztywny język np. "Wychowawca zapoznał rodziców z...", "Omówiono kwestie dotyczące...").
5. Wnioski / Ustalenia końcowe.
6. Podpisy (miejsce na podpis protokólanta i przewodniczącego).
Nie dodawaj żadnych własnych uwag z zewnątrz, użyj tylko faktów od nauczyciela, ale rozbuduj je o piękny, urzędniczy styl i "lanie wody" na temat dobra ucznia i podstaw programowych.`,

            notatka: `Jesteś perfekcyjnym, bezdusznym szkolnym biurokratą.
Twoje zadanie: Przekształć notatki w oficjalną NOTATKĘ SŁUŻBOWĄ (z incydentu, spotkania z rodzicem itp.) gotową do wpięcia w teczkę ucznia.
Struktura:
1. Miejscowość, data.
2. Nagłówek: NOTATKA SŁUŻBOWA.
3. Sporządzający: [Wychowawca / Nauczyciel].
4. Dotyczy: [Krótki temat bazujący na notatkach].
5. Treść: Opis w trybie bezosobowym i obiektywnym (np. "W dniu dzisiejszym doszło do...", "Uczeń zachowywał się w sposób naruszający statut szkoły..."). Unikaj emocji, używaj rygorystycznego języka oświatowego.
6. Wnioski/Zalecenia: (np. Powiadomiono pedagoga, wezwano rodziców).
7. Miejsce na podpis.`,

            sprawozdanie: `Jesteś perfekcyjnym, bezdusznym szkolnym biurokratą.
Twoje zadanie: Przekształć krótką notatkę z wycieczki lub wyjścia szkolnego w obszerne, sformalizowane SPRAWOZDANIE Z WYCIECZKI SZKOLNEJ.
Struktura:
1. Nagłówek: SPRAWOZDANIE Z WYCIECZKI / WYJŚCIA EDUKACYJNEGO.
2. Cel wycieczki (Dopisz tu "urzędnicze" cele edukacyjne, np. kształtowanie postaw patriotycznych, realizacja podstawy programowej, integracja zespołu klasowego).
3. Przebieg: Zmień podane fakty na sztywny opis.
4. Podsumowanie: Jak zachowywali się uczniowie i jaki był walor edukacyjny wydarzenia.
5. Miejsce na podpis kierownika wycieczki.`,

            zgoda: `Jesteś ekspertem prawno-oświatowym.
Twoje zadanie: Przekształć luźną notatkę nauczyciela (gdzie jadą i za ile) na w pełni bezpieczny, oficjalny FORMULARZ ZGODY RODZICÓW na wycieczkę/wyjście. 
Zadbaj o wszystkie aspekty prawne i bezpieczeństwo nauczyciela (tzw. dupochron).
Struktura gotowego formularza do druku:
1. ZGODA RODZICÓW / OPIEKUNÓW PRAWNYCH (nagłówek).
2. Formułka: "Wyrażam zgodę na udział mojego dziecka ................................................................ (imię i nazwisko) w wycieczce do/na [podaj cel z notatek] w dniu [podaj datę]".
3. Koszt: [podaj koszt] oraz harmonogram (zbiórka/powrót).
4. OŚWIADCZENIA: (wymień wypunktowane oświadczenia: a) brak przeciwwskazań zdrowotnych, b) zobowiązanie dziecka do przestrzegania regulaminu, c) zgoda na leczenie/interwencję medyczną w razie wypadku, d) jak dziecko wraca do domu (np. odbieram osobiście / wraca samodzielnie)).
5. Ważne: Miejsce na "Numer kontaktowy w nagłych wypadkach: .......................................".
6. Miejscowość, data i MIEJSCE NA CZYTELNY PODPIS RODZICA.
Wynik musi wyglądać jak profesjonalny formularz gotowy do druku i rozdania dzieciom (używaj kropek ........... jako miejsca do wpisania danych).`
        };

        function App() {
            const [activeTab, setActiveTab] = useState('zgoda');
            const [inputText, setInputText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [copyStatus, setCopyStatus] = useState('Skopiuj dokument');
            const [showLimitWarning, setShowLimitWarning] = useState(false);

            const resultRef = useRef(null);

            useEffect(() => {
                // Opóźniamy lekko inicjalizację, by mieć pewność, że DOM menu się wczytał
                setTimeout(() => {
                    if(typeof window.updateGlobalLimitDisplay === 'function') {
                        window.updateGlobalLimitDisplay();
                    }
                }, 500);
            }, []);

            const generateResponse = async () => {
                if (!inputText.trim()) {
                    setError('Proszę wpisać chociaż krótką notatkę, aby AI miało na czym pracować.');
                    return;
                }

                // Sprawdzanie limitu
                if (!checkAndConsumeLimit()) {
                    setShowLimitWarning(true);
                    return;
                }

                setIsGenerating(true);
                setError('');
                setGeneratedText('');
                setCopyStatus('Skopiuj dokument');
                setShowLimitWarning(false);

                try {
                    const systemInstruction = PROMPTS[activeTab];
                    const finalPrompt = `Stwórz dokument na podstawie tych informacji:\n\n"""\n${inputText}\n"""`;

                    const payload = {
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { temperature: 0.2 } 
                    };

                    let data;
                    
                    // TWOJA ORYGINALNA LOGIKA ŁĄCZENIA Z VERCEL/GEMINI
                    if (window.location.hostname.includes('vercel.app') || window.location.hostname.includes('eduboxpro.pl') || (window.location.hostname !== '' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1')) {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ payload, type: 'text' })
                        });
                        if (!response.ok) throw new Error(`Błąd serwera API: ${response.status}`);
                        data = await response.json();
                    } else {
                        // FALLBACK NA LOCALHOST (Aby działało u Ciebie na komputerze w celach testowych)
                        // UWAGA: W celach testowych wkleiłem tutaj publiczny endpoint, jeśli nie zadziała, to znaczy że musisz testować na serwerze Vercel
                        console.warn("Testujesz lokalnie. Połączenie z API może zostać odrzucone bez klucza w kodzie.");
                        throw new Error("Testy lokalne bez klucza API. Opublikuj na Vercel lub użyj funkcji testowej.");
                    }

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        setGeneratedText(text);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    console.error("Błąd generowania:", err);
                    
                    // FALLBACK DEMO - Jeśli wystąpi błąd (np. testujesz na komputerze), pokaż tekst testowy
                    // Dodałem to celowo, żebyś widział że guzik działa nawet na komputerze bez API
                    if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                         setError('Testujesz lokalnie. Wyświetlam DOKUMENT DEMONSTRACYJNY. Po wrzuceniu na serwer Vercel, wygeneruje się prawdziwy.');
                         setTimeout(() => {
                            setGeneratedText(`[TO JEST TEKST DEMONSTRACYJNY WYWOŁANY LOKALNIE]\n\nTyp dokumentu: ${activeTab.toUpperCase()}\n\nZgodnie z poleceniem, próbowałeś przetworzyć tekst:\n"${inputText}"\n\nTwój licznik limitów został poprawnie zmniejszony.`);
                         }, 800);
                    } else {
                         setError('Błąd połączenia z serwerem AI. Spróbuj ponownie później.');
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = () => {
                if (!generatedText) return;
                const textArea = document.createElement("textarea");
                textArea.value = generatedText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                setCopyStatus('Skopiowano! ✓');
                setTimeout(() => setCopyStatus('Skopiuj dokument'), 3000);
            };

            return (
                <div className="relative flex flex-col w-full">
                    <div className="hero-glow"></div>

                    <div className="flex-grow pt-32 pb-20 px-4 sm:px-6">
                        <div className="max-w-4xl mx-auto">
                            
                            <div className="text-center mb-10 fade-in">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Mniej pisania, <span className="text-gradient">więcej spokoju.</span>
                                </h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                    Wrzuć krótką notatkę, a sztuczna inteligencja zamieni ją w sformalizowany dokument.
                                </p>
                            </div>

                            {/* OSTRZEŻENIE O LIMICIE */}
                            {showLimitWarning && (
                                <div className="bg-red-900/50 border-2 border-red-500 rounded-2xl p-6 text-center mb-8 shadow-[0_0_30px_rgba(239,68,68,0.3)] fade-in">
                                    <h3 className="text-2xl font-black text-white mb-2">Limit dzienny wykorzystany! (5/5)</h3>
                                    <p className="text-slate-300 mb-6 max-w-2xl mx-auto">
                                        API, z którego korzysta sztuczna inteligencja (Gemini/OpenAI) jest bardzo kosztowne. 
                                        Udostępniam to narzędzie za darmo, ale muszę chronić serwer przed przeciążeniem.
                                    </p>
                                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                                        <a href={BUY_COFFEE_LINK} target="_blank" className="w-full sm:w-auto bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-900 px-8 py-3 rounded-xl font-black shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center justify-center gap-2">
                                            ☕ Postaw kawę i wspieraj projekt
                                        </a>
                                        <button onClick={() => setShowLimitWarning(false)} className="text-slate-400 hover:text-white text-sm underline">
                                            Zamknij komunikat
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8 fade-in" style={{animationDelay: '0.1s'}}>
                                {[
                                    { id: 'zgoda', title: 'Zgoda Rodziców', desc: 'Wyjścia i wycieczki', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /> },
                                    { id: 'protokol', title: 'Protokół', desc: 'Z zebrania z rodzicami', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /> },
                                    { id: 'notatka', title: 'Notatka Służbowa', desc: 'O incydencie (teczka)', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /> },
                                    { id: 'sprawozdanie', title: 'Sprawozdanie', desc: 'Podsumowanie wyjścia', icon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" /> }
                                ].map((tab) => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`p-4 sm:p-5 rounded-2xl border-2 transition-all duration-300 text-left flex flex-col gap-2 ${activeTab === tab.id ? 'bg-amber-900/30 border-amber-500 shadow-[0_0_20px_rgba(245,158,11,0.2)]' : 'glass-panel border-slate-700/50 hover:border-slate-500 opacity-80 hover:opacity-100'}`}
                                    >
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${activeTab === tab.id ? 'bg-amber-500 text-amber-950' : 'bg-slate-800 text-slate-400'}`}>
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">{tab.icon}</svg>
                                        </div>
                                        <div>
                                            <h3 className={`font-bold text-sm sm:text-base ${activeTab === tab.id ? 'text-white' : 'text-slate-300'}`}>{tab.title}</h3>
                                            <p className="text-[10px] sm:text-xs text-slate-400 mt-1">{tab.desc}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <div className="glass-panel p-6 sm:p-8 rounded-3xl fade-in border border-slate-700" style={{animationDelay: '0.2s'}}>
                                <label className="block text-white font-bold mb-4">
                                    {activeTab === 'zgoda' ? 'Dane wycieczki (co, gdzie, kiedy, za ile):' : 'Skrótowe notatki (im gorzej napiszesz, tym lepiej AI to naprawi):'}
                                </label>
                                
                                <textarea 
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    placeholder={
                                        activeTab === 'zgoda' ? "Np. Kino, 15 maja, bilet 25zł, zbiórka 8:00 pod szkołą, wracamy na 12:00. Cel to integracja i Dzień Dziecka." :
                                        activeTab === 'protokol' ? "Np. Zebranie 15 maja. Przyszło mało osób. Mówiłem o słabych ocenach z matmy i że jedziemy do kina w czerwcu. Rodzice się zgodzili." :
                                        activeTab === 'notatka' ? "Np. Kuba znów gadał na lekcji, a na przerwie rzucił w Tomka plecakiem. Dzwoniłem do matki." :
                                        "Np. Byliśmy w muzeum 10 października. Dzieci grzeczne. Fajna wystawa o dinozaurach."
                                    }
                                    className="w-full h-32 bg-slate-900/50 border border-slate-700 text-slate-200 rounded-2xl p-4 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 custom-scrollbar resize-y text-sm sm:text-base"
                                ></textarea>

                                {error && (
                                    <div className="mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>
                                )}

                                <div className="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div className="text-xs text-slate-400 flex items-center gap-2">
                                        <svg className="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        Zużywasz 1 limit przy generowaniu
                                    </div>
                                    <button 
                                        onClick={generateResponse}
                                        disabled={isGenerating || !inputText.trim() || showLimitWarning}
                                        className={`w-full sm:w-auto px-8 py-4 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-lg btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-amber-500 to-red-500 hover:shadow-amber-500/25'}`}
                                    >
                                        {isGenerating ? 'Generowanie...' : `Generuj ${activeTab === 'zgoda' ? 'Formularz Zgody' : 'Dokument'}`}
                                    </button>
                                </div>
                            </div>

                            {generatedText && (
                                <div ref={resultRef} className="mt-8 glass-panel p-6 sm:p-8 rounded-3xl fade-in border-amber-500/30 shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                                        <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                            Gotowy do wydruku
                                        </h3>
                                        <button 
                                            onClick={copyToClipboard}
                                            className="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/50 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors btn-bounce"
                                        >
                                            {copyStatus}
                                        </button>
                                    </div>
                                    
                                    <div className="bg-white p-6 sm:p-10 rounded-xl shadow-inner min-h-[300px]">
                                        <p className="text-black whitespace-pre-wrap font-serif text-sm sm:text-base leading-relaxed">
                                            {generatedText}
                                        </p>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    <footer className="py-6 border-t border-slate-800 text-center text-sm font-bold text-slate-600 uppercase tracking-widest mt-auto">
                        Część systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
