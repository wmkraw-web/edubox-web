        const compressImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Nie udało się odczytać pliku.'));
            reader.onload = () => {
                const img = new Image();
                img.onerror = () => reject(new Error('To nie wygląda na obraz.'));
                img.onload = () => {
                    let quality = 0.82;
                    let maxSide = 1500;
                    let out = '';
                    for (let i = 0; i < 4; i++) {
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        out = canvas.toDataURL('image/jpeg', quality);
                        if (out.length < 2_500_000) break;
                        quality -= 0.12;
                        maxSide = Math.round(maxSide * 0.8);
                    }
                    resolve(out);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        const track = (name, params) => { try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {} };

        // --- Komponenty -------------------------------------------------------------------

        const Gauge = ({ level }) => {
            const angle = level ? LEVEL_META[level].angle : -90;
            return (
                <svg viewBox="0 0 200 118" className="w-56 sm:w-64 mx-auto" aria-hidden="true">
                    <defs>
                        <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stopColor="#10b981" />
                            <stop offset="50%" stopColor="#fbbf24" />
                            <stop offset="100%" stopColor="#f43f5e" />
                        </linearGradient>
                    </defs>
                    <path d="M 18 100 A 82 82 0 0 1 182 100" fill="none" stroke="rgba(148,163,184,0.15)" strokeWidth="16" strokeLinecap="round" />
                    <path d="M 18 100 A 82 82 0 0 1 182 100" fill="none" stroke="url(#gaugeGrad)" strokeWidth="16" strokeLinecap="round" opacity={level ? 1 : 0.35} />
                    <g className="needle" style={{ transform: `rotate(${angle}deg)` }}>
                        <line x1="100" y1="100" x2="100" y2="30" stroke="#f8fafc" strokeWidth="4" strokeLinecap="round" />
                    </g>
                    <circle cx="100" cy="100" r="9" fill="#f8fafc" />
                    <circle cx="100" cy="100" r="4" fill="#0f172a" />
                </svg>
            );
        };

        const Shield = () => (
            <div className="shield-wrap mx-auto">
                <div className="pulse-ring"></div>
                <svg viewBox="0 0 92 104" className="w-full h-full">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stopColor="#6366f1" />
                            <stop offset="100%" stopColor="#10b981" />
                        </linearGradient>
                    </defs>
                    <path d="M46 4 L84 18 V50 C84 76 66 94 46 100 C26 94 8 76 8 50 V18 Z" fill="url(#shieldGrad)" opacity="0.92" />
                    <path d="M46 4 L84 18 V50 C84 76 66 94 46 100 C26 94 8 76 8 50 V18 Z" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2" />
                    <path d="M30 52 L42 64 L64 40" fill="none" stroke="white" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
                <div className="shield-scan"></div>
            </div>
        );

        function QuizSection() {
            const [idx, setIdx] = useState(0);
            const [answer, setAnswer] = useState(null);
            const [score, setScore] = useState(0);
            const [done, setDone] = useState(false);
            const q = QUIZ[idx];

            const choose = (saysScam) => {
                if (answer !== null) return;
                const correct = saysScam === q.scam;
                setAnswer({ saysScam, correct });
                if (correct) setScore(s => s + 1);
            };
            const next = () => {
                if (idx + 1 >= QUIZ.length) { setDone(true); track('zk_quiz_done', { score }); return; }
                setIdx(idx + 1);
                setAnswer(null);
            };
            const restart = () => { setIdx(0); setAnswer(null); setScore(0); setDone(false); };

            if (done) {
                const verdict = score >= 9 ? 'Mistrzowska czujność! 🏆' : score >= 7 ? 'Bardzo dobrze - oszuści mają z Tobą pod górkę. 💪' : 'Warto przejrzeć „10 zasad” poniżej - to naprawdę się przydaje. 🙂';
                return (
                    <div className="glass rounded-3xl p-8 text-center pop-in">
                        <p className="text-6xl font-display font-bold text-white mb-2">{score}/{QUIZ.length}</p>
                        <p className="text-lg text-slate-200 mb-6">{verdict}</p>
                        <button onClick={restart} className="btn-bounce px-6 py-3 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white">Zagraj jeszcze raz</button>
                    </div>
                );
            }

            return (
                <div className="glass rounded-3xl p-6 sm:p-8">
                    <div className="flex items-center justify-between mb-5">
                        <span className="text-[11px] font-bold uppercase tracking-widest text-indigo-300">Pytanie {idx + 1} z {QUIZ.length}</span>
                        <span className="text-[11px] font-bold uppercase tracking-widest text-emerald-300">Wynik: {score}</span>
                    </div>
                    <div className="h-1.5 bg-slate-800 rounded-full mb-6 overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-500" style={{ width: `${(idx / QUIZ.length) * 100}%` }}></div>
                    </div>
                    <div key={idx} className="quiz-card pop-in bg-slate-950/60 border border-slate-700/60 rounded-2xl p-5 mb-6">
                        <span className="inline-block text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 mb-3">{q.channel}</span>
                        <p className="text-lg text-white leading-relaxed">{q.text}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => choose(true)} disabled={answer !== null} className={`btn-bounce py-4 rounded-2xl font-bold border-2 transition-all ${answer && answer.saysScam ? (answer.correct ? 'bg-emerald-600/30 border-emerald-400 text-white' : 'bg-rose-600/30 border-rose-400 text-white') : 'bg-rose-500/10 border-rose-500/40 text-rose-200 hover:bg-rose-500/20'}`}>🚩 Podejrzane</button>
                        <button onClick={() => choose(false)} disabled={answer !== null} className={`btn-bounce py-4 rounded-2xl font-bold border-2 transition-all ${answer && !answer.saysScam ? (answer.correct ? 'bg-emerald-600/30 border-emerald-400 text-white' : 'bg-rose-600/30 border-rose-400 text-white') : 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200 hover:bg-emerald-500/20'}`}>✅ Wygląda normalnie</button>
                    </div>
                    {answer && (
                        <div className="mt-6 fade-in">
                            <p className={`font-bold mb-2 ${answer.correct ? 'text-emerald-300' : 'text-rose-300'}`}>{answer.correct ? 'Dobrze!' : 'Tym razem nie.'} {q.scam ? 'To ma cechy oszustwa.' : 'Tu nie widać typowych sygnałów.'}</p>
                            <p className="text-slate-300 leading-relaxed mb-5">{q.why}</p>
                            <button onClick={next} className="btn-bounce px-6 py-3 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white">{idx + 1 >= QUIZ.length ? 'Zobacz wynik' : 'Dalej →'}</button>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            // ?tab=text|phone|image|link - poradniki linkują prosto do właściwej zakładki
            const [mode, setMode] = useState(() => {
                try {
                    const t = new URLSearchParams(location.search).get('tab');
                    return ['link', 'text', 'phone', 'image'].includes(t) ? t : 'link';
                } catch (e) { return 'link'; }
            }); // link | text | phone | image
            const [url, setUrl] = useState('');
            const [text, setText] = useState('');
            const [phone, setPhone] = useState('');
            const [contact, setContact] = useState('');
            const [image, setImage] = useState('');
            const [imageName, setImageName] = useState('');
            const [loading, setLoading] = useState(false);
            const [step, setStep] = useState(0);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [toast, setToast] = useState('');
            const resultRef = useRef(null);
            const fileRef = useRef(null);

            useEffect(() => {
                EduBoxCore.init(() => {});
                // Wklejenie obrazka ze schowka (Ctrl+V) przełącza na tryb zrzutu ekranu.
                const onPaste = async (e) => {
                    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
                    if (!item) return;
                    e.preventDefault();
                    await handleFile(item.getAsFile());
                };
                window.addEventListener('paste', onPaste);
                return () => window.removeEventListener('paste', onPaste);
            }, []);

            useEffect(() => {
                if (!loading) return;
                setStep(0);
                const t = setInterval(() => setStep(s => Math.min(s + 1, STEPS.length - 1)), 1600);
                return () => clearInterval(t);
            }, [loading]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

            const handleFile = async (file) => {
                if (!file) return;
                setError('');
                try {
                    const data = await compressImage(file);
                    setImage(data);
                    setImageName(file.name || 'zrzut ekranu');
                    setMode('image');
                } catch (e) {
                    setError(e.message);
                }
            };

            const canSubmit = !loading && ((mode === 'link' && url.trim()) || (mode === 'text' && text.trim()) || (mode === 'image' && image) || (mode === 'phone' && phone.trim()));

            const runCheck = async () => {
                if (!canSubmit) return;
                setError('');
                setResult(null);
                setLoading(true);
                try {
                    const payload = { mode: 'verify' };
                    if (mode === 'link') payload.url = url.trim();
                    if (mode === 'text') payload.text = text.trim();
                    if (mode === 'phone') { payload.phone = phone.trim(); if (contact) payload.contact = contact; if (text.trim()) payload.text = text.trim(); }
                    if (mode === 'image') { payload.image = image; if (text.trim()) payload.text = text.trim(); }
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.message || `Błąd serwera (${res.status})`);
                    setResult(data);
                    track('zk_check', { zk_mode: mode, zk_level: data.level });
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
                } catch (e) {
                    setError(e.message || 'Coś poszło nie tak. Spróbuj ponownie.');
                } finally {
                    setLoading(false);
                }
            };

            const useExample = (ex) => {
                setMode(ex.mode);
                setText(ex.value);
                setResult(null);
                showToast('Wstawiono przykład - kliknij „Sprawdź”.');
            };

            const share = async () => {
                const shareUrl = 'https://eduboxpro.pl/zanimklikniesz.html?utm_source=share&utm_medium=social&utm_campaign=zanimklikniesz';
                const shareText = 'Darmowe narzędzie: sprawdź link, SMS albo ofertę, zanim klikniesz.';
                try {
                    if (navigator.share) { await navigator.share({ title: 'ZanimKlikniesz', text: shareText, url: shareUrl }); return; }
                    await navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
                    showToast('✅ Skopiowano link - wyślij go bliskim!');
                } catch (e) {}
                track('zk_share');
            };

            const meta = result ? LEVEL_META[result.level] : null;

            const tabs = [
                { id: 'link', icon: 'ph-link', label: 'Link / strona' },
                { id: 'text', icon: 'ph-chat-text', label: 'SMS / wiadomość / oferta' },
                { id: 'phone', icon: 'ph-phone', label: 'Numer telefonu' },
                { id: 'image', icon: 'ph-image', label: 'Zrzut ekranu' }
            ];

            return (
                <div className="relative flex flex-col min-h-screen">
                    <div className="grid-bg print-hidden"></div>
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>
                    <div className="aura-blob aura-3 print-hidden"></div>

                    {toast && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-indigo-600 text-white px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(99,102,241,0.45)] font-bold text-sm animate-toast border border-indigo-400 print-hidden">{toast}</div>
                    )}

                    <main className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10 print-hidden">
                        <div className="max-w-4xl mx-auto">

                            {/* HERO */}
                            <section className="text-center mb-10 fade-in">
                                <Shield />
                                <div className="mt-6 inline-flex flex-wrap justify-center items-center gap-2 bg-indigo-950/50 border border-indigo-400/30 px-4 py-1.5 rounded-full text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-5">
                                    Nowość · Dla każdego · Za darmo
                                </div>
                                <h1 className="font-display text-4xl sm:text-6xl font-bold text-white tracking-tight leading-[1.05] mb-5">
                                    Sprawdź, <span className="text-gradient">zanim klikniesz.</span>
                                </h1>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto leading-relaxed">
                                    Link, SMS, numer telefonu, ogłoszenie z Facebooka czy OLX, podejrzany sklep - wklej i zobacz sygnały ostrzegawcze. Bez logowania, bez zapisywania Twoich danych.
                                </p>
                                <div className="mt-6 flex flex-wrap justify-center gap-2 text-[11px] font-semibold">
                                    {['Lista CERT Polska', 'Wiek strony', 'Podszywanie się pod marki', 'Numery telefonu', 'Biała lista VAT', 'Analiza AI'].map(b => (
                                        <span key={b} className="px-3 py-1.5 rounded-full bg-slate-900/70 border border-slate-700 text-slate-300"><i className="ph-bold ph-check text-emerald-400 mr-1"></i>{b}</span>
                                    ))}
                                </div>
                            </section>

                            {/* FORMULARZ */}
                            <section className="glass rounded-[2rem] p-5 sm:p-8 fade-in" style={{ animationDelay: '0.1s' }}>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6 p-1.5 bg-slate-950/60 rounded-2xl border border-slate-800">
                                    {tabs.map(t => (
                                        <button key={t.id} onClick={() => { setMode(t.id); setError(''); }} className={`btn-bounce py-3 px-2 rounded-xl text-xs sm:text-sm font-bold flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all ${mode === t.id ? 'bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-lg shadow-indigo-900/50' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}>
                                            <i className={`ph-bold ${t.icon} text-lg`}></i><span>{t.label}</span>
                                        </button>
                                    ))}
                                </div>

                                {mode === 'link' && (
                                    <div className="fade-in">
                                        <label className="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block mb-2">Adres strony lub sklepu</label>
                                        <input type="text" inputMode="url" value={url} onChange={(e) => setUrl(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') runCheck(); }} placeholder="np. super-okazje-sklep.pl albo wklej cały link" className="w-full bg-slate-950/70 border border-slate-700 text-white rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/30 transition" />
                                        <p className="text-xs text-slate-500 mt-2">Nie musisz wchodzić na stronę - sprawdzimy ją za Ciebie.</p>
                                    </div>
                                )}

                                {mode === 'text' && (
                                    <div className="fade-in">
                                        <label className="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block mb-2">Treść SMS-a, maila, wiadomości lub ogłoszenia</label>
                                        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={6} maxLength={6000} placeholder="Wklej tutaj całą wiadomość - razem z linkiem, numerem konta czy NIP-em, jeśli są." className="w-full bg-slate-950/70 border border-slate-700 text-white rounded-2xl px-5 py-4 text-base leading-relaxed focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/30 transition resize-y"></textarea>
                                        <div className="mt-3 flex flex-wrap items-center gap-2">
                                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-1">Wypróbuj:</span>
                                            {EXAMPLES.map(ex => (
                                                <button key={ex.label} onClick={() => useExample(ex)} className="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300 hover:border-indigo-400 hover:text-white transition">{ex.label}</button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {mode === 'phone' && (
                                    <div className="fade-in">
                                        <label className="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block mb-2">Numer telefonu</label>
                                        <input type="tel" inputMode="tel" value={phone} onChange={(e) => setPhone(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') runCheck(); }} placeholder="np. +44 7911 123456 albo 701 234 567" className="w-full bg-slate-950/70 border border-slate-700 text-white rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/30 transition" />
                                        <label className="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block mt-5 mb-2">Jak się z Tobą skontaktowano? (opcjonalnie)</label>
                                        <div className="flex flex-wrap gap-2">
                                            {CONTACT_OPTIONS.map(o => (
                                                <button key={o.id} onClick={() => setContact(contact === o.id ? '' : o.id)} className={`text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl border transition ${contact === o.id ? 'bg-indigo-600/30 border-indigo-400 text-white' : 'bg-slate-900/60 border-slate-700 text-slate-300 hover:border-slate-500'}`}>
                                                    <i className={`ph-bold ${o.icon} mr-1`}></i>{o.label}
                                                </button>
                                            ))}
                                        </div>
                                        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={3} maxLength={3000} placeholder="(opcjonalnie) co powiedział lub napisał rozmówca? np. „ktoś bierze kredyt na Pana dane, proszę zainstalować aplikację”" className="mt-4 w-full bg-slate-950/70 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-400"></textarea>
                                        <p className="text-xs text-slate-500 mt-2"><i className="ph-bold ph-info mr-1"></i>Nie prowadzimy listy „oszukańczych numerów” - numer na ekranie można podrobić, więc liczy się to, czego od Ciebie chcą. Sprawdzamy kraj, rodzaj numeru (np. płatny 70x) i okoliczności.</p>
                                    </div>
                                )}

                                {mode === 'image' && (
                                    <div className="fade-in">
                                        <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
                                        {!image ? (
                                            <button onClick={() => fileRef.current?.click()} onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files?.[0]); }} className="w-full border-2 border-dashed border-slate-600 hover:border-indigo-400 rounded-2xl py-12 px-4 text-center transition group">
                                                <i className="ph-duotone ph-upload-simple text-5xl text-indigo-300 group-hover:scale-110 transition inline-block"></i>
                                                <p className="text-white font-bold mt-3">Dodaj zrzut ekranu</p>
                                                <p className="text-sm text-slate-400 mt-1">Kliknij, przeciągnij plik albo wklej (Ctrl+V). Np. reklama z Facebooka, ogłoszenie, SMS.</p>
                                            </button>
                                        ) : (
                                            <div className="flex flex-col sm:flex-row gap-4 items-start">
                                                <img src={image} alt="Podgląd zrzutu ekranu" className="w-full sm:w-48 max-h-72 object-contain rounded-xl border border-slate-700 bg-slate-950" />
                                                <div className="flex-1 w-full">
                                                    <p className="text-sm text-slate-300 mb-2"><i className="ph-bold ph-image mr-1"></i>{imageName}</p>
                                                    <textarea value={text} onChange={(e) => setText(e.target.value)} rows={3} maxLength={2000} placeholder="(opcjonalnie) dopisz kontekst, np. „reklama sklepu na Facebooku”" className="w-full bg-slate-950/70 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-400"></textarea>
                                                    <button onClick={() => { setImage(''); setImageName(''); }} className="mt-2 text-xs font-bold text-slate-400 hover:text-rose-300"><i className="ph-bold ph-trash mr-1"></i>Usuń obraz</button>
                                                </div>
                                            </div>
                                        )}
                                        <p className="text-xs text-slate-500 mt-3"><i className="ph-bold ph-eye-slash mr-1"></i>Zakryj swoje dane osobowe, jeśli są widoczne na zrzucie. Nie zapisujemy obrazów.</p>
                                    </div>
                                )}

                                <button onClick={runCheck} disabled={!canSubmit} className="btn-bounce mt-6 w-full py-4 rounded-2xl font-bold text-lg text-white flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 via-indigo-500 to-emerald-500 hover:brightness-110 shadow-lg shadow-indigo-900/40 disabled:opacity-40 disabled:cursor-not-allowed transition">
                                    {loading ? <><i className="ph-bold ph-spinner-gap animate-spin text-xl"></i> Sprawdzam…</> : <><i className="ph-bold ph-shield-check text-xl"></i> Sprawdź</>}
                                </button>

                                {loading && (
                                    <ul className="mt-6 space-y-2.5 fade-in">
                                        {STEPS.map((s, i) => (
                                            <li key={s} className={`flex items-center gap-3 text-sm transition-colors ${i < step ? 'text-emerald-300' : i === step ? 'text-white' : 'text-slate-600'}`}>
                                                <span className={`step-dot ${i < step ? 'bg-emerald-400' : i === step ? 'bg-indigo-400 animate-pulse' : 'bg-slate-700'}`}></span>{s}
                                            </li>
                                        ))}
                                    </ul>
                                )}

                                {error && (
                                    <div className="mt-5 p-4 bg-rose-950/40 border border-rose-500/40 rounded-2xl text-rose-200 text-sm flex items-start gap-3">
                                        <i className="ph-bold ph-warning-circle text-lg flex-shrink-0"></i><p>{error}</p>
                                    </div>
                                )}
                            </section>

                            {/* WYNIK */}
                            {result && meta && (
                                <section ref={resultRef} className={`mt-8 glass rounded-[2rem] p-6 sm:p-8 border-2 ${meta.ring} ${meta.glow} pop-in scroll-mt-24`}>
                                    <div className="text-center">
                                        <Gauge level={result.level} />
                                        <p className={`text-xs font-bold uppercase tracking-[0.25em] mt-2 ${meta.text}`}>{meta.short}</p>
                                        <h2 className="font-display text-3xl sm:text-4xl font-bold text-white mt-1">{meta.emoji} {meta.label}</h2>
                                        <p className="text-slate-300 mt-3 max-w-2xl mx-auto leading-relaxed">{meta.lead}</p>
                                        {result.headline && <p className={`mt-4 inline-block px-4 py-2 rounded-xl border text-sm ${meta.chip}`}>{result.headline}</p>}
                                        {result.scamType && <p className="mt-3 text-sm text-slate-400">Przypomina schemat: <strong className="text-slate-200">{result.scamType}</strong></p>}
                                    </div>

                                    {result.signals?.length > 0 && (
                                        <div className="mt-8">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Sygnały ostrzegawcze</h3>
                                            <ul className="space-y-3">
                                                {result.signals.map((s, i) => (
                                                    <li key={i} className="relative overflow-hidden bg-slate-950/50 border border-slate-800 rounded-2xl p-4 pl-5 fade-in" style={{ animationDelay: `${i * 0.06}s` }}>
