        body {

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-amber-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>

            try {

                    })
                    .then(data => {
                        document.getElementById('wspolne-menu-kontener').innerHTML = data;
                        if (typeof window.initMenuLogic === 'function') {

            } catch (error) { wstawMenuAwaryjne(); }

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <!-- MAIN APP SCRIPT -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useRef, useEffect } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }
        
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                Word: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        const PROMPTS = {
            zgoda: `Jesteś ekspertem prawno-oświatowym. Przekształć luźną notatkę nauczyciela na bezpieczny, oficjalny FORMULARZ ZGODY RODZICÓW na wycieczkę/wyjście. 
Zadbaj o formułki: zgoda na udział, koszt, oświadczenie o braku przeciwwskazań zdrowotnych, zgoda na interwencję medyczną, sposób powrotu (odbiór/samodzielnie) oraz telefony kontaktowe. Używaj kropek ........... na dane do wpisania.`,
            protokol: `Jesteś bezdusznym szkolnym biurokratą. Przekształć notatki w wysoce sformalizowany PROTOKÓŁ Z ZEBRANIA Z RODZICAMI. 
Użyj sztywnego języka. Podaj Porządek zebrania, Przebieg (np. "Wychowawca zapoznał...", "Omówiono..."), Wnioski i miejsce na podpis.`,
            notatka: `Jesteś perfekcyjnym szkolnym biurokratą. Przekształć notatki w oficjalną NOTATKĘ SŁUŻBOWĄ (z incydentu, spotkania itp.).
Używaj trybu bezosobowego ("Doszło do...", "Uczeń naruszył..."). Unikaj emocji. Wymień wnioski/zalecenia.`,
            sprawozdanie: `Jesteś szkolnym biurokratą. Przekształć notatkę z wycieczki w oficjalne SPRAWOZDANIE Z WYCIECZKI. 
Dopisz "urzędnicze" cele edukacyjne (realizacja podstawy, integracja). Użyj oficjalnego języka do opisu przebiegu.`,
            opinia_ppp: `Jesteś doświadczonym pedagogiem szkolnym. Przekształć luźne uwagi wychowawcy w profesjonalną OPINIĘ O UCZNIU DO PORADNI PSYCHOLOGICZNO-PEDAGOGICZNEJ.
Zachowaj układ: 1. Funkcjonowanie poznawcze (skupienie, tempo pracy), 2. Funkcjonowanie emocjonalno-społeczne (relacje z rówieśnikami, radzenie sobie ze złością), 3. Mocne strony ucznia, 4. Podjęte działania pomocowe w szkole. Używaj fachowej terminologii (np. "deficyty koncentracji uwagi", "wzmożona labilność emocjonalna").`,
            nagroda: `Jesteś wicedyrektorem szkoły. Przekształć krótkie hasła o sukcesach nauczyciela w piękny, urzędowy WNIOSEK O PRZYZNANIE NAGRODY DYREKTORA/BURMISTRZA za osiągnięcia dydaktyczno-wychowawcze. 
Używaj podniosłego języka, np.: "wykazuje się ponadprzeciętnym zaangażowaniem", "innowacyjne metody pracy", "aktywizuje środowisko lokalne".`,
            wezwanie: `Jesteś stanowczym dyrektorem. Stwórz oficjalne WEZWANIE RODZICÓW/OPIEKUNÓW PRAWNYCH do szkoły na podstawie podanego powodu. 
Ton pisma ma być oficjalny, kategoryczny, powołujący się na współpracę ze szkołą. Podaj miejsce na wyznaczenie terminu (kropki) i ostrzeżenie o ewentualnym powiadomieniu Sądu Rodzinnego w przypadku braku współpracy (jeśli sprawa jest poważna).`
        };

        const TABS = [
            { id: 'zgoda', title: 'Zgoda Wycieczka', icon: '📝' },
            { id: 'notatka', title: 'Notatka Służbowa', icon: '📎' },
            { id: 'protokol', title: 'Protokół Zebrania', icon: '📋' },
            { id: 'opinia_ppp', title: 'Opinia do Poradni', icon: '🧠', new: true },
            { id: 'sprawozdanie', title: 'Sprawozdanie', icon: '📊' },
            { id: 'nagroda', title: 'Wniosek Nagroda', icon: '🏆', new: true },
            { id: 'wezwanie', title: 'Wezwanie Rodzica', icon: '✉️', new: true },
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator');

            const [activeTab, setActiveTab] = useState('zgoda');
            const [inputText, setInputText] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });
            
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edubiurokrata_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const updateAndCheckLimit = () => {
                if (isPro) return true; 

                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData(prev => ({ ...prev, remaining: 0, showWarning: true }));
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateResponse = async () => {
                if (!inputText.trim()) {
                    setError('Proszę wpisać wytyczne dla AI.');
                    return;
                }

                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setError('');
                setGeneratedText('');

                try {
                    const systemInstruction = PROMPTS[activeTab];
                    const finalPrompt = `Stwórz dokument na podstawie tych informacji. Pamiętaj aby usunąć z niego wrażliwe dane ucznia i zastąpić je inicjałami lub wykropkowaniem:\n\n"""\n${inputText}\n"""`;

                    const payload = {
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { temperature: 0.2 } 
                    };

                    let data;
                    if (window.location.hostname !== '' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ payload, type: 'text' })
                        });
                        if (!response.ok) throw new Error(`Błąd serwera API: ${response.status}`);
                        data = await response.json();
                    } else {
                        throw new Error("LocalTest");
                    }

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        setGeneratedText(text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim());
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setError('Tryb lokalny.');
                        setGeneratedText(`[TEST LOKALNY]\nWygenerowano tekst pomyślnie na dysku lokalnym.\nGdy wgrasz ten plik na serwer Vercel, połączy się on z API i wygeneruje poprawny dokument.`);
                    } else {
                        setError('Wystąpił błąd serwera. Spróbuj ponownie.');
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = (text) => {
                if (!text) return;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Skopiowano do schowka!');
            };

            const exportToWord = (text, title) => {
                if (!text) return;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${title}</title><style>body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: #000; text-align: justify; }</style></head><body>`;
                const footer = `</body></html>`;
                const formattedText = text.replace(/\n/g, '<br>');
                const blob = new Blob(['\ufeff', header + formattedText + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${title.replace(/\s+/g, '_')}.doc`; link.click();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj krótki tytuł!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edubiurokrata_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            mode: activeTab,
                            docType: TABS.find(t=>t.id===activeTab).title,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            return (
                <div className="relative flex flex-col min-h-screen">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-amber-500 text-slate-900 px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.4)] font-bold text-sm animate-toast flex items-center gap-3 border border-amber-400`}>
                            <Icon name="AlertCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-amber-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Bazie Wzorów</h3>
                                <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs font-bold mb-4">
                                    AI wymazało wrażliwe dane z tekstu. Możesz bezpiecznie opublikować ten formularz/pismo dla innych.
                                </div>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł pisma</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Zgoda na wyjście do kina" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-amber-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10">
                        <div className="max-w-6xl mx-auto">
                            
                            <div className="text-center mb-8 fade-in">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Edu<span className="text-gradient">Biurokrata</span>
                                </h1>
                                <p className="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto">
                                    Wybierz typ dokumentu, wpisz krótką notatkę, a AI zajmie się urzędowym stylem i wymogami prawnymi.
                                </p>
                            </div>

                            {/* TOGGLE WIDOKÓW */}
                            <div className="flex justify-center mb-8 print-hidden fade-in">
                                <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg w-full max-w-md">
                                    <button onClick={() => setViewMode('kreator')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 ${viewMode === 'kreator' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Sparkles" size={16} /> Kreator Pism
                                    </button>
                                    <button onClick={() => setViewMode('biblioteka')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-indigo-600 text-white shadow-[0_0_15px_rgba(79,70,229,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Library" size={16} /> Baza Wzorów 
                                    </button>
                                </div>
                            </div>

                            {viewMode === 'kreator' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] max-w-4xl mx-auto">
                                    
                                    {limitData.showWarning && !isPro && (
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in relative overflow-hidden">
                                            <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                            <p className="text-slate-300 mb-4 text-sm sm:text-base">
                                                Aby korzystać z modułu AI bez limitów, wpisz kod PRO na górnym pasku w menu.
                                            </p>
                                        </div>
                                    )}

                                    <div className="flex overflow-x-auto custom-scrollbar pb-4 gap-2 mb-6 fade-in" style={{animationDelay: '0.1s'}}>
                                        {TABS.map((tab) => (
                                            <button 
                                                key={tab.id}
                                                onClick={() => setActiveTab(tab.id)}
                                                className={`flex-shrink-0 relative flex items-center gap-2 px-4 py-3 rounded-xl border transition-all duration-200 ${activeTab === tab.id ? 'bg-amber-500/10 border-amber-500 text-white shadow-[0_0_15px_rgba(245,158,11,0.15)]' : 'glass-panel border-slate-700/50 text-slate-400 hover:text-slate-200 hover:border-slate-500'}`}
                                            >
                                                <span className="text-lg">{tab.icon}</span>
                                                <span className="font-semibold text-sm whitespace-nowrap">{tab.title}</span>
                                                {tab.new && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full shadow-lg">NOWE</span>}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="glass-panel p-5 sm:p-8 rounded-3xl fade-in border border-slate-700 shadow-xl" style={{animationDelay: '0.2s'}}>
                                        <label className="block text-white font-bold mb-3 flex items-center justify-between">
                                            <span>Skrótowe wytyczne dla AI:</span>
                                        </label>
                                        
                                        <textarea 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="Napisz tu swoimi słowami, w skrócie, o co chodzi w piśmie. Im gorzej napiszesz, tym lepiej AI pokaże na co je stać..."
                                            className="w-full h-32 sm:h-40 bg-slate-900/70 border border-slate-600 text-slate-100 rounded-2xl p-4 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 custom-scrollbar resize-y text-sm sm:text-base placeholder-slate-500 leading-relaxed"
                                        ></textarea>

                                        {error && (
                                            <div className="mt-4 p-3 bg-red-900/30 border border-red-500/30 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>
                                        )}

                                        <button 
                                            onClick={generateResponse}
                                            disabled={isGenerating || !inputText.trim() || (!isPro && limitData.remaining === 0)}
                                            className={`w-full mt-6 py-4 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-lg btn-bounce
                                                ${isGenerating ? 'bg-slate-700 cursor-wait' : (!isPro && limitData.remaining === 0) ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700' : 'bg-gradient-to-r from-amber-600 to-red-600 hover:shadow-amber-500/25'}`}
                                        >
                                            {isGenerating ? (
                                                <span className="flex items-center gap-2">
                                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                                    Generowanie urzędowego stylu...
                                                </span>
                                            ) : (
                                                <span><Icon name="Sparkles" className="inline-block w-5 h-5 mr-1" /> Generuj Dokument ({TABS.find(t=>t.id===activeTab).title})</span>
                                            )}
                                        </button>
                                    </div>

                                    {generatedText && (
                                        <div ref={resultRef} className="mt-8 glass-panel p-5 sm:p-8 rounded-3xl fade-in border-amber-500/30 shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-4 border-b border-slate-700 pb-4">
                                                <h3 className="text-lg font-bold text-amber-500 flex items-center gap-2">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                    Gotowy Dokument
                                                </h3>
                                                <div className="flex flex-wrap gap-2">
                                                    <button onClick={() => setShowPublishModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce shadow-md">
                                                        <Icon name="Share" size={16}/> Jako Wzór
                                                    </button>
                                                    <button onClick={() => exportToWord(generatedText, TABS.find(t=>t.id===activeTab).title)} className="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                        <Icon name="Word" size={16}/> Word
                                                    </button>
                                                    <button onClick={() => copyToClipboard(generatedText)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors btn-bounce">
                                                        <Icon name="Copy" size={16}/> Kopiuj
                                                    </button>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-white p-6 sm:p-8 rounded-xl shadow-inner min-h-[300px]">
                                                <p className="text-black whitespace-pre-wrap font-serif text-sm sm:text-base leading-relaxed">
                                                    {generatedText}
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {viewMode === 'biblioteka' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] w-full">
                                    <div className="text-center max-w-3xl mx-auto mb-10">
                                        <h2 className="text-3xl font-black text-indigo-400 mb-2">Szkolna Baza Pism</h2>
                                        <p className="text-slate-400">Przeglądaj, kopiuj i pobieraj gotowe wzory dokumentów stworzonych przez innych nauczycieli.</p>
                                    </div>
                                    
                                    {libraryItems.length === 0 ? (
                                        <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                            <div className="text-5xl mb-4">📚</div>
                                            <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                            <p className="text-slate-400">Bądź pierwszy! Wygeneruj pismo i dodaj je do Biblioteki Wzorów.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[600px] border-indigo-500/30 hover:border-indigo-500/60">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-indigo-500/20 text-indigo-400">
                                                            {item.docType}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white mb-4 leading-tight">{item.title}</h3>
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-y-auto custom-scrollbar font-serif text-justify">
                                                        {item.content}
                                                    </div>
                                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                        <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                            <Icon name="Copy" size={16} />
                                                        </button>
                                                        <button onClick={() => exportToWord(item.content, item.title)} className="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                            <Icon name="Word" size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </div>

                    <footer className="py-6 border-t border-slate-800/50 text-center text-xs font-bold text-slate-500 uppercase tracking-widest mt-auto">
                        Część potężnego systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
