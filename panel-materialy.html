    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const appId = window.__app_id;
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        window.__materialyReady = new Promise((resolve) => {
            onAuthStateChanged(auth, (user) => { if (user) resolve({ db, appId, uid: user.uid }); });
            signInAnonymously(auth).catch((e) => console.error("Firebase Auth Error:", e));
        });

        window.__materialyApi = {
            collectionRef: (deps) => collection(deps.db, 'artifacts', deps.appId, 'public', 'data', 'materialy_katalog'),
            query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp,
        };

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0; let val = bytes;
            while (val >= 1024 && i < units.length - 1) { val /= 1024; i += 1; }
            return `${val.toFixed(val < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
        }

        function iconForFile(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (ext === 'pdf') return 'ph-file-pdf text-red-400';
            if (['doc', 'docx'].includes(ext)) return 'ph-file-doc text-blue-400';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return 'ph-file-audio text-emerald-400';
            if (['zip', 'rar', '7z'].includes(ext)) return 'ph-file-zip text-amber-400';
            if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) return 'ph-file-image text-fuchsia-400';
            return 'ph-file text-slate-400';
        }

        function createBasicHeader(user, pass) {
            const bytes = new TextEncoder().encode(`${user}:${pass}`);
            let binary = '';
            bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
            return `Basic ${btoa(binary)}`;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = reader.result || '';
                    const commaIndex = result.indexOf(',');
                    resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function apiCall(authHeader, action, payload) {
            const res = await fetch('/api/verify-code', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', Authorization: authHeader },
                body: JSON.stringify({ action, ...payload }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const error = new Error(data.error || `Błąd serwera (HTTP ${res.status}).`);
                error.status = res.status;
                throw error;
            }
            return data;
        }

        function LoginForm({ onZaloguj }) {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const [blad, setBlad] = useState('');

            const submit = (e) => {
                e.preventDefault();
                if (!user || !pass) { setBlad('Podaj login i hasło.'); return; }
                onZaloguj(createBasicHeader(user, pass));
            };

            return (
                <div className="max-w-md mx-auto mt-20 card-bg rounded-2xl p-8 fade-in">
                    <div className="h-12 w-12 rounded-2xl bg-indigo-500/15 text-indigo-300 flex items-center justify-center text-2xl mb-4"><i className="ph-bold ph-lock-key"></i></div>
                    <h1 className="text-2xl font-black text-white">Panel Materiałów</h1>
                    <p className="text-sm text-slate-400 mt-2 leading-relaxed">Użyj tego samego loginu i hasła co w prywatnych narzędziach Ewy i Ani. Dane nie są nigdzie zapisywane — znikną po zamknięciu tej karty.</p>
                    <form onSubmit={submit} className="mt-5 space-y-3">
                        <label className="block"><span className="text-xs font-bold text-slate-400">Login</span>
                            <input value={user} onChange={(e) => setUser(e.target.value)} type="text" autoComplete="username" className="input-bg mt-1 w-full rounded-xl px-4 py-3" />
                        </label>
                        <label className="block"><span className="text-xs font-bold text-slate-400">Hasło</span>
                            <input value={pass} onChange={(e) => setPass(e.target.value)} type="password" autoComplete="current-password" className="input-bg mt-1 w-full rounded-xl px-4 py-3" />
                        </label>
                        {blad && <p className="text-sm text-red-400"><i className="ph-bold ph-warning-circle mr-1"></i>{blad}</p>}
                        <button type="submit" className="btn-bounce w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl font-black transition-colors"><i className="ph-bold ph-sign-in"></i>Wejdź do panelu</button>
                    </form>
                </div>
            );
        }

        const { SEKCJE, SEKCJA_IDS, sekcjaPakietu, stronyPodgladu, parsujStrony, adresPodgladu, ilePakietow } = window.EduMaterialy;

        // ---------- Podgląd: strony PDF renderowane w przeglądarce (pdf.js) ze znakiem wodnym ----------
        // Obrazki są małe (720 px, JPEG) i mają znak wodny – wystarczą, żeby zobaczyć, co jest w pakiecie,
        // ale nie nadają się do druku. Trafiają do Storage do katalogu podglady/ i są publiczne.
        let pdfjsPromise = null;
        function zaladujPdfJs() {
            if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
            if (!pdfjsPromise) {
                pdfjsPromise = new Promise((resolve, reject) => {
                    const sc = document.createElement('script');
                    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                    sc.onload = () => {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        resolve(window.pdfjsLib);
                    };
                    sc.onerror = () => { pdfjsPromise = null; reject(new Error('Nie udało się wczytać biblioteki pdf.js.')); };
                    document.head.appendChild(sc);
                });
            }
            return pdfjsPromise;
        }

        function znakWodny(ctx, w, h) {
            ctx.save();
            ctx.translate(w / 2, h / 2);
            ctx.rotate(-Math.PI / 6);
            ctx.font = `800 ${Math.round(w / 15)}px Inter, Arial, sans-serif`;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.12)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const krokY = Math.round(w / 4);
            for (let y = -h, rzad = 0; y <= h; y += krokY, rzad += 1) {
                for (let x = -w; x <= w; x += w * 0.95) ctx.fillText('PODGLĄD • eduboxpro.pl', x + (rzad % 2 ? w * 0.47 : 0), y);
            }
            ctx.restore();
        }

        function losowyId() { return Math.random().toString(36).slice(2, 8); }

        async function wgrajObrazek(authHeader, canvas, nazwa) {
            const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
            const path = `podglady/${Date.now()}_${losowyId()}_${nazwa}.jpg`;
            await apiCall(authHeader, 'materialy-upload', { path, contentType: 'image/jpeg', dataBase64: dataUrl.split(',')[1] });
            return { path, w: canvas.width, h: canvas.height };
        }

        async function utworzPodglad({ authHeader, dane, strony, onPostep }) {
            const pdfjs = await zaladujPdfJs();
            const pdf = await pdfjs.getDocument({ data: dane }).promise;
            const liczba = pdf.numPages;
            let wybrane = strony && strony.trim() ? parsujStrony(strony, liczba) : [];
            if (!wybrane.length) wybrane = stronyPodgladu(liczba, 8);
            const podglad = [];
            for (let i = 0; i < wybrane.length; i += 1) {
                onPostep && onPostep(`Podgląd: strona ${wybrane[i]} (${i + 1} z ${wybrane.length})…`);
                const page = await pdf.getPage(wybrane[i]);
                const v1 = page.getViewport({ scale: 1 });
                const viewport = page.getViewport({ scale: 720 / v1.width });
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(viewport.width);
                canvas.height = Math.round(viewport.height);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport }).promise;
                znakWodny(ctx, canvas.width, canvas.height);
                const obraz = await wgrajObrazek(authHeader, canvas, `s${wybrane[i]}`);
                podglad.push({ ...obraz, strona: wybrane[i] });
            }
            return { podglad, stron: liczba };
        }

        // Okładka z własnego obrazka (np. pina z Pinteresta) – zmniejszona do 900 px, bez znaku wodnego.
        function plikDoCanvas(file, max) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const skala = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * skala);
                    canvas.height = Math.round(img.height * skala);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Nie udało się odczytać obrazka okładki.')); };
                img.src = url;
            });
        }

        async function pobierzJakoAdmin(authHeader, path) {
            const res = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: authHeader },
                body: JSON.stringify({ action: 'materialy-download', path }),
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                const error = new Error(data.error || `Błąd serwera (HTTP ${res.status}).`);
                error.status = res.status;
                throw error;
            }
            return res.arrayBuffer();
        }

        async function usunPliki(authHeader, sciezki) {
            for (const path of sciezki.filter(Boolean)) {
                try { await apiCall(authHeader, 'materialy-delete', { path }); }
                catch (e) { if (e.status === 401) throw e; console.warn('Nie udało się usunąć pliku', path, e); }
            }
        }

        // Zapis katalogu idzie przez serwer (konto usługi) – reguły Firestore nie pozwalają przeglądarce zmieniać katalogu.
        function zapiszKatalog(authHeader, op, id, data) {
            return apiCall(authHeader, 'materialy-zapisz', { op, id, data });
        }

        const sciezkiPodgladu = (pakiet) => [...(pakiet.podglad || []).map((p) => p.path), pakiet.okladka && pakiet.okladka.path];
        const jestPdf = (nazwa) => /\.pdf$/i.test(nazwa || '');

        function WyborSekcji({ wartosc, onZmiana }) {
            return (
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {SEKCJE.map((s) => (
                        <button key={s.id} type="button" onClick={() => onZmiana(s.id)} aria-pressed={wartosc === s.id}
                            className={`chip rounded-xl px-3 py-2.5 text-sm font-bold border text-left ${wartosc === s.id ? 'bg-indigo-600/30 border-indigo-500 text-indigo-100' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                            <i className={`ph-bold ${s.icon} mr-1.5`}></i>{s.label}
                        </button>
                    ))}
                </div>
            );
        }

        function PusteFolderyChip({ nazwa, aktywna, onClick, onRename, onDelete }) {
            return (
                <div className={`chip flex items-center gap-1.5 rounded-full pl-4 pr-1.5 py-1.5 text-sm font-bold border ${aktywna ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-slate-800/60 border-slate-700 text-slate-300'}`}>
                    <button onClick={onClick} className="btn-bounce">{nazwa}</button>
                    <button onClick={onRename} title="Zmień nazwę katalogu" className="btn-bounce w-6 h-6 flex items-center justify-center rounded-full hover:bg-slate-700 text-slate-400"><i className="ph-bold ph-pencil-simple text-xs"></i></button>
                    <button onClick={onDelete} title="Usuń katalog i wszystkie pakiety w nim" className="btn-bounce w-6 h-6 flex items-center justify-center rounded-full hover:bg-red-900/50 text-red-400"><i className="ph-bold ph-trash text-xs"></i></button>
                </div>
            );
        }

        function FormularzPakietu({ authHeader, onAuthError, deps, edytowany, onZapisano, onAnuluj, pakiety, sekcjaDomyslna }) {
            const [sekcja, setSekcja] = useState(edytowany ? sekcjaPakietu(edytowany) : sekcjaDomyslna);
            const folderyIstniejace = [...new Set(pakiety.filter((p) => sekcjaPakietu(p) === sekcja).map((p) => p.kategoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pl'));
            const [tytul, setTytul] = useState(edytowany ? edytowany.title : '');
            const [opis, setOpis] = useState(edytowany ? edytowany.opis : '');
            const [folder, setFolder] = useState(edytowany ? edytowany.kategoria : (folderyIstniejace[0] || ''));
            const [nowyFolder, setNowyFolder] = useState('');
            const [trybNowyFolder, setTrybNowyFolder] = useState(folderyIstniejace.length === 0);
            const [pliki, setPliki] = useState([]);
            const [zrobPodglad, setZrobPodglad] = useState(true);
            const [stronyTekst, setStronyTekst] = useState('');
            const [okladkaPlik, setOkladkaPlik] = useState(null);
            const [wgrywanie, setWgrywanie] = useState(false);
            const [postep, setPostep] = useState('');
            const [blad, setBlad] = useState('');
            const fileRef = useRef(null);

            const zmienSekcje = (id) => {
                setSekcja(id);
                if (edytowany && sekcjaPakietu(edytowany) === id) { setFolder(edytowany.kategoria); setTrybNowyFolder(false); return; }
                const listaW = [...new Set(pakiety.filter((p) => sekcjaPakietu(p) === id).map((p) => p.kategoria).filter(Boolean))];
                setFolder(listaW[0] || '');
                setTrybNowyFolder(listaW.length === 0);
            };

            const handlePliki = (e) => setPliki(Array.from(e.target.files || []));
            const nowyPdf = pliki.find((p) => jestPdf(p.name));

            const zapisz = async () => {
                setBlad('');
                const finalFolder = (trybNowyFolder ? nowyFolder : folder).trim();
                if (!tytul.trim()) { setBlad('Podaj tytuł pakietu.'); return; }
                if (!finalFolder) { setBlad('Wybierz katalog albo podaj nazwę nowego.'); return; }
                if (!edytowany && pliki.length === 0) { setBlad('Dodaj przynajmniej jeden plik.'); return; }

                setWgrywanie(true);
                try {
                    const api = window.__materialyApi;
                    let plikiZapisane = edytowany ? (edytowany.pliki || []) : [];
                    const zmiany = {};

                    for (let i = 0; i < pliki.length; i += 1) {
                        const plik = pliki[i];
                        setPostep(`Wgrywam plik ${i + 1} z ${pliki.length}: ${plik.name}…`);
                        const sciezka = `materialy/${Date.now()}_${plik.name.replace(/[\\/]/g, '_')}`;
                        const dataBase64 = await fileToBase64(plik);
                        await apiCall(authHeader, 'materialy-upload', { path: sciezka, contentType: plik.type || 'application/octet-stream', dataBase64 });
                        plikiZapisane = [...plikiZapisane, { name: plik.name, size: plik.size, path: sciezka }];
                    }

                    if (zrobPodglad && nowyPdf) {
                        const wynik = await utworzPodglad({ authHeader, dane: await nowyPdf.arrayBuffer(), strony: stronyTekst, onPostep: setPostep });
                        if (edytowany) await usunPliki(authHeader, (edytowany.podglad || []).map((p) => p.path));
                        zmiany.podglad = wynik.podglad;
                        zmiany.stron = wynik.stron;
                    }
                    if (okladkaPlik) {
                        setPostep('Wgrywam okładkę…');
                        zmiany.okladka = await wgrajObrazek(authHeader, await plikDoCanvas(okladkaPlik, 900), 'okladka');
                        if (edytowany && edytowany.okladka) await usunPliki(authHeader, [edytowany.okladka.path]);
                    }

                    setPostep('Zapisuję dane pakietu…');
                    const dane = { title: tytul.trim(), opis: opis.trim(), sekcja, kategoria: finalFolder, pliki: plikiZapisane, ...zmiany };
                    if (edytowany) await zapiszKatalog(authHeader, 'update', edytowany.id, dane);
                    else await zapiszKatalog(authHeader, 'create', null, dane);
                    onZapisano(sekcja);
                } catch (e) {
                    console.error(e);
                    if (e.status === 401) { onAuthError(); return; }
                    setBlad('Nie udało się zapisać: ' + e.message);
                } finally {
                    setWgrywanie(false);
                    setPostep('');
                }
            };

            return (
                <div className="card-bg rounded-2xl p-6 mb-8 fade-in">
                    <h3 className="font-black text-lg text-slate-100 mb-4 flex items-center gap-2">
                        <i className="ph-bold ph-plus-circle text-indigo-400"></i>
                        {edytowany ? 'Edytuj pakiet' : 'Dodaj nowy pakiet'}
                    </h3>
                    <div className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Sekcja *</label>
                            <WyborSekcji wartosc={sekcja} onZmiana={zmienSekcje} />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Katalog w sekcji *</label>
                            {folderyIstniejace.length > 0 && !trybNowyFolder && (
                                <div className="flex flex-wrap gap-2 mb-2">
                                    {folderyIstniejace.map((f) => (
                                        <button key={f} type="button" onClick={() => setFolder(f)} className={`chip rounded-full px-3 py-1.5 text-xs font-bold border ${folder === f ? 'bg-indigo-600/30 border-indigo-500 text-indigo-200' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>{f}</button>
                                    ))}
                                </div>
                            )}
                            {folderyIstniejace.length > 0 && (
                                <button type="button" onClick={() => setTrybNowyFolder(!trybNowyFolder)} className="text-xs font-bold text-indigo-400 hover:text-indigo-300 mb-2">
                                    {trybNowyFolder ? '← wybierz z istniejących katalogów' : '+ nowy katalog'}
                                </button>
                            )}
                            {trybNowyFolder && (
                                <input type="text" value={nowyFolder} onChange={(e) => setNowyFolder(e.target.value)} placeholder="np. Październik, Dzień Jeża, Jesień…" className="input-bg w-full rounded-lg px-3 py-2.5 text-sm" />
                            )}
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">Tytuł pakietu *</label>
                            <input type="text" value={tytul} onChange={(e) => setTytul(e.target.value)} placeholder="np. Dzień Jeża – przedszkole" className="input-bg w-full rounded-lg px-3 py-2.5 text-sm" />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">Opis</label>
                            <textarea value={opis} onChange={(e) => setOpis(e.target.value)} rows={3} placeholder="Krótki opis zawartości pakietu, dla kogo jest, jak z niego korzystać" className="input-bg w-full rounded-lg px-3 py-2.5 text-sm resize-none"></textarea>
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">{edytowany ? 'Dodaj kolejne pliki (opcjonalnie)' : 'Pliki pakietu *'}</label>
                            <input ref={fileRef} type="file" multiple onChange={handlePliki} className="input-bg w-full rounded-lg px-3 py-2.5 text-sm file:mr-3 file:rounded-md file:border-0 file:bg-indigo-600 file:text-white file:px-3 file:py-1.5 file:text-xs file:font-bold" />
                            {pliki.length > 0 && (
                                <ul className="mt-2 space-y-1">
                                    {pliki.map((p, i) => (<li key={i} className="text-xs text-slate-400 flex items-center gap-2"><i className={`ph-bold ${iconForFile(p.name)}`}></i>{p.name} ({formatBytes(p.size)})</li>))}
                                </ul>
                            )}
                            {edytowany && edytowany.pliki && edytowany.pliki.length > 0 && (
                                <p className="text-xs text-slate-500 mt-2">Już zapisane pliki: {edytowany.pliki.map((p) => p.name).join(', ')}</p>
                            )}
                        </div>
                        <div className="rounded-xl border border-slate-700 bg-slate-900/50 p-4 space-y-3">
                            <p className="text-xs font-bold uppercase tracking-wide text-slate-400"><i className="ph-bold ph-eye mr-1"></i>Podgląd dla odwiedzających</p>
                            <label className={`flex items-start gap-2 text-sm ${nowyPdf ? 'text-slate-200' : 'text-slate-500'}`}>
                                <input type="checkbox" checked={zrobPodglad && !!nowyPdf} disabled={!nowyPdf} onChange={(e) => setZrobPodglad(e.target.checked)} className="mt-1" />
                                <span>Utwórz podgląd z PDF {nowyPdf ? `„${nowyPdf.name}”` : '(dodaj plik PDF)'} – wybrane strony w niskiej rozdzielczości ze znakiem wodnym „PODGLĄD”.</span>
                            </label>
                            {zrobPodglad && nowyPdf && (
                                <input type="text" value={stronyTekst} onChange={(e) => setStronyTekst(e.target.value)} placeholder="Strony, np. 1, 2, 5-7, 20 (puste = automatycznie 8 stron z całego pakietu)" className="input-bg w-full rounded-lg px-3 py-2 text-sm" />
                            )}
                            <label className="block">
                                <span className="text-xs text-slate-400">Okładka (opcjonalnie – np. pin z Pinteresta; bez niej okładką jest pierwsza strona podglądu)</span>
                                <input type="file" accept="image/*" onChange={(e) => setOkladkaPlik((e.target.files || [])[0] || null)} className="input-bg mt-1 w-full rounded-lg px-3 py-2 text-sm file:mr-3 file:rounded-md file:border-0 file:bg-slate-700 file:text-white file:px-3 file:py-1 file:text-xs file:font-bold" />
                            </label>
                            {edytowany && (edytowany.podglad || []).length > 0 && <p className="text-xs text-slate-500">Obecny podgląd: {(edytowany.podglad || []).length} stron. Nowy PDF z zaznaczoną opcją zastąpi go.</p>}
                        </div>
                        {blad && <p className="text-sm text-red-400 flex items-center gap-1"><i className="ph-bold ph-warning-circle"></i>{blad}</p>}
                        {postep && <p className="text-sm text-indigo-300 flex items-center gap-2"><i className="ph-bold ph-circle-notch animate-spin"></i>{postep}</p>}
                    </div>
                    <div className="flex items-center gap-3 mt-6">
                        <button onClick={zapisz} disabled={wgrywanie} className="btn-bounce flex-1 inline-flex items-center justify-center gap-2 text-sm font-bold text-white bg-indigo-600 rounded-lg px-4 py-2.5 hover:bg-indigo-500 transition-colors disabled:opacity-40">
                            <i className="ph-bold ph-floppy-disk"></i>{wgrywanie ? 'Zapisywanie…' : 'Zapisz pakiet'}
                        </button>
                        <button onClick={onAnuluj} disabled={wgrywanie} className="btn-bounce inline-flex items-center justify-center gap-2 text-sm font-bold text-slate-300 bg-slate-800 rounded-lg px-4 py-2.5 hover:bg-slate-700 transition-colors">Anuluj</button>
                    </div>
                </div>
            );
        }

        function KartaPakietu({ pakiet, authHeader, deps, onEdytuj, onUsun, onAuthError }) {
            const [praca, setPraca] = useState('');
            const okladka = pakiet.okladka || (pakiet.podglad || [])[0];
            const pdf = (pakiet.pliki || []).find((p) => jestPdf(p.name));
            const api = window.__materialyApi;

            const zmienSekcje = async (id) => {
                try { await zapiszKatalog(authHeader, 'update', pakiet.id, { sekcja: id }); }
                catch (e) { if (e.status === 401) { onAuthError(); return; } alert('Nie udało się zmienić sekcji: ' + e.message); }
            };

            const odswiezPodglad = async () => {
                if (!pdf) return;
                const strony = window.prompt(`Strony do podglądu z „${pdf.name}” (np. 1, 2, 5-7). Zostaw puste, żeby wybrać automatycznie 8 stron z całego pakietu.`, '');
                if (strony === null) return;
                try {
                    setPraca('Pobieram PDF…');
                    const dane = await pobierzJakoAdmin(authHeader, pdf.path);
                    const wynik = await utworzPodglad({ authHeader, dane, strony, onPostep: setPraca });
                    const stare = (pakiet.podglad || []).map((p) => p.path);
                    await zapiszKatalog(authHeader, 'update', pakiet.id, { podglad: wynik.podglad, stron: wynik.stron });
                    await usunPliki(authHeader, stare);
                } catch (e) {
                    console.error(e);
                    if (e.status === 401) { onAuthError(); return; }
                    alert('Nie udało się utworzyć podglądu: ' + e.message);
                } finally { setPraca(''); }
            };

            return (
                <div className="card-bg rounded-2xl flex flex-col fade-in overflow-hidden">
                    {okladka ? (
                        <a href={`/materialy.html?sekcja=${sekcjaPakietu(pakiet)}&pakiet=${pakiet.id}`} target="_blank" rel="noopener" title="Otwórz podgląd tak, jak zobaczą go odwiedzający" className="relative block group">
                            <img src={adresPodgladu(okladka.path)} alt="" className="w-full h-40 object-cover object-top bg-white" />
                            <span className="absolute bottom-2 right-2 inline-flex items-center gap-1.5 text-xs font-bold bg-slate-900/85 text-white rounded-full px-3 py-1.5 group-hover:bg-indigo-600"><i className="ph-bold ph-eye"></i>{(pakiet.podglad || []).length ? `Zobacz podgląd: ${(pakiet.podglad || []).length} str.${pakiet.stron ? ` z ${pakiet.stron}` : ''}` : 'Zobacz na stronie'}</span>
                        </a>
                    ) : (
                        <div className="h-24 flex items-center justify-center text-xs text-slate-500 bg-slate-900/60 border-b border-slate-800"><i className="ph-bold ph-eye-slash mr-1.5"></i>Bez podglądu</div>
                    )}
                    <div className="p-5 flex flex-col flex-1">
                        <h4 className="font-bold text-slate-100 mb-1">{pakiet.title}</h4>
                        {pakiet.opis && <p className="text-sm text-slate-400 mb-3 flex-1">{pakiet.opis}</p>}
                        <ul className="space-y-1 mb-3">
                            {(pakiet.pliki || []).map((p, i) => (
                                <li key={i} className="text-xs text-slate-400 flex items-center gap-2"><i className={`ph-bold ${iconForFile(p.name)}`}></i>{p.name} ({formatBytes(p.size)})</li>
                            ))}
                        </ul>
                        <label className="text-xs text-slate-400 mb-3">
                            Sekcja{!pakiet.sekcja && <span className="text-amber-400"> (przypisana automatycznie – zatwierdź)</span>}
                            <select value={sekcjaPakietu(pakiet)} onChange={(e) => zmienSekcje(e.target.value)} className="input-bg mt-1 w-full rounded-lg px-2 py-1.5 text-sm">
                                {SEKCJE.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                            </select>
                            {!pakiet.sekcja && <button onClick={() => zmienSekcje(sekcjaPakietu(pakiet))} className="mt-1 text-amber-300 hover:text-amber-200 font-bold">✓ zatwierdź „{(SEKCJE.find((s) => s.id === sekcjaPakietu(pakiet)) || {}).label}”</button>}
                        </label>
                        {praca && <p className="text-xs text-indigo-300 mb-2 flex items-center gap-1.5"><i className="ph-bold ph-circle-notch animate-spin"></i>{praca}</p>}
                        <div className="flex items-center gap-2 mt-auto pt-3 border-t border-slate-800">
                            <button onClick={() => onEdytuj(pakiet)} className="btn-bounce flex-1 inline-flex items-center justify-center gap-1.5 text-xs font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/30 rounded-lg px-3 py-2 hover:bg-indigo-500/20"><i className="ph-bold ph-pencil-simple"></i>Edytuj</button>
                            {pdf && <button onClick={odswiezPodglad} disabled={!!praca} title={(pakiet.podglad || []).length ? 'Utwórz podgląd od nowa' : 'Utwórz podgląd z PDF'} className="btn-bounce inline-flex items-center justify-center gap-1.5 text-xs font-bold text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-3 py-2 hover:bg-emerald-500/20 disabled:opacity-40"><i className="ph-bold ph-eye"></i>{(pakiet.podglad || []).length ? 'Odśwież' : 'Podgląd'}</button>}
                            <button onClick={() => onUsun(pakiet)} className="btn-bounce inline-flex items-center justify-center gap-1.5 text-xs font-bold text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2 hover:bg-red-500/20"><i className="ph-bold ph-trash"></i></button>
                        </div>
                    </div>
                </div>
            );
        }

        function PanelMaterialy({ authHeader, onWyloguj }) {
            const [deps, setDeps] = useState(null);
            const [pakiety, setPakiety] = useState([]);
            const [sekcja, setSekcja] = useState(SEKCJE[0].id);
            const [aktywnyFolder, setAktywnyFolder] = useState('');
            const [pokazForm, setPokazForm] = useState(false);
            const [edytowany, setEdytowany] = useState(null);

            useEffect(() => { window.__materialyReady.then(setDeps); }, []);

            useEffect(() => {
                if (!deps) return;
                const api = window.__materialyApi;
                const q = api.query(api.collectionRef(deps), api.orderBy('createdAt', 'desc'));
                const unsub = api.onSnapshot(q, (snap) => {
                    const items = [];
                    snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
                    setPakiety(items);
                }, (err) => console.error('Firestore sync error', err));
                return () => unsub();
            }, [deps]);

            const wSekcji = pakiety.filter((p) => sekcjaPakietu(p) === sekcja);
            const foldery = [...new Set(wSekcji.map((p) => p.kategoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pl'));
            const bezSekcji = pakiety.filter((p) => !SEKCJA_IDS.includes(p.sekcja));

            const usunPakiet = async (pakiet, bezPytania) => {
                if (!bezPytania && !window.confirm(`Usunąć pakiet "${pakiet.title}" wraz ze wszystkimi jego plikami i podglądem? Tej operacji nie można cofnąć.`)) return;
                const api = window.__materialyApi;
                try {
                    await usunPliki(authHeader, [...(pakiet.pliki || []).map((p) => p.path), ...sciezkiPodgladu(pakiet)]);
                    await zapiszKatalog(authHeader, 'delete', pakiet.id);
                } catch (e) {
                    if (e.status === 401) { onWyloguj(); return; }
                    alert('Błąd usuwania: ' + e.message);
                }
            };

            const usunFolder = async (nazwa) => {
                const wFolderze = wSekcji.filter((p) => p.kategoria === nazwa);
                if (!window.confirm(`Usunąć katalog "${nazwa}" (sekcja ${SEKCJE.find((s) => s.id === sekcja).label}) razem z ${wFolderze.length} pakietem/pakietami w środku? Tej operacji nie można cofnąć.`)) return;
                for (const p of wFolderze) await usunPakiet(p, true);
                if (aktywnyFolder === nazwa) setAktywnyFolder('');
            };

            const zmienNazweFolderu = async (staraNazwa) => {
                const nowaNazwa = window.prompt('Nowa nazwa katalogu:', staraNazwa);
                if (!nowaNazwa || !nowaNazwa.trim() || nowaNazwa.trim() === staraNazwa) return;
                const api = window.__materialyApi;
                try {
                    for (const p of wSekcji.filter((x) => x.kategoria === staraNazwa)) {
                        await zapiszKatalog(authHeader, 'update', p.id, { kategoria: nowaNazwa.trim(), sekcja });
                    }
                } catch (e) { if (e.status === 401) { onWyloguj(); return; } alert('Nie udało się zmienić nazwy: ' + e.message); return; }
                if (aktywnyFolder === staraNazwa) setAktywnyFolder(nowaNazwa.trim());
            };

            const zatwierdzWszystkie = async () => {
                if (!window.confirm(`Zapisać automatycznie przypisane sekcje dla ${bezSekcji.length} pakietów? Sprawdź je wcześniej w zakładkach.`)) return;
                const api = window.__materialyApi;
                try { for (const p of bezSekcji) await zapiszKatalog(authHeader, 'update', p.id, { sekcja: sekcjaPakietu(p) }); }
                catch (e) { if (e.status === 401) { onWyloguj(); return; } alert('Nie udało się zapisać sekcji: ' + e.message); }
            };

            const widoczne = aktywnyFolder ? wSekcji.filter((p) => p.kategoria === aktywnyFolder) : wSekcji;
            const pogrupowane = {};
            widoczne.forEach((p) => { const k = p.kategoria || 'Bez katalogu'; (pogrupowane[k] = pogrupowane[k] || []).push(p); });

            if (!deps) {
                return <div className="text-slate-500 text-sm flex items-center gap-2"><i className="ph-bold ph-circle-notch animate-spin"></i>Łączenie z bazą…</div>;
            }

            return (
                <div>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                        {SEKCJE.map((s) => {
                            const ile = pakiety.filter((p) => sekcjaPakietu(p) === s.id).length;
                            return (
                                <button key={s.id} onClick={() => { setSekcja(s.id); setAktywnyFolder(''); }} aria-pressed={sekcja === s.id}
                                    className={`btn-bounce text-left rounded-2xl border p-4 ${sekcja === s.id ? 'bg-indigo-600/20 border-indigo-500/60' : 'card-bg hover:border-slate-600'}`}>
                                    <i className={`ph-duotone ${s.icon} text-2xl ${sekcja === s.id ? 'text-indigo-300' : 'text-slate-400'}`}></i>
                                    <span className="block font-black mt-1 text-slate-100">{s.label}</span>
                                    <span className="block text-xs text-slate-400">{ilePakietow(ile)}</span>
                                </button>
                            );
                        })}
                    </div>

                    {bezSekcji.length > 0 && (
                        <div className="flex flex-wrap items-center gap-3 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-5 text-sm text-amber-100/90">
                            <i className="ph-bold ph-info text-amber-400"></i>
                            <span className="flex-1 min-w-0">Pakiety dodane przed podziałem na sekcje ({bezSekcji.length}) mają sekcję przypisaną automatycznie (z nazwy). Sprawdź i zatwierdź – na kartach albo wszystkie naraz.</span>
                            <button onClick={zatwierdzWszystkie} className="btn-bounce text-xs font-bold bg-amber-500/20 border border-amber-500/40 rounded-lg px-3 py-1.5">Zatwierdź wszystkie</button>
                        </div>
                    )}

                    <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setAktywnyFolder('')} className={`chip rounded-full px-4 py-1.5 text-sm font-bold border ${!aktywnyFolder ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-slate-800/60 border-slate-700 text-slate-300'}`}>Wszystkie ({wSekcji.length})</button>
                            {foldery.map((f) => (
                                <PusteFolderyChip key={f} nazwa={`${f} (${wSekcji.filter((p) => p.kategoria === f).length})`} aktywna={aktywnyFolder === f} onClick={() => setAktywnyFolder(f)} onRename={() => zmienNazweFolderu(f)} onDelete={() => usunFolder(f)} />
                            ))}
                        </div>
                        <div className="flex items-center gap-2">
                            {!pokazForm && (
                                <button onClick={() => { setEdytowany(null); setPokazForm(true); }} className="btn-bounce inline-flex items-center gap-2 text-sm font-bold text-white bg-indigo-600 rounded-lg px-4 py-2.5 hover:bg-indigo-500 transition-colors">
                                    <i className="ph-bold ph-plus"></i>Dodaj pakiet
                                </button>
                            )}
                            <button onClick={onWyloguj} className="btn-bounce inline-flex items-center gap-2 text-sm font-bold text-slate-300 bg-slate-800 rounded-lg px-4 py-2.5 hover:bg-slate-700 transition-colors"><i className="ph-bold ph-sign-out"></i>Wyloguj</button>
                        </div>
                    </div>

                    {pokazForm && (
                        <FormularzPakietu
                            key={edytowany ? edytowany.id : 'nowy'}
                            authHeader={authHeader}
                            onAuthError={onWyloguj}
                            deps={deps}
                            edytowany={edytowany}
                            pakiety={pakiety}
                            sekcjaDomyslna={sekcja}
                            onZapisano={(s) => { setPokazForm(false); setEdytowany(null); setSekcja(s); setAktywnyFolder(''); }}
                            onAnuluj={() => { setPokazForm(false); setEdytowany(null); }}
                        />
                    )}

                    {Object.keys(pogrupowane).length === 0 ? (
                        <div className="card-bg rounded-2xl p-10 text-center">
                            <i className="ph-bold ph-folder-simple-dashed text-4xl text-slate-600 mb-3 block"></i>
                            <p className="text-slate-400 text-sm">W tej sekcji nie ma jeszcze pakietów. Dodaj pierwszy, żeby pojawił się w publicznym katalogu.</p>
                        </div>
                    ) : (
                        Object.entries(pogrupowane).sort(([a], [b]) => a.localeCompare(b, 'pl')).map(([nazwaFolderu, items]) => (
                            <div key={nazwaFolderu} className="mb-8">
                                <h3 className="text-sm font-black uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2"><i className="ph-fill ph-folder text-amber-500"></i>{nazwaFolderu}</h3>
                                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                                    {items.map((p) => (
                                        <KartaPakietu key={p.id} pakiet={p} authHeader={authHeader} deps={deps} onAuthError={onWyloguj}
                                            onEdytuj={(pk) => { setEdytowany(pk); setPokazForm(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }} onUsun={usunPakiet} />
                                    ))}
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        function App() {
            const [authHeader, setAuthHeader] = useState(null);

            return (
                <div className="max-w-6xl mx-auto w-full px-4 sm:px-6 py-10">
                    <a href="/index.html" className="inline-flex items-center gap-2 text-indigo-400 hover:text-indigo-300 text-sm font-bold mb-6">
                        <i className="ph-bold ph-arrow-left"></i> EduBox AI
                    </a>
                    <h1 className="text-3xl sm:text-4xl font-black text-slate-50">📦 Panel Materiałów</h1>
                    <p className="text-slate-400 mt-2">Wybierz sekcję (przedszkole, klasy 1–3, klasy 4–8, inne), zakładaj w niej katalogi, wgrywaj pliki z podglądem i publikuj pakiety w katalogu <a href="/materialy.html" className="underline text-indigo-400 hover:text-indigo-300">materialy.html</a>.</p>

                    {authHeader ? (
                        <>
                            <div className="flex items-start gap-3 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl p-4 my-6">
                                <i className="ph-bold ph-shield-check text-indigo-400 text-xl shrink-0 mt-0.5"></i>
                                <p className="text-xs text-indigo-100/80 leading-relaxed">
                                    Pliki wgrywasz i usuwasz przez chroniony serwer (dane logowania nie są nigdzie zapisywane, znikają po zamknięciu karty). Wszystko co tu zapiszesz od razu pojawia się w publicznym katalogu.
                                </p>
                            </div>
                            <PanelMaterialy authHeader={authHeader} onWyloguj={() => setAuthHeader(null)} />
                        </>
                    ) : (
                        <LoginForm onZaloguj={setAuthHeader} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
