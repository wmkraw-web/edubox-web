    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* Stylistyka: Bursztynowy (Amber) i Pomarańczowy (Orange) */
        .aura-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #f59e0b, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #f97316, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.05); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .text-gradient { background: linear-gradient(135deg, #fbbf24 0%, #ea580c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-bounce:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .magic-border { position: relative; }
        .magic-border::before {
            content: ''; position: absolute; inset: -4px;
            background: linear-gradient(45deg, #f59e0b, #f97316, #f59e0b);
            border-radius: inherit; z-index: -1;
            animation: borderGlow 3s linear infinite; background-size: 200% 200%;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .symbol-item-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const SECRET_PIN = "KAWA2024"; 
            const BUY_COFFEE_LINK = "https://buycoffee.to/eduboxpro";
            const FREE_TRIES_LIMIT = 0; 

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [freeTries, setFreeTries] = useState(0);
            const [showPaywall, setShowPaywall] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            
            // Zmienne Generatora
            const [promptInput, setPromptInput] = useState('');
            const [ageGroup, setAgeGroup] = useState('przedszkolaki');
            const [cardSize, setCardSize] = useState('5'); 
            const [generatedImage, setGeneratedImage] = useState(null);
            const [generationStep, setGenerationStep] = useState(null); // null, 'translating', 'generating'
            const [error, setError] = useState('');
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            
            // Baza zebranych kart
            const [symbolCards, setSymbolCards] = useState([]);
            
            // Giełda
            const [appMode, setAppMode] = useState('generator');
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);

            const resultRef = useRef(null);

            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        
                        await window.EduBoxCore.init((u) => {
                            const savedAuth = localStorage.getItem('eduSymbolAuth') === 'true';
                            if (savedAuth || localStorage.getItem('eduboxProStatus') === 'PRO') setIsAuthenticated(true);
                            setFreeTries(window.EduBoxCore.getUsageCount());
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'symbols_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                const savedCards = localStorage.getItem('eduSymbolCards_V3');
                if (savedCards) {
                    try { setSymbolCards(JSON.parse(savedCards)); } catch(e) {}
                }

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem('eduSymbolCards_V3', JSON.stringify(symbolCards));
                } catch (e) {
                    console.warn("Przeglądarka ma zapchaną pamięć localStorage.");
                }
            }, [symbolCards]);

            const showToast = (msg, type = 'info') => {
                // Implementacja powiadomień
                alert(msg); // Placeholder - tu jest używany alert, ale w aplikacji można podpiąć toast
            };

            // ETAP 1: Translator poleceń (Rozwiązuje problem halucynacji tekstu i złego rozumienia zapytań)
            const fetchTranslatedPrompt = async (polishText) => {
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: polishText, 
                            system: `Translate the following Polish AAC symbol request into a highly concise, purely visual English description (max 8 words). If it's an object/animal/food, just describe the item. If it's an action/verb, describe a person doing the action. DO NOT add any styling words. Return ONLY the pure English phrase.`,
                            temperature: 0.3,
                            model: "gpt-4o-mini"
                        })
                    });
                    if(res.ok) {
                        const data = await res.json();
                        // Usuwamy znaki nowej linii i cudzysłowy, aby nie "zepsuć" zapytania API
                        return data.text.trim().replace(/['"\n]/g, '');
                    }
                    throw new Error("Chat API failed");
                } catch(e) {
                    console.warn("Używam awaryjnego tłumacza (Canvas Mode)");
                    try {
                        const apiKey = ""; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: polishText }] }],
                                systemInstruction: { parts: [{ text: "Translate the following Polish AAC symbol request into a highly concise, purely visual English description (max 8 words). Just the object or action. Return ONLY the English phrase, no quotes." }] },
                                generationConfig: { temperature: 0.1 }
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            return data.candidates[0].content.parts[0].text.trim().replace(/['"\n]/g, '');
                        }
                        return polishText; // Fallback: jeśli wszystko zawiedzie, zwracamy tekst bazowy
                    } catch (err) {
                        return polishText;
                    }
                }
            };

            // ETAP 2: Wywołanie Grafiki
            const secureApiCall = async (payloadData) => {
                try {
                    // FIX: Twój serwer do obrazów oczekuje "płaskiego" obiektu (od razu "prompt"), a nie zagnieżdżonego "payload"
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadData) 
                    });
                    
                    if (res.ok) return await res.json();
                    if (res.status === 404 || res.status === 405) throw new Error("USE_FALLBACK");
                    
                    const errData = await res.json();
                    throw new Error(errData.error || `Status API: ${res.status}`);
                    
                } catch (e) {
                    if (e.message === "USE_FALLBACK" || e.message.includes("Failed to fetch") || e.message.includes("Unexpected token")) {
                        const apiKey = ""; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                        const previewPayload = {
                            instances: { prompt: payloadData.prompt },
                            parameters: { sampleCount: 1 }
                        };
                        const fallbackRes = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(previewPayload)
                        });
                        if (!fallbackRes.ok) throw new Error("Błąd podczas połączenia z silnikiem graficznym Google.");
                        return await fallbackRes.json();
                    }
                    throw e;
                }
            };

            const generateSymbolCard = async () => {
                if (!isAuthenticated && freeTries >= FREE_TRIES_LIMIT) {
                    setShowPaywall(true); return;
                }
                if (!promptInput.trim()) {
                    setError('Wpisz, co ma przedstawiać karta!'); return;
                }

                setError('');
                setGeneratedImage(null);

                try {
                    const cleanPrompt = promptInput.toLowerCase().trim();
                    
                    // Szybki Canvas dla liter/cyfr
                    const typoMatch = cleanPrompt.match(/(?:cyfra|litera|liczba|znak|duża|mała|wielka)\s+([a-z0-9ąćęłńóśźż]{1,3})/i) || cleanPrompt.match(/^([a-z0-9ąćęłńóśźż]{1,3})$/i);
                    if (typoMatch) {
                        const charToDraw = typoMatch[1].toUpperCase();
                        const canvas = document.createElement('canvas');
                        canvas.width = 1024; canvas.height = 1024;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1024, 1024);
                        ctx.fillStyle = '#000000'; 
                        const fontSize = charToDraw.length > 1 ? 600 : 800; 
                        ctx.font = `bold ${fontSize}px "Plus Jakarta Sans", Arial, sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(charToDraw, 512, 540); 
                        setGeneratedImage(canvas.toDataURL('image/png'));
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                        return; 
                    }

                    // Szybki Canvas dla figur
                    const shapeMatch = cleanPrompt.match(/(kwadrat|prostokąt|koło|kółko|trójkąt|gwiazda|gwiazdka|serce|serduszko|owal|romb)/i);
                    if (shapeMatch) {
                        const shape = shapeMatch[1].toLowerCase();
                        const canvas = document.createElement('canvas');
                        canvas.width = 1024; canvas.height = 1024;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1024, 1024);
                        ctx.lineWidth = 35; ctx.strokeStyle = '#000000'; ctx.fillStyle = '#ffffff';
                        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                        ctx.beginPath();
                        const cx = 512, cy = 512;
                        if (shape === 'kwadrat') { ctx.rect(212, 212, 600, 600); } 
                        else if (shape === 'prostokąt') { ctx.rect(162, 312, 700, 400); } 
                        else if (shape.includes('koł')) { ctx.arc(cx, cy, 350, 0, Math.PI * 2); } 
                        else if (shape === 'trójkąt') { ctx.moveTo(cx, 200); ctx.lineTo(850, 850); ctx.lineTo(174, 850); ctx.closePath(); } 
                        else if (shape.includes('gwiazd')) {
                            for (let i = 0; i < 5; i++) {
                                ctx.lineTo(Math.cos((18 + i * 72) / 180 * Math.PI) * 350 + cx, -Math.sin((18 + i * 72) / 180 * Math.PI) * 350 + cy);
                                ctx.lineTo(Math.cos((54 + i * 72) / 180 * Math.PI) * 150 + cx, -Math.sin((54 + i * 72) / 180 * Math.PI) * 150 + cy);
                            }
                            ctx.closePath();
                        } 
                        else if (shape.includes('serc')) {
                            ctx.moveTo(cx, 300); ctx.bezierCurveTo(cx, 250, cx - 50, 150, cx - 200, 150); ctx.bezierCurveTo(cx - 400, 150, cx - 400, 400, cx - 400, 400); ctx.bezierCurveTo(cx - 400, 600, cx - 150, 750, cx, 850); ctx.bezierCurveTo(cx + 150, 750, cx + 400, 600, cx + 400, 400); ctx.bezierCurveTo(cx + 400, 400, cx + 400, 150, cx + 200, 150); ctx.bezierCurveTo(cx + 50, 150, cx, 250, cx, 300);
                        } 
                        else if (shape === 'owal') { ctx.ellipse(cx, cy, 400, 250, 0, 0, Math.PI * 2); } 
                        else if (shape === 'romb') { ctx.moveTo(cx, 150); ctx.lineTo(850, cy); ctx.lineTo(cx, 850); ctx.lineTo(150, cy); ctx.closePath(); }
                        ctx.fill(); ctx.stroke();
                        setGeneratedImage(canvas.toDataURL('image/png'));
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                        return; 
                    }

                    // --- GENEROWANIE PRZEZ AI (TWO-STEP ARCHITECTURE) ---
                    setGenerationStep('translating');
                    const englishSubject = await fetchTranslatedPrompt(cleanPrompt);
                    
                    setGenerationStep('generating');
                    
                    let styleModifier = "";
                    let apiStylePreset = "digital-art"; 

                    if (ageGroup === 'maluchy') {
                        styleModifier = "Extremely cute flat 2D vector clipart, very thick smooth outlines, solid bright colors, minimalist kawaii style, pure white background.";
                    } else if (ageGroup === 'przedszkolaki') {
                        styleModifier = "Premium high-quality children's book illustration, flat vector art, clear outlines, wholesome, aesthetic, pure white background.";
                    } else if (ageGroup === 'szkolne') {
                        styleModifier = "Professional educational textbook illustration, flat vector style, highly clear and descriptive, pure white background.";
                    }

                    // Totalna izolacja słów. Usunięto odniesienia rasowe (np. "caucasian"), które powodują 400 Bad Request na filtrach bezpieczeństwa API!
                    const hiddenInstruction = `A single, isolated educational illustration on a pure white background. EXACT SUBJECT TO DRAW: "${englishSubject}". CRITICAL RULES: 1. ABSOLUTELY NO TEXT, NO WORDS, NO LETTERS, NO NUMBERS anywhere on the image. Pure visual art only. 2. Focus ONLY on the main subject. No random floating objects, no extra background clutter, no scenery. Style: ${styleModifier}`;
                    
                    // Najsilniejszy negatywny prompt - zero litości dla bazgrołów
                    const negativePrompt = "text, letters, words, spelling, writing, typography, signature, watermark, messy, multiple subjects, clutter, floating objects, background scenery, 3d render, realistic, ugly, deformed";

                    const payload = {
                        prompt: hiddenInstruction, 
                        negative_prompt: negativePrompt, 
                        style_preset: apiStylePreset,
                        aspect_ratio: '1:1',
                        width: 1024,
                        height: 1024
                    };

                    const data = await secureApiCall(payload);
                    // Lepsze wyszukiwanie obrazka z różnych silników (Stability, Fal, Imagen)
                    const base64Image = data.predictions?.[0]?.bytesBase64Encoded || data.artifacts?.[0]?.base64 || data.image || data.imageUrl || data.image_url || data.url || (data.data && data.data[0]?.url); 
                    
                    if (base64Image) {
                        const finalImage = base64Image.startsWith('http') || base64Image.startsWith('data:image') ? base64Image : `data:image/png;base64,${base64Image}`;
                        setGeneratedImage(finalImage);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź API.");
                    }
                } catch (err) {
                    console.error(err);
                    setError(err.message || 'Wystąpił problem z generowaniem obrazu.');
                } finally {
                    setGenerationStep(null);
                }
            };

            const addCard = () => {
                if (generatedImage) {
                    const addToList = (imgSrc) => {
                        const newItem = {
                            id: Date.now() + Math.random(),
                            img: imgSrc,
                            label: promptInput.substring(0, 15).toUpperCase()
                        };
                        setSymbolCards(prev => [...prev, newItem]);
                        setGeneratedImage(null);
                        setPromptInput('');
                    };

                    if (generatedImage.startsWith('data:')) {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const canvas = document.createElement('canvas');
                                canvas.width = 400; canvas.height = 400;
                                const ctx = canvas.getContext('2d');
                                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 400, 400);
                                ctx.drawImage(img, 0, 0, 400, 400);
                                const compressedImg = canvas.toDataURL('image/jpeg', 0.85); 
                                addToList(compressedImg);
                            } catch(e) {
                                addToList(generatedImage);
                            }
                        };
                        img.onerror = () => addToList(generatedImage);
                        img.src = generatedImage;
                    } else {
                        addToList(generatedImage);
                    }
                }
            };

            const removeCard = (id) => {
                setSymbolCards(symbolCards.filter(item => item.id !== id));
            };

            const updateLabel = (id, newLabel) => {
                setSymbolCards(symbolCards.map(item => item.id === id ? { ...item, label: newLabel } : item));
            };

            const clearCards = () => {
                setShowClearConfirm(true);
            };

            const handleLogin = () => {
                if (passwordInput === SECRET_PIN) {
                    setIsAuthenticated(true);
                    setShowPaywall(false);
                    localStorage.setItem('eduSymbolAuth', 'true');
                    localStorage.setItem('eduboxProStatus', 'PRO');
                } else {
                    alert('Nieprawidłowy kod PIN!');
                }
            };

            const handlePrintSymbols = () => {
                if (symbolCards.length === 0) return;
                window.print();
            };

            // GIEŁDA WIDOK
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex bg-transparent font-sans">
                        <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                        
                        <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                            <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                                    <i className="ph-bold ph-chats-circle text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-amber-400">Symbol</span></span>
                            </div>

                            <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                                <button onClick={() => setAppMode('generator')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
                                    <i className="ph-bold ph-magic-wand text-lg"></i> Kreator Piktogramów
                                </button>
                                <button onClick={() => setAppMode('gielda')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all bg-orange-600/20 text-orange-400 border border-orange-500/50">
                                    <i className="ph-bold ph-cards text-lg"></i> Giełda Symboli
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex-1 md:pl-80 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Symboli AAC</h2>
                            <p className="text-slate-400 mb-8">Eksploruj bazę i pobieraj gotowe symbole innych nauczycieli.</p>
                            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-4 rounded-2xl flex flex-col hover:border-amber-500/50 transition-colors group">
                                        <div className="w-full aspect-square bg-white rounded-xl mb-4 overflow-hidden border-2 border-slate-300 relative flex items-center justify-center p-2">
                                            {item.config.imageUrl ? (
                                                <img src={item.config.imageUrl} className="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform duration-500 mix-blend-multiply" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-600"><i className="ph-thin ph-image text-4xl"></i></div>
                                            )}
                                        </div>
                                        <h3 className="text-sm font-black text-center text-white mb-2 uppercase tracking-wide">"{item.config.promptInput}"</h3>
                                        <div className="mt-auto flex gap-2">
                                            <button onClick={() => {
                                                setPromptInput(item.config.promptInput || '');
                                                setAgeGroup(item.config.ageGroup || 'przedszkolaki');
                                                setGeneratedImage(item.config.imageUrl || null);
                                                setAppMode('generator');
                                            }} className="w-full bg-slate-800 hover:bg-amber-600 text-white py-2 rounded-xl text-xs font-bold transition-colors">
                                                Wczytaj na pulpit
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // PAYWALL WIDOK
            if (showPaywall) {
                return (
                    <div className="min-h-screen relative flex items-center justify-center p-4">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        
                        <div className="glass-panel p-10 rounded-3xl max-w-md w-full text-center shadow-[0_0_50px_rgba(245,158,11,0.2)] border border-amber-500/30 fade-in relative z-10">
                            <div className="w-24 h-24 bg-gradient-to-br from-amber-500 to-orange-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <h2 className="text-3xl font-black text-white mb-2">Dostęp PRO</h2>
                            <p className="text-slate-300 text-sm mb-8 font-medium">Systemy AAC wymagają pełnego dostępu. Podaj PIN by odblokować architekturę Two-Step Generation!</p>
                            
                            <input 
                                type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)}
                                onKeyPress={(e) => { if (e.key === 'Enter') handleLogin(); }}
                                placeholder="Wpisz PIN..."
                                className="w-full bg-slate-900 border border-slate-600 text-center text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-amber-500 outline-none mb-6 text-2xl tracking-[0.5em] font-bold uppercase"
                            />
                            
                            <button 
                                onClick={handleLogin}
                                className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black py-4 rounded-xl transition-all transform hover:scale-105 btn-bounce text-lg shadow-lg mb-4"
                            >
                                Odblokuj System
                            </button>
                            <button onClick={() => setShowPaywall(false)} className="text-slate-400 hover:text-white text-sm font-bold mb-8">
                                Zamknij
                            </button>
                        </div>
                    </div>
                );
            }

            // GŁÓWNY WIDOK
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>

                    {/* SIDEBAR WŁASNY DLA EDUSYMBOL */}
                    <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                                <i className="ph-bold ph-chats-circle text-white text-xl"></i>
                            </div>
                            <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-amber-400">Symbol</span></span>
                        </div>

                        <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                            <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-amber-600/20 text-amber-400 border border-amber-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="ph-bold ph-magic-wand text-lg"></i> Kreator Piktogramów
                            </button>
                            <button onClick={() => setAppMode('gielda')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
                                <i className="ph-bold ph-cards text-lg"></i> Giełda Symboli
                            </button>
                        </div>
                    </div>

                    <main className="flex-grow pt-16 md:pl-80 pb-16 px-4 sm:px-6 print:p-0 print:overflow-visible">
                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 print:block">
                            
                            {/* LEWA KOLUMNA: GENERATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="text-left mb-8 fade-in">
                                    <div className="inline-flex items-center gap-2 bg-amber-900/30 border border-amber-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-amber-400 uppercase tracking-widest mb-4">
                                        Autyzm / Terapia AAC
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Generator <br/><span className="text-gradient">Kart AAC.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Twórz izolowane, czytelne grafiki. Nowy 2-stopniowy silnik gwarantuje absolutny brak tekstu na obrazkach.
                                    </p>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50">
                                    <div className="mb-6">
                                        <label className="block text-slate-300 font-bold mb-3 text-xs uppercase tracking-wider">Poziom detali (wiek dziecka):</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <button onClick={() => setAgeGroup('maluchy')} className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'maluchy' ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                <span className="text-xl">🧸</span> Maluchy
                                            </button>
                                            <button onClick={() => setAgeGroup('przedszkolaki')} className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'przedszkolaki' ? 'bg-orange-600/20 border-orange-500 text-orange-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                <span className="text-xl">🎨</span> Przedszkole
                                            </button>
                                            <button onClick={() => setAgeGroup('szkolne')} className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'szkolne' ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                <span className="text-xl">🎒</span> Szkolne
                                            </button>
                                        </div>
                                    </div>

                                    <label className="block text-white font-bold mb-3 text-sm">Słowo, czynność, przedmiot (zwykły język polski):</label>
                                    <div className="relative mb-6">
                                        <input 
                                            type="text" 
                                            value={promptInput}
                                            onChange={(e) => setPromptInput(e.target.value)}
                                            onKeyPress={(e) => { if(e.key === 'Enter') generateSymbolCard(); }}
                                            placeholder="Np. chłopiec je jabłko, zły pies..."
                                            className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-amber-500 outline-none pr-12"
                                        />
                                    </div>

                                    <button 
                                        onClick={generateSymbolCard}
                                        disabled={generationStep !== null || !promptInput}
                                        className={`w-full py-4 rounded-xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(245,158,11,0.2)] btn-bounce
                                            ${generationStep !== null ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-amber-500 to-orange-500 hover:scale-105 active:scale-95'}`}
                                    >
                                        {generationStep === 'translating' ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Tłumaczenie pojęć (1/2)...</>
                                        ) : generationStep === 'generating' ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Malowanie symbolu (2/2)...</>
                                        ) : (
                                            <><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Obrazek</>
                                        )}
                                    </button>

                                    {error && <div className="mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded-lg text-red-400 text-xs font-medium text-center">{error}</div>}
                                </div>
                                
                                {/* WYNIK GENEROWANIA - POJEDYNCZY SYMBOL */}
                                {generatedImage && (
                                    <div ref={resultRef} className="glass-panel p-6 rounded-[2rem] fade-in border border-amber-500/30 text-center relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                                        
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-sm font-bold text-white">Oto Twój Symbol:</h3>
                                        </div>

                                        <div className="bg-white p-2 rounded-xl mx-auto w-40 h-40 flex items-center justify-center mb-6 border-2 border-slate-300 shadow-inner">
                                            <img src={generatedImage} alt="Symbol AAC" className="max-w-full max-h-full object-contain mix-blend-multiply" />
                                        </div>
                                        
                                        <button onClick={addCard} className="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-lg">
                                            <i className="ph-bold ph-plus-circle text-lg"></i> Przypnij na Tablicę
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* PRAWA KOLUMNA: TABLICA KART AAC */}
                            <div className="lg:col-span-7 glass-panel rounded-[2.5rem] p-6 sm:p-8 border border-slate-700/50 flex flex-col h-full min-h-[600px] print:p-0 print:border-none print:bg-white print:min-h-0 print:block">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-slate-700/50 gap-4 print-hidden">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                        <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                            📂 Zebrane Karty
                                            <span className="bg-amber-500 text-white text-xs px-2 py-1 rounded-full">{symbolCards.length}</span>
                                        </h2>
                                        <div className="flex items-center gap-3 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-600 shadow-md">
                                            <span className="text-sm text-slate-400 font-bold uppercase"><i className="ph-bold ph-arrows-out"></i> Rozmiar:</span>
                                            <select value={cardSize} onChange={e => setCardSize(e.target.value)} className="bg-transparent text-white text-base font-black outline-none cursor-pointer tracking-wide">
                                                <option value="4" className="bg-slate-800 text-white font-bold py-2">Małe (4x4 cm)</option>
                                                <option value="5" className="bg-slate-800 text-white font-bold py-2">Duże (5x5 cm)</option>
                                                <option value="7" className="bg-slate-800 text-white font-bold py-2">Wielkie (7x7 cm)</option>
                                            </select>
                                        </div>
                                    </div>
                                    {symbolCards.length > 0 && (
                                        <div className="flex flex-wrap items-center gap-3">
                                            <button onClick={clearCards} className="text-slate-400 hover:text-red-400 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-800 transition-colors flex items-center gap-1">
                                                <i className="ph-bold ph-trash"></i> Wyczyść
                                            </button>
                                            <button onClick={handlePrintSymbols} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-5 py-2.5 rounded-xl font-black flex items-center gap-2 transition-all shadow-lg btn-bounce">
                                                <i className="ph-bold ph-printer text-lg"></i> Drukuj Karty
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="hidden print:block text-center mb-8">
                                    <h1 className="text-2xl font-black uppercase text-black mb-1">Karty Komunikacji Alternatywnej</h1>
                                    <p className="text-sm text-gray-500">Wytnij, zalaminuj i przyczep rzepy. Rozmiar: {cardSize}x{cardSize} cm.</p>
                                </div>

                                {symbolCards.length === 0 ? (
                                    <div className="flex-grow flex flex-col items-center justify-center text-center opacity-50 print-hidden">
                                        <i className="ph-thin ph-cards text-7xl mb-4"></i>
                                        <p className="text-slate-300 font-bold text-lg">Tablica z kartami jest pusta.</p>
                                        <p className="text-slate-400 text-sm max-w-xs mt-2">Wygeneruj obrazki, aby zebrać materiał do wspólnego wydruku.</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-wrap gap-4 auto-rows-max overflow-y-auto pr-2 pb-10 content-start print:overflow-visible symbol-grid-print" 
                                         style={{ maxHeight: "calc(100vh - 250px)", gridTemplateColumns: `repeat(auto-fill, ${cardSize}cm)` }}>
                                        {symbolCards.map((item) => (
                                            <div key={item.id} className="bg-white rounded-xl border-2 border-slate-300 w-28 h-28 flex flex-col relative group symbol-item-enter overflow-hidden shadow-md symbol-card-print"
                                                 style={{ width: `${cardSize}cm`, height: `${cardSize}cm`, borderRadius: '0' }}>
                                                <button 
                                                    onClick={() => removeCard(item.id)}
                                                    className="absolute -top-1 -right-1 bg-red-500 hover:bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity z-10 btn-bounce print-hidden"
                                                >
                                                    <i className="ph-bold ph-x text-xs"></i>
                                                </button>
                                                
                                                <div className="flex-grow flex items-center justify-center p-0.5 overflow-hidden" style={{ height: `calc(${cardSize}cm - ${cardSize === '4' ? '14px' : '18px'})` }}>
                                                    <img src={item.img} className="w-[95%] h-[95%] object-contain mix-blend-multiply scale-110" alt="Symbol AAC" />
                                                </div>
                                                
                                                <div className="border-t-2 border-slate-300 flex items-center justify-center bg-white" style={{ height: cardSize === '4' ? '14px' : '18px' }}>
                                                    <input 
                                                        type="text" 
                                                        value={item.label} 
                                                        onChange={(e) => updateLabel(item.id, e.target.value)}
                                                        className="w-full h-full bg-transparent text-black text-center font-black outline-none uppercase px-0.5 print:bg-transparent"
                                                        style={{ fontSize: cardSize === '4' ? '8px' : '10px' }}
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                    </main>

                    {showClearConfirm && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm print-hidden">
                            <div className="glass-panel p-8 rounded-3xl max-w-sm w-full border border-red-500/30 text-center shadow-2xl">
                                <i className="ph-fill ph-warning-circle text-5xl text-red-500 mb-4"></i>
                                <h3 className="text-xl font-bold text-white mb-2">Wyczyścić tablicę?</h3>
                                <p className="text-sm text-slate-300 mb-6">Tej operacji nie można cofnąć.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowClearConfirm(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors">Anuluj</button>
                                    <button onClick={() => { setSymbolCards([]); setShowClearConfirm(false); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">Usuń wszystko</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
