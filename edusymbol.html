<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduSymbol PRO - EduBox AI</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { slate: { 950: '#020617' } }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
            margin: 0; padding: 0;
        }

        /* Magiczne Aury w tle - Motyw Amber & Orange */
        .aura-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.30;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #f59e0b, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #ea580c, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -40px) scale(1.05); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.5); border-radius: 4px; }

        .text-gradient { background: linear-gradient(135deg, #fbbf24 0%, #ea580c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Print Rules - V3 Standard */
        @media print {
            body { background: white !important; color: black !important; background-image: none !important; }
            .aura-blob { display: none !important; }
            .print-hidden { display: none !important; }
            .print-only { display: block !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; size: A4 portrait; }
            
            .symbol-grid-print {
                display: grid !important;
                gap: 0.5cm !important;
                justify-content: center !important;
                width: 100% !important;
            }
            .symbol-card-print {
                border: 2px solid #000 !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                background-color: white !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="custom-scrollbar">
    
    <!-- Kontener na globalne menu -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>
    
    <div id="root"></div>

    <!-- MOCK EduBoxCore -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        let FIREBASE_CONFIG;
        try { FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", authDomain: "mock", projectId: "mock", appId: "1:123" }; } catch(e) { FIREBASE_CONFIG = {}; }
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "eduboxpro";
        
        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: async (onUserLoad) => {
                if (!isInitialized) {
                    try {
                        app = initializeApp(FIREBASE_CONFIG);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                        isInitialized = true;
                        window.EduBoxCore.loadMenu();
                    } catch(e) { console.warn("Firebase init error", e); }
                }
                if (auth) onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                else if(onUserLoad) onUserLoad({ uid: 'mock-user-123' });
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) container.innerHTML = `<div class="bg-amber-600 text-white text-xs text-center py-1 font-bold print-hidden">EduBox V3 PRO MAX - System Core Loaded</div>`;
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na pasku bocznym!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser && !db) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                const payload = { userId: currentUser?.uid || 'anonymous', createdAt: serverTimestamp(), type: appType, name: itemName, config: config };
                if (JSON.stringify(payload).length > 950000) {
                    throw new Error("🚨 Użyta grafika jest za duża by zapisać ją w chmurze (Max ~1MB)!");
                }
                await addDoc(publicRef, payload);
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [promptInput, setPromptInput] = useState('');
            const [ageGroup, setAgeGroup] = useState('przedszkolaki');
            const [cardSize, setCardSize] = useState('5'); 
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [showClearConfirm, setShowClearConfirm] = useState(false); // NOWY STAN DLA MODALA
            
            // Symbol Cards Board
            const [symbolCards, setSymbolCards] = useState([]);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        
                        // Zabezpieczenie asynchroniczne: czekamy na logowanie ZANIM pobierzemy Giełdę (zasada RULE 3)
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'symbols_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                const savedCards = localStorage.getItem('eduSymbolCards_V3');
                if (savedCards) {
                    try { setSymbolCards(JSON.parse(savedCards)); } catch(e) {}
                }

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem('eduSymbolCards_V3', JSON.stringify(symbolCards));
                } catch (e) {
                    console.warn("Przeglądarka ma zapchaną pamięć localStorage.");
                }
            }, [symbolCards]);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === CORE LOGIC ===
            const fetchEduBoxImage = async (instructionText) => {
                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: instructionText,
                            aspect_ratio: '1:1',
                            width: 1024,
                            height: 1024
                        })
                    });
                    
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    const data = await response.json();
                    
                    let imgUrl = data.imageUrl || data.image_url || data.url || (data.data && data.data[0]?.url) || data.image;
                    if (imgUrl && imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                        imgUrl = `data:image/png;base64,${imgUrl}`;
                    }
                    return imgUrl;
                } catch (e) {
                    // FALLBACK DLA ŚRODOWISKA PODGLĄDU (CANVAS PREVIEW)
                    console.warn("Przełączam na model awaryjny (Canvas Fallback):", e);
                    const apiKey = ""; // Podgląd sam wstrzyknie odpowiedni klucz
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    
                    const fallbackRes = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: instructionText },
                            parameters: { sampleCount: 1 } // Usunięto aspectRatio, by dostosować do standardu Imagen
                        })
                    });
                    
                    if (!fallbackRes.ok) throw new Error("Błąd API obrazów Google");
                    const fallbackData = await fallbackRes.json();
                    return `data:image/png;base64,${fallbackData.predictions[0].bytesBase64Encoded}`;
                }
            };

            const generateSymbolCard = () => {
                if (!promptInput.trim()) { showToast('Wpisz, co ma przedstawiać karta!', 'error'); return; }
                
                const cleanPrompt = promptInput.toLowerCase().trim();
                
                // --- 1. SZYBKI CANVAS DLA LITER/CYFR (Oszczędza API i zapobiega halucynacjom tekstu) ---
                const typoMatch = cleanPrompt.match(/(?:cyfra|litera|liczba|znak|duża|mała|wielka)\s+([a-z0-9ąćęłńóśźż]{1,3})/i) || cleanPrompt.match(/^([a-z0-9ąćęłńóśźż]{1,3})$/i);
                if (typoMatch) {
                    const charToDraw = typoMatch[1].toUpperCase();
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024; canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1024, 1024);
                    ctx.fillStyle = '#000000'; 
                    const fontSize = charToDraw.length > 1 ? 600 : 800; 
                    ctx.font = `bold ${fontSize}px "Plus Jakarta Sans", Arial, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(charToDraw, 512, 540); 
                    setGeneratedImage(canvas.toDataURL('image/png'));
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    return; 
                }

                // --- 2. SZYBKI CANVAS DLA FIGUR (Niezawodny) ---
                const shapeMatch = cleanPrompt.match(/(kwadrat|prostokąt|koło|kółko|trójkąt|gwiazda|gwiazdka|serce|serduszko|owal|romb)/i);
                if (shapeMatch) {
                    const shape = shapeMatch[1].toLowerCase();
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024; canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1024, 1024);
                    ctx.lineWidth = 35; ctx.strokeStyle = '#000000'; ctx.fillStyle = '#ffffff';
                    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                    ctx.beginPath();
                    const cx = 512, cy = 512;

                    if (shape === 'kwadrat') { ctx.rect(212, 212, 600, 600); } 
                    else if (shape === 'prostokąt') { ctx.rect(162, 312, 700, 400); } 
                    else if (shape.includes('koł')) { ctx.arc(cx, cy, 350, 0, Math.PI * 2); } 
                    else if (shape === 'trójkąt') { ctx.moveTo(cx, 200); ctx.lineTo(850, 850); ctx.lineTo(174, 850); ctx.closePath(); } 
                    else if (shape.includes('gwiazd')) {
                        for (let i = 0; i < 5; i++) {
                            ctx.lineTo(Math.cos((18 + i * 72) / 180 * Math.PI) * 350 + cx, -Math.sin((18 + i * 72) / 180 * Math.PI) * 350 + cy);
                            ctx.lineTo(Math.cos((54 + i * 72) / 180 * Math.PI) * 150 + cx, -Math.sin((54 + i * 72) / 180 * Math.PI) * 150 + cy);
                        }
                        ctx.closePath();
                    } 
                    else if (shape.includes('serc')) {
                        ctx.moveTo(cx, 300); ctx.bezierCurveTo(cx, 250, cx - 50, 150, cx - 200, 150); ctx.bezierCurveTo(cx - 400, 150, cx - 400, 400, cx - 400, 400); ctx.bezierCurveTo(cx - 400, 600, cx - 150, 750, cx, 850); ctx.bezierCurveTo(cx + 150, 750, cx + 400, 600, cx + 400, 400); ctx.bezierCurveTo(cx + 400, 400, cx + 400, 150, cx + 200, 150); ctx.bezierCurveTo(cx + 50, 150, cx, 250, cx, 300);
                    } 
                    else if (shape === 'owal') { ctx.ellipse(cx, cy, 400, 250, 0, 0, Math.PI * 2); } 
                    else if (shape === 'romb') { ctx.moveTo(cx, 150); ctx.lineTo(850, cy); ctx.lineTo(cx, 850); ctx.lineTo(150, cy); ctx.closePath(); }

                    ctx.fill(); ctx.stroke();
                    setGeneratedImage(canvas.toDataURL('image/png'));
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    return; 
                }

                // --- 3. GENEROWANIE PRZEZ AI (Zabezpieczone limitami) ---
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedImage(null);
                        
                        let styleModifier = "";
                        if (ageGroup === 'maluchy') {
                            styleModifier = "Extremely cute and simple flat 2D vector clipart, thick outlines, bright cheerful colors, zero background. Easy to understand for toddlers.";
                        } else if (ageGroup === 'przedszkolaki') {
                            styleModifier = "Beautiful children's book illustration, highly appealing, flat vector art, vibrant colors, clear outlines, friendly style.";
                        } else if (ageGroup === 'szkolne') {
                            styleModifier = "High quality educational illustration, beautiful and clear, professional textbook artwork, neutral style.";
                        }

                        // Nowy, mądrzejszy prompt, który nie zmusza do rysowania ludzi dla zwykłych przedmiotów
                        const hiddenInstruction = `Create a single, isolated educational illustration on a pure white background. MAIN SUBJECT TO DRAW: "${promptInput}". 
CRITICAL RULE: Draw EXACTLY what is requested. If the subject is an inanimate object, animal, or food (like an apple), draw ONLY that object - NO HUMANS, NO FACES. If the subject is specifically a person or an action involving a person, draw a caucasian character.
Style: ${styleModifier}. Strictly NO background scenery. Highly recognizable, single subject focus. ABSOLUTELY NO TEXT, NO WORDS, NO LETTERS.`;
                        
                        try {
                            const imgData = await fetchEduBoxImage(hiddenInstruction);
                            if(imgData) {
                                setGeneratedImage(imgData);
                                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                            } else {
                                throw new Error("Brak danych obrazu");
                            }
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd pobierania obrazu. Upewnij się, że serwer API jest aktywny.', 'error');
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const addCard = () => {
                if (generatedImage) {
                    // Kompresja obrazu przed zapisaniem do tablicy (Bezpieczne dla iframes)
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 400; canvas.height = 400;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 400, 400);
                        ctx.drawImage(img, 0, 0, 400, 400);
                        
                        const compressedImg = canvas.toDataURL('image/jpeg', 0.85); 
                        
                        const newItem = {
                            id: Date.now(),
                            img: compressedImg,
                            label: promptInput.substring(0, 15).toUpperCase()
                        };
                        
                        setSymbolCards(prev => [...prev, newItem]);
                        setGeneratedImage(null);
                        setPromptInput('');
                    };
                    img.onerror = () => {
                        // Awaryjne dodanie bez kompresji w razie błędu ładowania Image
                        const newItem = {
                            id: Date.now(),
                            img: generatedImage,
                            label: promptInput.substring(0, 15).toUpperCase()
                        };
                        setSymbolCards(prev => [...prev, newItem]);
                        setGeneratedImage(null);
                        setPromptInput('');
                    };
                    img.src = generatedImage;
                }
            };

            const removeCard = (id) => setSymbolCards(symbolCards.filter(item => item.id !== id));
            const updateLabel = (id, newLabel) => setSymbolCards(symbolCards.map(item => item.id === id ? { ...item, label: newLabel } : item));
            
            const clearCards = () => {
                setShowClearConfirm(true); // Otwiera piękny Modal zamiast crashującego systemowego confirm()
            };

            const publishToGielda = async () => {
                if(!generatedImage) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { 
                        promptInput, ageGroup, imageUrl: generatedImage
                    };
                    const shortTitle = promptInput.substring(0, 30) + (promptInput.length > 30 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('symbols_market', 'EduSymbol', shortTitle, configToSave);
                    showToast("Opublikowano pojedynczy symbol! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error"); 
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setPromptInput(item.config.promptInput || '');
                setAgeGroup(item.config.ageGroup || 'przedszkolaki');
                setGeneratedImage(item.config.imageUrl || null);
                setAppMode('generator');
                showToast("Wczytano symbol. Możesz przypiąć go do tablicy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            const handlePrintSymbols = () => {
                window.print();
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                            <i className="ph-bold ph-chats-circle text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-amber-400">Symbol</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-amber-600/20 text-amber-400 border border-amber-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Kreator Piktogramów
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-orange-600/20 text-orange-400 border border-orange-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-cards text-lg"></i> Giełda Symboli
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-amber-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-amber-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Symboli AAC</h2>
                            <p className="text-slate-400 mb-8">Pobieraj gotowe, udostępnione przez innych nauczycieli obrazki do swojej bazy kart.</p>

                            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-4 rounded-2xl flex flex-col hover:border-amber-500/50 transition-colors group">
                                        <div className="w-full aspect-square bg-white rounded-xl mb-4 overflow-hidden border-2 border-slate-300 relative flex items-center justify-center p-2">
                                            {item.config.imageUrl ? (
                                                <img src={item.config.imageUrl} className="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform duration-500 mix-blend-multiply" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-600"><i className="ph-thin ph-image text-4xl"></i></div>
                                            )}
                                        </div>
                                        <h3 className="text-sm font-black text-center text-white mb-2 uppercase tracking-wide">"{item.config.promptInput}"</h3>
                                        <div className="mt-auto flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-amber-600 text-white py-2 rounded-xl text-xs font-bold transition-colors">
                                                Wczytaj
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych symboli w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto print:p-0 print:overflow-visible">
                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 print:block">
                            
                            {/* LEWA KOLUMNA: GENERATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="text-left mb-8 fade-in">
                                    <div className="inline-flex items-center gap-2 bg-amber-900/30 border border-amber-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-amber-400 uppercase tracking-widest mb-4">
                                        Autyzm / Terapia AAC
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Generator <br/><span className="text-gradient">Kart AAC.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Twórz izolowane, czytelne grafiki do komunikacji alternatywnej. System ułoży je w siatkę gotową do wydruku!
                                    </p>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50">
                                    
                                    <div className="mb-6">
                                        <label className="block text-slate-300 font-bold mb-3 text-xs uppercase tracking-wider"><i className="ph-bold ph-user-circle"></i> Poziom detali (wiek dziecka):</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <button 
                                                onClick={() => setAgeGroup('maluchy')}
                                                className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'maluchy' ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                            >
                                                <span className="text-xl">🧸</span> Maluchy
                                            </button>
                                            <button 
                                                onClick={() => setAgeGroup('przedszkolaki')}
                                                className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'przedszkolaki' ? 'bg-orange-600/20 border-orange-500 text-orange-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                            >
                                                <span className="text-xl">🎨</span> Przedszkole
                                            </button>
                                            <button 
                                                onClick={() => setAgeGroup('szkolne')}
                                                className={`p-2 rounded-xl border-2 font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${ageGroup === 'szkolne' ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                            >
                                                <span className="text-xl">🎒</span> Szkolne
                                            </button>
                                        </div>
                                    </div>

                                    <label className="block text-white font-bold mb-3 text-sm"><i className="ph-bold ph-text-t"></i> Słowo, czynność, cyfra lub litera:</label>
                                    <div className="relative mb-6">
                                        <input 
                                            type="text" 
                                            value={promptInput}
                                            onChange={(e) => setPromptInput(e.target.value)}
                                            onKeyPress={(e) => { if(e.key === 'Enter') generateSymbolCard(); }}
                                            placeholder="Np. jabłko, litera A, biega..."
                                            className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-amber-500 outline-none pr-12"
                                        />
                                    </div>

                                    <button 
                                        onClick={generateSymbolCard}
                                        disabled={isGenerating || !promptInput}
                                        className={`w-full py-4 rounded-xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(245,158,11,0.2)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 opacity-70 cursor-not-allowed' : 'bg-gradient-to-r from-amber-500 to-orange-500 hover:scale-105 active:scale-95'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Tworzenie karty...</>
                                        ) : <><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Obrazek</>}
                                    </button>

                                    <div className="mt-4 p-4 bg-amber-900/20 rounded-xl border border-amber-500/30 text-slate-300 text-xs text-center leading-relaxed">
                                        <span className="text-amber-400 font-bold">💡 Tip dla AI:</span> Pisz konkretnie: zamiast <span className="italic">"jeść"</span> napisz <b>"chłopiec je jabłko"</b>.
                                    </div>
                                </div>
                                
                                {/* WYNIK GENEROWANIA - POJEDYNCZY SYMBOL */}
                                {generatedImage && (
                                    <div ref={resultRef} className="glass-panel p-6 rounded-[2rem] fade-in border border-amber-500/30 text-center relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                                        
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-sm font-bold text-white">Oto Twój Symbol:</h3>
                                            <button onClick={publishToGielda} disabled={isSavingToGielda} className="text-[10px] bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors">
                                                <i className="ph-bold ph-globe"></i> Zapisz na Giełdzie
                                            </button>
                                        </div>

                                        <div className="bg-white p-2 rounded-xl mx-auto w-40 h-40 flex items-center justify-center mb-6 border-2 border-slate-300 shadow-inner">
                                            <img src={generatedImage} alt="Symbol AAC" className="max-w-full max-h-full object-contain mix-blend-multiply" />
                                        </div>
                                        
                                        <button 
                                            onClick={addCard} 
                                            className="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-lg"
                                        >
                                            <i className="ph-bold ph-plus-circle text-lg"></i> Przypnij na Tablicę
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* PRAWA KOLUMNA: TABLICA KART AAC */}
                            <div className="lg:col-span-7 glass-panel rounded-[2.5rem] p-6 sm:p-8 border border-slate-700/50 flex flex-col h-full min-h-[600px] print:p-0 print:border-none print:bg-white print:min-h-0 print:block">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-slate-700/50 gap-4 print-hidden">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                        <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                            📂 Zebrane Karty
                                            <span className="bg-amber-500 text-white text-xs px-2 py-1 rounded-full">{symbolCards.length}</span>
                                        </h2>
                                        <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-600">
                                            <span className="text-xs text-slate-400 font-bold uppercase"><i className="ph-bold ph-arrows-out"></i> Rozmiar:</span>
                                            <select value={cardSize} onChange={e => setCardSize(e.target.value)} className="bg-transparent text-white text-sm font-bold outline-none cursor-pointer">
                                                <option value="4">Małe (4x4 cm)</option>
                                                <option value="5">Duże (5x5 cm)</option>
                                                <option value="7">Wielkie (7x7 cm)</option>
                                            </select>
                                        </div>
                                    </div>
                                    {symbolCards.length > 0 && (
                                        <div className="flex flex-wrap items-center gap-3">
                                            <button onClick={clearCards} className="text-slate-400 hover:text-red-400 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-800 transition-colors flex items-center gap-1">
                                                <i className="ph-bold ph-trash"></i> Wyczyść
                                            </button>
                                            <button onClick={handlePrintSymbols} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-5 py-2.5 rounded-xl font-black flex items-center gap-2 transition-all shadow-lg btn-bounce">
                                                <i className="ph-bold ph-printer text-lg"></i> Drukuj Karty
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* TYLKO DO DRUKU - Nagłówek */}
                                <div className="hidden print:block text-center mb-8">
                                    <h1 className="text-2xl font-black uppercase text-black mb-1">Karty Komunikacji Alternatywnej</h1>
                                    <p className="text-sm text-gray-500">Wytnij, zalaminuj i przyczep rzepy. Rozmiar: {cardSize}x{cardSize} cm.</p>
                                </div>

                                {symbolCards.length === 0 ? (
                                    <div className="flex-grow flex flex-col items-center justify-center text-center opacity-50 print-hidden">
                                        <i className="ph-thin ph-cards text-7xl mb-4"></i>
                                        <p className="text-slate-300 font-bold text-lg">Tablica z kartami jest pusta.</p>
                                        <p className="text-slate-400 text-sm max-w-xs mt-2">Wygeneruj i dodaj przedmioty, aby zebrać materiał do wspólnego wydruku.</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-wrap gap-4 auto-rows-max overflow-y-auto pr-2 pb-10 content-start print:overflow-visible symbol-grid-print" 
                                         style={{ maxHeight: "calc(100vh - 250px)", gridTemplateColumns: `repeat(auto-fill, ${cardSize}cm)` }}>
                                        {symbolCards.map((item) => (
                                            <div key={item.id} className="bg-white rounded-xl border-2 border-slate-300 w-28 h-28 flex flex-col relative group symbol-item-enter overflow-hidden shadow-md symbol-card-print"
                                                 style={{ width: `${cardSize}cm`, height: `${cardSize}cm`, borderRadius: '0' }}>
                                                <button 
                                                    onClick={() => removeCard(item.id)}
                                                    className="absolute -top-1 -right-1 bg-red-500 hover:bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity z-10 btn-bounce print-hidden"
                                                    title="Usuń"
                                                >
                                                    <i className="ph-bold ph-x text-xs"></i>
                                                </button>
                                                
                                                <div className="flex-grow flex items-center justify-center p-1" style={{ height: `calc(${cardSize}cm - 15px)` }}>
                                                    <img src={item.img} className="max-w-full max-h-full object-contain mix-blend-multiply" alt="Symbol AAC" />
                                                </div>
                                                
                                                <div className="border-t-2 border-slate-300 flex items-center justify-center" style={{ height: cardSize === '4' ? '12px' : '15px' }}>
                                                    <input 
                                                        type="text" 
                                                        value={item.label} 
                                                        onChange={(e) => updateLabel(item.id, e.target.value)}
                                                        className="w-full h-full bg-white text-black text-center font-black outline-none uppercase px-1 print:bg-transparent"
                                                        style={{ fontSize: cardSize === '4' ? '7px' : '9px' }}
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* NOTA PRAWNA */}
                        <div className="mt-12 mb-4 text-[10px] text-slate-500 text-center max-w-4xl mx-auto border-t border-slate-800/50 pt-6 leading-relaxed print-hidden">
                            <p><strong className="text-slate-400">Nota prawna (Disclaimer):</strong> Ta aplikacja pomaga nauczycielom w generowaniu uniwersalnych i spersonalizowanych symboli do wspierania komunikacji specjalnej (AAC). Narzędzie to nie zastępuje profesjonalnej diagnozy i terapii logopedycznej.</p>
                        </div>

                    </div>

                    {/* MODAL POTWIERDZENIA CZYSZCZENIA (Bezpieczna alternatywa dla window.confirm) */}
                    {showClearConfirm && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm print-hidden">
                            <div className="glass-panel p-8 rounded-3xl max-w-sm w-full border border-red-500/30 text-center shadow-2xl">
                                <i className="ph-fill ph-warning-circle text-5xl text-red-500 mb-4"></i>
                                <h3 className="text-xl font-bold text-white mb-2">Wyczyścić tablicę?</h3>
                                <p className="text-sm text-slate-300 mb-6">Tej operacji nie można cofnąć. Wszystkie zebrane karty zostaną trwale usunięte.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowClearConfirm(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors">Anuluj</button>
                                    <button onClick={() => { setSymbolCards([]); setShowClearConfirm(false); showToast("Tablica wyczyszczona", "info"); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">Usuń wszystko</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
