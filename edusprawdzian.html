    <style>
        body { 
            background-color: #020617;

        .text-gradient { background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Stylizacja wydruku - Czysty układ dokumentu */
        @media print {

            .aura-blob { display: none !important; }

            .print-only { display: block !important; }

  <link rel="canonical" href="https://eduboxpro.pl/edusprawdzian.html">
  <meta name="description" content="Zrobi test (Grupa A i B) na podstawie wklejonej notatki z lekcji. Za darmo, prosto z przeglądarki – EduBox AI.">

<body class="custom-scrollbar">
    
    <!-- Kontener na globalne menu -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>
    
    <div id="root"></div>

        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SYSTEM_PROMPT = `Jesteś wybitnym metodykiem edukacyjnym. Twoim zadaniem jest stworzenie profesjonalnego sprawdzianu na podstawie dostarczonego materiału.

WYMAGANIA:
1. Sprawdzian musi mieć różnorodne typy zadań (zamknięte ABCD, prawda/fałsz, zadania z luką, zadania otwarte).
2. Sprawdzian musi być podzielony na Grupę A i Grupę B (podobny stopień trudności, ale zmienione pytania/kolejność odpowiedzi, aby zapobiec ściąganiu).
3. Na końcu MUSI znajdować się dokładny Klucz Odpowiedzi dla obu grup wraz z sugerowaną punktacją.

WYMAGANY FORMAT ZWROTU (użyj dokładnie tych znaczników jako separatorów):
[GRUPA_A]
(Tutaj treść sprawdzianu dla Grupy A, dodaj pole na Imię, Nazwisko, Klasę i Datę)

[GRUPA_B]
(Tutaj treść sprawdzianu dla Grupy B, dodaj pole na Imię, Nazwisko, Klasę i Datę)

[KLUCZ]
(Tutaj klucz odpowiedzi i punktacja)`;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [sourceText, setSourceText] = useState('');
            const [classLevel, setClassLevel] = useState('Klasy 4-6');
            const [questionCount, setQuestionCount] = useState('6 pytań (krótki)');
            const [isGenerating, setIsGenerating] = useState(false);
            
            // Wyniki
            const [resultA, setResultA] = useState('');
            const [resultB, setResultB] = useState('');
            const [resultKey, setResultKey] = useState('');
            const [activeTab, setActiveTab] = useState('grupaA'); // 'grupaA', 'grupaB', 'klucz'

            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'tests_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === PARSER & API ===
            const parseResponse = (fullText) => {
                try {
                    const partsA = fullText.split('[GRUPA_B]');
                    const textA = partsA[0].replace('[GRUPA_A]', '').trim();
                    const partsB = partsA[1].split('[KLUCZ]');
                    const textB = partsB[0].trim();
                    const textKey = partsB[1].trim();

                    setResultA(textA);
                    setResultB(textB);
                    setResultKey(textKey);
                    setActiveTab('grupaA');
                } catch (e) {
                    setResultA(fullText);
                    setResultB("Błąd parsowania Grupy B. Zobacz wynik w zakładce Grupa A.");
                    setResultKey("Błąd parsowania Klucza. Zobacz wynik w zakładce Grupa A.");
                }
            };

            const fetchEduBoxTest = async (promptText) => {
                const finalPrompt = `Poziom: ${classLevel}\nDługość testu: ${questionCount}\n\nMATERIAŁ BAZOWY DO SPRAWDZIANU:\n"""\n${promptText}\n"""`;
                
                try {
                    // Endpoint integracyjny (GPT-4o-mini preferowany do testów logiki)
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: finalPrompt, system: SYSTEM_PROMPT, temperature: 0.3, model: "gpt-4o-mini" })
                    });
                    
                    if (!res.ok) throw new Error(`API Error: ${res.status}`);
                    const data = await res.json();
                    return data.text || data.message;
                } catch (err) {
                    console.warn("Spadek na model lokalny w celach demonstracyjnych z powodu braku API:", err);
                    // Symulacja błędu z wczytaniem próbki (Falllback) jeśli API zawiedzie
                    throw new Error("API niedostępne");
                }
            };

            // === LOGIC ===
            const generateTest = () => {
                if (!sourceText.trim()) { showToast('Proszę wkleić tekst bazowy lub zagadnienia do sprawdzianu.', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setResultA(''); setResultB(''); setResultKey('');
                        
                        try {
                            const resultText = await fetchEduBoxTest(sourceText);
                            parseResponse(resultText);
                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd serwera API. Wczytuję materiał demonstracyjny.', 'error');
                            // Demo
                            const demoText = `[GRUPA_A]\nImię i nazwisko: ....................................... Klasa: ........ Data: ........\nSprawdzian - (Grupa A)\n\nZadanie 1. (1 pkt) Zaznacz prawidłową odpowiedź.\nCo jest centrum dowodzenia komórką zwierzęcą?\nA. Wakuola\nB. Jądro komórkowe\nC. Cytoplazma\nD. Błona komórkowa\n\n[GRUPA_B]\nImię i nazwisko: ....................................... Klasa: ........ Data: ........\nSprawdzian - (Grupa B)\n\nZadanie 1. (1 pkt) Zaznacz prawidłową odpowiedź.\nKtóry element komórki chroni ją przed czynnikami zewnętrznymi?\nA. Jądro komórkowe\nB. Chloroplast\nC. Błona komórkowa\nD. Wakuola\n\n[KLUCZ]\nKLUCZ ODPOWIEDZI I PUNKTACJA\n\nGrupa A:\nZad 1. B (1 pkt)\n\nGrupa B:\nZad 1. C (1 pkt)`;
                            parseResponse(demoText);
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!resultA) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { 
                        classLevel, questionCount, sourceText, resultA, resultB, resultKey
                    };
                    const shortTitle = sourceText.substring(0, 40) + (sourceText.length > 40 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('tests_market', 'EduSprawdzian', shortTitle, configToSave);
                    showToast("Opublikowano na Giełdzie Sprawdzianów! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setClassLevel(item.config.classLevel || 'Klasy 4-6');
                setQuestionCount(item.config.questionCount || '6 pytań (krótki)');
                setSourceText(item.config.sourceText || '');
                setResultA(item.config.resultA || '');
                setResultB(item.config.resultB || '');
                setResultKey(item.config.resultKey || '');
                setActiveTab('grupaA');
                setAppMode('generator');
                showToast("Wczytano sprawdzian z Giełdy!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            const printDocument = () => {
                window.print();
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                            <i className="ph-bold ph-exam text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-cyan-400">Sprawdzian</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-cyan-600/20 text-cyan-400 border border-cyan-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-pencil-line text-lg"></i> Kreator Testów
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-books text-lg"></i> Giełda Sprawdzianów
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-cyan-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-cyan-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-cyan-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Sprawdzianów</h2>
                            <p className="text-slate-400 mb-8">Pobieraj gotowe sprawdziany i klucze odpowiedzi stworzone przez innych nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-cyan-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="p-3 rounded-xl bg-cyan-500/10 text-cyan-400 group-hover:scale-110 transition-transform">
                                                <i className="ph-fill ph-exam text-2xl"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">"{item.name}"</h3>
                                        <p className="text-xs text-slate-400 mb-4">{item.config.classLevel} • {item.config.questionCount}</p>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-cyan-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Pobierz Test do druku
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych sprawdzianów w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-4xl mx-auto print-hidden">
                            
                            {/* Nagłówek */}
                            <div className="text-center mb-10">
                                <div className="inline-flex items-center gap-2 bg-cyan-900/30 border border-cyan-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-cyan-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                    Narzędzie dla Nauczycieli
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Sprawdziany <span className="text-gradient">bez wysiłku.</span>
                                </h1>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto font-medium">
                                    Wklej tekst z podręcznika lub notatkę, a AI wygeneruje w pełni profesjonalny test z podziałem na Grupę A, Grupę B oraz szczegółowy Klucz Odpowiedzi.
                                </p>
                            </div>

                            {/* Panel Sterowania */}
                            <div className="glass-panel p-6 sm:p-8 rounded-[2rem] border border-slate-700/50">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">Grupa docelowa:</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['Klasy 1-3', 'Klasy 4-6', 'Klasy 7-8', 'Szkoła Średnia'].map(lvl => (
                                                <button key={lvl} onClick={() => setClassLevel(lvl)} className={`py-2 px-3 rounded-xl text-sm font-bold border-2 transition-all ${classLevel === lvl ? 'bg-cyan-600/20 border-cyan-500 text-cyan-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                    {lvl}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">Wielkość sprawdzianu:</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['Kartkówka (3-4 pyt.)', '6 pytań (krótki)', '10 pytań (średni)', '15 pytań (duży)'].map(count => (
                                                <button key={count} onClick={() => setQuestionCount(count)} className={`py-2 px-3 rounded-xl text-sm font-bold border-2 transition-all ${questionCount === count ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                                    {count}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider flex items-center gap-2">
                                        <i className="ph-bold ph-text-t text-cyan-400 text-lg"></i> Wklej tekst bazowy, notatkę z lekcji lub temat:
                                    </label>
                                    <textarea 
                                        value={sourceText}
                                        onChange={(e) => setSourceText(e.target.value)}
                                        placeholder="Skopiuj fragment podręcznika, wklej link do artykułu lub po prostu wpisz: 'Sprawdzian z ułamków zwykłych: dodawanie, odejmowanie i skracanie'."
                                        className="w-full h-40 bg-slate-900/50 border border-slate-700 text-slate-200 rounded-2xl p-4 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 custom-scrollbar resize-y text-sm sm:text-base leading-relaxed"
                                    ></textarea>
                                </div>

                                <div className="mt-8 flex justify-end">
                                    <button 
                                        onClick={generateTest}
                                        disabled={isGenerating || !sourceText.trim()}
                                        className={`w-full sm:w-auto px-10 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(34,211,238,0.2)]
                                            ${isGenerating ? 'bg-slate-700 opacity-70 cursor-not-allowed' : 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 hover:scale-105 active:scale-95'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Generowanie Sprawdzianu...</>
                                        ) : <><i className="ph-bold ph-magic-wand text-xl"></i> Utwórz Sprawdzian z Kluczem</>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* WYNIKI */}
                        {resultA && (
                            <div ref={resultRef} className="max-w-4xl mx-auto mt-12 print:mt-0 print:block">
                                
                                <div className="flex justify-between items-center bg-slate-800/50 p-1.5 rounded-2xl mb-6 border border-slate-700 print-hidden">
                                    <div className="flex flex-1 gap-1">
                                        <button onClick={() => setActiveTab('grupaA')} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all ${activeTab === 'grupaA' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>Grupa A</button>
                                        <button onClick={() => setActiveTab('grupaB')} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all ${activeTab === 'grupaB' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>Grupa B</button>
                                        <button onClick={() => setActiveTab('klucz')} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all ${activeTab === 'klucz' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>Klucz 🗝️</button>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 mb-6 print-hidden">
                                    <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                        <i className="ph-bold ph-globe text-lg"></i> Zapisz na Giełdzie
                                    </button>
                                    <button onClick={printDocument} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-md">
                                        <i className="ph-bold ph-printer text-lg"></i> Drukuj to / PDF
                                    </button>
                                </div>

                                <div className="glass-panel p-8 sm:p-14 rounded-[2.5rem] border border-cyan-500/30 shadow-2xl relative bg-white print:shadow-none print:border-none print:p-0 print:rounded-none">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-cyan-400 to-blue-600 print-hidden"></div>
                                    
                                    {/* Widok wewnątrz kartki (klasa .test-paper) używa ładnego fontu szeryfowego Lora */}
                                    <div className="test-paper text-slate-900 font-serif text-[15px] sm:text-[16px] leading-relaxed whitespace-pre-wrap selection:bg-cyan-200">
                                        {activeTab === 'grupaA' && resultA}
                                        {activeTab === 'grupaB' && resultB}
                                        {activeTab === 'klucz' && resultKey}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
