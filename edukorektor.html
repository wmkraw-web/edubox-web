<body>
    <!-- KONTENER NA WSPÓLNE MENU V3 PRO MAX -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>

    <!-- ========================================================= -->
        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SYSTEM_PROMPT = `Jesteś ekspertem ds. edukacji i Oceniania Kształtującego (OK / NAZU). 
Twoje zadanie: Przeanalizuj tekst/odpowiedź ucznia oraz (jeśli podano) kryteria nauczyciela. Następnie wygeneruj profesjonalną, wspierającą informację zwrotną dla ucznia.

WYMOGI STYLU I STRUKTURY:
1. Zacznij od przyjaznego przywitania (np. "Cześć, dziękuję za Twoją pracę!").
2. 🟢 MOCNE STRONY: Wypunktuj co najmniej 2 konkretne rzeczy, które uczeń zrobił dobrze. Chwal za wysiłek i konkretne elementy.
3. 🔴 DO POPRAWY: Wskaż delikatnie błędy (np. błędy ortograficzne, braki merytoryczne, brak rozwinięcia myśli). Używaj języka korzyści ("warto zwrócić uwagę na...").
4. 💡 WSKAZÓWKA NA PRZYSZŁOŚĆ: Podaj 1-2 konkretne kroki, co uczeń ma zrobić, by następnym razem praca była lepsza (np. "przeczytaj tekst dwa razy na głos przed oddaniem").
5. Utrzymuj język odpowiedni dla szkoły (kulturalny, ale bez nadmiernego, zimnego żargonu).
6. Używaj emotikonów (🟢, 🔴, 💡), aby tekst był czytelny dla ucznia i gotowy do wklejenia do e-dziennika (Librus/Vulcan).`;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            // --- LOCAL STATES ---
            const [studentText, setStudentText] = useState('');
            const [teacherNotes, setTeacherNotes] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [copyStatus, setCopyStatus] = useState('Skopiuj opinię');
            const [toastMessage, setToastMessage] = useState('');

            const resultRef = useRef(null);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO' || status === 'active') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_edukorektor', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const handleVerifyCode = async (e) => {
                e?.preventDefault();
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (!studentText.trim() || !generatedText) {
                    showToast("Musisz najpierw wygenerować opinię, aby ją udostępnić!");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Ocena: ${studentText.substring(0, 30)}...`;
                            const config = { studentText, teacherNotes, generatedText };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_edukorektor', 'Ocena Kształtująca', name, config);
                            showToast("✨ Udostępniono w Giełdzie Wzorów!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c) {
                    if(c.studentText) setStudentText(c.studentText);
                    if(c.teacherNotes) setTeacherNotes(c.teacherNotes || '');
                    if(c.generatedText) setGeneratedText(c.generatedText);
                    
                    setAppMode('editor');
                    showToast("✨ Załadowano Ocenę z Giełdy!");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                }
            };

            // --- GENERATOR AI ---
            const handleGenerateFeedback = () => {
                if (!studentText.trim()) {
                    setError('Proszę wkleić pracę ucznia do oceny.');
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        generateFeedback();
                    },
                    (msg) => { setError(''); showToast(msg); },
                    (msg) => showToast(msg)
                );
            };

            const generateFeedback = async () => {
                setIsGenerating(true);
                setError('');
                setGeneratedText('');
                setCopyStatus('Skopiuj opinię');

                try {
                    const finalPrompt = `Wygeneruj Ocenę Kształtującą.\n\nPRACA UCZNIA:\n"""\n${studentText}\n"""\n\nKRYTERIA/UWAGI NAUCZYCIELA (opcjonalnie):\n"""\n${teacherNotes || "Brak dodatkowych uwag. Oceń ogólnie poprawność i treść."}\n"""`;

                    const payload = {
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        generationConfig: { temperature: 0.4 } 
                    };

                    let data;
                    if (window.location.hostname.includes('vercel.app') || (window.location.hostname !== '' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1')) {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ payload, type: 'text' })
                        });
                        if (!response.ok) throw new Error(`Błąd serwera API: ${response.status}`);
                        data = await response.json();
                    } else {
                        const apiKey = ""; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`Błąd API: ${response.status}`);
                        data = await response.json();
                    }

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        setGeneratedText(text);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    console.error("Błąd generowania:", err);
                    setError('Brak podłączenia do AI. Wyświetlam opinię pokazową (Demo).');
                    
                    setTimeout(() => {
                        const demoText = `Cześć! Dziękuję za oddanie wypracowania o "Kamieniach na szaniec". Przeczytałem je z dużą uwagą.\n\n🟢 MOCNE STRONY:\n• Świetnie uchwyciłeś główny motyw przyjaźni między bohaterami. Widać, że znasz treść lektury.\n• Podoba mi się Twoje bogate słownictwo w drugim akapicie (użyłeś świetnych synonimów).\n\n🔴 DO POPRAWY:\n• Zwróć uwagę na ortografię. Pojawiły się błędy w pisowni wyrazów z "rz" i "ż" (np. "bohaterzy", "narząd").\n• Praca kończy się dość nagle. Zabrało krótkiego podsumowania Twoich rozważań.\n\n💡 WSKAZÓWKA NA PRZYSZŁOŚĆ:\nPrzed oddaniem kolejnej pracy spróbuj przeczytać tekst na głos – to pomoże Ci wyłapać ucięte zdania. Warto też mieć pod ręką słownik ortograficzny, gdy nie jesteś pewien pisowni trudniejszego słowa.\n\nDobra robota, trzymaj tak dalej!`;
                        setGeneratedText(demoText);
                        setIsGenerating(false);
                    }, 1500);
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = () => {
                if (!generatedText) return;
                const textArea = document.createElement("textarea");
                textArea.value = generatedText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                setCopyStatus('Skopiowano! ✓');
                setTimeout(() => setCopyStatus('Skopiuj opinię'), 3000);
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        <div className="hero-glow"></div>
                        
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-violet-600 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-violet-400">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-books text-4xl"></i> Baza Opinii</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Wzory Ocen (Kopiuj / Inspiruj się)</h3>
                                <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-5 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-3 shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="flex justify-between items-start gap-3">
                                                <span className="text-base font-bold text-slate-200 group-hover:text-fuchsia-400 transition-colors line-clamp-2 leading-relaxed">{p.name}</span>
                                                <span className="text-[10px] font-bold px-2 py-1 rounded bg-violet-900/50 border border-violet-500/30 text-violet-300 whitespace-nowrap uppercase tracking-widest">{p.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center font-bold">
                                                <p className="text-xs text-slate-500">Autor: <span className="text-slate-300">{p.userId.substring(0,6)}</span></p>
                                                <p className="text-xs text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="text-center py-10 opacity-50">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-500 mx-auto block"></i>
                                            <p className="text-base text-slate-400 font-bold">Brak ocen w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Editor
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-violet-600 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-violet-400 print-hidden">
                            {toastMessage}
                        </div>
                    )}

                    {/* EKRAN ŁADOWANIA */}
                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-violet-500/30 shadow-[0_0_50px_rgba(139,92,246,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-violet-500 rounded-full animate-spin"></div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Analizuję Prace...</h3>
                                    <p className="text-xs text-slate-400 font-medium">Sprawdzam poprawność i generuję NAZU.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-16 pb-20 px-4 sm:px-6">
                        <div className="max-w-6xl mx-auto">
                            
                            {/* ODBLOKOWANIE PREMIUM / BAZA WZORÓW */}
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10 fade-in print-hidden">
                                {!isPremium ? (
                                    <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-violet-500/30 bg-violet-950/20 w-full md:w-auto">
                                        <div className="flex flex-col px-2">
                                            <span className="text-[10px] font-bold text-violet-300 uppercase tracking-widest">Darmowe użycia: {Math.max(0, 5 - usageCount)}/5</span>
                                            <span className="text-[9px] text-slate-400 font-bold">Wersja Free</span>
                                        </div>
                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-40 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-violet-500 transition-colors uppercase"/>
                                            <button onClick={handleVerifyCode} className="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-lg text-xs font-bold transition-all shadow-md btn-bounce">OK</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                        <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                        <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduKorektor PRO Aktywny</span>
                                    </div>
                                )}

                                <button onClick={() => setAppMode('gielda')} className="bg-fuchsia-600/20 hover:bg-fuchsia-600/40 text-fuchsia-300 border border-fuchsia-500/50 px-6 py-3 rounded-xl font-bold text-xs tracking-widest uppercase transition-all shadow-lg active:scale-95 flex items-center gap-2 w-full md:w-auto justify-center">
                                    <i className="ph-bold ph-files text-lg"></i> Baza Opinii
                                </button>
                            </div>

                            <div className="text-center mb-10 fade-in">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Gotowa informacja zwrotna w <span className="text-gradient">5 sekund.</span>
                                </h1>
                                <p className="text-slate-400 text-sm md:text-base max-w-2xl mx-auto font-medium">
                                    Wklej pracę ucznia, a sztuczna inteligencja wygeneruje profesjonalną Ocenę Kształtującą, podkreślając mocne strony i wskazując to, co wymaga poprawy.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in print-hidden" style={{animationDelay: '0.1s'}}>
                                {/* Pole Pracy Ucznia */}
                                <div className="glass-panel p-6 rounded-3xl border border-slate-700/50 flex flex-col">
                                    <label className="text-white font-bold mb-3 flex items-center gap-2 text-sm uppercase tracking-widest">
                                        <i className="ph-bold ph-pencil-simple text-violet-400 text-xl"></i>
                                        Wklej tekst ucznia:
                                    </label>
                                    <textarea 
                                        value={studentText}
                                        onChange={(e) => setStudentText(e.target.value)}
                                        placeholder="Np. Kamienie na szaniec to fajna ksiąszka. Bardzo podobał mi się Alek bo był odważny..."
                                        className="w-full flex-grow min-h-[220px] bg-slate-900/50 border border-slate-700 text-slate-200 rounded-2xl p-5 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 custom-scrollbar resize-y text-sm leading-relaxed"
                                    ></textarea>
                                </div>

                                {/* Pole Uwag Nauczyciela */}
                                <div className="glass-panel p-6 rounded-3xl border border-slate-700/50 flex flex-col">
                                    <label className="text-white font-bold mb-3 flex items-center gap-2 text-sm uppercase tracking-widest">
                                        <i className="ph-bold ph-target text-emerald-400 text-xl"></i>
                                        Twoje uwagi (opcjonalnie):
                                    </label>
                                    <textarea 
                                        value={teacherNotes}
                                        onChange={(e) => setTeacherNotes(e.target.value)}
                                        placeholder="Np. Skup się na błędach ortograficznych. Pochwal za znajomość lektury. Musi popracować nad długością zdań."
                                        className="w-full flex-grow min-h-[220px] bg-slate-900/50 border border-slate-700 text-slate-200 rounded-2xl p-5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 custom-scrollbar resize-y text-sm leading-relaxed"
                                    ></textarea>
                                </div>
                            </div>

                            {error && (
                                <div className="mt-6 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm text-center font-bold">
                                    {error}
                                </div>
                            )}

                            <div className="mt-8 flex justify-center fade-in print-hidden" style={{animationDelay: '0.2s'}}>
                                <button 
                                    onClick={handleGenerateFeedback}
                                    disabled={isGenerating || !studentText.trim()}
                                    className={`px-12 py-5 rounded-2xl font-black text-white text-sm tracking-widest uppercase transition-all flex items-center gap-3 shadow-lg btn-bounce
                                        ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-violet-600 to-emerald-600 hover:shadow-[0_0_30px_rgba(139,92,246,0.3)]'}`}
                                >
                                    <i className="ph-bold ph-magic-wand text-xl"></i>
                                    Generuj Ocenę Kształtującą {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                </button>
                            </div>

                            {/* Wynik */}
                            {generatedText && (
                                <div ref={resultRef} className="mt-12 glass-panel p-8 sm:p-10 rounded-3xl fade-in border-violet-500/30 shadow-[0_0_40px_rgba(168,85,247,0.15)] relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-violet-500 to-emerald-500 print-hidden"></div>
                                    
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4 print-hidden">
                                        <h3 className="text-2xl font-bold text-white flex items-center gap-3">
                                            <i className="ph-fill ph-check-circle text-emerald-400"></i> Twoja Ocena NAZU
                                        </h3>
                                        <div className="flex flex-wrap gap-2">
                                            <button 
                                                onClick={sharePattern}
                                                className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-all btn-bounce shadow-lg"
                                            >
                                                <i className="ph-bold ph-cloud-arrow-up text-lg"></i> Zapisz
                                            </button>
                                            <button 
                                                onClick={() => window.print()}
                                                className="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-all btn-bounce shadow-lg"
                                            >
                                                <i className="ph-bold ph-printer text-lg"></i> Drukuj
                                            </button>
                                            <button 
                                                onClick={copyToClipboard}
                                                className="bg-violet-600 hover:bg-violet-500 text-white px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest flex items-center gap-2 transition-all btn-bounce shadow-lg shadow-violet-500/20"
                                            >
                                                {copyStatus === 'Skopiowano! ✓' ? (
                                                    <i className="ph-bold ph-check text-emerald-300 text-lg"></i>
                                                ) : (
                                                    <i className="ph-bold ph-copy text-lg"></i>
                                                )}
                                                {copyStatus}
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-[#0f172a] p-8 rounded-2xl border border-slate-700/50">
                                        <p className="text-slate-200 whitespace-pre-wrap text-base sm:text-lg leading-relaxed font-medium">
                                            {generatedText}
                                        </p>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="py-6 border-t border-slate-800 text-center text-sm font-bold text-slate-600 uppercase tracking-widest mt-auto print-hidden">
                        Część systemu EduBox AI
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
