        const EXTENDED_COLORS = [

        ];

        const makeWhiteTransparent = (imageSrc) => {
            return new Promise((resolve) => {
                const img = new Image();
                if (!imageSrc.startsWith('blob:') && !imageSrc.startsWith('data:')) {
                    img.crossOrigin = 'Anonymous';
                }
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i]; const g = data[i+1]; const b = data[i+2];
                            if (r > 230 && g > 230 && b > 230) {
                                data[i+3] = 0; 
                            } else if (r > 200 && g > 200 && b > 200) {
                                data[i+3] = (255 - Math.max(r, g, b)) * 2; 
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch(e) { resolve(imageSrc); }
                };
                img.onerror = () => resolve(imageSrc);
                img.src = imageSrc;
            });
        };

        function App() {
            // MAIN MODES: 'editor' | 'gielda'
            const [appMode, setAppMode] = useState('editor');
            const [activeTab, setActiveTab] = useState('diploma');
            
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            const fileInputRef = useRef(null);

            // FIREBASE & GIEŁDA WZORÓW
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);

            const [diplomaTitle, setDiplomaTitle] = useState('DYPLOM');
            const [diplomaSubtitle, setDiplomaSubtitle] = useState('ZA WYBITNE OSIĄGNIĘCIA');
            const [studentName, setStudentName] = useState('Jan Kowalski');
            const [diplomaReason, setDiplomaReason] = useState('za udział w konkursie plastycznym "Wiosna w przedszkolu"\ni przygotowanie najpiękniejszej pracy.');
            const [diplomaDate, setDiplomaDate] = useState('Leżajsk, 31 Marca 2026');
            const [diplomaSignature, setDiplomaSignature] = useState('Wychowawca');
            
            const [textFormats, setTextFormats] = useState({
                title: { size: 64, bold: true, italic: false, color: '#0f172a' },
                subtitle: { size: 24, bold: true, italic: false, color: '#0f172a' },
                name: { size: 60, bold: true, italic: false, color: '#0f172a' },
                reason: { size: 22, bold: true, italic: false, color: '#0f172a' }
            });

            const [titleBoxWidth, setTitleBoxWidth] = useState(85); 
            const [titleBoxOpacity, setTitleBoxOpacity] = useState(0); 
            const [titleBoxOffset, setTitleBoxOffset] = useState(0);
            const [boxWidth, setBoxWidth] = useState(85); 
            const [boxOpacity, setBoxOpacity] = useState(90); 
            const [boxOffset, setBoxOffset] = useState(0);
            
            const [bgImageOpacity, setBgImageOpacity] = useState(100);
            const [diplomaTextColor, setDiplomaTextColor] = useState('#0f172a');
            const [diplomaBgColor, setDiplomaBgColor] = useState(THEMES[5].bgHex);
            const [diplomaBorderColor, setDiplomaBorderColor] = useState(THEMES[5].borderHex);
            const [borderStyle, setBorderStyle] = useState('solid'); 
            const [borderWidth, setBorderWidth] = useState(12);
            
            const [selectedThemeId, setSelectedThemeId] = useState('pasowanie');
            const [selectedFont, setSelectedFont] = useState('font-sans');
            const [artStyle, setArtStyle] = useState('3d'); 
            const [graphicLayout, setGraphicLayout] = useState('bottom_corners'); 
            const [diplomaOrientation, setDiplomaOrientation] = useState('horizontal');

            const [garlandText, setGarlandText] = useState('WITAJCIE');
            const [garlandTextColor, setGarlandTextColor] = useState('#ffffff');
            const [garlandLetterSize, setGarlandLetterSize] = useState(180); 
            const [garlandLetterOffset, setGarlandLetterOffset] = useState(50); 
            const [garlandShape, setGarlandShape] = useState('pennant'); 

            const [aiPrompt, setAiPrompt] = useState('');
            const [customImage, setCustomImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const activeTheme = THEMES.find(t => t.id === selectedThemeId) || THEMES[0];
            const isLandscape = activeTab === 'diploma' && diplomaOrientation === 'horizontal';

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            // INICJALIZACJA FIREBASE
            useEffect(() => {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);

                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (e) {
                        console.error("Błąd autoryzacji Firebase:", e);
                    }
                };
                initAuth();

                const unsubscribeAuth = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribeAuth();
            }, []);

            // ODCZYT GIEŁDY
            useEffect(() => {
                if (!user) return;
                const db = getFirestore();
                const appId = window.__app_id || 'eduboxpro';
                const publicRef = collection(db, 'artifacts', appId, 'public', 'data', 'gielda_wzorow_edugenerator');
                
                const unsubscribe = onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setPatterns(loaded);
                }, (error) => {
                    console.error("Błąd odczytu Giełdy:", error);
                });

                return () => unsubscribe();
            }, [user]);

            // OBSŁUGA LIMITÓW
            const checkLimitAndExecute = (actionFn) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) {
                    actionFn();
                    return;
                }
                
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                let usage = { date: today, count: 0 };
                
                if (usageStr) {
                    try {
                        const parsed = JSON.parse(usageStr);
                        if (parsed.date === today) usage = parsed;
                    } catch(e) {}
                }
                
                if (usage.count >= 5) {
                    showToast("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wymagane konto PRO!");
                    return;
                }
                
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                showToast(`Wykorzystano ${usage.count}/5 darmowych działań`);
                actionFn();
            };

            const sharePattern = async () => {
                if (!user) {
                    showToast("🚨 Brak połączenia z chmurą.");
                    return;
                }
                
                const currentConfig = {
                    activeTab, diplomaTitle, diplomaSubtitle, studentName, diplomaReason, diplomaDate, diplomaSignature,
                    textFormats, titleBoxWidth, titleBoxOpacity, titleBoxOffset, boxWidth, boxOpacity, boxOffset,
                    bgImageOpacity, diplomaTextColor, diplomaBgColor, diplomaBorderColor, borderStyle, borderWidth,
                    selectedThemeId, selectedFont, artStyle, graphicLayout, diplomaOrientation,
                    garlandText, garlandTextColor, garlandLetterSize, garlandLetterOffset, garlandShape,
                    customImage
                };
                
                try {
                    const db = getFirestore();
                    const appId = window.__app_id || 'eduboxpro';
                    const publicRef = collection(db, 'artifacts', appId, 'public', 'data', 'gielda_wzorow_edugenerator');
                    
                    const payload = {
                        userId: user.uid,
                        createdAt: serverTimestamp(),
                        type: activeTab === 'garland' ? 'Girlanda' : 'Dyplom',
                        name: `${activeTab === 'garland' ? 'Girlanda' : 'Dyplom'} - ${THEMES.find(t=>t.id===selectedThemeId)?.name || 'Własny'}`,
                        config: currentConfig
                    };

                    if (JSON.stringify(payload).length > 950000) {
                        showToast("🚨 Użyta grafika jest za duża by zapisać ją w chmurze (Max ~1MB)!");
                        return;
                    }

                    await addDoc(publicRef, payload);
                    showToast("✨ Zapisano w Giełdzie Wzorów!");
                } catch (e) {
                    console.error(e);
                    showToast("🚨 Błąd podczas zapisu w chmurze.");
                }
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(!c) return;
                
                setAppMode('editor');
                if (c.activeTab) setActiveTab(c.activeTab);
                if (c.diplomaTitle) setDiplomaTitle(c.diplomaTitle);
                if (c.diplomaSubtitle !== undefined) setDiplomaSubtitle(c.diplomaSubtitle);
                if (c.studentName) setStudentName(c.studentName);
                if (c.diplomaReason) setDiplomaReason(c.diplomaReason);
                if (c.diplomaDate) setDiplomaDate(c.diplomaDate);
                if (c.diplomaSignature) setDiplomaSignature(c.diplomaSignature);
                if (c.textFormats) setTextFormats(c.textFormats);
                if (c.titleBoxWidth) setTitleBoxWidth(c.titleBoxWidth);
                if (c.titleBoxOpacity !== undefined) setTitleBoxOpacity(c.titleBoxOpacity);
                if (c.titleBoxOffset !== undefined) setTitleBoxOffset(c.titleBoxOffset);
                if (c.boxWidth) setBoxWidth(c.boxWidth);
                if (c.boxOpacity !== undefined) setBoxOpacity(c.boxOpacity);
                if (c.boxOffset !== undefined) setBoxOffset(c.boxOffset);
                if (c.bgImageOpacity) setBgImageOpacity(c.bgImageOpacity);
                if (c.diplomaTextColor) setDiplomaTextColor(c.diplomaTextColor);
                if (c.diplomaBgColor) setDiplomaBgColor(c.diplomaBgColor);
                if (c.diplomaBorderColor) setDiplomaBorderColor(c.diplomaBorderColor);
                if (c.borderStyle) setBorderStyle(c.borderStyle);
                if (c.borderWidth !== undefined) setBorderWidth(c.borderWidth);
                if (c.selectedThemeId) setSelectedThemeId(c.selectedThemeId);
                if (c.selectedFont) setSelectedFont(c.selectedFont);
                if (c.artStyle) setArtStyle(c.artStyle);
                if (c.graphicLayout) setGraphicLayout(c.graphicLayout);
                if (c.diplomaOrientation) setDiplomaOrientation(c.diplomaOrientation);
                if (c.garlandText) setGarlandText(c.garlandText);
                if (c.garlandTextColor) setGarlandTextColor(c.garlandTextColor);
                if (c.garlandLetterSize) setGarlandLetterSize(c.garlandLetterSize);
                if (c.garlandLetterOffset !== undefined) setGarlandLetterOffset(c.garlandLetterOffset);
                if (c.garlandShape) setGarlandShape(c.garlandShape);
                if (c.customImage !== undefined) setCustomImage(c.customImage);
                else setCustomImage(null);
                
                showToast("✨ Wzór z Giełdy wczytany!");
            };

            useEffect(() => {
                setDiplomaBgColor(activeTheme.bgHex);
                setDiplomaBorderColor(activeTheme.borderHex);
            }, [selectedThemeId]);

            const handleVerifyCode = () => {
                if (accessCode.toUpperCase() === 'KAWA2024') { 
                    setIsPremium(true); setAccessCode(''); 
                    showToast("🎉 Moduł Premium odblokowany!"); 
                } else { 
                    showToast("❌ Nieprawidłowy kod!"); 
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const imgData = event.target.result;
                    if (graphicLayout === 'full_background') setCustomImage(imgData);
                    else {
                        const transparentImg = await makeWhiteTransparent(imgData);
                        setCustomImage(transparentImg);
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = null; 
            };

            const handleGenerateAiImage = async () => {
                if (!aiPrompt.trim()) return;
                setIsGenerating(true);
                let translatedPrompt = aiPrompt;
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=pl&tl=en&dt=t&q=${encodeURIComponent(aiPrompt)}`);
                    if (res.ok) { const data = await res.json(); translatedPrompt = data[0][0][0]; }
                } catch(e) {}

                let layoutModifier = graphicLayout === 'full_background' ? "full frame background scene, edge-to-edge illustration" : "isolated on pure solid white background, no text, no letters";
                let styleModifier = "";
                switch(artStyle) {
                  case 'watercolor': styleModifier = `beautiful watercolor art, pastel colors`; break;
                  case 'boho': styleModifier = `trendy boho style art, earthy colors`; break;
                  case 'vibrant': styleModifier = `vibrant bold colors, colorful cartoon`; break;
                  case 'papercraft': styleModifier = `3d papercraft illustration, cutouts`; break;
                  case 'realistic': styleModifier = `highly realistic photography style, 8k`; break;
                  case '3d': styleModifier = `highly detailed 3D Pixar Disney animation style`; break;
                  default: styleModifier = `flat vector illustration`;
                }
                let fullPrompt = `MAIN SUBJECT TO DRAW: ${translatedPrompt}. STYLE: ${styleModifier}. ${layoutModifier}. PERFECT human anatomy.`;
                
                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: fullPrompt })
                    });
                    if (!response.ok) throw new Error("Błąd łączenia z API.");
                    const data = await response.json();
                    
                    if (graphicLayout === 'full_background') {
                        setCustomImage(data.imageUrl);
                    } else {
                        const transparentImg = await makeWhiteTransparent(data.imageUrl);
                        setCustomImage(transparentImg);
                    }
                    showToast("✨ Grafika gotowa i wycięta!");
                } catch (e) { 
                    showToast("🚨 Błąd serwera. Spróbuj ponownie.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const updateFormat = (field, key, value) => {
                setTextFormats(prev => ({ ...prev, [field]: { ...prev[field], [key]: value } }));
            };

            const TextFormatToolbar = ({ format, onChange, maxSize = 120 }) => (
                <div className="flex flex-col gap-3 mt-2 bg-slate-900/80 p-3 rounded-xl border border-slate-700 shadow-sm transition-colors">
                    <div className="flex items-center gap-3">
                        <button onClick={() => onChange('bold', !format.bold)} className={`w-8 h-8 shrink-0 flex items-center justify-center rounded-lg text-sm font-serif transition-colors ${format.bold ? 'bg-indigo-600 text-white shadow-inner' : 'hover:bg-slate-700 text-slate-300'}`}><b>B</b></button>
                        <button onClick={() => onChange('italic', !format.italic)} className={`w-8 h-8 shrink-0 flex items-center justify-center rounded-lg text-sm font-serif transition-colors ${format.italic ? 'bg-indigo-600 text-white shadow-inner' : 'hover:bg-slate-700 text-slate-300'}`}><i>I</i></button>
                        
                        <div className="w-px h-6 bg-slate-700 shrink-0"></div>
                        
                        <i className="ph-bold ph-text-t text-slate-400 shrink-0"></i>
                        <input type="range" min="10" max={maxSize} value={format.size} onChange={e => onChange('size', Number(e.target.value))} className="w-full sm:w-32 shrink-0 accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                        <span className="text-[10px] font-bold text-slate-400 w-8 text-right shrink-0">{format.size}px</span>
                    </div>
                    
                    <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-700/50">
                        {EXTENDED_COLORS.map(c => (
                            <button

                                                        <p className="text-xs text-slate-400">Rysowanie zaawansowanych grafik AI wymaga konta PRO lub kodu dostępu.</p>
                                                        
                                                        <div className="flex items-center gap-2 mt-4 bg-slate-800 p-1.5 rounded-xl border border-slate-700 mx-auto w-full max-w-[200px]">
                                                            <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Premium..." className="px-3 py-1.5 bg-transparent text-sm w-full outline-none font-medium text-white placeholder-slate-500"/>
                                                            <button onClick={handleVerifyCode} className="p-2 text-white rounded-lg bg-indigo-600 hover:bg-indigo-500 transition-colors shadow-md btn-bounce"><i className="ph-bold ph-key"></i></button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-5">
                                                        <div className="bg-purple-900/20 p-5 rounded-2xl border border-purple-500/30">
                                                            <label className="text-[11px] font-bold text-purple-400 uppercase tracking-widest mb-3 flex items-center justify-center gap-2"><i className="ph-bold ph-magic-wand"></i> Generator Grafiki</label>
                                                            <textarea 
                                                                value={aiPrompt} onChange={e => setAiPrompt(e.target.value)} 
                                                                placeholder="Opisz po polsku co wygenerować (np. Sowa w okularach czytająca książkę)..." 
                                                                className="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none text-white focus:border-purple-500 transition-colors resize-none custom-scrollbar mb-3" rows="3"
                                                            />
                                                            <button onClick={handleGenerateAiImage} disabled={isGenerating || !aiPrompt.trim()} className="w-full bg-purple-600 text-white px-5 py-3 rounded-xl font-bold shadow-[0_0_20px_rgba(147,51,234,0.3)] hover:bg-purple-500 disabled:opacity-50 transition-all uppercase tracking-widest flex items-center justify-center gap-2 btn-bounce">
                                                                <i className="ph-bold ph-sparkle"></i> Wygeneruj i wytnij tło
                                                            </button>
                                                            {customImage && (
                                                                <button onClick={() => setCustomImage(null)} className="w-full mt-3 text-xs font-bold text-red-400 hover:bg-slate-800 py-2 border border-red-900/50 rounded-xl transition-colors">
                                                                    Usuń grafikę AI
                                                                </button>
                                                            )}
                                                        </div>

                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-3">Styl Rysowania</label>
                                                            <div className="grid grid-cols-2 gap-2">
                                                                {[
                                                                    { id: '3d', label: '🎬 Pixar 3D' },
                                                                    { id: 'watercolor', label: '🎨 Akwarela' },
                                                                    { id: 'doodle', label: '✏️ Szkic / Doodle' },
                                                                    { id: 'realistic', label: '📸 Realizm' }
                                                                ].map(style => (
                                                                    <button key={style.id} onClick={() => setArtStyle(style.id)} className={`py-2 text-[10px] font-bold rounded-lg transition-all border ${artStyle === style.id ? 'bg-purple-600 border-purple-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>{style.label}</button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {activeTab === 'sliders' && (
                                            <div className="space-y-6 animate-[reveal_0.2s_ease-out]">
                                                <div className="bg-slate-900 p-5 rounded-2xl border border-slate-700">
                                                    <label className="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-4 flex items-center justify-center gap-2"><i className="ph-bold ph-palette"></i> Paleta Kolorów Kartki</label>
                                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                        <ColorWidget label="Tło Kartki" value={diplomaBgColor} setValue={setDiplomaBgColor} />
                                                        <ColorWidget label="Ramka" value={diplomaBorderColor} setValue={setDiplomaBorderColor} />
                                                        <ColorWidget label="Stopka" value={diplomaTextColor} setValue={setDiplomaTextColor} />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-3">Styl Ramki</label>
                                                    <div className="grid grid-cols-4 gap-2">
                                                        <button onClick={() => setBorderWidth(0)} className={`py-2 rounded-lg text-[9px] font-bold border transition-colors ${borderWidth === 0 ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>Brak</button>
                                                        <button onClick={() => {setBorderStyle('solid'); setBorderWidth(4);}} className={`py-2 rounded-lg text-[9px] font-bold border transition-colors ${borderWidth === 4 ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>Cienka</button>
                                                        <button onClick={() => {setBorderStyle('solid'); setBorderWidth(16);}} className={`py-2 rounded-lg text-[9px] font-bold border transition-colors ${borderWidth === 16 && borderStyle === 'solid' ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>Gruba</button>
                                                        <button onClick={() => {setBorderStyle('dashed'); setBorderWidth(10);}} className={`py-2 rounded-lg text-[9px] font-bold border transition-colors ${borderStyle === 'dashed' ? 'bg-sky-600 text-white border-sky-500' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>Kreski</button>
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-4 border-t border-slate-700/50">
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider"><span>Pozycja Grafiki</span></div>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => setGraphicLayout('bottom_corners')} className={`flex-1 py-1.5 rounded bg-slate-800 text-[9px] font-bold ${graphicLayout === 'bottom_corners' ? 'text-white border border-sky-500' : 'text-slate-400'}`}>W rogach</button>
                                                            <button onClick={() => setGraphicLayout('bottom_center')} className={`flex-1 py-1.5 rounded bg-slate-800 text-[9px] font-bold ${graphicLayout === 'bottom_center' ? 'text-white border border-sky-500' : 'text-slate-400'}`}>Środek</button>
                                                            <button onClick={() => setGraphicLayout('full_background')} className={`flex-1 py-1.5 rounded bg-slate-800 text-[9px] font-bold ${graphicLayout === 'full_background' ? 'text-white border border-sky-500' : 'text-slate-400'}`}>Jako tło</button>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider"><span>Krycie Grafiki</span><span className="text-sky-400">{bgImageOpacity}%</span></div>
                                                        <input type="range" min="5" max="100" value={bgImageOpacity} onChange={e => setBgImageOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-2 bg-slate-700 rounded-lg appearance-none" />
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-4 border-t border-slate-700/50">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Szkło nad Tytułem</label>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przezroczystość tła</span></div>
                                                        <input type="range" min="0" max="100" value={titleBoxOpacity} onChange={e => setTitleBoxOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Szerokość</span></div>
                                                        <input type="range" min="50" max="100" value={titleBoxWidth} onChange={e => setTitleBoxWidth(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Góra/Dół</span></div>
                                                        <input type="range" min="-100" max="100" value={titleBoxOffset} onChange={e => setTitleBoxOffset(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                </div>

                                                <div className="space-y-4 pt-4 border-t border-slate-700/50">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Szkło w Środku</label>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przezroczystość tła</span></div>
                                                        <input type="range" min="0" max="100" value={boxOpacity} onChange={e => setBoxOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Szerokość</span></div>
                                                        <input type="range" min="50" max="100" value={boxWidth} onChange={e => setBoxWidth(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Góra/Dół</span></div>
                                                        <input type="range" min="-150" max="150" value={boxOffset} onChange={e => setBoxOffset(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* PANEL LEWY - GIEŁDA WZORÓW */
                            <div className="xl:col-span-4 flex flex-col gap-6 print-hidden">
                                <div className="glass-panel p-6 rounded-[2rem] border-t-4 border-fuchsia-500 shadow-lg h-full flex flex-col max-h-[850px]">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="font-black text-white uppercase tracking-widest text-sm flex items-center gap-2"><i className="ph-bold ph-users text-fuchsia-400"></i> Giełda Wzorów</h2>
                                        <button onClick={() => setAppMode('editor')} className="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold uppercase transition-colors btn-bounce"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                    </div>
                                    
                                    <button onClick={() => checkLimitAndExecute(sharePattern)} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-3 rounded-xl font-bold text-sm mb-6 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                        <i className="ph-bold ph-cloud-arrow-up text-lg"></i> Zapisz i udostępnij mój wzór
                                    </button>
                                    
                                    <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Ostatnio dodane wzory</h3>
                                    <div className="overflow-y-auto custom-scrollbar flex-1 space-y-3 pr-2">
                                        {patterns.map(p => (
                                            <div key={p.id} className="bg-slate-900 border border-slate-700 p-4 rounded-xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-2" onClick={() => loadPattern(p)}>
                                                <div className="flex justify-between items-start gap-2">
                                                    <span className="text-xs font-bold text-white group-hover:text-fuchsia-400 transition-colors line-clamp-2 leading-tight">{p.name}</span>
                                                    <span className={`text-[9px] font-bold px-2 py-1 rounded shrink-0 ${p.type === 'Dyplom' ? 'bg-indigo-900/50 text-indigo-300' : 'bg-amber-900/50 text-amber-300'}`}>{p.type}</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <p className="text-[9px] text-slate-500">Autor: <span className="text-slate-400">{p.userId.substring(0,6)}</span></p>
                                                    <p className="text-[9px] text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                                </div>
                                            </div>
                                        ))}
                                        {patterns.length === 0 && (
                                            <div className="text-center py-10 opacity-50">
                                                <i className="ph-bold ph-cloud-arrow-down text-4xl mb-2 text-slate-500"></i>
                                                <p className="text-xs text-slate-400">Pobieranie wzorów z chmury...</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PANEL PRAWY - PODGLĄD (OBSZAR DRUKU) */}
                        <div className="xl:col-span-8 flex justify-center items-start lg:sticky lg:top-28 self-start print:static w-full relative min-h-[600px] xl:h-auto">
                            
                            <div className="absolute inset-0 dark-grid-bg -z-10 rounded-[3rem] opacity-30 print-hidden"></div>

                            <div className="w-full h-full flex flex-col items-center justify-center relative sm:py-6">
                                {activeTab !== 'garland' ? (
                                    /* WIDOK: DYPLOM */
                                    <div 
                                        id="print-area"
                                        className={`relative flex flex-col justify-between rounded-[1rem] sm:rounded-[2rem] p-8 md:p-12 text-center shadow-[0_0_40px_rgba(0,0,0,0.5)] transition-all overflow-hidden bg-cover bg-center bg-no-repeat mx-auto
                                        ${diplomaOrientation === 'horizontal' ? 'w-full aspect-[1.414]' : 'h-[600px] md:h-[800px] aspect-[0.707]'}`}
                                        style={{ backgroundColor: diplomaBgColor, borderWidth: `${borderWidth}px`, borderStyle: borderStyle, borderColor: diplomaBorderColor, color: diplomaTextColor }}
                                    >
                                        {!customImage && (
                                            <div className="absolute inset-0 z-0 pointer-events-none opacity-[0.12] flex items-center justify-center space-x-20 scale-[1.8] sm:scale-150">
                                                <div className="text-[10rem] sm:text-[15rem] drop-shadow-lg">{activeTheme.elements[0]}</div>
                                                <div className="text-[10rem] sm:text-[15rem] drop-shadow-lg">{activeTheme.elements[1]}</div>
                                            </div>
                                        )}

                                        {customImage && (
                                            <div className="absolute inset-0 z-10 pointer-events-none overflow-hidden">
                                                {graphicLayout === 'full_background' ? (
                                                    <img src={customImage} className="w-full h-full object-cover" style={{ opacity: bgImageOpacity / 100 }} />
                                                ) : graphicLayout === 'bottom_corners' ? (
                                                    <>
                                                        <img src={customImage} className="absolute bottom-[-1rem] left-[-2rem] w-48 h-48 md:w-72 md:h-72 object-contain rotate-6 drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                        <img src={customImage} className="absolute bottom-[-1rem] right-[-2rem] w-48 h-48 md:w-72 md:h-72 object-contain -rotate-12 drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                    </>
                                                ) : graphicLayout === 'bottom_center' ? (
                                                    <img src={customImage} className="absolute bottom-[-2rem] left-1/2 -translate-x-1/2 w-64 h-64 md:w-[28rem] md:h-[28rem] object-contain drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                ) : null}
                                            </div>
                                        )}

                                        {!isPremium && <div className="absolute inset-0 z-50 flex items-center justify-center opacity-[0.03] rotate-[-35deg] text-4xl md:text-7xl font-black uppercase pointer-events-none select-none tracking-[1rem] text-slate-900">EDUGENERATOR</div>}

                                        {/* Szyba: Tytuł */}
                                        <div 
                                            className="z-20 relative mx-auto flex flex-col items-center justify-center transition-all py-3 px-6 md:py-6 md:px-10 rounded-[1.5rem] md:rounded-[2rem] flex-shrink-0"
                                            style={{ 
                                                width: `${titleBoxWidth}%`, transform: `translateY(${titleBoxOffset}px)`, 
                                                backgroundColor: `rgba(255,255,255,${titleBoxOpacity/100})`, 
                                                backdropFilter: titleBoxOpacity > 0 ? `blur(${(titleBoxOpacity/100)*16}px)` : 'none',
                                                border: titleBoxOpacity > 0 ? '1px solid rgba(255,255,255,0.4)' : 'none',
                                                boxShadow: titleBoxOpacity > 0 ? '0 10px 30px -10px rgba(0,0,0,0.1)' : 'none'
                                            }}
                                        >
                                            <div className="w-full">
                                                <h1 style={{ fontSize: `${textFormats.title.size}px`, color: textFormats.title.color, fontWeight: textFormats.title.bold ? 'bold' : 'normal', fontStyle: textFormats.title.italic ? 'italic' : 'normal', textShadow: '0 0 10px rgba(255,255,255,0.8)' }} className="tracking-[0.1em] md:tracking-[0.2em] uppercase leading-none drop-shadow-sm select-none break-words max-w-full whitespace-pre-wrap">{diplomaTitle}</h1>
                                                <h3 style={{ fontSize: `${textFormats.subtitle.size}px`, color: textFormats.subtitle.color, fontWeight: textFormats.subtitle.bold ? 'bold' : 'normal', fontStyle: textFormats.subtitle.italic ? 'italic' : 'normal' }} className="opacity-80 uppercase tracking-widest min-h-[1.5em] select-none break-words mt-2 max-w-full whitespace-pre-wrap">{diplomaSubtitle}</h3>
                                            </div>
                                        </div>

                                        {/* Szyba: Treść główna */}
                                        <div 
                                            className="z-20 relative mx-auto flex flex-col items-center justify-center transition-all py-4 px-6 md:py-10 md:px-14 rounded-[1.5rem] md:rounded-[2rem] border border-white/40 my-auto flex-grow-0"
                                            style={{ 
                                                width: `${boxWidth}%`, transform: `translateY(${boxOffset}px)`, 
                                                backgroundColor: `rgba(255,255,255,${boxOpacity/100})`, 
                                                backdropFilter: boxOpacity > 0 ? `blur(${(boxOpacity/100)*16}px)` : 'none',
                                                boxShadow: '0 25px 50px -12px rgba(0,0,0,0.15)'
                                            }}
                                        >
                                            <h2 style={{ fontSize: `${textFormats.name.size}px`, color: textFormats.name.color, fontWeight: textFormats.name.bold ? 'bold' : 'normal', fontStyle: textFormats.name.italic ? 'italic' : 'normal' }} className="border-b-2 border-slate-300/50 inline-block px-4 md:px-16 pb-2 md:pb-4 mb-3 md:mb-6 leading-tight w-full select-none max-w-full whitespace-pre-wrap break-words">{studentName}</h2>
                                            <p style={{ fontSize: `${textFormats.reason.size}px`, color: textFormats.reason.color, fontWeight: textFormats.reason.bold ? 'bold' : 'normal', fontStyle: textFormats.reason.italic ? 'italic' : 'normal' }} className="leading-snug md:leading-relaxed max-w-3xl select-none opacity-90 max-w-full whitespace-pre-wrap break-words">{diplomaReason}</p>
                                        </div>

                                        {/* Stopka z podpisami */}
                                        <div className="z-20 relative flex justify-between items-end px-2 md:px-12 flex-shrink-0 w-full select-none">
                                            <div className="text-center w-32 md:w-56 border-t-2 pt-2 md:pt-3" style={{ borderColor: `${diplomaTextColor}40` }}>
                                                <div className="font-bold text-xs md:text-lg mb-1" style={{ color: diplomaTextColor }}>{diplomaDate}</div>
                                                <div className="text-[6px] md:text-[9px] font-black uppercase opacity-60 tracking-wider" style={{ color: diplomaTextColor }}>Miejscowość i data</div>
                                            </div>
                                            <div className="text-center w-32 md:w-56 border-t-2 pt-2 md:pt-3" style={{ borderColor: `${diplomaTextColor}40` }}>
                                                <div className="font-bold text-xs md:text-lg mb-1 opacity-90" style={{ color: diplomaTextColor }}>{diplomaSignature}</div>
                                                <div className="text-[6px] md:text-[9px] font-black uppercase opacity-60 tracking-wider" style={{ color: diplomaTextColor }}>Podpis Nauczyciela</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    /* WIDOK: GIRLANDA */
                                    <div id="print-area" className="grid grid-cols-1 gap-12 print:block w-full flex flex-col items-center mt-4">
                                        <div className="absolute top-4 left-4 bg-slate-900/80 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 shadow-md print-hidden z-50">
                                            <i className="ph-bold ph-eye"></i> Widzisz podgląd 1 litery. Drukarka wypluje wszystkie strony.
                                        </div>
                                        
                                        {garlandText.split('').map((letter, idx) => (
                                            <div key={idx} className={`${idx === 0 ? 'block' : 'hidden'} print:block page-break relative aspect-[0.707] h-full sm:h-auto sm:w-[60%] mx-auto flex items-center justify-center bg-transparent print:w-[210mm] print:h-[297mm]`}>
                                                {renderGarlandShape(letter)}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="absolute -bottom-6 md:-bottom-12 left-1/2 -translate-x-1/2 flex items-center justify-center gap-2 sm:gap-4 print-hidden z-50 w-[95%] sm:w-auto">
                                <button onClick={() => checkLimitAndExecute(sharePattern)} className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-4 sm:px-8 py-4 sm:py-5 rounded-2xl font-black text-[10px] sm:text-sm md:text-base tracking-widest flex items-center justify-center gap-2 shadow-[0_10px_40px_rgba(192,38,211,0.4)] transition-all btn-bounce uppercase whitespace-nowrap flex-1 sm:flex-none">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl md:text-2xl"></i><span>Do Biblioteki</span>
                                </button>
                                <button onClick={() => checkLimitAndExecute(() => window.print())} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 sm:px-10 py-4 sm:py-5 rounded-2xl font-black text-[10px] sm:text-sm md:text-base tracking-widest flex items-center justify-center gap-2 md:gap-3 shadow-[0_10px_40px_rgba(99,102,241,0.5)] transition-all btn-bounce uppercase whitespace-nowrap flex-1 sm:flex-none">
                                    <i className="ph-bold ph-printer text-xl md:text-2xl"></i><span>Drukuj (PDF)</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
