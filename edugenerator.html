        const makeWhiteTransparent = (imageSrc) => new Promise((resolve) => {
            const img = new Image();
            if (!imageSrc.startsWith('blob:') && !imageSrc.startsWith('data:')) img.crossOrigin = 'Anonymous';
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i + 1], b = data[i + 2];
                        if (r > 230 && g > 230 && b > 230) data[i + 3] = 0;
                        else if (r > 200 && g > 200 && b > 200) data[i + 3] = (255 - Math.max(r, g, b)) * 2;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                } catch (e) { resolve(imageSrc); }
            };
            img.onerror = () => resolve(imageSrc);
            img.src = imageSrc;
        });

        // Zdjęcia z dysku zmniejszamy w przeglądarce (A4 nie potrzebuje 4000 px, a duży base64 zamula podgląd i PDF).
        const shrinkImage = (dataUrl, max = 1600) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, max / Math.max(img.width, img.height));
                if (scale === 1) return resolve(dataUrl);
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL(dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.9));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });

        const loadScript = (src) => new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) return resolve();
            const s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Nie udało się wczytać biblioteki do PDF.'));
            document.head.appendChild(s);
        });

        // Tekst edytowany wprost na dyplomie. DOM ustawiamy sami (nie przez React), żeby kursor nie skakał na koniec.
        function EditableText({ tag = 'div', value, onChange, editable, placeholder, className, style }) {
            const ref = useRef(null);
            useLayoutEffect(() => {
                const el = ref.current;
                if (el && document.activeElement !== el && el.innerText !== value) el.innerText = value || '';
            });
            const Tag = tag;
            return (
                <Tag
                    ref={ref}
                    className={`${className || ''} ${editable ? 'eg-editable' : ''}`}
                    style={style}
                    data-placeholder={placeholder || ''}
                    contentEditable={editable ? 'true' : 'false'}
                    suppressContentEditableWarning
                    spellCheck={false}
                    onInput={(e) => onChange && onChange(e.currentTarget.innerText.replace(/\n{3,}/g, '\n\n'))}
                    onBlur={(e) => onChange && onChange(e.currentTarget.innerText.trim())}
                />
            );
        }

                    <div style={{ position: 'absolute', inset: 0, padding: `${pad + (land ? 18 : 40)}px ${pad + 70}px ${pad + 6}px`, display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>

                            style={{ fontSize: d.sizes.title, color: d.titleColor, fontWeight: 700, lineHeight: 1.08, letterSpacing: '0.06em', textTransform: 'uppercase', textShadow, maxWidth: '100%', whiteSpace: 'pre-wrap', overflowWrap: 'anywhere' }} />

                                style={{ fontSize: d.sizes.reason, color: d.textColor, lineHeight: 1.45, fontWeight: 600, maxWidth: land ? 760 : 560, textShadow, whiteSpace: 'pre-wrap', overflowWrap: 'anywhere' }} />

        // Podgląd: dyplom w stałym rozmiarze A4, przeskalowany do szerokości kolumny.
        function ScaledPreview({ orientation, maxHeight, children }) {
            const boxRef = useRef(null);
            const [scale, setScale] = useState(0.5);
            const { w, h } = PAGE[orientation] || PAGE.horizontal;
            useLayoutEffect(() => {
                const el = boxRef.current;
                if (!el) return;
                const fit = () => {
                    const byWidth = el.clientWidth / w;
                    const byHeight = maxHeight ? maxHeight / h : Infinity;
                    setScale(Math.max(0.1, Math.min(1, byWidth, byHeight)));
                };
                fit();
                const ro = new ResizeObserver(fit);
                ro.observe(el);
                return () => ro.disconnect();
            }, [w, h, maxHeight]);
            return (
                <div ref={boxRef} className="w-full">
                    <div className="mx-auto eg-sheet" style={{ width: w * scale, height: h * scale, position: 'relative' }}>
                        <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'top left', position: 'absolute', top: 0, left: 0 }}>
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {

            // Miejscowość i podpis pamiętamy w tej przeglądarce (o ile nauczycielka nie wyłączy).

                    if (res.ok) { const data = await res.json(); translated = (data[0] || []).map(x => x[0]).join(''); }
                } catch (e) {}
                const styles = {
                    flat: 'cheerful flat vector cartoon illustration, bold friendly shapes',

                };
                const layoutText = layout === 'full_background' ? 'full frame background scene, edge-to-edge illustration with a calm empty area in the middle for text' : 'single subject isolated on pure solid white background';
                const fullPrompt = `Finished decorative illustration for a school diploma. MAIN SUBJECT: ${translated}. STYLE: ${styles[artStyle] || styles.flat}. ${layoutText}. Clean composition, professional print quality, correct anatomy. Completely wordless and textless: no text, no letters, no words, no numbers.`;

                    });

            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const small = await shrinkImage(event.target.result);
                    const layout = design.imageLayout;
                    const image = layout === 'full_background' ? small : await makeWhiteTransparent(small);
                    patch({ image, imageOpacity: 100, panel: layout === 'full_background' ? 55 : design.panel });
                    showToast('🖼️ Obrazek wstawiony. Zostaje tylko u Ciebie – nie trafia do Giełdy.');
                };
                reader.readAsDataURL(file);
                e.target.value = null;
            };

            const changeImageLayout = async (layout) => {
                patch({ imageLayout: layout });
            };

            // ---------- Druk, PDF, obrazek ----------
            const executePrint = () => {
                // Bez limitu: druk i Giełda nie używają AI (decyzja 8.10.2026 – limit tylko na generowanie przez AI).
                if (series && names.length > 1) showToast(`🖨️ Drukuję ${names.length} dyplomów – każdy na osobnej kartce.`);
                setTimeout(() => window.print(), 50);
            };

            const fileSafe = (s) => String(s || 'dyplom').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'dyplom';

            const renderPages = async () => {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await new Promise(r => setTimeout(r, 120));
                const pages = Array.from(exportRef.current?.querySelectorAll('.eg-export-page') || []);
                const canvases = [];
                for (const page of pages) {
                    canvases.push(await window.html2canvas(page, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }));
                }
                return canvases;
            };

            const downloadBlob = (blob, filename) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            };

            const exportPdf = async () => {
                setExporting('pdf');
                try {
                    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                    const canvases = await renderPages();
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
                    const pw = land ? 297 : 210, ph = land ? 210 : 297;
                    canvases.forEach((c, i) => {
                        if (i > 0) pdf.addPage('a4', land ? 'landscape' : 'portrait');
                        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, ph);
                    });
                    const base = series ? `dyplomy-${fileSafe(design.title)}` : `dyplom-${fileSafe(studentName || design.title)}`;
                    pdf.save(`${base}.pdf`);
                    showToast(series ? `📄 Gotowe: PDF z ${canvases.length} dyplomami.` : '📄 PDF pobrany.');
                } catch (e) {
                    console.error(e);
                    showToast('🚨 Nie udało się przygotować PDF. Użyj „Drukuj” i wybierz „Zapisz jako PDF”.');
                } finally {
                    setExporting(null);
                }
            };

            const exportPng = async () => {
                setExporting('png');
                try {
                    const [canvas] = await renderPages();
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    downloadBlob(blob, `dyplom-${fileSafe(previewName || design.title)}.png`);
                    showToast('🖼️ Obrazek pobrany – możesz go wysłać albo wydrukować w punkcie ksero.');
                } catch (e) {
                    console.error(e);
                    showToast('🚨 Nie udało się zapisać obrazka. Spróbuj „Drukuj” → „Zapisz jako PDF”.');
                } finally {
                    setExporting(null);
                }
            };

            // ---------- Giełda ----------
            const sharePattern = async () => {
                // Giełda jest publiczna: bez imienia ucznia, podpisu i wgranego zdjęcia (data:) – zostaje grafika AI (https).
                if (!window.confirm('Do Giełdy (widocznej dla wszystkich) trafi wzór bez imienia ucznia, listy imion, podpisu, miejscowości i wgranego zdjęcia. Sprawdź, czy tytuł i uzasadnienie nie zawierają imion. Udostępnić?')) return;
                // Bez limitu: druk i Giełda nie używają AI (decyzja 8.10.2026 – limit tylko na generowanie przez AI).
                const customImage = design.image;
                const { image, ...rest } = design;
                const currentConfig = {
                    v: 2,
                    design: rest,
                    studentName: '', diplomaSignature: '',
                    customImage: (typeof customImage === 'string' && /^https:\/\//.test(customImage)) ? customImage : null
                };
                try {
                    const name = `Dyplom - ${preset ? preset.label : (design.title || 'Własny').slice(0, 40)}`;
                    await window.EduBoxCore.saveToGielda('gielda_wzorow_edugenerator', 'Dyplom', name, currentConfig);
                    showToast('✨ Wzór zapisany w Giełdzie. Dzięki, że się dzielisz!');
                } catch (e) {
                    showToast(e.message || '🚨 Nie udało się zapisać w Giełdzie.');
                }
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if (!c) return;
                if (c.activeTab === 'garland') {
                    showToast('Girlandy robisz teraz w MagicLetters – otwieram w nowej karcie.');
                    window.open('/magicletters.html', '_blank', 'noopener');
                    return;
                }
                const next = c.v === 2 && c.design ? { ...DEFAULT_DESIGN, ...c.design, sizes: { ...DEFAULT_DESIGN.sizes, ...(c.design.sizes || {}) }, image: c.customImage || null } : designFromLegacy(c);
                setDesign(next);
                setLastAiAction(null);
                setShowGielda(false);
                goStep(1);
                showToast('✨ Wzór wczytany – wpisz imię i drukuj.');
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-slate-300">Wczytuję EduGenerator…</div>;
            }

            const pageCss = `
                @media print {
                    @page { size: A4 ${land ? 'landscape' : 'portrait'}; margin: 0; }
                    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
                    #wspolne-menu-kontener, nav, .eg-screen, .eg-toast, .eb-cookie, #cookie-consent { display: none !important; }
                    #root, .eg-app { display: block !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; height: auto !important; background: #fff !important; }
                    .eg-print { display: block !important; }
                    .eg-print-page { width: ${PAGE[design.orientation].w}px; height: ${PAGE[design.orientation].h}px; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }
                    .eg-print-page:not(:last-child) { break-after: page; page-break-after: always; }
                }
            `;

            const stepButton = (label, onClick, primary = true, icon = 'ph-arrow-right') => (
                <button onClick={onClick} className={`eb-btn ${primary ? 'eb-btn--primary' : 'eb-btn--ghost'} flex-1`}>
                    {!primary && <i className="ph-bold ph-arrow-left"></i>}{label}{primary && <i className={`ph-bold ${icon}`}></i>}
                </button>
            );

            return (
                <div className="eg-app min-h-screen">
                    <style>{pageCss}</style>

                    {toastMessage && (
                        <div className="eg-toast fixed top-5 left-1/2 -translate-x-1/2 z-[100] max-w-[92vw] w-[460px] bg-slate-900 border border-slate-600 text-white text-sm font-semibold px-5 py-3 rounded-2xl shadow-2xl" role="status">{toastMessage}</div>
                    )}

                    <div className="eg-screen max-w-[88rem] mx-auto px-4 sm:px-6 pt-6 pb-16">
                        {/* Nagłówek */}
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
                            <div className="min-w-0">
                                <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center gap-2"><i className="ph-duotone ph-certificate text-indigo-400"></i> EduGenerator</h1>
                                <p className="text-sm text-slate-400 mt-0.5">Dyplom w 4 krokach – dla jednego dziecka albo dla całej grupy naraz.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => setShowGielda(true)} className="eb-btn eb-btn--ghost"><i className="ph-bold ph-users-three"></i> Giełda wzorów</button>
                                {isPremium
                                    ? <span className="eb-chip eb-chip--ok self-center"><i className="ph-fill ph-crown"></i> PRO</span>
                                    : <button onClick={() => setShowPro(v => !v)} className="eb-btn eb-btn--quiet"><i className="ph-bold ph-key"></i> Mam kod PRO</button>}
                            </div>
                        </div>

                        {showPro && !isPremium && (
                            <div className="eb-card p-4 mb-5 flex flex-col sm:flex-row gap-3 sm:items-center">
                                <p className="text-sm text-slate-300 flex-1">Kod PRO znosi limit grafik AI i znak wodny. Robienie, druk i PDF dyplomów są zawsze za darmo.</p>
                                <div className="flex gap-2">
                                    <input value={accessCode} onChange={e => setAccessCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleVerifyCode()} placeholder="Wpisz kod" className="eb-field uppercase w-44" />
                                    <button onClick={handleVerifyCode} className="eb-btn eb-btn--primary">OK</button>
                                </div>
                            </div>
                        )}

                        {/* Kroki */}
                        <nav aria-label="Kroki" className="eg-steps grid grid-cols-4 gap-1.5 sm:gap-2 mb-5">
                            {STEPS.map((s, i) => (
                                <button key={s.id} onClick={() => goStep(i)} aria-current={step === i ? 'step' : undefined}
                                    className={`flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2.5 px-1 rounded-xl border text-xs sm:text-sm font-bold transition-colors ${step === i ? 'bg-indigo-600 border-indigo-500 text-white' : i < step ? 'bg-slate-800/80 border-slate-700 text-indigo-200' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200'}`}>
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${step === i ? 'bg-white/20' : 'bg-slate-700/70'}`}>{i < step ? <i className="ph-bold ph-check"></i> : i + 1}</span>
                                    <span>{s.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="grid grid-cols-1 lg:grid-cols-[400px_minmax(0,1fr)] xl:grid-cols-[440px_minmax(0,1fr)] gap-5 lg:gap-7 items-start">
                            {/* PODGLĄD */}
                            <div className="order-1 lg:order-2 lg:sticky lg:top-4 min-w-0">
                                <div className="eb-card p-3 sm:p-5">
                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                        <span className="text-xs text-slate-400 flex items-center gap-1.5"><i className="ph-bold ph-cursor-text"></i> Kliknij tekst na dyplomie, żeby go poprawić</span>
                                        {series && (
                                            <div className="flex items-center gap-1">
                                                <button className="eb-btn eb-btn--icon eb-btn--quiet" aria-label="Poprzedni" onClick={() => setPreviewIndex(Math.max(0, safeIndex - 1))}><i className="ph-bold ph-caret-left"></i></button>
                                                <span className="text-xs font-bold text-slate-200 tabular-nums">{safeIndex + 1} / {names.length}</span>
                                                <button className="eb-btn eb-btn--icon eb-btn--quiet" aria-label="Następny" onClick={() => setPreviewIndex(Math.min(names.length - 1, safeIndex + 1))}><i className="ph-bold ph-caret-right"></i></button>
                                            </div>
                                        )}
                                    </div>
                                    <ScaledPreview orientation={design.orientation} maxHeight={land ? undefined : 720}>
                                        <Diploma d={design} name={previewName} place={place} signature={signature} editable isPremium={isPremium}
                                            onDesign={patch}
                                            onName={series ? null : setStudentName}
                                            onPlace={null}
                                            onSignature={setSignature} />
                                    </ScaledPreview>
                                    {isGenerating && (
                                        <div className="mt-3 flex items-center gap-2 text-sm text-indigo-200"><i className="ph-bold ph-spinner animate-spin"></i> Maluję grafikę, to trwa ok. 20–40 sekund…</div>
                                    )}
                                </div>
                            </div>

                            {/* PANEL KROKÓW */}
                            <div id="eg-panel" className="order-2 lg:order-1 min-w-0 scroll-mt-4">
                                <div className="eb-card p-4 sm:p-5">
                                    {step === 0 && (
                                        <div className="space-y-4">
                                            <div className="eb-note">
                                                <span>ℹ️</span>
                                                <div><b>Jak to działa:</b> wybierz okazję – teksty, kolory i ozdoby ustawią się same. Potem wpisz imię (albo wklej listę całej grupy), dopasuj wygląd i drukuj. Ozdobne tło malowane przez AI dodasz w kroku „Wygląd”.</div>
                                            </div>
                                            <h2 className="text-base font-bold text-white">Na jaką okazję?</h2>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 xl:grid-cols-3 gap-2">
                                                {OCCASION_PRESETS.map(p => (
                                                    <button key={p.id} onClick={() => applyOccasion(p)}
                                                        className={`text-left rounded-xl border p-3 transition-colors ${design.occasionId === p.id ? 'border-indigo-400 bg-indigo-500/15' : 'border-slate-700 bg-slate-900/60 hover:border-slate-500'}`}>
                                                        <div className="text-2xl leading-none mb-1.5">{p.emoji}</div>
                                                        <div className="text-[13px] font-bold text-slate-100 leading-tight">{p.label}</div>
                                                    </button>
                                                ))}
                                                <button onClick={startBlank} className="text-left rounded-xl border border-dashed border-slate-600 p-3 hover:border-slate-400 bg-transparent">
                                                    <div className="text-2xl leading-none mb-1.5">✍️</div>
                                                    <div className="text-[13px] font-bold text-slate-100 leading-tight">Własny dyplom</div>
                                                </button>
                                            </div>
                                            <p className="text-xs text-slate-500">Szukasz girlandy z literami? Jest teraz w <a href="/magicletters.html" className="text-indigo-300 underline">MagicLetters</a>.</p>
                                        </div>
                                    )}

                                    {step === 1 && (
                                        <div className="space-y-4">
                                            <h2 className="text-base font-bold text-white">Co ma być na dyplomie?</h2>
                                            <div>
                                                <label className="eb-label" htmlFor="eg-title">Tytuł</label>
                                                <input id="eg-title" className="eb-field" value={design.title} onChange={e => patch({ title: e.target.value })} />
                                            </div>
                                            <div>
                                                <label className="eb-label" htmlFor="eg-sub">Linijka nad imieniem</label>
                                                <input id="eg-sub" className="eb-field" value={design.subtitle} placeholder="np. OTRZYMUJE" onChange={e => patch({ subtitle: e.target.value })} />
                                            </div>

                                            <div>
                                                <span className="eb-label">Dla kogo?</span>
                                                <div className="eb-segment" role="group">
                                                    <button className="eb-segment__item" aria-pressed={nameMode === 'one'} onClick={() => setNameMode('one')}>Jedno dziecko</button>
                                                    <button className="eb-segment__item" aria-pressed={nameMode === 'list'} onClick={() => setNameMode('list')}>Cała lista</button>
                                                </div>
                                            </div>
                                            {nameMode === 'one' ? (
                                                <div>
                                                    <label className="eb-label" htmlFor="eg-name">Imię i nazwisko</label>
                                                    <input id="eg-name" className="eb-field" value={studentName} placeholder="Zostaw puste, jeśli wpiszesz ręcznie długopisem" onChange={e => setStudentName(e.target.value)} />
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className="eb-label" htmlFor="eg-names">Lista – jedno imię w linijce</label>
                                                    <textarea id="eg-names" className="eb-field" rows={6} value={namesText} placeholder={'Ola Nowak\nKuba Wiśniewski\nZosia Kamińska'} onChange={e => { setNamesText(e.target.value); setPreviewIndex(0); }} />
                                                    <p className="eb-hint mt-1.5">{names.length > 0 ? `${names.length} ${plural(names.length, 'dyplom', 'dyplomy', 'dyplomów')} – każdy na osobnej kartce.` : 'Wklej listę z dziennika albo arkusza.'} 🔒 Imiona zostają w tej karcie przeglądarki – nigdzie ich nie wysyłamy ani nie zapisujemy.{parseNames(namesText).length >= MAX_NAMES ? ` (najwyżej ${MAX_NAMES} naraz)` : ''}</p>
                                                </div>
                                            )}

                                            <div>
                                                <label className="eb-label" htmlFor="eg-reason">Za co?</label>
                                                <textarea id="eg-reason" className="eb-field" rows={3} value={design.reason} onChange={e => patch({ reason: e.target.value })} />
                                            </div>

                                            <div className="grid grid-cols-1 gap-3">
                                                <div>
                                                    <label className="eb-label" htmlFor="eg-town">Miejscowość</label>
                                                    <input id="eg-town" className="eb-field" value={town} placeholder="np. Kraków" onChange={e => setTown(e.target.value)} />
                                                </div>
                                                <div>
                                                    <label className="eb-label" htmlFor="eg-date">Data</label>
                                                    <div className="flex gap-2">
                                                        <input id="eg-date" className="eb-field" value={dateText} onChange={e => setDateText(e.target.value)} />
                                                        <button className="eb-btn eb-btn--icon eb-btn--quiet" title="Dzisiejsza data" aria-label="Wstaw dzisiejszą datę" onClick={() => setDateText(todayPl())}><i className="ph-bold ph-calendar-check"></i></button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="eb-label" htmlFor="eg-sign">Podpis</label>
                                                <input id="eg-sign" className="eb-field" value={signature} placeholder="np. Wychowawczyni grupy Motylki" onChange={e => setSignature(e.target.value)} />
                                            </div>
                                            <label className="flex items-start gap-2 text-sm text-slate-300 cursor-pointer">
                                                <input type="checkbox" className="mt-1 accent-indigo-500" checked={remember} onChange={e => setRemember(e.target.checked)} />
                                                <span>Zapamiętaj miejscowość i podpis na tym urządzeniu</span>
                                            </label>

                                            <div className="flex gap-2 pt-2">{stepButton('Wstecz', () => goStep(0), false)}{stepButton('Dalej: wygląd', () => goStep(2))}</div>
                                        </div>
                                    )}

                                    {step === 2 && (
                                        <div className="space-y-5">
                                            <div>
                                                <span className="eb-label">Kartka</span>
                                                <div className="eb-segment" role="group">
                                                    <button className="eb-segment__item" aria-pressed={land} onClick={() => patch({ orientation: 'horizontal' })}><i className="ph-bold ph-rectangle"></i> Poziomo</button>
                                                    <button className="eb-segment__item" aria-pressed={!land} onClick={() => patch({ orientation: 'vertical' })}><i className="ph-bold ph-rectangle rotate-90"></i> Pionowo</button>
                                                </div>
                                            </div>

                                            <div>
                                                <span className="eb-label">Czcionka</span>
                                                <div className="grid grid-cols-3 gap-1.5">
                                                    {FONTS.map(f => (
                                                        <button key={f.id} onClick={() => patch({ font: f.id })} title={f.hint}
                                                            className={`${f.id} rounded-lg border py-2 px-1 text-[15px] leading-tight ${design.font === f.id ? 'border-indigo-400 bg-indigo-500/15 text-white' : 'border-slate-700 bg-slate-900/60 text-slate-200 hover:border-slate-500'}`}>
                                                            Dyplom<span className="block text-[10px] font-sans text-slate-400 mt-0.5" style={{ fontFamily: 'Plus Jakarta Sans, sans-serif' }}>{f.hint}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <span className="eb-label">Tło dyplomu</span>
                                                {design.image ? (
                                                    <div className="rounded-xl border border-slate-700 bg-slate-900/60 p-3 space-y-3">
                                                        <div className="flex items-center gap-3">
                                                            <img src={design.image} alt="" className="w-14 h-14 rounded-lg object-cover bg-white" />
                                                            <div className="flex-1 text-sm text-slate-300">{/^data:/.test(design.image) ? 'Twój obrazek' : 'Grafika AI'}</div>
                                                            <button onClick={() => patch({ image: null, frame: 'double', panel: 0 })} className="eb-btn eb-btn--quiet"><i className="ph-bold ph-trash"></i> Usuń</button>
                                                        </div>
                                                        {lastAiAction && !/^data:/.test(design.image) && (
                                                            <button onClick={repeatLastAi} disabled={isGenerating} className="eb-btn eb-btn--ghost eb-btn--block"><i className="ph-bold ph-arrows-clockwise"></i> Inny wariant {proNow() ? '' : '(z kodem PRO)'}</button>
                                                        )}
                                                        <div className="eb-segment" role="group" aria-label="Gdzie obrazek">
                                                            {[['full_background', 'Całe tło'], ['bottom_corners', 'W rogach'], ['bottom_center', 'Na środku']].map(([id, label]) => (
                                                                <button key={id} className="eb-segment__item" aria-pressed={design.imageLayout === id} onClick={() => changeImageLayout(id)}>{label}</button>
                                                            ))}
                                                        </div>
                                                        <label className="block text-xs text-slate-400">Widoczność obrazka: {design.imageOpacity}%
                                                            <input type="range" min="15" max="100" value={design.imageOpacity} onChange={e => patch({ imageOpacity: Number(e.target.value) })} className="w-full accent-indigo-500" />
                                                        </label>
                                                        <label className="block text-xs text-slate-400">Jasne pole pod tekstem: {design.panel}%
                                                            <input type="range" min="0" max="95" value={design.panel} onChange={e => patch({ panel: Number(e.target.value) })} className="w-full accent-indigo-500" />
                                                        </label>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-2">
                                                        <div className="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-3 xl:grid-cols-5 gap-1.5">
                                                            {preset && (
                                                                <button onClick={() => applyOccasion(preset, true)} className={`rounded-lg border p-2 text-center ${!design.themeId ? 'border-indigo-400 bg-indigo-500/15' : 'border-slate-700 bg-slate-900/60'}`}>
                                                                    <div className="text-lg">{preset.deco.join('')}</div><div className="text-[10px] text-slate-300 mt-0.5 leading-tight">{preset.label}</div>
                                                                </button>
                                                            )}
                                                            {THEMES.map(t => (
                                                                <button key={t.id} onClick={() => patch({ themeId: t.id, bg: t.bgHex, border: t.borderHex, deco: t.elements })}
                                                                    className={`rounded-lg border p-2 text-center ${design.themeId === t.id ? 'border-indigo-400 bg-indigo-500/15' : 'border-slate-700 bg-slate-900/60 hover:border-slate-500'}`}>
                                                                    <div className="h-4 rounded mb-1" style={{ background: t.bgHex, border: `3px solid ${t.borderHex}` }}></div>
                                                                    <div className="text-sm leading-none">{t.elements.join('')}</div>
                                                                    <div className="text-[10px] text-slate-300 mt-0.5 leading-tight">{t.name}</div>
                                                                </button>
                                                            ))}
                                                        </div>
                                                        <div className="eb-segment" role="group" aria-label="Ramka">
                                                            {[['double', 'Ramka'], ['dashed', 'Kreski'], ['none', 'Bez ramki']].map(([id, label]) => (
                                                                <button key={id} className="eb-segment__item" aria-pressed={design.frame === id} onClick={() => patch({ frame: id })}>{label}</button>
                                                            ))}
                                                        </div>
                                                        <button className="eb-btn eb-btn--quiet eb-btn--block" onClick={() => patch({ deco: [] })}><i className="ph-bold ph-eraser"></i> Bez ozdób w rogach</button>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="rounded-xl border border-indigo-500/30 bg-indigo-500/5 p-4 space-y-3">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div>
                                                        <h3 className="text-sm font-bold text-white flex items-center gap-1.5"><i className="ph-bold ph-magic-wand text-indigo-300"></i> Ozdobne tło od AI</h3>
                                                        <p className="text-xs text-slate-400 mt-0.5">{proNow() ? 'Z kodem PRO bez limitu.' : (window.EduBoxCore.getImageUsageCount() < 1 ? 'Pierwsza grafika za darmo.' : 'Darmowa grafika wykorzystana – kolejne z kodem PRO.')} Malowanie trwa ok. 30 s.</p>
                                                    </div>
                                                </div>
                                                {preset && (
                                                    <button onClick={paintOccasion} disabled={isGenerating} className="eb-btn eb-btn--primary eb-btn--block">{preset.emoji} Namaluj tło: {preset.label}</button>
                                                )}
                                                <div>
                                                    <span className="text-xs text-slate-400 block mb-1.5">{preset ? 'albo ramka w stylu:' : 'Ramka w stylu:'}</span>
                                                    <div className="grid grid-cols-3 gap-1.5">
                                                        {FRAME_STYLES.map(st => (
                                                            <button key={st.id} disabled={isGenerating} onClick={() => paintFrameStyle(st.id)} className="rounded-lg border border-slate-700 bg-slate-900/60 hover:border-slate-500 py-2 text-xs font-bold text-slate-200 disabled:opacity-50">{st.emoji} {st.label}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <details className="group">
                                                    <summary className="text-xs font-bold text-indigo-200 cursor-pointer select-none">Ilustracja z Twojego opisu</summary>
                                                    <div className="mt-2 space-y-2">
                                                        <input className="eb-field" value={aiPrompt} onChange={e => setAiPrompt(e.target.value)} placeholder="np. sowa w okularach czytająca książkę" />
                                                        <div className="grid grid-cols-2 gap-1.5">
                                                            {ART_STYLES.map(s => (
                                                                <button key={s.id} onClick={() => setArtStyle(s.id)} className={`rounded-lg border py-1.5 text-xs font-bold ${artStyle === s.id ? 'border-indigo-400 bg-indigo-500/15 text-white' : 'border-slate-700 text-slate-300'}`}>{s.label}</button>
                                                            ))}
                                                        </div>
                                                        <div className="eb-segment" role="group" aria-label="Gdzie ilustracja">
                                                            {[['full_background', 'Całe tło'], ['bottom_corners', 'W rogach'], ['bottom_center', 'Na środku']].map(([id, label]) => (
                                                                <button key={id} className="eb-segment__item" aria-pressed={design.imageLayout === id} onClick={() => patch({ imageLayout: id })}>{label}</button>
                                                            ))}
                                                        </div>
                                                        <button onClick={paintIllustration} disabled={isGenerating} className="eb-btn eb-btn--ghost eb-btn--block"><i className="ph-bold ph-paint-brush"></i> Narysuj ilustrację</button>
                                                    </div>
                                                </details>
                                                <button onClick={() => fileInputRef.current?.click()} className="eb-btn eb-btn--quiet eb-btn--block"><i className="ph-bold ph-upload-simple"></i> Wstaw własny obrazek (bez AI)</button>
                                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleFileUpload} />
                                            </div>

                                            <details className="rounded-xl border border-slate-700 p-3">
                                                <summary className="text-sm font-bold text-slate-200 cursor-pointer select-none">Kolory i wielkość liter</summary>
                                                <div className="mt-3 space-y-4">
                                                    {[['titleColor', 'Kolor tytułu'], ['textColor', 'Kolor imienia i treści']].map(([key, label]) => (
                                                        <div key={key}>
                                                            <span className="text-xs text-slate-400 block mb-1.5">{label}</span>
                                                            <div className="flex flex-wrap gap-1.5 items-center">
                                                                {INK_COLORS.map(c => (
                                                                    <button key={c} aria-label={c} onClick={() => patch({ [key]: c })} className={`w-7 h-7 rounded-full border-2 ${design[key].toLowerCase() === c ? 'border-indigo-300 scale-110' : 'border-slate-600'}`} style={{ background: c }}></button>
                                                                ))}
                                                                <input type="color" value={design[key]} onChange={e => patch({ [key]: e.target.value })} className="w-8 h-8 bg-transparent cursor-pointer" aria-label="Dowolny kolor" />
                                                            </div>
                                                        </div>
                                                    ))}
                                                    {!design.image && (
                                                        <div>
                                                            <span className="text-xs text-slate-400 block mb-1.5">Kolor tła i ramki</span>
                                                            <div className="flex gap-3">
                                                                <label className="flex items-center gap-2 text-xs text-slate-300">Tło <input type="color" value={design.bg} onChange={e => patch({ bg: e.target.value, themeId: null })} className="w-8 h-8 bg-transparent" /></label>
                                                                <label className="flex items-center gap-2 text-xs text-slate-300">Ramka <input type="color" value={design.border} onChange={e => patch({ border: e.target.value, themeId: null })} className="w-8 h-8 bg-transparent" /></label>
                                                            </div>
                                                        </div>
                                                    )}
                                                    {[['title', 'Tytuł', 28, 96], ['subtitle', 'Linijka nad imieniem', 12, 40], ['name', 'Imię', 24, 90], ['reason', 'Za co', 14, 40]].map(([key, label, min, max]) => (
                                                        <label key={key} className="block text-xs text-slate-400">{label}: {design.sizes[key]} px
                                                            <input type="range" min={min} max={max} value={design.sizes[key]} onChange={e => setSize(key, Number(e.target.value))} className="w-full accent-indigo-500" />
                                                        </label>
                                                    ))}
                                                    {!design.image && (
                                                        <label className="block text-xs text-slate-400">Jasne pole pod tekstem: {design.panel}%
                                                            <input type="range" min="0" max="95" value={design.panel} onChange={e => patch({ panel: Number(e.target.value) })} className="w-full accent-indigo-500" />
                                                        </label>
                                                    )}
                                                </div>
                                            </details>

                                            <div className="flex gap-2 pt-1">{stepButton('Wstecz', () => goStep(1), false)}{stepButton('Dalej: drukuj', () => goStep(3))}</div>
                                        </div>
                                    )}

                                    {step === 3 && (
                                        <div className="space-y-4">
                                            <h2 className="text-base font-bold text-white">Gotowe do druku</h2>
                                            <div className="rounded-xl bg-slate-900/70 border border-slate-700 p-3 text-sm text-slate-300 space-y-1">
                                                <div><b className="text-white">{recipients.length}</b> {plural(recipients.length, 'dyplom', 'dyplomy', 'dyplomów')} · A4 {land ? 'poziomo' : 'pionowo'}</div>
                                                {!series && !studentName.trim() && <div className="text-amber-300 text-xs">Bez imienia – zostanie linia do wpisania długopisem.</div>}
                                                {!place && <div className="text-amber-300 text-xs">Bez miejscowości i daty – możesz je dopisać w kroku „Treść”.</div>}
                                            </div>
                                            <button onClick={executePrint} className="eb-btn eb-btn--primary eb-btn--lg eb-btn--block"><i className="ph-bold ph-printer"></i> Drukuj {series ? `(${names.length})` : ''}</button>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={exportPdf} disabled={!!exporting} className="eb-btn eb-btn--ghost">{exporting === 'pdf' ? <i className="ph-bold ph-spinner animate-spin"></i> : <i className="ph-bold ph-file-pdf"></i>} Pobierz PDF</button>
                                                <button onClick={exportPng} disabled={!!exporting} className="eb-btn eb-btn--ghost">{exporting === 'png' ? <i className="ph-bold ph-spinner animate-spin"></i> : <i className="ph-bold ph-image"></i>} Obrazek PNG</button>
                                            </div>
                                            <p className="eb-hint">{series ? 'PDF zawiera wszystkie dyplomy z listy, obrazek PNG – ten widoczny w podglądzie.' : 'PDF i PNG przydadzą się do wysłania rodzicom albo do druku w punkcie ksero.'} W drukarce ustaw „Dopasuj do strony” albo skalę 100% i zaznacz „Grafika tła”.</p>
                                            <div className="eb-divider"></div>
                                            <button onClick={sharePattern} className="eb-btn eb-btn--quiet eb-btn--block"><i className="ph-bold ph-share-network"></i> Podziel się wzorem w Giełdzie</button>
                                            <div className="flex gap-2">{stepButton('Wstecz', () => goStep(2), false)}<button onClick={() => { setStudentName(''); setNamesText(''); goStep(1); }} className="eb-btn eb-btn--ghost flex-1"><i className="ph-bold ph-plus"></i> Kolejny dyplom</button></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* GIEŁDA */}
                    {showGielda && (
                        <div className="eg-screen fixed inset-0 z-[90] bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-6" onClick={() => setShowGielda(false)}>
                            <div className="eb-card w-full sm:max-w-3xl max-h-[85vh] overflow-y-auto p-5 rounded-b-none sm:rounded-b-[var(--eb-r-lg)]" onClick={e => e.stopPropagation()} role="dialog" aria-label="Giełda wzorów">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2"><i className="ph-bold ph-users-three text-indigo-300"></i> Giełda wzorów</h2>
                                    <button onClick={() => setShowGielda(false)} className="eb-btn eb-btn--icon eb-btn--quiet" aria-label="Zamknij"><i className="ph-bold ph-x"></i></button>
                                </div>
                                <p className="text-sm text-slate-400 mb-4">Wzory udostępnione przez innych nauczycieli. Wczytujesz układ i grafikę – imię wpisujesz swoje.</p>
                                {!user ? (
                                    <p className="text-sm text-slate-400"><i className="ph-bold ph-spinner animate-spin"></i> Łączę z Giełdą…</p>
                                ) : patterns.length === 0 ? (
                                    <p className="text-sm text-slate-400">Na razie pusto – bądź pierwsza i podziel się swoim wzorem w kroku „Drukuj”.</p>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {patterns.map(p => {
                                            const garland = p.config?.activeTab === 'garland';
                                            const img = p.config?.customImage;
                                            return (
                                                <button key={p.id} onClick={() => loadPattern(p)} className="text-left flex items-center gap-3 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-indigo-400 p-2.5">
                                                    <div className="w-14 h-10 rounded-md bg-slate-200 overflow-hidden flex-shrink-0 flex items-center justify-center text-lg">{img ? <img src={img} alt="" className="w-full h-full object-cover" loading="lazy" /> : (garland ? '🚩' : '📜')}</div>
                                                    <div className="min-w-0">
                                                        <div className="text-sm font-bold text-slate-100 truncate">{p.name || 'Wzór'}</div>
                                                        <div className="text-[11px] text-slate-500">{garland ? 'Girlanda → MagicLetters' : (p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString('pl-PL') : '')}</div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* WYDRUK – wszystkie dyplomy, każdy na osobnej kartce (na ekranie ukryte) */}
                    <div className="eg-print" style={{ display: 'none' }}>
                        {recipients.map((n, i) => (
                            <div key={i} className="eg-print-page">
                                <Diploma d={design} name={n} place={place} signature={signature} editable={false} isPremium={isPremium} />
                            </div>
                        ))}
                    </div>

                    {/* PDF / PNG – strony rysowane poza ekranem tylko na czas zapisu */}
                    {exporting && (
                        <div ref={exportRef} aria-hidden="true" style={{ position: 'fixed', left: -20000, top: 0, pointerEvents: 'none' }}>
                            {(exporting === 'png' ? [previewName] : recipients).map((n, i) => (
                                <div key={i} className="eg-export-page eg-exporting" style={{ width: PAGE[design.orientation].w, height: PAGE[design.orientation].h }}>
                                    <Diploma d={design} name={n} place={place} signature={signature} editable={false} isPremium={isPremium} />
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
