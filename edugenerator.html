    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Baza motywów
        const THEMES = [
          { id: 'watercolor', name: 'Akwarelowy Sen', bgHex: '#ffffff', borderHex: '#818cf8', elements: ['☁️', '✨'] },
          { id: 'boho', name: 'Styl Boho', bgHex: '#FAF9F6', borderHex: '#D4B895', elements: ['🌿', '☀️'] },
          { id: 'rodzina', name: 'Dzień Rodziny', bgHex: '#fff1f2', borderHex: '#f43f5e', elements: ['❤️', '🏡'] },
          { id: 'autyzm', name: 'Dzień Autyzmu', bgHex: '#eff6ff', borderHex: '#3b82f6', elements: ['💙', '🧩'] },
          { id: 'skarpetka', name: 'Dzień Skarpetki', bgHex: '#fdf4ff', borderHex: '#fb923c', elements: ['🧦', '🌈'] },
          { id: 'pasowanie', name: 'Pasowanie', bgHex: '#eef2ff', borderHex: '#6366f1', elements: ['🎒', '🖍️'] },
          { id: 'zakonczenie', name: 'Zakończenie Roku', bgHex: '#fefce8', borderHex: '#eab308', elements: ['🎓', '🌻'] },
          { id: 'przedszkolak', name: 'Przedszkolak', bgHex: '#fef9c3', borderHex: '#f87171', elements: ['🎈', '🧸'] },
          { id: 'dziecko', name: 'Dzień Dziecka', bgHex: '#f0fdf4', borderHex: '#4ade80', elements: ['🍭', '🎠'] },
          { id: 'nauczyciel', name: 'Dzień Nauczyciela', bgHex: '#eef2ff', borderHex: '#6366f1', elements: ['🦉', '✏️'] },
          { id: 'space', name: 'Kosmos', bgHex: '#312e81', borderHex: '#818cf8', elements: ['🚀', '⭐'] },
          { id: 'wiosna', name: 'Pani Wiosna', bgHex: '#fdf2f8', borderHex: '#f472b6', elements: ['🌸', '🦋'] },
          { id: 'zima', name: 'Pani Zima', bgHex: '#f0f9ff', borderHex: '#7dd3fc', elements: ['❄️', '⛄'] },
          { id: 'jesien', name: 'Pani Jesień', bgHex: '#fff7ed', borderHex: '#ea580c', elements: ['🍁', '🍄'] },
          { id: 'lato', name: 'Powitanie Lata', bgHex: '#fefce8', borderHex: '#facc15', elements: ['☀️', '🏖️'] }
        ];

        // Funkcja usuwająca białe tło (Magiczna gumka)
        const makeWhiteTransparent = (imageSrc) => {
            return new Promise((resolve) => {
                const img = new Image();
                if (!imageSrc.startsWith('blob:') && !imageSrc.startsWith('data:')) {
                    img.crossOrigin = 'Anonymous';
                }
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i]; const g = data[i+1]; const b = data[i+2];
                            if (r > 230 && g > 230 && b > 230) {
                                data[i+3] = 0; 
                            } else if (r > 200 && g > 200 && b > 200) {
                                data[i+3] = (255 - Math.max(r, g, b)) * 2; 
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch(e) { resolve(imageSrc); }
                };
                img.onerror = () => resolve(imageSrc);
                img.src = imageSrc;
            });
        };

        function App() {
            // --- STATE APLIKACJI ---
            const [activeTab, setActiveTab] = useState('diploma');
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            
            const fileInputRef = useRef(null);

            // --- STATE DYPLOMU ---
            const [diplomaTitle, setDiplomaTitle] = useState('DYPLOM');
            const [diplomaSubtitle, setDiplomaSubtitle] = useState('ZA WYBITNE OSIĄGNIĘCIA');
            const [studentName, setStudentName] = useState('Jan Kowalski');
            const [diplomaReason, setDiplomaReason] = useState('za udział w konkursie plastycznym "Wiosna w przedszkolu" i przygotowanie najpiękniejszej pracy.');
            const [diplomaDate, setDiplomaDate] = useState('Leżajsk, 31 Marca 2026');
            const [diplomaSignature, setDiplomaSignature] = useState('Wychowawca');
            
            // --- FORMATOWANIE TEKSTÓW ---
            const [textFormats, setTextFormats] = useState({
                title: { size: 64, bold: true, italic: false, color: '#1e293b' },
                subtitle: { size: 24, bold: true, italic: false, color: '#1e293b' },
                name: { size: 60, bold: true, italic: false, color: '#1e293b' },
                reason: { size: 22, bold: true, italic: false, color: '#1e293b' }
            });

            // --- STATE WYGLĄDU (SZLIFY) ---
            const [titleBoxWidth, setTitleBoxWidth] = useState(85); 
            const [titleBoxOpacity, setTitleBoxOpacity] = useState(0); 
            const [titleBoxOffset, setTitleBoxOffset] = useState(0);

            const [boxWidth, setBoxWidth] = useState(85); 
            const [boxOpacity, setBoxOpacity] = useState(90); 
            const [boxOffset, setBoxOffset] = useState(0);
            
            const [bgImageOpacity, setBgImageOpacity] = useState(100);
            const [diplomaTextColor, setDiplomaTextColor] = useState('#1e293b');
            const [diplomaBgColor, setDiplomaBgColor] = useState(THEMES[5].bgHex);
            const [diplomaBorderColor, setDiplomaBorderColor] = useState(THEMES[5].borderHex);
            const [borderStyle, setBorderStyle] = useState('solid'); 
            const [borderWidth, setBorderWidth] = useState(12);
            
            const [selectedThemeId, setSelectedThemeId] = useState('pasowanie');
            const [selectedFont, setSelectedFont] = useState('font-sans');
            const [artStyle, setArtStyle] = useState('3d'); 
            const [graphicLayout, setGraphicLayout] = useState('bottom_corners'); 
            const [diplomaOrientation, setDiplomaOrientation] = useState('horizontal');

            // --- STATE GIRLANDY ---
            const [garlandText, setGarlandText] = useState('WITAJCIE');
            const [garlandTextColor, setGarlandTextColor] = useState('#6366f1');
            const [garlandLetterSize, setGarlandLetterSize] = useState(180); 
            const [garlandLetterOffset, setGarlandLetterOffset] = useState(50); 
            const [garlandShape, setGarlandShape] = useState('pennant'); // pennant, triangle, circle

            // --- STATE AI ---
            const [aiPrompt, setAiPrompt] = useState('');
            const [customImage, setCustomImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const activeTheme = THEMES.find(t => t.id === selectedThemeId) || THEMES[0];

            useEffect(() => {
                setGarlandTextColor(activeTheme.borderHex);
                setDiplomaBgColor(activeTheme.bgHex);
                setDiplomaBorderColor(activeTheme.borderHex);
            }, [selectedThemeId]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = () => {
                if (accessCode.toUpperCase() === 'KAWA2024') { 
                    setIsPremium(true); setAccessCode(''); 
                    showToast("🎉 Moduł AI odblokowany!"); 
                } else { 
                    showToast("❌ Nieprawidłowy kod!"); 
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const imgData = event.target.result;
                    if (graphicLayout === 'full_background') setCustomImage(imgData);
                    else {
                        const transparentImg = await makeWhiteTransparent(imgData);
                        setCustomImage(transparentImg);
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = null; 
            };

            const handleGenerateAiImage = async () => {
                if (!aiPrompt.trim()) return;
                setIsGenerating(true);
                
                // Tłumaczenie na angielski (opcjonalne ułatwienie dla modelu)
                let translatedPrompt = aiPrompt;
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=pl&tl=en&dt=t&q=${encodeURIComponent(aiPrompt)}`);
                    if (res.ok) { const data = await res.json(); translatedPrompt = data[0][0][0]; }
                } catch(e) {}

                let layoutModifier = graphicLayout === 'full_background' 
                    ? "full frame background scene, edge-to-edge illustration" 
                    : "isolated on pure solid white background, no text, no letters";
                
                let styleModifier = "";
                switch(artStyle) {
                  case 'watercolor': styleModifier = `beautiful watercolor art, pastel colors`; break;
                  case 'boho': styleModifier = `trendy boho style art, earthy colors`; break;
                  case 'vibrant': styleModifier = `vibrant bold colors, colorful cartoon`; break;
                  case 'papercraft': styleModifier = `3d papercraft illustration, cutouts`; break;
                  case 'realistic': styleModifier = `highly realistic photography style, 8k`; break;
                  case '3d': styleModifier = `highly detailed 3D Pixar Disney animation style`; break;
                  default: styleModifier = `flat vector illustration`;
                }

                let fullPrompt = `MAIN SUBJECT TO DRAW: ${translatedPrompt}. STYLE: ${styleModifier}. ${layoutModifier}. PERFECT human anatomy.`;
                
                try {
                    // Wykorzystujemy backend na Vercelu
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: fullPrompt })
                    });

                    if (!response.ok) throw new Error("Błąd łączenia z API.");

                    const data = await response.json();
                    
                    if (graphicLayout === 'full_background') {
                        setCustomImage(data.imageUrl);
                    } else {
                        const transparentImg = await makeWhiteTransparent(data.imageUrl);
                        setCustomImage(transparentImg);
                    }
                    showToast("✨ Grafika gotowa i wycięta!");
                } catch (e) { 
                    showToast("🚨 Błąd serwera. Spróbuj ponownie.");
                } finally {
                    setIsGenerating(false);
                }
            };

            const updateFormat = (field, key, value) => {
                setTextFormats(prev => ({ ...prev, [field]: { ...prev[field], [key]: value } }));
            };

            // PRECYZYJNY PASEK NARZĘDZI TEKSTU (Z POLAMI HEX)
            const TextFormatToolbar = ({ format, onChange, maxSize = 120 }) => (
                <div className="flex items-center gap-1.5 mt-2 bg-slate-900/80 p-2 rounded-xl border border-slate-700 shadow-sm transition-colors overflow-x-auto custom-scrollbar">
                    <button onClick={() => onChange('bold', !format.bold)} className={`w-8 h-8 shrink-0 flex items-center justify-center rounded-lg text-sm font-serif transition-colors ${format.bold ? 'bg-indigo-600 text-white shadow-inner' : 'hover:bg-slate-700 text-slate-300'}`}><b>B</b></button>
                    <button onClick={() => onChange('italic', !format.italic)} className={`w-8 h-8 shrink-0 flex items-center justify-center rounded-lg text-sm font-serif transition-colors ${format.italic ? 'bg-indigo-600 text-white shadow-inner' : 'hover:bg-slate-700 text-slate-300'}`}><i>I</i></button>
                    <div className="w-px h-6 bg-slate-700 mx-1 shrink-0"></div>
                    <i className="ph-bold ph-text-t text-slate-400 shrink-0 ml-1"></i>
                    <input type="range" min="10" max={maxSize} value={format.size} onChange={e => onChange('size', Number(e.target.value))} className="w-20 sm:w-24 shrink-0 accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                    <span className="text-[10px] font-bold text-slate-400 w-8 text-right shrink-0">{format.size}px</span>
                    <div className="w-px h-6 bg-slate-700 mx-1 shrink-0"></div>
                    
                    {/* Precyzyjny selektor koloru */}
                    <div className="flex items-center bg-slate-800 rounded border border-slate-600 overflow-hidden shrink-0 h-8 w-[5.5rem]">
                        <input type="color" value={format.color} onChange={e => onChange('color', e.target.value)} className="w-6 h-full cursor-pointer bg-transparent p-0 border-none shrink-0" title="Wybierz kolor"/>
                        <input type="text" value={format.color} onChange={e => onChange('color', e.target.value)} className="flex-1 w-full text-[10px] bg-transparent text-white px-1 outline-none text-center uppercase font-mono tracking-wider" />
                    </div>
                </div>
            );

            // Generator kształtów girlandy (SVG)
            const renderGarlandShape = (letter) => {
                let svgPath = "";
                if (garlandShape === 'pennant') svgPath = "M5,5 L95,5 L50,115 Z";
                else if (garlandShape === 'triangle') svgPath = "M5,5 L95,5 L50,95 Z";
                else if (garlandShape === 'circle') svgPath = "M 50, 50 m -45, 0 a 45,45 0 1,0 90,0 a 45,45 0 1,0 -90,0";

                return (
                    <div className="relative w-full h-full flex items-center justify-center p-4 drop-shadow-2xl">
                        <svg viewBox="0 0 100 120" className="w-full h-full" preserveAspectRatio="none">
                            <path d={svgPath} fill={diplomaBgColor} stroke={diplomaBorderColor} strokeWidth={borderWidth/3} strokeDasharray={borderStyle === 'dashed' ? '3,3' : 'none'} strokeLinejoin="round" />
                            <circle cx="20" cy="15" r="2.5" fill="#ffffff" stroke="#cbd5e1" strokeWidth="0.5"/>
                            <circle cx="80" cy="15" r="2.5" fill="#ffffff" stroke="#cbd5e1" strokeWidth="0.5"/>
                        </svg>
                        
                        <div className="absolute inset-0 flex flex-col items-center justify-center pt-8">
                            {customImage && <img src={customImage} className="absolute inset-x-0 top-[45%] -translate-y-1/2 m-auto w-48 h-48 object-contain opacity-25 pointer-events-none" />}
                            
                            <div className="absolute border-2 border-dashed rounded-full flex items-center justify-center pointer-events-none"
                                 style={{ borderColor: diplomaBorderColor, width: `${garlandLetterSize * 1.5}px`, height: `${garlandLetterSize * 1.5}px`, transform: `translateY(${garlandLetterOffset}px)`, opacity: 0.3 }}>
                            </div>

                            <span className="font-black leading-none select-none z-10" style={{ color: garlandTextColor, fontSize: `${garlandLetterSize}px`, transform: `translateY(${garlandLetterOffset}px)` }}>
                                {letter}
                            </span>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen flex flex-col ${selectedFont}`}>
                    
                    {/* DYNAMICZNY STYL DO WYDRUKU */}
                    <style>{`
                        input[type="color"] {
                            -webkit-appearance: none;
                            border: none;
                            background: transparent;
                        }
                        input[type="color"]::-webkit-color-swatch-wrapper {
                            padding: 0;
                        }
                        input[type="color"]::-webkit-color-swatch {
                            border: none;
                            border-radius: 4px;
                        }

                        @media print {
                            @page { 
                                size: A4 ${activeTab === 'diploma' && diplomaOrientation === 'horizontal' ? 'landscape' : 'portrait'}; 
                                margin: 0mm; 
                            }
                            body * { visibility: hidden; }
                            #print-area, #print-area * { visibility: visible; }
                            
                            ${activeTab === 'diploma' ? `
                            #print-area { 
                                position: fixed !important; 
                                left: 0 !important; 
                                top: 0 !important; 
                                width: 100vw !important; 
                                height: 100vh !important; 
                                margin: 0 !important; 
                                padding: 12mm !important; 
                                box-shadow: none !important; 
                                border-radius: 0 !important; 
                                aspect-ratio: auto !important;
                                box-sizing: border-box !important;
                                transform: none !important;
                            }
                            ` : `
                            #print-area { 
                                position: absolute !important; 
                                left: 0 !important; 
                                top: 0 !important; 
                                width: 100% !important; 
                                margin: 0 !important; 
                                padding: 0 !important; 
                                box-shadow: none !important; 
                            }
                            `}
                            .print-hidden { display: none !important; }
                            .page-break { page-break-after: always; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; visibility: visible !important; margin: 0; padding: 0;}
                            body, html { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background: white !important; margin:0; padding:0; }
                            .dark-grid-bg { display: none !important; }
                        }
                    `}</style>

                    {/* EKRAN ŁADOWANIA AI */}
                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center text-white">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-purple-500/20 shadow-[0_0_50px_rgba(168,85,247,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-purple-500 rounded-full animate-spin"></div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2">Szkicuję grafikę...</h3>
                                    <p className="text-xs text-slate-400 font-medium">Magiczna gumka za chwilę usunie tło.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Powiadomienia (Toast) */}
                    <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] transition-all duration-300 flex items-center gap-2 print-hidden ${toastMessage ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                        {toastMessage}
                    </div>

                    {/* NAWIGACJA GÓRNA */}
                    <nav className="fixed top-0 w-full z-[100] glass-nav h-20 print-hidden">
                        <div className="max-w-[90rem] mx-auto px-6 h-full flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                                    <i className="ph-bold ph-medal text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">Edu<span className="text-indigo-400">Generator</span></span>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                {!isPremium && (
                                    <div className="hidden md:flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                                        <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Premium..." className="px-3 py-1.5 bg-transparent text-sm w-32 outline-none font-medium text-white placeholder-slate-500"/>
                                        <button onClick={handleVerifyCode} className="p-2 text-white rounded-lg bg-indigo-600 hover:bg-indigo-500 transition-colors shadow-md btn-bounce"><i className="ph-bold ph-key"></i></button>
                                    </div>
                                )}
                                <a href="https://buycoffee.to/magiccolor" target="_blank" className="flex items-center gap-2 bg-slate-800 border border-slate-700 text-amber-400 px-5 py-2.5 rounded-xl hover:bg-slate-700 transition-all shadow-lg btn-bounce text-xs font-bold uppercase tracking-wider">
                                    <i className="ph-fill ph-coffee text-base"></i> Postaw Kawę
                                </a>
                            </div>
                        </div>

                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider"><span>Krycie Grafiki</span><span className="text-sky-400">{bgImageOpacity}%</span></div>
                                                    <input type="range" min="5" max="100" value={bgImageOpacity} onChange={e => setBgImageOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-2 bg-slate-700 rounded-lg appearance-none" />
                                                </div>
                                            </div>

                                            <div className="space-y-4 pt-4 border-t border-slate-700/50">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Panel Tytułu</label>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przezroczystość tła</span></div>
                                                    <input type="range" min="0" max="100" value={titleBoxOpacity} onChange={e => setTitleBoxOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Szerokość</span></div>
                                                    <input type="range" min="50" max="100" value={titleBoxWidth} onChange={e => setTitleBoxWidth(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przesunięcie Góra/Dół</span></div>
                                                    <input type="range" min="-100" max="100" value={titleBoxOffset} onChange={e => setTitleBoxOffset(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                            </div>

                                            <div className="space-y-4 pt-4 border-t border-slate-700/50">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Główny Panel Tekstowy</label>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przezroczystość tła</span></div>
                                                    <input type="range" min="0" max="100" value={boxOpacity} onChange={e => setBoxOpacity(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Szerokość</span></div>
                                                    <input type="range" min="50" max="100" value={boxWidth} onChange={e => setBoxWidth(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Przesunięcie Góra/Dół</span></div>
                                                    <input type="range" min="-150" max="150" value={boxOffset} onChange={e => setBoxOffset(Number(e.target.value))} className="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg appearance-none" />
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* PANEL PRAWY - PODGLĄD (OBSZAR DRUKU) */}
                        <div className="xl:col-span-8 flex justify-center items-start lg:sticky lg:top-28 self-start print:static w-full relative h-[600px] xl:h-auto">
                            
                            {/* Ciemne tło w kropki dla obszaru roboczego */}
                            <div className="absolute inset-0 dark-grid-bg -z-10 rounded-[3rem] opacity-30 print-hidden"></div>

                            <div className="w-full h-full flex flex-col items-center justify-center relative">
                                {activeTab !== 'garland' ? (
                                    /* WIDOK: DYPLOM */
                                    <div 
                                        id="print-area"
                                        className={`relative flex flex-col justify-between ${diplomaOrientation === 'horizontal' ? 'w-full aspect-[1.414]' : 'h-full aspect-[0.707]'} rounded-[1rem] sm:rounded-[2rem] p-8 md:p-12 text-center shadow-[0_0_40px_rgba(0,0,0,0.5)] transition-all overflow-hidden bg-cover bg-center bg-no-repeat`}
                                        style={{ backgroundColor: diplomaBgColor, borderWidth: `${borderWidth}px`, borderStyle: borderStyle, borderColor: diplomaBorderColor, color: diplomaTextColor }}
                                    >
                                        {/* Tło z motywów */}
                                        {!customImage && (
                                            <div className="absolute inset-0 z-0 pointer-events-none opacity-[0.12] flex items-center justify-center space-x-20 scale-[1.8] sm:scale-150">
                                                <div className="text-[10rem] sm:text-[15rem] drop-shadow-lg">{activeTheme.elements[0]}</div>
                                                <div className="text-[10rem] sm:text-[15rem] drop-shadow-lg">{activeTheme.elements[1]}</div>
                                            </div>
                                        )}

                                        {/* Ilustracja AI lub Własna */}
                                        {customImage && (
                                            <div className="absolute inset-0 z-10 pointer-events-none overflow-hidden">
                                                {graphicLayout === 'full_background' ? (
                                                    <img src={customImage} className="w-full h-full object-cover" style={{ opacity: bgImageOpacity / 100 }} />
                                                ) : graphicLayout === 'bottom_corners' ? (
                                                    <>
                                                        <img src={customImage} className="absolute bottom-[-1rem] left-[-2rem] w-48 h-48 md:w-72 md:h-72 object-contain rotate-6 drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                        <img src={customImage} className="absolute bottom-[-1rem] right-[-2rem] w-48 h-48 md:w-72 md:h-72 object-contain -rotate-12 drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                    </>
                                                ) : graphicLayout === 'bottom_center' ? (
                                                    <img src={customImage} className="absolute bottom-[-2rem] left-1/2 -translate-x-1/2 w-64 h-64 md:w-[28rem] md:h-[28rem] object-contain drop-shadow-xl" style={{ opacity: bgImageOpacity / 100 }} />
                                                ) : null}
                                            </div>
                                        )}

                                        {/* Znak wodny brak Premium */}
                                        {!isPremium && <div className="absolute inset-0 z-50 flex items-center justify-center opacity-[0.03] rotate-[-35deg] text-4xl md:text-7xl font-black uppercase pointer-events-none select-none tracking-[1rem] text-slate-900">EDUGENERATOR</div>}

                                        {/* Szyba: Tytuł */}
                                        <div 
                                            className="z-20 relative mx-auto flex flex-col items-center justify-center transition-all py-3 px-6 md:py-6 md:px-10 rounded-[1.5rem] md:rounded-[2rem] flex-shrink-0"
                                            style={{ 
                                                width: `${titleBoxWidth}%`, transform: `translateY(${titleBoxOffset}px)`, 
                                                backgroundColor: `rgba(255,255,255,${titleBoxOpacity/100})`, 
                                                backdropFilter: titleBoxOpacity > 0 ? `blur(${(titleBoxOpacity/100)*16}px)` : 'none',
                                                border: titleBoxOpacity > 0 ? '1px solid rgba(255,255,255,0.4)' : 'none',
                                                boxShadow: titleBoxOpacity > 0 ? '0 10px 30px -10px rgba(0,0,0,0.1)' : 'none'
                                            }}
                                        >
                                            <div className="w-full">
                                                <h1 style={{ fontSize: `${textFormats.title.size}px`, color: textFormats.title.color, fontWeight: textFormats.title.bold ? 'bold' : 'normal', fontStyle: textFormats.title.italic ? 'italic' : 'normal', textShadow: '0 0 10px rgba(255,255,255,0.8)' }} className="tracking-[0.1em] md:tracking-[0.2em] uppercase leading-none drop-shadow-sm select-none break-normal max-w-full">{diplomaTitle}</h1>
                                                <h3 style={{ fontSize: `${textFormats.subtitle.size}px`, color: textFormats.subtitle.color, fontWeight: textFormats.subtitle.bold ? 'bold' : 'normal', fontStyle: textFormats.subtitle.italic ? 'italic' : 'normal' }} className="opacity-80 uppercase tracking-widest min-h-[1.5em] select-none break-normal mt-2 max-w-full">{diplomaSubtitle}</h3>
                                            </div>
                                        </div>

                                        {/* Szyba: Treść główna */}
                                        <div 
                                            className="z-20 relative mx-auto flex flex-col items-center justify-center transition-all py-4 px-6 md:py-10 md:px-14 rounded-[1.5rem] md:rounded-[2rem] border border-white/40 my-auto flex-grow-0"
                                            style={{ 
                                                width: `${boxWidth}%`, transform: `translateY(${boxOffset}px)`, 
                                                backgroundColor: `rgba(255,255,255,${boxOpacity/100})`, 
                                                backdropFilter: boxOpacity > 0 ? `blur(${(boxOpacity/100)*16}px)` : 'none',
                                                boxShadow: '0 25px 50px -12px rgba(0,0,0,0.15)'
                                            }}
                                        >
                                            <h2 style={{ fontSize: `${textFormats.name.size}px`, color: textFormats.name.color, fontWeight: textFormats.name.bold ? 'bold' : 'normal', fontStyle: textFormats.name.italic ? 'italic' : 'normal' }} className="border-b-2 border-slate-300/50 inline-block px-4 md:px-16 pb-2 md:pb-4 mb-3 md:mb-6 leading-tight w-full break-normal select-none max-w-full">{studentName}</h2>
                                            <p style={{ fontSize: `${textFormats.reason.size}px`, color: textFormats.reason.color, fontWeight: textFormats.reason.bold ? 'bold' : 'normal', fontStyle: textFormats.reason.italic ? 'italic' : 'normal' }} className="leading-snug md:leading-relaxed max-w-3xl select-none opacity-90 break-normal max-w-full">{diplomaReason}</p>
                                        </div>

                                        {/* Stopka z podpisami */}
                                        <div className="z-20 relative flex justify-between items-end px-2 md:px-12 flex-shrink-0 w-full select-none">
                                            <div className="text-center w-32 md:w-56 border-t-2 pt-2 md:pt-3" style={{ borderColor: `${diplomaTextColor}40` }}>
                                                <div className="font-bold text-xs md:text-lg mb-1" style={{ color: diplomaTextColor }}>{diplomaDate}</div>
                                                <div className="text-[6px] md:text-[9px] font-black uppercase opacity-60 tracking-wider" style={{ color: diplomaTextColor }}>Miejscowość i data</div>
                                            </div>
                                            <div className="text-center w-32 md:w-56 border-t-2 pt-2 md:pt-3" style={{ borderColor: `${diplomaTextColor}40` }}>
                                                <div className="font-bold text-xs md:text-lg mb-1 opacity-90" style={{ color: diplomaTextColor }}>{diplomaSignature}</div>
                                                <div className="text-[6px] md:text-[9px] font-black uppercase opacity-60 tracking-wider" style={{ color: diplomaTextColor }}>Podpis Nauczyciela</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    /* WIDOK: GIRLANDA */
                                    <div id="print-area" className="grid grid-cols-1 gap-12 print:block w-full flex flex-col items-center mt-4">
                                        <div className="absolute top-4 left-4 bg-slate-900/80 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 shadow-md print-hidden z-50">
                                            <i className="ph-bold ph-eye"></i> Widzisz podgląd 1 litery. Drukarka wypluje wszystkie strony.
                                        </div>
                                        
                                        {garlandText.split('').map((letter, idx) => (
                                            <div key={idx} className={`${idx === 0 ? 'block' : 'hidden'} print:block page-break relative aspect-[0.707] h-full sm:h-auto sm:w-[60%] mx-auto flex items-center justify-center bg-transparent print:w-[210mm] print:h-[297mm]`}>
                                                {renderGarlandShape(letter)}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button onClick={() => window.print()} className="absolute -bottom-6 md:-bottom-12 left-1/2 -translate-x-1/2 bg-indigo-600 hover:bg-indigo-500 text-white px-10 py-5 rounded-2xl font-black text-sm md:text-base tracking-widest flex items-center justify-center gap-3 shadow-[0_10px_40px_rgba(99,102,241,0.5)] transition-all btn-bounce uppercase print-hidden z-50 whitespace-nowrap">
                                <i className="ph-bold ph-printer text-2xl"></i><span>Drukuj (PDF)</span>
                            </button>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
