    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-glow { position: fixed; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 600px; background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(2, 6, 23, 0) 60%); z-index: -1; pointer-events: none; }
        
        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }

        @keyframes slide-up { 0% { opacity: 0; transform: translate(-50%, 20px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        .animate-toast { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #wspolne-menu-kontener { position: relative; z-index: 100; }
    </style>
</head>
<body class="flex flex-col">

    <div id="wspolne-menu-kontener"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-sky-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }

            try {
                fetch('/menu.html')
                    .then(response => { if (!response.ok) throw new Error('Error'); return response.text(); })
                    .then(data => {
                        document.getElementById('wspolne-menu-kontener').innerHTML = data;
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(() => wstawMenuAwaryjne());
            } catch (e) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;
        const DAILY_LIMIT = 5;

        // INICJALIZACJA FIREBASE
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const STYLES = [
            { id: '3d', name: 'Animacja 3D (Pixar)', prompt: 'Cute 3D Pixar Disney style render, unreal engine 5, highly detailed, joyful, vibrant colors.' },
            { id: 'watercolor', name: 'Akwarela', prompt: 'Beautiful watercolor painting, artistic, soft edges, pastel colors, aesthetic.' },
            { id: 'vector', name: 'Wektor / Flat', prompt: 'Flat vector illustration, modern colorful school poster, clean design, vibrant.' },
            { id: 'sketch', name: 'Szkic ołówkiem', prompt: 'Detailed pencil sketch, hand drawn, artistic, shading, black and white.' },
            { id: 'coloring', name: 'Kolorowanka', prompt: 'Black and white line art, coloring page for kids, clear outlines, no shading, white background.' },
            { id: 'realistic', name: 'Fotorealizm', prompt: 'Photorealistic, 8k resolution, highly detailed photography, cinematic.' }
        ];

        const SIZES = [
            { id: '1024x1024', name: 'Kwadrat (1:1)', icon: 'ph-square' },
            { id: '1024x1792', name: 'Pionowo (Plakat)', icon: 'ph-rectangle' },
            { id: '1792x1024', name: 'Poziomo (Prezentacja)', icon: 'ph-rectangle max-w-full rotate-90' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Widoki
            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka

            // Regulacje obrazu
            const [imagePrompt, setImagePrompt] = useState('');
            const [selectedStyle, setSelectedStyle] = useState(STYLES[0].id);
            const [selectedSize, setSelectedSize] = useState(SIZES[0].id);
            const [detailsLevel, setDetailsLevel] = useState('Zbalansowane'); // Minimalistyczne | Zbalansowane | Mnóstwo detali
            const [lighting, setLighting] = useState('Naturalne'); // Naturalne | Kinowe | Radosne | Mroczne
            
            // Wynik
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugenerator_images');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateArtwork = async () => {
                if (!imagePrompt.trim()) return showToast("Musisz wpisać co chcesz wygenerować!");
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setGeneratedImage(null);

                try {
                    const styleObj = STYLES.find(s => s.id === selectedStyle);
                    
                    let detailMod = "";
                    if (detailsLevel === 'Minimalistyczne') detailMod = "minimalist, simple, uncluttered.";
                    if (detailsLevel === 'Mnóstwo detali') detailMod = "insanely detailed, complex, intricate, masterpiece.";

                    let lightingMod = "";
                    if (lighting === 'Kinowe') lightingMod = "cinematic lighting, dramatic shadows.";
                    if (lighting === 'Radosne') lightingMod = "bright, joyful lighting, sunny.";
                    if (lighting === 'Mroczne') lightingMod = "dark, mysterious lighting, moody.";

                    // Tłumaczenie wymuszone przez DALL-E/Midjourney preferencje
                    const finalPrompt = `Topic: ${imagePrompt}. Style: ${styleObj.prompt}. Details: ${detailMod}. Lighting: ${lightingMod}. ABSOLUTELY NO TEXT, NO WORDS, NO LETTERS, NO SIGNATURES.`;

                    if (window.location.protocol === 'file:' || window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("LocalTest");
                    }

                    const responseImg = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: finalPrompt,
                            negative_prompt: "text, words, letters, signatures, watermarks, bad anatomy, ugly, messy",
                            size: selectedSize
                        })
                    });
                    
                    if (!responseImg.ok) throw new Error("Błąd podczas generowania obrazu. Spróbuj zmienić parametry.");
                    
                    const dataImg = await responseImg.json();
                    let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                    
                    if (imgUrl) {
                        if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                            imgUrl = `data:image/png;base64,${imgUrl}`;
                        }
                        setGeneratedImage(imgUrl);
                        showToast("🎉 Obraz został wygenerowany pomyślnie!");
                    } else {
                        throw new Error("Otrzymano pustą odpowiedź z serwera.");
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setTimeout(() => {
                            setGeneratedImage("https://placehold.co/1024x1024/0f172a/0ea5e9?text=TEST+LOKALNY\\nGrafika+zostanie+wygenerowana\\nna+serwerze");
                            setIsGenerating(false);
                            showToast("Tryb testowy (Offline).");
                        }, 1500);
                    } else {
                        console.error(err);
                        showToast(`Błąd: ${err.message}`);
                        setIsGenerating(false);
                    }
                } finally {
                    if (window.location.protocol !== 'file:') setIsGenerating(false);
                }
            };

            const downloadImage = () => {
                if (!generatedImage) return;
                const link = document.createElement('a');
                link.href = generatedImage;
                link.download = `EduGenerator_${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Pobieranie rozpoczęte...");
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Podaj krótki tytuł obrazka!");
                if (!generatedImage) return showToast("Najpierw wygeneruj grafikę!");

                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugenerator_images');
                        await addDoc(libRef, {
                            title: publishTitle,
                            imageUrl: generatedImage,
                            prompt: imagePrompt,
                            style: STYLES.find(s=>s.id===selectedStyle).name,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    
                    showToast("🎉 Opublikowano w Bazie Wzorów!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji. Obrazek może być za duży.");
                    console.error(e);
                } finally {
                    setIsPublishing(false);
                }
            };

            return (
                <div className="flex flex-col relative overflow-x-hidden flex-grow pt-8 pb-20">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-sky-600 text-white px-6 py-3 rounded-full font-bold shadow-lg animate-toast flex items-center gap-2">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-sky-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-sky-500 mb-2 flex items-center gap-2"><i className="ph-bold ph-share-network"></i> Dodaj do Giełdy</h3>
                                <p className="text-slate-400 text-sm mb-6">Udostępnij tę wspaniałą ilustrację dla innych nauczycieli.</p>
                                
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł Obrazka</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Sowa w bibliotece" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-sky-500" />
                                
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj Grafikę'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-[90rem] mx-auto px-4 sm:px-6 w-full">
                        
                        <div className="text-center mb-8 fade-in">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                Edu<span className="text-sky-500">Generator</span> AI
                            </h1>
                            <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                Potężny kreator szkolnych grafik, ilustracji, kolorowanek i plakatów edukacyjnych.
                            </p>
                        </div>

                        {/* TOGGLE WIDOKÓW */}
                        <div className="flex justify-center mb-8 fade-in">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-paint-brush"></i> Kreator Obrazów
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-images"></i> Giełda Grafik
                                </button>
                            </div>
                        </div>

                        {/* WIDOK: KREATOR */}
                        {viewMode === 'kreator' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                
                                {limitData.showWarning && !isPro && (
                                    <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg mb-8">
                                        <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                        <p className="text-slate-300 mb-4 text-sm sm:text-base">Odblokuj nielimitowane generowanie obrazów wpisując kod PRO na górnym pasku.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 xl:grid-cols-12 gap-8">
                                    
                                    {/* PANEL KONFIGURACJI (Lewy) */}
                                    <div className="xl:col-span-5 space-y-6">
                                        <div className="glass-panel p-6 sm:p-8 rounded-[2rem]">
                                            <h2 className="text-xl font-black text-sky-400 mb-6 flex items-center gap-2 border-b border-slate-700/50 pb-4">
                                                <i className="ph-bold ph-sliders-horizontal text-2xl"></i> Narzędzia "Szlifu"
                                            </h2>

                                            <div className="space-y-6">
                                                {/* Prompt */}
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Co mam narysować?</label>
                                                    <textarea 
                                                        value={imagePrompt} 
                                                        onChange={(e) => setImagePrompt(e.target.value)} 
                                                        placeholder="np. Wesoły dinozaur czytający książkę pod drzewem..." 
                                                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-sky-500 text-sm resize-none h-24 custom-scrollbar"
                                                    />
                                                </div>

                                                {/* Proporcje */}
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Regulacja Proporcji</label>
                                                    <div className="flex bg-slate-900/50 p-1 rounded-xl border border-slate-700">
                                                        {SIZES.map(s => (
                                                            <button key={s.id} onClick={() => setSelectedSize(s.id)} className={`flex-1 py-3 text-xs font-bold rounded-lg flex flex-col items-center justify-center gap-1 transition-all ${selectedSize === s.id ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                                                <i className={`ph-bold ${s.icon} text-lg`}></i> {s.name.split(' ')[0]}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Style i Filtry */}
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Styl Pracy</label>
                                                        <select value={selectedStyle} onChange={(e) => setSelectedStyle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 cursor-pointer">
                                                            {STYLES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Szczegółowość</label>
                                                        <select value={detailsLevel} onChange={(e) => setDetailsLevel(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 cursor-pointer">
                                                            <option>Minimalistyczne</option>
                                                            <option>Zbalansowane</option>
                                                            <option>Mnóstwo detali</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Oświetlenie / Klimat</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {['Naturalne', 'Kinowe', 'Radosne', 'Mroczne'].map(l => (
                                                            <button key={l} onClick={() => setLighting(l)} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${lighting === l ? 'bg-sky-500/20 border-sky-500 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white hover:border-slate-500'}`}>
                                                                {l}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                
                                                {/* Przycisk */}
                                                <button 
                                                    onClick={generateArtwork} 
                                                    disabled={isGenerating || !imagePrompt.trim() || (!isPro && limitData.remaining === 0)}
                                                    className="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 disabled:opacity-50 text-white py-4 rounded-xl font-black text-sm tracking-widest shadow-lg flex justify-center items-center gap-2 transition-all uppercase btn-bounce mt-4"
                                                >
                                                    {isGenerating ? <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Malowanie...</> : <><i className="ph-bold ph-paint-brush text-xl"></i> Generuj Grafikę</>}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* PANEL PODGLĄDU (Prawy) */}
                                    <div className="xl:col-span-7 flex flex-col">
                                        <div className="glass-panel p-4 md:p-8 rounded-[2rem] flex-grow flex flex-col items-center justify-center min-h-[500px] overflow-hidden">
                                            
                                            {!generatedImage ? (
                                                <div className="text-center opacity-40">
                                                    <i className="ph-thin ph-image text-8xl mb-4"></i>
                                                    <h3 className="text-xl font-bold">Twoja sztuka pojawi się tutaj</h3>
                                                    <p className="text-sm mt-2 max-w-md mx-auto">Skonfiguruj filtry po lewej stronie i stwórz niepowtarzalne pomoce wizualne dla swoich uczniów.</p>
                                                </div>
                                            ) : (
                                                <div className="w-full h-full flex flex-col items-center justify-center animate-fade-in relative">
                                                    
                                                    {/* Opcje */}
                                                    <div className="absolute top-4 right-4 flex gap-2 z-10">
                                                        <button onClick={downloadImage} className="bg-slate-900/80 hover:bg-sky-600 text-white p-3 rounded-xl shadow-lg backdrop-blur-sm transition-colors border border-slate-700 hover:border-sky-500" title="Pobierz">
                                                            <i className="ph-bold ph-download-simple text-xl"></i>
                                                        </button>
                                                        <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 p-3 rounded-xl shadow-lg transition-colors border border-amber-600 font-bold flex items-center gap-2" title="Do Giełdy">
                                                            <i className="ph-bold ph-share-network text-xl"></i>
                                                            <span className="hidden sm:inline text-xs uppercase tracking-widest">Udostępnij</span>
                                                        </button>
                                                    </div>

                                                    {/* Obrazek */}
                                                    <div className="w-full max-h-[70vh] flex items-center justify-center p-4 bg-slate-950 rounded-xl border border-slate-800 shadow-2xl">
                                                        <img src={generatedImage} alt="Wygenerowana grafika" className="max-w-full max-h-full object-contain rounded-lg" />
                                                    </div>
                                                </div>
                                            )}

                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* WIDOK: BIBLIOTEKA SPOŁECZNOŚCI */}
                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Giełda Grafik i Ilustracji</h2>
                                    <p className="text-slate-400">Przeglądaj pomysły innych nauczycieli. Znajdź piękne kolorowanki, plakaty i pomoce wizualne, gotowe do pobrania na Twoje lekcje.</p>
                                </div>

                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">🎨</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Bądź pierwszą osobą, która podzieli się swoim dziełem sztuki!</p>
                                    </div>
                                ) : (
                                    <div className="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="break-inside-avoid glass-panel rounded-2xl p-4 border border-slate-700/50 hover:border-sky-500/50 transition-all shadow-lg bg-slate-800/30 flex flex-col relative overflow-hidden group">
                                                
                                                <div className="absolute top-6 left-6 z-10 flex gap-2">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded bg-sky-500/80 text-white backdrop-blur-md shadow-sm border border-sky-400">
                                                        {item.style}
                                                    </span>
                                                </div>

                                                <div className="w-full rounded-xl overflow-hidden mb-4 bg-slate-900 border border-slate-800 relative">
                                                    {item.imageUrl ? (
                                                        <img src={item.imageUrl} alt={item.title} className="w-full object-contain max-h-[300px]" />
                                                    ) : (
                                                        <div className="h-40 flex items-center justify-center text-slate-500">Brak pliku</div>
                                                    )}
                                                    
                                                    {/* Hover overlay z promptem */}
                                                    <div className="absolute inset-0 bg-slate-900/90 p-4 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-center items-center text-center">
                                                        <span className="text-xs font-bold text-sky-400 uppercase tracking-widest mb-2 border-b border-slate-700 pb-1">Użyty Prompt:</span>
                                                        <span className="text-sm text-slate-300 italic">"{item.prompt}"</span>
                                                    </div>
                                                </div>
                                                
                                                <h3 className="text-lg font-bold text-white mb-2 px-2 leading-snug">{item.title}</h3>

                                                <div className="flex items-center gap-2 mt-auto px-2">
                                                    <a href={item.imageUrl} download={`Grafika_${item.title}.png`} target="_blank" className="flex-1 bg-sky-600 hover:bg-sky-500 rounded-lg text-white font-bold text-sm py-2.5 transition-colors flex items-center justify-center gap-2 text-center">
                                                        <i className="ph-bold ph-download-simple text-lg"></i> Pobierz
                                                    </a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
