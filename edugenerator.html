    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-glow { position: fixed; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 600px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(2, 6, 23, 0) 60%); z-index: -1; pointer-events: none; }
        
        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }

        @keyframes slide-up { 0% { opacity: 0; transform: translate(-50%, 20px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        .animate-toast { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #wspolne-menu-kontener { position: relative; z-index: 100; }

        /* Magia Kształtów Girlandy */
        .shape-pennant { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 80%, 0% 100%); }
        .shape-triangle { clip-path: polygon(50% 100%, 0 0, 100% 0); }
        .shape-circle { border-radius: 50%; }

        /* Fonty dla dyplomów i girland */
        .font-diploma { font-family: 'Playfair Display', serif; }
        .font-garland { font-family: 'Fredoka', sans-serif; font-weight: 700; }

        /* --- DRUKOWANIE --- */
        @media print {
            body { background: white !important; color: black !important; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-hidden, #wspolne-menu-kontener { display: none !important; }
            .print-container { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; background: transparent !important;}
            
            .page-break { page-break-after: always; break-after: page; }
            .print-flex-center { display: flex !important; align-items: center !important; justify-content: center !important; }
            
            /* Dla Dyplomów - Cała Strona (Poziomo) */
            .print-diploma-page { width: 297mm; height: 210mm; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-sizing: border-box; padding: 10mm; page-break-after: always; }
            .print-diploma-inner { width: 100%; height: 100%; border: 15px double #cbd5e1; padding: 15mm; background: white; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        }
    </style>
</head>
<body class="flex flex-col">

    <div id="wspolne-menu-kontener"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-indigo-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }

            try {
                fetch('/menu.html')
                    .then(response => { if (!response.ok) throw new Error('Error'); return response.text(); })
                    .then(data => {
                        document.getElementById('wspolne-menu-kontener').innerHTML = data;
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(() => wstawMenuAwaryjne());
            } catch (e) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;
        const DAILY_LIMIT = 5;

        // INICJALIZACJA FIREBASE
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        function App() {
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Widoki
            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka
            const [activeTool, setActiveTool] = useState('girlanda'); // girlanda | dyplom

            // Stan Girlandy
            const [garlandText, setGarlandText] = useState('WITAJCIE W SZKOLE');
            const [garlandShape, setGarlandShape] = useState('pennant'); // pennant | triangle | circle
            const [garlandColor, setGarlandColor] = useState('bg-indigo-500');
            const [garlandTextColor, setGarlandTextColor] = useState('text-white');

            // Stan Dyplomu
            const [diplomaTitle, setDiplomaTitle] = useState('DYPLOM');
            const [diplomaSubtitle, setDiplomaSubtitle] = useState('DLA NAJLEPSZEGO UCZNIA');
            const [diplomaRecipient, setDiplomaRecipient] = useState('Jana Kowalskiego');
            const [diplomaDesc, setDiplomaDesc] = useState('Za wspaniałe wyniki w nauce, uśmiech na co dzień oraz gotowość do pomocy rówieśnikom. Życzymy wielu kolejnych sukcesów!');
            const [diplomaDate, setDiplomaDate] = useState(new Date().toLocaleDateString('pl-PL'));
            const [diplomaSignature, setDiplomaSignature] = useState('Wychowawca');

            const [toastMessage, setToastMessage] = useState('');

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugenerator_sets');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const handlePrint = () => {
                if (!updateAndCheckLimit()) return;
                window.print();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Podaj krótki tytuł, np. 'Girlanda na Dzień Mamy'");

                setIsPublishing(true);
                try {
                    const dataPayload = activeTool === 'girlanda' ? {
                        garlandText, garlandShape, garlandColor, garlandTextColor
                    } : {
                        diplomaTitle, diplomaSubtitle, diplomaRecipient, diplomaDesc, diplomaDate, diplomaSignature
                    };

                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugenerator_sets');
                        await addDoc(libRef, {
                            title: publishTitle,
                            type: activeTool,
                            data: dataPayload,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    
                    showToast("🎉 Opublikowano w Bazie Wzorów!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadSetFromLibrary = (item) => {
                setActiveTool(item.type);
                if (item.type === 'girlanda') {
                    setGarlandText(item.data.garlandText || '');
                    setGarlandShape(item.data.garlandShape || 'pennant');
                    setGarlandColor(item.data.garlandColor || 'bg-indigo-500');
                    setGarlandTextColor(item.data.garlandTextColor || 'text-white');
                } else {
                    setDiplomaTitle(item.data.diplomaTitle || '');
                    setDiplomaSubtitle(item.data.diplomaSubtitle || '');
                    setDiplomaRecipient(item.data.diplomaRecipient || '');
                    setDiplomaDesc(item.data.diplomaDesc || '');
                    setDiplomaDate(item.data.diplomaDate || '');
                    setDiplomaSignature(item.data.diplomaSignature || '');
                }
                setViewMode('kreator');
                showToast("✅ Pomyślnie załadowano wzór!");
                window.scrollTo(0,0);
            };

            // RENDER GIRLANDY
            const renderGarlandShape = (letter) => {
                const shapeClass = `shape-${garlandShape}`;
                return (
                    <div className={`w-full h-full relative ${shapeClass} ${garlandColor} flex items-center justify-center shadow-lg print:shadow-none print:border-4 print:border-black print:bg-gray-100 ${garlandColor === 'bg-white' ? 'border-2 border-slate-300' : ''}`}>
                        {/* Wirtualny sznurek */}
                        <div className="absolute top-4 left-0 w-full h-1 bg-slate-300/30 print:hidden z-0"></div>
                        
                        <span className={`text-[12rem] sm:text-[18rem] md:text-[22rem] print:text-[280mm] font-garland ${garlandTextColor} print:text-black z-10 select-none leading-none -mt-10`}>
                            {letter.toUpperCase()}
                        </span>
                    </div>
                );
            };

            return (
                <div className="flex flex-col relative overflow-x-hidden flex-grow pt-8 pb-20">
                    <div className="hero-glow print-hidden"></div>

                    {/* DYNAMICZNY STYL DRUKU zależny od narzędzia */}
                    <style dangerouslySetInnerHTML={{__html: `
                        @media print {
                            @page { size: ${activeTool === 'dyplom' ? 'A4 landscape' : 'A4 portrait'}; margin: 0; }
                        }
                    `}} />

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-indigo-600 text-white px-6 py-3 rounded-full font-bold shadow-lg animate-toast flex items-center gap-2 print-hidden">
                            <i className="ph-bold ph-check-circle text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                            <div className="bg-slate-900 border border-indigo-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-indigo-500 mb-2 flex items-center gap-2"><i className="ph-bold ph-share-network"></i> Dodaj do Bazy</h3>
                                <p className="text-slate-400 text-sm mb-6">Udostępnij ten wspaniały wzór w Giełdzie EduBox, by inni mogli z niego skorzystać.</p>
                                
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł Wzoru</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Girlanda na Pasowanie" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-indigo-500" />
                                
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj Wzór'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-[100rem] mx-auto px-4 sm:px-6 w-full print:p-0 print:m-0">
                        
                        <div className="text-center mb-8 fade-in print-hidden">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                Edu<span className="text-indigo-500">Generator</span>
                            </h1>
                            <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                Piękne szkolne girlandy z literami na gazetkę oraz personalizowane dyplomy gotowe do druku w 15 sekund.
                            </p>
                        </div>

                        {/* TOGGLE WIDOKÓW */}
                        <div className="flex justify-center mb-8 print-hidden fade-in">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-magic-wand"></i> Kreator Druków
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="ph-bold ph-books"></i> Baza Wzorów
                                </button>
                            </div>
                        </div>

                        {/* WIDOK: KREATOR */}
                        {viewMode === 'kreator' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                
                                {limitData.showWarning && !isPro && (
                                    <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg mb-8 print-hidden">
                                        <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                        <p className="text-slate-300 mb-4 text-sm sm:text-base">Odblokuj nielimitowane drukowanie wpisując kod PRO na górnym pasku.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 xl:grid-cols-12 gap-8 print:block">
                                    
                                    {/* PANEL KONFIGURACJI (Lewy) */}
                                    <div className="xl:col-span-4 space-y-6 print-hidden">
                                        <div className="glass-panel p-6 rounded-[2rem]">
                                            
                                            {/* Wybór narzędzia */}
                                            <div className="flex bg-slate-900/50 p-1 rounded-xl border border-slate-700 mb-6">
                                                <button onClick={() => setActiveTool('girlanda')} className={`flex-1 py-3 text-sm font-bold rounded-lg flex items-center justify-center gap-2 transition-all ${activeTool === 'girlanda' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                                    <i className="ph-bold ph-flag-banner text-lg"></i> Girlanda
                                                </button>
                                                <button onClick={() => setActiveTool('dyplom')} className={`flex-1 py-3 text-sm font-bold rounded-lg flex items-center justify-center gap-2 transition-all ${activeTool === 'dyplom' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                                    <i className="ph-bold ph-medal text-lg"></i> Dyplom
                                                </button>
                                            </div>

                                            {/* --- FORMUARZE --- */}
                                            {activeTool === 'girlanda' ? (
                                                <div className="space-y-5 fade-in">
                                                    <div>
                                                        <label className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 block">Napis na girlandzie</label>
                                                        <input type="text" value={garlandText} onChange={(e) => setGarlandText(e.target.value.toUpperCase())} placeholder="np. WITAJCIE" className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-indigo-500 font-black text-xl text-center tracking-widest" />
                                                        <p className="text-xs text-slate-500 mt-2 text-center">Zostanie wygenerowane {garlandText.replace(/ /g, '').length} flag (jedna litera na stronę A4).</p>
                                                    </div>
                                                    
                                                    <div>
                                                        <label className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 block">Kształt flagi</label>
                                                        <div className="grid grid-cols-3 gap-2">
                                                            <button onClick={() => setGarlandShape('pennant')} className={`py-3 rounded-xl border flex flex-col items-center justify-center gap-1 ${garlandShape === 'pennant' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>
                                                                <div className="w-6 h-8 bg-current shape-pennant"></div> <span className="text-[10px] font-bold mt-1">Proporczyk</span>
                                                            </button>
                                                            <button onClick={() => setGarlandShape('triangle')} className={`py-3 rounded-xl border flex flex-col items-center justify-center gap-1 ${garlandShape === 'triangle' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>
                                                                <div className="w-6 h-6 bg-current shape-triangle"></div> <span className="text-[10px] font-bold mt-1">Trójkąt</span>
                                                            </button>
                                                            <button onClick={() => setGarlandShape('circle')} className={`py-3 rounded-xl border flex flex-col items-center justify-center gap-1 ${garlandShape === 'circle' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}>
                                                                <div className="w-6 h-6 bg-current shape-circle"></div> <span className="text-[10px] font-bold mt-1">Koło</span>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 block">Kolor (Na ekranie)</label>
                                                        <div className="flex flex-wrap gap-2">
                                                            {['bg-indigo-500', 'bg-rose-500', 'bg-emerald-500', 'bg-amber-500', 'bg-sky-500', 'bg-white'].map(color => (
                                                                <button key={color} onClick={() => setGarlandColor(color)} className={`w-8 h-8 rounded-full border-2 ${color} ${garlandColor === color ? 'border-white scale-110 shadow-lg' : 'border-slate-700 opacity-70 hover:opacity-100'}`}></button>
                                                            ))}
                                                        </div>
                                                        <p className="text-[10px] text-slate-500 mt-2">Drukarka czarno-biała zignoruje tło, ale wydrukuje wyraźny czarny kontur kształtu!</p>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="space-y-4 fade-in">
                                                    <div><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Tytuł główny</label><input type="text" value={diplomaTitle} onChange={e => setDiplomaTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none font-bold" /></div>
                                                    <div><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Podtytuł</label><input type="text" value={diplomaSubtitle} onChange={e => setDiplomaSubtitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none" /></div>
                                                    <div><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Dla Kogo? (Imię i Nazwisko)</label><input type="text" value={diplomaRecipient} onChange={e => setDiplomaRecipient(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none font-bold text-lg text-center" /></div>
                                                    <div><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Uzasadnienie / Treść</label><textarea value={diplomaDesc} onChange={e => setDiplomaDesc(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none h-24 custom-scrollbar resize-none"></textarea></div>
                                                    <div className="flex gap-2">
                                                        <div className="flex-1"><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Miejscowość, Data</label><input type="text" value={diplomaDate} onChange={e => setDiplomaDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none" /></div>
                                                        <div className="flex-1"><label className="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Podpis (Kto nadaje?)</label><input type="text" value={diplomaSignature} onChange={e => setDiplomaSignature(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-3 text-sm focus:border-rose-500 outline-none" /></div>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-2 mt-8">
                                                <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 py-4 rounded-xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg btn-bounce transition-all">
                                                    <i className="ph-bold ph-share-network text-xl"></i> Do Giełdy
                                                </button>
                                                <button onClick={handlePrint} disabled={!isPro && limitData.remaining === 0} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white py-4 rounded-xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg btn-bounce transition-all">
                                                    <i className="ph-bold ph-printer text-xl"></i> Drukuj PDF
                                                </button>
                                            </div>
                                            <p className="text-center text-[10px] text-slate-500 mt-4 uppercase font-bold tracking-widest">W podglądzie druku ustaw orientację strony: {activeTool === 'dyplom' ? 'Poziomo (Landscape)' : 'Pionowo (Portrait)'}</p>
                                        </div>
                                    </div>

                                    {/* PANEL PODGLĄDU I DRUKU (Prawy) */}
                                    <div className="xl:col-span-8 print:w-full print:m-0 flex flex-col">
                                        <div className="glass-panel p-4 md:p-8 rounded-[2rem] flex-grow flex items-center justify-center min-h-[500px] overflow-hidden print:p-0 print:border-none print:bg-transparent print:shadow-none print:filter-none">
                                            
                                            {/* RENDER GIRLANDY */}
                                            {activeTool === 'girlanda' && (
                                                <div className="w-full h-full relative">
                                                    {/* Podgląd na ekranie (Tylko pierwsza litera dla orientacji, lub kilka jeśli mało miejsca, my pokażemy jedną dużą) */}
                                                    <div className="print-hidden w-full h-full flex flex-col items-center justify-center">
                                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 bg-slate-900 px-4 py-2 rounded-full border border-slate-700">Podgląd Pierwszej Flagi</div>
                                                        <div className="w-64 h-80 max-w-full relative">
                                                            {garlandText.length > 0 ? renderGarlandShape(garlandText.charAt(0)) : <div className="text-slate-500 text-center mt-20">Wpisz tekst po lewej stronie</div>}
                                                        </div>
                                                        <p className="text-slate-500 mt-8 text-sm max-w-md text-center">Wydruk PDF automatycznie podzieli Twój napis ({garlandText}) na {garlandText.replace(/ /g, '').length} osobnych stron A4. Jedna wielka flaga z literą na jedną kartkę.</p>
                                                    </div>

                                                    {/* Część do druku (Każda litera na osobnej stronie) */}
                                                    <div className="hidden print:block w-full">
                                                        {garlandText.split('').map((letter, idx) => {
                                                            if (letter === ' ') return null;
                                                            return (
                                                                <div key={`print-${idx}`} className="print-page w-full h-[290mm] flex items-center justify-center break-after-page page-break relative">
                                                                    {renderGarlandShape(letter)}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}

                                            {/* RENDER DYPLOMU */}
                                            {activeTool === 'dyplom' && (
                                                <div className="w-full relative">
                                                    {/* Podgląd na ekranie - Skalowany kontener A4 Landscape */}
                                                    <div className="print-hidden w-full aspect-[1.414] max-w-[297mm] mx-auto bg-white shadow-2xl relative">
                                                        <div className="absolute inset-[15px] border-4 border-double border-slate-400 p-8 flex flex-col justify-between text-center font-diploma text-slate-900 bg-white">
                                                            <div className="mt-4">
                                                                <h1 className="text-5xl lg:text-7xl font-black text-rose-700 tracking-widest mb-2">{diplomaTitle}</h1>
                                                                <h2 className="text-lg lg:text-2xl font-bold text-slate-600 tracking-widest uppercase mb-12">{diplomaSubtitle}</h2>
                                                            </div>
                                                            
                                                            <div>
                                                                <h3 className="text-4xl lg:text-5xl font-black italic text-slate-800 mb-8 border-b-2 border-slate-300 pb-4 inline-block px-12">{diplomaRecipient}</h3>
                                                                <p className="text-lg lg:text-xl text-slate-700 leading-relaxed max-w-3xl mx-auto italic">{diplomaDesc}</p>
                                                            </div>

                                                            <div className="flex justify-between items-end mt-12 px-12 pb-4">
                                                                <div className="text-center w-48">
                                                                    <div className="border-b border-slate-500 pb-1 mb-1 font-sans text-sm text-slate-600 font-bold">{diplomaDate}</div>
                                                                    <div className="text-xs text-slate-500 uppercase tracking-wider">Miejscowość, Data</div>
                                                                </div>
                                                                
                                                                <div className="w-32 h-32 opacity-20"><i className="ph-fill ph-medal text-9xl"></i></div>

                                                                <div className="text-center w-48">
                                                                    <div className="border-b border-slate-500 pb-1 mb-1 font-sans text-sm text-slate-600 font-bold">{diplomaSignature}</div>
                                                                    <div className="text-xs text-slate-500 uppercase tracking-wider">Podpis Nadawcy</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Część do druku (Idealne wymiary A4) */}
                                                    <div className="hidden print:flex print-diploma-page font-diploma">
                                                        <div className="print-diploma-inner">
                                                            <div className="mt-8">
                                                                <h1 style={{ fontSize: '48pt', fontWeight: '900', color: '#be123c', letterSpacing: '0.1em', marginBottom: '10pt', textTransform: 'uppercase' }}>{diplomaTitle}</h1>
                                                                <h2 style={{ fontSize: '18pt', fontWeight: '700', color: '#475569', letterSpacing: '0.2em', textTransform: 'uppercase' }}>{diplomaSubtitle}</h2>
                                                            </div>
                                                            
                                                            <div>
                                                                <h3 style={{ fontSize: '36pt', fontWeight: '900', fontStyle: 'italic', color: '#1e293b', borderBottom: '2px solid #cbd5e1', paddingBottom: '10pt', display: 'inline-block', paddingLeft: '50pt', paddingRight: '50pt', marginBottom: '30pt' }}>{diplomaRecipient}</h3>
                                                                <p style={{ fontSize: '16pt', color: '#334155', lineHeight: '1.6', maxWidth: '80%', margin: '0 auto', fontStyle: 'italic' }}>{diplomaDesc}</p>
                                                            </div>

                                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginTop: '50pt', paddingLeft: '40pt', paddingRight: '40pt', paddingBottom: '20pt' }}>
                                                                <div style={{ textAlign: 'center', width: '150pt' }}>
                                                                    <div style={{ borderBottom: '1px solid #64748b', paddingBottom: '5pt', marginBottom: '5pt', fontFamily: 'sans-serif', fontSize: '12pt', fontWeight: 'bold' }}>{diplomaDate}</div>
                                                                    <div style={{ fontSize: '9pt', color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Miejscowość, Data</div>
                                                                </div>
                                                                <div style={{ textAlign: 'center', width: '150pt' }}>
                                                                    <div style={{ borderBottom: '1px solid #64748b', paddingBottom: '5pt', marginBottom: '5pt', fontFamily: 'sans-serif', fontSize: '12pt', fontWeight: 'bold' }}>{diplomaSignature}</div>
                                                                    <div style={{ fontSize: '9pt', color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Podpis Nadawcy</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* WIDOK: BIBLIOTEKA SPOŁECZNOŚCI */}
                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out] print-hidden">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Baza Wzorów EduBox</h2>
                                    <p className="text-slate-400">Pobieraj gotowe wzory dyplomów i piękne girlandy stworzone przez innych nauczycieli. Kliknij "Wczytaj" i wydrukuj w kilka sekund!</p>
                                </div>

                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">🎨</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza ładuje zasoby...</h3>
                                        <p className="text-slate-400">Wygeneruj przepiękną girlandę i udostępnij ją jako pierwszą!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 space-y-0">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-amber-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col">
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-md ${item.type === 'girlanda' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                        {item.type === 'girlanda' ? 'Girlanda Litery' : 'Wzór Dyplomu'}
                                                    </span>
                                                </div>
                                                
                                                <h3 className="text-lg font-bold text-white mb-4 leading-snug">{item.title}</h3>

                                                <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow overflow-hidden relative">
                                                    {item.type === 'girlanda' ? (
                                                        <div><strong className="text-indigo-400">Napis:</strong> {item.data.garlandText}</div>
                                                    ) : (
                                                        <div>
                                                            <strong className="text-rose-400 block mb-1">{item.data.diplomaTitle}</strong>
                                                            <em className="text-xs text-slate-400 block mb-2">{item.data.diplomaSubtitle}</em>
                                                            <div className="text-xs line-clamp-3">{item.data.diplomaDesc}</div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="pt-2 mt-auto">
                                                    <button onClick={() => loadSetFromLibrary(item)} className="w-full bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-bold text-sm py-3 transition-colors flex items-center justify-center gap-2">
                                                        <i className="ph-bold ph-magic-wand text-lg"></i> Wczytaj ten wzór
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
