    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-rose-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }
            try {
                fetch('/menu.html')
                    .then(response => { if (!response.ok) throw new Error('Error'); return response.text(); })
                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(() => wstawMenuAwaryjne());
            } catch (e) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
                import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;
        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Medal: <><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></>,
                Scroll: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.Medal}</svg>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Widoki
            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka
            const [type, setType] = useState('dyplomy'); // dyplomy | podziekowania

            // Pola (Dyplomy - Dzieci)
            const [childName, setChildName] = useState('');
            const [childTrait, setChildTrait] = useState('');
            
            // Pola (Podziękowania - Dorośli)
            const [recipient, setRecipient] = useState('');
            const [reason, setReason] = useState('');

            // Statusy
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [generatedText, setGeneratedText] = useState('');
            const resultRef = useRef(null);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // Tagi z pomysłami
            const childPills = ["Klasowy Śmieszek", "Mistrz Matematyki", "Ekspert od Dinozaurów", "Pożeracz Książek", "Zawsze Pomocny Przyjaciel"];
            const adultPills = ["Za organizację wycieczki", "Za wsparcie Rady Rodziców", "Za pomoc w remoncie klasy", "Dla wspaniałego sponsora", "Za cierpliwość i współpracę"];

            // --- LOGOWANIE (wspólny silnik) ---
            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) {
                    // Tryb awaryjny - wgranie przykładowych wzorów do pamięci
                    setLibraryItems([
                        {
                            id: 'mock1',
                            title: 'Za humor i uśmiech',
                            type: 'dyplomy',
                            content: 'Za żarty, uśmiechy i psoty na przerwie,\nZa to, że z Tobą nikt w klasie nie ziewnie!\nChoć czasem na lekcji za dużo gadasz,\nTo uśmiech na twarzach codziennie układasz!'
                        },
                        {
                            id: 'mock2',
                            title: 'Oficjalne Podziękowanie (Sponsor)',
                            type: 'podziekowania',
                            content: 'Szanowny Panie,\n\nDyrekcja oraz Grono Pedagogiczne pragną złożyć najserdeczniejsze wyrazy podziękowania za bezinteresowną pomoc i wsparcie naszej placówki.\n\nPańska hojność i otwarte serce pozwoliły nam zrealizować cele, które przyniosły wiele radości naszym uczniom.'
                        }
                    ]);
                    return;
                }
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'diplomas_and_thanks');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateContent = async () => {
                if (type === 'dyplomy' && !childTrait.trim()) return showToast('Wpisz cechę lub tytuł dla ucznia!');
                if (type === 'podziekowania' && (!recipient.trim() || !reason.trim())) return showToast('Wypełnij pola dla kogo i za co!');
                
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setGeneratedText('');

                try {
                    let systemPrompt = "";
                    let userPrompt = "";

                    if (type === 'dyplomy') {
                        systemPrompt = `Jesteś wybitnym polskim poetą dziecięcym (w stylu Jana Brzechwy i Juliana Tuwima). 
ZASADY KRYTYCZNE (ZŁAMIESZ JE = ZAWODZISZ):
1. Język polski: Wierszyk musi brzmieć w 100% naturalnie, z idealnym polskim rytmem. 
2. Sylabotonizm: Każdy wers MUSI mieć DOKŁADNIE taką samą liczbę sylab (np. dokładnie 8 sylab w każdym wersie).
3. Rymy: Używaj DOKŁADNYCH, dźwięcznych polskich rymów (AABB lub ABAB).
4. Długość: 4 do 8 wersów.
5. Ton: Bardzo wesoły, z przymrużeniem oka, chwalący ucznia za podaną cechę.
6. Zwróć TYLKO sam tekst wierszyka, bez tytułów, bez powitań, bez znaków markdown.`;
                        userPrompt = `Ułóż wesołą, rytmiczną rymowankę na dyplom.\nImię ucznia: ${childName || 'Uczeń'}\nCecha/Tytuł: ${childTrait}`;
                    } else {
                        systemPrompt = `Jesteś mistrzem szkolnej dyplomacji i savoir-vivre'u. Twoim zadaniem jest napisanie oficjalnego, pięknego i wzruszającego podziękowania dla osoby dorosłej lub instytucji. Użyj podniosłego, eleganckiego języka (np. "Składamy serdeczne wyrazy podziękowania..."). Nie pisz wstępów, tylko gotowy tekst dokumentu.`;
                        userPrompt = `Napisz oficjalne podziękowanie.\nDla kogo: ${recipient}\nZa co dziękujemy: ${reason}`;
                    }

                    if (window.location.protocol === 'file:') throw new Error("LocalTest");

                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: systemPrompt, prompt: userPrompt, temperature: 0.5 })
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || "Błąd serwera");

                    let text = data.text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    text = text.replace(/\*\*(.*?)\*\*/g, '$1'); 
                    
                    setGeneratedText(text);
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                } catch (err) {
                    if (err.message === "LocalTest") {
                        const demoText = type === 'dyplomy' 
                            ? `Drogi ${childName || 'Uczniu'},\nJesteś mistrzem nad mistrzami,\ngdy pracujesz z dinozaurami!\nTwój uśmiech co dzień z rana,\ncieszy każdego i pana i pana!` 
                            : `Szanowny Panie ${recipient},\n\nDyrekcja oraz Grono Pedagogiczne pragnie złożyć najserdeczniejsze wyrazy podziękowania za Pańskie zaangażowanie i ${reason}.\nPańska postawa jest dla nas powodem do dumy.`;
                        setGeneratedText(demoText);
                        showToast("Tryb podglądu lokalnego.");
                    } else {
                        showToast(`Błąd: ${err.message}`);
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const exportToWord = (textContent, isDiploma) => {
                if(!textContent) return;
                
                const alignment = isDiploma ? 'center' : 'justify';
                const fontSize = isDiploma ? '18pt' : '14pt';
                const fontStyle = isDiploma ? 'italic' : 'normal';

                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Dokument</title><style>body {font-family: 'Georgia', serif; font-size: ${fontSize}; line-height: 1.5; color: #000; text-align: ${alignment}; font-style: ${fontStyle};}</style></head><body>`;
                const footer = `<br><br><br><p style="text-align: right; font-style: normal; font-size: 12pt;">...................................................<br>Podpis</p></body></html>`;
                
                const formattedText = textContent.split('\n').map(para => `<p>${para}</p>`).join('');
                const blob = new Blob(['\ufeff', header + formattedText + footer], { type: 'application/msword' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = isDiploma ? 'Dyplom.doc' : 'Podziekowanie.doc';
                link.click();
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast("✅ Skopiowano do schowka!");
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Podaj tytuł, np. 'Dyplom dla gaduły'");

                setIsPublishing(true);
                try {
                    const newItem = {
                        id: Date.now().toString(),
                        title: publishTitle,
                        content: generatedText,
                        type: type,
                        createdAt: new Date()
                    };

                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'diplomas_and_thanks');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            type: type,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    } else {
                        // Tryb awaryjny (zapis w pamięci)
                        setLibraryItems(prev => [newItem, ...prev]);
                    }
                    
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            return (
                <div className="flex flex-col relative overflow-x-hidden flex-grow pt-10 pb-20">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-rose-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(244,63,94,0.5)] animate-toast flex items-center gap-2">
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-amber-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-amber-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Dodaj do Biblioteki</h3>
                                <p className="text-slate-400 text-sm mb-6">Podziel się tym genialnym tekstem z innymi nauczycielami.</p>
                                
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Krótki tytuł wpisu</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Rymowanka dla mola książkowego" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-amber-500" />
                                
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj Wzór'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 w-full">
                        
                        <div className="text-center mb-8 fade-in print-hidden">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                Edu<span className="text-rose-500">Dyplomy</span> AI
                            </h1>
                            <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                Oficjalne podziękowania dla Rodziców i wesołe, rymowane dyplomy z przymrużeniem oka dla Twoich Uczniów.
                            </p>
                        </div>

                        {/* TOGGLE WIDOKÓW */}
                        <div className="flex justify-center mb-10 print-hidden fade-in">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Sparkles" size={16} /> Kreator Tekstów
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Biblioteka Wzorów
                                </button>
                            </div>
                        </div>

                        {viewMode === 'kreator' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                
                                {limitData.showWarning && !isPro && (
                                    <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg mb-8 print-hidden">
                                        <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                        <p className="text-slate-300 mb-4 text-sm sm:text-base">Odblokuj nielimitowane generowanie wpisując kod PRO na górze.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 print-hidden">
                                    <div className="lg:col-span-6 space-y-6">
                                        <div className="glass-panel p-6 md:p-8 rounded-[2rem]">
                                            
                                            <div className="flex bg-slate-900/50 p-1 rounded-xl border border-slate-700 mb-6">
                                                <button onClick={() => setType('dyplomy')} className={`flex-1 py-3 text-sm font-bold rounded-lg flex items-center justify-center gap-2 transition-all ${type === 'dyplomy' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}><Icon name="Medal" size={16}/> Dyplomy (Dzieci)</button>
                                                <button onClick={() => setType('podziekowania')} className={`flex-1 py-3 text-sm font-bold rounded-lg flex items-center justify-center gap-2 transition-all ${type === 'podziekowania' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}><Icon name="Scroll" size={16}/> Podziękowania (Dorośli)</button>
                                            </div>

                                            {type === 'dyplomy' ? (
                                                <div className="space-y-5 fade-in">
                                                    <div>
                                                        <label className="text-xs font-bold text-rose-400 uppercase tracking-widest mb-2 block">Imię Ucznia (Opcjonalnie)</label>
                                                        <input type="text" value={childName} onChange={(e) => setChildName(e.target.value)} placeholder="np. Jaś Kowalski" className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-rose-500 font-medium" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-rose-400 uppercase tracking-widest mb-2 block">Tytuł Dyplomu / Cechy charakteru</label>
                                                        <textarea value={childTrait} onChange={(e) => setChildTrait(e.target.value)} placeholder="Za co dyplom? np. Ekspert od dinozaurów, Gaduła klasowa, Mistrz uśmiechu..." className="w-full h-24 bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-rose-500 font-medium resize-none"></textarea>
                                                        <div className="flex flex-wrap gap-2 mt-3">
                                                            {childPills.map(pill => (
                                                                <button key={pill} onClick={() => setChildTrait(pill)} className="text-[10px] uppercase font-bold tracking-wider bg-slate-800 hover:bg-rose-900 text-slate-400 hover:text-rose-300 px-3 py-1.5 rounded-full border border-slate-700 transition-colors">{pill}</button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="space-y-5 fade-in">
                                                    <div>
                                                        <label className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 block">Odbiorca (Dla Kogo?)</label>
                                                        <input type="text" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder="np. Szanowna Rada Rodziców, Pan Jan Kowalski" className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-indigo-500 font-medium" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2 block">Powód (Za co dziękujemy?)</label>
                                                        <textarea value={reason} onChange={(e) => setReason(e.target.value)} placeholder="np. za wsparcie finansowe wycieczki, za ufundowanie nagród, za cierpliwość..." className="w-full h-24 bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-indigo-500 font-medium resize-none"></textarea>
                                                        <div className="flex flex-wrap gap-2 mt-3">
                                                            {adultPills.map(pill => (
                                                                <button key={pill} onClick={() => setReason(pill)} className="text-[10px] uppercase font-bold tracking-wider bg-slate-800 hover:bg-indigo-900 text-slate-400 hover:text-indigo-300 px-3 py-1.5 rounded-full border border-slate-700 transition-colors">{pill}</button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            <button 
                                                onClick={generateContent} disabled={isGenerating || (!isPro && limitData.remaining === 0)}
                                                className={`w-full mt-8 py-4 rounded-xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg btn-bounce transition-all disabled:opacity-50 text-white
                                                    ${type === 'dyplomy' ? 'bg-gradient-to-r from-rose-500 to-pink-600 shadow-rose-500/30 hover:from-rose-400 hover:to-pink-500' : 'bg-gradient-to-r from-indigo-500 to-purple-600 shadow-indigo-500/30 hover:from-indigo-400 hover:to-purple-500'}`}
                                            >
                                                {isGenerating ? 'Pisanie tekstu...' : <><Icon name="Sparkles" /> Generuj Tekst</>}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-6">
                                        <div className="glass-panel p-6 sm:p-10 rounded-[2rem] h-full flex flex-col items-center justify-center relative min-h-[400px]">
                                            
                                            {!generatedText ? (
                                                <div className="text-center opacity-30">
                                                    <Icon name={type === 'dyplomy' ? 'Medal' : 'Scroll'} size={80} className="mx-auto mb-4" />
                                                    <h3 className="text-xl font-bold">Tu pojawi się gotowy tekst</h3>
                                                    <p className="text-sm mt-2">Wypełnij dane po lewej stronie i kliknij Generuj.</p>
                                                </div>
                                            ) : (
                                                <div ref={resultRef} className="w-full h-full flex flex-col fade-in">
                                                    
                                                    <div className="flex flex-wrap justify-between items-center mb-6 gap-2">
                                                        <button onClick={() => setShowPublishModal(true)} className="text-xs bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 py-2 rounded-lg flex items-center gap-1 shadow-md btn-bounce"><Icon name="Share" size={14}/> Do Biblioteki</button>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => copyToClipboard(generatedText)} className="text-xs bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-2 rounded-lg flex items-center gap-1 btn-bounce"><Icon name="Copy" size={14}/> Kopiuj</button>
                                                            <button onClick={() => exportToWord(generatedText, type === 'dyplomy')} className="text-xs bg-sky-600 hover:bg-sky-500 text-white font-bold px-3 py-2 rounded-lg flex items-center gap-1 btn-bounce"><Icon name="Download" size={14}/> Word</button>
                                                            <button onClick={() => window.print()} className="text-xs bg-slate-700 hover:bg-slate-600 text-white font-bold px-3 py-2 rounded-lg flex items-center gap-1 btn-bounce"><Icon name="Printer" size={14}/> Drukuj</button>
                                                        </div>
                                                    </div>

                                                    <div className="diploma-preview bg-white text-slate-900 p-8 rounded-2xl flex-grow shadow-inner flex flex-col justify-center print-container">
                                                        {type === 'dyplomy' && <div className="text-center mb-6 font-black text-2xl uppercase tracking-widest text-rose-600 print:text-black">DYPLOM</div>}
                                                        {type === 'podziekowania' && <div className="text-center mb-8 font-black text-2xl uppercase tracking-widest text-indigo-600 print:text-black">PODZIĘKOWANIE</div>}
                                                        
                                                        <p className={`whitespace-pre-wrap diploma-font ${type === 'dyplomy' ? 'text-center text-xl italic leading-loose text-slate-700' : 'text-justify text-lg leading-relaxed text-slate-800'}`}>
                                                            {generatedText}
                                                        </p>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* WIDOK: BIBLIOTEKA SPOŁECZNOŚCI */}
                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Baza Inspiracji</h2>
                                    <p className="text-slate-400">Skopiuj zabawne rymowanki i piękne podziękowania stworzone przez innych.</p>
                                </div>

                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">📜</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Wygeneruj świetny dyplom i udostępnij go jako pierwszy!</p>
                                    </div>
                                ) : (
                                    <div className="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="break-inside-avoid glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-amber-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30">
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-md ${item.type === 'dyplomy' ? 'bg-rose-500/20 text-rose-400' : 'bg-indigo-500/20 text-indigo-400'}`}>
                                                        {item.type === 'dyplomy' ? 'Dyplom' : 'Podziękowanie'}
                                                    </span>
                                                </div>
                                                
                                                <h3 className="text-lg font-bold text-white mb-4 leading-snug">{item.title}</h3>

                                                <div className={`text-base diploma-font text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap ${item.type === 'dyplomy' ? 'text-center italic' : 'text-left'}`}>
                                                    {item.content}
                                                </div>

                                                <div className="flex items-center gap-2 pt-2 border-t border-slate-700">
                                                    <div className="flex-grow"></div>
                                                    <button onClick={() => copyToClipboard(item.content)} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj do schowka">
                                                        <Icon name="Copy" size={16} />
                                                    </button>
                                                    <button onClick={() => exportToWord(item.content, item.type === 'dyplomy')} className="p-2 bg-sky-600 hover:bg-sky-500 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                        <Icon name="Download" size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
