    <!-- MOCK EduBoxCore -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        let FIREBASE_CONFIG;
        try { FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", authDomain: "mock", projectId: "mock", appId: "1:123" }; } catch(e) { FIREBASE_CONFIG = {}; }
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "eduboxpro";
        
        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: async (onUserLoad) => {
                if (!isInitialized) {
                    try {
                        app = initializeApp(FIREBASE_CONFIG);
                        auth = getAuth(app);
                        db = getFirestore(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                        isInitialized = true;
                        window.EduBoxCore.loadMenu();
                    } catch(e) { console.warn("Firebase init error", e); }
                }
                if (auth) onAuthStateChanged(auth, (user) => { currentUser = user; if(onUserLoad) onUserLoad(user); });
                else if(onUserLoad) onUserLoad({ uid: 'mock-user-123' });
            },
            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) container.innerHTML = `<div class="bg-rose-600 text-white text-xs text-center py-1 font-bold print-hidden">EduBox V3 PRO MAX - System Core Loaded</div>`;
            },
            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) { try { const parsed = JSON.parse(usageStr); if (parsed.date === today) return parsed.count; } catch(e) {} }
                return 0;
            },
            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) { onSuccess(window.EduBoxCore.getUsageCount()); return; }
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) { onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na pasku bocznym!"); return; }
                const newCount = currentCount + 1;
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: new Date().toISOString().split('T')[0], count: newCount }));
                onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },
            verifyPremiumCode: (code) => code.toUpperCase() === 'KAWA2024',
            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser && !db) throw new Error("Brak połączenia z chmurą.");
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                await addDoc(publicRef, { userId: currentUser?.uid || 'anonymous', createdAt: serverTimestamp(), type: appType, name: itemName, config: config });
            },
            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SYSTEM_PROMPT = `Jesteś ekspertem edukacyjnym ratującym nauczycieli przed "okienkami" i nagłymi zastępstwami.
Zadanie: Wygeneruj 45-minutowy scenariusz lekcji typu "Zero-Prep" (nie wymaga kserówek, nożyczek, internetu, ani żadnych rekwizytów poza tablicą i kredą/mazakiem).

ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON O STRUKTURZE:
{
  "title": "Ciekawy, chwytliwy tytuł lekcji (np. Kryminalne zagadki logiki)",
  "warmup": "Rozgrzewka (5 min): Szybka akcja na skupienie uwagi z opisem jak ją przeprowadzić.",
  "main": "Główne zadanie (30 min): Szczegółowo rozpisana gra, debata lub zagadka logiczna. MUSISZ PODAĆ GOTOWĄ TREŚĆ (jeśli to zagadki, podaj treść 2-3 zagadek i ODPOWIEDZI, żeby nauczyciel miał to na tacy). Używaj tagu <br/> dla nowych linii.",
  "summary": "Podsumowanie (10 min): Spokojne zakończenie lekcji i wyciszenie klasy przed dzwonkiem."
}

STYL: Pisz bezpośrednio do nauczyciela. Zadbaj, żeby treści były w 100% dostosowane do wybranej grupy wiekowej. Pamiętaj: nauczyciel czyta to idąc korytarzem do klasy. Ma być zwięźle, konkretnie i gotowe do użycia natychmiast!`;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [ageGroup, setAgeGroup] = useState('Klasy 4-6');
            const [activityType, setActivityType] = useState('zagadki logiczne i czarne historie');
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedData, setGeneratedData] = useState(null);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO') setIsPremium(true);
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'zastepstwa_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === PANCERNE API FUNCTIONS ===
            const fetchWithExponentialBackoff = async (url, options, timeoutMs = 20000) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                let lastErr;
                for (let i = 0; i < 5; i++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                        const fetchOptions = { ...options, signal: controller.signal };
                        
                        const res = await fetch(url, fetchOptions);
                        clearTimeout(timeoutId);
                        
                        if (!res.ok) {
                            const errText = await res.text();
                            throw new Error(`HTTP ${res.status}: ${errText.substring(0, 80)}`);
                        }
                        return await res.json();
                    } catch (err) {
                        lastErr = err;
                        if (err.name === 'AbortError') lastErr = new Error("Serwer nie odpowiedział na czas (Timeout).");
                        if (i < 4) await new Promise(r => setTimeout(r, delays[i]));
                    }
                }
                throw lastErr;
            };

            const parseAIResponse = (rawText) => {
                try {
                    let jsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = jsonStr.indexOf('{');
                    const endIdx = jsonStr.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) {
                        jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                    }
                    jsonStr = jsonStr.replace(/[\u0000-\u001F]+/g, ' '); // Czyści surowe entery
                    return JSON.parse(jsonStr);
                } catch (err) {
                    console.error("JSON Parse Error. Surowy tekst:", rawText);
                    throw new Error("Model AI zwrócił uszkodzony format tekstu.");
                }
            };

            const fetchLessonData = async (usrPrompt) => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: usrPrompt, 
                            system: SYSTEM_PROMPT,
                            temperature: 0.6,
                            format: "json",
                            model: "gpt-4o-mini"
                        }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (!res.ok) throw new Error(`Serwer główny: HTTP ${res.status}`);
                    const data = await res.json();
                    return parseAIResponse(data.text);
                    
                } catch (e) {
                    console.warn("Przełączam na model awaryjny:", e.message);
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: usrPrompt }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    title: { type: "STRING" },
                                    warmup: { type: "STRING" },
                                    main: { type: "STRING" },
                                    summary: { type: "STRING" }
                                },
                                required: ["title", "warmup", "main", "summary"]
                            }
                        }
                    };

                    const data = await fetchWithExponentialBackoff(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }, 20000);
                    
                    const responseText = data.candidates[0].content.parts[0].text;
                    return JSON.parse(responseText);
                }
            };

            // === LOGIC ===
            const generateLesson = () => {
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedData(null);
                        
                        try {
                            const usrPrompt = `Zastępstwo ratunkowe!\nGrupa wiekowa: ${ageGroup}\nTyp aktywności: ${activityType}\nPotrzebuję szybkiego scenariusza JSON.`;
                            const data = await fetchLessonData(usrPrompt);

                            setGeneratedData({
                                ...data,
                                ageGroup,
                                activityType
                            });

                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                        } catch (error) {
                            console.error("Szczegóły błędu:", error); 
                            showToast(`Błąd: ${error.message.substring(0, 80)}`, 'error');
                            
                            // Awaryjny demoscenariusz jeśli padną oba modele
                            setTimeout(() => {
                                setGeneratedData({
                                    title: "🕵️ Detektywi Logiki - Rozwiąż Sprawę!",
                                    warmup: "Czółko bez kartek: Prosisz jednego ucznia, aby stanął tyłem do tablicy. Zapisujesz na tablicy jedno hasło (np. 'Harry Potter'). Reszta klasy musi naprowadzić ucznia na to hasło, ale nie mogą używać słów pokrewnych.",
                                    main: "Czarne Historie Szkolne: Opowiadasz klasie dziwną, krótką historię, a oni zadają Ci pytania, na które możesz odpowiadać tylko TAK lub NIE.<br/><br/>ZAGADKA: Mężczyzna wszedł do restauracji, zamówił zupę z mewy. Zjadł jedną łyżkę, wyszedł i skoczył z klifu. Dlaczego?<br/>ROZWIĄZANIE: Kiedyś rozbił się na wyspie. Przyjaciel przynosił mu mięso, mówiąc, że to mewy (naprawdę był to inny rozbitek). Kiedy zjadł prawdziwą mewę, poznał inny smak i uświadomił sobie prawdę.",
                                    summary: "Mafia w pigułce: Uczniowie zamykają oczy. Kto z nich idealnie oszacuje, kiedy minęło równe 60 sekund, podnosi rękę. Idealne wyciszenie przed dzwonkiem!",
                                    ageGroup, activityType
                                });
                            }, 1000);

                        } finally { 
                            setIsGenerating(false); 
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedData) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { generatedData };
                    const shortName = generatedData.title.substring(0, 40) + (generatedData.title.length > 40 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('zastepstwa_market', 'EduZastępstwo', shortName, configToSave);
                    showToast("Opublikowano na Giełdzie! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                if(item.config.generatedData) {
                    setAgeGroup(item.config.generatedData.ageGroup || 'Klasy 4-6');
                    setActivityType(item.config.generatedData.activityType || 'zagadki');
                    setGeneratedData(item.config.generatedData);
                    setAppMode('generator');
                    showToast("Wczytano plan lekcji z Giełdy!", "info");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                }
            };

            const printDocument = () => {
                window.print();
            };

            // RENDER SIDEBAR
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-rose-500 to-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-rose-500/20">
                            <i className="ph-bold ph-first-aid text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">EduZastępstwo<span className="text-rose-500">999</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-rose-600/20 text-rose-400 border border-rose-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-siren text-lg"></i> Tryb Ratunkowy
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-orange-600/20 text-orange-400 border border-orange-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-books text-lg"></i> Giełda Zastępstw
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-rose-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-rose-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-rose-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Zastępstw</h2>
                            <p className="text-slate-400 mb-8">Czytaj i pobieraj gotowe, sprawdzone plany na "okienka" od innych nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-rose-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="p-3 rounded-xl bg-rose-500/10 text-rose-400 group-hover:scale-110 transition-transform">
                                                <i className="ph-fill ph-siren text-2xl"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">{item.name}</h3>
                                        <div className="flex gap-2 text-[10px] text-slate-400 mb-4 flex-wrap">
                                            <span className="bg-slate-800 px-2 py-1 rounded">{item.config.generatedData?.ageGroup}</span>
                                            <span className="bg-slate-800 px-2 py-1 rounded capitalize">{item.config.generatedData?.activityType?.substring(0,20)}...</span>
                                        </div>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-rose-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Użyj tej lekcji
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych zastępstw w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div><div className="aura-blob aura-3 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-4xl mx-auto print-hidden">
                            
                            <div className="text-center mb-10 fade-in">
                                <div className="inline-flex items-center gap-2 bg-rose-900/30 border border-rose-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-rose-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                    🚨 Narzędzie Szybkiego Reagowania
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Zastępstwo? <span className="text-gradient">Brak paniki.</span>
                                </h1>
                                <p className="text-slate-400 text-lg">
                                    Wybierz klasę, wybierz motyw i wygeneruj gotową lekcję w 5 sekund. Zero kserówek, zero przygotowań. Czysta edukacja ratunkowa.
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50" style={{animationDelay: '0.1s'}}>
                                
                                <div className="space-y-8">
                                    {/* Wybór klasy */}
                                    <div>
                                        <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">Grupa wiekowa:</label>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                            {['Klasy 1-3', 'Klasy 4-6', 'Klasy 7-8', 'Szkoła Średnia'].map(age => (
                                                <button 
                                                    key={age}
                                                    onClick={() => setAgeGroup(age)}
                                                    className={`py-3 px-2 rounded-xl text-sm font-bold border-2 transition-all ${ageGroup === age ? 'bg-rose-600/20 border-rose-500 text-rose-400 shadow-inner' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                                >
                                                    {age}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Wybór motywu */}
                                    <div>
                                        <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">Rodzaj aktywności "Zero-Prep":</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {[
                                                { id: 'zagadki logiczne i czarne historie', name: '🕵️ Zagadki logiczne / Detektyw' },
                                                { id: 'ciekawostki ze świata i teleturniej', name: '🌍 Ciekawostki / Mini-Turniej' },
                                                { id: 'gorąca debata na trudne tematy', name: '🗣️ Gorąca Debata Klasowa' },
                                                { id: 'zabawy integracyjne i relaksacja', name: '🧘 Integracja i Wyciszenie' }
                                            ].map(type => (
                                                <button 
                                                    key={type.id}
                                                    onClick={() => setActivityType(type.id)}
                                                    className={`py-4 px-4 rounded-xl text-sm font-bold border-2 transition-all flex items-center gap-2 ${activityType === type.id ? 'bg-orange-600/20 border-orange-500 text-orange-400 shadow-inner' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                                >
                                                    {type.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-10 flex justify-end">
                                    <button 
                                        onClick={generateLesson}
                                        disabled={isGenerating}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 ${isGenerating ? 'bg-slate-700 cursor-not-allowed opacity-70' : 'bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 btn-emergency btn-bounce shadow-xl'}`}
                                    >
                                        {isGenerating ? <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Trwa łączenie z centralą...</> : <><i className="ph-bold ph-siren text-xl"></i> RATUJ MOJĄ LEKCJĘ!</>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* WYNIK */}
                        {generatedData && (
                            <div ref={resultRef} className="max-w-4xl mx-auto mt-12 print:mt-0 print:block">
                                
                                <div className="flex justify-end gap-3 mb-6 print-hidden fade-in">
                                    <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                        <i className="ph-bold ph-globe text-lg"></i> Na Giełdę
                                    </button>
                                    <button onClick={printDocument} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-md">
                                        <i className="ph-bold ph-printer text-lg"></i> Drukuj to / PDF
                                    </button>
                                </div>

                                <div className="glass-panel p-8 sm:p-12 rounded-[2.5rem] border border-rose-500/30 shadow-[0_0_40px_rgba(244,63,94,0.15)] relative overflow-hidden bg-slate-900/90 print:bg-white print:shadow-none print:border-slate-300 print:rounded-none fade-in">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-rose-500 to-orange-500 print-hidden"></div>
                                    
                                    <div className="border-b-2 border-slate-700/50 print:border-slate-300 pb-6 mb-8 text-center">
                                        <div className="text-xs font-black uppercase tracking-widest mb-2 opacity-60 text-rose-500 print:text-slate-500">Plan Ratunkowy (Zastępstwo)</div>
                                        <h1 className="text-2xl md:text-3xl font-black text-white print:text-slate-900 mb-4 uppercase leading-tight">{generatedData.title}</h1>
                                        <div className="flex justify-center gap-6 pt-2">
                                            <span className="bg-slate-800 print:bg-slate-100 text-slate-300 print:text-slate-600 px-3 py-1 rounded text-xs font-bold border border-slate-700 print:border-slate-200">Dla: {generatedData.ageGroup}</span>
                                            <span className="bg-slate-800 print:bg-slate-100 text-slate-300 print:text-slate-600 px-3 py-1 rounded text-xs font-bold border border-slate-700 print:border-slate-200 capitalize">Metoda: {generatedData.activityType?.split(' ')[1] || 'Zabawa'}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-8 text-[15px] leading-relaxed text-slate-200 print:text-slate-800">
                                        <section className="bg-slate-800/40 print:bg-transparent p-5 rounded-2xl border border-slate-700/50 print:border-none print:p-0">
                                            <h2 className="text-lg font-bold text-orange-400 print:text-slate-800 uppercase mb-3 flex items-center gap-2"><i className="ph-fill ph-stopwatch text-xl"></i> Rozgrzewka (5 min)</h2>
                                            <div dangerouslySetInnerHTML={{ __html: String(generatedData.warmup || '').replace(/\n/g, '<br/>') }} />
                                        </section>
                                        
                                        <section className="bg-rose-900/10 print:bg-transparent p-5 rounded-2xl border border-rose-500/20 print:border-none print:p-0">
                                            <h2 className="text-lg font-bold text-rose-400 print:text-slate-800 uppercase mb-3 flex items-center gap-2"><i className="ph-fill ph-brain text-xl"></i> Główne Zadanie (30 min)</h2>
                                            <div dangerouslySetInnerHTML={{ __html: String(generatedData.main || '').replace(/\n/g, '<br/>') }} />
                                        </section>
                                        
                                        <section className="bg-slate-800/40 print:bg-transparent p-5 rounded-2xl border border-slate-700/50 print:border-none print:p-0">
                                            <h2 className="text-lg font-bold text-emerald-400 print:text-slate-800 uppercase mb-3 flex items-center gap-2"><i className="ph-fill ph-flag-checkered text-xl"></i> Podsumowanie (10 min)</h2>
                                            <div dangerouslySetInnerHTML={{ __html: String(generatedData.summary || '').replace(/\n/g, '<br/>') }} />
                                        </section>
                                    </div>
                                </div>
                                
                                <div className="mt-6 text-center bg-slate-900/50 p-6 rounded-2xl border border-slate-800 print-hidden fade-in">
                                    <p className="text-slate-400 mb-3 font-medium">Udało się uratować lekcję bez stresu?</p>
                                    <a href={BUY_COFFEE_LINK} target="_blank" className="inline-flex items-center gap-2 text-amber-500 hover:text-amber-400 font-bold hover:underline">
                                        Postaw twórcy wirtualną kawę ☕ w ramach podziękowania!
                                    </a>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
