    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-glow { position: fixed; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 600px; background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(2, 6, 23, 0) 60%); z-index: -1; pointer-events: none; }
        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media print {
            body { background: white !important; color: black !important; }
            .print-hidden, #wspolne-menu-kontener { display: none !important; }
            .print-container { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
            h2, h3 { color: black !important; page-break-after: avoid; }
        }
        @keyframes slide-up { 0% { opacity: 0; transform: translate(-50%, 20px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
        .animate-toast { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

<body class="flex flex-col">

    <div id="wspolne-menu-kontener"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="w-full z-50 glass-nav shadow-lg print-hidden">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-white tracking-tight">Edu<span class="text-emerald-500">Box</span></span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-slate-700 rounded px-1.5 py-0.5 ml-1">Pro</span>
                            </a>
                        </div>
                    </nav>
                `;
            }
            try {
                fetch('/menu.html')
                    .then(response => { if (!response.ok) throw new Error('Error'); return response.text(); })
                    .then(data => {
                        document.getElementById('wspolne-menu-kontener').innerHTML = data;
                        if (typeof window.initMenuLogic === 'function') window.initMenuLogic();
                    })
                    .catch(() => wstawMenuAwaryjne());
            } catch (e) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;
        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Lifebuoy: <><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"></line><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"></line><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"></line><line x1="14.83" y1="9.17" x2="18.36" y2="5.64"></line><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.Lifebuoy}</svg>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Widoki
            const [viewMode, setViewMode] = useState('kreator');

            // Formularz
            const [grade, setGrade] = useState('Klasa 4-6');
            const [resources, setResources] = useState('Kompletnie nic (tylko to co w głowie i kreda)');
            const [topic, setTopic] = useState('');
            const [time, setTime] = useState('45 minut');

            // Statusy
            const [isGenerating, setIsGenerating] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [generatedPlan, setGeneratedPlan] = useState('');
            const resultRef = useRef(null);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // Tagi z pomysłami
            const topicPills = ["Zagadki kryminalne", "Gry słowne i integracyjne", "Ciekawostki o kosmosie", "Quizy prawda/fałsz", "Turniej wiedzy ogólnej"];

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) {
                    setLibraryItems([{
                        id: 'mock1', title: 'Zastępstwo 45 min - Zagadki i Mafia', grade: 'Klasa 4-6', content: '1. Szybka gra integracyjna (Mafia wersja skrócona).\n2. 5 Zagadek logicznych (np. Co to jest: Im więcej z tego bierzesz, tym staje się większe? Odp: Dziura).\n3. Szybki teleturniej "Prawda czy Fałsz" z geografii.'
                    }]);
                    return;
                }
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'zastepstwa');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateContent = async () => {
                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setGeneratedPlan('');

                try {
                    let systemPrompt = `Jesteś ratunkowym asystentem dla nauczyciela, który nagle wszedł na zastępstwo i musi okiełznać klasę.
Twoim zadaniem jest stworzyć szybki, konkretny plan lekcji (${time}), biorąc pod uwagę wiek: ${grade}.
ZASADY KRYTYCZNE:
1. Nauczyciel ma do dyspozycji TYLKO: ${resources}. Nie wymyślaj użycia innych rzeczy!
2. Temat przewodni / Życzenie nauczyciela: ${topic || 'Zaskocz klasę czymś wciągającym!'}.
3. Struktura planu musi być bardzo czytelna (Wstęp, Rozwinięcie z grą/zagadką, Zakończenie).
4. Jeśli to możliwe w warunkach, podaj zasady jednej szybkiej gry integracyjnej (np. Kalambury, Czółko, Mafia) oraz 3 gotowe do przeczytania zagadki lub pytania Prawda/Fałsz.
5. Używaj formatowania markdown (pogrubienia, wypunktowania) by nauczyciel mógł czytać "w locie".`;

                    const userPrompt = `Zrób plan awaryjny na zastępstwo. Czas: ${time}, Grupa: ${grade}, Zasoby: ${resources}.`;

                    if (window.location.protocol === 'file:') throw new Error("LocalTest");

                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: systemPrompt, prompt: userPrompt, temperature: 0.7 })
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || "Błąd serwera");

                    let text = data.text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    setGeneratedPlan(text);
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                } catch (err) {
                    if (err.message === "LocalTest") {
                        const demoText = `### Plan Awaryjny: Klasa 4-6 (${time})\n\n**1. Lodołamacz (10 min):**\nGramy w "Prawdę czy Wyzwanie" edukacyjne. Kto przegra w kamień-papier-nożyce, odpowiada na zagadkę.\n\n**2. Zagadki Detektywistyczne (25 min):**\nPrzeczytaj klasie: *Pewnego dnia w szkole zniknął dzwonek. Złapano 3 podejrzanych...* (AI wygeneruje całą historię).\n\n**3. Quiz końcowy (10 min):**\nCzy to prawda, że słońce jest planetą? (Fałsz, to gwiazda).`;
                        setGeneratedPlan(demoText);
                        showToast("Tryb podglądu lokalnego.");
                    } else {
                        showToast(`Błąd: ${err.message}`);
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast("✅ Skopiowano do schowka!");
            };

            const formatMarkdownToHTML = (text) => {
                let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html = html.replace(/### (.*?)\n/g, '<h3 class="text-xl font-bold mt-4 mb-2 text-emerald-400">$1</h3>');
                html = html.replace(/## (.*?)\n/g, '<h2 class="text-2xl font-bold mt-5 mb-2 text-emerald-500">$1</h2>');
                return { __html: html.replace(/\n/g, '<br />') };
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Podaj krótki tytuł, np. 'Zagadki o kosmosie'");

                setIsPublishing(true);
                try {
                    const newItem = { id: Date.now().toString(), title: publishTitle, content: generatedPlan, grade: grade, createdAt: new Date() };

                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'zastepstwa');
                        await addDoc(libRef, {
                            title: publishTitle, content: generatedPlan, grade: grade, createdAt: serverTimestamp(), userId: user.uid
                        });
                    } else {
                        setLibraryItems(prev => [newItem, ...prev]);
                    }
                    
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            return (
                <div className="flex flex-col relative overflow-x-hidden flex-grow pt-10 pb-20">
                    <div className="hero-glow"></div>

                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[200] bg-emerald-600 text-white px-6 py-3 rounded-full font-bold shadow-[0_10px_40px_rgba(16,185,129,0.5)] animate-toast flex items-center gap-2">
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900 border border-emerald-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-emerald-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz dla innych</h3>
                                <p className="text-slate-400 text-sm mb-6">Podziel się tym planem. Ktoś inny wykorzysta go na swoim zastępstwie!</p>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł Zastępstwa</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Szybki Quiz o Zwierzętach" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-emerald-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 w-full">
                        
                        <div className="text-center mb-8 fade-in print-hidden">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                Edu<span className="text-emerald-500">Zastępstwo</span>
                            </h1>
                            <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                Masz niespodziewane zastępstwo i 0 przygotowania? Wygeneruj angażujący plan lekcji w 10 sekund i okiełznaj klasę.
                            </p>
                        </div>

                        {/* TOGGLE WIDOKÓW */}
                        <div className="flex justify-center mb-10 print-hidden fade-in">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Lifebuoy" size={16} /> Koło Ratunkowe (AI)
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Baza Zastępstw
                                </button>
                            </div>
                        </div>

                        {viewMode === 'kreator' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                
                                {limitData.showWarning && !isPro && (
                                    <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg mb-8 print-hidden">
                                        <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                        <p className="text-slate-300 mb-4 text-sm sm:text-base">Odblokuj pełen potencjał kodem na górnym pasku.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 print-hidden">
                                    <div className="lg:col-span-5 space-y-6">
                                        <div className="glass-panel p-6 md:p-8 rounded-[2rem]">
                                            <h2 className="text-lg font-black text-emerald-400 mb-6 uppercase tracking-widest flex items-center gap-2">
                                                <Icon name="Lifebuoy" /> Sytuacja Awaryjna
                                            </h2>
                                            <div className="space-y-5">
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Kto siedzi w klasie?</label>
                                                    <select value={grade} onChange={(e) => setGrade(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-medium">
                                                        <option value="Przedszkole">Przedszkole / Zerówka</option>
                                                        <option value="Klasa 1-3">Edukacja Wczesnoszkolna (Kl. 1-3)</option>
                                                        <option value="Klasa 4-6">Klasy 4-6</option>
                                                        <option value="Klasa 7-8">Klasy 7-8</option>
                                                        <option value="Szkoła średnia">Szkoła średnia</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">Co masz do dyspozycji?</label>
                                                    <select value={resources} onChange={(e) => setResources(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-medium">
                                                        <option value="Nic (tylko głos, tablica i kreda)">Kompletnie nic (tylko ja i tablica)</option>
                                                        <option value="Dzieci mają kartki i długopisy">Kartki i długopisy w ławkach</option>
                                                        <option value="Mam dostęp do rzutnika z internetem">Rzutnik / Tablica Multimedialna</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-2 block">Motyw (Opcjonalnie)</label>
                                                    <textarea value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Zostaw puste dla losowych gier, albo wpisz temat np. 'Kraje Europy'..." className="w-full h-20 bg-slate-900 border border-slate-700 text-white rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-medium resize-none"></textarea>
                                                    <div className="flex flex-wrap gap-2 mt-3">
                                                        {topicPills.map(pill => (
                                                            <button key={pill} onClick={() => setTopic(pill)} className="text-[10px] uppercase font-bold tracking-wider bg-slate-800 hover:bg-emerald-900 text-slate-400 hover:text-emerald-300 px-3 py-1.5 rounded-full border border-slate-700 transition-colors">{pill}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={generateContent} disabled={isGenerating || (!isPro && limitData.remaining === 0)}
                                                className="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white py-4 rounded-xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(16,185,129,0.3)] btn-bounce transition-all disabled:opacity-50"
                                            >
                                                {isGenerating ? 'Wymyślam gry...' : <><Icon name="Sparkles" /> Uratuj mi lekcję!</>}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-7">
                                        <div className="glass-panel p-6 sm:p-8 rounded-[2rem] h-full flex flex-col relative min-h-[400px]">
                                            {!generatedPlan ? (
                                                <div className="m-auto text-center opacity-30 flex flex-col items-center">
                                                    <Icon name="Lifebuoy" size={80} className="mb-4" />
                                                    <h3 className="text-xl font-bold">Twoje koło ratunkowe</h3>
                                                    <p className="text-sm mt-2">Kliknij Generuj, aby otrzymać szybki plan na tę lekcję.</p>
                                                </div>
                                            ) : (
                                                <div ref={resultRef} className="w-full h-full flex flex-col fade-in">
                                                    <div className="flex flex-wrap justify-between items-center mb-6 gap-2 border-b border-slate-700 pb-4 print-hidden">
                                                        <h2 className="text-xl font-bold text-white">Gotowy Plan!</h2>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => setShowPublishModal(true)} className="text-xs bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 py-2 rounded-lg flex items-center gap-1 shadow-md btn-bounce"><Icon name="Share" size={14}/> Zapisz</button>
                                                            <button onClick={() => copyToClipboard(generatedPlan)} className="text-xs bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-2 rounded-lg flex items-center gap-1 btn-bounce"><Icon name="Copy" size={14}/> Kopiuj</button>
                                                            <button onClick={() => window.print()} className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-lg flex items-center gap-1 btn-bounce"><Icon name="Printer" size={14}/> Drukuj</button>
                                                        </div>
                                                    </div>
                                                    <div 
                                                        className="prose prose-invert max-w-none print-container text-slate-300 leading-relaxed text-sm md:text-base bg-slate-900/50 p-6 rounded-xl border border-slate-800"
                                                        dangerouslySetInnerHTML={formatMarkdownToHTML(generatedPlan)}
                                                    ></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* WIDOK: BIBLIOTEKA SPOŁECZNOŚCI */}
                        {viewMode === 'biblioteka' && (
                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                <div className="text-center max-w-3xl mx-auto mb-10">
                                    <h2 className="text-3xl font-black text-amber-500 mb-2">Giełda Ratunkowa</h2>
                                    <p className="text-slate-400">Zobacz, jakie plany na szybkie zastępstwa wygenerowali inni nauczyciele i skopiuj je do siebie.</p>
                                </div>

                                {libraryItems.length === 0 ? (
                                    <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                        <div className="text-5xl mb-4">🛟</div>
                                        <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                        <p className="text-slate-400">Bądź pierwszy, wygeneruj plan i dodaj go do bazy!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {libraryItems.map((item) => (
                                            <div key={item.id} className="glass-panel rounded-2xl p-6 border border-slate-700/50 hover:border-emerald-500/30 transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-emerald-500/20 text-emerald-400">
                                                        {item.grade}
                                                    </span>
                                                </div>
                                                
                                                <h3 className="text-lg font-bold text-white mb-4">{item.title}</h3>

                                                <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 whitespace-pre-wrap flex-grow max-h-48 overflow-y-auto custom-scrollbar">
                                                    {item.content.substring(0, 150)}...
                                                </div>

                                                <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                    <button onClick={() => copyToClipboard(item.content)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-bold text-xs transition-colors flex items-center gap-2">
                                                        <Icon name="Copy" size={14} /> Kopiuj całość
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
