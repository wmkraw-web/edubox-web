    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useRef, useEffect } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, auth, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></>,
                Word: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name]}</svg>;
        };

        const SUBJECTS = [
            'Edukacja wczesnoszkolna', 'Język polski', 'Matematyka', 'Język angielski', 'Język niemiecki',
            'Historia', 'Geografia', 'Biologia', 'Przyroda', 'Fizyka', 'Chemia', 'Informatyka', 'Wychowanie fizyczne', 'Godzina wychowawcza', 'Muzyka', 'Plastyka', 'Inny przedmiot'
        ];

        const GRADES = [
            'Przedszkole', 'Klasa 1', 'Klasa 2', 'Klasa 3', 'Klasa 4', 'Klasa 5', 'Klasa 6', 'Klasa 7', 'Klasa 8', 'Szkoła Ponadpodstawowa'
        ];

        const METHODS = [
            'Metody podające (pogadanka, wykład)',
            'Metody aktywizujące (burza mózgów, projekt, grywalizacja)',
            'Metody eksponujące (film, pokaz)',
            'Metody praktyczne (ćwiczenia przedmiotowe, eksperymenty)'
        ];

        const SYSTEM_PROMPT = `Jesteś wybitnym polskim metodykiem i nauczycielem dyplomowanym z 20-letnim stażem. 
Twoim zadaniem jest napisanie profesjonalnego, szczegółowego Konspektu/Scenariusza Lekcji, gotowego do oddania dyrekcji lub wizytatorowi z kuratorium.

Wymagana struktura dokumentu:
<h2>1. Metryczka lekcji</h2>
<ul>
  <li><strong>Temat:</strong> [Twój piękny temat]</li>
  <li><strong>Klasa:</strong> [Klasa]</li>
  <li><strong>Czas trwania:</strong> 45 minut</li>
  <li><strong>Cele ogólne:</strong> [2-3 cele]</li>
  <li><strong>Cele operacyjne (uczeń wie/potrafi):</strong> [3-5 celów z czasownikami operacyjnymi]</li>
  <li><strong>Metody pracy:</strong> [wybrane metody]</li>
  <li><strong>Formy pracy:</strong> (indywidualna, grupowa, zbiorowa)</li>
  <li><strong>Środki dydaktyczne:</strong> [podręcznik, tablica interaktywna, karty pracy itp.]</li>
</ul>

<h2>2. Przebieg lekcji</h2>
<h3>Faza wstępna (ok. 5-7 min)</h3>
[Szczegółowy opis czynności organizacyjnych, zaciekawienia tematem (haczyk), podania celów]

<h3>Faza realizacyjna (ok. 30 min)</h3>
[Bardzo szczegółowy opis głównych aktywności. Krok po kroku, co robi nauczyciel, a co robią uczniowie. Podział na 2-3 zadania/ćwiczenia.]

<h3>Faza podsumowująca (ok. 8 min)</h3>
[Utrwalenie wiadomości, ocena pracy uczniów, praca domowa (jeśli jest), pożegnanie.]

ZASADY: 
Zwróć wynik formowany przy pomocy tagów HTML (<h2>, <h3>, <ul>, <li>, <strong>, <p>) dla idealnej czytelności.
NIE używaj znaczników markdown (\`\`\`). NIE używaj nagłówka <html> czy <body>. Zwróć sam czysty kod HTML zawartości scenariusza.
Zadbaj o profesjonalny, metodyczny język.`;

        function App() {
            const [user, setUser] = useState(null);
            const [viewMode, setViewMode] = useState('kreator');

            const [subject, setSubject] = useState('');
            const [grade, setGrade] = useState('');
            const [topic, setTopic] = useState('');
            const [methods, setMethods] = useState('');
            
            const [generatedText, setGeneratedText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const resultRef = useRef(null);

            // --- FIREBASE INIT ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth err", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'eduscenariusz_docs');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toLocaleDateString();
                const usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const updateAndCheckLimit = () => {
                if (isPro) return true; 

                const today = new Date().toLocaleDateString();
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData(prev => ({ ...prev, remaining: 0, showWarning: true }));
                    return false;
                }

                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const generateDocument = async () => {
                if (!subject || !grade || !topic.trim()) {
                    setError('Proszę wypełnić wszystkie pola (Przedmiot, Klasa, Temat).');
                    return;
                }

                if (!updateAndCheckLimit()) return;

                setIsGenerating(true);
                setError('');
                setGeneratedText('');

                try {
                    const finalPrompt = `Przedmiot: ${subject}\nKlasa/Etap: ${grade}\nTemat lekcji: "${topic}"\nPreferowane metody/uwagi: ${methods || 'Zrób ciekawą, aktywizującą lekcję'}`;

                    if (window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("LocalTest");
                    }

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            system: SYSTEM_PROMPT,
                            prompt: finalPrompt,
                            temperature: 0.5
                        })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || data.error || `Błąd serwera API: ${response.status}`);

                    let text = data.text;
                    if (text) {
                        // Oczyść ze znaczników przemyśleń i niepotrzebnych bloków markdown
                        text = text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                        text = text.replace(/```html/gi, '').replace(/```/g, '').trim();
                        setGeneratedText(text);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }

                } catch (err) {
                    if (err.message === "LocalTest") {
                        setError('Tryb lokalny. Symulacja.');
                        setTimeout(() => {
                            const demoText = `<h2>1. Metryczka lekcji</h2><ul><li><strong>Temat:</strong> ${topic}</li><li><strong>Klasa:</strong> ${grade}</li><li><strong>Czas trwania:</strong> 45 minut</li><li><strong>Cele ogólne:</strong> Zapoznanie z nowym materiałem.</li><li><strong>Cele operacyjne:</strong> Uczeń potrafi zdefiniować pojęcie, uczeń potrafi pracować w grupie.</li><li><strong>Metody pracy:</strong> Aktywizujące.</li></ul><h2>2. Przebieg lekcji</h2><h3>Faza wstępna (5 min)</h3><p>Powitanie klasy, podanie tematu i celów lekcji.</p><h3>Faza realizacyjna (30 min)</h3><p>Praca w grupach nad zadaniem głównym. Nauczyciel nadzoruje pracę i udziela wskazówek.</p><h3>Faza podsumowująca (10 min)</h3><p>Wspólne omówienie wyników pracy, ocena aktywności, zadanie pracy domowej.</p>`;
                            setGeneratedText(demoText);
                            setIsGenerating(false);
                        }, 1500);
                    } else {
                        setError('Wystąpił błąd serwera. Spróbuj ponownie.');
                    }
                } finally {
                    setIsGenerating(false);
                }
            };

            const copyToClipboard = () => {
                if (!generatedText) return;
                // Pobranie czystego tekstu z HTML'a na potrzeby schowka
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = generatedText;
                const plainText = tempDiv.innerText || tempDiv.textContent;
                
                const textArea = document.createElement("textarea");
                textArea.value = plainText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('✅ Skopiowano do schowka!');
            };

            const exportToWord = (htmlContent, title) => {
                if (!htmlContent) return;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${title}</title><style>body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: #000; text-align: justify; } h2 { font-size: 14pt; color: #000; margin-top: 20pt; border-bottom: 1px solid #000; } h3 { font-size: 12pt; font-weight: bold; margin-top: 10pt; } ul { margin-left: 20px; } li { margin-bottom: 5px; }</style></head><body>`;
                const footer = `</body></html>`;
                const blob = new Blob(['\ufeff', header + htmlContent + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.doc`; link.click();
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj krótki tytuł!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'eduscenariusz_docs');
                        await addDoc(libRef, {
                            title: publishTitle,
                            content: generatedText,
                            subject: subject,
                            grade: grade,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Bibliotece!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const printDocument = () => {
                window.print();
            };

            return (
                <div className="relative flex flex-col min-h-screen print:bg-white">
                    <div className="hero-glow print-hidden"></div>

                    {toastMessage && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-purple-600 text-white px-6 py-3 rounded-2xl shadow-[0_0_30px_rgba(168,85,247,0.4)] font-bold text-sm animate-toast flex items-center gap-3 border border-purple-400 print-hidden`}>
                            <Icon name="CheckCircle" size={18} /> {toastMessage}
                        </div>
                    )}

                    {/* MODAL PUBLIKACJI */}
                    {showPublishModal && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                            <div className="bg-slate-900 border border-purple-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                <h3 className="text-2xl font-black text-purple-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Bazie</h3>
                                <div className="bg-blue-500/10 border border-blue-500/30 text-blue-400 p-3 rounded-lg text-xs font-bold mb-4">
                                    Podziel się swoim super scenariuszem z innymi nauczycielami na platformie!
                                </div>
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł Twojego Scenariusza</label>
                                <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder={`np. ${topic.substring(0,25)}...`} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-purple-500" />
                                <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-purple-500 hover:bg-purple-400 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                    {isPublishing ? 'Publikowanie...' : 'Opublikuj w Giełdzie'}
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-10 pb-20 px-4 sm:px-6 z-10 print:p-0">
                        <div className="max-w-5xl mx-auto">
                            
                            {/* Nagłówek */}
                            <div className="text-center mb-10 fade-in print-hidden">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Edu<span className="text-gradient">Scenariusz</span>
                                </h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                    Wpisz temat lekcji, a sztuczna inteligencja wygeneruje profesjonalny, pełny konspekt z celami, metodami i podziałem czasowym gotowy dla dyrekcji.
                                </p>
                            </div>

                            {/* TOGGLE WIDOKÓW */}
                            <div className="flex justify-center mb-8 print-hidden fade-in">
                                <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg w-full max-w-md">
                                    <button onClick={() => setViewMode('kreator')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 ${viewMode === 'kreator' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Sparkles" size={16} /> Kreator Konspektów
                                    </button>
                                    <button onClick={() => setViewMode('biblioteka')} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all flex items-center justify-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(59,130,246,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                        <Icon name="Library" size={16} /> Giełda Scenariuszy
                                    </button>
                                </div>
                            </div>

                            {viewMode === 'kreator' && (
                                <div className="animate-[fadeIn_0.3s_ease-out]">
                                    
                                    {limitData.showWarning && !isPro && (
                                        <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center mb-8 shadow-lg fade-in relative overflow-hidden">
                                            <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty (5/5)</h3>
                                            <p className="text-slate-300 mb-4 text-sm sm:text-base">
                                                Aby korzystać z modułu AI bez limitów, wpisz kod PRO na górnym pasku w menu.
                                            </p>
                                        </div>
                                    )}

                                    {/* Panel Sterowania */}
                                    <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50 print-hidden" style={{animationDelay: '0.1s'}}>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-8 mb-6">
                                            <div>
                                                <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">
                                                    Przedmiot
                                                </label>
                                                <select 
                                                    value={subject} 
                                                    onChange={(e) => setSubject(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl p-4 focus:ring-2 focus:ring-purple-500 outline-none"
                                                >
                                                    <option value="" disabled>Wybierz z listy...</option>
                                                    {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">
                                                    Klasa / Poziom
                                                </label>
                                                <select 
                                                    value={grade} 
                                                    onChange={(e) => setGrade(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl p-4 focus:ring-2 focus:ring-purple-500 outline-none"
                                                >
                                                    <option value="" disabled>Wybierz klasę...</option>
                                                    {GRADES.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">
                                                Temat lekcji
                                            </label>
                                            <input 
                                                type="text"
                                                value={topic}
                                                onChange={(e) => setTopic(e.target.value)}
                                                placeholder="Np. Budowa i funkcje liścia, Cechy fraszki, Past simple w opowiadaniach..."
                                                className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-white font-bold mb-3 text-sm uppercase tracking-wider">
                                                Oczekiwane Metody i formy pracy (Opcjonalnie)
                                            </label>
                                            <textarea 
                                                value={methods}
                                                onChange={(e) => setMethods(e.target.value)}
                                                placeholder="Możesz zostawić puste (AI dobierze optymalne) lub wskazać np.: Praca w grupach 4 os., metoda stacji zadaniowych, wykorzystanie kahoot..."
                                                className="w-full h-24 bg-slate-900/50 border border-slate-700 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 custom-scrollbar resize-y text-sm"
                                            ></textarea>
                                            
                                            <div className="flex flex-wrap gap-2 mt-3">
                                                {METHODS.map(m => (
                                                    <button key={m} onClick={() => setMethods(prev => prev + (prev ? ', ' : '') + m)} className="text-[10px] uppercase font-bold tracking-wider bg-slate-800 hover:bg-purple-900 text-slate-400 hover:text-purple-300 px-3 py-1.5 rounded-full border border-slate-700 transition-colors">
                                                        + {m.split('(')[0].trim()}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {error && <div className="mt-6 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>}

                                        <div className="mt-8 flex justify-center">
                                            <button 
                                                onClick={generateDocument}
                                                disabled={isGenerating || !subject || !grade || !topic.trim() || (!isPro && limitData.remaining === 0)}
                                                className={`w-full sm:w-auto px-10 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(168,85,247,0.2)] btn-bounce
                                                    ${(isGenerating || !subject || !grade || !topic.trim() || (!isPro && limitData.remaining === 0)) ? 'bg-slate-700 cursor-not-allowed border border-slate-600' : 'bg-gradient-to-r from-purple-500 to-blue-600 hover:scale-105'}`}
                                            >
                                                {isGenerating ? (
                                                    <><svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Wymyślam przebieg lekcji...</>
                                                ) : 'Wygeneruj Konspekt Lekcji'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Sekcja Wyników */}
                                    {generatedText && (
                                        <div ref={resultRef} className="mt-12 fade-in print:mt-0">

                                            <div className="glass-panel p-8 sm:p-12 rounded-[2.5rem] border border-purple-500/30 shadow-[0_0_40px_rgba(168,85,247,0.15)] relative overflow-hidden bg-white print:shadow-none print:border-none print:p-0 print:rounded-none print:bg-white">
                                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-400 to-blue-600 print-hidden"></div>
                                                
                                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 print-hidden border-b border-slate-200 pb-4">
                                                    <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                        <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                        Konspekt Zajęć
                                                    </h3>
                                                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                                        <button onClick={() => setShowPublishModal(true)} className="flex-1 sm:flex-none bg-amber-500 hover:bg-amber-400 text-slate-900 px-4 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-md">
                                                            <Icon name="Share" size={16}/> Do Giełdy
                                                        </button>
                                                        <button onClick={() => exportToWord(generatedText, `Scenariusz_${topic}`)} className="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold transition-all btn-bounce flex items-center justify-center gap-2">
                                                            <Icon name="Word" size={16}/> Word (.doc)
                                                        </button>
                                                        <button onClick={copyToClipboard} className="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold transition-all btn-bounce flex items-center justify-center gap-2">
                                                            <Icon name="Copy" size={16}/> Kopiuj
                                                        </button>
                                                        <button onClick={printDocument} className="flex-1 sm:flex-none bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-md shadow-purple-500/30">
                                                            <Icon name="Printer" size={16}/> Drukuj
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="scenariusz-content text-black print-content">
                                                    <div dangerouslySetInnerHTML={{ __html: generatedText }} />
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* WIDOK BIBLIOTEKI ZESTAWÓW */}
                            {viewMode === 'biblioteka' && (
                                <div className="animate-[fadeIn_0.3s_ease-out] w-full print-hidden">
                                    <div className="text-center max-w-3xl mx-auto mb-10">
                                        <h2 className="text-3xl font-black text-blue-400 mb-2">Giełda Scenariuszy EduBox</h2>
                                        <p className="text-slate-400">Przeglądaj, pobieraj i inspiruj się gotowymi scenariuszami udostępnionymi przez polską społeczność nauczycieli!</p>
                                    </div>
                                    
                                    {libraryItems.length === 0 ? (
                                        <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                            <div className="text-5xl mb-4">📖</div>
                                            <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                            <p className="text-slate-400">Bądź pierwszy! Wygeneruj piękny konspekt i wrzuć go do bazy dla innych.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {libraryItems.map((item) => (
                                                <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col max-h-[600px] border-blue-500/30 hover:border-blue-500/60">
                                                    <div className="flex justify-between items-start mb-3 flex-wrap gap-2">
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-purple-500/20 text-purple-400">
                                                            {item.subject}
                                                        </span>
                                                        <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-blue-500/20 text-blue-400">
                                                            {item.grade}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white mb-4 leading-tight">{item.title}</h3>
                                                    <div className="text-sm text-slate-300 bg-slate-900/50 p-4 rounded-xl border border-slate-800 mb-4 flex-grow overflow-y-auto custom-scrollbar scenariusz-content">
                                                        <div dangerouslySetInnerHTML={{ __html: item.content }} />
                                                    </div>
                                                    <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-700 mt-auto">
                                                        <button onClick={() => {
                                                            const tempDiv = document.createElement("div");
                                                            tempDiv.innerHTML = item.content;
                                                            const plainText = tempDiv.innerText || tempDiv.textContent;
                                                            navigator.clipboard.writeText(plainText);
                                                            showToast("✅ Skopiowano do schowka!");
                                                        }} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors" title="Kopiuj tekst do schowka">
                                                            <Icon name="Copy" size={16} />
                                                        </button>
                                                        <button onClick={() => exportToWord(item.content, item.title)} className="p-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-white transition-colors" title="Pobierz jako Word">
                                                            <Icon name="Word" size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    <footer className="py-6 border-t border-slate-800/50 text-center text-xs font-bold text-slate-500 uppercase tracking-widest mt-auto print-hidden">
                        Część potężnego systemu EduBox Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
