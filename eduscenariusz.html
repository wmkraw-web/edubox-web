<body class="custom-scrollbar">
    
    <!-- Kontener na globalne menu -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>
    
    <div id="root"></div>

        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect } = React;

        const BotHelperAvatar = () => (
            <svg viewBox="0 0 100 100" className="w-14 h-14 drop-shadow-md flex-shrink-0" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 30 V15" stroke="#94a3b8" strokeWidth="4" strokeLinecap="round"/>
                <circle cx="50" cy="12" r="5" fill="#10b981"/>
                <rect x="25" y="30" width="50" height="40" rx="12" fill="#047857"/>
                <rect x="32" y="38" width="36" height="22" rx="6" fill="#ffffff"/>
                <circle cx="40" cy="49" r="3.5" fill="#047857" className="bot-eye"/>
                <circle cx="60" cy="49" r="3.5" fill="#047857" className="bot-eye"/>
                <path d="M 45 56 Q 50 60 55 56" stroke="#047857" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
            </svg>
        );

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [isGenerating, setIsGenerating] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [botQuickPrompt, setBotQuickPrompt] = useState('');
            const [botMessage, setBotMessage] = useState("Cześć! Napisz mi jedno zdanie, np. 'Lekcja o dinozaurach dla 6 latków na 30 minut', a ja sam ustawię odpowiednie parametry!");

            const [params, setParams] = useState({
                topic: '',
                age: '5-6 latki',
                duration: '45-50 min',
                methods: 'Aktywizująca i ruchowa',
                needs: '',
                formatType: 'detailed',
                customGoal: ''
            });

            const [scenario, setScenario] = useState(null);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'scenarios',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                    setBotMessage("Świetnie! Dzięki Premium możesz generować nieograniczoną ilość epickich konspektów.");
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS (Własny backend GPT-4o-mini) ===
            const fetchEduBoxText = async (userPrompt, systemPrompt) => {
                const res = await fetch('/api/chat', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.4, model: "gpt-4o-mini" })
                });
                
                if (!res.ok) throw new Error(`API Error: ${res.status}`);
                const data = await res.json();
                
                let jsonStr = data.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                const startIdx = jsonStr.indexOf('{');
                const endIdx = jsonStr.lastIndexOf('}');
                if (startIdx !== -1 && endIdx !== -1) {
                    jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                }
                return JSON.parse(jsonStr);
            };

            // === LOGIC ===
            const handleBotAutoFill = async (e) => {
                if (e) e.preventDefault();
                const promptText = botQuickPrompt;
                if (!promptText || !promptText.trim()) return showToast('Wpisz najpierw tekst do analizy!', 'error');
                
                setIsAnalyzing(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 600)); // Symulacja myślenia
                    const text = promptText.toLowerCase();
                    
                    setParams(prev => {
                        let newParams = { ...prev };
                        let extractedTopic = promptText;

                        if (/3.*lat|4.*lat|3-4/i.test(text)) newParams.age = '3-4 latki';
                        else if (/5.*lat|6.*lat|5-6/i.test(text)) newParams.age = '5-6 latki';
                        else if (/klas.*1|klas.*2|klas.*3|klas.*i|pierwsz|drug|trzeci/i.test(text)) newParams.age = 'Klasy I-III';
                        else if (/klas.*4|klas.*5|klas.*6|klas.*7|klas.*8|czwart|piąt|szóst|starsz/i.test(text)) newParams.age = 'Klasy IV-VIII';

                        if (/15|20/.test(text)) newParams.duration = '15-20 min';
                        else if (/30|40/.test(text)) newParams.duration = '30-40 min';
                        else if (/90|półtorej|dwie/.test(text)) newParams.duration = '90 min';
                        else if (/45|50/.test(text)) newParams.duration = '45-50 min';

                        if (/ruch|zabaw|aktyw|gr/i.test(text)) newParams.methods = 'Aktywizująca i ruchowa';
                        else if (/pokaz|ogląd|obraz|film|prezenta/i.test(text)) newParams.methods = 'Pokazowa / Obrazowa';
                        else if (/projekt|badacz/i.test(text)) newParams.methods = 'Metoda projektowa';
                        else if (/praktycz|doświadcz|eksperymen/i.test(text)) newParams.methods = 'Praktyczne działanie';
                        else if (/opowiad|czyt|wykład/i.test(text)) newParams.methods = 'Podająca (opowiadanie)';

                        if (/autyzm|asperger|spektrum/i.test(text)) newParams.needs = 'Spektrum autyzmu';
                        else if (/adhd|nadpobudli/i.test(text)) newParams.needs = 'ADHD (Nadpobudliwość)';

                        extractedTopic = extractedTopic
                            .replace(/dla\s*\d+\s*lat[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]*/gi, '')
                            .replace(/dla\s*(dzieci|klas[y|a]?|uczniów)\s*[a-zA-Z0-9-IVX]*/gi, '')
                            .replace(/(przez\s*|na\s*)?\d+\s*min[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]*/gi, '')
                            .replace(/metod[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]*\s*[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+/gi, '')
                            .replace(/[,.]/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                        
                        if(extractedTopic) extractedTopic = extractedTopic.charAt(0).toUpperCase() + extractedTopic.slice(1);
                        newParams.topic = extractedTopic || 'Zajęcia ogólne';
                        return newParams;
                    });

                    setBotQuickPrompt('');
                    setBotMessage('Bum! 💥 Przeanalizowałem Twój tekst i perfekcyjnie poustawiałem suwaki. Zobacz poniżej!');
                } catch (error) {
                    showToast('Wystąpił błąd analizy!', 'error');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const generateScenario = async () => {
                if (!params.topic.trim()) return showToast('Wpisz najpierw temat zajęć!', 'error');
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setBotMessage("Przeszukuję bazę metodyczną, tworzę haki na uwagę (hooks) i piszę dokładne skrypty. Chwileczkę...");
                        
                        let detailInstruction = params.formatType === 'detailed' 
                            ? "Wymagam BARDZO ROZBUDOWANEGO konspektu. W sekcji 'phases' -> 'details' napisz dokładnie, wręcz z podziałem ról: co mówi Nauczyciel i co odpowiada Uczeń. Opisz dokładnie przebieg zabaw. Ten dokument ma być gotowcem kopiuj-wklej na zajęcia." 
                            : "Wymagam ZWIĘZŁEGO konspektu (tylko główne, krótkie punkty). Bez długich opisów.";

                        const systemPrompt = `Jesteś wybitnym polskim metodykiem edukacji. Odpowiadaj WYŁĄCZNIE w poprawnym formacie JSON.
                        ${detailInstruction}
                        Struktura JSON:
                        { 
                            "title": "...", 
                            "duration": "...", 
                            "group": "...", 
                            "methods": "...", 
                            "main_goal": "...", 
                            "custom_goal": "...", 
                            "phases": [{ "step_name": "...", "time": "...", "details": "..." }], 
                            "materials": ["..."], 
                            "integration": "...", 
                            "weather_alternative": "...", 
                            "adjustments": "..." 
                        }`;

                        const userPrompt = `Temat: ${params.topic}. Grupa: ${params.age}. Czas: ${params.duration}. Metoda: ${params.methods}. Potrzeby SPE: ${params.needs || 'Brak'}. Cel dodatkowy: ${params.customGoal || 'Brak'}. Zbuduj profesjonalny scenariusz.`;

                        try {
                            const result = await fetchEduBoxText(userPrompt, systemPrompt);
                            setScenario(result);
                            setBotMessage("Gotowe! Masz przed sobą genialny scenariusz. Użyj przycisków w prawym panelu by pobrać do Worda lub na Giełdę!");
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd generowania. Spróbuj ponownie.', 'error');
                            setBotMessage("Ojej, serwer odrzucił zapytanie. Spróbuj wygenerować jeszcze raz!");
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const exportToWord = () => {
                if(!scenario) return;
                const content = document.getElementById('scenario-render-area').innerHTML;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${scenario.title}</title><style>body {font-family: 'Times New Roman', serif; font-size: 11pt; line-height: 1.5;} h1 {font-size: 18pt; color: #047857; text-align: center; text-transform: uppercase; margin-bottom: 20px;} h2 {font-size: 14pt; border-bottom: 2px solid #10b981; padding-bottom: 5px; margin-top: 20px; color: #047857;} h3 {font-size: 12pt; color: #334155; margin-top: 15px;} b {color: #1e293b;} .box {background-color: #f8fafc; padding: 15px; border: 1px solid #cbd5e1; margin-bottom: 15px;}</style></head><body>`;
                const footer = `<\/body><\/html>`;
                const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Scenariusz_${scenario.title.replace(/\s+/g, '_')}.doc`;
                link.click();
            };

            const publishToGielda = async () => {
                if(!scenario) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { params, scenario };
                    await window.EduBoxCore.saveToGielda('scenarios', 'EduScenariusz', scenario.title, configToSave);
                    showToast("Opublikowano na Giełdzie Wzorów! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setParams(item.config.params);
                setScenario(item.config.scenario);
                setAppMode('generator');
                showToast("Wczytano projekt z Giełdy!", "info");
                setBotMessage("Wczytałem scenariusz innej osoby! Możesz go zmodyfikować lub od razu wydrukować.");
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i className="ph-bold ph-books text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-emerald-400">Scenariusz</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Generator
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-purple-600/20 text-purple-400 border border-purple-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-globe text-lg"></i> Giełda Wzorów
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Użycia dziś:</span>
                                            <span className="font-bold text-white">{usages} / 5</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-emerald-500 h-full" style={{width: `${(usages/5)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-emerald-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-slate-950 font-sans">
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2">Giełda Wzorów</h2>
                            <p className="text-slate-400 mb-8">Pobieraj scenariusze i konspekty udostępnione przez innych nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-emerald-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="bg-emerald-500/10 p-3 rounded-xl text-emerald-400 group-hover:scale-110 transition-transform">
                                                <i className="ph-fill ph-file-text text-2xl"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>
                                        </div>
                                        <h3 className="text-lg font-bold text-white mb-2 line-clamp-2">{item.name}</h3>
                                        <p className="text-sm text-slate-400 mb-4">{item.config.params?.age} • {item.config.params?.duration}</p>
                                        
                                        <button onClick={() => loadFromGielda(item)} className="mt-auto w-full bg-slate-800 hover:bg-emerald-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                            Wczytaj Scenariusz
                                        </button>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych scenariuszy.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-slate-950 font-sans relative">
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-emerald-500/20">
                                <i className="ph ph-spinner-gap animate-spin text-5xl text-emerald-500"></i>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2">AI układa metodykę...</h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 grid grid-cols-1 xl:grid-cols-12 gap-8 p-4 md:p-8 overflow-y-auto">
                        
                        {/* LEFT COLUMN: Input Form */}
                        <div className="xl:col-span-4 space-y-6 print-hidden">
                            
                            {/* EduBot Auto-Fill */}
                            <div className="glass-panel p-6 rounded-2xl space-y-4 relative overflow-hidden border border-emerald-500/20">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 blur-3xl rounded-full"></div>
                                <h2 className="font-bold flex items-center text-emerald-400 text-sm uppercase tracking-widest border-b border-slate-700/50 pb-4">
                                    <i className="ph-bold ph-magic-wand mr-2 text-lg"></i> Auto-Wypełnianie
                                </h2>
                                <div className="flex bg-slate-900/80 p-1.5 rounded-xl border border-slate-700 focus-within:border-emerald-500 transition-colors relative z-10">
                                    <input 
                                        type="text" 
                                        value={botQuickPrompt} 
                                        onChange={(e) => setBotQuickPrompt(e.target.value)} 
                                        onKeyDown={(e) => { if(e.key === 'Enter') handleBotAutoFill(e); }} 
                                        disabled={isAnalyzing}
                                        placeholder="np. Lekcja o dinozaurach dla 5 lat..." 
                                        className="flex-1 bg-transparent px-3 text-sm outline-none font-medium text-white placeholder-slate-500 disabled:opacity-50"
                                    />
                                    <button 
                                        onClick={handleBotAutoFill} 
                                        disabled={isAnalyzing}
                                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition-all flex items-center gap-2 disabled:opacity-70"
                                    >
                                        {isAnalyzing ? <><i className="ph-bold ph-spinner animate-spin text-sm"></i> Myślę...</> : "Analizuj"}
                                    </button>
                                </div>
                            </div>

                            {/* EduBot Dialogue */}
                            <div className="p-5 rounded-2xl border border-emerald-500/30 flex items-start gap-4 bg-emerald-900/10">
                                <BotHelperAvatar />
                                <div className="flex-1 pt-1">
                                    <h4 className="font-black text-xs uppercase tracking-widest mb-1 text-emerald-500">EduBot Metodyk</h4>
                                    <p className="text-sm font-medium leading-relaxed text-slate-300 bot-bubble" key={botMessage}>{botMessage}</p>
                                </div>
                            </div>

                            {/* Konfigurator */}
                            <div className="glass-panel p-6 rounded-2xl space-y-5">
                                <h2 className="font-bold flex items-center text-slate-200 text-sm uppercase tracking-widest border-b border-slate-700/50 pb-4">
                                    <i className="ph-bold ph-sliders-horizontal mr-2 text-emerald-500 text-lg"></i> Parametry Lekcji
                                </h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Temat zajęć *</label>
                                        <input type="text" value={params.topic} onChange={e => setParams({...params, topic: e.target.value})} placeholder="np. Przyczyny I wojny światowej" className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-emerald-500 transition-colors" />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Wiek</label>
                                            <select value={params.age} onChange={e => setParams({...params, age: e.target.value})} className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-emerald-500 appearance-none">
                                                <option value="3-4 latki">3-4 latki</option>
                                                <option value="5-6 latki">5-6 latki</option>
                                                <option value="Klasy I-III">Klasy I-III</option>
                                                <option value="Klasy IV-VIII">Klasy IV-VIII</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Czas</label>
                                            <select value={params.duration} onChange={e => setParams({...params, duration: e.target.value})} className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-emerald-500 appearance-none">
                                                <option value="15-20 min">15-20 min</option>
                                                <option value="30-40 min">30-40 min</option>
                                                <option value="45-50 min">45-50 min</option>
                                                <option value="90 min">90 min</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Metoda główna</label>
                                        <select value={params.methods} onChange={e => setParams({...params, methods: e.target.value})} className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-emerald-500 appearance-none">
                                            <option value="Aktywizująca i ruchowa">Aktywizująca i ruchowa</option>
                                            <option value="Pokazowa / Obrazowa">Pokazowa / Obrazowa</option>
                                            <option value="Metoda projektowa">Metoda projektowa</option>
                                            <option value="Praktyczne działanie">Praktyczne działanie</option>
                                            <option value="Podająca (opowiadanie)">Podająca (opowiadanie)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Dostosowanie (SPE) - opcj.</label>
                                        <input type="text" value={params.needs} onChange={e => setParams({...params, needs: e.target.value})} placeholder="np. dziecko ze spektrum autyzmu" className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-emerald-500 transition-colors" />
                                    </div>
                                    
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Format Generowania</label>
                                        <select value={params.formatType} onChange={e => setParams({...params, formatType: e.target.value})} className="w-full p-3 bg-emerald-900/20 border border-emerald-500/50 rounded-xl outline-none text-emerald-300 font-bold text-sm focus:border-emerald-500 appearance-none">
                                            <option value="detailed" className="bg-slate-900">📜 Epicki (Kopiuj-Wklej, szczegółowy)</option>
                                            <option value="concise" className="bg-slate-900">📝 Zwięzły Szkic (Tylko punkty)</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <button onClick={generateScenario} className="w-full mt-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-3.5 rounded-xl font-bold text-sm tracking-wide shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95">
                                    <i className="ph-bold ph-sparkle text-lg"></i> Generuj Konspekt
                                </button>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Output / Render Area */}
                        <div className="xl:col-span-8 flex flex-col items-center pb-10 print:block">
                            
                            {/* Actions / Export Controls */}
                            <div className={`w-full max-w-[210mm] flex justify-end gap-3 mb-4 print-hidden transition-opacity duration-300 ${scenario ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-lg disabled:opacity-50">
                                    <i className="ph-bold ph-globe text-lg"></i> Udostępnij
                                </button>
                                <button onClick={exportToWord} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-lg active:scale-95">
                                    <i className="ph-bold ph-file-doc text-lg"></i> Pobierz .docx
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm active:scale-95">
                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj / PDF
                                </button>
                            </div>

                            {/* A4 Document Container */}
                            <div id="scenario-container" className="w-full max-w-[210mm] print:max-w-full bg-white shadow-2xl p-10 md:p-14 text-slate-900 rounded-sm min-h-[297mm] font-serif border border-slate-200">
                                
                                {!scenario ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60 print-hidden mt-40">
                                        <i className="ph-thin ph-file-dashed text-7xl mb-4"></i>
                                        <p className="font-sans text-center">Wypełnij formularz po lewej stronie,<br/>aby wygenerować gotowy dokument.</p>
                                    </div>
                                ) : (
                                    <div id="scenario-render-area">
                                        {/* Header */}
                                        <div className="border-b-2 border-emerald-600 pb-6 mb-8 text-center">
                                            <div className="text-xs font-sans font-black uppercase tracking-widest mb-2 opacity-60 text-emerald-800">Scenariusz Lekcji</div>
                                            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 mb-4 uppercase leading-tight">{scenario.title}</h1>
                                            <div className="flex justify-center gap-8 border-t border-slate-200 pt-3 font-sans">
                                                <div className="text-xs font-bold text-slate-500 uppercase flex flex-col items-center"><span>Grupa:</span><span className="text-emerald-700 text-sm">{scenario.group}</span></div>
                                                <div className="text-xs font-bold text-slate-500 uppercase flex flex-col items-center"><span>Czas:</span><span className="text-emerald-700 text-sm">{scenario.duration}</span></div>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-8 text-[15px] leading-relaxed">
                                            {/* Section 1: Goals */}
                                            <section>
                                                <h2 className="text-lg font-bold font-sans text-emerald-700 uppercase border-l-4 border-emerald-500 pl-3 mb-4 bg-emerald-50/50 py-1">I. Cele i założenia</h2>
                                                <div className="pl-4 space-y-2">
                                                    <div><span className="font-bold">Cel główny: </span>{scenario.main_goal}</div>
                                                    {scenario.custom_goal && scenario.custom_goal !== 'Brak' && <div><span className="font-bold">Cel dodatkowy: </span>{scenario.custom_goal}</div>}
                                                    <div><span className="font-bold">Metody i formy pracy: </span>{scenario.methods}</div>
                                                </div>
                                            </section>
                                            
                                            {/* Section 2: Script */}
                                            <section>
                                                <h2 className="text-lg font-bold font-sans text-emerald-700 uppercase border-l-4 border-emerald-500 pl-3 mb-6 bg-emerald-50/50 py-1">II. Przebieg zajęć</h2>
                                                <div className="space-y-5">
                                                    {scenario.phases?.map((phase, idx) => (
                                                        <div key={idx} className="page-break-inside-avoid">
                                                            <div className="flex items-baseline gap-2 mb-2">
                                                                <h3 className="font-bold text-slate-900 font-sans">{phase.step_name}</h3>
                                                                <span className="text-[11px] font-sans font-bold text-white bg-slate-700 px-2 py-0.5 rounded-md">~{phase.time}</span>
                                                            </div>
                                                            <div className="pl-4 border-l-2 border-slate-200 whitespace-pre-wrap text-slate-800">
                                                                {phase.details}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </section>

                                            {/* Section 3: Additions */}
                                            {(scenario.materials?.length > 0 || scenario.integration || scenario.weather_alternative || scenario.adjustments) && (
                                                <section className="mt-10 border-t border-slate-300 pt-6 page-break-inside-avoid font-sans text-sm">
                                                    <h2 className="text-base font-bold text-slate-800 uppercase mb-4">Informacje Dodatkowe</h2>
                                                    <div className="space-y-2 bg-slate-50 p-4 rounded-lg border border-slate-200">
                                                        {scenario.materials?.length > 0 && <div><span className="font-bold text-slate-700">Materiały: </span> {Array.isArray(scenario.materials) ? scenario.materials.join(', ') : scenario.materials}</div>}
                                                        {scenario.integration && scenario.integration !== 'Brak' && <div><span className="font-bold text-slate-700">Korelacja: </span> {scenario.integration}</div>}
                                                        {scenario.weather_alternative && scenario.weather_alternative !== 'Brak' && <div><span className="font-bold text-slate-700">Alternatywa: </span> {scenario.weather_alternative}</div>}
                                                    </div>

                                                    {scenario.adjustments && scenario.adjustments !== "Brak" && (
                                                        <div className="bg-yellow-50 rounded-lg p-4 border border-yellow-200 mt-4">
                                                            <h3 className="text-xs font-bold text-yellow-800 uppercase mb-1">Dostosowanie (SPE)</h3>
                                                            <p className="text-yellow-900">{scenario.adjustments}</p>
                                                        </div>
                                                    )}
                                                </section>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
