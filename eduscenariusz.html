<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScenariusz AI - Generator Konspektów Lekcji</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config for Dark Mode & Accents -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

        /* Output Formatting */
        .ai-output h3 { font-size: 1.25rem; font-weight: 600; color: #a78bfa; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .ai-output p { margin-bottom: 0.75rem; line-height: 1.6; }
        .ai-output ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .ai-output li { margin-bottom: 0.25rem; }
        .ai-output strong { color: #f8fafc; }

        /* --- PRINT STYLES --- */
        @media print {
            body {
                background: white;
                color: black;
                background-image: none;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
                border: none;
                background: white;
            }
            .ai-output h3 { color: black; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
            .ai-output strong { color: black; }
            @page { margin: 2cm; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // State
            const [subject, setSubject] = useState('');
            const [topic, setTopic] = useState('');
            const [gradeLevel, setGradeLevel] = useState('');
            const [duration, setDuration] = useState('45');
            const [methods, setMethods] = useState({
                gamification: false,
                spe: false,
                project: false
            });
            const [objectives, setObjectives] = useState('');
            
            const [generatedPlan, setGeneratedPlan] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            // Freemium State
            const [isPremium, setIsPremium] = useState(false);
            const [usagesLeft, setUsagesLeft] = useState(2);
            const [showPremiumModal, setShowPremiumModal] = useState(false);
            const [promoCode, setPromoCode] = useState('');
            const [promoError, setPromoError] = useState('');

            // Load Freemium status on mount
            useEffect(() => {
                const premiumStatus = localStorage.getItem('edubox_premium_unlocked');
                const storedUsages = localStorage.getItem('eduscenariusz_usages');

                if (premiumStatus === 'true') {
                    setIsPremium(true);
                } else {
                    if (storedUsages !== null) {
                        setUsagesLeft(parseInt(storedUsages, 10));
                    } else {
                        localStorage.setItem('eduscenariusz_usages', '2');
                    }
                }
            }, []);

            const handlePromoSubmit = (e) => {
                e.preventDefault();
                if (promoCode.trim().toUpperCase() === 'KAWA2024') {
                    localStorage.setItem('edubox_premium_unlocked', 'true');
                    setIsPremium(true);
                    setShowPremiumModal(false);
                    setPromoError('');
                } else {
                    setPromoError('Nieprawidłowy kod. Spróbuj ponownie.');
                }
            };

            const parseMarkdown = (text) => {
                let html = text;
                // Headers
                html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                html = html.replace(/^## (.*$)/gim, '<h3>$1</h3>');
                // Bold
                html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
                // Lists
                html = html.replace(/^\* (.*$)/gim, '<ul><li>$1</li></ul>');
                html = html.replace(/<\/ul>\n<ul>/gim, '\n');
                return html;
            };

            const handleGenerate = async (e) => {
                e.preventDefault();
                
                if (!isPremium && usagesLeft <= 0) {
                    setShowPremiumModal(true);
                    return;
                }

                if (!subject || !topic || !gradeLevel) {
                    setError('Proszę wypełnić wymagane pola (Przedmiot, Temat, Klasa).');
                    return;
                }

                setIsLoading(true);
                setError('');
                setGeneratedPlan('');

                const prompt = `Jesteś doświadczonym nauczycielem metodykiem. Przygotuj profesjonalny konspekt lekcji na podstawie poniższych danych:
- Przedmiot: ${subject}
- Temat lekcji: ${topic}
- Klasa: ${gradeLevel}
- Czas trwania: ${duration} minut
${objectives ? `- Główne cele lekcji: ${objectives}` : ''}
${methods.gamification ? '- Uwzględnij elementy grywalizacji.' : ''}
${methods.spe ? '- Zwróć szczególną uwagę na dostosowanie do uczniów ze Specjalnymi Potrzebami Edukacyjnymi (SPE).' : ''}
${methods.project ? '- Oprzyj lekcję o pracę projektową/badawczą.' : ''}

Struktura konspektu powinna zawierać (użyj znaczników Markdown np. ### dla nagłówków, ** dla pogrubień):
1. Cele lekcji (ogólne i operacyjne - "uczeń potrafi...").
2. Metody i formy pracy.
3. Środki dydaktyczne.
4. Przebieg lekcji (podzielony na fazę wstępną, realizacyjną i podsumowującą z orientacyjnym czasem trwania każdej z nich).
5. Zadanie domowe (opcjonalnie).

Pisz zwięźle, konkretnie, językiem profesjonalnym, gotowym do wydruku dla dyrekcji lub hospitacji.`;

                try {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });

                    if (!response.ok) throw new Error('Błąd połączenia z serwerem AI.');
                    
                    const data = await response.json();
                    
                    if (data.response) {
                        setGeneratedPlan(parseMarkdown(data.response));
                        
                        // Deduct usage
                        if (!isPremium) {
                            const newUsages = usagesLeft - 1;
                            setUsagesLeft(newUsages);
                            localStorage.setItem('eduscenariusz_usages', newUsages.toString());
                        }
                    } else {
                        throw new Error('Pusta odpowiedź z serwera.');
                    }
                } catch (err) {
                    setError('Wystąpił błąd podczas generowania. Spróbuj ponownie później.');
                    console.error(err);
                } finally {
                    setIsLoading(false);
                }
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="container mx-auto px-4 py-8 max-w-7xl">
                    {/* Header - No Print */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 no-print glass-panel p-4 rounded-2xl">
                        <div className="flex items-center gap-3 mb-4 md:mb-0">
                            <div className="bg-fuchsia-500/20 p-2 rounded-lg text-fuchsia-400">
                                <i className="ph ph-books text-3xl"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-100 tracking-wide">EduScenariusz <span className="text-fuchsia-400">AI</span></h1>
                                <p className="text-sm text-slate-400">Generator Konspektów Lekcji</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            {!isPremium && (
                                <div className="text-sm px-4 py-2 rounded-full border border-slate-700 bg-slate-800/50 flex items-center gap-2">
                                    <i className="ph ph-lightning text-yellow-400"></i>
                                    <span>Pozostało prób: <strong className={usagesLeft > 0 ? "text-white" : "text-red-400"}>{usagesLeft}</strong></span>
                                </div>
                            )}
                            <a href="index.html" className="flex items-center gap-2 text-slate-300 hover:text-white transition-colors text-sm font-medium bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700/50 hover:bg-slate-700/50">
                                <i className="ph ph-arrow-left"></i> Wróć do Portfolio
                            </a>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* LEFT COLUMN: Input Form - No Print */}
                        <div className="lg:col-span-4 space-y-6 no-print">
                            <form onSubmit={handleGenerate} className="glass-panel p-6 rounded-2xl">
                                <h2 className="text-lg font-semibold mb-6 flex items-center gap-2 text-slate-200">
                                    <i className="ph ph-sliders-horizontal text-fuchsia-400"></i> Parametry lekcji
                                </h2>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-1">Przedmiot *</label>
                                        <input type="text" value={subject} onChange={e => setSubject(e.target.value)} placeholder="np. Historia, Język polski" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 placeholder-slate-500" required />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-1">Temat lekcji *</label>
                                        <textarea value={topic} onChange={e => setTopic(e.target.value)} rows="2" placeholder="np. Przyczyny wybuchu I wojny światowej" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 placeholder-slate-500" required></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-1">Klasa *</label>
                                            <input type="text" value={gradeLevel} onChange={e => setGradeLevel(e.target.value)} placeholder="np. 6 SP" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 placeholder-slate-500" required />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-300 mb-1">Czas (min)</label>
                                            <select value={duration} onChange={e => setDuration(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 appearance-none">
                                                <option value="45">45 minut</option>
                                                <option value="90">90 minut</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-slate-300 mb-1">Główne cele (opcjonalnie)</label>
                                        <textarea value={objectives} onChange={e => setObjectives(e.target.value)} rows="2" placeholder="Na czym najbardziej Ci zależy?" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/50 placeholder-slate-500"></textarea>
                                    </div>

                                    <div className="pt-4 border-t border-slate-700/50">
                                        <p className="block text-sm font-medium text-slate-300 mb-3">Opcje dodatkowe</p>
                                        
                                        <label className="flex items-center gap-3 mb-2 cursor-pointer group">
                                            <div className="relative flex items-center justify-center">
                                                <input type="checkbox" checked={methods.gamification} onChange={e => setMethods({...methods, gamification: e.target.checked})} className="peer sr-only" />
                                                <div className="w-5 h-5 border border-slate-600 rounded bg-slate-900/50 peer-checked:bg-fuchsia-500 peer-checked:border-fuchsia-500 transition-colors"></div>
                                                <i className="ph-bold ph-check text-white absolute opacity-0 peer-checked:opacity-100 text-xs pointer-events-none"></i>
                                            </div>
                                            <span className="text-sm text-slate-400 group-hover:text-slate-200 transition-colors">Włącz elementy grywalizacji</span>
                                        </label>

                                        <label className="flex items-center gap-3 mb-2 cursor-pointer group">
                                            <div className="relative flex items-center justify-center">
                                                <input type="checkbox" checked={methods.spe} onChange={e => setMethods({...methods, spe: e.target.checked})} className="peer sr-only" />
                                                <div className="w-5 h-5 border border-slate-600 rounded bg-slate-900/50 peer-checked:bg-fuchsia-500 peer-checked:border-fuchsia-500 transition-colors"></div>
                                                <i className="ph-bold ph-check text-white absolute opacity-0 peer-checked:opacity-100 text-xs pointer-events-none"></i>
                                            </div>
                                            <span className="text-sm text-slate-400 group-hover:text-slate-200 transition-colors">Dostosuj dla uczniów ze SPE</span>
                                        </label>

                                        <label className="flex items-center gap-3 cursor-pointer group">
                                            <div className="relative flex items-center justify-center">
                                                <input type="checkbox" checked={methods.project} onChange={e => setMethods({...methods, project: e.target.checked})} className="peer sr-only" />
                                                <div className="w-5 h-5 border border-slate-600 rounded bg-slate-900/50 peer-checked:bg-fuchsia-500 peer-checked:border-fuchsia-500 transition-colors"></div>
                                                <i className="ph-bold ph-check text-white absolute opacity-0 peer-checked:opacity-100 text-xs pointer-events-none"></i>
                                            </div>
                                            <span className="text-sm text-slate-400 group-hover:text-slate-200 transition-colors">Metoda projektu / badawcza</span>
                                        </label>
                                    </div>
                                </div>

                                {error && <div className="mt-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-lg flex items-start gap-2"><i className="ph ph-warning-circle text-lg mt-0.5"></i> {error}</div>}

                                <button 
                                    type="submit" 
                                    disabled={isLoading}
                                    className={`w-full mt-6 py-3 rounded-xl font-medium text-white shadow-lg transition-all flex items-center justify-center gap-2
                                        ${isLoading ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-fuchsia-600 to-indigo-600 hover:from-fuchsia-500 hover:to-indigo-500 hover:shadow-fuchsia-500/25'}`}
                                >
                                    {isLoading ? (
                                        <><i className="ph ph-spinner animate-spin text-xl"></i> Generowanie AI...</>
                                    ) : (
                                        <><i className="ph ph-magic-wand text-xl"></i> Generuj Scenariusz</>
                                    )}
                                </button>
                                
                                {!isPremium && usagesLeft <= 0 && (
                                    <p className="text-center text-xs text-slate-500 mt-3 cursor-pointer hover:text-fuchsia-400" onClick={() => setShowPremiumModal(true)}>
                                        Wyczerpano darmowe próby. Kliknij, aby odblokować.
                                    </p>
                                )}
                            </form>
                        </div>

                        {/* RIGHT COLUMN: Output Area */}
                        <div className="lg:col-span-8">
                            <div className={`glass-panel p-8 rounded-2xl min-h-[600px] print-area ${!generatedPlan && !isLoading ? 'flex items-center justify-center' : ''}`}>
                                
                                {!generatedPlan && !isLoading && (
                                    <div className="text-center text-slate-500 no-print flex flex-col items-center">
                                        <div className="w-20 h-20 mb-4 rounded-full bg-slate-800/50 flex items-center justify-center border border-slate-700/50">
                                            <i className="ph ph-file-text text-4xl text-slate-600"></i>
                                        </div>
                                        <p>Wypełnij formularz po lewej stronie i kliknij "Generuj",<br/>aby stworzyć profesjonalny konspekt lekcji.</p>
                                    </div>
                                )}

                                {isLoading && (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 no-print">
                                        <div className="relative w-16 h-16">
                                            <div className="absolute inset-0 rounded-full border-t-2 border-fuchsia-500 animate-spin"></div>
                                            <div className="absolute inset-2 rounded-full border-r-2 border-indigo-500 animate-spin" style={{animationDirection: 'reverse'}}></div>
                                            <i className="ph ph-brain absolute inset-0 flex items-center justify-center text-2xl text-fuchsia-400"></i>
                                        </div>
                                        <p className="animate-pulse">Sztuczna inteligencja opracowuje metodykę...</p>
                                    </div>
                                )}

                                {generatedPlan && !isLoading && (
                                    <div className="w-full">
                                        <div className="flex justify-between items-start mb-8 pb-4 border-b border-slate-700/50 no-print">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-100">Twój Scenariusz Lekcji</h2>
                                                <p className="text-sm text-slate-400">Gotowy do wydruku lub skopiowania</p>
                                            </div>
                                            <button onClick={handlePrint} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-4 py-2 rounded-xl flex items-center gap-2 transition-colors">
                                                <i className="ph ph-printer"></i> Drukuj / PDF
                                            </button>
                                        </div>
                                        
                                        {/* Printable Document Header (Only visible in output) */}
                                        <div className="mb-6 hidden print:block text-black">
                                            <h1 className="text-2xl font-bold text-center mb-4 uppercase tracking-wider">Konspekt Lekcji</h1>
                                            <div className="grid grid-cols-2 gap-2 text-sm border-b border-black pb-4">
                                                <div><strong>Przedmiot:</strong> {subject}</div>
                                                <div><strong>Klasa:</strong> {gradeLevel}</div>
                                                <div className="col-span-2"><strong>Temat:</strong> {topic}</div>
                                                <div><strong>Czas trwania:</strong> {duration} min</div>
                                            </div>
                                        </div>

                                        {/* Rendered Markdown output */}
                                        <div 
                                            className="ai-output text-slate-300 print:text-black text-justify"
                                            dangerouslySetInnerHTML={{ __html: generatedPlan }}
                                        />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* FREEMIUM MODAL */}
                    {showPremiumModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm no-print">
                            <div className="glass-panel p-8 rounded-2xl max-w-md w-full border border-fuchsia-500/30 relative">
                                <button onClick={() => setShowPremiumModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                                    <i className="ph ph-x text-xl"></i>
                                </button>
                                
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-fuchsia-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i className="ph ph-lock-key text-3xl text-fuchsia-400"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-white mb-2">Odblokuj Pełen Dostęp</h3>
                                    <p className="text-sm text-slate-300">Wyczerpałeś darmowe próby generowania scenariuszy. Wprowadź kod dostępu <span className="text-fuchsia-400 font-mono font-bold">KAWA2024</span>, aby używać bez limitu.</p>
                                </div>

                                <form onSubmit={handlePromoSubmit}>
                                    <input 
                                        type="text" 
                                        value={promoCode} 
                                        onChange={e => setPromoCode(e.target.value)}
                                        placeholder="Wpisz kod tutaj..." 
                                        className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg font-mono text-white mb-4 focus:outline-none focus:border-fuchsia-500 uppercase tracking-widest"
                                    />
                                    {promoError && <p className="text-red-400 text-sm text-center mb-4">{promoError}</p>}
                                    <button type="submit" className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-medium py-3 rounded-xl transition-colors">
                                        Aktywuj Dostęp
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
