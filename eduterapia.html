    <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [activeTab, setActiveTab] = useState('story'); // 'story', 'tus', 'sensory'
            const [isGenerating, setIsGenerating] = useState(false);
            const [generationStep, setGenerationStep] = useState(null); // Dla historyjek: 'text', 'image'
            
            const [params, setParams] = useState({
                childName: '',
                childAge: '4 lata',
                gender: 'chłopiec',
                trigger: '',
                solution: '',
                tusGoal: '',
                tusGroup: 'Spektrum autyzmu',
                sensoryType: 'Wyciszenie (Propriocepcja)'
            });

            const [generatedData, setGeneratedData] = useState(null);
            const [botMessage, setBotMessage] = useState("");

            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                let unsubscribeSnapshot = null;

                const checkInterval = setInterval(async () => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        await window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        unsubscribeSnapshot = window.EduBoxCore.subscribeToGielda(
                            'therapy_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                    }
                }, 100);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };
            }, []);

            useEffect(() => {
                if(activeTab === 'story') setBotMessage("Historyjka Społeczna z obrazkiem: Opisz mi, czego uczeń się boi lub z czym ma problem, a ja napiszę prostą bajkę terapeutyczną i narysuję do niej uspokajający obrazek!");
                else if(activeTab === 'tus') setBotMessage("Trening TUS: Wpisz główny problem grupy (np. agresja przy przegrywaniu), a ułożę szczegółowy, 30-minutowy plan zajęć z podziałem na role.");
                else if(activeTab === 'sensory') setBotMessage("Zabawy Sensoryczne: Wybierz, czego potrzebuje dziecko, a wymyślę 3 kreatywne ćwiczenia z użyciem tanich, dostępnych w sali materiałów.");
            }, [activeTab]);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS ===
            const fetchTherapyText = async (systemInstruction, userPrompt) => {
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: userPrompt, 
                            system: systemInstruction,
                            temperature: 0.5,
                            format: "json",
                            model: "gpt-4o-mini"
                        })
                    });
                    
                    if (!res.ok) throw new Error(`API Error: ${res.status}`);
                    const data = await res.json();
                    
                    let jsonStr = data.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const startIdx = jsonStr.indexOf('{');
                    const endIdx = jsonStr.lastIndexOf('}');
                    if (startIdx !== -1 && endIdx !== -1) {
                        jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                    }
                    return JSON.parse(jsonStr);
                } catch (e) {
                    console.warn("Przełączam na model awaryjny (Canvas Fallback):", e);
                    const apiKey = ""; 
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPrompt }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] },
                            generationConfig: { temperature: 0.5, responseMimeType: "application/json" }
                        })
                    });
                    if (!res.ok) throw new Error("Oba modele AI niedostępne");
                    const data = await res.json();
                    return JSON.parse(data.candidates[0].content.parts[0].text);
                }
            };

            const secureApiImageCall = async (payloadData) => {
                try {
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadData) 
                    });
                    if (res.ok) return await res.json();
                    if (res.status === 404 || res.status === 405) throw new Error("USE_FALLBACK");
                    const errData = await res.json();
                    throw new Error(errData.error || `Status API: ${res.status}`);
                } catch (e) {
                    if (e.message === "USE_FALLBACK" || e.message.includes("Failed to fetch") || e.message.includes("Unexpected token")) {
                        const apiKey = ""; 
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                        const fallbackRes = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                instances: { prompt: payloadData.prompt },
                                parameters: { sampleCount: 1, aspectRatio: "1:1" }
                            })
                        });
                        if (!fallbackRes.ok) throw new Error("Błąd silnika graficznego Google.");
                        return await fallbackRes.json();
                    }
                    throw e;
                }
            };

            // === LOGIC ===
            const generateContent = () => {
                // Walidacja
                if (activeTab === 'story' && (!params.childName || !params.trigger)) { showToast('Wpisz imię i opisz sytuację trudną!', 'error'); return; }
                if (activeTab === 'tus' && !params.tusGoal) { showToast('Wpisz cel lub problem grupy!', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedData(null);
                        
                        try {
                            if (activeTab === 'story') {
                                const imgProStatus = localStorage.getItem('eduboxProStatus');
                                const imgIsPro = imgProStatus === 'PRO' || imgProStatus === 'active' || isPremium;
                                if (!imgIsPro && window.EduBoxCore.getImageUsageCount() >= 2) {
                                    showToast('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący, by generować dalej!', 'error');
                                    setIsGenerating(false);
                                    return;
                                }
                                setGenerationStep('text');
                                setBotMessage("Piszę historyjkę i zamawiam ilustrację u malarza 3D. To potrwa kilkanaście sekund...");
                                
                                const sysPrompt = `Jesteś pedagogiem specjalnym. Napisz krótką Historyjkę Społeczną (Social Story) dla dziecka.
ZASADY: 1. Bardzo prosty język, krótkie zdania. Zero metafor. 2. Struktura: Wstęp, Sytuacja trudna, Emocje (normalizacja), Rozwiązanie, Sukces.
ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON o strukturze:
{
  "title": "Tytuł historyjki",
  "content": "Treść sformatowana w HTML (używaj <p>, <strong>)",
  "imagePrompt": "A highly concise, purely visual English description (max 15 words) of the happy ending of the story. Include a cute 3D pixar style caucasian ${params.gender === 'chłopiec' ? 'boy' : 'girl'}. No text or letters."
}`;
                                const usrPrompt = `Imię: ${params.childName}, Wiek: ${params.childAge}, Płeć: ${params.gender}\nTrudność (zapalnik): ${params.trigger}\nPożądane zachowanie (rozwiązanie): ${params.solution}`;

                                const textData = await fetchTherapyText(sysPrompt, usrPrompt);

                                setGenerationStep('image');
                                
                                // Generowanie obrazka na podstawie angielskiego opisu z JSONa
                                const hiddenInstruction = `A beautiful, highly detailed 3D Pixar style children's book illustration. MAIN SUBJECT: ${textData.imagePrompt}. The child looks calm, safe, and happy. Cozy, warm, cheerful environment. Single unified scene. CRITICAL RULE: ABSOLUTELY NO TEXT, NO LETTERS, NO WORDS anywhere on the image. Perfect masterpiece.`;
                                
                                const payload = {
                                    prompt: hiddenInstruction, 
                                    negative_prompt: "text, letters, words, spelling, writing, typography, watermark, creepy, scary, deformed", 
                                    style_preset: "3d-model",
                                    aspect_ratio: '1:1',
                                    width: 1024,
                                    height: 1024
                                };

                                const imgData = await secureApiImageCall(payload);
                                const base64Image = imgData.predictions?.[0]?.bytesBase64Encoded || imgData.artifacts?.[0]?.base64 || imgData.image || imgData.imageUrl || imgData.image_url || imgData.url; 
                                
                                let finalImage = null;
                                if (base64Image) finalImage = base64Image.startsWith('http') || base64Image.startsWith('data:image') ? base64Image : `data:image/png;base64,${base64Image}`;

                                if (!imgIsPro && finalImage) {
                                    const today = new Date().toISOString().split('T')[0];
                                    const newImgCount = window.EduBoxCore.getImageUsageCount() + 1;
                                    localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                                }

                                setGeneratedData({ type: 'story', title: textData.title, content: textData.content, image: finalImage });
                                setBotMessage("Gotowe! Mamy przepiękną, spersonalizowaną historyjkę z obrazkiem. Dzieciakom to bardzo pomoże!");

                            } else if (activeTab === 'tus') {
                                setBotMessage("Przygotowuję pełny scenariusz Treningu Umiejętności Społecznych...");

                                const sysPrompt = `Jesteś certyfikowanym trenerem TUS (Trening Umiejętności Społecznych). Skonstruuj SZCZEGÓŁOWY i praktyczny scenariusz na 30-45 minut.
Dopasuj zabawy do profilu grupy. ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON o strukturze:
{
  "title": "Tytuł zajęć",
  "content": "Skrypt w HTML. Użyj <h2> Powitanie </h2>, <h2> Psychoedukacja </h2>, <h2> Scenka ról </h2>, <h2> Relaksacja </h2>. Pisz szczegółowo, dodając instrukcje (co mówi trener)."
}`;
                                const usrPrompt = `Wiek/Profil: ${params.childAge}, ${params.tusGroup}\nProblem do przepracowania: ${params.tusGoal}`;

                                const textData = await fetchTherapyText(sysPrompt, usrPrompt);
                                setGeneratedData({ type: 'tus', title: textData.title, content: textData.content });
                                setBotMessage("Scenariusz TUS gotowy! Konkretne kroki, proste polecenia. Drukuj i wchodź na salę.");

                            } else if (activeTab === 'sensory') {
                                setBotMessage("Szukam najciekawszych zabaw z użyciem tanich materiałów...");

                                const sysPrompt = `Jesteś terapeutą Integracji Sensorycznej (SI). Wygeneruj 3 kreatywne, tanie w przygotowaniu zabawy sensoryczne celujące w wybrany obszar.
ZWRÓĆ WYŁĄCZNIE POPRAWNY JSON o strukturze:
{
  "title": "Nazwa Pakietu Zabaw",
  "content": "Zabawy w formacie HTML (<h2>1. Nazwa zabawy</h2><p><strong>Potrzebne:</strong> ...</p><p><strong>Opis wykonania:</strong> ...</p>)"
}`;
                                const usrPrompt = `Cel stymulacji: ${params.sensoryType}\nWiek: ${params.childAge}\nZabawy mają być bezpieczne, łatwe do zrobienia w przedszkolu ze zwykłych przedmiotów.`;

                                const textData = await fetchTherapyText(sysPrompt, usrPrompt);
                                setGeneratedData({ type: 'sensory', title: textData.title, content: textData.content });
                                setBotMessage("Znalazłem świetne zabawy! Pamiętaj, żeby przy zabawach brudzących uprzedzić dzieci z nadwrażliwością dotykową.");
                            }

                            setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);

                        } catch (error) {
                            console.error(error); 
                            showToast('Błąd generowania. Serwer jest przeciążony.', 'error');
                            setBotMessage("Ojej, coś przerwało połączenie. Spróbujmy wygenerować jeszcze raz!");
                        } finally { 
                            setIsGenerating(false); 
                            setGenerationStep(null);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedData) return;
                setIsSavingToGielda(true);
                try {
                    // Minimalizacja danych - ucinamy base64 by nie przekroczyć limitu na giełdzie, lub kompresujemy.
                    // Najbezpieczniej dla historyjek jest zapisać sam tekst + prompt, aby ktoś wygenerował swój obrazek,
                    // ale dla EduTerapii zróbmy uproszczony zapis tekstowy.
                    let safeData = { ...generatedData };
                    if (safeData.type === 'story') safeData.image = null; 

                    const configToSave = { params, activeTab, generatedData: safeData };
                    await window.EduBoxCore.saveToGielda('therapy_market', 'EduTerapia', safeData.title, configToSave);
                    showToast("Opublikowano na Giełdzie! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setParams(item.config.params);
                setActiveTab(item.config.activeTab);
                setGeneratedData(item.config.generatedData);
                setAppMode('generator');
                showToast("Wczytano materiał. Jeśli to historyjka, wygeneruj grafikę ponownie!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            const exportToWord = () => {
                if(!generatedData) return;
                const content = document.getElementById('document-render-area').innerHTML;
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${generatedData.title}</title><style>body { font-family: 'Arial', sans-serif; font-size: 14pt; line-height: 1.6; color: #000; } h1 { font-size: 20pt; text-align: center; color: #be185d; } h2 { font-size: 16pt; color: #9d174d; border-bottom: 1px solid #fce7f3; padding-bottom: 5px; margin-top: 20px;} p { margin-bottom: 15px; } img { max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px; }</style></head><body>`;
                const footer = `<\/body><\/html>`;
                const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `EduTerapia_${Date.now()}.doc`; link.click();
            };

            // === RENDERERS ===
            const renderSidebar = () => (

                        <div className="w-10 h-10 bg-gradient-to-br from-pink-500 to-rose-600 rounded-xl flex items-center justify-center shadow-lg shadow-pink-500/20">
                            <i className="ph-bold ph-heart-half text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-pink-400">Terapia</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-pink-600/20 text-pink-400 border border-pink-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>

                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-rose-600/20 text-rose-400 border border-rose-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-globe text-lg"></i> Baza Gotowców
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}

                                {!isPremium && (

                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Opracowano:</span>
                                            <span className="font-bold text-white">{usages} / 2</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-pink-500 h-full" style={{width: `${(usages/2)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-pink-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-pink-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // GIEŁDA WIDOK
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Materiałów</h2>
                            <p className="text-slate-400 mb-8">Pobieraj gotowe historyjki społeczne i scenariusze zajęć TUS.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-6 rounded-2xl flex flex-col hover:border-pink-500/50 transition-colors group">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className={`p-3 rounded-xl group-hover:scale-110 transition-transform ${item.config.activeTab === 'story' ? 'bg-pink-500/20 text-pink-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                <i className={`ph-fill ${item.config.activeTab === 'story' ? 'ph-book-open' : 'ph-users'} text-2xl`}></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-500">{new Date(item.createdAt?.toMillis()).toLocaleDateString('pl-PL')}</span>

                                        <h3 className="text-base font-bold text-white mb-2 line-clamp-2">{item.name}</h3>
                                        <p className="text-xs text-slate-400 mb-4">{item.config.params.childAge} • {item.config.activeTab === 'story' ? 'Historyjka Społeczna' : 'Trening TUS'}</p>
                                        <div className="mt-auto pt-4 flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-pink-600 text-white py-2 rounded-xl text-sm font-bold transition-colors">
                                                Wczytaj Materiał

                                        </div>
                                    </div>

                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych scenariuszy w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // GŁÓWNY WIDOK
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>
                    <div className="aura-blob aura-3 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    {isGenerating && (

                                <i className="ph-bold ph-spinner-gap animate-spin text-5xl text-pink-500"></i>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Tworzenie Materiału...</h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-16 md:pl-80 pb-16 px-4 sm:px-6 print:p-0 print:overflow-visible relative z-10">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 print:block">
                            
                            {/* LEWA KOLUMNA: KONFIGURATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                <div className="text-left mb-8 fade-in">
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Niezastąpiona w <br/><span className="text-gradient">Terapii SPE.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Twórz historyjki ułatwiające zrozumienie norm społecznych lub układaj profesjonalne scenariusze zajęć grupowych TUS.
                                    </p>
                                </div>

                                <div className="glass-panel p-4 rounded-2xl border border-slate-700/50 mb-2 print-hidden flex gap-3 items-start">
                                    <span className="text-xl flex-shrink-0">ℹ️</span>
                                    <p className="text-xs text-slate-300 leading-relaxed"><strong className="text-white">Jak to działa:</strong> trzy zakładki poniżej - „Historyjki" napiszą bajkę terapeutyczną z obrazkiem na podstawie trudnej sytuacji dziecka, „TUS" ułoży 30-minutowy plan zajęć na konkretny problem grupy (np. agresję przy przegrywaniu), a „Sensoryka" podpowie 3 ćwiczenia z materiałów, które masz pod ręką.</p>
                                </div>

                                <div className="glass-panel p-2 rounded-2xl flex gap-2 flex-wrap sm:flex-nowrap">
                                    <button onClick={() => setActiveTab('story')} className={`flex-1 py-4 px-2 rounded-xl flex flex-col items-center justify-center font-bold text-[10px] uppercase tracking-widest transition-all duration-300 ${activeTab === 'story' ? 'bg-pink-600 text-white shadow-lg border border-pink-500' : 'text-slate-400 hover:bg-slate-800'}`}>
                                        <i className="ph-bold ph-book-open text-2xl mb-2"></i> Historyjki
                                    </button>
                                    <button onClick={() => setActiveTab('tus')} className={`flex-1 py-4 px-2 rounded-xl flex flex-col items-center justify-center font-bold text-[10px] uppercase tracking-widest transition-all duration-300 ${activeTab === 'tus' ? 'bg-rose-600 text-white shadow-lg border border-rose-500' : 'text-slate-400 hover:bg-slate-800'}`}>
                                        <i className="ph-bold ph-users text-2xl mb-2"></i> TUS
                                    </button>
                                    <button onClick={() => setActiveTab('sensory')} className={`flex-1 py-4 px-2 rounded-xl flex flex-col items-center justify-center font-bold text-[10px] uppercase tracking-widest transition-all duration-300 ${activeTab === 'sensory' ? 'bg-fuchsia-600 text-white shadow-lg border border-fuchsia-500' : 'text-slate-400 hover:bg-slate-800'}`}>
                                        <i className="ph-bold ph-puzzle-piece text-2xl mb-2"></i> Sensoryka
                                    </button>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] border border-slate-700/50">
                                    
                                    {activeTab === 'story' && (
                                        <div className="space-y-4">
                                            <h2 className="font-bold flex items-center text-pink-400 text-sm uppercase tracking-widest border-b border-slate-700/50 pb-4"><i className="ph-bold ph-book-open mr-2 text-lg"></i> Kreator Historyjek Społecznych</h2>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-2">Imię dziecka</label><input type="text" value={params.childName} onChange={e=>setParams({...params, childName: e.target.value})} placeholder="np. Jaś" className="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-pink-500 transition-colors" /></div>
                                                <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-2">Wiek i Płeć</label>
                                                    <div className="flex gap-2">
                                                        <input type="text" value={params.childAge} onChange={e=>setParams({...params, childAge: e.target.value})} className="w-1/2 p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-pink-500 transition-colors" />
                                                        <select value={params.gender} onChange={e=>setParams({...params, gender: e.target.value})} className="w-1/2 p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-pink-500 appearance-none transition-colors"><option value="chłopiec">chłopiec</option><option value="dziewczynka">dziewczynka</option></select>
                                                    </div>
                                                </div>
                                            </div>
                                            <div><label className="text-[10px] font-bold text-slate-400 uppercase block mb-2">Zapalnik (Czego się boi / Co wywołuje złość?)</label><textarea value={params.trigger} onChange={e=>setParams({...params, trigger: e.target.value})} placeholder="np. Bardzo głośny dźwięk dzwonka szkolnego..." className="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-pink-500 h-24 resize-y custom-scrollbar transition-colors" /></div>
                                            <div><label className="text-[10px] font-bold text-pink-400 uppercase block mb-2">Rozwiązanie (Pożądane zachowanie)</label><textarea value={params.solution} onChange={e=>setParams({...params, solution: e.target.value})} placeholder="np. Zakłada słuchawki wyciszające i liczy do dziesięciu..." className="w-full p-4 bg-pink-900/10 border border-pink-500/30 rounded-xl outline-none text-white text-sm focus:border-pink-500 h-24 resize-y custom-scrollbar transition-colors" /></div>
                                        </div>
                                    )}
                                    
                                    {activeTab === 'tus' && (
                                        <div className="space-y-4">
                                            <h2 className="font-bold flex items-center text-rose-400 text-sm uppercase tracking-widest border-b border-slate-700/50 pb-4"><i className="ph-bold ph-users mr-2 text-lg"></i> Scenariusz TUS</h2>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-2">Profil grupy / Wiek</label>
                                                <input type="text" value={params.tusGroup} onChange={e=>setParams({...params, tusGroup: e.target.value})} placeholder="np. Spektrum autyzmu, 6 latki..." className="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-rose-500 transition-colors" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-rose-400 uppercase block mb-2">Cel zajęć (Problem do rozwiązania)</label>
                                                <textarea value={params.tusGoal} onChange={e=>setParams({...params, tusGoal: e.target.value})} placeholder="np. Nauka spokojnego czekania na swoją kolej podczas zabawy zjeżdżalnią..." className="w-full p-4 bg-rose-900/10 border border-rose-500/30 rounded-xl outline-none text-white text-sm focus:border-rose-500 h-32 resize-y custom-scrollbar transition-colors" />
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'sensory' && (
                                        <div className="space-y-4">
                                            <h2 className="font-bold flex items-center text-fuchsia-400 text-sm uppercase tracking-widest border-b border-slate-700/50 pb-4"><i className="ph-bold ph-puzzle-piece mr-2 text-lg"></i> Zabawy Sensoryczne</h2>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase block mb-2">Wiek dziecka</label>
                                                <input type="text" value={params.childAge} onChange={e=>setParams({...params, childAge: e.target.value})} className="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl outline-none text-white text-sm focus:border-fuchsia-500 transition-colors" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-fuchsia-400 uppercase block mb-2">Cel stymulacji</label>
                                                <select value={params.sensoryType} onChange={e=>setParams({...params, sensoryType: e.target.value})} className="w-full p-4 bg-fuchsia-900/10 border border-fuchsia-500/30 rounded-xl outline-none text-white text-sm focus:border-fuchsia-500 appearance-none font-bold transition-colors">
                                                    <option className="bg-slate-900">Wyciszenie (Układ proprioceptywny / czucie głębokie)</option>
                                                    <option className="bg-slate-900">Pobudzenie (Układ przedsionkowy / ruch)</option>
                                                    <option className="bg-slate-900">Oswajanie dotyku (Nadwrażliwość dotykowa)</option>
                                                    <option className="bg-slate-900">Trening węchu i smaku</option>
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        onClick={generateContent} 
                                        disabled={isGenerating} 
                                        className={`w-full mt-6 text-white py-5 rounded-xl font-black text-sm tracking-widest shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95 uppercase disabled:opacity-50 btn-bounce ${activeTab === 'story' ? 'bg-gradient-to-r from-pink-600 to-rose-500' : activeTab === 'tus' ? 'bg-gradient-to-r from-rose-600 to-red-500' : 'bg-gradient-to-r from-fuchsia-600 to-purple-500'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> {generationStep === 'text' ? 'Pisanie (1/2)...' : generationStep === 'image' ? 'Malowanie (2/2)...' : 'Opracowywanie...'}</>
                                        ) : (
                                            <><i className="ph-bold ph-sparkle text-xl"></i> Generuj Materiał</>
                                        )}
                                    </button>
                                </div>

                                <div className="p-5 rounded-3xl shadow-lg border flex items-start gap-4 bg-slate-800/50 border-slate-700">
                                    <div className="w-12 h-12 bg-pink-500 rounded-2xl flex items-center justify-center shrink-0 shadow-lg"><i className="ph-fill ph-brain text-white text-2xl"></i></div>
                                    <div className="flex-1 pt-1">
                                        <h4 className="font-black text-xs uppercase tracking-widest mb-1.5 text-pink-400">Asystent Terapeutyczny</h4>
                                        <p className="text-sm font-medium leading-relaxed text-slate-300">{botMessage}</p>
                                    </div>
                                </div>
                            </div>

                            {/* PRAWA KOLUMNA: WYNIK (KARTKA A4) */}
                            <div className="lg:col-span-7 flex justify-center items-start overflow-x-auto pb-10 print:block print:overflow-visible">
                                {!generatedData ? (
                                    <div className="glass-panel w-full max-w-[210mm] min-h-[297mm] p-8 rounded-[2rem] flex flex-col items-center justify-center text-center space-y-6 print-hidden border-2 border-dashed border-slate-700/50 opacity-50">
                                        <div className="p-6 bg-slate-800/50 rounded-full border border-slate-700"><i className="ph-thin ph-file-text text-6xl text-slate-500"></i></div>
                                        <div>
                                            <h2 className="text-xl font-bold mb-3 text-slate-400">Miejsce na materiały</h2>
                                            <p className="max-w-sm mx-auto text-slate-500 leading-relaxed text-sm">Wypełnij dane po lewej stronie, aby wygenerować profesjonalne, gotowe do wydruku materiały dla dzieci.</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="w-full max-w-[210mm] print:max-w-full relative fade-in">
                                        <div className="flex justify-end gap-3 mb-6 print-hidden bg-slate-900/50 p-2 rounded-2xl border border-slate-800 backdrop-blur-md sticky top-24 z-20">
                                            <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                                <i className="ph-bold ph-globe text-lg"></i> Na Giełdę
                                            </button>
                                            <button onClick={exportToWord} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm shadow-lg btn-bounce"><i className="ph-bold ph-file-doc text-lg"></i> .DOCX</button>
                                            <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all text-sm btn-bounce"><i className="ph-bold ph-printer text-lg"></i> Wydruk</button>
                                        </div>

                                        <div id="print-container" className="bg-white shadow-2xl p-10 md:p-14 rounded-sm min-h-[297mm] text-slate-900">
                                            <div id="document-render-area" className={generatedData.type === 'story' ? 'story-font' : 'tus-font'}>
                                                <h1 className="text-2xl md:text-3xl font-black text-center uppercase mb-8 text-pink-700">{generatedData.title}</h1>
                                                
                                                {generatedData.type === 'story' && generatedData.image && (
                                                    <div className="w-full mb-8 flex justify-center page-break-inside-avoid">
                                                        <img src={generatedData.image} className="w-full max-w-md rounded-2xl shadow-lg border-4 border-pink-100 object-cover aspect-square" alt="Ilustracja do historyjki" />
                                                    </div>
                                                )}

                                                <div className="text-base markdown-body text-slate-800" dangerouslySetInnerHTML={{ __html: generatedData.content }} />
                                                
                                                {generatedData.type === 'story' && (
                                                    <div className="mt-16 text-center text-sm font-bold text-slate-400 print-hidden border-t border-slate-200 pt-4">
                                                        Wskazówka: Czytaj tę historyjkę dziecku regularnie w spokojnych momentach, aby utrwalić nowe, pozytywne schematy zachowania.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
