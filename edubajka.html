    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseAIResponse = (aiOutput) => {
            let text = String(aiOutput?.text || aiOutput?.response || aiOutput?.content || aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    return JSON.parse(jsonStr.replace(/,\s*([\]}])/g, '$1'));
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON.\n\n${systemInstruction}\n\nZADANIE:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.content || data;
                } else {
                    throw new Error(`Błąd API Text`);
                }
            } catch(e) { throw new Error("Brak połączenia z AI. " + e.message); }
        };

        const fetchImageAI = async (imagePrompt) => {
            try {
                const res = await fetch('/api/malarz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `${imagePrompt}. Beautiful cute 3D Pixar Disney style illustration for a children's fairy tale book, 8k resolution, highly detailed, vivid colors, emotional, masterpiece, magical lighting.`, 
                        style: 'disney', 
                        format: 'kwadrat', 
                        customText: '' 
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.url;
                }
                return null;
            } catch (e) { return null; }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [viewMode, setViewMode] = useState('generator'); // 'generator' | 'biblioteka'
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [genStatus, setGenStatus] = useState(''); 
            const [resultData, setResultData] = useState(null);

            // Formularz
            const [childName, setChildName] = useState('');
            const [problem, setProblem] = useState('Boi się ciemności i potworów w pokoju');
            const [theme, setTheme] = useState('Kosmos i ufoludki');
            const [gender, setGender] = useState('Chłopiec');

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore && window.EduBoxCore.init) {
                        window.EduBoxCore.init((u) => setUser(u));
                    } else { setTimeout(initDb, 100); }
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_edubajka_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    const sharedPro = window.localStorage.getItem('eduboxProStatus') === 'active' || window.localStorage.getItem('eduAwansPremium') === 'active';
                    if (savedPremium === 'unlocked' || sharedPro) setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 4000);
            };

            useEffect(() => {
                if (viewMode !== 'biblioteka' || !window.EduBoxCore || !window.EduBoxCore.subscribeToGielda) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_edubajka', setLibraryItems, (e) => console.error(e));
                return () => unsubscribe && unsubscribe();
            }, [viewMode]);

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showMessage("Zanim udostępnisz, podaj krótki tytuł!", 'error');
                if (!resultData) return showMessage("Najpierw wygeneruj bajkę!", 'error');
                setIsPublishing(true);
                try {
                    await window.EduBoxCore.saveToGielda('gielda_wzorow_edubajka', 'EduBajka', publishTitle, { resultData });
                    showMessage("✨ Bajka opublikowana w Bibliotece!", 'success');
                    setShowPublishModal(false);
                    setPublishTitle('');
                } catch (e) {
                    showMessage(e.message || "Błąd podczas publikacji.", 'error');
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadFromLibrary = (item) => {
                if (item.config && item.config.resultData) {
                    setResultData(item.config.resultData);
                    setViewMode('generator');
                    showMessage("✨ Wczytano bajkę z Biblioteki!", 'success');
                }
            };

            const handlePremiumCheck = async () => {
                const __res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: premiumCode })
                });
                const __data = await __res.json();
                if (__data.valid) {
                    setIsPremium(true);
                    try {
                        if (__data.bonus === true && __data.until) {
                            window.localStorage.setItem('eduboxBonusUntil', __data.until);
                            window.localStorage.setItem('eduboxProStatus', 'active');
                        } else {
                            window.localStorage.setItem('edubox_premium', 'unlocked');
                        }
                    } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { showMessage('Nieprawidłowy kod', 'error'); }
            };

            const generateStory = async () => {
                const imgProStatus = localStorage.getItem('eduboxProStatus');
                const imgIsPro = imgProStatus === 'active' || isPremium;
                if (!imgIsPro) {
                    const todayImg = new Date().toISOString().split('T')[0];
                    let imgUsage = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                    const imgCount = (imgUsage.date === todayImg) ? imgUsage.count : 0;
                    if (imgCount >= 2) { showMessage('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący!', 'error'); return; }
                }
                if (!problem.trim() || !theme.trim()) { showMessage('Uzupełnij formularz!', 'error'); return; }
                
                setIsGenerating(true);
                setResultData(null);

                const sysPrompt = `Jesteś wybitnym bajkoterapeutą i autorem bajek dla dzieci.
Twoim zadaniem jest napisanie 3-stronicowej bajki terapeutycznej pomagającej dziecku poradzić sobie ze zgłoszonym problemem.
Główny bohater nosi imię podane przez użytkownika (lub jest to anonimowe dziecko). Bajka ma mieć piękny, poetycki, ale zrozumiały język, zawierać metaforę problemu i pokazać jak bohater go pokonuje.

Dla okładki oraz dla KAŻDEJ Z 3 STRON musisz wygenerować angielski 'image_prompt', opisujący to, co dzieje się w danej scenie. Opis obrazka ma być szczegółowy (dla generatora AI).

ZWRÓĆ DOKŁADNIE TEN JSON:
{
  "title": "Magiczny tytuł bajki",
  "cover_prompt": "English prompt for the book cover illustration, cute 3d pixar style",
  "pages": [
    { "text": "Tekst pierwszej strony (wprowadzenie do świata i bohatera)...", "image_prompt": "English prompt for scene 1..." },
    { "text": "Tekst drugiej strony (moment zwrotny i problem)...", "image_prompt": "English prompt for scene 2..." },
    { "text": "Tekst trzeciej strony (rozwiązanie i morał)...", "image_prompt": "English prompt for scene 3..." }
  ]
}`;
                const prompt = `Imię bohatera: ${childName || (gender === 'Chłopiec' ? 'Chłopiec' : 'Dziewczynka')}. 
Płeć: ${gender}. 
Ulubiony motyw/świat: ${theme}. 
Problem dziecka do rozwiązania (terapeutyczny): ${problem}. 
Napisz piękną historię.`;

                try {
                    setGenStatus('Krok 1: Pisanie terapeutycznej historii (Psycholog AI)...');
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setGenStatus('Krok 2: Malowanie okładki książki (Pixar 3D Studio)...');
                    parsedJson.coverUrl = await fetchImageAI(parsedJson.cover_prompt);

                    setGenStatus('Krok 3: Rysowanie ilustracji do poszczególnych stron (Ok. 30-40 sekund)...');
                    const pagesWithImages = await Promise.all(
                        parsedJson.pages.map(async (page, index) => {
                            setGenStatus(`Krok 3: Rysowanie ilustracji do strony ${index + 1}/3...`);
                            const imgUrl = await fetchImageAI(page.image_prompt);
                            return { ...page, imgUrl: imgUrl || 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=400&auto=format&fit=crop' }; 
                        })
                    );
                    
                    parsedJson.pages = pagesWithImages;

                    setResultData(parsedJson);
                    
                    if (!imgIsPro) {
                        try {
                            const today = new Date().toISOString().split('T')[0];
                            let imgUsage = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                            const newImgCount = (imgUsage.date === today ? imgUsage.count : 0) + 1;
                            window.localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                        } catch(e) {}
                    }
                    showMessage('Gotowe do druku!', 'success');
                } catch (error) { 
                    showMessage(error.message, 'error'); 
                } finally { 
                    setIsGenerating(false); 
                    setGenStatus('');
                }
            };

            return (
                <div className="flex h-screen w-full stars-bg text-slate-200 overflow-hidden relative selection:bg-purple-500/30">

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'} no-print`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    <aside className="w-[360px] flex-shrink-0 bg-slate-900/90 backdrop-blur-xl border-r border-slate-800 flex flex-col h-full z-10 no-print transition-all duration-300 shadow-2xl">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-12 h-12 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-purple-500/20">
                                <i className="ph-bold ph-book-bookmark text-white text-2xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-magic font-normal tracking-wide text-white leading-none">EduBajka PRO</h1>
                                <p className="text-[10px] text-purple-400 font-bold tracking-wider uppercase mt-1">Biblioteczka Terapeutyczna</p>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-6">
                            
                            <div className="bg-purple-500/10 border border-purple-500/20 p-4 rounded-2xl">
                                <p className="text-xs text-purple-300 leading-relaxed font-medium">
                                    <i className="ph-fill ph-magic-wand text-purple-400 mr-1 text-lg align-middle"></i>
                                    Zaprojektuj dedykowaną, ilustrowaną bajkę, która pomoże dziecku uporać się z jego konkretnym lękiem lub problemem.
                                </p>
                            </div>

                            <div className="space-y-4 bg-slate-800/50 border border-slate-700 rounded-2xl p-5 shadow-inner">
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Imię bohatera (Opcjonalnie)</label>
                                    <input 
                                        type="text" 
                                        value={childName} 
                                        onChange={e => setChildName(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-purple-500 outline-none transition-colors" 
                                        placeholder="np. Antoś, Zosia..." 
                                    />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Płeć bohatera</label>
                                    <select value={gender} onChange={e => setGender(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-purple-500 outline-none">
                                        <option>Chłopiec</option>
                                        <option>Dziewczynka</option>
                                    </select>
                                </div>

                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Ulubiony Motyw (Świat)</label>
                                    <input 
                                        type="text" 
                                        value={theme} 
                                        onChange={e => setTheme(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-purple-500 outline-none transition-colors" 
                                        placeholder="np. Dinozaury, Jednorożce, Pociągi..." 
                                    />
                                </div>

                                <div className="space-y-1.5 pt-2">
                                    <label className="text-[10px] font-bold text-rose-400 uppercase flex items-center gap-1"><i className="ph-bold ph-heart-break"></i> Problem do przepracowania</label>
                                    <textarea 
                                        value={problem} 
                                        onChange={e => setProblem(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-purple-500 outline-none transition-colors h-24 resize-none" 
                                        placeholder="np. Boi się burzy, nie potrafi przegrywać w gry, uderzył kolegę w złości..." 
                                    />
                                </div>
                            </div>

                            <button onClick={generateStory} disabled={isGenerating} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-50 min-h-[70px]">
                                {isGenerating ? (
                                    <><i className="ph-bold ph-spinner animate-spin text-xl mb-1"></i><span className="text-[10px] text-purple-200 uppercase tracking-widest">{genStatus}</span></>
                                ) : (
                                    <span className="flex items-center gap-2"><i className="ph-bold ph-book-open text-xl"></i> Pisz i Ilustruj Książkę</span>
                                )}
                            </button>
                        </div>

                        <div className="p-4 border-t border-slate-800 bg-slate-950/80">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded-full">{2 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-purple-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-purple-500/10 to-indigo-500/10 border border-purple-500/30 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-purple-400"></i>
                                    <div><p className="text-xs font-bold text-white">Wersja PRO MAX</p><p className="text-[9px] text-purple-300">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden no-print">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 relative flex justify-center">
                            
                            {!resultData && !isGenerating && (
                                <div className="text-center text-slate-500 max-w-md mx-auto my-auto">
                                    <i className="ph-fill ph-magic-wand text-7xl mb-6 text-purple-900/50 animate-pulse"></i>
                                    <h2 className="text-2xl font-magic text-purple-300 mb-4">Warsztat Bajkopisarza</h2>
                                    <p className="text-sm font-medium leading-relaxed">Stwórz własną, bogato ilustrowaną książeczkę w 45 sekund. Idealne narzędzie do biblioteczki przedszkolnej i gabinetu psychologa.</p>
                                </div>
                            )}

                            {isGenerating && (
                                <div className="text-center text-purple-300 max-w-md mx-auto my-auto flex flex-col items-center">
                                    <div className="relative w-32 h-32 mb-6">
                                        <div className="absolute inset-0 border-4 border-purple-500/20 rounded-full"></div>
                                        <div className="absolute inset-0 border-4 border-purple-500 rounded-full border-t-transparent animate-spin"></div>
                                        <i className="ph-fill ph-palette absolute inset-0 flex items-center justify-center text-4xl text-purple-400 animate-pulse"></i>
                                    </div>
                                    <h2 className="text-xl font-bold mb-2 font-story">Drukowanie magicznych stron...</h2>
                                    <p className="text-sm opacity-80">{genStatus}</p>
                                    <p className="text-xs text-purple-400/50 mt-4">(Ten proces wymaga wygenerowania 4 grafik wysokiej rozdzielczości. Proszę o cierpliwość)</p>
                                </div>
                            )}

                            {resultData && !isGenerating && (
                                <div className="space-y-12 w-full max-w-3xl pb-24 animate-[reveal_0.4s_ease-out]">
                                    
                                    <div className="bg-slate-800/50 border border-purple-500/30 rounded-2xl p-6 flex items-center justify-between shadow-xl backdrop-blur-sm">
                                        <div>
                                            <h3 className="text-lg font-bold text-white">Twój plik PDF jest gotowy!</h3>
                                            <p className="text-xs text-slate-400">Książeczka jest sformatowana do wydruku jako dwustronne A4 (każda strona bajki zajmie jedną kartkę).</p>
                                        </div>
                                        <button onClick={() => window.print()} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.4)] transition-all flex items-center gap-2">
                                            <i className="ph-bold ph-printer text-xl"></i> Wydrukuj Bajkę
                                        </button>
                                        <button onClick={() => setShowPublishModal(true)} className="bg-slate-700 hover:bg-slate-600 border border-purple-400/40 text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center gap-2">
                                            <i className="ph-bold ph-share-network text-xl"></i> Udostępnij w Bibliotece
                                        </button>
                                    </div>

                                    {/* STRONA 1: OKŁADKA */}
                                    <div className="story-page bg-white text-center shadow-2xl relative overflow-hidden group">
                                        <div className="absolute inset-0 border-[15px] border-double border-purple-100/50 pointer-events-none z-10"></div>
                                        <div className="w-full h-[60%] bg-slate-100 rounded-b-[4rem] overflow-hidden mb-8 shadow-inner relative">
                                            <img src={resultData.coverUrl} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000" alt="Okładka" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/50 to-transparent"></div>
                                        </div>
                                        <div className="px-12 flex-1 flex flex-col items-center justify-center">
                                            <p className="text-sm font-bold text-purple-600 uppercase tracking-[0.3em] mb-4">Biblioteczka Terapeutyczna</p>
                                            <h1 className="text-4xl md:text-5xl font-magic font-normal text-slate-800 leading-tight mb-8">{resultData.title}</h1>
                                            <div className="w-16 h-1 bg-purple-200 rounded-full"></div>
                                        </div>
                                    </div>

                                    {/* STRONY BAJKI */}
                                    {resultData.pages.map((page, index) => (
                                        <div key={index} className="story-page bg-white shadow-2xl relative overflow-hidden">
                                            <div className="w-full h-[50%] bg-slate-100 rounded-[2rem] overflow-hidden mb-10 shadow-md relative">
                                                <img src={page.imgUrl} className="w-full h-full object-cover" alt={`Scena ${index+1}`} />
                                            </div>
                                            <div className="px-8 md:px-16 flex-1 flex flex-col justify-start w-full">
                                                <div className="flex items-center gap-4 mb-6">
                                                    <span className="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-lg shrink-0">{index+1}</span>
                                                    <div className="h-px bg-slate-200 flex-1"></div>
                                                </div>
                                                <p className="font-story text-xl md:text-2xl text-slate-700 leading-[1.8] text-justify drop-shadow-sm">
                                                    {page.text}
                                                </p>
                                            </div>
                                        </div>
                                    ))}

                                    <div className="story-page bg-white flex flex-col items-center justify-center text-center shadow-2xl relative">
                                        <i className="ph-fill ph-heart text-6xl text-rose-500 mb-6"></i>
                                        <h2 className="text-3xl font-magic text-slate-800 mb-4">Koniec</h2>
                                        <p className="font-story text-slate-500">Bajka stworzona specjalnie dla Ciebie.</p>
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>

                    {/* Dedykowany widok druku */}
                    <div className="print-only w-full">
                        {resultData && (
                            <div className="w-full bg-white">
                                {/* OKŁADKA */}
                                <div className="story-page text-center">
                                    <div className="absolute inset-0 border-[15px] border-double border-purple-100/50 pointer-events-none z-10"></div>
                                    <div className="w-full h-[60%] bg-slate-100 rounded-b-[4rem] overflow-hidden mb-8 shadow-inner">
                                        <img src={resultData.coverUrl} className="w-full h-full object-cover" />
                                    </div>
                                    <div className="px-12 flex-1 flex flex-col items-center justify-center">
                                        <p className="text-sm font-bold text-purple-600 uppercase tracking-[0.3em] mb-4">Biblioteczka Terapeutyczna</p>
                                        <h1 className="text-5xl font-magic font-normal text-slate-800 leading-tight mb-8">{resultData.title}</h1>
                                        <div className="w-16 h-1 bg-purple-200 rounded-full"></div>
                                    </div>
                                </div>

                                {/* STRONY */}
                                {resultData.pages.map((page, index) => (
                                    <div key={index} className="story-page">
                                        <div className="w-full h-[55%] bg-slate-100 rounded-[2rem] overflow-hidden mb-10 shadow-md">
                                            <img src={page.imgUrl} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="px-12 flex-1 flex flex-col justify-start w-full">
                                            <div className="flex items-center gap-4 mb-6">
                                                <span className="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-lg shrink-0">{index+1}</span>
                                                <div className="h-px bg-slate-200 flex-1"></div>
                                            </div>
                                            <p className="font-story text-2xl text-slate-700 leading-[1.8] text-justify">
                                                {page.text}
                                            </p>
                                        </div>
                                    </div>
                                ))}

                                {/* ZAKOŃCZENIE */}
                                <div className="story-page flex flex-col items-center justify-center text-center">
                                    <div className="w-24 h-24 mb-6 rounded-full bg-rose-50 flex items-center justify-center"><i className="ph-fill ph-heart text-5xl text-rose-500"></i></div>
                                    <h2 className="text-4xl font-magic text-slate-800 mb-4">Koniec</h2>
                                    <p className="font-story text-xl text-slate-500">Bajka stworzona specjalnie dla Ciebie.</p>
                                </div>
                            </div>
                        )}
                    </div>

                {/* PRZYCISK BIBLIOTEKI */}
                <button onClick={() => setViewMode('biblioteka')} className="no-print fixed top-20 right-4 sm:right-6 z-40 bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_0_25px_rgba(168,85,247,0.6)] flex items-center gap-2 hover:scale-105 transition-all animate-pulse">
                    <i className="ph-bold ph-books"></i> Biblioteka Bajek
                </button>

                {/* MODAL PUBLIKACJI */}
                {showPublishModal && (
                    <div className="no-print fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm">
                        <div className="bg-slate-900 border border-purple-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                            <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                            <h3 className="text-2xl font-black text-purple-400 mb-2 flex items-center gap-2"><i className="ph-bold ph-share-network"></i> Udostępnij bajkę</h3>
                            <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-xs font-bold mb-4">
                                ⚠️ Upewnij się, że bajka nie zawiera prawdziwego imienia dziecka, zanim ją opublikujesz!
                            </div>
                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Krótki tytuł</label>
                            <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Bajka o strachu przed ciemnością" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-purple-500" />
                            <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2">
                                {isPublishing ? 'Publikowanie...' : 'Opublikuj w Bibliotece'}
                            </button>
                        </div>
                    </div>
                )}

                {/* NAKŁADKA BIBLIOTEKI */}
                {viewMode === 'biblioteka' && (
                    <div className="no-print fixed inset-0 z-[140] bg-slate-950/95 backdrop-blur-sm overflow-y-auto">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10">
                            <div className="flex items-center justify-between mb-8">
                                <h2 className="text-3xl font-black text-white">Biblioteka Bajek Nauczycieli</h2>
                                <button onClick={() => setViewMode('generator')} className="text-slate-400 hover:text-white flex items-center gap-2 text-sm font-bold">
                                    <i className="ph-bold ph-x text-xl"></i> Zamknij
                                </button>
                            </div>
                            {libraryItems.length === 0 ? (
                                <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700">
                                    <i className="ph-duotone ph-books text-6xl mb-4 text-slate-400"></i>
                                    <h3 className="text-xl font-bold text-white mb-2">Biblioteka jest jeszcze pusta...</h3>
                                    <p className="text-slate-400">Wygeneruj bajkę i opublikuj ją jako pierwszą!</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {libraryItems.map((item) => (
                                        <div key={item.id} className="glass-panel rounded-2xl p-6 border border-purple-500/20 hover:border-purple-500/50 transition-all shadow-lg flex flex-col">
                                            <h3 className="text-lg font-bold text-white mb-4">{item.name}</h3>
                                            <button onClick={() => loadFromLibrary(item)} className="mt-auto bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm">
                                                <i className="ph-bold ph-download-simple"></i> Wczytaj bajkę
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
