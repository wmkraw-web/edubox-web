    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
                import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        const DAILY_LIMIT = 5;

        // INICJALIZACJA BAZY DANYCH CHMUROWEJ
        let app, db, appId;
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } catch (e) {
            console.warn("Brak konfiguracji Firebase.");
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Library: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></>,
                Share: <><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></>,
                Sparkles: <path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z"/>,
                Printer: <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.Sparkles}</svg>;
        };

        function App() {
            // State
            const [user, setUser] = useState(null);
            const [isPro, setIsPro] = useState(() => {
                return localStorage.getItem('eduboxProStatus') === 'active' || localStorage.getItem('eduAwansPremium') === 'active';
            });
            const [limitData, setLimitData] = useState({ remaining: DAILY_LIMIT, showWarning: false });

            const [viewMode, setViewMode] = useState('kreator'); // kreator | biblioteka
            const [toastMessage, setToastMessage] = useState('');

            // Config
            const [topic, setTopic] = useState('');
            const [ageGroup, setAgeGroup] = useState('Klasy 4-8');
            const [artStyle, setArtStyle] = useState('Nowoczesny Wektor'); 
            
            const [step, setStep] = useState('config'); // config, generating, review
            const [gazetkaData, setGazetkaData] = useState(null);
            const [loadingStatus, setLoadingStatus] = useState('');
            const [loadingProgress, setLoadingProgress] = useState(0);

            const [printFormat, setPrintFormat] = useState('A4');
            const [regeneratingIndex, setRegeneratingIndex] = useState(null);

            // Biblioteka
            const [libraryItems, setLibraryItems] = useState([]);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [publishTitle, setPublishTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            // --- LOGOWANIE (wspólny silnik) ---
            useEffect(() => {
                EduBoxCore.init((u) => setUser(u));
            }, []);

            // --- FETCH LIBRARY ---
            useEffect(() => {
                if (!user || !db) return;
                const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugazetka_sets');
                const unsubscribe = onSnapshot(libRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setLibraryItems(items);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) {
                    localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: 0 }));
                    setLimitData({ remaining: DAILY_LIMIT, showWarning: false });
                } else {
                    setLimitData({ remaining: Math.max(0, DAILY_LIMIT - usage.count), showWarning: usage.count >= DAILY_LIMIT });
                }
            }, []);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 4000); };

            const updateAndCheckLimit = () => {
                if (isPro) return true;
                const today = new Date().toISOString().split('T')[0];
                let usage = JSON.parse(localStorage.getItem('eduboxUsage')) || { date: today, count: 0 };
                if (usage.date !== today) usage = { date: today, count: 0 };
                
                if (usage.count >= DAILY_LIMIT) {
                    setLimitData({ remaining: 0, showWarning: true });
                    return false;
                }
                usage.count += 1;
                localStorage.setItem('eduboxUsage', JSON.stringify(usage));
                setLimitData({ remaining: DAILY_LIMIT - usage.count, showWarning: false });
                if(typeof window.updateGlobalLimitDisplay === 'function') window.updateGlobalLimitDisplay();
                return true;
            };

            const translateStyle = (styleName) => {
                switch(styleName) {
                    case 'Nowoczesny Wektor': return 'flat vector illustration, modern colorful school poster, clean design, vibrant';
                    case 'Akwarela': return 'beautiful watercolor painting, artistic, soft edges, vibrant, aesthetic';
                    case 'Magiczne 3D': return 'cute 3D Pixar Disney style render, unreal engine 5, detailed, joyful';
                    case 'Kredki / Szkic': return 'hand drawn crayon style, cute children book illustration, textured';
                    default: return 'high quality illustration';
                }
            };

            // ETAP 1 & 2: GENEROWANIE ŁAŃCUCHOWE
            const generateGazetka = async () => {
                if (!topic.trim()) return showToast('Wpisz temat gazetki!');
                const imgProStatus = localStorage.getItem('eduboxProStatus');
                const imgIsPro = imgProStatus === 'PRO' || imgProStatus === 'active' || isPro;
                if (!imgIsPro) {
                    const todayImg = new Date().toISOString().split('T')[0];
                    let imgUsage = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                    const imgCount = (imgUsage.date === todayImg) ? imgUsage.count : 0;
                    if (imgCount >= 2) { showToast('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący!'); return; }
                }
                if (!updateAndCheckLimit()) return;

                setStep('generating');
                setLoadingStatus('1/2 Wymyślam hasła i ciekawostki...');
                setLoadingProgress(10);
                
                try {
                    // 1. TEKSTY Z GPT
                    const systemPrompt = `Jesteś kreatywnym nauczycielem przygotowującym materiały na szkolną gazetkę ścienną (tablicę korkową).
                    Zwróć WYŁĄCZNIE poprawny JSON:
                    {
                        "title": "CHWYTLIWY TYTUŁ (np. 'DZIEŃ RODZINY', 'KOSMOS', 'ZDROWE CIAŁO'). Zostanie on wydrukowany w formie wielkich liter.",
                        "posters": [
                            {
                                "fact": "Ciekawostka / Edukacyjny fakt po POLSKU (2-3 zdania).",
                                "imagePrompt": "Szczegółowy opis obrazka po ANGIELSKU dla AI (co ma na nim być). WAŻNE: ABSOLUTELY NO TEXT, NO WORDS, NO LETTERS. Tylko wizualia."
                            },
                            ... (dokładnie 4 takie obiekty)
                        ]
                    }`;

                    const userPrompt = `Temat główny: ${topic}. Wiek odbiorców: ${ageGroup}.`;

                    if (window.location.protocol === 'file:' || window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        throw new Error("TestLocal");
                    }

                    const resChat = await fetch('/api/chat', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.7, model: "gpt-4o-mini" })
                    });
                    
                    if (!resChat.ok) throw new Error("Błąd podczas tworzenia scenariusza");
                    const dataChat = await resChat.json();
                    
                    let cleanText = dataChat.text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    if(jsonStr.indexOf('{') !== -1) jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                    let gazetkaObj = JSON.parse(jsonStr);

                    // 2. GENEROWANIE OBRAZÓW
                    setLoadingStatus('2/2 Maluję plakaty do Twojej gazetki...');
                    const engStyle = translateStyle(artStyle);
                    
                    for (let i = 0; i < gazetkaObj.posters.length; i++) {
                        setLoadingProgress(25 + (i * 18));
                        
                        const fullPrompt = `${gazetkaObj.posters[i].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS, NO WATERMARK.`;

                        try {
                            const responseImg = await fetch('/api/generate', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    prompt: fullPrompt,
                                    negative_prompt: "text, words, letters, watermark, mutated, bad anatomy",
                                    aspect_ratio: '1:1',
                                    size: '1024x1024'
                                })
                            });
                            
                            if (responseImg.ok) {
                                const dataImg = await responseImg.json();
                                let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                                if (imgUrl) {
                                    if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                        imgUrl = `data:image/png;base64,${imgUrl}`;
                                    }
                                    gazetkaObj.posters[i].imageUrl = imgUrl;
                                }
                            }
                        } catch(e) {
                            console.error("Błąd obrazka", e);
                        }
                    }

                    setGazetkaData(gazetkaObj);
                    setLoadingProgress(100);
                    if (!imgIsPro) {
                        const todayImg2 = new Date().toISOString().split('T')[0];
                        let imgUsage2 = JSON.parse(localStorage.getItem('eduboxImageUsage') || '{}');
                        const newImgCount = (imgUsage2.date === todayImg2 ? imgUsage2.count : 0) + 1;
                        localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: todayImg2, count: newImgCount }));
                    }
                    setTimeout(() => setStep('review'), 500);

                } catch (error) {
                    if (error.message === "TestLocal") {
                        setTimeout(() => {
                            setGazetkaData({
                                title: "WIOSNA",
                                posters: [
                                    { fact: "Wiosna to czas budzenia się przyrody do życia.", imageUrl: null },
                                    { fact: "Ptaki wracają z ciepłych krajów.", imageUrl: null },
                                    { fact: "Na drzewach pojawiają się pierwsze pąki.", imageUrl: null },
                                    { fact: "Dni stają się coraz dłuższe i cieplejsze.", imageUrl: null }
                                ]
                            });
                            setStep('review');
                        }, 1000);
                    } else {
                        console.error("Błąd generatora:", error);
                        showToast('Wystąpił błąd! Serwery są przeciążone. Spróbuj ponownie.');
                        setStep('config');
                    }
                }
            };

            // REGENERACJA JEDNEGO PLAKATU
            const regeneratePoster = async (index) => {
                if (regeneratingIndex !== null) return; 
                setRegeneratingIndex(index);
                showToast("Odświeżam obrazek dla tego plakatu...");
                
                try {
                    const engStyle = translateStyle(artStyle);
                    const fullPrompt = `${gazetkaData.posters[index].imagePrompt}. STYLE: ${engStyle}. High quality masterpiece. ABSOLUTELY NO TEXT, NO WORDS.`;

                    const responseImg = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: fullPrompt,
                            negative_prompt: "text, words, speech bubbles, watermark, mutated, bad anatomy",
                            aspect_ratio: '1:1',
                            size: '1024x1024'
                        })
                    });
                    
                    if (responseImg.ok) {
                        const dataImg = await responseImg.json();
                        let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                        if (imgUrl) {
                            if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                imgUrl = `data:image/png;base64,${imgUrl}`;
                            }
                            const newData = {...gazetkaData};
                            newData.posters[index].imageUrl = imgUrl;
                            setGazetkaData(newData);
                            showToast("Gotowe! Mamy nowy rysunek.");
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Błąd przy odświeżaniu. Spróbuj jeszcze raz.");
                } finally {
                    setRegeneratingIndex(null);
                }
            };

            const handlePublishToLibrary = async () => {
                if (!publishTitle.trim()) return showToast("Zanim udostępnisz, podaj tytuł gazetki!");
                setIsPublishing(true);
                try {
                    if (db && user) {
                        const libRef = collection(db, 'artifacts', appId, 'public', 'data', 'edugazetka_sets');
                        await addDoc(libRef, {
                            title: publishTitle,
                            gazetkaData: gazetkaData,
                            topic: topic,
                            artStyle: artStyle,
                            createdAt: serverTimestamp(),
                            userId: user.uid
                        });
                    }
                    showToast("🎉 Opublikowano w Giełdzie!");
                    setShowPublishModal(false);
                    setPublishTitle('');
                    setStep('config');
                    setViewMode('biblioteka');
                } catch(e) {
                    showToast("Wystąpił błąd podczas publikacji.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const loadSetFromLibrary = (dataObj) => {
                setGazetkaData(dataObj);
                setViewMode('kreator');
                setStep('review');
                showToast("✅ Pomyślnie załadowano Gazetkę z Giełdy!");
                window.scrollTo(0,0);
            };

            // RENDER: Giełda
            if (viewMode === 'biblioteka' && step === 'config') {
                return (
                    <div className="min-h-screen flex flex-col font-sans relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-teal-500 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="w-full mx-auto px-4 pt-8 pb-4 print-hidden flex justify-center">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Sparkles" size={16} /> Kreator Plakatów
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-emerald-500 text-slate-900 shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Giełda Gazetek
                                </button>
                            </div>
                        </div>

                        <div className="w-full flex-1 overflow-y-auto custom-scrollbar p-6 animate-fade-in print-hidden">
                            <div className="text-center max-w-3xl mx-auto mb-10">
                                <h2 className="text-3xl font-black text-teal-400 mb-2">Giełda Gazetek Szkolnych</h2>
                                <p className="text-slate-400">Pobieraj gotowe plakaty i ciekawostki wygenerowane przez innych nauczycieli. Skróć czas projektowania dekoracji do zera!</p>
                            </div>
                            
                            {libraryItems.length === 0 ? (
                                <div className="glass-panel p-10 text-center rounded-[2rem] border-slate-700 w-full max-w-4xl mx-auto">
                                    <div className="text-5xl mb-4">📌</div>
                                    <h3 className="text-xl font-bold text-white mb-2">Baza jest pusta...</h3>
                                    <p className="text-slate-400">Wygeneruj gazetkę i dodaj ją do Giełdy jako pierwszą.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto pb-10">
                                    {libraryItems.map((item) => (
                                        <div key={item.id} className="glass-panel rounded-2xl p-6 border transition-all hover:-translate-y-1 shadow-lg bg-slate-800/30 flex flex-col border-teal-500/30 hover:border-teal-500/60 relative overflow-hidden">
                                            
                                            <div className="flex justify-between items-start mb-3 flex-wrap gap-2 relative z-10">
                                                <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-emerald-500/20 text-emerald-400">
                                                    {item.topic}
                                                </span>
                                                <span className="text-[10px] font-black uppercase px-2 py-1 rounded-md bg-slate-700 text-slate-300">
                                                    {item.artStyle}
                                                </span>
                                            </div>
                                            
                                            <h3 className="text-lg font-bold text-white mb-4 leading-tight relative z-10">{item.title}</h3>
                                            
                                            <div className="w-full aspect-video bg-slate-900 rounded-xl mb-4 overflow-hidden relative border border-slate-700">
                                                {item.gazetkaData?.posters?.[0]?.imageUrl ? (
                                                    <img src={item.gazetkaData.posters[0].imageUrl} className="w-full h-full object-cover opacity-60 hover:opacity-100 transition-opacity" alt="Preview"/>
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center text-slate-600 text-xs font-bold">Brak podglądu</div>
                                                )}
                                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                    <span className="bg-slate-900/80 text-white text-xs font-black uppercase px-3 py-1 rounded-lg backdrop-blur-sm border border-slate-700">Podgląd z 4 plakatów</span>
                                                </div>
                                            </div>
                                            
                                            <div className="pt-2 mt-auto relative z-10">
                                                <button onClick={() => loadSetFromLibrary(item.gazetkaData)} className="w-full bg-teal-600 hover:bg-teal-500 rounded-xl text-white py-3 transition-colors text-sm font-bold flex items-center justify-center gap-2 btn-bounce shadow-md">
                                                    Użyj tego wzoru
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                )
            }

            // RENDER: Konfigurator
            if (step === 'config') {
                return (
                    <div className="min-h-screen flex flex-col font-sans relative">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-teal-500 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300">
                                {toastMessage}
                            </div>
                        )}

                        <div className="w-full mx-auto px-4 pt-8 pb-4 print-hidden flex justify-center z-10">
                            <div className="flex bg-slate-900/80 p-1.5 rounded-full border border-slate-700/50 shadow-lg">
                                <button onClick={() => setViewMode('kreator')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 ${viewMode === 'kreator' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Sparkles" size={16} /> Kreator Plakatów
                                </button>
                                <button onClick={() => setViewMode('biblioteka')} className={`px-6 py-2.5 text-sm font-bold rounded-full transition-all flex items-center gap-2 relative ${viewMode === 'biblioteka' ? 'bg-emerald-500 text-slate-900 shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Library" size={16} /> Giełda Gazetek
                                </button>
                            </div>
                        </div>

                        <div className="max-w-4xl mx-auto px-4 pt-8 pb-24 flex-grow w-full relative z-10">
                            
                            <div className="text-center mb-12">
                                <div className="inline-block bg-teal-900/30 border border-teal-500/30 text-teal-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest uppercase mb-4">Wystawy Szkolne AI</div>
                                <h1 className="text-4xl md:text-6xl font-display font-bold text-white mb-6">Wystrój klasy <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400">w 30 sekund</span></h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">Wpisz temat, a system wygeneruje wielkie litery tytułowe do wycięcia oraz 4 piękne plakaty z ciekawostkami na tablicę korkową.</p>
                            </div>

                            {limitData.showWarning && !isPro && (
                                <div className="bg-red-900/40 border border-red-500/50 rounded-2xl p-6 text-center shadow-lg mb-8 fade-in">
                                    <h3 className="text-xl sm:text-2xl font-black text-white mb-2">Limit dzienny osiągnięty</h3>
                                    <p className="text-slate-300 text-sm sm:text-base">Odblokuj pełen potencjał kodem na górnym pasku.</p>
                                </div>
                            )}

                            <div className="glass-panel p-8 md:p-10 rounded-3xl relative border border-teal-500/30">
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-xs font-bold text-teal-400 uppercase tracking-widest block mb-2">1. O czym robimy gazetkę? *</label>
                                        <input type="text" value={topic} onChange={e => setTopic(e.target.value)} placeholder="np. Bezpieczny Internet, Dzień Rodziny, Powstanie Styczniowe..." className="w-full p-5 bg-slate-900/80 border border-slate-700 rounded-2xl text-lg font-medium outline-none text-white focus:border-teal-500 transition-colors shadow-inner" />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">2. Słownictwo i ciekawostki dla:</label>
                                            <select value={ageGroup} onChange={e => setAgeGroup(e.target.value)} className="w-full p-5 bg-slate-900/80 border border-slate-700 rounded-2xl outline-none text-white font-medium focus:border-teal-500 transition-colors cursor-pointer">
                                                <option>Przedszkole</option><option>Klasy 1-3</option><option>Klasy 4-8</option><option>Szkoła Średnia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">3. Styl plakatów</label>
                                            <select value={artStyle} onChange={e => setArtStyle(e.target.value)} className="w-full p-5 bg-slate-900/80 border border-slate-700 rounded-2xl outline-none text-white font-medium focus:border-teal-500 transition-colors cursor-pointer">
                                                <option>Nowoczesny Wektor</option>
                                                <option>Akwarela</option>
                                                <option>Magiczne 3D</option>
                                                <option>Kredki / Szkic</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={generateGazetka} 
                                        disabled={!topic.trim() || (!isPro && limitData.remaining === 0)}
                                        className="w-full mt-6 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 disabled:opacity-50 text-white py-5 rounded-2xl font-bold text-xl tracking-wide shadow-[0_0_30px_rgba(20,184,166,0.3)] transition-all active:scale-95 flex justify-center items-center gap-3 btn-bounce"
                                    >
                                        <i className="ph-bold ph-magic-wand"></i> Stwórz Gazetkę!
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Loading
            if (step === 'generating') {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col text-center px-4 bg-slate-950">
                        <div className="glass-panel p-10 rounded-3xl border border-teal-500/20 flex flex-col items-center max-w-md w-full shadow-[0_0_50px_rgba(20,184,166,0.15)]">
                            <i className="ph-fill ph-scissors animate-bounce text-6xl text-teal-400 mb-6"></i>
                            <h2 className="text-2xl font-display font-bold text-white mb-3">Projektowanie trwa...</h2>
                            <p className="text-sm text-slate-400 font-medium mb-8">{loadingStatus}</p>
                            
                            <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden relative">
                                <div className="h-full bg-gradient-to-r from-teal-500 to-emerald-500 transition-all duration-300" style={{ width: `${loadingProgress}%` }}></div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Podgląd i Wydruk
            if (step === 'review') {
                return (
                    <div className="min-h-screen flex flex-col bg-slate-100 corkboard-pattern text-slate-900">
                        {toastMessage && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-teal-600 text-white px-6 py-3 rounded-full font-bold shadow-lg">
                                {toastMessage}
                            </div>
                        )}

                        {/* MODAL PUBLIKACJI */}
                        {showPublishModal && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-950/80 backdrop-blur-sm fade-in print-hidden">
                                <div className="bg-slate-900 border border-emerald-500/50 p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full relative">
                                    <button onClick={() => setShowPublishModal(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white">✕</button>
                                    <h3 className="text-2xl font-black text-emerald-500 mb-2 flex items-center gap-2"><Icon name="Share" /> Zapisz w Giełdzie</h3>
                                    <p className="text-slate-400 text-sm mb-6">Udostępnij ten wspaniały zestaw plakatów dla innych nauczycieli.</p>
                                    
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Tytuł dekoracji</label>
                                    <input type="text" value={publishTitle} onChange={(e) => setPublishTitle(e.target.value)} placeholder="np. Wiosenna Gazetka" className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mb-6 focus:outline-none focus:border-emerald-500" />
                                    
                                    <button onClick={handlePublishToLibrary} disabled={isPublishing} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl shadow-lg btn-bounce flex justify-center items-center gap-2">
                                        {isPublishing ? 'Publikowanie...' : 'Opublikuj Zestaw'}
                                    </button>
                                </div>
                            </div>
                        )}
                        
                        <nav className="bg-white border-b border-slate-200 h-20 flex items-center justify-between px-6 shadow-sm no-print sticky top-0 z-50">
                            <h1 className="text-xl font-display font-bold text-slate-800 flex items-center gap-2"><i className="ph-fill ph-check-circle text-teal-500 text-2xl"></i> Gazetka Gotowa!</h1>
                            <div className="flex items-center gap-3">
                                
                                {/* Wybór formatu dla liter */}
                                <div className="hidden md:flex bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-inner mr-2">
                                    <button onClick={() => setPrintFormat('A4')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${printFormat === 'A4' ? 'bg-white shadow text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>A4 (1 litera / str)</button>
                                    <button onClick={() => setPrintFormat('A5')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${printFormat === 'A5' ? 'bg-white shadow text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>A5 (2 litery / str)</button>
                                </div>

                                <button onClick={() => setShowPublishModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-900 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-md active:scale-95 transition-all text-sm btn-bounce hidden sm:flex">
                                    <Icon name="Share" size={16}/> Udostępnij Wzór
                                </button>
                                <button onClick={() => window.print()} className="bg-teal-600 hover:bg-teal-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-md active:scale-95 transition-all text-sm btn-bounce">
                                    <i className="ph-bold ph-printer text-lg"></i> Drukuj (PDF)
                                </button>
                                <button onClick={() => {setStep('config'); setViewMode('kreator');}} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-xl font-bold shadow-sm active:scale-95 transition-all text-sm btn-bounce">Wróć</button>
                            </div>
                        </nav>

                        <div className="flex-1 p-4 md:p-8">
                            
                            <div className="no-print max-w-5xl mx-auto bg-amber-100 border border-amber-300 text-amber-800 p-4 rounded-xl mb-8 text-sm font-bold flex items-start md:items-center gap-3 shadow-sm">
                                <i className="ph-fill ph-info text-2xl shrink-0"></i> 
                                <p>To jest podgląd tablicy. W druku (PDF) pierwsza sekcja wygeneruje wielkie litery do wycięcia, a następnie 4 duże plakaty A4. <br className="hidden md:block"/><span className="text-teal-700">Wskazówka: Możesz kliknąć w opisy pod obrazkami, aby je edytować przed wydrukiem!</span></p>
                            </div>

                            {/* WIRTUALNA TABLICA KORKOWA (PODGLĄD) */}
                            <div id="render-area" className="max-w-6xl mx-auto">
                                
                                {/* 1. SEKCJA TYTUŁU (LITERY) */}
                                <div className="flex flex-wrap justify-center gap-2 md:gap-4 mb-16 no-print">
                                    {gazetkaData.title.split('').map((char, idx) => {
                                        if (char === ' ') return <div key={idx} className="w-8 md:w-16"></div>;
                                        return (
                                            <div key={idx} className="w-20 h-28 md:w-28 md:h-36 bg-white border border-slate-300 shadow-md flex items-center justify-center text-6xl md:text-[5.5rem] font-display font-black text-slate-800 relative transform rotate-1 hover:rotate-0 transition-transform">
                                                <div className="pin scale-50 -top-2"></div>
                                                {char.toUpperCase()}
                                            </div>
                                        )
                                    })}
                                </div>

                                {/* TYTUŁ W DRUKU - z uwzględnieniem formatu A4 / A5 */}
                                <div className="hidden print:block">
                                    {gazetkaData.title.split('').map((char, idx) => {
                                        if (char === ' ') return null;
                                        return (
                                            <div key={`print-char-${idx}`} className={`print-letter-${printFormat}`}>
                                                <span className={`print-text-${printFormat}`}>{char.toUpperCase()}</span>
                                            </div>
                                        )
                                    })}
                                </div>

                                {/* 2. SEKCJA PLAKATÓW */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 pb-12 no-print">
                                    {gazetkaData.posters.map((poster, idx) => (
                                        <div key={idx} className="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden relative transform -rotate-1 hover:rotate-0 transition-transform duration-300 flex flex-col min-h-[500px]">
                                            <div className="pin"></div>
                                            
                                            {/* Obrazek Plakatu */}
                                            <div className="relative aspect-square w-full bg-slate-100 border-b-4 border-slate-800 group/img">
                                                {poster.imageUrl ? (
                                                    <img src={poster.imageUrl} className="absolute inset-0 w-full h-full object-cover" />
                                                ) : (
                                                    <div className="absolute inset-0 flex items-center justify-center text-slate-400 font-bold">Ładowanie grafiki...</div>
                                                )}

                                                {/* Przycisk regeneracji */}
                                                <button 
                                                    onClick={() => regeneratePoster(idx)} 
                                                    disabled={regeneratingIndex !== null}
                                                    className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-teal-500 border-2 border-white text-white px-5 py-3 rounded-xl shadow-xl font-bold flex items-center gap-2 transition-all hover:bg-teal-400 hover:scale-105 z-50 ${regeneratingIndex === idx ? 'opacity-100' : 'opacity-0 group-hover/img:opacity-100'}`}
                                                >
                                                    {regeneratingIndex === idx ? <><i className="ph-bold ph-spinner animate-spin"></i> Rysuję...</> : <><i className="ph-bold ph-arrows-clockwise"></i> Zmień obrazek</>}
                                                </button>
                                            </div>

                                            {/* Tekst Plakatu (Z EDYCJĄ!) */}
                                            <div className="p-4 md:p-6 flex-1 flex flex-col items-center justify-center text-center bg-slate-50 relative group/edit">
                                                <div className="absolute top-2 right-2 opacity-0 group-hover/edit:opacity-100 transition-opacity text-slate-400 text-xs font-bold pointer-events-none bg-white px-2 py-1 rounded shadow-sm border border-slate-200">
                                                    <i className="ph-bold ph-pencil-simple"></i> Kliknij, aby edytować
                                                </div>
                                                <textarea 
                                                    value={poster.fact}
                                                    onChange={(e) => {
                                                        const newData = {...gazetkaData};
                                                        newData.posters[idx].fact = e.target.value;
                                                        setGazetkaData(newData);
                                                    }}
                                                    className="w-full h-full min-h-[100px] bg-transparent resize-none outline-none text-center text-xl md:text-2xl font-semibold text-slate-800 leading-snug custom-scrollbar focus:bg-white focus:rounded-lg p-2 transition-colors"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* PLAKATY W DRUKU - Zawsze A4, z uwzględnieniem ewentualnej edycji */}
                                <div className="hidden print:block">
                                    {gazetkaData.posters.map((poster, idx) => (
                                        <div key={`print-poster-${idx}`} className="print-poster-page">
                                            {poster.imageUrl && <img src={poster.imageUrl} className="print-poster-img" />}
                                            <div className="print-poster-text">
                                                <p>{poster.fact}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
