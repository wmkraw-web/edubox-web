        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            const [toastMessage, setToastMessage] = useState('');
            
            // Zmienne Piktogramu
            const [promptInput, setPromptInput] = useState('');
            const [colorMode, setColorMode] = useState('bw'); // 'bw' lub 'color'
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            
            // Stan dla Planu Dnia (Koszyka)
            const [schedule, setSchedule] = useState([]);

            const resultRef = useRef(null);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO' || status === 'active') setIsPremium(true);
                }
                
                // Ładowanie zapisanego planu dnia z localStorage
                const savedSchedule = localStorage.getItem('eduPictoSchedule');
                if (savedSchedule) {
                    try { setSchedule(JSON.parse(savedSchedule)); } catch(e) {}
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_edupiktogram', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            // Zapisywanie planu dnia do pamięci przeglądarki przy każdej zmianie
            useEffect(() => {
                localStorage.setItem('eduPictoSchedule', JSON.stringify(schedule));
            }, [schedule]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (schedule.length === 0) {
                    showToast("Twój plan dnia jest pusty! Najpierw dodaj obrazki.");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Plan Dnia AAC (${schedule.length} elementów)`;
                            const config = { schedule };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_edupiktogram', 'Plan Dnia', name, config);
                            showToast("✨ Udostępniono w Giełdzie Wzorów!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.schedule) {
                    setSchedule(c.schedule);
                    setAppMode('editor');
                    showToast("✨ Załadowano Plan z Giełdy!");
                }
            };

            // LOGIKA GENEROWANIA OBRAZKÓW Z API (Fal.ai Flux Schnell - szybkie, tanie, bez osobnego klucza Stability)
            const secureApiCall = async (payload) => {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: payload.prompt, width: payload.width, height: payload.height })
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `Status API: ${res.status}`);
                }
                return await res.json();
            };

            const handleGeneratePictogram = () => {
                if (!promptInput.trim()) {
                    setError('Wpisz, co ma przedstawiać piktogram!'); 
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        generatePictogram();
                    },
                    (msg) => { setError(''); showToast(msg); },
                    (msg) => showToast(msg)
                );
            };

            const generatePictogram = async () => {
                setIsGenerating(true);
                setError('');
                setGeneratedImage(null);

                try {
                    let hiddenInstruction = "";

                    // Uwaga: Flux Schnell nie obsługuje negative_prompt (nie jest to model typu CFG jak
                    // Stability SDXL) - wszystkie ograniczenia wpisujemy wprost w prompt pozytywny.
                    const noiseConstraints = "no text, no words, no letters, not realistic, not 3d, no complex or detailed background, no shadows, no shading, not distorted, clean simple lines, no watermark.";
                    if (colorMode === 'bw') {
                        hiddenInstruction = `A simple, minimalist black and white pictogram icon. MAIN SUBJECT: ${promptInput}. Style: thick black outlines, pure white background, no shading, line art, flat 2d, educational AAC symbol, clear visual schedule icon. Constraints: ${noiseConstraints}`;
                    } else {
                        hiddenInstruction = `A simple, minimalist flat color pictogram icon. MAIN SUBJECT: ${promptInput}. Style: flat vibrant colors, thick black outlines, pure white background, no gradients, no 3d, educational AAC symbol, clear visual schedule icon. Constraints: ${noiseConstraints}`;
                    }

                    const payload = {
                        prompt: hiddenInstruction,
                        width: 1024,
                        height: 1024
                    };

                    const data = await secureApiCall(payload);
                    const imageResult = data.imageUrl || data.predictions?.[0]?.bytesBase64Encoded || data.artifacts?.[0]?.base64 || data.image;

                    if (imageResult) {
                        const finalImage = imageResult.startsWith('http') || imageResult.startsWith('data:image') ? imageResult : `data:image/png;base64,${imageResult}`;
                        setGeneratedImage(finalImage);
                        
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź API.");
                    }
                } catch (err) {
                    console.error(err);
                    setError(err.message || 'Wystąpił problem z generowaniem obrazu.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const addToSchedule = () => {
                if (generatedImage) {
                    const newItem = {
                        id: Date.now(),
                        img: generatedImage,
                        label: promptInput.substring(0, 20).toUpperCase() // domyślny krótki podpis
                    };
                    setSchedule([...schedule, newItem]);
                    // Wyczyść podgląd, aby zachęcić do stworzenia kolejnego
                    setGeneratedImage(null);
                    setPromptInput('');
                }
            };

            const removeFromSchedule = (id) => {
                setSchedule(schedule.filter(item => item.id !== id));
            };

            const updateLabel = (id, newLabel) => {
                setSchedule(schedule.map(item => item.id === id ? { ...item, label: newLabel } : item));
            };

            const clearSchedule = () => {
                if(window.confirm("Czy na pewno chcesz usunąć cały stworzony plan dnia?")) {
                    setSchedule([]);
                }
            };

            // Dedykowane okno drukowania formujące idealne plany dnia (AAC)
            const handlePrintSchedule = () => {
                if (schedule.length === 0) return;
                
                const itemsHtml = schedule.map(item => `
                    <div class="picto-box">
                        <div class="img-container">
                            <img src="${item.img}" />
                        </div>
                        <div class="label">${item.label}</div>
                    </div>
                `).join('');

                const windowContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Plan Dnia AAC - EduPiktogram</title>
                        <style>
                            @page { margin: 1.5cm; size: A4 portrait; }
                            body { font-family: 'Arial', sans-serif; text-align: center; margin: 0; padding: 0; }
                            h1 { font-size: 24px; text-transform: uppercase; margin-bottom: 30px; }
                            
                            /* Siatka na obrazki w formacie idealnym do rzepów (ok. 5x5 cm kwadrat) */
                            .schedule-grid { 
                                display: flex; 
                                flex-wrap: wrap; 
                                gap: 20px; 
                                justify-content: center; 
                            }
                            
                            .picto-box { 
                                border: 3px solid #000; 
                                border-radius: 8px; 
                                width: 5.5cm; 
                                display: flex; 
                                flex-direction: column; 
                                overflow: hidden;
                                page-break-inside: avoid;
                            }
                            
                            .img-container {
                                width: 100%;
                                height: 5.5cm;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                border-bottom: 3px solid #000;
                            }
                            
                            img { 
                                width: 100%; 
                                height: 100%; 
                                object-fit: contain; 
                            }
                            
                            .label { 
                                padding: 12px 5px; 
                                font-weight: 900; 
                                font-size: 16px; 
                                text-transform: uppercase; 
                                background-color: #fff;
                                letter-spacing: 1px;
                            }
                        </style>
                    </head>
                    <body>
                        <h1>Wizualny Plan Dnia</h1>
                        <div class="schedule-grid">
                            ${itemsHtml}
                        </div>
                    </body>
                    </html>
                `;
                const printWin = window.open('', '', 'width=800,height=800');
                printWin.document.open();
                printWin.document.write(windowContent);
                printWin.document.close();
                
                setTimeout(() => {
                    printWin.focus();
                    printWin.print();
                    printWin.close();
                }, 500);
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-teal-500 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-teal-400">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-books text-4xl"></i> Baza Piktogramów</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl"></i> Udostępnij swój obecny zestaw w chmurze
                                </button>

                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Zestawy udostępnione przez innych</h3>
                                <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-2">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-5 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col gap-3 shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="flex justify-between items-start gap-3">
                                                <span className="text-base font-bold text-slate-200 group-hover:text-fuchsia-400 transition-colors line-clamp-2 leading-relaxed">{p.name}</span>
                                                <span className="text-[10px] font-bold px-2 py-1 rounded bg-teal-900/50 border border-teal-500/30 text-teal-300 whitespace-nowrap uppercase tracking-widest">{p.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center font-bold">
                                                <p className="text-xs text-slate-500">Autor: <span className="text-slate-300">{p.userId.substring(0,6)}</span></p>
                                                <p className="text-xs text-slate-500">{p.createdAt?.toDate().toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="text-center py-10 opacity-50">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-500 mx-auto block"></i>
                                            <p className="text-base text-slate-400 font-bold">Brak zestawów w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col pt-16">
                    <div className="aura-blob aura-1"></div>
                    <div className="aura-blob aura-2"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-teal-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm animate-toast flex items-center gap-3 border border-teal-400 print-hidden">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 max-w-sm border border-teal-500/30 shadow-[0_0_50px_rgba(20,184,166,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-teal-500 rounded-full animate-spin"></div>
                                <div className="text-center">
                                    <h3 className="text-xl font-bold mb-2 text-white">Rysuję piktogram...</h3>
                                    <p className="text-xs text-slate-400 font-medium">To potrwa kilkanaście sekund.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-teal-500 to-sky-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <i className="ph-bold ph-puzzle-piece text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">Edu<span className="text-teal-400">Piktogram</span> AI</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={() => window.open('https://buycoffee.to/magiccolor')} className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all active:scale-95 text-sm shadow-md btn-bounce">
                                    <i className="ph-fill ph-coffee text-lg text-amber-400"></i><span className="hidden sm:block">Postaw Kawę</span>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-10 pb-32 px-4 sm:px-6 print:pt-0 print:pb-0 print:px-0">
                        <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* LEWA KOLUMNA: GENERATOR */}
                            <div className="lg:col-span-5 space-y-6 print-hidden">
                                
                                {/* ODBLOKOWANIE PREMIUM / BAZA WZORÓW */}
                                <div className="flex flex-col gap-4">
                                    {!isPremium ? (
                                        <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-teal-500/30 bg-teal-950/20">
                                            <div className="flex flex-col px-2">
                                                <span className="text-[10px] font-bold text-teal-300 uppercase tracking-widest">Darmowe użycia: {Math.max(0, 5 - usageCount)}/5</span>
                                                <span className="text-[9px] text-slate-400 font-bold">Wersja Free</span>
                                            </div>
                                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                                <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-32 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-teal-500 transition-colors uppercase"/>
                                                <button onClick={handleVerifyCode} className="px-3 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-xs font-bold transition-all shadow-md btn-bounce">OK</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                            <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                            <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduPiktogram PRO Aktywny</span>
                                        </div>
                                    )}

                                    <button onClick={() => setAppMode('gielda')} className="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-fuchsia-900/30 hover:border-fuchsia-500/50 transition-all shadow-md btn-bounce flex items-center justify-center gap-2">
                                        <i className="ph-bold ph-files text-lg text-fuchsia-400"></i> Baza Piktogramów (Giełda)
                                    </button>
                                </div>

                                <div className="text-left mb-6 fade-in">
                                    <div className="inline-flex items-center gap-2 bg-teal-900/30 border border-teal-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-teal-400 uppercase tracking-widest mb-4">
                                        Terapia i AAC
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">
                                        Stwórz własny <br/><span className="text-gradient">Plan Dnia.</span>
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Generuj proste i zrozumiałe piktogramy, twórz harmonogramy i drukuj gotowe karty komunikacyjne.
                                    </p>
                                </div>

                                <div className="glass-panel p-6 sm:p-8 rounded-[2rem] fade-in border border-slate-700/50">
                                    
                                    <div className="mb-6 flex bg-slate-800/50 p-1 rounded-xl">
                                        <button 
                                            onClick={() => setColorMode('bw')} 
                                            className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${colorMode === 'bw' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Czarno-białe (Kontur)
                                        </button>
                                        <button 
                                            onClick={() => setColorMode('color')} 
                                            className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${colorMode === 'color' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            Kolorowe (Płaskie)
                                        </button>
                                    </div>

                                    <label className="block text-white font-bold mb-3 text-sm uppercase tracking-widest">Wpisz Aktywność / Przedmiot:</label>
                                    <div className="relative mb-6">
                                        <input 
                                            type="text" 
                                            value={promptInput}
                                            onChange={(e) => setPromptInput(e.target.value)}
                                            onKeyPress={(e) => { if(e.key === 'Enter') handleGeneratePictogram(); }}
                                            placeholder="Np. mycie rąk, jazda autobusem, cisza..."
                                            className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-teal-500 outline-none"
                                        />
                                    </div>

                                    <button 
                                        onClick={handleGeneratePictogram}
                                        disabled={isGenerating || !promptInput}
                                        className={`w-full py-4 rounded-xl font-black text-white text-sm uppercase tracking-widest transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(20,184,166,0.2)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-teal-500 to-sky-500 hover:scale-105'}`}
                                    >
                                        <i className="ph-bold ph-magic-wand text-lg"></i> Stwórz Piktogram {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                    </button>

                                    {error && <div className="mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded-lg text-red-400 text-xs font-medium text-center">{error}</div>}
                                </div>
                                
                                {/* WYNIK GENEROWANIA - Gotowy do dodania */}
                                {generatedImage && (
                                    <div ref={resultRef} className="glass-panel p-6 rounded-[2rem] fade-in border border-teal-500/30 text-center">
                                        <h3 className="text-sm font-bold text-white mb-4 uppercase tracking-widest">Podgląd Piktogramu</h3>
                                        <div className="bg-white p-3 rounded-2xl mx-auto w-48 h-48 flex items-center justify-center mb-6 shadow-xl border-2 border-slate-200">
                                            <img src={generatedImage} alt="Piktogram" className="max-w-full max-h-full object-contain mix-blend-multiply" />
                                        </div>
                                        <button 
                                            onClick={addToSchedule} 
                                            className="w-full bg-teal-600 hover:bg-teal-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all btn-bounce shadow-lg uppercase text-sm tracking-widest"
                                        >
                                            <i className="ph-bold ph-plus text-lg"></i> Dodaj do Planu Dnia
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* PRAWA KOLUMNA: PLAN DNIA (KOSZYK) */}
                            <div className="lg:col-span-7 glass-panel rounded-[2.5rem] p-6 sm:p-8 border border-slate-700/50 flex flex-col h-full min-h-[600px]">
                                <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-700/50 print-hidden">
                                    <h2 className="text-2xl font-black text-white flex items-center gap-3">
                                        <i className="ph-bold ph-clipboard-text text-teal-400 text-3xl"></i> Twój Plan Dnia
                                        <span className="bg-teal-500 text-white text-xs px-2 py-1 rounded-full">{schedule.length}</span>
                                    </h2>
                                    {schedule.length > 0 && (
                                        <div className="flex gap-2">
                                            <button onClick={clearSchedule} className="text-slate-400 hover:text-red-400 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-800 transition-colors">
                                                Wyczyść
                                            </button>
                                            <button onClick={handlePrintSchedule} className="bg-white text-slate-900 hover:bg-teal-50 px-4 py-2 rounded-xl font-black flex items-center gap-2 transition-all shadow-lg btn-bounce">
                                                <i className="ph-bold ph-printer text-lg"></i> Drukuj PDF
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {schedule.length === 0 ? (
                                    <div className="flex-grow flex flex-col items-center justify-center text-center opacity-50 print-hidden">
                                        <i className="ph-bold ph-puzzle-piece text-6xl mb-4 text-slate-500"></i>
                                        <p className="text-slate-300 font-bold text-lg">Plan dnia jest pusty.</p>
                                        <p className="text-slate-400 text-sm max-w-xs mt-2">Wygeneruj obrazek po lewej stronie i dodaj go tutaj, aby rozpocząć budowanie harmonogramu.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 auto-rows-max overflow-y-auto pr-2 pb-10 print-hidden" style={{ maxHeight: "calc(100vh - 250px)" }}>
                                        {schedule.map((item, index) => (
                                            <div key={item.id} className="bg-slate-800/80 rounded-2xl p-3 border border-slate-600 relative group picto-item-enter">
                                                <div className="absolute top-2 left-2 bg-slate-900 text-slate-400 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center z-10 border border-slate-700">
                                                    {index + 1}
                                                </div>
                                                <button 
                                                    onClick={() => removeFromSchedule(item.id)}
                                                    className="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity z-10 btn-bounce"
                                                    title="Usuń"
                                                >
                                                    <i className="ph-bold ph-x"></i>
                                                </button>
                                                <div className="bg-white aspect-square rounded-xl mb-3 p-2 flex items-center justify-center shadow-inner">
                                                    <img src={item.img} className="max-w-full max-h-full object-contain mix-blend-multiply" alt="Picto" />
                                                </div>
                                                <input 
                                                    type="text" 
                                                    value={item.label} 
                                                    onChange={(e) => updateLabel(item.id, e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 text-white text-center text-xs font-bold p-2 rounded-lg focus:ring-1 focus:ring-teal-500 outline-none uppercase"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
