    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function wstawMenuAwaryjne() {
                document.getElementById('wspolne-menu-kontener').innerHTML = `
                    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <span class="text-2xl font-black text-slate-800 tracking-tight">Edu<span class="text-teal-600">Box</span></span>
                            </a>
                        </div>
                    </nav>
                `;
            }
            try {
                fetch('/menu.html')
                    .then(response => { if (!response.ok) throw new Error('Błąd ładowania menu'); return response.text(); })
                    .then(data => {
                        const container = document.getElementById('wspolne-menu-kontener');
                        container.innerHTML = data;
                        container.querySelectorAll('script').forEach(oldScript => {
                            const newScript = document.createElement('script');
                            if (oldScript.src) newScript.src = oldScript.src;
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                    })
                    .catch(() => wstawMenuAwaryjne());
            } catch (error) { wstawMenuAwaryjne(); }
        });
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Starannie dobrana, bezpieczna biblioteka ćwiczeń - bez treści generowanej przez AI na żywo
        const EXERCISES = {
            uspokojenie: [
                {
                    title: 'Oddech pudełkowy',
                    time: 2,
                    type: 'breathing',
                    pattern: [{ label: 'Wdech', sec: 4 }, { label: 'Zatrzymaj', sec: 4 }, { label: 'Wydech', sec: 4 }, { label: 'Zatrzymaj', sec: 4 }],
                    intro: 'Usiądź wygodnie, jeśli możesz - oprzyj stopy o podłogę. Będziemy oddychać w równym rytmie 4-4-4-4.',
                    outro: 'Zauważ, jak zwolniło tętno. Nie musisz robić nic więcej przez najbliższą chwilę.'
                },
                {
                    title: 'Oddech 4-7-8',
                    time: 3,
                    type: 'breathing',
                    pattern: [{ label: 'Wdech nosem', sec: 4 }, { label: 'Zatrzymaj', sec: 7 }, { label: 'Wydech ustami', sec: 8 }],
                    intro: 'Ta technika delikatnie aktywuje układ uspokajający ciała. Wydech jest dłuższy niż wdech - to naturalne, że na początku może być trudny.',
                    outro: 'Wystarczy nawet kilka takich oddechów, żeby ciało zaczęło się wyciszać.'
                },
                {
                    title: 'Skan ciała na siedząco',
                    time: 5,
                    type: 'reflection',
                    steps: [
                        'Zamknij oczy albo skieruj wzrok w jeden punkt.',
                        'Poczuj stopy na podłodze. Odpuść napięcie w palcach stóp.',
                        'Przesuń uwagę do barków - opuść je, jeśli są uniesione.',
                        'Rozluźnij szczękę i czoło - to miejsca, gdzie chowamy najwięcej stresu.',
                        'Weź jeden, spokojny, pełny oddech i otwórz oczy.'
                    ],
                    intro: 'Krótki skan ciała - nie musisz nic zmieniać, wystarczy zauważyć, gdzie jest napięcie.',
                    outro: 'Nawet samo zauważenie napięcia często wystarczy, żeby trochę zelżało.'
                }
            ],
            energia: [
                {
                    title: 'Oddech energetyzujący',
                    time: 2,
                    type: 'breathing',
                    pattern: [{ label: 'Szybki wdech nosem', sec: 2 }, { label: 'Wydech ustami', sec: 2 }],
                    intro: 'Kilka szybszych, energicznych oddechów - jak lekka rozgrzewka dla układu nerwowego.',
                    outro: 'Poczuj, czy wróciła Ci trochę czujności. To dobry moment na powrót do klasy.'
                },
                {
                    title: 'Rozciąganie przy biurku',
                    time: 3,
                    type: 'reflection',
                    steps: [
                        'Wstań, jeśli możesz. Unieś ręce nad głowę i porozciągaj się jak najwyżej.',
                        'Delikatnie przekręć głowę w jedną, potem w drugą stronę.',
                        'Zrób kilka krążeń barkami do tyłu.',
                        'Potrząśnij dłońmi, jakbyś strząsał z nich wodę.',
                        'Weź głęboki oddech i się uśmiechnij - nawet na siłę, to działa.'
                    ],
                    intro: '90 sekund ruchu potrafi zdziałać więcej niż kawa. Rób tyle, ile możesz w swojej przestrzeni.',
                    outro: 'Ruch to jeden z najszybszych sposobów na odzyskanie energii w ciągu dnia.'
                }
            ],
            skupienie: [
                {
                    title: 'Metoda 5-4-3-2-1',
                    time: 3,
                    type: 'reflection',
                    steps: [
                        'Nazwij w myślach 5 rzeczy, które widzisz wokół siebie.',
                        'Nazwij 4 rzeczy, których możesz dotknąć.',
                        'Nazwij 3 dźwięki, które teraz słyszysz.',
                        'Nazwij 2 zapachy (albo takie, które lubisz).',
                        'Nazwij 1 rzecz, za którą jesteś dziś wdzięczny/a.'
                    ],
                    intro: 'Prosta technika uziemiająca - sprowadza uwagę z "karuzeli myśli" z powrotem do teraźniejszości.',
                    outro: 'Twój umysł jest teraz tu, w tym miejscu i czasie. To dobry punkt startowy.'
                },
                {
                    title: 'Oddech z liczeniem',
                    time: 2,
                    type: 'breathing',
                    pattern: [{ label: 'Wdech', sec: 4 }, { label: 'Wydech', sec: 6 }],
                    intro: 'Dłuższy wydech niż wdech naturalnie wycisza i pomaga się skupić na jednej rzeczy naraz.',
                    outro: 'Skupienie wraca łatwiej, kiedy ciało jest spokojne.'
                }
            ],
            dystans: [
                {
                    title: 'Co jest w mojej kontroli',
                    time: 3,
                    type: 'reflection',
                    steps: [
                        'Pomyśl przez chwilę o sytuacji, która Cię teraz obciąża.',
                        'Zapytaj siebie: co w tej sytuacji naprawdę zależy ode mnie?',
                        'A co nie zależy ode mnie, choćbym bardzo chciał/a?',
                        'Wybierz jedną, małą rzecz z pierwszej listy, którą możesz zrobić dziś.',
                        'Resztę - na razie - odłóż. Nie musisz nosić wszystkiego naraz.'
                    ],
                    intro: 'Krótka refleksja, żeby odróżnić to, na co masz wpływ, od tego, czego nie zmienisz w tej chwili.',
                    outro: 'Nie musisz rozwiązać wszystkiego teraz. Wystarczy jeden mały krok.'
                },
                {
                    title: 'Zdanie dla siebie',
                    time: 2,
                    type: 'reflection',
                    steps: [
                        'Pomyśl, co powiedziałbyś/powiedziałabyś koledze lub koleżance z pracy w Twojej dzisiejszej sytuacji.',
                        'Prawdopodobnie byłoby to coś życzliwego, prawda?',
                        'Powiedz teraz to samo zdanie sobie - najlepiej na głos, choćby szeptem.',
                        'Zasługujesz na tę samą życzliwość, którą dajesz innym.'
                    ],
                    intro: 'Nauczyciele bywają dla siebie dużo surowsi niż dla swoich uczniów. Ta chwila jest po to, żeby to na moment odwrócić.',
                    outro: 'Ta życzliwość dla siebie to nie słabość - to część tego, co pozwala wytrwać w tym zawodzie.'
                }
            ]
        };

        const POTRZEBY = [
            { id: 'uspokojenie', label: 'Uspokojenia', icon: 'ph-drop', color: 'bg-sky-100 text-sky-700 border-sky-300' },
            { id: 'energia', label: 'Energii', icon: 'ph-sun', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            { id: 'skupienie', label: 'Skupienia', icon: 'ph-target', color: 'bg-violet-100 text-violet-700 border-violet-300' },
            { id: 'dystans', label: 'Dystansu', icon: 'ph-leaf', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
        ];

        function BreathingGuide({ exercise, onDone }) {
            const [stepIdx, setStepIdx] = useState(0);
            const [secondsLeft, setSecondsLeft] = useState(exercise.pattern[0].sec);
            const [cycles, setCycles] = useState(0);

            useEffect(() => {
                if (secondsLeft <= 0) {
                    const nextIdx = (stepIdx + 1) % exercise.pattern.length;
                    if (nextIdx === 0) setCycles(c => c + 1);
                    setStepIdx(nextIdx);
                    setSecondsLeft(exercise.pattern[nextIdx].sec);
                    return;
                }
                const timer = setTimeout(() => setSecondsLeft(s => s - 1), 1000);
                return () => clearTimeout(timer);
            }, [secondsLeft, stepIdx, exercise.pattern]);

            const currentStep = exercise.pattern[stepIdx];
            const isIn = currentStep.label.toLowerCase().includes('wdech');
            const isOut = currentStep.label.toLowerCase().includes('wydech');
            const animClass = isIn ? 'breathe-in' : isOut ? 'breathe-out' : 'breathe-hold';

            return (
                <div className="flex flex-col items-center py-10">
                    <div key={stepIdx} className={`w-40 h-40 rounded-full bg-gradient-to-br from-teal-300 to-teal-500 flex items-center justify-center shadow-lg mb-8 ${animClass}`}>
                        <span className="text-white font-black text-3xl">{secondsLeft}</span>
                    </div>
                    <p className="text-xl font-bold text-slate-700 mb-2">{currentStep.label}</p>
                    <p className="text-slate-400 text-sm mb-8">Cykl {cycles + 1}</p>
                    <button onClick={onDone} className="text-slate-500 hover:text-slate-800 text-sm font-bold underline">
                        Zakończ i zobacz podsumowanie
                    </button>
                </div>
            );
        }

        function ReflectionGuide({ exercise, onDone }) {
            const [stepIdx, setStepIdx] = useState(0);
            const isLast = stepIdx === exercise.steps.length - 1;

            return (
                <div className="max-w-md mx-auto py-8 text-center">
                    <div className="text-xs font-black uppercase tracking-widest text-teal-600 mb-4">Krok {stepIdx + 1} z {exercise.steps.length}</div>
                    <p className="quiet-font text-xl text-slate-700 leading-relaxed mb-10 min-h-[100px]">{exercise.steps[stepIdx]}</p>
                    {isLast ? (
                        <button onClick={onDone} className="bg-teal-600 hover:bg-teal-700 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all">Gotowe</button>
                    ) : (
                        <button onClick={() => setStepIdx(i => i + 1)} className="bg-teal-600 hover:bg-teal-700 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all">Dalej</button>
                    )}
                </div>
            );
        }

        function App() {
            const [timeChoice, setTimeChoice] = useState(null);
            const [needChoice, setNeedChoice] = useState(null);
            const [activeExercise, setActiveExercise] = useState(null);
            const [finished, setFinished] = useState(false);
            const [journalEntry, setJournalEntry] = useState('');
            const [journalSaved, setJournalSaved] = useState(false);

            const startExercise = (needId) => {
                setNeedChoice(needId);
                const pool = EXERCISES[needId].filter(e => !timeChoice || e.time <= timeChoice + 1);
                const chosen = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : EXERCISES[needId][0];
                setActiveExercise(chosen);
                setFinished(false);
            };

            const reset = () => {
                setActiveExercise(null);
                setNeedChoice(null);
                setFinished(false);
                setJournalEntry('');
                setJournalSaved(false);
            };

            const saveJournal = () => {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const entries = JSON.parse(localStorage.getItem('eduoddech_journal') || '[]');
                    entries.unshift({ date: today, text: journalEntry });
                    localStorage.setItem('eduoddech_journal', JSON.stringify(entries.slice(0, 30)));
                    setJournalSaved(true);
                } catch (e) {}
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <main className="max-w-3xl mx-auto px-4 sm:px-6 py-14 w-full flex-1">

                        {!activeExercise && (
                            <div className="fade-in">
                                <div className="text-center mb-12">
                                    <div className="inline-flex items-center gap-2 bg-teal-100 text-teal-700 text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full mb-5">
                                        <i className="ph-bold ph-heart"></i> Chwila tylko dla Ciebie
                                    </div>
                                    <h1 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight mb-4">EduOddech</h1>
                                    <p className="text-slate-500 max-w-lg mx-auto text-base md:text-lg">Krótka przerwa między lekcjami też się liczy. Wybierz, ile masz czasu i czego dziś potrzebujesz.</p>
                                </div>

                                <div className="bg-white border border-[#e2e8e5] rounded-2xl p-4 mb-8 flex gap-3 items-start max-w-lg mx-auto shadow-sm">
                                    <span className="text-xl flex-shrink-0">ℹ️</span>
                                    <p className="text-xs sm:text-sm text-slate-600 leading-relaxed"><strong className="text-slate-800">Jak to działa:</strong> wybierz ile masz czasu (2, 5 albo 10 minut) i czego potrzebujesz (uspokojenie, energia, skupienie albo dystans) - to jedyne narzędzie w EduBox bez AI: dostajesz od razu gotowe, sprawdzone ćwiczenie oddechowe, bez czekania na generowanie.</p>
                                </div>

                                <div className="mb-10">
                                    <p className="text-center text-xs font-black uppercase tracking-widest text-slate-400 mb-4">Ile masz czasu?</p>
                                    <div className="flex justify-center gap-3">
                                        {[2, 5, 10].map(t => (
                                            <button key={t} onClick={() => setTimeChoice(t)} className={`px-6 py-3 rounded-full font-bold text-sm border transition-all ${timeChoice === t ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-200 hover:border-teal-300'}`}>
                                                {t} min
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <p className="text-center text-xs font-black uppercase tracking-widest text-slate-400 mb-4">Czego dziś potrzebujesz?</p>
                                    <div className="grid grid-cols-2 gap-4 max-w-md mx-auto">
                                        {POTRZEBY.map(p => (
                                            <button key={p.id} onClick={() => startExercise(p.id)} className={`flex flex-col items-center gap-3 p-6 rounded-3xl border card hover:-translate-y-1 transition-all ${p.color.split(' ')[2]}`}>
                                                <i className={`ph-bold ${p.icon} text-3xl ${p.color.split(' ')[1]}`}></i>
                                                <span className="text-sm font-bold text-slate-700">{p.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeExercise && !finished && (
                            <div className="fade-in card rounded-[2rem] p-8 md:p-12">
                                <button onClick={reset} className="flex items-center gap-2 text-slate-400 hover:text-slate-700 text-xs font-bold mb-6">
                                    <i className="ph-bold ph-arrow-left"></i> Wróć
                                </button>
                                <h2 className="text-2xl font-black text-slate-800 text-center mb-3">{activeExercise.title}</h2>
                                <p className="quiet-font text-slate-500 text-center max-w-md mx-auto mb-4">{activeExercise.intro}</p>

                                {activeExercise.type === 'breathing' ? (
                                    <BreathingGuide exercise={activeExercise} onDone={() => setFinished(true)} />
                                ) : (
                                    <ReflectionGuide exercise={activeExercise} onDone={() => setFinished(true)} />
                                )}
                            </div>
                        )}

                        {finished && (
                            <div className="fade-in card rounded-[2rem] p-8 md:p-12 text-center">
                                <i className="ph-fill ph-check-circle text-5xl text-teal-500 mb-4"></i>
                                <h2 className="text-xl font-black text-slate-800 mb-3">Gotowe</h2>
                                <p className="quiet-font text-slate-500 max-w-md mx-auto mb-8">{activeExercise.outro}</p>

                                <div className="max-w-sm mx-auto mb-8 text-left">
                                    <label className="text-xs font-black uppercase tracking-widest text-slate-400 mb-2 block">Jedno zdanie na dziś (opcjonalnie, tylko dla Ciebie)</label>
                                    <textarea value={journalEntry} onChange={(e) => setJournalEntry(e.target.value)} placeholder="Np. co dziś poszło dobrze..." rows="2" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 resize-none focus:outline-none focus:border-teal-400"></textarea>
                                    {!journalSaved ? (
                                        <button onClick={saveJournal} disabled={!journalEntry.trim()} className="mt-2 text-xs font-bold text-teal-600 hover:text-teal-800 disabled:opacity-40 disabled:cursor-not-allowed">Zapisz tylko na tym urządzeniu</button>
                                    ) : (
                                        <p className="mt-2 text-xs font-bold text-teal-600">✓ Zapisano prywatnie na tym urządzeniu</p>
                                    )}
                                </div>

                                <button onClick={reset} className="bg-teal-600 hover:bg-teal-700 text-white px-8 py-3 rounded-full font-bold shadow-lg transition-all">Wróć na start</button>
                            </div>
                        )}

                    </main>

                    <footer className="border-t border-slate-200 bg-white py-10 px-4">
                        <div className="max-w-2xl mx-auto text-center">
                            <p className="text-xs font-black uppercase tracking-widest text-slate-400 mb-3">Potrzebujesz więcej wsparcia?</p>
                            <p className="text-sm text-slate-500 mb-4">To narzędzie to krótka przerwa na oddech - nie zastąpi rozmowy z drugim człowiekiem. Jeśli zmagasz się z czymś większym, są ludzie gotowi wysłuchać:</p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4 text-sm">
                                <div className="bg-slate-50 rounded-xl px-4 py-3">
                                    <div className="font-bold text-slate-700">Telefon Zaufania dla Nauczycieli</div>
                                    <div className="text-slate-500">510 338 182 · pon-wt 13:00-17:00</div>
                                </div>
                                <div className="bg-slate-50 rounded-xl px-4 py-3">
                                    <div className="font-bold text-slate-700">Centrum Wsparcia w Kryzysie Psychicznym</div>
                                    <div className="text-slate-500">800 70 22 22 · całodobowo</div>
                                </div>
                            </div>
                            <p className="text-[11px] text-slate-400 mt-4">W bezpośrednim zagrożeniu życia lub zdrowia zadzwoń pod 112.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>
