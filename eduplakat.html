<body class="min-h-screen flex flex-col">

    <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek)    -->
    <!-- ========================================================= -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const FIREBASE_CONFIG = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : {};
        const APP_ID = window.__app_id || "eduboxpro";

        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: (onUserLoad) => {
                if (!isInitialized && FIREBASE_CONFIG.apiKey) {
                    app = initializeApp(FIREBASE_CONFIG);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    signInAnonymously(auth).catch(e => console.error("Firebase Auth Error:", e));
                    isInitialized = true;
                    
                    window.EduBoxCore.loadMenu();
                }
                
                if (auth) {
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if(onUserLoad) onUserLoad(user);
                    });
                }
            },

            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) {
                    fetch('/menu.html')
                        .then(r => r.text())
                        .then(html => { container.innerHTML = html; })
                        .catch(err => console.log('Brak pliku menu lokalnie.', err));
                }
            },

            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) {
                    try {
                        const parsed = JSON.parse(usageStr);
                        if (parsed.date === today) return parsed.count;
                    } catch(e) {}
                }
                return 0;
            },

            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) {
                    onSuccess(window.EduBoxCore.getUsageCount());
                    return;
                }
                
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) {
                    onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na górze!");
                    return;
                }
                
                const newCount = currentCount + 1;
                const today = new Date().toISOString().split('T')[0];
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: newCount }));
                
                if(onToastUpdate) onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },

            verifyPremiumCode: (code) => {
                return code.toUpperCase() === 'KAWA2024';
            },

            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser) throw new Error("Brak połączenia z chmurą. Odśwież stronę.");
                
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                const payload = {
                    userId: currentUser.uid,
                    createdAt: serverTimestamp(),
                    type: appType,
                    name: itemName,
                    config: config
                };

                if (JSON.stringify(payload).length > 950000) {
                    throw new Error("🚨 Obraz jest zbyt szczegółowy by zapisać go w chmurze (Max ~1MB)!");
                }

                await addDoc(publicRef, payload);
            },

            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };

        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <!-- GŁÓWNY KONTENER REACT -->
    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            // --- LOCAL STATES ---
            const [promptInput, setPromptInput] = useState('');
            const [styleOption, setStyleOption] = useState('3d'); 
            const [orientationOption, setOrientationOption] = useState('3:4'); // Proporcje
            
            const [generatedImage, setGeneratedImage] = useState(null);
            const [generatingStatus, setGeneratingStatus] = useState(''); 
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');

            const resultRef = useRef(null);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_eduplakat', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (!generatedImage) {
                    showToast("Najpierw musisz wygenerować plakat!");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Plakat: ${promptInput.substring(0, 20)}...`;
                            const config = { promptInput, styleOption, orientationOption, generatedImage };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_eduplakat', 'Plakat Szkolny', name, config);
                            showToast("✨ Udostępniono w Bazie Plakatów!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.generatedImage) {
                    if(c.promptInput) setPromptInput(c.promptInput);
                    if(c.styleOption) setStyleOption(c.styleOption);
                    if(c.orientationOption) setOrientationOption(c.orientationOption);
                    
                    setGeneratedImage(c.generatedImage);
                    setAppMode('editor');
                    showToast("✨ Załadowano Plakat z Bazy!");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                }
            };

            // GŁÓWNA FUNKCJA GENERUJĄCA
            const handleGeneratePoster = () => {
                if (!promptInput.trim()) {
                    setError('Wpisz co ma być na plakacie!'); 
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        generatePoster();
                    },
                    (msg) => { setError(''); showToast(msg); },
                    (msg) => showToast(msg)
                );
            };

            const generatePoster = async () => {
                setGeneratingStatus('1/2 Wzbogacam Twój opis (AI)...');
                setError('');
                setGeneratedImage(null);

                try {
                    // ETAP 1: GPT-4o-mini REŻYSERUJE SCENĘ
                    let enhancedPrompt = promptInput;
                    try {
                        const systemPrompt = `You are an expert AI image prompt engineer. The user will give you a simple idea in Polish. 
                        Your job is to rewrite it into a highly detailed, physically logical, and descriptive image prompt IN ENGLISH. 
                        CRITICAL RULES:
                        1. Define spatial relations clearly (e.g., 'A boy stands on the left holding a flower, handing it to his mother standing on the right').
                        2. Prevent object merging (ensure hands hold correct items).
                        3. If there are people, clearly specify they are Caucasian/European.
                        4. Keep it under 60 words.
                        5. Reply ONLY with the English prompt, nothing else.`;

                        const resChat = await fetch('/api/chat', {
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                prompt: promptInput, 
                                system: systemPrompt, 
                                temperature: 0.7, 
                                model: "gpt-4o-mini" 
                            })
                        });
                        if (resChat.ok) { 
                            const dataChat = await resChat.json(); 
                            enhancedPrompt = dataChat.text.trim(); 
                        }
                    } catch(e) { console.log("GPT Enhancer failed, using original prompt."); }

                    // ETAP 2: GENEROWANIE OBRAZU
                    setGeneratingStatus('2/2 Malowanie arcydzieła...');

                    // Modyfikatory stylu
                    let styleModifier = "";
                    if (styleOption === 'akwarela') {
                        styleModifier = "beautiful watercolor painting, children's book illustration style, soft and harmonious, artistic masterpiece";
                    } else if (styleOption === '3d') {
                        styleModifier = "high quality 3D Pixar Disney animation style render, cute and cohesive, unreal engine 5";
                    } else if (styleOption === 'plakat') {
                        styleModifier = "flat vector illustration, modern poster art, clean design, minimalist";
                    }

                    // Informacja o orientacji
                    let orientationText = orientationOption === '3:4' ? 'Vertical portrait format.' : (orientationOption === '4:3' ? 'Horizontal landscape format.' : 'Square format.');

                    // Łączymy ulepszony przez GPT prompt ze stylem i zakazami
                    const fullPrompt = `${enhancedPrompt}. STYLE: ${styleModifier}. ${orientationText} ABSOLUTELY NO TEXT, no words, no letters. Perfect human anatomy.`;
                    const negativePrompt = "text, words, letters, extra limbs, bad anatomy, deformed, missing fingers, extra fingers, ugly, poorly drawn";

                    // Rozbudowujemy paczkę wymiarów
                    let sizeParam = '1024x1024';
                    let widthParam = 1024;
                    let heightParam = 1024;
                    
                    if (orientationOption === '3:4') {
                        sizeParam = '1024x1792'; widthParam = 768; heightParam = 1024;
                    } else if (orientationOption === '4:3') {
                        sizeParam = '1792x1024'; widthParam = 1024; heightParam = 768;
                    }

                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: fullPrompt,
                            negative_prompt: negativePrompt,
                            aspect_ratio: orientationOption,
                            style_preset: styleOption,
                            size: sizeParam,
                            width: widthParam,
                            height: heightParam
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || errData.message || `Błąd serwera (Status: ${response.status})`);
                    }
                    
                    const data = await response.json();
                    
                    let finalImage = data.imageUrl || data.image_url || data.url || (data.data && data.data[0] && data.data[0].url) || data.image;
                    
                    if (finalImage) {
                        if (finalImage.length > 1000 && !finalImage.startsWith('http') && !finalImage.startsWith('data:')) {
                            finalImage = `data:image/png;base64,${finalImage}`;
                        }
                        
                        setGeneratedImage(finalImage);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }
                } catch (err) {
                    console.error("Błąd generacji:", err);
                    setError(`Wystąpił problem z backendem: ${err.message}. Spróbuj ponownie.`);
                } finally {
                    setGeneratingStatus('');
                }
            };

            const handleDownload = () => {
                if (generatedImage) {
                    const a = document.createElement('a');
                    a.href = generatedImage;
                    a.download = `EduPlakat_${new Date().getTime()}.png`;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };

            const handlePrint = () => {
                if (generatedImage) {
                    const windowContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Twój Plakat - EduPlakat PRO</title>
                            <style>
                                @page { margin: 0; }
                                html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #fff; overflow: hidden; }
                                .print-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
                                img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
                            </style>
                        </head>
                        <body>
                            <div class="print-container">
                                <img src="${generatedImage}" />
                            </div>
                        </body>
                        </html>
                    `;
                    const printWin = window.open('', '', 'width=800,height=800');
                    printWin.document.open();
                    printWin.document.write(windowContent);
                    printWin.document.close();
                    
                    setTimeout(() => {
                        printWin.focus();
                        printWin.print();
                        printWin.close();
                    }, 500);
                }
            };

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        <div className="aura-blob aura-1 print-hidden"></div>
                        <div className="aura-blob aura-2 print-hidden"></div>

                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-cyan-600 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-cyan-400">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-images text-4xl"></i> Galeria Plakatów</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl"></i> Udostępnij Swój Gotowy Plakat
                                </button>

                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Inspiracje ze społeczności</h3>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto custom-scrollbar pr-2 pb-10">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/80 border border-slate-700 p-2 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="aspect-[3/4] bg-slate-800 rounded-xl overflow-hidden mb-2 relative">
                                                <img src={p.config.generatedImage} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt={p.name} loading="lazy" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
                                                <div className="absolute bottom-2 left-2 right-2">
                                                    <span className="text-[10px] font-bold text-white line-clamp-2 leading-tight drop-shadow-md">{p.name}</span>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center px-1">
                                                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-cyan-900/50 border border-cyan-500/30 text-cyan-300 uppercase tracking-widest">{p.config.styleOption}</span>
                                                <p className="text-[9px] text-slate-500 font-bold">{p.userId.substring(0,4)}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="col-span-full text-center py-10 opacity-50">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-500 mx-auto block"></i>
                                            <p className="text-base text-slate-400 font-bold">Brak plakatów w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-cyan-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm animate-toast flex items-center gap-3 border border-cyan-400 print-hidden">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-purple-500 to-cyan-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <i className="ph-bold ph-image text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduPlakat<span className="text-purple-400">AI PRO</span></span>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://buycoffee.to/magiccolor" target="_blank" className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all active:scale-95 text-sm shadow-md btn-bounce">
                                    <i className="ph-fill ph-coffee text-lg text-amber-400"></i><span className="hidden sm:block">Postaw Kawę</span>
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-4xl mx-auto">
                            
                            {/* ODBLOKOWANIE PREMIUM / BAZA WZORÓW */}
                            <div className="flex flex-col gap-4 mb-8">
                                {!isPremium ? (
                                    <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-purple-500/30 bg-purple-950/20">
                                        <div className="flex flex-col px-2">
                                            <span className="text-[10px] font-bold text-purple-300 uppercase tracking-widest">Darmowe użycia: {Math.max(0, 5 - usageCount)}/5</span>
                                            <span className="text-[9px] text-slate-400 font-bold">Wersja Free</span>
                                        </div>
                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-32 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-purple-500 transition-colors uppercase"/>
                                            <button onClick={handleVerifyCode} className="px-3 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs font-bold transition-all shadow-md btn-bounce">OK</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                        <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                        <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduPlakat PRO Aktywny</span>
                                    </div>
                                )}

                                <button onClick={() => setAppMode('gielda')} className="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-fuchsia-900/30 hover:border-fuchsia-500/50 transition-all shadow-md btn-bounce flex items-center justify-center gap-2">
                                    <i className="ph-bold ph-images text-lg text-fuchsia-400"></i> Galeria Plakatów (Giełda)
                                </button>
                            </div>

                            <div className="text-center mb-12 fade-in print-hidden">
                                <div className="inline-flex items-center gap-2 bg-purple-900/30 border border-purple-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-purple-400 uppercase tracking-widest mb-4">
                                    Dekoracje i Gazetki
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Twórz piękne <span className="text-gradient">plakaty szkolne.</span>
                                </h1>
                                <p className="text-slate-400 text-lg">
                                    Wpisz krótko co potrzebujesz. Nasz system <strong className="text-white">automatycznie rozbuduje Twój opis</strong> i przekaże do malarza AI!
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50 print-hidden" style={{animationDelay: '0.1s'}}>
                                
                                <div className="mb-8">
                                    <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider">Krok 1: Wybierz styl artystyczny</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <button 
                                            onClick={() => setStyleOption('akwarela')}
                                            className={`p-4 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-2 ${styleOption === 'akwarela' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <i className="ph-fill ph-palette text-3xl"></i> 
                                            <span>Akwarela</span>
                                            <span className="text-[10px] font-normal opacity-80 text-center">Miękkie, malarskie barwy. Idealne na Dzień Matki.</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('3d')}
                                            className={`p-4 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-2 ${styleOption === '3d' ? 'bg-cyan-600/20 border-cyan-500 text-cyan-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <i className="ph-fill ph-cube text-3xl"></i> 
                                            <span>Magiczne 3D</span>
                                            <span className="text-[10px] font-normal opacity-80 text-center">Styl bajkowy. Świetny dla przedszkolaków.</span>
                                        </button>
                                        <button 
                                            onClick={() => setStyleOption('plakat')}
                                            className={`p-4 rounded-xl border-2 font-bold text-sm transition-all flex flex-col items-center justify-center gap-2 ${styleOption === 'plakat' ? 'bg-pink-600/20 border-pink-500 text-pink-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                        >
                                            <i className="ph-fill ph-pen-nib text-3xl"></i> 
                                            <span>Nowoczesny Wektor</span>
                                            <span className="text-[10px] font-normal opacity-80 text-center">Czyste, płaskie kolory i kształty (Minimalizm).</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="mb-8 border-t border-slate-700/50 pt-6">
                                    <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider">Krok 2: Kształt (Proporcje)</label>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={() => setOrientationOption('3:4')} className={`flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all ${orientationOption === '3:4' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                            <div className="w-3 h-4 border-2 border-current rounded-sm"></div> Pionowy (Plakat)
                                        </button>
                                        <button onClick={() => setOrientationOption('4:3')} className={`flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all ${orientationOption === '4:3' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                            <div className="w-4 h-3 border-2 border-current rounded-sm"></div> Poziomy (Tablica)
                                        </button>
                                        <button onClick={() => setOrientationOption('1:1')} className={`flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all ${orientationOption === '1:1' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}>
                                            <div className="w-3.5 h-3.5 border-2 border-current rounded-sm"></div> Kwadrat
                                        </button>
                                    </div>
                                </div>

                                <label className="block text-white font-bold mb-4 text-lg">Krok 3: Co mam dzisiaj narysować?</label>
                                
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={promptInput}
                                        onChange={(e) => setPromptInput(e.target.value)}
                                        onKeyPress={(e) => { if(e.key === 'Enter') handleGeneratePoster(); }}
                                        placeholder="Wpisz po prostu: 'chłopiec i dziewczynka dają mamie kwiaty'"
                                        className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-purple-500 outline-none text-lg pr-16 shadow-inner"
                                    />
                                    <span className="absolute right-5 top-1/2 -translate-y-1/2 text-2xl">✨</span>
                                </div>

                                <div className="mt-6 flex flex-wrap gap-2">
                                    <span className="text-xs text-slate-500 font-bold uppercase mt-2 mr-2">Szybkie pomysły:</span>
                                    {['Mama z dziećmi, pełno kwiatów', 'Uśmiechnięta Ziemia w kosmosie', 'Jesienne drzewo, dużo liści', 'Sowa w birecie na książkach'].map(idea => (
                                        <button key={idea} onClick={() => setPromptInput(idea)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-lg border border-slate-700 transition-colors">
                                            {idea}
                                        </button>
                                    ))}
                                </div>

                                {error && <div className="mt-6 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>}

                                <div className="mt-10 flex justify-center">
                                    <button 
                                        onClick={handleGeneratePoster}
                                        disabled={generatingStatus !== '' || !promptInput}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(168,85,247,0.3)] btn-bounce uppercase tracking-widest
                                            ${generatingStatus !== '' ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-cyan-500 hover:scale-105'}`}
                                    >
                                        {generatingStatus !== '' ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> {generatingStatus}</>
                                        ) : (
                                            <><i className="ph-bold ph-magic-wand text-xl"></i> Zaprojektuj Plakat {!isPremium && `(${Math.max(0, 5 - usageCount)})`}</>
                                        )}
                                    </button>
                                </div>
                            </div>

                            {generatedImage && (
                                <div ref={resultRef} className="mt-12 fade-in print:mt-0 flex flex-col items-center">
                                    
                                    <div className="flex flex-col sm:flex-row items-center justify-between w-full mb-6 print-hidden gap-4">
                                        <h3 className="text-xl font-bold text-white text-center sm:text-left">Twój Gotowy Plakat</h3>
                                        <div className="flex gap-3 w-full sm:w-auto flex-col sm:flex-row">
                                            <button onClick={handleDownload} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 transition-all btn-bounce shadow-lg justify-center">
                                                <i className="ph-bold ph-download-simple text-xl"></i> Pobierz
                                            </button>
                                            <button onClick={handlePrint} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 transition-all btn-bounce shadow-lg justify-center">
                                                <i className="ph-bold ph-printer text-xl"></i> Drukuj
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`bg-white p-2 rounded-3xl magic-border shadow-2xl print:shadow-none print:p-0 w-full flex justify-center ${orientationOption === '3:4' ? 'max-w-[500px]' : (orientationOption === '4:3' ? 'max-w-[800px]' : 'max-w-[600px]')}`}>
                                        <img src={generatedImage} alt="Plakat edukacyjny" className="w-full h-auto rounded-2xl print-only-image" />
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
