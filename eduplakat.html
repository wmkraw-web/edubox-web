    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 

            // --- LOCAL STATES ---
            const [promptInput, setPromptInput] = useState('');
            const [styleOption, setStyleOption] = useState('3d'); 
            const [orientationOption, setOrientationOption] = useState('3:4'); // Proporcje
            
            const [generatedImage, setGeneratedImage] = useState(null);
            const [generatingStatus, setGeneratingStatus] = useState('');
            const [error, setError] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            const [textLayers, setTextLayers] = useState([]);
            const [isExporting, setIsExporting] = useState(false);

            // --- GENEROWANIE NA PODSTAWIE WZORU (upload obrazka jako inspiracji) ---
            const [refImage, setRefImage] = useState(null); // data:URL wgranego wzoru/przykładu
            const [refImageName, setRefImageName] = useState('');
            const [refImageMode, setRefImageMode] = useState('creative'); // 'close' = trzymaj się wzoru, 'creative' = tylko inspiracja

            const resultRef = useRef(null);
            const posterImgRef = useRef(null);

            const TEXT_FONTS = {
                jakarta: { label: 'Nowoczesna', css: "'Plus Jakarta Sans', sans-serif" },
                baloo: { label: 'Zaokrąglona', css: "'Baloo 2', sans-serif" },
                kalam: { label: 'Odręczna', css: "'Kalam', cursive" },
            };
            const TEXT_POSITIONS = { top: '6%', center: '46%', bottom: '82%' };

            const addTextLayer = () => {
                setTextLayers(prev => [...prev, {
                    id: Date.now() + Math.random(),
                    text: 'Twój tekst',
                    position: 'bottom',
                    fontSize: 44,
                    color: '#ffffff',
                    font: 'baloo'
                }]);
            };
            const updateTextLayer = (id, patch) => {
                setTextLayers(prev => prev.map(l => l.id === id ? { ...l, ...patch } : l));
            };
            const removeTextLayer = (id) => {
                setTextLayers(prev => prev.filter(l => l.id !== id));
            };

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO' || status === 'active') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_eduplakat', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (!generatedImage) {
                    showToast("Najpierw musisz wygenerować plakat!");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Plakat: ${promptInput.substring(0, 20)}...`;
                            const config = { promptInput, styleOption, orientationOption, generatedImage, textLayers };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_eduplakat', 'Plakat Szkolny', name, config);
                            showToast("✨ Udostępniono w Bazie Plakatów!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.generatedImage) {
                    if(c.promptInput) setPromptInput(c.promptInput);
                    if(c.styleOption) setStyleOption(c.styleOption);
                    if(c.orientationOption) setOrientationOption(c.orientationOption);
                    
                    setGeneratedImage(c.generatedImage);
                    setTextLayers(Array.isArray(c.textLayers) ? c.textLayers : []);
                    setAppMode('editor');
                    showToast("✨ Załadowano Plakat z Bazy!");
                    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                }
            };

            const handleRefImageUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                if (file.size > 4 * 1024 * 1024) {
                    setError('Plik jest za duży (max 4MB). Wybierz mniejsze zdjęcie.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => { setRefImage(ev.target.result); setRefImageName(file.name); };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            // GŁÓWNA FUNKCJA GENERUJĄCA
            const handleGeneratePoster = () => {
                // Opis tekstowy jest wymagany TYLKO jeśli nie ma wzoru - z samym wgranym zdjęciem
                // (image-to-image) AI ma już czym się kierować.
                if (!promptInput.trim() && !refImage) {
                    setError('Wpisz co ma być na plakacie, albo wgraj wzór/przykład w Kroku 4!');
                    return;
                }
                window.EduBoxCore.executeImageLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        generatePoster();
                    },
                    (msg) => { setError(''); showToast(msg); },
                    (msg) => showToast(msg)
                );
            };

            const generatePoster = async () => {
                setGeneratingStatus('1/2 Wzbogacam Twój opis (AI)...');
                setError('');
                setGeneratedImage(null);
                setTextLayers([]);

                try {
                    // Jeśli użytkownik nie wpisał opisu, a wgrał tylko wzór/zdjęcie - dajemy sensowny
                    // opis zastępczy, żeby krok "wzbogacania opisu przez AI" miał czym pracować.
                    const effectivePrompt = promptInput.trim() || 'A beautiful, harmonious children\'s educational poster illustration inspired by the uploaded reference image';

                    // ETAP 1: GPT-4o-mini REŻYSERUJE SCENĘ
                    let enhancedPrompt = effectivePrompt;
                    try {
                        const systemPrompt = `You are an expert AI image prompt engineer specializing in children's educational posters. The user will give you a simple idea in Polish.
                        Your job is to rewrite it into a highly detailed, physically logical, and descriptive image prompt IN ENGLISH.
                        CRITICAL RULES:
                        1. Define spatial relations clearly (e.g., 'A boy stands on the left holding a flower, handing it to his mother standing on the right').
                        2. Prevent object merging (ensure hands hold correct items, correct number of fingers, no floating limbs).
                        3. If there are people, clearly specify they are Caucasian/European.
                        4. Describe ONE clear, uncluttered focal composition — avoid busy backgrounds that would compete with text added later.
                        5. Leave a calm, visually simple margin near the top and bottom edges of the frame (plain sky, wall, floor, or soft color) so a caption can be placed there later without covering important details.
                        6. Keep it under 80 words.
                        7. Reply ONLY with the English prompt, nothing else.`;

                        const resChat = await fetch('/api/chat', {
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: effectivePrompt,
                                system: systemPrompt,
                                temperature: 0.7, 
                                model: "gpt-4o-mini" 
                            })
                        });
                        if (resChat.ok) { 
                            const dataChat = await resChat.json(); 
                            enhancedPrompt = dataChat.text.trim(); 
                        }
                    } catch(e) { console.log("GPT Enhancer failed, using original prompt."); }

                    // ETAP 2: GENEROWANIE OBRAZU
                    setGeneratingStatus('2/2 Malowanie arcydzieła...');

                    // Modyfikatory stylu
                    let styleModifier = "";
                    if (styleOption === 'akwarela') {
                        styleModifier = "beautiful watercolor painting, children's book illustration style, soft and harmonious, artistic masterpiece";
                    } else if (styleOption === '3d') {
                        styleModifier = "high quality 3D Pixar Disney animation style render, cute and cohesive, unreal engine 5";
                    } else if (styleOption === 'plakat') {
                        styleModifier = "flat vector illustration, modern poster art, clean design, minimalist";
                    }

                    // Informacja o orientacji
                    let orientationText = orientationOption === '3:4' ? 'Vertical portrait format.' : (orientationOption === '4:3' ? 'Horizontal landscape format.' : 'Square format.');

                    // Łączymy ulepszony przez GPT prompt ze stylem i zakazami
                    const fullPrompt = `${enhancedPrompt}. STYLE: ${styleModifier}. ${orientationText} ABSOLUTELY NO TEXT, no words, no letters, no signage, no captions, no watermarks. Perfect human anatomy, correct number of fingers.`;
                    const negativePrompt = "text, words, letters, signage, captions, watermark, logo, extra limbs, bad anatomy, deformed, missing fingers, extra fingers, mutated hands, ugly, poorly drawn, blurry, low quality";

                    // Rozbudowujemy paczkę wymiarów
                    let sizeParam = '1024x1024';
                    let widthParam = 1024;
                    let heightParam = 1024;
                    
                    if (orientationOption === '3:4') {
                        sizeParam = '1024x1792'; widthParam = 768; heightParam = 1024;
                    } else if (orientationOption === '4:3') {
                        sizeParam = '1792x1024'; widthParam = 1024; heightParam = 768;
                    }

                    // Jeśli użytkownik wgrał wzór/przykład - dokładamy go jako obraz startowy (image-to-image).
                    // "close" = niska siła zmiany (obraz ma zostać blisko wzoru), "creative" = wysoka siła
                    // zmiany (wzór to tylko inspiracja stylem/kompozycją, AI ma więcej swobody).
                    const extraParams = refImage
                        ? { init_image: refImage, image_strength: refImageMode === 'close' ? 0.4 : 0.75 }
                        : {};

                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: fullPrompt,
                            negative_prompt: negativePrompt,
                            aspect_ratio: orientationOption,
                            style_preset: styleOption,
                            size: sizeParam,
                            width: widthParam,
                            height: heightParam,
                            ...extraParams
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error || errData.message || `Błąd serwera (Status: ${response.status})`);
                    }
                    
                    const data = await response.json();
                    
                    let finalImage = data.imageUrl || data.image_url || data.url || (data.data && data.data[0] && data.data[0].url) || data.image;
                    
                    if (finalImage) {
                        if (finalImage.length > 1000 && !finalImage.startsWith('http') && !finalImage.startsWith('data:')) {
                            finalImage = `data:image/png;base64,${finalImage}`;
                        }
                        
                        setGeneratedImage(finalImage);
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź z API.");
                    }
                } catch (err) {
                    console.error("Błąd generacji:", err);
                    setError(`Wystąpił problem z backendem: ${err.message}. Spróbuj ponownie.`);
                } finally {
                    setGeneratingStatus('');
                }
            };

            // Buduje HTML nakładki tekstowej (używane zarówno w podglądzie na ekranie jak i przy drukowaniu)
            const buildTextOverlayHtml = () => textLayers.map(l => `
                <div style="position:absolute; left:5%; width:90%; top:${TEXT_POSITIONS[l.position] || TEXT_POSITIONS.bottom}; transform:translateY(-50%); text-align:center; font-family:${TEXT_FONTS[l.font]?.css || TEXT_FONTS.baloo.css}; font-size:${l.fontSize}px; font-weight:800; color:${l.color}; -webkit-text-stroke: 2px rgba(0,0,0,0.55); text-shadow: 0 2px 6px rgba(0,0,0,0.5); line-height:1.15; white-space:pre-wrap; word-break:break-word;">${(l.text || '').replace(/</g,'&lt;')}</div>
            `).join('');

            const handleDownload = async () => {
                if (!generatedImage) return;
                if (textLayers.length === 0) {
                    const a = document.createElement('a');
                    a.href = generatedImage;
                    a.download = `EduPlakat_${new Date().getTime()}.png`;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return;
                }

                setIsExporting(true);
                try {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = generatedImage;
                    });

                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    textLayers.forEach(l => {
                        const fontSizePx = (l.fontSize / 500) * canvas.width; // skalujemy względem szerokości obrazka
                        ctx.font = `800 ${fontSizePx}px ${TEXT_FONTS[l.font]?.css || TEXT_FONTS.baloo.css}`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const yPct = parseFloat(TEXT_POSITIONS[l.position] || TEXT_POSITIONS.bottom) / 100;
                        const x = canvas.width / 2;
                        const y = canvas.height * yPct;
                        const maxWidth = canvas.width * 0.9;

                        ctx.lineWidth = fontSizePx * 0.12;
                        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
                        ctx.strokeText(l.text, x, y, maxWidth);
                        ctx.fillStyle = l.color;
                        ctx.fillText(l.text, x, y, maxWidth);
                    });

                    const dataUrl = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = `EduPlakat_${new Date().getTime()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } catch (e) {
                    console.error('Błąd eksportu z tekstem:', e);
                    showToast('Nie udało się zapisać wersji z tekstem — spróbuj "Drukuj" zamiast pobierania.');
                } finally {
                    setIsExporting(false);
                }
            };

            const handlePrint = () => {
                if (generatedImage) {
                    const windowContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Twój Plakat - EduPlakat PRO</title>
                            <style>
                                @page { margin: 0; }

                                                            <input type="color" value={l.color} onChange={e => updateTextLayer(l.id, { color: e.target.value })} className="w-9 h-9 rounded-lg border border-slate-700 bg-slate-900 cursor-pointer" />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
