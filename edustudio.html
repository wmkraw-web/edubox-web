    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { slate: { 950: '#020617' } }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
            margin: 0; padding: 0;
        }

        /* Magiczne Aury w tle - Motyw Indigo & Emerald (EduStudio) */
        .aura-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #4f46e5, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #10b981, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -40px) scale(1.05); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }

        .text-gradient { background: linear-gradient(135deg, #6366f1 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .magic-border { position: relative; }
        .magic-border::before {
            content: ''; position: absolute; inset: -3px;
            background: linear-gradient(45deg, #6366f1, #10b981, #6366f1);
            border-radius: inherit; z-index: -1;
            animation: borderGlow 3s linear infinite; background-size: 200% 200%;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Print Rules - V3 Standard */
        @media print {
            body { background: white !important; color: black !important; background-image: none !important; }
            .aura-blob { display: none !important; }
            .print-hidden { display: none !important; }
            .print-only-image { display: block !important; width: 100% !important; height: auto !important; max-height: 95vh; object-fit: contain; margin: 0 auto; }
            .glass-panel { background: transparent !important; border: none !important; box-shadow: none !important; color: black !important; filter: none !important; backdrop-filter: none !important; padding: 0 !important; }
            .magic-border::before { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; size: auto; }
        }
    </style>

  <link rel="canonical" href="https://eduboxpro.pl/edustudio.html">
  <meta name="description" content="Generator wierszy, rymowanek i scenariuszy dialogowych do wykorzystania na lekcji lub w mediach społecznościowych.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon"></head>
<body class="custom-scrollbar">
    <script>window.EDUBOX_IMAGE_APP = true;</script>

    
    <!-- Kontener na globalne menu -->
    <div id="wspolne-menu-kontener" class="print-hidden"></div>
    
    <div id="root"></div>

        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === APP STATE ===
            const [promptInput, setPromptInput] = useState('');
            const [styl, setStyl] = useState('photographic');
            const [kadr, setKadr] = useState('close-up');
            const [oswietlenie, setOswietlenie] = useState('studio');
            const [proporcje, setProporcje] = useState('1024x1024');
            
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);
            
            const resultRef = useRef(null);

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'artworks_market',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS ===
            const fetchEduBoxImage = async (basePrompt, styleParam, cameraParam, lightParam, ratioParam) => {
                const styleModifiers = {
                    'photographic': 'photorealistic, highly detailed 8k photograph, award-winning photography, flawless resolution',
                    '3d-model': 'cute 3d render, modern disney pixar animation style, beautiful 3d graphics, adorable',
                    'digital-art': 'modern flat vector art, clean lines, minimalist illustration, bold vibrant colors',
                    'watercolor': 'beautiful watercolor painting, artistic, soft vibrant colors, classic storybook illustration'
                };
                const cameraModifiers = {
                    'close-up': 'extreme close-up shot, highly detailed face focus, tight framing on the subject',
                    'full-body': 'full body shot, showing entire subject from head to toe, zoomed out',
                    'wide-angle': 'wide angle landscape shot, scenic environment, showing vast beautiful background'
                };
                const lightingModifiers = {
                    'studio': 'professional bright studio lighting, clean rim light, sharp focus',
                    'sunlight': 'bright natural sunlight, golden hour, warm lighting, sun rays',
                    'cinematic': 'cinematic lighting, magical glowing atmosphere, beautiful glowing colors',
                    'moody': 'moody dark lighting, dramatic shadows, mysterious atmosphere, high contrast'
                };

                const hiddenInstruction = `MAIN SUBJECT: ${basePrompt}. CAMERA ANGLE: ${cameraModifiers[cameraParam]}. LIGHTING: ${lightingModifiers[lightParam]}. STYLE: ${styleModifiers[styleParam]}. Masterpiece, perfect composition, purely visual art. ABSOLUTELY NO TEXT, no words, no letters, no watermarks.`;
                
                const [width, height] = ratioParam.split('x').map(Number);
                
                let aspectRatio = "1:1";
                if(ratioParam === "1344x768") aspectRatio = "16:9";
                if(ratioParam === "768x1344") aspectRatio = "9:16";

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: hiddenInstruction,
                        aspect_ratio: aspectRatio,
                        width: width,
                        height: height
                    })
                });
                
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                
                let imgUrl = data.imageUrl || data.image_url || data.url || (data.data && data.data[0]?.url) || data.image;
                if (imgUrl && imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                    imgUrl = `data:image/png;base64,${imgUrl}`;
                }
                return imgUrl;
            };

            // === LOGIC ===
            const generateArtwork = () => {
                if (!promptInput.trim()) { showToast('Wpisz najpierw, co ma być tematem grafiki!', 'error'); return; }
                
                window.EduBoxCore.executeImageLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setIsGenerating(true);
                        setGeneratedImage(null);
                        
                        try {
                            const imgData = await fetchEduBoxImage(promptInput, styl, kadr, oswietlenie, proporcje);
                            if(imgData) {
                                setGeneratedImage(imgData);
                                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                            } else {
                                throw new Error("Brak danych obrazu");
                            }
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd pobierania obrazu. Upewnij się, że serwer API jest aktywny.', 'error');
                        } finally {
                            setIsGenerating(false);
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const publishToGielda = async () => {
                if(!generatedImage) return;
                setIsSavingToGielda(true);
                try {
                    const configToSave = { 
                        promptInput, styl, kadr, oswietlenie, proporcje, imageUrl: generatedImage
                    };
                    const shortTitle = promptInput.substring(0, 30) + (promptInput.length > 30 ? '...' : '');
                    
                    await window.EduBoxCore.saveToGielda('artworks_market', 'EduStudio', shortTitle, configToSave);
                    showToast("Opublikowano na Giełdzie Grafiki! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error"); // Core wyrzuci błąd, jeśli grafika B64 będzie za ciężka (>1MB)
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setPromptInput(item.config.promptInput || '');
                setStyl(item.config.styl || 'photographic');
                setKadr(item.config.kadr || 'close-up');
                setOswietlenie(item.config.oswietlenie || 'studio');
                setProporcje(item.config.proporcje || '1024x1024');
                setGeneratedImage(item.config.imageUrl || null);
                setAppMode('generator');
                showToast("Wczytano projekt ze Studio!", "info");
                setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
            };

            const handleDownload = () => {
                if (generatedImage) {
                    const a = document.createElement('a');
                    a.href = generatedImage;
                    a.download = `EduStudio_${new Date().getTime()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };

            const printDocument = () => {
                window.print();
            };

            // === RENDERERS ===
            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex shadow-2xl">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                            <i className="ph-bold ph-palette text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-indigo-400">Studio</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Ciemnia Graficzna
                        </button>
                        <button onClick={() => setAppMode('gielda')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'gielda' ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-image text-lg"></i> Giełda Grafiki
                        </button>

                        <div className="mt-auto pt-6 border-t border-slate-800 space-y-4">
                            <div className="bg-slate-950 rounded-xl p-4 border border-slate-800">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase">Status Konta</span>
                                    {isPremium ? <span className="bg-gradient-to-r from-amber-400 to-orange-500 text-black text-[10px] px-2 py-0.5 rounded-full font-black tracking-wide">PRO MAX</span> 
                                               : <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">DARMOWE</span>}
                                </div>
                                
                                {!isPremium && (
                                    <>
                                        <div className="flex justify-between text-sm mb-1 mt-3">
                                            <span className="text-slate-400">Wygenerowano:</span>
                                            <span className="font-bold text-white">{usages} / 2</span>
                                        </div>
                                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                                            <div className="bg-indigo-500 h-full" style={{width: `${(usages/2)*100}%`}}></div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <input type="text" value={accessCode} onChange={e=>setAccessCode(e.target.value)} placeholder="Wpisz kod PRO..." className="w-full bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-white outline-none focus:border-indigo-500" />
                                            <button onClick={handleVerifyCode} className="w-full bg-slate-800 hover:bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg transition-colors">Odblokuj Limity</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // === GIEŁDA VIEW ===
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans">
                        <div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div>
                        {renderSidebar()}
                        {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}
                        
                        <div className="flex-1 p-8">
                            <h2 className="text-3xl font-black mb-2 text-white">Giełda Grafiki</h2>
                            <p className="text-slate-400 mb-8">Eksploruj przepiękne ilustracje stworzone przez innych nauczycieli.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                {gieldaItems.map(item => (
                                    <div key={item.id} className="glass-panel p-4 rounded-2xl flex flex-col hover:border-indigo-500/50 transition-colors group">
                                        <div className="w-full h-48 bg-slate-900 rounded-xl mb-4 overflow-hidden border border-slate-800 relative">
                                            {item.config.imageUrl ? (
                                                <img src={item.config.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-600"><i className="ph-thin ph-image text-4xl"></i></div>
                                            )}
                                        </div>
                                        <h3 className="text-sm font-bold text-white mb-1 line-clamp-2">"{item.config.promptInput}"</h3>
                                        <div className="flex gap-2 text-[10px] text-slate-400 mb-4 flex-wrap">
                                            <span className="bg-slate-800 px-2 py-1 rounded">{item.config.styl}</span>
                                            <span className="bg-slate-800 px-2 py-1 rounded">{item.config.proporcje}</span>
                                        </div>
                                        <div className="mt-auto flex gap-2">
                                            <button onClick={() => loadFromGielda(item)} className="w-full bg-slate-800 hover:bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold transition-colors">
                                                Otwórz w Studio
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {gieldaItems.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500">
                                        <i className="ph-thin ph-cloud-slash text-6xl mb-4"></i>
                                        <p>Brak udostępnionych grafik w bazie.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // === GENERATOR VIEW ===
            return (
                <div className="min-h-screen flex pl-0 md:pl-80 bg-transparent font-sans relative">
                    <div className="aura-blob aura-1 print-hidden"></div><div className="aura-blob aura-2 print-hidden"></div>
                    
                    {renderSidebar()}
                    
                    {toast.visible && <div className={`fixed top-6 right-6 z-[9999] px-6 py-3 rounded-xl font-bold shadow-2xl transition-all ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-slate-900'}`}>{toast.message}</div>}

                    <div className="flex-1 p-4 md:p-8 xl:p-12 overflow-y-auto">
                        <div className="max-w-4xl mx-auto print-hidden">
                            
                            {/* Nagłówek */}
                            <div className="text-center mb-10">
                                <div className="inline-flex items-center gap-2 bg-indigo-900/30 border border-indigo-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 backdrop-blur-sm">
                                    Profesjonalne Studio Graficzne
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Perfekcyjna grafika <span className="text-gradient">na wyciągnięcie ręki.</span>
                                </h1>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto font-medium">
                                    Zostaw długie inżynieryjne polecenia innym. Wpisz temat edukacyjny i steruj stylem, światłem oraz kadrem za pomocą prostych suwaków!
                                </p>
                            </div>

                            {/* Panel Sterowania */}
                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] border border-slate-700/50">
                                <label className="block text-white font-bold mb-4 text-lg">1. Co ma być na obrazku?</label>
                                <div className="relative mb-8">
                                    <input 
                                        type="text" 
                                        value={promptInput}
                                        onChange={(e) => setPromptInput(e.target.value)}
                                        placeholder="Np. Nauczycielka czytająca książkę, kosmos, złoty puchar..."
                                        className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-indigo-500 outline-none text-lg pr-16"
                                    />
                                    <span className="absolute right-6 top-1/2 -translate-y-1/2 text-xl text-indigo-400"><i className="ph-fill ph-magic-wand"></i></span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 bg-slate-800/30 p-6 rounded-2xl border border-slate-700/50">
                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-palette"></i> Styl grafiki</label>
                                        <select value={styl} onChange={e => setStyl(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer appearance-none">
                                            <option value="photographic">Fotografia (Ultra Realizm)</option>
                                            <option value="3d-model">Magiczne 3D (Styl Pixar/Disney)</option>
                                            <option value="digital-art">Nowoczesny Wektor / Płaski</option>
                                            <option value="watercolor">Klasyczna Akwarela (Książkowa)</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-camera"></i> Kadr (Kamera)</label>
                                        <select value={kadr} onChange={e => setKadr(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer appearance-none">
                                            <option value="close-up">Zbliżenie (Detale twarzy / przedmiotu)</option>
                                            <option value="full-body">Pełna sylwetka (Z oddali)</option>
                                            <option value="wide-angle">Szeroki plan (Z tłem / krajobraz)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-lightbulb-filament"></i> Oświetlenie</label>
                                        <select value={oswietlenie} onChange={e => setOswietlenie(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer appearance-none">
                                            <option value="studio">Jasne Studyjne (Czyste, katalogowe)</option>
                                            <option value="sunlight">Złota Godzina (Słoneczne, ciepłe)</option>
                                            <option value="cinematic">Magiczne (Filmowe, jaskrawe akcenty)</option>
                                            <option value="moody">Mroczne (Cienie, tajemnica)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider flex items-center gap-2"><i className="ph-bold ph-aspect-ratio"></i> Proporcje</label>
                                        <select value={proporcje} onChange={e => setProporcje(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer appearance-none">
                                            <option value="1024x1024">Kwadrat (1:1 - na stronę, social media)</option>
                                            <option value="1344x768">Poziom (16:9 - na Rzutnik / Prezentację)</option>
                                            <option value="768x1344">Pion (9:16 - Ulotka / Smartfon)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="mt-8 flex justify-end">
                                    <button 
                                        onClick={generateArtwork}
                                        disabled={isGenerating || !promptInput.trim()}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(99,102,241,0.3)]
                                            ${isGenerating ? 'bg-slate-700 opacity-70 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-emerald-500 hover:scale-105 active:scale-95'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Praca w Studio...</>
                                        ) : <><i className="ph-bold ph-camera-rotate text-xl"></i> Wygeneruj Obraz</>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* WYNIKI */}
                        {generatedImage && (
                            <div ref={resultRef} className="max-w-4xl mx-auto mt-12 print:mt-0 print:block">
                                
                                <div className="flex justify-end gap-3 mb-6 print-hidden">
                                    <button onClick={publishToGielda} disabled={isSavingToGielda} className="bg-purple-900/40 border border-purple-500/40 text-purple-300 hover:bg-purple-800 hover:text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm disabled:opacity-50">
                                        <i className="ph-bold ph-globe text-lg"></i> Zapisz na Giełdzie
                                    </button>
                                    <button onClick={handleDownload} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-md">
                                        <i className="ph-bold ph-download-simple text-lg"></i> Pobierz Plik
                                    </button>
                                    <button onClick={printDocument} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-md">
                                        <i className="ph-bold ph-printer text-lg"></i> Drukuj Powiekszone
                                    </button>
                                </div>

                                <div className="bg-white p-2 rounded-3xl magic-border shadow-2xl print:shadow-none print:border-none print:p-0 print:rounded-none w-full flex justify-center">
                                    {/* Obraz dopasowuje się poprawnie, a przy druku zajmuje maksymalnie kartkę */}
                                    <img src={generatedImage} alt="Wygenerowana Grafika EduStudio" className="max-w-full h-auto max-h-[70vh] rounded-2xl print-only-image" />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
