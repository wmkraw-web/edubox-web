<!DOCTYPE html>
<html lang="pl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>EduStudio AI - Studio Graficzne</title>
    <!-- Biblioteki -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* Stylistyka EduStudio to Indygowy i Szmaragdowy kolor (Indigo & Emerald) */
        .aura-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .aura-1 { top: -10%; left: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #4f46e5, transparent 70%); }
        .aura-2 { top: 40%; right: -10%; width: 50vw; height: 600px; background: radial-gradient(circle, #10b981, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.05); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .text-gradient { background: linear-gradient(135deg, #6366f1 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-bounce:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .magic-border { position: relative; }
        .magic-border::before {
            content: ''; position: absolute; inset: -4px;
            background: linear-gradient(45deg, #6366f1, #10b981, #6366f1);
            border-radius: inherit; z-index: -1;
            animation: borderGlow 3s linear infinite; background-size: 200% 200%;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media print {
            body { background-color: white !important; color: black !important; }
            .print-hidden { display: none !important; }
            .print-only-image { 
                display: block !important; 
                width: 100% !important; 
                height: 100% !important; 
                object-fit: contain;
                margin: 0 auto;
                box-shadow: none !important;
            }
            .glass-panel, .magic-border::before { display: none !important; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const SECRET_PIN = "KAWA2024"; 
            const BUY_COFFEE_LINK = "https://buycoffee.to/eduboxpro";
            const FREE_TRIES_LIMIT = 3;

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [freeTries, setFreeTries] = useState(0);
            const [showPaywall, setShowPaywall] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            
            // Zmienne formularza "Studia"
            const [promptInput, setPromptInput] = useState('');
            const [styl, setStyl] = useState('photographic');
            const [kadr, setKadr] = useState('close-up');
            const [oswietlenie, setOswietlenie] = useState('studio');
            const [proporcje, setProporcje] = useState('1024x1024');
            
            const [generatedImage, setGeneratedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState('');
            const resultRef = useRef(null);

            useEffect(() => {
                const savedAuth = localStorage.getItem('eduStudioAuth') === 'true';
                if (savedAuth) setIsAuthenticated(true);
                const savedTries = parseInt(localStorage.getItem('eduStudioFreeTries') || '0');
                setFreeTries(savedTries);
            }, []);

            const secureApiCall = async (payload) => {
                try {
                    // Najpierw zawsze próbujemy uderzyć w nasz główny serwer
                    const res = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payload, type: 'image' })
                    });
                    
                    if (res.ok) return await res.json();
                    
                    // Jeśli endpoint nie istnieje (bo jesteśmy w trybie podglądu lokalnie)
                    if (res.status === 404 || res.status === 405) {
                        throw new Error("USE_FALLBACK");
                    }
                    
                    const errData = await res.json();
                    throw new Error(errData.error || `Status API: ${res.status}`);
                    
                } catch (e) {
                    // Tryb testowy Fallback - chroni przed wyrzuceniem błędu 401 w konsoli bez wyjaśnienia
                    if (e.message === "USE_FALLBACK" || e.message.includes("Failed to fetch") || e.message.includes("Unexpected token")) {
                        const apiKey = ""; // API Key dla środowiska Google
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                        
                        const aspectRatioMap = { "1024x1024": "1:1", "1344x768": "16:9", "768x1344": "9:16" };
                        const previewPayload = {
                            instances: { prompt: payload.instances.prompt },
                            parameters: { sampleCount: 1, aspectRatio: aspectRatioMap[payload.width + "x" + payload.height] || "1:1" }
                        };

                        const fallbackRes = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(previewPayload)
                        });
                        
                        // Złapanie błędu 401 w sposób "miękki"
                        if (!fallbackRes.ok) {
                            throw new Error("Wgraj ten plik na serwer Vercel, aby połączyć się z siecią. Testujesz środowisko bez kluczy dostępu!");
                        }
                        return await fallbackRes.json();
                    }
                    throw e;
                }
            };

            const generateArtwork = async () => {
                if (!isAuthenticated && freeTries >= FREE_TRIES_LIMIT) {
                    setShowPaywall(true); return;
                }
                if (!promptInput.trim()) {
                    setError('Wpisz co ma być głównym tematem grafiki!'); return;
                }

                setIsGenerating(true);
                setError('');
                setGeneratedImage(null);

                try {
                    // Słowniki modyfikatorów
                    const styleModifiers = {
                        'photographic': 'photorealistic, highly detailed 8k photograph, award-winning photography, flawless resolution',
                        '3d-model': 'cute 3d render, modern disney pixar animation style, beautiful 3d graphics, adorable',
                        'digital-art': 'modern flat vector art, clean lines, minimalist illustration, bold vibrant colors',
                        'watercolor': 'beautiful watercolor painting, artistic, soft vibrant colors, classic storybook illustration'
                    };
                    
                    const cameraModifiers = {
                        'close-up': 'extreme close-up shot, highly detailed face focus, tight framing on the subject',
                        'full-body': 'full body shot, showing entire subject from head to toe, zoomed out',
                        'wide-angle': 'wide angle landscape shot, scenic environment, showing vast beautiful background'
                    };
                    
                    const lightingModifiers = {
                        'studio': 'professional bright studio lighting, clean rim light, sharp focus',
                        'sunlight': 'bright natural sunlight, golden hour, warm lighting, sun rays',
                        'cinematic': 'cinematic lighting, magical glowing atmosphere, beautiful glowing colors',
                        'moody': 'moody dark lighting, dramatic shadows, mysterious atmosphere, high contrast'
                    };

                    const [width, height] = proporcje.split('x').map(Number);
                    
                    // Magiczna konstrukcja idealnego prompta
                    const hiddenInstruction = `MAIN SUBJECT: ${promptInput}. CAMERA ANGLE: ${cameraModifiers[kadr]}. LIGHTING: ${lightingModifiers[oswietlenie]}. STYLE: ${styleModifiers[styl]}. Masterpiece, perfect composition, purely visual art.`;
                    
                    const negativePrompt = "text, words, letters, alphabet, numbers, writing, signature, watermark, typography, font, title, heading, label, graphic design layout, poster layout, greeting card, book cover, ugly faces, bad anatomy, mutated hands, poorly drawn faces, disfigured, deformed, distorted, blurry, low resolution, bad proportions";

                    const payload = {
                        prompt: hiddenInstruction, 
                        negative_prompt: negativePrompt, 
                        style_preset: styl,
                        width: width,
                        height: height,
                        instances: { prompt: hiddenInstruction }, 
                        parameters: { sampleCount: 1 }
                    };

                    const data = await secureApiCall(payload);
                    const base64Image = data.predictions?.[0]?.bytesBase64Encoded || data.artifacts?.[0]?.base64 || data.image; 
                    
                    if (base64Image) {
                        const finalImage = base64Image.startsWith('data:image') ? base64Image : `data:image/png;base64,${base64Image}`;
                        setGeneratedImage(finalImage);
                        
                        if (!isAuthenticated) {
                            const newTries = freeTries + 1;
                            setFreeTries(newTries);
                            localStorage.setItem('eduStudioFreeTries', newTries.toString());
                        }
                        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
                    } else {
                        throw new Error("Pusta odpowiedź API.");
                    }
                } catch (err) {
                    console.error(err);
                    setError(err.message || 'Wystąpił problem z przetworzeniem żądania. Spróbuj ponownie.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleLogin = () => {
                if (passwordInput === SECRET_PIN) {
                    setIsAuthenticated(true);
                    setShowPaywall(false);
                    localStorage.setItem('eduStudioAuth', 'true');
                } else {
                    alert('Nieprawidłowy kod PIN!');
                }
            };

            const handleDownload = () => {
                if (generatedImage) {
                    const a = document.createElement('a');
                    a.href = generatedImage;
                    a.download = `EduStudio_${new Date().getTime()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };

            const handlePrint = () => {
                if (generatedImage) {
                    const windowContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Wydruk z EduStudio</title>
                            <style>
                                @page { margin: 0; }
                                html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #fff; overflow: hidden; }
                                .print-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
                                img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
                            </style>
                        </head>
                        <body>
                            <div class="print-container">
                                <img src="${generatedImage}" />
                            </div>
                        </body>
                        </html>
                    `;
                    const printWin = window.open('', '', 'width=800,height=800');
                    printWin.document.open();
                    printWin.document.write(windowContent);
                    printWin.document.close();
                    
                    setTimeout(() => {
                        printWin.focus();
                        printWin.print();
                        printWin.close();
                    }, 500);
                }
            };

            if (showPaywall) {
                return (
                    <div className="min-h-screen relative flex items-center justify-center p-4 print-hidden">
                        <div className="aura-blob aura-1"></div>
                        <div className="aura-blob aura-2"></div>
                        
                        <div className="glass-panel p-10 rounded-3xl max-w-md w-full text-center shadow-[0_0_50px_rgba(99,102,241,0.2)] border border-indigo-500/30 fade-in relative z-10">
                            <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <h2 className="text-3xl font-black text-white mb-2">Limit wyczerpany!</h2>
                            <p className="text-slate-300 text-sm mb-8 font-medium">Wykorzystałeś swoje darmowe próby ({FREE_TRIES_LIMIT}/{FREE_TRIES_LIMIT}). Podaj kod PIN, aby uzyskać nielimitowany dostęp PRO.</p>
                            
                            <input 
                                type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)}
                                onKeyPress={(e) => { if (e.key === 'Enter') handleLogin(); }}
                                placeholder="Wpisz PIN..."
                                className="w-full bg-slate-900 border border-slate-600 text-center text-white rounded-xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none mb-6 text-2xl tracking-[0.5em] font-bold uppercase"
                            />
                            
                            <button 
                                onClick={handleLogin}
                                className="w-full bg-gradient-to-r from-indigo-600 to-emerald-500 hover:from-indigo-500 hover:to-emerald-400 text-white font-black py-4 rounded-xl transition-all transform hover:scale-105 btn-bounce text-lg shadow-lg mb-4"
                            >
                                Odblokuj System
                            </button>
                            <button onClick={() => setShowPaywall(false)} className="text-slate-400 hover:text-white text-sm font-bold mb-8">
                                Wróć do strony głównej
                            </button>
                            <div className="pt-6 border-t border-slate-700/50">
                                <a href={BUY_COFFEE_LINK} target="_blank" rel="noopener noreferrer" className="w-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-3 text-sm btn-bounce hover:border-emerald-500/50 hover:text-emerald-400 shadow-md">
                                    <span className="text-xl">☕</span> Postaw Kawę i odbierz PIN
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="aura-blob aura-1 print-hidden"></div>
                    <div className="aura-blob aura-2 print-hidden"></div>

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <span className="text-white text-xl">🎛️</span>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">EduStudio<span className="text-indigo-400">AI PRO</span></span>
                            </div>
                            <div className="flex items-center gap-4">
                                {!isAuthenticated ? (
                                    <div className="bg-slate-800/80 border border-slate-600 px-3 py-1.5 rounded-full text-xs font-bold text-slate-300 flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        Darmowe próby: {FREE_TRIES_LIMIT - freeTries}
                                    </div>
                                ) : (
                                    <div className="bg-emerald-500/20 border border-emerald-500/50 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-400 flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                        Konto PRO Aktywne
                                    </div>
                                )}
                                <a href="index.html" className="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-300 hover:text-white transition-colors bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl border border-slate-600">
                                    Wróć
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-4xl mx-auto">
                            
                            <div className="text-center mb-12 fade-in print-hidden">
                                <div className="inline-flex items-center gap-2 bg-indigo-900/30 border border-indigo-500/30 px-4 py-1.5 rounded-full text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4">
                                    Profesjonalne Studio
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Perfekcyjna grafika <span className="text-gradient">na wyciągnięcie ręki.</span>
                                </h1>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                                    Zostaw długie opisy dla innych. Wpisz temat i steruj kadrem, oświetleniem oraz proporcjami za pomocą prostych suwaków!
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50 print-hidden" style={{animationDelay: '0.1s'}}>
                                
                                <label className="block text-white font-bold mb-4 text-lg">1. Co ma być na obrazku?</label>
                                <div className="relative mb-8">
                                    <input 
                                        type="text" 
                                        value={promptInput}
                                        onChange={(e) => setPromptInput(e.target.value)}
                                        placeholder="Np. Nauczycielka czytająca książkę, kosmos, złoty puchar..."
                                        className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-indigo-500 outline-none text-lg pr-16"
                                    />
                                    <span className="absolute right-5 top-1/2 -translate-y-1/2 text-2xl">✨</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 bg-slate-800/30 p-6 rounded-2xl border border-slate-700/50">
                                    
                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider">🎨 Styl grafiki</label>
                                        <select value={styl} onChange={e => setStyl(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                                            <option value="photographic">Fotografia (Ultra Realizm)</option>
                                            <option value="3d-model">Magiczne 3D (Pixar)</option>
                                            <option value="digital-art">Nowoczesny Wektor</option>
                                            <option value="watercolor">Klasyczna Akwarela</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider">📸 Kadr (Kamera)</label>
                                        <select value={kadr} onChange={e => setKadr(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                                            <option value="close-up">Zbliżenie (Detale twarzy / przedmiotu)</option>
                                            <option value="full-body">Pełna sylwetka (Z oddali)</option>
                                            <option value="wide-angle">Szeroki plan (Z tłem / krajobraz)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider">💡 Oświetlenie</label>
                                        <select value={oswietlenie} onChange={e => setOswietlenie(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                                            <option value="studio">Jasne Studyjne (Czyste)</option>
                                            <option value="sunlight">Złota Godzina (Słoneczne)</option>
                                            <option value="cinematic">Magiczne (Filmowe, jaskrawe kolory)</option>
                                            <option value="moody">Mroczne (Cienie i tajemnica)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-300 text-sm font-bold mb-2 uppercase tracking-wider">📐 Proporcje</label>
                                        <select value={proporcje} onChange={e => setProporcje(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                                            <option value="1024x1024">Kwadrat (1:1 - np. na Social Media)</option>
                                            <option value="1344x768">Poziom (16:9 - na Rzutnik / Prezentację)</option>
                                            <option value="768x1344">Pion (9:16 - na Smartfona / Ulotkę)</option>
                                        </select>
                                    </div>

                                </div>

                                {error && <div className="mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-xl text-red-400 text-sm font-medium text-center">{error}</div>}

                                <div className="mt-8 flex justify-center">
                                    <button 
                                        onClick={generateArtwork}
                                        disabled={isGenerating || !promptInput}
                                        className={`w-full sm:w-auto px-12 py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(99,102,241,0.3)] btn-bounce
                                            ${isGenerating ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-emerald-500 hover:scale-105'}`}
                                    >
                                        {isGenerating ? (
                                            <><svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Praca w Studio...</>
                                        ) : (!isAuthenticated && freeTries >= FREE_TRIES_LIMIT ? 'Odblokuj dostęp PRO' : 'Wygeneruj Perfekcyjny Obraz')}
                                    </button>
                                </div>
                            </div>

                            {generatedImage && (
                                <div ref={resultRef} className="mt-12 fade-in print:mt-0 flex flex-col items-center">
                                    <div className="flex flex-col sm:flex-row items-center justify-between w-full mb-6 print-hidden gap-4">
                                        <h3 className="text-xl font-bold text-white text-center sm:text-left">Dzieło Gotowe</h3>
                                        <div className="flex gap-3 w-full sm:w-auto flex-col sm:flex-row">
                                            <button onClick={handleDownload} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 transition-all btn-bounce shadow-lg justify-center">
                                                📥 Pobierz
                                            </button>
                                            <button onClick={handlePrint} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 transition-all btn-bounce shadow-lg justify-center">
                                                🖨️ Drukuj Powiekszone
                                            </button>
                                        </div>
                                    </div>
                                    <div className="bg-white p-2 rounded-3xl magic-border shadow-2xl print:shadow-none print:p-0 w-full flex justify-center">
                                        {/* Styl gwarantujący dobre skalowanie każdego formatu */}
                                        <img src={generatedImage} alt="EduStudio Artwork" className="max-w-full h-auto max-h-[70vh] rounded-2xl print-only-image" />
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
