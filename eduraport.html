<body>
    <div id="wspolne-menu-kontener" class="print-hidden"></div>

    <div id="root" class="h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const parseAIResponse = (aiOutput) => {
            if (aiOutput && typeof aiOutput === 'object') {
                if (aiOutput.report) return aiOutput;
                if (aiOutput.text) aiOutput = aiOutput.text;
                else if (aiOutput.content) aiOutput = aiOutput.content;
            }
            let text = String(aiOutput || "").trim();
            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try {
                const startObj = text.indexOf('{');
                const endObj = text.lastIndexOf('}');
                if (startObj !== -1 && endObj !== -1 && startObj < endObj) {
                    let jsonStr = text.substring(startObj, endObj + 1);
                    jsonStr = jsonStr.replace(/,\s*([\]}])/g, '$1');
                    try { return JSON.parse(jsonStr); } catch (e1) { return JSON.parse(jsonStr.replace(/[\n\r\t]+/g, ' ')); }
                }
                throw new Error("Brak nawiasów JSON.");
            } catch (e) {
                console.error("Błąd parsowania:", text, e);
                throw new Error("BŁĄD Z SERWERA: Niepoprawny format dokumentu.");
            }
        };

        const fetchTextAI = async (prompt, systemInstruction) => {
            const finalPrompt = `INSTRUKCJA: Zwróć DOKŁADNIE i WYŁĄCZNIE czysty kod JSON. Nie używaj znaczników markdown. Używaj wyłącznie apostrofów ('), unikaj cudzysłowów (") wewnątrz tekstów.\n\n${systemInstruction}\n\nZADANIE DO WYKONANIA:\n${prompt}`;
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, system: systemInstruction, format: "json" })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.text || data.response || data.message || data.content || data;
                } else {
                    const errData = await res.text();
                    throw new Error(`Błąd serwera: Przekroczono czas lub ${res.status}`);
                }
            } catch(e) { throw new Error("Brak połączenia z serwerem API. " + e.message); }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('kreator'); 
            const [isPremium, setIsPremium] = useState(false);
            const [premiumCode, setPremiumCode] = useState('');
            const [aiGenerations, setAiGenerations] = useState(0);
            const [message, setMessage] = useState(null);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [genStatus, setGenStatus] = useState(''); // ZMIANA: Status widoczny na przycisku
            const [resultData, setResultData] = useState(null);

            // Stan formularza
            const [reportType, setReportType] = useState('Sprawozdanie z wycieczki / wydarzenia');
            const [eventName, setEventName] = useState('');
            const [eventDate, setEventDate] = useState(new Date().toISOString().split('T')[0]); 
            const [groupName, setGroupName] = useState('Pszczółki');
            const [rawNotes, setRawNotes] = useState('');

            const [marketItems, setMarketItems] = useState([]);
            const [isFetchingMarket, setIsFetchingMarket] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            useEffect(() => {
                const initDb = () => {
                    if (typeof window !== 'undefined' && window.EduBoxCore) window.EduBoxCore.init((u) => setUser(u));
                    else setTimeout(initDb, 100);
                };
                initDb();
                
                try {
                    const savedGens = window.localStorage.getItem('edubox_eduraport_ai');
                    if (savedGens) setAiGenerations(parseInt(savedGens));
                    const savedPremium = window.localStorage.getItem('edubox_premium');
                    const sharedPro = window.localStorage.getItem('eduboxProStatus') === 'active' || window.localStorage.getItem('eduAwansPremium') === 'active';
                    if (savedPremium === 'unlocked' || sharedPro) setIsPremium(true);
                } catch (e) {}
            }, []);

            const showMessage = (text, type = 'success') => {
                setMessage({ text, type });
                setTimeout(() => setMessage(null), 3500);
            };

            const handlePremiumCheck = async () => {
                const __res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: premiumCode })
                });
                const __data = await __res.json();
                if (__data.valid) {
                    setIsPremium(true);
                    try {
                        if (__data.bonus === true && __data.until) {
                            window.localStorage.setItem('eduboxBonusUntil', __data.until);
                            window.localStorage.setItem('eduboxProStatus', 'active');
                        } else {
                            window.localStorage.setItem('edubox_premium', 'unlocked');
                        }
                    } catch(e) {}
                    setPremiumCode('');
                    showMessage('Kod Premium zaakceptowany!', 'success');
                } else { showMessage('Nieprawidłowy kod', 'error'); }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => showMessage('Skopiowano do schowka!', 'success'));
            };

            const generateContent = async () => {
                if (!rawNotes.trim()) { showMessage('Opisz krótko wydarzenie.', 'error'); return; }
                if (!isPremium && aiGenerations >= 3) { showMessage('Limit darmowych generacji wyczerpany.', 'error'); return; }
                
                setIsGenerating(true);
                setGenStatus('Wysyłanie wytycznych...');
                setResultData(null);

                // ZMIANA: Timery do uspokajania użytkownika, gdy AI długo myśli
                const timer1 = setTimeout(() => setGenStatus('Analiza metodyczna...'), 4000);
                const timer2 = setTimeout(() => setGenStatus('Pisanie opisu i celów...'), 9000);
                const timer3 = setTimeout(() => setGenStatus('Dokument jest długi, proszę o cierpliwość...'), 16000);
                const timer4 = setTimeout(() => setGenStatus('Ostatnie szlify...'), 26000);

                // ZMIANA: Skrócony wymóg w prompcie, aby zapobiec timeoutom Vercela
                const sysPrompt = `Jesteś doradcą metodycznym i ekspertem ds. dokumentacji w edukacji. Twoim zadaniem jest zamienić luźne notatki nauczyciela na profesjonalne, obiektywne sprawozdanie (gotowe do przedstawienia Dyrekcji).
Używaj bogatego słownictwa pedagogicznego. Pisz w sposób podniosły i formalny. Zwróć uwagę na podaną datę realizacji i użyj czasu przeszłego. Bądź konkretny, aby dokument był rzeczowy i wyczerpujący.

WYMÓG: Zwróć DOKŁADNIE TEN SZABLON JSON:
{
  "report": {
    "title": "Oficjalny tytuł sprawozdania (np. Sprawozdanie z realizacji...)",
    "introduction": "Wstęp i ramy organizacyjne. Formalny opis kto, gdzie, kiedy i dlaczego wziął udział w wydarzeniu.",
    "objectives": ["Cel główny", "Cel szczegółowy 1", "Cel szczegółowy 2"],
    "description": "Profesjonalny opis przebiegu wydarzenia ubrany w język pedagogiczny (np. 'wychowankowie mieli możliwość swobodnej eksploracji'). Minimum 2 rozbudowane akapity.",
    "conclusions": "Wnioski z realizacji, osiągnięte rezultaty edukacyjne i wychowawcze."
  },
  "tip": "Krótka wskazówka metodyczna."
}`;

                const prompt = `Typ dokumentu: ${reportType}
Nazwa wydarzenia / Imię osoby: ${eventName}
Data realizacji wydarzenia: ${eventDate}
Grupa: ${groupName}
Luźne notatki (rozbuduj je i ubierz w język metodyczny): ${rawNotes}`;

                try {
                    const aiText = await fetchTextAI(prompt, sysPrompt);
                    const parsedJson = parseAIResponse(aiText);
                    
                    setResultData({ data: parsedJson, params: { reportType, eventName, groupName, eventDate } });
                    
                    if (!isPremium) {
                        const newCount = aiGenerations + 1;
                        setAiGenerations(newCount);
                        try { window.localStorage.setItem('edubox_eduraport_ai', newCount.toString()); } catch(e) {}
                    }
                    showMessage('Wygenerowano sprawozdanie!', 'success');
                } catch (error) { 
                    showMessage(error.message, 'error'); 
                } finally { 
                    clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
                    setGenStatus('');
                    setIsGenerating(false); 
                }
            };

            const publishToMarket = async () => {
                if (!resultData || !user) { showMessage('Błąd autoryzacji bazy. Zaloguj się lub odśwież stronę.', 'error'); return; }
                setIsPublishing(true);
                try {
                    await window.EduBoxCore.saveToGielda('eduraport_market', 'eduraport', eventName || reportType, resultData);
                    showMessage('Opublikowano w Bazie Wzorów!', 'success');
                    setAppMode('gielda');
                } catch (error) { showMessage(error.message || 'Błąd publikacji.', 'error'); } 
                finally { setIsPublishing(false); }
            };

            useEffect(() => {
                let unsubscribe = null;
                if (appMode === 'gielda') {
                    setIsFetchingMarket(true);
                    const checkAndSub = () => {
                        if(window.EduBoxCore && window.EduBoxCore.subscribeToGielda) {
                            unsubscribe = window.EduBoxCore.subscribeToGielda('eduraport_market', (items) => {
                                setMarketItems(items);
                                setIsFetchingMarket(false);
                            }, (err) => { setIsFetchingMarket(false); });
                        } else { setTimeout(checkAndSub, 100); }
                    };
                    checkAndSub();
                }
                return () => { if (unsubscribe) unsubscribe(); }
            }, [appMode]);

            const formatDate = (dateStr) => {
                if (!dateStr) return '---';
                const d = new Date(dateStr);
                return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('pl-PL');
            };

            const renderResult = () => {
                if (!resultData || !resultData.data) return (
                    <div className="h-full flex flex-col items-center justify-center text-emerald-500/30 no-print">
                        <i className="ph-fill ph-file-text text-7xl mb-6 animate-pulse"></i>
                        <p className="font-bold text-center text-lg text-emerald-100/50">Wpisz luźne hasła z wycieczki lub wydarzenia,<br/>a AI ułoży z tego urzędowe sprawozdanie.</p>
                    </div>
                );

                const { report, tip } = resultData.data;
                const { groupName, eventDate } = resultData.params;

                return (
                    <div className="space-y-8 animate-[reveal_0.4s_ease-out]">
                        <div className="bg-white text-slate-900 rounded-lg overflow-hidden print-card shadow-2xl relative">
                            <div className="p-10 md:p-14">
                                <div className="text-center border-b-2 border-slate-900 pb-6 mb-8">
                                    <h2 className="text-3xl font-black uppercase tracking-widest font-serif leading-tight">{report.title}</h2>
                                    <div className="flex flex-col sm:flex-row justify-center items-center gap-2 sm:gap-8 text-xs mt-4 font-semibold text-slate-600 uppercase tracking-wider">
                                        <p>Data sporządzenia: <span className="text-slate-900 font-bold">{formatDate(new Date())}</span></p>
                                        <p className="hidden sm:block text-slate-300">•</p>
                                        <p>Data realizacji: <span className="text-emerald-700 font-bold">{formatDate(eventDate)}</span></p>
                                        <p className="hidden sm:block text-slate-300">•</p>
                                        <p>Grupa: <span className="text-slate-900 font-bold">{groupName}</span></p>
                                    </div>
                                </div>
                                
                                <div className="mb-8">
                                    <h3 className="font-bold uppercase text-xs tracking-wider text-emerald-700 mb-2">1. Wstęp i ramy organizacyjne</h3>
                                    <p className="font-medium text-slate-800 leading-relaxed text-justify">{report.introduction}</p>
                                </div>

                                <div className="mb-8">
                                    <h3 className="font-bold uppercase text-xs tracking-wider text-emerald-700 mb-2">2. Założenia i cele (Podstawa Programowa)</h3>
                                    <ul className="list-disc pl-5 space-y-2 text-slate-800 font-medium">
                                        {/* ZMIANA: Zabezpieczenie na wypadek, gdyby AI zwróciło tekst zamiast listy */}
                                        {Array.isArray(report.objectives) 
                                            ? report.objectives.map((obj, i) => <li key={i}>{obj}</li>)
                                            : <li>{report.objectives}</li>
                                        }
                                    </ul>
                                </div>

                                <div className="mb-8">
                                    <h3 className="font-bold uppercase text-xs tracking-wider text-emerald-700 mb-2">3. Przebieg i opis realizacji</h3>
                                    <div className="text-slate-800 leading-relaxed whitespace-pre-wrap text-justify font-medium">
                                        {report.description}
                                    </div>
                                </div>

                                <div className="mb-16">
                                    <h3 className="font-bold uppercase text-xs tracking-wider text-emerald-700 mb-2">4. Wnioski końcowe i ewaluacja</h3>
                                    <div className="text-slate-800 leading-relaxed whitespace-pre-wrap bg-slate-50 p-6 border border-slate-200 rounded-md font-medium">
                                        {report.conclusions}
                                    </div>
                                </div>

                                <div className="flex justify-end mt-20 pt-10 border-t border-slate-300">
                                    <div className="text-center w-1/3">
                                        <div className="border-b border-slate-400 h-10 mb-2"></div>
                                        <p className="text-xs text-slate-500 uppercase tracking-wider">Podpis Sporządzającego</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-6 flex gap-4 no-print shadow-lg">
                            <i className="ph-fill ph-lightbulb text-emerald-400 text-3xl shrink-0"></i>
                            <div>
                                <h4 className="font-bold text-emerald-400 mb-1 uppercase tracking-widest text-xs">Wskazówka od Metodyka</h4>
                                <p className="text-sm text-emerald-200/80 leading-relaxed">{tip}</p>
                            </div>
                        </div>

                        <div className="mt-10 bg-slate-900/50 border border-emerald-500/30 rounded-3xl p-8 text-center relative overflow-hidden group no-print shadow-xl backdrop-blur-sm">
                            <div className="relative z-10">
                                <h3 className="text-xl font-bold text-white mb-2">Podziel się na Giełdzie</h3>
                                <p className="text-slate-400 text-sm mb-6 max-w-lg mx-auto">Zachowaj ten wzór sprawozdania na Giełdzie, by ułatwić życie innym nauczycielom piszącym ewaluacje.</p>
                                <button 
                                    onClick={publishToMarket} disabled={isPublishing}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-10 rounded-xl shadow-[0_0_20px_rgba(5,150,105,0.4)] transition-all flex items-center justify-center gap-3 mx-auto disabled:opacity-50"
                                >
                                    {isPublishing ? <i className="ph-bold ph-spinner animate-spin text-2xl"></i> : <i className="ph-bold ph-cloud-arrow-up text-2xl"></i>} 
                                    Zapisz do Bazy Wzorów
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 overflow-hidden relative selection:bg-emerald-500/30">
                    <div className="aura-container no-print"><div className="aura-blob aura-1"></div><div className="aura-blob aura-2"></div><div className="aura-blob aura-3"></div></div>

                    {message && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl flex items-center gap-2 animate-bounce ${message.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'}`}>
                            <i className={`ph-bold ${message.type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i> {message.text}
                        </div>
                    )}

                    <aside className="w-80 flex-shrink-0 bg-slate-900/90 backdrop-blur-xl border-r border-slate-800 flex flex-col h-full z-10 no-print transition-all duration-300">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-700 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                                <i className="ph-bold ph-check-square-offset text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight text-white leading-none uppercase">EduRaport</h1>
                                <p className="text-[10px] text-emerald-400 font-bold tracking-wider uppercase mt-1">Ewaluacje i Sprawozdania</p>
                            </div>
                        </div>

                        <div className="px-4 py-3 flex gap-2 border-b border-slate-800">
                            <button onClick={() => setAppMode('kreator')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'kreator' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                <i className="ph-bold ph-pencil-simple"></i> Utwórz
                            </button>
                            <button onClick={() => setAppMode('gielda')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${appMode === 'gielda' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                <i className="ph-bold ph-files"></i> Wzory
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            {appMode === 'kreator' && (
                                <>
                                    <div className="space-y-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-inner">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Co opisujemy?</label>
                                            <select value={reportType} onChange={e => setReportType(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500">
                                                <option>Sprawozdanie z wycieczki / wydarzenia</option>
                                                <option>Sprawozdanie z realizacji innowacji / projektu</option>
                                                <option>Opinia mentora o nauczycielu początkującym</option>
                                                <option>Ewaluacja akcji charytatywnej</option>
                                            </select>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Nazwa wycieczki / wydarzenia / nauczyciela</label>
                                            <input type="text" value={eventName} onChange={e => setEventName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 transition-colors" placeholder="np. Wycieczka na Farmę Rzeszowską" />
                                        </div>
                                        
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Data wydarzenia / realizacji</label>
                                            <input 
                                                type="date" 
                                                value={eventDate} 
                                                onChange={e => setEventDate(e.target.value)} 
                                                className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 transition-colors" 
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Grupa docelowa (oddział)</label>
                                            <input type="text" value={groupName} onChange={e => setGroupName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 transition-colors" />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Twoje szybkie notatki (co się działo?)</label>
                                            <textarea value={rawNotes} onChange={e => setRawNotes(e.target.value)} className="w-full h-32 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 transition-colors resize-none" placeholder="Napisz luzem, np. rano pojechaliśmy autokarem, dzieci oglądały zwierzęta domowe, potem jedliśmy kiełbaski... AI ubierze to w cele dydaktyczne." />
                                        </div>
                                    </div>

                                    <div className="space-y-3 pt-2">
                                        <button onClick={generateContent} disabled={isGenerating} className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all flex items-center justify-center gap-2">
                                            {isGenerating ? (
                                                <><i className="ph-bold ph-spinner animate-spin text-xl"></i> <span className="text-sm">{genStatus}</span></>
                                            ) : (
                                                <><i className="ph-bold ph-magic-wand text-xl"></i> Wygeneruj Sprawozdanie</>
                                            )}
                                        </button>
                                        
                                        {resultData && (
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2 text-xs">
                                                    <i className="ph-bold ph-printer text-lg"></i> PDF 
                                                </button>
                                                <button onClick={() => copyToClipboard(resultData.data.report.description)} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all flex justify-center items-center gap-2 text-xs">
                                                    <i className="ph-bold ph-copy text-lg"></i> Kopiuj 
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}

                            {appMode === 'gielda' && (
                                <div className="space-y-4 pb-6">
                                    <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4 text-center">
                                        <i className="ph-fill ph-files text-3xl text-emerald-400 mb-2"></i>
                                        <h3 className="text-sm font-bold text-white mb-1">Baza Ewaluacji</h3>
                                        <p className="text-[10px] text-slate-400">Przeglądaj sprawozdania z innowacji i wycieczek udostępnione przez innych.</p>
                                    </div>

                                    {isFetchingMarket ? (
                                        <div className="flex justify-center py-10"><i className="ph-bold ph-spinner animate-spin text-3xl text-slate-500"></i></div>
                                    ) : marketItems.length === 0 ? (
                                        <div className="text-center py-10 text-slate-500 text-xs font-bold">Brak wzorów w bazie.</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {marketItems.map(item => (
                                                <div key={item.id} className="bg-slate-800 rounded-xl p-4 border border-slate-700 hover:border-emerald-500 transition-colors group cursor-pointer" onClick={() => { setResultData(item.config); setAppMode('kreator'); showMessage('Wczytano dokument!', 'success'); }}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs font-black text-white flex items-center gap-1 line-clamp-1"><i className="ph-fill ph-file-text text-emerald-400"></i> {item.config?.data?.report?.title || item.name}</span>
                                                    </div>
                                                    <p className="text-[10px] text-slate-300 italic line-clamp-2 mb-2">{item.config?.data?.report?.introduction}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            {!isPremium ? (
                                <div className="space-y-2 mb-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Status PRO</span>
                                        <span className="text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded-full">{3 - aiGenerations} darmowe</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={premiumCode} onChange={(e) => setPremiumCode(e.target.value)} placeholder="Kod Premium" className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-emerald-500 uppercase" />
                                        <button onClick={handlePremiumCheck} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 transition-all">OK</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex items-center gap-3 bg-gradient-to-r from-emerald-500/10 to-teal-500/10 border border-emerald-500/30 p-3 rounded-xl mb-2">
                                    <i className="ph-fill ph-crown text-2xl text-emerald-400"></i>
                                    <div><p className="text-xs font-bold text-white">Wersja PRO MAX</p><p className="text-[9px] text-emerald-300">Wszystkie limity odblokowane</p></div>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-12 print-container relative">
                            <div className="max-w-4xl mx-auto pb-32">
                                {renderResult()}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
