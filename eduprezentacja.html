    <!-- ========================================================= -->
    <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek)    -->
    <!-- ========================================================= -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const FIREBASE_CONFIG = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : {};
        const APP_ID = window.__app_id || "eduboxpro";

        let app, auth, db, currentUser = null;
        let isInitialized = false;

        window.EduBoxCore = {
            init: (onUserLoad) => {
                if (!isInitialized && FIREBASE_CONFIG.apiKey) {
                    app = initializeApp(FIREBASE_CONFIG);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    signInAnonymously(auth).catch(e => console.error("Firebase Auth Error:", e));
                    isInitialized = true;
                    
                    window.EduBoxCore.loadMenu();
                }
                
                if (auth) {
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if(onUserLoad) onUserLoad(user);
                    });
                }
            },

            loadMenu: () => {
                const container = document.getElementById('wspolne-menu-kontener');
                if (container) {
                    fetch('/menu.html')
                        .then(r => r.text())
                        .then(html => { container.innerHTML = html; })
                        .catch(err => console.log('Brak pliku menu lokalnie.', err));
                }
            },

            getUsageCount: () => {
                const today = new Date().toISOString().split('T')[0];
                let usageStr = localStorage.getItem('eduboxUsage');
                if (usageStr) {
                    try {
                        const parsed = JSON.parse(usageStr);
                        if (parsed.date === today) return parsed.count;
                    } catch(e) {}
                }
                return 0;
            },

            executeWithLimitCheck: (isPremium, onSuccess, onLimitReached, onToastUpdate) => {
                const status = localStorage.getItem('eduboxProStatus');
                if (status === 'PRO' || isPremium) {
                    onSuccess(window.EduBoxCore.getUsageCount());
                    return;
                }
                
                let currentCount = window.EduBoxCore.getUsageCount();
                if (currentCount >= 5) {
                    onLimitReached("⚠️ Dzienny limit użyć (5/5) wyczerpany. Wpisz kod odblokowujący na górze!");
                    return;
                }
                
                const newCount = currentCount + 1;
                const today = new Date().toISOString().split('T')[0];
                localStorage.setItem('eduboxUsage', JSON.stringify({ date: today, count: newCount }));
                
                if(onToastUpdate) onToastUpdate(`Wykorzystano ${newCount}/5 darmowych działań`);
                onSuccess(newCount);
            },

            verifyPremiumCode: (code) => {
                return code.toUpperCase() === 'KAWA2024';
            },

            saveToGielda: async (collectionName, appType, itemName, config) => {
                if (!currentUser) throw new Error("Brak połączenia z chmurą. Odśwież stronę.");
                
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                const payload = {
                    userId: currentUser.uid,
                    createdAt: serverTimestamp(),
                    type: appType,
                    name: itemName,
                    config: config
                };

                if (JSON.stringify(payload).length > 950000) {
                    throw new Error("🚨 Prezentacja jest zbyt duża (Max 1MB). Usunięto kilka obrazków przed zapisem.");
                }

                await addDoc(publicRef, payload);
            },

            subscribeToGielda: (collectionName, onDataLoaded, onError) => {
                if (!db) return () => {};
                
                const publicRef = collection(db, 'artifacts', APP_ID, 'public', 'data', collectionName);
                return onSnapshot(publicRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    onDataLoaded(loaded);
                }, onError);
            }
        };

        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

    <!-- GŁÓWNY KONTENER REACT -->
    <div id="root" class="flex-grow flex flex-col relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- V3 PRO MAX STATES (CORE) ---
            const [coreReady, setCoreReady] = useState(!!window.EduBoxCore);
            const [appMode, setAppMode] = useState('editor'); // 'editor', 'gielda', 'presentation'
            const [isPremium, setIsPremium] = useState(false);
            const [accessCode, setAccessCode] = useState('');
            const [user, setUser] = useState(null);
            const [patterns, setPatterns] = useState([]);
            const [usageCount, setUsageCount] = useState(0); 
            const [toastMessage, setToastMessage] = useState('');

            // --- LOCAL STATES ---
            const [topic, setTopic] = useState('');
            const [gradeLevel, setGradeLevel] = useState('Klasy 4-6 SP');
            const [slideCount, setSlideCount] = useState('5');
            const [generatingStep, setGeneratingStep] = useState(0); // 0-none, 1-text, 2-images, 3-done
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [loadingStatus, setLoadingStatus] = useState('');
            
            const [slides, setSlides] = useState([]);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            // --- INICJALIZACJA EDUBOX CORE ---
            useEffect(() => {
                if (!coreReady) {
                    const handleReady = () => setCoreReady(true);
                    window.addEventListener('EduBoxCoreReady', handleReady);
                    return () => window.removeEventListener('EduBoxCoreReady', handleReady);
                }
            }, [coreReady]);

            useEffect(() => {
                if (coreReady && window.EduBoxCore) {
                    window.EduBoxCore.init((loadedUser) => setUser(loadedUser));
                    setUsageCount(window.EduBoxCore.getUsageCount());
                    const status = localStorage.getItem('eduboxProStatus');
                    if(status === 'PRO') setIsPremium(true);
                }
            }, [coreReady]);

            // Nasłuchiwanie Giełdy
            useEffect(() => {
                if (!user || !coreReady || !window.EduBoxCore) return;
                const unsubscribe = window.EduBoxCore.subscribeToGielda('gielda_wzorow_eduprezentacja', 
                    (loadedData) => setPatterns(loadedData),
                    (error) => console.error("Błąd odczytu Giełdy:", error)
                );
                return () => unsubscribe();
            }, [user, coreReady]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleVerifyCode = () => {
                if (window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    setIsPremium(true); 
                    setAccessCode(''); 
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    showToast('Odblokowano Premium! 🌟'); 
                } else { 
                    showToast('Błędny kod dostępu!'); 
                }
            };

            // --- GIEŁDA WZORÓW ACTIONS ---
            const sharePattern = async () => {
                if (slides.length === 0) {
                    showToast("Musisz najpierw wygenerować prezentację!");
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsageCount(newCount);
                        try {
                            const name = `Prezentacja: ${topic.substring(0, 20)}...`;
                            // Optymalizacja rozmiaru (usunięcie dużych obrazków B64 przed zapisem, zostawienie tylko pierwszych dwóch, żeby zmieścić się w 1MB)
                            const optimizedSlides = slides.map((s, idx) => {
                                if(idx > 2 && s.imageUrl && s.imageUrl.length > 500) {
                                    return {...s, imageUrl: null}; // usuwamy ciężkie obrazy od 4 slajdu wzwyż w bazie
                                }
                                return s;
                            });
                            
                            const config = { topic, gradeLevel, slides: optimizedSlides };
                            
                            await window.EduBoxCore.saveToGielda('gielda_wzorow_eduprezentacja', 'Prezentacja PPTX', name, config);
                            showToast("✨ Udostępniono w Bazie Prezentacji!");
                        } catch (e) {
                            showToast(e.message || "🚨 Błąd podczas zapisu w chmurze.");
                        }
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const loadPattern = (pattern) => {
                const c = pattern.config;
                if(c && c.slides) {
                    if(c.topic) setTopic(c.topic);
                    if(c.gradeLevel) setGradeLevel(c.gradeLevel);
                    setSlides(c.slides);
                    
                    setAppMode('editor');
                    showToast("✨ Załadowano Prezentację. Niektóre obrazki mogły zostać zoptymalizowane.");
                }
            };

            // --- GENERATOR AI ---
            const handleGenerate = () => {
                if (!topic.trim()) {
                    showToast('Wpisz temat prezentacji!');
                    return;
                }
                window.EduBoxCore.executeWithLimitCheck(isPremium,
                    (newCount) => {
                        setUsageCount(newCount);
                        startGeneration();
                    },
                    (msg) => showToast(msg),
                    (msg) => showToast(msg)
                );
            };

            const startGeneration = async () => {
                setGeneratingStep(1);
                setLoadingProgress(10);
                setLoadingStatus('Piszę profesjonalny scenariusz merytoryczny...');
                setSlides([]);

                try {
                    const systemPrompt = `Jesteś ekspertem ds. edukacji tworzącym prezentacje multimedialne. 
                    Wygeneruj zawartość prezentacji w formacie JSON.
                    Język slajdów: POLSKI. Język promptów (imagePrompt): ANGIELSKI.
                    
                    STRUKTURA JSON:
                    {
                        "title": "Tytuł całej prezentacji",
                        "slides": [
                            {
                                "title": "Tytuł slajdu (krótki)",
                                "bullets": ["Zwięzły punkt 1", "Zwięzły punkt 2", "Zwięzły punkt 3"],
                                "imagePrompt": "Angielski opis obrazka ilustrującego ten slajd, np. A photo of ancient Rome architecture. MUST BE IN ENGLISH. NO TEXT ON IMAGE."
                            }
                        ]
                    }`;

                    const userPrompt = `Stwórz prezentację składającą się z ${slideCount} slajdów.
                    Temat: ${topic}
                    Poziom: ${gradeLevel}`;

                    const resChat = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: userPrompt, 
                            system: systemPrompt, 
                            temperature: 0.6,
                            model: "gpt-4o-mini",
                            format: "json"
                        })
                    });

                    if (!resChat.ok) throw new Error("Błąd podczas generowania tekstu.");
                    
                    const dataChat = await resChat.json();
                    let cleanText = dataChat.text;
                    
                    if (cleanText.includes('"reasoning_content"')) {
                        const startIdx = cleanText.indexOf('"content":"');
                        if (startIdx !== -1) {
                            let extracted = cleanText.substring(startIdx + 11).replace(/"\s*}\s*$/, '').replace(/"$/, ''); 
                            cleanText = extracted.replace(/\\n/g, '\n').replace(/\\"/g, '"'); 
                        }
                    } else {
                        try { const outerObj = JSON.parse(cleanText); if(outerObj.content) cleanText = outerObj.content; else if (outerObj.choices) cleanText = outerObj.choices[0].message.content; } catch(e){}
                    }
                    
                    cleanText = cleanText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                    let jsonStr = cleanText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    let presentationObj;
                    try {
                        if (jsonStr.indexOf('{') !== -1) {
                            jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
                            presentationObj = JSON.parse(jsonStr);
                        } else { throw new Error("No JSON"); }
                    } catch(e) {
                        console.warn("Fallback JSON parser");
                        presentationObj = {
                            title: topic,
                            slides: [{ title: "Wprowadzenie", bullets: ["Błąd w strukturze AI", "Wygenerowano domyślny slajd"], imagePrompt: "Abstract background" }]
                        };
                    }

                    const initialSlides = presentationObj.slides || [];
                    setGeneratingStep(2);
                    setLoadingStatus('Rysuję ilustracje do slajdów w chmurze...');
                    setLoadingProgress(30);

                    // Pobieranie obrazków (sekwencyjnie, żeby nie przeciążyć API)
                    const updatedSlides = [];
                    for (let i = 0; i < initialSlides.length; i++) {
                        let slide = { ...initialSlides[i] };
                        setLoadingProgress(30 + Math.floor((i / initialSlides.length) * 60));
                        
                        try {
                            const fullPrompt = `${slide.imagePrompt}. High quality educational illustration, vivid colors, clear subject, isolated focus, photorealistic or high end digital art. ABSOLUTELY NO TEXT, NO WORDS, NO LETTERS, NO WATERMARKS.`;
                            
                            const resImg = await fetch('/api/generate', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    prompt: fullPrompt, 
                                    negative_prompt: "text, words, letters, watermark, blurry, deformed, ugly",
                                    aspect_ratio: "16:9",
                                    size: "1024x576" 
                                })
                            });

                            if (resImg.ok) {
                                const dataImg = await resImg.json();
                                let imgUrl = dataImg.imageUrl || dataImg.image_url || dataImg.url || (dataImg.data && dataImg.data[0]?.url) || dataImg.image;
                                
                                if (imgUrl) {
                                    if (imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                                        imgUrl = `data:image/png;base64,${imgUrl}`;
                                    }
                                    slide.imageUrl = imgUrl;
                                }
                            }
                        } catch(e) { console.error(`Błąd obrazka slajd ${i}:`, e); }
                        
                        updatedSlides.push(slide);
                    }

                    setSlides(updatedSlides);
                    setCurrentSlideIndex(0);
                    setGeneratingStep(3);
                    setLoadingProgress(100);
                    
                    setTimeout(() => {
                        setGeneratingStep(0);
                        setAppMode('presentation');
                    }, 800);

                } catch (error) {
                    console.error(error);
                    showToast(`Wystąpił problem: ${error.message}`);
                    setGeneratingStep(0);
                }
            };

            const downloadPPTX = () => {
                if (slides.length === 0 || !window.pptxgen) return;
                showToast("Buduję plik PowerPoint. To potrwa chwilę...");
                
                try {
                    let pres = new window.pptxgen();
                    pres.layout = 'LAYOUT_16x9';

                    // Slajd Tytułowy
                    let slideTitle = pres.addSlide();
                    slideTitle.background = { color: "020617" }; // Dark bg
                    slideTitle.addText(topic.toUpperCase(), { x: "10%", y: "40%", w: "80%", h: "20%", fontSize: 44, color: "ffffff", bold: true, align: "center" });
                    slideTitle.addText(gradeLevel, { x: "10%", y: "65%", w: "80%", h: "10%", fontSize: 24, color: "3b82f6", align: "center" });

                    // Slajdy z zawartością
                    slides.forEach((s, idx) => {
                        let slide = pres.addSlide();
                        let isEven = idx % 2 === 0;

                        // Layout zależy od tego czy jest parzysty czy nieparzysty (lewo/prawo)
                        let textX = isEven ? "5%" : "55%";
                        let textW = "40%";
                        let imgX = isEven ? "50%" : "0%";
                        let imgW = "50%";

                        // Tytuł Slajdu
                        slide.addText(s.title, { x: textX, y: "10%", w: textW, h: "15%", fontSize: 32, bold: true, color: "1e3a8a" });
                        
                        // Lista Punktowana
                        let bulletOptions = { x: textX, y: "30%", w: textW, h: "60%", fontSize: 20, color: "333333", bullet: true, margin: 10 };
                        if (s.bullets && s.bullets.length > 0) {
                            let textArr = s.bullets.map(b => ({ text: b, options: { bullet: true, breakLine: true } }));
                            slide.addText(textArr, bulletOptions);
                        }

                        // Obrazek
                        if (s.imageUrl) {
                            try {
                                slide.addImage({ data: s.imageUrl, x: imgX, y: "0%", w: imgW, h: "100%", sizing: { type: 'cover' } });
                            } catch(e) { console.log("Nie udało się dodać obrazka", e); }
                        }
                    });

                    // Zapis
                    pres.writeFile({ fileName: `EduPrezentacja_${topic.replace(/\s+/g, '_')}.pptx` })
                        .then(() => showToast("Pobrano plik PPTX!"))
                        .catch(err => { console.error(err); showToast("Błąd przy pakowaniu PPTX."); });
                } catch(e) {
                    console.error("PPTXGen Error", e);
                    showToast("Wystąpił błąd w bibliotece generującej PPTX.");
                }
            };

            // Sterowanie Klawiaturą
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (appMode !== 'presentation') return;
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        setCurrentSlideIndex(prev => Math.min(slides.length - 1, prev + 1));
                    } else if (e.key === 'ArrowLeft') {
                        setCurrentSlideIndex(prev => Math.max(0, prev - 1));
                    } else if (e.key === 'Escape') {
                        setAppMode('editor');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [appMode, slides.length]);

            if (!coreReady) {
                return <div className="min-h-screen flex items-center justify-center text-white">Trwa ładowanie silnika EduBoxCore...</div>;
            }

            // RENDER: Giełda Wzorów
            if (appMode === 'gielda') {
                return (
                    <div className="min-h-screen relative flex flex-col font-sans">
                        <div className="hero-glow print-hidden"></div>

                        {toastMessage && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[300] bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-2xl transition-all duration-300 border border-blue-400">
                                {toastMessage}
                            </div>
                        )}
                        
                        <div className="max-w-4xl mx-auto px-4 pt-32 pb-24 w-full relative z-10 print-hidden">
                            <div className="glass-panel p-8 rounded-3xl shadow-2xl flex flex-col h-[800px] border-t-4 border-fuchsia-500">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-700/50 pb-4">
                                    <h2 className="text-3xl font-black text-fuchsia-400 flex items-center gap-3"><i className="ph-bold ph-presentation text-4xl"></i> Baza Prezentacji</h2>
                                    <button onClick={() => setAppMode('editor')} className="text-white bg-slate-800 border border-slate-600 hover:bg-slate-700 px-5 py-2.5 rounded-xl text-sm font-bold uppercase transition-all active:scale-95 shadow-md flex items-center gap-2"><i className="ph-bold ph-arrow-left"></i> Wróć</button>
                                </div>
                                
                                <button onClick={sharePattern} className="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white p-4 rounded-xl font-bold text-sm mb-8 shadow-lg transition-all btn-bounce flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cloud-arrow-up text-xl"></i> Udostępnij swoją wygenerowaną Prezentację
                                </button>

                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Prezentacje gotowe do pokazania</h3>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar pr-2 pb-10">
                                    {patterns.map(p => (
                                        <div key={p.id} className="bg-slate-900/50 border border-slate-700 p-3 rounded-2xl hover:border-fuchsia-500 transition-colors cursor-pointer group flex flex-col shadow-lg" onClick={() => loadPattern(p)}>
                                            <div className="aspect-video bg-slate-800 rounded-xl overflow-hidden mb-3 relative flex items-center justify-center">
                                                {p.config?.slides?.[0]?.imageUrl ? (
                                                    <img src={p.config.slides[0].imageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Podgląd" loading="lazy" />
                                                ) : (
                                                    <i className="ph-duotone ph-presentation text-4xl text-slate-600"></i>
                                                )}
                                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
                                                <div className="absolute bottom-2 left-2 right-2">
                                                    <span className="text-xs font-bold text-white line-clamp-2 leading-tight drop-shadow-md">{p.name}</span>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center px-1">
                                                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-900/50 border border-blue-500/30 text-blue-300 uppercase tracking-widest">{p.config?.gradeLevel}</span>
                                                <p className="text-[9px] text-slate-500 font-bold">{p.userId.substring(0,4)}</p>
                                            </div>
                                        </div>
                                    ))}
                                    {patterns.length === 0 && (
                                        <div className="col-span-full text-center py-10 opacity-50">
                                            <i className="ph-bold ph-cloud-arrow-down text-5xl mb-2 text-slate-500 mx-auto block"></i>
                                            <p className="text-base text-slate-400 font-bold">Brak prezentacji w chmurze...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Odtwarzacz Prezentacji
            if (appMode === 'presentation' && slides.length > 0) {
                const currentSlide = slides[currentSlideIndex];
                const isEven = currentSlideIndex % 2 === 0;

                return (
                    <div className="fixed inset-0 bg-slate-950 z-[999] flex flex-col font-sans">
                        {toastMessage && (
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 z-[1000] bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-2xl transition-all duration-300">
                                {toastMessage}
                            </div>
                        )}
                        
                        {/* Górny Pasek Narzędzi */}
                        <div className="bg-slate-900/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-slate-800">
                            <h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="ph-fill ph-presentation text-blue-500"></i> Odtwarzacz</h2>
                            <div className="flex gap-3">
                                <button onClick={sharePattern} className="bg-fuchsia-600 hover:bg-fuchsia-500 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition-all">
                                    <i className="ph-bold ph-cloud-arrow-up"></i> Do Bazy
                                </button>
                                <button onClick={downloadPPTX} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition-all">
                                    <i className="ph-bold ph-download-simple"></i> Pobierz PPTX
                                </button>
                                <button onClick={() => setAppMode('editor')} className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-sm transition-all">
                                    Wyjdź (ESC)
                                </button>
                            </div>
                        </div>

                        {/* Główny Ekran Slajdu */}
                        <div className="flex-1 relative flex items-center justify-center overflow-hidden bg-slate-900">
                            
                            <button 
                                onClick={() => setCurrentSlideIndex(prev => Math.max(0, prev - 1))}
                                disabled={currentSlideIndex === 0}
                                className="absolute left-6 z-50 bg-white/10 hover:bg-white/20 text-white p-4 rounded-full disabled:opacity-30 transition-all backdrop-blur-sm"
                            >
                                <i className="ph-bold ph-caret-left text-2xl"></i>
                            </button>

                            <button 
                                onClick={() => setCurrentSlideIndex(prev => Math.min(slides.length - 1, prev + 1))}
                                disabled={currentSlideIndex === slides.length - 1}
                                className="absolute right-6 z-50 bg-white/10 hover:bg-white/20 text-white p-4 rounded-full disabled:opacity-30 transition-all backdrop-blur-sm"
                            >
                                <i className="ph-bold ph-caret-right text-2xl"></i>
                            </button>

                            <div className="w-full max-w-[1600px] aspect-video bg-white flex shadow-2xl relative">
                                <div className={`flex-1 p-10 lg:p-20 flex flex-col justify-center ${isEven ? 'order-1' : 'order-2'}`}>
                                    <h1 className="text-4xl lg:text-6xl font-black text-slate-800 mb-8 leading-tight">{currentSlide.title}</h1>
                                    {currentSlide.bullets && (
                                        <ul className="space-y-6">
                                            {currentSlide.bullets.map((b, i) => (
                                                <li key={i} className="text-xl lg:text-2xl text-slate-600 font-medium flex items-start gap-4 leading-relaxed">
                                                    <span className="text-blue-500 mt-2">●</span>
                                                    <span>{b}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                                <div className={`flex-1 relative ${isEven ? 'order-2' : 'order-1'} bg-slate-100`}>
                                    {currentSlide.imageUrl ? (
                                        <img src={currentSlide.imageUrl} className="absolute inset-0 w-full h-full object-cover" />
                                    ) : (
                                        <div className="absolute inset-0 flex items-center justify-center text-slate-300">Brak obrazka</div>
                                    )}
                                </div>
                                
                                <div className="absolute bottom-4 right-6 text-slate-500/50 text-sm font-bold uppercase flex gap-4 bg-white/80 px-4 py-1 rounded-full backdrop-blur-sm">
                                    <span>Slajd {currentSlideIndex + 1}/{slides.length}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: Editor (Kreator)
            return (
                <div className="min-h-screen relative flex flex-col">
                    <div className="hero-glow print-hidden"></div>

                    {toastMessage && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-blue-600 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm animate-toast flex items-center gap-3 border border-blue-400 print-hidden">
                            <i className="ph-bold ph-info text-lg"></i> {toastMessage}
                        </div>
                    )}

                    {/* EKRAN ŁADOWANIA */}
                    {generatingStep > 0 && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center text-white print-hidden">
                            <div className="glass-panel p-10 rounded-3xl flex flex-col items-center space-y-6 w-full max-w-md border border-blue-500/30 shadow-[0_0_50px_rgba(59,130,246,0.2)]">
                                <div className="w-16 h-16 border-4 border-slate-700 border-t-blue-500 rounded-full animate-spin"></div>
                                <div className="text-center w-full">
                                    <h3 className="text-xl font-bold mb-4 text-white">{loadingStatus}</h3>
                                    <div className="w-full bg-slate-800 rounded-full h-4 overflow-hidden border border-slate-700">
                                        <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-full transition-all duration-300" style={{width: `${loadingProgress}%`}}></div>
                                    </div>
                                    <p className="text-xs text-slate-400 font-medium mt-3">{loadingProgress}% ukończono</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed top-0 w-full z-50 glass-nav print-hidden">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center shadow-lg">
                                    <i className="ph-bold ph-presentation text-white text-xl"></i>
                                </div>
                                <span className="text-xl font-extrabold tracking-tight text-white hidden sm:block">Edu<span className="text-blue-400">Prezentacja</span> AI</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://buycoffee.to/magiccolor" target="_blank" className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all active:scale-95 text-sm shadow-md btn-bounce">
                                    <i className="ph-fill ph-coffee text-lg text-amber-400"></i><span className="hidden sm:block">Postaw Kawę</span>
                                </a>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-4 sm:px-6 print:pt-0 print:pb-0">
                        <div className="max-w-4xl mx-auto space-y-6">
                            
                            {/* ODBLOKOWANIE PREMIUM / BAZA WZORÓW */}
                            <div className="flex flex-col gap-4">
                                {!isPremium ? (
                                    <div className="glass-panel p-3 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-blue-500/30 bg-blue-950/20">
                                        <div className="flex flex-col px-2">
                                            <span className="text-[10px] font-bold text-blue-300 uppercase tracking-widest">Darmowe użycia: {Math.max(0, 5 - usageCount)}/5</span>
                                            <span className="text-[9px] text-slate-400 font-bold">Wersja Free</span>
                                        </div>
                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            <input value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod dostępu..." className="flex-1 sm:w-32 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs outline-none text-white focus:border-blue-500 transition-colors uppercase"/>
                                            <button onClick={handleVerifyCode} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition-all shadow-md btn-bounce">OK</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="glass-panel px-5 py-3 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 flex items-center gap-3">
                                        <i className="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
                                        <span className="text-xs font-bold text-emerald-300 uppercase tracking-widest">EduPrezentacja PRO Aktywna</span>
                                    </div>
                                )}

                                <button onClick={() => setAppMode('gielda')} className="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-fuchsia-900/30 hover:border-fuchsia-500/50 transition-all shadow-md btn-bounce flex items-center justify-center gap-2">
                                    <i className="ph-bold ph-files text-lg text-fuchsia-400"></i> Baza Prezentacji (Giełda Wzorów)
                                </button>
                            </div>

                            <div className="text-center mb-8 fade-in print-hidden">
                                <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
                                    Twórz prezentacje w <span className="bg-gradient-to-r from-blue-400 to-indigo-400 -webkit-background-clip-text text-transparent" style={{WebkitBackgroundClip: 'text'}}>kilka sekund.</span>
                                </h1>
                                <p className="text-slate-400 text-sm md:text-base max-w-2xl mx-auto">
                                    Wpisz temat, a AI przygotuje dla Ciebie slajdy wraz z treścią merytoryczną i autorskimi grafikami. Wszystko spakowane w darmowy plik PowerPoint!
                                </p>
                            </div>

                            <div className="glass-panel p-6 sm:p-10 rounded-[2.5rem] fade-in border border-slate-700/50">
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider"><i className="ph-bold ph-text-t"></i> 1. Temat Lekcji</label>
                                        <input 
                                            type="text" 
                                            value={topic}
                                            onChange={(e) => setTopic(e.target.value)}
                                            placeholder="np. Odkrycia geograficzne, Budowa Serca, Historia Polski..."
                                            className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-6 py-5 focus:ring-2 focus:ring-blue-500 outline-none text-base"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider"><i className="ph-bold ph-users"></i> 2. Dla kogo?</label>
                                            <select value={gradeLevel} onChange={e=>setGradeLevel(e.target.value)} className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                                                <option className="bg-slate-900">Przedszkole</option>
                                                <option className="bg-slate-900">Klasy 1-3 SP</option>
                                                <option className="bg-slate-900">Klasy 4-6 SP</option>
                                                <option className="bg-slate-900">Klasy 7-8 SP</option>
                                                <option className="bg-slate-900">Szkoła Średnia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-300 font-bold mb-3 text-sm uppercase tracking-wider"><i className="ph-bold ph-files"></i> 3. Ilość Slajdów</label>
                                            <select value={slideCount} onChange={e=>setSlideCount(e.target.value)} className="w-full bg-slate-900/80 border border-slate-600 text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                                                <option value="3" className="bg-slate-900">3 slajdy (Krótka)</option>
                                                <option value="5" className="bg-slate-900">5 slajdów (Średnia)</option>
                                                <option value="8" className="bg-slate-900">8 slajdów (Długa)</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div className="pt-4">
                                        <button 
                                            onClick={handleGenerate}
                                            disabled={generatingStep !== 0 || !topic}
                                            className={`w-full py-5 rounded-2xl font-black text-white text-lg transition-all flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(59,130,246,0.3)] btn-bounce uppercase tracking-widest
                                                ${generatingStep !== 0 ? 'bg-slate-700 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-500 hover:scale-[1.02]'}`}
                                        >
                                            <i className="ph-bold ph-magic-wand text-xl"></i> Stwórz Prezentację {!isPremium && `(${Math.max(0, 5 - usageCount)})`}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {slides.length > 0 && appMode === 'editor' && (
                                <div className="mt-8 text-center fade-in">
                                    <button onClick={() => setAppMode('presentation')} className="bg-slate-800 hover:bg-slate-700 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-md btn-bounce inline-flex items-center gap-2 border border-slate-700">
                                        <i className="ph-bold ph-play text-xl"></i> Wróć do odtwarzacza slajdów
                                    </button>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
