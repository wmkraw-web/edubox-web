        <!-- MODUŁ EDUBOX CORE (Wspólny silnik dla wszystkich apek) -->
    <script type="module">
        import { EduBoxCore } from './global-core.js';
        window.EduBoxCore = EduBoxCore;
        window.dispatchEvent(new Event('EduBoxCoreReady'));
    </script>

<script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // === SYSTEM & LIMITS STATE ===
            const [user, setUser] = useState(null);
            const [appMode, setAppMode] = useState('generator'); // 'generator' | 'gielda'
            const [isPremium, setIsPremium] = useState(false);
            const [usages, setUsages] = useState(0);
            const [accessCode, setAccessCode] = useState('');
            const [toast, setToast] = useState({ message: '', visible: false, type: 'info' });

            // === PRESENTATION CONFIG ===
            const [step, setStep] = useState('config'); // config -> generating_text -> review -> generating_images -> final
            const [topic, setTopic] = useState('');
            const [audience, setAudience] = useState('Klasy 4-8');
            const [slideCount, setSlideCount] = useState(6);
            const [theme, setTheme] = useState('modern');
            const [includeQuiz, setIncludeQuiz] = useState(true);
            const [contentStyle, setContentStyle] = useState('bullets'); // bullets | descriptive
            
            // === GENERATED CONTENT ===
            const [slides, setSlides] = useState([]);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [isRegeneratingImage, setIsRegeneratingImage] = useState(null);
            
            // === GIEŁDA (MARKETPLACE) ===
            const [gieldaItems, setGieldaItems] = useState([]);
            const [isSavingToGielda, setIsSavingToGielda] = useState(false);

            const presentationRef = useRef(null);
            const fileInputRef = useRef(null);
            const [activeUploadIndex, setActiveUploadIndex] = useState(null);

            // === INITIALIZATION ===
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.EduBoxCore) {
                        clearInterval(checkInterval);
                        window.EduBoxCore.init((u) => {
                            setUser(u);
                            setUsages(window.EduBoxCore.getUsageCount());
                            if (localStorage.getItem('eduboxProStatus') === 'PRO' || localStorage.getItem('eduboxProStatus') === 'active') setIsPremium(true);
                        });
                        
                        // Podpięcie do Giełdy
                        const unsubscribe = window.EduBoxCore.subscribeToGielda(
                            'presentations',
                            (data) => setGieldaItems(data),
                            (err) => console.error("Gielda error:", err)
                        );
                        return () => unsubscribe();
                    }
                }, 100);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ message: msg, visible: true, type });
                setTimeout(() => setToast(t => ({ ...t, visible: false })), 4000);
            };

            const handleVerifyCode = async () => {
                if (await window.EduBoxCore.verifyPremiumCode(accessCode)) {
                    localStorage.setItem('eduboxProStatus', 'PRO');
                    setIsPremium(true);
                    setAccessCode('');
                    showToast('Odblokowano wersję PRO MAX! 🚀', 'success');
                } else {
                    showToast('Nieprawidłowy kod weryfikacyjny.', 'error');
                }
            };

            // === API FUNCTIONS (Twój własny backend: GPT-4o-mini + SD/Fal) ===
            
            const fetchEduBoxText = async (userPrompt, systemPrompt) => {
                const res = await fetch('/api/chat', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt, system: systemPrompt, format: "json", temperature: 0.7, model: "gpt-4o-mini" })
                });
                
                if (!res.ok) throw new Error(`API Error: ${res.status}`);
                const data = await res.json();
                
                let jsonStr = data.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                const startIdx = jsonStr.indexOf('{');
                const endIdx = jsonStr.lastIndexOf('}');
                if (startIdx !== -1 && endIdx !== -1) {
                    jsonStr = jsonStr.substring(startIdx, endIdx + 1);
                }
                return JSON.parse(jsonStr);
            };

            const fetchEduBoxImage = async (basePrompt, selectedTheme) => {
                // Twardy Prompt Wrapper - Poprawia jakość grafiki i wymusza brak tekstu
                let styleMod = '';
                if (selectedTheme === 'chalkboard') styleMod = "chalkboard drawing style, chalk art, flat design, educational";
                else if (selectedTheme === 'space') styleMod = "dark space background, neon accents, sci-fi vector art, educational";
                else styleMod = "modern vector illustration, flat design, bright vibrant colors, high quality educational material";

                const strictPrompt = `A beautiful, premium quality illustration of: ${basePrompt}. STYLE: ${styleMod}. CRITICAL RULES: ABSOLUTELY NO TEXT, NO LETTERS, NO WORDS, NO NUMBERS, NO WATERMARKS. Clean composition, highly detailed, visually appealing.`;

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: strictPrompt,
                        aspect_ratio: '16:9',
                        width: 1024,
                        height: 576
                    })
                });
                
                if (!response.ok) throw new Error(`Image API Error: ${response.status}`);
                const data = await response.json();
                
                let imgUrl = data.imageUrl || data.image_url || data.url || (data.data && data.data[0]?.url) || data.image;
                if (imgUrl && imgUrl.length > 1000 && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                    imgUrl = `data:image/png;base64,${imgUrl}`;
                }
                return imgUrl;
            };

            // === CORE LOGIC ===

            const generateTextOutline = () => {
                if (!topic.trim()) { showToast('Wpisz temat prezentacji!', 'error'); return; }
                
                window.EduBoxCore.executeWithLimitCheck(isPremium, 
                    async (newCount) => {
                        setUsages(newCount);
                        setStep('generating_text');
                        
                        const systemPrompt = `Jesteś ekspertem edukacyjnym. Tworzysz konspekty prezentacji szkolnych. 
                        Zwracasz WYŁĄCZNIE poprawny JSON. Schemat:
                        {
                            "slides": [
                                {
                                    "title": "Tytuł slajdu (max 5 słów)",
                                    "bullets": ["Treść 1", "Treść 2"],
                                    "imagePrompt": "Bardzo krótki, jednozdaniowy opis głównego obiektu/tematu na obrazku (w języku angielskim). NIE DODAJ instrukcji o braku tekstu, ja to zrobię.",
                                    "notes": "Notatki dla nauczyciela (co powiedzieć)."
                                }
                            ]
                        }
                        Zasady:
                        1. Wygeneruj dokładnie zadaną liczbę slajdów.
                        2. Jeśli contentStyle to 'bullets', pole "bullets" ma zawierać 3-5 równoważników zdań.
                        3. Jeśli contentStyle to 'descriptive', pole "bullets" ma zawierać 2 krótkie, pełne akapity narracji.
                        4. Zawsze pierwszy slajd to tytuł.
                        5. Jeśli zażądano quizu, ostatni slajd to pytanie, a odpowiedzi są w 'bullets' (A, B, C, Poprawna: ...).`;

                        const userPrompt = `Temat: ${topic}. Grupa: ${audience}. Liczba slajdów: ${slideCount}. Styl: ${contentStyle}. Quiz: ${includeQuiz ? 'Tak' : 'Nie'}. Język: Polski.`;
                        
                        try {
                            const result = await fetchEduBoxText(userPrompt, systemPrompt);
                            const newSlides = result.slides.map((s, i) => ({ ...s, id: i, imageUrl: null }));
                            setSlides(newSlides);
                            setStep('review');
                        } catch (err) {
                            console.error(err);
                            showToast('Błąd generowania tekstu. Spróbuj ponownie.', 'error');
                            setStep('config');
                        }
                    },
                    (errMsg) => showToast(errMsg, 'error'),
                    (msg) => showToast(msg, 'info')
                );
            };

            const generateImages = async () => {
                setStep('generating_images');
                let updatedSlides = [...slides];

                for (let i = 0; i < updatedSlides.length; i++) {
                    setLoadingProgress(Math.round(((i) / updatedSlides.length) * 100));
                    if (updatedSlides[i].imageUrl) continue; 

                    const proStatus = localStorage.getItem('eduboxProStatus');
                    const isPro = proStatus === 'PRO' || proStatus === 'active' || isPremium;
                    if (!isPro && window.EduBoxCore.getImageUsageCount() >= 2) {
                        showToast('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Pozostałe slajdy zostaną bez grafiki - wpisz kod odblokowujący, by kontynuować.', 'error');
                        break;
                    }

                    try {
                        const imgUrl = await fetchEduBoxImage(updatedSlides[i].imagePrompt, theme);
                        updatedSlides[i].imageUrl = imgUrl;
                        setSlides([...updatedSlides]);
                        if (!isPro) {
                            const today = new Date().toISOString().split('T')[0];
                            const newImgCount = window.EduBoxCore.getImageUsageCount() + 1;
                            localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                        }
                    } catch (err) { 
                        console.error(`Błąd przy obrazku ${i}:`, err);
                    }
                }
                
                setLoadingProgress(100);
                setTimeout(() => setStep('review'), 800); // Wracamy do ekranu edycji, aby obejrzeć grafiki
            };

            const regenerateSingleImage = async (index) => {
                const proStatus = localStorage.getItem('eduboxProStatus');
                const isPro = proStatus === 'PRO' || proStatus === 'active' || isPremium;
                if (!isPro && window.EduBoxCore.getImageUsageCount() >= 2) {
                    showToast('⚠️ Dzienny limit darmowych obrazków (2/2) wyczerpany. Wpisz kod odblokowujący!', 'error');
                    return;
                }
                setIsRegeneratingImage(index);
                try {
                    const imgUrl = await fetchEduBoxImage(slides[index].imagePrompt, theme);
                    const newSlides = [...slides];
                    newSlides[index].imageUrl = imgUrl;
                    setSlides(newSlides);
                    if (!isPro) {
                        const today = new Date().toISOString().split('T')[0];
                        const newImgCount = window.EduBoxCore.getImageUsageCount() + 1;
                        localStorage.setItem('eduboxImageUsage', JSON.stringify({ date: today, count: newImgCount }));
                    }
                    showToast("🎨 Grafika pomyślnie zmieniona!", "success");
                } catch (err) {
                    console.error(err);
                    showToast("Wystąpił błąd przy odświeżaniu obrazu.", "error");
                } finally {
                    setIsRegeneratingImage(null);
                }
            };

            // === HELPERS & EXPORTS ===

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file || activeUploadIndex === null) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const newSlides = [...slides];
                    newSlides[activeUploadIndex].imageUrl = event.target.result;
                    setSlides(newSlides);
                };
                reader.readAsDataURL(file);
                e.target.value = null;
            };

            const exportToPPTX = () => {
                showToast("Przygotowuję plik PowerPoint...", "info");
                let pres = new PptxGenJS();
                pres.layout = 'LAYOUT_16x9';

                let bgHex = 'FFFFFF'; let colorHex = '000000';
                if (theme === 'chalkboard') { bgHex = '1a472a'; colorHex = 'FFFFFF'; }
                if (theme === 'space') { bgHex = '020617'; colorHex = 'FFFFFF'; }
                if (theme === 'modern') { bgHex = 'F8FAFC'; colorHex = '0F172A'; }

                slides.forEach((slide, idx) => {
                    let slideObj = pres.addSlide();
                    slideObj.background = { fill: bgHex };
                    slideObj.addNotes(slide.notes || "Brak notatek.");

                    slideObj.addText(slide.title, { 
                        x: 0.5, y: 0.5, w: "90%", h: 1.0, 
                        fontSize: 36, color: colorHex, bold: true,
                        border: { type: 'bottom', color: '3b82f6', pt: 2 }
                    });

                    let isEven = idx % 2 === 0;
                    let bulletText = slide.bullets.map(b => ({ 
                        text: b, 
                        options: { 
                            bullet: contentStyle === 'bullets', 
                            color: colorHex, 
                            fontSize: contentStyle === 'bullets' ? 24 : 18, 
                            breakLine: true,
                            paraSpaceAfter: contentStyle === 'descriptive' ? 10 : 0
                        } 
                    }));

                    slideObj.addText(bulletText, {
                        x: isEven ? 0.5 : 5.5, y: 1.8, w: "45%", h: 4.5, align: 'left', valign: 'top'
                    });

                    if (slide.imageUrl) {
                        try { slideObj.addImage({ data: slide.imageUrl, x: isEven ? 5.5 : 0.5, y: 1.8, w: "40%", h: "60%", sizing: { type: 'contain' } }); } 
                        catch(e) { console.error(e); }
                    }
                });
                pres.writeFile({ fileName: `EduPrezentacja_${topic.replace(/\s+/g, '_')}.pptx` });
            };

            const publishToGielda = async () => {
                setIsSavingToGielda(true);
                try {
                    // Minimalizacja danych - usuwamy obrazki base64 by zmieścić się w limicie Firestore.
                    // Na giełdzie użytkownicy będą musieli wygenerować je ponownie lub podepniemy URL z innej bazy.
                    // Zgodnie ze standardem robimy "oczyszczoną" kopię configu.
                    const cleanSlides = slides.map(s => ({...s, imageUrl: null})); 
                    
                    const configToSave = { topic, audience, theme, contentStyle, slides: cleanSlides };
                    await window.EduBoxCore.saveToGielda('presentations', 'EduPrezentacja', topic, configToSave);
                    showToast("Opublikowano na Giełdzie Wzorów! 🎉", "success");
                } catch(e) {
                    showToast(e.message, "error");
                } finally {
                    setIsSavingToGielda(false);
                }
            };

            const loadFromGielda = (item) => {
                setTopic(item.config.topic);
                setAudience(item.config.audience);
                setTheme(item.config.theme || 'modern');
                setContentStyle(item.config.contentStyle || 'bullets');
                setSlides(item.config.slides);
                setAppMode('generator');
                setStep('review'); // Przejdź od razu do recenzji (obrazki usunięto przed zapisem)
                showToast("Wczytano projekt. Wygeneruj grafiki na nowo!", "info");
            };

            // === KEYBOARD & FULLSCREEN ===
            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    presentationRef.current?.requestFullscreen().catch(err => showToast("Błąd pełnego ekranu.", "error"));
                    setIsFullscreen(true);
                } else {
                    document.exitFullscreen();
                    setIsFullscreen(false);
                }
            };

            useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                const handleKeyDown = (e) => {
                    if (step !== 'final' || appMode !== 'generator') return;
                    if (e.key === 'ArrowRight' || e.key === 'Space') {
                        if (e.key === 'Space') e.preventDefault(); 
                        setCurrentSlideIndex(prev => Math.min(prev + 1, slides.length - 1));
                    } else if (e.key === 'ArrowLeft') {
                        setCurrentSlideIndex(prev => Math.max(prev - 1, 0));
                    }
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                window.addEventListener('keydown', handleKeyDown);
                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [step, slides.length, appMode]);

            // === THEME HELPER ===
            const getThemeClasses = (t) => {
                switch(t) {
                    case 'chalkboard': return { bg: 'bg-[#1a472a]', text: 'text-slate-50', title: 'text-yellow-400 border-b-2 border-dashed border-white font-[Comic_Sans_MS]' };
                    case 'space': return { bg: 'bg-slate-950 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-950 to-slate-950', text: 'text-slate-50', title: 'text-purple-400 border-b border-purple-500/30' };
                    case 'modern': default: return { bg: 'bg-gradient-to-br from-slate-50 to-slate-200', text: 'text-slate-900', title: 'text-blue-800 border-b-4 border-blue-500' };
                }
            };

            // === RENDERERS ===

            const renderSidebar = () => (
                <div className="w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-40 print-hidden hidden md:flex">
                    <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i className="ph-bold ph-presentation-chart text-white text-xl"></i>
                        </div>
                        <span className="text-xl font-extrabold tracking-tight text-white">Edu<span className="text-blue-400">Prezentacja</span></span>
                    </div>

                    <div className="p-4 flex-1 flex flex-col gap-2 overflow-y-auto custom-scrollbar">
                        <button onClick={() => setAppMode('generator')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${appMode === 'generator' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                            <i className="ph-bold ph-magic-wand text-lg"></i> Generator
                        </button>

                                    <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-2">
                                        {slides.map((s, idx) => (
                                            <div key={idx} onClick={() => setCurrentSlideIndex(idx)} className={`p-3 rounded-lg cursor-pointer text-xs font-bold border transition-colors line-clamp-1 ${currentSlideIndex === idx ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-950 border-slate-800 text-slate-500 hover:border-slate-600'}`}>
                                                {idx + 1}. {s.title}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Główny podgląd */}
                                <div className="flex-1 p-4 lg:p-8 flex flex-col items-center justify-center bg-black/40 relative print-only:p-0 print-only:block">
                                    
                                    {/* Print Mode renders all slides sequentially */}
                                    <div className="hidden print-only:block">
                                        {slides.map((s, i) => {
                                            const tc = getThemeClasses(theme);
                                            const isEvenPrint = i % 2 === 0;
                                            return (
                                                <div key={i} className={`slide-print-page ${tc.bg} ${tc.text}`}>
                                                    <div className={`w-full max-w-[1280px] aspect-video relative flex`}>
                                                        <div className={`flex-1 p-16 flex flex-col justify-center z-10 relative ${isEvenPrint ? 'order-1' : 'order-2'}`}>
                                                            <h2 className={`text-4xl font-black mb-8 pb-4 ${tc.title}`}>{s.title}</h2>
                                                            {contentStyle === 'descriptive' ? (
                                                                <div className="space-y-6">{s.bullets.map((b, bi) => <p key={bi} className="text-xl leading-relaxed opacity-90">{b}</p>)}</div>
                                                            ) : (
                                                                <ul className="space-y-4">{s.bullets.map((b, bi) => <li key={bi} className="text-2xl flex gap-4"><span className="text-blue-500">●</span><span>{b}</span></li>)}</ul>
                                                            )}
                                                        </div>
                                                        <div className={`flex-1 relative ${isEvenPrint ? 'order-2' : 'order-1'}`}>
                                                            {s.imageUrl && <img src={s.imageUrl} className="absolute inset-0 w-full h-full object-cover" />}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Interactive Viewer */}
                                    {(() => {
                                        const s = slides[currentSlideIndex];
                                        const tc = getThemeClasses(theme);
                                        const isEven = currentSlideIndex % 2 === 0;
                                        return (
                                            <div className={`w-full max-w-[1280px] aspect-video relative rounded-2xl overflow-hidden shadow-2xl flex transition-all print-hidden ${tc.bg} ${tc.text}`}>
                                                <div className={`flex-1 p-10 lg:p-16 flex flex-col justify-center z-10 relative ${isEven ? 'order-1' : 'order-2'}`}>
                                                    <h2 className={`text-3xl lg:text-5xl font-black mb-8 pb-4 ${tc.title}`}>{s.title}</h2>
                                                    {contentStyle === 'descriptive' ? (
                                                        <div className="space-y-6">{s.bullets.map((b, i) => <p key={i} className="text-lg lg:text-xl leading-relaxed text-justify opacity-90">{b}</p>)}</div>
                                                    ) : (
                                                        <ul className="space-y-4 lg:space-y-6">{s.bullets.map((b, i) => <li key={i} className="text-xl lg:text-2xl flex items-start gap-4"><span className="text-blue-500 mt-1">●</span><span>{b}</span></li>)}</ul>
                                                    )}
                                                </div>
                                                <div className={`flex-1 relative ${isEven ? 'order-2' : 'order-1'}`}>
                                                    {s.imageUrl ? (
                                                        <img src={s.imageUrl} className="absolute inset-0 w-full h-full object-cover" />
                                                    ) : (
                                                        <div className="absolute inset-0 bg-slate-800 flex items-center justify-center"><i className="ph-thin ph-image text-6xl text-slate-600"></i></div>
                                                    )}
                                                    <div className={`absolute inset-y-0 w-32 ${isEven ? 'left-0 bg-gradient-to-r' : 'right-0 bg-gradient-to-l'} from-[inherit] to-transparent opacity-80`}></div>
                                                </div>
                                            </div>
                                        );
                                    })()}

                                    {/* Controls */}
                                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-700 rounded-full flex items-center p-2 shadow-[0_0_40px_rgba(0,0,0,0.5)] gap-4 z-30 print-hidden">
                                        <button onClick={() => setCurrentSlideIndex(p => Math.max(p - 1, 0))} disabled={currentSlideIndex === 0} className="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-blue-600 disabled:opacity-30 transition-colors"><i className="ph-bold ph-caret-left text-xl"></i></button>
                                        <div className="flex gap-1.5 px-4">
                                            {slides.map((_, idx) => (
                                                <div key={idx} className={`w-2 h-2 rounded-full transition-all ${idx === currentSlideIndex ? 'bg-blue-500 w-6' : 'bg-slate-600'}`}></div>
                                            ))}
                                        </div>
                                        <button onClick={() => setCurrentSlideIndex(p => Math.min(p + 1, slides.length - 1))} disabled={currentSlideIndex === slides.length - 1} className="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-blue-600 disabled:opacity-30 transition-colors"><i className="ph-bold ph-caret-right text-xl"></i></button>
                                    </div>
                                </div>
                            </div>

                            {/* NATIVE FULLSCREEN OVERLAY */}
                            <div ref={presentationRef} className={isFullscreen ? 'presentation-mode' : 'hidden'}>
                                {isFullscreen && (() => {
                                    const s = slides[currentSlideIndex];
                                    const tc = getThemeClasses(theme);
                                    const isEven = currentSlideIndex % 2 === 0;
                                    return (
                                        <div className={`slide-container flex ${tc.bg} ${tc.text}`}>
                                            <div className={`flex-1 p-16 xl:p-24 flex flex-col justify-center z-10 relative ${isEven ? 'order-1' : 'order-2'}`}>
                                                <h2 className={`text-6xl xl:text-7xl font-black mb-12 pb-6 leading-tight ${tc.title}`}>{s.title}</h2>
                                                {contentStyle === 'descriptive' ? (
                                                    <div className="space-y-8 xl:space-y-10">{s.bullets.map((b, i) => <p key={i} className="text-2xl xl:text-3xl leading-relaxed text-justify opacity-90">{b}</p>)}</div>
                                                ) : (
                                                    <ul className="space-y-8 xl:space-y-10">{s.bullets.map((b, i) => <li key={i} className="text-3xl xl:text-4xl flex items-start gap-6 leading-relaxed"><span className="text-blue-500 mt-2">●</span><span>{b}</span></li>)}</ul>
                                                )}
                                            </div>
                                            <div className={`flex-1 relative ${isEven ? 'order-2' : 'order-1'}`}>
                                                {s.imageUrl && <img src={s.imageUrl} className="absolute inset-0 w-full h-full object-cover" />}
                                                <div className={`absolute inset-y-0 w-48 ${isEven ? 'left-0 bg-gradient-to-r' : 'right-0 bg-gradient-to-l'} from-[inherit] to-transparent opacity-90`}></div>
                                            </div>
                                            <div className="absolute bottom-6 right-8 text-slate-500/50 text-sm font-bold uppercase flex gap-6 z-50">
                                                <span>Użyj strzałek <i className="ph-bold ph-arrows-left-right"></i></span>
                                                <span>ESC wyjście</span>
                                            </div>
                                        </div>
                                    )
                                })()}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body></html>
